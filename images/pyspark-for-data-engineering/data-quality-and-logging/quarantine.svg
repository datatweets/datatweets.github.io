<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 796" width="960" height="796" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="960" height="796" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">Quarantine, not deletion &#8212; split the batch and keep the reconciliation identity</text>
  <text x="480" y="54" text-anchor="middle" font-size="14" fill="#718096">CityFlow quarterly ingest &#183; Jan&#8211;Mar 2024 yellow taxi &#183; 9,554,778 input rows &#183; every number measured in Spark 4.2.0</text>

  <!-- ============ PANEL 1 ============ -->
  <line x1="60" y1="72" x2="900" y2="72" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="94" font-size="14" font-weight="700" fill="#c53030">1 &#183; The silent drop &#8212; what a plain filter costs you</text>

  <rect x="60" y="106" width="400" height="94" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.4"/>
  <text x="72" y="126" font-size="11" font-weight="700" fill="#c53030">raw.filter(in_window)</text>
  <text x="72" y="146" font-size="10.5" fill="#c53030">9,554,778 &#8594; 9,554,757&#160;&#160;(21 rows gone)</text>
  <text x="72" y="164" font-size="10" fill="#718096">Which 21? Why? Can they be fixed and re-ingested?</text>
  <text x="72" y="181" font-size="10" fill="#718096">The rows were never materialised &#8212; the evidence is gone.</text>
  <text x="72" y="196" font-size="10" fill="#c53030">A reviewer can only be told &#8220;trust me&#8221;.</text>

  <text x="472" y="158" font-size="18" fill="#276749">&#8594;</text>

  <rect x="500" y="106" width="400" height="94" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
  <text x="512" y="126" font-size="11" font-weight="700" fill="#276749">label_quality(raw) &#8594; split_batch(&#8230;)</text>
  <text x="512" y="146" font-size="10.5" fill="#276749">9,554,778 &#8594; 9,554,757 good&#160;+&#160;21 quarantined</text>
  <text x="512" y="164" font-size="10" fill="#718096">Every rejected row survives, tagged with the rule it broke,</text>
  <text x="512" y="181" font-size="10" fill="#718096">the run id that rejected it, and when.</text>
  <text x="512" y="196" font-size="10" fill="#276749">A reviewer can query it.</text>

  <!-- ============ PANEL 2 ============ -->
  <line x1="60" y1="218" x2="900" y2="218" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="240" font-size="14" font-weight="700" fill="#2b6cb0">2 &#183; The split &#8212; one when-chain gives each row at most one reason, then both sides are written</text>
  <text x="60" y="258" font-size="12" fill="#718096">the stricter three-rule policy, measured on the real quarter; the reversals are NOT a reason &#8212; all 115,884 negative totals stay in GOOD</text>

  <!-- input box -->
  <rect x="60" y="272" width="150" height="180" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="135" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">INPUT</text>
  <text x="135" y="320" text-anchor="middle" font-size="16" font-weight="700" fill="#2b6cb0">9,554,778</text>
  <text x="135" y="338" text-anchor="middle" font-size="10" fill="#718096">rows read</text>
  <text x="135" y="366" text-anchor="middle" font-size="10" fill="#4a5568">3 Parquet months</text>
  <text x="135" y="382" text-anchor="middle" font-size="10" fill="#4a5568">Jan 2,964,624</text>
  <text x="135" y="397" text-anchor="middle" font-size="10" fill="#4a5568">Feb 3,007,526</text>
  <text x="135" y="412" text-anchor="middle" font-size="10" fill="#4a5568">Mar 3,582,628</text>
  <text x="135" y="438" text-anchor="middle" font-size="10" fill="#718096">counted, not assumed</text>

  <text x="222" y="368" font-size="18" fill="#2b6cb0">&#8594;</text>

  <!-- good box -->
  <rect x="252" y="272" width="270" height="180" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.6"/>
  <text x="268" y="294" font-size="11" font-weight="700" fill="#276749">GOOD&#160;&#160;&#8212;&#160;c2m7l2_trips_good.parquet</text>
  <text x="268" y="322" font-size="18" font-weight="700" fill="#276749">9,551,798</text>
  <text x="268" y="342" font-size="10.5" fill="#276749">revenue $256,593,989.29</text>
  <rect x="268" y="356" width="238" height="58" rx="6" fill="#c6f6d5" stroke="#276749" stroke-width="1"/>
  <text x="280" y="373" font-size="10" font-weight="700" fill="#276749">115,884 negative-total REVERSALS kept</text>
  <text x="280" y="390" font-size="9.5" fill="#276749">valid rows, not violations &#8212; dropping them</text>
  <text x="280" y="405" font-size="9.5" fill="#276749">would invent $2,986,808.76 of phantom revenue</text>
  <text x="268" y="436" font-size="10" fill="#718096">quarantine is for rule violations, not odd-looking rows</text>

  <!-- quarantine box -->
  <rect x="552" y="272" width="348" height="180" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="1.6"/>
  <text x="568" y="294" font-size="11" font-weight="700" fill="#c05621">QUARANTINE&#160;&#8212;&#160;partitionBy(&#8220;quarantine_reason&#8221;)</text>
  <text x="568" y="312" font-size="9.5" fill="#718096">+ run_id + quarantined_at, so the table is queryable</text>

  <text x="568" y="336" font-size="10" font-weight="700" fill="#4a5568">reason</text>
  <text x="790" y="336" text-anchor="end" font-size="10" font-weight="700" fill="#4a5568">rows</text>
  <text x="886" y="336" text-anchor="end" font-size="10" font-weight="700" fill="#4a5568">withheld</text>

  <rect x="568" y="344" width="318" height="24" rx="5" fill="#feebc8" stroke="#c05621" stroke-width="1"/>
  <text x="578" y="360" font-size="10" fill="#c05621">impossible_duration&#160;&#160;dropoff &#8804; pickup</text>
  <text x="790" y="360" text-anchor="end" font-size="11" font-weight="700" fill="#c05621">2,801</text>
  <text x="886" y="360" text-anchor="end" font-size="10" fill="#c05621">$93,185.92</text>

  <rect x="568" y="372" width="318" height="24" rx="5" fill="#feebc8" stroke="#c05621" stroke-width="1"/>
  <text x="578" y="388" font-size="10" fill="#c05621">suspect_distance&#160;&#160;up to 312,722.3 miles</text>
  <text x="790" y="388" text-anchor="end" font-size="11" font-weight="700" fill="#c05621">158</text>
  <text x="886" y="388" text-anchor="end" font-size="10" fill="#c05621">$5,197.93</text>

  <rect x="568" y="400" width="318" height="24" rx="5" fill="#fed7d7" stroke="#c53030" stroke-width="1"/>
  <text x="578" y="416" font-size="10" fill="#c53030">out_of_window&#160;&#160;incl. 2002-12-31 22:17:10</text>
  <text x="790" y="416" text-anchor="end" font-size="11" font-weight="700" fill="#c53030">21</text>
  <text x="886" y="416" text-anchor="end" font-size="10" fill="#c53030">$540.39</text>

  <text x="568" y="440" font-size="10.5" font-weight="700" fill="#c05621">total 2,980 rows &#183; $98,383.85 held back for review</text>

  <!-- ============ PANEL 3 ============ -->
  <line x1="60" y1="470" x2="900" y2="470" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="492" font-size="14" font-weight="700" fill="#276749">3 &#183; The reconciliation identity &#8212; one line a reviewer can check, impossible after a silent filter</text>

  <rect x="60" y="504" width="840" height="58" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.6"/>
  <text x="480" y="530" text-anchor="middle" font-size="15" font-weight="700" fill="#276749">good&#160;&#160;+&#160;&#160;quarantined&#160;&#160;==&#160;&#160;input</text>
  <text x="480" y="552" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">9,554,757&#160;+&#160;21&#160;=&#160;9,554,778&#160;&#160;&#160;&#183;&#160;&#160;&#160;9,551,798&#160;+&#160;2,980&#160;=&#160;9,554,778&#160;&#160;&#160;&#183;&#160;&#160;&#160;read back from disk: 9,554,778</text>

  <text x="60" y="586" font-size="12" fill="#4a5568">Holds under every policy: change the rules and both sides move together, but the sum never does. A run that cannot produce this line has</text>
  <text x="60" y="604" font-size="12" fill="#4a5568">lost rows it cannot name.</text>

  <!-- ============ PANEL 4: lifecycle ============ -->
  <line x1="60" y1="622" x2="900" y2="622" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="644" font-size="14" font-weight="700" fill="#1a202c">4 &#183; The lifecycle &#8212; quarantine is reviewed, not archived and forgotten</text>

  <rect x="60" y="656" width="255" height="62" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="1.3"/>
  <text x="72" y="675" font-size="10.5" font-weight="700" fill="#c05621">REVIEW</text>
  <text x="72" y="692" font-size="10" fill="#4a5568">group by reason, read the worst rows,</text>
  <text x="72" y="708" font-size="10" fill="#4a5568">ask upstream what the feed is doing</text>

  <text x="326" y="692" font-size="16" fill="#276749">&#8594;</text>

  <rect x="352" y="656" width="255" height="62" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.3"/>
  <text x="364" y="675" font-size="10.5" font-weight="700" fill="#2b6cb0">RE-INGEST after a fix</text>
  <text x="364" y="692" font-size="10" fill="#4a5568">158 suspect_distance rows repaired</text>
  <text x="364" y="708" font-size="10" fill="#4a5568">&#8594; good 9,551,956, $5,197.93 recovered</text>

  <text x="618" y="692" font-size="16" fill="#276749">&#8594;</text>

  <rect x="645" y="656" width="255" height="62" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.3"/>
  <text x="657" y="675" font-size="10.5" font-weight="700" fill="#276749">or ACCEPT the rejection</text>
  <text x="657" y="692" font-size="10" fill="#4a5568">2,822 rows stay out &#8212; and the identity</text>
  <text x="657" y="708" font-size="10" fill="#4a5568">still holds: 9,551,956 + 2,822 = 9,554,778</text>

  <rect x="60" y="734" width="840" height="46" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.4"/>
  <text x="480" y="755" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Never silently drop: split, tag with a reason, write BOTH sides, and reconcile every run.</text>
  <text x="480" y="773" text-anchor="middle" font-size="11" fill="#2b6cb0">Bad rows are data about your pipeline &#8212; the only rows that tell you the upstream feed is drifting before the dashboard does.</text>
</svg>
