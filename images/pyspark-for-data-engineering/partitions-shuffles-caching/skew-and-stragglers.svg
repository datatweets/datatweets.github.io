<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 726" width="960" height="726" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<rect x="0" y="0" width="960" height="726" fill="#ffffff"/>
<text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">Skew &#38; stragglers: one hot partition holds up the whole stage</text>
<text x="480" y="58" text-anchor="middle" font-size="14" fill="#718096">CityFlow quarter &#183; 9,554,757 trips hash-partitioned by <tspan font-style="italic">PULocationID</tspan> &#183; pyspark 4.2.0, local[*], 10 partitions = 10 tasks</text>

<!-- ============ PANEL A: DIAGNOSE ============ -->
<text x="255" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#c53030">DIAGNOSE &#8212; rows per partition</text>
<text x="255" y="112" text-anchor="middle" font-size="12" fill="#718096">df.repartition(10, F.col(&#8220;PULocationID&#8221;))</text>

<!-- panel A bars -->
<!-- pid 3 straggler -->
<rect x="78" y="132" width="200.0" height="16" rx="3" fill="#fc8181" stroke="#c53030" stroke-width="1"/>
<text x="72" y="144" text-anchor="end" font-size="10" fill="#4a5568">pid 3</text>
<text x="284" y="145" font-size="10" font-weight="700" fill="#c53030">2,278,324</text>
<rect x="78" y="159" width="123.2" height="16" rx="3" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1"/>
<text x="72" y="171" text-anchor="end" font-size="10" fill="#4a5568">pid 8</text>
<text x="207" y="172" font-size="10" fill="#4a5568">1,404,036</text>
<rect x="78" y="186" width="96.2" height="16" rx="3" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1"/>
<text x="72" y="198" text-anchor="end" font-size="10" fill="#4a5568">pid 4</text>
<text x="180" y="199" font-size="10" fill="#4a5568">1,095,819</text>
<rect x="78" y="213" width="95.4" height="16" rx="3" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1"/>
<text x="72" y="225" text-anchor="end" font-size="10" fill="#4a5568">pid 1</text>
<text x="179" y="226" font-size="10" fill="#4a5568">1,086,779</text>
<rect x="78" y="240" width="87.4" height="16" rx="3" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1"/>
<text x="72" y="252" text-anchor="end" font-size="10" fill="#4a5568">pid 7</text>
<text x="171" y="253" font-size="10" fill="#4a5568">996,312</text>
<rect x="78" y="267" width="66.5" height="16" rx="3" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1"/>
<text x="72" y="279" text-anchor="end" font-size="10" fill="#4a5568">pid 9</text>
<text x="150" y="280" font-size="10" fill="#4a5568">758,082</text>
<rect x="78" y="294" width="55.8" height="16" rx="3" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1"/>
<text x="72" y="306" text-anchor="end" font-size="10" fill="#4a5568">pid 5</text>
<text x="139" y="307" font-size="10" fill="#4a5568">636,269</text>
<rect x="78" y="321" width="50.1" height="16" rx="3" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1"/>
<text x="72" y="333" text-anchor="end" font-size="10" fill="#4a5568">pid 6</text>
<text x="133" y="334" font-size="10" fill="#4a5568">570,697</text>
<rect x="78" y="348" width="49.0" height="16" rx="3" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1"/>
<text x="72" y="360" text-anchor="end" font-size="10" fill="#4a5568">pid 0</text>
<text x="132" y="361" font-size="10" fill="#4a5568">557,798</text>
<rect x="78" y="375" width="15.0" height="16" rx="3" fill="#e2e8f0" stroke="#a0aec0" stroke-width="1"/>
<text x="72" y="387" text-anchor="end" font-size="10" fill="#4a5568">pid 2</text>
<text x="98" y="388" font-size="10" font-weight="700" fill="#276749">170,641 &#8212; idle first</text>

<rect x="40" y="405" width="430" height="66" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
<text x="56" y="426" font-size="11.5" font-weight="700" fill="#c53030">pid 3 = one task, 2,278,324 rows = 13.4&#215; the smallest.</text>
<text x="56" y="445" font-size="11" fill="#4a5568">The stage ends only when THIS task ends; the other 9 cores</text>
<text x="56" y="461" font-size="11" fill="#4a5568">finish early and wait. That is the straggler &#8212; Amdahl&#8217;s serial tail.</text>

<!-- ============ PANEL B: MITIGATE ============ -->
<text x="725" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#276749">MITIGATE &#8212; salt the hot key</text>
<text x="725" y="112" text-anchor="middle" font-size="12" fill="#718096">df.repartition(10, &#8220;PULocationID&#8221;, &#8220;salt&#8221;) &#183; 8 salts</text>

<rect x="548" y="132" width="100.5" height="16" rx="3" fill="#9ae6b4" stroke="#276749" stroke-width="1"/>
<text x="542" y="144" text-anchor="end" font-size="10" fill="#4a5568">pid 1</text>
<text x="654" y="145" font-size="10" fill="#276749">1,144,845</text>
<rect x="548" y="159" width="96.8" height="16" rx="3" fill="#9ae6b4" stroke="#276749" stroke-width="1"/>
<text x="542" y="171" text-anchor="end" font-size="10" fill="#4a5568">pid 5</text>
<text x="650" y="172" font-size="10" fill="#4a5568">1,102,580</text>
<rect x="548" y="186" width="93.4" height="16" rx="3" fill="#9ae6b4" stroke="#276749" stroke-width="1"/>
<text x="542" y="198" text-anchor="end" font-size="10" fill="#4a5568">pid 6</text>
<text x="647" y="199" font-size="10" fill="#4a5568">1,063,799</text>
<rect x="548" y="213" width="92.8" height="16" rx="3" fill="#9ae6b4" stroke="#276749" stroke-width="1"/>
<text x="542" y="225" text-anchor="end" font-size="10" fill="#4a5568">pid 0</text>
<text x="646" y="226" font-size="10" fill="#4a5568">1,057,413</text>
<rect x="548" y="240" width="88.2" height="16" rx="3" fill="#9ae6b4" stroke="#276749" stroke-width="1"/>
<text x="542" y="252" text-anchor="end" font-size="10" fill="#4a5568">pid 8</text>
<text x="641" y="253" font-size="10" fill="#4a5568">1,004,410</text>
<rect x="548" y="267" width="80.9" height="16" rx="3" fill="#9ae6b4" stroke="#276749" stroke-width="1"/>
<text x="542" y="279" text-anchor="end" font-size="10" fill="#4a5568">pid 2</text>
<text x="634" y="280" font-size="10" fill="#4a5568">921,682</text>
<rect x="548" y="294" width="77.6" height="16" rx="3" fill="#9ae6b4" stroke="#276749" stroke-width="1"/>
<text x="542" y="306" text-anchor="end" font-size="10" fill="#4a5568">pid 9</text>
<text x="631" y="307" font-size="10" fill="#4a5568">883,685</text>
<rect x="548" y="321" width="74.9" height="16" rx="3" fill="#9ae6b4" stroke="#276749" stroke-width="1"/>
<text x="542" y="333" text-anchor="end" font-size="10" fill="#4a5568">pid 7</text>
<text x="628" y="334" font-size="10" fill="#4a5568">852,713</text>
<rect x="548" y="348" width="68.9" height="16" rx="3" fill="#9ae6b4" stroke="#276749" stroke-width="1"/>
<text x="542" y="360" text-anchor="end" font-size="10" fill="#4a5568">pid 3</text>
<text x="622" y="361" font-size="10" fill="#4a5568">785,004</text>
<rect x="548" y="375" width="64.8" height="16" rx="3" fill="#9ae6b4" stroke="#276749" stroke-width="1"/>
<text x="542" y="387" text-anchor="end" font-size="10" fill="#4a5568">pid 4</text>
<text x="618" y="388" font-size="10" fill="#4a5568">738,626</text>

<rect x="510" y="405" width="430" height="66" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="526" y="426" font-size="11.5" font-weight="700" fill="#276749">max 2,278,324 &#8594; 1,144,845 &#183; std 582,405 &#8594; 139,428 (4.2&#215; tighter)</text>
<text x="526" y="445" font-size="11" fill="#4a5568">JFK&#8217;s 429,745 rows spread &#8776;53,700 across 8 salt buckets; the</text>
<text x="526" y="461" font-size="11" fill="#4a5568">two-stage agg still returns JFK 429,745, Midtown Center 453,825.</text>

<!-- ============ BOTTOM: HONEST CAVEAT + AQE ============ -->
<line x1="40" y1="491" x2="920" y2="491" stroke="#e2e8f0" stroke-width="1"/>

<rect x="40" y="505" width="880" height="70" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="1.5"/>
<text x="480" y="527" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">The honest one-machine caveat</text>
<text x="480" y="548" text-anchor="middle" font-size="12" fill="#4a5568">On this 160&#160;MB laptop the salted two-stage agg was actually SLOWER (0.48&#160;s vs 0.30&#160;s) &#8212; the extra shuffle cost more than the skew saved.</text>
<text x="480" y="567" text-anchor="middle" font-size="12" fill="#4a5568">Skew&#8217;s real damage &#8212; and salting&#8217;s real payoff &#8212; arrive at cluster scale, where one straggler idles dozens of executors for minutes.</text>

<rect x="40" y="587" width="880" height="60" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="480" y="609" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">AQE handles skewed JOINs for free &#8212; not a plain groupBy</text>
<text x="480" y="630" text-anchor="middle" font-size="12" fill="#4a5568">spark.sql.adaptive.skewJoin.enabled = true (factor 5.0, threshold 256&#160;MB) auto-splits skewed shuffle partitions on joins; salting is the manual fix when AQE can&#8217;t.</text>

<text x="480" y="676" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">A stage is only as fast as its slowest task. Diagnose skew with spark_partition_id(); mitigate with salt, more partitions, or AQE.</text>
<text x="480" y="700" text-anchor="middle" font-size="12" fill="#718096">Hash partitioning sends every row of a key to ONE partition &#8212; so a hot key is an unbreakable straggler until you split the key itself.</text>
</svg>
