<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">One zone count, two levels of the stack</text>
  <text x="480" y="54" text-anchor="middle" font-size="14" fill="#718096">trips per pickup zone &#183; January 2024 &#183; 2,964,624 rows &#183; pyspark 4.2 local[*] on 10 cores &#183; medians of 3 warmed runs</text>

  <!-- ============ TOP LANE: DataFrame API ============ -->
  <text x="60" y="90" font-size="14" font-weight="700" fill="#2b6cb0">DataFrame API &#8212; df.groupBy("PULocationID").count() &#8212; 0.15&#160;s, every step inside the JVM</text>

  <g font-size="10.5">
    <rect x="60" y="102" width="152" height="58" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3"/>
    <text x="136" y="120" text-anchor="middle" font-weight="700" fill="#2b6cb0">FileScan parquet</text>
    <text x="136" y="135" text-anchor="middle" fill="#2b6cb0">reads 1 of 19 columns</text>
    <text x="136" y="150" text-anchor="middle" fill="#2b6cb0">ReadSchema: PULocationID</text>

    <rect x="242" y="102" width="152" height="58" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3"/>
    <text x="318" y="120" text-anchor="middle" font-weight="700" fill="#2b6cb0">HashAggregate</text>
    <text x="318" y="135" text-anchor="middle" fill="#2b6cb0">partial_count(1) per</text>
    <text x="318" y="150" text-anchor="middle" fill="#2b6cb0">partition, generated bytecode</text>

    <rect x="424" y="102" width="152" height="58" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3"/>
    <text x="500" y="120" text-anchor="middle" font-weight="700" fill="#2b6cb0">Exchange (shuffle)</text>
    <text x="500" y="135" text-anchor="middle" fill="#2b6cb0">only 260 zone keys</text>
    <text x="500" y="150" text-anchor="middle" fill="#2b6cb0">already pre-aggregated</text>

    <rect x="606" y="102" width="152" height="58" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3"/>
    <text x="682" y="120" text-anchor="middle" font-weight="700" fill="#2b6cb0">HashAggregate</text>
    <text x="682" y="135" text-anchor="middle" fill="#2b6cb0">final count per zone</text>
    <text x="682" y="150" text-anchor="middle" fill="#2b6cb0">still in the JVM</text>

    <rect x="788" y="102" width="152" height="58" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1.3"/>
    <text x="864" y="120" text-anchor="middle" font-weight="700" fill="#276749">collect()</text>
    <text x="864" y="135" text-anchor="middle" fill="#276749">260 rows cross into</text>
    <text x="864" y="150" text-anchor="middle" fill="#276749">Python &#8212; once, at the end</text>

    <g stroke="#4a5568" stroke-width="1.5" fill="#4a5568">
      <line x1="212" y1="131" x2="236" y2="131"/><path d="M236 131 l-7 -4 v8 z"/>
      <line x1="394" y1="131" x2="418" y2="131"/><path d="M418 131 l-7 -4 v8 z"/>
      <line x1="576" y1="131" x2="600" y2="131"/><path d="M600 131 l-7 -4 v8 z"/>
      <line x1="758" y1="131" x2="782" y2="131"/><path d="M782 131 l-7 -4 v8 z"/>
    </g>
  </g>
  <text x="60" y="182" font-size="11" font-style="italic" fill="#276749">Catalyst saw the whole plan: column pruning, per-partition pre-aggregation, compiled bytecode &#8212; all automatic, nothing asked.</text>

  <!-- ============ BOTTOM LANE: RDD ============ -->
  <text x="60" y="218" font-size="14" font-weight="700" fill="#c05621">Hand-rolled RDD &#8212; df.rdd.map(lambda row: (row["PULocationID"], 1)).reduceByKey(...) &#8212; 7.93&#160;s (51.4&#215; slower)</text>

  <g font-size="10.5">
    <rect x="60" y="230" width="152" height="58" rx="6" fill="#fffaf0" stroke="#c05621" stroke-width="1.3"/>
    <text x="136" y="248" text-anchor="middle" font-weight="700" fill="#c05621">FileScan parquet</text>
    <text x="136" y="263" text-anchor="middle" fill="#c05621">ALL 19 columns &#8212; the</text>
    <text x="136" y="278" text-anchor="middle" fill="#c05621">lambda is opaque, no pruning</text>

    <rect x="242" y="230" width="152" height="58" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.6"/>
    <text x="318" y="248" text-anchor="middle" font-weight="700" fill="#c53030">JVM &#8594; Python bridge</text>
    <text x="318" y="263" text-anchor="middle" fill="#c53030">2,964,624 rows serialized</text>
    <text x="318" y="278" text-anchor="middle" fill="#c53030">out of the JVM, one by one</text>

    <rect x="424" y="230" width="152" height="58" rx="6" fill="#fffaf0" stroke="#c05621" stroke-width="1.3"/>
    <text x="500" y="248" text-anchor="middle" font-weight="700" fill="#c05621">Python workers &#215;10</text>
    <text x="500" y="263" text-anchor="middle" fill="#c05621">build a Row object, call</text>
    <text x="500" y="278" text-anchor="middle" fill="#c05621">your lambda &#8212; per row</text>

    <rect x="606" y="230" width="152" height="58" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.6"/>
    <text x="682" y="248" text-anchor="middle" font-weight="700" fill="#c53030">pickle back &#8594; shuffle</text>
    <text x="682" y="263" text-anchor="middle" fill="#c53030">PairwiseRDD &#8594; ShuffledRDD</text>
    <text x="682" y="278" text-anchor="middle" fill="#c53030">(pre-combined per partition)</text>

    <rect x="788" y="230" width="152" height="58" rx="6" fill="#fffaf0" stroke="#c05621" stroke-width="1.3"/>
    <text x="864" y="248" text-anchor="middle" font-weight="700" fill="#c05621">reduceByKey + collect</text>
    <text x="864" y="263" text-anchor="middle" fill="#c05621">260 (zone, count) pairs</text>
    <text x="864" y="278" text-anchor="middle" fill="#c05621">back to the driver</text>

    <g stroke="#4a5568" stroke-width="1.5" fill="#4a5568">
      <line x1="212" y1="259" x2="236" y2="259"/><path d="M236 259 l-7 -4 v8 z"/>
      <line x1="394" y1="259" x2="418" y2="259"/><path d="M418 259 l-7 -4 v8 z"/>
      <line x1="576" y1="259" x2="600" y2="259"/><path d="M600 259 l-7 -4 v8 z"/>
      <line x1="758" y1="259" x2="782" y2="259"/><path d="M782 259 l-7 -4 v8 z"/>
    </g>
  </g>
  <text x="60" y="310" font-size="11" font-style="italic" fill="#c53030">Catalyst cannot see inside a Python function: no pruning, no pushdown, no code generation &#8212; and every row pays the bridge toll.</text>

  <!-- ============ BOTTOM: measured bars ============ -->
  <line x1="60" y1="332" x2="940" y2="332" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="360" font-size="14" font-weight="700" fill="#1a202c">The measured gap &#8212; same job, same January file, same 260-zone answer</text>

  <g font-size="11.5">
    <text x="228" y="392" text-anchor="end" fill="#2b6cb0" font-weight="700">DataFrame groupBy</text>
    <rect x="238" y="378" width="13" height="20" rx="3" fill="#2b6cb0"/>
    <text x="259" y="392" font-size="11" fill="#2b6cb0" font-weight="700">0.15&#160;s</text>

    <text x="228" y="430" text-anchor="end" fill="#c05621" font-weight="700">RDD, pruned by hand</text>
    <rect x="238" y="416" width="170" height="20" rx="3" fill="#ed8936"/>
    <text x="416" y="430" font-size="11" fill="#c05621" font-weight="700">2.02&#160;s &#8212; 13.1&#215;</text>

    <text x="228" y="468" text-anchor="end" fill="#c53030" font-weight="700">RDD, full rows</text>
    <rect x="238" y="454" width="666" height="20" rx="3" fill="#c53030"/>
    <text x="898" y="468" text-anchor="end" font-size="11" fill="#ffffff" font-weight="700">7.93&#160;s &#8212; 51.4&#215;</text>
  </g>

  <text x="238" y="497" font-size="10.5" fill="#4a5568">A manual select("PULocationID") before .rdd recovers the I/O Catalyst would have pruned (7.93 &#8594; 2.02&#160;s) &#8212;</text>
  <text x="238" y="512" font-size="10.5" fill="#4a5568">but the remaining 13.1&#215; is the bridge itself: rows still cross into Python one at a time.</text>

  <rect x="60" y="532" width="880" height="72" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.3"/>
  <text x="76" y="554" font-size="11.5" font-weight="700" fill="#276749">Both levels of the stack returned exactly the same answer &#8212; Course 1&#8217;s ground truth to the trip</text>
  <text x="76" y="572" font-size="11" fill="#276749">JFK Airport 145,240 &#183; Midtown Center 143,471 &#183; Upper East Side South 142,708 &#183; Upper East Side North 136,465 &#183; Midtown East 106,717</text>
  <text x="76" y="590" font-size="11" fill="#276749">The RDD layer is not wrong &#8212; it is the substrate everything compiles to. The 51.4&#215; is the price of hiding your logic from the optimizer.</text>
</svg>
