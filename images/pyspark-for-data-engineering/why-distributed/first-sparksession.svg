<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<rect x="0" y="0" width="960" height="680" fill="#ffffff"/>
<text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">One SparkSession, three files, 9,554,778 rows &#8212; and the collect that killed the driver</text>
<text x="480" y="58" text-anchor="middle" font-size="14" fill="#718096">pyspark 4.2.0 on JDK 21 &#183; local[*] = 10 cores &#183; Jan+Feb+Mar 2024 yellow taxi, 160.4 MB on disk &#183; all numbers measured</text>

<!-- SECTION 1: the session -->
<text x="40" y="96" font-size="13" font-weight="700" fill="#4a5568">THE SESSION &#8212; builder in, real engine out</text>
<line x1="40" y1="106" x2="920" y2="106" stroke="#e2e8f0" stroke-width="1"/>

<rect x="44" y="122" width="170" height="34" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1"/>
<text x="129" y="143" text-anchor="middle" font-size="12" font-weight="600" fill="#2b6cb0">.appName("cityflow")</text>
<text x="228" y="143" text-anchor="middle" font-size="16" fill="#4a5568">&#8594;</text>
<rect x="242" y="122" width="160" height="34" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1"/>
<text x="322" y="143" text-anchor="middle" font-size="12" font-weight="600" fill="#2b6cb0">.master("local[*]")</text>
<text x="416" y="143" text-anchor="middle" font-size="16" fill="#4a5568">&#8594;</text>
<rect x="430" y="122" width="140" height="34" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1"/>
<text x="500" y="143" text-anchor="middle" font-size="12" font-weight="600" fill="#2b6cb0">.getOrCreate()</text>
<text x="584" y="143" text-anchor="middle" font-size="16" fill="#4a5568">&#8594;</text>
<rect x="598" y="114" width="322" height="50" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="759" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">SparkSession up in 5.7 s &#8212; one JVM,</text>
<text x="759" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">10 task slots &#183; Spark UI at localhost:4040</text>

<!-- SECTION 2: lazy read vs real work -->
<text x="40" y="200" font-size="13" font-weight="700" fill="#4a5568">LAZY READ vs REAL WORK &#8212; where the time actually goes</text>
<line x1="40" y1="210" x2="920" y2="210" stroke="#e2e8f0" stroke-width="1"/>

<text x="44" y="240" font-size="13" font-weight="700" fill="#1a202c">spark.read.parquet(3 files)</text>
<text x="44" y="258" font-size="11" fill="#718096">footers + schema only &#8212; a plan, not data</text>
<rect x="300" y="226" width="36" height="28" rx="6" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="346" y="245" font-size="13" font-weight="700" fill="#276749">59 ms for 160.4 MB</text>

<text x="44" y="296" font-size="13" font-weight="700" fill="#1a202c">four count() jobs</text>
<text x="44" y="314" font-size="11" fill="#718096">every row of every file gets scanned</text>
<rect x="300" y="282" width="240" height="28" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="310" y="301" font-size="13" font-weight="700" fill="#2b6cb0">0.48 s &#8212; 9,554,778 rows confirmed</text>

<rect x="580" y="226" width="340" height="88" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="750" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">per-file counts = Course 1's ground truth</text>
<text x="600" y="270" font-size="12" fill="#4a5568">2024-01&#160;&#160;2,964,624&#160;&#160;&#183;&#160;&#160;2024-02&#160;&#160;3,007,526</text>
<text x="600" y="290" font-size="12" fill="#4a5568">2024-03&#160;&#160;3,582,628&#160;&#160;&#8594;&#160;&#160;total&#160;&#160;9,554,778</text>
<text x="600" y="308" font-size="11" fill="#718096">Jan top-3: 132=145,240 &#183; 161=143,471 &#183; 237=142,708</text>

<!-- SECTION 3: two ways to pandas -->
<text x="40" y="354" font-size="13" font-weight="700" fill="#4a5568">TWO WAYS TO BRING RESULTS TO PANDAS &#8212; the driver is still one machine</text>
<line x1="40" y1="364" x2="920" y2="364" stroke="#e2e8f0" stroke-width="1"/>

<!-- safe path -->
<rect x="40" y="382" width="430" height="180" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="255" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">AGGREGATE FIRST, COLLECT SMALL</text>
<rect x="60" y="422" width="150" height="34" rx="6" fill="#ffffff" stroke="#276749" stroke-width="1"/>
<text x="135" y="437" text-anchor="middle" font-size="11" font-weight="600" fill="#276749">9,554,757 trips</text>
<text x="135" y="451" text-anchor="middle" font-size="10" fill="#718096">stay in Spark</text>
<text x="228" y="443" text-anchor="middle" font-size="15" fill="#276749">&#8594;</text>
<rect x="246" y="422" width="120" height="34" rx="6" fill="#ffffff" stroke="#276749" stroke-width="1"/>
<text x="306" y="437" text-anchor="middle" font-size="11" font-weight="600" fill="#276749">groupBy zone</text>
<text x="306" y="451" text-anchor="middle" font-size="10" fill="#718096">262 rows &#183; 3.2 KB</text>
<text x="384" y="443" text-anchor="middle" font-size="15" fill="#276749">&#8594;</text>
<rect x="400" y="422" width="52" height="34" rx="6" fill="#48bb78" stroke="#276749" stroke-width="1"/>
<text x="426" y="443" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">0.95 s</text>
<text x="60" y="486" font-size="11" font-weight="700" fill="#276749">.toPandas() on the aggregate &#8212; matches Course 1 to the row:</text>
<text x="60" y="506" font-size="11" fill="#4a5568">161 = 453,825 &#183; 237 = 439,138 &#183; 132 = 429,745</text>
<text x="60" y="524" font-size="11" fill="#4a5568">236 = 416,508 &#183; 162 = 336,460</text>
<text x="60" y="546" font-size="10" fill="#718096">same window as Course 1: 21 stray-timestamp trips excluded</text>

<!-- unsafe path -->
<rect x="490" y="382" width="430" height="180" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
<text x="705" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">COLLECT THE RAW ROWS</text>
<rect x="510" y="422" width="160" height="34" rx="6" fill="#ffffff" stroke="#c53030" stroke-width="1"/>
<text x="590" y="437" text-anchor="middle" font-size="11" font-weight="600" fill="#c53030">2,964,624 trips</text>
<text x="590" y="451" text-anchor="middle" font-size="10" fill="#718096">January alone</text>
<text x="690" y="443" text-anchor="middle" font-size="15" fill="#c53030">&#8594;</text>
<rect x="708" y="422" width="120" height="34" rx="6" fill="#ffffff" stroke="#c53030" stroke-width="1"/>
<text x="768" y="443" text-anchor="middle" font-size="11" font-weight="600" fill="#c53030">.toPandas()</text>
<text x="848" y="443" text-anchor="middle" font-size="15" fill="#c53030">&#8594;</text>
<rect x="510" y="472" width="390" height="42" rx="6" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"/>
<text x="705" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#c53030">java.lang.OutOfMemoryError: Java heap space</text>
<text x="705" y="507" text-anchor="middle" font-size="10" fill="#c53030">Lost task 4.0 in stage 1.0 (executor driver) &#8212; job aborted, session dead</text>
<text x="510" y="536" font-size="11" fill="#4a5568">In local mode, driver and executors share ONE JVM heap &#8212; 1 GB</text>
<text x="510" y="552" font-size="11" fill="#4a5568">by default. January didn't fit: Course 1 Module 1's wall, reborn.</text>

<line x1="40" y1="586" x2="920" y2="586" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="600" width="880" height="60" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5"/>
<text x="60" y="624" font-size="12" font-weight="700" fill="#c05621">Ten cores execute your queries; one driver receives your collects.</text>
<text x="60" y="644" font-size="11" fill="#4a5568">Aggregate in Spark, bring back only what fits in a chart. Exact seconds vary by machine and run; the shape is the point.</text>
</svg>
