<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="360" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Pick the strongest check the task allows</text><text x="40" y="64" font-size="10.5" font-weight="700" fill="#276749">◀ objective · cheap · reliable</text><text x="720" y="64" text-anchor="end" font-size="10.5" font-weight="700" fill="#c05621">needs judgment · flexible ▶</text><rect x="40" y="74" width="680" height="6" rx="3" fill="#e2e8f0" /><rect x="40" y="74" width="230" height="6" rx="3" fill="#9ae6b4" /><rect x="500" y="74" width="220" height="6" rx="3" fill="#fbd38d" /><rect x="30" y="96" width="165" height="96" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="112" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Hard rule / test</text><text x="112" y="136" text-anchor="middle" font-size="8.5" fill="#2f855a">a clean pass / fail</text><text x="112" y="164" text-anchor="middle" font-size="8.5" fill="#4a5568">ex: "≤ 250 words;</text><text x="112" y="177" text-anchor="middle" font-size="8.5" fill="#4a5568">title is in the stock list"</text><rect x="205" y="96" width="165" height="96" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="287" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Checklist</text><text x="287" y="136" text-anchor="middle" font-size="8.5" fill="#3182ce">tick concrete must-haves</text><text x="287" y="164" text-anchor="middle" font-size="8.5" fill="#4a5568">ex: the four</text><text x="287" y="177" text-anchor="middle" font-size="8.5" fill="#4a5568">done-criteria</text><rect x="380" y="96" width="165" height="96" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="462" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">Reference example</text><text x="462" y="136" text-anchor="middle" font-size="8.5" fill="#805ad5">compare to a known-good one</text><text x="462" y="164" text-anchor="middle" font-size="8.5" fill="#4a5568">ex: "matches last</text><text x="462" y="177" text-anchor="middle" font-size="8.5" fill="#4a5568">week's good issue"</text><rect x="555" y="96" width="165" height="96" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="637" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">Rubric</text><text x="637" y="136" text-anchor="middle" font-size="8.5" fill="#9c4221">score the soft dimensions</text><text x="637" y="164" text-anchor="middle" font-size="8.5" fill="#4a5568">ex: "tone warm?</text><text x="637" y="177" text-anchor="middle" font-size="8.5" fill="#4a5568">rate 1–5"</text><rect x="30" y="212" width="690" height="66" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" /><text x="52" y="236" font-size="12" font-weight="700" fill="#4a5568">Real-world signal — the ground truth</text><text x="52" y="256" font-size="9.5" fill="#718096">Did it actually work? Opens, replies, footfall, sales. The truest check of all — but slow, and it</text><text x="52" y="270" font-size="9.5" fill="#718096">arrives after you've shipped, so you use it to improve the next loop, not to finish this one.</text><text x="380" y="308" text-anchor="middle" font-size="10.5" fill="#718096">Use rules and checklists wherever a task allows them; reach for a rubric only for the fuzzy remainder.</text><text x="380" y="326" text-anchor="middle" font-size="10.5" fill="#718096">The further right you go, the more flexible the check — and the more care it needs to stay honest.</text></svg>
