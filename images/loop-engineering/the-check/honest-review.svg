<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="360" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Ask for a verdict with evidence, not a vibe — or you'll get flattery</text><rect x="24" y="60" width="344" height="248" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" /><text x="196" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#c53030">Asking for a vibe</text><rect x="40" y="98" width="312" height="40" rx="7" fill="#ffffff" stroke="#fed7d7" stroke-width="1.2" /><text x="52" y="114" font-size="9.5" font-weight="700" fill="#4a5568">You:</text><text x="52" y="128" font-size="9.5" fill="#4a5568">"Is this newsletter good?"</text><rect x="40" y="148" width="312" height="86" rx="7" fill="#ffffff" stroke="#fed7d7" stroke-width="1.2" /><text x="52" y="164" font-size="9.5" font-weight="700" fill="#c53030">AI:</text><text x="52" y="180" font-size="9.5" fill="#9b2c2c">"Yes! It's warm, engaging, and</text><text x="52" y="194" font-size="9.5" fill="#9b2c2c">ready to send. Great work! 🎉"</text><text x="52" y="216" font-size="8.5" font-style="italic" fill="#c53030">…it never counted the words or</text><text x="52" y="228" font-size="8.5" font-style="italic" fill="#c53030">checked the stock list.</text><text x="196" y="256" text-anchor="middle" font-size="9" font-weight="700" fill="#c53030">✗ agrees · flatters · no evidence</text><text x="196" y="286" text-anchor="middle" font-size="9" fill="#9b2c2c">a false "done" waiting to happen</text><rect x="392" y="60" width="344" height="248" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="564" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Asking for a verdict</text><rect x="408" y="98" width="312" height="52" rx="7" fill="#ffffff" stroke="#c6f6d5" stroke-width="1.2" /><text x="420" y="114" font-size="9.5" font-weight="700" fill="#4a5568">You:</text><text x="420" y="128" font-size="9.5" fill="#4a5568">"For each criterion, quote the evidence</text><text x="420" y="141" font-size="9.5" fill="#4a5568">and mark MET / NOT MET. It's OK to fail."</text><rect x="408" y="160" width="312" height="90" rx="7" fill="#ffffff" stroke="#c6f6d5" stroke-width="1.2" /><text x="420" y="176" font-size="9" fill="#276749">≤250 words: <tspan font-weight="700" fill="#c53030">NOT MET</tspan> (312 words)</text><text x="420" y="194" font-size="9" fill="#276749">names event: <tspan font-weight="700" fill="#2f855a">MET</tspan> ("Saturday's poetry night")</text><text x="420" y="212" font-size="9" fill="#276749">in-stock only: <tspan font-weight="700" fill="#c53030">NOT MET</tspan> ("Tidewater" isn't</text><text x="432" y="225" font-size="9" fill="#276749">in the list)</text><text x="420" y="243" font-size="9" fill="#276749">warm tone: <tspan font-weight="700" fill="#2f855a">MET</tspan></text><text x="564" y="272" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">✓ specific · evidence · willing to fail</text><text x="564" y="296" text-anchor="middle" font-size="9" fill="#2f855a">now the loop knows exactly what to fix</text><text x="380" y="336" text-anchor="middle" font-size="10.5" fill="#718096">Grade against named criteria, demand a quote as evidence, and give explicit permission to mark things NOT MET.</text><text x="380" y="353" text-anchor="middle" font-size="10.5" fill="#718096">An open "is it good?" invites agreement; a per-criterion verdict invites the truth.</text></svg>
