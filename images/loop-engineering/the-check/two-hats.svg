<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="350" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Two hats: the maker proposes, a fresh reviewer disposes</text><rect x="30" y="80" width="200" height="90" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="130" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">Doer</text><text x="130" y="126" text-anchor="middle" font-size="9" fill="#805ad5">writes the draft,</text><text x="130" y="140" text-anchor="middle" font-size="9" fill="#805ad5">attached to its own work</text><rect x="52" y="192" width="156" height="40" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" /><text x="130" y="209" text-anchor="middle" font-size="9" font-weight="700" fill="#4a5568">the Draft</text><text x="130" y="223" text-anchor="middle" font-size="8" fill="#718096">the actual output</text><rect x="52" y="246" width="156" height="40" rx="7" fill="#fff5f5" stroke="#fed7d7" stroke-width="1.2" /><text x="130" y="263" text-anchor="middle" font-size="9" font-weight="700" fill="#c53030">"looks great to me!"</text><text x="130" y="277" text-anchor="middle" font-size="8" fill="#9b2c2c">its self-praise / rationale</text><line x1="380" y1="60" x2="380" y2="308" stroke="#a0aec0" stroke-width="2" stroke-dasharray="6 5" /><text x="380" y="52" text-anchor="middle" font-size="9" font-weight="700" fill="#718096">fresh context</text><line x1="208" y1="212" x2="524" y2="212" stroke="#48bb78" stroke-width="2" /><polygon points="524 212 514 207 514 217" fill="#48bb78" /><text x="300" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#276749">the draft crosses ✓</text><line x1="208" y1="266" x2="356" y2="266" stroke="#fc8181" stroke-width="2" stroke-dasharray="4 3" /><line x1="366" y1="258" x2="382" y2="274" stroke="#e53e3e" stroke-width="2.5" /><line x1="382" y1="258" x2="366" y2="274" stroke="#e53e3e" stroke-width="2.5" /><text x="285" y="286" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c53030">the self-praise is blocked ✗</text><rect x="404" y="150" width="120" height="52" rx="7" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.2" /><text x="464" y="170" text-anchor="middle" font-size="9" font-weight="700" fill="#4a5568">+ the Criteria</text><text x="464" y="184" text-anchor="middle" font-size="8" fill="#718096">the definition of done</text><line x1="524" y1="176" x2="548" y2="200" stroke="#a0aec0" stroke-width="1.6" /><polygon points="548 200 537 197 541 190" fill="#a0aec0" /><rect x="540" y="150" width="190" height="140" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.8" /><text x="635" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">Reviewer</text><text x="635" y="195" text-anchor="middle" font-size="9" fill="#9c4221">sees only the draft</text><text x="635" y="208" text-anchor="middle" font-size="9" fill="#9c4221">and the criteria</text><text x="556" y="234" font-size="9" fill="#276749">✓ names the event</text><text x="556" y="252" font-size="9" fill="#c53030">✗ 312 words (over 250)</text><text x="556" y="270" font-size="9" fill="#c53030">✗ invented a title</text><text x="380" y="330" text-anchor="middle" font-size="10.5" fill="#718096">Give the reviewer only the work and the criteria — never the maker's reasoning — so it can't be talked into agreeing.</text></svg>
