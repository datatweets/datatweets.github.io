<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="350" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The prompt shapes one attempt; the check judges every one</text><rect x="30" y="96" width="150" height="52" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="105" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Prompt</text><text x="105" y="135" text-anchor="middle" font-size="9" fill="#3182ce">how you ask</text><line x1="180" y1="122" x2="214" y2="122" stroke="#a0aec0" stroke-width="2" /><polygon points="214 122 204 117 204 127" fill="#a0aec0" /><rect x="216" y="96" width="150" height="52" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="291" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">Attempt</text><text x="291" y="135" text-anchor="middle" font-size="9" fill="#805ad5">a draft</text><line x1="366" y1="122" x2="424" y2="122" stroke="#a0aec0" stroke-width="2" /><polygon points="424 122 414 117 414 127" fill="#a0aec0" /><rect x="426" y="86" width="176" height="72" rx="12" fill="#fffaf0" stroke="#ed8936" stroke-width="3" /><text x="514" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">Check</text><text x="514" y="133" text-anchor="middle" font-size="9.5" fill="#9c4221">meets the goal?</text><text x="514" y="147" text-anchor="middle" font-size="8" fill="#dd6b20">every round passes here</text><path d="M514 86C514 52 291 52 291 92" fill="none" stroke="#fc8181" stroke-width="1.8" stroke-dasharray="5 3" /><polygon points="291 92 286 82 296 82" fill="#fc8181" /><text x="402" y="46" text-anchor="middle" font-size="9" font-weight="700" fill="#c53030">no → correct &amp; attempt again</text><line x1="602" y1="122" x2="648" y2="122" stroke="#48bb78" stroke-width="2" /><polygon points="648 122 638 117 638 127" fill="#48bb78" /><text x="625" y="114" text-anchor="middle" font-size="8" font-weight="700" fill="#276749">yes</text><rect x="650" y="96" width="82" height="52" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="691" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Done</text><line x1="105" y1="148" x2="105" y2="196" stroke="#cbd5e0" stroke-width="1.4" /><rect x="30" y="198" width="336" height="70" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="198" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">Improve the prompt</text><text x="198" y="242" text-anchor="middle" font-size="9.5" fill="#4a5568">→ a better first draft, produced once.</text><text x="198" y="257" text-anchor="middle" font-size="9.5" fill="#4a5568">It never sees rounds 2, 3, 4…</text><line x1="514" y1="158" x2="514" y2="196" stroke="#ed8936" stroke-width="1.6" /><rect x="394" y="198" width="336" height="70" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="562" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">Improve the check</text><text x="562" y="242" text-anchor="middle" font-size="9.5" fill="#9c4221">→ every attempt gets measured and</text><text x="562" y="257" text-anchor="middle" font-size="9.5" fill="#9c4221">corrected. This is where quality lives.</text><text x="380" y="304" text-anchor="middle" font-size="10.5" fill="#718096">A better prompt improves one attempt. A better check governs all of them — so the check has the leverage.</text><text x="380" y="322" text-anchor="middle" font-size="10.5" fill="#718096">That is the whole reason this module, not a prompt-writing module, is the heart of the course.</text></svg>
