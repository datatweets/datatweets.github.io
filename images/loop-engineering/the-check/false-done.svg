<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="392" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">A false "done": when the check passes work that isn't finished</text><rect x="30" y="58" width="330" height="150" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" /><text x="195" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#c53030">The lie</text><rect x="52" y="96" width="196" height="66" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.1" /><text x="64" y="114" font-size="8.5" fill="#4a5568">Harborlight, your local</text><text x="64" y="128" font-size="8.5" fill="#4a5568">bookshop, opened in</text><text x="64" y="142" font-size="8.5" font-weight="700" fill="#c53030">2011 …</text><text x="64" y="156" font-size="7.5" font-style="italic" fill="#c53030">(wrong — but reads fine)</text><g transform="rotate(-14 250 120)"><rect x="196" y="104" width="108" height="34" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="250" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">✓ DONE</text></g><text x="195" y="184" text-anchor="middle" font-size="9.5" fill="#9b2c2c">the check said "looks good to me!"</text><text x="195" y="199" text-anchor="middle" font-size="8.5" font-style="italic" fill="#c53030">confident, fluent, and false</text><line x1="366" y1="130" x2="398" y2="130" stroke="#a0aec0" stroke-width="2" /><polygon points="398 130 388 125 388 135" fill="#a0aec0" /><rect x="400" y="58" width="330" height="150" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="565" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">The catch</text><rect x="422" y="96" width="150" height="40" rx="6" fill="#ffffff" stroke="#c6f6d5" stroke-width="1.2" /><text x="434" y="112" font-size="8.5" font-weight="700" fill="#276749">Shop records:</text><text x="434" y="126" font-size="8.5" fill="#2f855a">founded 2009 (ground truth)</text><line x1="574" y1="116" x2="598" y2="116" stroke="#48bb78" stroke-width="1.6" /><polygon points="598 116 588 111 588 121" fill="#48bb78" /><rect x="600" y="96" width="112" height="40" rx="6" fill="#fff5f5" stroke="#fc8181" stroke-width="1.4" /><text x="656" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#c53030">✗ NOT DONE</text><text x="656" y="127" text-anchor="middle" font-size="8" fill="#9b2c2c">says 2011, not 2009</text><text x="565" y="176" text-anchor="middle" font-size="9.5" fill="#2f855a">an independent, concrete check —</text><text x="565" y="191" text-anchor="middle" font-size="9.5" fill="#2f855a">anchored to something outside the loop</text><rect x="30" y="228" width="700" height="96" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" /><text x="52" y="252" font-size="12" font-weight="700" fill="#c05621">Three ways a check lies</text><text x="52" y="274" font-size="9.5" fill="#9c4221">1 · It's a vibe. "Reads well" passes a fluent answer that happens to be wrong.</text><text x="52" y="294" font-size="9.5" fill="#9c4221">2 · The doer graded its own work. Checker and maker share the same blind spot (verifier collusion).</text><text x="52" y="314" font-size="9.5" fill="#9c4221">3 · The loop learned to pass the check, not do the task — gaming a loophole instead of solving it (reward hacking).</text><text x="380" y="352" text-anchor="middle" font-size="10.5" fill="#718096">A "done" is a claim, not a fact. Anchor the check to something outside the loop, and occasionally check the checker.</text><text x="380" y="372" text-anchor="middle" font-size="10.5" fill="#718096">A documented case: an AI that wrote its own tests passed itself — and its "verified" score went down, not up.</text></svg>
