<svg xmlns="http://www.w3.org/2000/svg" width="760" height="366" viewBox="0 0 760 366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="366" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Break a big document into passes — and check the output against it</text><rect x="30" y="70" width="150" height="188" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="105" y="90" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">Long document</text><text x="105" y="104" text-anchor="middle" font-size="8" fill="#3182ce">too big for one pass</text><rect x="46" y="116" width="118" height="38" rx="5" fill="#ffffff" stroke="#bee3f8" stroke-width="1.1" /><text x="105" y="139" text-anchor="middle" font-size="9" fill="#4a5568">Section A</text><rect x="46" y="160" width="118" height="38" rx="5" fill="#ffffff" stroke="#bee3f8" stroke-width="1.1" /><text x="105" y="183" text-anchor="middle" font-size="9" fill="#4a5568">Section B</text><rect x="46" y="204" width="118" height="38" rx="5" fill="#ffffff" stroke="#bee3f8" stroke-width="1.1" /><text x="105" y="227" text-anchor="middle" font-size="9" fill="#4a5568">Section C</text><line x1="180" y1="135" x2="214" y2="135" stroke="#a0aec0" stroke-width="1.8" /><polygon points="214 135 204 130 204 140" fill="#a0aec0" /><line x1="180" y1="179" x2="214" y2="179" stroke="#a0aec0" stroke-width="1.8" /><polygon points="214 179 204 174 204 184" fill="#a0aec0" /><line x1="180" y1="223" x2="214" y2="223" stroke="#a0aec0" stroke-width="1.8" /><polygon points="214 223 204 218 204 228" fill="#a0aec0" /><rect x="216" y="118" width="150" height="34" rx="7" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="291" y="139" text-anchor="middle" font-size="9.5" fill="#6b46c1">Pass over A</text><rect x="216" y="162" width="150" height="34" rx="7" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="291" y="183" text-anchor="middle" font-size="9.5" fill="#6b46c1">Pass over B</text><rect x="216" y="206" width="150" height="34" rx="7" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="291" y="227" text-anchor="middle" font-size="9.5" fill="#6b46c1">Pass over C</text><path d="M366 135 Q400 135 400 172" fill="none" stroke="#a0aec0" stroke-width="1.8" /><path d="M366 179 L400 179" fill="none" stroke="#a0aec0" stroke-width="1.8" /><path d="M366 223 Q400 223 400 186" fill="none" stroke="#a0aec0" stroke-width="1.8" /><line x1="400" y1="179" x2="426" y2="179" stroke="#a0aec0" stroke-width="1.8" /><polygon points="426 179 416 174 416 184" fill="#a0aec0" /><rect x="428" y="152" width="130" height="54" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="493" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">Combine → draft</text><text x="493" y="192" text-anchor="middle" font-size="8.5" fill="#9c4221">e.g. one summary</text><line x1="558" y1="179" x2="592" y2="179" stroke="#a0aec0" stroke-width="1.8" /><polygon points="592 179 582 174 582 184" fill="#a0aec0" /><rect x="594" y="146" width="140" height="66" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.8" /><text x="664" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Check vs source</text><text x="664" y="186" text-anchor="middle" font-size="8" fill="#2f855a">does every claim trace</text><text x="664" y="197" text-anchor="middle" font-size="8" fill="#2f855a">back to the document?</text><path d="M664 212 Q664 300 105 300 L105 262" fill="none" stroke="#48bb78" stroke-width="1.6" stroke-dasharray="6 4" /><polygon points="105 262 100 272 110 272" fill="#48bb78" /><text x="384" y="296" text-anchor="middle" font-size="8.5" font-weight="700" fill="#276749">the document is the ground truth — anything not in it is flagged</text><text x="380" y="340" text-anchor="middle" font-size="10.5" fill="#718096">Long inputs go in passes so nothing is skimmed; then the source itself becomes the check that catches invented claims.</text></svg>
