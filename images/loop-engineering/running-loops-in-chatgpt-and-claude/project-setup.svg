<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" viewBox="0 0 760 352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="352" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Set the loop up once; every new chat starts already anchored</text><rect x="28" y="60" width="330" height="256" rx="12" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.8" /><rect x="28" y="60" width="330" height="34" rx="12" fill="#4299e1" /><rect x="28" y="78" width="330" height="16" fill="#4299e1" /><text x="46" y="82" font-size="12" font-weight="700" fill="#ffffff">PROJECT · Harborlight newsletter</text><rect x="46" y="106" width="294" height="56" rx="8" fill="#ffffff" stroke="#bee3f8" stroke-width="1.2" /><text x="58" y="124" font-size="10" font-weight="700" fill="#2b6cb0">Standing instructions (the brief)</text><text x="58" y="140" font-size="8.5" fill="#4a5568">goal · warm first-name voice · no</text><text x="58" y="152" font-size="8.5" fill="#4a5568">discount codes · ≤ 250 words</text><rect x="46" y="170" width="294" height="46" rx="8" fill="#ffffff" stroke="#bee3f8" stroke-width="1.2" /><text x="58" y="188" font-size="10" font-weight="700" fill="#276749">Definition of done (the check)</text><text x="58" y="204" font-size="8.5" fill="#4a5568">the criteria your review runs against</text><rect x="46" y="224" width="294" height="70" rx="8" fill="#ffffff" stroke="#bee3f8" stroke-width="1.2" /><text x="58" y="242" font-size="10" font-weight="700" fill="#6b46c1">Reference files (knowledge)</text><text x="58" y="258" font-size="8.5" fill="#4a5568">current stock list</text><text x="58" y="272" font-size="8.5" fill="#4a5568">last month's best issue</text><text x="58" y="286" font-size="8.5" fill="#4a5568">brand-voice one-pager</text><line x1="358" y1="130" x2="452" y2="118" stroke="#a0aec0" stroke-width="1.8" /><polygon points="452 118 441 118 445 126" fill="#a0aec0" /><line x1="358" y1="188" x2="452" y2="188" stroke="#a0aec0" stroke-width="1.8" /><polygon points="452 188 442 183 442 193" fill="#a0aec0" /><line x1="358" y1="250" x2="452" y2="260" stroke="#a0aec0" stroke-width="1.8" /><polygon points="452 260 441 260 445 268" fill="#a0aec0" /><rect x="454" y="96" width="278" height="44" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="593" y="114" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">New chat — this week's issue</text><text x="593" y="130" text-anchor="middle" font-size="8.5" fill="#2f855a">already knows the brief + check</text><rect x="454" y="166" width="278" height="44" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="593" y="184" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">New chat — event special</text><text x="593" y="200" text-anchor="middle" font-size="8.5" fill="#2f855a">no setup retyped</text><rect x="454" y="236" width="278" height="44" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="593" y="254" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">New chat — next week…</text><text x="593" y="270" text-anchor="middle" font-size="8.5" fill="#2f855a">starts anchored, every time</text><text x="380" y="336" text-anchor="middle" font-size="10.5" fill="#718096">A Project (ChatGPT or Claude) stores the brief, the check, and reference files, so every chat inside it starts loaded.</text></svg>
