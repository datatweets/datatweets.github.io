<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" viewBox="0 0 760 352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="352" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">A research loop: search, check the results, search again, then cite</text><rect x="24" y="118" width="150" height="60" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="99" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">Question</text><text x="99" y="160" text-anchor="middle" font-size="8.5" fill="#3182ce">what you need to find out</text><line x1="174" y1="148" x2="206" y2="148" stroke="#a0aec0" stroke-width="2" /><polygon points="206 148 196 143 196 153" fill="#a0aec0" /><rect x="208" y="118" width="150" height="60" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="283" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">Search the web</text><text x="283" y="160" text-anchor="middle" font-size="8.5" fill="#805ad5">the tool fetches results</text><line x1="358" y1="148" x2="390" y2="148" stroke="#a0aec0" stroke-width="2" /><polygon points="390 148 380 143 380 153" fill="#a0aec0" /><rect x="392" y="108" width="176" height="80" rx="11" fill="#fffaf0" stroke="#ed8936" stroke-width="2.4" /><text x="480" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">Check the results</text><text x="480" y="150" text-anchor="middle" font-size="8.5" fill="#9c4221">relevant? recent? credible?</text><text x="480" y="164" text-anchor="middle" font-size="8.5" fill="#9c4221">enough to answer — or gaps?</text><path d="M480 108C480 66 283 66 283 114" fill="none" stroke="#fc8181" stroke-width="1.8" stroke-dasharray="5 3" /><polygon points="283 114 278 104 288 104" fill="#fc8181" /><text x="384" y="60" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c53030">gaps → refine the query &amp; search again</text><line x1="568" y1="148" x2="600" y2="148" stroke="#48bb78" stroke-width="2" /><polygon points="600 148 590 143 590 153" fill="#48bb78" /><text x="584" y="140" text-anchor="middle" font-size="8" font-weight="700" fill="#276749">enough</text><rect x="602" y="108" width="134" height="80" rx="11" fill="#f0fff4" stroke="#48bb78" stroke-width="1.8" /><text x="669" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Synthesize</text><text x="669" y="152" text-anchor="middle" font-size="8" fill="#2f855a">write it up — and</text><text x="669" y="164" text-anchor="middle" font-size="8" fill="#2f855a">cite every source</text><rect x="60" y="228" width="640" height="52" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="380" y="250" text-anchor="middle" font-size="10.5" fill="#4a5568">Web results are <tspan font-weight="700">claims to check, not facts to trust</tspan> — confirm dates, cross-check a second source, watch for outdated pages.</text><text x="380" y="268" text-anchor="middle" font-size="10.5" fill="#4a5568">The search itself is a loop: keep refining until the gaps close, then synthesize with a citation for every claim.</text><text x="380" y="312" text-anchor="middle" font-size="10.5" fill="#718096">This is the engine behind the module project — Harborlight's competitor brief, built by looping over real searches.</text></svg>
