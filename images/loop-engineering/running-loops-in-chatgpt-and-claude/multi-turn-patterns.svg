<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="344" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Four multi-turn moves — and every loop should end on "converge"</text><rect x="28" y="52" width="344" height="104" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="46" y="78" font-size="13" font-weight="700" fill="#2b6cb0">Refine</text><text x="120" y="78" font-size="9.5" fill="#3182ce">— improve what's already there</text><text x="46" y="100" font-size="9" fill="#4a5568">tighten, fix, clarify — same scope, better quality</text><text x="46" y="122" font-size="9" font-style="italic" fill="#718096">"tighten this paragraph and fix the date"</text><text x="46" y="142" font-size="8.5" font-weight="700" fill="#2b6cb0">deepens ↧</text><rect x="388" y="52" width="344" height="104" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="406" y="78" font-size="13" font-weight="700" fill="#6b46c1">Expand</text><text x="486" y="78" font-size="9.5" fill="#805ad5">— add what's missing</text><text x="406" y="100" font-size="9" fill="#4a5568">more breadth or depth — grow the material</text><text x="406" y="122" font-size="9" font-style="italic" fill="#718096">"add two more competitors; go deeper on pricing"</text><text x="406" y="142" font-size="8.5" font-weight="700" fill="#6b46c1">widens ↔</text><rect x="28" y="168" width="344" height="104" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="46" y="194" font-size="13" font-weight="700" fill="#c05621">Critique</text><text x="128" y="194" font-size="9.5" fill="#9c4221">— find what's wrong</text><text x="46" y="216" font-size="9" fill="#4a5568">turn the check into a move — surface the flaws</text><text x="46" y="238" font-size="9" font-style="italic" fill="#718096">"what are the three weakest points here?"</text><text x="46" y="258" font-size="8.5" font-weight="700" fill="#c05621">checks ⟳</text><rect x="388" y="168" width="344" height="104" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="2.4" /><text x="406" y="194" font-size="13" font-weight="700" fill="#276749">Converge</text><text x="500" y="194" font-size="9.5" fill="#2f855a">— narrow and commit</text><text x="406" y="216" font-size="9" fill="#4a5568">cut, decide, finalize — head deliberately to done</text><text x="406" y="238" font-size="9" font-style="italic" fill="#718096">"keep the best three, cut the rest, finalize"</text><text x="406" y="258" font-size="8.5" font-weight="700" fill="#276749">finishes ✓ → DONE</text><text x="380" y="298" text-anchor="middle" font-size="10.5" fill="#718096">String these on purpose instead of nudging at random: expand to gather, critique to find gaps, refine to fix them,</text><text x="380" y="316" text-anchor="middle" font-size="10.5" fill="#718096">then converge to finish. Always end on a converge — a deliberate step to "done", not just stopping when you're tired.</text></svg>
