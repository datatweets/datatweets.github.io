<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="360" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">A long chat drifts; a re-anchored one stays on target</text><rect x="24" y="56" width="344" height="256" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" /><text x="196" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#c53030">Turn 14 of one long chat</text><rect x="44" y="94" width="150" height="16" rx="4" fill="#edf2f7" /><text x="52" y="106" font-size="8" fill="#a0aec0">goal (way back at the top)…</text><rect x="44" y="116" width="290" height="15" rx="4" fill="#f7fafc" /><text x="52" y="127" font-size="8" fill="#a0aec0">…tangent about the subject line…</text><rect x="44" y="137" width="290" height="15" rx="4" fill="#f7fafc" /><text x="52" y="148" font-size="8" fill="#a0aec0">…a new idea about images…</text><rect x="44" y="158" width="290" height="15" rx="4" fill="#f7fafc" /><text x="52" y="169" font-size="8" fill="#a0aec0">…"actually, make it longer"…</text><rect x="44" y="179" width="290" height="15" rx="4" fill="#f7fafc" /><text x="52" y="190" font-size="8" fill="#a0aec0">…"wait, go back to before"…</text><rect x="44" y="200" width="290" height="26" rx="5" fill="#fed7d7" stroke="#fc8181" stroke-width="1.1" /><text x="52" y="211" font-size="8.5" font-weight="700" fill="#c53030">AI's attention → the latest few lines</text><text x="52" y="222" font-size="8" fill="#9b2c2c">the original goal has faded from view</text><text x="196" y="252" text-anchor="middle" font-size="9" fill="#9b2c2c">it "forgets" a constraint, reintroduces a</text><text x="196" y="265" text-anchor="middle" font-size="9" fill="#9b2c2c">fixed error, and slowly wanders off-brief</text><text x="196" y="292" text-anchor="middle" font-size="9" font-weight="700" fill="#c53030">✗ the goal sank under the pile</text><rect x="392" y="56" width="344" height="256" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="564" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">A fresh, re-anchored turn</text><rect x="412" y="94" width="304" height="40" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="424" y="110" font-size="9" font-weight="700" fill="#2b6cb0">Brief + criteria</text><text x="424" y="124" font-size="8.5" fill="#3182ce">restated at the top, in full</text><rect x="412" y="142" width="304" height="40" rx="6" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="424" y="158" font-size="9" font-weight="700" fill="#6b46c1">Current best draft</text><text x="424" y="172" font-size="8.5" fill="#805ad5">pasted fresh — not "remembered"</text><rect x="412" y="190" width="304" height="40" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" /><text x="424" y="206" font-size="9" font-weight="700" fill="#c05621">Fix: one specific gap</text><text x="424" y="220" font-size="8.5" fill="#9c4221">"cut to 250 words" — nothing else</text><text x="564" y="252" text-anchor="middle" font-size="9" fill="#2f855a">short context, goal on top, one change at</text><text x="564" y="265" text-anchor="middle" font-size="9" fill="#2f855a">a time — so the AI can't lose the thread</text><text x="564" y="292" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">✓ the goal stays in view</text><text x="380" y="336" text-anchor="middle" font-size="10.5" fill="#718096">The AI attends most to recent text. Keep the context short and re-state the brief, or start a fresh chat</text><text x="380" y="353" text-anchor="middle" font-size="10.5" fill="#718096">carrying only the brief and the current best draft — so the goal never sinks out of sight.</text></svg>
