<svg xmlns="http://www.w3.org/2000/svg" width="760" height="336" viewBox="0 0 760 336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="336" fill="#ffffff" /><text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Four anti-patterns — each with an antidote you've already learned</text><rect x="28" y="48" width="344" height="106" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.6" /><text x="46" y="72" font-size="12.5" font-weight="700" fill="#c53030">Infinite polish</text><text x="46" y="92" font-size="9" fill="#9b2c2c">never ships — keeps polishing past the point</text><text x="46" y="105" font-size="9" fill="#9b2c2c">of any real value.</text><text x="46" y="128" font-size="9" font-weight="700" fill="#276749">Fix:</text><text x="76" y="128" font-size="9" fill="#2f855a">a concrete "done" + a budget.</text><text x="46" y="143" font-size="8" font-style="italic" fill="#718096">Modules 2 &amp; 6</text><rect x="388" y="48" width="344" height="106" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="406" y="72" font-size="12.5" font-weight="700" fill="#c05621">Goal drift</text><text x="406" y="92" font-size="9" fill="#9c4221">slowly optimizes for the wrong thing;</text><text x="406" y="105" font-size="9" fill="#9c4221">wanders off-brief round by round.</text><text x="406" y="128" font-size="9" font-weight="700" fill="#276749">Fix:</text><text x="436" y="128" font-size="9" fill="#2f855a">pin the goal, and re-anchor it as you go.</text><text x="406" y="143" font-size="8" font-style="italic" fill="#718096">Modules 2 &amp; 4</text><rect x="28" y="166" width="344" height="106" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="46" y="190" font-size="12.5" font-weight="700" fill="#6b46c1">Verifier collusion</text><text x="46" y="210" font-size="9" fill="#805ad5">the reviewer just agrees with the doer —</text><text x="46" y="223" font-size="9" fill="#805ad5">a confident false "done".</text><text x="46" y="246" font-size="9" font-weight="700" fill="#276749">Fix:</text><text x="76" y="246" font-size="9" fill="#2f855a">two hats + anchor to ground truth.</text><text x="46" y="261" font-size="8" font-style="italic" fill="#718096">Module 3</text><rect x="388" y="166" width="344" height="106" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="406" y="190" font-size="12.5" font-weight="700" fill="#2b6cb0">Over-automation</text><text x="406" y="210" font-size="9" fill="#3182ce">loops what should've been one-shot, a fixed</text><text x="406" y="223" font-size="9" fill="#3182ce">recipe, or a human's call.</text><text x="406" y="246" font-size="9" font-weight="700" fill="#276749">Fix:</text><text x="436" y="246" font-size="9" fill="#2f855a">the "should this even be a loop?" test.</text><text x="406" y="261" font-size="8" font-style="italic" fill="#718096">Module 1</text><text x="380" y="298" text-anchor="middle" font-size="10.5" fill="#718096">Each anti-pattern is what happens when an earlier step gets skipped — so naming the shape is already half the fix.</text><text x="380" y="316" text-anchor="middle" font-size="10.5" fill="#718096">When a loop feels wrong, ask which of these four it is; the antidote points straight back to the module that prevents it.</text></svg>
