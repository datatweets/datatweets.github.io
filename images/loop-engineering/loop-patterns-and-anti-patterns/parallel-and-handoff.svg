<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="344" fill="#ffffff" /><text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Scaling up: run loops in parallel, or hand off between specialists</text><rect x="24" y="44" width="712" height="128" rx="10" fill="#fbfdff" stroke="#cbd5e0" stroke-width="1.2" /><text x="40" y="66" font-size="11.5" font-weight="700" fill="#2b6cb0">Parallel loops — independent parts, run at the same time</text><rect x="38" y="80" width="120" height="72" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="98" y="110" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">Orchestrator</text><text x="98" y="127" text-anchor="middle" font-size="8" fill="#3182ce">splits the work</text><line x1="158" y1="98" x2="204" y2="98" stroke="#a0aec0" stroke-width="1.6" /><polygon points="204 98 194 93 194 103" fill="#a0aec0" /><line x1="158" y1="116" x2="204" y2="116" stroke="#a0aec0" stroke-width="1.6" /><polygon points="204 116 194 111 194 121" fill="#a0aec0" /><line x1="158" y1="134" x2="204" y2="134" stroke="#a0aec0" stroke-width="1.6" /><polygon points="204 134 194 129 194 139" fill="#a0aec0" /><rect x="206" y="86" width="238" height="24" rx="6" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.2" /><text x="218" y="102" font-size="9" fill="#6b46c1">↻  loop: research shop A</text><rect x="206" y="114" width="238" height="24" rx="6" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.2" /><text x="218" y="130" font-size="9" fill="#6b46c1">↻  loop: research shop B</text><rect x="206" y="142" width="238" height="20" rx="6" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.2" /><text x="218" y="157" font-size="9" fill="#6b46c1">↻  loop: research shop C</text><line x1="444" y1="116" x2="490" y2="116" stroke="#a0aec0" stroke-width="1.6" /><polygon points="490 116 480 111 480 121" fill="#a0aec0" /><rect x="492" y="80" width="150" height="72" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="567" y="108" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">Collect &amp; assemble</text><text x="567" y="126" text-anchor="middle" font-size="8" fill="#2f855a">then check the whole</text><rect x="24" y="182" width="712" height="104" rx="10" fill="#fbfdff" stroke="#cbd5e0" stroke-width="1.2" /><text x="40" y="204" font-size="11.5" font-weight="700" fill="#6b46c1">Handoff chain — pass between specialists</text><rect x="40" y="216" width="150" height="52" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="115" y="238" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">↻ Research loop</text><text x="115" y="254" text-anchor="middle" font-size="8" fill="#805ad5">find the facts</text><line x1="190" y1="242" x2="224" y2="242" stroke="#a0aec0" stroke-width="1.8" /><polygon points="224 242 214 237 214 247" fill="#a0aec0" /><rect x="226" y="216" width="150" height="52" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="301" y="238" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">↻ Draft loop</text><text x="301" y="254" text-anchor="middle" font-size="8" fill="#805ad5">write it up</text><line x1="376" y1="242" x2="410" y2="242" stroke="#a0aec0" stroke-width="1.8" /><polygon points="410 242 400 237 400 247" fill="#a0aec0" /><rect x="412" y="216" width="150" height="52" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="487" y="238" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">↻ Edit loop</text><text x="487" y="254" text-anchor="middle" font-size="8" fill="#805ad5">polish &amp; check</text><line x1="562" y1="242" x2="596" y2="242" stroke="#48bb78" stroke-width="1.8" /><polygon points="596 242 586 237 586 247" fill="#48bb78" /><rect x="598" y="220" width="120" height="44" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="658" y="247" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Done</text><text x="380" y="312" text-anchor="middle" font-size="10.5" fill="#718096">Parallel for independent parts done at once; a handoff chain when each step needs a different role.</text><text x="380" y="330" text-anchor="middle" font-size="10.5" fill="#718096">Every sub-loop still needs its own goal and check — and someone must check the assembled whole.</text></svg>
