<svg xmlns="http://www.w3.org/2000/svg" width="760" height="336" viewBox="0 0 760 336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="336" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Draft → critique → revise: the everyday loop, finally named</text><rect x="60" y="86" width="180" height="64" rx="11" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="150" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">Draft</text><text x="150" y="132" text-anchor="middle" font-size="9" fill="#3182ce">produce a first attempt</text><line x1="240" y1="118" x2="452" y2="118" stroke="#a0aec0" stroke-width="2" /><polygon points="452 118 442 113 442 123" fill="#a0aec0" /><rect x="454" y="80" width="220" height="76" rx="12" fill="#fffaf0" stroke="#ed8936" stroke-width="2.4" /><text x="564" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">Critique</text><text x="564" y="125" text-anchor="middle" font-size="9" fill="#9c4221">find what's wrong — this IS the check</text><text x="564" y="139" text-anchor="middle" font-size="8.5" fill="#dd6b20">(Module 3: named criteria, fresh eyes)</text><line x1="500" y1="156" x2="420" y2="216" stroke="#a0aec0" stroke-width="2" /><polygon points="420 216 429 209 431 218" fill="#a0aec0" /><text x="500" y="192" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c53030">flaws found</text><rect x="270" y="220" width="200" height="64" rx="11" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="370" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">Revise</text><text x="370" y="266" text-anchor="middle" font-size="9" fill="#2f855a">fix exactly what the critique found</text><path d="M470 252 Q560 252 560 158" fill="none" stroke="#9f7aea" stroke-width="1.8" stroke-dasharray="5 3" /><polygon points="560 158 555 168 565 168" fill="#9f7aea" /><text x="586" y="210" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6b46c1">critique again</text><line x1="618" y1="156" x2="632" y2="216" stroke="#48bb78" stroke-width="2" /><polygon points="632 216 630 205 624 210" fill="#48bb78" /><rect x="574" y="220" width="130" height="64" rx="11" fill="#f0fff4" stroke="#48bb78" stroke-width="1.8" /><text x="639" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Done</text><text x="639" y="266" text-anchor="middle" font-size="8" fill="#2f855a">nothing important left</text><text x="380" y="312" text-anchor="middle" font-size="10.5" fill="#718096">One doer drafts; a critic finds flaws (the check); the doer revises — repeat until the critique turns up nothing that matters.</text><text x="380" y="330" text-anchor="middle" font-size="10.5" fill="#718096">No tools needed — it runs in a plain chat. Strongest when the critic has fresh eyes: the two-hat split from Module 3.</text></svg>
