<svg xmlns="http://www.w3.org/2000/svg" width="760" height="336" viewBox="0 0 760 336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="336" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Generate and test: make several candidates, let the check pick the best</text><rect x="24" y="130" width="120" height="64" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="84" y="158" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">Goal</text><text x="84" y="176" text-anchor="middle" font-size="8.5" fill="#3182ce">one prompt</text><line x1="144" y1="150" x2="184" y2="96" stroke="#a0aec0" stroke-width="1.7" /><polygon points="184 96 173 99 178 106" fill="#a0aec0" /><line x1="144" y1="162" x2="184" y2="162" stroke="#a0aec0" stroke-width="1.7" /><polygon points="184 162 174 157 174 167" fill="#a0aec0" /><line x1="144" y1="174" x2="184" y2="228" stroke="#a0aec0" stroke-width="1.7" /><polygon points="184 228 178 218 173 226" fill="#a0aec0" /><text x="150" y="118" font-size="8" fill="#805ad5">generate N diverse</text><rect x="186" y="72" width="180" height="48" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="200" y="92" font-size="10.5" font-weight="700" fill="#6b46c1">Candidate A</text><text x="200" y="108" font-size="8.5" fill="#805ad5">an independent attempt</text><rect x="186" y="138" width="180" height="48" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="200" y="158" font-size="10.5" font-weight="700" fill="#6b46c1">Candidate B</text><text x="200" y="174" font-size="8.5" fill="#805ad5">an independent attempt</text><rect x="186" y="204" width="180" height="48" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="200" y="224" font-size="10.5" font-weight="700" fill="#6b46c1">Candidate C</text><text x="200" y="240" font-size="8.5" fill="#805ad5">an independent attempt</text><text x="452" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621">Test — score each</text><text x="452" y="73" text-anchor="middle" font-size="8" fill="#9c4221">against your check</text><line x1="366" y1="96" x2="410" y2="96" stroke="#a0aec0" stroke-width="1.6" /><polygon points="410 96 400 91 400 101" fill="#a0aec0" /><text x="452" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#718096">6 / 10</text><line x1="366" y1="162" x2="410" y2="162" stroke="#48bb78" stroke-width="1.8" /><polygon points="410 162 400 157 400 167" fill="#48bb78" /><text x="452" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">9 / 10 ✓</text><line x1="366" y1="228" x2="410" y2="228" stroke="#a0aec0" stroke-width="1.6" /><polygon points="410 228 400 223 400 233" fill="#a0aec0" /><text x="452" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#718096">5 / 10</text><line x1="494" y1="162" x2="556" y2="162" stroke="#48bb78" stroke-width="2" /><polygon points="556 162 546 157 546 167" fill="#48bb78" /><rect x="558" y="130" width="176" height="64" rx="11" fill="#f0fff4" stroke="#48bb78" stroke-width="1.8" /><text x="646" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Winner: Candidate B</text><text x="646" y="176" text-anchor="middle" font-size="8.5" fill="#2f855a">then polish it (draft-critique-revise)</text><text x="380" y="288" text-anchor="middle" font-size="10.5" fill="#718096">Use it when the first attempt is a coin flip — creative, naming, brainstorming. Diverse candidates beat polishing one.</text><text x="380" y="306" text-anchor="middle" font-size="10.5" fill="#718096">Serial (draft-critique-revise) improves one attempt; parallel (generate-and-test) explores many, then picks — often combine both.</text></svg>
