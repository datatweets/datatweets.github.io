<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="340" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Plan then execute: break a big task into a plan, then loop on each step</text><rect x="24" y="120" width="120" height="70" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="84" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">Big task</text><text x="84" y="168" text-anchor="middle" font-size="8.5" fill="#3182ce">too big for one draft</text><line x1="144" y1="155" x2="176" y2="155" stroke="#a0aec0" stroke-width="2" /><polygon points="176 155 166 150 166 160" fill="#a0aec0" /><rect x="178" y="86" width="196" height="140" rx="11" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.8" /><text x="276" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">1 · Plan</text><text x="276" y="126" text-anchor="middle" font-size="8.5" fill="#805ad5">break it into ordered steps</text><rect x="196" y="136" width="160" height="20" rx="4" fill="#ffffff" stroke="#e9d8fd" stroke-width="1" /><text x="206" y="150" font-size="9" fill="#4a5568">☐ Step 1 — gather</text><rect x="196" y="160" width="160" height="20" rx="4" fill="#ffffff" stroke="#e9d8fd" stroke-width="1" /><text x="206" y="174" font-size="9" fill="#4a5568">☐ Step 2 — draft</text><rect x="196" y="184" width="160" height="20" rx="4" fill="#ffffff" stroke="#e9d8fd" stroke-width="1" /><text x="206" y="198" font-size="9" fill="#4a5568">☐ Step 3 — assemble</text><text x="276" y="219" text-anchor="middle" font-size="8" font-style="italic" fill="#c05621">review the plan before running it</text><line x1="374" y1="155" x2="406" y2="155" stroke="#a0aec0" stroke-width="2" /><polygon points="406 155 396 150 396 160" fill="#a0aec0" /><rect x="408" y="82" width="220" height="150" rx="11" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="518" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">2 · Execute each step</text><rect x="424" y="116" width="188" height="30" rx="6" fill="#ffffff" stroke="#c6f6d5" stroke-width="1.1" /><text x="438" y="135" font-size="9.5" fill="#276749">↻  Step 1 — its own small loop</text><rect x="424" y="152" width="188" height="30" rx="6" fill="#ffffff" stroke="#c6f6d5" stroke-width="1.1" /><text x="438" y="171" font-size="9.5" fill="#276749">↻  Step 2 — draft, critique, revise</text><rect x="424" y="188" width="188" height="30" rx="6" fill="#ffffff" stroke="#c6f6d5" stroke-width="1.1" /><text x="438" y="207" font-size="9.5" fill="#276749">↻  Step 3 — its own small loop</text><line x1="628" y1="155" x2="660" y2="155" stroke="#a0aec0" stroke-width="2" /><polygon points="660 155 650 150 650 160" fill="#a0aec0" /><rect x="662" y="122" width="76" height="66" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.8" /><text x="700" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Done</text><text x="700" y="167" text-anchor="middle" font-size="7.5" fill="#2f855a">assembled</text><text x="380" y="266" text-anchor="middle" font-size="10.5" fill="#718096">Each step is small enough for a focused loop of its own, and you can check the plan before any work starts.</text><text x="380" y="284" text-anchor="middle" font-size="10.5" fill="#718096">That makes it more predictable — and safer — than deciding the next move on the fly as content streams in.</text></svg>
