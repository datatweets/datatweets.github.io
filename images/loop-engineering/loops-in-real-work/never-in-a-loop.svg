<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="344" fill="#ffffff" /><text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Before you paste anything, ask: could I live with this being public?</text><rect x="150" y="44" width="460" height="34" rx="17" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="380" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">The one test: treat anything you paste as potentially leaving your control.</text><rect x="30" y="94" width="344" height="196" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.6" /><text x="48" y="118" font-size="12.5" font-weight="700" fill="#c53030">Never goes into a loop</text><text x="48" y="144" font-size="9.5" fill="#9b2c2c">✗ passwords, API keys, credentials</text><text x="48" y="170" font-size="9.5" fill="#9b2c2c">✗ customer or personal data —</text><text x="62" y="184" font-size="9.5" fill="#9b2c2c">names, emails, phone numbers, IDs</text><text x="48" y="210" font-size="9.5" fill="#9b2c2c">✗ confidential, legal, or</text><text x="62" y="224" font-size="9.5" fill="#9b2c2c">proprietary documents</text><text x="48" y="250" font-size="9.5" fill="#9b2c2c">✗ anything you couldn't un-share</text><text x="48" y="276" font-size="8.5" font-style="italic" fill="#c53030">once it's in, you can't take it back</text><rect x="388" y="94" width="344" height="196" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="406" y="118" font-size="12.5" font-weight="700" fill="#276749">If you must use sensitive data</text><text x="406" y="144" font-size="9.5" fill="#2f855a">✓ redact or anonymize the sensitive</text><text x="420" y="158" font-size="9.5" fill="#2f855a">parts first (swap real names/numbers)</text><text x="406" y="184" font-size="9.5" fill="#2f855a">✓ check the tool's data policy —</text><text x="420" y="198" font-size="9.5" fill="#2f855a">how it uses what you send</text><text x="406" y="224" font-size="9.5" fill="#2f855a">✓ prefer a business / enterprise plan</text><text x="420" y="238" font-size="9.5" fill="#2f855a">for anything work-sensitive</text><text x="406" y="264" font-size="9.5" font-weight="700" fill="#276749">✓ when in doubt, keep it out</text><text x="380" y="314" text-anchor="middle" font-size="10.5" fill="#718096">And mind the cost: each run spends a little, so a scheduled or automated loop's small per-run cost adds up — budget it (Module 6).</text></svg>
