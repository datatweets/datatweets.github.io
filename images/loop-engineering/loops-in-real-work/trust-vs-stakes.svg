<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="344" fill="#ffffff" /><text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Calibrate how much you check yourself to the cost of being wrong</text><text x="40" y="56" font-size="10" font-weight="700" fill="#276749">◀ low stakes · trust the loop</text><text x="720" y="56" text-anchor="end" font-size="10" font-weight="700" fill="#c53030">high stakes · verify yourself ▶</text><rect x="40" y="62" width="680" height="7" rx="3.5" fill="#e2e8f0" /><rect x="40" y="62" width="200" height="7" rx="3.5" fill="#9ae6b4" /><rect x="520" y="62" width="200" height="7" rx="3.5" fill="#fbb6b6" /><rect x="30" y="86" width="225" height="92" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="142" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Low stakes</text><text x="142" y="130" text-anchor="middle" font-size="9" fill="#2f855a">a note, a rough draft, a brainstorm</text><text x="142" y="154" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">Trust the loop's check</text><text x="142" y="168" text-anchor="middle" font-size="8.5" fill="#2f855a">and ship it</text><rect x="268" y="86" width="225" height="92" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="380" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">Medium</text><text x="380" y="130" text-anchor="middle" font-size="9" fill="#9c4221">internal, and easy to fix later</text><text x="380" y="154" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c05621">Spot-check the key parts</text><text x="380" y="168" text-anchor="middle" font-size="8.5" fill="#9c4221">a quick glance at what matters</text><rect x="506" y="86" width="224" height="92" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.6" /><text x="618" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#c53030">High stakes</text><text x="618" y="130" text-anchor="middle" font-size="9" fill="#9b2c2c">public, irreversible, costly if wrong</text><text x="618" y="154" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">Verify it yourself</text><text x="618" y="168" text-anchor="middle" font-size="8.5" fill="#9b2c2c">before you rely on it</text><rect x="30" y="192" width="700" height="94" rx="10" fill="#fbfdff" stroke="#cbd5e0" stroke-width="1.3" /><text x="48" y="214" font-size="11.5" font-weight="700" fill="#4a5568">Always verify yourself, whatever the loop's check said:</text><text x="48" y="236" font-size="9.5" fill="#4a5568">● facts you'll be held to      ● anything public or irreversible (sent, published, deleted, paid)</text><text x="48" y="256" font-size="9.5" fill="#4a5568">● legal, financial, or medical content      ● anything that would embarrass or harm if it's wrong</text><text x="48" y="276" font-size="9" font-style="italic" fill="#718096">A loop's "done" is a claim, not proof (Module 3) — for these, you are the final check, every time.</text><text x="380" y="316" text-anchor="middle" font-size="10.5" fill="#718096">Trust is earned per task-type over time: once a loop proves reliable on a kind of work, you can check it less — but never these.</text></svg>
