<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" viewBox="0 0 760 352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="352" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">A recipe gathers a whole working loop into one reusable card</text><rect x="130" y="52" width="500" height="266" rx="10" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.4" /><rect x="130" y="52" width="500" height="34" rx="10" fill="#276749" /><rect x="130" y="70" width="500" height="16" fill="#276749" /><text x="150" y="74" font-size="12" font-weight="700" fill="#ffffff">LOOP RECIPE · Weekly newsletter</text><text x="610" y="74" text-anchor="end" font-size="8.5" fill="#c6f6d5">save · name · reuse</text><text x="150" y="110" font-size="10.5" font-weight="700" fill="#2b6cb0">Goal</text><text x="150" y="123" font-size="8.5" fill="#4a5568">a ready-to-send weekly newsletter</text><text x="600" y="116" text-anchor="end" font-size="7.5" font-style="italic" fill="#a0aec0">Module 2</text><line x1="146" y1="132" x2="614" y2="132" stroke="#edf2f7" stroke-width="1" /><text x="150" y="150" font-size="10.5" font-weight="700" fill="#c05621">Definition of done (the check)</text><text x="150" y="163" font-size="8.5" fill="#4a5568">≤250 words · this week's event · in-stock titles · warm tone</text><text x="600" y="156" text-anchor="end" font-size="7.5" font-style="italic" fill="#a0aec0">Module 3</text><line x1="146" y1="172" x2="614" y2="172" stroke="#edf2f7" stroke-width="1" /><text x="150" y="190" font-size="10.5" font-weight="700" fill="#6b46c1">Pattern</text><text x="150" y="203" font-size="8.5" fill="#4a5568">draft → critique (fresh eyes) → revise</text><text x="600" y="196" text-anchor="end" font-size="7.5" font-style="italic" fill="#a0aec0">Module 7</text><line x1="146" y1="212" x2="614" y2="212" stroke="#edf2f7" stroke-width="1" /><text x="150" y="230" font-size="10.5" font-weight="700" fill="#c53030">Stop conditions</text><text x="150" y="243" font-size="8.5" fill="#4a5568">all criteria met, or after 5 rounds</text><text x="600" y="236" text-anchor="end" font-size="7.5" font-style="italic" fill="#a0aec0">Module 6</text><line x1="146" y1="252" x2="614" y2="252" stroke="#edf2f7" stroke-width="1" /><text x="150" y="270" font-size="10.5" font-weight="700" fill="#3182ce">Where to run it</text><text x="150" y="283" font-size="8.5" fill="#4a5568">Claude Project "Harborlight Newsletter" (brief + files loaded)</text><text x="600" y="276" text-anchor="end" font-size="7.5" font-style="italic" fill="#a0aec0">Modules 4–5</text><line x1="146" y1="292" x2="614" y2="292" stroke="#edf2f7" stroke-width="1" /><text x="150" y="309" font-size="10.5" font-weight="700" fill="#718096">Always check yourself</text><text x="330" y="309" font-size="8.5" fill="#4a5568">the facts and the event date</text><text x="600" y="309" text-anchor="end" font-size="7.5" font-style="italic" fill="#a0aec0">Module 8</text><text x="380" y="340" text-anchor="middle" font-size="10.5" fill="#718096">Write it once and a loop you got right becomes a standing asset — rerun it in minutes, and hand it to a teammate intact.</text></svg>
