<svg xmlns="http://www.w3.org/2000/svg" width="760" height="366" viewBox="0 0 760 366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="366" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The capstone: one real loop, built from every module</text><path d="M120 74 H600" fill="none" stroke="#9f7aea" stroke-width="1.4" /><path d="M120 74 V82" stroke="#9f7aea" stroke-width="1.4" /><path d="M600 74 V82" stroke="#9f7aea" stroke-width="1.4" /><text x="360" y="68" text-anchor="middle" font-size="9" font-weight="700" fill="#6b46c1">the shape you chose — a pattern (Module 7)</text><rect x="24" y="96" width="150" height="66" rx="11" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="99" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Brief</text><text x="99" y="139" text-anchor="middle" font-size="8.5" fill="#3182ce">goal + boundaries</text><text x="99" y="153" text-anchor="middle" font-size="8" font-style="italic" fill="#a0aec0">Module 2</text><line x1="174" y1="129" x2="204" y2="129" stroke="#a0aec0" stroke-width="2" /><polygon points="204 129 194 124 194 134" fill="#a0aec0" /><rect x="206" y="96" width="160" height="66" rx="11" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="286" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">Attempt</text><text x="286" y="139" text-anchor="middle" font-size="8.5" fill="#805ad5">in your tool</text><text x="286" y="153" text-anchor="middle" font-size="8" font-style="italic" fill="#a0aec0">browser (M4) or agent (M5)</text><line x1="366" y1="129" x2="396" y2="129" stroke="#a0aec0" stroke-width="2" /><polygon points="396 129 386 124 386 134" fill="#a0aec0" /><rect x="398" y="90" width="152" height="78" rx="12" fill="#fffaf0" stroke="#ed8936" stroke-width="2.4" /><text x="474" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">Check</text><text x="474" y="133" text-anchor="middle" font-size="8.5" fill="#9c4221">rubric · honest · anchored</text><text x="474" y="147" text-anchor="middle" font-size="8" font-style="italic" fill="#dd6b20">Module 3</text><path d="M420 168 Q286 210 286 164" fill="none" stroke="#fc8181" stroke-width="1.7" stroke-dasharray="5 3" /><polygon points="286 164 281 174 291 174" fill="#fc8181" /><text x="352" y="196" text-anchor="middle" font-size="8" font-weight="700" fill="#c53030">not done → correct &amp; retry</text><line x1="550" y1="129" x2="580" y2="129" stroke="#48bb78" stroke-width="2" /><polygon points="580 129 570 124 570 134" fill="#48bb78" /><rect x="582" y="96" width="150" height="66" rx="11" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="657" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Stop</text><text x="657" y="139" text-anchor="middle" font-size="8.5" fill="#2f855a">success or a limit</text><text x="657" y="153" text-anchor="middle" font-size="8" font-style="italic" fill="#a0aec0">Module 6</text><rect x="24" y="182" width="708" height="26" rx="7" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.1" /><text x="378" y="199" text-anchor="middle" font-size="9" fill="#4a5568">…and you kept a trace of every round — the log you can read back (Module 6)</text><rect x="24" y="222" width="708" height="66" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="44" y="244" font-size="11" font-weight="700" fill="#276749">Your deliverable — for a real task from your own work:</text><text x="44" y="266" font-size="9.5" fill="#2f855a">✓ a written brief    ✓ a check / rubric    ✓ stop conditions    ✓ a trace of the run</text><text x="44" y="281" font-size="8.5" font-style="italic" fill="#718096">used responsibly — trust calibrated, private data kept out, captured as a recipe (Module 8)</text><text x="380" y="316" text-anchor="middle" font-size="10.5" fill="#718096">Build this and you've proven the whole course: you can engineer a loop, not just run one.</text><text x="380" y="334" text-anchor="middle" font-size="10.5" fill="#718096">Two forms welcome — browser-only, or extended with a file agent. Either is a complete capstone.</text></svg>
