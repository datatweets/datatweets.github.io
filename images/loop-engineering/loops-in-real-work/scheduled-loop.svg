<svg xmlns="http://www.w3.org/2000/svg" width="760" height="336" viewBox="0 0 760 336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="336" fill="#ffffff" /><text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Schedule the work — but keep a human on the release</text><rect x="24" y="44" width="712" height="104" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.4" /><text x="40" y="66" font-size="11" font-weight="700" fill="#c53030">Risky · full auto-publish</text><rect x="38" y="78" width="118" height="52" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="97" y="100" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">⏱ Every week</text><text x="97" y="116" text-anchor="middle" font-size="8" fill="#3182ce">runs on a schedule</text><line x1="156" y1="104" x2="186" y2="104" stroke="#a0aec0" stroke-width="1.8" /><polygon points="186 104 176 99 176 109" fill="#a0aec0" /><rect x="188" y="78" width="130" height="52" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="253" y="100" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">Loop runs itself</text><text x="253" y="116" text-anchor="middle" font-size="8" fill="#805ad5">no one watching</text><line x1="318" y1="104" x2="348" y2="104" stroke="#a0aec0" stroke-width="1.8" /><polygon points="348 104 338 99 338 109" fill="#a0aec0" /><rect x="350" y="78" width="130" height="52" rx="9" fill="#fff5f5" stroke="#fc8181" stroke-width="1.6" /><text x="415" y="100" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c53030">Auto-publishes</text><text x="415" y="116" text-anchor="middle" font-size="8" fill="#9b2c2c">straight to customers</text><text x="500" y="98" font-size="9" font-weight="700" fill="#c53030">✗ a mistake ships every time,</text><text x="500" y="112" font-size="9" font-weight="700" fill="#c53030">   silently — and cost × frequency piles up</text><rect x="24" y="160" width="712" height="112" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="40" y="182" font-size="11" font-weight="700" fill="#276749">Safe · auto-draft, human release</text><rect x="38" y="194" width="108" height="52" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="92" y="216" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">⏱ Every week</text><text x="92" y="231" text-anchor="middle" font-size="7.5" fill="#3182ce">on a schedule</text><line x1="146" y1="220" x2="172" y2="220" stroke="#a0aec0" stroke-width="1.7" /><polygon points="172 220 162 215 162 225" fill="#a0aec0" /><rect x="174" y="194" width="118" height="52" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="233" y="216" text-anchor="middle" font-size="10" font-weight="700" fill="#6b46c1">Loop runs</text><text x="233" y="231" text-anchor="middle" font-size="7.5" fill="#805ad5">self-checks its work</text><line x1="292" y1="220" x2="318" y2="220" stroke="#a0aec0" stroke-width="1.7" /><polygon points="318 220 308 215 308 225" fill="#a0aec0" /><rect x="320" y="194" width="104" height="52" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" /><text x="372" y="216" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621">Draft ready</text><text x="372" y="231" text-anchor="middle" font-size="7.5" fill="#9c4221">waits for you</text><line x1="424" y1="220" x2="450" y2="220" stroke="#a0aec0" stroke-width="1.7" /><polygon points="450 220 440 215 440 225" fill="#a0aec0" /><rect x="452" y="192" width="130" height="56" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="2.2" /><text x="517" y="214" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">🙋 You review</text><text x="517" y="230" text-anchor="middle" font-size="7.5" fill="#3182ce">the human release gate</text><line x1="582" y1="220" x2="608" y2="220" stroke="#48bb78" stroke-width="1.8" /><polygon points="608 220 598 215 598 225" fill="#48bb78" /><rect x="610" y="194" width="112" height="52" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="666" y="216" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">Publish / fix</text><text x="666" y="231" text-anchor="middle" font-size="7.5" fill="#2f855a">on your say-so</text><text x="380" y="300" text-anchor="middle" font-size="10.5" fill="#718096">An unwatched loop needs MORE guardrails, not fewer: a strong self-check, stop conditions, and a review gate before anything high-stakes ships.</text><text x="380" y="318" text-anchor="middle" font-size="10.5" fill="#718096">Automate the tedious work; reserve the "send" button for a human — especially for public or irreversible output.</text></svg>
