<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="330" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Three boundaries keep a loop fixing what you actually meant</text><rect x="30" y="66" width="225" height="188" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="142" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">Scope</text><text x="142" y="108" text-anchor="middle" font-size="9.5" fill="#3182ce">where the loop may work</text><text x="46" y="138" font-size="10" fill="#276749">✓ the newsletter body text</text><text x="46" y="162" font-size="10" fill="#c53030">✗ the subscriber list</text><text x="46" y="186" font-size="10" fill="#c53030">✗ the email template</text><text x="142" y="222" text-anchor="middle" font-size="8.5" fill="#3182ce">"work on this, not that"</text><rect x="268" y="66" width="225" height="188" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="380" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">Constraints</text><text x="380" y="108" text-anchor="middle" font-size="9.5" fill="#9c4221">rules it must obey</text><text x="284" y="138" font-size="10" fill="#9c4221">• under 250 words</text><text x="284" y="162" font-size="10" fill="#9c4221">• no discount codes</text><text x="284" y="186" font-size="10" fill="#9c4221">• only in-stock titles</text><text x="380" y="222" text-anchor="middle" font-size="8.5" fill="#c05621">"follow these rules"</text><rect x="506" y="66" width="224" height="188" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.6" /><text x="618" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">Non-goals</text><text x="618" y="108" text-anchor="middle" font-size="9.5" fill="#c53030">what to leave alone</text><text x="522" y="138" font-size="10" fill="#9b2c2c">• don't touch the logo</text><text x="522" y="162" font-size="10" fill="#9b2c2c">• don't redesign the layout</text><text x="522" y="186" font-size="10" fill="#9b2c2c">• don't change the sign-off</text><text x="618" y="222" text-anchor="middle" font-size="8.5" fill="#c53030">"do not improve this"</text><text x="380" y="286" text-anchor="middle" font-size="10.5" fill="#718096">Scope says where to work, constraints say which rules to follow, non-goals say what not to touch.</text><text x="380" y="304" text-anchor="middle" font-size="10.5" fill="#718096">Without them, a loop "improves" things you never asked it to — the drift you met in Module 1.</text></svg>
