<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="360" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">One brief captures a finishable goal — fill it once, reuse it every loop</text><rect x="140" y="54" width="480" height="256" rx="10" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.4" /><rect x="140" y="54" width="480" height="34" rx="10" fill="#2b6cb0" /><rect x="140" y="72" width="480" height="16" fill="#2b6cb0" /><text x="160" y="76" font-size="13" font-weight="700" fill="#ffffff">THE BRIEF</text><text x="600" y="76" text-anchor="end" font-size="9" fill="#bee3f8">reusable template</text><text x="160" y="112" font-size="11" font-weight="700" fill="#2b6cb0">Context</text><text x="330" y="112" font-size="9.5" fill="#718096">who and what it's for</text><line x1="150" y1="124" x2="610" y2="124" stroke="#edf2f7" stroke-width="1" /><text x="160" y="146" font-size="11" font-weight="700" fill="#2b6cb0">Goal</text><text x="330" y="146" font-size="9.5" fill="#718096">the outcome, in one line</text><line x1="150" y1="158" x2="610" y2="158" stroke="#edf2f7" stroke-width="1" /><text x="160" y="180" font-size="11" font-weight="700" fill="#276749">Definition of done</text><text x="330" y="180" font-size="9.5" fill="#718096">the checklist that means "finished"</text><line x1="150" y1="192" x2="610" y2="192" stroke="#edf2f7" stroke-width="1" /><text x="160" y="214" font-size="11" font-weight="700" fill="#3182ce">Scope</text><text x="330" y="214" font-size="9.5" fill="#718096">where the loop may work</text><line x1="150" y1="226" x2="610" y2="226" stroke="#edf2f7" stroke-width="1" /><text x="160" y="248" font-size="11" font-weight="700" fill="#c05621">Constraints</text><text x="330" y="248" font-size="9.5" fill="#718096">hard rules, every attempt</text><line x1="150" y1="260" x2="610" y2="260" stroke="#edf2f7" stroke-width="1" /><text x="160" y="282" font-size="11" font-weight="700" fill="#c53030">Non-goals</text><text x="330" y="282" font-size="9.5" fill="#718096">what to leave alone</text><text x="380" y="336" text-anchor="middle" font-size="10.5" fill="#718096">The brief gathers Lessons 1–3 into one place. Paste it at the top of a loop and both you and the AI</text><text x="380" y="352" text-anchor="middle" font-size="10.5" fill="#718096">share the same finish line — no reconstructing a good goal from memory every time.</text></svg>
