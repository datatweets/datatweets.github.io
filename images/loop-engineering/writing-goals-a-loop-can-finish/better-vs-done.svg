<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="380" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">"Make it better" has no finish line; a definition of done does</text><text x="30" y="70" font-size="12" font-weight="700" fill="#c53030">Vague goal · "make it better"</text><rect x="30" y="82" width="150" height="50" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.6" /><text x="105" y="103" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c53030">Make it better</text><text x="105" y="119" text-anchor="middle" font-size="8.5" fill="#c53030">a direction, not a target</text><line x1="180" y1="107" x2="216" y2="107" stroke="#a0aec0" stroke-width="2" /><polygon points="216 107 206 102 206 112" fill="#a0aec0" /><rect x="218" y="82" width="150" height="50" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="293" y="103" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c05621">Is it better?</text><text x="293" y="119" text-anchor="middle" font-size="8.5" fill="#9c4221">better than what?</text><path d="M293 82C293 52 105 52 105 80" fill="none" stroke="#fc8181" stroke-width="1.8" stroke-dasharray="5 3" /><polygon points="105 80 100 70 110 70" fill="#fc8181" /><text x="199" y="46" text-anchor="middle" font-size="9" font-weight="700" fill="#c53030">always "a bit more" — loops back forever</text><line x1="368" y1="107" x2="470" y2="107" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 4" /><rect x="472" y="82" width="150" height="50" rx="10" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="4 3" /><text x="547" y="103" text-anchor="middle" font-size="11.5" font-weight="700" fill="#cbd5e0">Stop</text><text x="547" y="119" text-anchor="middle" font-size="8.5" fill="#cbd5e0">never reached</text><line x1="640" y1="90" x2="664" y2="124" stroke="#fc8181" stroke-width="2.5" /><line x1="664" y1="90" x2="640" y2="124" stroke="#fc8181" stroke-width="2.5" /><line x1="40" y1="168" x2="720" y2="168" stroke="#edf2f7" stroke-width="1.5" /><text x="30" y="204" font-size="12" font-weight="700" fill="#276749">Definition of done · checkable</text><rect x="30" y="216" width="200" height="80" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="130" y="235" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">Definition of done</text><text x="44" y="252" font-size="9" fill="#2f855a">✓ under 250 words</text><text x="44" y="266" font-size="9" fill="#2f855a">✓ names this week's event</text><text x="44" y="280" font-size="9" fill="#2f855a">✓ only real, in-stock titles</text><text x="44" y="294" font-size="9" fill="#2f855a">✓ warm, on-brand tone</text><line x1="230" y1="256" x2="266" y2="256" stroke="#a0aec0" stroke-width="2" /><polygon points="266 256 256 251 256 261" fill="#a0aec0" /><rect x="268" y="231" width="150" height="50" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="343" y="252" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c05621">All four ticked?</text><text x="343" y="268" text-anchor="middle" font-size="8.5" fill="#9c4221">a clear yes or no</text><line x1="418" y1="256" x2="472" y2="256" stroke="#48bb78" stroke-width="2" /><polygon points="472 256 462 251 462 261" fill="#48bb78" /><text x="445" y="249" text-anchor="middle" font-size="8.5" font-weight="700" fill="#276749">yes</text><rect x="474" y="231" width="150" height="50" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.8" /><text x="549" y="252" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">Stop — done</text><text x="549" y="268" text-anchor="middle" font-size="8.5" fill="#2f855a">the loop can finish</text><text x="380" y="332" text-anchor="middle" font-size="10.5" fill="#718096">A check needs something to compare against. "Better" gives it nothing, so the answer is always "a little more."</text><text x="380" y="350" text-anchor="middle" font-size="10.5" fill="#718096">A definition of done gives the check a target, so it can finally return "yes" — and the loop stops.</text></svg>
