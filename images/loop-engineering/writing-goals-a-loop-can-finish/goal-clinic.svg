<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="350" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The clinic: diagnose the same three faults, then rewrite as a brief</text><rect x="24" y="66" width="300" height="228" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" /><text x="174" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#c53030">Before · a vague request</text><text x="174" y="120" text-anchor="middle" font-size="11" font-style="italic" fill="#9b2c2c">"Can you make our welcome</text><text x="174" y="136" text-anchor="middle" font-size="11" font-style="italic" fill="#9b2c2c">email a bit nicer?"</text><text x="40" y="176" font-size="9.5" fill="#c53030">✗ "nicer" — a direction, no finish line</text><text x="40" y="202" font-size="9.5" fill="#c53030">✗ nothing concrete to check against</text><text x="40" y="228" font-size="9.5" fill="#c53030">✗ no scope, constraints, or non-goals</text><text x="174" y="268" text-anchor="middle" font-size="9" fill="#9b2c2c">a loop can't finish this</text><line x1="332" y1="180" x2="428" y2="180" stroke="#a0aec0" stroke-width="2.5" /><polygon points="428 180 415 173 415 187" fill="#a0aec0" /><text x="380" y="170" text-anchor="middle" font-size="9" font-weight="700" fill="#718096">diagnose</text><text x="380" y="200" text-anchor="middle" font-size="9" font-weight="700" fill="#718096">&amp; rewrite</text><rect x="436" y="66" width="300" height="228" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="586" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">After · a brief that finishes</text><text x="452" y="116" font-size="9.5" fill="#276749"><tspan font-weight="700">Goal:</tspan> a warm welcome email for new</text><text x="452" y="130" font-size="9.5" fill="#276749">subscribers</text><text x="452" y="154" font-size="9.5" fill="#276749"><tspan font-weight="700">Done:</tspan> ✓ under 120 words ✓ names our</text><text x="452" y="168" font-size="9.5" fill="#276749">next event ✓ warm, first-name tone</text><text x="452" y="192" font-size="9.5" fill="#276749"><tspan font-weight="700">Scope:</tspan> the email body text</text><text x="452" y="216" font-size="9.5" fill="#276749"><tspan font-weight="700">Constraints:</tspan> no discount codes</text><text x="452" y="240" font-size="9.5" fill="#276749"><tspan font-weight="700">Non-goals:</tspan> don't change the signature</text><text x="586" y="272" text-anchor="middle" font-size="9" fill="#2f855a">a loop can finish this</text><text x="380" y="322" text-anchor="middle" font-size="10.5" fill="#718096">Every vague request fails the same three ways: no finish line, nothing to check, no boundaries.</text><text x="380" y="340" text-anchor="middle" font-size="10.5" fill="#718096">The brief you built in Lessons 1–4 fixes all three at once — that's the whole clinic.</text></svg>
