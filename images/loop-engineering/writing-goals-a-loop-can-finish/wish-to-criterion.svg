<svg xmlns="http://www.w3.org/2000/svg" width="760" height="336" viewBox="0 0 760 336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="336" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">A definition of done turns each wish into a criterion you can tick</text><text x="150" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#c53030">Vague wish</text><text x="410" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Checkable criterion</text><text x="663" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">How you check</text><rect x="40" y="72" width="220" height="46" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.3" /><text x="150" y="100" text-anchor="middle" font-size="10.5" fill="#c53030">"keep it short"</text><rect x="280" y="72" width="300" height="46" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.3" /><text x="430" y="100" text-anchor="middle" font-size="10.5" fill="#276749">under 250 words</text><text x="663" y="100" text-anchor="middle" font-size="9.5" fill="#4a5568">count them ✓</text><rect x="40" y="124" width="220" height="46" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.3" /><text x="150" y="152" text-anchor="middle" font-size="10.5" fill="#c53030">"mention the event"</text><rect x="280" y="124" width="300" height="46" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.3" /><text x="430" y="152" text-anchor="middle" font-size="10.5" fill="#276749">names Saturday's poetry night</text><text x="663" y="152" text-anchor="middle" font-size="9.5" fill="#4a5568">look for it ✓</text><rect x="40" y="176" width="220" height="46" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.3" /><text x="150" y="204" text-anchor="middle" font-size="10.5" fill="#c53030">"use real books"</text><rect x="280" y="176" width="300" height="46" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.3" /><text x="430" y="204" text-anchor="middle" font-size="10.5" fill="#276749">only titles currently in stock</text><text x="663" y="204" text-anchor="middle" font-size="9.5" fill="#4a5568">match the list ✓</text><rect x="40" y="228" width="220" height="46" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.3" /><text x="150" y="256" text-anchor="middle" font-size="10.5" fill="#c53030">"sound like us"</text><rect x="280" y="228" width="300" height="46" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.3" /><text x="430" y="252" text-anchor="middle" font-size="10.5" fill="#276749">warm and chatty, no corporate</text><text x="430" y="266" text-anchor="middle" font-size="10.5" fill="#276749">jargon</text><text x="663" y="256" text-anchor="middle" font-size="9.5" fill="#4a5568">read &amp; judge ~</text><text x="380" y="304" text-anchor="middle" font-size="10.5" fill="#718096">Each criterion is specific (names a concrete thing), measurable (a clear yes/no), and relevant (it matters).</text><text x="380" y="322" text-anchor="middle" font-size="10.5" fill="#718096">The last one is softer — still checkable by reading, but that's exactly where a rubric will help later.</text></svg>
