<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="356" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Every loop needs a success exit — and at least one safety exit</text><rect x="28" y="112" width="236" height="120" rx="12" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.8" /><text x="146" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">The loop</text><text x="146" y="160" text-anchor="middle" font-size="9.5" fill="#805ad5">attempt → check → correct</text><path d="M96 176 A26 26 0 1 1 92 178" fill="none" stroke="#9f7aea" stroke-width="2" /><polygon points="92 178 86 170 97 171" fill="#9f7aea" /><text x="180" y="185" text-anchor="middle" font-size="9.5" fill="#805ad5">…repeat</text><text x="146" y="216" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6b46c1">each round: is it time to exit? →</text><line x1="264" y1="150" x2="326" y2="92" stroke="#a0aec0" stroke-width="1.7" /><polygon points="326 92 315 94 319 101" fill="#a0aec0" /><line x1="264" y1="165" x2="326" y2="152" stroke="#a0aec0" stroke-width="1.7" /><polygon points="326 152 315 151 318 159" fill="#a0aec0" /><line x1="264" y1="180" x2="326" y2="212" stroke="#a0aec0" stroke-width="1.7" /><polygon points="326 212 318 205 315 213" fill="#a0aec0" /><line x1="264" y1="196" x2="326" y2="272" stroke="#a0aec0" stroke-width="1.7" /><polygon points="326 272 318 265 314 273" fill="#a0aec0" /><rect x="330" y="66" width="404" height="52" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="348" y="88" font-size="12" font-weight="700" fill="#276749">✓  Success</text><text x="450" y="88" font-size="9.5" fill="#2f855a">the check passes — the exit you actually want</text><text x="348" y="105" font-size="8.5" fill="#2f855a">only as trustworthy as the check behind it (Module 3)</text><rect x="330" y="126" width="404" height="52" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="348" y="148" font-size="12" font-weight="700" fill="#c05621">⏱  Budget hit</text><text x="452" y="148" font-size="9.5" fill="#9c4221">out of turns, time, or money — your safety net</text><text x="348" y="165" font-size="8.5" fill="#9c4221">catches a loop the success exit never will</text><rect x="330" y="186" width="404" height="52" rx="9" fill="#fff5f5" stroke="#fc8181" stroke-width="1.6" /><text x="348" y="208" font-size="12" font-weight="700" fill="#c53030">✗  Error</text><text x="430" y="208" font-size="9.5" fill="#9b2c2c">something broke and it can't continue — stop and surface it</text><rect x="330" y="246" width="404" height="52" rx="9" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.6" /><text x="348" y="268" font-size="12" font-weight="700" fill="#4a5568">🛑  Give up</text><text x="440" y="268" font-size="9.5" fill="#4a5568">no progress after N rounds — stop and reassess</text><text x="348" y="285" font-size="8.5" fill="#718096">the loop admits it's stuck instead of spinning</text><text x="380" y="330" text-anchor="middle" font-size="10.5" fill="#718096">With only a success exit, a weak check means the loop never leaves. Always pair "done" with a limit that stops it anyway.</text></svg>
