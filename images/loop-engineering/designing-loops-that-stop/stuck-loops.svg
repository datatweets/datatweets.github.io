<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="340" fill="#ffffff" /><text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">A stuck loop is busy but not converging — three ways it happens</text><rect x="30" y="48" width="340" height="116" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="46" y="70" font-size="11.5" font-weight="700" fill="#276749">Healthy — converging</text><line x1="60" y1="140" x2="340" y2="140" stroke="#9ae6b4" stroke-width="1" stroke-dasharray="3 3" /><text x="352" y="143" font-size="7.5" fill="#48bb78">done</text><polyline points="70,92 130,108 190,120 250,130 310,137" fill="none" stroke="#48bb78" stroke-width="2" /><circle cx="70" cy="92" r="3" fill="#48bb78" /><circle cx="130" cy="108" r="3" fill="#48bb78" /><circle cx="190" cy="120" r="3" fill="#48bb78" /><circle cx="250" cy="130" r="3" fill="#48bb78" /><circle cx="310" cy="137" r="3" fill="#48bb78" /><text x="46" y="158" font-size="8.5" fill="#2f855a">distance to "done" shrinks each round</text><rect x="390" y="48" width="340" height="116" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" /><text x="406" y="70" font-size="11.5" font-weight="700" fill="#c05621">Oscillating — A ↔ B</text><line x1="420" y1="140" x2="700" y2="140" stroke="#fbd38d" stroke-width="1" stroke-dasharray="3 3" /><text x="712" y="143" font-size="7.5" fill="#ed8936">done</text><polyline points="430,92 490,124 550,92 610,124 670,92" fill="none" stroke="#ed8936" stroke-width="2" /><circle cx="430" cy="92" r="3" fill="#ed8936" /><circle cx="490" cy="124" r="3" fill="#ed8936" /><circle cx="550" cy="92" r="3" fill="#ed8936" /><circle cx="610" cy="124" r="3" fill="#ed8936" /><circle cx="670" cy="92" r="3" fill="#ed8936" /><text x="406" y="158" font-size="8.5" fill="#9c4221">flips between two versions, never settles</text><rect x="30" y="176" width="340" height="116" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" /><text x="46" y="198" font-size="11.5" font-weight="700" fill="#c53030">Undoing its own work</text><polyline points="70,214 150,262 230,214 310,262" fill="none" stroke="#e53e3e" stroke-width="2" /><polyline points="70,262 150,214 230,262 310,214" fill="none" stroke="#fc8181" stroke-width="2" stroke-dasharray="4 3" /><circle cx="70" cy="214" r="3" fill="#e53e3e" /><circle cx="150" cy="262" r="3" fill="#e53e3e" /><circle cx="230" cy="214" r="3" fill="#e53e3e" /><text x="322" y="220" font-size="7.5" fill="#e53e3e">fix A</text><text x="322" y="266" font-size="7.5" fill="#fc8181">fix B</text><text x="46" y="286" font-size="8.5" fill="#9b2c2c">each fix re-breaks an earlier fix</text><rect x="390" y="176" width="340" height="116" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5" /><text x="406" y="198" font-size="11.5" font-weight="700" fill="#4a5568">Drifting off</text><path d="M430 218 L440 208 L436 218 L446 214 Z" fill="#48bb78" /><text x="430" y="234" font-size="7.5" fill="#276749">goal</text><polyline points="438,214 498,232 558,252 618,268 678,280" fill="none" stroke="#a0aec0" stroke-width="2" /><circle cx="498" cy="232" r="3" fill="#a0aec0" /><circle cx="558" cy="252" r="3" fill="#a0aec0" /><circle cx="618" cy="268" r="3" fill="#a0aec0" /><circle cx="678" cy="280" r="3" fill="#a0aec0" /><text x="406" y="286" font-size="8.5" fill="#4a5568">output keeps changing — but away from the goal</text><text x="380" y="316" text-anchor="middle" font-size="10.5" fill="#718096">The root cause is usually a weak check (can't tell better from worse) or a fuzzy goal. The give-up exit and the log catch it.</text></svg>
