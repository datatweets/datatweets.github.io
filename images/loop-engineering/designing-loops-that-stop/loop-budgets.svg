<svg xmlns="http://www.w3.org/2000/svg" width="760" height="332" viewBox="0 0 760 332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="332" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Set three budgets before you run — the loop stops at whichever runs out first</text><rect x="30" y="62" width="222" height="182" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="141" y="90" text-anchor="middle" font-size="26" font-weight="700" fill="#4299e1">↻</text><text x="141" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">Turns</text><text x="141" y="134" text-anchor="middle" font-size="9" fill="#3182ce">the number of rounds</text><rect x="52" y="148" width="178" height="30" rx="6" fill="#ffffff" stroke="#bee3f8" stroke-width="1.1" /><text x="141" y="168" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">"stop after 6 rounds"</text><text x="141" y="200" text-anchor="middle" font-size="9" fill="#4a5568">the universal budget —</text><text x="141" y="214" text-anchor="middle" font-size="9" fill="#4a5568">always set one, on any loop</text><text x="141" y="234" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2b6cb0">simplest &amp; most reliable</text><rect x="269" y="62" width="222" height="182" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="380" y="92" text-anchor="middle" font-size="24" font-weight="700" fill="#9f7aea">⏱</text><text x="380" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">Time</text><text x="380" y="134" text-anchor="middle" font-size="9" fill="#805ad5">wall-clock elapsed</text><rect x="291" y="148" width="178" height="30" rx="6" fill="#ffffff" stroke="#e9d8fd" stroke-width="1.1" /><text x="380" y="168" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">"stop after 10 minutes"</text><text x="380" y="200" text-anchor="middle" font-size="9" fill="#4a5568">for long-running or</text><text x="380" y="214" text-anchor="middle" font-size="9" fill="#4a5568">unattended agents</text><text x="380" y="234" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6b46c1">caps how long it can chew</text><rect x="508" y="62" width="222" height="182" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="619" y="92" text-anchor="middle" font-size="22" font-weight="700" fill="#ed8936">$</text><text x="619" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">Money</text><text x="619" y="134" text-anchor="middle" font-size="9" fill="#9c4221">a spend cap</text><rect x="530" y="148" width="178" height="30" rx="6" fill="#ffffff" stroke="#fbd38d" stroke-width="1.1" /><text x="619" y="168" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c05621">"stop at about $2"</text><text x="619" y="200" text-anchor="middle" font-size="9" fill="#4a5568">for automated loops that</text><text x="619" y="214" text-anchor="middle" font-size="9" fill="#4a5568">pay per round or per token</text><text x="619" y="234" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c05621">the one that actually stings</text><text x="380" y="278" text-anchor="middle" font-size="10.5" fill="#718096">Size each budget to what the task is genuinely worth: a five-minute newsletter doesn't deserve a hundred rounds.</text><text x="380" y="298" text-anchor="middle" font-size="10.5" fill="#718096">By hand, your patience caps turns and time for free. Once an agent runs it unattended, the money cap is the one that saves you.</text></svg>
