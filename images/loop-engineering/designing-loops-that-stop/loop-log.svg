<svg xmlns="http://www.w3.org/2000/svg" width="760" height="348" viewBox="0 0 760 348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="348" fill="#ffffff" /><text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">A log turns "it didn't work" into "here's exactly where and why"</text><rect x="28" y="50" width="450" height="264" rx="10" fill="#fbfdff" stroke="#cbd5e0" stroke-width="1.3" /><text x="46" y="72" font-size="11" font-weight="700" fill="#4a5568">Loop log — "tighten the About page"</text><line x1="44" y1="82" x2="462" y2="82" stroke="#e2e8f0" stroke-width="1" /><text x="52" y="98" font-size="8.5" font-weight="700" fill="#718096">round</text><text x="108" y="98" font-size="8.5" font-weight="700" fill="#718096">what it did</text><text x="330" y="98" font-size="8.5" font-weight="700" fill="#718096">check said</text><text x="60" y="120" font-size="9" fill="#2d3748">1</text><text x="108" y="120" font-size="9" fill="#2d3748">drafted — 185 words</text><text x="330" y="120" font-size="9" fill="#c53030">✗ too long</text><text x="60" y="142" font-size="9" fill="#2d3748">2</text><text x="108" y="142" font-size="9" fill="#2d3748">cut to 150 words</text><text x="330" y="142" font-size="9" fill="#c53030">✗ too terse</text><text x="60" y="164" font-size="9" fill="#2d3748">3</text><text x="108" y="164" font-size="9" fill="#2d3748">expanded to 210 words</text><text x="330" y="164" font-size="9" fill="#c53030">✗ too long</text><text x="60" y="186" font-size="9" fill="#2d3748">4</text><text x="108" y="186" font-size="9" fill="#2d3748">cut to 160 words</text><text x="330" y="186" font-size="9" fill="#c53030">✗ too terse</text><text x="60" y="208" font-size="9" fill="#2d3748">5</text><text x="108" y="208" font-size="9" fill="#2d3748">expanded to 200 words</text><text x="330" y="208" font-size="9" fill="#c53030">✗ too long</text><line x1="44" y1="220" x2="462" y2="220" stroke="#edf2f7" stroke-width="1" /><text x="60" y="240" font-size="9" font-weight="700" fill="#c05621">6</text><text x="108" y="240" font-size="9" font-weight="700" fill="#c05621">— stopped —</text><text x="330" y="240" font-size="9" font-weight="700" fill="#c05621">⏱ budget hit</text><rect x="44" y="256" width="418" height="44" rx="7" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" /><text x="54" y="274" font-size="8.5" fill="#718096">length bounces 185 → 150 → 210 → 160 → 200 …</text><text x="54" y="290" font-size="8.5" fill="#718096">the same two notes repeat · ended on budget, not success</text><rect x="490" y="50" width="242" height="264" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="611" y="74" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c05621">What the log reveals</text><text x="506" y="102" font-size="9" fill="#9c4221">● Length oscillates (Lesson 3) —</text><text x="518" y="115" font-size="9" fill="#9c4221">busy, but never converging.</text><text x="506" y="140" font-size="9" fill="#9c4221">● Same two notes repeat —</text><text x="518" y="153" font-size="9" fill="#9c4221">zero progress across rounds.</text><text x="506" y="178" font-size="9" fill="#9c4221">● Ended at the turn budget,</text><text x="518" y="191" font-size="9" fill="#9c4221">not the success exit (Lesson 1).</text><line x1="506" y1="208" x2="716" y2="208" stroke="#fbd38d" stroke-width="1" /><text x="506" y="230" font-size="9" font-weight="700" fill="#c05621">Root cause</text><text x="506" y="246" font-size="9" fill="#9c4221">"good length" is a vague check.</text><text x="506" y="270" font-size="9" font-weight="700" fill="#276749">Fix</text><text x="506" y="286" font-size="9" fill="#2f855a">use "150–200 words", then rerun.</text><text x="380" y="334" text-anchor="middle" font-size="10.5" fill="#718096">Read a log for three things: is it converging round-over-round, are states repeating, and which exit finally fired?</text></svg>
