<svg xmlns="http://www.w3.org/2000/svg" width="760" height="342" viewBox="0 0 760 342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="342" fill="#ffffff" /><text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Three times a loop should stop and ask instead of guessing</text><rect x="30" y="50" width="222" height="80" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.6" /><text x="141" y="72" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c53030">Irreversible / high-risk</text><text x="141" y="90" text-anchor="middle" font-size="9" fill="#9b2c2c">delete · send · spend · publish</text><text x="141" y="108" text-anchor="middle" font-size="8.5" fill="#9b2c2c">hard or impossible to undo</text><rect x="269" y="50" width="222" height="80" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="380" y="72" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c05621">Repeated failure</text><text x="380" y="90" text-anchor="middle" font-size="9" fill="#9c4221">stuck after N tries</text><text x="380" y="108" text-anchor="middle" font-size="8.5" fill="#9c4221">the give-up threshold from Lesson 1</text><rect x="508" y="50" width="222" height="80" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="619" y="72" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b46c1">Genuine ambiguity</text><text x="619" y="90" text-anchor="middle" font-size="9" fill="#805ad5">doesn't know what you meant</text><text x="619" y="108" text-anchor="middle" font-size="8.5" fill="#805ad5">a real fork, not a guessable detail</text><line x1="141" y1="130" x2="290" y2="196" stroke="#a0aec0" stroke-width="1.8" /><polygon points="290 196 279 193 282 185" fill="#a0aec0" /><line x1="380" y1="130" x2="380" y2="194" stroke="#a0aec0" stroke-width="1.8" /><polygon points="380 194 375 184 385 184" fill="#a0aec0" /><line x1="619" y1="130" x2="470" y2="196" stroke="#a0aec0" stroke-width="1.8" /><polygon points="470 196 478 189 481 197" fill="#a0aec0" /><rect x="212" y="198" width="336" height="70" rx="11" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" /><text x="380" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">🙋  Stop and ask you</text><text x="380" y="244" text-anchor="middle" font-size="9" fill="#3182ce">one clear question — then continue with your answer</text><text x="380" y="258" text-anchor="middle" font-size="8.5" fill="#3182ce">not a failure — the loop being honest about its limits</text><rect x="576" y="212" width="156" height="44" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="654" y="230" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">no trigger →</text><text x="654" y="245" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">proceed on its own</text><text x="380" y="300" text-anchor="middle" font-size="10.5" fill="#718096">Escalation is a designed exit: write "if X, stop and ask me" into the brief, so the loop pauses on exactly these three.</text><text x="380" y="320" text-anchor="middle" font-size="10.5" fill="#718096">A loop that asks on the risky, the stuck, and the ambiguous beats one that confidently guesses wrong.</text></svg>
