<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="360" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">An answer stops at the first reply; an outcome loops to the finish line</text><text x="30" y="78" font-size="12" font-weight="700" fill="#2b6cb0">Asking · one pass</text><rect x="30" y="90" width="118" height="46" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="89" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">Request</text><text x="89" y="127" text-anchor="middle" font-size="8.5" fill="#3182ce">what you type</text><line x1="148" y1="113" x2="176" y2="113" stroke="#a0aec0" stroke-width="2" /><polygon points="176 113 166 108 166 118" fill="#a0aec0" /><rect x="178" y="90" width="118" height="46" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="237" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">Reply</text><text x="237" y="127" text-anchor="middle" font-size="8.5" fill="#805ad5">the AI's first draft</text><line x1="296" y1="113" x2="324" y2="113" stroke="#a0aec0" stroke-width="2" /><polygon points="324 113 314 108 314 118" fill="#a0aec0" /><rect x="326" y="90" width="130" height="46" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" /><text x="391" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">You accept it</text><text x="391" y="127" text-anchor="middle" font-size="8.5" fill="#718096">"an answer"</text><line x1="470" y1="113" x2="600" y2="113" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="4 4" /><text x="535" y="107" text-anchor="middle" font-size="8.5" fill="#a0aec0">gap</text><line x1="612" y1="70" x2="612" y2="156" stroke="#48bb78" stroke-width="2.5" /><text x="655" y="110" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">finish</text><text x="655" y="123" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">line</text><line x1="40" y1="176" x2="720" y2="176" stroke="#edf2f7" stroke-width="1.5" /><text x="30" y="212" font-size="12" font-weight="700" fill="#c05621">Achieving · a loop</text><rect x="30" y="224" width="104" height="46" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="82" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">Request</text><text x="82" y="261" text-anchor="middle" font-size="8.5" fill="#3182ce">+ a clear goal</text><line x1="134" y1="247" x2="158" y2="247" stroke="#a0aec0" stroke-width="2" /><polygon points="158 247 148 242 148 252" fill="#a0aec0" /><rect x="160" y="224" width="96" height="46" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="208" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">Attempt</text><text x="208" y="261" text-anchor="middle" font-size="8.5" fill="#805ad5">a draft</text><line x1="256" y1="247" x2="280" y2="247" stroke="#a0aec0" stroke-width="2" /><polygon points="280 247 270 242 270 252" fill="#a0aec0" /><rect x="282" y="224" width="96" height="46" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="330" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">Check</text><text x="330" y="261" text-anchor="middle" font-size="8.5" fill="#9c4221">meets the goal?</text><path d="M330 224C330 190 240 190 210 218" fill="none" stroke="#fc8181" stroke-width="1.8" stroke-dasharray="5 3" /><polygon points="210 218 221 216 216 209" fill="#fc8181" /><text x="268" y="200" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c53030">no → correct &amp; retry</text><line x1="378" y1="247" x2="402" y2="247" stroke="#48bb78" stroke-width="2" /><polygon points="402 247 392 242 392 252" fill="#48bb78" /><text x="390" y="240" text-anchor="middle" font-size="8" font-weight="700" fill="#276749">yes</text><rect x="404" y="224" width="120" height="46" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="464" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Outcome</text><text x="464" y="261" text-anchor="middle" font-size="8.5" fill="#2f855a">ready to use</text><line x1="538" y1="247" x2="600" y2="247" stroke="#cbd5e0" stroke-width="2" /><polygon points="600 247 590 242 590 252" fill="#a0aec0" /><line x1="612" y1="204" x2="612" y2="290" stroke="#48bb78" stroke-width="2.5" /><text x="655" y="244" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">finish</text><text x="655" y="257" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">line</text><text x="380" y="322" text-anchor="middle" font-size="10.5" fill="#718096">A single answer lands wherever the first reply falls — often short of what you actually needed.</text><text x="380" y="340" text-anchor="middle" font-size="10.5" fill="#718096">A loop keeps checking and correcting until the result reaches the finish line, then stops.</text></svg>
