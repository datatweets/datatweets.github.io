<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="360" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Anatomy of a loop: goal, attempt, check, correct, stop</text><rect x="300" y="52" width="160" height="52" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="380" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Goal</text><text x="380" y="91" text-anchor="middle" font-size="9" fill="#3182ce">the outcome you want</text><line x1="380" y1="104" x2="380" y2="132" stroke="#a0aec0" stroke-width="2" /><polygon points="380 132 375 122 385 122" fill="#a0aec0" /><rect x="300" y="134" width="160" height="52" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.8" /><text x="380" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">Attempt</text><text x="380" y="173" text-anchor="middle" font-size="9" fill="#805ad5">the AI produces a draft</text><line x1="380" y1="186" x2="380" y2="214" stroke="#a0aec0" stroke-width="2" /><polygon points="380 214 375 204 385 204" fill="#a0aec0" /><rect x="300" y="216" width="160" height="52" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.8" /><text x="380" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">Check</text><text x="380" y="255" text-anchor="middle" font-size="9" fill="#9c4221">does it meet the goal?</text><line x1="300" y1="242" x2="210" y2="242" stroke="#e53e3e" stroke-width="2" /><polygon points="210 242 220 237 220 247" fill="#e53e3e" /><text x="255" y="234" text-anchor="middle" font-size="9" font-weight="700" fill="#c53030">no</text><rect x="50" y="216" width="160" height="52" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.6" /><text x="130" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#c53030">Correct</text><text x="130" y="255" text-anchor="middle" font-size="9" fill="#c53030">fix the gap, try again</text><path d="M130 216C130 150 210 150 296 155" fill="none" stroke="#fc8181" stroke-width="1.8" stroke-dasharray="5 3" /><polygon points="296 155 285 152 289 145" fill="#fc8181" /><text x="150" y="140" text-anchor="middle" font-size="9" fill="#c53030">back to a new attempt</text><line x1="460" y1="242" x2="552" y2="242" stroke="#48bb78" stroke-width="2" /><polygon points="552 242 542 237 542 247" fill="#48bb78" /><text x="506" y="234" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">yes</text><rect x="554" y="216" width="160" height="52" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="634" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Stop</text><text x="634" y="255" text-anchor="middle" font-size="9" fill="#2f855a">done — deliver the result</text><text x="380" y="312" text-anchor="middle" font-size="10.5" fill="#718096">The check is the hinge: it decides whether the loop corrects again or stops.</text><text x="380" y="330" text-anchor="middle" font-size="10.5" fill="#718096">A loop with a weak check corrects forever, or stops too soon on a false "done".</text></svg>
