<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="400" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Four tools, two jobs: chat tools you steer, file agents that run themselves</text><text x="322" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">OpenAI</text><text x="598" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">Anthropic</text><rect x="20" y="92" width="158" height="98" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="99" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Chat tools</text><text x="99" y="140" text-anchor="middle" font-size="9" fill="#4a5568">you steer each round</text><text x="99" y="154" text-anchor="middle" font-size="9" fill="#4a5568">browser · no code</text><text x="99" y="174" text-anchor="middle" font-size="9" font-weight="700" fill="#3182ce">Modules 1–4</text><rect x="186" y="92" width="272" height="98" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="322" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#2b6cb0">ChatGPT</text><text x="322" y="150" text-anchor="middle" font-size="9.5" fill="#3182ce">chat AI · you are the check</text><text x="322" y="166" text-anchor="middle" font-size="9.5" fill="#3182ce">Projects · custom instructions</text><rect x="462" y="92" width="272" height="98" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="598" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#2b6cb0">Claude</text><text x="598" y="150" text-anchor="middle" font-size="9.5" fill="#3182ce">chat AI · you are the check</text><text x="598" y="166" text-anchor="middle" font-size="9.5" fill="#3182ce">Projects · Artifacts</text><rect x="20" y="204" width="158" height="98" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="99" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">File agents</text><text x="99" y="252" text-anchor="middle" font-size="9" fill="#4a5568">run the loop itself</text><text x="99" y="266" text-anchor="middle" font-size="9" fill="#4a5568">terminal · real files</text><text x="99" y="286" text-anchor="middle" font-size="9" font-weight="700" fill="#6b46c1">Modules 5–7</text><rect x="186" y="204" width="272" height="98" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="322" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#6b46c1">Codex</text><text x="322" y="262" text-anchor="middle" font-size="9.5" fill="#805ad5">file agent · runs in the terminal</text><text x="322" y="278" text-anchor="middle" font-size="9.5" fill="#805ad5">acts on your files, not just code</text><rect x="462" y="204" width="272" height="98" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="598" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#6b46c1">Claude Code</text><text x="598" y="262" text-anchor="middle" font-size="9.5" fill="#805ad5">file agent · runs in the terminal</text><text x="598" y="278" text-anchor="middle" font-size="9.5" fill="#805ad5">acts on your files, not just code</text><text x="380" y="342" text-anchor="middle" font-size="10.5" fill="#718096">The same loop skills apply to all four. Stay hands-on (top row) when your own judgment is the check;</text><text x="380" y="360" text-anchor="middle" font-size="10.5" fill="#718096">hand off (bottom row) when the check can be written down and the work spans many files or many rounds.</text><text x="380" y="384" text-anchor="middle" font-size="10" fill="#a0aec0">Use whichever you already pay for — the course teaches every idea tool-neutral first.</text></svg>
