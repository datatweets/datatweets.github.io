<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="450" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Single pass, recipe, or loop? Three questions decide</text><polygon points="270,66 350,103 270,140 190,103" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="270" y="99" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">Does being</text><text x="270" y="113" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">wrong matter?</text><line x1="350" y1="103" x2="466" y2="103" stroke="#a0aec0" stroke-width="1.8" /><polygon points="466 103 456 98 456 108" fill="#a0aec0" /><text x="405" y="96" text-anchor="middle" font-size="9" font-weight="700" fill="#718096">no</text><line x1="270" y1="140" x2="270" y2="178" stroke="#48bb78" stroke-width="1.8" /><polygon points="270 178 265 168 275 168" fill="#48bb78" /><text x="284" y="162" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">yes</text><polygon points="270,180 350,217 270,254 190,217" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="270" y="213" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c05621">Can you tell</text><text x="270" y="227" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c05621">good from bad?</text><line x1="350" y1="217" x2="466" y2="217" stroke="#a0aec0" stroke-width="1.8" /><polygon points="466 217 456 212 456 222" fill="#a0aec0" /><text x="405" y="210" text-anchor="middle" font-size="9" font-weight="700" fill="#718096">no</text><line x1="270" y1="254" x2="270" y2="292" stroke="#48bb78" stroke-width="1.8" /><polygon points="270 292 265 282 275 282" fill="#48bb78" /><text x="284" y="276" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">yes</text><polygon points="270,294 350,331 270,368 190,331" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="270" y="327" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">Same fixed steps</text><text x="270" y="341" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">every time?</text><line x1="350" y1="331" x2="466" y2="331" stroke="#a0aec0" stroke-width="1.8" /><polygon points="466 331 456 326 456 336" fill="#a0aec0" /><text x="405" y="324" text-anchor="middle" font-size="9" font-weight="700" fill="#718096">yes</text><line x1="270" y1="368" x2="270" y2="404" stroke="#48bb78" stroke-width="1.8" /><polygon points="270 404 265 394 275 394" fill="#48bb78" /><text x="286" y="389" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">no</text><rect x="470" y="80" width="256" height="46" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" /><text x="598" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">Single pass</text><text x="598" y="115" text-anchor="middle" font-size="8.5" fill="#718096">low stakes — just take the reply</text><rect x="470" y="194" width="256" height="46" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" /><text x="598" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">Single pass</text><text x="598" y="229" text-anchor="middle" font-size="8.5" fill="#718096">no check yet — write one first</text><rect x="470" y="308" width="256" height="46" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" /><text x="598" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">Recipe (workflow)</text><text x="598" y="343" text-anchor="middle" font-size="8.5" fill="#9c4221">fixed steps, chosen in advance</text><rect x="180" y="406" width="180" height="48" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.8" /><text x="270" y="427" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Loop</text><text x="270" y="443" text-anchor="middle" font-size="8.5" fill="#2f855a">check &amp; correct until it's done</text><text x="565" y="418" text-anchor="middle" font-size="10.5" fill="#718096">Stakes, checkability, variability —</text><text x="565" y="434" text-anchor="middle" font-size="10.5" fill="#718096">all three lean "yes" before you loop.</text></svg>
