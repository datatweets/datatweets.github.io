<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="360" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The manual loop breaks in four predictable places — all of them yours</text><rect x="25" y="66" width="120" height="52" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="85" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">Goal</text><text x="85" y="104" text-anchor="middle" font-size="8.5" fill="#3182ce">in your head</text><line x1="145" y1="92" x2="171" y2="92" stroke="#a0aec0" stroke-width="2" /><polygon points="171 92 161 87 161 97" fill="#a0aec0" /><rect x="175" y="66" width="120" height="52" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="235" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b46c1">Attempt</text><text x="235" y="104" text-anchor="middle" font-size="8.5" fill="#805ad5">the AI drafts</text><line x1="295" y1="92" x2="321" y2="92" stroke="#a0aec0" stroke-width="2" /><polygon points="321 92 311 87 311 97" fill="#a0aec0" /><rect x="325" y="66" width="120" height="52" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="385" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c05621">Check</text><text x="385" y="104" text-anchor="middle" font-size="8.5" fill="#9c4221">you eyeball it</text><line x1="445" y1="92" x2="471" y2="92" stroke="#a0aec0" stroke-width="2" /><polygon points="471 92 461 87 461 97" fill="#a0aec0" /><rect x="475" y="66" width="120" height="52" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.6" /><text x="535" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c53030">Correct</text><text x="535" y="104" text-anchor="middle" font-size="8.5" fill="#c53030">you nudge</text><line x1="595" y1="92" x2="621" y2="92" stroke="#a0aec0" stroke-width="2" /><polygon points="621 92 611 87 611 97" fill="#a0aec0" /><rect x="625" y="66" width="120" height="52" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="685" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">Stop</text><text x="685" y="104" text-anchor="middle" font-size="8.5" fill="#2f855a">you decide</text><path d="M535 66C535 42 235 42 235 64" fill="none" stroke="#a0aec0" stroke-width="1.7" stroke-dasharray="5 3" /><polygon points="235 64 230 54 240 54" fill="#a0aec0" /><text x="385" y="38" text-anchor="middle" font-size="9" fill="#718096">correct → attempt again</text><line x1="85" y1="118" x2="85" y2="146" stroke="#e53e3e" stroke-width="1.6" /><rect x="20" y="148" width="130" height="46" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.2" /><text x="85" y="166" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">① Stays fuzzy</text><text x="85" y="182" text-anchor="middle" font-size="8.5" fill="#9b2c2c">and drifts as you go</text><rect x="180" y="148" width="110" height="46" rx="8" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1.2" /><text x="235" y="166" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">The AI's part</text><text x="235" y="182" text-anchor="middle" font-size="8.5" fill="#2f855a">not where it breaks</text><line x1="385" y1="118" x2="385" y2="146" stroke="#e53e3e" stroke-width="1.6" /><rect x="320" y="148" width="130" height="46" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.2" /><text x="385" y="166" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">② Gets tired</text><text x="385" y="182" text-anchor="middle" font-size="8.5" fill="#9b2c2c">standards quietly drop</text><line x1="535" y1="118" x2="535" y2="146" stroke="#e53e3e" stroke-width="1.6" /><rect x="470" y="148" width="130" height="46" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.2" /><text x="535" y="166" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">③ Turns vague</text><text x="535" y="182" text-anchor="middle" font-size="8.5" fill="#9b2c2c">so the work wanders</text><line x1="685" y1="118" x2="685" y2="146" stroke="#e53e3e" stroke-width="1.6" /><rect x="620" y="148" width="130" height="46" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.2" /><text x="685" y="166" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">④ No stop rule</text><text x="685" y="182" text-anchor="middle" font-size="8.5" fill="#9b2c2c">mood decides "done"</text><text x="380" y="238" text-anchor="middle" font-size="11" fill="#4a5568">The AI supplies only the attempts. You supply the goal, the check, the corrections, and the stop —</text><text x="380" y="256" text-anchor="middle" font-size="11" fill="#4a5568">so all four failure points are human ones, and every one gets worse as you tire.</text><text x="380" y="300" text-anchor="middle" font-size="10.5" fill="#718096">"The AI got worse the more I asked" is almost always breakdown ③ — drifting corrections,</text><text x="380" y="318" text-anchor="middle" font-size="10.5" fill="#718096">not a failing model. Each later module moves one of these four jobs out of your head.</text></svg>
