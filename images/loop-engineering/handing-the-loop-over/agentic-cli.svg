<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="360" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">You set the goal; the agent runs the whole loop over your real files</text><rect x="18" y="96" width="104" height="60" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="70" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">You</text><text x="70" y="137" text-anchor="middle" font-size="8.5" fill="#3182ce">one goal (a brief)</text><line x1="122" y1="126" x2="150" y2="126" stroke="#a0aec0" stroke-width="2" /><polygon points="150 126 140 121 140 131" fill="#a0aec0" /><rect x="152" y="96" width="132" height="60" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="218" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">Gather context</text><text x="218" y="137" text-anchor="middle" font-size="8.5" fill="#805ad5">reads the folder</text><line x1="284" y1="126" x2="312" y2="126" stroke="#a0aec0" stroke-width="2" /><polygon points="312 126 302 121 302 131" fill="#a0aec0" /><rect x="314" y="96" width="132" height="60" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="380" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">Take action</text><text x="380" y="137" text-anchor="middle" font-size="8.5" fill="#805ad5">sorts, renames, writes</text><line x1="446" y1="126" x2="474" y2="126" stroke="#a0aec0" stroke-width="2" /><polygon points="474 126 464 121 464 131" fill="#a0aec0" /><rect x="476" y="96" width="132" height="60" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.8" /><text x="542" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">Verify work</text><text x="542" y="137" text-anchor="middle" font-size="8.5" fill="#9c4221">checks what it did</text><path d="M542 96C542 64 218 64 218 92" fill="none" stroke="#9f7aea" stroke-width="1.8" stroke-dasharray="5 3" /><polygon points="218 92 213 82 223 82" fill="#9f7aea" /><text x="380" y="58" text-anchor="middle" font-size="9" font-weight="700" fill="#6b46c1">not done → repeat, on its own</text><line x1="608" y1="126" x2="636" y2="126" stroke="#48bb78" stroke-width="2" /><polygon points="636 126 626 121 626 131" fill="#48bb78" /><text x="622" y="118" text-anchor="middle" font-size="7.5" font-weight="700" fill="#276749">done</text><rect x="638" y="96" width="104" height="60" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="690" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">You</text><text x="690" y="137" text-anchor="middle" font-size="8.5" fill="#2f855a">review the result</text><line x1="218" y1="156" x2="218" y2="196" stroke="#a0aec0" stroke-width="1.5" /><polygon points="218 196 213 186 223 186" fill="#a0aec0" /><text x="150" y="180" text-anchor="end" font-size="8" fill="#718096">reads</text><line x1="380" y1="196" x2="380" y2="156" stroke="#a0aec0" stroke-width="1.5" /><polygon points="380 156 375 166 385 166" fill="#a0aec0" /><text x="392" y="180" font-size="8" fill="#718096">writes</text><rect x="152" y="198" width="456" height="48" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" /><text x="380" y="219" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">Your folder — real files on your computer</text><text x="380" y="235" text-anchor="middle" font-size="8.5" fill="#718096">invoices, flyers, notes, photos — not code</text><text x="380" y="288" text-anchor="middle" font-size="10.5" fill="#718096">In a chat (Module 4) you run every round yourself. An agentic CLI runs the rounds itself, on your actual files —</text><text x="380" y="306" text-anchor="middle" font-size="10.5" fill="#718096">the same attempt-check-correct loop, now hands-off. That's the leap, and it works on documents, not just code.</text></svg>
