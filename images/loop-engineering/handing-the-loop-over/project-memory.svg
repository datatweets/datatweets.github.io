<svg xmlns="http://www.w3.org/2000/svg" width="760" height="366" viewBox="0 0 760 366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="366" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">A memory file briefs the agent at the start of every session</text><rect x="28" y="60" width="336" height="190" rx="10" fill="#fbfdff" stroke="#4299e1" stroke-width="1.6" /><rect x="28" y="60" width="336" height="30" rx="10" fill="#4299e1" /><rect x="28" y="76" width="336" height="14" fill="#4299e1" /><text x="44" y="80" font-size="11" font-weight="700" fill="#ffffff">CLAUDE.md · AGENTS.md  (plain Markdown)</text><text x="44" y="110" font-size="9.5" font-weight="700" fill="#2b6cb0"># Goal</text><text x="44" y="124" font-size="8.5" fill="#4a5568">sort files by type, rename cryptic ones, keep an index</text><text x="44" y="144" font-size="9.5" font-weight="700" fill="#276749"># Definition of done</text><text x="44" y="158" font-size="8.5" fill="#4a5568">no loose files · index lists every folder · contents unchanged</text><text x="44" y="178" font-size="9.5" font-weight="700" fill="#6b46c1"># Conventions</text><text x="44" y="192" font-size="8.5" fill="#4a5568">dates as YYYY-MM-DD · one folder per type</text><text x="44" y="212" font-size="9.5" font-weight="700" fill="#c05621"># Leave alone</text><text x="44" y="226" font-size="8.5" fill="#4a5568">the invoices/ folder — don't move or rename</text><text x="196" y="244" text-anchor="middle" font-size="8" font-style="italic" fill="#718096">your brief (M2) + check (M3), as a file</text><line x1="364" y1="120" x2="450" y2="110" stroke="#a0aec0" stroke-width="1.8" /><polygon points="450 110 439 110 443 118" fill="#a0aec0" /><line x1="364" y1="180" x2="450" y2="188" stroke="#a0aec0" stroke-width="1.8" /><polygon points="450 188 439 188 443 196" fill="#a0aec0" /><text x="408" y="140" text-anchor="middle" font-size="8" fill="#718096">read at</text><text x="408" y="151" text-anchor="middle" font-size="8" fill="#718096">session start</text><rect x="452" y="86" width="280" height="46" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="592" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">Session today — starts briefed</text><text x="592" y="120" text-anchor="middle" font-size="8.5" fill="#2f855a">no re-explaining the goal or the checks</text><rect x="452" y="162" width="280" height="46" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="592" y="180" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">Session next week — same again</text><text x="592" y="196" text-anchor="middle" font-size="8.5" fill="#2f855a">the instructions travel with the folder</text><rect x="28" y="266" width="704" height="74" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" /><text x="46" y="286" font-size="10.5" font-weight="700" fill="#c05621">Three things to remember</text><text x="46" y="304" font-size="9" fill="#9c4221">1 · Read once per session — edit the file, then restart for changes to take effect (not mid-run).</text><text x="46" y="320" font-size="9" fill="#9c4221">2 · Guidance, not a lock — reading isn't obeying; hard safety still goes in permissions (Lesson 2).</text><text x="46" y="336" font-size="9" fill="#9c4221">3 · Keep it short — plain Markdown, a page or two; there's a size limit, and long files get skimmed.</text></svg>
