<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="360" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Give the agent a rule to check itself against — not just its own opinion</text><rect x="24" y="122" width="134" height="66" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="91" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">Agent acts</text><text x="91" y="167" text-anchor="middle" font-size="8.5" fill="#805ad5">sorts, renames, writes</text><line x1="158" y1="155" x2="186" y2="155" stroke="#a0aec0" stroke-width="2" /><polygon points="186 155 176 150 176 160" fill="#a0aec0" /><rect x="188" y="70" width="372" height="176" rx="12" fill="#fffaf0" stroke="#ed8936" stroke-width="2.2" /><text x="374" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">Self-check — how the agent verifies its work</text><rect x="204" y="102" width="340" height="40" rx="7" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="216" y="118" font-size="9.5" font-weight="700" fill="#276749">Run a rule / command  — strongest</text><text x="216" y="133" font-size="8.5" fill="#2f855a">"zero files left loose? index lists every folder?" → clean pass/fail</text><rect x="204" y="148" width="340" height="38" rx="7" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="216" y="164" font-size="9.5" font-weight="700" fill="#2b6cb0">Re-read the result against the definition of done</text><text x="216" y="178" font-size="8.5" fill="#3182ce">compare what it did to your written criteria</text><rect x="204" y="192" width="340" height="40" rx="7" fill="#fff5f5" stroke="#fc8181" stroke-width="1.4" /><text x="216" y="208" font-size="9.5" font-weight="700" fill="#c53030">Just ask itself "looks good?"  — weakest</text><text x="216" y="223" font-size="8.5" fill="#9b2c2c">it may wave through its own mistakes (verifier collusion, Module 3)</text><line x1="560" y1="130" x2="600" y2="130" stroke="#48bb78" stroke-width="2" /><polygon points="600 130 590 125 590 135" fill="#48bb78" /><text x="580" y="122" text-anchor="middle" font-size="8" font-weight="700" fill="#276749">pass</text><rect x="602" y="104" width="132" height="52" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="668" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Done</text><text x="668" y="144" text-anchor="middle" font-size="8" fill="#2f855a">report back to you</text><path d="M560 210 Q640 210 640 250 Q640 280 91 280 L91 190" fill="none" stroke="#fc8181" stroke-width="1.7" stroke-dasharray="5 3" /><polygon points="91 190 86 200 96 200" fill="#fc8181" /><text x="360" y="274" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c53030">fails the check → correct and act again, on its own</text><text x="380" y="314" text-anchor="middle" font-size="10.5" fill="#718096">The stronger and more rule-based the self-check, the more you can let the agent run without approving each step —</text><text x="380" y="332" text-anchor="middle" font-size="10.5" fill="#718096">and the less it can pass off its own errors as "done". Anchor its check to a real rule, not its own say-so.</text></svg>
