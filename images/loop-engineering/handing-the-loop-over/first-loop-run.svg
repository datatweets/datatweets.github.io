<svg xmlns="http://www.w3.org/2000/svg" width="760" height="384" viewBox="0 0 760 384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="384" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">A first autonomous run, in ask-before-changes mode</text><rect x="34" y="50" width="692" height="286" rx="10" fill="#fbfdff" stroke="#cbd5e0" stroke-width="1.3" /><rect x="52" y="64" width="42" height="20" rx="5" fill="#ebf8ff" /><text x="73" y="78" text-anchor="middle" font-size="9" font-weight="700" fill="#2b6cb0">you</text><text x="104" y="78" font-size="10" fill="#2d3748">Goal: sort this folder into subfolders, rename the cryptic files, and write an index.</text><rect x="52" y="94" width="42" height="20" rx="5" fill="#faf5ff" /><text x="73" y="108" text-anchor="middle" font-size="9" font-weight="700" fill="#6b46c1">agent</text><text x="104" y="108" font-size="10" fill="#2d3748">Reading all 100 files to see what each one is…</text><rect x="640" y="94" width="70" height="20" rx="5" fill="#faf5ff" stroke="#d6bcfa" stroke-width="1" /><text x="675" y="108" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6b46c1">gather</text><rect x="52" y="124" width="42" height="20" rx="5" fill="#faf5ff" /><text x="73" y="138" text-anchor="middle" font-size="9" font-weight="700" fill="#6b46c1">agent</text><text x="104" y="138" font-size="10" fill="#2d3748">Plan: create invoices/, flyers/, photos/, notes/. Proceed?</text><rect x="640" y="124" width="70" height="20" rx="5" fill="#faf5ff" stroke="#d6bcfa" stroke-width="1" /><text x="675" y="138" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6b46c1">act</text><rect x="52" y="154" width="42" height="20" rx="5" fill="#ebf8ff" /><text x="73" y="168" text-anchor="middle" font-size="9" font-weight="700" fill="#2b6cb0">you</text><text x="104" y="168" font-size="10" font-weight="700" fill="#276749">✓ yes</text><text x="150" y="168" font-size="9.5" font-style="italic" fill="#718096">— in ask mode, you approve each change before it happens</text><rect x="52" y="184" width="42" height="20" rx="5" fill="#faf5ff" /><text x="73" y="198" text-anchor="middle" font-size="9" font-weight="700" fill="#6b46c1">agent</text><text x="104" y="198" font-size="10" fill="#2d3748">Moved 88 files into folders; renamed 12 cryptic ones.</text><rect x="640" y="184" width="70" height="20" rx="5" fill="#faf5ff" stroke="#d6bcfa" stroke-width="1" /><text x="675" y="198" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6b46c1">act</text><rect x="52" y="214" width="42" height="20" rx="5" fill="#fffaf0" /><text x="73" y="228" text-anchor="middle" font-size="9" font-weight="700" fill="#c05621">agent</text><text x="104" y="228" font-size="10" fill="#2d3748">Checking: 100/100 sorted? 3 are unmatched — sorting those now.</text><rect x="636" y="214" width="74" height="20" rx="5" fill="#fffaf0" stroke="#fbd38d" stroke-width="1" /><text x="673" y="228" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c05621">verify</text><rect x="52" y="244" width="42" height="20" rx="5" fill="#faf5ff" /><text x="73" y="258" text-anchor="middle" font-size="9" font-weight="700" fill="#6b46c1">agent</text><text x="104" y="258" font-size="10" fill="#2d3748">Handled the last 3. Writing index.md describing every folder…</text><rect x="640" y="244" width="70" height="20" rx="5" fill="#faf5ff" stroke="#d6bcfa" stroke-width="1" /><text x="675" y="258" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6b46c1">act</text><rect x="52" y="274" width="42" height="20" rx="5" fill="#f0fff4" /><text x="73" y="288" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">agent</text><text x="104" y="288" font-size="10" font-weight="700" fill="#276749">Done: 100 sorted, 12 renamed, index written.</text><rect x="636" y="274" width="74" height="20" rx="5" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1" /><text x="673" y="288" text-anchor="middle" font-size="8.5" font-weight="700" fill="#276749">done</text><rect x="52" y="304" width="42" height="20" rx="5" fill="#ebf8ff" /><text x="73" y="318" text-anchor="middle" font-size="9" font-weight="700" fill="#2b6cb0">you</text><text x="104" y="318" font-size="10" fill="#2d3748">Open the folder and review it. ✓</text><text x="380" y="362" text-anchor="middle" font-size="10.5" fill="#718096">You give one goal and approve the changes; the agent gathers, acts, and verifies on its own, round after round.</text></svg>
