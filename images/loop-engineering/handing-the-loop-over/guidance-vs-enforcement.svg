<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="372" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">What you tell it vs. what it's allowed to do — two different layers</text><rect x="40" y="62" width="250" height="60" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="165" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">Your prompt + CLAUDE.md</text><text x="165" y="101" text-anchor="middle" font-size="8.5" fill="#3182ce">GUIDANCE — shapes what it tries</text><text x="165" y="114" text-anchor="middle" font-size="8.5" font-style="italic" fill="#c53030">"don't delete anything" = a request, not a lock</text><line x1="290" y1="92" x2="326" y2="92" stroke="#a0aec0" stroke-width="2" /><polygon points="326 92 316 87 316 97" fill="#a0aec0" /><rect x="328" y="62" width="250" height="60" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="453" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">Agent decides an action</text><text x="453" y="101" text-anchor="middle" font-size="8.5" fill="#805ad5">what it will try to do next</text><text x="453" y="114" text-anchor="middle" font-size="8.5" font-style="italic" fill="#805ad5">e.g. "delete the old-drafts folder"</text><line x1="453" y1="122" x2="453" y2="152" stroke="#a0aec0" stroke-width="2" /><polygon points="453 152 448 142 458 142" fill="#a0aec0" /><rect x="120" y="154" width="520" height="150" rx="12" fill="#fffaf0" stroke="#ed8936" stroke-width="2.4" /><text x="380" y="176" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c05621">ENFORCEMENT — what it's ALLOWED</text><text x="380" y="190" text-anchor="middle" font-size="8.5" fill="#9c4221">checked by the tool itself, not the model · first match in this order wins</text><rect x="140" y="200" width="150" height="42" rx="7" fill="#fff5f5" stroke="#fc8181" stroke-width="1.4" /><text x="215" y="218" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c53030">1 · deny</text><text x="215" y="233" text-anchor="middle" font-size="8.5" fill="#9b2c2c">✗ blocked outright</text><rect x="305" y="200" width="150" height="42" rx="7" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" /><text x="380" y="218" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c05621">2 · ask</text><text x="380" y="233" text-anchor="middle" font-size="8.5" fill="#9c4221">? pauses and asks you</text><rect x="470" y="200" width="150" height="42" rx="7" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="545" y="218" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">3 · allow</text><text x="545" y="233" text-anchor="middle" font-size="8.5" fill="#2f855a">✓ runs automatically</text><text x="380" y="266" text-anchor="middle" font-size="9" fill="#9c4221">A broad <tspan font-weight="700">deny</tspan> beats a narrow <tspan font-weight="700">allow</tspan> — so the safe default is "deny the dangerous, ask for the rest".</text><text x="380" y="286" text-anchor="middle" font-size="9" fill="#9c4221">The agent can only do what this layer permits — even if the prompt or CLAUDE.md told it otherwise.</text><text x="380" y="336" text-anchor="middle" font-size="10.5" fill="#718096">Writing a rule in CLAUDE.md shapes intent; the permission layer is the real lock. Never rely on guidance for safety —</text><text x="380" y="354" text-anchor="middle" font-size="10.5" fill="#718096">set the permissions so the agent literally cannot touch what must not be touched.</text></svg>
