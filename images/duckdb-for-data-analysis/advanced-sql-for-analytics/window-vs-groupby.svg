<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="380" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">GROUP BY Collapses. A Window Function Doesn't.</text>

  <text x="170" y="58" text-anchor="middle" font-size="11.5" font-weight="700" fill="#742a2a">GROUP BY category</text>
  <rect x="40" y="70" width="120" height="26" rx="4" fill="#fed7d7" stroke="#fc8181" stroke-width="1" />
  <text x="100" y="87" text-anchor="middle" font-size="8.5" font-family="Menlo, monospace" fill="#742a2a">Bath, product A</text>
  <rect x="180" y="70" width="120" height="26" rx="4" fill="#fed7d7" stroke="#fc8181" stroke-width="1" />
  <text x="240" y="87" text-anchor="middle" font-size="8.5" font-family="Menlo, monospace" fill="#742a2a">Bath, product B</text>
  <rect x="40" y="100" width="260" height="26" rx="4" fill="#fed7d7" stroke="#fc8181" stroke-width="1" />
  <text x="170" y="117" text-anchor="middle" font-size="8.5" font-family="Menlo, monospace" fill="#742a2a">Bath, product C ... (8 rows)</text>

  <line x1="170" y1="126" x2="170" y2="156" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowW)" />

  <rect x="70" y="156" width="200" height="40" rx="6" fill="#742a2a" />
  <text x="170" y="181" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">1 collapsed row per category</text>

  <text x="600" y="58" text-anchor="middle" font-size="11.5" font-weight="700" fill="#22543d">OVER (PARTITION BY category ...)</text>
  <rect x="470" y="70" width="120" height="26" rx="4" fill="#c6f6d5" stroke="#48bb78" stroke-width="1" />
  <text x="530" y="87" text-anchor="middle" font-size="8.5" font-family="Menlo, monospace" fill="#22543d">Bath, A, rn=1</text>
  <rect x="610" y="70" width="120" height="26" rx="4" fill="#c6f6d5" stroke="#48bb78" stroke-width="1" />
  <text x="670" y="87" text-anchor="middle" font-size="8.5" font-family="Menlo, monospace" fill="#22543d">Bath, B, rn=2</text>
  <rect x="470" y="100" width="260" height="26" rx="4" fill="#c6f6d5" stroke="#48bb78" stroke-width="1" />
  <text x="600" y="117" text-anchor="middle" font-size="8.5" font-family="Menlo, monospace" fill="#22543d">Bath, C, rn=3 ... (still 8 rows)</text>

  <line x1="600" y1="126" x2="600" y2="156" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowW)" />

  <rect x="480" y="156" width="240" height="40" rx="6" fill="#22543d" />
  <text x="600" y="181" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">every row kept, enriched with rn</text>

  <rect x="60" y="220" width="680" height="120" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="400" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#2c5282">Filter the enriched rows to WHERE rn &lt;= 3</text>
  <text x="400" y="270" text-anchor="middle" font-size="10" fill="#2c5282">8 categories x top 3 each = 24 rows</text>
  <text x="400" y="290" text-anchor="middle" font-size="10" fill="#2c5282">a "top N per group" answer GROUP BY alone</text>
  <text x="400" y="308" text-anchor="middle" font-size="10" fill="#2c5282">can never produce -- it only ever returns 1 row per group</text>

  <defs>
    <marker id="arrowW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
