<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="380" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Four Date Tools, One Real Question</text>

  <rect x="40" y="54" width="170" height="66" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="125" y="78" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Menlo, monospace" fill="#2c5282">extract(dow FROM d)</text>
  <text x="125" y="98" text-anchor="middle" font-size="9" fill="#2c5282">a number, 0-6</text>
  <text x="125" y="112" text-anchor="middle" font-size="9" fill="#2c5282">for correct sorting</text>

  <rect x="220" y="54" width="170" height="66" rx="8" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.3" />
  <text x="305" y="78" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Menlo, monospace" fill="#22543d">strftime(d, '%A')</text>
  <text x="305" y="98" text-anchor="middle" font-size="9" fill="#22543d">'Friday'</text>
  <text x="305" y="112" text-anchor="middle" font-size="9" fill="#22543d">for display</text>

  <rect x="400" y="54" width="170" height="66" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.3" />
  <text x="485" y="78" text-anchor="middle" font-size="10" font-weight="700" font-family="Menlo, monospace" fill="#9c4221">d + INTERVAL 30 DAY</text>
  <text x="485" y="98" text-anchor="middle" font-size="9" fill="#9c4221">date arithmetic</text>
  <text x="485" y="112" text-anchor="middle" font-size="9" fill="#9c4221">no manual math</text>

  <rect x="580" y="54" width="180" height="66" rx="8" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="670" y="78" text-anchor="middle" font-size="10" font-weight="700" font-family="Menlo, monospace" fill="#742a2a">date_diff('day', a, b)</text>
  <text x="670" y="98" text-anchor="middle" font-size="9" fill="#742a2a">730 days</text>
  <text x="670" y="112" text-anchor="middle" font-size="9" fill="#742a2a">span between two dates</text>

  <line x1="400" y1="120" x2="400" y2="156" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowD)" />

  <rect x="150" y="156" width="500" height="52" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />
  <text x="400" y="180" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">GROUP BY weekday, extract(dow ...) ORDER BY dow_num</text>
  <text x="400" y="198" text-anchor="middle" font-size="9" fill="#718096">correct calendar order, not alphabetical</text>

  <line x1="400" y1="208" x2="400" y2="242" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowD)" />

  <rect x="130" y="242" width="540" height="70" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="400" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#22543d">Friday earns the most: $1,405,259.16</text>
  <text x="400" y="288" text-anchor="middle" font-size="9.5" fill="#276749">all 7 days sum to exactly $9,195,043.62</text>

  <defs>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
