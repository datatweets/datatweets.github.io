<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="400" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Partition Pruning: Skipping Whole Files</text>

  <text x="400" y="58" text-anchor="middle" font-size="10.5" fill="#718096">COPY jan_sample TO ... (PARTITION_BY (pickup_day))</text>

  <rect x="60" y="72" width="160" height="52" rx="6" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="140" y="94" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#742a2a">pickup_day=1</text>
  <text x="140" y="110" text-anchor="middle" font-size="9" fill="#9c4221">skipped</text>

  <rect x="240" y="72" width="160" height="52" rx="6" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="320" y="94" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#742a2a">pickup_day=2</text>
  <text x="320" y="110" text-anchor="middle" font-size="9" fill="#9c4221">skipped</text>

  <rect x="420" y="72" width="160" height="52" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" />
  <text x="500" y="94" text-anchor="middle" font-size="9.5" font-weight="700" font-family="Menlo, monospace" fill="#2c5282">pickup_day=3</text>
  <text x="500" y="110" text-anchor="middle" font-size="9" font-weight="700" fill="#2c5282">SCANNED</text>

  <rect x="600" y="72" width="160" height="52" rx="6" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="680" y="94" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#742a2a">pickup_day=4</text>
  <text x="680" y="110" text-anchor="middle" font-size="9" fill="#9c4221">skipped</text>

  <line x1="140" y1="124" x2="450" y2="164" stroke="#cbd5e0" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="320" y1="124" x2="470" y2="164" stroke="#cbd5e0" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="500" y1="124" x2="500" y2="164" stroke="#4299e1" stroke-width="1.8" marker-end="url(#arrowPP)" />
  <line x1="680" y1="124" x2="550" y2="164" stroke="#cbd5e0" stroke-width="1.2" stroke-dasharray="3,3" />

  <rect x="250" y="164" width="300" height="60" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="400" y="188" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">WHERE pickup_day = 3</text>
  <text x="400" y="206" text-anchor="middle" font-size="9.5" fill="#2c5282">only the matching partition opens</text>

  <line x1="400" y1="224" x2="400" y2="256" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowPP)" />

  <rect x="220" y="256" width="360" height="56" rx="8" fill="#22543d" />
  <text x="400" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">EXPLAIN: Scanning Files: 1/4</text>
  <text x="400" y="298" text-anchor="middle" font-size="9.5" fill="#c6f6d5">confirmed directly, not assumed</text>

  <rect x="90" y="336" width="620" height="50" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />
  <text x="400" y="360" text-anchor="middle" font-size="10" fill="#2d3748">The 3 skipped files' bytes are never even read -- pruned by folder name alone</text>

  <defs>
    <marker id="arrowPP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
