<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="380" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">httpfs: Autoload or Install Explicitly</text>

  <rect x="60" y="52" width="300" height="50" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="210" y="72" text-anchor="middle" font-size="10" font-weight="700" font-family="Menlo, monospace" fill="#2c5282">read_parquet('https://...')</text>
  <text x="210" y="88" text-anchor="middle" font-size="9" fill="#2c5282">query a URL directly</text>

  <rect x="440" y="52" width="300" height="50" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.3" />
  <text x="590" y="72" text-anchor="middle" font-size="10" font-weight="700" font-family="Menlo, monospace" fill="#9c4221">INSTALL httpfs; LOAD httpfs;</text>
  <text x="590" y="88" text-anchor="middle" font-size="9" fill="#9c4221">explicit, spelled out</text>

  <line x1="210" y1="102" x2="210" y2="140" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowH)" />
  <line x1="590" y1="102" x2="590" y2="140" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowH)" />

  <rect x="60" y="140" width="300" height="46" rx="6" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.3" />
  <text x="210" y="168" text-anchor="middle" font-size="10" fill="#22543d">autoloads on first use</text>

  <rect x="440" y="140" width="300" height="46" rx="6" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.3" />
  <text x="590" y="168" text-anchor="middle" font-size="10" fill="#22543d">loaded immediately</text>

  <line x1="210" y1="186" x2="360" y2="222" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowH)" />
  <line x1="590" y1="186" x2="440" y2="222" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowH)" />

  <rect x="220" y="222" width="360" height="56" rx="8" fill="#22543d" />
  <text x="400" y="246" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">duckdb_extensions() confirms</text>
  <text x="400" y="264" text-anchor="middle" font-size="10" font-family="Menlo, monospace" fill="#ffffff">('httpfs', loaded=True, installed=True)</text>

  <rect x="90" y="304" width="620" height="56" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />
  <text x="400" y="328" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">Real files, real HEAD request: 49,961,641 bytes, remote = local</text>
  <text x="400" y="346" text-anchor="middle" font-size="9.5" fill="#718096">accept-ranges: bytes -- reads only what a query needs, not the whole file</text>

  <defs>
    <marker id="arrowH" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
