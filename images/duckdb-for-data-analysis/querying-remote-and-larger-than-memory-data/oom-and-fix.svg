<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="400" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">A Real OOM, Then a Real Fix</text>

  <text x="400" y="56" text-anchor="middle" font-size="10.5" fill="#718096">Sort 9,554,778 rows x 19 columns, memory_limit='200MB'</text>

  <rect x="60" y="72" width="320" height="66" rx="8" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="220" y="96" text-anchor="middle" font-size="10.5" font-weight="700" fill="#742a2a">threads=10 (default)</text>
  <text x="220" y="114" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#9c4221">OutOfMemoryException</text>
  <text x="220" y="130" text-anchor="middle" font-size="9" fill="#9c4221">~20MB per thread -- not enough</text>

  <rect x="420" y="72" width="320" height="66" rx="8" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.3" />
  <text x="580" y="96" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22543d">threads=2, preserve_insertion_order=false</text>
  <text x="580" y="114" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#276749">succeeds</text>
  <text x="580" y="130" text-anchor="middle" font-size="9" fill="#276749">~100MB per thread -- workable</text>

  <line x1="220" y1="138" x2="220" y2="170" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowM)" />
  <line x1="580" y1="138" x2="580" y2="170" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowM)" />

  <rect x="60" y="170" width="320" height="44" rx="6" fill="#742a2a" />
  <text x="220" y="197" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">fails immediately, no result</text>

  <rect x="420" y="170" width="320" height="44" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="1.3" />
  <text x="580" y="197" text-anchor="middle" font-size="10" fill="#9c4221">spills to temp_directory on disk</text>

  <line x1="580" y1="214" x2="580" y2="246" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowM)" />

  <rect x="380" y="246" width="360" height="60" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="560" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#22543d">9,554,778 rows -- correct</text>
  <text x="560" y="288" text-anchor="middle" font-size="9.5" fill="#276749">15.14s vs 1.45s default -- 10.4x slower, honest</text>

  <rect x="90" y="330" width="620" height="50" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="400" y="352" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">Not a crash, not wrong results --</text>
  <text x="400" y="370" text-anchor="middle" font-size="9.5" fill="#2c5282">a real, measured cost for finishing correctly within a tight budget</text>

  <defs>
    <marker id="arrowM" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
