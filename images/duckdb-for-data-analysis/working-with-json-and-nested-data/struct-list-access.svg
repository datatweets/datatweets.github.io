<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="360" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Two Ways to Say the Same Thing</text>

  <rect x="60" y="56" width="330" height="56" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="225" y="80" text-anchor="middle" font-size="11" font-weight="700" font-family="Menlo, monospace" fill="#2c5282">line_items[1].product_id</text>
  <text x="225" y="98" text-anchor="middle" font-size="9" fill="#2c5282">bracket index + dot notation</text>

  <rect x="410" y="56" width="330" height="56" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="575" y="80" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Menlo, monospace" fill="#2c5282">struct_extract(list_extract(</text>
  <text x="575" y="96" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Menlo, monospace" fill="#2c5282">line_items, 1), 'product_id')</text>

  <text x="400" y="140" text-anchor="middle" font-size="20" fill="#48bb78">=</text>

  <rect x="220" y="164" width="360" height="52" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="400" y="196" text-anchor="middle" font-size="12" font-weight="700" font-family="Menlo, monospace" fill="#22543d">'P019' -- identical result, every row</text>

  <rect x="60" y="244" width="680" height="90" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="400" y="270" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9c4221">Shorthand for everyday use, function forms for the edge cases</text>
  <text x="400" y="290" text-anchor="middle" font-size="10" fill="#9c4221">Dot notation and bracket indexing read naturally in most queries --</text>
  <text x="400" y="307" text-anchor="middle" font-size="10" fill="#9c4221">struct_extract()/list_extract() matter when a field name isn't a valid identifier</text>
  <text x="400" y="324" text-anchor="middle" font-size="10" fill="#9c4221">or the field/index is built dynamically at query time</text>
</svg>
