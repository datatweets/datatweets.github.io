<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="400" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">UNNEST, Then Verify Against a Different Source</text>

  <rect x="40" y="52" width="220" height="56" rx="8" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="150" y="76" text-anchor="middle" font-size="10.5" font-weight="700" fill="#742a2a">orders_nested</text>
  <text x="150" y="94" text-anchor="middle" font-size="9" fill="#9c4221">792 rows, line_items list</text>

  <line x1="260" y1="80" x2="305" y2="80" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowU)" />

  <rect x="305" y="52" width="220" height="56" rx="8" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.3" />
  <text x="415" y="76" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22543d">UNNEST(line_items)</text>
  <text x="415" y="94" text-anchor="middle" font-size="9" fill="#276749">1892 flat rows</text>

  <rect x="565" y="52" width="200" height="56" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="665" y="76" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">orders.csv +</text>
  <text x="665" y="94" text-anchor="middle" font-size="9.5" fill="#2c5282">order_items.csv join</text>

  <line x1="415" y1="108" x2="415" y2="150" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowU)" />
  <line x1="665" y1="108" x2="500" y2="150" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowU)" />

  <rect x="150" y="150" width="500" height="56" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="400" y="174" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9c4221">two completely independent code paths</text>
  <text x="400" y="192" text-anchor="middle" font-size="9.5" fill="#9c4221">nested JSON flattened vs. two CSVs joined</text>

  <line x1="400" y1="206" x2="400" y2="238" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowU)" />

  <rect x="150" y="238" width="500" height="70" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="400" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#22543d">1892 rows -- $1,262,892.88</text>
  <text x="400" y="288" text-anchor="middle" font-size="9.5" fill="#276749">exact match, both sources, both metrics</text>

  <rect x="90" y="336" width="620" height="46" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />
  <text x="400" y="364" text-anchor="middle" font-size="10" fill="#2d3748">Same 792 real orders -- just shaped differently in each source file</text>

  <defs>
    <marker id="arrowU" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
