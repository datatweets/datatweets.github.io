<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="420" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">One Nested File, Split and Verified</text>

  <rect x="290" y="52" width="220" height="52" rx="8" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="400" y="74" text-anchor="middle" font-size="10.5" font-weight="700" fill="#742a2a">orders_nested.json</text>
  <text x="400" y="92" text-anchor="middle" font-size="9" fill="#9c4221">792 orders, nested line_items</text>

  <line x1="350" y1="104" x2="220" y2="140" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowN)" />
  <line x1="450" y1="104" x2="580" y2="140" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowN)" />

  <rect x="60" y="140" width="320" height="56" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="220" y="163" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">orders_normalized (792 rows)</text>
  <text x="220" y="181" text-anchor="middle" font-size="9" fill="#2c5282">matches orders.csv row for row</text>

  <rect x="420" y="140" width="320" height="56" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="580" y="163" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">order_items_normalized (1892 rows)</text>
  <text x="580" y="181" text-anchor="middle" font-size="9" fill="#2c5282">$1,262,892.88 -- matches the CSV join</text>

  <line x1="220" y1="196" x2="330" y2="230" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowN)" />
  <line x1="580" y1="196" x2="470" y2="230" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowN)" />

  <rect x="180" y="230" width="440" height="52" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="400" y="252" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22543d">both reconciled exactly against canonical CSVs</text>
  <text x="400" y="270" text-anchor="middle" font-size="9.5" fill="#276749">full row comparison, not just counts</text>

  <line x1="400" y1="282" x2="400" y2="314" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowN)" />

  <rect x="230" y="314" width="340" height="48" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="400" y="343" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9c4221">written back out to JSON, verified on read-back</text>

  <rect x="90" y="382" width="620" height="1" fill="none" />
  <text x="400" y="398" text-anchor="middle" font-size="10" fill="#718096">Same data, three shapes -- nested, normalized tables, JSON export -- one set of numbers</text>

  <defs>
    <marker id="arrowN" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
