<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="400" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">duckdb.connect() -- With and Without a Path</text>

  <text x="205" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#742a2a">duckdb.connect()</text>
  <rect x="60" y="72" width="290" height="46" rx="6" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="205" y="100" text-anchor="middle" font-size="11" font-family="Menlo, monospace" fill="#742a2a">current_database() = 'memory'</text>

  <line x1="205" y1="118" x2="205" y2="150" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowM)" />

  <rect x="60" y="150" width="290" height="56" rx="6" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="205" y="172" text-anchor="middle" font-size="10.5" font-weight="700" fill="#742a2a">private to that one connection</text>
  <text x="205" y="190" text-anchor="middle" font-size="9.5" fill="#9c4221">a 2nd connect() can't see it</text>

  <line x1="205" y1="206" x2="205" y2="238" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowM)" />

  <rect x="60" y="238" width="290" height="46" rx="6" fill="#742a2a" />
  <text x="205" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">gone the moment it closes</text>

  <text x="595" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#22543d">duckdb.connect('thistlewood.duckdb')</text>
  <rect x="450" y="72" width="290" height="46" rx="6" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.3" />
  <text x="595" y="100" text-anchor="middle" font-size="11" font-family="Menlo, monospace" fill="#22543d">a real file on disk</text>

  <line x1="595" y1="118" x2="595" y2="150" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowM)" />

  <rect x="450" y="150" width="290" height="56" rx="6" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.3" />
  <text x="595" y="172" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22543d">any connection to that path</text>
  <text x="595" y="190" text-anchor="middle" font-size="9.5" fill="#276749">sees the same data</text>

  <line x1="595" y1="206" x2="595" y2="238" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowM)" />

  <rect x="450" y="238" width="290" height="46" rx="6" fill="#22543d" />
  <text x="595" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">survives close + reopen</text>

  <rect x="60" y="316" width="680" height="60" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="400" y="340" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">Every module up to now used the left side on purpose</text>
  <text x="400" y="358" text-anchor="middle" font-size="10.5" fill="#2c5282">This module uses the right side deliberately, for the first time</text>

  <defs>
    <marker id="arrowM" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
