<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="400" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Two Files, One Session, One Join</text>

  <text x="175" y="62" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2c5282">thistlewood_core.duckdb</text>
  <rect x="40" y="76" width="270" height="52" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="175" y="107" text-anchor="middle" font-size="10.5" font-family="Menlo, monospace" fill="#2c5282">customers (180 rows, segment)</text>

  <text x="625" y="62" text-anchor="middle" font-size="11.5" font-weight="700" fill="#742a2a">thistlewood_activity.duckdb</text>
  <rect x="490" y="76" width="270" height="52" rx="8" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="625" y="97" text-anchor="middle" font-size="10" font-family="Menlo, monospace" fill="#742a2a">orders (6,000)</text>
  <text x="625" y="115" text-anchor="middle" font-size="10" font-family="Menlo, monospace" fill="#742a2a">order_items (14,054)</text>

  <line x1="175" y1="128" x2="330" y2="170" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowA)" />
  <line x1="625" y1="128" x2="470" y2="170" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowA)" />

  <rect x="220" y="170" width="360" height="60" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="400" y="194" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9c4221">ATTACH core / ATTACH activity</text>
  <text x="400" y="212" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#9c4221">one connection, both databases</text>

  <line x1="400" y1="230" x2="400" y2="262" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowA)" />

  <rect x="130" y="262" width="540" height="48" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />
  <text x="400" y="290" text-anchor="middle" font-size="10" font-family="Menlo, monospace" fill="#2d3748">JOIN activity.orders + activity.order_items + core.customers</text>

  <line x1="400" y1="310" x2="400" y2="342" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowA)" />

  <rect x="130" y="342" width="540" height="46" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="400" y="370" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22543d">retail + wholesale = $9,195,043.62 -- this course's established total</text>

  <defs>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
