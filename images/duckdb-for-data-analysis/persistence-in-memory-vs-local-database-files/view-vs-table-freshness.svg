<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="400" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Same Query, Same Start -- One New Row Later</text>

  <rect x="290" y="50" width="220" height="44" rx="6" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />
  <text x="400" y="77" text-anchor="middle" font-size="10.5" font-family="Menlo, monospace" fill="#2d3748">Kitchen revenue: $1,418,309.48</text>

  <line x1="330" y1="94" x2="220" y2="126" stroke="#a0aec0" stroke-width="1.3" marker-end="url(#arrowV)" />
  <line x1="470" y1="94" x2="580" y2="126" stroke="#a0aec0" stroke-width="1.3" marker-end="url(#arrowV)" />

  <text x="150" y="120" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">CREATE VIEW category_revenue</text>
  <rect x="40" y="126" width="220" height="40" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="150" y="151" text-anchor="middle" font-size="9.5" fill="#2c5282">stores the query, not the result</text>

  <text x="650" y="120" text-anchor="middle" font-size="10.5" font-weight="700" fill="#742a2a">CREATE TABLE ... snapshot</text>
  <rect x="540" y="126" width="220" height="40" rx="6" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="650" y="151" text-anchor="middle" font-size="9.5" fill="#742a2a">stores the result, not the query</text>

  <rect x="280" y="182" width="240" height="40" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="400" y="207" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9c4221">INSERT one new order_item row</text>

  <line x1="330" y1="222" x2="180" y2="254" stroke="#a0aec0" stroke-width="1.3" marker-end="url(#arrowV)" />
  <line x1="470" y1="222" x2="640" y2="254" stroke="#a0aec0" stroke-width="1.3" marker-end="url(#arrowV)" />

  <rect x="60" y="254" width="240" height="56" rx="6" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.4" />
  <text x="180" y="277" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22543d">view re-runs the query</text>
  <text x="180" y="295" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#22543d">$1,422,098.18 -- moved</text>

  <rect x="500" y="254" width="240" height="56" rx="6" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" />
  <text x="620" y="277" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">table stays frozen</text>
  <text x="620" y="295" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#2d3748">$1,418,309.48 -- unchanged</text>

  <rect x="60" y="336" width="680" height="46" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="400" y="364" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22543d">The view's increase ($3,788.70) matches the new row's value exactly</text>

  <defs>
    <marker id="arrowV" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
