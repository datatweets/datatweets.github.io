<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="420" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Build, Reopen, Attach, Report</text>

  <rect x="40" y="52" width="260" height="70" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="170" y="74" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">thistlewood_analytics.duckdb</text>
  <text x="170" y="92" text-anchor="middle" font-size="9" font-family="Menlo, monospace" fill="#2c5282">customers, products, orders,</text>
  <text x="170" y="107" text-anchor="middle" font-size="9" font-family="Menlo, monospace" fill="#2c5282">order_items + category_revenue view</text>

  <line x1="170" y1="122" x2="170" y2="154" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowG)" />

  <rect x="40" y="154" width="260" height="46" rx="8" fill="#22543d" />
  <text x="170" y="182" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">close + reopen -- data unchanged</text>

  <line x1="300" y1="177" x2="345" y2="177" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowG)" />

  <rect x="345" y="60" width="240" height="60" rx="8" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="465" y="82" text-anchor="middle" font-size="10.5" font-weight="700" fill="#742a2a">thistlewood_returns_catalog.duckdb</text>
  <text x="465" y="100" text-anchor="middle" font-size="9" font-family="Menlo, monospace" fill="#742a2a">returns, promotions</text>

  <line x1="465" y1="120" x2="465" y2="154" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowG)" />

  <rect x="345" y="154" width="240" height="46" rx="8" fill="#ed8936" />
  <text x="465" y="182" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">ATTACH into the same session</text>

  <line x1="170" y1="200" x2="380" y2="240" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowG)" />
  <line x1="465" y1="200" x2="420" y2="240" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowG)" />

  <rect x="150" y="240" width="500" height="52" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />
  <text x="400" y="264" text-anchor="middle" font-size="10" font-family="Menlo, monospace" fill="#2d3748">JOIN returns_catalog.returns + order_items + products</text>
  <text x="400" y="280" text-anchor="middle" font-size="9" fill="#718096">3 tables, 2 database files, one query</text>

  <line x1="400" y1="292" x2="400" y2="324" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowG)" />

  <rect x="120" y="324" width="560" height="72" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="400" y="350" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22543d">$200,232.03 returned -- 2.18% of $9,195,043.62 total revenue</text>
  <text x="400" y="368" text-anchor="middle" font-size="9.5" fill="#276749">a real, checkable rate, from data living in two separate files</text>
  <text x="400" y="384" text-anchor="middle" font-size="9.5" fill="#276749">reconciled a second way in this lesson's exercises</text>

  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
