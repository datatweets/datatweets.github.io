<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="440" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Read EXPLAIN Bottom to Top</text>

  <rect x="60" y="350" width="220" height="46" rx="6" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="170" y="373" text-anchor="middle" font-size="10" font-weight="700" font-family="Menlo, monospace" fill="#742a2a">SEQ_SCAN order_items</text>
  <text x="170" y="388" text-anchor="middle" font-size="8.5" fill="#9c4221">~14,054 rows</text>

  <rect x="520" y="350" width="220" height="46" rx="6" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="630" y="373" text-anchor="middle" font-size="10" font-weight="700" font-family="Menlo, monospace" fill="#742a2a">SEQ_SCAN products</text>
  <text x="630" y="388" text-anchor="middle" font-size="8.5" fill="#9c4221">~60 rows</text>

  <line x1="170" y1="350" x2="360" y2="318" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowQ)" />
  <line x1="630" y1="350" x2="440" y2="318" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowQ)" />

  <rect x="280" y="272" width="240" height="46" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="400" y="295" text-anchor="middle" font-size="10" font-weight="700" font-family="Menlo, monospace" fill="#2c5282">HASH_JOIN (INNER)</text>
  <text x="400" y="310" text-anchor="middle" font-size="8.5" fill="#2c5282">~12,400 rows</text>

  <line x1="400" y1="272" x2="400" y2="240" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowQ)" />

  <rect x="290" y="194" width="220" height="46" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="1.3" />
  <text x="400" y="217" text-anchor="middle" font-size="10" font-weight="700" fill="#9c4221">PROJECTION</text>
  <text x="400" y="232" text-anchor="middle" font-size="8.5" fill="#9c4221">quantity * unit_price</text>

  <line x1="400" y1="194" x2="400" y2="162" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowQ)" />

  <rect x="290" y="116" width="220" height="46" rx="6" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.3" />
  <text x="400" y="139" text-anchor="middle" font-size="10" font-weight="700" fill="#22543d">HASH_GROUP_BY</text>
  <text x="400" y="154" text-anchor="middle" font-size="8.5" fill="#276749">estimate ~5 -- actual 8</text>

  <line x1="400" y1="116" x2="400" y2="84" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowQ)" />

  <rect x="290" y="58" width="220" height="26" rx="6" fill="#22543d" />
  <text x="400" y="76" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">PROJECTION (final SELECT)</text>

  <rect x="60" y="410" width="680" height="24" rx="6" fill="none" />
  <text x="400" y="426" text-anchor="middle" font-size="10" fill="#a0aec0">Execution flows up; the SQL you wrote reads top to bottom -- they're not the same order</text>

  <defs>
    <marker id="arrowQ" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
