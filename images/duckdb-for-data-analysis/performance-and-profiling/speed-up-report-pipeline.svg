<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="400" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Profile, Fix, Verify -- One Real Report</text>

  <rect x="40" y="54" width="220" height="56" rx="8" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="150" y="76" text-anchor="middle" font-size="10.5" font-weight="700" fill="#742a2a">5-row UDF report</text>
  <text x="150" y="94" text-anchor="middle" font-size="9" fill="#9c4221">1.18s</text>

  <line x1="260" y1="82" x2="300" y2="82" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowSR)" />

  <rect x="300" y="54" width="220" height="56" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.3" />
  <text x="410" y="76" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9c4221">EXPLAIN ANALYZE</text>
  <text x="410" y="94" text-anchor="middle" font-size="9" fill="#9c4221">UDF node: 10.70s, rest ~0s</text>

  <line x1="520" y1="82" x2="560" y2="82" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowSR)" />

  <rect x="560" y="54" width="200" height="56" rx="8" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.3" />
  <text x="660" y="76" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22543d">native SQL fix</text>
  <text x="660" y="94" text-anchor="middle" font-size="9" fill="#276749">0.011s</text>

  <line x1="150" y1="110" x2="300" y2="150" stroke="#a0aec0" stroke-width="1.3" marker-end="url(#arrowSR)" />
  <line x1="660" y1="110" x2="500" y2="150" stroke="#a0aec0" stroke-width="1.3" marker-end="url(#arrowSR)" />

  <rect x="230" y="150" width="340" height="60" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="400" y="174" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">identical 5-row result, both ways</text>
  <text x="400" y="192" text-anchor="middle" font-size="9.5" fill="#2c5282">~105x faster -- correctness AND speed verified</text>

  <line x1="400" y1="210" x2="400" y2="242" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowSR)" />

  <rect x="250" y="242" width="300" height="46" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="400" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#22543d">2,964,624 trips, written + verified</text>

  <rect x="90" y="316" width="620" height="50" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />
  <text x="400" y="340" text-anchor="middle" font-size="10" fill="#2d3748">Grouping into 5 rows doesn't fix a per-row UDF --</text>
  <text x="400" y="356" text-anchor="middle" font-size="10" fill="#2d3748">the rewrite is what fixes it, confirmed by profiling both versions</text>

  <defs>
    <marker id="arrowSR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
