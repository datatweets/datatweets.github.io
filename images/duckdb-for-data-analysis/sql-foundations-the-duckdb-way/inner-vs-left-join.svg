<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="400" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">orders JOIN returns: Same ON Condition, Two Results</text>

  <!-- source tables -->
  <rect x="60" y="55" width="180" height="46" rx="6" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />
  <text x="150" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">orders</text>
  <text x="150" y="91" text-anchor="middle" font-size="9.5" fill="#718096">6,000 rows</text>

  <rect x="560" y="55" width="180" height="46" rx="6" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />
  <text x="650" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">returns</text>
  <text x="650" y="91" text-anchor="middle" font-size="9.5" fill="#718096">450 rows</text>

  <text x="400" y="80" text-anchor="middle" font-size="10.5" fill="#718096">ON o.order_id = r.order_id</text>

  <!-- INNER JOIN result -->
  <text x="230" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">INNER JOIN</text>
  <rect x="90" y="152" width="280" height="60" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="230" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#9c4221">450 rows</text>
  <text x="230" y="198" text-anchor="middle" font-size="9.5" fill="#9c4221">only orders WITH a matching return</text>

  <!-- LEFT JOIN result -->
  <text x="570" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">LEFT JOIN</text>
  <rect x="430" y="152" width="280" height="60" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="570" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#2c5282">6,000 rows</text>
  <text x="570" y="198" text-anchor="middle" font-size="9.5" fill="#2c5282">every order, NULL where unmatched</text>

  <rect x="90" y="240" width="620" height="130" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" />

  <text x="115" y="268" font-size="11" font-weight="700" fill="#c05621">INNER JOIN: 450 rows</text>
  <text x="115" y="286" font-size="10" fill="#4a5568">Keeps only orders that have a matching return_id -- every order</text>
  <text x="115" y="302" font-size="10" fill="#4a5568">that was returned, and nothing else.</text>

  <text x="115" y="328" font-size="11" font-weight="700" fill="#2b6cb0">LEFT JOIN: 6,000 rows, 5,550 with NULL returns columns</text>
  <text x="115" y="346" font-size="10" fill="#4a5568">Keeps every order regardless of a match -- WHERE r.order_id IS NULL</text>
  <text x="115" y="360" font-size="10" fill="#4a5568">isolates the 5,550 that were never returned.</text>

</svg>
