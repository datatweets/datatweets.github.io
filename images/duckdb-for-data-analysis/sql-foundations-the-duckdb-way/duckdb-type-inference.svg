<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="400" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Two Ways DuckDB Infers a Type</text>

  <!-- Left: single literal -->
  <text x="200" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">One Literal, Typed on the Spot</text>

  <rect x="60" y="80" width="280" height="40" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="200" y="105" text-anchor="middle" font-size="14" font-family="Menlo, monospace" fill="#2c5282">SELECT typeof(1.5)</text>

  <path d="M200 120 L200 148" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrow1)"  fill="none" />

  <rect x="60" y="150" width="280" height="40" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="200" y="175" text-anchor="middle" font-size="14" font-family="Menlo, monospace" font-weight="700" fill="#276749">DECIMAL(2,1)</text>

  <text x="200" y="215" text-anchor="middle" font-size="9.5" fill="#718096">Exact value, 2 digits, 1 after the point --</text>
  <text x="200" y="228" text-anchor="middle" font-size="9.5" fill="#718096">DuckDB picks the smallest exact type that fits.</text>

  <!-- Divider -->
  <line x1="400" y1="55" x2="400" y2="360" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Right: whole column -->
  <text x="600" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">A Whole Column, Typed Once</text>

  <rect x="460" y="80" width="280" height="90" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="600" y="100" text-anchor="middle" font-size="10.5" font-family="Menlo, monospace" fill="#9c4221">unit_price</text>
  <text x="600" y="118" text-anchor="middle" font-size="10" font-family="Menlo, monospace" fill="#9c4221">64.00</text>
  <text x="600" y="134" text-anchor="middle" font-size="10" font-family="Menlo, monospace" fill="#9c4221">380.87</text>
  <text x="600" y="150" text-anchor="middle" font-size="10" font-family="Menlo, monospace" fill="#9c4221">27.73  ...</text>

  <path d="M600 170 L600 198" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrow2)"  fill="none" />

  <rect x="460" y="200" width="280" height="40" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="600" y="225" text-anchor="middle" font-size="14" font-family="Menlo, monospace" font-weight="700" fill="#276749">DOUBLE</text>

  <text x="600" y="265" text-anchor="middle" font-size="9.5" fill="#718096">One type must fit every value in the column --</text>
  <text x="600" y="278" text-anchor="middle" font-size="9.5" fill="#718096">read_csv_auto infers it once, across all 60 rows.</text>

  <rect x="90" y="310" width="620" height="60" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" />
  <text x="400" y="333" text-anchor="middle" font-size="10.5" fill="#4a5568">A single decimal literal and a whole column of prices can land on</text>
  <text x="400" y="350" text-anchor="middle" font-size="10.5" fill="#4a5568">different numeric types -- both confirmed above, neither assumed.</text>

  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
