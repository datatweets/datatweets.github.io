<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="430" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Two Tied Rows, Two Query Shapes, No Tiebreaker</text>

  <!-- Left: plain ORDER BY LIMIT -->
  <text x="200" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">ORDER BY signup_date DESC LIMIT 8</text>

  <rect x="70" y="72" width="260" height="30" rx="4" fill="#fffaf0" stroke="#ed8936" stroke-width="1.3" />
  <text x="200" y="91" text-anchor="middle" font-size="11" font-family="Menlo, monospace" fill="#9c4221">row 7: C0046  2025-11-01</text>

  <rect x="70" y="104" width="260" height="30" rx="4" fill="#fffaf0" stroke="#ed8936" stroke-width="1.3" />
  <text x="200" y="123" text-anchor="middle" font-size="11" font-family="Menlo, monospace" fill="#9c4221">row 8: C0176  2025-11-01</text>

  <!-- Right: row_number window -->
  <text x="600" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">row_number() OVER (ORDER BY signup_date DESC)</text>

  <rect x="470" y="72" width="260" height="30" rx="4" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="600" y="91" text-anchor="middle" font-size="11" font-family="Menlo, monospace" fill="#2c5282">row 7: C0176  2025-11-01</text>

  <rect x="470" y="104" width="260" height="30" rx="4" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="600" y="123" text-anchor="middle" font-size="11" font-family="Menlo, monospace" fill="#2c5282">row 8: C0046  2025-11-01</text>

  <rect x="90" y="150" width="620" height="46" rx="8" fill="#fdf2f2" stroke="#fc8181" stroke-width="1.4" />
  <text x="400" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c53030">Same two rows, opposite order -- both queries are "correct,"</text>
  <text x="400" y="184" text-anchor="middle" font-size="10.5" fill="#c53030">reproduced directly, not a one-off run-to-run fluke.</text>

  <line x1="400" y1="210" x2="400" y2="240" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowT)" />

  <text x="400" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">+ ORDER BY signup_date DESC, customer_id</text>

  <rect x="270" y="278" width="260" height="30" rx="4" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="400" y="297" text-anchor="middle" font-size="11" font-family="Menlo, monospace" fill="#276749">row 7: C0046  2025-11-01</text>

  <rect x="270" y="310" width="260" height="30" rx="4" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="400" y="329" text-anchor="middle" font-size="11" font-family="Menlo, monospace" fill="#276749">row 8: C0176  2025-11-01</text>

  <rect x="90" y="356" width="620" height="50" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" />
  <text x="400" y="378" text-anchor="middle" font-size="10.5" fill="#4a5568">Both query shapes now agree, always -- the unique customer_id</text>
  <text x="400" y="393" text-anchor="middle" font-size="10.5" fill="#4a5568">column removes every remaining ambiguity in the sort.</text>

  <defs>
    <marker id="arrowT" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
