<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="480" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Four Tools, Four Different Jobs</text>

  <!-- Axis labels -->
  <text x="230" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#718096">EMBEDDED (no server)</text>
  <text x="590" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#718096">SERVER-BASED</text>
  <text x="20" y="145" font-size="11" font-weight="700" fill="#718096" transform="rotate(-90 20 145)" text-anchor="middle">OLTP (rows)</text>
  <text x="20" y="330" font-size="11" font-weight="700" fill="#718096" transform="rotate(-90 20 330)" text-anchor="middle">OLAP (columns)</text>

  <!-- Grid -->
  <line x1="60" y1="65" x2="720" y2="65" stroke="#e2e8f0" stroke-width="1.5" />
  <line x1="60" y1="245" x2="720" y2="245" stroke="#e2e8f0" stroke-width="1.5" />
  <line x1="60" y1="405" x2="720" y2="405" stroke="#e2e8f0" stroke-width="1.5" />
  <line x1="60" y1="65" x2="60" y2="405" stroke="#e2e8f0" stroke-width="1.5" />
  <line x1="400" y1="65" x2="400" y2="405" stroke="#e2e8f0" stroke-width="1.5" />
  <line x1="720" y1="65" x2="720" y2="405" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- SQLite: embedded + OLTP -->
  <rect x="90" y="90" width="280" height="130" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.6" />
  <text x="230" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3748">SQLite</text>
  <text x="230" y="152" text-anchor="middle" font-size="10" fill="#4a5568">Embedded, row-oriented</text>
  <text x="230" y="168" text-anchor="middle" font-size="10" fill="#4a5568">Many small transactional reads/writes</text>
  <text x="230" y="184" text-anchor="middle" font-size="10" fill="#4a5568">Mobile apps, local app storage</text>

  <!-- Postgres: server + OLTP -->
  <rect x="430" y="90" width="260" height="130" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.6" />
  <text x="560" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3748">Postgres</text>
  <text x="560" y="152" text-anchor="middle" font-size="10" fill="#4a5568">Server-based, multi-user</text>
  <text x="560" y="168" text-anchor="middle" font-size="10" fill="#4a5568">Many concurrent writers</text>
  <text x="560" y="184" text-anchor="middle" font-size="10" fill="#4a5568">Production applications</text>

  <!-- DuckDB: embedded + OLAP -->
  <rect x="90" y="270" width="280" height="130" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" />
  <text x="230" y="310" text-anchor="middle" font-size="17" font-weight="700" fill="#2b6cb0">DuckDB</text>
  <text x="230" y="332" text-anchor="middle" font-size="10" fill="#2c5282">Embedded, columnar</text>
  <text x="230" y="348" text-anchor="middle" font-size="10" fill="#2c5282">Scan and aggregate whole columns</text>
  <text x="230" y="364" text-anchor="middle" font-size="10" fill="#2c5282">Local analytics -- this course</text>

  <!-- empty quadrant note -->
  <rect x="430" y="270" width="260" height="130" rx="10" fill="#fdfdfe" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="4 4" />
  <text x="560" y="340" text-anchor="middle" font-size="10" fill="#a0aec0">(server-based + columnar --</text>
  <text x="560" y="356" text-anchor="middle" font-size="10" fill="#a0aec0">not this course's territory)</text>

  <!-- pandas note off-grid -->
  <rect x="60" y="425" width="660" height="45" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="390" y="446" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9c4221">pandas sits outside this grid entirely</text>
  <text x="390" y="461" text-anchor="middle" font-size="9.5" fill="#9c4221">An in-memory DataFrame library, not a SQL database -- you load data into it explicitly, then use Python methods</text>
</svg>
