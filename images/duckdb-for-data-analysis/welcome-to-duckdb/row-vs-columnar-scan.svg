<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="420" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Reading Two Columns Out of Seven</text>

  <!-- Left column: row-oriented -->
  <text x="200" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">Row-Oriented Engine</text>
  <text x="200" y="78" text-anchor="middle" font-size="9.5" fill="#9c4221">must read whole rows</text>

  <g>
    <rect x="70" y="92" width="260" height="24" rx="4" fill="#fffaf0" stroke="#ed8936" stroke-width="1.3" />
    <rect x="70" y="120" width="260" height="24" rx="4" fill="#fffaf0" stroke="#ed8936" stroke-width="1.3" />
    <rect x="70" y="148" width="260" height="24" rx="4" fill="#fffaf0" stroke="#ed8936" stroke-width="1.3" />
    <rect x="70" y="176" width="260" height="24" rx="4" fill="#fffaf0" stroke="#ed8936" stroke-width="1.3" />
    <!-- column dividers, all shaded = all read -->
    <line x1="107" y1="92" x2="107" y2="200" stroke="#ed8936" stroke-width="0.8" stroke-dasharray="2 2" />
    <line x1="144" y1="92" x2="144" y2="200" stroke="#ed8936" stroke-width="0.8" stroke-dasharray="2 2" />
    <line x1="181" y1="92" x2="181" y2="200" stroke="#ed8936" stroke-width="0.8" stroke-dasharray="2 2" />
    <line x1="218" y1="92" x2="218" y2="200" stroke="#ed8936" stroke-width="0.8" stroke-dasharray="2 2" />
    <line x1="255" y1="92" x2="255" y2="200" stroke="#ed8936" stroke-width="0.8" stroke-dasharray="2 2" />
    <line x1="292" y1="92" x2="292" y2="200" stroke="#ed8936" stroke-width="0.8" stroke-dasharray="2 2" />
  </g>
  <text x="200" y="215" text-anchor="middle" font-size="9" fill="#9c4221">every column, every row, even the 5 unused ones</text>

  <rect x="60" y="330" width="280" height="50" rx="8" fill="#fdf2f2" stroke="#fc8181" stroke-width="1.4" />
  <text x="200" y="350" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">Reads all 7 columns</text>
  <text x="200" y="365" text-anchor="middle" font-size="9.5" fill="#c53030">even though only 2 are needed</text>

  <!-- Divider -->
  <line x1="400" y1="55" x2="400" y2="390" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Right column: columnar -->
  <text x="600" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">DuckDB (Columnar)</text>
  <text x="600" y="78" text-anchor="middle" font-size="9.5" fill="#2c5282">reads only the columns a query needs</text>

  <g>
    <rect x="470" y="92" width="260" height="108" rx="4" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="3 3" />
    <!-- 5 unused columns, faint -->
    <rect x="474" y="92" width="33" height="108" fill="#edf2f7" />
    <rect x="510" y="92" width="33" height="108" fill="#edf2f7" />
    <rect x="619" y="92" width="33" height="108" fill="#edf2f7" />
    <rect x="655" y="92" width="33" height="108" fill="#edf2f7" />
    <rect x="691" y="92" width="35" height="108" fill="#edf2f7" />
    <!-- 2 used columns, highlighted -->
    <rect x="546" y="92" width="35" height="108" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" />
    <rect x="584" y="92" width="33" height="108" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" />
  </g>
  <text x="563" y="212" text-anchor="middle" font-size="8.5" fill="#2b6cb0">category</text>
  <text x="600" y="222" text-anchor="middle" font-size="8.5" fill="#2b6cb0">unit_price</text>
  <text x="600" y="235" text-anchor="middle" font-size="8" fill="#a0aec0">(5 other columns skipped entirely)</text>

  <rect x="460" y="330" width="280" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="600" y="350" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">Reads only category and unit_price</text>
  <text x="600" y="365" text-anchor="middle" font-size="9.5" fill="#2f855a">confirmed via EXPLAIN's Projections list</text>

  <text x="400" y="405" text-anchor="middle" font-size="10.5" fill="#718096">Same query, same file: a row-oriented scan touches every column; DuckDB's columnar scan touches only what the query projects.</text>
</svg>
