<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="400" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Zero-Copy: Reading a DataFrame's Own Memory</text>

  <rect x="40" y="56" width="220" height="56" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="150" y="80" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">pandas DataFrame</text>
  <text x="150" y="98" text-anchor="middle" font-size="9" fill="#2c5282">orders_pd</text>

  <rect x="290" y="56" width="220" height="56" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.3" />
  <text x="400" y="80" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9c4221">Polars DataFrame</text>
  <text x="400" y="98" text-anchor="middle" font-size="9" fill="#9c4221">orders_pl</text>

  <rect x="540" y="56" width="220" height="56" rx="8" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="650" y="80" text-anchor="middle" font-size="10.5" font-weight="700" fill="#742a2a">CSV file</text>
  <text x="650" y="98" text-anchor="middle" font-size="9" fill="#742a2a">re-read + re-parsed every query</text>

  <line x1="150" y1="112" x2="300" y2="150" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowZ)" />
  <line x1="400" y1="112" x2="360" y2="150" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowZ)" />
  <line x1="650" y1="112" x2="500" y2="150" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowZ)" />

  <rect x="150" y="150" width="360" height="56" rx="8" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.4" />
  <text x="330" y="172" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22543d">Arrow-compatible memory, read in place</text>
  <text x="330" y="190" text-anchor="middle" font-size="9.5" fill="#276749">no copy, no export, no parse step</text>

  <rect x="540" y="150" width="220" height="56" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />
  <text x="650" y="172" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">parsed from scratch</text>
  <text x="650" y="190" text-anchor="middle" font-size="9.5" fill="#718096">every single query</text>

  <line x1="330" y1="206" x2="330" y2="238" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowZ)" />
  <line x1="650" y1="206" x2="650" y2="238" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowZ)" />

  <rect x="150" y="238" width="360" height="46" rx="8" fill="#22543d" />
  <text x="330" y="266" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">measurably faster, repeated queries</text>

  <rect x="540" y="238" width="220" height="46" rx="8" fill="#4a5568" />
  <text x="650" y="266" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">slower, every time</text>

  <rect x="60" y="316" width="680" height="56" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="400" y="340" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">Same SQL, same query engine -- pandas and Polars both work identically</text>
  <text x="400" y="358" text-anchor="middle" font-size="9.5" fill="#2c5282">DuckDB doesn't care which DataFrame library produced the data</text>

  <defs>
    <marker id="arrowZ" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
