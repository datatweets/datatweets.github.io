<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="380" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Same Engine, Two Interfaces</text>

  <text x="180" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#742a2a">DuckDB CLI</text>
  <rect x="50" y="74" width="260" height="46" rx="6" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="180" y="102" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#742a2a">duckdb -csv -c "..." | jq</text>

  <line x1="180" y1="120" x2="180" y2="152" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowC)" />

  <rect x="50" y="152" width="260" height="56" rx="6" fill="#742a2a" />
  <text x="180" y="176" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">one-off queries,</text>
  <text x="180" y="194" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">shell pipelines</text>

  <text x="620" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#22543d">Python script</text>
  <rect x="490" y="74" width="260" height="46" rx="6" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.3" />
  <text x="620" y="96" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#22543d">for category in categories:</text>
  <text x="620" y="112" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#22543d">con.execute(sql, [category])</text>

  <line x1="620" y1="120" x2="620" y2="152" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowC)" />

  <rect x="490" y="152" width="260" height="56" rx="6" fill="#22543d" />
  <text x="620" y="176" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">loops, conditionals,</text>
  <text x="620" y="194" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">parameterized queries</text>

  <line x1="180" y1="208" x2="350" y2="248" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowC)" />
  <line x1="620" y1="208" x2="450" y2="248" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowC)" />

  <rect x="220" y="248" width="360" height="52" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="400" y="272" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">the identical DuckDB query engine</text>
  <text x="400" y="290" text-anchor="middle" font-size="9.5" fill="#2c5282">confirmed to agree exactly on a shared query</text>

  <rect x="90" y="326" width="620" height="42" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />
  <text x="400" y="352" text-anchor="middle" font-size="10" fill="#2d3748">Choose based on the task's shape, not which one is already open</text>

  <defs>
    <marker id="arrowC" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
