<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="420" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Three read_csv() Options, Three Real Problems</text>

  <rect x="40" y="56" width="230" height="150" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />
  <text x="155" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">A file that isn't the default shape</text>
  <text x="60" y="102" font-size="10.5" font-family="Menlo, monospace" fill="#718096"># exported 2026-08-12</text>
  <text x="60" y="122" font-size="10.5" font-family="Menlo, monospace" fill="#718096">product_id|unit_price</text>
  <text x="60" y="142" font-size="10.5" font-family="Menlo, monospace" fill="#718096">P001|64.0</text>
  <text x="60" y="162" font-size="10.5" font-family="Menlo, monospace" fill="#718096">P002|181.52</text>
  <text x="155" y="190" text-anchor="middle" font-size="9.5" fill="#a0aec0">pipe-delimited, one metadata line</text>

  <line x1="270" y1="131" x2="330" y2="131" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowR)" />

  <rect x="330" y="70" width="230" height="46" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="1.3" />
  <text x="445" y="90" text-anchor="middle" font-size="11" font-weight="700" font-family="Menlo, monospace" fill="#9c4221">delim='|'</text>
  <text x="445" y="106" text-anchor="middle" font-size="9.5" fill="#9c4221">override the guessed delimiter</text>

  <rect x="330" y="126" width="230" height="46" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="445" y="146" text-anchor="middle" font-size="11" font-weight="700" font-family="Menlo, monospace" fill="#2c5282">skip=1</text>
  <text x="445" y="162" text-anchor="middle" font-size="9.5" fill="#2c5282">ignore the leading metadata line</text>

  <rect x="330" y="182" width="230" height="46" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1.3" />
  <text x="445" y="202" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Menlo, monospace" fill="#276749">SELECT id, price AS p</text>
  <text x="445" y="218" text-anchor="middle" font-size="9.5" fill="#276749">choose &amp; rename columns after the read</text>

  <line x1="560" y1="131" x2="620" y2="131" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowR)" />

  <rect x="620" y="72" width="140" height="118" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />
  <text x="690" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">Clean result</text>
  <text x="640" y="116" font-size="10" font-family="Menlo, monospace" fill="#4a5568">id     p</text>
  <text x="640" y="136" font-size="10" font-family="Menlo, monospace" fill="#4a5568">P001   64.0</text>
  <text x="640" y="156" font-size="10" font-family="Menlo, monospace" fill="#4a5568">P002   181.52</text>

  <rect x="40" y="248" width="720" height="60" rx="8" fill="#fdf2f2" stroke="#fc8181" stroke-width="1.3" />
  <text x="400" y="272" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c53030">columns={} is a full schema declaration, not a column selector</text>
  <text x="400" y="290" text-anchor="middle" font-size="10.5" fill="#c53030">passing fewer entries than the file has columns raises InvalidInputException -- confirmed directly</text>

  <rect x="40" y="326" width="720" height="66" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="400" y="350" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">read_csv() and read_csv_auto() run the same auto-detection by default</text>
  <text x="400" y="368" text-anchor="middle" font-size="10.5" fill="#2c5282">on an ordinary file they produce identical schemas -- neither is deprecated in favor of the other</text>

  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
