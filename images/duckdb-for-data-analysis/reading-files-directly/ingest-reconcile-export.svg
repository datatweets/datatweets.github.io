<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="420" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Ingest, Reconcile, Export</text>

  <rect x="40" y="54" width="170" height="60" rx="8" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="125" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#742a2a">raw_orders.csv</text>
  <text x="125" y="98" text-anchor="middle" font-size="10" fill="#742a2a">795 rows, messy</text>

  <line x1="210" y1="84" x2="255" y2="84" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowI)" />

  <rect x="255" y="54" width="170" height="60" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.3" />
  <text x="340" y="76" text-anchor="middle" font-size="10" font-weight="700" fill="#9c4221">DISTINCT ON + parse</text>
  <text x="340" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#9c4221">dates + abs()</text>

  <line x1="425" y1="84" x2="470" y2="84" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowI)" />

  <rect x="470" y="54" width="170" height="60" rx="8" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.3" />
  <text x="555" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#22543d">cleaned</text>
  <text x="555" y="98" text-anchor="middle" font-size="10" fill="#22543d">792 rows</text>

  <line x1="555" y1="114" x2="555" y2="150" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowI)" />

  <rect x="90" y="150" width="290" height="66" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="235" y="174" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22543d">Row count: 792 = 792</text>
  <text x="235" y="192" text-anchor="middle" font-size="9.5" fill="#276749">vs. canonical Q1 2024 -- exact match</text>

  <rect x="420" y="150" width="290" height="66" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="565" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9c4221">Revenue: $0.46 apart</text>
  <text x="565" y="186" text-anchor="middle" font-size="9.5" fill="#9c4221">explained: rounded per-order price,</text>
  <text x="565" y="200" text-anchor="middle" font-size="9.5" fill="#9c4221">not a cleaning bug</text>

  <line x1="235" y1="216" x2="400" y2="252" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowI)" />
  <line x1="565" y1="216" x2="400" y2="252" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowI)" />

  <rect x="270" y="252" width="260" height="44" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="400" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#2c5282">both checks understood, not just run</text>

  <line x1="400" y1="296" x2="400" y2="330" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowI)" />

  <rect x="180" y="330" width="200" height="56" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />
  <text x="280" y="354" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Menlo, monospace" fill="#2d3748">.parquet</text>
  <text x="280" y="372" text-anchor="middle" font-size="9.5" fill="#718096">full 792-row output</text>

  <rect x="420" y="330" width="200" height="56" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />
  <text x="520" y="354" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Menlo, monospace" fill="#2d3748">.csv</text>
  <text x="520" y="372" text-anchor="middle" font-size="9.5" fill="#718096">one-row summary</text>

  <defs>
    <marker id="arrowI" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
