<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="400" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">One Glob Pattern, Three Real Files</text>

  <rect x="40" y="58" width="200" height="56" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="140" y="82" text-anchor="middle" font-size="11" font-weight="700" font-family="Menlo, monospace" fill="#2c5282">..._web.parquet</text>
  <text x="140" y="100" text-anchor="middle" font-size="10.5" fill="#2c5282">3,895 rows</text>

  <rect x="40" y="126" width="200" height="56" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="140" y="150" text-anchor="middle" font-size="11" font-weight="700" font-family="Menlo, monospace" fill="#2c5282">..._store.parquet</text>
  <text x="140" y="168" text-anchor="middle" font-size="10.5" fill="#2c5282">1,516 rows</text>

  <rect x="40" y="194" width="200" height="56" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="140" y="218" text-anchor="middle" font-size="11" font-weight="700" font-family="Menlo, monospace" fill="#2c5282">..._phone.parquet</text>
  <text x="140" y="236" text-anchor="middle" font-size="10.5" fill="#2c5282">589 rows</text>

  <line x1="240" y1="90" x2="330" y2="150" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowG)" />
  <line x1="240" y1="154" x2="330" y2="154" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowG)" />
  <line x1="240" y1="222" x2="330" y2="158" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#arrowG)" />

  <rect x="330" y="120" width="220" height="68" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="440" y="148" text-anchor="middle" font-size="11.5" font-weight="700" font-family="Menlo, monospace" fill="#9c4221">thistlewood_orders_</text>
  <text x="440" y="164" text-anchor="middle" font-size="11.5" font-weight="700" font-family="Menlo, monospace" fill="#9c4221">*.parquet</text>

  <line x1="550" y1="154" x2="610" y2="154" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowG)" />

  <rect x="610" y="110" width="150" height="88" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="685" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#22543d">6,000 rows</text>
  <text x="685" y="160" text-anchor="middle" font-size="9.5" fill="#22543d">3895 + 1516 + 589</text>
  <text x="685" y="178" text-anchor="middle" font-size="9.5" fill="#22543d">= original file, exactly</text>

  <rect x="90" y="290" width="620" height="70" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="400" y="316" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">Verified two ways, not just a row count</text>
  <text x="400" y="336" text-anchor="middle" font-size="10.5" fill="#2c5282">6,000 rows AND the course's own $9,195,043.62 revenue total,</text>
  <text x="400" y="352" text-anchor="middle" font-size="10.5" fill="#2c5282">recomputed by joining the globbed files -- both match the unsplit original exactly</text>

  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
