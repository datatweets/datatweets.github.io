<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="420" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Three more places input can come from</text><text x="74.0" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">Source</text><text x="353.0" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">FastAPI helper</text><text x="540.0" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">Example</text><line x1="24" y1="72" x2="616" y2="72" stroke="#cbd5e0" stroke-width="1.5" /><rect x="24" y="84" width="592" height="80" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="74.0" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Header</text><text x="74.0" y="124" text-anchor="middle" font-size="8.3" font-weight="400" fill="#2b6cb0">part of the request's</text><text x="74.0" y="137" text-anchor="middle" font-size="8.3" font-weight="400" fill="#2b6cb0">metadata (User-Agent,</text><text x="74.0" y="150" text-anchor="middle" font-size="8.3" font-weight="400" fill="#2b6cb0">Content-Type...)</text><text x="353.0" y="128.0" text-anchor="middle" font-size="10" font-weight="400" fill="#2d3748" font-family="monospace">Header(default=...)</text><text x="468" y="112.0" text-anchor="start" font-size="8" font-weight="400" fill="#2d3748" font-family="monospace">user_agent: str =</text><text x="468" y="127.0" text-anchor="start" font-size="8" font-weight="400" fill="#2d3748" font-family="monospace">Header(default=</text><text x="468" y="142.0" text-anchor="start" font-size="8" font-weight="400" fill="#2d3748" font-family="monospace">  "unknown")</text><rect x="24" y="172" width="592" height="80" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" /><text x="74.0" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="#9c4221">Cookie</text><text x="74.0" y="212" text-anchor="middle" font-size="8.3" font-weight="400" fill="#9c4221">a value the client</text><text x="74.0" y="225" text-anchor="middle" font-size="8.3" font-weight="400" fill="#9c4221">carries back from an</text><text x="74.0" y="238" text-anchor="middle" font-size="8.3" font-weight="400" fill="#9c4221">earlier response</text><text x="353.0" y="216.0" text-anchor="middle" font-size="10" font-weight="400" fill="#2d3748" font-family="monospace">Cookie(default=None)</text><text x="468" y="208.0" text-anchor="start" font-size="8" font-weight="400" fill="#2d3748" font-family="monospace">session: str | None =</text><text x="468" y="223.0" text-anchor="start" font-size="8" font-weight="400" fill="#2d3748" font-family="monospace">Cookie(default=None)</text><rect x="24" y="260" width="592" height="80" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="74.0" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Form</text><text x="74.0" y="300" text-anchor="middle" font-size="8.3" font-weight="400" fill="#276749">the request body,</text><text x="74.0" y="313" text-anchor="middle" font-size="8.3" font-weight="400" fill="#276749">encoded like an HTML</text><text x="74.0" y="326" text-anchor="middle" font-size="8.3" font-weight="400" fill="#276749">&#60;form&#62; submit</text><text x="353.0" y="304.0" text-anchor="middle" font-size="10" font-weight="400" fill="#2d3748" font-family="monospace">Form()</text><text x="468" y="296.0" text-anchor="start" font-size="8" font-weight="400" fill="#2d3748" font-family="monospace">username: str = Form()</text><text x="468" y="311.0" text-anchor="start" font-size="8" font-weight="400" fill="#2d3748" font-family="monospace">password: str = Form()</text><text x="320" y="364" text-anchor="middle" font-size="11" font-weight="400" fill="#718096">Same pattern, three sources: declare a parameter, default it with the right helper,</text><text x="320" y="380" text-anchor="middle" font-size="11" font-weight="400" fill="#718096">and FastAPI reads that part of the request for you.</text></svg>