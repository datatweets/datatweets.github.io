<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Status codes: how your API says what happened</text><rect x="28" y="64" width="584" height="78" rx="10" fill="#f0fff4" stroke="#48bb78" /><text x="44" y="88" font-size="13" font-weight="700" fill="#276749">2xx — Success</text><text x="44" y="108" font-size="10.5" fill="#2f855a">The request worked.</text><g font-family="monospace" font-size="10.5" fill="#22543d"><text x="44" y="130">200 OK</text><text x="180" y="130">201 Created</text><text x="340" y="130">204 No Content</text></g><rect x="28" y="154" width="584" height="92" rx="10" fill="#fffaf0" stroke="#ed8936" /><text x="44" y="178" font-size="13" font-weight="700" fill="#c05621">4xx — Client error</text><text x="44" y="198" font-size="10.5" fill="#9c4221">The caller did something wrong — bad input, missing thing, not allowed.</text><g font-family="monospace" font-size="10.5" fill="#7b341e"><text x="44" y="222">400 Bad Request</text><text x="200" y="222">404 Not Found</text><text x="360" y="222">422 Unprocessable</text><text x="44" y="240">401 Unauthorized</text><text x="200" y="240">403 Forbidden</text><text x="360" y="240">409 Conflict</text></g><rect x="28" y="258" width="584" height="62" rx="10" fill="#fff5f5" stroke="#e53e3e" /><text x="44" y="282" font-size="13" font-weight="700" fill="#c53030">5xx — Server error</text><text x="44" y="302" font-size="10.5" fill="#9b2c2c">Your code broke. Example:</text><text x="200" y="302" font-size="10.5" fill="#9b2c2c" font-family="monospace">500 Internal Server Error</text><text x="320" y="342" text-anchor="middle" font-size="11" fill="#718096">A correct status code tells the client what happened before it even reads the body — get these right and your API is predictable.</text></svg>