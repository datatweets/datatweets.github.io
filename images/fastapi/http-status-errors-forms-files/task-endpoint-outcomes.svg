<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="340" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Three requests, three honest outcomes</text><rect x="30" y="62" width="176" height="44" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.8" /><text x="118.0" y="82" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748" font-family="monospace">POST /tasks</text><text x="118.0" y="98" text-anchor="middle" font-size="8.8" font-weight="400" fill="#4a5568">a new task is made</text><line x1="118.0" y1="106" x2="118.0" y2="128" stroke="#a0aec0" stroke-width="2" /><polygon points="118.0 128 113.0 119 123.0 119" fill="#a0aec0" /><rect x="30" y="128" width="176" height="90" rx="12" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" /><text x="118.0" y="172" text-anchor="middle" font-size="30" font-weight="700" fill="#2b6cb0">201</text><text x="118.0" y="202" text-anchor="middle" font-size="11" font-weight="600" fill="#2b6cb0">Created</text><rect x="232" y="62" width="176" height="44" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.8" /><text x="320.0" y="82" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748" font-family="monospace">GET /tasks/999</text><text x="320.0" y="98" text-anchor="middle" font-size="8.8" font-weight="400" fill="#4a5568">no task has that id</text><line x1="320.0" y1="106" x2="320.0" y2="128" stroke="#a0aec0" stroke-width="2" /><polygon points="320.0 128 315.0 119 325.0 119" fill="#a0aec0" /><rect x="232" y="128" width="176" height="90" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2" /><text x="320.0" y="172" text-anchor="middle" font-size="30" font-weight="700" fill="#c53030">404</text><text x="320.0" y="202" text-anchor="middle" font-size="11" font-weight="600" fill="#c53030">Not Found</text><rect x="434" y="62" width="176" height="44" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.8" /><text x="522.0" y="82" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748" font-family="monospace">DELETE /tasks/1</text><text x="522.0" y="98" text-anchor="middle" font-size="8.8" font-weight="400" fill="#4a5568">the task is removed</text><line x1="522.0" y1="106" x2="522.0" y2="128" stroke="#a0aec0" stroke-width="2" /><polygon points="522.0 128 517.0 119 527.0 119" fill="#a0aec0" /><rect x="434" y="128" width="176" height="90" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="522.0" y="172" text-anchor="middle" font-size="30" font-weight="700" fill="#276749">204</text><text x="522.0" y="202" text-anchor="middle" font-size="11" font-weight="600" fill="#276749">No Content</text><text x="320" y="250" text-anchor="middle" font-size="11" font-weight="400" fill="#718096">Same shape every time: the request tells the story, and the status code confirms it —</text><text x="320" y="266" text-anchor="middle" font-size="11" font-weight="400" fill="#718096">no client ever has to guess from the body alone what actually happened.</text></svg>