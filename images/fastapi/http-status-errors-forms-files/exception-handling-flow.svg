<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="400" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Two ways to turn an error into a response</text><text x="165" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">One-off check</text><text x="475" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">Reusable domain rule</text><rect x="30" y="68" width="270" height="36" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" /><text x="165" y="90" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2d3748">Endpoint code runs</text><line x1="165" y1="104" x2="165" y2="124" stroke="#a0aec0" stroke-width="2" /><polygon points="165 124 160 115 170 115" fill="#a0aec0" /><rect x="30" y="124" width="270" height="44" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="165" y="142" text-anchor="middle" font-size="9.5" font-weight="400" fill="#2b6cb0" font-family="monospace">raise HTTPException(</text><text x="165" y="158" text-anchor="middle" font-size="9.5" font-weight="400" fill="#2b6cb0" font-family="monospace">status_code=404, detail=...)</text><line x1="165" y1="168" x2="165" y2="188" stroke="#a0aec0" stroke-width="2" /><polygon points="165 188 160 179 170 179" fill="#a0aec0" /><rect x="30" y="188" width="270" height="44" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" /><text x="165" y="206" text-anchor="middle" font-size="9.8" font-weight="600" fill="#2d3748">FastAPI stops the request</text><text x="165" y="222" text-anchor="middle" font-size="9.8" font-weight="400" fill="#4a5568">and builds the error response</text><line x1="165" y1="232" x2="165" y2="252" stroke="#a0aec0" stroke-width="2" /><polygon points="165 252 160 243 170 243" fill="#a0aec0" /><rect x="30" y="252" width="270" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="165" y="272" text-anchor="middle" font-size="9.8" font-weight="700" fill="#276749">Client receives</text><text x="165" y="290" text-anchor="middle" font-size="9" font-weight="400" fill="#2f855a" font-family="monospace">{'detail': 'Task 99 not found'}</text><rect x="340" y="68" width="270" height="36" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" /><text x="475" y="90" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2d3748">Deep helper code raises it</text><line x1="475" y1="104" x2="475" y2="124" stroke="#a0aec0" stroke-width="2" /><polygon points="475 124 470 115 480 115" fill="#a0aec0" /><rect x="340" y="124" width="270" height="44" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="475" y="148" text-anchor="middle" font-size="9.8" font-weight="400" fill="#6b46c1" font-family="monospace">raise OutOfStock(name)</text><line x1="475" y1="168" x2="475" y2="188" stroke="#a0aec0" stroke-width="2" /><polygon points="475 188 470 179 480 179" fill="#a0aec0" /><rect x="340" y="188" width="270" height="44" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" /><text x="475" y="206" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2d3748" font-family="monospace">@app.exception_handler</text><text x="475" y="222" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2d3748" font-family="monospace">(OutOfStock) catches it</text><line x1="475" y1="232" x2="475" y2="252" stroke="#a0aec0" stroke-width="2" /><polygon points="475 252 470 243 480 243" fill="#a0aec0" /><rect x="340" y="252" width="270" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="475" y="272" text-anchor="middle" font-size="9.8" font-weight="700" fill="#276749">Client receives</text><text x="475" y="290" text-anchor="middle" font-size="9" font-weight="400" fill="#2f855a" font-family="monospace">{'error': 'widget is out of stock'}</text><text x="320" y="336" text-anchor="middle" font-size="11" font-weight="400" fill="#718096">HTTPException stops a single endpoint and always shapes the body under "detail".</text><text x="320" y="352" text-anchor="middle" font-size="11" font-weight="400" fill="#718096">A custom handler catches an exception type raised anywhere, and shapes its own body.</text></svg>