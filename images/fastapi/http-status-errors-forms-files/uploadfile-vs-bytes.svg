<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="380" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">UploadFile scales; raw bytes don't</text><text x="320" y="58" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c53030">Accepting bytes: everything loads into RAM</text><rect x="40" y="70" width="150" height="40" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5" /><text x="115" y="94" text-anchor="middle" font-size="9.5" font-weight="400" fill="#742a2a">small file (10 KB)</text><line x1="200" y1="90" x2="260" y2="90" stroke="#e53e3e" stroke-width="2" /><polygon points="260 90 251 85 251 95" fill="#e53e3e" /><rect x="270" y="70" width="150" height="40" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5" /><text x="345" y="94" text-anchor="middle" font-size="9.5" font-weight="400" fill="#742a2a">loaded into RAM</text><rect x="440" y="70" width="150" height="40" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5" /><text x="515" y="94" text-anchor="middle" font-size="9.5" font-weight="400" fill="#742a2a">large file (2 GB)</text><line x1="200" y1="132" x2="260" y2="132" stroke="#e53e3e" stroke-width="2" /><polygon points="260 132 251 127 251 137" fill="#e53e3e" /><rect x="40" y="112" width="150" height="40" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5" /><text x="115" y="136" text-anchor="middle" font-size="9.5" font-weight="400" fill="#742a2a">large file (2 GB)</text><rect x="270" y="112" width="320" height="40" rx="8" fill="#fed7d7" stroke="#e53e3e" stroke-width="1.5" /><text x="430" y="136" text-anchor="middle" font-size="9.5" font-weight="700" fill="#742a2a">also loaded into RAM — 2 GB allocated at once</text><line x1="24" y1="172" x2="616" y2="172" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,4" /><text x="320" y="196" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">Accepting UploadFile: FastAPI spools past a size threshold</text><rect x="40" y="208" width="150" height="40" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="115" y="232" text-anchor="middle" font-size="9.5" font-weight="400" fill="#22543d">small file (10 KB)</text><line x1="200" y1="228" x2="260" y2="228" stroke="#48bb78" stroke-width="2" /><polygon points="260 228 251 223 251 233" fill="#48bb78" /><rect x="270" y="208" width="150" height="40" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="345" y="226" text-anchor="middle" font-size="9.5" font-weight="400" fill="#22543d">stays in</text><text x="345" y="240" text-anchor="middle" font-size="9.5" font-weight="400" fill="#22543d">memory</text><rect x="40" y="250" width="150" height="40" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="115" y="274" text-anchor="middle" font-size="9.5" font-weight="400" fill="#22543d">large file (2 GB)</text><line x1="200" y1="270" x2="260" y2="270" stroke="#48bb78" stroke-width="2" /><polygon points="260 270 251 265 251 275" fill="#48bb78" /><rect x="270" y="250" width="150" height="40" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="345" y="268" text-anchor="middle" font-size="9.5" font-weight="400" fill="#22543d">spools to a</text><text x="345" y="282" text-anchor="middle" font-size="9.5" font-weight="400" fill="#22543d">temp file</text><line x1="420" y1="270" x2="440" y2="270" stroke="#48bb78" stroke-width="2" /><polygon points="440 270 431 265 431 275" fill="#48bb78" /><rect x="440" y="250" width="150" height="40" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="515" y="268" text-anchor="middle" font-size="9.5" font-weight="700" fill="#22543d">RAM usage</text><text x="515" y="282" text-anchor="middle" font-size="9.5" font-weight="700" fill="#22543d">stays flat</text><text x="320" y="322" text-anchor="middle" font-size="11" font-weight="400" fill="#718096">Both approaches carry the same file correctly — the difference is what happens</text><text x="320" y="338" text-anchor="middle" font-size="11" font-weight="400" fill="#718096">to your server's memory once the upload gets large.</text></svg>