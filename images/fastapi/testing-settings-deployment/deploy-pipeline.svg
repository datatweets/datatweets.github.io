<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">From your laptop to a server</text><text x="60" y="66" font-size="12" font-weight="700" fill="#276749">On your laptop</text><rect x="60" y="76" width="200" height="70" rx="6" fill="#c6f6d5" stroke="#48bb78" /><text x="160" y="100" text-anchor="middle" font-size="10.5" fill="#22543d">your code + <tspan font-family="monospace">requirements.txt</tspan></text><text x="160" y="118" text-anchor="middle" font-size="10.5" fill="#22543d">+ <tspan font-family="monospace">Dockerfile</tspan></text><text x="160" y="136" text-anchor="middle" font-size="9.5" fill="#276749">run locally: <tspan font-family="monospace">uvicorn --reload</tspan></text><text x="286" y="115" font-size="16" fill="#718096">&#8594;</text><rect x="320" y="76" width="200" height="70" rx="6" fill="#bee3f8" stroke="#4299e1" /><text x="420" y="100" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2a4365"><tspan font-family="monospace">docker build</tspan></text><text x="420" y="120" text-anchor="middle" font-size="9.5" fill="#2a4365">install pinned deps,</text><text x="420" y="134" text-anchor="middle" font-size="9.5" fill="#2a4365">copy code &#8594; one image</text><text x="320" y="170" text-anchor="middle" font-size="14" fill="#718096">&#8595;  push the image</text><text x="60" y="200" font-size="12" font-weight="700" fill="#2a4365">On the server</text><rect x="60" y="210" width="230" height="76" rx="6" fill="#e6fffa" stroke="#81e6d9" /><text x="175" y="234" text-anchor="middle" font-size="10.5" font-weight="700" fill="#234e52">container runs the image</text><text x="175" y="253" text-anchor="middle" font-size="9.5" fill="#234e52"><tspan font-family="monospace">uvicorn --host 0.0.0.0</tspan></text><text x="175" y="267" text-anchor="middle" font-size="9.5" fill="#234e52"><tspan font-family="monospace">--port 8000 --workers 4</tspan></text><text x="175" y="281" text-anchor="middle" font-size="9" fill="#c53030">secrets passed in as <tspan font-family="monospace">APP_</tspan> env vars</text><path d="M290 248 H330" stroke="#a0aec0" stroke-width="1.5" /><polygon points="330,248 322,244 322,252" fill="#a0aec0" /><rect x="332" y="210" width="188" height="76" rx="6" fill="#f7fafc" stroke="#cbd5e0" /><text x="426" y="236" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">load balancer</text><text x="426" y="256" text-anchor="middle" font-size="9.5" fill="#4a5568">polls <tspan font-family="monospace">/health</tspan> every few sec</text><text x="426" y="272" text-anchor="middle" font-size="9.5" fill="#4a5568">routes users to healthy copies</text><rect x="40" y="304" width="560" height="40" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="320" y="328" text-anchor="middle" font-size="10.5" fill="#2d3748">The image is identical everywhere; only the environment variables change from one deployment to the next.</text></svg>
