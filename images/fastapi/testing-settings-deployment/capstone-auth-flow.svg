<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">How a request proves who is calling</text><text x="40" y="58" font-size="12" font-weight="700" fill="#276749">1. Register</text><rect x="40" y="68" width="560" height="40" rx="6" fill="#c6f6d5" stroke="#48bb78" /><text x="52" y="84" font-size="10" fill="#22543d"><tspan font-family="monospace">POST /auth/register</tspan> with username + password</text><text x="52" y="99" font-size="10" fill="#22543d">server hashes the password with bcrypt and stores the <tspan font-family="monospace">User</tspan> row (never the plain text)</text><text x="40" y="132" font-size="12" font-weight="700" fill="#2a4365">2. Log in</text><rect x="40" y="142" width="560" height="40" rx="6" fill="#bee3f8" stroke="#4299e1" /><text x="52" y="158" font-size="10" fill="#2a4365"><tspan font-family="monospace">POST /auth/token</tspan> with username + password</text><text x="52" y="173" font-size="10" fill="#2a4365">server verifies against the stored hash, then returns a signed JWT holding <tspan font-family="monospace">sub</tspan> (username) and <tspan font-family="monospace">exp</tspan></text><text x="40" y="206" font-size="12" font-weight="700" fill="#44337a">3. Call a protected route</text><rect x="40" y="216" width="560" height="56" rx="6" fill="#e9d8fd" stroke="#9f7aea" /><text x="52" y="232" font-size="10" fill="#44337a"><tspan font-family="monospace">GET /tasks</tspan> with header <tspan font-family="monospace">Authorization: Bearer &lt;token&gt;</tspan></text><text x="52" y="247" font-size="10" fill="#44337a"><tspan font-family="monospace">get_current_user</tspan> decodes and verifies the token, loads the matching <tspan font-family="monospace">User</tspan> from the database</text><text x="52" y="262" font-size="10" fill="#44337a">bad signature, expired <tspan font-family="monospace">exp</tspan>, or unknown user &#8594; <tspan font-family="monospace">401</tspan>; otherwise the route runs with that <tspan font-family="monospace">User</tspan></text><rect x="40" y="292" width="560" height="52" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="320" y="312" text-anchor="middle" font-size="10.5" fill="#2d3748">The password leaves the client only at register and login. Every other request carries the short-lived token instead.</text><text x="320" y="329" text-anchor="middle" font-size="10.5" fill="#2d3748">Each task query is then filtered by <tspan font-family="monospace">Task.owner == user.username</tspan>, so users only see their own tasks.</text></svg>
