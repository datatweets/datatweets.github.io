<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Where each setting's value comes from</text><text x="320" y="52" text-anchor="middle" font-size="11" fill="#718096">pydantic-settings checks these in order and takes the first one it finds</text><rect x="120" y="74" width="400" height="52" rx="6" fill="#c6f6d5" stroke="#48bb78" /><text x="320" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#22543d">1. Environment variable</text><text x="320" y="113" text-anchor="middle" font-size="10" fill="#22543d"><tspan font-family="monospace">APP_DATABASE_URL</tspan> set in the shell or by the platform</text><text x="320" y="140" text-anchor="middle" font-size="13" fill="#a0aec0">&#8595;  if not set</text><rect x="120" y="150" width="400" height="52" rx="6" fill="#bee3f8" stroke="#4299e1" /><text x="320" y="171" text-anchor="middle" font-size="12" font-weight="700" fill="#2a4365">2. .env file</text><text x="320" y="189" text-anchor="middle" font-size="10" fill="#2a4365">a local <tspan font-family="monospace">KEY=value</tspan> file, loaded for development convenience</text><text x="320" y="216" text-anchor="middle" font-size="13" fill="#a0aec0">&#8595;  if not present</text><rect x="120" y="226" width="400" height="52" rx="6" fill="#e2e8f0" stroke="#a0aec0" /><text x="320" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">3. Field default</text><text x="320" y="265" text-anchor="middle" font-size="10" fill="#2d3748">the value written in the <tspan font-family="monospace">Settings</tspan> class</text><rect x="40" y="298" width="560" height="44" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="320" y="317" text-anchor="middle" font-size="10.5" fill="#2d3748">Higher rows win. An actual environment variable overrides the <tspan font-family="monospace">.env</tspan> file, which overrides the default.</text><text x="320" y="333" text-anchor="middle" font-size="10.5" fill="#2d3748">Your code always reads <tspan font-family="monospace">settings.database_url</tspan>; only where the value comes from changes.</text></svg>
