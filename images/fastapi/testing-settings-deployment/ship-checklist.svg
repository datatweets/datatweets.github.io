<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">From "it runs" to "it ships"</text><text x="320" y="52" text-anchor="middle" font-size="11" fill="#718096">Part 1 built the app. Part 2 is these four steps.</text><rect x="40" y="72" width="560" height="40" rx="6" fill="#e2e8f0" stroke="#a0aec0" /><text x="60" y="90" font-size="11" font-weight="700" fill="#2d3748">Built (Part 1)</text><text x="60" y="105" font-size="10" fill="#4a5568">the Task Manager API: settings, database, JWT auth, routers, <tspan font-family="monospace">/health</tspan></text><rect x="40" y="126" width="560" height="40" rx="6" fill="#c6f6d5" stroke="#48bb78" /><text x="60" y="144" font-size="11" font-weight="700" fill="#22543d">1. Test</text><text x="60" y="159" font-size="10" fill="#22543d"><tspan font-family="monospace">pytest</tspan> suite covers health, auth, per-user data, error paths &#8594; exit status <tspan font-family="monospace">0</tspan></text><rect x="40" y="180" width="560" height="40" rx="6" fill="#bee3f8" stroke="#4299e1" /><text x="60" y="198" font-size="11" font-weight="700" fill="#2a4365">2. Configure</text><text x="60" y="213" font-size="10" fill="#2a4365">secret and database URL from <tspan font-family="monospace">APP_</tspan> env vars; the <tspan font-family="monospace">.env</tspan> file is gitignored</text><rect x="40" y="234" width="560" height="40" rx="6" fill="#e9d8fd" stroke="#9f7aea" /><text x="60" y="252" font-size="11" font-weight="700" fill="#44337a">3. Package</text><text x="60" y="267" font-size="10" fill="#44337a">pinned <tspan font-family="monospace">requirements.txt</tspan> + <tspan font-family="monospace">Dockerfile</tspan> &#8594; one image that runs anywhere</text><rect x="40" y="288" width="560" height="40" rx="6" fill="#e6fffa" stroke="#81e6d9" /><text x="60" y="306" font-size="11" font-weight="700" fill="#234e52">4. Deploy</text><text x="60" y="321" font-size="10" fill="#234e52">run the image with <tspan font-family="monospace">uvicorn --host 0.0.0.0 --port 8000 --workers 4</tspan></text></svg>
