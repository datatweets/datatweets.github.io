<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="340" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Tests call your app in-process — no server needed</text><rect x="28" y="120" width="120" height="100" rx="10" fill="#faf5ff" stroke="#9f7aea" /><text x="88" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">pytest</text><text x="88" y="168" text-anchor="middle" font-size="9" fill="#805ad5">finds &amp; runs</text><text x="88" y="181" text-anchor="middle" font-size="9" fill="#805ad5">test_*.py</text><text x="88" y="194" text-anchor="middle" font-size="9" fill="#805ad5">functions</text><line x1="148" y1="170" x2="186" y2="170" stroke="#a0aec0" stroke-width="1.6" /><polygon points="186 170 177 166 177 174" fill="#a0aec0" /><rect x="188" y="120" width="130" height="100" rx="10" fill="#ebf4ff" stroke="#4299e1" /><text x="253" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">TestClient</text><text x="253" y="168" text-anchor="middle" font-size="9" fill="#3182ce">client.get(...)</text><text x="253" y="181" text-anchor="middle" font-size="9" fill="#3182ce">client.post(...)</text><text x="253" y="200" text-anchor="middle" font-size="8.5" fill="#718096">calls in-process</text><line x1="318" y1="170" x2="356" y2="170" stroke="#a0aec0" stroke-width="1.6" /><polygon points="356 170 347 166 347 174" fill="#a0aec0" /><rect x="358" y="120" width="120" height="100" rx="10" fill="#e6fffa" stroke="#319795" /><text x="418" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#234e52">your app</text><text x="418" y="172" text-anchor="middle" font-size="9" fill="#2f855a">real endpoints,</text><text x="418" y="185" text-anchor="middle" font-size="9" fill="#2f855a">real responses</text><path d="M418 220C418 250 253 250 253 222" fill="none" stroke="#48bb78" stroke-width="1.6" /><polygon points="253 222 249 231 257 231" fill="#48bb78" /><text x="335" y="264" text-anchor="middle" font-size="9" fill="#2f855a">response (status + JSON)</text><rect x="500" y="120" width="112" height="100" rx="10" fill="#f0fff4" stroke="#48bb78" /><text x="556" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">assert</text><text x="556" y="172" text-anchor="middle" font-size="9" fill="#2f855a">status == 200</text><text x="556" y="185" text-anchor="middle" font-size="9" fill="#2f855a">json() == ...</text><text x="556" y="204" text-anchor="middle" font-size="11" fill="#276749">pass / fail</text><line x1="478" y1="160" x2="498" y2="160" stroke="#a0aec0" stroke-width="1.6" /><polygon points="498 160 489 156 489 164" fill="#a0aec0" /><text x="320" y="300" text-anchor="middle" font-size="11" fill="#718096">pytest runs each test function; TestClient calls your real app without a network or a running server;</text><text x="320" y="316" text-anchor="middle" font-size="11" fill="#718096">you assert on the response. Fast, repeatable, and run on every change.</text></svg>