<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="330" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">How a request reaches the database</text><rect x="24" y="135" width="104" height="56" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="76" y="159" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3748">request</text><text x="76" y="177" text-anchor="middle" font-size="9" fill="#718096">GET /tasks</text><line x1="128" y1="163" x2="166" y2="163" stroke="#a0aec0" stroke-width="1.6" /><polygon points="166 163 157 159 157 167" fill="#a0aec0" /><rect x="168" y="130" width="120" height="66" rx="8" fill="#ebf4ff" stroke="#4299e1" /><text x="228" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">endpoint</text><text x="228" y="170" text-anchor="middle" font-size="8.5" fill="#3182ce">session: Session</text><text x="228" y="183" text-anchor="middle" font-size="8.5" fill="#3182ce">= Depends(get_session)</text><rect x="320" y="118" width="150" height="90" rx="10" fill="#e6fffa" stroke="#319795" stroke-width="2" /><text x="395" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#234e52">get_session()</text><text x="395" y="158" text-anchor="middle" font-size="8.5" fill="#2f855a">1. open Session(engine)</text><text x="395" y="173" text-anchor="middle" font-size="8.5" fill="#2f855a">2. yield it to the endpoint</text><text x="395" y="188" text-anchor="middle" font-size="8.5" fill="#2f855a">3. close it afterward</text><line x1="288" y1="163" x2="318" y2="163" stroke="#319795" stroke-width="1.6" /><polygon points="318 163 309 159 309 167" fill="#319795" /><rect x="500" y="118" width="116" height="44" rx="8" fill="#faf5ff" stroke="#9f7aea" /><text x="558" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">engine</text><text x="558" y="153" text-anchor="middle" font-size="8" fill="#805ad5">create_engine(...)</text><rect x="500" y="178" width="116" height="56" rx="8" fill="#fffaf0" stroke="#ed8936" /><text x="558" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">SQLite file</text><text x="558" y="216" text-anchor="middle" font-size="8.5" fill="#9c4221">tasks.db on disk</text><line x1="470" y1="150" x2="498" y2="142" stroke="#a0aec0" stroke-width="1.6" /><polygon points="498 142 489 141 492 149" fill="#a0aec0" /><line x1="558" y1="162" x2="558" y2="176" stroke="#a0aec0" stroke-width="1.6" /><polygon points="558 176 554 167 562 167" fill="#a0aec0" /><text x="320" y="270" text-anchor="middle" font-size="11" fill="#718096">The endpoint asks for a session; the dependency opens one per request, runs your queries through the</text><text x="320" y="287" text-anchor="middle" font-size="11" fill="#718096">engine against the SQLite file, then closes it — so data is written to disk and survives restarts.</text></svg>