<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="240" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Saving a new row: three distinct steps</text><rect x="24" y="70" width="172" height="94" rx="8" fill="#ebf4ff" stroke="#4299e1" stroke-width="2" /><text x="110" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">session.add(task)</text><text x="110" y="114" text-anchor="middle" font-size="9.5" fill="#3182ce">stages the row</text><text x="110" y="129" text-anchor="middle" font-size="9.5" fill="#3182ce">not written yet</text><text x="110" y="148" text-anchor="middle" font-size="9" fill="#3182ce" font-style="italic">id is still None</text><line x1="196" y1="117" x2="234" y2="117" stroke="#a0aec0" stroke-width="1.6" /><polygon points="234 117 225 113 225 121" fill="#a0aec0" /><rect x="236" y="70" width="172" height="94" rx="8" fill="#e6fffa" stroke="#319795" stroke-width="2" /><text x="322" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#234e52">session.commit()</text><text x="322" y="114" text-anchor="middle" font-size="9.5" fill="#2f855a">writes to disk</text><text x="322" y="129" text-anchor="middle" font-size="9.5" fill="#2f855a">database assigns id</text><text x="322" y="148" text-anchor="middle" font-size="9" fill="#2f855a" font-style="italic">your object doesn't know yet</text><line x1="408" y1="117" x2="446" y2="117" stroke="#a0aec0" stroke-width="1.6" /><polygon points="446 117 437 113 437 121" fill="#a0aec0" /><rect x="448" y="70" width="168" height="94" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="532" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#553c9a">session.refresh(task)</text><text x="532" y="114" text-anchor="middle" font-size="9.5" fill="#6b46c1">reloads the row</text><text x="532" y="129" text-anchor="middle" font-size="9.5" fill="#6b46c1">from the database</text><text x="532" y="148" text-anchor="middle" font-size="9" fill="#6b46c1" font-style="italic">now task.id is 1</text><text x="320" y="200" text-anchor="middle" font-size="11" fill="#718096">Skip the last step and the object you return can still show id: null, even though the row saved fine.</text></svg>
