<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="680" height="320" fill="#ffffff" /><text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">One base, three purpose-built models</text><rect x="250" y="52" width="180" height="56" rx="8" fill="#ebf4ff" stroke="#4299e1" stroke-width="2" /><text x="340" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">TaskBase</text><text x="340" y="93" text-anchor="middle" font-size="9.5" fill="#3182ce">title, done = False</text><line x1="300" y1="108" x2="140" y2="158" stroke="#a0aec0" stroke-width="1.6" /><polygon points="140 158 150 156 146 148" fill="#a0aec0" /><line x1="340" y1="108" x2="340" y2="158" stroke="#a0aec0" stroke-width="1.6" /><polygon points="340 158 336 149 344 149" fill="#a0aec0" /><rect x="40" y="160" width="200" height="94" rx="8" fill="#e6fffa" stroke="#319795" stroke-width="2" /><text x="140" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#234e52">Task (table=True)</text><text x="140" y="200" text-anchor="middle" font-size="9.5" fill="#2f855a">+ id: int | None</text><text x="140" y="215" text-anchor="middle" font-size="9.5" fill="#2f855a">(primary key)</text><text x="140" y="233" text-anchor="middle" font-size="9" fill="#2f855a" font-style="italic">the real database table</text><rect x="260" y="160" width="200" height="94" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="360" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#553c9a">TaskCreate</text><text x="360" y="200" text-anchor="middle" font-size="9.5" fill="#6b46c1">title, done — no id</text><text x="360" y="233" text-anchor="middle" font-size="9" fill="#6b46c1" font-style="italic">what clients send to create</text><rect x="480" y="160" width="180" height="94" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="2" stroke-dasharray="5,4" /><text x="570" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#9c4221">TaskUpdate</text><text x="570" y="200" text-anchor="middle" font-size="9" fill="#c05621">title: str | None = None</text><text x="570" y="214" text-anchor="middle" font-size="9" fill="#c05621">done: bool | None = None</text><text x="570" y="233" text-anchor="middle" font-size="9" fill="#c05621" font-style="italic">stands alone, all optional</text><text x="340" y="286" text-anchor="middle" font-size="11" fill="#718096">Task and TaskCreate share TaskBase's fields; only Task becomes a table. TaskUpdate is separate</text><text x="340" y="302" text-anchor="middle" font-size="11" fill="#718096">because every one of its fields must be optional, which TaskBase's required title can't offer.</text></svg>
