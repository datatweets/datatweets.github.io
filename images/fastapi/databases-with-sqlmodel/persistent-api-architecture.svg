<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="680" height="330" fill="#ffffff" /><text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The assembled Persistent Tasks API</text><rect x="24" y="70" width="150" height="80" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="2" /><text x="99" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#9c4221">dependencies.py</text><text x="99" y="112" text-anchor="middle" font-size="9" fill="#c05621">engine</text><text x="99" y="126" text-anchor="middle" font-size="9" fill="#c05621">get_session()</text><line x1="174" y1="110" x2="212" y2="110" stroke="#a0aec0" stroke-width="1.6" /><polygon points="212 110 203 106 203 114" fill="#a0aec0" /><rect x="214" y="60" width="200" height="100" rx="8" fill="#e6fffa" stroke="#319795" stroke-width="2" /><text x="314" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#234e52">routers/tasks.py</text><text x="314" y="103" text-anchor="middle" font-size="9" fill="#2f855a">Task, TaskCreate, TaskUpdate</text><text x="314" y="118" text-anchor="middle" font-size="9" fill="#2f855a">APIRouter(prefix="/tasks")</text><text x="314" y="133" text-anchor="middle" font-size="9" fill="#2f855a">create, list, get, patch, delete</text><line x1="414" y1="110" x2="452" y2="110" stroke="#a0aec0" stroke-width="1.6" /><polygon points="452 110 443 106 443 114" fill="#a0aec0" /><rect x="454" y="70" width="150" height="80" rx="8" fill="#ebf4ff" stroke="#4299e1" stroke-width="2" /><text x="529" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">main.py</text><text x="529" y="112" text-anchor="middle" font-size="9" fill="#3182ce">create_all(engine)</text><text x="529" y="126" text-anchor="middle" font-size="9" fill="#3182ce">include_router(...)</text><line x1="99" y1="150" x2="99" y2="210" stroke="#a0aec0" stroke-width="1.6" /><polygon points="99 210 95 201 103 201" fill="#a0aec0" /><rect x="24" y="212" width="150" height="60" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="99" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#553c9a">tasks.db</text><text x="99" y="253" text-anchor="middle" font-size="9" fill="#6b46c1">SQLite file on disk</text><text x="340" y="300" text-anchor="middle" font-size="11" fill="#718096">Only one router file knows about the database; main.py just assembles the pieces and starts the app.</text></svg>
