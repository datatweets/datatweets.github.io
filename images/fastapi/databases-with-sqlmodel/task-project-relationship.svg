<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="600" height="260" fill="#ffffff" /><text x="300" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">One project, many tasks</text><rect x="60" y="70" width="180" height="90" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="150" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#553c9a">Project</text><text x="150" y="114" text-anchor="middle" font-size="10" fill="#6b46c1">id: int</text><text x="150" y="130" text-anchor="middle" font-size="10" fill="#6b46c1">name: str</text><text x="150" y="146" text-anchor="middle" font-size="9" fill="#6b46c1" font-style="italic">tasks: list[Task]</text><rect x="360" y="70" width="180" height="90" rx="8" fill="#e6fffa" stroke="#319795" stroke-width="2" /><text x="450" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#234e52">Task</text><text x="450" y="114" text-anchor="middle" font-size="10" fill="#2f855a">id: int</text><text x="450" y="130" text-anchor="middle" font-size="10" fill="#2f855a">title, done</text><text x="450" y="146" text-anchor="middle" font-size="10" font-weight="700" fill="#2f855a">project_id: int | None</text><line x1="240" y1="115" x2="358" y2="115" stroke="#718096" stroke-width="1.8" /><polygon points="358 115 348 111 348 119" fill="#718096" /><text x="299" y="105" text-anchor="middle" font-size="10" fill="#4a5568">1</text><text x="299" y="132" text-anchor="middle" font-size="10" fill="#4a5568">N</text><text x="300" y="200" text-anchor="middle" font-size="11" fill="#718096">Task.project_id stores a Project's id — the foreign key that links the two tables.</text><text x="300" y="217" text-anchor="middle" font-size="11" fill="#718096">Relationship() then lets you write task.project or project.tasks instead of a manual query.</text></svg>
