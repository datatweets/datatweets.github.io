<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="350" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Write the logic once; inject it everywhere</text><rect x="220" y="140" width="200" height="74" rx="12" fill="#e6fffa" stroke="#319795" stroke-width="2" /><text x="320" y="164" text-anchor="middle" font-size="11.5" font-weight="700" fill="#234e52">dependency</text><text x="320" y="184" text-anchor="middle" font-size="10" fill="#2d3748" font-family="monospace">def pagination(</text><text x="320" y="199" text-anchor="middle" font-size="10" fill="#2d3748" font-family="monospace">  skip=0, limit=10)</text><rect x="40" y="250" width="150" height="56" rx="8" fill="#ebf4ff" stroke="#4299e1" /><text x="115" y="273" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">GET /tasks</text><text x="115" y="291" text-anchor="middle" font-size="9" fill="#3182ce">Depends(pagination)</text><rect x="245" y="250" width="150" height="56" rx="8" fill="#ebf4ff" stroke="#4299e1" /><text x="320" y="273" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">GET /users</text><text x="320" y="291" text-anchor="middle" font-size="9" fill="#3182ce">Depends(pagination)</text><rect x="450" y="250" width="150" height="56" rx="8" fill="#ebf4ff" stroke="#4299e1" /><text x="525" y="273" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">GET /projects</text><text x="525" y="291" text-anchor="middle" font-size="9" fill="#3182ce">Depends(pagination)</text><line x1="115" y1="250" x2="250" y2="204" stroke="#a0aec0" stroke-width="1.6" /><polygon points="250 204 241 205 245 212" fill="#a0aec0" /><line x1="320" y1="250" x2="320" y2="216" stroke="#a0aec0" stroke-width="1.6" /><polygon points="320 216 316 225 324 225" fill="#a0aec0" /><line x1="525" y1="250" x2="390" y2="204" stroke="#a0aec0" stroke-width="1.6" /><polygon points="390 204 399 205 395 212" fill="#a0aec0" /><text x="320" y="70" text-anchor="middle" font-size="11" fill="#718096">FastAPI runs the dependency before your endpoint and passes the result in —</text><text x="320" y="86" text-anchor="middle" font-size="11" fill="#718096">so shared logic (paging, auth, a DB session) lives in one place.</text><text x="320" y="334" text-anchor="middle" font-size="11" fill="#718096">Each endpoint just declares what it needs with Depends(...); no copy-paste, and easy to test or swap.</text></svg>