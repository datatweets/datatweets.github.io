<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="340" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Three files, one job each</text><rect x="20" y="70" width="180" height="130" rx="12" fill="#e6fffa" stroke="#319795" stroke-width="2" /><text x="30" y="92" font-size="10.5" font-weight="700" fill="#234e52" font-family="monospace">dependencies.py</text><text x="30" y="116" font-size="9.5" fill="#2d3748" font-family="monospace">def pagination(</text><text x="30" y="130" font-size="9.5" fill="#2d3748" font-family="monospace">  skip=0, limit=10):</text><text x="30" y="144" font-size="9.5" fill="#2d3748" font-family="monospace">  return {...}</text><text x="30" y="176" font-size="9" fill="#234e52">shared logic, no</text><text x="30" y="190" font-size="9" fill="#234e52">routes of its own</text><line x1="200" y1="135" x2="234" y2="135" stroke="#a0aec0" stroke-width="1.8" /><polygon points="234 135 224 130 224 140" fill="#a0aec0" /><text x="217" y="122" text-anchor="middle" font-size="8.5" font-weight="700" fill="#4a5568">import</text><rect x="236" y="70" width="180" height="130" rx="12" fill="#ebf4ff" stroke="#4299e1" stroke-width="2" /><text x="246" y="92" font-size="10.5" font-weight="700" fill="#2b6cb0" font-family="monospace">routers/tasks.py</text><text x="246" y="114" font-size="9" fill="#2d3748" font-family="monospace">router = APIRouter(</text><text x="246" y="127" font-size="9" fill="#2d3748" font-family="monospace">  prefix="/tasks")</text><text x="246" y="145" font-size="9" fill="#2d3748" font-family="monospace">@router.get("")</text><text x="246" y="158" font-size="9" fill="#2d3748" font-family="monospace">def list_tasks(page=</text><text x="246" y="171" font-size="9" fill="#2d3748" font-family="monospace">  Depends(pagination)):</text><text x="246" y="190" font-size="9" fill="#2b6cb0">owns the tasks endpoints</text><line x1="416" y1="135" x2="450" y2="135" stroke="#a0aec0" stroke-width="1.8" /><polygon points="450 135 440 130 440 140" fill="#a0aec0" /><text x="433" y="122" text-anchor="middle" font-size="8.5" font-weight="700" fill="#4a5568">includes</text><rect x="452" y="70" width="168" height="130" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="462" y="92" font-size="10.5" font-weight="700" fill="#276749" font-family="monospace">main.py</text><text x="462" y="114" font-size="9" fill="#2d3748" font-family="monospace">app = FastAPI()</text><text x="462" y="130" font-size="9" fill="#2d3748" font-family="monospace">add_middleware(</text><text x="462" y="143" font-size="9" fill="#2d3748" font-family="monospace">  CORSMiddleware)</text><text x="462" y="159" font-size="9" fill="#2d3748" font-family="monospace">include_router(</text><text x="462" y="172" font-size="9" fill="#2d3748" font-family="monospace">  tasks_router)</text><text x="462" y="190" font-size="9" fill="#276749">the assembly point</text><text x="320" y="240" text-anchor="middle" font-size="11" fill="#718096">Each file has exactly one job: shared logic, one feature's routes, and assembling the app.</text><text x="320" y="258" text-anchor="middle" font-size="11" fill="#718096">Add a users feature tomorrow and you add one file plus two lines in main.py — nothing else changes.</text></svg>