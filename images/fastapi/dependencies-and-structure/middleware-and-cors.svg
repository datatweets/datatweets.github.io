<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="430" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Middleware wraps every request; CORS decides who may read it</text><text x="60" y="60" font-size="12" font-weight="700" fill="#2d3748">1. A request passes through middleware on the way in and out</text><rect x="40" y="75" width="160" height="60" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="2" /><text x="120" y="98" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">Request arrives</text><text x="120" y="116" text-anchor="middle" font-size="9" fill="#2b6cb0">code before call_next</text><line x1="200" y1="105" x2="234" y2="105" stroke="#a0aec0" stroke-width="1.8" /><polygon points="234 105 224 100 224 110" fill="#a0aec0" /><rect x="236" y="75" width="168" height="60" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="320" y="98" text-anchor="middle" font-size="10" font-weight="700" fill="#276749" font-family="monospace">await call_next(request)</text><text x="320" y="116" text-anchor="middle" font-size="9" fill="#276749">endpoint runs here</text><line x1="404" y1="105" x2="438" y2="105" stroke="#a0aec0" stroke-width="1.8" /><polygon points="438 105 428 100 428 110" fill="#a0aec0" /><rect x="440" y="75" width="160" height="60" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="2" /><text x="520" y="98" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">Response returned</text><text x="520" y="116" text-anchor="middle" font-size="9" fill="#2b6cb0">code after call_next</text><line x1="120" y1="425" x2="120" y2="425" stroke="none" /><text x="320" y="160" text-anchor="middle" font-size="10.5" fill="#718096">Every route gets this for free — timing, headers, logging — with no per-endpoint code.</text><line x1="60" y1="185" x2="600" y2="185" stroke="#e2e8f0" stroke-width="1" /><text x="60" y="215" font-size="12" font-weight="700" fill="#2d3748">2. CORS decides whether the browser may read the response</text><rect x="200" y="230" width="240" height="50" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="320" y="252" text-anchor="middle" font-size="10.5" font-weight="700" fill="#553c9a">Request arrives with</text><text x="320" y="268" text-anchor="middle" font-size="9.5" fill="#553c9a" font-family="monospace">Origin: https://example.com</text><line x1="320" y1="280" x2="320" y2="308" stroke="#a0aec0" stroke-width="1.8" /><polygon points="320 308 314 297 326 297" fill="#a0aec0" /><rect x="190" y="310" width="260" height="46" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="2" /><text x="320" y="338" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7b341e">Is this Origin in allow_origins?</text><line x1="240" y1="356" x2="150" y2="382" stroke="#a0aec0" stroke-width="1.8" /><polygon points="150 382 161 380 156 371" fill="#a0aec0" /><text x="150" y="368" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">yes</text><rect x="40" y="384" width="220" height="40" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="150" y="400" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">sends access-control-allow-origin</text><text x="150" y="414" text-anchor="middle" font-size="9" fill="#276749">browser lets JS read the response</text><line x1="400" y1="356" x2="490" y2="382" stroke="#a0aec0" stroke-width="1.8" /><polygon points="490 382 479 371 474 380" fill="#a0aec0" /><text x="490" y="368" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">no</text><rect x="380" y="384" width="220" height="40" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="2" /><text x="490" y="400" text-anchor="middle" font-size="9" font-weight="700" fill="#c53030">no matching header sent</text><text x="490" y="414" text-anchor="middle" font-size="9" fill="#c53030">browser blocks JS from reading it</text></svg>