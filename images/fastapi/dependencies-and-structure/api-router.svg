<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="320" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">A router groups routes; include_router plugs them in</text><rect x="28" y="70" width="250" height="170" rx="12" fill="#ebf4ff" stroke="#4299e1" stroke-width="2" /><text x="44" y="92" font-size="11" font-weight="700" fill="#2b6cb0" font-family="monospace"># routers/tasks.py</text><text x="44" y="114" font-size="10.5" fill="#2d3748" font-family="monospace">router = APIRouter(</text><text x="44" y="130" font-size="10.5" fill="#2d3748" font-family="monospace">  prefix="/tasks",</text><text x="44" y="146" font-size="10.5" fill="#2d3748" font-family="monospace">  tags=["tasks"])</text><rect x="44" y="158" width="218" height="32" rx="5" fill="#ffffff" stroke="#90cdf4" /><text x="54" y="178" font-size="10" fill="#2b6cb0" font-family="monospace">@router.get("")</text><rect x="44" y="196" width="218" height="32" rx="5" fill="#ffffff" stroke="#90cdf4" /><text x="54" y="216" font-size="10" fill="#2b6cb0" font-family="monospace">@router.get("/{task_id}")</text><line x1="278" y1="155" x2="372" y2="155" stroke="#319795" stroke-width="2" /><polygon points="372 155 362 150 362 160" fill="#319795" /><text x="325" y="146" text-anchor="middle" font-size="9.5" font-weight="700" fill="#234e52">include_router</text><rect x="374" y="70" width="238" height="170" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="390" y="92" font-size="11" font-weight="700" fill="#276749" font-family="monospace"># main.py</text><text x="390" y="114" font-size="10.5" fill="#2d3748" font-family="monospace">app = FastAPI()</text><text x="390" y="130" font-size="10.5" fill="#2d3748" font-family="monospace">app.include_router(</text><text x="390" y="146" font-size="10.5" fill="#2d3748" font-family="monospace">  tasks_router)</text><text x="390" y="170" font-size="9.5" fill="#718096">serves the full paths:</text><rect x="390" y="178" width="206" height="22" rx="5" fill="#ffffff" stroke="#9ae6b4" /><text x="400" y="193" font-size="10" fill="#276749" font-family="monospace">GET /tasks</text><rect x="390" y="206" width="206" height="22" rx="5" fill="#ffffff" stroke="#9ae6b4" /><text x="400" y="221" font-size="10" fill="#276749" font-family="monospace">GET /tasks/{task_id}</text><text x="320" y="280" text-anchor="middle" font-size="11" fill="#718096">Routes live in their own module with paths relative to the prefix; the app assembles them with include_router.</text><text x="320" y="300" text-anchor="middle" font-size="11" fill="#718096">From the outside, the API is identical — but the code is split into clean, focused files.</text></svg>