<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">A sub-dependency chain resolves bottom-up</text><text x="220" y="58" text-anchor="middle" font-size="11" fill="#718096">FastAPI runs the lowest link first, then each</text><text x="220" y="74" text-anchor="middle" font-size="11" fill="#718096">dependency above it, then the endpoint.</text><rect x="110" y="90" width="220" height="52" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="220" y="112" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749" font-family="monospace">GET /me</text><text x="220" y="130" text-anchor="middle" font-size="9.5" fill="#276749" font-family="monospace">Depends(get_current_user)</text><line x1="220" y1="200" x2="220" y2="146" stroke="#a0aec0" stroke-width="1.8" /><polygon points="220 146 214 158 226 158" fill="#a0aec0" /><rect x="90" y="200" width="260" height="52" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="2" /><text x="220" y="222" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0" font-family="monospace">get_current_user(api_key)</text><text x="220" y="240" text-anchor="middle" font-size="9.5" fill="#2b6cb0" font-family="monospace">Depends(get_api_key)</text><line x1="220" y1="310" x2="220" y2="256" stroke="#a0aec0" stroke-width="1.8" /><polygon points="220 256 214 268 226 268" fill="#a0aec0" /><rect x="90" y="310" width="260" height="42" rx="10" fill="#e6fffa" stroke="#319795" stroke-width="2" /><text x="220" y="330" text-anchor="middle" font-size="10.5" font-weight="700" fill="#234e52" font-family="monospace">get_api_key(x_api_key)</text><text x="220" y="346" text-anchor="middle" font-size="9" fill="#234e52">checks the X-API-Key header first</text><rect x="410" y="205" width="200" height="120" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="2" /><text x="510" y="228" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c53030">On a bad key</text><text x="425" y="248" font-size="9.5" fill="#742a2a">1. get_api_key raises</text><text x="425" y="262" font-size="9.5" fill="#742a2a">   HTTPException(401)</text><text x="425" y="282" font-size="9.5" fill="#742a2a">2. get_current_user never runs</text><text x="425" y="302" font-size="9.5" fill="#742a2a">3. the /me body never runs</text><line x1="410" y1="265" x2="352" y2="265" stroke="#fc8181" stroke-width="1.6" stroke-dasharray="4 3" /><polygon points="352 265 362 260 362 270" fill="#fc8181" /></svg>