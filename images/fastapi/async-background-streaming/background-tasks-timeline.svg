<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Reply first, run the slow side-effects after</text><text x="40" y="70" font-size="13" font-weight="700" fill="#c53030">Inline: the caller waits for all of it</text><rect x="40" y="82" width="120" height="28" rx="4" fill="#c6f6d5" stroke="#48bb78" /><text x="100" y="100" text-anchor="middle" font-size="9.5" fill="#22543d">save task (fast)</text><rect x="166" y="82" width="170" height="28" rx="4" fill="#fed7d7" stroke="#e53e3e" /><text x="251" y="100" text-anchor="middle" font-size="9.5" fill="#742a2a">send email (slow...)</text><rect x="342" y="82" width="120" height="28" rx="4" fill="#bee3f8" stroke="#4299e1" /><text x="402" y="100" text-anchor="middle" font-size="9.5" fill="#2a4365">respond 200</text><path d="M40 120 H462" stroke="#a0aec0" stroke-width="1.5" /><path d="M40 116 V124 M462 116 V124" stroke="#a0aec0" stroke-width="1.5" /><text x="251" y="138" text-anchor="middle" font-size="10" fill="#718096">caller waiting</text><text x="40" y="188" font-size="13" font-weight="700" fill="#276749">With BackgroundTasks: the caller waits for the fast part only</text><rect x="40" y="200" width="120" height="28" rx="4" fill="#c6f6d5" stroke="#48bb78" /><text x="100" y="218" text-anchor="middle" font-size="9.5" fill="#22543d">save task (fast)</text><rect x="166" y="200" width="120" height="28" rx="4" fill="#bee3f8" stroke="#4299e1" /><text x="226" y="218" text-anchor="middle" font-size="9.5" fill="#2a4365">respond 200</text><rect x="300" y="200" width="230" height="28" rx="4" fill="#e9d8fd" stroke="#9f7aea" /><text x="415" y="218" text-anchor="middle" font-size="9.5" fill="#44337a">send email (slow...) after the response</text><path d="M40 238 H286" stroke="#a0aec0" stroke-width="1.5" /><path d="M40 234 V242 M286 234 V242" stroke="#a0aec0" stroke-width="1.5" /><text x="163" y="256" text-anchor="middle" font-size="10" fill="#718096">caller waiting</text><rect x="40" y="284" width="560" height="54" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="320" y="304" text-anchor="middle" font-size="10.5" fill="#2d3748">Side-effects that do not shape the response &#8212; email, audit log, cleanup &#8212; run after the client has the answer.</text><text x="320" y="322" text-anchor="middle" font-size="10.5" fill="#2d3748">They share the app process, so keep them light; move heavy or must-not-be-lost jobs to a task queue.</text></svg>
