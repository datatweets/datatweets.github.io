<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">While one request waits, async serves others</text><text x="40" y="72" font-size="13" font-weight="700" fill="#c53030">Blocking (sync, one worker)</text><text x="40" y="90" font-size="10" fill="#718096">a slow wait holds the worker; others queue</text><rect x="40" y="100" width="130" height="26" rx="4" fill="#fed7d7" stroke="#e53e3e" /><text x="105" y="117" text-anchor="middle" font-size="9.5" fill="#742a2a">R1: wait on DB ...</text><rect x="172" y="100" width="130" height="26" rx="4" fill="#fff5f5" stroke="#fc8181" /><text x="237" y="117" text-anchor="middle" font-size="9.5" fill="#9b2c2c">R2 waits its turn</text><rect x="304" y="100" width="130" height="26" rx="4" fill="#fff5f5" stroke="#fc8181" /><text x="369" y="117" text-anchor="middle" font-size="9.5" fill="#9b2c2c">R3 waits its turn</text><text x="450" y="117" font-size="9.5" fill="#c53030">slow under load</text><text x="40" y="180" font-size="13" font-weight="700" fill="#276749">Async (await on I/O)</text><text x="40" y="198" font-size="10" fill="#718096">during an await, the worker switches to other requests</text><rect x="40" y="210" width="86" height="26" rx="4" fill="#c6f6d5" stroke="#48bb78" /><text x="83" y="227" text-anchor="middle" font-size="9" fill="#22543d">R1 start</text><rect x="128" y="210" width="120" height="26" rx="4" fill="#e6fffa" stroke="#81e6d9" /><text x="188" y="227" text-anchor="middle" font-size="8.5" fill="#234e52">R1 awaiting (idle)</text><rect x="250" y="210" width="86" height="26" rx="4" fill="#c6f6d5" stroke="#48bb78" /><text x="293" y="227" text-anchor="middle" font-size="9" fill="#22543d">R1 finish</text><rect x="128" y="240" width="86" height="26" rx="4" fill="#bee3f8" stroke="#4299e1" /><text x="171" y="257" text-anchor="middle" font-size="9" fill="#2a4365">R2 runs</text><rect x="216" y="240" width="86" height="26" rx="4" fill="#bee3f8" stroke="#4299e1" /><text x="259" y="257" text-anchor="middle" font-size="9" fill="#2a4365">R3 runs</text><text x="346" y="232" font-size="9.5" fill="#276749">same worker handles</text><text x="346" y="246" font-size="9.5" fill="#276749">all three in the gap</text><rect x="40" y="290" width="560" height="44" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="320" y="309" text-anchor="middle" font-size="10.5" fill="#2d3748">Use <tspan font-family="monospace">async def</tspan> with <tspan font-family="monospace">await</tspan> when an endpoint waits on I/O (a database, an API call).</text><text x="320" y="325" text-anchor="middle" font-size="10.5" fill="#2d3748">For plain CPU work or blocking libraries, a normal <tspan font-family="monospace">def</tspan> is fine — FastAPI runs it in a threadpool.</text></svg>