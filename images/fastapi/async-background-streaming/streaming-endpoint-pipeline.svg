<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">One token's path from generator to screen</text><rect x="40" y="60" width="160" height="46" rx="6" fill="#c6f6d5" stroke="#48bb78" /><text x="120" y="80" text-anchor="middle" font-size="9.5" fill="#22543d">async generator</text><text x="120" y="94" text-anchor="middle" font-size="8.5" fill="#22543d">await next token, yield it</text><text x="208" y="87" font-size="14" fill="#718096">&#8594;</text><rect x="230" y="60" width="160" height="46" rx="6" fill="#bee3f8" stroke="#4299e1" /><text x="310" y="80" text-anchor="middle" font-size="9.5" fill="#2a4365">StreamingResponse</text><text x="310" y="94" text-anchor="middle" font-size="8.5" fill="#2a4365">flush this chunk now</text><text x="398" y="87" font-size="14" fill="#718096">&#8594;</text><rect x="420" y="60" width="160" height="46" rx="6" fill="#e6fffa" stroke="#81e6d9" /><text x="500" y="80" text-anchor="middle" font-size="9.5" fill="#234e52">HTTP response</text><text x="500" y="94" text-anchor="middle" font-size="8.5" fill="#234e52">still open, more to come</text><text x="320" y="140" text-anchor="middle" font-size="10.5" fill="#4a5568">the same open response reaches two kinds of client:</text><rect x="40" y="158" width="270" height="66" rx="6" fill="#f7fafc" stroke="#cbd5e0" /><text x="175" y="180" text-anchor="middle" font-size="10" font-weight="700" fill="#2d3748">TestClient</text><text x="175" y="198" text-anchor="middle" font-size="8.5" fill="#4a5568">buffers the whole body</text><text x="175" y="212" text-anchor="middle" font-size="8.5" fill="#c53030">you see it all at once</text><rect x="330" y="158" width="270" height="66" rx="6" fill="#f7fafc" stroke="#cbd5e0" /><text x="465" y="180" text-anchor="middle" font-size="10" font-weight="700" fill="#2d3748">curl -N / browser stream reader</text><text x="465" y="198" text-anchor="middle" font-size="8.5" fill="#4a5568">reads bytes as they arrive</text><text x="465" y="212" text-anchor="middle" font-size="8.5" fill="#276749">you watch each token land</text><rect x="40" y="256" width="560" height="72" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="320" y="278" text-anchor="middle" font-size="10.5" fill="#2d3748">The three pieces &#8212; a generator, a <tspan font-family="monospace">StreamingResponse</tspan>, and an awaitable source &#8212; do not change.</text><text x="320" y="296" text-anchor="middle" font-size="10.5" fill="#2d3748">The server streams the whole time. Only the client's buffering decides whether</text><text x="320" y="314" text-anchor="middle" font-size="10.5" fill="#2d3748">you watch the tokens arrive one by one.</text></svg>
