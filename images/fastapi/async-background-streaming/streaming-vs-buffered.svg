<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Buffered vs streamed: when the first byte leaves</text><text x="40" y="70" font-size="13" font-weight="700" fill="#c53030">Buffered: compute everything, then respond</text><rect x="40" y="82" width="300" height="28" rx="4" fill="#fed7d7" stroke="#e53e3e" /><text x="190" y="100" text-anchor="middle" font-size="9.5" fill="#742a2a">build the whole body in memory...</text><rect x="346" y="82" width="130" height="28" rx="4" fill="#bee3f8" stroke="#4299e1" /><text x="411" y="100" text-anchor="middle" font-size="9.5" fill="#2a4365">send one block</text><text x="484" y="100" font-size="9.5" fill="#c53030">client sees</text><text x="484" y="112" font-size="9.5" fill="#c53030">nothing until now</text><text x="40" y="170" font-size="13" font-weight="700" fill="#276749">Streamed: yield a chunk, send it, repeat</text><rect x="40" y="182" width="95" height="28" rx="4" fill="#c6f6d5" stroke="#48bb78" /><text x="87" y="200" text-anchor="middle" font-size="9.5" fill="#22543d">chunk 1</text><text x="140" y="200" font-size="12" fill="#718096">&#8594;</text><rect x="156" y="182" width="95" height="28" rx="4" fill="#c6f6d5" stroke="#48bb78" /><text x="203" y="200" text-anchor="middle" font-size="9.5" fill="#22543d">chunk 2</text><text x="256" y="200" font-size="12" fill="#718096">&#8594;</text><rect x="272" y="182" width="95" height="28" rx="4" fill="#c6f6d5" stroke="#48bb78" /><text x="319" y="200" text-anchor="middle" font-size="9.5" fill="#22543d">chunk 3</text><text x="372" y="200" font-size="12" fill="#718096">&#8594;</text><text x="392" y="200" font-size="9.5" fill="#718096">... one chunk in memory at a time</text><text x="40" y="238" font-size="10" fill="#276749">client renders each chunk the moment it lands &#8212; the "typing" effect</text><rect x="40" y="262" width="560" height="72" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="320" y="284" text-anchor="middle" font-size="10.5" fill="#2d3748">Wrap a generator in <tspan font-family="monospace">StreamingResponse</tspan> with a <tspan font-family="monospace">media_type</tspan>; FastAPI flushes each yielded chunk as it arrives.</text><text x="320" y="302" text-anchor="middle" font-size="10.5" fill="#2d3748">Server-Sent Events is streaming with a fixed shape: <tspan font-family="monospace">media_type="text/event-stream"</tspan>,</text><text x="320" y="320" text-anchor="middle" font-size="10.5" fill="#2d3748">and each message is <tspan font-family="monospace">data: ...</tspan> followed by a blank line.</text></svg>
