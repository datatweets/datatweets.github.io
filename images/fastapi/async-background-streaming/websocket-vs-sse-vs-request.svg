<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Request/response vs SSE vs WebSocket</text><!-- panel 1 --><rect x="24" y="56" width="188" height="210" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="118" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">Request / response</text><text x="48" y="104" font-size="10" fill="#718096">client</text><text x="160" y="104" font-size="10" fill="#718096">server</text><path d="M52 120 H184" stroke="#4299e1" stroke-width="1.5" /><polygon points="184,120 176,116 176,124" fill="#4299e1" /><text x="118" y="115" text-anchor="middle" font-size="8.5" fill="#2a4365">request</text><path d="M184 144 H52" stroke="#48bb78" stroke-width="1.5" /><polygon points="52,144 60,140 60,148" fill="#48bb78" /><text x="118" y="139" text-anchor="middle" font-size="8.5" fill="#22543d">one response</text><text x="118" y="188" text-anchor="middle" font-size="9" fill="#c53030">connection closes</text><text x="118" y="202" text-anchor="middle" font-size="9" fill="#c53030">after one exchange</text><!-- panel 2 --><rect x="226" y="56" width="188" height="210" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="320" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">SSE (one-way)</text><text x="250" y="104" font-size="10" fill="#718096">client</text><text x="362" y="104" font-size="10" fill="#718096">server</text><path d="M254 120 H386" stroke="#718096" stroke-width="1.5" stroke-dasharray="3 2" /><text x="320" y="115" text-anchor="middle" font-size="8.5" fill="#4a5568">open</text><path d="M386 138 H254" stroke="#48bb78" stroke-width="1.5" /><polygon points="254,138 262,134 262,142" fill="#48bb78" /><path d="M386 156 H254" stroke="#48bb78" stroke-width="1.5" /><polygon points="254,156 262,152 262,160" fill="#48bb78" /><path d="M386 174 H254" stroke="#48bb78" stroke-width="1.5" /><polygon points="254,174 262,170 262,178" fill="#48bb78" /><text x="320" y="206" text-anchor="middle" font-size="9" fill="#276749">stays open,</text><text x="320" y="220" text-anchor="middle" font-size="9" fill="#276749">server &#8594; client only</text><!-- panel 3 --><rect x="428" y="56" width="188" height="210" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="522" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">WebSocket</text><text x="452" y="104" font-size="10" fill="#718096">client</text><text x="564" y="104" font-size="10" fill="#718096">server</text><path d="M456 120 H588" stroke="#718096" stroke-width="1.5" stroke-dasharray="3 2" /><text x="522" y="115" text-anchor="middle" font-size="8.5" fill="#4a5568">accept()</text><path d="M456 138 H588" stroke="#4299e1" stroke-width="1.5" /><polygon points="588,138 580,134 580,142" fill="#4299e1" /><path d="M588 156 H456" stroke="#48bb78" stroke-width="1.5" /><polygon points="456,156 464,152 464,160" fill="#48bb78" /><path d="M456 174 H588" stroke="#4299e1" stroke-width="1.5" /><polygon points="588,174 580,170 580,178" fill="#4299e1" /><path d="M588 192 H456" stroke="#48bb78" stroke-width="1.5" /><polygon points="456,192 464,188 464,196" fill="#48bb78" /><text x="522" y="224" text-anchor="middle" font-size="9" fill="#276749">stays open,</text><text x="522" y="238" text-anchor="middle" font-size="9" fill="#276749">both directions</text><rect x="24" y="284" width="592" height="54" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="320" y="304" text-anchor="middle" font-size="10.5" fill="#2d3748">Use a WebSocket when both sides send messages &#8212; chat, live editing, interactive dashboards.</text><text x="320" y="322" text-anchor="middle" font-size="10.5" fill="#2d3748">If data only flows server &#8594; client, one-way SSE over plain HTTP is simpler.</text></svg>
