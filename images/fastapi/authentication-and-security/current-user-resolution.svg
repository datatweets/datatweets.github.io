<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="410" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">How get_current_user resolves a request to a user</text><text x="320" y="50" text-anchor="middle" font-size="11" fill="#718096">One dependency, four steps, top to bottom.</text><rect x="40" y="64" width="330" height="46" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="2" /><text x="205" y="83" text-anchor="middle" font-size="10" font-weight="700" fill="#4a5568">Incoming request header</text><text x="205" y="100" text-anchor="middle" font-size="9.5" fill="#4a5568" font-family="monospace">Authorization: Bearer &lt;token&gt;</text><line x1="205" y1="110" x2="205" y2="128" stroke="#a0aec0" stroke-width="1.8" /><polygon points="205 128 199 116 211 116" fill="#a0aec0" /><rect x="40" y="128" width="330" height="46" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="2" /><text x="205" y="147" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0" font-family="monospace">oauth2_scheme</text><text x="205" y="164" text-anchor="middle" font-size="9.5" fill="#2b6cb0">pulls the token string out of the header</text><line x1="205" y1="174" x2="205" y2="192" stroke="#a0aec0" stroke-width="1.8" /><polygon points="205 192 199 180 211 180" fill="#a0aec0" /><rect x="40" y="192" width="330" height="52" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="205" y="210" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">decode the token to a username</text><text x="205" y="226" text-anchor="middle" font-size="9" fill="#276749">Lesson 2: look it up. Lesson 3: verify a</text><text x="205" y="238" text-anchor="middle" font-size="9" fill="#276749">signed JWT and read its sub claim.</text><line x1="205" y1="244" x2="205" y2="262" stroke="#a0aec0" stroke-width="1.8" /><polygon points="205 262 199 250 211 250" fill="#a0aec0" /><rect x="40" y="262" width="330" height="46" rx="10" fill="#e6fffa" stroke="#319795" stroke-width="2" /><text x="205" y="281" text-anchor="middle" font-size="10" font-weight="700" fill="#234e52" font-family="monospace">users.get(username)</text><text x="205" y="298" text-anchor="middle" font-size="9.5" fill="#234e52">looks the user up in the store</text><line x1="205" y1="308" x2="205" y2="326" stroke="#a0aec0" stroke-width="1.8" /><polygon points="205 326 199 314 211 314" fill="#a0aec0" /><rect x="105" y="326" width="200" height="38" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="205" y="349" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">return the current user</text><rect x="410" y="128" width="200" height="180" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="2" /><text x="510" y="150" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c53030">Any step fails &#8594; 401</text><text x="425" y="176" font-size="9" fill="#742a2a">No header:</text><text x="425" y="190" font-size="9" fill="#742a2a">  "Not authenticated"</text><text x="425" y="216" font-size="9" fill="#742a2a">Token will not decode:</text><text x="425" y="230" font-size="9" fill="#742a2a">  caught &#8594; 401</text><text x="425" y="256" font-size="9" fill="#742a2a">Unknown user:</text><text x="425" y="270" font-size="9" fill="#742a2a">  "Invalid ... credentials"</text><line x1="410" y1="215" x2="372" y2="215" stroke="#fc8181" stroke-width="1.6" stroke-dasharray="4 3" /><polygon points="372 215 382 210 382 220" fill="#fc8181" /><text x="320" y="392" text-anchor="middle" font-size="11" fill="#718096">Every failure collapses into the same 401, so the response never reveals which check failed.</text></svg>
