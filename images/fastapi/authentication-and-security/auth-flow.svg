<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="370" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Log in once, then carry a token</text><text x="110" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">Client</text><text x="500" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">Your API</text><line x1="110" y1="72" x2="110" y2="330" stroke="#e2e8f0" stroke-width="1.5" /><line x1="500" y1="72" x2="500" y2="330" stroke="#e2e8f0" stroke-width="1.5" /><text x="40" y="96" font-size="10.5" font-weight="700" fill="#2b6cb0">1. log in</text><line x1="110" y1="108" x2="500" y2="108" stroke="#4299e1" stroke-width="1.8" /><polygon points="500 108 491 104 491 112" fill="#4299e1" /><text x="305" y="102" text-anchor="middle" font-size="9.5" fill="#3182ce">POST /token  (username + password)</text><rect x="404" y="118" width="200" height="40" rx="6" fill="#e6fffa" stroke="#319795" /><text x="504" y="134" text-anchor="middle" font-size="9" fill="#234e52">verify password against the</text><text x="504" y="148" text-anchor="middle" font-size="9" fill="#234e52">stored bcrypt hash</text><text x="40" y="182" font-size="10.5" font-weight="700" fill="#276749">2. get token</text><line x1="500" y1="190" x2="110" y2="190" stroke="#48bb78" stroke-width="1.8" /><polygon points="110 190 119 186 119 194" fill="#48bb78" /><text x="305" y="184" text-anchor="middle" font-size="9.5" fill="#2f855a">200  { access_token: signed JWT }</text><rect x="36" y="200" width="150" height="36" rx="6" fill="#fffaf0" stroke="#ed8936" /><text x="111" y="222" text-anchor="middle" font-size="9" fill="#9c4221">client keeps the token</text><text x="40" y="264" font-size="10.5" font-weight="700" fill="#6b46c1">3. call protected</text><line x1="110" y1="276" x2="500" y2="276" stroke="#9f7aea" stroke-width="1.8" /><polygon points="500 276 491 272 491 280" fill="#9f7aea" /><text x="305" y="270" text-anchor="middle" font-size="9.5" fill="#805ad5">GET /me   Authorization: Bearer &lt;token&gt;</text><rect x="404" y="286" width="200" height="40" rx="6" fill="#faf5ff" stroke="#9f7aea" /><text x="504" y="302" text-anchor="middle" font-size="9" fill="#553c9a">decode + verify the JWT,</text><text x="504" y="316" text-anchor="middle" font-size="9" fill="#553c9a">load the current user</text><text x="320" y="352" text-anchor="middle" font-size="11" fill="#718096">The password is sent once at login; afterward every request carries a signed token the server can verify on its own.</text></svg>