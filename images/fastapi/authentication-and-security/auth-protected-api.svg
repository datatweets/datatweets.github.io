<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="420" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The finished Tasks API: three tiers of access</text><text x="320" y="50" text-anchor="middle" font-size="11" fill="#718096">Each tier adds one more check on top of the one above it.</text><rect x="30" y="66" width="384" height="86" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="46" y="87" font-size="11" font-weight="700" fill="#276749">Open &#8212; no token needed</text><text x="46" y="108" font-size="9.5" fill="#2f855a" font-family="monospace">POST /register</text><text x="230" y="108" font-size="9.5" fill="#2f855a">hash the password, store the user</text><text x="46" y="128" font-size="9.5" fill="#2f855a" font-family="monospace">POST /token</text><text x="230" y="128" font-size="9.5" fill="#2f855a">verify password, return a signed JWT</text><text x="46" y="145" font-size="9" fill="#718096">This is the front door: how a user gets in.</text><rect x="30" y="162" width="384" height="86" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="2" /><text x="46" y="183" font-size="11" font-weight="700" fill="#2b6cb0">Any logged-in user &#8212; via get_current_user</text><text x="46" y="204" font-size="9.5" fill="#2c5282" font-family="monospace">GET /tasks</text><text x="230" y="204" font-size="9.5" fill="#2c5282">list tasks</text><text x="46" y="224" font-size="9.5" fill="#2c5282" font-family="monospace">POST /tasks</text><text x="230" y="224" font-size="9.5" fill="#2c5282">create a task, record the owner</text><text x="46" y="241" font-size="9" fill="#718096">Decode the JWT, load the user, or 401.</text><rect x="30" y="258" width="384" height="70" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="46" y="279" font-size="11" font-weight="700" fill="#6b46c1">Admin only &#8212; via require_admin</text><text x="46" y="300" font-size="9.5" fill="#553c9a" font-family="monospace">DELETE /tasks/{id}</text><text x="230" y="300" font-size="9.5" fill="#553c9a">delete a task</text><text x="46" y="317" font-size="9" fill="#718096">get_current_user passes, then check role == "admin", or 403.</text><rect x="430" y="66" width="182" height="120" rx="10" fill="#e6fffa" stroke="#319795" stroke-width="2" /><text x="521" y="88" text-anchor="middle" font-size="10.5" font-weight="700" fill="#234e52">In-memory stores</text><text x="446" y="110" font-size="9" fill="#234e52" font-family="monospace">users[name] = {</text><text x="454" y="123" font-size="9" fill="#234e52" font-family="monospace">username,</text><text x="454" y="136" font-size="9" fill="#234e52" font-family="monospace">hashed_password,</text><text x="454" y="149" font-size="9" fill="#234e52" font-family="monospace">role }</text><text x="446" y="169" font-size="9" fill="#234e52" font-family="monospace">tasks[id] = { id,</text><text x="454" y="181" font-size="9" fill="#234e52" font-family="monospace">title, owner }</text><rect x="430" y="196" width="182" height="132" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="2" /><text x="521" y="217" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c05621">Carry into production</text><text x="446" y="238" font-size="9" fill="#9c4221">Load SECRET from the</text><text x="446" y="251" font-size="9" fill="#9c4221">environment; rotate it.</text><text x="446" y="271" font-size="9" fill="#9c4221">Back both stores with the</text><text x="446" y="284" font-size="9" fill="#9c4221">Module 5 database.</text><text x="446" y="304" font-size="9" fill="#9c4221">Store passwords only as</text><text x="446" y="317" font-size="9" fill="#9c4221">hashes; never return them.</text><text x="320" y="356" text-anchor="middle" font-size="11" fill="#718096">A request climbs only as far as its credentials allow: open, then logged-in, then admin.</text><text x="320" y="384" text-anchor="middle" font-size="11" fill="#718096">The same token that lists and creates tasks is not enough to delete one.</text></svg>
