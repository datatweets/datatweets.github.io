<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="450" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Authenticate first (401), authorize second (403)</text><text x="320" y="50" text-anchor="middle" font-size="11" fill="#718096">FastAPI runs the dependency chain in order, top to bottom.</text><rect x="40" y="66" width="300" height="40" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="2" /><text x="190" y="90" text-anchor="middle" font-size="10" font-weight="700" fill="#4a5568" font-family="monospace">DELETE /tasks/5</text><line x1="190" y1="106" x2="190" y2="122" stroke="#a0aec0" stroke-width="1.8" /><polygon points="190 122 184 110 196 110" fill="#a0aec0" /><rect x="40" y="122" width="300" height="46" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="2" /><text x="190" y="141" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0" font-family="monospace">oauth2_scheme</text><text x="190" y="158" text-anchor="middle" font-size="9.5" fill="#2b6cb0">Is a Bearer token present?</text><line x1="190" y1="168" x2="190" y2="184" stroke="#a0aec0" stroke-width="1.8" /><polygon points="190 184 184 172 196 172" fill="#a0aec0" /><rect x="40" y="184" width="300" height="46" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="190" y="203" text-anchor="middle" font-size="10" font-weight="700" fill="#276749" font-family="monospace">get_current_user</text><text x="190" y="220" text-anchor="middle" font-size="9.5" fill="#276749">Token valid? User exists?</text><line x1="190" y1="230" x2="190" y2="246" stroke="#a0aec0" stroke-width="1.8" /><polygon points="190 246 184 234 196 234" fill="#a0aec0" /><rect x="40" y="246" width="300" height="46" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="190" y="265" text-anchor="middle" font-size="10" font-weight="700" fill="#6b46c1" font-family="monospace">require_admin</text><text x="190" y="282" text-anchor="middle" font-size="9.5" fill="#6b46c1">Is user["role"] == "admin"?</text><line x1="190" y1="292" x2="190" y2="308" stroke="#a0aec0" stroke-width="1.8" /><polygon points="190 308 184 296 196 296" fill="#a0aec0" /><rect x="90" y="308" width="200" height="40" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="190" y="332" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">delete_task runs &#8594; 200</text><line x1="340" y1="145" x2="392" y2="145" stroke="#fc8181" stroke-width="1.6" stroke-dasharray="4 3" /><polygon points="392 145 382 140 382 150" fill="#fc8181" /><text x="352" y="140" font-size="8.5" fill="#c53030">no token</text><line x1="340" y1="207" x2="392" y2="207" stroke="#fc8181" stroke-width="1.6" stroke-dasharray="4 3" /><polygon points="392 207 382 202 382 212" fill="#fc8181" /><text x="352" y="202" font-size="8.5" fill="#c53030">bad token</text><line x1="340" y1="269" x2="392" y2="269" stroke="#dd6b20" stroke-width="1.6" stroke-dasharray="4 3" /><polygon points="392 269 382 264 382 274" fill="#dd6b20" /><text x="352" y="264" font-size="8.5" fill="#c05621">not admin</text><rect x="396" y="120" width="214" height="80" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="2" /><text x="503" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#c53030">401 Unauthorized</text><text x="503" y="160" text-anchor="middle" font-size="9" fill="#742a2a">"We don't know who you are."</text><text x="503" y="176" text-anchor="middle" font-size="9" fill="#742a2a">No valid credentials &#8212; the</text><text x="503" y="190" text-anchor="middle" font-size="9" fill="#742a2a">client should go log in.</text><rect x="396" y="240" width="214" height="80" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="2" /><text x="503" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">403 Forbidden</text><text x="503" y="280" text-anchor="middle" font-size="9" fill="#9c4221">"We know you; still no."</text><text x="503" y="296" text-anchor="middle" font-size="9" fill="#9c4221">Identity is fine, the action</text><text x="503" y="310" text-anchor="middle" font-size="9" fill="#9c4221">isn't &#8212; re-login won't help.</text><text x="320" y="378" text-anchor="middle" font-size="11" fill="#718096">require_admin only runs because authentication already passed &#8212; so its failure is 403, not 401.</text><text x="320" y="408" text-anchor="middle" font-size="11" fill="#718096">Write require_editor or require_owner the same way, without touching any route body.</text></svg>
