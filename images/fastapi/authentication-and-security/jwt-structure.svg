<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">A JWT has three parts, joined by dots</text><text x="320" y="52" text-anchor="middle" font-size="11" fill="#718096">header . payload . signature &#8212; each part is Base64-encoded</text><rect x="26" y="70" width="180" height="150" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="2" /><text x="116" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b6cb0">header</text><text x="116" y="118" text-anchor="middle" font-size="10" fill="#2c5282" font-family="monospace">{ "alg": "HS256" }</text><text x="116" y="150" text-anchor="middle" font-size="9.5" fill="#2b6cb0">says how the token</text><text x="116" y="164" text-anchor="middle" font-size="9.5" fill="#2b6cb0">was signed</text><text x="116" y="200" text-anchor="middle" font-size="9" fill="#718096">readable</text><circle cx="218" cy="145" r="4" fill="#a0aec0" /><rect x="230" y="70" width="180" height="150" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="320" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#276749">payload</text><text x="320" y="116" text-anchor="middle" font-size="10" fill="#22543d" font-family="monospace">{ "sub": "ada",</text><text x="320" y="130" text-anchor="middle" font-size="10" fill="#22543d" font-family="monospace">"exp": 1788718907 }</text><text x="320" y="160" text-anchor="middle" font-size="9.5" fill="#276749">the claims: who the</text><text x="320" y="174" text-anchor="middle" font-size="9.5" fill="#276749">token is for, when it expires</text><text x="320" y="200" text-anchor="middle" font-size="9" fill="#718096">readable</text><circle cx="422" cy="145" r="4" fill="#a0aec0" /><rect x="434" y="70" width="180" height="150" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="524" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b46c1">signature</text><text x="524" y="118" text-anchor="middle" font-size="9" fill="#553c9a" font-family="monospace">HMAC(header.payload,</text><text x="524" y="131" text-anchor="middle" font-size="9" fill="#553c9a" font-family="monospace">SECRET)</text><text x="524" y="160" text-anchor="middle" font-size="9.5" fill="#6b46c1">a stamp only your</text><text x="524" y="174" text-anchor="middle" font-size="9.5" fill="#6b46c1">SECRET can produce</text><text x="524" y="200" text-anchor="middle" font-size="9" fill="#718096">tamper-proof</text><rect x="26" y="240" width="588" height="40" rx="8" fill="#fffaf0" stroke="#ed8936" /><text x="320" y="257" text-anchor="middle" font-size="10" fill="#9c4221" font-weight="700">Signed, not encrypted</text><text x="320" y="272" text-anchor="middle" font-size="9.5" fill="#9c4221">Change one character of the header or payload and the signature no longer matches &#8212; verification fails.</text><text x="320" y="322" text-anchor="middle" font-size="11" fill="#718096">Anyone holding the token can read the claims. No one without your SECRET can change them and still pass verification.</text></svg>
