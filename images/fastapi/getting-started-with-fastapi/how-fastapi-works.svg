<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">One function, three things for free</text><rect x="28" y="150" width="120" height="60" rx="10" fill="#f7fafc" stroke="#cbd5e0" /><text x="88" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#2d3748">client</text><text x="88" y="194" text-anchor="middle" font-size="10" fill="#718096">browser, app, curl</text><line x1="148" y1="172" x2="214" y2="172" stroke="#a0aec0" stroke-width="1.8" /><polygon points="214 172 205 168 205 176" fill="#a0aec0" /><text x="181" y="164" text-anchor="middle" font-size="9" fill="#718096">GET /tasks/3</text><line x1="214" y1="192" x2="148" y2="192" stroke="#48bb78" stroke-width="1.8" /><polygon points="148 192 157 188 157 196" fill="#48bb78" /><text x="181" y="208" text-anchor="middle" font-size="9" fill="#2f855a">JSON back</text><rect x="222" y="120" width="196" height="120" rx="12" fill="#e6fffa" stroke="#319795" stroke-width="2" /><text x="320" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#234e52">your path operation</text><rect x="236" y="152" width="168" height="74" rx="6" fill="#ffffff" stroke="#b2f5ea" /><text x="246" y="170" font-size="10.5" fill="#2d3748" font-family="monospace">@app.get("/tasks/{id}")</text><text x="246" y="187" font-size="10.5" fill="#2d3748" font-family="monospace">def read(id: int):</text><text x="246" y="204" font-size="10.5" fill="#2d3748" font-family="monospace">  return task</text><text x="320" y="220" text-anchor="middle" font-size="9" fill="#718096" /><line x1="418" y1="150" x2="470" y2="100" stroke="#a0aec0" stroke-width="1.6" /><polygon points="470 100 461 102 465 109" fill="#a0aec0" /><line x1="418" y1="180" x2="470" y2="180" stroke="#a0aec0" stroke-width="1.6" /><polygon points="470 180 461 176 461 184" fill="#a0aec0" /><line x1="418" y1="210" x2="470" y2="260" stroke="#a0aec0" stroke-width="1.6" /><polygon points="470 260 461 251 465 258" fill="#a0aec0" /><rect x="470" y="82" width="150" height="40" rx="8" fill="#ebf4ff" stroke="#4299e1" /><text x="480" y="100" font-size="11" font-weight="700" fill="#2b6cb0">Validation</text><text x="480" y="115" font-size="9" fill="#3182ce">id must be an int</text><rect x="470" y="160" width="150" height="40" rx="8" fill="#faf5ff" stroke="#9f7aea" /><text x="480" y="178" font-size="11" font-weight="700" fill="#6b46c1">JSON response</text><text x="480" y="193" font-size="9" fill="#805ad5">dict → JSON, typed</text><rect x="470" y="238" width="150" height="40" rx="8" fill="#fffaf0" stroke="#ed8936" /><text x="480" y="256" font-size="11" font-weight="700" fill="#c05621">Interactive docs</text><text x="480" y="271" font-size="9" fill="#9c4221">auto /docs page</text><text x="320" y="332" text-anchor="middle" font-size="11" fill="#718096">You write one typed Python function; FastAPI gives you validation, JSON, and live API docs automatically.</text></svg>