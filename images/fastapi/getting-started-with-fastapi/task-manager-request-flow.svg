<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Two ways to read the Task Manager</text>

<text x="20" y="54" font-size="11.5" font-weight="700" fill="#4a5568">GET /tasks &#8212; the filter pipeline</text>

<rect x="20" y="64" width="100" height="60" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.4" /><text x="70" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#2d3748">All tasks</text><text x="70" y="102" text-anchor="middle" font-size="9" fill="#718096">4 records</text>
<line x1="120" y1="94" x2="142" y2="94" stroke="#a0aec0" stroke-width="1.6" /><polygon points="142 94 134 90 134 98" fill="#a0aec0" />

<rect x="145" y="64" width="100" height="60" rx="8" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.4" /><text x="195" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">done filter</text><text x="195" y="102" text-anchor="middle" font-size="9" fill="#3182ce">if given</text>
<line x1="245" y1="94" x2="267" y2="94" stroke="#a0aec0" stroke-width="1.6" /><polygon points="267 94 259 90 259 98" fill="#a0aec0" />

<rect x="270" y="64" width="100" height="60" rx="8" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.4" /><text x="320" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">priority filter</text><text x="320" y="102" text-anchor="middle" font-size="9" fill="#3182ce">if given</text>
<line x1="370" y1="94" x2="392" y2="94" stroke="#a0aec0" stroke-width="1.6" /><polygon points="392 94 384 90 384 98" fill="#a0aec0" />

<rect x="395" y="64" width="100" height="60" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="445" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#6b46c1">limit slice</text><text x="445" y="102" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#805ad5">[:limit]</text>
<line x1="495" y1="94" x2="517" y2="94" stroke="#a0aec0" stroke-width="1.6" /><polygon points="517 94 509 90 509 98" fill="#a0aec0" />

<rect x="520" y="64" width="100" height="60" rx="8" fill="#f0fff4" stroke="#68d391" stroke-width="1.4" /><text x="570" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">Response</text><text x="570" y="102" text-anchor="middle" font-size="9" fill="#2f855a">filtered list</text>

<text x="20" y="150" font-size="11.5" font-weight="700" fill="#4a5568">GET /tasks/{task_id} &#8212; found or not found</text>

<rect x="20" y="165" width="140" height="60" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.4" /><text x="90" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="#2d3748">Loop TASKS</text><text x="90" y="204" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#718096">t["id"] == task_id?</text>
<line x1="160" y1="195" x2="182" y2="195" stroke="#a0aec0" stroke-width="1.6" /><polygon points="182 195 174 191 174 199" fill="#a0aec0" />

<rect x="185" y="165" width="150" height="60" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" stroke-dasharray="4 3" /><text x="260" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621">Match found?</text><text x="260" y="204" text-anchor="middle" font-size="9" fill="#9c4221">one branch runs</text>

<line x1="335" y1="188" x2="392" y2="163" stroke="#a0aec0" stroke-width="1.4" /><polygon points="392 163 383 165 387 172" fill="#a0aec0" /><line x1="335" y1="202" x2="392" y2="232" stroke="#a0aec0" stroke-width="1.4" /><polygon points="392 232 383 230 387 223" fill="#a0aec0" />

<rect x="395" y="138" width="215" height="52" rx="8" fill="#f0fff4" stroke="#68d391" stroke-width="1.4" /><text x="502" y="159" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">Yes: return the task</text><text x="502" y="176" text-anchor="middle" font-size="9" fill="#2f855a">200 OK, task as JSON</text>

<rect x="395" y="207" width="215" height="52" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.4" /><text x="502" y="228" text-anchor="middle" font-size="10" font-weight="700" fill="#c53030">No: raise HTTPException</text><text x="502" y="245" text-anchor="middle" font-size="9" fill="#9b2c2c">404, {"detail": "..."}</text>

<text x="320" y="290" text-anchor="middle" font-size="10.5" fill="#718096">The list endpoint narrows the results step by step; the single-task endpoint always ends in one of two branches.</text>
<text x="320" y="332" text-anchor="middle" font-size="11" fill="#718096">Both endpoints reuse the same in-memory TASKS list &#8212; one filters it, the other searches it by id.</text></svg>
