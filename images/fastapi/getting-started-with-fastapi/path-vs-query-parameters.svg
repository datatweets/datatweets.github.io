<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">One URL, two kinds of parameters</text>

<text x="150" y="150" font-size="18" font-family="monospace"><tspan fill="#718096">GET </tspan><tspan fill="#1a202c" font-weight="700">/tasks</tspan><tspan fill="#2b6cb0" font-weight="700">/3</tspan><tspan fill="#6b46c1" font-weight="700">?done=true&amp;limit=5</tspan></text>

<line x1="193" y1="158" x2="258" y2="158" stroke="#a0aec0" stroke-width="2.5" />
<line x1="258" y1="158" x2="280" y2="158" stroke="#4299e1" stroke-width="2.5" />
<line x1="280" y1="158" x2="485" y2="158" stroke="#9f7aea" stroke-width="2.5" />

<line x1="225" y1="162" x2="110" y2="222" stroke="#a0aec0" stroke-width="1.4" /><line x1="269" y1="162" x2="320" y2="222" stroke="#4299e1" stroke-width="1.4" /><line x1="382" y1="162" x2="530" y2="222" stroke="#9f7aea" stroke-width="1.4" />

<rect x="20" y="222" width="180" height="78" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.6" /><text x="110" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">Fixed path</text><text x="110" y="266" text-anchor="middle" font-size="10" font-family="monospace" fill="#4a5568">/tasks</text><text x="110" y="284" text-anchor="middle" font-size="9.5" fill="#718096">always the same text</text>

<rect x="230" y="222" width="180" height="78" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.6" /><text x="320" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Path parameter</text><text x="320" y="266" text-anchor="middle" font-size="10" font-family="monospace" fill="#2c5282">/3</text><text x="320" y="284" text-anchor="middle" font-size="9.5" fill="#3182ce">identifies which task</text>

<rect x="440" y="222" width="180" height="78" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="530" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">Query parameters</text><text x="530" y="266" text-anchor="middle" font-size="10" font-family="monospace" fill="#553c9a">?done=true&amp;limit=5</text><text x="530" y="284" text-anchor="middle" font-size="9.5" fill="#805ad5">optional, shapes the result</text>

<text x="320" y="326" text-anchor="middle" font-size="11" fill="#718096">Path parameters pick which resource; query parameters say how to filter, sort, or paginate it.</text></svg>
