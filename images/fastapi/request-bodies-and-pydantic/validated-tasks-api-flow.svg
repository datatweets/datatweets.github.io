<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="350" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">One store, three endpoints, the same validated Task shape</text><rect x="155" y="48" width="250" height="54" rx="10" fill="#e6fffa" stroke="#319795" stroke-width="2" /><text x="280" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#234e52">POST /tasks</text><text x="280" y="88" text-anchor="middle" font-size="10" font-family="monospace" fill="#2f6b66">body validated as TaskCreate</text><line x1="280" y1="102" x2="280" y2="130" stroke="#a0aec0" stroke-width="1.8" /><polygon points="280 130 276 121 284 121" fill="#a0aec0" /><rect x="155" y="130" width="250" height="54" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="2" /><text x="280" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">in-memory store</text><text x="280" y="170" text-anchor="middle" font-size="10" font-family="monospace" fill="#4a5568">tasks list + next_id, id assigned</text><line x1="220" y1="184" x2="150" y2="212" stroke="#48bb78" stroke-width="1.8" /><polygon points="150 212 160 209 158 218" fill="#48bb78" /><line x1="340" y1="184" x2="420" y2="212" stroke="#48bb78" stroke-width="1.8" /><polygon points="420 212 411 208 407 216" fill="#48bb78" /><rect x="30" y="212" width="250" height="54" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="155" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">GET /tasks</text><text x="155" y="252" text-anchor="middle" font-size="10" font-family="monospace" fill="#2f855a">response_model=list[Task]</text><rect x="360" y="212" width="250" height="54" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="485" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">GET /tasks/{task_id}</text><text x="485" y="252" text-anchor="middle" font-size="10" font-family="monospace" fill="#2f855a">Task, or 404 if missing</text><text x="320" y="300" text-anchor="middle" font-size="11" fill="#718096">Create assigns an id and stores a validated Task; both GET endpoints return that same shape, or a clean 404.</text></svg>