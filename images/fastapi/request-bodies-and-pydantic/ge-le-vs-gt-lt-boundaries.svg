<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="350" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Choosing ge/le vs gt/lt: does the boundary count?</text><rect x="40" y="70" width="560" height="36" fill="#e6fffa" stroke="#319795" stroke-width="1.5" /><text x="105" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#234e52">Rule</text><text x="275" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#234e52">Includes the boundary value?</text><text x="490" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#234e52">Example</text><rect x="40" y="106" width="560" height="36" fill="#f7fafc" stroke="#cbd5e0" /><text x="105" y="129" text-anchor="middle" font-size="12" font-family="monospace" fill="#2d3748">ge</text><text x="275" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Yes</text><text x="490" y="129" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2d3748">ge=0 accepts 0</text><rect x="40" y="142" width="560" height="36" fill="#ffffff" stroke="#cbd5e0" /><text x="105" y="165" text-anchor="middle" font-size="12" font-family="monospace" fill="#2d3748">gt</text><text x="275" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#c53030">No</text><text x="490" y="165" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2d3748">gt=0 rejects 0</text><rect x="40" y="178" width="560" height="36" fill="#f7fafc" stroke="#cbd5e0" /><text x="105" y="201" text-anchor="middle" font-size="12" font-family="monospace" fill="#2d3748">le</text><text x="275" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Yes</text><text x="490" y="201" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2d3748">le=100 accepts 100</text><rect x="40" y="214" width="560" height="36" fill="#ffffff" stroke="#cbd5e0" /><text x="105" y="237" text-anchor="middle" font-size="12" font-family="monospace" fill="#2d3748">lt</text><text x="275" y="237" text-anchor="middle" font-size="12" font-weight="700" fill="#c53030">No</text><text x="490" y="237" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2d3748">lt=100 rejects 100</text><rect x="40" y="70" width="560" height="180" fill="none" stroke="#a0aec0" stroke-width="1.5" /><text x="320" y="285" text-anchor="middle" font-size="11" fill="#718096">ge/le include the edge value itself; gt/lt exclude it. Picking the wrong one silently allows or rejects the boundary.</text></svg>