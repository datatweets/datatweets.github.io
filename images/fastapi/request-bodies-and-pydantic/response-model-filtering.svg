<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="350" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">response_model filters what leaves your API</text><rect x="24" y="90" width="180" height="150" rx="10" fill="#f7fafc" stroke="#cbd5e0" /><text x="114" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3748">your function returns</text><text x="34" y="134" font-size="9.5" font-family="monospace" fill="#4a5568">{</text><text x="34" y="150" font-size="9.5" font-family="monospace" fill="#4a5568">  "id": 1,</text><text x="34" y="166" font-size="9.5" font-family="monospace" fill="#4a5568">  "title": "Ship it",</text><text x="34" y="182" font-size="9.5" font-family="monospace" font-weight="700" fill="#c53030">  "internal_notes":</text><text x="34" y="198" font-size="9.5" font-family="monospace" font-weight="700" fill="#c53030">    "secret plan"</text><text x="34" y="214" font-size="9.5" font-family="monospace" fill="#4a5568">}</text><rect x="240" y="76" width="180" height="178" rx="12" fill="#e6fffa" stroke="#319795" stroke-width="2" /><text x="330" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#234e52">response_model=TaskOut</text><rect x="252" y="108" width="156" height="26" rx="5" fill="#ffffff" stroke="#b2f5ea" /><text x="262" y="126" font-size="10" font-family="monospace" fill="#2d3748">id: int</text><rect x="252" y="138" width="156" height="26" rx="5" fill="#ffffff" stroke="#b2f5ea" /><text x="262" y="156" font-size="10" font-family="monospace" fill="#2d3748">title: str</text><text x="330" y="182" text-anchor="middle" font-size="8.5" fill="#718096">only these two fields</text><text x="330" y="196" text-anchor="middle" font-size="8.5" fill="#718096">are declared &#8212; anything</text><text x="330" y="210" text-anchor="middle" font-size="8.5" fill="#718096">else is dropped</text><line x1="204" y1="140" x2="234" y2="120" stroke="#48bb78" stroke-width="1.8" /><polygon points="234 120 224 121 228 129" fill="#48bb78" /><line x1="204" y1="190" x2="234" y2="190" stroke="#e53e3e" stroke-width="1.8" stroke-dasharray="3,3" /><polygon points="228 190 219 186 219 194" fill="#e53e3e" /><text x="212" y="204" font-size="8" fill="#c53030">dropped</text><line x1="420" y1="150" x2="460" y2="150" stroke="#48bb78" stroke-width="1.8" /><polygon points="460 150 451 146 451 154" fill="#48bb78" /><rect x="464" y="112" width="150" height="76" rx="10" fill="#f0fff4" stroke="#48bb78" /><text x="474" y="132" font-size="11" font-weight="700" fill="#276749">client receives</text><text x="474" y="154" font-size="9.5" font-family="monospace" fill="#2f855a">{'id': 1,</text><text x="474" y="170" font-size="9.5" font-family="monospace" fill="#2f855a"> 'title': 'Ship it'}</text><text x="320" y="290" text-anchor="middle" font-size="11" fill="#718096">FastAPI checks your return value against response_model and keeps only its declared fields.</text><text x="320" y="306" text-anchor="middle" font-size="11" fill="#718096">internal_notes never reaches the client, even though your function returned it.</text></svg>