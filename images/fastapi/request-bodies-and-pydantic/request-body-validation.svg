<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="350" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">A Pydantic model is a gate for incoming JSON</text><rect x="24" y="120" width="150" height="110" rx="10" fill="#f7fafc" stroke="#cbd5e0" /><text x="99" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3748">incoming JSON</text><text x="34" y="162" font-size="9.5" fill="#4a5568" font-family="monospace">{</text><text x="34" y="178" font-size="9.5" fill="#4a5568" font-family="monospace">  "title": "Plan",</text><text x="34" y="194" font-size="9.5" fill="#4a5568" font-family="monospace">  "done": false,</text><text x="34" y="210" font-size="9.5" fill="#4a5568" font-family="monospace">  "priority": "high"</text><text x="34" y="224" font-size="9.5" fill="#4a5568" font-family="monospace">}</text><line x1="174" y1="175" x2="216" y2="175" stroke="#a0aec0" stroke-width="1.8" /><polygon points="216 175 207 171 207 179" fill="#a0aec0" /><rect x="220" y="112" width="190" height="126" rx="12" fill="#e6fffa" stroke="#319795" stroke-width="2" /><text x="315" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#234e52">Task(BaseModel)</text><rect x="234" y="142" width="162" height="86" rx="6" fill="#ffffff" stroke="#b2f5ea" /><text x="244" y="160" font-size="10" fill="#2d3748" font-family="monospace">title: str</text><text x="244" y="178" font-size="10" fill="#2d3748" font-family="monospace">done: bool = False</text><text x="244" y="196" font-size="10" fill="#2d3748" font-family="monospace">priority: str =</text><text x="244" y="210" font-size="10" fill="#2d3748" font-family="monospace">  "medium"</text><text x="315" y="224" text-anchor="middle" font-size="8.5" fill="#718096">checks types &amp; required fields</text><line x1="410" y1="150" x2="456" y2="110" stroke="#48bb78" stroke-width="1.8" /><polygon points="456 110 447 112 451 119" fill="#48bb78" /><line x1="410" y1="205" x2="456" y2="250" stroke="#e53e3e" stroke-width="1.8" /><polygon points="456 250 447 241 451 249" fill="#e53e3e" /><rect x="456" y="84" width="160" height="58" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="466" y="104" font-size="11" font-weight="700" fill="#276749">valid → your code</text><text x="466" y="121" font-size="9" fill="#2f855a">a typed Task object,</text><text x="466" y="133" font-size="9" fill="#2f855a">ready to use</text><rect x="456" y="222" width="160" height="58" rx="8" fill="#fff5f5" stroke="#e53e3e" /><text x="466" y="242" font-size="11" font-weight="700" fill="#c53030">invalid → 422</text><text x="466" y="259" font-size="9" fill="#9b2c2c">clear error, before</text><text x="466" y="271" font-size="9" fill="#9b2c2c">your code runs</text><text x="320" y="324" text-anchor="middle" font-size="11" fill="#718096">Declare the shape once; FastAPI parses valid JSON into a typed object and rejects bad input with a 422 automatically.</text></svg>