<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="350" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">A Task model can contain a list of Subtask models</text><rect x="40" y="66" width="260" height="196" rx="12" fill="#e6fffa" stroke="#319795" stroke-width="2" /><text x="170" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#234e52">Task(BaseModel)</text><rect x="54" y="102" width="232" height="26" rx="5" fill="#ffffff" stroke="#b2f5ea" /><text x="64" y="120" font-size="10.5" font-family="monospace" fill="#2d3748">title: str</text><rect x="54" y="132" width="232" height="26" rx="5" fill="#ffffff" stroke="#b2f5ea" /><text x="64" y="150" font-size="10.5" font-family="monospace" fill="#2d3748">tags: list[str] = []</text><rect x="54" y="162" width="232" height="26" rx="5" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5" /><text x="64" y="180" font-size="10.5" font-family="monospace" font-weight="700" fill="#9c4221">subtasks: list[Subtask] = []</text><rect x="54" y="192" width="232" height="26" rx="5" fill="#ffffff" stroke="#b2f5ea" /><text x="64" y="210" font-size="10.5" font-family="monospace" fill="#2d3748">due: datetime | None</text><line x1="286" y1="175" x2="366" y2="150" stroke="#dd6b20" stroke-width="1.8" /><polygon points="366 150 356 149 359 157" fill="#dd6b20" /><text x="326" y="115" text-anchor="middle" font-size="9.5" fill="#9c4221">each item</text><text x="326" y="128" text-anchor="middle" font-size="9.5" fill="#9c4221">validated as</text><rect x="370" y="106" width="230" height="112" rx="12" fill="#fffaf0" stroke="#dd6b20" stroke-width="2" /><text x="485" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#9c4221">Subtask(BaseModel)</text><rect x="384" y="140" width="202" height="26" rx="5" fill="#ffffff" stroke="#fbd38d" /><text x="394" y="158" font-size="10.5" font-family="monospace" fill="#2d3748">title: str</text><rect x="384" y="170" width="202" height="26" rx="5" fill="#ffffff" stroke="#fbd38d" /><text x="394" y="188" font-size="10.5" font-family="monospace" fill="#2d3748">done: bool = False</text><text x="320" y="300" text-anchor="middle" font-size="11" fill="#718096">Each item in subtasks is checked as its own Subtask, all the way down &#8212; nesting a model costs you no safety.</text></svg>