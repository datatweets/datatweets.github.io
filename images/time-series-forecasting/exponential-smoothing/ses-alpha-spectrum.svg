<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="280" fill="#ffffff" /><text x="350" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Where a fitted alpha lands tells you what the model found</text><line x1="80" y1="140" x2="620" y2="140" stroke="#a0aec0" stroke-width="2" /><text x="80" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">alpha = 0</text><text x="620" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">alpha = 1</text><circle cx="90" cy="140" r="7" fill="#48bb78" /><rect x="30" y="60" width="180" height="56" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="120" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">pure noise toy series</text><text x="120" y="96" text-anchor="middle" font-size="8.5" fill="#2f855a">alpha = 0.0 (fitted)</text><text x="120" y="109" text-anchor="middle" font-size="8.5" fill="#2f855a">trust history, ignore latest point</text><line x1="120" y1="116" x2="98" y2="134" stroke="#48bb78" stroke-width="1.3" stroke-dasharray="3 2" /><circle cx="350" cy="140" r="7" fill="#4299e1" /><rect x="260" y="180" width="180" height="56" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="350" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">drifting toy series</text><text x="350" y="216" text-anchor="middle" font-size="8.5" fill="#2c5282">alpha = 0.5513 (fitted)</text><text x="350" y="229" text-anchor="middle" font-size="8.5" fill="#2c5282">splits history and the latest point</text><line x1="350" y1="180" x2="350" y2="148" stroke="#4299e1" stroke-width="1.3" stroke-dasharray="3 2" /><circle cx="610" cy="140" r="7" fill="#ed8936" /><rect x="470" y="60" width="200" height="70" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" /><text x="570" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621">Cyclepath (real series)</text><text x="570" y="96" text-anchor="middle" font-size="8.5" fill="#9c4221">alpha = 1.0 (fitted)</text><text x="570" y="109" text-anchor="middle" font-size="8.5" fill="#9c4221">trust only the latest point —</text><text x="570" y="121" text-anchor="middle" font-size="8.5" font-weight="700" fill="#9c4221">this is the naive forecast</text><line x1="570" y1="130" x2="605" y2="136" stroke="#ed8936" stroke-width="1.3" stroke-dasharray="3 2" /><rect x="90" y="248" width="520" height="24" rx="7" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" /><text x="350" y="264" text-anchor="middle" font-size="9" font-weight="700" fill="#4a5568">A level-only model with no trend term has nowhere else to go but alpha = 1</text></svg>