<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="320" fill="#ffffff" /><text x="350" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a202c">Five models, two scores each</text><text x="130" y="52" font-size="9.5" font-weight="700" fill="#4a5568">model</text><text x="380" y="52" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4a5568">AIC</text><text x="520" y="52" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4a5568">test MAPE</text><line x1="70" y1="60" x2="640" y2="60" stroke="#a0aec0" stroke-width="1.2" /><rect x="70" y="66" width="570" height="36" fill="#f7fafc" /><text x="90" y="89" font-size="10" font-weight="700" fill="#4a5568">SES</text><text x="380" y="89" text-anchor="middle" font-size="10" fill="#4a5568">1199.74</text><text x="520" y="89" text-anchor="middle" font-size="10" fill="#4a5568">18.99%</text><rect x="70" y="102" width="570" height="40" fill="#fff5f5" stroke="#fc8181" stroke-width="1.4" /><text x="90" y="127" font-size="10" font-weight="700" fill="#c53030">Holt (trend, no season)</text><text x="380" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">1147.01 ▼ better</text><text x="520" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#c53030">59.93% ▲ far worse</text><text x="380" y="136" text-anchor="middle" font-size="7.5" fill="#9b2c2c">AIC says better…</text><text x="520" y="136" text-anchor="middle" font-size="7.5" fill="#9b2c2c">…MAPE says far worse</text><rect x="70" y="142" width="570" height="36" fill="#f0fff4" stroke="#48bb78" stroke-width="1.2" /><text x="90" y="165" font-size="10" font-weight="700" fill="#276749">HW additive</text><text x="380" y="165" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">960.57 ★ best</text><text x="520" y="165" text-anchor="middle" font-size="10" fill="#276749">1.57%</text><rect x="70" y="178" width="570" height="36" fill="#f7fafc" /><text x="90" y="201" font-size="10" font-weight="700" fill="#4a5568">HW multiplicative</text><text x="380" y="201" text-anchor="middle" font-size="10" fill="#4a5568">1028.83</text><text x="520" y="201" text-anchor="middle" font-size="10" fill="#4a5568">1.32% (best MAPE)</text><rect x="70" y="214" width="570" height="36" fill="#f7fafc" /><text x="90" y="237" font-size="10" font-weight="700" fill="#4a5568">HW damped additive</text><text x="380" y="237" text-anchor="middle" font-size="10" fill="#4a5568">980.10</text><text x="520" y="237" text-anchor="middle" font-size="10" fill="#4a5568">1.47%</text><line x1="70" y1="250" x2="640" y2="250" stroke="#a0aec0" stroke-width="1.2" /><rect x="90" y="264" width="520" height="42" rx="7" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" /><text x="350" y="282" text-anchor="middle" font-size="9" font-weight="700" fill="#4a5568">Holt's row is the clearest AIC-versus-accuracy contradiction in the course</text><text x="350" y="296" text-anchor="middle" font-size="8.5" fill="#718096">All three Holt-Winters variants beat the baseline; additive wins AIC and matches known structure</text></svg>