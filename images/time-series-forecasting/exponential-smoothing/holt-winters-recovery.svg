<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="320" fill="#ffffff" /><text x="350" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#1a202c">Two methods, one answer: decomposition vs Holt-Winters</text><text x="130" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">trend recovered</text><rect x="40" y="60" width="180" height="30" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.2" /><text x="130" y="80" text-anchor="middle" font-size="9" fill="#2b6cb0">Module 2 decomposition: 8,946 → 17,413</text><rect x="40" y="96" width="180" height="30" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="1.2" /><text x="130" y="116" text-anchor="middle" font-size="9" fill="#c05621">Holt-Winters: level 8,973.8, slope 89.4/mo</text><line x1="245" y1="55" x2="245" y2="290" stroke="#e2e8f0" stroke-width="1.4" /><text x="470" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">seasonal shape recovered (by month)</text><line x1="270" y1="150" x2="650" y2="150" stroke="#a0aec0" stroke-width="1.2" /><g fill="#4299e1"><rect x="278" y="150" width="8" height="45" /><rect x="308" y="150" width="8" height="36.5" /><rect x="338" y="150" width="8" height="21.3" /><rect x="368" y="148.9" width="8" height="1.1" /><rect x="398" y="128.5" width="8" height="21.5" /><rect x="428" y="112.7" width="8" height="37.3" /><rect x="458" y="106.2" width="8" height="43.8" /><rect x="488" y="114.7" width="8" height="35.3" /><rect x="518" y="128.6" width="8" height="21.4" /><rect x="548" y="150" width="8" height="1" /><rect x="578" y="150" width="8" height="20.5" /><rect x="608" y="150" width="8" height="35.9" /></g><g fill="#ed8936"><rect x="288" y="150" width="8" height="44.3" /><rect x="318" y="150" width="8" height="37.8" /><rect x="348" y="150" width="8" height="20.7" /><rect x="378" y="148.6" width="8" height="1.4" /><rect x="408" y="130.4" width="8" height="19.6" /><rect x="438" y="114.3" width="8" height="35.7" /><rect x="468" y="106.7" width="8" height="43.3" /><rect x="498" y="115.1" width="8" height="34.9" /><rect x="528" y="129" width="8" height="21" /><rect x="558" y="150" width="8" height="1.5" /><rect x="588" y="150" width="8" height="20.9" /><rect x="618" y="150" width="8" height="36.2" /></g><text x="470" y="210" text-anchor="middle" font-size="8" fill="#718096">Jan • Feb • Mar • Apr • May • Jun • Jul • Aug • Sep • Oct • Nov • Dec</text><rect x="270" y="230" width="14" height="10" fill="#4299e1" /><text x="290" y="239" font-size="8.5" fill="#4a5568">classical decomposition (Module 2)</text><rect x="470" y="230" width="14" height="10" fill="#ed8936" /><text x="490" y="239" font-size="8.5" fill="#4a5568">Holt-Winters</text><rect x="90" y="270" width="520" height="34" rx="7" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" /><text x="350" y="286" text-anchor="middle" font-size="9" font-weight="700" fill="#4a5568">July peak +3,307 vs +3,275 • January trough -3,400 vs -3,348</text><text x="350" y="299" text-anchor="middle" font-size="8.5" fill="#718096">Two independent methods land on nearly the same trend and seasonal shape</text></svg>