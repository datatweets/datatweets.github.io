<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="320" fill="#ffffff" /><text x="350" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#1a202c">Test-set MAPE, every model in the course</text><text x="180" y="58" font-size="10" font-weight="700" fill="#4a5568">naive (Module 1)</text><rect x="190" y="46" width="380" height="20" fill="#fc8181" /><text x="578" y="61" font-size="10" font-weight="700" fill="#c53030">19.0%</text><text x="180" y="90" font-size="10" font-weight="700" fill="#4a5568" text-anchor="end">best non-seasonal ARIMA (Module 5)</text><rect x="190" y="78" width="320" height="20" fill="#fbd38d" /><text x="518" y="93" font-size="10" font-weight="700" fill="#c05621">16.0%</text><text x="180" y="122" font-size="10" font-weight="700" fill="#4a5568" text-anchor="end">seasonal-naive baseline (Module 1)</text><rect x="190" y="110" width="118" height="20" fill="#f6e05e" /><text x="316" y="125" font-size="10" font-weight="700" fill="#975a16">5.9%</text><line x1="308" y1="105" x2="308" y2="260" stroke="#975a16" stroke-width="1.4" stroke-dasharray="4 3" /><text x="308" y="270" text-anchor="middle" font-size="8" fill="#975a16">the bar to beat</text><text x="180" y="154" font-size="10" font-weight="700" fill="#4a5568" text-anchor="end">Holt-Winters (Module 7)</text><rect x="190" y="142" width="31" height="20" fill="#90cdf4" /><text x="229" y="157" font-size="10" font-weight="700" fill="#2b6cb0">1.57%</text><text x="350" y="157" font-size="8.5" fill="#2b6cb0">3.76x better than the bar</text><text x="180" y="186" font-size="10" font-weight="700" fill="#4a5568" text-anchor="end">SARIMA (Module 6)</text><rect x="190" y="174" width="21" height="20" fill="#48bb78" /><text x="219" y="189" font-size="10" font-weight="700" fill="#276749">1.06%</text><text x="350" y="189" font-size="8.5" font-weight="700" fill="#276749">★ best model in the course</text><rect x="90" y="228" width="520" height="50" rx="7" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" /><text x="350" y="248" text-anchor="middle" font-size="9" font-weight="700" fill="#4a5568">Two different classical families, Holt-Winters and SARIMA, both clear the seasonal-naive bar decisively</text><text x="350" y="264" text-anchor="middle" font-size="8.5" fill="#718096">SARIMA is the more accurate of the two here, but the gap between them is small next to what precedes them</text></svg>