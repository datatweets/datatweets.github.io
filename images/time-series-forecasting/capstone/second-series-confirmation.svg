<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="300" fill="#ffffff" /><text x="350" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">The same pattern, on a completely different series</text><text x="185" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">Cyclepath (Module 8)</text><text x="185" y="70" text-anchor="middle" font-size="8.5" fill="#718096">single split: SARIMA 1.06% wins</text><line x1="80" y1="200" x2="290" y2="200" stroke="#a0aec0" stroke-width="1" /><rect x="100" y="150" width="45" height="50" fill="#fbd38d" /><text x="122" y="144" text-anchor="middle" font-size="8.5" fill="#c05621">SARIMA</text><text x="122" y="214" text-anchor="middle" font-size="8" fill="#c05621">bt mean 2.14%</text><rect x="200" y="163" width="45" height="37" fill="#48bb78" /><text x="222" y="157" text-anchor="middle" font-size="8.5" font-weight="700" fill="#276749">Holt-Winters</text><text x="222" y="214" text-anchor="middle" font-size="8" font-weight="700" fill="#276749">bt mean 1.59% ★</text><line x1="350" y1="40" x2="350" y2="260" stroke="#e2e8f0" stroke-width="1.4" /><text x="515" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">Lantern &amp; Vine (Module 9)</text><text x="515" y="70" text-anchor="middle" font-size="8.5" fill="#718096">single split: SARIMA 3.74% wins</text><line x1="410" y1="200" x2="620" y2="200" stroke="#a0aec0" stroke-width="1" /><rect x="430" y="140" width="45" height="60" fill="#fbd38d" /><text x="452" y="134" text-anchor="middle" font-size="8.5" fill="#c05621">SARIMA</text><text x="452" y="214" text-anchor="middle" font-size="8" fill="#c05621">bt mean 4.39%</text><rect x="530" y="153" width="45" height="47" fill="#48bb78" /><text x="552" y="147" text-anchor="middle" font-size="8.5" font-weight="700" fill="#276749">Holt-Winters</text><text x="552" y="214" text-anchor="middle" font-size="8" font-weight="700" fill="#276749">bt mean 3.76% ★</text><rect x="90" y="240" width="520" height="46" rx="7" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" /><text x="350" y="258" text-anchor="middle" font-size="9" font-weight="700" fill="#4a5568">Both series: a single split narrowly favors SARIMA</text><text x="350" y="273" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">Both series: a proper 6-origin backtest favors Holt-Winters instead</text></svg>