<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="320" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Time series: the order IS the information</text><line x1="70" y1="210" x2="640" y2="210" stroke="#a0aec0" stroke-width="1.4" /><line x1="70" y1="60" x2="70" y2="210" stroke="#a0aec0" stroke-width="1.4" /><text x="355" y="230" text-anchor="middle" font-size="9.5" fill="#4a5568">time (months) →</text><text x="46" y="135" text-anchor="middle" font-size="9.5" fill="#4a5568" transform="rotate(-90 46 135)">rides</text><polyline points="80 185 100 170 120 150 140 140 160 155 180 175 200 165 220 145 240 120 260 110 280 128 300 150 320 138 340 118 360 95 380 85 400 102 420 124 440 110 460 90 480 68 500 60 520 78 540 100" fill="none" stroke="#4299e1" stroke-width="2.4" /><line x1="90" y1="182" x2="545" y2="88" stroke="#48bb78" stroke-width="1.6" stroke-dasharray="6 4" /><text x="470" y="150" font-size="9.5" font-weight="700" fill="#276749">trend (grows over time)</text><path d="M300 150Q340 90 380 150" fill="none" stroke="#ed8936" stroke-width="1.3" /><text x="340" y="176" text-anchor="middle" font-size="9" font-weight="700" fill="#c05621">seasonality (repeats yearly)</text><rect x="70" y="252" width="180" height="56" rx="9" fill="#fff5f5" stroke="#fc8181" stroke-width="1.3" /><text x="160" y="272" text-anchor="middle" font-size="10" font-weight="700" fill="#c53030">Can't shuffle</text><text x="160" y="288" text-anchor="middle" font-size="8" fill="#9b2c2c">reordering destroys the pattern</text><text x="160" y="300" text-anchor="middle" font-size="8" fill="#9b2c2c">— order carries meaning</text><rect x="260" y="252" width="180" height="56" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.3" /><text x="350" y="272" text-anchor="middle" font-size="10" font-weight="700" fill="#6b46c1">Autocorrelated</text><text x="350" y="288" text-anchor="middle" font-size="8" fill="#805ad5">each value depends on the</text><text x="350" y="300" text-anchor="middle" font-size="8" fill="#805ad5">ones just before it</text><rect x="450" y="252" width="180" height="56" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" /><text x="540" y="272" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">Split by time</text><text x="540" y="288" text-anchor="middle" font-size="8" fill="#3182ce">random CV leaks the future</text><text x="540" y="300" text-anchor="middle" font-size="8" fill="#3182ce">— train on past, test on future</text></svg>