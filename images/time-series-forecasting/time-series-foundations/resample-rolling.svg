<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="300" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Two ways to reshape a series in pandas</text><text x="185" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Resample: change the frequency</text><g fill="#90cdf4"><rect x="60" y="110" width="12" height="30" /><rect x="74" y="105" width="12" height="35" /><rect x="88" y="98" width="12" height="42" /><rect x="102" y="92" width="12" height="48" /><rect x="116" y="88" width="12" height="52" /><rect x="130" y="90" width="12" height="50" /><rect x="144" y="95" width="12" height="45" /><rect x="158" y="100" width="12" height="40" /><rect x="172" y="108" width="12" height="32" /><rect x="186" y="114" width="12" height="26" /><rect x="200" y="118" width="12" height="22" /><rect x="214" y="112" width="12" height="28" /></g><text x="143" y="156" text-anchor="middle" font-size="8" fill="#718096">12 monthly values</text><line x1="235" y1="120" x2="265" y2="120" stroke="#4299e1" stroke-width="2" /><polygon points="265 120 255 115 255 125" fill="#4299e1" /><text x="250" y="112" text-anchor="middle" font-size="7.5" fill="#3182ce">.resample("YS").sum()</text><rect x="278" y="80" width="34" height="60" fill="#4299e1" /><text x="295" y="156" text-anchor="middle" font-size="8" fill="#718096">1 yearly total</text><line x1="350" y1="70" x2="350" y2="230" stroke="#e2e8f0" stroke-width="1.5" /><text x="520" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Rolling: a sliding window</text><polyline points="400 150 420 140 440 120 460 128 480 105 500 112 520 92 540 100 560 80 580 88 600 70 620 78" fill="none" stroke="#cbd5e0" stroke-width="2" /><polyline points="400 145 420 138 440 128 460 124 480 116 500 110 520 102 540 96 560 90 580 84 600 78 620 74" fill="none" stroke="#48bb78" stroke-width="2.6" /><rect x="452" y="70" width="76" height="95" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" opacity="0.5" /><text x="490" y="182" text-anchor="middle" font-size="7.5" fill="#276749">.rolling(12).mean()</text><text x="510" y="198" text-anchor="middle" font-size="8" fill="#718096">averages each window → smooths seasonality, shows the trend</text><rect x="120" y="250" width="460" height="38" rx="9" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.2" /><text x="350" y="266" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4a5568">Resampling aggregates to a coarser calendar; rolling smooths at the same frequency.</text><text x="350" y="281" text-anchor="middle" font-size="8.5" fill="#718096">Both rely on the DatetimeIndex — pandas knows what "a year" or "12 months" means.</text></svg>