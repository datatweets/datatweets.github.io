<svg xmlns="http://www.w3.org/2000/svg" width="764" height="200" viewBox="0 0 764 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="764" height="200" fill="#ffffff" /><defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a0aec0" /></marker></defs><text x="382" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The Module 1 pipeline, stage by stage</text><rect x="16" y="60" width="132" height="96" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="82" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">1. Generate</text><text x="82" y="110" text-anchor="middle" font-size="8.5" fill="#4a5568">cyclepath():</text><text x="82" y="123" text-anchor="middle" font-size="8.5" fill="#4a5568">96 months, seeded</text><rect x="166" y="60" width="132" height="96" rx="10" fill="#e6fffa" stroke="#38b2ac" stroke-width="1.4" /><text x="232" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#285e61">2. Explore</text><text x="232" y="110" text-anchor="middle" font-size="8.5" fill="#4a5568">stats, resample,</text><text x="232" y="123" text-anchor="middle" font-size="8.5" fill="#4a5568">12-month rolling mean</text><rect x="316" y="60" width="132" height="96" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="382" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">3. Split</text><text x="382" y="110" text-anchor="middle" font-size="8.5" fill="#4a5568">hold out the last</text><text x="382" y="123" text-anchor="middle" font-size="8.5" fill="#4a5568">12 months, no shuffle</text><rect x="466" y="60" width="132" height="96" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" /><text x="532" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">4. Baseline</text><text x="532" y="110" text-anchor="middle" font-size="8.5" fill="#4a5568">naive and</text><text x="532" y="123" text-anchor="middle" font-size="8.5" fill="#4a5568">seasonal-naive</text><rect x="616" y="60" width="132" height="96" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="682" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">5. Takeaway</text><text x="682" y="110" text-anchor="middle" font-size="8.5" fill="#4a5568">seasonal-naive 5.9%</text><text x="682" y="123" text-anchor="middle" font-size="8.5" fill="#4a5568">MAPE: the target</text><path d="M150 108 L164 108" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arw)" /><path d="M300 108 L314 108" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arw)" /><path d="M450 108 L464 108" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arw)" /><path d="M600 108 L614 108" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arw)" /><text x="382" y="182" text-anchor="middle" font-size="9.5" fill="#718096">Each stage reuses a tool from an earlier lesson; the last one sets the number every later model must beat.</text></svg>
