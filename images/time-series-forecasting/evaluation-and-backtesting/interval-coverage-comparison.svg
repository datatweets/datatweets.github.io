<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="260" fill="#ffffff" /><text x="350" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">36 backtested forecasts, one dot each</text><text x="70" y="56" font-size="10.5" font-weight="700" fill="#276749">SARIMA, 95% interval — 100% coverage, width ≈ 2,145</text><g fill="#48bb78"><circle cx="76" cy="76" r="6" /><circle cx="92" cy="76" r="6" /><circle cx="108" cy="76" r="6" /><circle cx="124" cy="76" r="6" /><circle cx="140" cy="76" r="6" /><circle cx="156" cy="76" r="6" /><circle cx="182" cy="76" r="6" /><circle cx="198" cy="76" r="6" /><circle cx="214" cy="76" r="6" /><circle cx="230" cy="76" r="6" /><circle cx="246" cy="76" r="6" /><circle cx="262" cy="76" r="6" /><circle cx="288" cy="76" r="6" /><circle cx="304" cy="76" r="6" /><circle cx="320" cy="76" r="6" /><circle cx="336" cy="76" r="6" /><circle cx="352" cy="76" r="6" /><circle cx="368" cy="76" r="6" /><circle cx="394" cy="76" r="6" /><circle cx="410" cy="76" r="6" /><circle cx="426" cy="76" r="6" /><circle cx="442" cy="76" r="6" /><circle cx="458" cy="76" r="6" /><circle cx="474" cy="76" r="6" /><circle cx="500" cy="76" r="6" /><circle cx="516" cy="76" r="6" /><circle cx="532" cy="76" r="6" /><circle cx="548" cy="76" r="6" /><circle cx="564" cy="76" r="6" /><circle cx="580" cy="76" r="6" /><circle cx="606" cy="76" r="6" /><circle cx="622" cy="76" r="6" /></g><g fill="#48bb78"><circle cx="638" cy="76" r="6" /><circle cx="654" cy="76" r="6" /><circle cx="670" cy="76" r="6" /><circle cx="686" cy="76" r="6" /></g><text x="70" y="132" font-size="10.5" font-weight="700" fill="#c53030">random walk with drift, 95% interval — 83.3% coverage, width ≈ 8,743</text><g fill="#48bb78"><circle cx="76" cy="152" r="6" /><circle cx="92" cy="152" r="6" /><circle cx="108" cy="152" r="6" /><circle cx="124" cy="152" r="6" /><circle cx="140" cy="152" r="6" /><circle cx="156" cy="152" r="6" /></g><g fill="#48bb78"><circle cx="182" cy="152" r="6" /><circle cx="198" cy="152" r="6" /><circle cx="214" cy="152" r="6" /><circle cx="230" cy="152" r="6" /></g><g fill="#e53e3e"><circle cx="246" cy="152" r="6" /><circle cx="262" cy="152" r="6" /></g><g fill="#48bb78"><circle cx="288" cy="152" r="6" /><circle cx="304" cy="152" r="6" /><circle cx="320" cy="152" r="6" /><circle cx="336" cy="152" r="6" /><circle cx="352" cy="152" r="6" /></g><g fill="#e53e3e"><circle cx="368" cy="152" r="6" /></g><g fill="#48bb78"><circle cx="394" cy="152" r="6" /><circle cx="410" cy="152" r="6" /><circle cx="426" cy="152" r="6" /><circle cx="442" cy="152" r="6" /><circle cx="458" cy="152" r="6" /></g><g fill="#e53e3e"><circle cx="474" cy="152" r="6" /></g><g fill="#48bb78"><circle cx="500" cy="152" r="6" /><circle cx="516" cy="152" r="6" /><circle cx="532" cy="152" r="6" /><circle cx="548" cy="152" r="6" /><circle cx="564" cy="152" r="6" /><circle cx="580" cy="152" r="6" /></g><g fill="#48bb78"><circle cx="606" cy="152" r="6" /><circle cx="622" cy="152" r="6" /><circle cx="638" cy="152" r="6" /><circle cx="654" cy="152" r="6" /></g><g fill="#e53e3e"><circle cx="670" cy="152" r="6" /><circle cx="686" cy="152" r="6" /></g><rect x="90" y="188" width="520" height="46" rx="7" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" /><text x="350" y="206" text-anchor="middle" font-size="9" font-weight="700" fill="#4a5568">SARIMA's stated 95% confidence covers every single forecast</text><text x="350" y="222" text-anchor="middle" font-size="9" fill="#718096">The wider random-walk interval still misses 6 of 36 — width alone does not guarantee coverage</text></svg>