<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="300" fill="#ffffff" /><text x="350" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#1a202c">The ranking flips once you test more than once</text><text x="175" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">single split (Modules 6 &amp; 7)</text><line x1="90" y1="220" x2="260" y2="220" stroke="#a0aec0" stroke-width="1.2" /><rect x="105" y="180" width="50" height="40" fill="#48bb78" /><text x="130" y="173" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">SARIMA</text><text x="130" y="234" text-anchor="middle" font-size="9" fill="#276749">1.06%</text><text x="130" y="246" text-anchor="middle" font-size="8" font-weight="700" fill="#276749">★ winner</text><rect x="195" y="160" width="50" height="60" fill="#fbd38d" /><text x="220" y="153" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621">Holt-Winters</text><text x="220" y="234" text-anchor="middle" font-size="9" fill="#c05621">1.57%</text><line x1="290" y1="150" x2="390" y2="150" stroke="#a0aec0" stroke-width="2" /><polygon points="390 150 378 144 378 156" fill="#a0aec0" /><text x="340" y="138" text-anchor="middle" font-size="9" font-weight="700" fill="#4a5568">the ranking flips</text><text x="530" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">backtested across 6 origins (Module 8)</text><line x1="440" y1="220" x2="620" y2="220" stroke="#a0aec0" stroke-width="1.2" /><rect x="455" y="163" width="50" height="57" fill="#fbd38d" /><line x1="480" y1="163" x2="480" y2="140" stroke="#c05621" stroke-width="1.6" /><line x1="472" y1="140" x2="488" y2="140" stroke="#c05621" stroke-width="1.6" /><text x="480" y="153" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621">SARIMA</text><text x="480" y="234" text-anchor="middle" font-size="9" fill="#c05621">mean 2.14% (std 1.11)</text><rect x="545" y="182" width="50" height="38" fill="#48bb78" /><line x1="570" y1="182" x2="570" y2="174" stroke="#276749" stroke-width="1.6" /><line x1="565" y1="174" x2="575" y2="174" stroke="#276749" stroke-width="1.6" /><text x="570" y="167" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">Holt-Winters</text><text x="570" y="234" text-anchor="middle" font-size="9" fill="#276749">mean 1.59% (std 0.53)</text><text x="570" y="246" text-anchor="middle" font-size="8" font-weight="700" fill="#276749">★ winner, more stable</text><rect x="90" y="264" width="530" height="26" rx="7" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" /><text x="355" y="281" text-anchor="middle" font-size="9" font-weight="700" fill="#4a5568">A single lucky split favored SARIMA; six origins reveal Holt-Winters is the steadier, more accurate choice</text></svg>