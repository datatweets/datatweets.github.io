<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="300" fill="#ffffff" /><text x="350" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Reading the ADF test</text><rect x="270" y="46" width="160" height="34" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="350" y="67" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">Run adfuller(y)</text><line x1="350" y1="80" x2="350" y2="105" stroke="#a0aec0" stroke-width="1.4" /><polygon points="350 105 320 130 350 155 380 130" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.4" /><text x="350" y="126" text-anchor="middle" font-size="9" font-weight="700" fill="#4a5568">p-value</text><text x="350" y="139" text-anchor="middle" font-size="9" font-weight="700" fill="#4a5568">&lt; 0.05?</text><line x1="320" y1="130" x2="180" y2="130" stroke="#a0aec0" stroke-width="1.4" /><text x="248" y="122" text-anchor="middle" font-size="8.5" fill="#718096">No</text><line x1="180" y1="130" x2="180" y2="180" stroke="#a0aec0" stroke-width="1.4" /><rect x="70" y="180" width="220" height="60" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.4" /><text x="180" y="202" text-anchor="middle" font-size="10" font-weight="700" fill="#c53030">Fail to reject H0</text><text x="180" y="216" text-anchor="middle" font-size="9" fill="#9b2c2c">series is non-stationary</text><text x="180" y="231" text-anchor="middle" font-size="8.5" fill="#9b2c2c">Cyclepath: ADF -0.920, p 0.7815</text><line x1="380" y1="130" x2="520" y2="130" stroke="#a0aec0" stroke-width="1.4" /><text x="452" y="122" text-anchor="middle" font-size="8.5" fill="#718096">Yes</text><line x1="520" y1="130" x2="520" y2="180" stroke="#a0aec0" stroke-width="1.4" /><rect x="410" y="180" width="220" height="60" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="520" y="202" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">Reject H0</text><text x="520" y="216" text-anchor="middle" font-size="9" fill="#2f855a">series is stationary</text><text x="520" y="231" text-anchor="middle" font-size="8.5" fill="#2f855a">e.g. seasonally differenced Cyclepath</text><rect x="150" y="258" width="400" height="28" rx="7" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" /><text x="350" y="277" text-anchor="middle" font-size="9" font-weight="700" fill="#4a5568">H0: the series has a unit root (is non-stationary)</text></svg>