ddle" font-size="9.5" font-weight="700" fill="#276749">preview fit (AIC)</text><rect x="386" y="68" width="126" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0" /><text x="449" y="81" text-anchor="middle" font-size="7.5" fill="#4a5568">A: AIC 1404.62</text><rect x="386" y="90" width="126" height="18" rx="4" fill="#f0fff4" stroke="#48bb78" stroke-width="1.3" /><text x="449" y="103" text-anchor="middle" font-size="7.5" font-weight="700" fill="#276749">B: AIC 1123.93 ★</text><rect x="386" y="112" width="126" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0" /><text x="449" y="125" text-anchor="middle" font-size="7.5" fill="#4a5568">C: AIC 1174.71</text><path d="M524 90L552 90" stroke="#a0aec0" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="556" y="50" width="124" height="80" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.4" /><text x="618" y="70" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">Ljung-Box check</text><text x="618" y="88" text-anchor="middle" font-size="8" fill="#9b2c2c">p = 0.000012</text><text x="618" y="104" text-anchor="middle" font-size="7.5" fill="#9b2c2c">residuals still</text><text x="618" y="116" text-anchor="middle" font-size="7.5" fill="#9b2c2c">significant — not</text><text x="618" y="128" text-anchor="middle" font-size="7.5" fill="#9b2c2c">finished yet</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#a0aec0" /></marker></defs><rect x="110" y="220" width="480" height="46" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" /><text x="350" y="240" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4a5568">Regular order (0,0), leading seasonal candidate identified, honest open question flagged</text><text x="350" y="255" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4a5568">→ handed off to Module 5 and 6 for real fitting and refinement</text></svg>