<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="280" fill="#ffffff" /><text x="350" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a202c">ACF includes the chain; PACF strips it out</text><circle cx="580" cy="140" r="9" fill="#2d3748" /><text x="580" y="168" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">y_t</text><circle cx="350" cy="140" r="9" fill="#2d3748" /><text x="350" y="168" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">y_t-1</text><circle cx="120" cy="140" r="9" fill="#2d3748" /><text x="120" y="168" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">y_t-2</text><path d="M120 131Q350 30 580 131" fill="none" stroke="#4299e1" stroke-width="2.2" /><text x="350" y="55" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">ACF lag 2</text><text x="350" y="70" text-anchor="middle" font-size="8.5" fill="#3182ce">total relationship — direct plus indirect</text><line x1="129" y1="140" x2="341" y2="140" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="5 4" /><line x1="359" y1="140" x2="571" y2="140" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="5 4" /><path d="M120 149Q350 250 580 149" fill="none" stroke="#48bb78" stroke-width="2.2" /><text x="350" y="238" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">PACF lag 2</text><g opacity="0.55"><line x1="300" y1="128" x2="400" y2="152" stroke="#e53e3e" stroke-width="2.4" /><line x1="300" y1="152" x2="400" y2="128" stroke="#e53e3e" stroke-width="2.4" /></g><text x="350" y="112" text-anchor="middle" font-size="8" fill="#c53030">indirect path through y_t-1 removed</text><rect x="130" y="196" width="440" height="46" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" /><text x="350" y="216" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4a5568">ACF: how related are y_t and y_t-2, including any echo through y_t-1?</text><text x="350" y="232" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4a5568">PACF: how related are they directly, once that echo is subtracted out?</text></svg>