<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="360" fill="#ffffff" /><text x="350" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">A series is three signals stacked together</text><text x="70" y="50" font-size="10.5" font-weight="700" fill="#2d3748">observed</text><line x1="70" y1="90" x2="640" y2="90" stroke="#e2e8f0" stroke-width="1" /><polyline points="70 80 100 68 130 58 160 62 190 72 220 80 250 66 280 52 310 44 340 50 370 60 400 68 430 54 460 40 490 32 520 38 550 48 580 56 610 42 640 28" fill="none" stroke="#4299e1" stroke-width="2.2" /><text x="70" y="122" font-size="10.5" font-weight="700" fill="#276749">trend</text><line x1="70" y1="162" x2="640" y2="162" stroke="#e2e8f0" stroke-width="1" /><polyline points="70 152 130 140 190 130 250 120 310 110 370 100 430 90 490 80 550 70 610 60 640 55" fill="none" stroke="#48bb78" stroke-width="2.4" stroke-dasharray="0" /><text x="580" y="150" font-size="8" fill="#718096">smooth, no wiggle</text><text x="70" y="194" font-size="10.5" font-weight="700" fill="#c05621">seasonal</text><line x1="70" y1="234" x2="640" y2="234" stroke="#e2e8f0" stroke-width="1" /><polyline points="70 224 100 206 130 198 160 206 190 224 220 242 250 224 280 206 310 198 340 206 370 224 400 242 430 224 460 206 490 198 520 206 550 224 580 242 610 224 640 206" fill="none" stroke="#ed8936" stroke-width="2.2" /><text x="580" y="222" font-size="8" fill="#718096">repeats every cycle, constant height</text><text x="70" y="266" font-size="10.5" font-weight="700" fill="#9b2c2c">residual</text><line x1="70" y1="306" x2="640" y2="306" stroke="#e2e8f0" stroke-width="1" /><polyline points="70 304 85 300 100 308 115 302 130 306 145 298 160 309 175 303 190 300 205 308 220 302 235 305 250 299 265 307 280 303 295 301 310 308 325 300 340 304 355 302 370 308 385 299 400 303 415 306 430 300 445 308 460 301 475 304 490 299 505 307 520 303 535 301 550 308 565 300 580 304 595 306 610 300 625 307 640 302" fill="none" stroke="#fc8181" stroke-width="1.6" /><text x="580" y="294" font-size="8" fill="#718096">no shape left, just noise</text><rect x="90" y="326" width="520" height="26" rx="7" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" /><text x="350" y="343" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4a5568">observed = trend + seasonal + residual (additive) — each row only has the structure its name promises</text></svg>