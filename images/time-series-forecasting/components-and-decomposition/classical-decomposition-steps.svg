<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="380" fill="#ffffff" /><text x="350" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Classical decomposition, four steps</text><line x1="350" y1="42" x2="350" y2="368" stroke="#e2e8f0" stroke-width="1.5" /><line x1="20" y1="205" x2="680" y2="205" stroke="#e2e8f0" stroke-width="1.5" /><text x="185" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">1. Slide a 13-point window</text><polyline points="40 140 60 128 80 118 100 124 120 136 140 148 160 132 180 116 200 108 220 116 240 130 260 142 280 126 300 110 320 120" fill="none" stroke="#90cdf4" stroke-width="2" /><rect x="150" y="95" width="72" height="65" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" opacity="0.65" /><text x="186" y="178" text-anchor="middle" font-size="8" fill="#3182ce">endpoints get half weight — 13 points, 12 months' worth</text><text x="515" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">2. Trend comes out smooth</text><line x1="390" y1="145" x2="650" y2="145" stroke="#e2e8f0" stroke-width="1" /><polyline points="430 150 450 140 470 132 490 124 510 116 530 108 550 100 570 92 590 86" fill="none" stroke="#48bb78" stroke-width="2.4" /><line x1="390" y1="150" x2="430" y2="150" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="3 3" /><line x1="590" y1="86" x2="650" y2="86" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="3 3" /><text x="410" y="168" text-anchor="middle" font-size="7.5" fill="#a0aec0">gap</text><text x="620" y="168" text-anchor="middle" font-size="7.5" fill="#a0aec0">gap</text><text x="515" y="185" text-anchor="middle" font-size="8" fill="#718096">6 months lost at each edge — no full window there</text><text x="185" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">3. Detrend, then average by month</text><polyline points="40 270 60 290 80 300 100 290 120 270 140 255 160 265 180 285 200 298 220 288 240 268 260 252" fill="none" stroke="#fbd38d" stroke-width="2" /><text x="140" y="315" text-anchor="middle" font-size="7.5" fill="#a0aec0">detrended (seasonal + residual)</text><g fill="#ed8936"><rect x="290" y="290" width="8" height="10" /><rect x="300" y="278" width="8" height="22" /><rect x="310" y="266" width="8" height="34" /><rect x="320" y="256" width="8" height="44" /><rect x="330" y="250" width="8" height="50" /><rect x="340" y="256" width="8" height="44" /></g><text x="315" y="315" text-anchor="middle" font-size="7.5" fill="#a0aec0">12 seasonal indices, Jan–Dec</text><text x="515" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#9b2c2c">4. What's left is residual</text><line x1="390" y1="280" x2="650" y2="280" stroke="#e2e8f0" stroke-width="1" /><polyline points="390 278 410 283 430 276 450 282 470 278 490 285 510 277 530 281 550 279 570 284 590 276 610 282 630 278 650 280" fill="none" stroke="#fc8181" stroke-width="1.6" /><text x="515" y="315" text-anchor="middle" font-size="7.5" fill="#a0aec0">unstructured noise, std ≈ 229</text><rect x="90" y="340" width="520" height="30" rx="7" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" /><text x="350" y="359" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4a5568">Built by hand with pandas, this matches statsmodels' seasonal_decompose exactly</text></svg>