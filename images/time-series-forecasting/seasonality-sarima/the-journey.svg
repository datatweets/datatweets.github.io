<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="290" fill="#ffffff" /><text x="350" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a202c">Test-set MAPE across the course: SARIMA finally clears the bar</text><line x1="215" y1="235" x2="655" y2="235" stroke="#a0aec0" stroke-width="1.1" /><text x="215" y="252" text-anchor="middle" font-size="8" fill="#718096">0%</text><text x="435" y="252" text-anchor="middle" font-size="8" fill="#718096">10%</text><text x="655" y="252" text-anchor="middle" font-size="8" fill="#718096">20%</text><line x1="345" y1="55" x2="345" y2="235" stroke="#d69e2e" stroke-width="1.4" stroke-dasharray="5 4" /><text x="345" y="50" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b7791f">the bar to beat: 5.9%</text><text x="205" y="82" text-anchor="end" font-size="9.5" fill="#4a5568">naive (Module 1)</text><rect x="215" y="72" width="418" height="18" fill="#fc8181" /><text x="640" y="86" font-size="9" font-weight="700" fill="#c53030">19.0%</text><text x="205" y="118" text-anchor="end" font-size="9.5" fill="#4a5568">best non-seasonal ARIMA (Mod 5)</text><rect x="215" y="108" width="352" height="18" fill="#f6ad55" /><text x="574" y="122" font-size="9" font-weight="700" fill="#c05621">16.0%</text><text x="205" y="154" text-anchor="end" font-size="9.5" fill="#4a5568">seasonal-naive baseline (Mod 1)</text><rect x="215" y="144" width="130" height="18" fill="#ecc94b" /><text x="352" y="158" font-size="9" font-weight="700" fill="#b7791f">5.9%</text><text x="205" y="190" text-anchor="end" font-size="9.5" font-weight="700" fill="#276749">SARIMA (Module 6)</text><rect x="215" y="180" width="23" height="18" fill="#48bb78" /><text x="245" y="194" font-size="9" font-weight="700" fill="#276749">1.06% ★</text><rect x="150" y="262" width="400" height="22" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1" /><text x="350" y="277" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">First model to beat the baseline — and it does so more than fivefold</text></svg>