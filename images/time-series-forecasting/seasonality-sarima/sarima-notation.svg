<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="300" fill="#ffffff" /><text x="350" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a202c">SARIMA: the same ideas at two scales</text><text x="350" y="82" text-anchor="middle" font-size="30" font-weight="700" fill="#2d3748">SARIMA( <tspan fill="#2b6cb0">p, d, q</tspan> )( <tspan fill="#c05621">P, D, Q</tspan> )[<tspan fill="#276749">s</tspan>]</text><text x="200" y="105" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">non-seasonal (short lags)</text><text x="410" y="105" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621">seasonal (lag s apart)</text><text x="560" y="105" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">season length</text><rect x="45" y="125" width="610" height="120" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" /><line x1="45" y1="152" x2="655" y2="152" stroke="#cbd5e0" stroke-width="1" /><text x="130" y="144" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">non-seasonal</text><text x="290" y="144" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621">seasonal twin</text><text x="510" y="144" text-anchor="middle" font-size="10" font-weight="700" fill="#4a5568">what it means</text><text x="90" y="176" font-size="11" font-weight="700" fill="#2b6cb0">d</text><text x="130" y="176" text-anchor="middle" font-size="9.5" fill="#4a5568">difference vs. last step</text><text x="270" y="176" font-size="11" font-weight="700" fill="#c05621">D</text><text x="510" y="176" text-anchor="middle" font-size="9" fill="#718096">subtract same month last year (y.diff(12))</text><text x="90" y="202" font-size="11" font-weight="700" fill="#2b6cb0">p</text><text x="130" y="202" text-anchor="middle" font-size="9.5" fill="#4a5568">AR on recent values</text><text x="270" y="202" font-size="11" font-weight="700" fill="#c05621">P</text><text x="510" y="202" text-anchor="middle" font-size="9" fill="#718096">this July depends on last July's value</text><text x="90" y="228" font-size="11" font-weight="700" fill="#2b6cb0">q</text><text x="130" y="228" text-anchor="middle" font-size="9.5" fill="#4a5568">MA on recent shocks</text><text x="270" y="228" font-size="11" font-weight="700" fill="#c05621">Q</text><text x="510" y="228" text-anchor="middle" font-size="9" fill="#718096">this July depends on last July's shock</text><path d="M108 172Q190 165 262 172" fill="none" stroke="#ed8936" stroke-width="1" stroke-dasharray="3 2" /><path d="M108 198Q190 191 262 198" fill="none" stroke="#ed8936" stroke-width="1" stroke-dasharray="3 2" /><path d="M108 224Q190 217 262 224" fill="none" stroke="#ed8936" stroke-width="1" stroke-dasharray="3 2" /><text x="350" y="270" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">s = 12 monthly-yearly, 4 quarterly, 7 daily-weekly, 24 hourly-daily</text><text x="350" y="288" text-anchor="middle" font-size="9" fill="#718096">every uppercase term is the lowercase idea, one full cycle apart</text></svg>