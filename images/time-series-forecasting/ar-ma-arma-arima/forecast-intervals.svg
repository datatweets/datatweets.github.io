<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="300" fill="#ffffff" /><text x="350" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#1a202c">ARIMA(1,1,1) forecast: flat mean, fast-fanning uncertainty</text><line x1="70" y1="240" x2="640" y2="240" stroke="#a0aec0" stroke-width="1.1" /><line x1="70" y1="222" x2="640" y2="222" stroke="#fc8181" stroke-width=".9" stroke-dasharray="3 3" /><text x="646" y="225" font-size="8" fill="#c53030">0</text><polygon points="358 136 382 129 406 121 430 113 454 105 478 98 502 90 526 84 550 77 574 71 598 65 622 60 622 237 598 232 574 227 550 222 526 216 502 210 478 203 454 196 430 187 406 178 382 167 358 155" fill="#c6f6d5" opacity="0.55" /><polyline points="70 151 94 145 118 138 142 127 166 119 190 110 214 106 238 110 262 115 286 126 310 135 334 141" fill="none" stroke="#4299e1" stroke-width="2.2" /><text x="180" y="95" font-size="9" fill="#3182ce">training (seasonal)</text><line x1="346" y1="50" x2="346" y2="240" stroke="#e2e8f0" stroke-width="1.2" /><polyline points="334 141 358 145 382 148 406 149 430 150 454 150 478 150 502 150 526 150 550 150 574 149 598 149 622 148" fill="none" stroke="#276749" stroke-width="2.4" /><text x="500" y="165" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">point forecast (nearly flat)</text><text x="360" y="128" font-size="8" fill="#718096">step 1: ~3,200 wide</text><text x="560" y="52" font-size="8" fill="#718096">step 12: ~29,650 wide</text><text x="585" y="232" font-size="8" fill="#c53030">dips below 0</text><text x="205" y="258" text-anchor="middle" font-size="8.5" fill="#4a5568">non-seasonal ARIMA misses the seasonal swing</text><text x="500" y="278" text-anchor="middle" font-size="8.5" fill="#4a5568">uncertainty compounds with the horizon (95% CI)</text></svg>