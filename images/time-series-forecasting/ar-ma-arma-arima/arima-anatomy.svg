<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="330" fill="#ffffff" /><text x="350" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a202c">ARIMA(p, d, q): every number traces to earlier work</text><text x="350" y="80" text-anchor="middle" font-size="34" font-weight="700" fill="#2d3748">ARIMA( <tspan fill="#2b6cb0">p</tspan> , <tspan fill="#c05621">d</tspan> , <tspan fill="#276749">q</tspan> )</text><rect x="40" y="105" width="195" height="66" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="137" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">p = AR terms</text><text x="137" y="141" text-anchor="middle" font-size="8.5" fill="#3182ce">number of past values</text><text x="137" y="156" text-anchor="middle" font-size="8.5" fill="#3182ce">chosen from PACF (Module 4)</text><rect x="252" y="105" width="195" height="66" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" /><text x="349" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">d = differences</text><text x="349" y="141" text-anchor="middle" font-size="8.5" fill="#c05621">the "I" / integration order</text><text x="349" y="156" text-anchor="middle" font-size="8.5" fill="#c05621">chosen for stationarity (Module 3)</text><rect x="464" y="105" width="195" height="66" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="561" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">q = MA terms</text><text x="561" y="141" text-anchor="middle" font-size="8.5" fill="#2f855a">number of past shocks</text><text x="561" y="156" text-anchor="middle" font-size="8.5" fill="#2f855a">chosen from ACF (Module 4)</text><text x="350" y="205" text-anchor="middle" font-size="10" font-weight="700" fill="#4a5568">how the model uses them</text><rect x="35" y="220" width="130" height="54" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.2" /><text x="100" y="243" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4a5568">raw series</text><text x="100" y="258" text-anchor="middle" font-size="8" fill="#718096">(trending)</text><path d="M165 247L193 247" stroke="#a0aec0" stroke-width="1.8" marker-end="url(#a5)" /><rect x="197" y="220" width="140" height="54" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.2" /><text x="267" y="243" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c05621">difference d times</text><text x="267" y="258" text-anchor="middle" font-size="8" fill="#c05621">→ now stationary</text><path d="M337 247L365 247" stroke="#a0aec0" stroke-width="1.8" marker-end="url(#a5)" /><rect x="369" y="220" width="150" height="54" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.2" /><text x="444" y="243" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2b6cb0">fit ARMA(p, q)</text><text x="444" y="258" text-anchor="middle" font-size="8" fill="#3182ce">AR + MA terms</text><path d="M519 247L547 247" stroke="#a0aec0" stroke-width="1.8" marker-end="url(#a5)" /><rect x="551" y="220" width="128" height="54" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.2" /><text x="615" y="243" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">integrate back</text><text x="615" y="258" text-anchor="middle" font-size="8" fill="#2f855a">forecast on orig. scale</text><defs><marker id="a5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#a0aec0" /></marker></defs><rect x="130" y="292" width="440" height="26" rx="7" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" /><text x="350" y="309" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4a5568">One order tuple collects the stationarity decision and the AR/MA reading</text></svg>