<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="300" fill="#ffffff" /><text x="350" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a202c">An AR(1) forecast decays geometrically toward the mean</text><line x1="60" y1="245" x2="660" y2="245" stroke="#a0aec0" stroke-width="1.2" /><line x1="60" y1="50" x2="60" y2="245" stroke="#a0aec0" stroke-width="1.2" /><line x1="60" y1="150" x2="660" y2="150" stroke="#cbd5e0" stroke-width="1.2" stroke-dasharray="5 4" /><text x="666" y="153" font-size="9" fill="#718096">mean 50</text><polyline points="80 168 118 157 156 183 194 150 232 163 270 192 308 185 346 183" fill="none" stroke="#4299e1" stroke-width="2.2" /><circle cx="346" cy="183" r="3.5" fill="#4299e1" /><text x="200" y="215" text-anchor="middle" font-size="9" fill="#3182ce">observed (ends below mean)</text><line x1="346" y1="50" x2="346" y2="245" stroke="#e2e8f0" stroke-width="1.2" /><polyline points="346 183 384 170 422 161 460 155 498 150 536 147 574 145" fill="none" stroke="#48bb78" stroke-width="2.6" /><g fill="#48bb78"><circle cx="384" cy="170" r="3" /><circle cx="422" cy="161" r="3" /><circle cx="460" cy="155" r="3" /><circle cx="498" cy="150" r="3" /><circle cx="536" cy="147" r="3" /><circle cx="574" cy="145" r="3" /></g><text x="490" y="205" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">forecast: 49.01 → 49.32 → 49.54 → ... → mean</text><text x="360" y="120" font-size="8" fill="#718096">recovers ~70% of the gap each step (phi = 0.7)</text><rect x="150" y="258" width="400" height="26" rx="7" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" /><text x="350" y="275" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4a5568">Mean reversion: the last value's influence fades smoothly, never abruptly</text></svg>