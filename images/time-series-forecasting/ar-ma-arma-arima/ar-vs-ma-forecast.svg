<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="290" fill="#ffffff" /><text x="350" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#1a202c">Same idea, opposite forecasts: AR decays, MA goes flat</text><text x="180" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">AR(1): decays gradually</text><line x1="45" y1="210" x2="320" y2="210" stroke="#a0aec0" stroke-width="1.1" /><line x1="130" y1="130" x2="320" y2="130" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="4 3" /><text x="55" y="127" font-size="8" fill="#718096">mean</text><polyline points="55 150 74 144 93 166 112 140 131 175" fill="none" stroke="#4299e1" stroke-width="2" /><circle cx="131" cy="175" r="3" fill="#4299e1" /><line x1="131" y1="60" x2="131" y2="210" stroke="#e2e8f0" stroke-width="1" /><polyline points="131 175 155 161 179 151 203 144 227 139 251 136 275 133" fill="none" stroke="#48bb78" stroke-width="2.4" /><g fill="#48bb78"><circle cx="155" cy="161" r="2.5" /><circle cx="179" cy="151" r="2.5" /><circle cx="203" cy="144" r="2.5" /><circle cx="227" cy="139" r="2.5" /><circle cx="251" cy="136" r="2.5" /><circle cx="275" cy="133" r="2.5" /></g><text x="200" y="230" text-anchor="middle" font-size="8.5" fill="#276749">many steps to reach the mean</text><line x1="360" y1="40" x2="360" y2="250" stroke="#e2e8f0" stroke-width="1.5" /><text x="530" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#c53030">MA(1): flat after 1 step</text><line x1="395" y1="210" x2="670" y2="210" stroke="#a0aec0" stroke-width="1.1" /><line x1="480" y1="130" x2="670" y2="130" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="4 3" /><text x="405" y="127" font-size="8" fill="#718096">mean</text><polyline points="405 150 424 144 443 166 462 140 481 158" fill="none" stroke="#4299e1" stroke-width="2" /><circle cx="481" cy="158" r="3" fill="#4299e1" /><line x1="481" y1="60" x2="481" y2="210" stroke="#e2e8f0" stroke-width="1" /><polyline points="481 158 505 127 529 130 553 130 577 130 601 130 625 130" fill="none" stroke="#e53e3e" stroke-width="2.4" /><g fill="#e53e3e"><circle cx="505" cy="127" r="2.5" /><circle cx="529" cy="130" r="2.5" /><circle cx="553" cy="130" r="2.5" /><circle cx="577" cy="130" r="2.5" /><circle cx="601" cy="130" r="2.5" /><circle cx="625" cy="130" r="2.5" /></g><text x="550" y="230" text-anchor="middle" font-size="8.5" fill="#c53030">1 informative step, then the mean</text><rect x="130" y="258" width="440" height="24" rx="7" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" /><text x="350" y="274" text-anchor="middle" font-size="9" font-weight="700" fill="#4a5568">AR remembers with fading influence; MA(q) forgets entirely after q steps</text></svg>