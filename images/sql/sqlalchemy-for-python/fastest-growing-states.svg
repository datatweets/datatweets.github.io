<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="330" fill="#ffffff" /><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Fastest-growing states, 2000 → 2008</text><text x="320" y="47" text-anchor="middle" font-size="10" fill="#718096">percent population growth, from the Lesson 8 SQLAlchemy + pandas query on census.csv</text><line x1="150" y1="80" x2="150" y2="284" stroke="#a0aec0" stroke-width="1.5" /><line x1="150" y1="284" x2="600" y2="284" stroke="#a0aec0" stroke-width="1.5" /><text x="375" y="308" text-anchor="middle" font-size="10" fill="#4a5568">population growth, 2000–2008</text><line x1="150" y1="76" x2="150" y2="284" stroke="#edf2f7" stroke-width="1" /><line x1="300" y1="76" x2="300" y2="284" stroke="#edf2f7" stroke-width="1" /><line x1="450" y1="76" x2="450" y2="284" stroke="#edf2f7" stroke-width="1" /><line x1="600" y1="76" x2="600" y2="284" stroke="#edf2f7" stroke-width="1" /><text x="150" y="298" text-anchor="middle" font-size="8.5" fill="#718096">0%</text><text x="300" y="298" text-anchor="middle" font-size="8.5" fill="#718096">10%</text><text x="450" y="298" text-anchor="middle" font-size="8.5" fill="#718096">20%</text><text x="600" y="298" text-anchor="middle" font-size="8.5" fill="#718096">30%</text><text x="140" y="102" text-anchor="end" font-size="11" fill="#2d3748">Nevada</text><rect x="150" y="88" width="432" height="24" rx="4" fill="#4299e1" /><text x="590" y="105" text-anchor="end" font-size="10" font-weight="700" fill="#ffffff">28.8%</text><text x="140" y="142" text-anchor="end" font-size="11" fill="#2d3748">Arizona</text><rect x="150" y="128" width="390" height="24" rx="4" fill="#4299e1" /><text x="548" y="145" text-anchor="end" font-size="10" font-weight="700" fill="#ffffff">26.0%</text><text x="140" y="182" text-anchor="end" font-size="11" fill="#2d3748">Utah