<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="680" height="380" fill="#ffffff" /><text x="340" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">One foreign key, two relationships</text><rect x="60" y="70" width="180" height="120" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="150" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">departments</text><line x1="72" y1="102" x2="228" y2="102" stroke="#d6bcfa" stroke-width="1" /><text x="80" y="120" font-size="10" fill="#553c9a">id  (PK)</text><text x="80" y="138" font-size="10" fill="#553c9a">name</text><text x="80" y="160" font-size="8.5" fill="#805ad5">Department.employees</text><text x="80" y="173" font-size="8.5" fill="#805ad5">→ list of Employee</text><rect x="420" y="60" width="220" height="180" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="2" /><text x="530" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">employees</text><line x1="432" y1="92" x2="628" y2="92" stroke="#bee3f8" stroke-width="1" /><text x="440" y="110" font-size="10" fill="#2c5282">id  (PK)</text><text x="440" y="128" font-size="10" fill="#2c5282">name, job, salary</text><text x="440" y="146" font-size="10" fill="#2c5282">department_id  (FK → departments.id)</text><text x="440" y="164" font-size="10" fill="#2c5282">mgr_id  (FK → employees.id)</text><text x="440" y="186" font-size="8.5" fill="#3182ce">Employee.department</text><text x="440" y="199" font-size="8.5" fill="#3182ce">→ one Department</text><text x="440" y="217" font-size="8.5" fill="#3182ce">Employee.manager / .reports</text><line x1="240" y1="130" x2="418" y2="130" stroke="#a0aec0" stroke-width="1.6" /><polygon points="418 130 409 126 409 134" fill="#a0aec0" /><text x="329" y="122" text-anchor="middle" font-size="8.5" fill="#4a5568">department_id</text><path d="M 640 150 C 690 150 690 200 655 200 L 610 200" fill="none" stroke="#48bb78" stroke-width="1.8" /><polygon points="610 200 619 196 619 204" fill="#48bb78" /><text x="663" y="130" text-anchor="middle" font-size="8.5" fill="#2f855a">mgr_id</text><text x="340" y="270" text-anchor="middle" font-size="11" fill="#718096">department_id links each employee to one department — a one-to-many relationship.</text><text x="340" y="288" text-anchor="middle" font-size="11" fill="#718096">mgr_id links an employee back to another row in the SAME table — a self-referential</text><text x="340" y="306" text-anchor="middle" font-size="11" fill="#718096">relationship, used with an alias in Core joins and a second relationship() in the ORM.</text><rect x="60" y="330" width="16" height="10" fill="#ebf4ff" stroke="#4299e1" /><text x="82" y="339" font-size="9" fill="#4a5568">table mapped by an ORM class</text><rect x="290" y="330" width="16" height="10" fill="#faf5ff" stroke="#9f7aea" /><text x="312" y="339" font-size="9" fill="#4a5568">related table</text></svg>
