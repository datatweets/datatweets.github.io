<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="680" height="360" fill="#ffffff" /><text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">How SQLAlchemy Core reaches a database</text><rect x="20" y="120" width="118" height="60" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="79" y="145" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3748">your script</text><text x="79" y="163" text-anchor="middle" font-size="9" fill="#718096">create_engine(...)</text><line x1="138" y1="150" x2="176" y2="150" stroke="#a0aec0" stroke-width="1.6" /><polygon points="176 150 167 146 167 154" fill="#a0aec0" /><rect x="178" y="112" width="132" height="76" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="2" /><text x="244" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Engine</text><text x="244" y="154" text-anchor="middle" font-size="8.5" fill="#3182ce">manages a pool of</text><text x="244" y="167" text-anchor="middle" font-size="8.5" fill="#3182ce">DBAPI connections</text><line x1="310" y1="150" x2="348" y2="150" stroke="#4299e1" stroke-width="1.6" /><polygon points="348 150 339 146 339 154" fill="#4299e1" /><text x="329" y="140" text-anchor="middle" font-size="8" fill="#4299e1">.connect()</text><rect x="350" y="112" width="132" height="76" rx="10" fill="#e6fffa" stroke="#319795" stroke-width="2" /><text x="416" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#234e52">Connection</text><text x="416" y="154" text-anchor="middle" font-size="8.5" fill="#2f855a">runs SQL, returns</text><text x="416" y="167" text-anchor="middle" font-size="8.5" fill="#2f855a">a CursorResult</text><line x1="482" y1="150" x2="520" y2="150" stroke="#319795" stroke-width="1.6" /><polygon points="520 150 511 146 511 154" fill="#319795" /><rect x="522" y="112" width="136" height="76" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="2" /><text x="590" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">SQLite file</text><text x="590" y="154" text-anchor="middle" font-size="8.5" fill="#9c4221">company.db</text><text x="590" y="167" text-anchor="middle" font-size="8.5" fill="#9c4221">on disk</text><rect x="178" y="230" width="304" height="76" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="330" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">MetaData()</text><text x="330" y="272" text-anchor="middle" font-size="8.5" fill="#805ad5">a registry that holds every Table object —</text><text x="330" y="286" text-anchor="middle" font-size="8.5" fill="#805ad5">departments, employees — you define in Python</text><line x1="244" y1="188" x2="244" y2="228" stroke="#9f7aea" stroke-width="1.6" stroke-dasharray="3 3" /><line x1="330" y1="230" x2="270" y2="190" stroke="#9f7aea" stroke-width="1.6" /><polygon points="266 194 271 186 277 195" fill="#9f7aea" /><text x="300" y="215" text-anchor="middle" font-size="8" fill="#9f7aea">metadata.create_all(engine)</text><text x="340" y="335" text-anchor="middle" font-size="11" fill="#718096">The Engine keeps a connection pool; a Connection borrows one to run SQL. MetaData never</text><text x="340" y="350" text-anchor="middle" font-size="11" fill="#718096">talks to the database itself — it hands its Table definitions to the Engine when you create tables.</text></svg>
