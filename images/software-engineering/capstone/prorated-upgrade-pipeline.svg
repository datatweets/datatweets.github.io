<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="900" height="620" fill="#ffffff" /><text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Prorated Mid-Cycle Upgrade: One Feature, Four Modules</text><text x="60" y="72" font-size="14" font-weight="600" fill="#4a5568">Amara Okafor's July billing cycle</text><rect x="60" y="86" width="184" height="56" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" /><text x="152" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#2b6cb0">Basic plan</text><text x="152" y="128" text-anchor="middle" font-size="12" fill="#2b6cb0">$19.00/mo, days 1-15</text><rect x="244" y="86" width="196" height="56" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="342" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#276749">Pro plan, prorated</text><text x="342" y="128" text-anchor="middle" font-size="12" fill="#276749">days 16-31: charged $15.48</text><line x1="244" y1="76" x2="244" y2="152" stroke="#c53030" stroke-width="2" stroke-dasharray="5,4" /><text x="244" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#c53030">Upgrade: July 16</text><text x="60" y="82" font-size="11" fill="#718096" /><text x="60" y="200" font-size="12" fill="#718096">July 1 (cycle start)</text><text x="440" y="200" text-anchor="end" font-size="12" fill="#718096">August 1 (cycle end)</text><text x="450" y="228" text-anchor="middle" font-size="13" fill="#4a5568">Raw prorated amount: $30.00 price difference × 16 remaining days ÷ 31 total days = $15.483...</text><text x="450" y="248" text-anchor="middle" font-size="13" fill="#4a5568">RoundHalfUpToCent rounds this to $15.48; CeilingToCent would round it up to $15.49</text><text x="450" y="292" text-anchor="middle" font-size="14" font-weight="600" fill="#4a5568">The same feature, built through all four modules of the course</text><rect x="40" y="320" width="190" height="130" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="135" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">Module 1</text><text x="135" y="364" text-anchor="middle" font-size="12" font-weight="600" fill="#6b46c1">Requirements</text><text x="135" y="386" text-anchor="middle" font-size="11" fill="#6b46c1">2 user stories,</text><text x="135" y="402" text-anchor="middle" font-size="11" fill="#6b46c1">acceptance criteria,</text><text x="135" y="418" text-anchor="middle" font-size="11" fill="#6b46c1">scoped into one</text><text x="135" y="434" text-anchor="middle" font-size="11" fill="#6b46c1">two-week Scrum sprint</text><rect x="255" y="320" width="190" height="130" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" /><text x="350" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">Module 2</text><text x="350" y="364" text-anchor="middle" font-size="12" font-weight="600" fill="#2b6cb0">Design</text><text x="350" y="386" text-anchor="middle" font-size="11" fill="#2b6cb0">ProrationCalculator,</text><text x="350" y="402" text-anchor="middle" font-size="11" fill="#2b6cb0">composed not inherited,</text><text x="350" y="418" text-anchor="middle" font-size="11" fill="#2b6cb0">Strategy pattern for</text><text x="350" y="434" text-anchor="middle" font-size="11" fill="#2b6cb0">swappable rounding</text><rect x="470" y="320" width="190" height="130" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="2" /><text x="565" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">Module 3</text><text x="565" y="364" text-anchor="middle" font-size="12" font-weight="600" fill="#c05621">Tests</text><text x="565" y="386" text-anchor="middle" font-size="11" fill="#c05621">5 unit tests covering</text><text x="565" y="402" text-anchor="middle" font-size="11" fill="#c05621">2 real date scenarios,</text><text x="565" y="418" text-anchor="middle" font-size="11" fill="#c05621">plus 1 Gherkin scenario,</text><text x="565" y="434" text-anchor="middle" font-size="11" fill="#c05621">all passing</text><rect x="685" y="320" width="190" height="130" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="780" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">Module 4</text><text x="780" y="364" text-anchor="middle" font-size="12" font-weight="600" fill="#276749">Ship It</text><text x="780" y="386" text-anchor="middle" font-size="11" fill="#276749">CI gate: test, then</text><text x="780" y="402" text-anchor="middle" font-size="11" fill="#276749">security-lint, then deploy;</text><text x="780" y="418" text-anchor="middle" font-size="11" fill="#276749">plan price always read</text><text x="780" y="434" text-anchor="middle" font-size="11" fill="#276749">server-side, never from a client</text><line x1="230" y1="385" x2="253" y2="385" stroke="#a0aec0" stroke-width="2" /><polygon points="253 385 244 380 244 390" fill="#a0aec0" /><line x1="445" y1="385" x2="468" y2="385" stroke="#a0aec0" stroke-width="2" /><polygon points="468 385 459 380 459 390" fill="#a0aec0" /><line x1="660" y1="385" x2="683" y2="385" stroke="#a0aec0" stroke-width="2" /><polygon points="683 385 674 380 674 390" fill="#a0aec0" /><text x="450" y="490" text-anchor="middle" font-size="12" fill="#718096">One feature, prorated mid-cycle subscription upgrades, exercises every module's skills exactly once, in order.</text><text x="450" y="510" text-anchor="middle" font-size="12" fill="#718096">The result: a customer who upgrades from Basic to Pro on July 16 is charged exactly $15.48, never $49.00 or $0.00.</text></svg>