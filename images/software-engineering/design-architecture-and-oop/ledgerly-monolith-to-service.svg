<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="900" height="640" fill="#ffffff" /><text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Ledgerly: from a layered monolith to an extracted billing service</text><text x="215" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#4a5568">Today: layered monolith</text><rect x="40" y="86" width="350" height="470" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="2" /><rect x="60" y="106" width="310" height="80" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" /><text x="215" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">Presentation layer</text><text x="215" y="152" text-anchor="middle" font-size="12" fill="#2b6cb0">InvoiceController</text><text x="215" y="170" text-anchor="middle" font-size="11" fill="#2b6cb0">receives requests, shapes responses</text><text x="215" y="204" text-anchor="middle" font-size="16" fill="#718096">↓</text><rect x="60" y="212" width="310" height="80" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="215" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">Business logic layer</text><text x="215" y="258" text-anchor="middle" font-size="12" fill="#276749">InvoiceService, PricingEngine</text><text x="215" y="276" text-anchor="middle" font-size="11" fill="#276749">applies rules, computes totals</text><text x="215" y="310" text-anchor="middle" font-size="16" fill="#718096">↓</text><rect x="60" y="318" width="310" height="80" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="2" /><text x="215" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">Data access layer</text><text x="215" y="364" text-anchor="middle" font-size="12" fill="#c05621">InvoiceRepository, BillingRepository</text><text x="215" y="382" text-anchor="middle" font-size="11" fill="#c05621">reads and writes storage</text><text x="215" y="416" text-anchor="middle" font-size="16" fill="#718096">↓</text><rect x="115" y="424" width="200" height="56" rx="8" fill="#f7fafc" stroke="#718096" stroke-width="2" /><text x="215" y="457" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">Single database</text><text x="215" y="510" text-anchor="middle" font-size="11" fill="#718096" font-style="italic">One process, one deploy,</text><text x="215" y="527" text-anchor="middle" font-size="11" fill="#718096" font-style="italic">one team can read it all.</text><text x="215" y="544" text-anchor="middle" font-size="11" fill="#718096" font-style="italic">Billing spikes slow down</text><text x="215" y="561" text-anchor="middle" font-size="11" fill="#718096" font-style="italic">invoice lookups too.</text><text x="450" y="330" text-anchor="middle" font-size="28" fill="#4a5568">→</text><text x="450" y="358" text-anchor="middle" font-size="11" fill="#718096">billing traffic</text><text x="450" y="373" text-anchor="middle" font-size="11" fill="#718096">grows fastest</text><text x="685" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#4a5568">Tomorrow: billing extracted</text><rect x="510" y="86" width="350" height="470" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="2" /><rect x="530" y="106" width="310" height="128" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" /><text x="685" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">Ledgerly main app</text><text x="685" y="150" text-anchor="middle" font-size="11" fill="#2b6cb0">Presentation + business logic</text><text x="685" y="167" text-anchor="middle" font-size="11" fill="#2b6cb0">InvoiceController, InvoiceService</text><rect x="550" y="180" width="270" height="42" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" /><text x="685" y="197" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">InvoiceRepository</text><text x="685" y="213" text-anchor="middle" font-size="10" fill="#c05621">own database</text><text x="685" y="262" text-anchor="middle" font-size="16" fill="#718096">↓</text><text x="685" y="278" text-anchor="middle" font-size="11" fill="#718096">calls over HTTP, not a function call</text><rect x="530" y="290" width="310" height="128" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="685" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">Billing service</text><text x="685" y="334" text-anchor="middle" font-size="11" fill="#6b46c1">PaymentGateway, RemoteBillingClient</text><text x="685" y="351" text-anchor="middle" font-size="11" fill="#6b46c1">charges cards, tracks subscriptions</text><rect x="550" y="364" width="270" height="42" rx="6" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" /><text x="685" y="381" text-anchor="middle" font-size="11" font-weight="700" fill="#c53030">BillingRepository</text><text x="685" y="397" text-anchor="middle" font-size="10" fill="#c53030">separate database</text><text x="685" y="450" text-anchor="middle" font-size="11" fill="#718096" font-style="italic">Two processes, two deploys.</text><text x="685" y="467" text-anchor="middle" font-size="11" fill="#718096" font-style="italic">Billing scales on its own, but</text><text x="685" y="484" text-anchor="middle" font-size="11" fill="#718096" font-style="italic">a network hop can fail where a</text><text x="685" y="501" text-anchor="middle" font-size="11" fill="#718096" font-style="italic">function call never could.</text><rect x="40" y="580" width="820" height="42" rx="8" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5" /><text x="450" y="606" text-anchor="middle" font-size="12" fill="#4a5568">Same layers inside each box. The architecture decision is where the boundary between boxes goes.</text></svg>