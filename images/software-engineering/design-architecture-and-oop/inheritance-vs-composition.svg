<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="900" height="520" fill="#ffffff" /><text x="225" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Inheritance: is-a</text><text x="675" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Composition: has-a</text><line x1="450" y1="55" x2="450" y2="500" stroke="#e2e8f0" stroke-width="2" /><rect x="105" y="60" width="240" height="56" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" /><text x="225" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">PaymentGateway</text><text x="225" y="102" text-anchor="middle" font-size="12" fill="#2b6cb0">(abstract base)</text><line x1="225" y1="116" x2="225" y2="140" stroke="#4a5568" stroke-width="2" /><line x1="140" y1="140" x2="310" y2="140" stroke="#4a5568" stroke-width="2" /><line x1="140" y1="140" x2="140" y2="164" stroke="#4a5568" stroke-width="2" /><line x1="310" y1="140" x2="310" y2="164" stroke="#4a5568" stroke-width="2" /><rect x="45" y="164" width="190" height="52" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="2" /><text x="140" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">StripeGateway</text><rect x="240" y="164" width="190" height="52" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="2" /><text x="335" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">PayPalGateway</text><line x1="140" y1="216" x2="140" y2="240" stroke="#4a5568" stroke-width="2" /><rect x="45" y="240" width="190" height="52" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="2" /><text x="140" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">StripeSandbox-</text><text x="140" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">Gateway</text><text x="225" y="330" text-anchor="middle" font-size="12.5" fill="#4a5568">Every subclass IS a PaymentGateway.</text><text x="225" y="350" text-anchor="middle" font-size="12.5" fill="#4a5568">It inherits charge() and refund(),</text><text x="225" y="370" text-anchor="middle" font-size="12.5" fill="#4a5568">then overrides them for its own provider.</text><text x="225" y="390" text-anchor="middle" font-size="12.5" fill="#4a5568">StripeSandboxGateway inherits from</text><text x="225" y="410" text-anchor="middle" font-size="12.5" fill="#4a5568">StripeGateway, two levels deep.</text><rect x="580" y="180" width="190" height="56" rx="8" fill="#faf5ff" stroke="#6b46c1" stroke-width="2" /><text x="675" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">Invoice</text><text x="675" y="222" text-anchor="middle" font-size="12" fill="#6b46c1">(coordinator)</text><line x1="580" y1="208" x2="510" y2="120" stroke="#4a5568" stroke-width="2" /><polygon points="580 208 588 202 596 208 588 214" fill="#6b46c1" /><line x1="675" y1="180" x2="675" y2="120" stroke="#4a5568" stroke-width="2" /><polygon points="675 180 683 174 691 180 683 186" fill="#6b46c1" /><line x1="770" y1="208" x2="840" y2="120" stroke="#4a5568" stroke-width="2" /><polygon points="770 208 778 202 786 208 778 214" fill="#6b46c1" /><rect x="480" y="64" width="150" height="52" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" /><text x="555" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">LineItems</text><text x="555" y="102" text-anchor="middle" font-size="11" fill="#2b6cb0">subtotal_cents()</text><rect x="600" y="64" width="150" height="52" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" /><text x="675" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">TaxCalculator</text><text x="675" y="102" text-anchor="middle" font-size="11" fill="#2b6cb0">calculate_tax_cents()</text><rect x="765" y="64" width="150" height="52" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" /><text x="840" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">PaymentGateway</text><text x="840" y="102" text-anchor="middle" font-size="11" fill="#2b6cb0">charge()</text><text x="675" y="330" text-anchor="middle" font-size="12.5" fill="#4a5568">Invoice HAS a LineItems, HAS a</text><text x="675" y="350" text-anchor="middle" font-size="12.5" fill="#4a5568">TaxCalculator, and HAS a PaymentGateway.</text><text x="675" y="370" text-anchor="middle" font-size="12.5" fill="#4a5568">None of them are Invoice subclasses.</text><text x="675" y="390" text-anchor="middle" font-size="12.5" fill="#4a5568">Swap any collaborator without touching</text><text x="675" y="410" text-anchor="middle" font-size="12.5" fill="#4a5568">the other two, or Invoice itself.</text><rect x="60" y="450" width="780" height="46" rx="8" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5" /><text x="450" y="478" text-anchor="middle" font-size="12.5" fill="#1a202c">Use inheritance for a genuine is-a relationship; use composition to assemble one class from independent collaborators.</text></svg>