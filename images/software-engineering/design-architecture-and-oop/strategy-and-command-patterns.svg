<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="900" height="440" fill="#ffffff" /><text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Two more behavioral pattern shapes, one Ledgerly problem each</text><line x1="450" y1="52" x2="450" y2="336" stroke="#e2e8f0" stroke-width="2" />

<text x="225" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#2b6cb0">Strategy</text>
<text x="225" y="90" text-anchor="middle" font-size="11.5" fill="#718096">swap the algorithm, keep the caller</text>
<rect x="105" y="104" width="240" height="44" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" /><text x="225" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">PricingEngine</text><text x="225" y="141" text-anchor="middle" font-size="10.5" fill="#2b6cb0">holds one discount_strategy</text>
<line x1="185" y1="148" x2="80" y2="172" stroke="#4a5568" stroke-width="2" /><polygon points="80 172 91 168 89 158" fill="#4a5568" />
<line x1="225" y1="148" x2="225" y2="172" stroke="#4a5568" stroke-width="2" /><polygon points="225 172 219 162 231 162" fill="#4a5568" />
<line x1="265" y1="148" x2="370" y2="172" stroke="#4a5568" stroke-width="2" /><polygon points="370 172 359 158 357 168" fill="#4a5568" />
<rect x="15" y="176" width="130" height="60" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5" /><text x="80" y="200" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">NoDiscount</text><text x="80" y="218" text-anchor="middle" font-size="10" fill="#276749">apply()</text>
<rect x="160" y="176" width="130" height="60" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="1.5" /><text x="225" y="196" text-anchor="middle" font-size="9" font-weight="700" fill="#c05621">PercentageDiscount</text><text x="225" y="214" text-anchor="middle" font-size="10" fill="#c05621">apply()</text>
<rect x="305" y="176" width="130" height="60" rx="8" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.5" /><text x="370" y="196" text-anchor="middle" font-size="9" font-weight="700" fill="#6b46c1">FlatAmountDiscount</text><text x="370" y="214" text-anchor="middle" font-size="10" fill="#6b46c1">apply()</text>
<text x="225" y="260" text-anchor="middle" font-size="11.5" fill="#4a5568">PricingEngine calls apply() on</text>
<text x="225" y="278" text-anchor="middle" font-size="11.5" fill="#4a5568">whichever strategy it holds. A new</text>
<text x="225" y="296" text-anchor="middle" font-size="11.5" fill="#4a5568">discount rule is one new class —</text>
<text x="225" y="314" text-anchor="middle" font-size="11.5" fill="#4a5568">PricingEngine itself never changes.</text>

<text x="675" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#6b46c1">Command</text>
<text x="675" y="90" text-anchor="middle" font-size="11.5" fill="#718096">operations become undoable objects</text>
<rect x="555" y="104" width="240" height="44" rx="8" fill="#faf5ff" stroke="#6b46c1" stroke-width="2" /><text x="675" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">BillingQueue</text><text x="675" y="141" text-anchor="middle" font-size="10.5" fill="#6b46c1">run() / undo_last()</text>
<line x1="630" y1="148" x2="600" y2="172" stroke="#4a5568" stroke-width="2" /><polygon points="600 172 609 166 611 156" fill="#4a5568" />
<line x1="720" y1="148" x2="750" y2="172" stroke="#4a5568" stroke-width="2" /><polygon points="750 172 741 156 739 166" fill="#4a5568" />
<rect x="525" y="176" width="170" height="60" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5" /><text x="610" y="198" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">ChargeCommand</text><text x="610" y="216" text-anchor="middle" font-size="10.5" fill="#276749">execute() / undo()</text>
<rect x="705" y="176" width="170" height="60" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5" /><text x="790" y="198" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">RefundCommand</text><text x="790" y="216" text-anchor="middle" font-size="10.5" fill="#2b6cb0">execute() / undo()</text>
<text x="675" y="260" text-anchor="middle" font-size="11.5" fill="#4a5568">run() calls execute() and appends</text>
<text x="675" y="278" text-anchor="middle" font-size="11.5" fill="#4a5568">the command to history. undo_last()</text>
<text x="675" y="296" text-anchor="middle" font-size="11.5" fill="#4a5568">pops the most recent one and calls</text>
<text x="675" y="314" text-anchor="middle" font-size="11.5" fill="#4a5568">its own undo() — no type check needed.</text>

<rect x="40" y="360" width="820" height="60" rx="8" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5" /><text x="450" y="384" text-anchor="middle" font-size="12.5" fill="#1a202c">Strategy swaps an interchangeable algorithm behind one shared interface, chosen once by the caller.</text><text x="450" y="406" text-anchor="middle" font-size="12.5" fill="#1a202c">Command turns an operation into an object the queue can run, log, and reverse without knowing its type.</text></svg>
