<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="900" height="620" fill="#ffffff" /><text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">A new Refunds module, depending on Billing only through an abstraction</text><rect x="60" y="70" width="330" height="190" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" /><text x="225" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#2b6cb0">Billing Module</text><rect x="85" y="114" width="280" height="42" rx="6" fill="#ffffff" stroke="#4299e1" stroke-width="1.5" /><text x="225" y="140" text-anchor="middle" font-size="13" fill="#1a202c">PaymentGateway (Stripe-like)</text><rect x="85" y="166" width="280" height="42" rx="6" fill="#ffffff" stroke="#4299e1" stroke-width="1.5" /><text x="225" y="192" text-anchor="middle" font-size="13" fill="#1a202c">InvoiceRepository (interface)</text><text x="225" y="235" text-anchor="middle" font-size="12" fill="#2b6cb0">Owns Invoice, Customer, and</text><text x="225" y="251" text-anchor="middle" font-size="12" fill="#2b6cb0">how payments are stored and taken</text><rect x="510" y="70" width="330" height="230" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="2" /><text x="675" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#6b46c1">Refunds Module (new)</text><rect x="535" y="114" width="280" height="42" rx="6" fill="#ffffff" stroke="#9f7aea" stroke-width="1.5" /><text x="675" y="140" text-anchor="middle" font-size="13" fill="#1a202c">RefundService</text><rect x="535" y="166" width="280" height="42" rx="6" fill="#ffffff" stroke="#9f7aea" stroke-width="1.5" /><text x="675" y="192" text-anchor="middle" font-size="13" fill="#1a202c">RefundPolicy (Strategy hierarchy)</text><rect x="535" y="218" width="280" height="42" rx="6" fill="#ffffff" stroke="#9f7aea" stroke-width="1.5" /><text x="675" y="244" text-anchor="middle" font-size="13" fill="#1a202c">RefundObserver (Observer interface)</text><text x="675" y="278" text-anchor="middle" font-size="12" fill="#6b46c1">Decides refund eligibility and amount;</text><text x="675" y="293" text-anchor="middle" font-size="12" fill="#6b46c1">never edits billing's own tables</text><defs><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2b6cb0" /></marker><marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#276749" /></marker></defs><line x1="510" y1="192" x2="392" y2="192" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrowBlue)" /><text x="450" y="180" text-anchor="middle" font-size="11.5" fill="#2b6cb0">depends on the</text><text x="450" y="206" text-anchor="middle" font-size="11.5" fill="#2b6cb0">InvoiceRepository interface only</text><rect x="60" y="400" width="260" height="70" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="2" /><text x="190" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">NotificationObserver</text><text x="190" y="450" text-anchor="middle" font-size="11.5" fill="#276749">emails the customer</text><rect x="360" y="400" width="260" height="70" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="2" /><text x="490" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">AccountingLedgerObserver</text><text x="490" y="450" text-anchor="middle" font-size="11.5" fill="#276749">records a ledger entry</text><rect x="660" y="400" width="180" height="70" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="2" stroke-dasharray="6,4" /><text x="750" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">Future observer</text><text x="750" y="450" text-anchor="middle" font-size="11.5" fill="#276749">e.g. fraud review</text><line x1="675" y1="300" x2="190" y2="400" stroke="#276749" stroke-width="2" marker-end="url(#arrowGreen)" /><line x1="675" y1="300" x2="490" y2="400" stroke="#276749" stroke-width="2" marker-end="url(#arrowGreen)" /><line x1="675" y1="300" x2="750" y2="400" stroke="#276749" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGreen)" /><text x="675" y="345" text-anchor="middle" font-size="12" fill="#276749">notifies every registered observer</text><text x="675" y="361" text-anchor="middle" font-size="12" fill="#276749">once a refund is approved</text><rect x="60" y="510" width="780" height="80" rx="8" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5" /><text x="450" y="536" text-anchor="middle" font-size="12.5" fill="#4a5568">The Refunds module is a separate, low-coupling module: it depends on Billing only</text><text x="450" y="556" text-anchor="middle" font-size="12.5" fill="#4a5568">through the InvoiceRepository interface, chooses a RefundPolicy per payment gateway</text><text x="450" y="576" text-anchor="middle" font-size="12.5" fill="#4a5568">(Strategy), and notifies any number of observers without knowing what they do.</text></svg>