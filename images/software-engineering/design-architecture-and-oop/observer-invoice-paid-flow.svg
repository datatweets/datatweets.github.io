<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="900" height="460" fill="#ffffff" /><text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">Observer pattern: notifying on a paid invoice</text><rect x="350" y="80" width="200" height="90" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" /><text x="450" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#2b6cb0">Invoice</text><text x="450" y="138" text-anchor="middle" font-size="13" fill="#2b6cb0">record_payment()</text><text x="450" y="157" text-anchor="middle" font-size="13" fill="#2b6cb0">status: paid</text><line x1="450" y1="170" x2="450" y2="215" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)" /><text x="465" y="200" font-size="13" fill="#4a5568">notifies all attached observers</text><rect x="90" y="240" width="220" height="100" rx="10" fill="#f0fff4" stroke="#276749" stroke-width="2" /><text x="200" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#276749">EmailReceiptObserver</text><text x="200" y="294" text-anchor="middle" font-size="12" fill="#276749">on_invoice_paid(invoice)</text><text x="200" y="314" text-anchor="middle" font-size="12" fill="#276749">sends receipt email</text><rect x="340" y="240" width="220" height="100" rx="10" fill="#fffaf0" stroke="#c05621" stroke-width="2" /><text x="450" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#c05621">SMSConfirmationObserver</text><text x="450" y="294" text-anchor="middle" font-size="12" fill="#c05621">on_invoice_paid(invoice)</text><text x="450" y="314" text-anchor="middle" font-size="12" fill="#c05621">sends SMS confirmation</text><rect x="590" y="240" width="220" height="100" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="2" /><text x="700" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#6b46c1">AuditLogObserver</text><text x="700" y="294" text-anchor="middle" font-size="12" fill="#6b46c1">on_invoice_paid(invoice)</text><text x="700" y="314" text-anchor="middle" font-size="12" fill="#6b46c1">records payment in log</text><line x1="450" y1="215" x2="200" y2="240" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrowgray)" /><line x1="450" y1="215" x2="450" y2="240" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrowgray)" /><line x1="450" y1="215" x2="700" y2="240" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrowgray)" /><rect x="150" y="380" width="600" height="55" rx="10" fill="#f7fafc" stroke="#e2e8f0" stroke-width="2" /><text x="450" y="404" text-anchor="middle" font-size="13" fill="#4a5568">Invoice never names any observer directly — it only calls</text><text x="450" y="422" text-anchor="middle" font-size="13" fill="#4a5568">on_invoice_paid() on whatever list of observers it was given.</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 3L0 6Z" fill="#4a5568" /></marker><marker id="arrowgray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 3L0 6Z" fill="#a0aec0" /></marker></defs></svg>