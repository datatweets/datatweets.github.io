<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="900" height="560" fill="#ffffff" /><text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Three pattern shapes, one Ledgerly problem each</text><line x1="300" y1="52" x2="300" y2="470" stroke="#e2e8f0" stroke-width="2" /><line x1="600" y1="52" x2="600" y2="470" stroke="#e2e8f0" stroke-width="2" /><text x="150" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#2b6cb0">Factory Method</text><text x="150" y="90" text-anchor="middle" font-size="11.5" fill="#718096">one call picks the class</text><rect x="40" y="110" width="220" height="50" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" /><text x="150" y="132" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b6cb0">PaymentGatewayFactory</text><text x="150" y="150" text-anchor="middle" font-size="11" fill="#2b6cb0">create("stripe")</text><line x1="150" y1="160" x2="150" y2="188" stroke="#4a5568" stroke-width="2" /><polygon points="150 188 144 178 156 178" fill="#4a5568" /><rect x="40" y="188" width="220" height="46" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="2" /><text x="150" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">StripeGateway</text><text x="150" y="256" text-anchor="middle" font-size="11.5" fill="#4a5568">Caller passes a string, "stripe".</text><text x="150" y="274" text-anchor="middle" font-size="11.5" fill="#4a5568">Factory decides which concrete</text><text x="150" y="292" text-anchor="middle" font-size="11.5" fill="#4a5568">gateway class to instantiate.</text><text x="150" y="310" text-anchor="middle" font-size="11.5" fill="#4a5568">Caller never names the class.</text><text x="450" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#c05621">Builder</text><text x="450" y="90" text-anchor="middle" font-size="11.5" fill="#718096">assembly happens step by step</text><rect x="345" y="108" width="210" height="30" rx="6" fill="#fffaf0" stroke="#c05621" stroke-width="2" /><text x="450" y="128" text-anchor="middle" font-size="11.5" fill="#c05621">add_line_item(...)</text><line x1="450" y1="138" x2="450" y2="150" stroke="#4a5568" stroke-width="2" /><rect x="345" y="150" width="210" height="30" rx="6" fill="#fffaf0" stroke="#c05621" stroke-width="2" /><text x="450" y="170" text-anchor="middle" font-size="11.5" fill="#c05621">with_discount(0.10)</text><line x1="450" y1="180" x2="450" y2="192" stroke="#4a5568" stroke-width="2" /><rect x="345" y="192" width="210" height="30" rx="6" fill="#fffaf0" stroke="#c05621" stroke-width="2" /><text x="450" y="212" text-anchor="middle" font-size="11.5" fill="#c05621">with_tax(0.08)</text><line x1="450" y1="222" x2="450" y2="238" stroke="#4a5568" stroke-width="2" /><polygon points="450 238 444 228 456 228" fill="#4a5568" /><rect x="345" y="238" width="210" height="42" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="2" /><text x="450" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">.build() → Invoice</text><text x="450" y="310" text-anchor="middle" font-size="11.5" fill="#4a5568">Each call configures one optional</text><text x="450" y="328" text-anchor="middle" font-size="11.5" fill="#4a5568">part. Only build() produces the</text><text x="450" y="346" text-anchor="middle" font-size="11.5" fill="#4a5568">final, immutable Invoice.</text><text x="750" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#6b46c1">Decorator</text><text x="750" y="90" text-anchor="middle" font-size="11.5" fill="#718096">wrappers stack around one core</text><rect x="650" y="150" width="200" height="150" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="750" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">LateFeeDecorator</text><rect x="665" y="180" width="170" height="105" rx="8" fill="#ffffff" stroke="#9f7aea" stroke-width="2" /><text x="750" y="198" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">DiscountDecorator</text><rect x="680" y="208" width="140" height="60" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="2" /><text x="750" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">BaseInvoiceTotal</text><text x="750" y="248" text-anchor="middle" font-size="10.5" fill="#276749">amount_cents()</text><text x="750" y="330" text-anchor="middle" font-size="11.5" fill="#4a5568">Each layer wraps the one inside it</text><text x="750" y="348" text-anchor="middle" font-size="11.5" fill="#4a5568">and adjusts amount_cents(). No</text><text x="750" y="366" text-anchor="middle" font-size="11.5" fill="#4a5568">subclass of Invoice is needed.</text><rect x="40" y="400" width="820" height="66" rx="8" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5" /><text x="450" y="426" text-anchor="middle" font-size="12.5" fill="#1a202c">Creational patterns (Factory Method, Builder) control how an object comes into existence.</text><text x="450" y="448" text-anchor="middle" font-size="12.5" fill="#1a202c">Structural patterns (Decorator, Adapter, Facade) control how existing objects are arranged and combined.</text></svg>