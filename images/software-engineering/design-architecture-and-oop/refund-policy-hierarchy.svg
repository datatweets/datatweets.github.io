<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="900" height="360" fill="#ffffff" /><text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">RefundPolicy: one shared contract, two different rule sets</text>

<rect x="330" y="56" width="240" height="56" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" /><text x="450" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">RefundPolicy</text><text x="450" y="98" text-anchor="middle" font-size="11.5" fill="#2b6cb0">(abstract) evaluate(invoice, amount, today)</text>

<line x1="450" y1="112" x2="450" y2="136" stroke="#4a5568" stroke-width="2" />
<line x1="225" y1="136" x2="675" y2="136" stroke="#4a5568" stroke-width="2" />
<line x1="225" y1="136" x2="225" y2="160" stroke="#4a5568" stroke-width="2" />
<line x1="675" y1="136" x2="675" y2="160" stroke="#4a5568" stroke-width="2" />

<rect x="105" y="160" width="240" height="64" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="2" /><text x="225" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">StripeRefundPolicy</text><text x="225" y="202" text-anchor="middle" font-size="11" fill="#276749">120-day window</text><text x="225" y="218" text-anchor="middle" font-size="11" fill="#276749">full or partial amount</text>

<rect x="555" y="160" width="240" height="64" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="2" /><text x="675" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">ManualBankTransfer-</text><text x="675" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">RefundPolicy</text><text x="675" y="213" text-anchor="middle" font-size="11" fill="#c05621">30-day window, full amount only</text>

<text x="450" y="254" text-anchor="middle" font-size="12.5" fill="#4a5568">Both subclasses implement the same evaluate() method, so RefundService</text>
<text x="450" y="272" text-anchor="middle" font-size="12.5" fill="#4a5568">can call either one without checking which gateway it has. Only the window</text>
<text x="450" y="290" text-anchor="middle" font-size="12.5" fill="#4a5568">length and the partial-amount rule differ between the two.</text>

<rect x="60" y="308" width="780" height="42" rx="8" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5" /><text x="450" y="333" text-anchor="middle" font-size="12.5" fill="#1a202c">RefundPolicy is an abstract base class — Python refuses to instantiate it directly (see Stage 2's TypeError).</text></svg>
