<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="820" height="480" fill="#ffffff" /><text x="410" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">Checking one pause-and-resume rule two ways</text><text x="410" y="56" text-anchor="middle" font-size="13" fill="#718096">Subscription SUB-2001 pauses on Jan 1 for 2 months</text><line x1="90" y1="140" x2="730" y2="140" stroke="#a0aec0" stroke-width="3" /><circle cx="130" cy="140" r="8" fill="#4299e1" /><text x="130" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#2b6cb0">Jan 1</text><text x="130" y="168" text-anchor="middle" font-size="11" fill="#4a5568">pause(months=2)</text><text x="130" y="184" text-anchor="middle" font-size="11" fill="#4a5568">billable = False</text><circle cx="410" cy="140" r="8" fill="#ed8936" /><text x="410" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#c05621">Feb 28</text><text x="410" y="168" text-anchor="middle" font-size="11" fill="#4a5568">one day before resume</text><text x="410" y="184" text-anchor="middle" font-size="11" fill="#4a5568">billable = False</text><circle cx="690" cy="140" r="8" fill="#48bb78" /><text x="690" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#276749">Mar 1</text><text x="690" y="168" text-anchor="middle" font-size="11" fill="#4a5568">auto-resume fires</text><text x="690" y="184" text-anchor="middle" font-size="11" fill="#4a5568">billable = True</text><line x1="130" y1="196" x2="230" y2="250" stroke="#a0aec0" stroke-width="2" /><line x1="410" y1="196" x2="410" y2="250" stroke="#a0aec0" stroke-width="2" /><line x1="690" y1="196" x2="590" y2="250" stroke="#a0aec0" stroke-width="2" /><rect x="90" y="250" width="300" height="180" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" /><text x="240" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">Stage 2: unittest</text><text x="110" y="304" font-size="12" fill="#2b6cb0">assertFalse(is_billable_on(</text><text x="122" y="322" font-size="12" fill="#2b6cb0">sub, date(2026, 1, 1)))</text><text x="110" y="348" font-size="12" fill="#2b6cb0">assertFalse(is_billable_on(</text><text x="122" y="366" font-size="12" fill="#2b6cb0">sub, date(2026, 2, 28)))</text><text x="110" y="392" font-size="12" fill="#2b6cb0">assertTrue(is_billable_on(</text><text x="122" y="410" font-size="12" fill="#2b6cb0">sub, date(2026, 3, 1)))</text><rect x="430" y="250" width="300" height="180" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="580" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">Stage 3: Gherkin</text><text x="450" y="304" font-size="12" fill="#6b46c1">When Priya pauses for 2</text><text x="450" y="322" font-size="12" fill="#6b46c1">months on "2026-01-01"</text><text x="450" y="348" font-size="12" fill="#6b46c1">Then not billable on</text><text x="450" y="366" font-size="12" fill="#6b46c1">"2026-02-28"</text><text x="450" y="392" font-size="12" fill="#6b46c1">And billable on</text><text x="450" y="410" font-size="12" fill="#6b46c1">"2026-03-01"</text><rect x="90" y="446" width="640" height="2" fill="#e2e8f0" /><text x="410" y="470" text-anchor="middle" font-size="11" fill="#718096">Both checks assert the same three dates; the unit test speaks Python, the Gherkin scenario speaks plain English.</text></svg>