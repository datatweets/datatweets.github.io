<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="760" height="500" fill="#ffffff" /><text x="380" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">The Testing Pyramid</text><text x="380" y="60" text-anchor="middle" font-size="13" fill="#718096">How Ledgerly balances three levels of automated tests</text><polygon points="350 90 433 203 267 203" fill="#fff5f5" stroke="#fc8181" stroke-width="2" /><text x="350" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#c53030">End-to-End</text><polygon points="267 203 433 203 517 307 183 307" fill="#fffaf0" stroke="#ed8936" stroke-width="2" /><text x="350" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">Integration</text><polygon points="183 307 517 307 600 420 100 420" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="350" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#276749">Unit Tests</text><line x1="433" y1="150" x2="480" y2="150" stroke="#a0aec0" stroke-width="1.5" /><line x1="470" y1="255" x2="530" y2="255" stroke="#a0aec0" stroke-width="1.5" /><line x1="540" y1="365" x2="600" y2="365" stroke="#a0aec0" stroke-width="1.5" /><text x="486" y="130" font-size="12.5" font-weight="700" fill="#c53030">Fewest</text><text x="486" y="146" font-size="12.5" fill="#4a5568">Minutes per test, full</text><text x="486" y="162" font-size="12.5" fill="#4a5568">stack, brittle to change</text><text x="536" y="235" font-size="12.5" font-weight="700" fill="#c05621">Some</text><text x="536" y="251" font-size="12.5" fill="#4a5568">Seconds per test, real</text><text x="536" y="267" font-size="12.5" fill="#4a5568">database or dependency</text><text x="606" y="345" font-size="12.5" font-weight="700" fill="#276749">Many</text><text x="606" y="361" font-size="12.5" fill="#4a5568">Milliseconds per test,</text><text x="606" y="377" font-size="12.5" fill="#4a5568">dependencies faked</text><text x="30" y="130" font-size="12.5" font-weight="700" fill="#718096">Example:</text><text x="30" y="146" font-size="12.5" fill="#4a5568">signup, invoice,</text><text x="30" y="162" font-size="12.5" fill="#4a5568">and payment in one flow</text><text x="10" y="235" font-size="12.5" font-weight="700" fill="#718096">Example:</text><text x="10" y="251" font-size="12.5" fill="#4a5568">BillingService with a</text><text x="10" y="267" font-size="12.5" fill="#4a5568">real in-memory database</text><text x="20" y="345" font-size="12.5" font-weight="700" fill="#718096">Example:</text><text x="20" y="361" font-size="12.5" fill="#4a5568">calculate_invoice_total</text><text x="20" y="377" font-size="12.5" fill="#4a5568">with a fake gateway</text><rect x="60" y="450" width="640" height="34" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="380" y="471" text-anchor="middle" font-size="12.5" fill="#2b6cb0">Write many fast unit tests, some integration tests, and only a few slow end-to-end tests</text></svg>