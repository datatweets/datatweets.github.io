<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="960" height="700" fill="#ffffff" /><text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Anatomy of a Ledgerly feature file</text><text x="480" y="58" text-anchor="middle" font-size="13" fill="#718096">discount_codes.feature</text><rect x="40" y="80" width="520" height="46" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="56" y="108" font-size="14" fill="#6b46c1" font-weight="600">@billing @discounts</text><line x1="560" y1="103" x2="640" y2="103" stroke="#9f7aea" stroke-width="1.5" /><text x="648" y="98" font-size="13" fill="#4a5568">Tags</text><text x="648" y="115" font-size="12" fill="#718096">Label scenarios and features so</text><text x="648" y="130" font-size="12" fill="#718096">test runners can filter by them.</text><rect x="40" y="136" width="520" height="70" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="56" y="160" font-size="14" fill="#2b6cb0" font-weight="600">Feature: Discount codes at checkout</text><text x="56" y="180" font-size="12" fill="#2b6cb0">As a freelancer using Ledgerly</text><text x="56" y="196" font-size="12" fill="#2b6cb0">I want valid codes to reduce my invoice total</text><line x1="560" y1="171" x2="640" y2="171" stroke="#4299e1" stroke-width="1.5" /><text x="648" y="160" font-size="13" fill="#4a5568">Feature</text><text x="648" y="177" font-size="12" fill="#718096">One file, one feature. The text</text><text x="648" y="192" font-size="12" fill="#718096">below the title is context only.</text><rect x="40" y="216" width="520" height="56" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5" /><text x="56" y="238" font-size="14" fill="#4a5568" font-weight="600">Background:</text><text x="56" y="256" font-size="12" fill="#4a5568">Given I have an invoice with a subtotal of $100.00</text><line x1="560" y1="244" x2="640" y2="244" stroke="#a0aec0" stroke-width="1.5" /><text x="648" y="233" font-size="13" fill="#4a5568">Background</text><text x="648" y="250" font-size="12" fill="#718096">Steps here run before every</text><text x="648" y="265" font-size="12" fill="#718096">scenario in this file.</text><rect x="40" y="282" width="520" height="118" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="56" y="304" font-size="14" fill="#276749" font-weight="600">Scenario: Overdue invoice escalates</text><text x="56" y="322" font-size="12" fill="#276749">Given the invoice due date was 15 days ago</text><text x="56" y="339" font-size="12" fill="#276749">When the overdue check runs</text><text x="56" y="356" font-size="12" fill="#276749">Then the invoice status should be "escalated"</text><text x="56" y="373" font-size="12" fill="#276749">And Ledgerly should notify the customer</text><text x="56" y="390" font-size="12" fill="#276749">But Ledgerly should not cancel the subscription</text><line x1="560" y1="335" x2="640" y2="335" stroke="#48bb78" stroke-width="1.5" /><text x="648" y="309" font-size="13" fill="#4a5568">Given / When / Then</text><text x="648" y="326" font-size="12" fill="#718096">Given sets up state, When triggers</text><text x="648" y="341" font-size="12" fill="#718096">an action, Then checks the result.</text><text x="648" y="356" font-size="12" fill="#718096">And / But add steps of the same</text><text x="648" y="371" font-size="12" fill="#718096">kind for a more natural reading.</text><rect x="40" y="412" width="520" height="252" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" /><text x="56" y="434" font-size="14" fill="#c05621" font-weight="600">Scenario Outline: Apply a discount code</text><text x="56" y="452" font-size="12" fill="#c05621">When I apply discount code "&lt;code&gt;"</text><text x="56" y="469" font-size="12" fill="#c05621">Then the invoice total should be $&lt;total&gt;</text><text x="56" y="490" font-size="13" fill="#c05621" font-weight="600">Examples:</text><rect x="56" y="500" width="330" height="98" rx="4" fill="#ffffff" stroke="#ed8936" stroke-width="1" /><line x1="56" y1="524" x2="386" y2="524" stroke="#ed8936" stroke-width="1" /><line x1="176" y1="500" x2="176" y2="598" stroke="#ed8936" stroke-width="1" /><line x1="291" y1="500" x2="291" y2="598" stroke="#ed8936" stroke-width="1" /><text x="66" y="517" font-size="11" fill="#c05621" font-weight="600">code</text><text x="186" y="517" font-size="11" fill="#c05621" font-weight="600">rate</text><text x="301" y="517" font-size="11" fill="#c05621" font-weight="600">total</text><text x="66" y="540" font-size="11" fill="#4a5568">SAVE10</text><text x="186" y="540" font-size="11" fill="#4a5568">10%</text><text x="301" y="540" font-size="11" fill="#4a5568">90.00</text><text x="66" y="562" font-size="11" fill="#4a5568">SAVE20</text><text x="186" y="562" font-size="11" fill="#4a5568">20%</text><text x="301" y="562" font-size="11" fill="#4a5568">80.00</text><text x="66" y="584" font-size="11" fill="#4a5568">EXPIRED5</text><text x="186" y="584" font-size="11" fill="#4a5568">0%</text><text x="301" y="584" font-size="11" fill="#4a5568">100.00</text><text x="56" y="622" font-size="12" fill="#c05621">Ledgerly runs this scenario once per data row above,</text><text x="56" y="640" font-size="12" fill="#c05621">substituting each &lt;placeholder&gt; before the run.</text><line x1="560" y1="500" x2="640" y2="500" stroke="#ed8936" stroke-width="1.5" /><text x="648" y="440" font-size="13" fill="#4a5568">Scenario Outline</text><text x="648" y="457" font-size="12" fill="#718096">Placeholders in angle brackets pull</text><text x="648" y="472" font-size="12" fill="#718096">values from the Examples table below.</text><text x="648" y="490" font-size="13" fill="#4a5568">Examples</text><text x="648" y="507" font-size="12" fill="#718096">One header row plus one row per</text><text x="648" y="522" font-size="12" fill="#718096">test case. Three rows here mean</text><text x="648" y="537" font-size="12" fill="#718096">three separate scenario runs.</text></svg>