<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="520" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">From conversation to executable specification</text><rect x="30" y="54" width="200" height="82" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="130" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b6cb0">Product owner</text><text x="130" y="98" text-anchor="middle" font-size="9.5" fill="#3182ce">Knows what the</text><text x="130" y="112" text-anchor="middle" font-size="9.5" fill="#3182ce">discount code feature</text><text x="130" y="126" text-anchor="middle" font-size="9.5" fill="#3182ce">should do, and why.</text><rect x="280" y="54" width="200" height="82" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="380" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#276749">Developer</text><text x="380" y="98" text-anchor="middle" font-size="9.5" fill="#2f855a">Knows what Ledgerly's</text><text x="380" y="112" text-anchor="middle" font-size="9.5" fill="#2f855a">code can build, and</text><text x="380" y="126" text-anchor="middle" font-size="9.5" fill="#2f855a">how long it takes.</text><rect x="530" y="54" width="200" height="82" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" /><text x="630" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c05621">Tester</text><text x="630" y="98" text-anchor="middle" font-size="9.5" fill="#9c4221">Finds the edge cases:</text><text x="630" y="112" text-anchor="middle" font-size="9.5" fill="#9c4221">expired codes, unknown</text><text x="630" y="126" text-anchor="middle" font-size="9.5" fill="#9c4221">codes, zero totals.</text><line x1="130" y1="136" x2="130" y2="160" stroke="#a0aec0" stroke-width="1.5" /><line x1="130" y1="160" x2="380" y2="160" stroke="#a0aec0" stroke-width="1.5" /><line x1="630" y1="136" x2="630" y2="160" stroke="#a0aec0" stroke-width="1.5" /><line x1="630" y1="160" x2="380" y2="160" stroke="#a0aec0" stroke-width="1.5" /><line x1="380" y1="136" x2="380" y2="160" stroke="#a0aec0" stroke-width="1.5" /><line x1="380" y1="160" x2="380" y2="176" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="180" y="176" width="400" height="56" rx="10" fill="#f7fafc" stroke="#718096" stroke-width="1.5" /><text x="380" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">Three-amigos conversation</text><text x="380" y="218" text-anchor="middle" font-size="9.5" fill="#4a5568">Talk through examples before any code is written</text><line x1="380" y1="232" x2="380" y2="256" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)" /><rect x="140" y="256" width="480" height="96" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="380" y="280" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b46c1">Given-When-Then scenario</text><text x="380" y="300" text-anchor="middle" font-size="9.5" fill="#805ad5">Given an invoice with a subtotal of $100</text><text x="380" y="316" text-anchor="middle" font-size="9.5" fill="#805ad5">When the customer applies code "WELCOME10"</text><text x="380" y="332" text-anchor="middle" font-size="9.5" fill="#805ad5">Then the invoice total becomes $90</text><line x1="380" y1="352" x2="380" y2="376" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)" /><rect x="140" y="376" width="480" height="96" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="380" y="400" text-anchor="middle" font-size="12.5" font-weight="700" fill="#276749">Executable specification (Python)</text><text x="380" y="420" text-anchor="middle" font-size="9.5" fill="#2f855a">given_invoice_subtotal(), when_apply_discount_code(),</text><text x="380" y="436" text-anchor="middle" font-size="9.5" fill="#2f855a">then_total_should_be() run as real assertions</text><text x="380" y="456" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">Result: passed — and fails automatically if the code changes</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#718096" /></marker></defs><rect x="140" y="490" width="480" height="1" fill="#e2e8f0" /><text x="380" y="510" text-anchor="middle" font-size="9.5" fill="#718096">Each arrow is a translation step: talk, then write a scenario, then run it as code.</text></svg>