<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="800" height="480" fill="#ffffff" /><text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">Refactoring Ledgerly's Invoice Calculator</text><text x="400" y="56" text-anchor="middle" font-size="13" fill="#718096">One tangled function versus five small, single-purpose functions</text><text x="185" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#c53030">BEFORE: one tangled function</text><rect x="45" y="102" width="280" height="330" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="2" /><rect x="65" y="118" width="240" height="30" rx="5" fill="#fc8181" /><text x="185" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">calc(x, tmp, flag, d)</text><line x1="80" y1="168" x2="290" y2="168" stroke="#c53030" stroke-width="2" /><text x="90" y="164" font-size="11" fill="#c53030">sum prices into r</text><line x1="80" y1="196" x2="290" y2="196" stroke="#c53030" stroke-width="2" /><text x="90" y="192" font-size="11" fill="#c53030">tier discount tangled in</text><line x1="80" y1="224" x2="290" y2="224" stroke="#c53030" stroke-width="2" /><text x="90" y="220" font-size="11" fill="#c53030">loyalty flag stacked on r</text><line x1="80" y1="252" x2="290" y2="252" stroke="#c53030" stroke-width="2" /><text x="90" y="248" font-size="11" fill="#c53030">tax added to same r</text><line x1="80" y1="280" x2="290" y2="280" stroke="#c53030" stroke-width="2" /><text x="90" y="276" font-size="11" fill="#c53030">late fee added to same r</text><text x="185" y="320" text-anchor="middle" font-size="12" fill="#742a2a" font-style="italic">x, tmp, flag, d, r, tx, lf:</text><text x="185" y="338" text-anchor="middle" font-size="12" fill="#742a2a" font-style="italic">none of these names say</text><text x="185" y="356" text-anchor="middle" font-size="12" fill="#742a2a" font-style="italic">what they hold</text><rect x="65" y="378" width="240" height="38" rx="5" fill="#c53030" /><text x="185" y="397" text-anchor="middle" font-size="11" fill="#ffffff">One function, five jobs,</text><text x="185" y="410" text-anchor="middle" font-size="11" fill="#ffffff">no way to test a piece alone</text><polygon points="345 240 375 225 375 255" fill="#a0aec0" /><text x="615" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#276749">AFTER: five focused functions</text><rect x="475" y="102" width="280" height="330" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><rect x="495" y="116" width="240" height="28" rx="5" fill="#48bb78" /><text x="615" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">calculate_subtotal(items)</text><polygon points="615 146 610 154 620 154" fill="#276749" /><rect x="495" y="158" width="240" height="28" rx="5" fill="#48bb78" /><text x="615" y="177" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">apply_tier_discount(...)</text><polygon points="615 188 610 196 620 196" fill="#276749" /><rect x="495" y="200" width="240" height="28" rx="5" fill="#48bb78" /><text x="615" y="219" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">apply_loyalty_discount(...)</text><polygon points="615 230 610 238 620 238" fill="#276749" /><rect x="495" y="242" width="240" height="28" rx="5" fill="#48bb78" /><text x="615" y="261" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">add_tax(amount)</text><polygon points="615 272 610 280 620 280" fill="#276749" /><rect x="495" y="284" width="240" height="28" rx="5" fill="#48bb78" /><text x="615" y="303" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">add_late_fee(...)</text><polygon points="615 314 610 322 620 322" fill="#276749" /><rect x="495" y="326" width="240" height="34" rx="5" fill="#2b6cb0" /><text x="615" y="341" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">calculate_invoice_total(...)</text><text x="615" y="354" text-anchor="middle" font-size="10" fill="#ebf8ff">calls all five, in order</text><text x="615" y="392" text-anchor="middle" font-size="12" fill="#276749" font-style="italic">Each name says its one job.</text><text x="615" y="410" text-anchor="middle" font-size="12" fill="#276749" font-style="italic">Each function is testable alone.</text><rect x="45" y="440" width="710" height="1" fill="#e2e8f0" /><text x="400" y="465" text-anchor="middle" font-size="11.5" fill="#4a5568">Same 141.69 result both ways — refactoring changes structure, never behavior</text></svg>