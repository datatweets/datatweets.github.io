<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="420" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Six core principles, applied to Ledgerly</text><rect x="20" y="54" width="228" height="110" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="134" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b6cb0">Modularity</text><text x="134" y="98" text-anchor="middle" font-size="9.5" fill="#3182ce">Split one big function into</text><text x="134" y="112" text-anchor="middle" font-size="9.5" fill="#3182ce">InvoiceValidator, PricingEngine,</text><text x="134" y="126" text-anchor="middle" font-size="9.5" fill="#3182ce">and InvoiceProcessor — each</text><text x="134" y="140" text-anchor="middle" font-size="9.5" fill="#3182ce">with one job.</text><rect x="266" y="54" width="228" height="110" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="380" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b46c1">Abstraction</text><text x="380" y="98" text-anchor="middle" font-size="9.5" fill="#805ad5">BillingService calls a</text><text x="380" y="112" text-anchor="middle" font-size="9.5" fill="#805ad5">PaymentGateway interface, never</text><text x="380" y="126" text-anchor="middle" font-size="9.5" fill="#805ad5">Stripe directly — swap gateways</text><text x="380" y="140" text-anchor="middle" font-size="9.5" fill="#805ad5">without touching billing code.</text><rect x="512" y="54" width="228" height="110" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="626" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#276749">Encapsulation</text><text x="626" y="98" text-anchor="middle" font-size="9.5" fill="#2f855a">Invoice hides _amount_paid_cents</text><text x="626" y="112" text-anchor="middle" font-size="9.5" fill="#2f855a">and only changes it through</text><text x="626" y="126" text-anchor="middle" font-size="9.5" fill="#2f855a">record_payment(), so balance</text><text x="626" y="140" text-anchor="middle" font-size="9.5" fill="#2f855a">and status never go invalid.</text><rect x="20" y="188" width="228" height="110" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" /><text x="134" y="212" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c05621">DRY / Reusability</text><text x="134" y="232" text-anchor="middle" font-size="9.5" fill="#9c4221">CustomerValidator holds the</text><text x="134" y="246" text-anchor="middle" font-size="9.5" fill="#9c4221">email and name checks once,</text><text x="134" y="260" text-anchor="middle" font-size="9.5" fill="#9c4221">reused by both create and</text><text x="134" y="274" text-anchor="middle" font-size="9.5" fill="#9c4221">update customer.</text><rect x="266" y="188" width="228" height="110" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" /><text x="380" y="212" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c53030">KISS</text><text x="380" y="232" text-anchor="middle" font-size="9.5" fill="#c53030">SimpleInvoiceNumberGenerator</text><text x="380" y="246" text-anchor="middle" font-size="9.5" fill="#c53030">replaces a configurable version</text><text x="380" y="260" text-anchor="middle" font-size="9.5" fill="#c53030">with unused prefixes and suffix</text><text x="380" y="274" text-anchor="middle" font-size="9.5" fill="#c53030">rules nobody asked for.</text><rect x="512" y="188" width="228" height="110" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5" /><text x="626" y="212" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">YAGNI</text><text x="626" y="232" text-anchor="middle" font-size="9.5" fill="#4a5568">EmailNotificationService sends</text><text x="626" y="246" text-anchor="middle" font-size="9.5" fill="#4a5568">only email reminders today —</text><text x="626" y="260" text-anchor="middle" font-size="9.5" fill="#4a5568">no SMS or push channel until</text><text x="626" y="274" text-anchor="middle" font-size="9.5" fill="#4a5568">Ledgerly actually needs one.</text><line x1="134" y1="164" x2="134" y2="188" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="3 3" /><line x1="380" y1="164" x2="380" y2="188" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="3 3" /><line x1="626" y1="164" x2="626" y2="188" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="3 3" /><rect x="150" y="330" width="460" height="62" rx="10" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5" /><text x="380" y="356" text-anchor="middle" font-size="10.5" fill="#4a5568">Each principle answers a different question: where does this</text><text x="380" y="374" text-anchor="middle" font-size="10.5" fill="#4a5568">code live, what does it hide, and how much of it do we need?</text></svg>