<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="420" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The five SOLID principles, applied to Ledgerly</text><rect x="20" y="54" width="228" height="110" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="134" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b6cb0">S — Single Responsibility</text><text x="134" y="98" text-anchor="middle" font-size="9" fill="#3182ce">InvoiceService splits into</text><text x="134" y="112" text-anchor="middle" font-size="9" fill="#3182ce">InvoicePricer, PdfRenderer,</text><text x="134" y="126" text-anchor="middle" font-size="9" fill="#3182ce">and InvoiceRepository — each</text><text x="134" y="140" text-anchor="middle" font-size="9" fill="#3182ce">has one reason to change.</text><rect x="266" y="54" width="228" height="110" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="380" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#276749">O — Open/Closed</text><text x="380" y="98" text-anchor="middle" font-size="9" fill="#2f855a">PaymentGateway lets a new</text><text x="380" y="112" text-anchor="middle" font-size="9" fill="#2f855a">WiseGateway class join Stripe</text><text x="380" y="126" text-anchor="middle" font-size="9" fill="#2f855a">and PayPal — no edits to</text><text x="380" y="140" text-anchor="middle" font-size="9" fill="#2f855a">existing gateway code.</text><rect x="512" y="54" width="228" height="110" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" /><text x="626" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c05621">L — Liskov Substitution</text><text x="626" y="98" text-anchor="middle" font-size="9" fill="#9c4221">LifetimeSubscription no</text><text x="626" y="112" text-anchor="middle" font-size="9" fill="#9c4221">longer claims a cancel() it</text><text x="626" y="126" text-anchor="middle" font-size="9" fill="#9c4221">can't honor — the type system</text><text x="626" y="140" text-anchor="middle" font-size="9" fill="#9c4221">catches the mismatch early.</text><rect x="143" y="188" width="228" height="110" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="257" y="212" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b46c1">I — Interface Segregation</text><text x="257" y="232" text-anchor="middle" font-size="9" fill="#805ad5">DraftInvoice implements only</text><text x="257" y="246" text-anchor="middle" font-size="9" fill="#805ad5">Renderable, not Chargeable or</text><text x="257" y="260" text-anchor="middle" font-size="9" fill="#805ad5">Remindable — it never has to</text><text x="257" y="274" text-anchor="middle" font-size="9" fill="#805ad5">promise what it can't do.</text><rect x="389" y="188" width="228" height="110" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" /><text x="503" y="212" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c53030">D — Dependency Inversion</text><text x="503" y="232" text-anchor="middle" font-size="9" fill="#c53030">InvoiceService depends on</text><text x="503" y="246" text-anchor="middle" font-size="9" fill="#c53030">the PaymentGateway interface,</text><text x="503" y="260" text-anchor="middle" font-size="9" fill="#c53030">not StripeClient directly — so</text><text x="503" y="274" text-anchor="middle" font-size="9" fill="#c53030">tests can swap it out.</text><line x1="134" y1="164" x2="257" y2="188" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="3 3" /><line x1="380" y1="164" x2="380" y2="188" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="3 3" /><line x1="626" y1="164" x2="503" y2="188" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="3 3" /><rect x="150" y="330" width="460" height="62" rx="10" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5" /><text x="380" y="356" text-anchor="middle" font-size="10.5" fill="#4a5568">Together, the five principles keep Ledgerly's codebase</text><text x="380" y="374" text-anchor="middle" font-size="10.5" fill="#4a5568">easy to change, test, and extend as new features arrive.</text></svg>