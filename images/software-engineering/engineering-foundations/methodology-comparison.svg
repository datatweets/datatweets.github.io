<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="940" height="430" fill="#ffffff" /><text x="470" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Three shapes of work: Waterfall, Scrum, and Kanban</text><line x1="313" y1="46" x2="313" y2="410" stroke="#e2e8f0" stroke-width="1.5" /><line x1="626" y1="46" x2="626" y2="410" stroke="#e2e8f0" stroke-width="1.5" /><text x="156" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">Waterfall</text><text x="156" y="82" text-anchor="middle" font-size="9.5" fill="#718096">one pass, in order</text><rect x="66" y="94" width="180" height="34" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="156" y="116" text-anchor="middle" font-size="11" font-weight="600" fill="#2b6cb0">Requirements</text><line x1="156" y1="128" x2="156" y2="146" stroke="#a0aec0" stroke-width="2" /><polygon points="156 146 151 136 161 136" fill="#a0aec0" /><rect x="66" y="148" width="180" height="34" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="156" y="170" text-anchor="middle" font-size="11" font-weight="600" fill="#2b6cb0">Design</text><line x1="156" y1="182" x2="156" y2="200" stroke="#a0aec0" stroke-width="2" /><polygon points="156 200 151 190 161 190" fill="#a0aec0" /><rect x="66" y="202" width="180" height="34" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="156" y="224" text-anchor="middle" font-size="11" font-weight="600" fill="#2b6cb0">Build</text><line x1="156" y1="236" x2="156" y2="254" stroke="#a0aec0" stroke-width="2" /><polygon points="156 254 151 244 161 244" fill="#a0aec0" /><rect x="66" y="256" width="180" height="34" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="156" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#2b6cb0">Test</text><line x1="156" y1="290" x2="156" y2="308" stroke="#a0aec0" stroke-width="2" /><polygon points="156 308 151 298 161 298" fill="#a0aec0" /><rect x="66" y="310" width="180" height="34" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="156" y="332" text-anchor="middle" font-size="11" font-weight="600" fill="#2b6cb0">Release</text><text x="156" y="368" text-anchor="middle" font-size="9.5" fill="#718096">Each phase finishes fully</text><text x="156" y="382" text-anchor="middle" font-size="9.5" fill="#718096">before the next one starts.</text><text x="156" y="398" text-anchor="middle" font-size="9.5" fill="#718096">No arrow ever loops back.</text><text x="470" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">Scrum</text><text x="470" y="82" text-anchor="middle" font-size="9.5" fill="#718096">fixed sprint, on repeat</text><rect x="405" y="100" width="130" height="42" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="470" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#6b46c1">Plan</text><rect x="545" y="185" width="130" height="42" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="610" y="211" text-anchor="middle" font-size="11" font-weight="600" fill="#6b46c1">Build</text><rect x="405" y="270" width="130" height="42" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="470" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#6b46c1">Review</text><rect x="265" y="185" width="130" height="42" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="330" y="211" text-anchor="middle" font-size="11" font-weight="600" fill="#6b46c1">Retro</text><path d="M525 130C570 145 590 165 600 183" fill="none" stroke="#805ad5" stroke-width="2" /><polygon points="600 183 590 178 597 171" fill="#805ad5" /><path d="M600 229C590 250 550 265 537 275" fill="none" stroke="#805ad5" stroke-width="2" /><polygon points="537 275 546 268 549 278" fill="#805ad5" /><path d="M403 285C370 270 345 250 335 229" fill="none" stroke="#805ad5" stroke-width="2" /><polygon points="335 229 331 240 342 236" fill="#805ad5" /><path d="M335 183C345 165 375 145 403 130" fill="none" stroke="#805ad5" stroke-width="2" /><polygon points="403 130 392 131 397 141" fill="#805ad5" /><text x="470" y="215" text-anchor="middle" font-size="9.5" font-weight="700" fill="#805ad5">2-week</text><text x="470" y="228" text-anchor="middle" font-size="9.5" font-weight="700" fill="#805ad5">sprint</text><text x="470" y="368" text-anchor="middle" font-size="9.5" fill="#718096">Plan, build, review, and</text><text x="470" y="382" text-anchor="middle" font-size="9.5" fill="#718096">reflect every two weeks,</text><text x="470" y="398" text-anchor="middle" font-size="9.5" fill="#718096">then repeat the cycle.</text><text x="783" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">Kanban</text><text x="783" y="82" text-anchor="middle" font-size="9.5" fill="#718096">continuous flow, no cycle</text><rect x="646" y="120" width="60" height="150" rx="7" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="676" y="138" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">Backlog</text><text x="676" y="252" text-anchor="middle" font-size="8" fill="#2f855a">no limit</text><line x1="706" y1="195" x2="718" y2="195" stroke="#a0aec0" stroke-width="2" /><polygon points="718 195 710 190 710 200" fill="#a0aec0" /><rect x="720" y="120" width="60" height="150" rx="7" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="750" y="136" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">In</text><text x="750" y="147" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">Progress</text><text x="750" y="248" text-anchor="middle" font-size="8" font-weight="700" fill="#c05621">WIP: 2</text><line x1="780" y1="195" x2="792" y2="195" stroke="#a0aec0" stroke-width="2" /><polygon points="792 195 784 190 784 200" fill="#a0aec0" /><rect x="794" y="120" width="60" height="150" rx="7" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="824" y="138" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">Review</text><text x="824" y="248" text-anchor="middle" font-size="8" font-weight="700" fill="#c05621">WIP: 1</text><line x1="854" y1="195" x2="866" y2="195" stroke="#a0aec0" stroke-width="2" /><polygon points="866 195 858 190 858 200" fill="#a0aec0" /><rect x="868" y="120" width="60" height="150" rx="7" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="898" y="138" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">Done</text><text x="898" y="252" text-anchor="middle" font-size="8" fill="#2f855a">no limit</text><path d="M868 285C800 320 720 320 680 285" fill="none" stroke="#ed8936" stroke-width="1.8" stroke-dasharray="5 3" /><polygon points="680 285 690 282 687 291" fill="#ed8936" /><text x="783" y="340" text-anchor="middle" font-size="8.5" fill="#9c4221">new ticket arrives anytime,</text><text x="783" y="352" text-anchor="middle" font-size="8.5" fill="#9c4221">no fixed cycle boundary</text><text x="783" y="382" text-anchor="middle" font-size="9.5" fill="#718096">Work is pulled forward only</text><text x="783" y="396" text-anchor="middle" font-size="9.5" fill="#718096">when a column is below its WIP limit.</text></svg>