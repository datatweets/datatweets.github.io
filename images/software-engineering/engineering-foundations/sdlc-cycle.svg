<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="460" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The SDLC as a repeating cycle, applied to Ledgerly's reminder feature</text><rect x="40" y="65" width="200" height="90" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="140" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b6cb0">1. Requirements</text><text x="140" y="107" text-anchor="middle" font-size="9.5" fill="#3182ce">Freelancers want overdue</text><text x="140" y="121" text-anchor="middle" font-size="9.5" fill="#3182ce">invoices flagged automatically,</text><text x="140" y="135" text-anchor="middle" font-size="9.5" fill="#3182ce">not chased by hand.</text><rect x="280" y="65" width="200" height="90" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="380" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b46c1">2. Design</text><text x="380" y="107" text-anchor="middle" font-size="9.5" fill="#805ad5">InvoiceRepository finds</text><text x="380" y="121" text-anchor="middle" font-size="9.5" fill="#805ad5">overdue invoices; NotificationService</text><text x="380" y="135" text-anchor="middle" font-size="9.5" fill="#805ad5">sends the reminder.</text><rect x="520" y="65" width="200" height="90" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" /><text x="620" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c05621">3. Implementation</text><text x="620" y="107" text-anchor="middle" font-size="9.5" fill="#9c4221">Team codes</text><text x="620" y="121" text-anchor="middle" font-size="9.5" fill="#9c4221">invoices_needing_reminder() and</text><text x="620" y="135" text-anchor="middle" font-size="9.5" fill="#9c4221">wires it to email.</text><rect x="520" y="255" width="200" height="90" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" /><text x="620" y="278" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c53030">4. Testing</text><text x="620" y="297" text-anchor="middle" font-size="9.5" fill="#c53030">Unit tests check paid,</text><text x="620" y="311" text-anchor="middle" font-size="9.5" fill="#c53030">future, and overdue</text><text x="620" y="325" text-anchor="middle" font-size="9.5" fill="#c53030">invoices are handled right.</text><rect x="280" y="255" width="200" height="90" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="380" y="278" text-anchor="middle" font-size="12.5" font-weight="700" fill="#276749">5. Deployment</text><text x="380" y="297" text-anchor="middle" font-size="9.5" fill="#2f855a">Feature ships behind a</text><text x="380" y="311" text-anchor="middle" font-size="9.5" fill="#2f855a">flag, to a few customers</text><text x="380" y="325" text-anchor="middle" font-size="9.5" fill="#2f855a">first.</text><rect x="40" y="255" width="200" height="90" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5" /><text x="140" y="278" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">6. Maintenance</text><text x="140" y="297" text-anchor="middle" font-size="9.5" fill="#4a5568">Team watches for missed</text><text x="140" y="311" text-anchor="middle" font-size="9.5" fill="#4a5568">reminders and tunes the</text><text x="140" y="325" text-anchor="middle" font-size="9.5" fill="#4a5568">overdue threshold.</text><line x1="240" y1="110" x2="276" y2="110" stroke="#718096" stroke-width="2" /><polygon points="284 110 272 105 272 115" fill="#718096" /><line x1="480" y1="110" x2="516" y2="110" stroke="#718096" stroke-width="2" /><polygon points="524 110 512 105 512 115" fill="#718096" /><line x1="620" y1="155" x2="620" y2="251" stroke="#718096" stroke-width="2" /><polygon points="620 259 615 247 625 247" fill="#718096" /><line x1="516" y1="300" x2="484" y2="300" stroke="#718096" stroke-width="2" /><polygon points="476 300 488 295 488 305" fill="#718096" /><line x1="276" y1="300" x2="244" y2="300" stroke="#718096" stroke-width="2" /><polygon points="236 300 248 295 248 305" fill="#718096" /><path d="M40 290C15 290 15 120 40 120" fill="none" stroke="#ed8936" stroke-width="2" stroke-dasharray="5 4" /><polygon points="40 120 28 115 28 125" fill="#ed8936" /><text x="14" y="210" text-anchor="middle" font-size="9.5" fill="#c05621" transform="rotate(-90 14 210)">feeds the next cycle</text><rect x="150" y="380" width="460" height="56" rx="10" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5" /><text x="380" y="403" text-anchor="middle" font-size="10.5" fill="#4a5568">The six phases run in order once, but the whole cycle repeats:</text><text x="380" y="421" text-anchor="middle" font-size="10.5" fill="#4a5568">maintenance findings become next cycle's requirements.</text></svg>