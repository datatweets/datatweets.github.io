<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="800" height="400" fill="#ffffff" /><text x="400" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The escalation feature: one sprint, six SDLC phases</text><line x1="75" y1="78" x2="75" y2="120" stroke="#9f7aea" stroke-width="1.5" stroke-dasharray="3 2" /><polygon points="75 64 88 78 62 78" fill="#9f7aea" /><text x="75" y="56" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6b46c1">Sprint Planning</text><line x1="199" y1="86" x2="199" y2="120" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="2 2" /><circle cx="199" cy="80" r="4" fill="#a0aec0" /><line x1="323" y1="86" x2="323" y2="120" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="2 2" /><circle cx="323" cy="80" r="4" fill="#a0aec0" /><line x1="447" y1="86" x2="447" y2="120" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="2 2" /><circle cx="447" cy="80" r="4" fill="#a0aec0" /><line x1="199" y1="80" x2="447" y2="80" stroke="#a0aec0" stroke-width="1" stroke-dasharray="1 3" /><text x="323" y="56" text-anchor="middle" font-size="9.5" font-weight="700" fill="#718096">Daily Standups (15 min)</text><line x1="571" y1="78" x2="571" y2="120" stroke="#48bb78" stroke-width="1.5" stroke-dasharray="3 2" /><polygon points="571 64 584 78 558 78" fill="#48bb78" /><text x="571" y="56" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">Sprint Review + Retro</text><rect x="20" y="120" width="110" height="82" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="75" y="144" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">Requirements</text><text x="75" y="163" text-anchor="middle" font-size="8.5" fill="#3182ce">escalate once an</text><text x="75" y="176" text-anchor="middle" font-size="8.5" fill="#3182ce">invoice hits 7 days</text><text x="75" y="189" text-anchor="middle" font-size="8.5" fill="#3182ce">overdue (Stage 1)</text><polygon points="130 161 144 156 144 166" fill="#a0aec0" /><rect x="144" y="120" width="110" height="82" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="199" y="144" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b46c1">Design</text><text x="199" y="163" text-anchor="middle" font-size="8.5" fill="#805ad5">OverdueInvoiceNotifier</text><text x="199" y="176" text-anchor="middle" font-size="8.5" fill="#805ad5">depends only on two</text><text x="199" y="189" text-anchor="middle" font-size="8.5" fill="#805ad5">abstractions</text><polygon points="254 161 268 156 268 166" fill="#a0aec0" /><rect x="268" y="120" width="110" height="82" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="323" y="144" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">Implementation</text><text x="323" y="163" text-anchor="middle" font-size="8.5" fill="#2f855a">build the classes,</text><text x="323" y="176" text-anchor="middle" font-size="8.5" fill="#2f855a">wire up the Email</text><text x="323" y="189" text-anchor="middle" font-size="8.5" fill="#2f855a">adapter (Stage 4)</text><polygon points="378 161 392 156 392 166" fill="#a0aec0" /><rect x="392" y="120" width="110" height="82" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" /><text x="447" y="144" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c53030">Testing</text><text x="447" y="163" text-anchor="middle" font-size="8.5" fill="#e53e3e">a fake notification</text><text x="447" y="176" text-anchor="middle" font-size="8.5" fill="#e53e3e">service checks logic</text><text x="447" y="189" text-anchor="middle" font-size="8.5" fill="#e53e3e">with no real email</text><polygon points="502 161 516 156 516 166" fill="#a0aec0" /><rect x="516" y="120" width="110" height="82" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="571" y="144" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">Deployment</text><text x="571" y="163" text-anchor="middle" font-size="8.5" fill="#3182ce">ships behind a flag,</text><text x="571" y="176" text-anchor="middle" font-size="8.5" fill="#3182ce">two beta customers</text><text x="571" y="189" text-anchor="middle" font-size="8.5" fill="#3182ce">see it first</text><line x1="626" y1="161" x2="654" y2="161" stroke="#ed8936" stroke-width="1.8" stroke-dasharray="4 3" /><polygon points="654 161 644 156 644 166" fill="#ed8936" /><rect x="656" y="120" width="120" height="82" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" stroke-dasharray="5 3" /><text x="716" y="144" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c05621">Maintenance</text><text x="716" y="163" text-anchor="middle" font-size="8.5" fill="#9c4221">watch complaint</text><text x="716" y="176" text-anchor="middle" font-size="8.5" fill="#9c4221">rate, tune wording</text><text x="716" y="189" text-anchor="middle" font-size="8.5" fill="#9c4221">or the threshold</text><path d="M20 222L20 232L626 232L626 222" fill="none" stroke="#4a5568" stroke-width="1.5" /><text x="323" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#1a202c">Sprint 8 — two weeks (Jul 6 to Jul 17)</text><text x="716" y="222" text-anchor="middle" font-size="9" fill="#c05621">continues after the sprint ends</text><text x="400" y="300" text-anchor="middle" font-size="10.5" fill="#718096">The six SDLC phases still run in order for this one feature;</text><text x="400" y="317" text-anchor="middle" font-size="10.5" fill="#718096">Scrum just fits requirements through deployment inside a fixed two-week box,</text><text x="400" y="334" text-anchor="middle" font-size="10.5" fill="#718096">while maintenance keeps running after the sprint closes.</text></svg>