<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="960" height="460" fill="#ffffff" /><text x="480" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">From one commit to production: shipping a Ledgerly feature safely</text><rect x="10" y="150" width="140" height="90" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" /><text x="80" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">Commit</text><text x="80" y="200" text-anchor="middle" font-size="11" fill="#2b6cb0">staged, then</text><text x="80" y="214" text-anchor="middle" font-size="11" fill="#2b6cb0">committed</text><rect x="170" y="150" width="140" height="90" rx="8" fill="#f7fafc" stroke="#718096" stroke-width="2" /><text x="240" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#4a5568">Push</text><text x="240" y="200" text-anchor="middle" font-size="11" fill="#4a5568">triggers the CI</text><text x="240" y="214" text-anchor="middle" font-size="11" fill="#4a5568">pipeline</text><rect x="330" y="150" width="140" height="90" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="2" /><text x="400" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">Run test</text><text x="400" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">suite</text><text x="400" y="220" text-anchor="middle" font-size="11" fill="#c05621">CI job: test</text><rect x="490" y="150" width="140" height="90" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="2" /><text x="560" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">Security</text><text x="560" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">lint</text><text x="560" y="220" text-anchor="middle" font-size="11" fill="#c05621">CI job: security-lint</text><rect x="650" y="150" width="140" height="90" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="720" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">Manual</text><text x="720" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">approval</text><text x="720" y="212" text-anchor="middle" font-size="11" fill="#6b46c1">a reviewer clicks</text><text x="720" y="225" text-anchor="middle" font-size="11" fill="#6b46c1">Deploy</text><rect x="810" y="150" width="140" height="90" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="880" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">Production</text><text x="880" y="200" text-anchor="middle" font-size="11" fill="#276749">Ledgerly feature</text><text x="880" y="214" text-anchor="middle" font-size="11" fill="#276749">goes live</text><g stroke="#4a5568" stroke-width="2" fill="none"><line x1="150" y1="195" x2="166" y2="195" /><line x1="310" y1="195" x2="326" y2="195" /><line x1="470" y1="195" x2="486" y2="195" /><line x1="630" y1="195" x2="646" y2="195" /><line x1="790" y1="195" x2="806" y2="195" /></g><g fill="#4a5568"><polygon points="166 195 156 190 156 200" /><polygon points="326 195 316 190 316 200" /><polygon points="486 195 476 190 476 200" /><polygon points="646 195 636 190 636 200" /><polygon points="806 195 796 190 796 200" /></g><path d="M330 250L330 260L630 260L630 250" stroke="#c05621" stroke-width="2" fill="none" /><text x="480" y="276" text-anchor="middle" font-size="12" fill="#c05621">runs automatically, no human step</text><path d="M650 250L650 260L950 260L950 250" stroke="#6b46c1" stroke-width="2" fill="none" /><text x="800" y="276" text-anchor="middle" font-size="12" fill="#6b46c1">continuous delivery: a human approves before deploy</text><path d="M560 240C560 330 80 330 80 242" stroke="#fc8181" stroke-width="2" fill="none" stroke-dasharray="6,5" /><polygon points="80 242 75 230 86 232" fill="#fc8181" /><text x="320" y="345" text-anchor="middle" font-size="12" fill="#c53030">if a test or the security lint fails: fix the code and commit again</text><text x="480" y="400" text-anchor="middle" font-size="12" fill="#718096">Version control, an automated CI pipeline, and a human approval step work together: nothing reaches</text><text x="480" y="418" text-anchor="middle" font-size="12" fill="#718096">production unless the tests pass, the security lint is clean, and a reviewer approves the deploy.</text></svg>