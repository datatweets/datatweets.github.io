<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><defs><marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#718096" /></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c53030" /></marker></defs><rect x="0" y="0" width="1120" height="640" fill="#ffffff" /><text x="560" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">CI/CD Pipeline Flow: From Commit to Production</text><text x="560" y="54" text-anchor="middle" font-size="13" fill="#718096">How one Ledgerly commit moves through automated stages before it reaches a customer</text><rect x="15" y="80" width="720" height="96" rx="8" fill="none" stroke="#4299e1" stroke-width="1.5" stroke-dasharray="6,4" /><text x="375" y="72" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b6cb0" letter-spacing="0.5">CONTINUOUS INTEGRATION</text><rect x="30" y="95" width="150" height="70" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="2" /><text x="105" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#4a5568">Commit &amp; Push</text><text x="105" y="143" text-anchor="middle" font-size="11" fill="#718096">git push origin main</text><line x1="180" y1="130" x2="204" y2="130" stroke="#718096" stroke-width="2" marker-end="url(#arrowGray)" /><rect x="210" y="95" width="150" height="70" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" /><text x="285" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">Lint</text><text x="285" y="143" text-anchor="middle" font-size="11" fill="#2b6cb0">flake8, black --check</text><line x1="360" y1="130" x2="384" y2="130" stroke="#718096" stroke-width="2" marker-end="url(#arrowGray)" /><rect x="390" y="95" width="150" height="70" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="465" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">Unit Tests</text><text x="465" y="143" text-anchor="middle" font-size="11" fill="#276749">pytest test_pricing.py</text><line x1="540" y1="130" x2="564" y2="130" stroke="#718096" stroke-width="2" marker-end="url(#arrowGray)" /><rect x="570" y="95" width="150" height="70" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" /><text x="645" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">Build Package</text><text x="645" y="143" text-anchor="middle" font-size="11" fill="#2b6cb0">produce a versioned artifact</text><path d="M465 165L465 215L105 215L105 179" fill="none" stroke="#c53030" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowRed)" /><text x="285" y="209" text-anchor="middle" font-size="11.5" fill="#c53030">A failing stage stops the pipeline and sends the developer back to fix the code</text><line x1="645" y1="165" x2="645" y2="284" stroke="#718096" stroke-width="2" marker-end="url(#arrowGray)" /><rect x="555" y="275" width="555" height="96" rx="8" fill="none" stroke="#9f7aea" stroke-width="1.5" stroke-dasharray="6,4" /><text x="832" y="267" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b46c1" letter-spacing="0.5">CONTINUOUS DELIVERY (or DEPLOYMENT)</text><rect x="570" y="290" width="150" height="70" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="645" y="317" text-anchor="middle" font-size="13.5" font-weight="700" fill="#276749">Deploy to</text><text x="645" y="334" text-anchor="middle" font-size="13.5" font-weight="700" fill="#276749">Staging</text><text x="645" y="350" text-anchor="middle" font-size="10.5" fill="#276749">runs automatically</text><line x1="720" y1="325" x2="740" y2="325" stroke="#718096" stroke-width="2" marker-end="url(#arrowGray)" /><rect x="745" y="290" width="160" height="70" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="2" /><text x="825" y="317" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">Manual</text><text x="825" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">Approval Gate</text><text x="825" y="350" text-anchor="middle" font-size="10.5" fill="#c05621">present only in delivery</text><line x1="905" y1="325" x2="925" y2="325" stroke="#718096" stroke-width="2" marker-end="url(#arrowGray)" /><rect x="930" y="290" width="160" height="70" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="1010" y="317" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6b46c1">Deploy to</text><text x="1010" y="334" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6b46c1">Production</text><text x="1010" y="350" text-anchor="middle" font-size="10.5" fill="#6b46c1">live for customers</text><text x="832" y="410" text-anchor="middle" font-size="12" fill="#4a5568">Continuous delivery: a person clicks "Approve" before this last step runs.</text><text x="832" y="428" text-anchor="middle" font-size="12" fill="#4a5568">Continuous deployment: this last step runs on its own, with no approval click.</text><rect x="40" y="560" width="1040" height="52" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="560" y="581" text-anchor="middle" font-size="12.5" fill="#2b6cb0">Continuous integration (lint, test, build) runs automatically on every commit.</text><text x="560" y="600" text-anchor="middle" font-size="12.5" fill="#2b6cb0">Continuous delivery keeps a human gate before production; continuous deployment removes it.</text></svg>