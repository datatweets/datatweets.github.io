<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><defs><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c53030" /></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#276749" /></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#718096" /></marker></defs><rect x="0" y="0" width="900" height="520" fill="#ffffff" /><text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Same customer input, two different query designs</text><rect x="40" y="52" width="400" height="42" rx="6" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" /><text x="240" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#c53030">INSECURE: QUERY BUILT BY JOINING TEXT</text><rect x="460" y="52" width="400" height="42" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="660" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">SECURE: QUERY BUILT WITH A PLACEHOLDER</text><rect x="40" y="112" width="400" height="56" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5" /><text x="240" y="134" text-anchor="middle" font-size="13" fill="#4a5568">Customer submits an email address</text><text x="240" y="153" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1a202c">input: x' OR '1'='1</text><rect x="460" y="112" width="400" height="56" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5" /><text x="660" y="134" text-anchor="middle" font-size="13" fill="#4a5568">Customer submits an email address</text><text x="660" y="153" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1a202c">input: x' OR '1'='1</text><line x1="240" y1="168" x2="240" y2="192" stroke="#718096" stroke-width="2" marker-end="url(#arrow-gray)" /><line x1="660" y1="168" x2="660" y2="192" stroke="#718096" stroke-width="2" marker-end="url(#arrow-gray)" /><rect x="40" y="196" width="400" height="78" rx="6" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" /><text x="240" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">find_customer_by_email_unsafe()</text><text x="240" y="239" text-anchor="middle" font-size="13" fill="#742a2a">joins the text into the SQL command</text><text x="240" y="257" text-anchor="middle" font-size="13" fill="#742a2a">with an f-string</text><rect x="460" y="196" width="400" height="78" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="660" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">find_customer_by_email_safe()</text><text x="660" y="239" text-anchor="middle" font-size="13" fill="#22543d">passes the text as a separate</text><text x="660" y="257" text-anchor="middle" font-size="13" fill="#22543d">question-mark parameter</text><line x1="240" y1="274" x2="240" y2="298" stroke="#c53030" stroke-width="2" marker-end="url(#arrow-red)" /><line x1="660" y1="274" x2="660" y2="298" stroke="#276749" stroke-width="2" marker-end="url(#arrow-green)" /><rect x="40" y="302" width="400" height="78" rx="6" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" /><text x="240" y="326" text-anchor="middle" font-size="13" fill="#742a2a">SQLite executes the whole string,</text><text x="240" y="345" text-anchor="middle" font-size="13" fill="#742a2a">including OR '1'='1', as part</text><text x="240" y="363" text-anchor="middle" font-size="13" fill="#742a2a">of the command</text><rect x="460" y="302" width="400" height="78" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="660" y="326" text-anchor="middle" font-size="13" fill="#22543d">SQLite treats the text as one</text><text x="660" y="345" text-anchor="middle" font-size="13" fill="#22543d">plain value and compares it</text><text x="660" y="363" text-anchor="middle" font-size="13" fill="#22543d">literally to each email</text><line x1="240" y1="380" x2="240" y2="404" stroke="#c53030" stroke-width="2" marker-end="url(#arrow-red)" /><line x1="660" y1="380" x2="660" y2="404" stroke="#276749" stroke-width="2" marker-end="url(#arrow-green)" /><rect x="40" y="408" width="400" height="58" rx="6" fill="#fc8181" stroke="#c53030" stroke-width="1.5" /><text x="240" y="443" text-anchor="middle" font-size="14" font-weight="700" fill="#fff5f5">Result: all 3 customer rows returned</text><rect x="460" y="408" width="400" height="58" rx="6" fill="#48bb78" stroke="#276749" stroke-width="1.5" /><text x="660" y="443" text-anchor="middle" font-size="14" font-weight="700" fill="#f0fff4">Result: 0 rows returned, no leak</text><text x="450" y="498" text-anchor="middle" font-size="13" fill="#718096">Same customer input, two different code paths, two very different outcomes.</text></svg>