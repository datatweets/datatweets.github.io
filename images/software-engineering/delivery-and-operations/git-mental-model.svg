<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="920" height="420" fill="#ffffff" /><text x="460" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">Three stops for every change in Ledgerly’s code</text><text x="460" y="56" text-anchor="middle" font-size="13" fill="#718096">Working directory → staging area → commit history</text><rect x="30" y="90" width="240" height="260" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="2" /><text x="150" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#4a5568">Working Directory</text><text x="150" y="136" text-anchor="middle" font-size="11" fill="#718096">(modified)</text><rect x="55" y="155" width="190" height="70" rx="6" fill="#ffffff" stroke="#a0aec0" stroke-width="1.5" /><text x="150" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#1a202c">invoice.py</text><text x="150" y="196" text-anchor="middle" font-size="10.5" fill="#4a5568">+ apply_late_fee()</text><text x="150" y="211" text-anchor="middle" font-size="10.5" fill="#4a5568">edited, not yet staged</text><rect x="55" y="240" width="190" height="80" rx="6" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" /><text x="150" y="262" text-anchor="middle" font-size="11" font-weight="600" fill="#c53030">git status shows:</text><text x="150" y="280" text-anchor="middle" font-size="10" fill="#742a2a">modified: invoice.py</text><text x="150" y="296" text-anchor="middle" font-size="10" fill="#742a2a">not staged for commit</text><line x1="272" y1="200" x2="336" y2="200" stroke="#4a5568" stroke-width="2.5" /><polygon points="336 200 322 193 322 207" fill="#4a5568" /><text x="304" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">git add</text><rect x="340" y="90" width="240" height="260" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" /><text x="460" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#2b6cb0">Staging Area</text><text x="460" y="136" text-anchor="middle" font-size="11" fill="#2b6cb0">(staged)</text><rect x="365" y="155" width="190" height="70" rx="6" fill="#ffffff" stroke="#4299e1" stroke-width="1.5" /><text x="460" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#1a202c">invoice.py</text><text x="460" y="196" text-anchor="middle" font-size="10.5" fill="#2b6cb0">+ apply_late_fee()</text><text x="460" y="211" text-anchor="middle" font-size="10.5" fill="#2b6cb0">marked for the next commit</text><rect x="365" y="240" width="190" height="80" rx="6" fill="#ffffff" stroke="#4299e1" stroke-width="1.5" /><text x="460" y="262" text-anchor="middle" font-size="11" font-weight="600" fill="#2b6cb0">git status shows:</text><text x="460" y="280" text-anchor="middle" font-size="10" fill="#2c5282">changes to be committed:</text><text x="460" y="296" text-anchor="middle" font-size="10" fill="#2c5282">modified: invoice.py</text><line x1="582" y1="200" x2="646" y2="200" stroke="#4a5568" stroke-width="2.5" /><polygon points="646 200 632 193 632 207" fill="#4a5568" /><text x="614" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">git commit</text><rect x="650" y="70" width="240" height="300" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="770" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#276749">Commit History</text><text x="770" y="116" text-anchor="middle" font-size="11" fill="#276749">(committed, permanent)</text><circle cx="770" cy="160" r="10" fill="#48bb78" stroke="#276749" stroke-width="1.5" /><line x1="770" y1="170" x2="770" y2="215" stroke="#276749" stroke-width="2" /><text x="790" y="155" font-size="10.5" font-weight="600" fill="#1a202c">a3a0b28</text><text x="790" y="169" font-size="10" fill="#4a5568">Add Invoice class with</text><text x="790" y="181" font-size="10" fill="#4a5568">due amount tracking</text><circle cx="770" cy="225" r="10" fill="#48bb78" stroke="#276749" stroke-width="1.5" /><text x="790" y="220" font-size="10.5" font-weight="600" fill="#1a202c">e91f2ac</text><text x="790" y="234" font-size="10" fill="#4a5568">Add late fee calculation</text><text x="790" y="246" font-size="10" fill="#4a5568">to Invoice</text><rect x="675" y="270" width="190" height="80" rx="6" fill="#ffffff" stroke="#48bb78" stroke-width="1.5" /><text x="770" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#276749">Each commit stores:</text><text x="770" y="309" text-anchor="middle" font-size="10" fill="#2f855a">a snapshot, author, date,</text><text x="770" y="324" text-anchor="middle" font-size="10" fill="#2f855a">message, and parent commit</text><text x="460" y="400" text-anchor="middle" font-size="11" fill="#718096">git add moves a change into staging; git commit turns staged changes into a permanent, named snapshot.</text></svg>