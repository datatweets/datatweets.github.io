  <text x="515" y="374" text-anchor="middle" font-size="13" font-family="monospace" fill="#1a202c">$8,994,811.59</text>
  <text x="515" y="394" text-anchor="middle" font-size="8" fill="#7b341e">$200,232.03 refunded (2.18%) -- a different question</text>
</svg>
