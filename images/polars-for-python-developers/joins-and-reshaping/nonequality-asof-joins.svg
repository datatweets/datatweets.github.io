<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="460" fill="#ffffff" />
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Non-Equality and As-Of Joins</text>
  <text x="360" y="44" text-anchor="middle" font-size="10.5" fill="#4a5568">Real Thistlewood order items and returns matched to promotions</text>

  <text x="360" y="64" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a202c">join_where() -- every real condition must hold</text>

  <rect x="48" y="74" width="190" height="50" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="143" y="96" text-anchor="middle" font-size="9" font-family="monospace" fill="#2b6cb0">category ==</text>
  <text x="143" y="110" text-anchor="middle" font-size="9" font-family="monospace" fill="#2b6cb0">category_right</text>

  <rect x="253" y="74" width="190" height="50" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="348" y="96" text-anchor="middle" font-size="9" font-family="monospace" fill="#2b6cb0">order_date &gt;=</text>
  <text x="348" y="110" text-anchor="middle" font-size="9" font-family="monospace" fill="#2b6cb0">start_date</text>

  <rect x="458" y="74" width="190" height="50" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="553" y="96" text-anchor="middle" font-size="9" font-family="monospace" fill="#2b6cb0">order_date &lt;=</text>
  <text x="553" y="110" text-anchor="middle" font-size="9" font-family="monospace" fill="#2b6cb0">end_date</text>

  <line x1="143" y1="124" x2="300" y2="150" stroke="#a0aec0" stroke-width="1.3" />
  <line x1="348" y1="124" x2="360" y2="150" stroke="#a0aec0" stroke-width="1.3" />
  <line x1="553" y1="124" x2="420" y2="150" stroke="#a0aec0" stroke-width="1.3" />

  <rect x="160" y="150" width="400" height="42" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="360" y="176" text-anchor="middle" font-size="10" font-family="monospace" fill="#276749">745 of 14,054 real order-item rows matched (inner only)</text>

  <text x="360" y="220" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a202c">join_asof(strategy="backward") -- nearest prior promo start, by category</text>

  <line x1="60" y1="248" x2="660" y2="248" stroke="#a0aec0" stroke-width="1.4" />
  <polygon points="180,240 186,248 174,248" fill="#4299e1" />
  <text x="180" y="234" text-anchor="middle" font-size="8" fill="#2b6cb0">promo start</text>
  <polygon points="420,240 426,248 414,248" fill="#4299e1" />
  <text x="420" y="234" text-anchor="middle" font-size="8" fill="#2b6cb0">promo start</text>
  <circle cx="480" cy="248" r="5" fill="#ed8936" />
  <text x="480" y="266" text-anchor="middle" font-size="8" fill="#9c4221">return_date</text>
  <line x1="475" y1="248" x2="425" y2="248" stroke="#ed8936" stroke-width="1.3" stroke-dasharray="4,3" />
  <text x="452" y="280" text-anchor="middle" font-size="7.5" fill="#9c4221">nearest backward match</text>

  <rect x="45" y="296" width="190" height="80" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.4" />
  <text x="140" y="318" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">no prior promo at all</text>
  <text x="140" y="342" text-anchor="middle" font-size="13" font-family="monospace" fill="#1a202c">239</text>
  <text x="140" y="362" text-anchor="middle" font-size="8" fill="#c53030">real returns</text>

  <rect x="255" y="296" width="210" height="80" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="360" y="318" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9c4221">matched -- already expired</text>
  <text x="360" y="342" text-anchor="middle" font-size="13" font-family="monospace" fill="#1a202c">179</text>
  <text x="360" y="362" text-anchor="middle" font-size="8" fill="#9c4221">real returns</text>

  <rect x="485" y="296" width="190" height="80" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="580" y="318" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">matched -- still active</text>
  <text x="580" y="342" text-anchor="middle" font-size="13" font-family="monospace" fill="#1a202c">32</text>
  <text x="580" y="362" text-anchor="middle" font-size="8" fill="#276749">real returns</text>

  <rect x="190" y="392" width="340" height="40" rx="8" fill="#f7fafc" stroke="#4a5568" stroke-width="1.3" />
  <text x="360" y="416" text-anchor="middle" font-size="10" font-family="monospace" fill="#1a202c">239 + 179 + 32 = 450 real returns</text>
</svg>
