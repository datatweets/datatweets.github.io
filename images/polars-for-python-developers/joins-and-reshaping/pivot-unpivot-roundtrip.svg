<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="460" fill="#ffffff" />
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Pivoting and Unpivoting Data</text>
  <text x="360" y="44" text-anchor="middle" font-size="10.5" fill="#4a5568">Real category-by-channel revenue, reshaped and reversed</text>

  <text x="360" y="76" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#276749">.pivot(on="channel", values="revenue")</text>
  <line x1="230" y1="86" x2="490" y2="86" stroke="#48bb78" stroke-width="1.6" />
  <line x1="230" y1="86" x2="230" y2="100" stroke="#48bb78" stroke-width="1.6" />
  <line x1="490" y1="86" x2="490" y2="100" stroke="#48bb78" stroke-width="1.6" />

  <rect x="40" y="100" width="190" height="86" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="135" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">long-form</text>
  <text x="135" y="144" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#1a202c">24 real rows</text>
  <text x="135" y="164" text-anchor="middle" font-size="8" fill="#2b6cb0">category, channel, revenue</text>

  <rect x="490" y="100" width="190" height="86" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="585" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">wide-form</text>
  <text x="585" y="144" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#1a202c">8 rows x 3 cols</text>
  <text x="585" y="164" text-anchor="middle" font-size="8" fill="#2b6cb0">phone / store / web columns</text>

  <line x1="230" y1="186" x2="230" y2="200" stroke="#9f7aea" stroke-width="1.6" />
  <line x1="230" y1="200" x2="490" y2="200" stroke="#9f7aea" stroke-width="1.6" />
  <line x1="490" y1="186" x2="490" y2="200" stroke="#9f7aea" stroke-width="1.6" />
  <text x="360" y="214" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#6b46c1">.unpivot(variable_name="channel", value_name="revenue")</text>

  <rect x="185" y="234" width="350" height="52" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="360" y="255" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">round trip recovers the exact real long-form table</text>
  <text x="360" y="274" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#1a202c">back_to_long.equals(by_category_channel) -&gt; True</text>

  <rect x="110" y="306" width="500" height="106" rx="10" fill="#f7fafc" stroke="#4a5568" stroke-width="1.3" />
  <text x="360" y="330" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a202c">The real grand total survives both shapes</text>
  <text x="360" y="354" text-anchor="middle" font-size="10" font-family="monospace" fill="#1a202c">real long-form sum:  $9,195,043.62</text>
  <text x="360" y="372" text-anchor="middle" font-size="10" font-family="monospace" fill="#1a202c">real wide-form sum:  $9,195,043.62</text>
  <text x="360" y="394" text-anchor="middle" font-size="9" fill="#2d3748">both match the real Module 7 grand total exactly</text>
</svg>
