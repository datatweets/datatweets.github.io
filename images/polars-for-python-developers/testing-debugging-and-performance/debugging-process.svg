<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="420" fill="#ffffff" />
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">A Debugging Process</text>
  <text x="360" y="46" text-anchor="middle" font-size="10.5" fill="#4a5568">The same four-step loop diagnosed a query-plan bug and a two-character string mismatch</text>

  <rect x="30" y="76" width="150" height="110" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="105" y="98" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">1. Notice</text>
  <text x="105" y="120" text-anchor="middle" font-size="8.5" fill="#1a202c">A number looks</text>
  <text x="105" y="134" text-anchor="middle" font-size="8.5" fill="#1a202c">suspicious --</text>
  <text x="105" y="150" text-anchor="middle" font-size="8.5" fill="#1a202c">wrong row count,</text>
  <text x="105" y="164" text-anchor="middle" font-size="8.5" fill="#1a202c">wrong total</text>

  <rect x="200" y="76" width="150" height="110" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" />
  <text x="275" y="98" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">2. Reconcile</text>
  <text x="275" y="120" text-anchor="middle" font-size="8.5" fill="#1a202c">Compare against</text>
  <text x="275" y="134" text-anchor="middle" font-size="8.5" fill="#1a202c">a known total or</text>
  <text x="275" y="150" text-anchor="middle" font-size="8.5" fill="#1a202c">an expected row</text>
  <text x="275" y="164" text-anchor="middle" font-size="8.5" fill="#1a202c">count</text>

  <rect x="370" y="76" width="150" height="110" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="445" y="98" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9c4221">3. Explain</text>
  <text x="445" y="120" text-anchor="middle" font-size="8.5" fill="#1a202c">Read .explain()</text>
  <text x="445" y="134" text-anchor="middle" font-size="8.5" fill="#1a202c">for evidence of</text>
  <text x="445" y="150" text-anchor="middle" font-size="8.5" fill="#1a202c">what actually ran,</text>
  <text x="445" y="164" text-anchor="middle" font-size="8.5" fill="#1a202c">not what you assumed</text>

  <rect x="540" y="76" width="150" height="110" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="615" y="98" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">4. Isolate</text>
  <text x="615" y="120" text-anchor="middle" font-size="8.5" fill="#1a202c">Strip the query</text>
  <text x="615" y="134" text-anchor="middle" font-size="8.5" fill="#1a202c">to the smallest</text>
  <text x="615" y="150" text-anchor="middle" font-size="8.5" fill="#1a202c">case that still</text>
  <text x="615" y="164" text-anchor="middle" font-size="8.5" fill="#1a202c">shows the bug</text>

  <line x1="180" y1="130" x2="200" y2="130" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="350" y1="130" x2="370" y2="130" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="520" y1="130" x2="540" y2="130" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M615,186 L615,214 L105,214 L105,196" fill="none" stroke="#a0aec0" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <text x="360" y="210" text-anchor="middle" font-size="8.5" fill="#718096">fix, then re-verify</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#a0aec0" />
    </marker>
  </defs>

  <rect x="30" y="240" width="330" height="140" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.2" />
  <text x="195" y="262" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a202c">Case 1: pre_partition_hive</text>
  <text x="195" y="282" text-anchor="middle" font-size="9" fill="#4a5568">288 rows, $110,340,523.44 (12x too high)</text>
  <text x="195" y="300" text-anchor="middle" font-size="9" fill="#4a5568">isolated to group_by("year") alone</text>
  <text x="195" y="318" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">fixed: 24 rows, $9,195,043.62</text>
  <text x="195" y="342" text-anchor="middle" font-size="8" fill="#718096">UNION of 24 near-duplicate PLAN blocks</text>
  <text x="195" y="356" text-anchor="middle" font-size="8" fill="#718096">visible in .explain() before the fix</text>

  <rect x="380" y="240" width="310" height="140" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.2" />
  <text x="535" y="262" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a202c">Cases 2 &amp; 3: two more gotchas</text>
  <text x="535" y="284" text-anchor="middle" font-size="9" fill="#4a5568">!= "Boston" silently drops all 9</text>
  <text x="535" y="298" text-anchor="middle" font-size="9" fill="#4a5568">null-city rows (786 vs 795 expected)</text>
  <text x="535" y="322" text-anchor="middle" font-size="9" fill="#4a5568">"Bath " (5 chars) vs "Bath" (4 chars)</text>
  <text x="535" y="336" text-anchor="middle" font-size="9" fill="#4a5568">breaks a join -- invisible when printed</text>
  <text x="535" y="358" text-anchor="middle" font-size="8" fill="#718096">both caught by the same 4-step process</text>
</svg>
