<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="460" fill="#ffffff" />
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">build_tested_benchmarked_pipeline()</text>
  <text x="360" y="46" text-anchor="middle" font-size="10.5" fill="#4a5568">One pipeline, three layers, one shared reconciliation</text>

  <rect x="260" y="66" width="200" height="70" rx="10" fill="#edf2f7" stroke="#4a5568" stroke-width="1.4" />
  <text x="360" y="90" text-anchor="middle" font-size="10" font-weight="700" fill="#1a202c">The pipeline</text>
  <text x="360" y="108" text-anchor="middle" font-size="8.5" fill="#4a5568">72-row monthly-channel</text>
  <text x="360" y="122" text-anchor="middle" font-size="8.5" fill="#4a5568">revenue summary</text>

  <line x1="360" y1="136" x2="360" y2="160" stroke="#a0aec0" stroke-width="1.6" />

  <rect x="30" y="160" width="200" height="110" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="130" y="184" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">Layer 1: Testing</text>
  <text x="130" y="204" text-anchor="middle" font-size="8.5" fill="#1a202c">5-test pytest suite</text>
  <text x="130" y="220" text-anchor="middle" font-size="8.5" fill="#1a202c">row count, reconciliation,</text>
  <text x="130" y="236" text-anchor="middle" font-size="8.5" fill="#1a202c">duplicates, nulls</text>
  <text x="130" y="256" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">5 passed</text>

  <rect x="260" y="160" width="200" height="110" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="360" y="184" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9c4221">Layer 2: Debugging</text>
  <text x="360" y="204" text-anchor="middle" font-size="8.5" fill="#1a202c">4-item checklist, applied</text>
  <text x="360" y="220" text-anchor="middle" font-size="8.5" fill="#1a202c">as a standing habit --</text>
  <text x="360" y="236" text-anchor="middle" font-size="8.5" fill="#1a202c">not a reaction to a bug</text>
  <text x="360" y="256" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">4 of 4 confirmed</text>

  <rect x="490" y="160" width="200" height="110" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" />
  <text x="590" y="184" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">Layer 3: Benchmark</text>
  <text x="590" y="204" text-anchor="middle" font-size="8.5" fill="#1a202c">time.perf_counter(),</text>
  <text x="590" y="220" text-anchor="middle" font-size="8.5" fill="#1a202c">5 runs, no speed</text>
  <text x="590" y="236" text-anchor="middle" font-size="8.5" fill="#1a202c">assertion</text>
  <text x="590" y="256" text-anchor="middle" font-size="9" font-weight="700" fill="#6b46c1">median: ~5.1 ms</text>

  <line x1="130" y1="270" x2="130" y2="300" stroke="#a0aec0" stroke-width="1.6" />
  <line x1="360" y1="270" x2="360" y2="300" stroke="#a0aec0" stroke-width="1.6" />
  <line x1="590" y1="270" x2="590" y2="300" stroke="#a0aec0" stroke-width="1.6" />
  <line x1="130" y1="300" x2="590" y2="300" stroke="#a0aec0" stroke-width="1.6" />
  <line x1="360" y1="300" x2="360" y2="316" stroke="#a0aec0" stroke-width="1.8" marker-end="url(#arrow3)" />

  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#a0aec0" />
    </marker>
  </defs>

  <rect x="60" y="316" width="600" height="90" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="360" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">All three layers reconcile to the same numbers</text>
  <text x="360" y="364" text-anchor="middle" font-size="9.5" fill="#22543d">revenue: $9,195,043.62 -- n_orders: 6,000 -- 24 months x 3 channels</text>
  <text x="360" y="384" text-anchor="middle" font-size="8.5" fill="#4a5568">the same grand total this course has reconciled to since Module 7</text>

  <text x="360" y="432" text-anchor="middle" font-size="8.5" fill="#718096">Round-tripped through thistlewood_test_output.db and reconciled once more, exactly</text>
</svg>
