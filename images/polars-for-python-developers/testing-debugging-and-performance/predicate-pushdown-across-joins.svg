<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="440" fill="#ffffff" />
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Predicate Pushdown Across Two Joins</text>
  <text x="360" y="46" text-anchor="middle" font-size="10.5" fill="#4a5568">A filter written last in the chain still lands on the scan it belongs to</text>

  <!-- three scans at bottom -->
  <rect x="30" y="76" width="200" height="100" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="130" y="98" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">Lake scan</text>
  <text x="130" y="116" text-anchor="middle" font-size="8.5" fill="#1a202c">12 of 24 files (year=2025)</text>
  <text x="130" y="134" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#1a202c">SELECTION: year == 2025</text>
  <text x="130" y="156" text-anchor="middle" font-size="8" fill="#718096">pushed to the scan it was</text>
  <text x="130" y="168" text-anchor="middle" font-size="8" fill="#718096">written against directly</text>

  <rect x="260" y="76" width="200" height="100" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.4" />
  <text x="360" y="98" text-anchor="middle" font-size="10" font-weight="700" fill="#c53030">order_items.csv scan</text>
  <text x="360" y="116" text-anchor="middle" font-size="8.5" fill="#1a202c">no SELECTION line</text>
  <text x="360" y="134" text-anchor="middle" font-size="8.5" fill="#1a202c">full scan: 13,825 est. rows</text>
  <text x="360" y="156" text-anchor="middle" font-size="8" fill="#718096">nothing in the query filters</text>
  <text x="360" y="168" text-anchor="middle" font-size="8" fill="#718096">an order_items column directly</text>

  <rect x="490" y="76" width="200" height="100" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" />
  <text x="590" y="98" text-anchor="middle" font-size="10" font-weight="700" fill="#6b46c1">products.csv scan</text>
  <text x="590" y="116" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#1a202c">SELECTION: category ==</text>
  <text x="590" y="130" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#1a202c">"Kitchen"</text>
  <text x="590" y="152" text-anchor="middle" font-size="8" fill="#718096">pushed here even though written</text>
  <text x="590" y="164" text-anchor="middle" font-size="8" fill="#718096">last, after both joins</text>

  <line x1="130" y1="176" x2="130" y2="210" stroke="#a0aec0" stroke-width="1.6" />
  <line x1="360" y1="176" x2="360" y2="210" stroke="#a0aec0" stroke-width="1.6" />
  <line x1="590" y1="176" x2="590" y2="210" stroke="#a0aec0" stroke-width="1.6" />
  <line x1="130" y1="210" x2="360" y2="210" stroke="#a0aec0" stroke-width="1.6" />
  <line x1="245" y1="210" x2="245" y2="236" stroke="#a0aec0" stroke-width="1.8" marker-end="url(#arrow2)" />

  <rect x="145" y="236" width="200" height="42" rx="8" fill="#edf2f7" stroke="#4a5568" stroke-width="1.2" />
  <text x="245" y="262" text-anchor="middle" font-size="9" font-weight="700" fill="#1a202c">INNER JOIN on order_id</text>

  <line x1="245" y1="278" x2="245" y2="300" stroke="#a0aec0" stroke-width="1.6" />
  <line x1="590" y1="210" x2="590" y2="300" stroke="#a0aec0" stroke-width="1.6" />
  <line x1="245" y1="300" x2="590" y2="300" stroke="#a0aec0" stroke-width="1.6" />
  <line x1="417" y1="300" x2="417" y2="326" stroke="#a0aec0" stroke-width="1.8" marker-end="url(#arrow2)" />

  <rect x="317" y="326" width="200" height="42" rx="8" fill="#edf2f7" stroke="#4a5568" stroke-width="1.2" />
  <text x="417" y="352" text-anchor="middle" font-size="9" font-weight="700" fill="#1a202c">INNER JOIN on product_id</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#a0aec0" />
    </marker>
  </defs>

  <text x="360" y="404" text-anchor="middle" font-size="10" font-weight="700" fill="#1a202c">Result: 1,007 rows -- readable from the plan before .collect() ever runs</text>
  <text x="360" y="422" text-anchor="middle" font-size="8.5" fill="#718096">A missing SELECTION line is information, not a bug: it shows where a query's filters don't reach</text>
</svg>
