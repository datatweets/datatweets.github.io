<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="460" fill="#ffffff" />
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Converting UTC to Each Customer's Local Time</text>
  <text x="360" y="46" text-anchor="middle" font-size="10.5" fill="#4a5568">22 real Thistlewood states mapped to 7 IANA zones</text>

  <rect x="30" y="66" width="300" height="56" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="180" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2b6cb0">order_timestamp_utc (Datetime, UTC)</text>
  <text x="180" y="104" text-anchor="middle" font-size="9" font-family="monospace" fill="#1a202c">joined to customers.state</text>

  <rect x="390" y="66" width="300" height="56" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" />
  <text x="540" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6b46c1">state -&gt; IANA zone (dict)</text>
  <text x="540" y="104" text-anchor="middle" font-size="9" font-family="monospace" fill="#1a202c">AZ-&gt;America/Phoenix, CO-&gt;America/Denver, ...</text>

  <line x1="360" y1="122" x2="360" y2="148" stroke="#a0aec0" stroke-width="1.4" />

  <rect x="60" y="148" width="600" height="60" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.4" />
  <text x="360" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c53030">dt.convert_time_zone(time_zone) takes one literal string, not a column</text>
  <text x="360" y="190" text-anchor="middle" font-size="9.5" fill="#742a2a">Fix: group rows by their target zone, convert each group with its own literal zone, recombine</text>

  <line x1="360" y1="208" x2="360" y2="234" stroke="#a0aec0" stroke-width="1.4" />

  <rect x="60" y="234" width="600" height="70" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="360" y="256" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9c4221">pl.concat() then fails: tz is part of the Datetime dtype</text>
  <text x="360" y="276" text-anchor="middle" font-size="9.5" fill="#7b341e">Datetime("us","America/Chicago") != Datetime("us","America/Boise") -- SchemaError</text>
  <text x="360" y="294" text-anchor="middle" font-size="9.5" fill="#7b341e">Fix: .dt.replace_time_zone(None) after converting -- keep a separate tz string column</text>

  <line x1="360" y1="304" x2="360" y2="330" stroke="#a0aec0" stroke-width="1.4" />

  <rect x="60" y="330" width="600" height="52" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="360" y="352" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">6,000 rows recombined, every one in its own customer's local time</text>
  <text x="360" y="368" text-anchor="middle" font-size="9.5" fill="#22543d">Vertical concat of naive local wall-clock columns + a separate tz label per row</text>

  <rect x="60" y="392" width="600" height="56" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="360" y="412" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">Arizona: fixed UTC-7 year-round, no DST</text>
  <text x="360" y="430" text-anchor="middle" font-size="9.5" fill="#2c5282">Colorado: UTC-7 (MST, Jan) shifts to UTC-6 (MDT, Jul) -- confirmed via zoneinfo and real orders</text>
</svg>
