<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="460" fill="#ffffff" />
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">.rank() -- A Real Tie, Three Real Methods</text>
  <text x="360" y="50" text-anchor="middle" font-size="10.5" fill="#4a5568">C0118 and C0160 both placed exactly 49 real Thistlewood orders</text>

  <rect x="230" y="66" width="260" height="40" rx="8" fill="#edf2f7" stroke="#4a5568" stroke-width="1.4" />
  <text x="360" y="91" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#1a202c">C0118: 49   C0160: 49   C0158: 46</text>

  <rect x="30" y="122" width="204" height="150" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="132" y="146" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">method="ordinal"</text>
  <text x="132" y="166" text-anchor="middle" font-size="9.5" fill="#2d3748">Breaks the tie into distinct ranks</text>
  <text x="50" y="192" font-size="10" font-family="monospace" fill="#1a202c">C0118 -&gt; rank 1</text>
  <text x="50" y="210" font-size="10" font-family="monospace" fill="#1a202c">C0160 -&gt; rank 2</text>
  <text x="50" y="228" font-size="10" font-family="monospace" fill="#1a202c">C0158 -&gt; rank 3</text>
  <text x="132" y="254" text-anchor="middle" font-size="9" fill="#2b6cb0">Never two rows share a rank</text>

  <rect x="258" y="122" width="204" height="150" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" />
  <text x="360" y="146" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b46c1">method="min"</text>
  <text x="360" y="166" text-anchor="middle" font-size="9.5" fill="#2d3748">Both get the lowest rank of the tie</text>
  <text x="278" y="192" font-size="10" font-family="monospace" fill="#1a202c">C0118 -&gt; rank 1</text>
  <text x="278" y="210" font-size="10" font-family="monospace" fill="#1a202c">C0160 -&gt; rank 1</text>
  <text x="278" y="228" font-size="10" font-family="monospace" fill="#1a202c">C0158 -&gt; rank 3 (skips 2)</text>
  <text x="360" y="254" text-anchor="middle" font-size="9" fill="#6b46c1">Next real rank leaves a gap</text>

  <rect x="486" y="122" width="204" height="150" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="588" y="146" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">method="dense"</text>
  <text x="588" y="166" text-anchor="middle" font-size="9.5" fill="#2d3748">Both share a rank, no gap follows</text>
  <text x="506" y="192" font-size="10" font-family="monospace" fill="#1a202c">C0118 -&gt; rank 1</text>
  <text x="506" y="210" font-size="10" font-family="monospace" fill="#1a202c">C0160 -&gt; rank 1</text>
  <text x="506" y="228" font-size="10" font-family="monospace" fill="#1a202c">C0158 -&gt; rank 2 (no skip)</text>
  <text x="588" y="254" text-anchor="middle" font-size="9" fill="#276749">Next real rank has no gap</text>

  <rect x="70" y="296" width="580" height="80" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="360" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#9c4221">Sharper still: a real 4-way tie at 45 orders</text>
  <text x="360" y="342" text-anchor="middle" font-size="9.5" fill="#7b341e">C0020, C0071, C0108, C0140 -- min jumps from rank 4 straight to rank 8;</text>
  <text x="360" y="360" text-anchor="middle" font-size="9.5" fill="#7b341e">dense moves from rank 3 to rank 4, one step, regardless of tie size.</text>

  <rect x="130" y="392" width="460" height="52" rx="10" fill="#f7fafc" stroke="#4a5568" stroke-width="1.3" />
  <text x="360" y="414" text-anchor="middle" font-size="10" font-weight="700" fill="#1a202c">Choosing a rank method is choosing what a tie means</text>
  <text x="360" y="430" text-anchor="middle" font-size="9" fill="#4a5568">Verified on a real tie the data contains, not a constructed example.</text>
</svg>
