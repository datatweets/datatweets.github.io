<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="1000" height="400" fill="#ffffff" />
  <text x="500" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The Capstone Pipeline: Six Verified Stages</text>
  <text x="500" y="44" text-anchor="middle" font-size="10.5" fill="#4a5568">Thistlewood Goods, Q1 2024 -- every stage checked against a known number before the next one begins</text>

  <rect x="40" y="66" width="140" height="112" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="110" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2b6cb0">1. Ingest</text>
  <text x="110" y="103" text-anchor="middle" font-size="8" fill="#1a202c">orders_raw.csv</text>
  <text x="110" y="123" text-anchor="middle" font-size="9" font-weight="700" fill="#2b6cb0">795 rows</text>
  <text x="110" y="142" text-anchor="middle" font-size="7.5" fill="#4a5568">4 known problems</text>

  <rect x="196" y="66" width="140" height="112" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" />
  <text x="266" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6b46c1">2. Clean</text>
  <text x="266" y="103" text-anchor="middle" font-size="8" fill="#1a202c">dedupe + parse + fix</text>
  <text x="266" y="123" text-anchor="middle" font-size="9" font-weight="700" fill="#6b46c1">792 rows</text>
  <text x="266" y="142" text-anchor="middle" font-size="7.5" fill="#4a5568">= canonical exactly</text>

  <rect x="352" y="66" width="140" height="112" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="422" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9c4221">3. Join</text>
  <text x="422" y="103" text-anchor="middle" font-size="8" fill="#1a202c">5 tables</text>
  <text x="422" y="123" text-anchor="middle" font-size="9" font-weight="700" fill="#9c4221">1,892 line items</text>
  <text x="422" y="142" text-anchor="middle" font-size="7.5" fill="#4a5568">0 unexpected fan-out</text>

  <rect x="508" y="66" width="140" height="112" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="578" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">4. Aggregate</text>
  <text x="578" y="103" text-anchor="middle" font-size="8" fill="#1a202c">category / channel</text>
  <text x="578" y="123" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">$1,171,856.43</text>
  <text x="578" y="142" text-anchor="middle" font-size="7.5" fill="#4a5568">matches Module 1</text>

  <rect x="664" y="66" width="140" height="112" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.4" />
  <text x="734" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">5. Write</text>
  <text x="734" y="103" text-anchor="middle" font-size="8" fill="#1a202c">Parquet + SQLite</text>
  <text x="734" y="123" text-anchor="middle" font-size="9" font-weight="700" fill="#c53030">2 files, 4 tables</text>
  <text x="734" y="142" text-anchor="middle" font-size="7.5" fill="#4a5568">round-trip verified</text>

  <rect x="820" y="66" width="140" height="112" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.4" />
  <text x="890" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2d3748">6. Report</text>
  <text x="890" y="103" text-anchor="middle" font-size="8" fill="#1a202c">733 completed orders</text>
  <text x="890" y="123" text-anchor="middle" font-size="9" font-weight="700" fill="#2d3748">8.87% return rate</text>
  <text x="890" y="142" text-anchor="middle" font-size="7.5" fill="#4a5568">for Thistlewood ops</text>

  <line x1="180" y1="122" x2="196" y2="122" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="336" y1="122" x2="352" y2="122" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="492" y1="122" x2="508" y2="122" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="648" y1="122" x2="664" y2="122" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="804" y1="122" x2="820" y2="122" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)" />
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#a0aec0" />
    </marker>
  </defs>

  <rect x="40" y="198" width="920" height="112" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="500" y="222" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">Two independent reconciliations, both exact</text>
  <text x="500" y="244" text-anchor="middle" font-size="9.5" fill="#22543d">Completed-order revenue $1,171,856.43 (733 orders, 1,749 line items) -- exactly Module 1 Lesson 5's own total, from a separate file</text>
  <text x="500" y="264" text-anchor="middle" font-size="9.5" fill="#22543d">All-status Q1 revenue $1,262,892.88 -- exactly Module 4 Lesson 6's order-item rollup, reproduced here for these same 792 orders</text>
  <text x="500" y="284" text-anchor="middle" font-size="8.5" fill="#4a5568">The cleaned file's own order-level total ($1,262,892.42) reproduces that lesson's already-explained 46-cent rounding gap</text>
  <text x="500" y="300" text-anchor="middle" font-size="8.5" fill="#4a5568">No new grand total was invented -- this capstone connects to numbers the course already proved</text>

  <rect x="40" y="322" width="920" height="56" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="500" y="346" text-anchor="middle" font-size="10" font-weight="700" fill="#9c4221">Idempotent by design</text>
  <text x="500" y="364" text-anchor="middle" font-size="8.5" fill="#4a5568">os.remove() runs before every Parquet/SQLite write, so re-running the pipeline never doubles a row or a table</text>
</svg>
