<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="420" fill="#ffffff" />
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Three Ways to Handle 6 Null Emails</text>

  <rect x="270" y="50" width="180" height="50" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" />
  <text x="360" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#1a202c">6 rows, email is null</text>
  <text x="360" y="88" text-anchor="middle" font-size="9" fill="#4a5568">city and quantity are real and fine</text>

  <line x1="270" y1="98" x2="170" y2="130" stroke="#a0aec0" stroke-width="1.3" />
  <line x1="360" y1="100" x2="360" y2="130" stroke="#a0aec0" stroke-width="1.3" />
  <line x1="450" y1="98" x2="550" y2="130" stroke="#a0aec0" stroke-width="1.3" />

  <rect x="60" y="132" width="220" height="110" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="170" y="156" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9c4221">drop_nulls(subset=["email"])</text>
  <text x="170" y="178" text-anchor="middle" font-size="9.5" fill="#2d3748">loses 6 whole rows of</text>
  <text x="170" y="194" text-anchor="middle" font-size="9.5" fill="#2d3748">real order data over</text>
  <text x="170" y="210" text-anchor="middle" font-size="9.5" fill="#2d3748">one missing field</text>
  <text x="170" y="230" text-anchor="middle" font-size="9.5" font-weight="600" fill="#9c4221">wrong here</text>

  <rect x="300" y="132" width="220" height="110" rx="10" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.4" />
  <text x="410" y="156" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c53030">fill_null("unknown@...")</text>
  <text x="410" y="178" text-anchor="middle" font-size="9.5" fill="#2d3748">6 different customers</text>
  <text x="410" y="194" text-anchor="middle" font-size="9.5" fill="#2d3748">would appear to share</text>
  <text x="410" y="210" text-anchor="middle" font-size="9.5" fill="#2d3748">one fake email</text>
  <text x="410" y="230" text-anchor="middle" font-size="9.5" font-weight="600" fill="#c53030">actively harmful</text>

  <rect x="540" y="132" width="220" height="110" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="650" y="156" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">join + pl.coalesce</text>
  <text x="650" y="178" text-anchor="middle" font-size="9.5" fill="#2d3748">recovers the real email</text>
  <text x="650" y="194" text-anchor="middle" font-size="9.5" fill="#2d3748">from thistlewood_</text>
  <text x="650" y="210" text-anchor="middle" font-size="9.5" fill="#2d3748">customers.csv</text>
  <text x="650" y="230" text-anchor="middle" font-size="9.5" font-weight="600" fill="#276749">real, verified, correct</text>

  <line x1="650" y1="242" x2="650" y2="270" stroke="#48bb78" stroke-width="1.3" marker-end="url(#r1)" />
  <defs>
    <marker id="r1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#48bb78"/></marker>
  </defs>

  <rect x="440" y="274" width="240" height="86" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="560" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">0 null emails</text>
  <text x="560" y="318" text-anchor="middle" font-size="9.5" fill="#2d3748">all 6 recovered values verified</text>
  <text x="560" y="334" text-anchor="middle" font-size="9.5" fill="#2d3748">to match the real customer record</text>

  <text x="360" y="392" text-anchor="middle" font-size="10.5" fill="#718096">The right fix isn't the fastest one to type -- it's checking whether the true</text>
  <text x="360" y="408" text-anchor="middle" font-size="10.5" fill="#718096">value is recoverable from a trusted source before dropping or guessing.</text>
</svg>
