<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="440" fill="#ffffff" />
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Recovering order_date with pl.coalesce</text>
  <text x="360" y="50" text-anchor="middle" font-size="10.5" fill="#4a5568">Three str.to_date(format=..., strict=False) attempts, one real column, zero nulls</text>

  <rect x="70" y="72" width="180" height="86" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="160" y="96" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">%Y-%m-%d</text>
  <text x="160" y="114" text-anchor="middle" font-size="9" fill="#2d3748">matches 783 rows</text>
  <text x="160" y="130" text-anchor="middle" font-size="9" fill="#2d3748">nulls the other 12</text>

  <rect x="270" y="72" width="180" height="86" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" />
  <text x="360" y="96" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">%m/%d/%Y</text>
  <text x="360" y="114" text-anchor="middle" font-size="9" fill="#2d3748">matches 8 rows</text>
  <text x="360" y="130" text-anchor="middle" font-size="9" fill="#2d3748">nulls everything else</text>

  <rect x="470" y="72" width="180" height="86" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="560" y="96" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9c4221">%d-%b-%Y</text>
  <text x="560" y="114" text-anchor="middle" font-size="9" fill="#2d3748">matches 4 rows</text>
  <text x="560" y="130" text-anchor="middle" font-size="9" fill="#2d3748">nulls everything else</text>

  <line x1="160" y1="158" x2="330" y2="210" stroke="#4299e1" stroke-width="1.3" marker-end="url(#c1)" />
  <line x1="360" y1="158" x2="360" y2="210" stroke="#9f7aea" stroke-width="1.3" marker-end="url(#c2)" />
  <line x1="560" y1="158" x2="390" y2="210" stroke="#ed8936" stroke-width="1.3" marker-end="url(#c3)" />
  <defs>
    <marker id="c1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4299e1"/></marker>
    <marker id="c2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9f7aea"/></marker>
    <marker id="c3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ed8936"/></marker>
  </defs>

  <rect x="210" y="214" width="300" height="56" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" />
  <text x="360" y="238" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">pl.coalesce(...)</text>
  <text x="360" y="256" text-anchor="middle" font-size="9.5" fill="#4a5568">first non-null value per row, in order</text>

  <line x1="360" y1="270" x2="360" y2="296" stroke="#a0aec0" stroke-width="1.3" marker-end="url(#c4)" />
  <defs>
    <marker id="c4" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0"/></marker>
  </defs>

  <rect x="160" y="300" width="400" height="80" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="360" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">order_date: Date, 0 nulls, all 795 rows</text>
  <text x="360" y="348" text-anchor="middle" font-size="9.5" fill="#2d3748">All 12 recovered dates verified to match</text>
  <text x="360" y="364" text-anchor="middle" font-size="9.5" fill="#2d3748">the real canonical thistlewood_orders.csv exactly</text>

  <text x="360" y="410" text-anchor="middle" font-size="10.5" fill="#718096">Each row's real format is unambiguous, so exactly one of the three attempts</text>
  <text x="360" y="426" text-anchor="middle" font-size="10.5" fill="#718096">ever succeeds per row -- coalesce just picks whichever one that was.</text>
</svg>
