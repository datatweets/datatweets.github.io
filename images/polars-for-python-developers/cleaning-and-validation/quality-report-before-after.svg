<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="440" fill="#ffffff" />
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">data_quality_report() -- Before and After</text>
  <text x="360" y="50" text-anchor="middle" font-size="10.5" fill="#4a5568">The same function, run on the raw file and on the cleaned result</text>

  <rect x="60" y="70" width="280" height="26" rx="6" fill="#f7fafc" />
  <text x="80" y="88" font-size="10.5" font-weight="700" fill="#1a202c">check</text>
  <rect x="360" y="70" width="140" height="26" rx="6" fill="#fff5f5" />
  <text x="430" y="88" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c53030">raw</text>
  <rect x="520" y="70" width="140" height="26" rx="6" fill="#f0fff4" />
  <text x="590" y="88" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">cleaned</text>

  <!-- rows -->
  <g font-size="10.5" fill="#2d3748">
    <text x="80" y="120">null_city</text>
    <text x="430" y="120" text-anchor="middle" fill="#c53030" font-weight="600">9</text>
    <text x="590" y="120" text-anchor="middle" fill="#276749" font-weight="600">0</text>

    <text x="80" y="150">null_email</text>
    <text x="430" y="150" text-anchor="middle" fill="#c53030" font-weight="600">6</text>
    <text x="590" y="150" text-anchor="middle" fill="#276749" font-weight="600">0</text>

    <text x="80" y="180">bad_order_date_format</text>
    <text x="430" y="180" text-anchor="middle" fill="#c53030" font-weight="600">12</text>
    <text x="590" y="180" text-anchor="middle" fill="#276749" font-weight="600">0</text>

    <text x="80" y="210">negative_quantity</text>
    <text x="430" y="210" text-anchor="middle" fill="#c53030" font-weight="600">3</text>
    <text x="590" y="210" text-anchor="middle" fill="#276749" font-weight="600">0</text>

    <text x="80" y="240">negative_unit_price</text>
    <text x="430" y="240" text-anchor="middle" fill="#c53030" font-weight="600">2</text>
    <text x="590" y="240" text-anchor="middle" fill="#276749" font-weight="600">0</text>

    <text x="80" y="270">duplicate_order_id</text>
    <text x="430" y="270" text-anchor="middle" fill="#c53030" font-weight="600">3</text>
    <text x="590" y="270" text-anchor="middle" fill="#276749" font-weight="600">0</text>
  </g>

  <line x1="60" y1="284" x2="660" y2="284" stroke="#cbd5e0" stroke-width="1.2" />

  <rect x="150" y="308" width="420" height="70" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="360" y="332" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">Every one of the 6 real checks drops to exactly 0</text>
  <text x="360" y="352" text-anchor="middle" font-size="9.5" fill="#2d3748">on the real 792-row cleaned result -- a structured before/after proof</text>

  <text x="360" y="410" text-anchor="middle" font-size="10.5" fill="#718096">Same function, same six checks, two different DataFrames handed to it --</text>
  <text x="360" y="426" text-anchor="middle" font-size="10.5" fill="#718096">the counts prove the fixes worked, not just describe them.</text>
</svg>
