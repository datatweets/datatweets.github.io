<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="460" fill="#ffffff" />
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">pl.List vs pl.Array -- Real Row-Length Rules</text>
  <text x="360" y="50" text-anchor="middle" font-size="10.5" fill="#4a5568">Verified against real Thistlewood order-line data</text>

  <rect x="30" y="72" width="330" height="168" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="195" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">pl.List -- a different length per row</text>
  <text x="50" y="120" font-size="10" font-family="monospace" fill="#1a202c">O00041: ["P047"]                (1)</text>
  <text x="50" y="140" font-size="10" font-family="monospace" fill="#1a202c">O00004: ["P019","P039","P035"]  (3)</text>
  <text x="50" y="160" font-size="10" font-family="monospace" fill="#1a202c">O05826: ["P044","P034", ...]    (4)</text>
  <line x1="50" y1="174" x2="340" y2="174" stroke="#bee3f8" stroke-width="1" />
  <text x="50" y="196" font-size="9.5" fill="#2b6cb0">Polars infers List(String) here by</text>
  <text x="50" y="212" font-size="9.5" fill="#2b6cb0">default -- no length assumption made</text>
  <text x="50" y="228" font-size="9.5" fill="#2b6cb0">at all. This is Thistlewood's real shape.</text>

  <rect x="360" y="72" width="330" height="168" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" />
  <text x="525" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">pl.Array -- one fixed length, always</text>
  <text x="380" y="120" font-size="10" font-family="monospace" fill="#1a202c">cast(pl.Array(pl.String, 4))</text>
  <text x="380" y="140" font-size="9.5" fill="#c53030">on the 3 rows above -&gt; ComputeError:</text>
  <text x="380" y="156" font-size="9" font-family="monospace" fill="#c53030">"not all elements have width 4"</text>
  <line x1="380" y1="170" x2="670" y2="170" stroke="#e9d8fd" stroke-width="1" />
  <text x="380" y="192" font-size="9.5" fill="#6b46c1">Same cast on the real 115 (of 792)</text>
  <text x="380" y="208" font-size="9.5" fill="#6b46c1">orders with exactly 4 line items each</text>
  <text x="380" y="224" font-size="9.5" fill="#6b46c1">succeeds -- every row genuinely agrees.</text>

  <rect x="70" y="264" width="580" height="80" rx="10" fill="#fed7d7" stroke="#e53e3e" stroke-width="1.4" />
  <text x="360" y="288" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c53030">The width check runs at cast time, not print time</text>
  <text x="360" y="308" text-anchor="middle" font-size="9.5" fill="#742a2a">A variable-length list column prints and builds fine -- the error only appears</text>
  <text x="360" y="326" text-anchor="middle" font-size="9.5" fill="#742a2a">the moment you ask Polars to reinterpret it as a fixed-width Array.</text>

  <rect x="120" y="360" width="480" height="76" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="360" y="384" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Illustrative pl.Array fit: package dimensions_cm</text>
  <text x="360" y="404" text-anchor="middle" font-size="9.5" fill="#2d3748">[length, width, height] -- genuinely 3 values on every real product,</text>
  <text x="360" y="420" text-anchor="middle" font-size="9.5" fill="#2d3748">unlike Thistlewood's own naturally variable-length line items.</text>
</svg>
