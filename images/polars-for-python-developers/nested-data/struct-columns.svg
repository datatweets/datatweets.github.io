<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="440" fill="#ffffff" />
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">pl.struct() -- Bundling Real Columns Together</text>
  <text x="360" y="50" text-anchor="middle" font-size="10.5" fill="#4a5568">From plain columns, and from an aggregation's own results</text>

  <rect x="40" y="76" width="300" height="160" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="190" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">pl.struct(["city", "state"])</text>
  <text x="60" y="126" font-size="10" font-family="monospace" fill="#1a202c">city:  "Traverse City"</text>
  <text x="60" y="144" font-size="10" font-family="monospace" fill="#1a202c">state: "MI"</text>
  <line x1="60" y1="156" x2="320" y2="156" stroke="#bee3f8" stroke-width="1" />
  <text x="60" y="178" font-size="10" font-family="monospace" fill="#2b6cb0">address: {"Traverse City","MI"}</text>
  <text x="60" y="200" font-size="9" fill="#4a5568">.struct.field("city") reads a real</text>
  <text x="60" y="214" font-size="9" fill="#4a5568">value back out -- city/state stay too</text>

  <rect x="380" y="76" width="300" height="160" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" />
  <text x="530" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">struct() inside group_by().agg()</text>
  <text x="400" y="126" font-size="10" font-family="monospace" fill="#1a202c">customer C0001, real Q1 2024</text>
  <line x1="400" y1="138" x2="660" y2="138" stroke="#e9d8fd" stroke-width="1" />
  <text x="400" y="160" font-size="10" font-family="monospace" fill="#6b46c1">order_stats: {n_orders: 6,</text>
  <text x="400" y="176" font-size="10" font-family="monospace" fill="#6b46c1">  min_items: 1, max_items: 4}</text>
  <text x="400" y="200" font-size="9" fill="#4a5568">real: 167 of 180 customers placed</text>
  <text x="400" y="214" font-size="9" fill="#4a5568">more than 1 real Q1 2024 order</text>

  <rect x="120" y="256" width="480" height="80" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" />
  <text x="360" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="#1a202c">.struct.field() filters without unnesting first</text>
  <text x="360" y="302" text-anchor="middle" font-size="9.5" fill="#2d3748">pl.col("order_stats").struct.field("n_orders") &gt; 1</text>
  <text x="360" y="320" text-anchor="middle" font-size="9.5" fill="#2d3748">reaches inside the struct directly, no expansion needed</text>

  <rect x="90" y="352" width="540" height="60" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="360" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">.unnest("order_stats") is the real inverse</text>
  <text x="360" y="396" text-anchor="middle" font-size="9.5" fill="#2d3748">expands the struct back into n_orders / min_items / max_items columns</text>
</svg>
