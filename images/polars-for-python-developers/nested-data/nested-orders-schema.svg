<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="460" fill="#ffffff" />
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">thistlewood_orders_nested.json -- Real Schema</text>
  <text x="360" y="50" text-anchor="middle" font-size="10.5" fill="#4a5568">792 real Q1 2024 orders, pl.read_json() inferred</text>

  <rect x="40" y="72" width="300" height="120" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" />
  <text x="190" y="94" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">Five plain scalar columns</text>
  <text x="60" y="116" font-size="10" font-family="monospace" fill="#2d3748">order_id      String</text>
  <text x="60" y="134" font-size="10" font-family="monospace" fill="#2d3748">order_date    String</text>
  <text x="60" y="152" font-size="10" font-family="monospace" fill="#2d3748">customer_id   String</text>
  <text x="60" y="170" font-size="10" font-family="monospace" fill="#2d3748">channel, status  String</text>

  <rect x="380" y="72" width="300" height="120" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="530" y="94" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">line_items: List(Struct)</text>
  <text x="400" y="116" font-size="10" font-family="monospace" fill="#2b6cb0">product_id            String</text>
  <text x="400" y="134" font-size="10" font-family="monospace" fill="#2b6cb0">quantity              Int64</text>
  <text x="400" y="152" font-size="10" font-family="monospace" fill="#2b6cb0">unit_price_at_sale    Float64</text>
  <text x="400" y="172" font-size="9" fill="#4a5568">-- a real, variable-length list per order</text>

  <text x="360" y="222" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">Real distribution: line items per order (1,892 total)</text>

  <text x="90" y="252" font-size="10" fill="#2d3748">1 item</text>
  <rect x="150" y="240" width="194" height="20" rx="4" fill="#4299e1" />
  <text x="352" y="255" font-size="10" fill="#2b6cb0">194 orders</text>

  <text x="90" y="280" font-size="10" fill="#2d3748">2 items</text>
  <rect x="150" y="268" width="211" height="20" rx="4" fill="#4299e1" />
  <text x="369" y="283" font-size="10" fill="#2b6cb0">211 orders</text>

  <text x="90" y="308" font-size="10" fill="#2d3748">3 items</text>
  <rect x="150" y="296" width="272" height="20" rx="4" fill="#4299e1" />
  <text x="430" y="311" font-size="10" fill="#2b6cb0">272 orders</text>

  <text x="90" y="336" font-size="10" fill="#2d3748">4 items</text>
  <rect x="150" y="324" width="115" height="20" rx="4" fill="#4299e1" />
  <text x="273" y="339" font-size="10" fill="#2b6cb0">115 orders</text>

  <rect x="120" y="368" width="480" height="70" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="360" y="392" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">194 + 211 + 272 + 115 = 792 real orders</text>
  <text x="360" y="412" text-anchor="middle" font-size="9.5" fill="#2d3748">min 1, max 4, average 2.3889 real line items per order -- .list.len() confirms every count</text>
</svg>
