<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="520" fill="#ffffff" />
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">list.eval() and list.sum() -- Real Per-Order Totals</text>

  <rect x="220" y="48" width="280" height="46" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" />
  <text x="360" y="76" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#1a202c">line_items: List(Struct(...))</text>

  <line x1="360" y1="94" x2="360" y2="116" stroke="#a0aec0" stroke-width="1.3" marker-end="url(#e0)" />

  <rect x="80" y="120" width="560" height="74" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" />
  <text x="360" y="140" text-anchor="middle" font-size="10" font-family="monospace" fill="#2b6cb0">.list.eval(</text>
  <text x="360" y="158" text-anchor="middle" font-size="10" font-family="monospace" fill="#2b6cb0">  element().struct.field("quantity")</text>
  <text x="360" y="176" text-anchor="middle" font-size="10" font-family="monospace" fill="#2b6cb0">  * element().struct.field("unit_price_at_sale") )</text>

  <line x1="360" y1="194" x2="360" y2="216" stroke="#a0aec0" stroke-width="1.3" marker-end="url(#e1)" />

  <rect x="220" y="220" width="280" height="46" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" />
  <text x="360" y="248" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#6b46c1">item_subtotals: List(Float64)</text>

  <line x1="360" y1="266" x2="360" y2="288" stroke="#a0aec0" stroke-width="1.3" marker-end="url(#e2)" />

  <rect x="220" y="292" width="280" height="46" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="360" y="320" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#2b6cb0">.list.sum() -&gt; order_total</text>

  <line x1="360" y1="338" x2="360" y2="360" stroke="#a0aec0" stroke-width="1.3" marker-end="url(#e3)" />

  <defs>
    <marker id="e0" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0"/></marker>
    <marker id="e1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0"/></marker>
    <marker id="e2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0"/></marker>
    <marker id="e3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0"/></marker>
  </defs>

  <rect x="120" y="364" width="480" height="60" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="360" y="388" text-anchor="middle" font-size="11" font-weight="700" fill="#9c4221">O00119 example: 4 real line items</text>
  <text x="360" y="408" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#742a2a">[68.48, 2209.8, ..., 930.0] -&gt; order_total = $3,275.67</text>

  <rect x="90" y="436" width="540" height="56" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" />
  <text x="360" y="460" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">792 orders, 0 mismatches vs. the real flat order_items sum</text>
  <text x="360" y="478" text-anchor="middle" font-size="9.5" fill="#2d3748">grand total matches both ways: $1,262,892.88</text>
</svg>
