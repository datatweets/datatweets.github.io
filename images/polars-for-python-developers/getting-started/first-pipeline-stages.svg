<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="820" height="260" fill="#ffffff" />
  <text x="410" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Your First Real Pipeline: Four Stages, One Expression Chain</text>

  <!-- Stage 1: Read -->
  <rect x="30" y="70" width="170" height="90" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" />
  <text x="115" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">1. Read</text>
  <text x="115" y="114" text-anchor="middle" font-size="9.5" fill="#3182ce">pl.read_csv(path)</text>
  <text x="115" y="132" text-anchor="middle" font-size="9.5" fill="#3182ce">todays_orders.csv</text>
  <text x="115" y="148" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2b6cb0">12 rows in</text>

  <line x1="200" y1="115" x2="228" y2="115" stroke="#a0aec0" stroke-width="2" />
  <polygon points="228 115 218 110 218 120" fill="#a0aec0" />

  <!-- Stage 2: Filter -->
  <rect x="230" y="70" width="170" height="90" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" />
  <text x="315" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">2. Filter</text>
  <text x="315" y="114" text-anchor="middle" font-size="9.5" fill="#805ad5">.filter(pl.col("status")</text>
  <text x="315" y="130" text-anchor="middle" font-size="9.5" fill="#805ad5">== "completed")</text>
  <text x="315" y="148" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6b46c1">9 of 12 kept</text>

  <line x1="400" y1="115" x2="428" y2="115" stroke="#a0aec0" stroke-width="2" />
  <polygon points="428 115 418 110 418 120" fill="#a0aec0" />

  <!-- Stage 3: Aggregate -->
  <rect x="430" y="70" width="170" height="90" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" />
  <text x="515" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#9c4221">3. Aggregate</text>
  <text x="515" y="114" text-anchor="middle" font-size="9.5" fill="#c05621">.group_by("category")</text>
  <text x="515" y="130" text-anchor="middle" font-size="9.5" fill="#c05621">.agg(sum, len)</text>
  <text x="515" y="148" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9c4221">6 categories</text>

  <line x1="600" y1="115" x2="628" y2="115" stroke="#a0aec0" stroke-width="2" />
  <polygon points="628 115 618 110 618 120" fill="#a0aec0" />

  <!-- Stage 4: Print -->
  <rect x="630" y="70" width="160" height="90" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" />
  <text x="710" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">4. Print</text>
  <text x="710" y="114" text-anchor="middle" font-size="9.5" fill="#2f855a">print(summary)</text>
  <text x="710" y="132" text-anchor="middle" font-size="9.5" fill="#2f855a">Kitchen leads</text>
  <text x="710" y="148" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">at $186.50</text>

  <text x="410" y="200" text-anchor="middle" font-size="10.5" fill="#718096">Every stage is one expression in a single chain — no intermediate loop, no manual bookkeeping between steps.</text>
  <text x="410" y="222" text-anchor="middle" font-size="10.5" fill="#718096">Read, filter, aggregate, and print are exactly the four moves every later module builds on top of.</text>
</svg>
