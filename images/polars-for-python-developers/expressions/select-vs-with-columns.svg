<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="420" fill="#ffffff" />
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Same DataFrame, Same Expression, Two Real Shapes</text>

  <rect x="270" y="50" width="180" height="56" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" />
  <text x="360" y="72" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">products</text>
  <text x="360" y="90" text-anchor="middle" font-size="9.5" fill="#4a5568">(60, 7) -- 7 real columns</text>

  <line x1="320" y1="106" x2="220" y2="146" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#s1)" />
  <line x1="400" y1="106" x2="500" y2="146" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#s2)" />
  <defs>
    <marker id="s1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0"/></marker>
    <marker id="s2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0"/></marker>
  </defs>

  <text x="220" y="140" text-anchor="middle" font-size="10" fill="#4a5568">.select("product_name",</text>
  <text x="220" y="152" text-anchor="middle" font-size="10" fill="#4a5568">"unit_price", margin_expr)</text>

  <text x="500" y="140" text-anchor="middle" font-size="10" fill="#4a5568">.with_columns(margin_expr)</text>

  <rect x="70" y="160" width="300" height="130" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" />
  <text x="220" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">narrow = (60, 3)</text>
  <rect x="90" y="196" width="80" height="24" rx="4" fill="#ffffff" stroke="#4299e1" stroke-width="1" />
  <text x="130" y="212" text-anchor="middle" font-size="8.5" fill="#2d3748">product_name</text>
  <rect x="178" y="196" width="70" height="24" rx="4" fill="#ffffff" stroke="#4299e1" stroke-width="1" />
  <text x="213" y="212" text-anchor="middle" font-size="8.5" fill="#2d3748">unit_price</text>
  <rect x="256" y="196" width="60" height="24" rx="4" fill="#ffffff" stroke="#4299e1" stroke-width="1" />
  <text x="286" y="212" text-anchor="middle" font-size="8.5" fill="#2d3748">margin</text>
  <text x="220" y="244" text-anchor="middle" font-size="9.5" fill="#2d3748">only what was named,</text>
  <text x="220" y="262" text-anchor="middle" font-size="9.5" fill="#2d3748">everything else dropped</text>

  <rect x="410" y="160" width="300" height="130" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" />
  <text x="560" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">wide = (60, 8)</text>
  <rect x="422" y="196" width="34" height="20" rx="4" fill="#ffffff" stroke="#48bb78" stroke-width="1" />
  <text x="439" y="209" text-anchor="middle" font-size="7" fill="#2d3748">id</text>
  <rect x="458" y="196" width="46" height="20" rx="4" fill="#ffffff" stroke="#48bb78" stroke-width="1" />
  <text x="481" y="209" text-anchor="middle" font-size="7" fill="#2d3748">name</text>
  <rect x="506" y="196" width="46" height="20" rx="4" fill="#ffffff" stroke="#48bb78" stroke-width="1" />
  <text x="529" y="209" text-anchor="middle" font-size="7" fill="#2d3748">category</text>
  <rect x="554" y="196" width="46" height="20" rx="4" fill="#ffffff" stroke="#48bb78" stroke-width="1" />
  <text x="577" y="209" text-anchor="middle" font-size="7" fill="#2d3748">subcat</text>
  <rect x="602" y="196" width="46" height="20" rx="4" fill="#ffffff" stroke="#48bb78" stroke-width="1" />
  <text x="625" y="209" text-anchor="middle" font-size="7" fill="#2d3748">price</text>
  <rect x="650" y="196" width="36" height="20" rx="4" fill="#ffffff" stroke="#48bb78" stroke-width="1" />
  <text x="668" y="209" text-anchor="middle" font-size="7" fill="#2d3748">cost</text>
  <rect x="422" y="220" width="60" height="20" rx="4" fill="#ffffff" stroke="#48bb78" stroke-width="1" />
  <text x="452" y="233" text-anchor="middle" font-size="7" fill="#2d3748">supplier</text>
  <rect x="484" y="220" width="60" height="20" rx="4" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="514" y="233" text-anchor="middle" font-size="7.5" font-weight="700" fill="#276749">margin (new)</text>
  <text x="560" y="264" text-anchor="middle" font-size="9.5" fill="#2d3748">every original column kept,</text>
  <text x="560" y="280" text-anchor="middle" font-size="9.5" fill="#2d3748">margin added alongside them</text>

  <text x="360" y="330" text-anchor="middle" font-size="10.5" fill="#718096">select() returns only what you name or compute -- with_columns() keeps everything</text>
  <text x="360" y="348" text-anchor="middle" font-size="10.5" fill="#718096">already there and adds to it. Same starting DataFrame, same expression, verified different shapes.</text>
</svg>
