<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="420" fill="#ffffff" />
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">A Series Is One Named, Typed Column</text>

  <text x="60" y="66" font-size="12.5" font-weight="700" fill="#1a202c">thistlewood_products.csv, read as a DataFrame</text>

  <rect x="60" y="78" width="600" height="150" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />

  <rect x="72" y="90" width="120" height="26" rx="5" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" />
  <text x="132" y="107" text-anchor="middle" font-size="10.5" fill="#4a5568">product_id</text>
  <rect x="196" y="90" width="150" height="26" rx="5" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" />
  <text x="271" y="107" text-anchor="middle" font-size="10.5" fill="#4a5568">product_name</text>
  <rect x="350" y="90" width="110" height="26" rx="5" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" />
  <text x="405" y="107" text-anchor="middle" font-size="10.5" fill="#4a5568">category</text>
  <rect x="464" y="90" width="110" height="26" rx="5" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" />
  <text x="519" y="107" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">unit_price</text>

  <g font-size="10" fill="#2d3748">
    <text x="132" y="140" text-anchor="middle">P001</text>
    <text x="271" y="140" text-anchor="middle">Powder-Coated Hand Mixer</text>
    <text x="405" y="140" text-anchor="middle">Kitchen</text>
    <rect x="466" y="128" width="106" height="20" rx="4" fill="#ebf8ff" />
    <text x="519" y="142" text-anchor="middle" fill="#2b6cb0" font-weight="600">378.87</text>

    <text x="132" y="165" text-anchor="middle">P002</text>
    <text x="271" y="165" text-anchor="middle">Slate Gray Spatula Set</text>
    <text x="405" y="165" text-anchor="middle">Kitchen</text>
    <rect x="466" y="153" width="106" height="20" rx="4" fill="#ebf8ff" />
    <text x="519" y="167" text-anchor="middle" fill="#2b6cb0" font-weight="600">181.52</text>

    <text x="132" y="190" text-anchor="middle" fill="#a0aec0">…</text>
    <text x="271" y="190" text-anchor="middle" fill="#a0aec0">…</text>
    <text x="405" y="190" text-anchor="middle" fill="#a0aec0">…</text>
    <rect x="466" y="178" width="106" height="20" rx="4" fill="#ebf8ff" />
    <text x="519" y="192" text-anchor="middle" fill="#a0aec0">…</text>

    <text x="132" y="215" text-anchor="middle">P060</text>
    <text x="271" y="215" text-anchor="middle">Woven Cotton Wall Art Print</text>
    <text x="405" y="215" text-anchor="middle">Storage</text>
    <rect x="466" y="203" width="106" height="20" rx="4" fill="#ebf8ff" />
    <text x="519" y="217" text-anchor="middle" fill="#2b6cb0" font-weight="600">64.30</text>
  </g>

  <line x1="519" y1="228" x2="519" y2="264" stroke="#4299e1" stroke-width="1.6" marker-end="url(#arrow)" />
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4299e1" />
    </marker>
  </defs>

  <rect x="220" y="270" width="280" height="110" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" />
  <text x="360" y="294" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b6cb0">products["unit_price"]</text>
  <text x="360" y="314" text-anchor="middle" font-size="10.5" fill="#2d3748">Series: 'unit_price'</text>
  <text x="360" y="332" text-anchor="middle" font-size="10.5" fill="#2d3748">dtype: Float64</text>
  <text x="360" y="350" text-anchor="middle" font-size="10.5" fill="#2d3748">60 values, one per product</text>
  <text x="360" y="368" text-anchor="middle" font-size="10.5" fill="#2d3748">no row index -- position only</text>

  <text x="360" y="406" text-anchor="middle" font-size="10.5" fill="#718096">Selecting one column out of a DataFrame always gives you back a Series -- a single named, typed, one-dimensional column.</text>
</svg>
