<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="420" fill="#ffffff" />
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Three Ways In, One DataFrame Out</text>

  <rect x="40" y="60" width="190" height="120" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="135" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Dict of lists</text>
  <text x="135" y="104" text-anchor="middle" font-size="9.5" fill="#2d3748">{"product_id": [...],</text>
  <text x="135" y="120" text-anchor="middle" font-size="9.5" fill="#2d3748"> "category": [...],</text>
  <text x="135" y="136" text-anchor="middle" font-size="9.5" fill="#2d3748"> "unit_price": [...]}</text>
  <text x="135" y="160" text-anchor="middle" font-size="9.5" fill="#4a5568">one key per column</text>

  <rect x="265" y="60" width="190" height="120" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" />
  <text x="360" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">List of dicts</text>
  <text x="360" y="104" text-anchor="middle" font-size="9.5" fill="#2d3748">[{"product_id": "P061", ...},</text>
  <text x="360" y="120" text-anchor="middle" font-size="9.5" fill="#2d3748"> {"product_id": "P062", ...},</text>
  <text x="360" y="136" text-anchor="middle" font-size="9.5" fill="#2d3748"> ...]</text>
  <text x="360" y="160" text-anchor="middle" font-size="9.5" fill="#4a5568">one dict per row</text>

  <rect x="490" y="60" width="190" height="120" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="585" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Explicit schema=</text>
  <text x="585" y="104" text-anchor="middle" font-size="9.5" fill="#2d3748">pl.DataFrame(data,</text>
  <text x="585" y="120" text-anchor="middle" font-size="9.5" fill="#2d3748">  schema={"quantity":</text>
  <text x="585" y="136" text-anchor="middle" font-size="9.5" fill="#2d3748">          pl.Int16})</text>
  <text x="585" y="160" text-anchor="middle" font-size="9.5" fill="#4a5568">you choose the dtype</text>

  <line x1="135" y1="180" x2="300" y2="230" stroke="#4299e1" stroke-width="1.4" marker-end="url(#a1)" />
  <line x1="360" y1="180" x2="360" y2="230" stroke="#9f7aea" stroke-width="1.4" marker-end="url(#a2)" />
  <line x1="585" y1="180" x2="420" y2="230" stroke="#48bb78" stroke-width="1.4" marker-end="url(#a3)" />
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4299e1"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9f7aea"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#48bb78"/></marker>
  </defs>

  <rect x="180" y="238" width="360" height="110" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" />
  <text x="360" y="260" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a202c">pl.DataFrame</text>
  <rect x="200" y="272" width="90" height="22" rx="5" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <text x="245" y="287" text-anchor="middle" font-size="9" fill="#4a5568">product_id</text>
  <rect x="298" y="272" width="90" height="22" rx="5" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <text x="343" y="287" text-anchor="middle" font-size="9" fill="#4a5568">category</text>
  <rect x="396" y="272" width="120" height="22" rx="5" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <text x="456" y="287" text-anchor="middle" font-size="9" fill="#4a5568">unit_price</text>
  <text x="360" y="330" text-anchor="middle" font-size="10" fill="#718096">same schema-and-rows structure, regardless of the input shape</text>

  <text x="360" y="378" text-anchor="middle" font-size="10.5" fill="#718096">A record missing a key (list-of-dicts) fills that cell with null instead of raising --</text>
  <text x="360" y="396" text-anchor="middle" font-size="10.5" fill="#718096">the same null you'll filter, fill, or drop explicitly in the next lesson.</text>
</svg>
