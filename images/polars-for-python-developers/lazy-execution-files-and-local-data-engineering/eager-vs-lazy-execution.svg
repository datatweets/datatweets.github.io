<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="440" fill="#ffffff" />
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Eager vs Lazy Execution</text>
  <text x="360" y="46" text-anchor="middle" font-size="10.5" fill="#4a5568">Same chain, same result -- the difference is when it runs</text>

  <rect x="30" y="68" width="660" height="120" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="50" y="90" font-size="11" font-weight="700" fill="#2b6cb0">Eager</text>
  <text x="50" y="110" font-size="9.5" font-family="monospace" fill="#1a202c">orders.filter(pl.col("channel") == "web")</text>
  <text x="50" y="128" font-size="9" fill="#4a5568">Runs the instant Python reaches the line -- returns a DataFrame immediately.</text>
  <rect x="480" y="98" width="170" height="60" rx="8" fill="#ffffff" stroke="#4299e1" stroke-width="1.2" />
  <text x="565" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">DataFrame</text>
  <text x="565" y="140" text-anchor="middle" font-size="9" font-family="monospace" fill="#1a202c">3,895 rows, computed now</text>

  <rect x="30" y="204" width="660" height="150" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" />
  <text x="50" y="226" font-size="11" font-weight="700" fill="#6b46c1">Lazy</text>
  <text x="50" y="246" font-size="9.5" font-family="monospace" fill="#1a202c">orders.lazy().filter(...).select(...)</text>
  <text x="50" y="264" font-size="9" fill="#4a5568">Describes the chain -- printing it shows a naive plan, not data.</text>
  <rect x="50" y="278" width="280" height="60" rx="8" fill="#ffffff" stroke="#9f7aea" stroke-width="1.2" />
  <text x="60" y="296" font-size="8.5" font-family="monospace" fill="#1a202c">naive plan: (run .explain(</text>
  <text x="60" y="308" font-size="8.5" font-family="monospace" fill="#1a202c">optimized=True) to see more)</text>
  <text x="60" y="324" font-size="8.5" font-family="monospace" fill="#1a202c">SELECT [...] FILTER [...]</text>
  <text x="380" y="300" font-size="14" fill="#9f7aea">.collect()</text>
  <text x="380" y="316" font-size="14" fill="#9f7aea">--&gt;</text>
  <rect x="470" y="278" width="180" height="60" rx="8" fill="#ffffff" stroke="#9f7aea" stroke-width="1.2" />
  <text x="560" y="302" text-anchor="middle" font-size="10" font-weight="700" fill="#6b46c1">DataFrame</text>
  <text x="560" y="320" text-anchor="middle" font-size="9" font-family="monospace" fill="#1a202c">3,895 rows, identical</text>

  <rect x="40" y="374" width="640" height="50" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="360" y="394" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">Columnar, expression-based execution makes both paths fast</text>
  <text x="360" y="410" text-anchor="middle" font-size="9" fill="#22543d">That property is unrelated to which path is lazy -- eager and lazy answer a different question.</text>
</svg>
