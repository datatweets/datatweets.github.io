<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="480" fill="#ffffff" />
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">build_local_analytics_workflow()</text>
  <text x="360" y="46" text-anchor="middle" font-size="10.5" fill="#4a5568">Four steps, one function, reconciled to the course's own grand total</text>

  <rect x="24" y="66" width="160" height="92" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="104" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2b6cb0">1. Build the lake</text>
  <text x="104" y="104" text-anchor="middle" font-size="8.5" fill="#1a202c">thistlewood_lake/</text>
  <text x="104" y="118" text-anchor="middle" font-size="8.5" fill="#1a202c">24 partition files</text>
  <text x="104" y="140" text-anchor="middle" font-size="8" fill="#4a5568">from the canonical CSVs</text>

  <rect x="200" y="66" width="160" height="92" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" />
  <text x="280" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6b46c1">2. Pruned query</text>
  <text x="280" y="104" text-anchor="middle" font-size="8.5" fill="#1a202c">Q1 2024 web revenue</text>
  <text x="280" y="122" text-anchor="middle" font-size="9" font-weight="700" fill="#6b46c1">$866,475.78</text>
  <text x="280" y="140" text-anchor="middle" font-size="8" fill="#4a5568">matches Lesson 5 exactly</text>

  <rect x="376" y="66" width="160" height="92" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="456" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9c4221">3. Fixed summary</text>
  <text x="456" y="104" text-anchor="middle" font-size="8" font-family="monospace" fill="#1a202c">pre_partition_hive=False</text>
  <text x="456" y="122" text-anchor="middle" font-size="9" font-weight="700" fill="#9c4221">72 rows</text>
  <text x="456" y="140" text-anchor="middle" font-size="8" fill="#4a5568">year, month, channel</text>

  <rect x="552" y="66" width="144" height="92" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="624" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">4. Persist</text>
  <text x="624" y="104" text-anchor="middle" font-size="8" font-family="monospace" fill="#1a202c">write_database()</text>
  <text x="624" y="122" text-anchor="middle" font-size="8.5" fill="#1a202c">thistlewood_analytics.db</text>
  <text x="624" y="140" text-anchor="middle" font-size="8" fill="#4a5568">read back with sqlite3</text>

  <line x1="184" y1="112" x2="200" y2="112" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="360" y1="112" x2="376" y2="112" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="536" y1="112" x2="552" y2="112" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)" />
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#a0aec0" />
    </marker>
  </defs>

  <rect x="40" y="188" width="640" height="80" rx="10" fill="#edf2f7" stroke="#4a5568" stroke-width="1.4" />
  <text x="360" y="212" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">summary: revenue sums to $9,195,043.62 -- n_orders sums to 6,000</text>
  <text x="360" y="232" text-anchor="middle" font-size="9.5" fill="#4a5568">Confirmed after the SQLite round trip, and separately against a grand total</text>
  <text x="360" y="248" text-anchor="middle" font-size="9.5" fill="#4a5568">recomputed fresh from thistlewood_order_items.csv, with no dependency on this pipeline</text>

  <rect x="40" y="286" width="640" height="90" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" />
  <text x="360" y="310" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">Two independent reconciliations, both exact</text>
  <text x="360" y="330" text-anchor="middle" font-size="9" fill="#22543d">sqlite round trip revenue == in-memory summary revenue == $9,195,043.62</text>
  <text x="360" y="348" text-anchor="middle" font-size="9" fill="#22543d">summary revenue == fresh order_items grand total == $9,195,043.62</text>
  <text x="360" y="364" text-anchor="middle" font-size="8.5" fill="#4a5568">the strongest check: agreeing with the raw data, not just with itself</text>

  <rect x="40" y="392" width="640" height="50" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="360" y="414" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9c4221">Idempotent by design</text>
  <text x="360" y="430" text-anchor="middle" font-size="8.5" fill="#4a5568">shutil.rmtree("thistlewood_lake") and os.remove(the db) run first, every call</text>
</svg>
