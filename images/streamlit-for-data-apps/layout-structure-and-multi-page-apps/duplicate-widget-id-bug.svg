<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="390" viewBox="0 0 1050 390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title>A Real Layout Bug: Duplicate Widget IDs in a Loop</title>
<desc>Two panels. Left, broken: a for loop calls st.button(&quot;Select&quot;) once per country with no key argument -- Streamlit raises a real StreamlitDuplicateElementId exception on the second identical button, since two buttons with the same type and label produce the same auto-generated ID. Right, fixed: the identical loop passes a unique key f-string per country, key=f&quot;select_{country}&quot; -- five distinct buttons, no exception, confirmed by AppTest.</desc>
<rect width="1050" height="390" fill="#ffffff" />
<text x="525" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">A Real Layout Bug: Duplicate Widget IDs in a Loop</text>
<rect x="30" y="60" width="483" height="210" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.6" />
<text x="271" y="86" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2d3748">Broken: no key= in the loop</text>
<text x="271" y="110" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">for c in countries:</text>
<text x="271" y="132" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">  st.button(&quot;Select&quot;)</text>
<text x="271" y="154" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568"></text>
<text x="271" y="176" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">StreamlitDuplicateElementId:</text>
<text x="271" y="198" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">multiple button elements</text>
<text x="271" y="220" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">with the same auto-</text>
<text x="271" y="242" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">generated ID</text>
<path d="M517,165 L533,165" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr)" />
<rect x="537" y="60" width="483" height="210" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" />
<text x="778" y="86" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2d3748">Fixed: unique key= per iteration</text>
<text x="778" y="110" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">for c in countries:</text>
<text x="778" y="132" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">  st.button(&quot;Select&quot;,</text>
<text x="778" y="154" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">    key=f&quot;select_{c}&quot;)</text>
<text x="778" y="176" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568"></text>
<text x="778" y="198" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">Confirmed: 5 distinct</text>
<text x="778" y="220" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">buttons, exception stays</text>
<text x="778" y="242" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">empty</text>
<rect x="30" y="286" width="990" height="88" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
<text x="525" y="310" text-anchor="middle" font-size="10.5" fill="#7b341e">Any widget repeated in a loop with identical arguments needs its own unique key= -- Streamlit cannot otherwise</text>
<text x="525" y="330" text-anchor="middle" font-size="10.5" fill="#7b341e">tell two buttons with the same label apart.</text>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a0aec0"/></marker></defs>
</svg>