<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="390" viewBox="0 0 1050 390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title>cache_data Copies. cache_resource Does Not.</title>
<desc>Two panels contrasting object identity. Left, st.cache_data: two calls to the identical cached function return df1 and df2 where df1 is df2 is False, but df1.equals(df2) is True -- a real, independent copy each time. Right, st.cache_resource: two calls return df1 is df2 True -- the literal same object in memory, never copied.</desc>
<rect width="1050" height="390" fill="#ffffff" />
<text x="525" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">cache_data Copies. cache_resource Does Not.</text>
<rect x="30" y="60" width="483" height="210" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" />
<text x="271" y="86" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2d3748">@st.cache_data</text>
<text x="271" y="110" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">df1 = load_data_cached()</text>
<text x="271" y="132" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">df2 = load_data_cached()</text>
<text x="271" y="154" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568"></text>
<text x="271" y="176" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">df1 is df2: False</text>
<text x="271" y="198" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">df1.equals(df2): True</text>
<text x="271" y="220" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">-- a real copy each call</text>
<path d="M517,165 L533,165" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr)" />
<rect x="537" y="60" width="483" height="210" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" />
<text x="778" y="86" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2d3748">@st.cache_resource</text>
<text x="778" y="110" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">df1 = load_data_resource()</text>
<text x="778" y="132" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">df2 = load_data_resource()</text>
<text x="778" y="154" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568"></text>
<text x="778" y="176" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">df1 is df2: True</text>
<text x="778" y="198" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">-- the literal same object,</text>
<text x="778" y="220" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">never copied</text>
<rect x="30" y="286" width="990" height="88" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
<text x="525" y="310" text-anchor="middle" font-size="10.5" fill="#7b341e">Confirmed with a real identity check, not assumed from the decorator names: cache_data returns a safe</text>
<text x="525" y="330" text-anchor="middle" font-size="10.5" fill="#7b341e">independent copy every time; cache_resource hands back the exact same object.</text>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a0aec0"/></marker></defs>
</svg>