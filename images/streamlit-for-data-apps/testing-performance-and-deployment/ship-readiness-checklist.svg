<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="414" viewBox="0 0 1000 414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title>A Real Ship-Readiness Checklist</title>
<desc>A four-row stack of checks this guided project runs against world_explorer.py before it would be considered ready to deploy. Row 1: 4 pytest tests, covering all three pages, confirmed passing. Row 2: requirements.txt confirmed to install cleanly in a fresh empty virtual environment. Row 3: .streamlit slash secrets.toml confirmed present in .gitignore via a real fnmatch check. Row 4: every AppTest exception check across the whole app stays empty -- the same real signal this course has checked after every single interaction since Module 1.</desc>
<rect width="1000" height="414" fill="#ffffff" />
<text x="500" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">A Real Ship-Readiness Checklist</text>
<rect x="60" y="60" width="880" height="44" rx="7" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" />
<text x="500" y="86" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">pytest test_app.py -- 4 tests, all 3 pages, all passing</text>
<path d="M500,107 L500,123" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr2)" />
<rect x="60" y="126" width="880" height="44" rx="7" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" />
<text x="500" y="152" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">requirements.txt installs clean in a fresh, empty venv</text>
<path d="M500,173 L500,189" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr2)" />
<rect x="60" y="192" width="880" height="44" rx="7" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" />
<text x="500" y="218" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">.streamlit/secrets.toml confirmed present in .gitignore</text>
<path d="M500,239 L500,255" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr2)" />
<rect x="60" y="258" width="880" height="44" rx="7" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" />
<text x="500" y="284" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">at.exception stays empty across every page and every interaction</text>
<rect x="40" y="326" width="920" height="60" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
<text x="500" y="350" text-anchor="middle" font-size="10.5" fill="#7b341e">Four real, automatable checks -- the same discipline this course has applied to every single lesson,</text>
<text x="500" y="370" text-anchor="middle" font-size="10.5" fill="#7b341e">run once as a final, complete pass over the whole app.</text>
<defs><marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a0aec0"/></marker></defs>
</svg>