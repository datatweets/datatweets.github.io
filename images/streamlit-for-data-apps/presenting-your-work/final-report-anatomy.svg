<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title>Every Presentation Tool, One Real Report</title>
<desc>A five-row stack. Row 1: a real custom theme from config.toml, applied to every header and metric on the page. Row 2: real metrics, 142 countries, mean life expectancy 67.0. Row 3: a real seaborn boxplot showing the distribution by continent. Row 4: a real LaTeX formula with the exact anchor figure interpolated. Row 5: a real download button exporting the exact 2007 data shown above it.</desc>
<rect width="1000" height="480" fill="#ffffff" />
<text x="500" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Every Presentation Tool, One Real Report</text>
<rect x="60" y="60" width="880" height="44" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5" />
<text x="500" y="86" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">config.toml -- real custom theme applied to every header</text>
<path d="M500,107 L500,123" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr2)" />
<rect x="60" y="126" width="880" height="44" rx="7" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" />
<text x="500" y="152" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">st.metric x2 -- 142 countries, mean life expectancy 67.0</text>
<path d="M500,173 L500,189" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr2)" />
<rect x="60" y="192" width="880" height="44" rx="7" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" />
<text x="500" y="218" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">st.pyplot(fig) -- a real seaborn boxplot by continent</text>
<path d="M500,239 L500,255" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr2)" />
<rect x="60" y="258" width="880" height="44" rx="7" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" />
<text x="500" y="284" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">st.latex(...) -- the real formula, with 142 and 67.0074 interpolated</text>
<path d="M500,305 L500,321" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr2)" />
<rect x="60" y="324" width="880" height="44" rx="7" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" />
<text x="500" y="350" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">st.download_button -- exports the exact data shown above it</text>
<rect x="40" y="392" width="920" height="60" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
<text x="500" y="416" text-anchor="middle" font-size="10.5" fill="#7b341e">Every real tool from this module, together on one page -- confirmed clean end to end with AppTest,</text>
<text x="500" y="436" text-anchor="middle" font-size="10.5" fill="#7b341e">and visually confirmed with one real screenshot of the finished report.</text>
<defs><marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a0aec0"/></marker></defs>
</svg>