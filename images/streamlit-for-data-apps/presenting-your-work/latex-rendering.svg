<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="348" viewBox="0 0 1000 348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title>st.latex Renders Real, Readable Math</title>
<desc>A three-row stack. Row 1: a raw Python r-string holding LaTeX syntax, backslash bar x equals backslash frac one n backslash sum. Row 2: st.latex renders that string as real typeset math notation in the browser. Row 3: AppTest confirms the exact rendered string back, including the real interpolated numbers n equals 142 and the real mean 67.0074, matching this course own already-established anchor figure.</desc>
<rect width="1000" height="348" fill="#ffffff" />
<text x="500" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">st.latex Renders Real, Readable Math</text>
<rect x="60" y="60" width="880" height="44" rx="7" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" />
<text x="500" y="86" text-anchor="middle" font-size="10.5" font-weight="400" font-family="Menlo, monospace" fill="#2d3748">Raw string: r&quot;\bar{x} = \frac{1}{n} \sum_{i=1}^{n} x_i&quot;</text>
<path d="M500,107 L500,123" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr2)" />
<rect x="60" y="126" width="880" height="44" rx="7" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" />
<text x="500" y="152" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">st.latex(...) -- rendered as real typeset math in the browser</text>
<path d="M500,173 L500,189" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr2)" />
<rect x="60" y="192" width="880" height="44" rx="7" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" />
<text x="500" y="218" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">AppTest confirms the exact string, with n=142 and mean=67.0074 interpolated</text>
<rect x="40" y="260" width="920" height="60" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
<text x="500" y="284" text-anchor="middle" font-size="10.5" fill="#7b341e">Unlike st.pyplot, a latex element own .value IS directly readable through AppTest -- confirmed here</text>
<text x="500" y="304" text-anchor="middle" font-size="10.5" fill="#7b341e">to hold the real interpolated numbers, not just assumed from the raw code.</text>
<defs><marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a0aec0"/></marker></defs>
</svg>