<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="414" viewBox="0 0 1000 414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title>From CSV to Chart</title>
<desc>A four-stage pipeline diagram. Stage 1: gapminder.csv, 1704 rows loaded with pandas. Stage 2: st.selectbox lets the reader pick one of 5 continents. Stage 3: the DataFrame is filtered to only that continents rows, confirmed by AppTest to change the row count from 624 for Africa to 24 for Oceania. Stage 4: the filtered rows are grouped by year and averaged, then charted with st.line_chart, producing a real line of average life expectancy over time for whichever continent is selected.</desc>
<rect width="1000" height="414" fill="#ffffff" />
<text x="500" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">From CSV to Chart</text>
<rect x="60" y="60" width="880" height="44" rx="7" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5" />
<text x="500" y="86" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">gapminder.csv -- 1,704 rows, pd.read_csv</text>
<path d="M500,107 L500,123" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr2)" />
<rect x="60" y="126" width="880" height="44" rx="7" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" />
<text x="500" y="152" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">st.selectbox(&quot;Continent&quot;, ...) -- reader picks 1 of 5</text>
<path d="M500,173 L500,189" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr2)" />
<rect x="60" y="192" width="880" height="44" rx="7" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" />
<text x="500" y="218" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">df[df.continent == continent] -- 624 rows (Africa) to 24 (Oceania)</text>
<path d="M500,239 L500,255" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr2)" />
<rect x="60" y="258" width="880" height="44" rx="7" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" />
<text x="500" y="284" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">.groupby(&quot;year&quot;)[&quot;lifeExp&quot;].mean() -&gt; st.line_chart(...)</text>
<rect x="40" y="326" width="920" height="60" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
<text x="500" y="350" text-anchor="middle" font-size="10.5" fill="#7b341e">One filter, confirmed to genuinely change both the row count and the chart it feeds -- not just the</text>
<text x="500" y="370" text-anchor="middle" font-size="10.5" fill="#7b341e">dropdown label.</text>
<defs><marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a0aec0"/></marker></defs>
</svg>