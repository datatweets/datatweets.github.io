<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="414" viewBox="0 0 1000 414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title>The Actual Debugging Workflow</title>
<desc>A four-step workflow diagram. Step 1: write plain pandas logic in a script or notebook cell, no st. calls at all. Step 2: print or inspect the real output and confirm it is correct. Step 3: once confirmed correct, wrap the working logic in st. calls. Step 4: run streamlit run app.py -- any remaining error is now isolated to the Streamlit layer, not the data logic.</desc>
<rect width="1000" height="414" fill="#ffffff" />
<text x="500" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The Actual Debugging Workflow</text>
<rect x="60" y="60" width="880" height="44" rx="7" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" />
<text x="500" y="86" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">1. Write plain pandas logic -- a script or notebook cell, no st. calls</text>
<path d="M500,107 L500,123" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr2)" />
<rect x="60" y="126" width="880" height="44" rx="7" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" />
<text x="500" y="152" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">2. print() the real output, confirm it is correct</text>
<path d="M500,173 L500,189" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr2)" />
<rect x="60" y="192" width="880" height="44" rx="7" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" />
<text x="500" y="218" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">3. Wrap the confirmed-correct logic in st. calls</text>
<path d="M500,239 L500,255" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr2)" />
<rect x="60" y="258" width="880" height="44" rx="7" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" />
<text x="500" y="284" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#2d3748">4. streamlit run app.py -- any remaining error is isolated to the Streamlit layer</text>
<rect x="40" y="326" width="920" height="60" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
<text x="500" y="350" text-anchor="middle" font-size="10.5" fill="#7b341e">Checking data logic outside Streamlit is cheaper than checking it through a rerun, and it isolates</text>
<text x="500" y="370" text-anchor="middle" font-size="10.5" fill="#7b341e">whether a bug is in the data logic or in Streamlit itself.</text>
<defs><marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a0aec0"/></marker></defs>
</svg>