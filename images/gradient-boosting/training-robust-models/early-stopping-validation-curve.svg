ze="13" font-weight="600" fill="#4a5568">Boosting rounds (number of trees, cap = 2000)</text><line x1="700.1" y1="60" x2="700.1" y2="390" stroke="#48bb78" stroke-width="1.6" stroke-dasharray="5,4" /><circle cx="700.1" cy="311.8" r="5" fill="#276749" /><rect x="556" y="66" width="150" height="40" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1" /><text x="631" y="83" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">best_iteration = 1614</text><text x="631" y="99" text-anchor="middle" font-size="11" fill="#276749">val RMSE = 0.4632</text><polyline fill="none" stroke="#a0aec0" stroke-width="2.4" points="70 71.6 89.5 266.1 109 297.1 148.1 314.3 226.2 331.9 304.2 342.4 382.3 350.8 460.4 357.5 538.5 363.3 616.5 368.7 700.1 373.9 720 375" /><polyline fill="none" stroke="#2b6cb0" stroke-width="2.6" points="70 74.6 89.5 256.8 109 282.7 148.1 293.9 226.2 302.8 304.2 305.9 382.3 308 460.4 310 538.5 310.6 616.5 311.2 700.1 311.8 720 311.8" /><rect x="360" y="150" width="196" height="66" rx="8" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" /><line x1="374" y1="170" x2="404" y2="170" stroke="#2b6cb0" stroke-width="2.6" /><text x="412" y="174" font-size="12.5" fill="#1a202c">Validation RMSE (drives stopping)</text><line x1="374" y1="194" x2="404" y2="194" stroke="#a0aec0" stroke-width="2.4" /><text x="412" y="198" font-size="12.5" fill="#1a202c">Training RMSE (keeps dropping)</text><text x="712" y="360" text-anchor="end" font-size="11.5" fill="#c05621">trees past 1614 add fit</text><text x="712" y="375" text-anchor="end" font-size="11.5" fill="#c05621">but not validation gain</text></svg>