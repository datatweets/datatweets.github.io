<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="Two-panel diagram. Left panel titled Default direction for missing values shows a decision tree split node reading hours-per-week less than 40. A solid branch labeled less than 40 goes to a green leaf predicting at most 50K, and a solid branch labeled 40 or more goes to a blue leaf predicting greater than 50K. A dashed orange branch labeled value is missing NaN routes missing rows to the green leaf, marked as the learned default direction, so no imputation is needed. Right panel titled Feature count fed to XGBoost shows two bars: a short green bar of 14 columns for native categorical and a tall blue bar of 105 columns for one-hot encoding, with a note that both reach nearly the same test AUC, 0.9300 versus 0.9308."><rect x="0" y="0" width="880" height="440" fill="#ffffff" /><line x1="440" y1="30" x2="440" y2="410" stroke="#e2e8f0" stroke-width="2" /><text x="220" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#1a202c">Default direction for missing values</text><rect x="128" y="72" width="184" height="46" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" /><text x="220" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#2b6cb0">split on</text><text x="220" y="111" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1a202c">hours-per-week &lt; 40 ?</text><line x1="176" y1="118" x2="108" y2="238" stroke="#4a5568" stroke-width="2" /><text x="118" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#4a5568">&lt; 40</text><line x1="264" y1="118" x2="332" y2="238" stroke="#4a5568" stroke-width="2" /><text x="322" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#4a5568">≥ 40</text><path d="M168 118C120 150 96 190 92 236" fill="none" stroke="#ed8936" stroke-width="2.5" stroke-dasharray="7 5" /><polygon points="92 244 87 232 97 232" fill="#ed8936" /><text x="40" y="150" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c05621">value is</text><text x="40" y="166" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c05621">missing (NaN)</text><rect x="40" y="240" width="130" height="52" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="2" /><text x="105" y="262" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#276749">predict ≤ 50K</text><text x="105" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#48bb78">learned default</text><rect x="270" y="240" width="130" height="52" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" /><text x="335" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#2b6cb0">predict &gt; 50K</text><text x="220" y="330" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#4a5568">Missing rows follow the branch XGBoost learned</text><text x="220" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#4a5568">was best — no imputation required.</text><text x="670" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#1a202c">Feature count fed to XGBoost</text><line x1="510" y1="352" x2="850" y2="352" stroke="#a0aec0" stroke-width="2" /><rect x="560" y="317" width="90" height="35" fill="#48bb78" stroke="#276749" stroke-width="2" /><text x="605" y="308" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#276749">14</text><text x="605" y="372" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#4a5568">native categorical</text><rect x="720" y="92" width="90" height="260" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="765" y="83" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#2b6cb0">105</text><text x="765" y="372" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#4a5568">one-hot encoding</text><text x="670" y="404" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#c05621">Nearly identical test AUC: 0.9300 vs 0.9308</text></svg>