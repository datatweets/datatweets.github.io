<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="860" height="430" fill="#ffffff" /><text x="430" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Catching high earners: default vs. reweighted XGBoost</text><text x="430" y="56" text-anchor="middle" font-size="13" fill="#4a5568">Same test set of 2,338 real high earners. Bottom row shows who the model caught (green) vs. missed (red).</text><text x="300" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#2b6cb0">Default (scale_pos_weight = 1)</text><text x="250" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#4a5568">Pred ≤50K</text><text x="350" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#4a5568">Pred &gt;50K</text><rect x="200" y="130" width="100" height="64" fill="#ebf8ff" stroke="#a0aec0" stroke-width="1" /><rect x="300" y="130" width="100" height="64" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" /><text x="250" y="167" text-anchor="middle" font-size="17" font-weight="700" fill="#2b6cb0">7129</text><text x="350" y="167" text-anchor="middle" font-size="17" font-weight="700" fill="#718096">302</text><rect x="200" y="194" width="100" height="64" fill="#fff5f5" stroke="#a0aec0" stroke-width="1" /><rect x="300" y="194" width="100" height="64" fill="#f0fff4" stroke="#a0aec0" stroke-width="1" /><text x="250" y="223" text-anchor="middle" font-size="17" font-weight="700" fill="#c53030">1168</text><text x="250" y="242" text-anchor="middle" font-size="9.5" fill="#c53030">missed</text><text x="350" y="223" text-anchor="middle" font-size="17" font-weight="700" fill="#276749">1170</text><text x="350" y="242" text-anchor="middle" font-size="9.5" fill="#276749">caught</text><text x="196" y="167" text-anchor="end" font-size="10.5" fill="#4a5568">Actual ≤50K</text><text x="196" y="230" text-anchor="end" font-size="10.5" fill="#4a5568">Actual &gt;50K</text><rect x="200" y="286" width="200" height="34" rx="5" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" /><text x="300" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">Recall on &gt;50K: 50.0%</text><text x="610" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#276749">Reweighted (scale_pos_weight = 3.18)</text><text x="560" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#4a5568">Pred ≤50K</text><text x="660" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#4a5568">Pred &gt;50K</text><rect x="510" y="130" width="100" height="64" fill="#ebf8ff" stroke="#a0aec0" stroke-width="1" /><rect x="610" y="130" width="100" height="64" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" /><text x="560" y="167" text-anchor="middle" font-size="17" font-weight="700" fill="#2b6cb0">5793</text><text x="660" y="167" text-anchor="middle" font-size="17" font-weight="700" fill="#718096">1638</text><rect x="510" y="194" width="100" height="64" fill="#fff5f5" stroke="#a0aec0" stroke-width="1" /><rect x="610" y="194" width="100" height="64" fill="#f0fff4" stroke="#a0aec0" stroke-width="1" /><text x="560" y="223" text-anchor="middle" font-size="17" font-weight="700" fill="#c53030">521</text><text x="560" y="242" text-anchor="middle" font-size="9.5" fill="#c53030">missed</text><text x="660" y="223" text-anchor="middle" font-size="17" font-weight="700" fill="#276749">1817</text><text x="660" y="242" text-anchor="middle" font-size="9.5" fill="#276749">caught</text><text x="506" y="167" text-anchor="end" font-size="10.5" fill="#4a5568">Actual ≤50K</text><text x="506" y="230" text-anchor="end" font-size="10.5" fill="#4a5568">Actual &gt;50K</text><rect x="510" y="286" width="200" height="34" rx="5" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="610" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">Recall on &gt;50K: 77.7%</text><rect x="200" y="356" width="510" height="52" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" /><text x="455" y="378" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c05621">The trade-off: recall jumps from 50.0% to 77.7%,</text><text x="455" y="397" text-anchor="middle" font-size="12.5" fill="#c05621">but positive-class precision drops from 79.5% to 52.6% (more false alarms).</text></svg>