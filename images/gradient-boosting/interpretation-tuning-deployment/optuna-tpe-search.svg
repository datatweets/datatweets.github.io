<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="720" height="440" fill="#ffffff" /><text x="360" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">How Optuna's TPE search finds better settings over 30 trials</text><text x="360" y="56" text-anchor="middle" font-size="13" fill="#4a5568">Best validation RMSE so far falls as past trials steer the next ones (lower is better)</text><rect x="80" y="72" width="580" height="268" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" /><line x1="80" y1="340" x2="660" y2="340" stroke="#e2e8f0" stroke-width="1" /><line x1="80" y1="263" x2="660" y2="263" stroke="#e2e8f0" stroke-width="1" /><line x1="80" y1="187" x2="660" y2="187" stroke="#e2e8f0" stroke-width="1" /><line x1="80" y1="110" x2="660" y2="110" stroke="#e2e8f0" stroke-width="1" /><text x="72" y="344" text-anchor="end" font-size="11" fill="#718096">0.450</text><text x="72" y="267" text-anchor="end" font-size="11" fill="#718096">0.460</text><text x="72" y="191" text-anchor="end" font-size="11" fill="#718096">0.470</text><text x="72" y="114" text-anchor="end" font-size="11" fill="#718096">0.480</text><text x="30" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#4a5568" transform="rotate(-90 30 206)">Validation RMSE</text><text x="80" y="360" text-anchor="middle" font-size="11" fill="#718096">1</text><text x="280" y="360" text-anchor="middle" font-size="11" fill="#718096">11</text><text x="400" y="360" text-anchor="middle" font-size="11" fill="#718096">17</text><text x="660" y="360" text-anchor="middle" font-size="11" fill="#718096">30</text><text x="370" y="382" text-anchor="middle" font-size="12" font-weight="600" fill="#4a5568">Optuna trial number</text><line x1="80" y1="112" x2="660" y2="112" stroke="#a0aec0" stroke-width="2" stroke-dasharray="6 4" /><text x="656" y="106" text-anchor="end" font-size="11" font-weight="600" fill="#718096">default baseline 0.4798</text><polyline fill="none" stroke="#48bb78" stroke-width="3" stroke-linejoin="round" points="80 116 120 116 120 218 280 218 280 227 300 227 300 235 360 235 360 306 400 306 400 312 660 312" /><circle cx="660" cy="312" r="5" fill="#276749" /><text x="638" y="330" text-anchor="end" font-size="12" font-weight="700" fill="#276749">best 0.4535</text><circle cx="80" cy="116" r="4" fill="#276749" /><rect x="330" y="140" width="316" height="66" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1" /><text x="346" y="162" font-size="12" font-weight="700" fill="#2b6cb0">TPE learns from past trials</text><text x="346" y="180" font-size="11.5" fill="#2b6cb0">Instead of guessing blindly, the sampler builds a</text><text x="346" y="196" font-size="11.5" fill="#2b6cb0">model of what worked and concentrates near it.</text><line x1="96" y1="410" x2="126" y2="410" stroke="#48bb78" stroke-width="3" /><text x="132" y="414" font-size="12" fill="#4a5568">Best validation RMSE so far (tuned)</text><line x1="420" y1="410" x2="450" y2="410" stroke="#a0aec0" stroke-width="2" stroke-dasharray="6 4" /><text x="456" y="414" font-size="12" fill="#4a5568">Default-XGBoost baseline</text></svg>