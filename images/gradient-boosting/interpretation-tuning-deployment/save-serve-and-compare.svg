<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="920" height="620" fill="#ffffff" /><text x="460" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a202c">From Trained Model to Live Prediction</text><text x="460" y="56" text-anchor="middle" font-size="13" fill="#4a5568">Save the fitted model to disk, load it back, and serve one district through predict_price().</text><rect x="24" y="84" width="176" height="88" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" /><text x="112" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">1. Train</text><text x="112" y="134" text-anchor="middle" font-size="12" fill="#4a5568">XGBRegressor.fit()</text><text x="112" y="152" text-anchor="middle" font-size="12" fill="#4a5568">RMSE 0.4696</text><line x1="204" y1="128" x2="248" y2="128" stroke="#a0aec0" stroke-width="2.5" /><polygon points="248 122 260 128 248 134" fill="#a0aec0" /><rect x="264" y="70" width="200" height="118" rx="10" fill="#f0fff4" stroke="#276749" stroke-width="2" /><text x="364" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">2. Save to disk</text><rect x="278" y="104" width="172" height="34" rx="6" fill="#48bb78" /><text x="364" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">save_model("m.json")</text><text x="364" y="133" text-anchor="middle" font-size="10" fill="#f0fff4">portable, forward-compatible</text><rect x="278" y="146" width="172" height="32" rx="6" fill="#fffaf0" stroke="#c05621" stroke-width="1.5" /><text x="364" y="161" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c05621">joblib.dump(model)</text><text x="364" y="173" text-anchor="middle" font-size="10" fill="#c05621">handy, version-fragile</text><line x1="468" y1="128" x2="512" y2="128" stroke="#a0aec0" stroke-width="2.5" /><polygon points="512 122 524 128 512 134" fill="#a0aec0" /><rect x="528" y="84" width="176" height="88" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" /><text x="616" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">3. Load</text><text x="616" y="134" text-anchor="middle" font-size="12" fill="#4a5568">load_model("m.json")</text><text x="616" y="152" text-anchor="middle" font-size="11" fill="#276749">predictions match exactly</text><line x1="708" y1="128" x2="752" y2="128" stroke="#a0aec0" stroke-width="2.5" /><polygon points="752 122 764 128 752 134" fill="#a0aec0" /><rect x="768" y="84" width="128" height="88" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="2" /><text x="832" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">4. Serve</text><text x="832" y="134" text-anchor="middle" font-size="11.5" fill="#4a5568">predict_price()</text><text x="832" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">$253,518</text><line x1="24" y1="212" x2="896" y2="212" stroke="#e2e8f0" stroke-width="1.5" /><text x="460" y="244" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Three Gradient Boosting Libraries</text><rect x="24" y="264" width="200" height="40" rx="6" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" /><rect x="228" y="264" width="220" height="40" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5" /><rect x="452" y="264" width="220" height="40" rx="6" fill="#f0fff4" stroke="#276749" stroke-width="1.5" /><rect x="676" y="264" width="220" height="40" rx="6" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.5" /><text x="124" y="289" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">Trait</text><text x="338" y="289" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">XGBoost</text><text x="562" y="289" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">LightGBM</text><text x="786" y="289" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">CatBoost</text><text x="36" y="331" font-size="12.5" font-weight="600" fill="#4a5568">Tree growth</text><text x="338" y="331" text-anchor="middle" font-size="12" fill="#2d3748">level-wise (default)</text><text x="562" y="331" text-anchor="middle" font-size="12" fill="#2d3748">leaf-wise, histogram</text><text x="786" y="331" text-anchor="middle" font-size="12" fill="#2d3748">symmetric, ordered</text><rect x="24" y="344" width="872" height="30" fill="#f7fafc" /><text x="36" y="364" font-size="12.5" font-weight="600" fill="#4a5568">Test RMSE here</text><text x="338" y="364" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">0.4696</text><text x="562" y="364" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">0.4686</text><text x="786" y="364" text-anchor="middle" font-size="12" fill="#718096">not installed</text><text x="36" y="398" font-size="12.5" font-weight="600" fill="#4a5568">Best at</text><text x="338" y="398" text-anchor="middle" font-size="12" fill="#2d3748">robust default, huge</text><text x="338" y="414" text-anchor="middle" font-size="12" fill="#2d3748">ecosystem</text><text x="562" y="398" text-anchor="middle" font-size="12" fill="#2d3748">speed on large,</text><text x="562" y="414" text-anchor="middle" font-size="12" fill="#2d3748">wide data</text><text x="786" y="398" text-anchor="middle" font-size="12" fill="#2d3748">categorical-heavy</text><text x="786" y="414" text-anchor="middle" font-size="12" fill="#2d3748">data, less tuning</text><rect x="24" y="428" width="872" height="46" fill="#f7fafc" /><text x="36" y="450" font-size="12.5" font-weight="600" fill="#4a5568">Watch out</text><text x="338" y="450" text-anchor="middle" font-size="12" fill="#2d3748">slower on very</text><text x="338" y="466" text-anchor="middle" font-size="12" fill="#2d3748">large data</text><text x="562" y="450" text-anchor="middle" font-size="12" fill="#2d3748">leaf-wise can overfit</text><text x="562" y="466" text-anchor="middle" font-size="12" fill="#2d3748">small data</text><text x="786" y="450" text-anchor="middle" font-size="12" fill="#2d3748">slower to train,</text><text x="786" y="466" text-anchor="middle" font-size="12" fill="#2d3748">separate install</text><line x1="224" y1="264" x2="224" y2="474" stroke="#e2e8f0" stroke-width="1" /><line x1="448" y1="264" x2="448" y2="474" stroke="#e2e8f0" stroke-width="1" /><line x1="672" y1="264" x2="672" y2="474" stroke="#e2e8f0" stroke-width="1" /><rect x="24" y="500" width="872" height="94" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" /><text x="44" y="528" font-size="13" font-weight="700" fill="#c05621">On this small, all-numeric dataset the two are effectively tied.</text><text x="44" y="550" font-size="12.5" fill="#4a5568">LightGBM (0.4686) and XGBoost (0.4696) land within a whisker of each other on California Housing.</text><text x="44" y="570" font-size="12.5" fill="#4a5568">Pick by data shape, not by leaderboard folklore: XGBoost for a safe default, LightGBM for large/wide data,</text><text x="44" y="586" font-size="12.5" fill="#4a5568">CatBoost when raw categorical columns dominate. All three save and serve the same way.</text></svg>