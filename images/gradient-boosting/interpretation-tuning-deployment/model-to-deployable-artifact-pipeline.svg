<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="860" height="470" fill="#ffffff" /><text x="430" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">From Model to Deployable Artifact</text><text x="430" y="56" text-anchor="middle" font-size="13" fill="#718096">Four stages turn one tuned model into a documented, servable deliverable</text><rect x="24" y="86" width="180" height="96" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" /><text x="114" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">1. Tune</text><text x="114" y="134" text-anchor="middle" font-size="12" fill="#4a5568">Optuna, 25 trials</text><text x="114" y="152" text-anchor="middle" font-size="12" fill="#4a5568">TPESampler(seed=42)</text><text x="114" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">test RMSE 0.4404</text><rect x="238" y="86" width="180" height="96" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="2" /><text x="328" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">2. Explain</text><text x="328" y="134" text-anchor="middle" font-size="12" fill="#4a5568">SHAP TreeExplainer</text><text x="328" y="152" text-anchor="middle" font-size="12" fill="#4a5568">global + local</text><text x="328" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">top: Latitude 0.48</text><rect x="452" y="86" width="180" height="96" rx="10" fill="#f0fff4" stroke="#276749" stroke-width="2" /><text x="542" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">3. Package</text><text x="542" y="134" text-anchor="middle" font-size="12" fill="#4a5568">save_model .ubj</text><text x="542" y="152" text-anchor="middle" font-size="12" fill="#4a5568">reload &amp; verify</text><text x="542" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">predictions match</text><rect x="666" y="86" width="180" height="96" rx="10" fill="#fffaf0" stroke="#c05621" stroke-width="2" /><text x="756" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">4. Serve</text><text x="756" y="134" text-anchor="middle" font-size="12" fill="#4a5568">predict(features)</text><text x="756" y="152" text-anchor="middle" font-size="12" fill="#4a5568">loads artifact</text><text x="756" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">scores new row</text><line x1="206" y1="134" x2="234" y2="134" stroke="#a0aec0" stroke-width="2.5" /><polygon points="234 134 226 130 226 138" fill="#a0aec0" /><line x1="420" y1="134" x2="448" y2="134" stroke="#a0aec0" stroke-width="2.5" /><polygon points="448 134 440 130 440 138" fill="#a0aec0" /><line x1="634" y1="134" x2="662" y2="134" stroke="#a0aec0" stroke-width="2.5" /><polygon points="662 134 654 130 654 138" fill="#a0aec0" /><rect x="24" y="228" width="822" height="216" rx="12" fill="#f7fafc" stroke="#4a5568" stroke-width="2" /><rect x="24" y="228" width="822" height="34" rx="12" fill="#4a5568" /><rect x="24" y="250" width="822" height="12" fill="#4a5568" /><text x="40" y="251" font-size="14" font-weight="700" fill="#ffffff">Deliverable: Model Card (housing_xgb_card.json)</text><text x="46" y="292" font-size="12.5" font-weight="700" fill="#1a202c">Predicts</text><text x="46" y="312" font-size="12" fill="#4a5568">MedHouseVal, in units of</text><text x="46" y="330" font-size="12" fill="#4a5568">$100,000, per California</text><text x="46" y="348" font-size="12" fill="#4a5568">census block group</text><text x="300" y="292" font-size="12.5" font-weight="700" fill="#1a202c">Metrics (sealed test set)</text><text x="300" y="312" font-size="12" fill="#4a5568">test RMSE = 0.4404</text><text x="300" y="330" font-size="12" fill="#4a5568">test R² = 0.8520</text><text x="300" y="348" font-size="12" fill="#4a5568">n = 4,128 districts</text><text x="560" y="292" font-size="12.5" font-weight="700" fill="#1a202c">Top features (mean |SHAP|)</text><text x="560" y="312" font-size="12" fill="#4a5568">1. Latitude · 2. Longitude</text><text x="560" y="330" font-size="12" fill="#4a5568">3. MedInc · 4. AveOccup</text><text x="560" y="348" font-size="12" fill="#4a5568">location dominates price</text><line x1="46" y1="372" x2="824" y2="372" stroke="#e2e8f0" stroke-width="1.5" /><text x="46" y="398" font-size="12.5" font-weight="700" fill="#c53030">Honest limitations</text><text x="46" y="418" font-size="12" fill="#4a5568">Trained on 1990 California census data only — not current, not causal, and not valid outside its</text><text x="46" y="436" font-size="12" fill="#4a5568">geographic scope. Correlations, not interventions: SHAP explains the model, not the housing market.</text></svg>