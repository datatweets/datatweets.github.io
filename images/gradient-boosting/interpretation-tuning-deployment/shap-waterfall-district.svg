<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="SHAP waterfall plot for one California district. The prediction starts at the base value E of f of x equals 2.072, the average predicted median house value across all districts. Six stacked red bars each push the prediction down toward the left: MedInc of 1.68 contributes minus 0.547, Latitude of 36.06 contributes minus 0.452, Longitude of minus 119.01 contributes minus 0.270, AveOccup of 3.88 contributes minus 0.240, AveRooms of 4.19 contributes minus 0.092, and three smaller features together contribute minus 0.011. Adding the base value 2.072 to the sum of these six signed SHAP contributions, minus 1.612, lands exactly at the model prediction f of x equals 0.460."><rect x="0" y="0" width="780" height="520" fill="#ffffff" /><text x="390" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">SHAP waterfall: explaining one district's predicted price</text><text x="390" y="56" text-anchor="middle" font-size="13" fill="#4a5568">base value + sum of signed SHAP contributions = the model's prediction for this row</text><line x1="686.9" y1="86" x2="686.9" y2="392" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="4,4" /><text x="686.9" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">E[f(x)] = 2.072</text><line x1="271.2" y1="86" x2="271.2" y2="392" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="4,4" /><text x="271.2" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b6cb0">f(x) = 0.460</text><line x1="545.9" y1="136" x2="545.9" y2="158" stroke="#a0aec0" stroke-width="1" stroke-dasharray="2,2" /><line x1="429.3" y1="184" x2="429.3" y2="206" stroke="#a0aec0" stroke-width="1" stroke-dasharray="2,2" /><line x1="359.7" y1="232" x2="359.7" y2="254" stroke="#a0aec0" stroke-width="1" stroke-dasharray="2,2" /><line x1="297.8" y1="280" x2="297.8" y2="302" stroke="#a0aec0" stroke-width="1" stroke-dasharray="2,2" /><line x1="274.1" y1="328" x2="274.1" y2="350" stroke="#a0aec0" stroke-width="1" stroke-dasharray="2,2" /><text x="196" y="127" text-anchor="end" font-size="12.5" fill="#1a202c">MedInc = 1.68</text><rect x="545.9" y="110" width="141" height="26" fill="#fc8181" stroke="#c53030" stroke-width="1.2" /><text x="616" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#742a2a">−0.547</text><text x="196" y="175" text-anchor="end" font-size="12.5" fill="#1a202c">Latitude = 36.06</text><rect x="429.3" y="158" width="116.6" height="26" fill="#fc8181" stroke="#c53030" stroke-width="1.2" /><text x="487" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#742a2a">−0.452</text><text x="196" y="223" text-anchor="end" font-size="12.5" fill="#1a202c">Longitude = −119.01</text><rect x="359.7" y="206" width="69.6" height="26" fill="#fc8181" stroke="#c53030" stroke-width="1.2" /><text x="394" y="223" text-anchor="middle" font-size="12" font-weight="700" fill="#742a2a">−0.270</text><text x="196" y="271" text-anchor="end" font-size="12.5" fill="#1a202c">AveOccup = 3.88</text><rect x="297.8" y="254" width="61.9" height="26" fill="#fc8181" stroke="#c53030" stroke-width="1.2" /><text x="329" y="271" text-anchor="middle" font-size="12" font-weight="700" fill="#742a2a">−0.240</text><text x="196" y="319" text-anchor="end" font-size="12.5" fill="#1a202c">AveRooms = 4.19</text><rect x="274.1" y="302" width="23.7" height="26" fill="#fc8181" stroke="#c53030" stroke-width="1.2" /><text x="266" y="319" text-anchor="end" font-size="12" font-weight="700" fill="#c53030">−0.092</text><text x="196" y="367" text-anchor="end" font-size="12.5" fill="#4a5568">3 smaller features</text><rect x="271.2" y="350" width="2.9" height="26" fill="#fc8181" stroke="#c53030" stroke-width="1.2" /><text x="263" y="367" text-anchor="end" font-size="12" font-weight="700" fill="#c53030">−0.011</text><line x1="40" y1="404" x2="740" y2="404" stroke="#e2e8f0" stroke-width="1.5" /><text x="40" y="436" font-size="13.5" fill="#1a202c"><tspan font-weight="700">2.072</tspan> (base)  <tspan font-weight="700" fill="#c53030">− 1.612</tspan> (sum of SHAP values)  =  <tspan font-weight="700" fill="#2b6cb0">0.460</tspan> (prediction)</text><text x="40" y="462" font-size="12.5" fill="#4a5568">This district sits far below the California average: low median income and its northern-interior location</text><text x="40" y="480" font-size="12.5" fill="#4a5568">push the predicted median house value down from 2.072 to 0.460 (units of \$100,000).</text><text x="40" y="504" font-size="11.5" fill="#718096">Bars in red push the prediction down; a bar to the right (green) would push it up. Contributions are exact TreeExplainer SHAP values.</text></svg>