<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="900" height="560" fill="#ffffff" /><text x="450" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1a202c">How XGBoost scores a split: similarity in, gain out</text><text x="450" y="62" text-anchor="middle" font-size="14" fill="#4a5568">Sum the gradients (G) and hessians (H) in each node, then compare similarity scores</text><rect x="330" y="90" width="240" height="96" rx="12" fill="#faf5ff" stroke="#6b46c1" stroke-width="2" /><text x="450" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#6b46c1">Parent (all 6 rows)</text><text x="450" y="138" text-anchor="middle" font-size="14" fill="#4a5568">G = -129.0   H = 6.0</text><text x="450" y="160" text-anchor="middle" font-size="13" fill="#4a5568">similarity = G² / (H + λ)</text><text x="450" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#1a202c">= 2377.29</text><line x1="400" y1="186" x2="230" y2="252" stroke="#a0aec0" stroke-width="2" /><line x1="500" y1="186" x2="670" y2="252" stroke="#a0aec0" stroke-width="2" /><text x="288" y="222" text-anchor="middle" font-size="13" fill="#718096">units &lt; 20</text><text x="612" y="222" text-anchor="middle" font-size="13" fill="#718096">units ≥ 20</text><rect x="70" y="258" width="270" height="150" rx="12" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" /><text x="205" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#2b6cb0">Left leaf (low units)</text><text x="205" y="308" text-anchor="middle" font-size="14" fill="#4a5568">G_L = -34.5   H_L = 3.0</text><text x="205" y="332" text-anchor="middle" font-size="13" fill="#4a5568">weight w* = -G_L / (H_L + λ)</text><text x="205" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#1a202c">= 8.625</text><text x="205" y="376" text-anchor="middle" font-size="13" fill="#4a5568">similarity = G_L² / (H_L + λ)</text><text x="205" y="394" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">= 297.56</text><rect x="560" y="258" width="270" height="150" rx="12" fill="#f0fff4" stroke="#276749" stroke-width="2" /><text x="695" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#276749">Right leaf (high units)</text><text x="695" y="308" text-anchor="middle" font-size="14" fill="#4a5568">G_R = -94.5   H_R = 3.0</text><text x="695" y="332" text-anchor="middle" font-size="13" fill="#4a5568">weight w* = -G_R / (H_R + λ)</text><text x="695" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#1a202c">= 23.625</text><text x="695" y="376" text-anchor="middle" font-size="13" fill="#4a5568">similarity = G_R² / (H_R + λ)</text><text x="695" y="394" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">= 2232.56</text><rect x="150" y="440" width="600" height="96" rx="12" fill="#fffaf0" stroke="#c05621" stroke-width="2" /><text x="450" y="468" text-anchor="middle" font-size="15" font-weight="700" fill="#c05621">Gain of the split (λ = 1, γ = 0)</text><text x="450" y="494" text-anchor="middle" font-size="14" fill="#4a5568">Gain = ½ [ sim_L + sim_R − sim_parent ] − γ</text><text x="450" y="516" text-anchor="middle" font-size="14" fill="#4a5568">= ½ [ 297.56 + 2232.56 − 2377.29 ] − 0</text><text x="450" y="532" text-anchor="middle" font-size="15" font-weight="700" fill="#c05621">= 76.42   (positive → keep the split)</text></svg>