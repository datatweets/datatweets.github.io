<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="880" height="470" fill="#ffffff" /><text x="30" y="34" font-size="19" font-weight="700" fill="#1a202c">What makes XGBoost different</text><text x="30" y="56" font-size="13" fill="#4a5568">Four design choices layered on top of plain gradient boosting</text><rect x="30" y="80" width="230" height="66" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5" /><text x="45" y="107" font-size="14" font-weight="700" fill="#2b6cb0">Regularized objective</text><text x="45" y="128" font-size="12" fill="#4a5568">Penalizes complex trees to</text><text x="45" y="143" font-size="12" fill="#4a5568">fight overfitting</text><rect x="30" y="158" width="230" height="66" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5" /><text x="45" y="185" font-size="14" font-weight="700" fill="#276749">Second-order optimization</text><text x="45" y="206" font-size="12" fill="#4a5568">Uses the gradient and the</text><text x="45" y="221" font-size="12" fill="#4a5568">hessian of the loss</text><rect x="30" y="236" width="230" height="66" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="1.5" /><text x="45" y="263" font-size="14" font-weight="700" fill="#c05621">Sparsity-aware splits</text><text x="45" y="284" font-size="12" fill="#4a5568">Handles missing values</text><text x="45" y="299" font-size="12" fill="#4a5568">natively when splitting</text><rect x="30" y="314" width="230" height="66" rx="8" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.5" /><text x="45" y="341" font-size="14" font-weight="700" fill="#6b46c1">Engineered for speed</text><text x="45" y="362" font-size="12" fill="#4a5568">Cache-aware, parallel</text><text x="45" y="377" font-size="12" fill="#4a5568">split finding</text><rect x="330" y="190" width="130" height="90" rx="10" fill="#2b6cb0" stroke="#1a202c" stroke-width="1.5" /><text x="395" y="228" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">XGBoost</text><text x="395" y="250" font-size="12" fill="#ebf8ff" text-anchor="middle">boosted trees,</text><text x="395" y="266" font-size="12" fill="#ebf8ff" text-anchor="middle">upgraded</text><line x1="260" y1="113" x2="326" y2="200" stroke="#a0aec0" stroke-width="2" /><line x1="260" y1="191" x2="326" y2="212" stroke="#a0aec0" stroke-width="2" /><line x1="260" y1="269" x2="326" y2="255" stroke="#a0aec0" stroke-width="2" /><line x1="260" y1="347" x2="326" y2="268" stroke="#a0aec0" stroke-width="2" /><polygon points="326 200 316 199 320 208" fill="#a0aec0" /><polygon points="326 212 316 209 318 219" fill="#a0aec0" /><polygon points="326 255 316 251 316 261" fill="#a0aec0" /><polygon points="326 268 318 263 316 273" fill="#a0aec0" /><line x1="560" y1="90" x2="560" y2="410" stroke="#e2e8f0" stroke-width="1" /><text x="600" y="82" font-size="15" font-weight="700" fill="#1a202c">Test RMSE on California Housing</text><text x="600" y="101" font-size="12" fill="#718096">Lower is better • same split, random_state=42</text><line x1="620" y1="400" x2="850" y2="400" stroke="#4a5568" stroke-width="1.5" /><rect x="650" y="130" width="70" height="270" fill="#a0aec0" /><text x="685" y="122" font-size="14" font-weight="700" fill="#4a5568" text-anchor="middle">0.5422</text><text x="685" y="418" font-size="12" fill="#4a5568" text-anchor="middle">Gradient</text><text x="685" y="432" font-size="12" fill="#4a5568" text-anchor="middle">Boosting</text><rect x="760" y="164" width="70" height="236" fill="#48bb78" /><text x="795" y="156" font-size="14" font-weight="700" fill="#276749" text-anchor="middle">0.4696</text><text x="795" y="418" font-size="12" fill="#276749" text-anchor="middle">XGBoost</text><text x="795" y="432" font-size="12" fill="#276749" text-anchor="middle">(both APIs)</text><text x="600" y="450" font-size="12" fill="#718096">Same defaults family, XGBoost lands</text><text x="600" y="465" font-size="12" fill="#718096">lower and trains faster.</text></svg>