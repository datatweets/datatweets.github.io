<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="880" height="470" fill="#ffffff" /><text x="30" y="34" font-size="19" font-weight="700" fill="#1a202c">Tuning XGBoost: test RMSE across the project</text><text x="30" y="56" font-size="13" fill="#4a5568">California Housing • lower is better • test set untouched until Stage 4 • note the zoomed y-axis</text><line x1="110" y1="100" x2="110" y2="390" stroke="#4a5568" stroke-width="1.5" /><line x1="110" y1="390" x2="620" y2="390" stroke="#4a5568" stroke-width="1.5" /><line x1="110" y1="278" x2="620" y2="278" stroke="#e2e8f0" stroke-width="1" /><line x1="110" y1="166" x2="620" y2="166" stroke="#e2e8f0" stroke-width="1" /><text x="100" y="394" font-size="12" fill="#718096" text-anchor="end">0.42</text><text x="100" y="282" font-size="12" fill="#718096" text-anchor="end">0.44</text><text x="100" y="170" font-size="12" fill="#718096" text-anchor="end">0.46</text><text x="52" y="240" font-size="12" fill="#4a5568" text-anchor="middle" transform="rotate(-90 52 240)">Test RMSE</text><line x1="110" y1="151" x2="620" y2="151" stroke="#fc8181" stroke-width="1.5" stroke-dasharray="6 4" /><text x="616" y="145" font-size="11" fill="#c53030" text-anchor="end">Stage 1 floor</text><rect x="160" y="151" width="90" height="239" fill="#a0aec0" /><text x="205" y="143" font-size="14" font-weight="700" fill="#4a5568" text-anchor="middle">0.4626</text><text x="205" y="410" font-size="12" font-weight="700" fill="#4a5568" text-anchor="middle">Stage 1</text><text x="205" y="426" font-size="12" fill="#718096" text-anchor="middle">Baseline</text><rect x="320" y="210" width="90" height="180" fill="#4299e1" /><text x="365" y="204" font-size="14" font-weight="700" fill="#2b6cb0" text-anchor="middle">0.4522</text><text x="365" y="410" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">Stage 2</text><text x="365" y="426" font-size="12" fill="#718096" text-anchor="middle">+ structural</text><rect x="480" y="267" width="90" height="123" fill="#48bb78" /><text x="525" y="259" font-size="14" font-weight="700" fill="#276749" text-anchor="middle">0.4419</text><text x="525" y="410" font-size="12" font-weight="700" fill="#276749" text-anchor="middle">Stage 4</text><text x="525" y="426" font-size="12" fill="#718096" text-anchor="middle">+ regularization</text><line x1="250" y1="151" x2="325" y2="188.8" stroke="#276749" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="405" y1="229.12" x2="480" y2="267" stroke="#276749" stroke-width="1.5" stroke-dasharray="4 3" /><rect x="300" y="150" width="150" height="24" rx="6" fill="#f0fff4" stroke="#276749" stroke-width="1" /><text x="375" y="166" font-size="12" font-weight="700" fill="#276749" text-anchor="middle">−0.0208 (4.5% lower)</text><rect x="660" y="96" width="200" height="300" rx="8" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5" /><text x="676" y="122" font-size="13" font-weight="700" fill="#1a202c">Final tuned model</text><text x="676" y="150" font-size="12" fill="#4a5568">max_depth 6</text><text x="676" y="169" font-size="12" fill="#4a5568">min_child_weight 5</text><text x="676" y="188" font-size="12" fill="#4a5568">learning_rate 0.05</text><text x="676" y="207" font-size="12" fill="#4a5568">n_estimators 600</text><text x="676" y="226" font-size="12" fill="#4a5568">reg_lambda 10</text><text x="676" y="245" font-size="12" fill="#4a5568">subsample 0.8</text><text x="676" y="264" font-size="12" fill="#4a5568">colsample_bytree 0.8</text><line x1="676" y1="284" x2="844" y2="284" stroke="#e2e8f0" stroke-width="1" /><text x="676" y="308" font-size="12" font-weight="700" fill="#2b6cb0">Test R²</text><text x="844" y="308" font-size="12" fill="#4a5568" text-anchor="end">0.837 → 0.851</text><text x="676" y="332" font-size="12" font-weight="700" fill="#c05621">Train−test gap</text><text x="844" y="332" font-size="12" fill="#4a5568" text-anchor="end">0.187 → 0.139</text><text x="676" y="366" font-size="11" fill="#718096">Gains are modest but real,</text><text x="676" y="382" font-size="11" fill="#718096">and generalization improves.</text></svg>