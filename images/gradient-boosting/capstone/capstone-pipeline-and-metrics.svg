<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="1000" height="660" fill="#ffffff" /><text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a202c">One dataset, four modules: from a naive baseline to an honest, tuned, explained model</text><text x="500" y="58" text-anchor="middle" font-size="14" fill="#4a5568">Adult Income (48,842 rows, ~24% earn &gt;50K) taken end to end — each module contributes one link in the chain</text><rect x="30" y="86" width="220" height="128" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" /><rect x="30" y="86" width="220" height="30" rx="10" fill="#4299e1" /><rect x="30" y="101" width="220" height="15" fill="#4299e1" /><text x="140" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Module 1 · Boosting Foundations</text><text x="140" y="140" text-anchor="middle" font-size="12.5" fill="#2b6cb0">The additive idea behind</text><text x="140" y="158" text-anchor="middle" font-size="12.5" fill="#2b6cb0">every booster: trees fit the</text><text x="140" y="176" text-anchor="middle" font-size="12.5" fill="#2b6cb0">negative gradient of a loss.</text><text x="140" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">Baseline recall 0.65</text><rect x="270" y="86" width="220" height="128" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><rect x="270" y="86" width="220" height="30" rx="10" fill="#9f7aea" /><rect x="270" y="101" width="220" height="15" fill="#9f7aea" /><text x="380" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Module 2 · XGBoost in Depth</text><text x="380" y="140" text-anchor="middle" font-size="12.5" fill="#6b46c1">The library itself: the</text><text x="380" y="158" text-anchor="middle" font-size="12.5" fill="#6b46c1">regularized objective and</text><text x="380" y="176" text-anchor="middle" font-size="12.5" fill="#6b46c1">every hyperparameter knob.</text><text x="380" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">subsample, depth, gamma</text><rect x="510" y="86" width="220" height="128" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="2" /><rect x="510" y="86" width="220" height="30" rx="10" fill="#ed8936" /><rect x="510" y="101" width="220" height="15" fill="#ed8936" /><text x="620" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Module 3 · Training Robust Models</text><text x="620" y="140" text-anchor="middle" font-size="12.5" fill="#c05621">Early stopping, xgb.cv, and</text><text x="620" y="158" text-anchor="middle" font-size="12.5" fill="#c05621">scale_pos_weight for the</text><text x="620" y="176" text-anchor="middle" font-size="12.5" fill="#c05621">3-to-1 class imbalance.</text><text x="620" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">recall 0.65 → 0.85</text><rect x="750" y="86" width="220" height="128" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><rect x="750" y="86" width="220" height="30" rx="10" fill="#48bb78" /><rect x="750" y="101" width="220" height="15" fill="#48bb78" /><text x="860" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Module 4 · Interpret, Tune, Ship</text><text x="860" y="140" text-anchor="middle" font-size="12.5" fill="#276749">Optuna tunes it, SHAP</text><text x="860" y="158" text-anchor="middle" font-size="12.5" fill="#276749">explains it, and honest</text><text x="860" y="176" text-anchor="middle" font-size="12.5" fill="#276749">test metrics judge it.</text><text x="860" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">AUC 0.930 · recall 0.86</text><path d="M250 150L268 150" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><path d="M490 150L508 150" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><path d="M730 150L748 150" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#a0aec0" /></marker></defs><line x1="30" y1="248" x2="970" y2="248" stroke="#e2e8f0" stroke-width="1.5" /><text x="500" y="282" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The honest scorecard on the sealed test set: naive baseline vs. final model</text><line x1="120" y1="580" x2="960" y2="580" stroke="#4a5568" stroke-width="1.5" /><line x1="120" y1="484" x2="960" y2="484" stroke="#e2e8f0" stroke-width="1" /><text x="112" y="488" text-anchor="end" font-size="11" fill="#718096">0.40</text><line x1="120" y1="436" x2="960" y2="436" stroke="#e2e8f0" stroke-width="1" /><text x="112" y="440" text-anchor="end" font-size="11" fill="#718096">0.60</text><line x1="120" y1="388" x2="960" y2="388" stroke="#e2e8f0" stroke-width="1" /><text x="112" y="392" text-anchor="end" font-size="11" fill="#718096">0.80</text><line x1="120" y1="340" x2="960" y2="340" stroke="#e2e8f0" stroke-width="1" /><text x="112" y="344" text-anchor="end" font-size="11" fill="#718096">1.00</text><rect x="230" y="424" width="70" height="156" fill="#a0aec0" /><text x="265" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">0.65</text><rect x="310" y="374" width="70" height="206" fill="#48bb78" /><text x="345" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">0.86</text><text x="305" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Positive-class recall</text><text x="305" y="618" text-anchor="middle" font-size="11.5" fill="#c53030">+0.21 — the headline gain</text><rect x="500" y="360" width="70" height="220" fill="#a0aec0" /><text x="535" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">0.918</text><rect x="580" y="357" width="70" height="223" fill="#4299e1" /><text x="615" y="349" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">0.930</text><text x="575" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">ROC AUC</text><text x="575" y="618" text-anchor="middle" font-size="11.5" fill="#276749">+0.012 — real ranking skill</text><rect x="770" y="386" width="70" height="194" fill="#a0aec0" /><text x="805" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">0.810</text><rect x="850" y="380" width="70" height="200" fill="#4299e1" /><text x="885" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">0.834</text><text x="845" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Average precision</text><text x="845" y="618" text-anchor="middle" font-size="11.5" fill="#276749">+0.024 — better on the minority</text><rect x="230" y="636" width="15" height="15" fill="#a0aec0" /><text x="252" y="648" font-size="12.5" fill="#4a5568">Naive baseline (300 fixed trees)</text><rect x="500" y="636" width="15" height="15" fill="#48bb78" /><text x="522" y="648" font-size="12.5" fill="#4a5568">Final model (imbalance-aware, Optuna-tuned, SHAP-explained)</text></svg>