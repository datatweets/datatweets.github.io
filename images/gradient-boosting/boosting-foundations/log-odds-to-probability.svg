<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="780" height="380" fill="#ffffff" /><text x="390" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">From Accumulated Log-Odds to a Probability</text><rect x="30" y="80" width="220" height="220" rx="12" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" /><text x="140" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">Accumulate in log-odds space</text><rect x="55" y="126" width="170" height="30" rx="6" fill="#ffffff" stroke="#a0aec0" stroke-width="1" /><text x="140" y="146" text-anchor="middle" font-size="13" fill="#4a5568">base F0 = −1.16</text><text x="140" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#2b6cb0">+</text><rect x="55" y="186" width="170" height="26" rx="6" fill="#ffffff" stroke="#a0aec0" stroke-width="1" /><text x="140" y="204" text-anchor="middle" font-size="12" fill="#4a5568">tree 1 : +0.71</text><rect x="55" y="216" width="170" height="26" rx="6" fill="#ffffff" stroke="#a0aec0" stroke-width="1" /><text x="140" y="234" text-anchor="middle" font-size="12" fill="#4a5568">tree 2 : +0.58   …</text><line x1="55" y1="256" x2="225" y2="256" stroke="#4299e1" stroke-width="1.5" /><text x="140" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#2b6cb0">F(x) = 0.85</text><line x1="256" y1="190" x2="316" y2="190" stroke="#4a5568" stroke-width="2.5" /><polygon points="316 190 304 184 304 196" fill="#4a5568" /><rect x="322" y="80" width="200" height="220" rx="12" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="422" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">Sigmoid (logistic)</text><line x1="352" y1="270" x2="502" y2="270" stroke="#a0aec0" stroke-width="1.5" /><line x1="427" y1="130" x2="427" y2="278" stroke="#e2e8f0" stroke-width="1.5" /><path d="M352 268C400 266 410 200 427 200C444 200 454 134 502 132" fill="none" stroke="#6b46c1" stroke-width="3" /><line x1="454" y1="152" x2="454" y2="270" stroke="#ed8936" stroke-width="1.5" stroke-dasharray="4,3" /><line x1="352" y1="152" x2="454" y2="152" stroke="#ed8936" stroke-width="1.5" stroke-dasharray="4,3" /><circle cx="454" cy="152" r="5" fill="#ed8936" /><text x="454" y="288" text-anchor="middle" font-size="11" fill="#718096">F(x)</text><text x="422" y="128" text-anchor="middle" font-size="12" font-style="italic" fill="#6b46c1">p = 1 / (1 + e^(−F))</text><line x1="528" y1="190" x2="588" y2="190" stroke="#4a5568" stroke-width="2.5" /><polygon points="588 190 576 184 576 196" fill="#4a5568" /><rect x="594" y="120" width="156" height="140" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="672" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">Probability</text><text x="672" y="200" text-anchor="middle" font-size="30" font-weight="700" fill="#276749">0.70</text><text x="672" y="230" text-anchor="middle" font-size="13" fill="#276749">P(income &gt; 50K)</text><text x="390" y="344" text-anchor="middle" font-size="12" fill="#718096">Trees add up in log-odds space; the sigmoid squashes the total into a valid 0-to-1 probability.</text></svg>