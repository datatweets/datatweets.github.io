<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="720" height="470" fill="#ffffff" /><text x="360" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">Learning Curve: Test RMSE vs. Number of Trees</text><text x="360" y="50" text-anchor="middle" font-size="13" fill="#718096">Scratch booster on California Housing (learning_rate = 0.1, max_depth = 3)</text><rect x="80" y="60" width="600" height="320" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" /><g stroke="#e2e8f0" stroke-width="1"><line x1="80" y1="380" x2="680" y2="380" /><line x1="80" y1="297.5" x2="680" y2="297.5" /><line x1="80" y1="215" x2="680" y2="215" /><line x1="80" y1="132.5" x2="680" y2="132.5" /><line x1="80" y1="60" x2="680" y2="60" /></g><g font-size="12" fill="#4a5568" text-anchor="end"><text x="72" y="384">0.4</text><text x="72" y="301.5">0.6</text><text x="72" y="219">0.8</text><text x="72" y="136.5">1.0</text><text x="72" y="64">1.2</text></g><text x="26" y="220" text-anchor="middle" font-size="13" fill="#4a5568" transform="rotate(-90 26 220)">Test RMSE (lower is better)</text><g font-size="12" fill="#4a5568" text-anchor="middle"><text x="80" y="400">0</text><text x="230" y="400">50</text><text x="380" y="400">100</text><text x="530" y="400">150</text><text x="680" y="400">200</text></g><text x="380" y="424" text-anchor="middle" font-size="13" fill="#4a5568">Number of trees (boosting rounds)</text><line x1="80" y1="72.7" x2="680" y2="72.7" stroke="#fc8181" stroke-width="2" stroke-dasharray="6,4" /><text x="675" y="88" text-anchor="end" font-size="12" fill="#c53030">Baseline (mean) RMSE 1.145</text><polyline points="83 96.5 95 165.3 110 211.6 155 272.5 230 305.8 380 321.3 530 328.5 680 334.1" fill="none" stroke="#4299e1" stroke-width="3" /><g fill="#2b6cb0"><circle cx="83" cy="96.5" r="4.5" /><circle cx="95" cy="165.3" r="4.5" /><circle cx="110" cy="211.6" r="4.5" /><circle cx="155" cy="272.5" r="4.5" /><circle cx="230" cy="305.8" r="4.5" /><circle cx="380" cy="321.3" r="4.5" /><circle cx="530" cy="328.5" r="4.5" /><circle cx="680" cy="334.1" r="4.5" /></g><circle cx="680" cy="334.1" r="7" fill="none" stroke="#48bb78" stroke-width="2.5" /><text x="672" y="352" text-anchor="end" font-size="12" font-weight="700" fill="#276749">0.511 at 200 trees</text><text x="150" y="140" font-size="12" fill="#c05621">Each round shaves off</text><text x="150" y="156" font-size="12" fill="#c05621">a bit more error...</text><text x="470" y="300" font-size="12" fill="#718096">...gains flatten as</text><text x="470" y="316" font-size="12" fill="#718096">residuals shrink</text></svg>