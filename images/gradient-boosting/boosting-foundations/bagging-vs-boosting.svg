<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="820" height="460" fill="#ffffff" /><text x="205" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#2b6cb0">Bagging (Random Forest)</text><text x="205" y="56" text-anchor="middle" font-size="13" fill="#4a5568">Trees trained in parallel, independently</text><text x="615" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#c05621">Boosting (Gradient Boosting)</text><text x="615" y="56" text-anchor="middle" font-size="13" fill="#4a5568">Trees trained one after another</text><line x1="410" y1="70" x2="410" y2="440" stroke="#e2e8f0" stroke-width="2" /><rect x="140" y="82" width="130" height="34" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" /><text x="205" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#2b6cb0">Training data</text><line x1="175" y1="116" x2="90" y2="160" stroke="#a0aec0" stroke-width="2" /><line x1="205" y1="116" x2="205" y2="160" stroke="#a0aec0" stroke-width="2" /><line x1="235" y1="116" x2="320" y2="160" stroke="#a0aec0" stroke-width="2" /><g><circle cx="90" cy="178" r="9" fill="#4299e1" /><line x1="90" y1="187" x2="76" y2="208" stroke="#2b6cb0" stroke-width="2" /><line x1="90" y1="187" x2="104" y2="208" stroke="#2b6cb0" stroke-width="2" /><circle cx="76" cy="214" r="7" fill="#90cdf4" /><circle cx="104" cy="214" r="7" fill="#90cdf4" /><text x="90" y="245" text-anchor="middle" font-size="11" fill="#4a5568">Tree 1</text></g><g><circle cx="205" cy="178" r="9" fill="#4299e1" /><line x1="205" y1="187" x2="191" y2="208" stroke="#2b6cb0" stroke-width="2" /><line x1="205" y1="187" x2="219" y2="208" stroke="#2b6cb0" stroke-width="2" /><circle cx="191" cy="214" r="7" fill="#90cdf4" /><circle cx="219" cy="214" r="7" fill="#90cdf4" /><text x="205" y="245" text-anchor="middle" font-size="11" fill="#4a5568">Tree 2</text></g><g><circle cx="320" cy="178" r="9" fill="#4299e1" /><line x1="320" y1="187" x2="306" y2="208" stroke="#2b6cb0" stroke-width="2" /><line x1="320" y1="187" x2="334" y2="208" stroke="#2b6cb0" stroke-width="2" /><circle cx="306" cy="214" r="7" fill="#90cdf4" /><circle cx="334" cy="214" r="7" fill="#90cdf4" /><text x="320" y="245" text-anchor="middle" font-size="11" fill="#4a5568">Tree 3</text></g><line x1="90" y1="256" x2="190" y2="292" stroke="#a0aec0" stroke-width="2" /><line x1="205" y1="256" x2="205" y2="292" stroke="#a0aec0" stroke-width="2" /><line x1="320" y1="256" x2="220" y2="292" stroke="#a0aec0" stroke-width="2" /><rect x="120" y="296" width="170" height="36" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="205" y="319" text-anchor="middle" font-size="13" font-weight="600" fill="#276749">Average the votes</text><text x="205" y="366" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2b6cb0">Averaging lowers variance</text><text x="205" y="386" text-anchor="middle" font-size="11.5" fill="#718096">Each tree sees a bootstrap sample;</text><text x="205" y="402" text-anchor="middle" font-size="11.5" fill="#718096">order does not matter.</text><rect x="470" y="90" width="120" height="40" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="2" /><text x="530" y="108" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c05621">Tree 1</text><text x="530" y="123" text-anchor="middle" font-size="10.5" fill="#4a5568">rough prediction</text><line x1="590" y1="110" x2="648" y2="110" stroke="#a0aec0" stroke-width="2" /><rect x="650" y="90" width="120" height="40" rx="6" fill="#fff5f5" stroke="#fc8181" stroke-width="2" /><text x="710" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#c53030">Errors left over</text><text x="710" y="123" text-anchor="middle" font-size="10.5" fill="#4a5568">(residuals)</text><line x1="710" y1="130" x2="710" y2="160" stroke="#a0aec0" stroke-width="2" stroke-dasharray="4 3" /><text x="742" y="150" font-size="10.5" fill="#c53030" font-style="italic">focus here</text><rect x="650" y="162" width="120" height="40" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="2" /><text x="710" y="180" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c05621">Tree 2</text><text x="710" y="195" text-anchor="middle" font-size="10.5" fill="#4a5568">fixes Tree 1's errors</text><line x1="650" y1="182" x2="592" y2="182" stroke="#a0aec0" stroke-width="2" /><rect x="470" y="162" width="120" height="40" rx="6" fill="#fff5f5" stroke="#fc8181" stroke-width="2" /><text x="530" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#c53030">Smaller errors</text><text x="530" y="195" text-anchor="middle" font-size="10.5" fill="#4a5568">(new residuals)</text><line x1="530" y1="202" x2="530" y2="232" stroke="#a0aec0" stroke-width="2" stroke-dasharray="4 3" /><text x="562" y="222" font-size="10.5" fill="#c53030" font-style="italic">focus here</text><rect x="470" y="234" width="120" height="40" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="2" /><text x="530" y="252" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c05621">Tree 3</text><text x="530" y="267" text-anchor="middle" font-size="10.5" fill="#4a5568">fixes what remains</text><line x1="590" y1="254" x2="648" y2="254" stroke="#a0aec0" stroke-width="2" /><text x="710" y="252" text-anchor="middle" font-size="12" fill="#4a5568">… and so on</text><text x="710" y="269" text-anchor="middle" font-size="11" fill="#718096">for many trees</text><rect x="560" y="296" width="170" height="36" rx="6" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="645" y="319" text-anchor="middle" font-size="13" font-weight="600" fill="#6b46c1">Add every tree together</text><text x="615" y="366" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c05621">Correcting errors lowers bias</text><text x="615" y="386" text-anchor="middle" font-size="11.5" fill="#718096">Each tree depends on the one before it;</text><text x="615" y="402" text-anchor="middle" font-size="11.5" fill="#718096">order matters.</text></svg>