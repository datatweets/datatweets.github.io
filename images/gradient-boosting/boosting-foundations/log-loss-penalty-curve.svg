<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="720" height="400" fill="#ffffff" /><text x="360" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">Log Loss: the Penalty for a Confident Wrong Guess</text><line x1="90" y1="70" x2="90" y2="330" stroke="#a0aec0" stroke-width="1.5" /><line x1="90" y1="330" x2="670" y2="330" stroke="#a0aec0" stroke-width="1.5" /><line x1="90" y1="265" x2="670" y2="265" stroke="#edf2f7" stroke-width="1" /><line x1="90" y1="200" x2="670" y2="200" stroke="#edf2f7" stroke-width="1" /><line x1="90" y1="135" x2="670" y2="135" stroke="#edf2f7" stroke-width="1" /><line x1="375" y1="70" x2="375" y2="330" stroke="#edf2f7" stroke-width="1" /><text x="82" y="334" text-anchor="end" font-size="11" fill="#718096">0</text><text x="82" y="269" text-anchor="end" font-size="11" fill="#718096">1</text><text x="82" y="204" text-anchor="end" font-size="11" fill="#718096">2</text><text x="82" y="139" text-anchor="end" font-size="11" fill="#718096">3</text><text x="82" y="74" text-anchor="end" font-size="11" fill="#718096">4</text><text x="90" y="348" text-anchor="middle" font-size="11" fill="#718096">0.0</text><text x="375" y="348" text-anchor="middle" font-size="11" fill="#718096">0.5</text><text x="660" y="348" text-anchor="middle" font-size="11" fill="#718096">1.0</text><text x="380" y="372" text-anchor="middle" font-size="12" fill="#4a5568">predicted probability p</text><text x="34" y="200" text-anchor="middle" font-size="12" fill="#4a5568" transform="rotate(-90 34 200)">log loss L(y, p)</text><path d="M118.5 135 L147 181 L204 225 L261 252 L318 270 L375 285 L432 297 L489 307 L546 316 L603 323 L643 328" fill="none" stroke="#2b6cb0" stroke-width="3" /><path d="M107 328 L147 323 L204 316 L261 307 L318 297 L375 285 L432 270 L489 252 L546 225 L603 181 L631.5 135" fill="none" stroke="#dd6b20" stroke-width="3" /><line x1="375" y1="255" x2="375" y2="281" stroke="#a0aec0" stroke-width="1" stroke-dasharray="3,2" /><circle cx="375" cy="285" r="4" fill="#4a5568" /><text x="375" y="248" text-anchor="middle" font-size="10.5" fill="#4a5568">p = 0.5 &#8594; loss &#8776; 0.69</text><rect x="120" y="88" width="196" height="24" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="218" y="104" text-anchor="middle" font-size="11.5" fill="#2b6cb0">true label y = 1: L = &#8722;log(p)</text><rect x="430" y="88" width="210" height="24" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" /><text x="535" y="104" text-anchor="middle" font-size="11.5" fill="#dd6b20">true label y = 0: L = &#8722;log(1 &#8722; p)</text><text x="360" y="392" text-anchor="middle" font-size="12" fill="#718096">Each curve is near zero when the probability matches the label and rises steeply toward the wrong end.</text></svg>
