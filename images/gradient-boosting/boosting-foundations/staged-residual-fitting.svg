<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="430" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Gradient boosting: each tree fits what the model still gets wrong</text><rect x="30" y="60" width="210" height="150" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="135" y="84" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b46c1">Stage 0 • start from the mean</text><text x="135" y="104" text-anchor="middle" font-size="10.5" fill="#6b46c1">F₀(x) = mean(y) = 2.07</text><text x="135" y="126" text-anchor="middle" font-size="9" fill="#718096">residuals (y − F) are large</text><rect x="48" y="136" width="174" height="14" rx="3" fill="#fc8181" /><rect x="48" y="154" width="150" height="14" rx="3" fill="#fc8181" /><rect x="48" y="172" width="166" height="14" rx="3" fill="#fc8181" /><text x="135" y="200" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">train RMSE = 1.156</text><line x1="244" y1="135" x2="278" y2="135" stroke="#a0aec0" stroke-width="2.2" /><polygon points="278 135 268 130 268 140" fill="#a0aec0" /><rect x="282" y="60" width="210" height="150" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="387" y="84" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b6cb0">Stage 1 • add tree h₁</text><text x="387" y="104" text-anchor="middle" font-size="10.5" fill="#2b6cb0">F₁ = F₀ + 0.1 · h₁(x)</text><text x="387" y="126" text-anchor="middle" font-size="9" fill="#718096">tree trained on the residuals</text><rect x="300" y="136" width="120" height="14" rx="3" fill="#ed8936" /><rect x="300" y="154" width="104" height="14" rx="3" fill="#ed8936" /><rect x="300" y="172" width="112" height="14" rx="3" fill="#ed8936" /><text x="387" y="200" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c05621">train RMSE = 1.096</text><line x1="496" y1="135" x2="530" y2="135" stroke="#a0aec0" stroke-width="2.2" /><polygon points="530 135 520 130 520 140" fill="#a0aec0" /><rect x="534" y="60" width="210" height="150" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="639" y="84" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b6cb0">Stage 2 • add tree h₂</text><text x="639" y="104" text-anchor="middle" font-size="10.5" fill="#2b6cb0">F₂ = F₁ + 0.1 · h₂(x)</text><text x="639" y="126" text-anchor="middle" font-size="9" fill="#718096">fits the smaller leftover error</text><rect x="552" y="136" width="80" height="14" rx="3" fill="#ed8936" /><rect x="552" y="154" width="66" height="14" rx="3" fill="#ed8936" /><rect x="552" y="172" width="74" height="14" rx="3" fill="#ed8936" /><text x="639" y="200" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c05621">train RMSE = 1.043</text><text x="380" y="244" text-anchor="middle" font-size="11" fill="#4a5568">• • •  keep adding shallow trees, each shrinking the residuals by a small step  • • •</text><rect x="205" y="264" width="350" height="120" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.8" /><text x="380" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">After 50 trees • residuals nearly gone</text><text x="380" y="310" text-anchor="middle" font-size="10.5" fill="#276749">F⁵₀(x) = mean + 0.1 · (h₁ + h₂ + … + h⁵₀)</text><rect x="300" y="322" width="24" height="12" rx="3" fill="#48bb78" /><rect x="330" y="322" width="18" height="12" rx="3" fill="#48bb78" /><rect x="360" y="322" width="26" height="12" rx="3" fill="#48bb78" /><rect x="392" y="322" width="16" height="12" rx="3" fill="#48bb78" /><rect x="414" y="322" width="22" height="12" rx="3" fill="#48bb78" /><text x="380" y="360" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">train RMSE = 0.556</text><rect x="30" y="398" width="14" height="12" rx="3" fill="#fc8181" /><text x="50" y="408" font-size="9.5" fill="#4a5568">large residual</text><rect x="150" y="398" width="14" height="12" rx="3" fill="#ed8936" /><text x="170" y="408" font-size="9.5" fill="#4a5568">shrinking residual</text><rect x="300" y="398" width="14" height="12" rx="3" fill="#48bb78" /><text x="320" y="408" font-size="9.5" fill="#4a5568">tiny residual</text><text x="470" y="408" font-size="9.5" fill="#718096">bar length = size of the error the model still makes</text></svg>