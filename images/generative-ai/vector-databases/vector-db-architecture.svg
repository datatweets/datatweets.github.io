<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="390" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">What a vector database does for you</text><text x="30" y="74" font-size="13" font-weight="600" fill="#4a5568">1. Store once</text><rect x="24" y="86" width="120" height="40" rx="6" fill="#f7fafc" stroke="#cbd5e0" /><text x="84" y="105" text-anchor="middle" font-size="11" fill="#2d3748">your documents</text><text x="84" y="120" text-anchor="middle" font-size="11" fill="#718096">(text + metadata)</text><rect x="180" y="86" width="110" height="40" rx="6" fill="#ebf4ff" stroke="#4299e1" /><text x="235" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">embedding</text><text x="235" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">model</text><rect x="326" y="78" width="288" height="118" rx="10" fill="#f0fff4" stroke="#48bb78" /><text x="470" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Vector database</text><g font-size="10" fill="#2f855a"><rect x="342" y="108" width="256" height="18" rx="3" fill="#fff" stroke="#9ae6b4" /><text x="350" y="121">[0.13, -0.02, …]  topic: returns</text><rect x="342" y="130" width="256" height="18" rx="3" fill="#fff" stroke="#9ae6b4" /><text x="350" y="143">[0.41,  0.08, …]  topic: shipping</text><rect x="342" y="152" width="256" height="18" rx="3" fill="#fff" stroke="#9ae6b4" /><text x="350" y="165">[-0.07, 0.22, …]  topic: account</text></g><text x="470" y="186" text-anchor="middle" font-size="10" fill="#718096">vectors + metadata, indexed for fast search</text><line x1="144" y1="106" x2="178" y2="106" stroke="#a0aec0" stroke-width="1.6" /><polygon points="178 106 170 102 170 110" fill="#a0aec0" /><line x1="290" y1="106" x2="324" y2="115" stroke="#a0aec0" stroke-width="1.6" /><polygon points="324 115 315 113 318 121" fill="#a0aec0" /><text x="30" y="250" font-size="13" font-weight="600" fill="#4a5568">2. Query many times</text><rect x="24" y="262" width="120" height="40" rx="6" fill="#f7fafc" stroke="#cbd5e0" /><text x="84" y="281" text-anchor="middle" font-size="11" fill="#2d3748">user question</text><text x="84" y="296" text-anchor="middle" font-size="10" fill="#718096">"send something back?"</text><rect x="180" y="262" width="110" height="40" rx="6" fill="#ebf4ff" stroke="#4299e1" /><text x="235" y="286" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">embed query</text><rect x="326" y="246" width="288" height="76" rx="10" fill="#fffaf0" stroke="#ed8936" /><text x="470" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">nearest-neighbor search</text><rect x="342" y="276" width="256" height="20" rx="3" fill="#fff" stroke="#fbd38d" /><text x="350" y="290" font-size="10" fill="#9c4221">top match (0.75): "...return within 30 days..."</text><text x="470" y="313" text-anchor="middle" font-size="10" fill="#718096">returns the closest stored vectors — fast, even at millions</text><line x1="144" y1="282" x2="178" y2="282" stroke="#a0aec0" stroke-width="1.6" /><polygon points="178 282 170 278 170 286" fill="#a0aec0" /><line x1="290" y1="282" x2="324" y2="282" stroke="#a0aec0" stroke-width="1.6" /><polygon points="324 282 316 278 316 286" fill="#a0aec0" /><text x="320" y="372" text-anchor="middle" font-size="11" fill="#718096">Embed your data once and store it; then every query is embedded and matched against the index — no rescanning raw text.</text></svg>