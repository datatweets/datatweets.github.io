<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<rect width="640" height="340" fill="#ffffff" />
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Chroma's Query Result Shape</text>

<text x="30" y="62" font-size="13" font-weight="600" fill="#4a5568">res["documents"]</text>
<rect x="24" y="72" width="592" height="88" rx="10" fill="#f7fafc" stroke="#cbd5e0" />
<text x="40" y="90" font-size="11" fill="#718096">outer list — one entry per query you sent</text>
<rect x="48" y="98" width="300" height="48" rx="8" fill="#ebf4ff" stroke="#4299e1" />
<text x="60" y="112" font-size="10" font-weight="700" fill="#2b6cb0">inner list — matches for query 1</text>
<rect x="60" y="120" width="76" height="18" rx="4" fill="#ffffff" stroke="#9ae6b4" />
<text x="98" y="133" text-anchor="middle" font-size="9" fill="#2d3748">refund</text>
<rect x="144" y="120" width="76" height="18" rx="4" fill="#ffffff" stroke="#9ae6b4" />
<text x="182" y="133" text-anchor="middle" font-size="9" fill="#2d3748">shipping</text>
<rect x="228" y="120" width="90" height="18" rx="4" fill="#ffffff" stroke="#9ae6b4" />
<text x="273" y="133" text-anchor="middle" font-size="9" fill="#2d3748">countries</text>

<line x1="320" y1="164" x2="320" y2="196" stroke="#a0aec0" stroke-width="1.6" />
<polygon points="320 196 316 188 324 188" fill="#a0aec0" />
<text x="332" y="184" font-size="11" font-weight="700" fill="#c05621">[0]</text>
<text x="352" y="184" font-size="10" fill="#718096">selects query 1's own list</text>

<text x="30" y="222" font-size="13" font-weight="600" fill="#4a5568">res["documents"][0]</text>
<rect x="24" y="232" width="592" height="52" rx="10" fill="#f0fff4" stroke="#48bb78" />
<rect x="48" y="246" width="84" height="24" rx="4" fill="#ffffff" stroke="#68d391" />
<text x="90" y="262" text-anchor="middle" font-size="10" fill="#276749">refund</text>
<rect x="144" y="246" width="84" height="24" rx="4" fill="#ffffff" stroke="#68d391" />
<text x="186" y="262" text-anchor="middle" font-size="10" fill="#276749">shipping</text>
<rect x="240" y="246" width="98" height="24" rx="4" fill="#ffffff" stroke="#68d391" />
<text x="289" y="262" text-anchor="middle" font-size="10" fill="#276749">countries</text>
<text x="450" y="262" text-anchor="middle" font-size="10" fill="#718096">closest → farthest</text>

<text x="320" y="316" text-anchor="middle" font-size="11" fill="#718096">"documents", "distances", and "metadatas" are all one list per query — index [0] to reach a single query's own flat list of matches.</text>
</svg>
