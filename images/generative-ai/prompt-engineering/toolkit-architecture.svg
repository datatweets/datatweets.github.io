<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="780" height="440" fill="#ffffff" /><text x="390" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">One template, one call site, three tools</text><rect x="290" y="55" width="200" height="56" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.6" /><text x="390" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">build_prompt()</text><text x="390" y="96" text-anchor="middle" font-size="9" fill="#718096">role, task, context, format, constraints</text><line x1="330" y1="111" x2="140" y2="146" stroke="#a0aec0" stroke-width="1.6" /><polygon points="136 150 139 139 148 145" fill="#a0aec0" /><line x1="390" y1="111" x2="390" y2="146" stroke="#a0aec0" stroke-width="1.6" /><polygon points="390 150 385 141 395 141" fill="#a0aec0" /><line x1="450" y1="111" x2="640" y2="146" stroke="#a0aec0" stroke-width="1.6" /><polygon points="644 150 632 145 641 139" fill="#a0aec0" /><rect x="40" y="150" width="180" height="64" rx="9" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.6" /><text x="130" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">summarize()</text><text x="130" y="194" text-anchor="middle" font-size="8.5" fill="#3182ce">fixed sentence count</text><text x="130" y="206" text-anchor="middle" font-size="8.5" fill="#3182ce">+ named audience</text><rect x="300" y="150" width="180" height="64" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="390" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">classify()</text><text x="390" y="194" text-anchor="middle" font-size="8.5" fill="#805ad5">snaps the answer onto</text><text x="390" y="206" text-anchor="middle" font-size="8.5" fill="#805ad5">the allowed labels</text><rect x="560" y="150" width="180" height="64" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="650" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">extract()</text><text x="650" y="194" text-anchor="middle" font-size="8.5" fill="#9c4221">forced tool call &#8594;</text><text x="650" y="206" text-anchor="middle" font-size="8.5" fill="#9c4221">validated dict</text><line x1="150" y1="214" x2="335" y2="246" stroke="#a0aec0" stroke-width="1.6" /><polygon points="339 250 327 247 332 238" fill="#a0aec0" /><line x1="390" y1="214" x2="390" y2="246" stroke="#a0aec0" stroke-width="1.6" /><polygon points="390 250 385 241 395 241" fill="#a0aec0" /><line x1="630" y1="214" x2="445" y2="246" stroke="#a0aec0" stroke-width="1.6" /><polygon points="441 250 448 238 453 247" fill="#a0aec0" /><rect x="300" y="250" width="180" height="56" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="390" y="274" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">run()</text><text x="390" y="292" text-anchor="middle" font-size="8.5" fill="#2f855a">MODEL + TEMPERATURE, via extra_body</text><line x1="390" y1="306" x2="390" y2="338" stroke="#a0aec0" stroke-width="1.8" /><polygon points="390 342 385 333 395 333" fill="#a0aec0" /><rect x="300" y="344" width="180" height="50" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.6" /><text x="390" y="366" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2d3748">Anthropic API</text><text x="390" y="382" text-anchor="middle" font-size="8.5" fill="#718096">client.messages.create(&#8230;)</text><text x="390" y="418" text-anchor="middle" font-size="10.5" fill="#4a5568">Every tool speaks the same anatomy and goes through the same low-temperature call.</text><text x="390" y="434" text-anchor="middle" font-size="10.5" fill="#718096">Fix build_prompt() or run() once, and all three tools improve together.</text></svg>
