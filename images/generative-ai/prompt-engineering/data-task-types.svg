" y="178" text-anchor="middle" font-size="9" fill="#4a5568">three weeks ago&#8230;&#8221;</text><text x="249" y="194" text-anchor="middle" font-size="8" fill="#a0aec0">raw customer review</text><line x1="364" y1="172" x2="396" y2="172" stroke="#a0aec0" stroke-width="1.6" /><polygon points="400 172 392 167.5 392 176.5" fill="#a0aec0" /><rect x="400" y="140" width="250" height="64" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="525" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">shipping_delay</text><text x="525" y="194" text-anchor="middle" font-size="8" fill="#718096">one label, from a fixed set</text><rect x="30" y="220" width="90" height="64" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="75" y="256" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">SUMMARY</text><rect x="134" y="220" width="230" height="64" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" /><text x="249" y="244" text-anchor="middle" font-size="9" fill="#4a5568">&#8220;&#8230;duplicate charge,</text><text x="249" y="258" text-anchor="middle" font-size="9" fill="#4a5568">no reply from support&#8221;</text><text x="249" y="274" text-anchor="middle" font-size="8" fill="#a0aec0">raw customer review</text><line x1="364" y1="252" x2="396" y2="252" stroke="#a0aec0" stroke-width="1.6" /><polygon points="400 252 392 247.5 392 256.5" fill="#a0aec0" /><rect x="400" y="220" width="250" height="64" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" /><text x="525" y="248" text-anchor="middle" font-size="9.5" fill="#9c4221">&#8220;Blender order hasn&#8217;t</text><text x="525" y="262" text-anchor="middle" font-size="9.5" fill="#9c4221">shipped; no reply.&#8221;</text><text x="525" y="278" text-anchor="middle" font-size="8" fill="#718096">one sentence, for an engineer</text><text x="360" y="316" text-anchor="middle" font-size="10.5" fill="#4a5568">Same source text, three different jobs &#8212; a schema,