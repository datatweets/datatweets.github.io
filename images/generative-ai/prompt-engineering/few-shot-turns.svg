<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="300" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Few-shot: alternating user/assistant turns, then the real input</text><rect x="26" y="90" width="150" height="70" rx="9" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.6" /><text x="101" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">user</text><text x="101" y="132" text-anchor="middle" font-size="9" fill="#3182ce">&#8220;double-charged</text><text x="101" y="146" text-anchor="middle" font-size="9" fill="#3182ce">on my invoice&#8221;</text><rect x="200" y="90" width="150" height="70" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="275" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">assistant</text><text x="275" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">BILLING</text><text x="380" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#a0aec0">&#8942;</text><rect x="410" y="90" width="150" height="70" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="485" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">user (real)</text><text x="485" y="132" text-anchor="middle" font-size="9" fill="#9c4221">&#8220;the export button</text><text x="485" y="146" text-anchor="middle" font-size="9" fill="#9c4221">hasn&#8217;t worked&#8230;&#8221;</text><rect x="584" y="90" width="150" height="70" rx="9" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.6" stroke-dasharray="5 3" /><text x="659" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">assistant</text><text x="659" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#2d3748">BUG</text><text x="659" y="152" text-anchor="middle" font-size="8.5" font-style="italic" fill="#a0aec0">predicted</text><line x1="176" y1="125" x2="196" y2="125" stroke="#a0aec0" stroke-width="1.8" /><polygon points="200 125 192 120.5 192 129.5" fill="#a0aec0" /><line x1="560" y1="125" x2="580" y2="125" stroke="#a0aec0" stroke-width="1.8" /><polygon points="584 125 576 120.5 576 129.5" fill="#a0aec0" /><line x1="26" y1="176" x2="350" y2="176" stroke="#cbd5e0" stroke-width="1.2" /><line x1="26" y1="171" x2="26" y2="181" stroke="#cbd5e0" stroke-width="1.2" /><line x1="350" y1="171" x2="350" y2="181" stroke="#cbd5e0" stroke-width="1.2" /><text x="188" y="196" text-anchor="middle" font-size="10" fill="#718096">few-shot examples</text><line x1="410" y1="176" x2="734" y2="176" stroke="#cbd5e0" stroke-width="1.2" /><line x1="410" y1="171" x2="410" y2="181" stroke="#cbd5e0" stroke-width="1.2" /><line x1="734" y1="171" x2="734" y2="181" stroke="#cbd5e0" stroke-width="1.2" /><text x="572" y="196" text-anchor="middle" font-size="10" fill="#718096">real input &#8594; model continues the pattern</text><text x="380" y="240" text-anchor="middle" font-size="10.5" fill="#4a5568">The assistant turns are the demonstration &#8212; the model imitates their exact shape when it answers the real input.</text><text x="380" y="258" text-anchor="middle" font-size="10.5" fill="#718096">A bare label like &#8220;BILLING&#8221; is easier to copy than a paragraph explaining the same rule.</text></svg>
