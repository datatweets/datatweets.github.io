<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="400" fill="#ffffff" /><text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Six techniques bridge vague to sharp</text><rect x="30" y="70" width="220" height="100" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.8" /><text x="140" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">Vague prompt</text><text x="140" y="118" text-anchor="middle" font-size="10.5" fill="#c53030">&#8220;Write a product blurb.&#8221;</text><text x="140" y="136" text-anchor="middle" font-size="9" fill="#9b2c2c">no length target, no facts,</text><text x="140" y="150" text-anchor="middle" font-size="9" fill="#9b2c2c">no format, no constraints</text><rect x="510" y="70" width="220" height="100" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.8" /><text x="620" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">Sharp prompt</text><text x="620" y="118" text-anchor="middle" font-size="10.5" fill="#276749">&#8220;Under 70 words, 3 bullets,</text><text x="620" y="134" text-anchor="middle" font-size="9" fill="#2f855a">these facts, no exclamation</text><text x="620" y="148" text-anchor="middle" font-size="9" fill="#2f855a">marks.&#8221;</text><text x="380" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#718096">six techniques</text><line x1="250" y1="120" x2="504" y2="120" stroke="#a0aec0" stroke-width="2" /><polygon points="508 120 498 115 498 125" fill="#a0aec0" /><rect x="30" y="204" width="228" height="42" rx="8" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.4" /><text x="144" y="230" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2b6cb0">1 &#183; Specificity</text><rect x="266" y="204" width="228" height="42" rx="8" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.4" /><text x="380" y="230" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2b6cb0">2 &#183; Positive instructions</text><rect x="502" y="204" width="228" height="42" rx="8" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.4" /><text x="616" y="230" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2b6cb0">3 &#183; Format control</text><rect x="30" y="256" width="228" height="42" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="144" y="282" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b46c1">4 &#183; Delimiters</text><rect x="266" y="256" width="228" height="42" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="380" y="282" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b46c1">5 &#183; Ordering &amp; emphasis</text><rect x="502" y="256" width="228" height="42" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="616" y="282" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b46c1">6 &#183; Decomposition</text><text x="380" y="340" text-anchor="middle" font-size="10.5" fill="#4a5568">Each technique closes one specific gap between the vague ask and the sharp one.</text><text x="380" y="358" text-anchor="middle" font-size="10.5" fill="#718096">Lesson 2 walks through all six with real before-and-after model output.</text></svg>
