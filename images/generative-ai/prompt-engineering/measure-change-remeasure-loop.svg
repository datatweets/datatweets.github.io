<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="680" height="420" fill="#ffffff" /><text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The iteration loop: measure, change one thing, re-measure</text><rect x="270" y="60" width="140" height="72" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.7" /><text x="340" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b6cb0">Measure</text><text x="340" y="106" text-anchor="middle" font-size="9" fill="#3182ce">run score() to get</text><text x="340" y="120" text-anchor="middle" font-size="9" fill="#3182ce">a baseline number</text><rect x="50" y="250" width="210" height="76" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.7" /><text x="155" y="278" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b46c1">Change one thing</text><text x="155" y="298" text-anchor="middle" font-size="9" fill="#805ad5">add an example, fix the</text><text x="155" y="312" text-anchor="middle" font-size="9" fill="#805ad5">label set, tighten format</text><rect x="420" y="250" width="210" height="76" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.7" /><text x="525" y="278" text-anchor="middle" font-size="12.5" font-weight="700" fill="#276749">Re-measure</text><text x="525" y="298" text-anchor="middle" font-size="9" fill="#2f855a">same test set,</text><text x="525" y="312" text-anchor="middle" font-size="9" fill="#2f855a">same check</text><line x1="300" y1="130" x2="167" y2="246" stroke="#a0aec0" stroke-width="1.8" /><polygon points="164 250 165 239 174 246" fill="#a0aec0" /><line x1="260" y1="288" x2="416" y2="288" stroke="#a0aec0" stroke-width="1.8" /><polygon points="420 288 411 283.5 411 292.5" fill="#a0aec0" /><text x="340" y="271" text-anchor="middle" font-size="9" fill="#718096">same 8 messages, same check</text><path d="M 525 250 C 620 158 562 42 416 87" fill="none" stroke="#a0aec0" stroke-width="1.8" /><polygon points="412 90 419 82 424 91" fill="#a0aec0" /><text x="592" y="164" text-anchor="middle" font-size="9.5" fill="#718096">score went up &#8594;</text><text x="592" y="180" text-anchor="middle" font-size="9.5" fill="#718096">keep it; else revert</text><text x="340" y="372" text-anchor="middle" font-size="10.5" fill="#4a5568">Keep the change if the score went up; revert it if it didn&#8217;t.</text><text x="340" y="390" text-anchor="middle" font-size="10.5" fill="#718096">Change exactly one thing per lap, or you won&#8217;t know which change moved the number.</text></svg>
