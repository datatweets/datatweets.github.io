<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="780" height="330" fill="#ffffff" /><text x="390" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Grounding: the model answers only from what you give it</text><rect x="30" y="70" width="150" height="56" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" /><text x="105" y="94" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2d3748">Context</text><text x="105" y="112" text-anchor="middle" font-size="9" fill="#718096">plan details, facts you supply</text><rect x="30" y="150" width="150" height="56" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" /><text x="105" y="174" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2d3748">Question</text><text x="105" y="192" text-anchor="middle" font-size="9" fill="#718096">&#8220;what&#8217;s the upload limit?&#8221;</text><line x1="180" y1="98" x2="206" y2="122" stroke="#a0aec0" stroke-width="1.6" /><polygon points="209 126 199 122 205 114" fill="#a0aec0" /><line x1="180" y1="178" x2="206" y2="152" stroke="#a0aec0" stroke-width="1.6" /><polygon points="209 148 205 156 199 150" fill="#a0aec0" /><rect x="210" y="95" width="190" height="100" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.7" /><text x="305" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Grounded prompt</text><text x="305" y="140" text-anchor="middle" font-size="9" fill="#3182ce">&#8220;answer ONLY from</text><text x="305" y="154" text-anchor="middle" font-size="9" fill="#3182ce">context; if it&#8217;s not there,</text><text x="305" y="168" text-anchor="middle" font-size="9" fill="#3182ce">say so exactly&#8221;</text><line x1="400" y1="145" x2="436" y2="145" stroke="#a0aec0" stroke-width="1.8" /><polygon points="440 145 431 140.5 431 149.5" fill="#a0aec0" /><rect x="440" y="115" width="110" height="60" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.7" /><text x="495" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">Model</text><line x1="550" y1="128" x2="586" y2="96" stroke="#a0aec0" stroke-width="1.6" /><polygon points="589 92 584 101 578 94" fill="#a0aec0" /><text x="565" y="103" text-anchor="middle" font-size="8.5" fill="#718096">answer is</text><text x="565" y="114" text-anchor="middle" font-size="8.5" fill="#718096">in context</text><line x1="550" y1="162" x2="586" y2="194" stroke="#a0aec0" stroke-width="1.6" /><polygon points="589 198 578 196 584 189" fill="#a0aec0" /><text x="565" y="182" text-anchor="middle" font-size="8.5" fill="#718096">answer is</text><text x="565" y="193" text-anchor="middle" font-size="8.5" fill="#718096">missing</text><rect x="590" y="60" width="170" height="60" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="675" y="84" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">Answer, from context</text><text x="675" y="102" text-anchor="middle" font-size="9" fill="#2f855a">&#8220;10 seats on the Team plan.&#8221;</text><rect x="590" y="170" width="170" height="60" rx="9" fill="#fff5f5" stroke="#fc8181" stroke-width="1.6" /><text x="675" y="190" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">&#8220;I don&#8217;t know based on</text><text x="675" y="204" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">the provided information.&#8221;</text><text x="675" y="220" text-anchor="middle" font-size="8" fill="#a0aec0">exact phrase, checkable in code</text><text x="390" y="272" text-anchor="middle" font-size="10.5" fill="#4a5568">Same context, same instruction &#8212; the answer changes only because the fact does.</text><text x="390" y="290" text-anchor="middle" font-size="10.5" fill="#718096">That turns a hopeful reply into a contract your code can check.</text></svg>
