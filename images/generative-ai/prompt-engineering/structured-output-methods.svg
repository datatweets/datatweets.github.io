<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="380" fill="#ffffff" /><text x="360" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Two ways to get a schema-shaped answer</text><rect x="280" y="58" width="160" height="52" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.6" /><text x="360" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">your JSON schema</text><text x="360" y="98" text-anchor="middle" font-size="9" fill="#718096">name, sentiment, topics&#8230;</text><line x1="340" y1="112" x2="196" y2="164" stroke="#a0aec0" stroke-width="1.6" /><polygon points="192 168 195 158 202 165" fill="#a0aec0" /><line x1="420" y1="112" x2="524" y2="164" stroke="#a0aec0" stroke-width="1.6" /><polygon points="528 168 521 165 528 158" fill="#a0aec0" /><rect x="60" y="168" width="260" height="76" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.6" /><text x="190" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">Method 1</text><text x="190" y="214" text-anchor="middle" font-size="10.5" fill="#3182ce">json_schema output format</text><text x="190" y="232" text-anchor="middle" font-size="9" fill="#3182ce">output_config={&#8220;format&#8221;: &#8230;}</text><rect x="400" y="168" width="260" height="76" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="530" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">Method 2</text><text x="530" y="214" text-anchor="middle" font-size="10.5" fill="#805ad5">forced tool call</text><text x="530" y="232" text-anchor="middle" font-size="9" fill="#805ad5">tool_choice={&#8220;type&#8221;: &#8220;tool&#8221;, &#8230;}</text><line x1="190" y1="244" x2="190" y2="266" stroke="#a0aec0" stroke-width="1.6" /><polygon points="190 270 185 261 195 261" fill="#a0aec0" /><line x1="530" y1="244" x2="530" y2="266" stroke="#a0aec0" stroke-width="1.6" /><polygon points="530 270 525 261 535 261" fill="#a0aec0" /><rect x="60" y="272" width="260" height="60" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="190" y="296" text-anchor="middle" font-size="12.5" font-weight="700" fill="#276749">bare JSON text</text><text x="190" y="316" text-anchor="middle" font-size="9.5" fill="#2f855a">json.loads(raw) works first try</text><rect x="400" y="272" width="260" height="60" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="530" y="296" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c05621">tool_use.input</text><text x="530" y="316" text-anchor="middle" font-size="9.5" fill="#9c4221">already a parsed Python dict</text><text x="360" y="354" text-anchor="middle" font-size="10.5" fill="#4a5568">Both were verified on claude-haiku-4-5 and are equally trustworthy &#8212; pick by ergonomics.</text><text x="360" y="372" text-anchor="middle" font-size="10.5" fill="#718096">Method 1 for one clean object as text; Method 2 when you&#8217;re already working with tools.</text></svg>
