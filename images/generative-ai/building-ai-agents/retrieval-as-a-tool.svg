<svg xmlns="http://www.w3.org/2000/svg" width="660" height="380" viewBox="0 0 660 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="660" height="380" fill="#ffffff" /><text x="330" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Forced retrieval vs. retrieval as a tool</text><rect x="24" y="52" width="290" height="300" rx="10" fill="#f7fafc" stroke="#cbd5e0" /><text x="169" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">RAG workflow (Module 7)</text><rect x="54" y="98" width="230" height="36" rx="8" fill="#ffffff" stroke="#a0aec0" /><text x="169" y="121" text-anchor="middle" font-size="11" fill="#2d3748">any question</text><path d="M169 134 L 169 160" fill="none" stroke="#a0aec0" stroke-width="1.6" /><polygon points="169 160 165 151 173 151" fill="#a0aec0" /><rect x="54" y="164" width="230" height="36" rx="8" fill="#fffaf0" stroke="#ed8936" /><text x="169" y="187" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">retrieve (always)</text><path d="M169 200 L 169 226" fill="none" stroke="#a0aec0" stroke-width="1.6" /><polygon points="169 226 165 217 173 217" fill="#a0aec0" /><rect x="54" y="230" width="230" height="36" rx="8" fill="#ffffff" stroke="#a0aec0" /><text x="169" y="253" text-anchor="middle" font-size="11" fill="#2d3748">generate</text><path d="M169 266 L 169 292" fill="none" stroke="#a0aec0" stroke-width="1.6" /><polygon points="169 292 165 283 173 283" fill="#a0aec0" /><rect x="54" y="296" width="230" height="36" rx="8" fill="#ffffff" stroke="#a0aec0" /><text x="169" y="319" text-anchor="middle" font-size="11" fill="#2d3748">answer</text><text x="169" y="346" text-anchor="middle" font-size="9.5" fill="#718096">a greeting still triggers a search</text><rect x="346" y="52" width="290" height="300" rx="10" fill="#f7fafc" stroke="#cbd5e0" /><text x="491" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">Agent with