<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="680" height="410" fill="#ffffff" /><text x="340" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Planning a trajectory: each result feeds the next step</text><rect x="140" y="46" width="400" height="40" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="340" y="71" text-anchor="middle" font-size="11" fill="#2d3748">goal: compare yearly cost of Pro and Team for 3 people</text><path d="M340 86 L 340 108" fill="none" stroke="#a0aec0" stroke-width="1.6" /><polygon points="340 108 336 99 344 99" fill="#a0aec0" /><rect x="110" y="112" width="460" height="54" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="340" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">step 1 &#8212; get_price("pro") &#8594; 8, get_price("team") &#8594; 12</text><text x="340" y="152" text-anchor="middle" font-size="9.5" fill="#2f855a">two tool calls in one turn</text><path d="M180 166 L 180 200" fill="none" stroke="#48bb78" stroke-width="1.6" /><polygon points="180 200 176 191 184 191" fill="#48bb78" /><text x="55" y="187" text-anchor="start" font-size="9.5" font-weight="700" fill="#2f855a">8, 12 carry forward</text><rect x="70" y="204" width="540" height="92" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="340" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">step 2 &#8212; calculator calls using 8 and 12</text><text x="200" y="252" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2f855a">8*12*3 &#8594; 288</text><text x="200" y="270" text-anchor="middle" font-size="9" fill="#68855a">Pro, 3 people</text><text x="340" y="252" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2f855a">12*12 &#8594; 144</text><text x="340" y="270" text-anchor="middle" font-size="9" fill="#68855a">Team</text><text x="480" y="252" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2f855a">288-144 &#8594; 144</text><text x="480" y="270" text-anchor="middle" font-size="9" fill="#68855a">difference</text><path d="M180 296 L 180 330" fill="none" stroke="#ed8936" stroke-width="1.6" /><polygon points="180 330 176 321 184 321" fill="#ed8936" /><text x="55" y="317" text-anchor="start" font-size="9.5" font-weight="700" fill="#c05621">288, 144 carry forward</text><rect x="140" y="334" width="400" height="46" rx="8" fill="#fffaf0" stroke="#ed8936" /><text x="340" y="355" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">step 3 &#8212; stop_reason=end_turn</text><text x="340" y="371" text-anchor="middle" font-size="10" fill="#9c4221">answer: Team plan is $144/year cheaper</text></svg>