<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="380" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The agent loop: think, act, observe, repeat</text><rect x="40" y="62" width="160" height="48" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="120" y="83" text-anchor="middle" font-size="12" font-weight="600" fill="#2d3748">goal</text><text x="120" y="99" text-anchor="middle" font-size="10" fill="#718096">"temp in Tokyo in °F?"</text><circle cx="320" cy="195" r="64" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="320" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">Claude</text><text x="320" y="206" text-anchor="middle" font-size="11" fill="#805ad5">decides next</text><text x="320" y="220" text-anchor="middle" font-size="11" fill="#805ad5">step</text><line x1="160" y1="110" x2="280" y2="160" stroke="#a0aec0" stroke-width="1.6" /><polygon points="280 160 271 157 273 165" fill="#a0aec0" /><rect x="470" y="120" width="150" height="44" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="545" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">get_weather</text><text x="545" y="155" text-anchor="middle" font-size="9" fill="#2f855a">"Tokyo" → 14</text><rect x="470" y="176" width="150" height="44" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="545" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">calculator</text><text x="545" y="211" text-anchor="middle" font-size="9" fill="#2f855a">(14×9/5)+32 → 57.2</text><path d="M384 178Q440 150 468 145" fill="none" stroke="#48bb78" stroke-width="1.8" /><polygon points="468 145 459 145 463 152" fill="#48bb78" /><text x="430" y="135" text-anchor="middle" font-size="10" font-weight="600" fill="#2f855a">act (tool_use)</text><path d="M468 200Q440 235 386 218" fill="none" stroke="#dd6b20" stroke-width="1.8" /><polygon points="386 218 395 221 393 213" fill="#dd6b20" /><text x="438" y="248" text-anchor="middle" font-size="10" font-weight="600" fill="#c05621">observe (tool_result)</text><path d="M268 165Q210 150 230 215Q250 255 270 240" fill="none" stroke="#9f7aea" stroke-width="1.6" stroke-dasharray="4 3" /><polygon points="270 240 261 238 264 246" fill="#9f7aea" /><text x="196" y="205" text-anchor="middle" font-size="10" font-weight="600" fill="#6b46c1">loop while</text><text x="196" y="219" text-anchor="middle" font-size="10" font-weight="600" fill="#6b46c1">tool_use</text><rect x="232" y="300" width="176" height="48" rx="8" fill="#fffaf0" stroke="#ed8936" /><text x="320" y="321" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">final answer</text><text x="320" y="337" text-anchor="middle" font-size="10" fill="#9c4221">"14°C is 57.2°F"</text><line x1="320" y1="259" x2="320" y2="298" stroke="#a0aec0" stroke-width="1.6" /><polygon points="320 298 316 289 324 289" fill="#a0aec0" /><text x="372" y="282" text-anchor="middle" font-size="10" font-weight="600" fill="#718096">end_turn</text><text x="320" y="372" text-anchor="middle" font-size="11" fill="#718096">The model chooses a tool, sees the result, and decides again — looping until it has what it needs to answer.</text></svg>