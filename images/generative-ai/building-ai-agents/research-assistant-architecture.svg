<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="680" height="440" fill="#ffffff" /><text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The research assistant: one loop, three tools, memory, a plan</text><rect x="240" y="50" width="200" height="40" rx="8" fill="#faf5ff" stroke="#9f7aea" /><text x="340" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">planning system prompt</text><path d="M340 90 L 340 118" fill="none" stroke="#9f7aea" stroke-width="1.6" /><polygon points="340 118 336 109 344 109" fill="#9f7aea" /><circle cx="340" cy="216" r="76" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="340" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">agent loop</text><text x="340" y="228" text-anchor="middle" font-size="10" fill="#805ad5">stop_reason?</text><rect x="30" y="176" width="150" height="50" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="105" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">messages</text><text x="105" y="212" text-anchor="middle" font-size="9.5" fill="#718096">memory: keeps growing</text><path d="M182 195 L 262 187" fill="none" stroke="#a0aec0" stroke-width="1.5" /><polygon points="262 187 253 184 254 192" fill="#a0aec0" /><path d="M262 224 L 182 220" fill="none" stroke="#a0aec0" stroke-width="1.5" /><polygon points="182 220 191 217 190 225" fill="#a0aec0" /><text x="105" y="242" text-anchor="middle" font-size="9" fill="#a0aec0">read + append every turn</text><rect x="484" y="120" width="166" height="46" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="567" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">search_docs</text><text x="567" y="155" text-anchor="middle" font-size="9" fill="#2f855a">Chroma, persistent</text><path d="M412 176 L 478 152" fill="none" stroke="#48bb78" stroke-width="1.5" /><polygon points="478 152 469 152 472 160" fill="#48bb78" /><rect x="484" y="192" width="166" height="46" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="567" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">calculator</text><text x="567" y="227" text-anchor="middle" font-size="9" fill="#2f855a">safe eval, arithmetic</text><path d="M416 216 L 478 215" fill="none" stroke="#48bb78" stroke-width="1.5" /><polygon points="478 215 469 211 469 219" fill="#48bb78" /><rect x="484" y="264" width="166" height="46" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="567" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">list_topics</text><text x="567" y="299" text-anchor="middle" font-size="9" fill="#2f855a">handbook section names</text><path d="M412 256 L 478 279" fill="none" stroke="#48bb78" stroke-width="1.5" /><polygon points="478 279 469 279 472 271" fill="#48bb78" /><text x="567" y="345" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2f855a">act (tool_use) / observe (tool_result)</text><path d="M340 292 L 340 320" fill="none" stroke="#ed8936" stroke-width="1.6" /><polygon points="340 320 336 311 344 311" fill="#ed8936" /><rect x="230" y="324" width="220" height="46" rx="8" fill="#fffaf0" stroke="#ed8936" /><text x="340" y="345" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">final answer</text><text x="340" y="360" text-anchor="middle" font-size="9.5" fill="#9c4221">stop_reason == end_turn</text><text x="340" y="400" text-anchor="middle" font-size="11" fill="#718096">One loop decides which tool to call, in what order, until the plan is done.</text></svg>