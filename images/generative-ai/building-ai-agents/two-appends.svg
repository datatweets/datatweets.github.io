<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="680" height="380" fill="#ffffff" /><text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">One loop iteration: two appends to messages</text><text x="150" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">messages (before this iteration)</text><rect x="40" y="72" width="220" height="42" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="150" y="98" text-anchor="middle" font-size="11" fill="#2d3748">{role: user, content: goal}</text><path d="M270 93 L 330 93" fill="none" stroke="#a0aec0" stroke-width="1.6" /><polygon points="330 93 321 89 321 97" fill="#a0aec0" /><text x="300" y="80" text-anchor="middle" font-size="10" font-weight="600" fill="#718096">call model</text><rect x="332" y="60" width="150" height="66" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="407" y="87" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">stop_reason</text><text x="407" y="103" text-anchor="middle" font-size="11" fill="#805ad5">== "tool_use"</text><text x="407" y="117" text-anchor="middle" font-size="9" fill="#805ad5">(model wants a tool)</text><path d="M482 93 L 540 93" fill="none" stroke="#a0aec0" stroke-width="1.6" /><polygon points="540 93 531 89 531 97" fill="#a0aec0" /><text x="580" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">messages (after)</text><rect x="500" y="72" width="160" height="34" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="580" y="93" text-anchor="middle" font-size="10" fill="#2d3748">{role: user, content: goal}</text><rect x="500" y="112" width="160" height="34" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="580" y="133" text-anchor="middle" font-size="10" fill="#276749">{role: assistant, resp.content}</text><text x="500" y="164" text-anchor="start" font-size="9" font-weight="700" fill="#2f855a">&#9312; append the assistant turn</text><rect x="500" y="178" width="160" height="34" rx="8" fill="#fffaf0" stroke="#ed8936" /><text x="580" y="199" text-anchor="middle" font-size="10" fill="#9c4221">{role: user, tool_results}</text><text x="500" y="230" text-anchor="start" font-size="9" font-weight="700" fill="#c05621">&#9313; append the tool_results</text><path d="M600 240 Q 620 270 560 270 Q 420 270 420 190 Q 420 140 480 126" fill="none" stroke="#a0aec0" stroke-width="1.6" stroke-dasharray="4 3" /><polygon points="480 126 475 134 469 128" fill="#a0aec0" /><text x="500" y="290" text-anchor="middle" font-size="10" font-weight="600" fill="#718096">next iteration: call the model again with the longer list</text><path d="M407 126 L 407 314" fill="none" stroke="#cbd5e0" stroke-width="1.6" stroke-dasharray="4 3" /><polygon points="407 314 403 305 411 305" fill="#cbd5e0" /><text x="440" y="200" text-anchor="start" font-size="9" font-weight="600" fill="#718096">otherwise</text><rect x="228" y="316" width="224" height="46" rx="8" fill="#fffaf0" stroke="#ed8936" /><text x="340" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">stop_reason == "end_turn"</text><text x="340" y="352" text-anchor="middle" font-size="10" fill="#9c4221">loop stops, return the final text</text></svg>