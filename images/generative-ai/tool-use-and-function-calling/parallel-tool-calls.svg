<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<rect width="800" height="320" fill="#ffffff" />
<text x="400" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">One turn, several tool calls, one results message</text>

<rect x="20" y="50" width="210" height="230" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.7" />
<text x="125" y="68" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">The model's ONE turn</text>

<rect x="34" y="80" width="182" height="52" rx="6" fill="#ffffff" stroke="#90cdf4" stroke-width="1.3" />
<text x="125" y="99" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2c5282">tool_use &#8226; id A</text>
<text x="125" y="115" text-anchor="middle" font-size="9" fill="#4a5568">get_weather(Tokyo)</text>

<rect x="34" y="140" width="182" height="52" rx="6" fill="#ffffff" stroke="#90cdf4" stroke-width="1.3" />
<text x="125" y="159" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2c5282">tool_use &#8226; id B</text>
<text x="125" y="175" text-anchor="middle" font-size="9" fill="#4a5568">get_weather(Cairo)</text>

<rect x="34" y="200" width="182" height="52" rx="6" fill="#ffffff" stroke="#90cdf4" stroke-width="1.3" />
<text x="125" y="219" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2c5282">tool_use &#8226; id C</text>
<text x="125" y="235" text-anchor="middle" font-size="9" fill="#4a5568">get_weather(Oslo)</text>

<line x1="230" y1="106" x2="278" y2="106" stroke="#a0aec0" stroke-width="1.6" />
<polygon points="282 106 273 101.5 273 110.5" fill="#a0aec0" />
<line x1="230" y1="166" x2="278" y2="166" stroke="#a0aec0" stroke-width="1.6" />
<polygon points="282 166 273 161.5 273 170.5" fill="#a0aec0" />
<line x1="230" y1="226" x2="278" y2="226" stroke="#a0aec0" stroke-width="1.6" />
<polygon points="282 226 273 221.5 273 230.5" fill="#a0aec0" />

<rect x="284" y="80" width="150" height="52" rx="6" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5" />
<text x="359" y="110" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621">run tool A</text>

<rect x="284" y="140" width="150" height="52" rx="6" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5" />
<text x="359" y="170" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621">run tool B</text>

<rect x="284" y="200" width="150" height="52" rx="6" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5" />
<text x="359" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621">run tool C</text>

<line x1="434" y1="106" x2="482" y2="106" stroke="#a0aec0" stroke-width="1.6" />
<polygon points="486 106 477 101.5 477 110.5" fill="#a0aec0" />
<line x1="434" y1="166" x2="482" y2="166" stroke="#a0aec0" stroke-width="1.6" />
<polygon points="486 166 477 161.5 477 170.5" fill="#a0aec0" />
<line x1="434" y1="226" x2="482" y2="226" stroke="#a0aec0" stroke-width="1.6" />
<polygon points="486 226 477 221.5 477 230.5" fill="#a0aec0" />

<rect x="488" y="50" width="220" height="230" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.7" />
<text x="598" y="68" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f855a">ONE user turn back</text>

<rect x="502" y="80" width="192" height="52" rx="6" fill="#ffffff" stroke="#9ae6b4" stroke-width="1.3" />
<text x="598" y="99" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">tool_result &#8226; id A</text>
<text x="598" y="115" text-anchor="middle" font-size="9" fill="#4a5568">"14"</text>

<rect x="502" y="140" width="192" height="52" rx="6" fill="#ffffff" stroke="#9ae6b4" stroke-width="1.3" />
<text x="598" y="159" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">tool_result &#8226; id B</text>
<text x="598" y="175" text-anchor="middle" font-size="9" fill="#4a5568">"33"</text>

<rect x="502" y="200" width="192" height="52" rx="6" fill="#ffffff" stroke="#9ae6b4" stroke-width="1.3" />
<text x="598" y="219" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">tool_result &#8226; id C</text>
<text x="598" y="235" text-anchor="middle" font-size="9" fill="#4a5568">"6"</text>

<line x1="710" y1="165" x2="742" y2="165" stroke="#a0aec0" stroke-width="1.7" />
<polygon points="746 165 736 159.5 736 170.5" fill="#a0aec0" />
<text x="758" y="160" font-size="9.5" fill="#718096" text-anchor="middle" transform="rotate(90 758 160)">model continues</text>

<text x="400" y="304" text-anchor="middle" font-size="9.5" fill="#a0aec0">Every tool_use block gets a matching tool_result &#8212; all in a single message, keyed by id.</text>
</svg>
