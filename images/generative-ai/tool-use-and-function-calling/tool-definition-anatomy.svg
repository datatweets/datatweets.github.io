<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<rect width="780" height="330" fill="#ffffff" />
<text x="390" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Anatomy of a tool definition</text>

<rect x="20" y="52" width="330" height="255" rx="10" fill="none" stroke="#cbd5e0" stroke-width="1.3" stroke-dasharray="4,3" />
<text x="185" y="70" text-anchor="middle" font-size="10.5" font-weight="700" fill="#718096">ONE TOOL DEFINITION (a Python dict)</text>

<rect x="40" y="82" width="290" height="62" rx="8" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.7" />
<text x="55" y="106" font-size="10.5" font-weight="700" fill="#2b6cb0">"name":</text>
<text x="55" y="124" font-size="10" fill="#3182ce">"get_weather"</text>

<rect x="40" y="160" width="290" height="70" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.7" />
<text x="55" y="182" font-size="10.5" font-weight="700" fill="#6b46c1">"description":</text>
<text x="55" y="199" font-size="9.5" fill="#805ad5">"Get the current temperature</text>
<text x="55" y="212" font-size="9.5" fill="#805ad5">for a city. Use this when..."</text>

<rect x="40" y="246" width="290" height="46" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.7" />
<text x="55" y="268" font-size="10.5" font-weight="700" fill="#2f855a">"input_schema":</text>
<text x="55" y="282" font-size="9.5" fill="#38a169">{ type, properties, required }</text>

<line x1="330" y1="113" x2="386" y2="113" stroke="#a0aec0" stroke-width="1.6" />
<polygon points="390 113 381 108.5 381 117.5" fill="#a0aec0" />
<rect x="392" y="86" width="368" height="54" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" />
<text x="408" y="107" font-size="10.5" font-weight="700" fill="#2d3748">Identifies the function</text>
<text x="408" y="123" font-size="9.5" fill="#718096">A clear, verb-like label the model reads first.</text>

<line x1="330" y1="195" x2="386" y2="195" stroke="#a0aec0" stroke-width="1.6" />
<polygon points="390 195 381 190.5 381 199.5" fill="#a0aec0" />
<rect x="392" y="168" width="368" height="54" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" />
<text x="408" y="189" font-size="10.5" font-weight="700" fill="#2d3748">Decides WHEN to call</text>
<text x="408" y="205" font-size="9.5" fill="#718096">The model reads this to pick the right tool for the request.</text>

<line x1="330" y1="269" x2="386" y2="269" stroke="#a0aec0" stroke-width="1.6" />
<polygon points="390 269 381 264.5 381 273.5" fill="#a0aec0" />
<rect x="392" y="242" width="368" height="54" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" />
<text x="408" y="263" font-size="10.5" font-weight="700" fill="#2d3748">Shapes the arguments</text>
<text x="408" y="279" font-size="9.5" fill="#718096">Types, per-property descriptions, and required fields.</text>

<text x="390" y="318" text-anchor="middle" font-size="9.5" fill="#a0aec0">The model never sees your code &#8212; only these three fields.</text>
</svg>
