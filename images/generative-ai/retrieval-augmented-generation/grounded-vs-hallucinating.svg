<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Grounding decides what happens on a question the docs don't cover</text><text x="40" y="66" text-anchor="start" font-size="12" font-weight="700" fill="#c05621">Without grounding</text><rect x="40" y="78" width="150" height="56" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="115" y="102" text-anchor="middle" font-size="10.5" fill="#4a5568">"Can I get a</text><text x="115" y="117" text-anchor="middle" font-size="10.5" fill="#4a5568">refund?" (not in docs)</text><line x1="190" y1="106" x2="228" y2="106" stroke="#a0aec0" stroke-width="1.6" /><polygon points="228 106,219 102,219 110" fill="#a0aec0" /><rect x="230" y="78" width="110" height="56" rx="8" fill="#fffaf0" stroke="#ed8936" /><text x="285" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">model</text><line x1="340" y1="106" x2="378" y2="106" stroke="#a0aec0" stroke-width="1.6" /><polygon points="378 106,369 102,369 110" fill="#a0aec0" /><rect x="380" y="78" width="220" height="56" rx="8" fill="#fff5f5" stroke="#fc8181" /><text x="490" y="100" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c53030">invents a plausible-sounding</text><text x="490" y="116" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c53030">refund policy (hallucination)</text><text x="40" y="176" text-anchor="start" font-size="12" font-weight="700" fill="#276749">With grounding</text><rect x="40" y="188" width="150" height="56" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="115" y="212" text-anchor="middle" font-size="10.5" fill="#4a5568">"Can I get a</text><text x="115" y="227" text-anchor="middle" font-size="10.5" fill="#4a5568">refund?" (not in docs)</text><line x1="190" y1="216" x2="228" y2="216" stroke="#a0aec0" stroke-width="1.6" /><polygon points="228 216,219 212,219 220" fill="#a0aec0" /><rect x="230" y="188" width="110" height="56" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="285" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">model</text><text x="285" y="227" text-anchor="middle" font-size="9" fill="#2f855a">(grounded)</text><line x1="340" y1="216" x2="378" y2="216" stroke="#a0aec0" stroke-width="1.6" /><polygon points="378 216,369 212,369 220" fill="#a0aec0" /><rect x="380" y="188" width="220" height="56" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="490" y="210" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">"I don't know" — declines</text><text x="490" y="226" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">instead of guessing</text><text x="320" y="290" text-anchor="middle" font-size="11" fill="#718096">Same question, same missing fact. The instruction "answer using ONLY the context,</text><text x="320" y="307" text-anchor="middle" font-size="11" fill="#718096">and say you don't know otherwise" is the only difference between the two rows.</text></svg>
