<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Three functions, one pipeline: answer()</text><rect x="45" y="60" width="550" height="150" rx="12" fill="none" stroke="#a0aec0" stroke-width="1.4" stroke-dasharray="5 4" /><text x="320" y="52" text-anchor="middle" font-size="11" font-weight="600" fill="#4a5568">answer(question, k=3)</text><rect x="60" y="95" width="150" height="90" rx="10" fill="#f0fff4" stroke="#48bb78" /><text x="135" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">retrieve(</text><text x="135" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">question, k)</text><text x="135" y="160" text-anchor="middle" font-size="9.5" fill="#2f855a">queries Chroma,</text><text x="135" y="173" text-anchor="middle" font-size="9.5" fill="#2f855a">returns top-k docs</text><rect x="245" y="95" width="150" height="90" rx="10" fill="#ebf4ff" stroke="#4299e1" /><text x="320" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">build_prompt(</text><text x="320" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">question, docs)</text><text x="320" y="160" text-anchor="middle" font-size="9.5" fill="#3182ce">pure string work,</text><text x="320" y="173" text-anchor="middle" font-size="9.5" fill="#3182ce">no side effects</text><rect x="430" y="95" width="150" height="90" rx="10" fill="#faf5ff" stroke="#9f7aea" /><text x="505" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">generate(</text><text x="505" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">prompt)</text><text x="505" y="160" text-anchor="middle" font-size="9.5" fill="#805ad5">calls Claude,</text><text x="505" y="173" text-anchor="middle" font-size="9.5" fill="#805ad5">returns answer text</text><line x1="14" y1="140" x2="58" y2="140" stroke="#a0aec0" stroke-width="1.6" /><polygon points="58 140,49 136,49 144" fill="#a0aec0" /><text x="14" y="128" text-anchor="start" font-size="10" fill="#718096">question</text><line x1="210" y1="140" x2="243" y2="140" stroke="#a0aec0" stroke-width="1.6" /><polygon points="243 140,234 136,234 144" fill="#a0aec0" /><text x="226" y="128" text-anchor="middle" font-size="9.5" fill="#718096">docs</text><line x1="395" y1="140" x2="428" y2="140" stroke="#a0aec0" stroke-width="1.6" /><polygon points="428 140,419 136,419 144" fill="#a0aec0" /><text x="411" y="128" text-anchor="middle" font-size="9.5" fill="#718096">prompt</text><line x1="580" y1="140" x2="615" y2="140" stroke="#a0aec0" stroke-width="1.6" /><polygon points="615 140,606 136,606 144" fill="#a0aec0" /><text x="630" y="128" text-anchor="end" font-size="10" fill="#718096">answer</text><text x="320" y="245" text-anchor="middle" font-size="11" fill="#718096">Each function does one job and knows nothing about the others — change how you</text><text x="320" y="262" text-anchor="middle" font-size="11" fill="#718096">retrieve, word the prompt, or pick a model by editing exactly one box.</text></svg>
