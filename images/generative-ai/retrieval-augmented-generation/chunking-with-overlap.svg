<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Chunking with overlap: consecutive chunks share text</text><text x="320" y="60" text-anchor="middle" font-size="11" fill="#718096">document text (3,831 characters)</text><rect x="60" y="68" width="520" height="34" rx="4" fill="#f7fafc" stroke="#cbd5e0" /><line x1="60" y1="118" x2="291" y2="118" stroke="#a0aec0" stroke-width="1.5" /><polygon points="291 118,282 114,282 122" fill="#a0aec0" /><text x="175" y="112" text-anchor="middle" font-size="9.5" fill="#718096">step: chunk_size − overlap = 400 chars</text><rect x="60" y="140" width="288" height="36" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="204" y="163" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">chunk 1 (chars 0–500)</text><rect x="291" y="200" width="288" height="36" rx="8" fill="#ebf4ff" stroke="#4299e1" /><text x="435" y="223" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">chunk 2 (chars 400–900)</text><rect x="291" y="68" width="57" height="168" rx="4" fill="none" stroke="#ed8936" stroke-width="1.6" stroke-dasharray="5 4" /><text x="319.5" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">100-char overlap</text><text x="320" y="300" text-anchor="middle" font-size="11" fill="#718096">Chars 400–500 appear in both chunks, so a fact that straddles that boundary</text><text x="320" y="317" text-anchor="middle" font-size="11" fill="#718096">still shows up whole in at least one chunk instead of being cut in half.</text></svg>
