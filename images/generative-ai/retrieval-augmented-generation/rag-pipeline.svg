<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The RAG pipeline: retrieve, then generate</text><rect x="24" y="150" width="118" height="56" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="83" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#2d3748">question</text><text x="83" y="192" text-anchor="middle" font-size="10" fill="#718096">"how long to return?"</text><rect x="180" y="60" width="140" height="92" rx="10" fill="#f0fff4" stroke="#48bb78" /><text x="250" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">vector database</text><g font-size="9" fill="#2f855a"><rect x="192" y="92" width="116" height="15" rx="3" fill="#fff" stroke="#9ae6b4" /><text x="198" y="103">returns policy</text><rect x="192" y="111" width="116" height="15" rx="3" fill="#fff" stroke="#9ae6b4" /><text x="198" y="122">shipping times</text><rect x="192" y="130" width="116" height="15" rx="3" fill="#fff" stroke="#9ae6b4" /><text x="198" y="141">password reset</text></g><text x="250" y="166" text-anchor="middle" font-size="10" fill="#718096">1. retrieve top matches</text><rect x="180" y="206" width="140" height="92" rx="10" fill="#ebf4ff" stroke="#4299e1" /><text x="250" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">augmented prompt</text><text x="250" y="248" text-anchor="middle" font-size="9" fill="#3182ce">context:</text><text x="250" y="261" text-anchor="middle" font-size="9" fill="#3182ce">"...return within 30 days..."</text><text x="250" y="277" text-anchor="middle" font-size="9" fill="#3182ce">+ question</text><text x="250" y="292" text-anchor="middle" font-size="10" fill="#718096">2. stuff context in</text><rect x="360" y="150" width="120" height="60" rx="10" fill="#faf5ff" stroke="#9f7aea" /><text x="420" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">Claude</text><text x="420" y="196" text-anchor="middle" font-size="10" fill="#718096">3. generate</text><rect x="510" y="148" width="118" height="64" rx="8" fill="#fffaf0" stroke="#ed8936" /><text x="569" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">grounded answer</text><text x="569" y="190" text-anchor="middle" font-size="10" fill="#9c4221">"30 days from</text><text x="569" y="203" text-anchor="middle" font-size="10" fill="#9c4221">delivery."</text><line x1="142" y1="168" x2="178" y2="120" stroke="#a0aec0" stroke-width="1.6" /><polygon points="178 120 169 121 173 128" fill="#a0aec0" /><line x1="142" y1="188" x2="178" y2="240" stroke="#a0aec0" stroke-width="1.6" /><polygon points="178 240 169 233 172 241" fill="#a0aec0" /><line x1="250" y1="152" x2="250" y2="204" stroke="#48bb78" stroke-width="1.6" stroke-dasharray="4 3" /><polygon points="250 206 246 197 254 197" fill="#48bb78" /><line x1="320" y1="240" x2="358" y2="186" stroke="#a0aec0" stroke-width="1.6" /><polygon points="358 186 349 187 353 194" fill="#a0aec0" /><line x1="480" y1="180" x2="508" y2="180" stroke="#a0aec0" stroke-width="1.6" /><polygon points="508 180 500 176 500 184" fill="#a0aec0" /><text x="320" y="338" text-anchor="middle" font-size="11" fill="#718096">The model answers from retrieved facts, not just its training — so answers stay current, private, and grounded in your data.</text></svg>