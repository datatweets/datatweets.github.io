<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a202c">The Q&amp;A bot: embed once, then retrieve on every question</text><text x="320" y="54" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5568">Build phase — runs once</text><rect x="30" y="64" width="170" height="58" rx="9" fill="#f7fafc" stroke="#cbd5e0" /><text x="115" y="88" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">load</text><text x="115" y="103" text-anchor="middle" font-size="9.5" fill="#4a5568">product-handbook.md</text><line x1="200" y1="93" x2="228" y2="93" stroke="#a0aec0" stroke-width="1.5" /><polygon points="228 93,219 89,219 97" fill="#a0aec0" /><rect x="230" y="64" width="180" height="58" rx="9" fill="#f0fff4" stroke="#48bb78" /><text x="320" y="88" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">chunk_text()</text><text x="320" y="103" text-anchor="middle" font-size="9.5" fill="#2f855a">8 chunks, overlap=30</text><line x1="410" y1="93" x2="438" y2="93" stroke="#a0aec0" stroke-width="1.5" /><polygon points="438 93,429 89,429 97" fill="#a0aec0" /><rect x="440" y="64" width="170" height="58" rx="9" fill="#ebf4ff" stroke="#4299e1" /><text x="525" y="88" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">PersistentClient</text><text x="525" y="103" text-anchor="middle" font-size="9.5" fill="#3182ce">embed &amp; store once</text><path d="M 525 122 L 525 148 L 115 148 L 115 172" fill="none" stroke="#a0aec0" stroke-width="1.5" /><polygon points="115 172,111 163,119 163" fill="#a0aec0" /><text x="320" y="144" text-anchor="middle" font-size="9.5" fill="#718096">ask(question) — every question re-enters here</text><text x="320" y="170" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5568">Query phase — runs on every ask()</text><rect x="30" y="178" width="170" height="58" rx="9" fill="#ebf4ff" stroke="#4299e1" /><text x="115" y="202" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">collection.query()</text><text x="115" y="217" text-anchor="middle" font-size="9.5" fill="#3182ce">retrieve top chunks</text><line x1="200" y1="207" x2="228" y2="207" stroke="#a0aec0" stroke-width="1.5" /><polygon points="228 207,219 203,219 211" fill="#a0aec0" /><rect x="230" y="178" width="180" height="58" rx="9" fill="#faf5ff" stroke="#9f7aea" /><text x="320" y="202" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">build prompt</text><text x="320" y="217" text-anchor="middle" font-size="9.5" fill="#805ad5">grounded + cited</text><line x1="410" y1="207" x2="438" y2="207" stroke="#a0aec0" stroke-width="1.5" /><polygon points="438 207,429 203,429 211" fill="#a0aec0" /><rect x="440" y="178" width="170" height="58" rx="9" fill="#fffaf0" stroke="#ed8936" /><text x="525" y="202" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c05621">Claude generates</text><text x="525" y="217" text-anchor="middle" font-size="9.5" fill="#9c4221">cited answer</text><text x="320" y="280" text-anchor="middle" font-size="11" fill="#718096">Loading and embedding happen once. ask() replays retrieve → ground+cite → generate</text><text x="320" y="297" text-anchor="middle" font-size="11" fill="#718096">on every question against the same persisted collection — no re-embedding.</text></svg>
