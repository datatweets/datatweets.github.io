<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="380" fill="#ffffff" /><text x="350.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Four Dials on One Console</text><rect x="40" y="80" width="140" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.6" /><circle cx="110.0" cy="150" r="38" fill="#e8f2ff" stroke="#2f80ed" stroke-width="2.5" /><line x1="110.0" y1="150" x2="132.98133329356935" y2="169.28362829059617" stroke="#2f80ed" stroke-width="3" stroke-linecap="round" /><circle cx="110.0" cy="150" r="4" fill="#2f80ed" /><text x="110.0" y="248" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f80ed" font-family="SFMono-Regular, Menlo, Consolas, monospace">max_tokens</text><text x="110.0" y="264" text-anchor="middle" font-size="9" font-weight="400" fill="#718096">how long the reply can run</text><rect x="200" y="80" width="140" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.6" /><circle cx="270.0" cy="150" r="38" fill="#f3eefb" stroke="#7c3aed" stroke-width="2.5" /><line x1="270.0" y1="150" x2="250.71637170940383" y2="172.98133329356935" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" /><circle cx="270.0" cy="150" r="4" fill="#7c3aed" /><text x="270.0" y="248" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c3aed" font-family="SFMono-Regular, Menlo, Consolas, monospace">stop_sequences</text><text x="270.0" y="264" text-anchor="middle" font-size="9" font-weight="400" fill="#718096">a marker that ends it early</text><rect x="360" y="80" width="140" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.6" /><circle cx="430.0" cy="150" r="38" fill="#feebc8" stroke="#dd6b20" stroke-width="2.5" /><line x1="430.0" y1="150" x2="401.8092213764227" y2="139.73939570022995" stroke="#dd6b20" stroke-width="3" stroke-linecap="round" /><circle cx="430.0" cy="150" r="4" fill="#dd6b20" /><text x="430.0" y="248" text-anchor="middle" font-size="11.5" font-weight="700" fill="#dd6b20" font-family="SFMono-Regular, Menlo, Consolas, monospace">temperature</text><text x="430.0" y="264" text-anchor="middle" font-size="9" font-weight="400" fill="#718096">how much randomness to sample</text><rect x="520" y="80" width="140" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.6" /><circle cx="590.0" cy="150" r="38" fill="#eafaf1" stroke="#38a169" stroke-width="2.5" /><line x1="590.0" y1="150" x2="612.9813332935694" y2="130.7163717094038" stroke="#38a169" stroke-width="3" stroke-linecap="round" /><circle cx="590.0" cy="150" r="4" fill="#38a169" /><text x="590.0" y="248" text-anchor="middle" font-size="11.5" font-weight="700" fill="#38a169" font-family="SFMono-Regular, Menlo, Consolas, monospace">model</text><text x="590.0" y="264" text-anchor="middle" font-size="9" font-weight="400" fill="#718096">capability vs. cost ceiling</text><text x="350.0" y="350" text-anchor="middle" font-size="10.5" fill="#718096">Every real call sets several of these together: pick a model for the difficulty, cap length,</text><text x="350.0" y="366" text-anchor="middle" font-size="10.5" fill="#718096">dial randomness for the consistency you need, and stop at a marker to keep output clean.</text></svg>