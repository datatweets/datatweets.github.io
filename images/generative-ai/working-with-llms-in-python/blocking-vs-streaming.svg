<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="380" fill="#ffffff" /><text x="350.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Blocking create() vs. Streaming: What the User Sees</text><text x="60" y="75" text-anchor="start" font-size="12" font-weight="700" fill="#c05621">create()  —  waits, then prints everything at once</text><rect x="60" y="90" width="380" height="14" fill="#fbd38d" /><rect x="440" y="90" width="200" height="14" fill="#48bb78" /><text x="250" y="122" text-anchor="middle" font-size="9.5" font-weight="400" fill="#c05621">blank screen — nothing prints yet</text><text x="540" y="122" text-anchor="middle" font-size="9.5" font-weight="400" fill="#276749">whole reply appears at once</text><text x="60" y="195" text-anchor="start" font-size="12" font-weight="700" fill="#276749">stream()  —  text appears as each chunk is generated</text><rect x="61.0" y="210" width="46.333333333333336" height="14" fill="#68d391" /><rect x="109.33333333333334" y="210" width="46.333333333333336" height="14" fill="#68d391" /><rect x="157.66666666666669" y="210" width="46.333333333333336" height="14" fill="#68d391" /><rect x="206.0" y="210" width="46.333333333333336" height="14" fill="#68d391" /><rect x="254.33333333333334" y="210" width="46.333333333333336" height="14" fill="#68d391" /><rect x="302.6666666666667" y="210" width="46.333333333333336" height="14" fill="#68d391" /><rect x="351.0" y="210" width="46.333333333333336" height="14" fill="#68d391" /><rect x="399.33333333333337" y="210" width="46.333333333333336" height="14" fill="#68d391" /><rect x="447.6666666666667" y="210" width="46.333333333333336" height="14" fill="#68d391" /><rect x="496.0" y="210" width="46.333333333333336" height="14" fill="#68d391" /><rect x="544.3333333333334" y="210" width="46.333333333333336" height="14" fill="#68d391" /><rect x="592.6666666666667" y="210" width="46.333333333333336" height="14" fill="#68d391" /><text x="350" y="242" text-anchor="middle" font-size="9.5" font-weight="400" fill="#276749">each chunk prints the instant it arrives — no wait</text><line x1="60" y1="280" x2="632" y2="280" stroke="#a0aec0" stroke-width="1.7" /><polygon points="640 280,631 276,631 284" fill="#a0aec0" /><text x="60" y="298" text-anchor="start" font-size="9.5" font-weight="400" fill="#718096">call sent</text><text x="580" y="298" text-anchor="start" font-size="9.5" font-weight="400" fill="#718096">time →</text><text x="350.0" y="350" text-anchor="middle" font-size="10.5" fill="#718096">Same final text either way. Streaming trades nothing for feel — the user watches the</text><text x="350.0" y="366" text-anchor="middle" font-size="10.5" fill="#718096">answer arrive instead of staring at a blank screen until the whole reply is ready.</text></svg>