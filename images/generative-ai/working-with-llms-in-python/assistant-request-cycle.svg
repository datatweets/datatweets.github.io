<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="800" height="430" fill="#ffffff" /><text x="400.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">assistant.py: One Turn Through the REPL</text><rect x="110" y="90" width="200" height="60" rx="10" fill="#e8f2ff" stroke="#2f80ed" stroke-width="1.6" /><text x="124" y="114" text-anchor="start" font-size="10.8" font-weight="700" fill="#2f80ed">1. you></text><text x="124" y="134" text-anchor="start" font-size="8.7" font-weight="400" fill="#4a5568">read a line of input</text><rect x="345" y="90" width="200" height="60" rx="10" fill="#e8f2ff" stroke="#2f80ed" stroke-width="1.6" /><text x="359" y="114" text-anchor="start" font-size="10.8" font-weight="700" fill="#2f80ed">2. append user turn</text><text x="359" y="134" text-anchor="start" font-size="8.7" font-weight="400" fill="#4a5568">messages.append(...)</text><rect x="580" y="90" width="200" height="60" rx="10" fill="#f3eefb" stroke="#7c3aed" stroke-width="1.6" /><text x="594" y="114" text-anchor="start" font-size="10.8" font-weight="700" fill="#7c3aed">3. stream() the call</text><text x="594" y="134" text-anchor="start" font-size="8.7" font-weight="400" fill="#4a5568">SYSTEM persona + full messages sent</text><rect x="580" y="196" width="200" height="60" rx="10" fill="#eafaf1" stroke="#38a169" stroke-width="1.6" /><text x="594" y="220" text-anchor="start" font-size="10.8" font-weight="700" fill="#38a169">4. print chunks live</text><text x="594" y="240" text-anchor="start" font-size="8.7" font-weight="400" fill="#4a5568">Aria> ... types out</text><rect x="345" y="196" width="200" height="60" rx="10" fill="#eafaf1" stroke="#38a169" stroke-width="1.6" /><text x="359" y="220" text-anchor="start" font-size="10.8" font-weight="700" fill="#38a169">5. append assistant turn</text><text x="359" y="240" text-anchor="start" font-size="8.7" font-weight="400" fill="#4a5568">reply saved for next turn</text><rect x="110" y="196" width="200" height="60" rx="10" fill="#feebc8" stroke="#dd6b20" stroke-width="1.6" /><text x="124" y="220" text-anchor="start" font-size="10.8" font-weight="700" fill="#dd6b20">6. compute cost from usage</text><text x="124" y="240" text-anchor="start" font-size="8.7" font-weight="400" fill="#4a5568">turn cost + running session total</text><line x1="310" y1="120.0" x2="337" y2="120.0" stroke="#a0aec0" stroke-width="1.7" /><polygon points="345 120.0,336 116.0,336 124.0" fill="#a0aec0" /><line x1="545" y1="120.0" x2="572" y2="120.0" stroke="#a0aec0" stroke-width="1.7" /><polygon points="580 120.0,571 116.0,571 124.0" fill="#a0aec0" /><line x1="680.0" y1="150" x2="680.0" y2="188" stroke="#a0aec0" stroke-width="1.7" /><polygon points="680.0 196,676.0 187,684.0 187" fill="#a0aec0" /><line x1="580" y1="226.0" x2="545" y2="226.0" stroke="#a0aec0" stroke-width="1.7" /><polygon points="545 226.0,554 222.0,554 230.0" fill="#a0aec0" /><line x1="345" y1="226.0" x2="310" y2="226.0" stroke="#a0aec0" stroke-width="1.7" /><polygon points="310 226.0,319 222.0,319 230.0" fill="#a0aec0" /><line x1="110" y1="226.0" x2="70" y2="226.0" stroke="#a0aec0" stroke-width="1.7" stroke-dasharray="5 4" /><line x1="70" y1="226.0" x2="70" y2="120.0" stroke="#a0aec0" stroke-width="1.7" stroke-dasharray="5 4" /><line x1="70" y1="120.0" x2="102" y2="120.0" stroke="#a0aec0" stroke-width="1.7" /><polygon points="110 120.0,101 116.0,101 124.0" fill="#a0aec0" /><text x="70" y="148.0" text-anchor="middle" font-size="9.5" font-weight="400" fill="#718096">loop</text><text x="400.0" y="400" text-anchor="middle" font-size="10.5" fill="#718096">Every while-True iteration runs this same six-step cycle: persona and memory go in as</text><text x="400.0" y="416" text-anchor="middle" font-size="10.5" fill="#718096">SYSTEM and messages, the reply streams out, and the running cost updates before the next turn.</text></svg>