<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" version="1.1"><defs><style>
      .lbl { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .role { font-weight: 700; font-size: 13px; letter-spacing: 0.5px; }
      .body { font-size: 14px; fill: #1f2933; }
      .cap { font-size: 12px; fill: #52606d; }
    </style></defs><rect width="640" height="380" fill="#ffffff" /><rect x="40" y="28" width="560" height="64" rx="10" fill="#f3eefb" stroke="#7c3aed" stroke-width="1.5" /><text x="60" y="52" class="lbl role" fill="#7c3aed">SYSTEM</text><text x="60" y="74" class="lbl body" fill="#3b2a5a">Sets the rules and persona for the whole conversation (a parameter, not a message).</text><line x1="320" y1="92" x2="320" y2="116" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 4" /><text x="40" y="132" class="lbl cap">messages = [ ... ]  — starts with user, then alternates</text><rect x="40" y="146" width="380" height="48" rx="10" fill="#e8f2ff" stroke="#2f80ed" stroke-width="1.5" /><text x="58" y="166" class="lbl role" fill="#2f80ed">USER</text><text x="58" y="184" class="lbl body">What is a database index?</text><rect x="220" y="206" width="380" height="48" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5" /><text x="238" y="226" class="lbl role" fill="#27ae60">ASSISTANT</text><text x="238" y="244" class="lbl body">It is like a book's index — it speeds up lookups.</text><rect x="40" y="266" width="380" height="48" rx="10" fill="#e8f2ff" stroke="#2f80ed" stroke-width="1.5" /><text x="58" y="286" class="lbl role" fill="#2f80ed">USER</text><text x="58" y="304" class="lbl body">Give me an example in SQL.</text><text x="40" y="348" class="lbl cap">The system prompt sits above the turns; user and assistant alternate inside the list.</text></svg>