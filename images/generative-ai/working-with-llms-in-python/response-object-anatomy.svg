<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="680" height="430" fill="#ffffff" /><text x="340.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Anatomy of a Messages API Response</text><rect x="50" y="56" width="580" height="330" rx="12" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.6" /><text x="70" y="86" text-anchor="start" font-size="14" font-weight="700" fill="#1a202c" font-family="SFMono-Regular, Menlo, Consolas, monospace">response</text><text x="180" y="86" text-anchor="start" font-size="11" font-weight="400" fill="#718096">the object every call returns</text><rect x="70" y="116" width="10" height="10" rx="2" fill="#2f80ed" /><text x="90" y="126" text-anchor="start" font-size="13" font-weight="700" fill="#2f80ed" font-family="SFMono-Regular, Menlo, Consolas, monospace">.id</text><text x="230" y="126" text-anchor="start" font-size="10.5" font-weight="400" fill="#4a5568">unique message ID, e.g. msg_01Te...  — for logs and support</text><line x1="70" y1="140" x2="610" y2="140" stroke="#e2e8f0" stroke-width="1" /><rect x="70" y="160" width="10" height="10" rx="2" fill="#0891b2" /><text x="90" y="170" text-anchor="start" font-size="13" font-weight="700" fill="#0891b2" font-family="SFMono-Regular, Menlo, Consolas, monospace">.model</text><text x="230" y="170" text-anchor="start" font-size="10.5" font-weight="400" fill="#4a5568">the exact dated model that answered, e.g. claude-haiku-4-5-20251001</text><line x1="70" y1="184" x2="610" y2="184" stroke="#e2e8f0" stroke-width="1" /><rect x="70" y="204" width="10" height="10" rx="2" fill="#38a169" /><text x="90" y="214" text-anchor="start" font-size="13" font-weight="700" fill="#38a169" font-family="SFMono-Regular, Menlo, Consolas, monospace">.role</text><text x="230" y="214" text-anchor="start" font-size="10.5" font-weight="400" fill="#4a5568">always "assistant" on a response</text><line x1="70" y1="228" x2="610" y2="228" stroke="#e2e8f0" stroke-width="1" /><rect x="70" y="248" width="10" height="10" rx="2" fill="#dd6b20" /><text x="90" y="258" text-anchor="start" font-size="13" font-weight="700" fill="#dd6b20" font-family="SFMono-Regular, Menlo, Consolas, monospace">.stop_reason</text><text x="230" y="258" text-anchor="start" font-size="10.5" font-weight="400" fill="#4a5568">why generation stopped: "end_turn" or "max_tokens"</text><line x1="70" y1="272" x2="610" y2="272" stroke="#e2e8f0" stroke-width="1" /><rect x="70" y="292" width="10" height="10" rx="2" fill="#7c3aed" /><text x="90" y="302" text-anchor="start" font-size="13" font-weight="700" fill="#7c3aed" font-family="SFMono-Regular, Menlo, Consolas, monospace">.usage</text><text x="230" y="302" text-anchor="start" font-size="10.5" font-weight="400" fill="#4a5568">input_tokens and output_tokens — what you are billed on</text><line x1="70" y1="316" x2="610" y2="316" stroke="#e2e8f0" stroke-width="1" /><rect x="70" y="336" width="10" height="10" rx="2" fill="#e53e3e" /><text x="90" y="346" text-anchor="start" font-size="13" font-weight="700" fill="#e53e3e" font-family="SFMono-Regular, Menlo, Consolas, monospace">.content</text><text x="230" y="346" text-anchor="start" font-size="10.5" font-weight="400" fill="#4a5568">a list of blocks; content[0].text is the answer text</text><text x="340.0" y="410" text-anchor="middle" font-size="10.5" fill="#718096">Six fields you will read on almost every call. content is a list because a reply can hold more than one block.</text></svg>