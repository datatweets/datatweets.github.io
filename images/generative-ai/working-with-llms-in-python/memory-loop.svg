<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="780" height="320" fill="#ffffff" /><text x="390.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The Memory Loop: Resend the Whole History Every Turn</text><rect x="40" y="90" width="230" height="66" rx="10" fill="#e8f2ff" stroke="#2f80ed" stroke-width="1.6" /><text x="54" y="114" text-anchor="start" font-size="12" font-weight="700" fill="#2f80ed">1. Append user turn</text><text x="54" y="136" text-anchor="start" font-size="9" font-weight="400" fill="#4a5568" font-family="SFMono-Regular, Menlo, Consolas, monospace">append({"role": "user", ...})</text><line x1="270" y1="123.0" x2="287" y2="123.0" stroke="#a0aec0" stroke-width="1.7" /><polygon points="295 123.0,286 119.0,286 127.0" fill="#a0aec0" /><rect x="295" y="90" width="230" height="66" rx="10" fill="#f3eefb" stroke="#7c3aed" stroke-width="1.6" /><text x="309" y="114" text-anchor="start" font-size="12" font-weight="700" fill="#7c3aed">2. Call the API</text><text x="309" y="136" text-anchor="start" font-size="9" font-weight="400" fill="#4a5568" font-family="SFMono-Regular, Menlo, Consolas, monospace">create(messages=messages)</text><line x1="525" y1="123.0" x2="542" y2="123.0" stroke="#a0aec0" stroke-width="1.7" /><polygon points="550 123.0,541 119.0,541 127.0" fill="#a0aec0" /><rect x="550" y="90" width="230" height="66" rx="10" fill="#eafaf1" stroke="#38a169" stroke-width="1.6" /><text x="564" y="114" text-anchor="start" font-size="12" font-weight="700" fill="#38a169">3. Append reply</text><text x="564" y="136" text-anchor="start" font-size="9" font-weight="400" fill="#4a5568" font-family="SFMono-Regular, Menlo, Consolas, monospace">append({"role": "assistant", ...})</text><line x1="665.0" y1="156" x2="665.0" y2="211" stroke="#a0aec0" stroke-width="1.7" /><line x1="665.0" y1="211" x2="155.0" y2="211" stroke="#a0aec0" stroke-width="1.7" stroke-dasharray="5 4" /><line x1="155.0" y1="211" x2="155.0" y2="148" stroke="#a0aec0" stroke-width="1.7" /><polygon points="155.0 156,151.0 147,159.0 147" fill="#a0aec0" /><text x="390.0" y="235" text-anchor="middle" font-size="10.5" font-weight="400" fill="#718096">4. Next turn: the whole growing list is resent — that resent history is the memory</text><text x="390.0" y="300" text-anchor="middle" font-size="10.5" fill="#718096">The model itself remembers nothing between calls; every turn you send the full messages list back.</text></svg>