<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="400" fill="#ffffff" /><text x="360" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The trajectory is the loop; the checkpointer remembers it</text><text x="360" y="52" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5568">result["messages"] — one invoke() call</text><rect x="14" y="66" width="104" height="52" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="66" y="88" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2d3748">HumanMessage</text><text x="66" y="103" text-anchor="middle" font-size="8.5" fill="#4a5568">"temp in Tokyo?"</text><rect x="132" y="66" width="112" height="52" rx="8" fill="#faf5ff" stroke="#9f7aea" /><text x="188" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6b46c1">AIMessage</text><text x="188" y="99" text-anchor="middle" font-size="8.5" fill="#805ad5">tool_calls:</text><text x="188" y="111" text-anchor="middle" font-size="8.5" fill="#805ad5">get_weather</text><rect x="258" y="66" width="94" height="52" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="305" y="88" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">ToolMessage</text><text x="305" y="103" text-anchor="middle" font-size="8.5" fill="#2f855a">'14'</text><rect x="366" y="66" width="112" height="52" rx="8" fill="#faf5ff" stroke="#9f7aea" /><text x="422" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6b46c1">AIMessage</text><text x="422" y="99" text-anchor="middle" font-size="8.5" fill="#805ad5">tool_calls:</text><text x="422" y="111" text-anchor="middle" font-size="8.5" fill="#805ad5">calculator</text><rect x="492" y="66" width="94" height="52" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="539" y="88" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">ToolMessage</text><text x="539" y="103" text-anchor="middle" font-size="8.5" fill="#2f855a">'57.2'</text><rect x="600" y="66" width="106" height="52" rx="8" fill="#fffaf0" stroke="#ed8936" /><text x="653" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c05621">AIMessage</text><text x="653" y="99" text-anchor="middle" font-size="8.5" fill="#9c4221">text only —</text><text x="653" y="111" text-anchor="middle" font-size="8.5" fill="#9c4221">loop stops</text><path d="M118 92 L130 92" stroke="#a0aec0" stroke-width="1.5" fill="none" /><polygon points="130 92,122 88,122 96" fill="#a0aec0" /><path d="M244 92 L256 92" stroke="#a0aec0" stroke-width="1.5" fill="none" /><polygon points="256 92,248 88,248 96" fill="#a0aec0" /><path d="M352 92 L364 92" stroke="#a0aec0" stroke-width="1.5" fill="none" /><polygon points="364 92,356 88,356 96" fill="#a0aec0" /><path d="M478 92 L490 92" stroke="#a0aec0" stroke-width="1.5" fill="none" /><polygon points="490 92,482 88,482 96" fill="#a0aec0" /><path d="M586 92 L598 92" stroke="#a0aec0" stroke-width="1.5" fill="none" /><polygon points="598 92,590 88,590 96" fill="#a0aec0" /><text x="360" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5568">Two invoke() calls, same thread_id — the checkpointer bridges them</text><rect x="30" y="180" width="190" height="66" rx="9" fill="#f7fafc" stroke="#cbd5e0" /><text x="125" y="204" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">invoke() call 1</text><text x="125" y="220" text-anchor="middle" font-size="9" fill="#4a5568">"my favorite number is 7"</text><text x="125" y="234" text-anchor="middle" font-size="9" fill="#718096">thread_id: "abc"</text><rect x="290" y="172" width="140" height="82" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="2" /><text x="360" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">InMemorySaver</text><text x="360" y="216" text-anchor="middle" font-size="9" fill="#3182ce">checkpointer</text><text x="360" y="232" text-anchor="middle" font-size="8.5" fill="#3182ce">keyed by thread_id</text><rect x="500" y="180" width="190" height="66" rx="9" fill="#f7fafc" stroke="#cbd5e0" /><text x="595" y="204" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">invoke() call 2</text><text x="595" y="220" text-anchor="middle" font-size="9" fill="#4a5568">"multiply it by 6"</text><text x="595" y="234" text-anchor="middle" font-size="9" fill="#718096">thread_id: "abc"</text><path d="M220 210 L288 210" stroke="#4299e1" stroke-width="1.6" fill="none" /><polygon points="288 210,279 206,279 214" fill="#4299e1" /><text x="254" y="200" text-anchor="middle" font-size="8.5" fill="#3182ce">saves history</text><path d="M430 218 L498 218" stroke="#4299e1" stroke-width="1.6" fill="none" /><polygon points="498 218,489 214,489 222" fill="#4299e1" /><text x="464" y="240" text-anchor="middle" font-size="8.5" fill="#3182ce">reloads history</text><rect x="500" y="270" width="190" height="52" rx="9" fill="none" stroke="#cbd5e0" stroke-width="1.4" stroke-dasharray="4 3" /><text x="595" y="292" text-anchor="middle" font-size="9.5" font-weight="700" fill="#718096">different thread_id</text><text x="595" y="308" text-anchor="middle" font-size="9" fill="#a0aec0">→ empty history, no memory of 7</text><text x="360" y="360" text-anchor="middle" font-size="11" fill="#718096">Same thread_id means "keep talking in this conversation" — the checkpointer reloads what was</text><text x="360" y="377" text-anchor="middle" font-size="11" fill="#718096">saved after call 1, so call 2 can answer "42" without "7" ever appearing in its own message.</text></svg>
