<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="680" height="280" fill="#ffffff" /><text x="340" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The LCEL chain: each pipe passes a new type along</text><rect x="30" y="55" width="620" height="150" rx="12" fill="none" stroke="#a0aec0" stroke-width="1.4" stroke-dasharray="5 4" /><text x="340" y="48" text-anchor="middle" font-size="11" font-weight="600" fill="#4a5568">chain = prompt | model | StrOutputParser()</text><rect x="52" y="92" width="150" height="76" rx="10" fill="#ebf4ff" stroke="#4299e1" /><text x="127" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">ChatPromptTemplate</text><text x="127" y="138" text-anchor="middle" font-size="9.5" fill="#3182ce">fills {topic}</text><text x="127" y="153" text-anchor="middle" font-size="9.5" fill="#3182ce">.invoke(dict)</text><rect x="265" y="92" width="150" height="76" rx="10" fill="#faf5ff" stroke="#9f7aea" /><text x="340" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">ChatAnthropic</text><text x="340" y="138" text-anchor="middle" font-size="9.5" fill="#805ad5">calls Claude</text><text x="340" y="153" text-anchor="middle" font-size="9.5" fill="#805ad5">.invoke(messages)</text><rect x="478" y="92" width="150" height="76" rx="10" fill="#f0fff4" stroke="#48bb78" /><text x="553" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">StrOutputParser</text><text x="553" y="138" text-anchor="middle" font-size="9.5" fill="#2f855a">reads .content</text><text x="553" y="153" text-anchor="middle" font-size="9.5" fill="#2f855a">.invoke(AIMessage)</text><line x1="6" y1="130" x2="50" y2="130" stroke="#a0aec0" stroke-width="1.6" /><polygon points="50 130,41 126,41 134" fill="#a0aec0" /><text x="6" y="118" text-anchor="start" font-size="10" fill="#718096">dict</text><line x1="202" y1="130" x2="263" y2="130" stroke="#a0aec0" stroke-width="1.6" /><polygon points="263 130,254 126,254 134" fill="#a0aec0" /><text x="232" y="118" text-anchor="middle" font-size="9.5" fill="#718096">messages</text><line x1="415" y1="130" x2="476" y2="130" stroke="#a0aec0" stroke-width="1.6" /><polygon points="476 130,467 126,467 134" fill="#a0aec0" /><text x="445" y="118" text-anchor="middle" font-size="9.5" fill="#718096">AIMessage</text><line x1="628" y1="130" x2="668" y2="130" stroke="#a0aec0" stroke-width="1.6" /><polygon points="668 130,659 126,659 134" fill="#a0aec0" /><text x="674" y="118" text-anchor="end" font-size="10" fill="#718096">str</text><text x="340" y="235" text-anchor="middle" font-size="11" fill="#718096">A dict becomes messages, messages become an AIMessage, and the AIMessage becomes plain text —</text><text x="340" y="252" text-anchor="middle" font-size="11" fill="#718096">every stage shares one invoke() method, which is what lets the pipe operator snap them together.</text></svg>
