<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="380" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Two tools for two jobs</text><line x1="320" y1="56" x2="320" y2="330" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 4" /><text x="160" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">LangChain</text><text x="160" y="84" text-anchor="middle" font-size="11" fill="#718096">compose a fixed chain</text><rect x="80" y="100" width="160" height="40" rx="8" fill="#ebf4ff" stroke="#4299e1" /><text x="160" y="124" text-anchor="middle" font-size="12" fill="#2b6cb0">prompt template</text><text x="160" y="152" text-anchor="middle" font-size="14" fill="#a0aec0">|</text><rect x="80" y="160" width="160" height="40" rx="8" fill="#ebf4ff" stroke="#4299e1" /><text x="160" y="184" text-anchor="middle" font-size="12" fill="#2b6cb0">chat model</text><text x="160" y="212" text-anchor="middle" font-size="14" fill="#a0aec0">|</text><rect x="80" y="220" width="160" height="40" rx="8" fill="#ebf4ff" stroke="#4299e1" /><text x="160" y="244" text-anchor="middle" font-size="12" fill="#2b6cb0">output parser</text><text x="160" y="290" text-anchor="middle" font-size="10" fill="#718096">data flows one way</text><text x="160" y="306" text-anchor="middle" font-size="10" fill="#718096">through piped components</text><text x="480" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">LangGraph</text><text x="480" y="84" text-anchor="middle" font-size="11" fill="#718096">a stateful agent loop</text><rect x="408" y="110" width="144" height="44" rx="8" fill="#faf5ff" stroke="#9f7aea" /><text x="480" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">model node</text><rect x="408" y="216" width="144" height="44" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="480" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">tools node</text><path d="M446 154C420 175 420 195 444 214" fill="none" stroke="#9f7aea" stroke-width="1.8" /><polygon points="444 214 435 210 439 204" fill="#9f7aea" /><text x="396" y="188" text-anchor="middle" font-size="9" fill="#6b46c1">call tool</text><path d="M516 214C542 195 542 175 518 154" fill="none" stroke="#48bb78" stroke-width="1.8" /><polygon points="518 154 522 163 527 157" fill="#48bb78" /><text x="566" y="188" text-anchor="middle" font-size="9" fill="#276749">result</text><line x1="480" y1="260" x2="480" y2="292" stroke="#a0aec0" stroke-width="1.6" /><polygon points="480 292 476 283 484 283" fill="#a0aec0" /><rect x="416" y="294" width="128" height="34" rx="8" fill="#fffaf0" stroke="#ed8936" /><text x="480" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">final answer</text><text x="404" y="180" text-anchor="middle" font-size="9" fill="#9f7aea" /><text x="320" y="360" text-anchor="middle" font-size="11" fill="#718096">LangChain pipes components into a fixed chain; LangGraph runs a looping, stateful graph for agents — the loop you wrote by hand.</text></svg>