<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a202c">Rebuilding RAG with LangChain: build once, retrieve on every question</text><text x="320" y="54" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5568">Build phase — runs once</text><rect x="20" y="64" width="180" height="58" rx="9" fill="#f7fafc" stroke="#cbd5e0" /><text x="110" y="88" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">RecursiveCharacterTextSplitter</text><text x="110" y="103" text-anchor="middle" font-size="9.5" fill="#4a5568">14 chunks, overlap=100</text><line x1="200" y1="93" x2="228" y2="93" stroke="#a0aec0" stroke-width="1.5" /><polygon points="228 93,219 89,219 97" fill="#a0aec0" /><rect x="230" y="64" width="190" height="58" rx="9" fill="#f0fff4" stroke="#48bb78" /><text x="325" y="88" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">HuggingFaceEmbeddings</text><text x="325" y="103" text-anchor="middle" font-size="9.5" fill="#2f855a">local model, no API key</text><line x1="420" y1="93" x2="448" y2="93" stroke="#a0aec0" stroke-width="1.5" /><polygon points="448 93,439 89,439 97" fill="#a0aec0" /><rect x="450" y="64" width="170" height="58" rx="9" fill="#ebf4ff" stroke="#4299e1" /><text x="535" y="88" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">Chroma.from_documents</text><text x="535" y="103" text-anchor="middle" font-size="9.5" fill="#3182ce">embed &amp; store once</text><path d="M 535 122 L 535 148 L 110 148 L 110 172" fill="none" stroke="#a0aec0" stroke-width="1.5" /><polygon points="110 172,106 163,114 163" fill="#a0aec0" /><text x="320" y="144" text-anchor="middle" font-size="9.5" fill="#718096">rag.invoke(question) — every question re-enters here</text><text x="320" y="170" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5568">Query phase — runs on every rag.invoke()</text><rect x="20" y="178" width="180" height="58" rx="9" fill="#ebf4ff" stroke="#4299e1" /><text x="110" y="202" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">retriever.invoke()</text><text x="110" y="217" text-anchor="middle" font-size="9.5" fill="#3182ce">top-k=2 chunks</text><line x1="200" y1="207" x2="228" y2="207" stroke="#a0aec0" stroke-width="1.5" /><polygon points="228 207,219 203,219 211" fill="#a0aec0" /><rect x="230" y="178" width="190" height="58" rx="9" fill="#faf5ff" stroke="#9f7aea" /><text x="325" y="202" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">format_docs + prompt</text><text x="325" y="217" text-anchor="middle" font-size="9.5" fill="#805ad5">context + question</text><line x1="420" y1="207" x2="448" y2="207" stroke="#a0aec0" stroke-width="1.5" /><polygon points="448 207,439 203,439 211" fill="#a0aec0" /><rect x="450" y="178" width="170" height="58" rx="9" fill="#fffaf0" stroke="#ed8936" /><text x="535" y="202" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c05621">model + parser</text><text x="535" y="217" text-anchor="middle" font-size="9.5" fill="#9c4221">grounded answer</text><text x="320" y="280" text-anchor="middle" font-size="11" fill="#718096">Splitting and embedding happen once. rag.invoke() replays retrieve → build context → generate</text><text x="320" y="297" text-anchor="middle" font-size="11" fill="#718096">on the same Chroma collection — the same shape you built by hand in Module 7.</text></svg>
