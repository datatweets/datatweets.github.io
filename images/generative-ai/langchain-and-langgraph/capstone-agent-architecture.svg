<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="680" height="440" fill="#ffffff" /><text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The capstone agent: one loop, two tools, a plan, and memory</text><rect x="240" y="50" width="200" height="40" rx="8" fill="#faf5ff" stroke="#9f7aea" /><text x="340" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">planning system prompt</text><path d="M340 90 L 340 118" fill="none" stroke="#9f7aea" stroke-width="1.6" /><polygon points="340 118 336 109 344 109" fill="#9f7aea" /><circle cx="340" cy="220" r="78" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="340" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">create_agent</text><text x="340" y="232" text-anchor="middle" font-size="10" fill="#805ad5">think — act — observe</text><rect x="26" y="182" width="160" height="56" rx="8" fill="#ebf4ff" stroke="#4299e1" /><text x="106" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">InMemorySaver</text><text x="106" y="219" text-anchor="middle" font-size="9" fill="#3182ce">checkpointer</text><text x="106" y="232" text-anchor="middle" font-size="9" fill="#3182ce">thread_id: session1</text><path d="M188 200 L 260 192" fill="none" stroke="#4299e1" stroke-width="1.5" /><polygon points="260 192 251 189 252 197" fill="#4299e1" /><path d="M260 228 L 188 222" fill="none" stroke="#4299e1" stroke-width="1.5" /><polygon points="188 222 197 219 196 227" fill="#4299e1" /><text x="106" y="256" text-anchor="middle" font-size="8.5" fill="#a0aec0">save + reload every turn</text><rect x="488" y="122" width="166" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="571" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">search_docs</text><text x="571" y="158" text-anchor="middle" font-size="9" fill="#2f855a">Chroma retriever, k=3</text><path d="M414 182 L 482 156" fill="none" stroke="#48bb78" stroke-width="1.5" /><polygon points="482 156 473 156 476 164" fill="#48bb78" /><rect x="488" y="266" width="166" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="571" y="286" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">calculator</text><text x="571" y="302" text-anchor="middle" font-size="9" fill="#2f855a">safe eval, arithmetic</text><path d="M414 258 L 482 284" fill="none" stroke="#48bb78" stroke-width="1.5" /><polygon points="482 284 473 284 476 276" fill="#48bb78" /><text x="571" y="222" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2f855a">act (tool_calls) / observe (ToolMessage)</text><path d="M340 298 L 340 326" fill="none" stroke="#ed8936" stroke-width="1.6" /><polygon points="340 326 336 317 344 317" fill="#ed8936" /><rect x="230" y="330" width="220" height="46" rx="8" fill="#fffaf0" stroke="#ed8936" /><text x="340" y="351" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">final AIMessage</text><text x="340" y="366" text-anchor="middle" font-size="9.5" fill="#9c4221">no tool_calls — answer is ready</text><text x="340" y="406" text-anchor="middle" font-size="11" fill="#718096">The planning prompt sets policy; create_agent runs the loop; the checkpointer</text><text x="340" y="423" text-anchor="middle" font-size="11" fill="#718096">carries state across calls — you supply the pieces, LangGraph drives the order.</text></svg>
