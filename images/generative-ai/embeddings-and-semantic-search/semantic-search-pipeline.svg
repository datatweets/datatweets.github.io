<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="400" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The semantic search pipeline: embed once, search many times</text><text x="20" y="74" font-size="13" font-weight="600" fill="#4a5568">1. Build the index once</text><rect x="20" y="86" width="110" height="46" rx="6" fill="#f7fafc" stroke="#cbd5e0" /><text x="75" y="106" text-anchor="middle" font-size="11" fill="#2d3748">15 FAQ</text><text x="75" y="120" text-anchor="middle" font-size="11" fill="#2d3748">questions</text><rect x="150" y="86" width="120" height="46" rx="6" fill="#ebf4ff" stroke="#4299e1" /><text x="210" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">model.encode()</text><text x="210" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">(batched)</text><rect x="290" y="78" width="330" height="62" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="455" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">question_embeddings</text><text x="455" y="115" text-anchor="middle" font-size="11" fill="#2f855a">shape (15, 384) &#8212; one vector per FAQ, kept in memory</text><text x="455" y="130" text-anchor="middle" font-size="10" fill="#718096">computed once, reused by every search below</text><line x1="130" y1="109" x2="148" y2="109" stroke="#a0aec0" stroke-width="1.6" /><polygon points="148 109 140 105 140 113" fill="#a0aec0" /><line x1="270" y1="109" x2="288" y2="109" stroke="#a0aec0" stroke-width="1.6" /><polygon points="288 109 280 105 280 113" fill="#a0aec0" /><line x1="455" y1="140" x2="455" y2="255" stroke="#48bb78" stroke-width="1.4" stroke-dasharray="4 4" /><polygon points="455 255 450 244 460 244" fill="#48bb78" /><text x="470" y="200" font-size="10" fill="#2f855a">reused,</text><text x="470" y="213" font-size="10" fill="#2f855a">not recomputed</text><text x="20" y="235" font-size="13" font-weight="600" fill="#4a5568">2. Every search (repeated per query)</text><rect x="20" y="248" width="110" height="46" rx="6" fill="#f7fafc" stroke="#cbd5e0" /><text x="75" y="268" text-anchor="middle" font-size="11" fill="#2d3748">user query</text><text x="75" y="282" text-anchor="middle" font-size="10" fill="#718096">"can't sign in"</text><rect x="150" y="248" width="120" height="46" rx="6" fill="#ebf4ff" stroke="#4299e1" /><text x="210" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">model.encode()</text><text x="210" y="282" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">(one query)</text><rect x="290" y="240" width="170" height="62" rx="8" fill="#fffaf0" stroke="#ed8936" /><text x="375" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">rank by cosine</text><text x="375" y="275" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">similarity</text><text x="375" y="291" text-anchor="middle" font-size="10" fill="#9c4221">scores all 15 at once</text><rect x="480" y="240" width="140" height="62" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="550" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">top-k answers</text><text x="550" y="280" text-anchor="middle" font-size="10" fill="#2f855a">e.g. reset password</text><text x="550" y="293" text-anchor="middle" font-size="10" fill="#2f855a">(0.549)</text><line x1="130" y1="271" x2="148" y2="271" stroke="#a0aec0" stroke-width="1.6" /><polygon points="148 271 140 267 140 275" fill="#a0aec0" /><line x1="270" y1="271" x2="288" y2="271" stroke="#a0aec0" stroke-width="1.6" /><polygon points="288 271 280 267 280 275" fill="#a0aec0" /><line x1="460" y1="271" x2="478" y2="271" stroke="#a0aec0" stroke-width="1.6" /><polygon points="478 271 470 267 470 275" fill="#a0aec0" /><text x="320" y="368" text-anchor="middle" font-size="11" fill="#718096">Encoding the 15 FAQs is the expensive step, so Step 2 does it once.</text><text x="320" y="384" text-anchor="middle" font-size="11" fill="#718096">Every search only embeds the new query and compares it to the stored vectors.</text></svg>
