<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="380" fill="#ffffff" /><text x="320" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Text becomes points in a meaning space</text><text x="30" y="78" font-size="13" font-weight="600" fill="#4a5568">Sentences</text><rect x="24" y="92" width="190" height="34" rx="6" fill="#f7fafc" stroke="#cbd5e0" /><text x="119" y="113" text-anchor="middle" font-size="12" fill="#2d3748">"reset my password"</text><rect x="24" y="138" width="190" height="34" rx="6" fill="#f7fafc" stroke="#cbd5e0" /><text x="119" y="159" text-anchor="middle" font-size="12" fill="#2d3748">"I forgot my login"</text><rect x="24" y="246" width="190" height="34" rx="6" fill="#f7fafc" stroke="#cbd5e0" /><text x="119" y="267" text-anchor="middle" font-size="12" fill="#2d3748">"weather in Paris"</text><rect x="244" y="158" width="92" height="56" rx="8" fill="#ebf4ff" stroke="#4299e1" /><text x="290" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">embedding</text><text x="290" y="199" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">model</text><path d="M218 109C235 109 235 178 242 184" fill="none" stroke="#a0aec0" stroke-width="1.6" /><path d="M218 155C235 155 235 184 242 186" fill="none" stroke="#a0aec0" stroke-width="1.6" /><path d="M218 263C235 263 235 190 242 188" fill="none" stroke="#a0aec0" stroke-width="1.6" /><polygon points="242 186 234 182 234 190" fill="#a0aec0" /><text x="470" y="78" font-size="13" font-weight="600" fill="#4a5568">Embedding space</text><line x1="380" y1="320" x2="620" y2="320" stroke="#cbd5e0" stroke-width="1.5" /><line x1="380" y1="320" x2="380" y2="92" stroke="#cbd5e0" stroke-width="1.5" /><circle cx="470" cy="150" r="7" fill="#4299e1" /><text x="482" y="146" font-size="11" fill="#2b6cb0">reset password</text><circle cx="500" cy="172" r="7" fill="#4299e1" /><text x="512" y="176" font-size="11" fill="#2b6cb0">forgot login</text><line x1="470" y1="150" x2="500" y2="172" stroke="#90cdf4" stroke-width="1.4" stroke-dasharray="3 3" /><text x="455" y="200" font-size="10" fill="#718096">close = similar meaning</text><circle cx="585" cy="285" r="7" fill="#ed8936" /><text x="520" y="289" font-size="11" fill="#c05621">weather Paris</text><text x="320" y="22" font-size="11" fill="#fff" /><text x="320" y="362" text-anchor="middle" font-size="11" fill="#718096">Similar sentences land near each other; unrelated ones land far apart — even with no shared words.</text></svg>