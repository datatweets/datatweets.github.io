<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="380" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Cosine similarity is the angle between two vectors</text><line x1="20" y1="260" x2="360" y2="260" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="2 3" /><circle cx="110" cy="260" r="4" fill="#4a5568" /><text x="110" y="280" text-anchor="middle" font-size="11" fill="#718096">origin</text><path d="M 119.8 223.3 L 122.8 224.2 L 125.7 225.4 L 128.5 226.8 L 131.2 228.5 L 133.7 230.3 L 136.1 232.4 L 138.3 234.6 L 140.3 237.0 L 142.0 239.6 L 143.6 242.3" fill="none" stroke="#48bb78" stroke-width="1.6" /><path d="M 125.0 204.0 L 133.5 207.0 L 141.4 211.2 L 148.6 216.7 L 154.8 223.2 L 160.0 230.6 L 163.9 238.6 L 166.6 247.2 L 167.9 256.2 L 167.8 265.2 L 166.3 274.0" fill="none" stroke="#ed8936" stroke-width="1.6" stroke-dasharray="3 3" /><line x1="110" y1="260" x2="146.2" y2="124.8" stroke="#4299e1" stroke-width="2.4" /><polygon points="146.2 124.8 138.8 134.9 147.5 137.3" fill="#4299e1" /><text x="156" y="118" font-size="12" font-weight="700" fill="#2b6cb0">password</text><line x1="110" y1="260" x2="233.8" y2="194.7" stroke="#48bb78" stroke-width="2.4" /><polygon points="233.8 194.7 221.4 196.2 225.5 204.1" fill="#48bb78" /><text x="243" y="192" font-size="12" font-weight="700" fill="#276749">login</text><line x1="110" y1="260" x2="245.8" y2="293.9" stroke="#ed8936" stroke-width="2.4" /><polygon points="245.8 293.9 235.5 286.7 233.4 295.4" fill="#ed8936" /><text x="255" y="298" font-size="12" font-weight="700" fill="#c05621">weather</text><text x="178" y="220" font-size="12" font-weight="600" fill="#276749">&#952;&#8776;47&#176; &#183; cos &#8776; 0.68</text><text x="195" y="250" font-size="12" font-weight="600" fill="#c05621">&#952;&#8776;89&#176; &#183; cos &#8776; 0.02</text><text x="320" y="332" text-anchor="middle" font-size="12" fill="#718096">Smaller angle means higher cosine similarity.</text><text x="320" y="350" text-anchor="middle" font-size="12" fill="#718096">Password and login point in nearly the same direction.</text><text x="320" y="368" text-anchor="middle" font-size="12" fill="#718096">Password and weather point almost perpendicular.</text></svg>
