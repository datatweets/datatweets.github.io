<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="370" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">From prototype to production</text><rect x="36" y="120" width="150" height="120" rx="10" fill="#f7fafc" stroke="#cbd5e0" /><text x="111" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#2d3748">prototype</text><text x="111" y="172" text-anchor="middle" font-size="10" fill="#718096">one script</text><text x="111" y="190" text-anchor="middle" font-size="10" fill="#718096">runs on your</text><text x="111" y="208" text-anchor="middle" font-size="10" fill="#718096">laptop, happy path</text><line x1="186" y1="180" x2="226" y2="180" stroke="#a0aec0" stroke-width="2" /><polygon points="226 180 216 175 216 185" fill="#a0aec0" /><g><rect x="246" y="58" width="170" height="48" rx="8" fill="#ebf4ff" stroke="#4299e1" /><text x="262" y="80" font-size="12" font-weight="700" fill="#2b6cb0">Reliability</text><text x="262" y="96" font-size="9.5" fill="#3182ce">streaming, retries, timeouts</text><rect x="246" y="114" width="170" height="48" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="262" y="136" font-size="12" font-weight="700" fill="#276749">Cost</text><text x="262" y="152" font-size="9.5" fill="#2f855a">tokens, caching, model choice</text><rect x="246" y="170" width="170" height="48" rx="8" fill="#fffaf0" stroke="#ed8936" /><text x="262" y="192" font-size="12" font-weight="700" fill="#c05621">Security</text><text x="262" y="208" font-size="9.5" fill="#9c4221">secrets, input validation</text><rect x="246" y="226" width="170" height="48" rx="8" fill="#faf5ff" stroke="#9f7aea" /><text x="262" y="248" font-size="12" font-weight="700" fill="#6b46c1">Serving</text><text x="262" y="264" font-size="9.5" fill="#805ad5">an API, schemas, errors</text><rect x="246" y="282" width="170" height="48" rx="8" fill="#fff5f7" stroke="#ed64a6" /><text x="262" y="304" font-size="12" font-weight="700" fill="#b83280">Observability</text><text x="262" y="320" font-size="9.5" fill="#97266d">logging, usage, monitoring</text></g><line x1="416" y1="180" x2="456" y2="180" stroke="#a0aec0" stroke-width="2" /><polygon points="456 180 446 175 446 185" fill="#a0aec0" /><rect x="466" y="130" width="146" height="100" rx="10" fill="#f0fff4" stroke="#38a169" stroke-width="2" /><text x="539" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">a real app</text><text x="539" y="192" text-anchor="middle" font-size="10" fill="#2f855a">others can</text><text x="539" y="208" text-anchor="middle" font-size="10" fill="#2f855a">depend on</text><text x="320" y="356" text-anchor="middle" font-size="11" fill="#718096">Shipping means handling everything the happy-path prototype ignored: failures, cost, secrets, serving, and visibility.</text></svg>