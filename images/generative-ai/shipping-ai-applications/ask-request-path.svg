<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="420" fill="#ffffff" /><text x="360" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The /ask Request Path: Validation, Call, Error Mapping</text><rect x="280" y="48" width="160" height="46" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.6" /><text x="360" y="68" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2d3748">Client</text><text x="360" y="84" text-anchor="middle" font-size="9.5" fill="#718096">POST /ask {question}</text><line x1="360" y1="94" x2="360" y2="130" stroke="#a0aec0" stroke-width="1.6" /><polygon points="360 134,356 125,364 125" fill="#a0aec0" /><rect x="260" y="134" width="200" height="58" rx="9" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.6" /><text x="360" y="156" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">Pydantic schema check</text><text x="360" y="172" text-anchor="middle" font-size="9.5" fill="#3182ce">AskRequest: question present,</text><text x="360" y="185" text-anchor="middle" font-size="9.5" fill="#3182ce">right type, within max length</text><line x1="256" y1="163" x2="90" y2="163" stroke="#a0aec0" stroke-width="1.6" /><polygon points="86 163,95 159,95 167" fill="#a0aec0" /><rect x="20" y="136" width="180" height="54" rx="9" fill="#fff5f7" stroke="#ed64a6" stroke-width="1.6" /><text x="110" y="156" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b83280">422 Unprocessable</text><text x="110" y="172" text-anchor="middle" font-size="9.5" fill="#97266d">bad shape &#8212; rejected before</text><text x="110" y="184" text-anchor="middle" font-size="9.5" fill="#97266d">your code or the model ever runs</text><line x1="360" y1="192" x2="360" y2="228" stroke="#a0aec0" stroke-width="1.6" /><polygon points="360 232,356 223,364 223" fill="#a0aec0" /><rect x="250" y="232" width="220" height="58" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="360" y="254" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c05621">try: client.messages.create()</text><text x="360" y="270" text-anchor="middle" font-size="9.5" fill="#9c4221">empty-question check, then the</text><text x="360" y="283" text-anchor="middle" font-size="9.5" fill="#9c4221">real call to Claude</text><line x1="310" y1="290" x2="130" y2="326" stroke="#a0aec0" stroke-width="1.6" /><polygon points="126 328,132 320,136 328" fill="#a0aec0" /><line x1="360" y1="290" x2="360" y2="326" stroke="#a0aec0" stroke-width="1.6" /><polygon points="360 330,356 321,364 321" fill="#a0aec0" /><line x1="410" y1="290" x2="590" y2="326" stroke="#a0aec0" stroke-width="1.6" /><polygon points="594 328,586 328,590 320" fill="#a0aec0" /><rect x="30" y="330" width="200" height="60" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="130" y="352" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">200 OK</text><text x="130" y="368" text-anchor="middle" font-size="9.5" fill="#2f855a">AskResponse: answer,</text><text x="130" y="381" text-anchor="middle" font-size="9.5" fill="#2f855a">input_tokens, output_tokens</text><rect x="260" y="330" width="200" height="60" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="360" y="352" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c05621">429 Too Many Requests</text><text x="360" y="368" text-anchor="middle" font-size="9.5" fill="#9c4221">caught RateLimitError &#8212;</text><text x="360" y="381" text-anchor="middle" font-size="9.5" fill="#9c4221">caller should back off, retry</text><rect x="490" y="330" width="200" height="60" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="590" y="352" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b46c1">502 Bad Gateway</text><text x="590" y="368" text-anchor="middle" font-size="9.5" fill="#805ad5">caught other APIError &#8212;</text><text x="590" y="381" text-anchor="middle" font-size="9.5" fill="#805ad5">something upstream broke</text><text x="360" y="410" text-anchor="middle" font-size="10.5" fill="#718096">2xx means success, 4xx means your request was the problem, 5xx means the provider's side was.</text></svg>
