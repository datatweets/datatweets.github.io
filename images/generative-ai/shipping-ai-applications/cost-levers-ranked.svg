<svg xmlns="http://www.w3.org/2000/svg" width="700" height="392" viewBox="0 0 700 392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="392" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The Big Cost Levers, Ranked by Impact</text><rect x="40" y="54" width="620" height="66" rx="9" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.6" /><circle cx="72" cy="87" r="18" fill="#4299e1" /><text x="72" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text><text x="102" y="80" font-size="12.5" font-weight="700" fill="#2b6cb0">Choose the cheapest model that does the job</text><text x="102" y="98" font-size="9.5" fill="#3182ce">the same 1,000-in / 300-out request: $0.0025 on Haiku vs $0.0125 on Opus &#8212; a 5x difference</text><text x="102" y="112" font-size="9.5" fill="#3182ce">start small, step up only when the cheaper model genuinely fails your evaluation</text><rect x="40" y="132" width="620" height="60" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><circle cx="72" cy="162" r="18" fill="#ed8936" /><text x="72" y="167" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text><text x="102" y="155" font-size="12.5" font-weight="700" fill="#c05621">Cap max_tokens</text><text x="102" y="173" font-size="9.5" fill="#9c4221">output is priced roughly 5x input, so a tight ceiling caps the most expensive part of every call</text><rect x="40" y="204" width="620" height="60" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><circle cx="72" cy="234" r="18" fill="#9f7aea" /><text x="72" y="239" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text><text x="102" y="227" font-size="12.5" font-weight="700" fill="#6b46c1">Trim what you send</text><text x="102" y="245" font-size="9.5" fill="#805ad5">prune old chat turns, retrieve fewer snippets, keep the system prompt lean</text><rect x="40" y="276" width="620" height="66" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><circle cx="72" cy="309" r="18" fill="#48bb78" /><text x="72" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text><text x="102" y="302" font-size="12.5" font-weight="700" fill="#276749">Cache large reused prefixes</text><text x="102" y="320" font-size="9.5" fill="#2f855a">verified live: a 13,202-token prefix costs full price to write once, then reads back at</text><text x="102" y="334" font-size="9.5" fill="#2f855a">roughly a tenth of full price on every later call</text><text x="350" y="368" text-anchor="middle" font-size="10.5" fill="#718096">Ranked by typical effect on the bill. Model choice moves the most money; the other three</text><text x="350" y="384" text-anchor="middle" font-size="10.5" fill="#718096">levers stack on top of it and are worth pulling in roughly this order.</text></svg>
