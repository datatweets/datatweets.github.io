<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480" viewBox="0 0 700 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="480" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The Ask-Claude Service: All Five Concerns in One Endpoint</text><rect x="250" y="52" width="200" height="46" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="350" y="72" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b46c1">AskRequest schema</text><text x="350" y="88" text-anchor="middle" font-size="9.5" fill="#805ad5">question, 1&#8211;2000 chars</text><line x1="350" y1="98" x2="350" y2="134" stroke="#9f7aea" stroke-width="1.6" /><polygon points="350 138,346 129,354 129" fill="#9f7aea" /><circle cx="350" cy="238" r="88" fill="#ebf4ff" stroke="#4299e1" stroke-width="2" /><text x="350" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">FastAPI app</text><text x="350" y="246" text-anchor="middle" font-size="10" fill="#3182ce">/health</text><text x="350" y="262" text-anchor="middle" font-size="10" fill="#3182ce">/ask</text><rect x="20" y="196" width="180" height="60" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="110" y="217" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">Reliability</text><text x="110" y="233" text-anchor="middle" font-size="9" fill="#9c4221">Anthropic(max_retries=3)</text><text x="110" y="246" text-anchor="middle" font-size="9" fill="#9c4221">key read from environment</text><path d="M200 220 L 266 214" fill="none" stroke="#ed8936" stroke-width="1.5" /><polygon points="266 214 257 211 258 219" fill="#ed8936" /><path d="M266 250 L 200 258" fill="none" stroke="#ed8936" stroke-width="1.5" /><polygon points="200 258 209 255 208 263" fill="#ed8936" /><text x="110" y="272" text-anchor="middle" font-size="8.5" fill="#a0aec0">security + reliability, set once</text><rect x="500" y="150" width="180" height="56" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="590" y="171" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Claude API</text><text x="590" y="187" text-anchor="middle" font-size="9" fill="#2f855a">messages.create()</text><path d="M434 210 L 496 182" fill="none" stroke="#48bb78" stroke-width="1.5" /><polygon points="496 182 487 182 490 190" fill="#48bb78" /><rect x="500" y="270" width="180" height="56" rx="9" fill="#fff5f7" stroke="#ed64a6" stroke-width="1.6" /><text x="590" y="291" text-anchor="middle" font-size="11" font-weight="700" fill="#b83280">Error mapping</text><text x="590" y="307" text-anchor="middle" font-size="9" fill="#97266d">RateLimitError &#8594; 429</text><text x="590" y="320" text-anchor="middle" font-size="9" fill="#97266d">other APIError &#8594; 502</text><path d="M434 266 L 496 292" fill="none" stroke="#ed64a6" stroke-width="1.5" /><polygon points="496 292 487 292 490 284" fill="#ed64a6" /><text x="590" y="238" text-anchor="middle" font-size="9" font-weight="600" fill="#4a5568">usage.input_tokens / output_tokens on success</text><path d="M350 326 L 350 354" fill="none" stroke="#4299e1" stroke-width="1.6" /><polygon points="350 354 346 345 354 345" fill="#4299e1" /><rect x="230" y="358" width="240" height="52" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="350" y="379" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">Observability</text><text x="350" y="395" text-anchor="middle" font-size="9" fill="#805ad5">log tokens, cost_usd, latency_ms per request</text><line x1="350" y1="410" x2="350" y2="428" stroke="#a0aec0" stroke-width="1.6" /><polygon points="350 432,346 423,354 423" fill="#a0aec0" /><text x="350" y="446" text-anchor="middle" font-size="10.5" fill="#718096">Schemas, retries, error mapping, and logging wrap any Claude call &#8212; drop in a RAG</text><text x="350" y="461" text-anchor="middle" font-size="10.5" fill="#718096">pipeline, an agent, or a LangGraph workflow, and the shell around it stays the same.</text></svg>

