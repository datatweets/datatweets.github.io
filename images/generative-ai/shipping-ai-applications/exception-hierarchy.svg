<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="372" fill="#ffffff" /><text x="360" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The anthropic Exception Hierarchy</text><rect x="250" y="54" width="220" height="54" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.6" /><text x="360" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2d3748">anthropic.APIError</text><text x="360" y="93" text-anchor="middle" font-size="9" fill="#718096">the base class every exception below inherits from</text><line x1="290" y1="108" x2="76" y2="170" stroke="#a0aec0" stroke-width="1.5" /><polygon points="72 174,73 164,81 170" fill="#a0aec0" /><line x1="325" y1="108" x2="218" y2="170" stroke="#a0aec0" stroke-width="1.5" /><polygon points="214 174,217 165,224 171" fill="#a0aec0" /><line x1="360" y1="108" x2="360" y2="170" stroke="#a0aec0" stroke-width="1.5" /><polygon points="360 174,356 165,364 165" fill="#a0aec0" /><line x1="395" y1="108" x2="502" y2="170" stroke="#a0aec0" stroke-width="1.5" /><polygon points="506 174,499 171,506 165" fill="#a0aec0" /><line x1="430" y1="108" x2="644" y2="170" stroke="#a0aec0" stroke-width="1.5" /><polygon points="648 174,641 170,649 164" fill="#a0aec0" /><rect x="11" y="170" width="130" height="78" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="76" y="194" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c05621">RateLimit-</text><text x="76" y="208" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c05621">Error</text><text x="76" y="226" text-anchor="middle" font-size="8.5" fill="#9c4221">HTTP 429</text><text x="76" y="239" text-anchor="middle" font-size="8.5" fill="#9c4221">back off, retry</text><rect x="153" y="170" width="130" height="78" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="218" y="194" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">APITimeout-</text><text x="218" y="208" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">Error</text><text x="218" y="226" text-anchor="middle" font-size="8.5" fill="#805ad5">exceeded your</text><text x="218" y="239" text-anchor="middle" font-size="8.5" fill="#805ad5">timeout</text><rect x="295" y="170" width="130" height="78" rx="9" fill="#fff5f7" stroke="#ed64a6" stroke-width="1.6" /><text x="360" y="194" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b83280">APIConnection-</text><text x="360" y="208" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b83280">Error</text><text x="360" y="226" text-anchor="middle" font-size="8.5" fill="#97266d">never reached</text><text x="360" y="239" text-anchor="middle" font-size="8.5" fill="#97266d">the server</text><rect x="437" y="170" width="130" height="78" rx="9" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.6" /><text x="502" y="194" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">APIStatus-</text><text x="502" y="208" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">Error</text><text x="502" y="226" text-anchor="middle" font-size="8.5" fill="#3182ce">other 4xx/5xx</text><text x="502" y="239" text-anchor="middle" font-size="8.5" fill="#3182ce">check status_code</text><rect x="579" y="170" width="130" height="78" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="644" y="194" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">InternalServer-</text><text x="644" y="208" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">Error</text><text x="644" y="226" text-anchor="middle" font-size="8.5" fill="#2f855a">upstream 5xx</text><text x="644" y="239" text-anchor="middle" font-size="8.5" fill="#2f855a">transient, retry</text><line x1="20" y1="280" x2="700" y2="280" stroke="#a0aec0" stroke-width="1.7" /><polygon points="708 280,699 276,699 284" fill="#a0aec0" /><text x="360" y="300" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4a5568">catch order: most specific first, then a general except APIError as a catch-all</text><text x="360" y="340" text-anchor="middle" font-size="10.5" fill="#718096">Every exception here inherits from anthropic.APIError. Ordering except blocks specific-first keeps</text><text x="360" y="356" text-anchor="middle" font-size="10.5" fill="#718096">each failure handled the way it deserves, instead of a broad handler swallowing it first.</text></svg>
