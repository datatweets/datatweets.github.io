 <text x="427" y="176" font-size="11" font-weight="700" fill="#6b46c1">description: "Count the number</text>
 <text x="427" y="192" font-size="11" font-weight="700" fill="#6b46c1">of words in a piece of text."</text>
 <text x="427" y="209" font-size="9.5" fill="#805ad5">what Claude reads to decide when to call it</text>

 <rect x="30" y="238" width="310" height="70" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" />
 <text x="45" y="264" font-size="11" font-family="Menlo, Consolas, monospace" fill="#2d3748">def word_count(<tspan fill="#c05621" font-weight="700">text: str</tspan>) -&gt; int:</text>
 <text x="45" y="288" font-size="9.5" fill="#718096">the type hint</text>

 <line x1="340" y1="273" x2="410" y2="273" stroke="#a0aec0" stroke-width="1.8" />
 <polygon points="410 273 400 268 400 278" fill="#a0aec0" />

 <rect x="412" y="238" width="318" height="70" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" />
 <text x="427" y="262" font-size="10.5" font-weight="700" fill="#c05621">input schema: {"text": {"type":</text>
 <text x="427" y="278" font-size="10.5" font-weight="700" fill="#c05621">"string"}, "required": ["text"]}</text>
 <text x="427" y="297" font-size="9.5" fill="#9c4221">what a caller must send in</text>

 <text x="380" y="330" text-anchor="middle" font-size="10.5" fill="#718096">You never write a schema by hand — the decorator inspects the function and builds it for you.</text>
