<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
 <rect width="760" height="320" fill="#ffffff" />
 <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Three pieces, one MCP integration</text>

 <rect x="30" y="100" width="190" height="120" rx="11" fill="#f0fff4" stroke="#48bb78" stroke-width="1.8" />
 <text x="125" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#276749">task_server.py</text>
 <text x="125" y="144" text-anchor="middle" font-size="9.5" fill="#2f855a">FastMCP server</text>
 <text x="125" y="162" text-anchor="middle" font-size="9.5" fill="#2f855a">in-memory task store</text>
 <text x="125" y="180" text-anchor="middle" font-size="9.5" fill="#2f855a">add_task, list_tasks,</text>
 <text x="125" y="196" text-anchor="middle" font-size="9.5" fill="#2f855a">complete_task + 1 resource</text>

 <line x1="220" y1="140" x2="288" y2="140" stroke="#a0aec0" stroke-width="1.8" />
 <polygon points="288 140 278 135 278 145" fill="#a0aec0" />
 <line x1="288" y1="180" x2="220" y2="180" stroke="#a0aec0" stroke-width="1.8" />
 <polygon points="220 180 230 175 230 185" fill="#a0aec0" />
 <text x="254" y="130" text-anchor="middle" font-size="8.5" fill="#718096">spawn + call_tool</text>
 <text x="254" y="196" text-anchor="middle" font-size="8.5" fill="#718096">result</text>

 <rect x="290" y="90" width="190" height="140" rx="11" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.8" />
 <text x="385" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b6cb0">task_client.py</text>
 <text x="385" y="134" text-anchor="middle" font-size="9.5" fill="#3182ce">the bridge</text>
 <text x="385" y="154" text-anchor="middle" font-size="9.5" fill="#3182ce">1. discover MCP tools</text>
 <text x="385" y="170" text-anchor="middle" font-size="9.5" fill="#3182ce">2. convert to Anthropic defs</text>
 <text x="385" y="186" text-anchor="middle" font-size="9.5" fill="#3182ce">3. run the tool-use loop,</text>
 <text x="385" y="202" text-anchor="middle" font-size="9.5" fill="#3182ce">executing via the MCP session</text>

 <line x1="480" y1="140" x2="538" y2="140" stroke="#a0aec0" stroke-width="1.8" />
 <polygon points="538 140 528 135 528 145" fill="#a0aec0" />
 <line x1="538" y1="180" x2="480" y2="180" stroke="#a0aec0" stroke-width="1.8" />
 <polygon points="480 180 490 175 490 185" fill="#a0aec0" />
 <text x="509" y="130" text-anchor="middle" font-size="8.5" fill="#718096">tools + messages</text>
 <text x="509" y="196" text-anchor="middle" font-size="8.5" fill="#718096">tool_use</text>

 <rect x="540" y="100" width="190" height="120" rx="11" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.8" />
 <text x="635" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b46c1">Claude</text>
 <text x="635" y="144" text-anchor="middle" font-size="9.5" fill="#805ad5">Anthropic Messages API</text>
 <text x="635" y="164" text-anchor="middle" font-size="9.5" fill="#805ad5">reads the converted tools,</text>
 <text x="635" y="180" text-anchor="middle" font-size="9.5" fill="#805ad5">decides which to call,</text>
 <text x="635" y="196" text-anchor="middle" font-size="9.5" fill="#805ad5">can chain more than one</text>

 <text x="380" y="256" text-anchor="middle" font-size="10.5" fill="#4a5568">Claude never talks to the server directly — the client discovers, converts, and executes on Claude's behalf.</text>
 <text x="380" y="282" text-anchor="middle" font-size="10.5" fill="#718096">One request can drive two tools in a row: add_task, then list_tasks, stitched into a single reply — tool chaining over MCP.</text>
</svg>
