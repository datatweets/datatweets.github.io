<svg xmlns="http://www.w3.org/2000/svg" width="700" height="310" viewBox="0 0 700 310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="310" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">CUPED: subtract the noise you can predict in advance</text><text x="185" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#c53030">Raw metric (wide)</text><line x1="60" y1="150" x2="320" y2="150" stroke="#a0aec0" stroke-width="1.3" /><path d="M70 150C150 150 150 95 190 95C230 95 230 150 310 150" fill="#fff5f5" stroke="#fc8181" stroke-width="2" /><line x1="190" y1="150" x2="190" y2="88" stroke="#c53030" stroke-width="1.6" stroke-dasharray="3 3" /><text x="190" y="168" text-anchor="middle" font-size="8.5" fill="#9b2c2c">effect is hard to see in the spread</text><text x="240" y="118" font-size="9" fill="#718096">std err</text><text x="240" y="130" font-size="11" font-weight="700" fill="#c53030">0.0201</text><line x1="330" y1="120" x2="378" y2="120" stroke="#4a5568" stroke-width="1.8" /><polygon points="378 120 368 115 368 125" fill="#4a5568" /><text x="354" y="110" text-anchor="middle" font-size="8" fill="#4a5568">Y' = Y − θ(X−X̄)</text><text x="354" y="136" text-anchor="middle" font-size="7.5" fill="#718096">remove pre-period</text><text x="354" y="146" text-anchor="middle" font-size="7.5" fill="#718096">predictable part</text><text x="510" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Adjusted metric (narrow)</text><line x1="390" y1="150" x2="650" y2="150" stroke="#a0aec0" stroke-width="1.3" /><path d="M450 150C490 150 495 82 520 82C545 82 550 150 590 150" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><line x1="520" y1="150" x2="520" y2="75" stroke="#276749" stroke-width="1.6" stroke-dasharray="3 3" /><text x="520" y="168" text-anchor="middle" font-size="8.5" fill="#22543d">same effect, far less noise</text><text x="600" y="118" font-size="9" fill="#718096">std err</text><text x="600" y="130" font-size="11" font-weight="700" fill="#276749">0.0144</text><rect x="110" y="204" width="480" height="80" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.3" /><text x="350" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">Variance falls by ~ ρ² (here corr ρ = 0.7 → −48%)</text><text x="350" y="250" text-anchor="middle" font-size="9.5" fill="#4a5568">The standard error drops 28%, so the SAME experiment reaches significance with roughly HALF the users.</text><text x="350" y="270" text-anchor="middle" font-size="8.5" fill="#718096">θ = cov(X,Y)/var(X); X is any pre-experiment metric correlated with the outcome (e.g. prior spend). No effect on the estimate — just less noise.</text></svg>