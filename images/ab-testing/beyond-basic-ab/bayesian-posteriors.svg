<svg xmlns="http://www.w3.org/2000/svg" width="700" height="310" viewBox="0 0 700 310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="310" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Bayesian A/B: a probability, not just a p-value</text><text x="350" y="49" text-anchor="middle" font-size="10" fill="#718096">posterior belief about each page's true conversion rate (Beta-Binomial)</text><line x1="70" y1="210" x2="640" y2="210" stroke="#a0aec0" stroke-width="1.3" /><text x="355" y="230" text-anchor="middle" font-size="9.5" fill="#4a5568">true conversion rate</text><g font-size="8" fill="#718096"><text x="180" y="226" text-anchor="middle">9%</text><text x="300" y="226" text-anchor="middle">10%</text><text x="420" y="226" text-anchor="middle">11%</text><text x="540" y="226" text-anchor="middle">12%</text><text x="620" y="226" text-anchor="middle">13%</text></g><path d="M210 210C270 210 275 100 305 100C335 100 340 210 400 210" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" opacity="0.85" /><text x="270" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">control</text><text x="270" y="105" text-anchor="middle" font-size="8.5" fill="#3182ce">~10.1%</text><path d="M440 210C500 210 505 100 535 100C565 100 570 210 630 210" fill="#f0fff4" stroke="#48bb78" stroke-width="2" opacity="0.8" /><text x="585" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">treatment</text><text x="585" y="105" text-anchor="middle" font-size="8.5" fill="#2f855a">~12.3%</text><text x="418" y="180" text-anchor="middle" font-size="8" fill="#a0aec0">barely overlap</text><rect x="120" y="244" width="220" height="56" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="230" y="266" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">P(treatment &gt; control)</text><text x="230" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#276749">99.98%</text><rect x="360" y="244" width="260" height="56" rx="9" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.3" /><text x="490" y="266" text-anchor="middle" font-size="10" font-weight="700" fill="#4a5568">95% credible interval on the lift</text><text x="490" y="288" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">[+0.96, +3.44] points</text><text x="350" y="76" text-anchor="middle" font-size="8.5" fill="#718096">Same Lumen data as the frequentist test — the credible interval matches the confidence interval, in plainer language.</text></svg>