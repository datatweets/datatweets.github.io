<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="320" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Sequential testing: peek safely with a stricter boundary</text><text x="350" y="49" text-anchor="middle" font-size="10" fill="#718096">a calibrated boundary keeps the false-positive rate at 5% across 5 looks</text><line x1="80" y1="250" x2="640" y2="250" stroke="#a0aec0" stroke-width="1.4" /><text x="360" y="270" text-anchor="middle" font-size="9.5" fill="#4a5568">look number (data accumulating →)</text><line x1="80" y1="70" x2="80" y2="250" stroke="#a0aec0" stroke-width="1.4" /><text x="52" y="160" text-anchor="middle" font-size="9.5" fill="#4a5568" transform="rotate(-90 52 160)">|z| statistic</text><line x1="80" y1="180" x2="640" y2="180" stroke="#fc8181" stroke-width="1.6" stroke-dasharray="6 3" /><text x="648" y="183" font-size="9" font-weight="700" fill="#c53030">1.96</text><text x="150" y="174" font-size="8" fill="#c53030">naive — crossed by chance too often (14%)</text><line x1="80" y1="140" x2="640" y2="140" stroke="#48bb78" stroke-width="2" /><text x="648" y="143" font-size="9" font-weight="700" fill="#276749">2.41</text><text x="150" y="132" font-size="8" font-weight="700" fill="#276749">calibrated boundary — family error back to 5%</text><polyline points="140 215 240 190 340 168 440 150 540 205 620 175" fill="none" stroke="#4299e1" stroke-width="2.4" /><circle cx="140" cy="215" r="3.5" fill="#4299e1" /><circle cx="240" cy="190" r="3.5" fill="#4299e1" /><circle cx="340" cy="168" r="4.5" fill="#ed8936" /><circle cx="440" cy="150" r="4.5" fill="#ed8936" /><circle cx="540" cy="205" r="3.5" fill="#4299e1" /><text x="390" y="205" text-anchor="middle" font-size="8" fill="#c05621">above 1.96 (would stop naively) but below the safe boundary — keep going</text><g font-size="8" fill="#718096"><text x="140" y="263" text-anchor="middle">1</text><text x="240" y="263" text-anchor="middle">2</text><text x="340" y="263" text-anchor="middle">3</text><text x="440" y="263" text-anchor="middle">4</text><text x="540" y="263" text-anchor="middle">5</text></g><text x="350" y="300" text-anchor="middle" font-size="9.5" fill="#718096">Looking 5 times at the ordinary 1.96 line inflates errors to 14%; requiring |z| &gt; 2.41 at every look restores 5% — and you can still stop as soon as it's crossed.</text></svg>