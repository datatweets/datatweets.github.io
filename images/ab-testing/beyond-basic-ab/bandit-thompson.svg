<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="320" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Multi-armed bandit: send traffic to the winner as you learn</text><text x="120" y="72" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4a5568">Arm A</text><text x="120" y="86" text-anchor="middle" font-size="8.5" fill="#718096">true 10%</text><text x="350" y="72" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">Arm B (best)</text><text x="350" y="86" text-anchor="middle" font-size="8.5" fill="#276749">true 12%</text><text x="580" y="72" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4a5568">Arm C</text><text x="580" y="86" text-anchor="middle" font-size="8.5" fill="#718096">true 11%</text><text x="60" y="120" font-size="9" fill="#4a5568">Traffic sent</text><text x="60" y="132" font-size="9" fill="#4a5568">by Thompson</text><text x="60" y="144" font-size="9" fill="#4a5568">sampling:</text><rect x="90" y="247" width="60" height="3" rx="1" fill="#a0aec0" /><text x="120" y="240" text-anchor="middle" font-size="8.5" fill="#718096">528</text><text x="120" y="264" text-anchor="middle" font-size="8" fill="#a0aec0">2%</text><rect x="320" y="100" width="60" height="150" rx="3" fill="#48bb78" /><text x="350" y="93" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">24,755</text><text x="350" y="264" text-anchor="middle" font-size="8.5" font-weight="700" fill="#276749">83% → the winner</text><rect x="550" y="221" width="60" height="29" rx="2" fill="#90cdf4" /><text x="580" y="214" text-anchor="middle" font-size="8.5" fill="#3182ce">4,717</text><text x="580" y="264" text-anchor="middle" font-size="8" fill="#3182ce">16%</text><line x1="80" y1="250" x2="640" y2="250" stroke="#cbd5e0" stroke-width="1.2" /><rect x="120" y="278" width="220" height="34" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.3" /><text x="230" y="299" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">Bandit regret: 124 lost conversions</text><rect x="360" y="278" width="220" height="34" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.3" /><text x="470" y="299" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">Even 1/3 split: 300 lost</text><text x="350" y="160" text-anchor="middle" font-size="9" fill="#718096">Each round: sample each arm's rate from its posterior, play the</text><text x="350" y="173" text-anchor="middle" font-size="9" fill="#718096">current best, update. Exploration fades as the winner becomes clear.</text></svg>