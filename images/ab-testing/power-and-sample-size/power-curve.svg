<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="330" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Power rises with sample size</text><text x="350" y="49" text-anchor="middle" font-size="10" fill="#718096">detecting a 10% → 12% lift, by Monte-Carlo simulation (40,000 experiments each)</text><line x1="90" y1="270" x2="650" y2="270" stroke="#a0aec0" stroke-width="1.5" /><line x1="90" y1="70" x2="90" y2="270" stroke="#a0aec0" stroke-width="1.5" /><text x="370" y="308" text-anchor="middle" font-size="10" fill="#4a5568">users per arm</text><text x="44" y="170" text-anchor="middle" font-size="10" fill="#4a5568" transform="rotate(-90 44 170)">power</text><line x1="86" y1="270" x2="90" y2="270" stroke="#a0aec0" stroke-width="1.5" /><text x="80" y="273" text-anchor="end" font-size="8.5" fill="#718096">0</text><line x1="86" y1="170" x2="650" y2="170" stroke="#edf2f7" stroke-width="1" /><text x="80" y="173" text-anchor="end" font-size="8.5" fill="#718096">0.5</text><line x1="86" y1="110" x2="650" y2="110" stroke="#fed7aa" stroke-width="1" stroke-dasharray="4 3" /><text x="80" y="113" text-anchor="end" font-size="8.5" font-weight="700" fill="#c05621">0.80</text><line x1="86" y1="70" x2="650" y2="70" stroke="#edf2f7" stroke-width="1" /><text x="80" y="73" text-anchor="end" font-size="8.5" fill="#718096">1.0</text><path d="M110 246Q150 210 180 187Q250 140 320 110Q440 82 570 74" fill="none" stroke="#4299e1" stroke-width="2.6" /><circle cx="180" cy="187" r="5" fill="#e53e3e" /><text x="180" y="205" text-anchor="middle" font-size="8.5" fill="#4a5568">1,500</text><text x="180" y="176" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c53030">0.416</text><circle cx="320" cy="110" r="5.5" fill="#48bb78" /><line x1="320" y1="110" x2="320" y2="270" stroke="#48bb78" stroke-width="1" stroke-dasharray="3 3" /><text x="320" y="284" text-anchor="middle" font-size="8.5" font-weight="700" fill="#276749">3,839</text><text x="332" y="102" font-size="8.5" font-weight="700" fill="#276749">0.802 — the formula's n</text><circle cx="570" cy="74" r="5" fill="#4299e1" /><text x="570" y="66" text-anchor="middle" font-size="8.5" fill="#2b6cb0">0.982</text><text x="570" y="284" text-anchor="middle" font-size="8.5" fill="#4a5568">8,000</text><text x="350" y="322" text-anchor="middle" font-size="9.5" fill="#718096">The formula's 3,839/arm lands right on 80% power — simulation confirms the math. Below it you'll miss real effects.</text></svg>