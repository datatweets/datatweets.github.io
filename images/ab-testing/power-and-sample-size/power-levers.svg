<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="300" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Four levers on statistical power</text><text x="350" y="49" text-anchor="middle" font-size="10.5" fill="#718096">power = the probability of detecting an effect that is really there</text><circle cx="350" cy="165" r="52" fill="#f0fff4" stroke="#48bb78" stroke-width="2.2" /><text x="350" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">Power</text><text x="350" y="178" text-anchor="middle" font-size="10" fill="#2f855a">1 − β</text><rect x="40" y="80" width="180" height="50" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="130" y="100" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">Sample size ↑</text><text x="130" y="117" text-anchor="middle" font-size="8.5" fill="#3182ce">more users → more power</text><line x1="220" y1="112" x2="300" y2="150" stroke="#48bb78" stroke-width="1.6" /><polygon points="300 150 289 148 293 140" fill="#48bb78" /><rect x="480" y="80" width="180" height="50" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="570" y="100" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">Effect size ↑</text><text x="570" y="117" text-anchor="middle" font-size="8.5" fill="#805ad5">bigger effects are easier</text><line x1="480" y1="112" x2="400" y2="150" stroke="#48bb78" stroke-width="1.6" /><polygon points="400 150 407 140 411 148" fill="#48bb78" /><rect x="40" y="205" width="180" height="50" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="130" y="225" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c05621">Significance α ↑</text><text x="130" y="242" text-anchor="middle" font-size="8.5" fill="#9c4221">looser bar → more power*</text><line x1="220" y1="222" x2="300" y2="182" stroke="#ed8936" stroke-width="1.6" stroke-dasharray="4 3" /><polygon points="300 182 293 190 289 182" fill="#ed8936" /><rect x="480" y="205" width="180" height="50" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="570" y="225" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">Variance ↓</text><text x="570" y="242" text-anchor="middle" font-size="8.5" fill="#3182ce">less noise → more power</text><line x1="480" y1="222" x2="400" y2="182" stroke="#48bb78" stroke-width="1.6" /><polygon points="400 182 411 182 407 190" fill="#48bb78" /><text x="350" y="285" text-anchor="middle" font-size="9" fill="#718096">*Loosening α buys power but raises false positives — the only "free" levers are more data and less noise.</text></svg>