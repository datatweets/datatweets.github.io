<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="300" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Four inputs decide the sample size</text><rect x="40" y="70" width="150" height="52" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="115" y="90" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">Baseline rate</text><text x="115" y="107" text-anchor="middle" font-size="8.5" fill="#3182ce">current conversion, e.g. 10%</text><rect x="40" y="132" width="150" height="52" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="115" y="152" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">MDE</text><text x="115" y="169" text-anchor="middle" font-size="8.5" fill="#805ad5">smallest lift to detect, +2pt</text><rect x="40" y="194" width="150" height="52" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="115" y="214" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c05621">Significance α</text><text x="115" y="231" text-anchor="middle" font-size="8.5" fill="#9c4221">false-positive rate, 0.05</text><rect x="215" y="132" width="150" height="52" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="290" y="152" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">Power</text><text x="290" y="169" text-anchor="middle" font-size="8.5" fill="#2f855a">chance to detect, 0.80</text><line x1="190" y1="96" x2="410" y2="150" stroke="#a0aec0" stroke-width="1.4" /><line x1="190" y1="158" x2="410" y2="158" stroke="#a0aec0" stroke-width="1.4" /><line x1="190" y1="220" x2="410" y2="168" stroke="#a0aec0" stroke-width="1.4" /><line x1="365" y1="158" x2="410" y2="159" stroke="#a0aec0" stroke-width="1.4" /><rect x="412" y="120" width="150" height="78" rx="10" fill="#f7fafc" stroke="#4a5568" stroke-width="1.6" /><text x="487" y="143" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">sample-size</text><text x="487" y="159" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">formula</text><text x="487" y="182" text-anchor="middle" font-size="8" font-family="monospace" fill="#718096">(zα+zβ)²·… / (p₂−p₁)²</text><line x1="562" y1="159" x2="600" y2="159" stroke="#48bb78" stroke-width="2.2" /><polygon points="600 159 589 154 589 164" fill="#48bb78" /><rect x="602" y="128" width="70" height="62" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.8" /><text x="637" y="152" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">n per</text><text x="637" y="167" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">arm</text><text x="637" y="182" text-anchor="middle" font-size="8" fill="#2f855a">3,839</text><text x="350" y="272" text-anchor="middle" font-size="10" fill="#4a5568">Pin down the baseline, the effect you care about, and your tolerances for the two errors — the size follows.</text><text x="350" y="290" text-anchor="middle" font-size="9" fill="#718096">Every input is a decision you make before running, not something you read off the data.</text></svg>