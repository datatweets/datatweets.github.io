<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="330" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Two ways to be wrong, two ways to be right</text><text x="350" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">The truth</text><text x="300" y="86" text-anchor="middle" font-size="10.5" font-weight="700" fill="#718096">No real effect (H₀ true)</text><text x="510" y="86" text-anchor="middle" font-size="10.5" font-weight="700" fill="#718096">Real effect (H₁ true)</text><text x="60" y="150" text-anchor="middle" font-size="10.5" font-weight="700" fill="#718096" transform="rotate(-90 60 150)">Call it</text><text x="60" y="245" text-anchor="middle" font-size="10.5" font-weight="700" fill="#718096" transform="rotate(-90 60 245)">significant?</text><text x="120" y="132" text-anchor="middle" font-size="9.5" fill="#4a5568">Yes — ship</text><text x="120" y="235" text-anchor="middle" font-size="9.5" fill="#4a5568">No — hold</text><rect x="200" y="100" width="210" height="90" rx="9" fill="#fff5f5" stroke="#fc8181" stroke-width="1.8" /><text x="305" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#c53030">Type I error</text><text x="305" y="148" text-anchor="middle" font-size="9" fill="#9b2c2c">false positive — ship a dud</text><text x="305" y="170" text-anchor="middle" font-size="10" font-weight="700" fill="#c53030">rate = α (e.g. 0.05)</text><rect x="420" y="100" width="210" height="90" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.8" /><text x="525" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Correct ✓</text><text x="525" y="148" text-anchor="middle" font-size="9" fill="#22543d">detected a real effect</text><text x="525" y="170" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">rate = power = 1 − β</text><rect x="200" y="200" width="210" height="90" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="305" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Correct ✓</text><text x="305" y="248" text-anchor="middle" font-size="9" fill="#22543d">no effect, called none</text><text x="305" y="270" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">rate = 1 − α</text><rect x="420" y="200" width="210" height="90" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.8" /><text x="525" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">Type II error</text><text x="525" y="248" text-anchor="middle" font-size="9" fill="#7b341e">false negative — miss a winner</text><text x="525" y="270" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621">rate = β</text><text x="350" y="316" text-anchor="middle" font-size="9.5" fill="#718096">α is how often you cry wolf; β is how often you miss a real wolf. Power (1−β) is catching the real ones.</text></svg>