<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="320" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The two-sample t-test: is the gap between two averages real?</text><line x1="60" y1="220" x2="640" y2="220" stroke="#a0aec0" stroke-width="1.4" /><text x="350" y="238" text-anchor="middle" font-size="9.5" fill="#4a5568">revenue per user ($)</text><path d="M90 220C160 220 200 120 250 120C300 120 340 220 470 220" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" opacity="0.85" /><line x1="250" y1="220" x2="250" y2="108" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="4 3" /><text x="250" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">control mean</text><text x="250" y="88" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">$15.62</text><path d="M150 220C240 220 270 145 298 145C340 145 400 220 560 220" fill="#f0fff4" stroke="#48bb78" stroke-width="2" opacity="0.7" /><line x1="298" y1="220" x2="298" y2="133" stroke="#276749" stroke-width="2" stroke-dasharray="4 3" /><text x="360" y="128" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">treatment mean $16.84</text><line x1="250" y1="250" x2="298" y2="250" stroke="#e53e3e" stroke-width="2" /><line x1="250" y1="245" x2="250" y2="255" stroke="#e53e3e" stroke-width="2" /><line x1="298" y1="245" x2="298" y2="255" stroke="#e53e3e" stroke-width="2" /><text x="274" y="270" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">+$1.22</text><rect x="430" y="250" width="230" height="54" rx="9" fill="#f7fafc" stroke="#4a5568" stroke-width="1.4" /><text x="545" y="270" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">t = (mean₂ − mean₁) / SE</text><text x="545" y="287" text-anchor="middle" font-size="8.5" fill="#718096">how many standard errors apart</text><text x="545" y="299" text-anchor="middle" font-size="8" fill="#a0aec0">the averages are — then a p-value</text><text x="200" y="304" text-anchor="middle" font-size="9.5" fill="#718096">Same idea as the z-test: effect over noise. But now the "effect" is a</text><text x="200" y="316" text-anchor="middle" font-size="9.5" fill="#718096">difference in averages, and the noise depends on each group's spread.</text></svg>