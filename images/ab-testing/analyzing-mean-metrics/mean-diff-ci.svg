<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="290" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">A CI that straddles zero: the lift might not be there</text><text x="350" y="49" text-anchor="middle" font-size="10" fill="#718096">95% Welch confidence interval for the difference in mean revenue (treatment − control)</text><line x1="80" y1="150" x2="640" y2="150" stroke="#a0aec0" stroke-width="1.5" /><line x1="270" y1="140" x2="270" y2="225" stroke="#e53e3e" stroke-width="1.6" stroke-dasharray="4 3" /><text x="270" y="242" text-anchor="middle" font-size="9" font-weight="700" fill="#c53030">$0 (no effect)</text><text x="170" y="168" text-anchor="middle" font-size="8.5" fill="#a0aec0">−$1</text><text x="370" y="168" text-anchor="middle" font-size="8.5" fill="#a0aec0">+$1</text><text x="470" y="168" text-anchor="middle" font-size="8.5" fill="#a0aec0">+$2</text><text x="570" y="168" text-anchor="middle" font-size="8.5" fill="#a0aec0">+$3</text><line x1="267" y1="110" x2="517" y2="110" stroke="#9f7aea" stroke-width="3" /><line x1="267" y1="98" x2="267" y2="122" stroke="#9f7aea" stroke-width="3" /><line x1="517" y1="98" x2="517" y2="122" stroke="#9f7aea" stroke-width="3" /><circle cx="392" cy="110" r="6" fill="#6b46c1" /><text x="392" y="92" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">+$1.22 (observed)</text><text x="262" y="138" text-anchor="middle" font-size="8.5" fill="#805ad5">−$0.03</text><text x="520" y="138" text-anchor="middle" font-size="8.5" fill="#805ad5">+$2.47</text><rect x="150" y="196" width="400" height="42" rx="9" fill="#fff5f5" stroke="#fc8181" stroke-width="1.3" transform="translate(0 0)" /><text x="350" y="215" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">The interval includes $0 — a true lift of zero is still plausible</text><text x="350" y="230" text-anchor="middle" font-size="8.5" fill="#9b2c2c">consistent with Welch p = 0.0566 (not significant); could be anywhere from −3¢ to +$2.47</text><text x="350" y="266" text-anchor="middle" font-size="9.5" fill="#718096">The point estimate looks positive, but the interval says we can't rule out no effect — the p-value and CI agree.</text></svg>