<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="330" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">When the average lies: mean up, typical user down</text><line x1="60" y1="210" x2="640" y2="210" stroke="#a0aec0" stroke-width="1.4" /><text x="350" y="228" text-anchor="middle" font-size="9.5" fill="#4a5568">revenue per user ($) — heavily right-skewed</text><path d="M90 210C120 210 135 90 165 90C210 90 240 210 380 210C480 210 560 200 620 208" fill="#f0fff4" stroke="#48bb78" stroke-width="2" opacity="0.75" /><line x1="175" y1="210" x2="175" y2="95" stroke="#276749" stroke-width="2" /><text x="175" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">median</text><text x="175" y="74" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">$9.39</text><line x1="300" y1="210" x2="300" y2="120" stroke="#c53030" stroke-width="2" stroke-dasharray="4 3" /><text x="300" y="112" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">mean</text><text x="300" y="100" text-anchor="middle" font-size="9" font-weight="700" fill="#c53030">$16.84</text><path d="M420 200C500 200 560 198 610 205" fill="none" stroke="#ed8936" stroke-width="1.4" /><text x="530" y="185" text-anchor="middle" font-size="8.5" fill="#c05621">a few big spenders</text><text x="530" y="196" text-anchor="middle" font-size="8.5" fill="#c05621">drag the mean right</text><rect x="70" y="250" width="270" height="66" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="205" y="270" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">The mean says treatment wins</text><text x="205" y="287" text-anchor="middle" font-size="8.5" fill="#3182ce">$16.84 vs $15.62 — up $1.22</text><text x="205" y="303" text-anchor="middle" font-size="8.5" fill="#718096">driven entirely by the tail</text><rect x="360" y="250" width="270" height="66" rx="9" fill="#fff5f5" stroke="#fc8181" stroke-width="1.4" /><text x="495" y="270" text-anchor="middle" font-size="10" font-weight="700" fill="#c53030">The ranks say control wins</text><text x="495" y="287" text-anchor="middle" font-size="8.5" fill="#9b2c2c">a random treated user out-spends</text><text x="495" y="303" text-anchor="middle" font-size="8.5" fill="#9b2c2c">a control user just 42% of the time</text></svg>