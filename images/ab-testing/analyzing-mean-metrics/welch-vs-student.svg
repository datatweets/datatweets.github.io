<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="320" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Unequal variances: Welch keeps you honest</text><rect x="40" y="58" width="280" height="70" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="180" y="80" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">Control: big group, tight spread</text><text x="180" y="98" text-anchor="middle" font-size="9" fill="#3182ce">n = 6,000 sd = $12.42</text><text x="180" y="115" text-anchor="middle" font-size="8.5" fill="#718096">|———•———|</text><rect x="380" y="58" width="280" height="70" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="520" y="80" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">Treatment: small group, wide spread</text><text x="520" y="98" text-anchor="middle" font-size="9" fill="#2f855a">n = 1,500 sd = $23.89</text><text x="520" y="115" text-anchor="middle" font-size="8.5" fill="#718096">|—————•—————|</text><rect x="60" y="160" width="270" height="110" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.9" /><text x="195" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#c53030">Student's t (pooled)</text><text x="195" y="205" text-anchor="middle" font-size="9" fill="#9b2c2c">assumes EQUAL variance — pools</text><text x="195" y="218" text-anchor="middle" font-size="9" fill="#9b2c2c">both groups' spread into one</text><text x="195" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">p = 0.0063</text><text x="195" y="258" text-anchor="middle" font-size="9" font-weight="700" fill="#c53030">"significant — ship it!" ✗</text><rect x="370" y="160" width="270" height="110" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.9" /><text x="505" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Welch's t (separate)</text><text x="505" y="205" text-anchor="middle" font-size="9" fill="#22543d">lets each group keep its OWN</text><text x="505" y="218" text-anchor="middle" font-size="9" fill="#22543d">variance — the safe default</text><text x="505" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">p = 0.0566</text><text x="505" y="258" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">"not significant — don't ship" ✓</text><text x="350" y="292" text-anchor="middle" font-size="9.5" fill="#4a5568">Same data. Pooling lets the big tight group mask the small noisy one, so Student under-counts the noise and over-claims.</text><text x="350" y="308" text-anchor="middle" font-size="9.5" fill="#718096">Welch makes no equal-variance assumption — use it by default (scipy: equal_var=False).</text></svg>