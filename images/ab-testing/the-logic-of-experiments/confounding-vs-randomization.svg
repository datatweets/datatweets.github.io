<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="330" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">A confounder fools observation; randomization breaks it</text><line x1="350" y1="56" x2="350" y2="300" stroke="#e2e8f0" stroke-width="1.5" /><text x="175" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">Observational (self-selected)</text><ellipse cx="175" cy="112" rx="60" ry="20" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="175" y="110" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">Motivation</text><text x="175" y="123" text-anchor="middle" font-size="8" fill="#805ad5">(hidden confounder)</text><line x1="140" y1="128" x2="95" y2="176" stroke="#9f7aea" stroke-width="1.8" /><polygon points="95 176 96 164 105 171" fill="#9f7aea" /><line x1="210" y1="128" x2="255" y2="176" stroke="#9f7aea" stroke-width="1.8" /><polygon points="255 176 245 171 254 164" fill="#9f7aea" /><rect x="45" y="178" width="100" height="42" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="95" y="199" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">Sees new page</text><text x="95" y="212" text-anchor="middle" font-size="8" fill="#2f855a">(chooses it)</text><rect x="205" y="178" width="100" height="42" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="255" y="199" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2b6cb0">Converts</text><line x1="145" y1="199" x2="203" y2="199" stroke="#cbd5e0" stroke-width="1.6" stroke-dasharray="4 3" /><text x="175" y="192" text-anchor="middle" font-size="8" fill="#a0aec0">spurious?</text><rect x="55" y="240" width="240" height="46" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.4" /><text x="175" y="259" text-anchor="middle" font-size="10" font-weight="700" fill="#c53030">Measured gap: 0.126</text><text x="175" y="275" text-anchor="middle" font-size="8.5" fill="#e53e3e">true effect is only 0.030 — mostly motivation</text><text x="525" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">Randomized (coin flip)</text><ellipse cx="525" cy="112" rx="60" ry="20" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="525" y="110" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">Motivation</text><text x="525" y="123" text-anchor="middle" font-size="8" fill="#805ad5">(still there)</text><circle cx="445" cy="188" r="20" fill="#fffaf0" stroke="#ed8936" stroke-width="1.7" /><text x="445" y="185" text-anchor="middle" font-size="8" font-weight="700" fill="#c05621">coin</text><text x="445" y="196" text-anchor="middle" font-size="8" font-weight="700" fill="#c05621">flip</text><line x1="490" y1="128" x2="462" y2="172" stroke="#e2e8f0" stroke-width="1.6" stroke-dasharray="3 3" /><line x1="470" y1="140" x2="482" y2="158" stroke="#e53e3e" stroke-width="1.8" /><line x1="482" y1="140" x2="470" y2="158" stroke="#e53e3e" stroke-width="1.8" /><line x1="465" y1="188" x2="505" y2="188" stroke="#ed8936" stroke-width="1.8" /><polygon points="505 188 495 183 495 193" fill="#ed8936" /><rect x="507" y="167" width="100" height="42" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="557" y="188" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">New page</text><text x="557" y="201" text-anchor="middle" font-size="8" fill="#2f855a">assigned at random</text><rect x="405" y="240" width="240" height="46" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="525" y="259" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">Measured gap: 0.030</text><text x="525" y="275" text-anchor="middle" font-size="8.5" fill="#2f855a">matches the true effect — motivation balanced 50/50</text><text x="350" y="312" text-anchor="middle" font-size="9.5" fill="#718096">Random assignment cuts the link from the confounder to the group, so the only systematic difference left is the change itself.</text></svg>