<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="300" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The A/B frame</text><rect x="30" y="118" width="110" height="60" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.6" /><text x="85" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">Users</text><text x="85" y="161" text-anchor="middle" font-size="8.5" fill="#718096">arriving at Lumen</text><line x1="140" y1="148" x2="180" y2="148" stroke="#a0aec0" stroke-width="2" /><polygon points="180 148 170 143 170 153" fill="#a0aec0" /><circle cx="205" cy="148" r="24" fill="#fffaf0" stroke="#ed8936" stroke-width="1.8" /><text x="205" y="145" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c05621">random</text><text x="205" y="157" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c05621">split</text><line x1="229" y1="136" x2="286" y2="96" stroke="#4299e1" stroke-width="1.8" /><polygon points="286 96 274 97 280 106" fill="#4299e1" /><line x1="229" y1="160" x2="286" y2="200" stroke="#48bb78" stroke-width="1.8" /><polygon points="286 200 280 190 274 199" fill="#48bb78" /><rect x="288" y="66" width="150" height="58" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.7" /><text x="363" y="89" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">Control (A)</text><text x="363" y="107" text-anchor="middle" font-size="8.5" fill="#3182ce">the current page</text><rect x="288" y="172" width="150" height="58" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.7" /><text x="363" y="195" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">Treatment (B)</text><text x="363" y="213" text-anchor="middle" font-size="8.5" fill="#2f855a">the new page</text><line x1="438" y1="95" x2="486" y2="130" stroke="#a0aec0" stroke-width="1.6" /><line x1="438" y1="201" x2="486" y2="166" stroke="#a0aec0" stroke-width="1.6" /><rect x="488" y="120" width="120" height="56" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.7" /><text x="548" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">Measure metric</text><text x="548" y="161" text-anchor="middle" font-size="8.5" fill="#805ad5">conversion rate</text><line x1="608" y1="148" x2="646" y2="148" stroke="#a0aec0" stroke-width="2" /><polygon points="646 148 636 143 636 153" fill="#a0aec0" /><text x="655" y="145" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4a5568">compare</text><text x="350" y="266" text-anchor="middle" font-size="10.5" fill="#4a5568">Split arriving users at random into two groups, change one thing for the treatment, and compare the same metric.</text><text x="350" y="286" text-anchor="middle" font-size="9.5" fill="#718096">Because assignment is random, the two groups start out the same — so a difference in the metric points to the change.</text></svg>