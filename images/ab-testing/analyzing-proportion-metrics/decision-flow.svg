<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="330" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">From result to decision: four checks, not one</text><rect x="40" y="60" width="180" height="60" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.7" /><text x="130" y="84" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">1. Significant?</text><text x="130" y="102" text-anchor="middle" font-size="8.5" fill="#3182ce">p &lt; α and CI excludes 0</text><rect x="260" y="60" width="180" height="60" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.7" /><text x="350" y="84" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">2. Big enough?</text><text x="350" y="102" text-anchor="middle" font-size="8.5" fill="#805ad5">effect ≥ MDE (worth it)</text><rect x="480" y="60" width="180" height="60" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.7" /><text x="570" y="84" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c05621">3. Guardrails OK?</text><text x="570" y="102" text-anchor="middle" font-size="8.5" fill="#9c4221">nothing critical regressed</text><line x1="220" y1="90" x2="258" y2="90" stroke="#a0aec0" stroke-width="1.8" /><polygon points="258 90 248 85 248 95" fill="#a0aec0" /><line x1="440" y1="90" x2="478" y2="90" stroke="#a0aec0" stroke-width="1.8" /><polygon points="478 90 468 85 468 95" fill="#a0aec0" /><line x1="350" y1="120" x2="350" y2="150" stroke="#48bb78" stroke-width="1.8" /><polygon points="350 150 345 140 355 140" fill="#48bb78" /><text x="392" y="140" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">all yes</text><rect x="250" y="152" width="200" height="46" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.9" /><text x="350" y="173" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">SHIP the change</text><text x="350" y="189" text-anchor="middle" font-size="8.5" fill="#2f855a">real, worthwhile, and safe</text><rect x="40" y="228" width="290" height="66" rx="9" fill="#fff5f5" stroke="#fc8181" stroke-width="1.4" /><text x="185" y="249" text-anchor="middle" font-size="10" font-weight="700" fill="#c53030">Not significant</text><text x="185" y="266" text-anchor="middle" font-size="8.5" fill="#9b2c2c">can't rule out chance — don't ship;</text><text x="185" y="279" text-anchor="middle" font-size="8.5" fill="#9b2c2c">iterate, or the test was underpowered</text><rect x="370" y="228" width="290" height="66" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" /><text x="515" y="249" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621">Significant but tiny / guardrail hit</text><text x="515" y="266" text-anchor="middle" font-size="8.5" fill="#9c4221">real but too small to matter, or it broke</text><text x="515" y="279" text-anchor="middle" font-size="8.5" fill="#9c4221">something important — usually don't ship</text><text x="350" y="316" text-anchor="middle" font-size="9.5" fill="#718096">Significance is necessary, not sufficient. A ship needs a real effect that's big enough and doesn't break a guardrail.</text></svg>