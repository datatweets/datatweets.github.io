<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="300" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">What a p-value is — and what it isn't</text><rect x="40" y="58" width="290" height="150" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.8" /><text x="185" y="82" text-anchor="middle" font-size="12.5" font-weight="700" fill="#276749">IT IS</text><text x="185" y="108" text-anchor="middle" font-size="10" fill="#22543d">the probability of seeing a</text><text x="185" y="124" text-anchor="middle" font-size="10" fill="#22543d">difference this large (or larger)</text><text x="185" y="140" text-anchor="middle" font-size="10" fill="#22543d"><tspan font-weight="700">IF the null were true</tspan></text><text x="185" y="166" text-anchor="middle" font-size="9" fill="#2f855a">small p → the data would be</text><text x="185" y="180" text-anchor="middle" font-size="9" fill="#2f855a">surprising if nothing changed</text><text x="185" y="196" text-anchor="middle" font-size="9" fill="#2f855a">→ evidence against the null</text><rect x="370" y="58" width="290" height="150" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.8" /><text x="515" y="82" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c53030">IT IS NOT</text><text x="515" y="106" text-anchor="middle" font-size="9.5" fill="#9b2c2c">✗ the probability the null is true</text><text x="515" y="126" text-anchor="middle" font-size="9.5" fill="#9b2c2c">✗ the probability you're wrong</text><text x="515" y="146" text-anchor="middle" font-size="9.5" fill="#9b2c2c">✗ the size or importance of the effect</text><text x="515" y="166" text-anchor="middle" font-size="9.5" fill="#9b2c2c">✗ "p=0.05" → 95% chance it's real</text><text x="515" y="192" text-anchor="middle" font-size="8.5" fill="#c53030">a tiny p can go with a tiny, useless effect</text><rect x="120" y="232" width="460" height="46" rx="9" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.3" /><text x="350" y="252" text-anchor="middle" font-size="10" font-weight="700" fill="#4a5568">p answers: "could noise alone produce this?" — not "how big is the effect?"</text><text x="350" y="269" text-anchor="middle" font-size="8.5" fill="#718096">for the size of the effect, you need the confidence interval (next lesson)</text></svg>