<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="300" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">A confidence interval shows the plausible effect size</text><text x="350" y="49" text-anchor="middle" font-size="10" fill="#718096">95% CI for the lift in Lumen's signup conversion (treatment − control)</text><line x1="80" y1="150" x2="640" y2="150" stroke="#a0aec0" stroke-width="1.5" /><line x1="150" y1="145" x2="150" y2="230" stroke="#cbd5e0" stroke-width="1.4" stroke-dasharray="4 3" /><text x="150" y="246" text-anchor="middle" font-size="9" font-weight="700" fill="#718096">0 (no effect)</text><text x="50" y="154" text-anchor="middle" font-size="8.5" fill="#a0aec0">−1pt</text><text x="250" y="170" text-anchor="middle" font-size="8.5" fill="#a0aec0">+1pt</text><text x="350" y="170" text-anchor="middle" font-size="8.5" fill="#a0aec0">+2pt</text><text x="450" y="170" text-anchor="middle" font-size="8.5" fill="#a0aec0">+3pt</text><line x1="247" y1="110" x2="493" y2="110" stroke="#4299e1" stroke-width="3" /><line x1="247" y1="98" x2="247" y2="122" stroke="#4299e1" stroke-width="3" /><line x1="493" y1="98" x2="493" y2="122" stroke="#4299e1" stroke-width="3" /><circle cx="370" cy="110" r="6" fill="#2b6cb0" /><text x="370" y="92" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">+2.20 pts (observed)</text><text x="247" y="138" text-anchor="middle" font-size="9" fill="#3182ce">+0.97</text><text x="493" y="138" text-anchor="middle" font-size="9" fill="#3182ce">+3.43</text><rect x="120" y="196" width="230" height="40" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.3" /><text x="235" y="214" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">whole interval is above 0</text><text x="235" y="228" text-anchor="middle" font-size="8.5" fill="#2f855a">⇒ significant at 5% (matches p&lt;0.05)</text><rect x="380" y="196" width="250" height="40" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.2" /><text x="505" y="214" text-anchor="middle" font-size="9" font-weight="700" fill="#4a5568">plausible lift: ~1 to ~3.4 points</text><text x="505" y="228" text-anchor="middle" font-size="8.5" fill="#718096">not just "real" — how big, with uncertainty</text><text x="350" y="278" text-anchor="middle" font-size="9.5" fill="#718096">The p-value says the effect is real; the interval says how large it plausibly is — the two agree by construction.</text></svg>