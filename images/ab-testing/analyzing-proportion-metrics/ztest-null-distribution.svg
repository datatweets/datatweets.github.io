<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="330" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The z-test: how surprising is this difference under the null?</text><text x="350" y="49" text-anchor="middle" font-size="10" fill="#718096">the bell is where the observed difference would fall if the change did nothing</text><line x1="70" y1="250" x2="630" y2="250" stroke="#a0aec0" stroke-width="1.5" /><text x="350" y="250" text-anchor="middle" font-size="0" fill="#000" /><text x="310" y="268" text-anchor="middle" font-size="9" fill="#718096">0</text><text x="248" y="268" text-anchor="middle" font-size="8.5" fill="#a0aec0">−1</text><text x="372" y="268" text-anchor="middle" font-size="8.5" fill="#a0aec0">+1</text><text x="434" y="268" text-anchor="middle" font-size="8.5" fill="#a0aec0">+2</text><text x="496" y="268" text-anchor="middle" font-size="8.5" fill="#a0aec0">+3</text><text x="310" y="284" text-anchor="middle" font-size="9" fill="#4a5568">z (difference in standard errors)</text><path d="M130 250C210 250 250 90 310 90C370 90 410 250 490 250" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" /><text x="310" y="120" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">null: no effect</text><text x="310" y="135" text-anchor="middle" font-size="8.5" fill="#3182ce">differences cluster near 0</text><line x1="526" y1="250" x2="526" y2="120" stroke="#e53e3e" stroke-width="2.2" /><circle cx="526" cy="120" r="4" fill="#e53e3e" /><text x="526" y="110" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c53030">observed</text><text x="526" y="98" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">z = 3.49</text><path d="M526 250C545 250 555 235 565 250Z" fill="#fc8181" /><text x="590" y="205" text-anchor="middle" font-size="9" fill="#c53030">p = 0.0005</text><line x1="575" y1="210" x2="535" y2="242" stroke="#fc8181" stroke-width="1" /><rect x="120" y="298" width="460" height="24" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1.2" /><text x="350" y="314" text-anchor="middle" font-size="9.5" fill="#276749">A difference 3.49 SEs out would almost never happen by chance — so we reject "no effect."</text></svg>