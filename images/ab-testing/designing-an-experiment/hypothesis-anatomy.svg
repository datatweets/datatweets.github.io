<svg xmlns="http://www.w3.org/2000/svg" width="700" height="310" viewBox="0 0 700 310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="310" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">From a vague goal to a testable hypothesis</text><rect x="60" y="58" width="580" height="44" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" /><text x="80" y="80" font-size="10" font-weight="700" fill="#c53030">Vague goal</text><text x="80" y="95" font-size="10.5" fill="#9b2c2c" font-style="italic">"Make Lumen's signups better."</text><text x="620" y="88" text-anchor="end" font-size="9" fill="#c53030">not testable — what, how much, measured how?</text><text x="350" y="120" text-anchor="middle" font-size="12" fill="#a0aec0">↓  sharpen</text><rect x="60" y="128" width="580" height="52" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.7" /><text x="80" y="150" font-size="10" font-weight="700" fill="#276749">Testable hypothesis</text><text x="80" y="168" font-size="11" fill="#22543d">"The new signup page <tspan font-weight="700">increases</tspan> signup <tspan font-weight="700">conversion rate</tspan> by <tspan font-weight="700">at least 2 points</tspan>."</text><rect x="60" y="204" width="180" height="70" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="150" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">Specific</text><text x="150" y="245" text-anchor="middle" font-size="8.5" fill="#3182ce">one change, one</text><text x="150" y="257" text-anchor="middle" font-size="8.5" fill="#3182ce">named metric</text><rect x="260" y="204" width="180" height="70" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="350" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">Directional</text><text x="350" y="245" text-anchor="middle" font-size="8.5" fill="#805ad5">predicts which way</text><text x="350" y="257" text-anchor="middle" font-size="8.5" fill="#805ad5">and by how much</text><rect x="460" y="204" width="180" height="70" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" /><text x="550" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">Falsifiable</text><text x="550" y="245" text-anchor="middle" font-size="8.5" fill="#9c4221">data could prove</text><text x="550" y="257" text-anchor="middle" font-size="8.5" fill="#9c4221">it wrong</text><line x1="150" y1="180" x2="150" y2="204" stroke="#cbd5e0" stroke-width="1.2" /><line x1="350" y1="180" x2="350" y2="204" stroke="#cbd5e0" stroke-width="1.2" /><line x1="550" y1="180" x2="550" y2="204" stroke="#cbd5e0" stroke-width="1.2" /><text x="350" y="298" text-anchor="middle" font-size="9.5" fill="#718096">A good hypothesis names the change, the metric, the direction, and a threshold — so the experiment can actually answer it.</text></svg>