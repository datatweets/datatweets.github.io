<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="320" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">One primary metric, guarded and put in context</text><rect x="180" y="56" width="340" height="66" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2.2" /><text x="350" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">Primary metric</text><text x="350" y="99" text-anchor="middle" font-size="9.5" fill="#2f855a">free-to-paid upgrade rate — the decision hinges on this</text><text x="350" y="113" text-anchor="middle" font-size="8.5" fill="#718096">exactly one, chosen before the test</text><rect x="60" y="160" width="260" height="86" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.7" /><text x="190" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">Guardrail metrics</text><text x="190" y="201" text-anchor="middle" font-size="8.5" fill="#9c4221">must NOT get worse, even if</text><text x="190" y="213" text-anchor="middle" font-size="8.5" fill="#9c4221">the primary improves</text><text x="190" y="231" text-anchor="middle" font-size="8.5" fill="#7b341e">refund rate · support-ticket rate</text><rect x="380" y="160" width="260" height="86" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.7" /><text x="510" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Secondary metric</text><text x="510" y="201" text-anchor="middle" font-size="8.5" fill="#3182ce">context &amp; explanation, but</text><text x="510" y="213" text-anchor="middle" font-size="8.5" fill="#3182ce">doesn't drive the decision</text><text x="510" y="231" text-anchor="middle" font-size="8.5" fill="#2c5282">ARPU (average revenue per user)</text><line x1="300" y1="122" x2="200" y2="160" stroke="#cbd5e0" stroke-width="1.4" /><line x1="400" y1="122" x2="490" y2="160" stroke="#cbd5e0" stroke-width="1.4" /><rect x="150" y="266" width="400" height="42" rx="9" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.3" /><text x="350" y="285" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4a5568">Ship only if the primary wins AND no guardrail regresses</text><text x="350" y="300" text-anchor="middle" font-size="8.5" fill="#718096">one number to decide, a few to protect, the rest to understand</text></svg>
