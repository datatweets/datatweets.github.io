<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="300" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">What do you randomize? Pick the right unit</text><rect x="40" y="60" width="195" height="180" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.8" /><text x="137" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">By user</text><circle cx="90" cy="118" r="13" fill="#48bb78" /><text x="90" y="150" text-anchor="middle" font-size="8" fill="#2f855a">every visit</text><circle cx="137" cy="118" r="13" fill="#48bb78" /><text x="137" y="150" text-anchor="middle" font-size="8" fill="#2f855a">same group</text><circle cx="184" cy="118" r="13" fill="#48bb78" /><text x="137" y="188" text-anchor="middle" font-size="8.5" fill="#276749">consistent experience</text><text x="137" y="203" text-anchor="middle" font-size="8.5" fill="#276749">across sessions</text><text x="137" y="224" text-anchor="middle" font-size="9" font-weight="700" fill="#2f855a">the default</text><rect x="252" y="60" width="195" height="180" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.8" /><text x="349" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">By session</text><circle cx="315" cy="118" r="13" fill="#ed8936" /><circle cx="349" cy="118" r="13" fill="#4299e1" /><circle cx="383" cy="118" r="13" fill="#ed8936" /><text x="349" y="150" text-anchor="middle" font-size="8" fill="#9c4221">same user, different groups</text><text x="349" y="188" text-anchor="middle" font-size="8.5" fill="#9c4221">one person may see BOTH</text><text x="349" y="203" text-anchor="middle" font-size="8.5" fill="#9c4221">versions — use with care</text><text x="349" y="224" text-anchor="middle" font-size="9" font-weight="700" fill="#c05621">risks inconsistency</text><rect x="464" y="60" width="196" height="180" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.8" /><text x="562" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">By cluster</text><ellipse cx="530" cy="120" rx="26" ry="18" fill="none" stroke="#4299e1" stroke-width="1.4" /><circle cx="521" cy="118" r="7" fill="#4299e1" /><circle cx="539" cy="118" r="7" fill="#4299e1" /><ellipse cx="596" cy="120" rx="26" ry="18" fill="none" stroke="#48bb78" stroke-width="1.4" /><circle cx="587" cy="118" r="7" fill="#48bb78" /><circle cx="605" cy="118" r="7" fill="#48bb78" /><text x="562" y="160" text-anchor="middle" font-size="8" fill="#3182ce">whole groups assigned together</text><text x="562" y="188" text-anchor="middle" font-size="8.5" fill="#2c5282">when users interact / spill over</text><text x="562" y="203" text-anchor="middle" font-size="8.5" fill="#2c5282">(classrooms, cities, teams)</text><text x="562" y="224" text-anchor="middle" font-size="9" font-weight="700" fill="#2b6cb0">avoids interference</text><text x="350" y="270" text-anchor="middle" font-size="10" fill="#4a5568">Randomize by user by default; go to clusters when users influence each other, so treatment can't leak between groups.</text><text x="350" y="288" text-anchor="middle" font-size="9" fill="#718096">The unit must give each subject a consistent experience and keep the two groups independent.</text></svg>