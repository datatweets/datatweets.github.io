<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="320" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Smaller effects cost more data</text><text x="350" y="49" text-anchor="middle" font-size="10.5" fill="#718096">users per arm to detect a lift over a 10% baseline (80% power, 5% level)</text><line x1="90" y1="250" x2="640" y2="250" stroke="#a0aec0" stroke-width="1.5" /><line x1="90" y1="80" x2="90" y2="250" stroke="#a0aec0" stroke-width="1.5" /><text x="365" y="292" text-anchor="middle" font-size="10" fill="#4a5568">minimum detectable effect (absolute)</text><text x="46" y="165" text-anchor="middle" font-size="10" fill="#4a5568" transform="rotate(-90 46 165)">users per arm</text><rect x="150" y="231" width="90" height="19" rx="3" fill="#48bb78" /><text x="195" y="224" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">1,772</text><text x="195" y="267" text-anchor="middle" font-size="9.5" fill="#4a5568">+3 pts</text><text x="195" y="279" text-anchor="middle" font-size="8" fill="#718096">(+30% rel)</text><rect x="320" y="208" width="90" height="42" rx="3" fill="#ed8936" /><text x="365" y="201" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621">3,839</text><text x="365" y="267" text-anchor="middle" font-size="9.5" fill="#4a5568">+2 pts</text><text x="365" y="279" text-anchor="middle" font-size="8" fill="#718096">(+20% rel)</text><rect x="490" y="90" width="90" height="160" rx="3" fill="#e53e3e" /><text x="535" y="83" text-anchor="middle" font-size="10" font-weight="700" fill="#c53030">14,749</text><text x="535" y="267" text-anchor="middle" font-size="9.5" fill="#4a5568">+1 pt</text><text x="535" y="279" text-anchor="middle" font-size="8" fill="#718096">(+10% rel)</text><text x="350" y="308" text-anchor="middle" font-size="9.5" fill="#718096">Halving the effect you want to detect roughly quadruples the sample size — MDE is the biggest lever on cost.</text></svg>