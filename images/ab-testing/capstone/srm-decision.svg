<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="340" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The sample ratio mismatch check</text><text x="350" y="49" text-anchor="middle" font-size="10" fill="#718096">is the uneven split fair chance, or a broken assignment pipeline?</text><rect x="70" y="70" width="255" height="66" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.7" /><text x="197" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">Observed split</text><text x="197" y="112" text-anchor="middle" font-size="9" fill="#3182ce">control 3,328 &#183; treatment 3,460</text><text x="197" y="126" text-anchor="middle" font-size="8" fill="#718096">a gap of 132 users</text><rect x="375" y="70" width="255" height="66" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.7" /><text x="502" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">Expected if fair</text><text x="502" y="112" text-anchor="middle" font-size="9" fill="#4a5568">3,394 &#183; 3,394</text><text x="502" y="126" text-anchor="middle" font-size="8" fill="#718096">a true 50/50 coin flip</text><line x1="197" y1="136" x2="330" y2="168" stroke="#a0aec0" stroke-width="1.6" /><line x1="502" y1="136" x2="370" y2="168" stroke="#a0aec0" stroke-width="1.6" /><rect x="240" y="170" width="220" height="60" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.7" /><text x="350" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">Chi-square goodness-of-fit</text><text x="350" y="211" text-anchor="middle" font-size="10" fill="#9c4221">observed vs fair split &#8594; <tspan font-weight="700">p = 0.109</tspan></text><line x1="350" y1="230" x2="350" y2="252" stroke="#a0aec0" stroke-width="1.8" /><polygon points="350 252 345 243 355 243" fill="#a0aec0" /><rect x="235" y="252" width="230" height="26" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.2" /><text x="350" y="269" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4a5568">compare p to the strict SRM alarm at ~0.001</text><line x1="270" y1="278" x2="150" y2="298" stroke="#a0aec0" stroke-width="1.6" /><line x1="430" y1="278" x2="550" y2="298" stroke="#a0aec0" stroke-width="1.6" /><rect x="35" y="298" width="230" height="34" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="150" y="313" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">p above ~0.001: split is fair</text><text x="150" y="326" text-anchor="middle" font-size="8.5" fill="#2f855a">analyze the experiment</text><rect x="435" y="298" width="230" height="34" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.4" /><text x="550" y="313" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">p below ~0.001: alarm fires</text><text x="550" y="326" text-anchor="middle" font-size="8.5" fill="#e53e3e">stop and fix the assignment pipeline</text><text x="350" y="317" text-anchor="middle" font-size="8.5" fill="#718096">here: 0.109</text><text x="350" y="329" text-anchor="middle" font-size="8.5" fill="#718096">&#8594; analyze</text></svg>
