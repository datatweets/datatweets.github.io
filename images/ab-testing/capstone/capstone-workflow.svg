<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="300" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">One experiment, end to end</text><text x="350" y="49" text-anchor="middle" font-size="10" fill="#718096">the whole course, in the order a real experiment runs</text><rect x="30" y="90" width="118" height="70" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.7" /><text x="89" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">1. Design</text><text x="89" y="132" text-anchor="middle" font-size="8" fill="#3182ce">hypothesis, metrics,</text><text x="89" y="143" text-anchor="middle" font-size="8" fill="#3182ce">sample size</text><text x="89" y="156" text-anchor="middle" font-size="7.5" fill="#718096">M2 · M3</text><rect x="167" y="90" width="118" height="70" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.7" /><text x="226" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">2. Run</text><text x="226" y="132" text-anchor="middle" font-size="8" fill="#805ad5">assign 50/50,</text><text x="226" y="143" text-anchor="middle" font-size="8" fill="#805ad5">collect outcomes</text><text x="226" y="156" text-anchor="middle" font-size="7.5" fill="#718096">M1</text><rect x="304" y="90" width="118" height="70" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.7" /><text x="363" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">3. Validate</text><text x="363" y="132" text-anchor="middle" font-size="8" fill="#9c4221">SRM &amp; sanity</text><text x="363" y="143" text-anchor="middle" font-size="8" fill="#9c4221">checks first</text><text x="363" y="156" text-anchor="middle" font-size="7.5" fill="#718096">M6</text><rect x="441" y="90" width="118" height="70" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.7" /><text x="500" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">4. Analyze</text><text x="500" y="132" text-anchor="middle" font-size="8" fill="#2f855a">z-test, CI,</text><text x="500" y="143" text-anchor="middle" font-size="8" fill="#2f855a">Bayesian</text><text x="500" y="156" text-anchor="middle" font-size="7.5" fill="#718096">M4 · M7</text><rect x="578" y="90" width="94" height="70" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" /><text x="625" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">5. Decide</text><text x="625" y="132" text-anchor="middle" font-size="8" fill="#3182ce">the readout</text><text x="625" y="143" text-anchor="middle" font-size="8" fill="#3182ce">&amp; ship call</text><text x="625" y="156" text-anchor="middle" font-size="7.5" fill="#718096">M4-M7</text><line x1="148" y1="125" x2="165" y2="125" stroke="#a0aec0" stroke-width="1.8" /><polygon points="165 125 156 120 156 130" fill="#a0aec0" /><line x1="285" y1="125" x2="302" y2="125" stroke="#a0aec0" stroke-width="1.8" /><polygon points="302 125 293 120 293 130" fill="#a0aec0" /><line x1="422" y1="125" x2="439" y2="125" stroke="#a0aec0" stroke-width="1.8" /><polygon points="439 125 430 120 430 130" fill="#a0aec0" /><line x1="559" y1="125" x2="576" y2="125" stroke="#a0aec0" stroke-width="1.8" /><polygon points="576 125 567 120 567 130" fill="#a0aec0" /><rect x="70" y="196" width="560" height="64" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.3" /><text x="350" y="218" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">The brief: does a new onboarding checklist lift Lumen's 7-day activation rate?</text><text x="350" y="238" text-anchor="middle" font-size="9" fill="#4a5568">baseline 25% · smallest lift worth shipping +3 points · 3,394 users per arm</text><text x="350" y="253" text-anchor="middle" font-size="8.5" fill="#718096">Everything you learned, applied once, in sequence — validity before the p-value, decision at the end.</text></svg>