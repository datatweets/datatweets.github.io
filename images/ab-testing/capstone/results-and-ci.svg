<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="300" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The result: a real, significant activation lift</text><text x="350" y="49" text-anchor="middle" font-size="10" fill="#718096">7-day activation rate, new onboarding checklist vs current</text><text x="120" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">Control</text><rect x="70" y="94" width="100" height="26" rx="4" fill="#bee3f8" /><rect x="70" y="94" width="100" height="26" rx="4" fill="none" stroke="#4299e1" /><text x="120" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">25.00%</text><text x="120" y="134" text-anchor="middle" font-size="8" fill="#718096">832 / 3,328</text><text x="120" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">Treatment</text><rect x="70" y="172" width="113" height="26" rx="4" fill="#c6f6d5" /><rect x="70" y="172" width="113" height="26" rx="4" fill="none" stroke="#48bb78" /><text x="126" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">28.32%</text><text x="126" y="212" text-anchor="middle" font-size="8" fill="#718096">980 / 3,460</text><text x="440" y="86" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4a5568">95% confidence interval for the lift</text><line x1="290" y1="150" x2="620" y2="150" stroke="#a0aec0" stroke-width="1.4" /><line x1="320" y1="140" x2="320" y2="210" stroke="#e53e3e" stroke-width="1.4" stroke-dasharray="4 3" /><text x="320" y="224" text-anchor="middle" font-size="8" font-weight="700" fill="#c53030">0</text><text x="420" y="168" text-anchor="middle" font-size="7.5" fill="#a0aec0">+2</text><text x="520" y="168" text-anchor="middle" font-size="7.5" fill="#a0aec0">+4</text><text x="600" y="168" text-anchor="middle" font-size="7.5" fill="#a0aec0">+5.4</text><line x1="470" y1="140" x2="470" y2="162" stroke="#9f7aea" stroke-width="1.4" stroke-dasharray="3 2" /><text x="470" y="134" text-anchor="middle" font-size="7.5" fill="#6b46c1">MDE +3</text><line x1="381" y1="130" x2="592" y2="130" stroke="#48bb78" stroke-width="3" /><line x1="381" y1="120" x2="381" y2="140" stroke="#48bb78" stroke-width="3" /><line x1="592" y1="120" x2="592" y2="140" stroke="#48bb78" stroke-width="3" /><circle cx="486" cy="130" r="5.5" fill="#276749" /><text x="486" y="114" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">+3.32 pts</text><text x="381" y="198" text-anchor="middle" font-size="8" fill="#2f855a">+1.22</text><text x="592" y="198" text-anchor="middle" font-size="8" fill="#2f855a">+5.43</text><rect x="290" y="236" width="340" height="46" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.3" /><text x="460" y="256" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">z = 3.10 p = 0.0020 — the whole interval is above 0</text><text x="460" y="272" text-anchor="middle" font-size="8.5" fill="#2f855a">significant, and the best estimate clears the +3-point bar that made it worth testing</text><text x="130" y="250" text-anchor="middle" font-size="9" fill="#718096">a clean, real</text><text x="130" y="262" text-anchor="middle" font-size="9" fill="#718096">+3.3 point lift</text></svg>