<svg xmlns="http://www.w3.org/2000/svg" width="700" height="310" viewBox="0 0 700 310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="310" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The decision scorecard</text><text x="350" y="49" text-anchor="middle" font-size="10" fill="#718096">every check passes — the readout says ship</text><g><rect x="80" y="68" width="540" height="36" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.3" /><circle cx="104" cy="86" r="9" fill="#48bb78" /><text x="104" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">✓</text><text x="126" y="83" font-size="10" font-weight="700" fill="#276749">Valid?</text><text x="126" y="96" font-size="8.5" fill="#4a5568">SRM p = 0.109 — the 50/50 split is within chance, experiment is trustworthy</text><rect x="80" y="110" width="540" height="36" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.3" /><circle cx="104" cy="128" r="9" fill="#48bb78" /><text x="104" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">✓</text><text x="126" y="125" font-size="10" font-weight="700" fill="#276749">Statistically significant?</text><text x="126" y="138" font-size="8.5" fill="#4a5568">p = 0.0020 and the 95% CI [+1.22, +5.43] excludes 0</text><rect x="80" y="152" width="540" height="36" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.3" /><circle cx="104" cy="170" r="9" fill="#48bb78" /><text x="104" y="174" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">✓</text><text x="126" y="167" font-size="10" font-weight="700" fill="#276749">Practically meaningful?</text><text x="126" y="180" font-size="8.5" fill="#4a5568">observed +3.32 pts beats the +3-point MDE set at design time</text><rect x="80" y="194" width="540" height="36" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.3" /><circle cx="104" cy="212" r="9" fill="#48bb78" /><text x="104" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">✓</text><text x="126" y="209" font-size="10" font-weight="700" fill="#276749">Second opinion agrees?</text><text x="126" y="222" font-size="8.5" fill="#4a5568">Bayesian P(treatment &gt; control) = 99.9%, credible interval matches</text><rect x="80" y="236" width="540" height="36" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.3" /><circle cx="104" cy="254" r="9" fill="#48bb78" /><text x="104" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">✓</text><text x="126" y="251" font-size="10" font-weight="700" fill="#276749">Guardrails held?</text><text x="126" y="264" font-size="8.5" fill="#4a5568">no regression in support tickets or 30-day retention</text></g><rect x="250" y="282" width="200" height="24" rx="12" fill="#276749" /><text x="350" y="299" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">VERDICT: SHIP IT</text></svg>