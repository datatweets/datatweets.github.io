<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="300" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Sample ratio mismatch: is the split actually 50/50?</text><text x="350" y="49" text-anchor="middle" font-size="10" fill="#718096">a chi-squared check on the group sizes — run it before you trust anything else</text><rect x="50" y="72" width="290" height="150" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.8" /><text x="195" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Healthy split</text><rect x="80" y="112" width="110" height="24" rx="4" fill="#4299e1" /><text x="135" y="129" text-anchor="middle" font-size="9" fill="#fff">4,988</text><rect x="200" y="112" width="111" height="24" rx="4" fill="#48bb78" /><text x="255" y="129" text-anchor="middle" font-size="9" fill="#fff">5,012</text><text x="195" y="158" text-anchor="middle" font-size="9" fill="#2f855a">expected 5,000 / 5,000</text><text x="195" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">SRM p = 0.81</text><text x="195" y="202" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">✓ OK — just chance wobble</text><rect x="360" y="72" width="290" height="150" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.8" /><text x="505" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#c53030">Broken split</text><rect x="390" y="112" width="125" height="24" rx="4" fill="#4299e1" /><text x="452" y="129" text-anchor="middle" font-size="9" fill="#fff">5,200</text><rect x="525" y="112" width="96" height="24" rx="4" fill="#48bb78" /><text x="573" y="129" text-anchor="middle" font-size="9" fill="#fff">4,800</text><text x="505" y="158" text-anchor="middle" font-size="9" fill="#9b2c2c">looks like a harmless 52/48 …</text><text x="505" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">SRM p = 0.00006</text><text x="505" y="202" text-anchor="middle" font-size="9" font-weight="700" fill="#c53030">✗ FAIL — the pipeline is broken</text><rect x="120" y="240" width="460" height="46" rx="9" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.3" /><text x="350" y="260" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4a5568">A failed SRM invalidates the whole experiment — don't analyze it, fix it</text><text x="350" y="276" text-anchor="middle" font-size="8.5" fill="#718096">a 52/48 split over 10,000 users is astronomically unlikely by chance: something is dropping or misassigning users</text></svg>