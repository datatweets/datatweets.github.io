<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="330" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Simpson's paradox: loses in every segment, wins overall</text><text x="250" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">Control</text><text x="420" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Treatment</text><text x="560" y="66" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4a5568">winner</text><text x="120" y="98" text-anchor="middle" font-size="10" font-weight="700" fill="#4a5568">New users</text><rect x="200" y="82" width="100" height="26" rx="5" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.2" /><text x="250" y="99" text-anchor="middle" font-size="9" fill="#2b6cb0">200/2000 = 10.0%</text><rect x="370" y="82" width="100" height="26" rx="5" fill="#f0fff4" stroke="#48bb78" stroke-width="1.2" /><text x="420" y="99" text-anchor="middle" font-size="9" fill="#276749">90/1000 = 9.0%</text><text x="560" y="99" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2b6cb0">Control</text><text x="120" y="140" text-anchor="middle" font-size="10" font-weight="700" fill="#4a5568">Returning</text><rect x="200" y="124" width="100" height="26" rx="5" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.2" /><text x="250" y="141" text-anchor="middle" font-size="9" fill="#2b6cb0">300/1000 = 30.0%</text><rect x="370" y="124" width="100" height="26" rx="5" fill="#f0fff4" stroke="#48bb78" stroke-width="1.2" /><text x="420" y="141" text-anchor="middle" font-size="9" fill="#276749">570/2000 = 28.5%</text><text x="560" y="141" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2b6cb0">Control</text><line x1="90" y1="166" x2="620" y2="166" stroke="#cbd5e0" stroke-width="1.2" /><text x="120" y="196" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a202c">OVERALL</text><rect x="200" y="180" width="100" height="26" rx="5" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="250" y="197" text-anchor="middle" font-size="9" font-weight="700" fill="#2b6cb0">500/3000 = 16.7%</text><rect x="370" y="180" width="100" height="26" rx="5" fill="#f0fff4" stroke="#48bb78" stroke-width="1.9" /><text x="420" y="197" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">660/3000 = 22.0%</text><text x="560" y="197" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">Treatment!</text><rect x="90" y="226" width="520" height="66" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" /><text x="350" y="248" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621">The trick: the segment MIX differs between arms</text><text x="350" y="266" text-anchor="middle" font-size="8.8" fill="#9c4221">Treatment got mostly high-converting returning users (2000 vs 1000); control got mostly new users.</text><text x="350" y="280" text-anchor="middle" font-size="8.8" fill="#9c4221">The favorable mix lifts treatment's average even though it's worse with every kind of user.</text><text x="350" y="312" text-anchor="middle" font-size="9.5" fill="#718096">A mix imbalance like this shouldn't happen under clean randomization — when it does, suspect a broken split (SRM).</text></svg>