<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="320" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Peeking turns a 5% error rate into 19%</text><text x="350" y="49" text-anchor="middle" font-size="10" fill="#718096">40,000 A/A experiments (no real effect), checked at 10 points as data arrives</text><line x1="90" y1="240" x2="620" y2="240" stroke="#a0aec0" stroke-width="1.3" /><text x="355" y="258" text-anchor="middle" font-size="9" fill="#4a5568">checkpoints over time →</text><line x1="90" y1="150" x2="620" y2="150" stroke="#e53e3e" stroke-width="1.4" stroke-dasharray="5 3" /><text x="628" y="153" font-size="9" font-weight="700" fill="#c53030">p=0.05</text><text x="96" y="90" font-size="9" fill="#718096">p-value</text><polyline points="110 110 160 135 210 120 260 165 310 145 360 175 410 140 460 90 510 120 560 160 610 130" fill="none" stroke="#4299e1" stroke-width="2" /><circle cx="460" cy="90" r="0" /><line x1="310" y1="145" x2="360" y2="175" stroke="#48bb78" stroke-width="2" /><circle cx="360" cy="175" r="5" fill="#48bb78" /><text x="360" y="196" text-anchor="middle" font-size="8.5" font-weight="700" fill="#276749">crossed 0.05!</text><text x="360" y="207" text-anchor="middle" font-size="8" fill="#2f855a">stop &amp; declare a winner</text><rect x="120" y="272" width="240" height="38" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.3" /><text x="240" y="289" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">One honest look at the end: 5.1%</text><text x="240" y="302" text-anchor="middle" font-size="8" fill="#718096">the false-positive rate you signed up for</text><rect x="380" y="272" width="240" height="38" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.3" /><text x="500" y="289" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">Stop at the first dip: 19.0%</text><text x="500" y="302" text-anchor="middle" font-size="8" fill="#9b2c2c">nearly 4x more false winners</text><text x="350" y="80" text-anchor="middle" font-size="9.5" fill="#718096">A wandering p-value will dip under 0.05 by chance eventually — watch long enough and noise looks like signal.</text></svg>