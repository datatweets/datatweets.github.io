<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="660" height="420" fill="#ffffff" /><text x="40" y="44" font-size="21" font-weight="700" fill="#1e293b">The best-fit line minimizes squared error</text><line x1="70" y1="350" x2="610" y2="350" stroke="#cbd5e1" stroke-width="1.5" /><line x1="70" y1="80" x2="70" y2="350" stroke="#cbd5e1" stroke-width="1.5" /><text x="340" y="392" font-size="13" fill="#64748b" text-anchor="middle">Feature (x)</text><text x="30" y="215" font-size="13" fill="#64748b" text-anchor="middle" transform="rotate(-90 30 215)">Target (y)</text><line x1="90" y1="312" x2="590" y2="120" stroke="#d97706" stroke-width="3" /><text x="470" y="150" font-size="13" font-weight="700" fill="#d97706">best-fit line</text><g><line x1="150" y1="250" x2="150" y2="288" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3" /><circle cx="150" cy="250" r="6" fill="#2563eb" /><line x1="240" y1="254" x2="240" y2="300" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3" /><circle cx="240" cy="300" r="6" fill="#2563eb" /><line x1="330" y1="180" x2="330" y2="219" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3" /><circle cx="330" cy="180" r="6" fill="#2563eb" /><line x1="420" y1="185" x2="420" y2="225" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3" /><circle cx="420" cy="225" r="6" fill="#2563eb" /><line x1="510" y1="120" x2="510" y2="150" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3" /><circle cx="510" cy="120" r="6" fill="#2563eb" /></g><text x="252" y="285" font-size="12.5" font-weight="700" fill="#475569">residual</text><text x="40" y="412" font-size="12.5" fill="#64748b">Each dashed line is a residual (actual − predicted). The line is chosen to make the sum of their squares as small as possible.</text></svg>