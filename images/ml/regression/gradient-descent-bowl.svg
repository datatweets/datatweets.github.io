<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="660" height="420" fill="#ffffff" /><text x="40" y="44" font-size="21" font-weight="700" fill="#1e293b">Gradient descent walks downhill to the minimum</text><line x1="70" y1="360" x2="610" y2="360" stroke="#cbd5e1" stroke-width="1.5" /><line x1="70" y1="80" x2="70" y2="360" stroke="#cbd5e1" stroke-width="1.5" /><text x="340" y="398" font-size="13" fill="#64748b" text-anchor="middle">Parameter value (weight)</text><text x="30" y="220" font-size="13" fill="#64748b" text-anchor="middle" transform="rotate(-90 30 220)">Cost (error)</text><path d="M100 110Q340 470 580 110" fill="none" stroke="#2563eb" stroke-width="3" /><text x="500" y="150" font-size="13" font-weight="700" fill="#2563eb">cost curve</text><g fill="#d97706"><circle cx="150" cy="195" r="7" /><circle cx="206" cy="248" r="7" /><circle cx="262" cy="278" r="7" /><circle cx="340" cy="290" r="8" /></g><g stroke="#d97706" stroke-width="2.2" fill="none"><path d="M158 201L198 242" marker-end="url(#a)" /><path d="M214 254L254 273" marker-end="url(#a)" /><path d="M271 281L330 288" marker-end="url(#a)" /></g><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706" /></marker></defs><text x="120" y="180" font-size="12.5" font-weight="700" fill="#92400e">start</text><text x="348" y="285" font-size="12.5" font-weight="700" fill="#16a34a">minimum (best fit)</text><text x="40" y="412" font-size="12.5" fill="#64748b">Each step moves the parameter in the direction that lowers the cost. The step size is the learning rate.</text></svg>