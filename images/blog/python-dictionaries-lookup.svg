<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">List lookup by position versus dictionary lookup by key</title><desc id="desc">Diagram contrasting list lookup by numeric position with dictionary lookup by named key: a list shows index 0, 1, 2 pointing at values, while a dictionary shows keys title, author, and copies each pointing directly at their own value.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="300" y="66" font-size="30" font-weight="600" fill="#59636e" text-anchor="middle">LIST — lookup by POSITION</text><text x="900" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">DICT — lookup by KEY</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24"><rect x="140" y="120" width="60" height="56" rx="10" fill="#e3f0fa" stroke="#d0d5db" stroke-width="3" /><text x="170" y="106" font-size="20" fill="#59636e" text-anchor="middle">0</text><text x="170" y="155" fill="#1b1f24" text-anchor="middle">"Dune"</text><rect x="140" y="120" width="220" height="56" rx="10" fill="none" stroke="#d0d5db" stroke-width="3" /><text x="290" y="155" fill="#1b1f24" text-anchor="middle" /><rect x="140" y="200" width="60" height="56" rx="10" fill="#e6f4e6" stroke="#d0d5db" stroke-width="3" /><text x="170" y="186" font-size="20" fill="#59636e" text-anchor="middle">1</text><text x="170" y="235" fill="#1b1f24" text-anchor="middle">1965</text><rect x="140" y="280" width="60" height="56" rx="10" fill="#fdeede" stroke="#d0d5db" stroke-width="3" /><text x="170" y="266" font-size="20" fill="#59636e" text-anchor="middle">2</text><text x="170" y="315" fill="#1b1f24" text-anchor="middle">4</text></g><text x="300" y="410" font-size="22" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">book[0] → "Dune"</text><text x="300" y="446" font-size="18" fill="#59636e" text-anchor="middle">Position only — no memory of what 0 "means"</text><line x1="600" y1="100" x2="600" y2="470" stroke="#e3e6ea" stroke-width="2" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24"><rect x="700" y="120" width="150" height="56" rx="10" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="775" y="155" fill="#1b1f24" text-anchor="middle">"title"</text><path d="M850 148H900" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M892 140L904 148L892 156" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="908" y="120" width="160" height="56" rx="10" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><text x="988" y="155" fill="#1b1f24" text-anchor="middle">"Dune"</text><rect x="700" y="200" width="150" height="56" rx="10" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="775" y="235" fill="#1b1f24" text-anchor="middle">"year"</text><path d="M850 228H900" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M892 220L904 228L892 236" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="908" y="200" width="160" height="56" rx="10" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><text x="988" y="235" fill="#1b1f24" text-anchor="middle">1965</text><rect x="700" y="280" width="150" height="56" rx="10" fill="#fdeede" stroke="#0067c0" stroke-width="3" /><text x="775" y="315" fill="#1b1f24" text-anchor="middle">"copies"</text><path d="M850 308H900" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M892 300L904 308L892 316" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="908" y="280" width="160" height="56" rx="10" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><text x="988" y="315" fill="#1b1f24" text-anchor="middle">4</text></g><text x="900" y="410" font-size="22" fill="#0067c0" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">book["title"] → "Dune"</text><text x="900" y="446" font-size="18" fill="#59636e" text-anchor="middle">Each key points straight at its own value</text></g></svg>