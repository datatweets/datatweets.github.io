<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">A blank spaCy pipeline trained into a text classifier</title><desc id="desc">Diagram showing a blank spaCy pipeline with only a TextCategorizer component, taking a labeled SMS message as input, training over multiple epochs, and outputting a probability score for the spam and ham labels.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="140" y="60" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">BLANK PIPELINE</text><text x="440" y="60" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">ADD TEXTCAT</text><text x="750" y="60" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">TRAIN 20 EPOCHS</text><text x="1050" y="60" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">PREDICT</text><rect x="40" y="100" width="200" height="120" rx="16" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="140" y="150" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" fill="#1b1f24" text-anchor="middle">spacy.blank</text><text x="140" y="174" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" fill="#1b1f24" text-anchor="middle">("en")</text><text x="140" y="204" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="16" fill="#59636e" text-anchor="middle">pipe_names: []</text><path d="M244 160H336" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M320 144L340 160L320 176" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="340" y="100" width="200" height="120" rx="16" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="440" y="146" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="20" font-weight="600" fill="#0067c0" text-anchor="middle">textcat</text><text x="440" y="174" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="16" fill="#1b1f24" text-anchor="middle">labels:</text><text x="440" y="196" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="16" fill="#1b1f24" text-anchor="middle">spam, ham</text><path d="M544 160H636" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M620 144L640 160L620 176" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="640" y="100" width="220" height="120" rx="16" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="750" y="130" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="15" fill="#59636e" text-anchor="middle">textcat loss</text><polyline points="666 196 700 150 740 192 780 206 820 210 848 211" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="666" cy="196" r="4" fill="#0067c0" /><circle cx="848" cy="211" r="4" fill="#0067c0" /><text x="666" y="215" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="13" fill="#59636e" text-anchor="middle">0.99</text><text x="848" y="203" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="13" fill="#59636e" text-anchor="end">0.00</text><path d="M864 160H956" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M940 144L960 160L940 176" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="960" y="100" width="200" height="120" rx="16" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><rect x="978" y="114" width="164" height="30" rx="7" fill="#fdeede" /><text x="988" y="135" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="16" fill="#1b1f24">spam  0.98</text><rect x="978" y="150" width="164" height="30" rx="7" fill="#e6f4e6" /><text x="988" y="171" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="16" fill="#1b1f24">ham   0.02</text><text x="1060" y="204" font-size="15" fill="#59636e" text-anchor="middle">doc.cats</text><rect x="960" y="270" width="200" height="80" rx="14" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="1060" y="298" font-size="15" fill="#59636e" text-anchor="middle">labeled SMS</text><text x="1060" y="320" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="14" fill="#1b1f24" text-anchor="middle">"call now to</text><text x="1060" y="338" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="14" fill="#1b1f24" text-anchor="middle">collect"</text><path d="M1060 270V232" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M1044 248L1060 228L1076 248" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="40" y="420" width="1120" height="90" rx="18" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="70" y="458" font-size="20" fill="#1b1f24">Add <tspan font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0067c0">textcat</tspan> to a blank pipeline, show it labeled examples for 20 epochs,</text><text x="70" y="486" font-size="20" fill="#1b1f24">then read <tspan font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0067c0">doc.cats</tspan> as a probability per label — not a single verdict.</text></g></svg>