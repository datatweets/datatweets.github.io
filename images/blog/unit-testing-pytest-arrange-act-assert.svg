<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The Arrange-Act-Assert model for a pytest unit test</title><desc id="desc">Diagram of the Arrange-Act-Assert testing pattern: arrange sets unit_price to 4.5 and quantity to 3, act calls order_total with those values, and assert checks the result equals 13.5.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="180" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">ARRANGE</text><text x="600" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">ACT</text><text x="1010" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">ASSERT</text><rect x="60" y="140" width="240" height="240" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="180" y="180" font-size="22" font-weight="600" fill="#59636e" text-anchor="middle">inputs</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="21"><rect x="84" y="204" width="192" height="42" rx="8" fill="#e3f0fa" /><text x="98" y="232" fill="#1b1f24">unit_price = 4.5</text><rect x="84" y="258" width="192" height="42" rx="8" fill="#e3f0fa" /><text x="98" y="286" fill="#1b1f24">quantity = 3</text></g><path d="M312 260C380 260 380 260 448 260" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="452" y="176" width="296" height="168" rx="16" fill="#ffffff" stroke="#7fb0d8" stroke-width="3" /><text x="600" y="216" font-size="22" font-weight="600" fill="#59636e" text-anchor="middle">call</text><text x="600" y="270" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="21" fill="#1b1f24" text-anchor="middle">order_total(</text><text x="600" y="298" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="21" fill="#0067c0" text-anchor="middle">unit_price, quantity</text><text x="600" y="326" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="21" fill="#1b1f24" text-anchor="middle">)</text><path d="M748 260C820 260 820 260 892 260" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="896" y="140" width="244" height="240" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="1018" y="180" font-size="22" font-weight="600" fill="#59636e" text-anchor="middle">check</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="21"><rect x="920" y="204" width="196" height="42" rx="8" fill="#e6f4e6" /><text x="934" y="232" fill="#1b1f24">result == 13.5</text></g><circle cx="1018" cy="310" r="30" fill="#e6f4e6" /><path d="M1005 310l9 9 18-18" fill="none" stroke="#3f9142" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g></svg>
