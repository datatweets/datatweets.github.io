<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">Monitor LLM requests with JSONL and pandas in Python</title>
  <desc id="desc">A DATATWEETS tutorial thumbnail showing candidate JSON Lines request traces summarized into success rate, 95th-percentile latency, and mean token use, followed by a blocked release gate.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="36" font-weight="600" letter-spacing="1" fill="#59636e">LLM OBSERVABILITY</text>
    <text x="90" y="276" font-size="86" font-weight="700" fill="#1b1f24">TRACE</text>
    <text x="90" y="372" font-size="86" font-weight="700" fill="#1b1f24">TO GATE</text>
    <rect x="98" y="405" width="390" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="482" font-size="30" font-weight="500" fill="#59636e">JSONL &#xB7; PANDAS &#xB7; RELEASE CHECKS</text>

    <g transform="translate(690 108)">
      <text x="18" y="28" font-size="18" font-weight="700" letter-spacing="1.4" fill="#59636e">CANDIDATE TRACES</text>

      <rect x="0" y="48" width="420" height="118" rx="18" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="18" y="84" font-size="20" font-weight="700" fill="#0067c0">&#x2022;</text>
      <text x="18" y="113" font-size="20" font-weight="700" fill="#0067c0">&#x2022;</text>
      <text x="18" y="142" font-size="20" font-weight="700" fill="#0067c0">&#x2022;</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#39424c">
        <text x="40" y="84">{"status":"ok", ...}</text>
        <text x="40" y="113">{"latency_ms":..., ...}</text>
        <text x="40" y="142">{"input_tokens":..., ...}</text>
      </g>

      <text x="210" y="209" text-anchor="middle" font-size="42" font-weight="500" fill="#0067c0">&#x2193;</text>

      <rect x="0" y="220" width="128" height="92" rx="16" fill="#e3f0fa" stroke="#b7d5ed" stroke-width="2"/>
      <rect x="146" y="220" width="128" height="92" rx="16" fill="#e3f0fa" stroke="#b7d5ed" stroke-width="2"/>
      <rect x="292" y="220" width="128" height="92" rx="16" fill="#e3f0fa" stroke="#b7d5ed" stroke-width="2"/>
      <text x="64" y="249" text-anchor="middle" font-size="15" font-weight="700" fill="#59636e">SUCCESS</text>
      <text x="64" y="286" text-anchor="middle" font-size="27" font-weight="700" fill="#1b1f24">94.2%</text>
      <text x="210" y="249" text-anchor="middle" font-size="15" font-weight="700" fill="#59636e">P95</text>
      <text x="210" y="286" text-anchor="middle" font-size="27" font-weight="700" fill="#1b1f24">2,032 ms</text>
      <text x="356" y="249" text-anchor="middle" font-size="15" font-weight="700" fill="#59636e">TOKENS</text>
      <text x="356" y="286" text-anchor="middle" font-size="27" font-weight="700" fill="#1b1f24">664</text>

      <text x="210" y="357" text-anchor="middle" font-size="42" font-weight="500" fill="#0067c0">&#x2193;</text>

      <rect x="40" y="368" width="340" height="98" rx="18" fill="#ffffff" stroke="#d1495b" stroke-width="3"/>
      <text x="70" y="406" font-size="17" font-weight="700" letter-spacing="1.2" fill="#59636e">RELEASE GATE</text>
      <text x="70" y="448" font-size="34" font-weight="700" fill="#d1495b">BLOCK</text>
      <rect x="316" y="396" width="42" height="42" rx="21" fill="#fdebed" stroke="#d1495b" stroke-width="2"/>
      <text x="337" y="430" text-anchor="middle" font-size="38" font-weight="500" fill="#d1495b">&#xD7;</text>
    </g>
  </g>
</svg>
