<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The Python plumbing around an AI model call</title><desc id="desc">Diagram showing the Python skills needed to work with AI organized into three stages: BUILD constructs a request with a frozen dataclass holding model, messages, and temperature fields; CALL sends it to the AI model, shown as an opaque call; and HANDLE processes the reply by parsing JSON into a dict, streaming it with a generator's yield, and closing the session and routing errors with with and except.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="170" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">BUILD</text><text x="530" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">CALL</text><text x="1050" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">HANDLE</text><rect x="60" y="120" width="220" height="320" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="170" y="158" font-size="22" font-weight="600" fill="#59636e" text-anchor="middle">ChatRequest</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19"><rect x="80" y="180" width="160" height="32" rx="8" fill="#e3f0fa" /><text x="94" y="202" fill="#1b1f24">model</text><rect x="80" y="222" width="160" height="32" rx="8" fill="#fdeede" /><text x="94" y="244" fill="#1b1f24">messages</text><rect x="80" y="264" width="160" height="32" rx="8" fill="#e6f4e6" /><text x="94" y="286" fill="#1b1f24">temperature</text></g><text x="170" y="410" font-size="18" fill="#59636e" text-anchor="middle">frozen=True</text><path d="M282 280H438" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><circle cx="530" cy="280" r="90" fill="#ffffff" stroke="#0067c0" stroke-width="5" /><text x="530" y="294" font-size="42" font-weight="700" fill="#0067c0" text-anchor="middle">AI</text><text x="530" y="440" font-size="18" fill="#59636e" text-anchor="middle">opaque call</text><path d="M622 280H938" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><rect x="940" y="120" width="220" height="320" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="1050" y="158" font-size="22" font-weight="600" fill="#59636e" text-anchor="middle">Handle Reply</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19"><rect x="960" y="180" width="160" height="32" rx="8" fill="#e3f0fa" /><text x="974" y="202" fill="#1b1f24">json &#8594; dict</text><rect x="960" y="222" width="160" height="32" rx="8" fill="#fdeede" /><text x="974" y="244" fill="#1b1f24">yield &#8594; stream</text><rect x="960" y="264" width="160" height="32" rx="8" fill="#e6f4e6" /><text x="974" y="286" fill="#1b1f24">with / except</text></g><text x="1050" y="410" font-size="18" fill="#59636e" text-anchor="middle">closed &amp; routed</text></g></svg>
