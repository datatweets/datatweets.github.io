<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">A new connection every call versus one connection reused through a Session</title><desc id="desc">Diagram contrasting three calls to requests.get(), each opening a fresh connection to the same host and marked with a broken-handshake icon, against three calls through one requests.Session, which share a single open connection to the server and carry the session's headers, cookies, and a mounted retry adapter along with it.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="600" y="46" font-size="26" font-weight="600" fill="#59636e" text-anchor="middle">WITHOUT A SESSION &#8212; A NEW CONNECTION EVERY CALL</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="20"><rect x="60" y="90" width="150" height="70" rx="14" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="135" y="131" fill="#59636e" text-anchor="middle">your code</text><rect x="990" y="90" width="150" height="70" rx="14" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="1065" y="131" fill="#59636e" text-anchor="middle">API server</text><path d="M210 108C500 108 700 108 990 108" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-dasharray="10 10" /><path d="M210 125C500 125 700 125 990 125" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-dasharray="10 10" /><path d="M210 142C500 142 700 142 990 142" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-dasharray="10 10" /><g stroke="#b5301f" stroke-width="4" stroke-linecap="round"><path d="M330 100L346 116M346 100L330 116" /><path d="M330 117L346 133M346 117L330 133" /><path d="M330 134L346 150M346 134L330 150" /></g></g><text x="380" y="200" font-size="18" fill="#59636e">Each call pays for a fresh TCP + TLS handshake (the &#215; marks) before it can ask its question.</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="600" y="292" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">WITH A SESSION &#8212; ONE CONNECTION, REUSED</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="20"><rect x="60" y="340" width="150" height="70" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="135" y="381" fill="#0067c0" text-anchor="middle">session</text><rect x="990" y="340" width="150" height="70" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="1065" y="381" fill="#0067c0" text-anchor="middle">API server</text><path d="M210 375H990" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><circle cx="420" cy="375" r="13" fill="#0067c0" /><circle cx="600" cy="375" r="13" fill="#7fa8d1" /><circle cx="780" cy="375" r="13" fill="#9dbfdd" /></g><rect x="80" y="440" width="130" height="40" rx="10" fill="#e3f0fa" stroke="#0067c0" stroke-width="2" /><text x="145" y="465" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="17" fill="#0067c0" text-anchor="middle">headers</text><rect x="225" y="440" width="130" height="40" rx="10" fill="#e6f4e6" stroke="#0067c0" stroke-width="2" /><text x="290" y="465" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="17" fill="#2f7d4f" text-anchor="middle">cookies</text><rect x="370" y="440" width="150" height="40" rx="10" fill="#fdeede" stroke="#0067c0" stroke-width="2" /><text x="445" y="465" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="17" fill="#b5651d" text-anchor="middle">retry adapter</text><path d="M145 440V410" fill="none" stroke="#0067c0" stroke-width="3" stroke-linecap="round" /><path d="M290 440V420C290 410 260 405 220 400" fill="none" stroke="#0067c0" stroke-width="3" stroke-linecap="round" /><path d="M445 440V420C445 405 350 398 220 393" fill="none" stroke="#0067c0" stroke-width="3" stroke-linecap="round" /><text x="380" y="512" font-size="18" fill="#59636e" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">One handshake serves all three calls; headers, cookies, and retry logic travel with the session itself.</text></g></svg>
