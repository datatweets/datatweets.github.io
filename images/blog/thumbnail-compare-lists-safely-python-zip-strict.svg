<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Combine Lists Safely with Python zip(strict=True)</title>
  <desc id="desc">A Python tutorial thumbnail showing four identifiers beside three values. Three positions pair successfully, while the unmatched fourth identifier reaches the end of the values and strict zip raises ValueError.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1" fill="#59636e">PYTHON ITERABLES</text>
    <text x="90" y="282" font-size="76" font-weight="700" fill="#1b1f24">PAIR WITHOUT</text>
    <text x="90" y="374" font-size="76" font-weight="700" fill="#1b1f24">DATA LOSS</text>
    <rect x="94" y="409" width="410" height="12" rx="6" fill="#0067c0"/>

    <g font-size="24" font-weight="600">
      <rect x="92" y="466" width="105" height="46" rx="23" fill="#e3f0fa"/>
      <text x="113" y="497" fill="#1b1f24">zip()</text>
      <rect x="210" y="466" width="168" height="46" rx="23" fill="#f7f8fa" stroke="#e3e6ea"/>
      <text x="229" y="497" fill="#1b1f24">strict=True</text>
      <rect x="391" y="466" width="202" height="46" rx="23" fill="#f7f8fa" stroke="#e3e6ea"/>
      <text x="410" y="497" fill="#1b1f24">zip_longest()</text>
    </g>

    <g transform="translate(710 112)">
      <text x="52" y="36" font-size="22" font-weight="700" letter-spacing="1" fill="#59636e">IDS · 4</text>
      <text x="250" y="36" font-size="22" font-weight="700" letter-spacing="1" fill="#59636e">VALUES · 3</text>

      <line x1="130" y1="91" x2="244" y2="91" stroke="#0067c0" stroke-width="4"/>
      <line x1="130" y1="171" x2="244" y2="171" stroke="#0067c0" stroke-width="4"/>
      <line x1="130" y1="251" x2="244" y2="251" stroke="#0067c0" stroke-width="4"/>
      <line x1="130" y1="331" x2="244" y2="331" stroke="#c55a52" stroke-width="4" stroke-dasharray="10 8"/>

      <g font-size="24" font-weight="650" text-anchor="middle">
        <rect x="34" y="60" width="96" height="62" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
        <text x="82" y="100" fill="#1b1f24">ID-1</text>
        <rect x="34" y="140" width="96" height="62" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
        <text x="82" y="180" fill="#1b1f24">ID-2</text>
        <rect x="34" y="220" width="96" height="62" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
        <text x="82" y="260" fill="#1b1f24">ID-3</text>
        <rect x="34" y="300" width="96" height="62" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
        <text x="82" y="340" fill="#1b1f24">ID-4</text>

        <rect x="244" y="60" width="114" height="62" rx="14" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
        <text x="301" y="100" fill="#1b1f24">2.8</text>
        <rect x="244" y="140" width="114" height="62" rx="14" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
        <text x="301" y="180" fill="#1b1f24">4.1</text>
        <rect x="244" y="220" width="114" height="62" rx="14" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
        <text x="301" y="260" fill="#1b1f24">3.6</text>
        <rect x="244" y="300" width="114" height="62" rx="14" fill="#fff5f4" stroke="#c55a52" stroke-width="2" stroke-dasharray="8 6"/>
        <text x="301" y="340" font-size="21" fill="#8c3f39">END</text>
      </g>

      <rect x="60" y="397" width="328" height="56" rx="16" fill="#fff5f4" stroke="#c55a52" stroke-width="2"/>
      <text x="224" y="432" font-size="20" font-weight="700" text-anchor="middle" fill="#8c3f39">strict=True &#8594; ValueError</text>
    </g>
  </g>
</svg>
