<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Pandas as the base layer, routed to three specialist cleaning libraries</title><desc id="desc">Diagram showing pandas as the base layer handling missing values, exact duplicates, and dtype conversion, with three problem shapes routed to three specialist libraries: numeric conditional fixes to numpy, text pattern extraction to re, and near-duplicate matching to rapidfuzz.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="140" y="36" width="920" height="76" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="600" y="82" font-size="22" font-weight="600" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">pandas — missing values · exact duplicates · dtype conversion</text><path d="M600 112C600 150 260 150 260 190" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M600 112V190" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M600 112C600 150 940 150 940 190" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="130" y="190" width="260" height="112" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="260" y="226" font-size="23" font-weight="600" fill="#1b1f24" text-anchor="middle">Numeric fix</text><text x="260" y="254" font-size="17" fill="#59636e" text-anchor="middle">same condition, branched</text><text x="260" y="276" font-size="17" fill="#59636e" text-anchor="middle">across the whole column</text><path d="M260 302V344" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><rect x="180" y="348" width="160" height="52" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="260" y="381" font-size="22" font-weight="600" fill="#0067c0" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">numpy</text><text x="260" y="428" font-size="16" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">where · select · clip</text><rect x="470" y="190" width="260" height="112" rx="14" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="600" y="226" font-size="23" font-weight="600" fill="#1b1f24" text-anchor="middle">Text pattern</text><text x="600" y="254" font-size="17" fill="#59636e" text-anchor="middle">extract and validate a shape,</text><text x="600" y="276" font-size="17" fill="#59636e" text-anchor="middle">not just a value</text><path d="M600 302V344" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><rect x="530" y="348" width="140" height="52" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="600" y="381" font-size="22" font-weight="600" fill="#0067c0" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">re</text><text x="600" y="428" font-size="16" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">compile · sub · fullmatch</text><rect x="810" y="190" width="260" height="112" rx="14" fill="#fdeede" stroke="#0067c0" stroke-width="3" /><text x="940" y="226" font-size="23" font-weight="600" fill="#1b1f24" text-anchor="middle">Near-duplicate</text><text x="940" y="254" font-size="17" fill="#59636e" text-anchor="middle">similar strings, not just</text><text x="940" y="276" font-size="17" fill="#59636e" text-anchor="middle">identical ones</text><path d="M940 302V344" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><rect x="850" y="348" width="180" height="52" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="940" y="381" font-size="20" font-weight="600" fill="#0067c0" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">rapidfuzz</text><text x="940" y="428" font-size="16" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">token_set_ratio · cdist</text></g></svg>