<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The four customer segments K-Means found in the Online Retail RFM data</title><desc id="desc">Four cluster profile cards from fitting K-Means with k equals 4 on log-transformed, scaled RFM features from 4,338 real customers: Champions, 716 customers, average recency 12.1 days, average frequency 13.7 orders, average monetary value 8,074 pounds; Core, 1,173 customers, average recency 71.1 days, average frequency 4.1 orders, average monetary value 1,803 pounds; New or Occasional, 837 customers, average recency 18.1 days, average frequency 2.1 orders, average monetary value 552 pounds; At Risk, 1,612 customers, average recency 182.5 days, average frequency 1.3 orders, average monetary value 344 pounds.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, sans-serif"><text x="60" y="60" font-size="26" font-weight="600" fill="#0067c0">CLUSTER CENTERS &#8594; NAMED CUSTOMER SEGMENTS</text><text x="60" y="94" font-size="21" fill="#59636e">4,338 customers from the Online Retail dataset, grouped into 4 clusters (k=4, silhouette 0.337)</text><g><rect x="60" y="132" width="255" height="330" rx="16" fill="#e6f4e6" stroke="#d0d5db" stroke-width="1.5" /><text x="187" y="176" font-size="24" font-weight="700" fill="#1b1f24" text-anchor="middle">Champions</text><text x="187" y="206" font-size="16" fill="#59636e" text-anchor="middle">716 customers</text><g font-family="&apos;SFMono-Regular&apos;, Consolas, Menlo, monospace"><text x="80" y="256" font-size="15" fill="#59636e">recency</text><text x="294" y="256" font-size="20" font-weight="700" fill="#1b1f24" text-anchor="end">12.1d</text><text x="80" y="304" font-size="15" fill="#59636e">frequency</text><text x="294" y="304" font-size="20" font-weight="700" fill="#1b1f24" text-anchor="end">13.7</text><text x="80" y="352" font-size="15" fill="#59636e">monetary</text><text x="294" y="352" font-size="20" font-weight="700" fill="#1b1f24" text-anchor="end">&#163;8,074</text></g><text x="80" y="432" font-size="14" fill="#1b1f24">Buy often, bought recently,</text><text x="80" y="452" font-size="14" fill="#1b1f24">spend the most per order.</text></g><g><rect x="330" y="132" width="255" height="330" rx="16" fill="#e3f0fa" stroke="#d0d5db" stroke-width="1.5" /><text x="457" y="176" font-size="24" font-weight="700" fill="#1b1f24" text-anchor="middle">Core</text><text x="457" y="206" font-size="16" fill="#59636e" text-anchor="middle">1,173 customers</text><g font-family="&apos;SFMono-Regular&apos;, Consolas, Menlo, monospace"><text x="350" y="256" font-size="15" fill="#59636e">recency</text><text x="564" y="256" font-size="20" font-weight="700" fill="#1b1f24" text-anchor="end">71.1d</text><text x="350" y="304" font-size="15" fill="#59636e">frequency</text><text x="564" y="304" font-size="20" font-weight="700" fill="#1b1f24" text-anchor="end">4.1</text><text x="350" y="352" font-size="15" fill="#59636e">monetary</text><text x="564" y="352" font-size="20" font-weight="700" fill="#1b1f24" text-anchor="end">&#163;1,803</text></g><text x="350" y="432" font-size="14" fill="#1b1f24">Steady, moderate spenders --</text><text x="350" y="452" font-size="14" fill="#1b1f24">the largest reliable base.</text></g><g><rect x="600" y="132" width="255" height="330" rx="16" fill="#fdeede" stroke="#d0d5db" stroke-width="1.5" /><text x="727" y="176" font-size="22" font-weight="700" fill="#1b1f24" text-anchor="middle">New / Occasional</text><text x="727" y="206" font-size="16" fill="#59636e" text-anchor="middle">837 customers</text><g font-family="&apos;SFMono-Regular&apos;, Consolas, Menlo, monospace"><text x="620" y="256" font-size="15" fill="#59636e">recency</text><text x="834" y="256" font-size="20" font-weight="700" fill="#1b1f24" text-anchor="end">18.1d</text><text x="620" y="304" font-size="15" fill="#59636e">frequency</text><text x="834" y="304" font-size="20" font-weight="700" fill="#1b1f24" text-anchor="end">2.1</text><text x="620" y="352" font-size="15" fill="#59636e">monetary</text><text x="834" y="352" font-size="20" font-weight="700" fill="#1b1f24" text-anchor="end">&#163;552</text></g><text x="620" y="432" font-size="14" fill="#1b1f24">Bought recently, but only</text><text x="620" y="452" font-size="14" fill="#1b1f24">once or twice so far.</text></g><g><rect x="870" y="132" width="255" height="330" rx="16" fill="#f6e2e2" stroke="#d0d5db" stroke-width="1.5" /><text x="997" y="176" font-size="24" font-weight="700" fill="#1b1f24" text-anchor="middle">At Risk</text><text x="997" y="206" font-size="16" fill="#59636e" text-anchor="middle">1,612 customers</text><g font-family="&apos;SFMono-Regular&apos;, Consolas, Menlo, monospace"><text x="890" y="256" font-size="15" fill="#59636e">recency</text><text x="1104" y="256" font-size="20" font-weight="700" fill="#1b1f24" text-anchor="end">182.5d</text><text x="890" y="304" font-size="15" fill="#59636e">frequency</text><text x="1104" y="304" font-size="20" font-weight="700" fill="#1b1f24" text-anchor="end">1.3</text><text x="890" y="352" font-size="15" fill="#59636e">monetary</text><text x="1104" y="352" font-size="20" font-weight="700" fill="#1b1f24" text-anchor="end">&#163;344</text></g><text x="890" y="432" font-size="14" fill="#1b1f24">Haven't ordered in six</text><text x="890" y="452" font-size="14" fill="#1b1f24">months, mostly one-time.</text></g><text x="60" y="512" font-size="17" fill="#59636e">Cards are ordered by average monetary value, highest first -- K-Means itself has no notion of "best".</text><text x="60" y="538" font-size="17" fill="#59636e">Every number above is read directly from the fitted model&apos;s cluster assignments on the real dataset.</text></g></svg>