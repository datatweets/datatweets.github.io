<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Five SQL command categories, sorted by what they change</title><desc id="desc">Five SQL command categories arranged in columns: DDL (CREATE, ALTER, DROP) touches structure, DML (INSERT, UPDATE, DELETE) touches rows, and DQL (SELECT) touches nothing, grouped under the label what you do to data. DCL (GRANT, REVOKE) touches access and TCL (COMMIT, ROLLBACK, SAVEPOINT) touches outcome, grouped under the label what controls it.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><path d="M40 78H496" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" /><path d="M40 78V90" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" /><path d="M496 78V90" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" /><text x="268" y="60" font-size="22" font-weight="600" fill="#0067c0" text-anchor="middle">WHAT YOU DO TO DATA</text><path d="M724 78H1160" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" /><path d="M724 78V90" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" /><path d="M1160 78V90" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" /><text x="942" y="60" font-size="22" font-weight="600" fill="#0067c0" text-anchor="middle">WHAT CONTROLS IT</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="40" y="120" width="208" height="380" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="144" y="168" font-size="34" font-weight="700" fill="#0067c0" text-anchor="middle">DDL</text><text x="144" y="194" font-size="16" fill="#59636e" text-anchor="middle">Definition</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" fill="#1b1f24"><text x="144" y="240" text-anchor="middle">CREATE</text><text x="144" y="270" text-anchor="middle">ALTER</text><text x="144" y="300" text-anchor="middle">DROP</text></g><rect x="60" y="432" width="168" height="40" rx="10" fill="#e3f0fa" /><text x="144" y="458" font-size="16" font-weight="600" fill="#1b1f24" text-anchor="middle">touches: structure</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="268" y="120" width="208" height="380" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="372" y="168" font-size="34" font-weight="700" fill="#0067c0" text-anchor="middle">DML</text><text x="372" y="194" font-size="16" fill="#59636e" text-anchor="middle">Manipulation</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" fill="#1b1f24"><text x="372" y="240" text-anchor="middle">INSERT</text><text x="372" y="270" text-anchor="middle">UPDATE</text><text x="372" y="300" text-anchor="middle">DELETE</text></g><rect x="288" y="432" width="168" height="40" rx="10" fill="#e6f4e6" /><text x="372" y="458" font-size="16" font-weight="600" fill="#1b1f24" text-anchor="middle">touches: rows</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="496" y="120" width="208" height="380" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="600" y="168" font-size="34" font-weight="700" fill="#0067c0" text-anchor="middle">DQL</text><text x="600" y="194" font-size="16" fill="#59636e" text-anchor="middle">Query</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" fill="#1b1f24"><text x="600" y="255" text-anchor="middle">SELECT</text></g><rect x="516" y="432" width="168" height="40" rx="10" fill="#fdeede" /><text x="600" y="458" font-size="16" font-weight="600" fill="#1b1f24" text-anchor="middle">touches: nothing</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="724" y="120" width="208" height="380" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="828" y="168" font-size="34" font-weight="700" fill="#0067c0" text-anchor="middle">DCL</text><text x="828" y="194" font-size="16" fill="#59636e" text-anchor="middle">Permissions</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" fill="#1b1f24"><text x="828" y="240" text-anchor="middle">GRANT</text><text x="828" y="270" text-anchor="middle">REVOKE</text></g><rect x="744" y="432" width="168" height="40" rx="10" fill="#e3f0fa" /><text x="828" y="458" font-size="16" font-weight="600" fill="#1b1f24" text-anchor="middle">touches: access</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="952" y="120" width="208" height="380" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="1056" y="168" font-size="34" font-weight="700" fill="#0067c0" text-anchor="middle">TCL</text><text x="1056" y="194" font-size="16" fill="#59636e" text-anchor="middle">Transactions</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" fill="#1b1f24"><text x="1056" y="240" text-anchor="middle">COMMIT</text><text x="1056" y="270" text-anchor="middle">ROLLBACK</text><text x="1056" y="300" text-anchor="middle">SAVEPOINT</text></g><rect x="972" y="432" width="168" height="40" rx="10" fill="#e6f4e6" /><text x="1056" y="458" font-size="16" font-weight="600" fill="#1b1f24" text-anchor="middle">touches: outcome</text></g></svg>
