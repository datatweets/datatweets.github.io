<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Python command-line scripts thumbnail</title><desc id="desc">A minimal logo-style thumbnail for an article on writing Python scripts that behave like well-mannered command-line tools, covering argparse, stdin, stdout, stderr, and exit codes.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="36" font-weight="600" fill="#59636e">Build command-line tools with</text><text x="90" y="360" font-size="120" font-weight="700" fill="#1b1f24">argparse</text><rect x="100" y="392" width="360" height="12" rx="6" fill="#0067c0" /><text x="98" y="474" font-size="28" font-weight="500" fill="#59636e">args &#183; stdin &#183; stdout &#183; exit codes</text></g><g transform="translate(790 168)" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="0" y="0" width="220" height="64" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="110" y="40" font-size="22" fill="#0067c0" text-anchor="middle">$ script.py --min 500</text><path d="M110 64V116" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M110 116L94 94M110 116L126 94" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><rect x="0" y="120" width="220" height="60" rx="12" fill="#ffffff" stroke="#d0d5db" stroke-width="4" /><text x="110" y="157" font-size="22" fill="#59636e" text-anchor="middle">your script</text><path d="M110 180V232" fill="none" stroke="#c7ccd2" stroke-width="6" stroke-linecap="round" /><path d="M110 232L94 210M110 232L126 210" fill="none" stroke="#c7ccd2" stroke-width="6" stroke-linecap="round" /><rect x="0" y="236" width="220" height="34" rx="8" fill="#e6f4e6" /><text x="14" y="259" font-size="21" fill="#1b1f24">stdout</text><rect x="0" y="278" width="220" height="34" rx="8" fill="#fdeede" /><text x="14" y="301" font-size="21" fill="#1b1f24">stderr</text><rect x="0" y="320" width="220" height="34" rx="8" fill="#e3f0fa" /><text x="14" y="343" font-size="21" fill="#1b1f24">exit code</text></g></svg>
