<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Diagram comparing one shared system Python, where two projects needing different Django versions conflict, with virtual environments, where each project gets its own isolated Python and packages."><title>Python virtual environment overview</title><desc>Diagram showing an isolated Python environment with its own interpreter and packages, separate from the system installation and other projects.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59636e" /></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b02a37" /></marker><marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e7d34" /></marker></defs><rect x="0" y="0" width="720" height="500" fill="#ffffff" /><text x="360" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1b1f24">How a virtual environment keeps projects isolated</text><rect x="20" y="52" width="680" height="178" rx="10" fill="#fbf1f2" stroke="#f0c9cd" /><rect x="36" y="44" width="250" height="26" rx="13" fill="#b02a37" /><text x="52" y="62" font-size="13" font-weight="700" fill="#ffffff">Without a virtual environment</text><rect x="60" y="92" width="150" height="54" rx="8" fill="#d6e8f7" stroke="#0067c0" stroke-width="1.5" /><text x="135" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#0a3d62">Project A</text><text x="135" y="133" text-anchor="middle" font-size="12" fill="#1b1f24">needs Django 4.2</text><rect x="510" y="92" width="150" height="54" rx="8" fill="#d6e8f7" stroke="#0067c0" stroke-width="1.5" /><text x="585" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#0a3d62">Project B</text><text x="585" y="133" text-anchor="middle" font-size="12" fill="#1b1f24">needs Django 3.2</text><rect x="270" y="158" width="180" height="58" rx="8" fill="#eef1f4" stroke="#59636e" stroke-width="1.5" /><text x="360" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f24">System Python</text><text x="360" y="201" text-anchor="middle" font-size="11.5" fill="#59636e">one shared set of packages</text><path d="M150 146C170 175 220 182 268 187" fill="none" stroke="#b02a37" stroke-width="1.8" marker-end="url(#arrowRed)" /><path d="M570 146C550 175 500 182 452 187" fill="none" stroke="#b02a37" stroke-width="1.8" marker-end="url(#arrowRed)" /><text x="360" y="138" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b02a37">conflict — only one Django version can win</text><rect x="20" y="292" width="680" height="190" rx="10" fill="#eef7f0" stroke="#bfe3c8" /><rect x="36" y="284" width="232" height="26" rx="13" fill="#1e7d34" /><text x="52" y="302" font-size="13" font-weight="700" fill="#ffffff">With virtual environments</text><rect x="70" y="328" width="150" height="50" rx="8" fill="#d6e8f7" stroke="#0067c0" stroke-width="1.5" /><text x="145" y="349" text-anchor="middle" font-size="13" font-weight="700" fill="#0a3d62">Project A</text><text x="145" y="367" text-anchor="middle" font-size="11.5" fill="#1b1f24">needs Django 4.2</text><path d="M145 378L145 408" fill="none" stroke="#1e7d34" stroke-width="1.8" marker-end="url(#arrowGreen)" /><rect x="62" y="412" width="166" height="56" rx="8" fill="#ffffff" stroke="#1e7d34" stroke-width="1.5" stroke-dasharray="5 3" /><text x="145" y="434" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e7d34">venv A</text><text x="145" y="452" text-anchor="middle" font-size="11.5" fill="#1b1f24">own Python · Django 4.2</text><rect x="500" y="328" width="150" height="50" rx="8" fill="#d6e8f7" stroke="#0067c0" stroke-width="1.5" /><text x="575" y="349" text-anchor="middle" font-size="13" font-weight="700" fill="#0a3d62">Project B</text><text x="575" y="367" text-anchor="middle" font-size="11.5" fill="#1b1f24">needs Django 3.2</text><path d="M575 378L575 408" fill="none" stroke="#1e7d34" stroke-width="1.8" marker-end="url(#arrowGreen)" /><rect x="492" y="412" width="166" height="56" rx="8" fill="#ffffff" stroke="#1e7d34" stroke-width="1.5" stroke-dasharray="5 3" /><text x="575" y="434" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e7d34">venv B</text><text x="575" y="452" text-anchor="middle" font-size="11.5" fill="#1b1f24">own Python · Django 3.2</text><text x="360" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#1e7d34">Each project gets its</text><text x="360" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#1e7d34">own isolated environment</text><circle cx="360" cy="412" r="15" fill="#1e7d34" /><path d="M352 412L358 419L369 405" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><text x="360" y="452" text-anchor="middle" font-size="11.5" fill="#59636e">no conflicts</text></svg>