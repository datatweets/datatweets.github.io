<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Build a Reusable Data Cleaning Pipeline in pandas</title>
  <desc id="desc">A DATATWEETS tutorial thumbnail. On the left, the words Clean Steps and Clear Audit introduce a reusable pandas workflow. On the right, a four-stage pipeline shows 31 raw CSV rows becoming 25 valid rows, with the row count recorded at each step.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="145" font-size="32" font-weight="600" letter-spacing="1.2" fill="#59636e">REUSABLE PANDAS WORKFLOW</text>
    <text x="90" y="276" font-size="78" font-weight="700" fill="#1b1f24">CLEAN STEPS</text>
    <text x="90" y="370" font-size="78" font-weight="700" fill="#1b1f24">CLEAR AUDIT</text>
    <rect x="98" y="406" width="410" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="489" font-size="30" font-weight="500" fill="#59636e">PIPE &#183; VALIDATE &#183; AUDIT</text>

    <g transform="translate(742 112)">
      <rect x="0" y="0" width="352" height="450" rx="22" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="30" y="45" font-size="20" font-weight="600" letter-spacing="1" fill="#59636e">ROW AUDIT</text>

      <path d="M64 108 V344" fill="none" stroke="#b8c1ca" stroke-width="4" stroke-linecap="round"/>
      <path d="M56 336 L64 348 L72 336" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <circle cx="64" cy="104" r="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
      <circle cx="64" cy="184" r="14" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>
      <circle cx="64" cy="264" r="14" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>
      <circle cx="64" cy="344" r="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>

      <text x="100" y="99" font-size="22" font-weight="700" fill="#1b1f24">RAW CSV</text>
      <text x="292" y="99" text-anchor="end" font-size="22" font-weight="700" fill="#0067c0">31</text>
      <text x="100" y="124" font-size="17" font-weight="500" fill="#59636e">rows delivered</text>

      <text x="100" y="179" font-size="22" font-weight="700" fill="#1b1f24">STANDARDIZE</text>
      <text x="292" y="179" text-anchor="end" font-size="22" font-weight="700" fill="#0067c0">31</text>
      <text x="100" y="204" font-size="17" font-weight="500" fill="#59636e">headers + fields</text>

      <text x="100" y="259" font-size="22" font-weight="700" fill="#1b1f24">KEEP LATEST</text>
      <text x="292" y="259" text-anchor="end" font-size="22" font-weight="700" fill="#0067c0">28</text>
      <text x="100" y="284" font-size="17" font-weight="500" fill="#59636e">unique IDs</text>

      <text x="100" y="339" font-size="22" font-weight="700" fill="#1b1f24">KEEP VALID</text>
      <text x="292" y="339" text-anchor="end" font-size="22" font-weight="700" fill="#0067c0">25</text>
      <text x="100" y="364" font-size="17" font-weight="500" fill="#59636e">clean rows</text>

      <rect x="30" y="398" width="292" height="32" rx="16" fill="#e3f0fa"/>
      <text x="176" y="420" text-anchor="middle" font-size="17" font-weight="600" fill="#0067c0">EACH CHANGE STAYS VISIBLE</text>
    </g>
  </g>
</svg>
