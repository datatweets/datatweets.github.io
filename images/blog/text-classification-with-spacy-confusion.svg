<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Confusion matrix for the spam classifier on 10 held-out test messages</title><desc id="desc">Bar chart of the confusion matrix from evaluating the spam classifier on 10 held-out test messages: 6 true positives, 2 false positives, 0 false negatives, and 2 true negatives, giving precision 0.75 and recall 1.00.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="600" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">CONFUSION MATRIX · 10 HELD-OUT TEST MESSAGES</text><rect x="60" y="90" width="1080" height="360" rx="20" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g stroke="#e3e6ea" stroke-width="1"><line x1="150" y1="130" x2="1090" y2="130" /><line x1="150" y1="200" x2="1090" y2="200" /><line x1="150" y1="270" x2="1090" y2="270" /><line x1="150" y1="340" x2="1090" y2="340" /><line x1="150" y1="410" x2="1090" y2="410" /></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="16" fill="#59636e" text-anchor="end"><text x="140" y="135">6</text><text x="140" y="205">4</text><text x="140" y="275">2</text><text x="140" y="345">1</text><text x="140" y="415">0</text></g><rect x="220" y="140" width="140" height="270" rx="10" fill="#e6f4e6" stroke="#3f9142" stroke-width="3" /><text x="290" y="128" font-size="22" font-weight="600" fill="#1b1f24" text-anchor="middle">6</text><text x="290" y="440" font-size="18" fill="#1b1f24" text-anchor="middle">TP</text><text x="290" y="464" font-size="14" fill="#59636e" text-anchor="middle">true positive</text><rect x="430" y="320" width="140" height="90" rx="10" fill="#fdeede" stroke="#d98f4c" stroke-width="3" /><text x="500" y="308" font-size="22" font-weight="600" fill="#1b1f24" text-anchor="middle">2</text><text x="500" y="440" font-size="18" fill="#1b1f24" text-anchor="middle">FP</text><text x="500" y="464" font-size="14" fill="#59636e" text-anchor="middle">false positive</text><rect x="640" y="405" width="140" height="5" rx="2" fill="#e3f0fa" stroke="#7fb0d8" stroke-width="3" /><text x="710" y="393" font-size="22" font-weight="600" fill="#1b1f24" text-anchor="middle">0</text><text x="710" y="440" font-size="18" fill="#1b1f24" text-anchor="middle">FN</text><text x="710" y="464" font-size="14" fill="#59636e" text-anchor="middle">false negative</text><rect x="850" y="320" width="140" height="90" rx="10" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="920" y="308" font-size="22" font-weight="600" fill="#1b1f24" text-anchor="middle">2</text><text x="920" y="440" font-size="18" fill="#1b1f24" text-anchor="middle">TN</text><text x="920" y="464" font-size="14" fill="#59636e" text-anchor="middle">true negative</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="60" y="474" width="520" height="66" rx="16" fill="#e3f0fa" /><text x="90" y="514" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="22" fill="#0067c0">precision = 6 / (6+2) = 0.75</text><rect x="620" y="474" width="520" height="66" rx="16" fill="#e6f4e6" /><text x="650" y="514" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="22" fill="#3f9142">recall = 6 / (6+0) = 1.00</text></g></svg>