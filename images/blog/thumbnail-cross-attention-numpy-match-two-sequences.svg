      <rect x="706" y="292" width="72" height="48" rx="10" fill="#e3f0fa"/>
      <rect x="706" y="368" width="72" height="48" rx="10" fill="#e3f0fa"/>
    </g>
    <g font-size="20" font-weight="700" text-anchor="middle" fill="#0067c0">
      <text x="742" y="247">Q1</text>
      <text x="742" y="323">Q2</text>
      <text x="742" y="399">Q3</text>
