    <text x="90" y="290" font-size="88" font-weight="700" fill="#1b1f24">MATCH</text>
    <text x="90" y="394" font-size="88" font-weight="700" fill="#1b1f24">THEN MIX</text>
    <rect x="98" y="434" width="350" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="515" font-size="30" font-weight="500" fill="#59636e">QUERIES &#183; MASKS &#183; CONTEXT</text>

