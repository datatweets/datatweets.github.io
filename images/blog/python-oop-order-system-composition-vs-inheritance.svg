<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Inheritance-based order subclasses versus a composed discount list</title>
  <desc id="desc">Diagram comparing two designs for combining an order with discounts: an inheritance-based design needs four separate order subclasses to cover none, student-only, loyalty-only, and student-plus-loyalty, while a composition-based design needs only one Order class that holds a list of discount objects, so the same four combinations are just different list contents.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0067c0"/>
    </marker>
    <style>
      .heading { font: 700 26px Jost, system-ui, sans-serif; fill: #1b1f24; }
      .label { font: 700 19px Jost, system-ui, sans-serif; fill: #1b1f24; }
      .detail { font: 16px Jost, system-ui, sans-serif; fill: #59636e; }
      .mono { font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1b1f24; }
      .caps { font: 700 14px Jost, system-ui, sans-serif; fill: #0067c0; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="1200" height="640" fill="#f7f8fa"/>
  <rect x="28" y="24" width="1144" height="592" rx="24" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <!-- Inheritance half -->
  <text x="62" y="66" class="caps">INHERITANCE: ONE ORDER SUBCLASS PER COMBINATION</text>

  <rect x="62" y="90" width="150" height="52" rx="10" fill="#eef1f4" stroke="#c7ccd2" stroke-width="2"/>
  <text x="137" y="122" class="mono" text-anchor="middle">Order</text>

  <path d="M137 142 L137 168" stroke="#c7ccd2" stroke-width="2"/>
  <path d="M137 168 L62 168 M137 168 L212 168 M137 168 L362 168 M137 168 L512 168" stroke="#c7ccd2" stroke-width="2" fill="none"/>
  <line x1="62" y1="168" x2="62" y2="190" stroke="#c7ccd2" stroke-width="2"/>
  <line x1="212" y1="168" x2="212" y2="190" stroke="#c7ccd2" stroke-width="2"/>
  <line x1="362" y1="168" x2="362" y2="190" stroke="#c7ccd2" stroke-width="2"/>
  <line x1="512" y1="168" x2="512" y2="190" stroke="#c7ccd2" stroke-width="2"/>

  <rect x="12" y="190" width="100" height="70" rx="8" fill="#eef1f4" stroke="#c7ccd2" stroke-width="2"/>
  <text x="62" y="220" class="mono" text-anchor="middle" font-size="13">Order</text>
  <text x="62" y="238" class="mono" text-anchor="middle" font-size="13">(none)</text>

  <rect x="162" y="190" width="100" height="70" rx="8" fill="#eef1f4" stroke="#c7ccd2" stroke-width="2"/>
  <text x="212" y="215" class="mono" text-anchor="middle" font-size="12">Student</text>
  <text x="212" y="233" class="mono" text-anchor="middle" font-size="12">Order</text>

  <rect x="312" y="190" width="100" height="70" rx="8" fill="#eef1f4" stroke="#c7ccd2" stroke-width="2"/>
  <text x="362" y="215" class="mono" text-anchor="middle" font-size="12">Loyalty</text>
  <text x="362" y="233" class="mono" text-anchor="middle" font-size="12">Order</text>

  <rect x="447" y="190" width="130" height="70" rx="8" fill="#fdeede" stroke="#df9a3a" stroke-width="2"/>
  <text x="512" y="212" class="mono" text-anchor="middle" font-size="11">Student</text>
  <text x="512" y="228" class="mono" text-anchor="middle" font-size="11">And</text>
  <text x="512" y="244" class="mono" text-anchor="middle" font-size="11">LoyaltyOrder</text>

  <text x="62" y="300" class="detail">4 subclasses cover 2 discount types.</text>
  <text x="62" y="326" class="detail">A 3rd discount type would force 8.</text>

  <line x1="620" y1="50" x2="620" y2="330" stroke="#e3e6ea" stroke-width="2"/>

  <!-- Composition half -->
  <text x="660" y="66" class="caps">COMPOSITION: ONE ORDER, A LIST OF DISCOUNTS</text>

  <rect x="660" y="100" width="150" height="52" rx="10" fill="#0067c0"/>
  <text x="735" y="132" class="mono" text-anchor="middle" fill="#ffffff">Order</text>

  <rect x="860" y="90" width="270" height="150" rx="14" fill="#eef1f4" stroke="#c7ccd2" stroke-width="2"/>
  <text x="880" y="118" class="label" font-size="15">discounts: list</text>
  <rect x="880" y="132" width="230" height="34" rx="6" fill="#ffffff" stroke="#c7ccd2" stroke-width="1.5"/>
  <text x="895" y="154" class="mono" font-size="13">PercentageDiscount</text>
  <rect x="880" y="172" width="230" height="34" rx="6" fill="#ffffff" stroke="#c7ccd2" stroke-width="1.5"/>
  <text x="895" y="194" class="mono" font-size="13">LoyaltyDiscount</text>
  <rect x="880" y="212" width="230" height="18" rx="4" fill="none" stroke="#c7ccd2" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="895" y="226" class="mono" font-size="11" fill="#59636e">...any combination</text>

  <path d="M810 126 L858 145" class="mono" stroke="#0067c0" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <text x="660" y="280" class="detail">Same Order class, every time.</text>
  <text x="660" y="306" class="detail">A new discount type: one new small class.</text>
  <text x="660" y="332" class="detail">A new combination: a different list — no new class.</text>

  <line x1="62" y1="368" x2="1130" y2="368" stroke="#e3e6ea" stroke-width="2"/>
  <text x="62" y="408" class="label">Variation in what an object is &#8594; inheritance.</text>
  <text x="62" y="440" class="label">Variation in how objects are combined &#8594; composition.</text>
  <text x="62" y="478" class="detail">Discount subtypes (Percentage, Loyalty) differ in behavior, so they inherit</text>
  <text x="62" y="502" class="detail">from one Discount base. Discount combinations differ in membership, so an</text>
  <text x="62" y="526" class="detail">Order composes a list of them instead of subclassing for every combination.</text>
</svg>
