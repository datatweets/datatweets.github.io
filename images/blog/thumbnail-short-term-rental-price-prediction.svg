<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Short-term rental price prediction thumbnail</title><desc id="desc">A minimal logo-style thumbnail for an article on predicting short-term rental prices, showing numeric and categorical columns merging through a ColumnTransformer into one matrix that feeds a predict call.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="40" font-weight="600" fill="#59636e">Numbers and categories, one model</text><text x="90" y="392" font-size="150" font-weight="700" fill="#1b1f24">Rentals</text><rect x="100" y="424" width="320" height="12" rx="6" fill="#0067c0" /><text x="98" y="506" font-size="35" font-weight="500" fill="#59636e">impute &#183; encode &#183; combine</text></g><g transform="translate(742 168)"><rect x="0" y="0" width="416" height="340" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="24" y="24" width="170" height="64" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="109" y="52" font-size="20" font-weight="600" fill="#0067c0" text-anchor="middle">numeric</text><text x="109" y="76" font-size="14" fill="#0067c0" text-anchor="middle" opacity="0.85">5 columns</text><rect x="222" y="24" width="170" height="64" rx="12" fill="#fdeede" stroke="#59636e" stroke-width="3" /><text x="307" y="52" font-size="20" font-weight="600" fill="#59636e" text-anchor="middle">room_type</text><text x="307" y="76" font-size="14" fill="#59636e" text-anchor="middle" opacity="0.85">1 column</text></g><path d="M109 88C109 118 150 118 150 150" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M307 88C307 118 266 118 266 150" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="88" y="154" width="240" height="64" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="208" y="194" font-size="22" font-weight="600" fill="#0067c0" text-anchor="middle" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">9 columns</text><path d="M208 218V250" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M198 240L208 252L218 240" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="88" y="262" width="240" height="56" rx="28" fill="#0067c0" /><text x="208" y="298" font-size="22" fill="#ffffff" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">predict()</text></g></svg>
