<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">A bounded Python agent loop</title><desc id="desc">A plan enters a gate that checks the tool name, arguments, approval, and remaining step budget. An accepted call reaches a narrow Python function and writes a trace event. A rejected call stops safely.</desc>
<rect width="1000" height="330" fill="#f7f9fc"/><g font-family="system-ui,sans-serif"><text x="50" y="42" font-size="25" font-weight="700" fill="#17233c">The runtime is the safety boundary</text>
<g fill="#fff" stroke="#315b86" stroke-width="3"><rect x="50" y="105" width="170" height="95" rx="14"/><rect x="300" y="85" width="250" height="135" rx="14"/><rect x="635" y="105" width="170" height="95" rx="14"/><rect x="850" y="105" width="110" height="95" rx="14"/></g>
<g fill="#17233c" font-size="18" text-anchor="middle"><text x="135" y="145">Proposed</text><text x="135" y="172">tool call</text><text x="425" y="120" font-weight="700">Runtime gate</text><text x="425" y="150">allowlist · arguments</text><text x="425" y="178">approval · step budget</text><text x="720" y="145">Narrow Python</text><text x="720" y="172">function</text><text x="905" y="145">Trace</text><text x="905" y="172">event</text></g>
<g stroke="#315b86" stroke-width="4" fill="none"><path d="M220 152H292"/><path d="M550 152H627"/><path d="M805 152H842"/></g><g fill="#315b86"><path d="M292 152l-12-8v16z"/><path d="M627 152l-12-8v16z"/><path d="M842 152l-12-8v16z"/></g>
<path d="M425 220v48H250" stroke="#c44b4b" stroke-width="4" fill="none"/><path d="M250 268l12-8v16z" fill="#c44b4b"/><text x="175" y="274" font-size="18" fill="#9d3030">stop with a clear status</text></g></svg>
