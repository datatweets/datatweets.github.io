<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Two shapes of SQL query, plus pagination as a separate concern</title><desc id="desc">Diagram showing two shapes of SQL query: GROUP BY with HAVING collapses rows into one summary row per group, used for finding duplicate rows; a window function using PARTITION BY and ORDER BY keeps every row and attaches a computed value from its neighbors, used for deduplication, ranking the top result per group, running totals, and month-over-month change. A third, separate box shows pagination as OFFSET, which drifts when rows change, versus keyset pagination, which stays stable.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="310" y="46" font-size="25" font-weight="600" fill="#0067c0" text-anchor="middle">COLLAPSE ROWS</text><text x="890" y="46" font-size="25" font-weight="600" fill="#0067c0" text-anchor="middle">KEEP EVERY ROW</text></g><rect x="60" y="70" width="500" height="230" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><rect x="640" y="70" width="500" height="230" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="17" fill="#1b1f24"><text x="86" y="104">GROUP BY cols HAVING COUNT(*) &gt; 1</text><text x="666" y="104">PARTITION BY cols ORDER BY ...</text></g><g><rect x="90" y="126" width="150" height="22" rx="5" fill="#e3f0fa" stroke="#c7ccd2" stroke-width="2" /><rect x="90" y="154" width="150" height="22" rx="5" fill="#e3f0fa" stroke="#c7ccd2" stroke-width="2" /><rect x="90" y="182" width="150" height="22" rx="5" fill="#e3f0fa" stroke="#c7ccd2" stroke-width="2" /><rect x="90" y="210" width="150" height="22" rx="5" fill="#e3f0fa" stroke="#c7ccd2" stroke-width="2" /><path d="M240 137L300 197M240 165L300 197M240 193L300 197M240 221L300 197" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><rect x="300" y="176" width="150" height="42" rx="8" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="320" y="203" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="16" fill="#1b1f24">1 row/group</text></g><g><rect x="670" y="126" width="130" height="22" rx="5" fill="#fdeede" stroke="#c7ccd2" stroke-width="2" /><rect x="808" y="126" width="90" height="22" rx="5" fill="#0067c0" opacity="0.15" stroke="#0067c0" stroke-width="1.5" /><rect x="670" y="154" width="130" height="22" rx="5" fill="#fdeede" stroke="#c7ccd2" stroke-width="2" /><rect x="808" y="154" width="90" height="22" rx="5" fill="#0067c0" opacity="0.15" stroke="#0067c0" stroke-width="1.5" /><rect x="670" y="182" width="130" height="22" rx="5" fill="#fdeede" stroke="#c7ccd2" stroke-width="2" /><rect x="808" y="182" width="90" height="22" rx="5" fill="#0067c0" opacity="0.15" stroke="#0067c0" stroke-width="1.5" /><rect x="670" y="210" width="130" height="22" rx="5" fill="#fdeede" stroke="#c7ccd2" stroke-width="2" /><rect x="808" y="210" width="90" height="22" rx="5" fill="#0067c0" opacity="0.15" stroke="#0067c0" stroke-width="1.5" /><text x="912" y="142" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="14" fill="#0067c0">+ROW_NUMBER()</text><text x="912" y="170" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="14" fill="#0067c0">+RANK()</text><text x="912" y="198" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="14" fill="#0067c0">+SUM() OVER</text><text x="912" y="226" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="14" fill="#0067c0">+LAG()</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#59636e"><text x="90" y="266">Used for: finding duplicate rows</text><text x="670" y="266">Used for: dedupe, top-N, running totals,</text><text x="670" y="288">month-over-month change</text></g><rect x="60" y="330" width="1080" height="160" rx="16" fill="#fdeede" stroke="#0067c0" stroke-width="3" /><text x="600" y="362" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#0067c0" text-anchor="middle">PAGINATION: A THIRD, SEPARATE CONCERN</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="20" fill="#1b1f24"><rect x="120" y="384" width="180" height="52" rx="10" fill="#ffffff" stroke="#c7ccd2" stroke-width="2" /><text x="148" y="418">OFFSET</text><rect x="900" y="384" width="180" height="52" rx="10" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="948" y="418">KEYSET</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#59636e"><text x="120" y="458">counts positions &#8594; drifts when rows change</text><text x="900" y="458">filters by last id &#8594; stays stable</text></g><path d="M310 410H880" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-dasharray="6 8" /><text x="595" y="416" font-family="Jost, sans-serif" font-size="18" fill="#59636e" text-anchor="middle">vs</text></svg>
