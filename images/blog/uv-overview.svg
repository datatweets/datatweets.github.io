<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="A diagram showing six separate tools on the left — pip for installing packages, venv for environments, pyenv for Python versions, pip-tools for locking dependencies, pipx for running tools, and build and twine for packaging — all collapsing with arrows into one box on the right labelled uv, which handles install and resolve, virtual environments, Python versions, lockfiles, running tools, and build and publish."><title>uv Python project workflow overview</title><desc>Diagram comparing several traditional Python environment and packaging tools with the single uv workflow.</desc><defs><marker id="uvarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a0aec0" /></marker></defs><rect width="640" height="420" fill="#ffffff" /><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">One fast tool instead of a whole stack</text><g stroke="#cbd5e0" stroke-width="1.8"><line x1="192" y1="80" x2="424" y2="190" marker-end="url(#uvarr)" /><line x1="192" y1="130" x2="424" y2="198" marker-end="url(#uvarr)" /><line x1="192" y1="180" x2="424" y2="206" marker-end="url(#uvarr)" /><line x1="192" y1="230" x2="424" y2="214" marker-end="url(#uvarr)" /><line x1="192" y1="280" x2="424" y2="222" marker-end="url(#uvarr)" /><line x1="192" y1="330" x2="424" y2="230" marker-end="url(#uvarr)" /></g><g><rect x="36" y="60" width="156" height="40" rx="7" fill="#f7fafc" stroke="#cbd5e0" /><text x="50" y="78" font-size="12.5" font-weight="700" fill="#2d3748">pip</text><text x="50" y="93" font-size="10" fill="#718096">install packages</text><rect x="36" y="110" width="156" height="40" rx="7" fill="#f7fafc" stroke="#cbd5e0" /><text x="50" y="128" font-size="12.5" font-weight="700" fill="#2d3748">venv</text><text x="50" y="143" font-size="10" fill="#718096">environments</text><rect x="36" y="160" width="156" height="40" rx="7" fill="#f7fafc" stroke="#cbd5e0" /><text x="50" y="178" font-size="12.5" font-weight="700" fill="#2d3748">pyenv</text><text x="50" y="193" font-size="10" fill="#718096">Python versions</text><rect x="36" y="210" width="156" height="40" rx="7" fill="#f7fafc" stroke="#cbd5e0" /><text x="50" y="228" font-size="12.5" font-weight="700" fill="#2d3748">pip-tools</text><text x="50" y="243" font-size="10" fill="#718096">lock dependencies</text><rect x="36" y="260" width="156" height="40" rx="7" fill="#f7fafc" stroke="#cbd5e0" /><text x="50" y="278" font-size="12.5" font-weight="700" fill="#2d3748">pipx</text><text x="50" y="293" font-size="10" fill="#718096">run tools</text><rect x="36" y="310" width="156" height="40" rx="7" fill="#f7fafc" stroke="#cbd5e0" /><text x="50" y="328" font-size="12.5" font-weight="700" fill="#2d3748">build / twine</text><text x="50" y="343" font-size="10" fill="#718096">package and upload</text></g><rect x="426" y="90" width="180" height="232" rx="12" fill="#d6e8f7" stroke="#0067c0" stroke-width="2.5" /><text x="516" y="128" text-anchor="middle" font-size="30" font-weight="800" fill="#0a3d62">uv</text><text x="516" y="148" text-anchor="middle" font-size="10.5" fill="#2b6cb0">one fast tool</text><g font-size="11.5" fill="#0a3d62"><text x="448" y="178">install + resolve</text><text x="448" y="202">virtual environments</text><text x="448" y="226">Python versions</text><text x="448" y="250">lockfiles (uv.lock)</text><text x="448" y="274">run tools (uvx)</text><text x="448" y="298">build and publish</text></g></svg>