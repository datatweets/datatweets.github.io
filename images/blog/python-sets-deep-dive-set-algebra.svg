<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Venn diagram of support_perms and sales_perms showing union, intersection, and difference</title><desc id="desc">Two overlapping circles labeled support underscore perms and sales underscore perms. The support-only region on the left lists read underscore tickets and reply underscore tickets. The shared region in the middle lists read underscore dashboard and read underscore reports. The sales-only region on the right lists read underscore deals and edit underscore deals. Together the two circles hold six permissions, matching the post's verified union, intersection, and difference output.</desc><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="330" y="60" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">SUPPORT_PERMS</text><text x="870" y="60" font-size="26" font-weight="600" fill="#c9752c" text-anchor="middle">SALES_PERMS</text></g><circle cx="430" cy="300" r="210" fill="#e3f0fa" fill-opacity="0.85" /><circle cx="770" cy="300" r="210" fill="#fdeede" fill-opacity="0.85" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19"><rect x="215" y="255" width="150" height="40" rx="10" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="290" y="281" text-anchor="middle" fill="#1b1f24">read_tickets</text><rect x="215" y="320" width="150" height="40" rx="10" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="290" y="346" text-anchor="middle" fill="#1b1f24">reply_tickets</text><rect x="525" y="255" width="160" height="40" rx="10" fill="#ffffff" stroke="#1b1f24" stroke-width="3" /><text x="605" y="281" text-anchor="middle" fill="#1b1f24">read_dashboard</text><rect x="525" y="320" width="160" height="40" rx="10" fill="#ffffff" stroke="#1b1f24" stroke-width="3" /><text x="605" y="346" text-anchor="middle" fill="#1b1f24">read_reports</text><rect x="845" y="255" width="150" height="40" rx="10" fill="#ffffff" stroke="#c9752c" stroke-width="3" /><text x="920" y="281" text-anchor="middle" fill="#1b1f24">read_deals</text><rect x="845" y="320" width="150" height="40" rx="10" fill="#ffffff" stroke="#c9752c" stroke-width="3" /><text x="920" y="346" text-anchor="middle" fill="#1b1f24">edit_deals</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#59636e" text-anchor="middle"><text x="290" y="470">support - sales (2)</text><text x="605" y="470">support &amp; sales (2)</text><text x="920" y="470">sales - support (2)</text></g><text x="600" y="530" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#0067c0" text-anchor="middle">union: 6 permissions total</text></svg>
