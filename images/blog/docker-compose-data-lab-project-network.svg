<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">A Docker Compose project with two services on one network</title><desc id="desc">Diagram of a Docker Compose project boundary containing two containers, db and loader, joined by an internal network so loader can reach db by the hostname db. The db container connects down to a named volume called pgdata that holds its data files. The loader container connects down to a read-only mounted host folder called data. A host machine arrow labeled port 5433 to 5432 reaches the db container from outside the project boundary.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="130" y="90" width="960" height="330" rx="24" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="610" y="128" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">COMPOSE PROJECT (private network)</text><rect x="190" y="170" width="300" height="140" rx="16" fill="#e3f0fa" stroke="#c7ccd2" stroke-width="3" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="340" y="222" font-size="24" font-weight="600" fill="#1b1f24" text-anchor="middle">db</text><text x="340" y="252" font-size="17" fill="#59636e" text-anchor="middle">postgres:16-alpine</text></g><rect x="710" y="170" width="300" height="140" rx="16" fill="#e6f4e6" stroke="#c7ccd2" stroke-width="3" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="860" y="222" font-size="24" font-weight="600" fill="#1b1f24" text-anchor="middle">loader</text><text x="860" y="252" font-size="17" fill="#59636e" text-anchor="middle">python:3.12-slim</text></g><path d="M490 240H710" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M710 240L692 228M710 240L692 252" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="222" font-size="19" font-weight="600" fill="#0067c0" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">loader &#8594; db:5432</text><rect x="215" y="360" width="250" height="50" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="3" stroke-dasharray="6 5" /><text x="340" y="391" font-size="18" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e" text-anchor="middle">pgdata (named volume)</text><path d="M340 310V360" fill="none" stroke="#59636e" stroke-width="4" stroke-linecap="round" /><rect x="735" y="360" width="250" height="50" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="3" stroke-dasharray="6 5" /><text x="860" y="391" font-size="18" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e" text-anchor="middle">./data (read-only)</text><path d="M860 310V360" fill="none" stroke="#59636e" stroke-width="4" stroke-linecap="round" /><rect x="20" y="205" width="160" height="70" rx="14" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="100" y="234" font-size="18" font-weight="600" fill="#59636e" text-anchor="middle">host machine</text><text x="100" y="258" font-size="16" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e" text-anchor="middle">localhost:5433</text><path d="M182 240H190" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M190 240L172 228M190 240L172 252" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="100" y="196" font-size="17" font-weight="600" fill="#0067c0" text-anchor="middle">5433 &#8594; 5432</text></g></svg>
