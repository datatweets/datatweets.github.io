<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Diagnose Neural Network Overfitting with Learning Curves</title>
  <desc id="desc">Tutorial thumbnail with the headline Catch Overfitting and a learning-curve chart. Training error keeps falling while validation error reaches its lowest point at epoch 54 and then rises, marking the best checkpoint.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1.5" fill="#59636e">LEARNING CURVES</text>
    <text x="90" y="285" font-size="82" font-weight="700" fill="#1b1f24">CATCH</text>
    <text x="90" y="382" font-size="82" font-weight="700" fill="#1b1f24">OVERFITTING</text>
    <rect x="94" y="418" width="390" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="496" font-size="27" font-weight="500" fill="#59636e">TRAIN &#183; VALIDATE &#183; CHECKPOINT</text>

    <g>
      <rect x="700" y="112" width="420" height="448" rx="22" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="738" y="160" font-size="24" font-weight="650" letter-spacing="1" fill="#1b1f24">ERROR BY EPOCH</text>

      <line x1="740" y1="194" x2="770" y2="194" stroke="#0067c0" stroke-width="5" stroke-linecap="round"/>
      <text x="781" y="201" font-size="17" font-weight="600" fill="#59636e">TRAIN</text>
      <line x1="891" y1="194" x2="921" y2="194" stroke="#d1495b" stroke-width="5" stroke-linecap="round"/>
      <text x="932" y="201" font-size="17" font-weight="600" fill="#59636e">VALIDATION</text>

      <line x1="760" y1="231" x2="760" y2="455" stroke="#9aa3ac" stroke-width="2"/>
      <line x1="760" y1="455" x2="1082" y2="455" stroke="#9aa3ac" stroke-width="2"/>
      <text x="734" y="248" font-size="16" font-weight="600" fill="#59636e">RMSE</text>
      <text x="1016" y="483" font-size="16" font-weight="600" fill="#59636e">EPOCH</text>

      <line x1="922" y1="231" x2="922" y2="455" stroke="#2e7d32" stroke-width="2" stroke-dasharray="7 7"/>
      <polyline points="776,251 818,306 860,344 902,370 944,390 998,414 1070,438" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="776,260 818,319 860,360 902,386 922,392 944,389 986,365 1028,335 1070,305" fill="none" stroke="#d1495b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="922" cy="392" r="9" fill="#ffffff" stroke="#2e7d32" stroke-width="5"/>

      <rect x="856" y="500" width="132" height="34" rx="17" fill="#e8f3e9"/>
      <text x="922" y="523" text-anchor="middle" font-size="17" font-weight="700" fill="#2e7d32">BEST: 54</text>
    </g>
  </g>
</svg>
