<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Build a Multi-Agent Workflow in Python with Clear Handoffs</title>
  <desc id="desc">A DATATWEETS tutorial thumbnail showing a Python supervisor routing typed state through intake, policy, and decision agents, with invalid input stopping after intake.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>
  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1.5" fill="#59636e">PYTHON ORCHESTRATION</text>
    <text x="90" y="286" font-size="88" font-weight="700" fill="#1b1f24">TYPED</text>
    <text x="90" y="390" font-size="88" font-weight="700" fill="#1b1f24">HANDOFFS</text>
    <rect x="96" y="424" width="392" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="505" font-size="30" font-weight="500" fill="#59636e">STATE · ROUTES · TRACES</text>

    <g transform="translate(650 126)">
      <text x="185" y="0" text-anchor="middle" font-size="22" font-weight="600" fill="#59636e">SUPERVISOR</text>
      <rect x="110" y="18" width="150" height="48" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
      <text x="185" y="50" text-anchor="middle" font-size="21" font-weight="600" fill="#1b1f24">owns the route</text>

      <line x1="185" y1="66" x2="185" y2="105" stroke="#0067c0" stroke-width="3"/>
      <line x1="55" y1="105" x2="315" y2="105" stroke="#0067c0" stroke-width="3"/>
      <line x1="55" y1="105" x2="55" y2="138" stroke="#0067c0" stroke-width="3"/>
      <line x1="185" y1="105" x2="185" y2="138" stroke="#0067c0" stroke-width="3"/>
      <line x1="315" y1="105" x2="315" y2="138" stroke="#0067c0" stroke-width="3"/>

      <rect x="0" y="138" width="110" height="76" rx="14" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
      <rect x="130" y="138" width="110" height="76" rx="14" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
      <rect x="260" y="138" width="110" height="76" rx="14" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
      <text x="55" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1f24">INTAKE</text>
      <text x="55" y="198" text-anchor="middle" font-size="16" fill="#59636e">normalize</text>
      <text x="185" y="172" text-anchor="middle" font-size="21" font-weight="700" fill="#1b1f24">POLICY</text>
      <text x="185" y="198" text-anchor="middle" font-size="17" fill="#59636e">check rules</text>
      <text x="315" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1f24">DECIDE</text>
      <text x="315" y="198" text-anchor="middle" font-size="16" fill="#59636e">set status</text>

      <line x1="110" y1="176" x2="130" y2="176" stroke="#0067c0" stroke-width="4"/>
      <line x1="122" y1="169" x2="130" y2="176" stroke="#0067c0" stroke-width="3"/>
      <line x1="122" y1="183" x2="130" y2="176" stroke="#0067c0" stroke-width="3"/>
      <line x1="240" y1="176" x2="260" y2="176" stroke="#0067c0" stroke-width="4"/>
      <line x1="252" y1="169" x2="260" y2="176" stroke="#0067c0" stroke-width="3"/>
      <line x1="252" y1="183" x2="260" y2="176" stroke="#0067c0" stroke-width="3"/>

      <line x1="55" y1="214" x2="55" y2="288" stroke="#c84b31" stroke-width="3"/>
      <line x1="48" y1="278" x2="55" y2="288" stroke="#c84b31" stroke-width="3"/>
      <line x1="62" y1="278" x2="55" y2="288" stroke="#c84b31" stroke-width="3"/>
      <rect x="0" y="291" width="110" height="54" rx="12" fill="#fff5f2" stroke="#c84b31" stroke-width="2"/>
      <text x="55" y="325" text-anchor="middle" font-size="17" font-weight="600" fill="#8f321f">INVALID: STOP</text>

      <line x1="315" y1="214" x2="315" y2="288" stroke="#0067c0" stroke-width="3"/>
      <line x1="308" y1="278" x2="315" y2="288" stroke="#0067c0" stroke-width="3"/>
      <line x1="322" y1="278" x2="315" y2="288" stroke="#0067c0" stroke-width="3"/>
      <rect x="260" y="291" width="110" height="54" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
      <text x="315" y="325" text-anchor="middle" font-size="17" font-weight="600" fill="#004f93">FINAL STATUS</text>

      <text x="185" y="406" text-anchor="middle" font-size="18" font-weight="500" fill="#59636e">one typed state · one visible trace</text>
    </g>
  </g>
</svg>
