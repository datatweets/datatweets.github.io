<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Your data science environment in a box</title><desc id="desc">A diagram of a host machine containing a Docker container boundary. Inside the container are stacked layers for the operating system, Python, and data science libraries plus Jupyter. A volume mount arrow connects a notebooks folder on the host, outside the container, to a work folder inside the container, so files written in Jupyter land on the host and survive the container being removed. A browser on the host reaches the container's Jupyter server through a mapped port.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="50" y="70" width="1100" height="430" rx="20" fill="#ffffff" stroke="#c7ccd2" stroke-width="2" stroke-dasharray="10 8" /><text x="90" y="112" font-size="26" font-weight="600" fill="#59636e">HOST MACHINE</text><rect x="330" y="150" width="520" height="330" rx="24" fill="#f7f8fa" stroke="#0067c0" stroke-width="4" /><text x="590" y="190" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">CONTAINER</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="22"><rect x="366" y="214" width="448" height="54" rx="10" fill="#e3f0fa" /><text x="590" y="249" fill="#1b1f24" text-anchor="middle">operating system (Ubuntu)</text><rect x="366" y="280" width="448" height="54" rx="10" fill="#e6f4e6" /><text x="590" y="315" fill="#1b1f24" text-anchor="middle">Python 3.x + conda environment</text><rect x="366" y="346" width="448" height="54" rx="10" fill="#fdeede" /><text x="590" y="381" fill="#1b1f24" text-anchor="middle">pandas, numpy, scikit-learn, Jupyter</text></g><rect x="470" y="414" width="240" height="46" rx="10" fill="#ffffff" stroke="#0067c0" stroke-width="3" stroke-dasharray="6 5" /><text x="590" y="443" font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0067c0" text-anchor="middle">/home/jovyan/work</text><rect x="90" y="414" width="200" height="46" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="3" /><text x="190" y="443" font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e" text-anchor="middle">./notebooks</text><path d="M290 437H470" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M290 437L308 425M290 437L308 449" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M470 437L452 425M470 437L452 449" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="380" y="405" font-size="18" font-weight="600" fill="#0067c0" text-anchor="middle">-v mount</text><g><rect x="900" y="214" width="200" height="70" rx="14" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="1000" y="242" font-size="18" font-weight="600" fill="#59636e" text-anchor="middle">your browser</text><text x="1000" y="266" font-size="16" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e" text-anchor="middle">localhost:8888</text><path d="M898 249H852" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M852 249L868 237M852 249L868 261" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g></g></svg>