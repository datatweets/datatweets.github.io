<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Transformations build a lazy plan; an action executes it across partitions</title><desc id="desc">Diagram showing that transformations such as select, filter, and withColumn only extend Spark's lazy execution plan without running anything, while an action such as show, collect, or count triggers Spark to execute the whole plan across partitions and return a result to the driver.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="230" y="66" font-size="28" font-weight="600" fill="#59636e" text-anchor="middle">TRANSFORMATIONS — BUILD THE PLAN</text><text x="700" y="66" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">ACTION — RUN THE PLAN</text><text x="1060" y="66" font-size="28" font-weight="600" fill="#59636e" text-anchor="middle">DRIVER</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="22"><rect x="40" y="110" width="150" height="58" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="115" y="146" fill="#1b1f24" text-anchor="middle">select()</text><path d="M190 139H236" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 8" /><rect x="236" y="110" width="150" height="58" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="311" y="146" fill="#1b1f24" text-anchor="middle">filter()</text><path d="M386 139H432" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 8" /><rect x="432" y="110" width="160" height="58" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="512" y="146" fill="#1b1f24" text-anchor="middle">withColumn()</text></g><text x="315" y="204" font-size="20" fill="#59636e" text-anchor="middle">each call returns instantly — no rows read yet</text><path d="M592 139C630 139 630 139 660 139" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><rect x="660" y="106" width="150" height="66" rx="14" fill="#0067c0" /><text x="735" y="147" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24" fill="#ffffff" text-anchor="middle">show()</text><path d="M810 139C850 139 850 269 890 269" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><path d="M810 139C850 139 850 349 890 349" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><path d="M810 139C850 139 850 429 890 429" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19"><rect x="890" y="240" width="130" height="58" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="955" y="275" fill="#1b1f24" text-anchor="middle">partition 0</text><rect x="890" y="320" width="130" height="58" rx="12" fill="#e6f4e6" stroke="#8fbc8f" stroke-width="3" /><text x="955" y="355" fill="#1b1f24" text-anchor="middle">partition 1</text><rect x="890" y="400" width="130" height="58" rx="12" fill="#fdeede" stroke="#e0b184" stroke-width="3" /><text x="955" y="435" fill="#1b1f24" text-anchor="middle">partition 2</text></g><text x="955" y="490" font-size="20" fill="#59636e" text-anchor="middle">processed in parallel, on threads or executors</text><path d="M1020 269C1060 269 1060 330 1090 330" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><path d="M1020 349H1090" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><path d="M1020 429C1060 429 1060 330 1090 330" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><rect x="1090" y="300" width="90" height="60" rx="12" fill="#ffffff" stroke="#1b1f24" stroke-width="3" /><text x="1135" y="336" font-size="20" fill="#1b1f24" text-anchor="middle">result</text></g></svg>