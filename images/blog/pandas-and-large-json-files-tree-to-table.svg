<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Flattening a nested JSON tree into a pandas DataFrame</title><desc id="desc">Diagram showing a nested JSON tree being flattened into a DataFrame: a top-level order id becomes a plain column, a nested customer object becomes dot-notation columns like customer.name, and a nested list of item objects becomes multiple rows with the order's own fields repeated onto each one.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="180" y="56" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">NESTED JSON</text><text x="600" y="56" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">JSON_NORMALIZE</text><text x="1000" y="56" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">FLAT ROWS</text><rect x="50" y="90" width="260" height="400" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19"><text x="70" y="126" fill="#59636e">{</text><text x="88" y="154" fill="#1b1f24">"order_id":</text><text x="88" y="180" fill="#59636e">"ORD-1042",</text><rect x="70" y="196" width="220" height="90" rx="10" fill="#e3f0fa" /><text x="88" y="220" fill="#1b1f24">"customer": {</text><text x="104" y="246" fill="#59636e">"name": "Freya..",</text><text x="104" y="270" fill="#59636e">"city": "Utrecht" }</text><rect x="70" y="296" width="220" height="164" rx="10" fill="#fdeede" /><text x="88" y="320" fill="#1b1f24">"items": [</text><text x="104" y="346" fill="#59636e">{"sku":"BK-021",</text><text x="112" y="368" fill="#59636e">"qty": 2},</text><text x="104" y="394" fill="#59636e">{"sku":"BK-114",</text><text x="112" y="416" fill="#59636e">"qty": 1} ]</text><text x="70" y="444" fill="#59636e">}</text></g><path d="M310 130C400 130 400 260 460 260" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M310 240C400 240 400 260 460 260" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M310 378C400 378 400 260 460 260" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><rect x="464" y="200" width="272" height="120" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18"><text x="484" y="234" fill="#1b1f24">record_path=</text><text x="500" y="258" fill="#0067c0">"items"</text><text x="484" y="288" fill="#1b1f24">meta=[order_id,</text><text x="500" y="310" fill="#0067c0">customer.name, ..]</text></g><path d="M736 260H796" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M780 244L796 260L780 276" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="810" y="120" width="340" height="240" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="16"><text x="826" y="150" font-weight="600" fill="#59636e">order_id   sku     qty  customer.city</text><rect x="826" y="164" width="308" height="26" rx="6" fill="#e3f0fa" /><text x="836" y="182" fill="#1b1f24">ORD-1042  BK-021   2   Utrecht</text><rect x="826" y="196" width="308" height="26" rx="6" fill="#e3f0fa" /><text x="836" y="214" fill="#1b1f24">ORD-1042  BK-114   1   Utrecht</text><rect x="826" y="228" width="308" height="26" rx="6" fill="#fdeede" /><text x="836" y="246" fill="#1b1f24">ORD-1043  BK-057   1   Leuven</text><rect x="826" y="260" width="308" height="26" rx="6" fill="#f0f2f4" /><text x="836" y="278" fill="#59636e">…         …      …   …</text></g><text x="980" y="392" font-size="19" fill="#59636e" text-anchor="middle">order_id repeats onto every item row</text></g></svg>