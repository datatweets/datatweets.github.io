<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Throughput of three ways to load 8,000 rows into PostgreSQL</title><desc id="desc">Bar chart comparing rows loaded per second for three psycopg2 methods loading the same 8,000-row CSV into PostgreSQL: row-by-row INSERT reached 28,323 rows per second (0.282 seconds total), execute_values batched INSERT reached 78,768 rows per second (0.102 seconds total), and copy_expert COPY reached 210,639 rows per second (0.038 seconds total), making COPY about 7.4 times faster than row-by-row INSERT.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="600" y="56" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">LOADING 8,000 ROWS INTO POSTGRESQL</text><text x="600" y="90" font-size="20" font-weight="500" fill="#59636e" text-anchor="middle">rows per second, by method · verified psycopg2 2.9.12 / PostgreSQL 14.16 run</text><path d="M110 460H1090" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" /><rect x="180" y="415" width="220" height="45" rx="8" fill="#fdeede" stroke="#59636e" stroke-width="3" /><text x="290" y="398" font-size="26" font-weight="600" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">28,323/s</text><text x="290" y="500" font-size="22" font-weight="600" fill="#59636e" text-anchor="middle">ROW-BY-ROW INSERT</text><text x="290" y="528" font-size="19" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">0.282s total</text><rect x="490" y="336" width="220" height="124" rx="8" fill="#9dbfdd" stroke="#0067c0" stroke-width="3" /><text x="600" y="319" font-size="26" font-weight="600" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">78,768/s</text><text x="600" y="500" font-size="22" font-weight="600" fill="#0067c0" text-anchor="middle">EXECUTE_VALUES</text><text x="600" y="528" font-size="19" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">0.102s total</text><rect x="800" y="128" width="220" height="332" rx="8" fill="#0067c0" stroke="#0067c0" stroke-width="3" /><text x="910" y="111" font-size="26" font-weight="600" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">210,639/s</text><text x="910" y="500" font-size="22" font-weight="600" fill="#0067c0" text-anchor="middle">COPY_EXPERT</text><text x="910" y="528" font-size="19" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">0.038s total</text></g></svg>