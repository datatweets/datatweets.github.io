<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Row counts for the four Pandas merge how= values</title><desc id="desc">Four small diagrams showing inner, left, right, and outer joins between an orders table and a customers table, each labeled with the resulting row count from the post's example: 60 for inner, 63 for left, 61 for right, and 64 for outer.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><g transform="translate(60 90)"><text x="110" y="-30" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">INNER</text><rect x="0" y="0" width="70" height="150" rx="10" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><rect x="70" y="0" width="70" height="150" fill="#0067c0" stroke="#0067c0" stroke-width="3" /><rect x="140" y="0" width="70" height="150" rx="10" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="35" y="180" font-size="19" fill="#59636e" text-anchor="middle">orders</text><text x="175" y="180" font-size="19" fill="#59636e" text-anchor="middle">customers</text><text x="105" y="222" font-size="34" font-weight="700" fill="#1b1f24" text-anchor="middle">60</text><text x="105" y="250" font-size="19" fill="#59636e" text-anchor="middle">rows</text></g><g transform="translate(360 90)"><text x="110" y="-30" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">LEFT</text><rect x="0" y="0" width="70" height="150" rx="10" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><rect x="70" y="0" width="70" height="150" fill="#0067c0" stroke="#0067c0" stroke-width="3" /><rect x="140" y="0" width="70" height="150" rx="10" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="35" y="180" font-size="19" fill="#59636e" text-anchor="middle">orders</text><text x="175" y="180" font-size="19" fill="#59636e" text-anchor="middle">customers</text><text x="105" y="222" font-size="34" font-weight="700" fill="#1b1f24" text-anchor="middle">63</text><text x="105" y="250" font-size="19" fill="#59636e" text-anchor="middle">rows</text></g><g transform="translate(660 90)"><text x="110" y="-30" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">RIGHT</text><rect x="0" y="0" width="70" height="150" rx="10" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><rect x="70" y="0" width="70" height="150" fill="#0067c0" stroke="#0067c0" stroke-width="3" /><rect x="140" y="0" width="70" height="150" rx="10" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="35" y="180" font-size="19" fill="#59636e" text-anchor="middle">orders</text><text x="175" y="180" font-size="19" fill="#59636e" text-anchor="middle">customers</text><text x="105" y="222" font-size="34" font-weight="700" fill="#1b1f24" text-anchor="middle">61</text><text x="105" y="250" font-size="19" fill="#59636e" text-anchor="middle">rows</text></g><g transform="translate(960 90)"><text x="110" y="-30" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">OUTER</text><rect x="0" y="0" width="70" height="150" rx="10" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><rect x="70" y="0" width="70" height="150" fill="#0067c0" stroke="#0067c0" stroke-width="3" /><rect x="140" y="0" width="70" height="150" rx="10" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="35" y="180" font-size="19" fill="#59636e" text-anchor="middle">orders</text><text x="175" y="180" font-size="19" fill="#59636e" text-anchor="middle">customers</text><text x="105" y="222" font-size="34" font-weight="700" fill="#1b1f24" text-anchor="middle">64</text><text x="105" y="250" font-size="19" fill="#59636e" text-anchor="middle">rows</text></g><text x="600" y="410" font-size="21" fill="#59636e" text-anchor="middle">Middle band = rows matched on both sides. Side bands = rows kept only because how= says to keep them.</text></g></svg>
