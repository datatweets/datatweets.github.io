<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Calibrate gradient boosting probabilities in Python</title>
  <desc id="desc">Thumbnail for a tutorial about calibrating gradient boosting probabilities. A reliability diagram shows raw probability estimates moving toward the diagonal where mean predicted probabilities match observed event rates.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>
