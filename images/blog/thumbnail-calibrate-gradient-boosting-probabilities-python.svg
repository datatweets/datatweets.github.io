    <text x="90" y="292" font-size="78" font-weight="700" fill="#1b1f24">Calibrate</text>
    <text x="90" y="374" font-size="78" font-weight="700" fill="#1b1f24">probabilities</text>
    <rect x="96" y="405" width="430" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="486" font-size="31" font-weight="500" fill="#59636e">reliability · Brier loss · sigmoid</text>
  </g>
