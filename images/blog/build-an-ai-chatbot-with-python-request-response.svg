<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">One chat-completion round trip and the growing messages list</title><desc id="desc">Diagram showing one chat-completion round trip: a growing messages list containing a system role, two user turns, and one assistant turn is sent to the API, which returns a single new assistant message that gets appended back onto the list before the next call.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="230" y="66" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">YOUR MESSAGES LIST</text><text x="640" y="66" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">CHAT-COMPLETION API</text><text x="1030" y="66" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">APPEND REPLY</text><rect x="60" y="100" width="340" height="340" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-size="20" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="80" y="120" width="300" height="42" rx="8" fill="#fdeede" /><text x="94" y="147" fill="#1b1f24">system: persona</text><rect x="80" y="172" width="300" height="42" rx="8" fill="#e3f0fa" /><text x="94" y="199" fill="#1b1f24">user: "any Le Guin?"</text><rect x="80" y="224" width="300" height="42" rx="8" fill="#e6f4e6" /><text x="94" y="251" fill="#1b1f24">assistant: "yes, ..."</text><rect x="80" y="276" width="300" height="42" rx="8" fill="#e3f0fa" /><text x="94" y="303" fill="#1b1f24">user: "how much?"</text><rect x="80" y="328" width="300" height="42" rx="8" fill="#d0d5db" opacity="0.5" /><text x="94" y="355" fill="#59636e">+ next reply appended here</text></g><path d="M410 270H560" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M548 258L562 270L548 282" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><text x="485" y="248" font-size="18" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">.create(messages=...)</text><rect x="570" y="210" width="200" height="120" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="670" y="260" font-size="22" font-weight="600" fill="#0067c0" text-anchor="middle">stateless</text><text x="670" y="288" font-size="22" font-weight="600" fill="#0067c0" text-anchor="middle">model call</text><path d="M780 270H930" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M918 258L932 270L918 282" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><text x="855" y="248" font-size="18" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">choices[0].message</text><rect x="940" y="230" width="200" height="80" rx="16" fill="#e6f4e6" stroke="#8fbc8f" stroke-width="3" /><text x="1040" y="266" font-size="19" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">assistant:</text><text x="1040" y="292" font-size="19" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">"14.50 euros"</text><path d="M1040 320C1040 460 230 460 230 450" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M242 460L228 450L242 440" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="640" y="500" font-size="20" fill="#59636e" text-anchor="middle">appended back onto the list, then resent whole on the next turn</text></g></svg>