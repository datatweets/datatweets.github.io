<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Tune model accuracy and speed with GridSearchCV</title>
  <desc id="desc">A DATATWEETS tutorial thumbnail. On the left, the words Quality First, Then Speed summarize the selection rule. On the right, a three-step diagram narrows 18 grid-search candidates through balanced-accuracy and recall requirements to a selected 20-tree model.</desc>

  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="148" font-size="32" font-weight="600" letter-spacing="1.5" fill="#59636e">MODEL SELECTION RULE</text>
    <text x="90" y="277" font-size="80" font-weight="700" fill="#1b1f24">QUALITY FIRST</text>
    <text x="90" y="374" font-size="80" font-weight="700" fill="#1b1f24">THEN SPEED</text>
    <rect x="96" y="414" width="350" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="494" font-size="27" font-weight="500" fill="#59636e">GRID SEARCH &#183; REFIT &#183; TIMING</text>

    <g transform="translate(724 104)">
      <line x1="42" y1="105" x2="42" y2="161" stroke="#c7ccd2" stroke-width="3"/>
      <path d="M 35 151 L 42 161 L 49 151" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="42" y1="306" x2="42" y2="362" stroke="#c7ccd2" stroke-width="3"/>
      <path d="M 35 352 L 42 362 L 49 352" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="0" y="0" width="360" height="105" rx="18" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <circle cx="42" cy="52" r="22" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
      <text x="42" y="60" text-anchor="middle" font-size="23" font-weight="700" fill="#0067c0">1</text>
      <text x="82" y="45" font-size="22" font-weight="600" fill="#1b1f24">GRID SEARCH</text>
      <text x="82" y="76" font-size="20" font-weight="500" fill="#59636e">18 CANDIDATES</text>

      <rect x="0" y="161" width="360" height="145" rx="18" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>
      <circle cx="42" cy="213" r="22" fill="#0067c0"/>
      <text x="42" y="221" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">2</text>
      <text x="82" y="205" font-size="22" font-weight="600" fill="#1b1f24">QUALITY GATE</text>
      <text x="82" y="239" font-size="18" font-weight="500" fill="#59636e">BALANCED ACC. &#8805; 0.7398</text>
      <text x="82" y="271" font-size="18" font-weight="500" fill="#59636e">RECALL &#8805; 0.65</text>

      <rect x="0" y="362" width="360" height="105" rx="18" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
      <circle cx="42" cy="414" r="22" fill="#0067c0"/>
      <text x="42" y="422" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">3</text>
      <text x="82" y="407" font-size="22" font-weight="600" fill="#1b1f24">FASTEST ELIGIBLE</text>
      <text x="82" y="438" font-size="20" font-weight="500" fill="#59636e">SELECTED: 20 TREES</text>
    </g>
  </g>
</svg>
