<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Estimate Expected Counts from Probabilities in Python</title>
  <desc id="desc">A DataTweets tutorial thumbnail showing 180 row-level probabilities flowing into a sum of 31.94 expected service cases.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="36" font-weight="600" letter-spacing="1" fill="#59636e">EXPECTED WORKLOAD</text>
    <text x="90" y="294" font-size="86" font-weight="700" fill="#1b1f24">SUM THE</text>
    <text x="90" y="390" font-size="86" font-weight="700" fill="#1b1f24">RISKS</text>
    <rect x="96" y="430" width="360" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="515" font-size="29" font-weight="500" fill="#59636e">VALIDATE &#183; SUM &#183; SIMULATE</text>

    <g transform="translate(695 112)">
      <text x="38" y="20" font-size="22" font-weight="600" letter-spacing="1.2" fill="#59636e">ROW PROBABILITIES</text>

      <rect x="0" y="48" width="224" height="58" rx="14" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="22" y="85" font-size="22" font-weight="600" fill="#59636e">BAT-0001</text>
      <text x="148" y="85" font-size="22" font-weight="700" fill="#0067c0">.0509</text>

      <rect x="0" y="120" width="224" height="58" rx="14" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="22" y="157" font-size="22" font-weight="600" fill="#59636e">BAT-0002</text>
      <text x="148" y="157" font-size="22" font-weight="700" fill="#0067c0">.1881</text>

      <rect x="0" y="192" width="224" height="58" rx="14" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="22" y="229" font-size="22" font-weight="600" fill="#59636e">BAT-0003</text>
      <text x="148" y="229" font-size="22" font-weight="700" fill="#0067c0">.1563</text>

      <line x1="112" y1="263" x2="112" y2="290" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 10"/>
      <rect x="30" y="300" width="164" height="48" rx="24" fill="#e3f0fa"/>
      <text x="112" y="331" text-anchor="middle" font-size="20" font-weight="600" fill="#0067c0">177 MORE ROWS</text>

      <path d="M112 362 V397 C112 411 123 422 137 422 H244" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M234 410 L248 422 L234 434" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="258" y="360" width="192" height="126" rx="22" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>
      <text x="354" y="408" text-anchor="middle" font-size="27" font-weight="700" fill="#0067c0">&#931;p = 31.94</text>
      <text x="354" y="450" text-anchor="middle" font-size="18" font-weight="600" letter-spacing="0.8" fill="#59636e">EXPECTED CASES</text>
    </g>
  </g>
</svg>
