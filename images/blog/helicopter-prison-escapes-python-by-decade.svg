<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Helicopter prison escapes by decade, 1971-2020</title><desc id="desc">Bar chart of the fifty helicopter prison escapes in this dataset grouped by decade: 3 in the 1970s, 14 in the 1980s, 8 in the 1990s, 17 in the 2000s, 7 in the 2010s, and 1 in the 2020s, which this dataset only covers through September.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="600" y="52" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">ESCAPES BY DECADE, 1971&#8211;2020</text><line x1="60" y1="480" x2="1160" y2="480" stroke="#c7ccd2" stroke-width="3" /><g><rect x="80" y="424" width="100" height="56" rx="6" fill="#0067c0" /><rect x="268" y="216" width="100" height="264" rx="6" fill="#0067c0" /><rect x="456" y="329" width="100" height="151" rx="6" fill="#0067c0" /><rect x="644" y="160" width="100" height="320" rx="6" fill="#0067c0" /><rect x="832" y="348" width="100" height="132" rx="6" fill="#0067c0" /><rect x="1020" y="461" width="100" height="19" rx="6" fill="#0067c0" /></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24" fill="#1b1f24" text-anchor="middle"><text x="130" y="410">3</text><text x="318" y="202">14</text><text x="506" y="315">8</text><text x="694" y="146">17</text><text x="882" y="334">7</text><text x="1070" y="447">1</text></g><g font-size="22" fill="#59636e" text-anchor="middle"><text x="130" y="514">1970s</text><text x="318" y="514">1980s</text><text x="506" y="514">1990s</text><text x="694" y="514">2000s</text><text x="882" y="514">2010s</text><text x="1070" y="514">2020s*</text></g><text x="600" y="545" font-size="18" fill="#59636e" text-anchor="middle">*2020s covers only through September 2020, the latest event in this dataset</text></g></svg>
