<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">LSTM Attention vs Final Hidden State: 100% vs 60.6% Accuracy</title>
  <desc id="desc">A DataTweets tutorial thumbnail showing a query for component F assigning the strongest attention weight to the matching stored LSTM state, which then supplies a context vector.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0067c0"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="148" font-size="34" font-weight="600" letter-spacing="1.2" fill="#59636e">LSTM ATTENTION</text>
    <text x="90" y="268" font-size="82" font-weight="700" fill="#1b1f24">RETRIEVE</text>
    <text x="90" y="362" font-size="82" font-weight="700" fill="#1b1f24">THE MATCH</text>
    <rect x="96" y="398" width="386" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="476" font-size="31" font-weight="500" fill="#59636e">keys &#183; query &#183; context</text>
  </g>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="720" y="132" font-size="21" font-weight="600" letter-spacing="1" fill="#59636e">STORED LSTM STATES</text>

    <g font-size="22" font-weight="600" text-anchor="middle">
      <rect x="720" y="160" width="58" height="52" rx="12" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <text x="749" y="194" fill="#59636e">A</text>
      <rect x="720" y="230" width="58" height="52" rx="12" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <text x="749" y="264" fill="#59636e">C</text>
      <rect x="720" y="300" width="58" height="52" rx="12" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <text x="749" y="334" fill="#59636e">J</text>
      <rect x="720" y="370" width="58" height="52" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
      <text x="749" y="404" fill="#0067c0">F</text>
    </g>

    <g>
      <rect x="798" y="175" width="42" height="20" rx="10" fill="#d9dde2"/>
      <rect x="798" y="245" width="30" height="20" rx="10" fill="#d9dde2"/>
      <rect x="798" y="315" width="50" height="20" rx="10" fill="#d9dde2"/>
      <rect x="798" y="385" width="142" height="20" rx="10" fill="#0067c0"/>
    </g>

    <rect x="974" y="294" width="132" height="66" rx="18" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>
    <text x="1040" y="321" text-anchor="middle" font-size="17" font-weight="600" fill="#59636e">QUERY</text>
    <text x="1040" y="346" text-anchor="middle" font-size="25" font-weight="700" fill="#0067c0">F</text>
    <path d="M 984 360 C 973 371, 958 385, 946 394" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

    <path d="M 868 418 L 868 468" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="776" y="482" width="184" height="62" rx="18" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
    <text x="868" y="509" text-anchor="middle" font-size="17" font-weight="600" fill="#59636e">WEIGHTED</text>
    <text x="868" y="533" text-anchor="middle" font-size="22" font-weight="700" fill="#1b1f24">CONTEXT</text>

    <text x="720" y="582" font-size="18" font-weight="500" fill="#59636e">The query gives F the strongest weight.</text>
  </g>
</svg>
