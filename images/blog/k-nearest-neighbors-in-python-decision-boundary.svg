<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Decision boundary at k=1 versus k=15</title><desc id="desc">Decision boundary diagram comparing k=1 and k=15 for a KNeighborsClassifier trained on mean radius and mean texture from the breast cancer dataset: k=1 produces a jagged boundary that classifies 63.0 percent of the plotted region as malignant and scores 0.842 test accuracy, while k=15 produces a smoother boundary classifying 56.8 percent of the region as malignant and scores 0.877 test accuracy.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="60" y="56" font-size="26" font-weight="600" fill="#0067c0">K = 1 &#8212; JAGGED BOUNDARY</text><text x="640" y="56" font-size="26" font-weight="600" fill="#0067c0">K = 15 &#8212; SMOOTHER BOUNDARY</text></g><g transform="translate(60 84)"><clipPath id="panel1"><rect x="0" y="0" width="480" height="380" rx="16" /></clipPath><rect x="0" y="0" width="480" height="380" rx="16" fill="#e3f0fa" stroke="#c7ccd2" stroke-width="2" /><g clip-path="url(#panel1)"><path d="M0,0 L60,0 L60,40 L90,40 L90,10 L130,10 L130,55 L110,55 L110,90 L150,90 L150,60 L190,60 L190,100 L160,100 L160,140 L200,140 L200,110 L240,110 L240,150 L210,150 L210,190 L250,190 L250,160 L290,160 L290,200 L260,200 L260,240 L300,240 L300,210 L330,210 L330,250 L305,250 L305,290 L340,290 L340,260 L370,260 L370,300 L345,300 L345,340 L380,340 L380,310 L400,310 L400,380 L0,380 Z" fill="#fdeede" /></g><rect x="0" y="0" width="480" height="380" rx="16" fill="none" stroke="#c7ccd2" stroke-width="2" /><circle cx="70" cy="60" r="10" fill="#fdeede" stroke="#59636e" stroke-width="2.5" /><circle cx="140" cy="40" r="10" fill="#fdeede" stroke="#59636e" stroke-width="2.5" /><circle cx="220" cy="90" r="10" fill="#fdeede" stroke="#59636e" stroke-width="2.5" /><circle cx="180" cy="180" r="10" fill="#fdeede" stroke="#596