<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Fit a Poisson Distribution to Count Data in Python</title>
  <desc id="desc">A DataTweets tutorial thumbnail. The left side says Fit the rate, Check the fit. On the right, three operating periods with fitted rates of 1.27, 4.62, and 1.87 point to a pooled rate of 2.59, where the variance is greater than the mean.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1.5" fill="#59636e">POISSON COUNTS</text>
    <text x="90" y="279" font-size="76" font-weight="700" fill="#1b1f24">FIT THE RATE</text>
    <text x="90" y="378" font-size="76" font-weight="700" fill="#1b1f24">CHECK THE FIT</text>
    <rect x="94" y="419" width="360" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="500" font-size="29" font-weight="500" fill="#59636e">RATE &#183; VARIANCE &#183; PMF</text>

    <g transform="translate(704 113)">
      <text x="0" y="24" font-size="22" font-weight="700" letter-spacing="1" fill="#59636e">CHECK RATE STABILITY</text>

      <rect x="0" y="52" width="352" height="76" rx="16" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="20" y="82" font-size="18" font-weight="600" fill="#59636e">OPENING</text>
      <text x="20" y="111" font-size="24" font-weight="700" fill="#1b1f24">rate 1.27</text>
      <circle cx="234" cy="90" r="9" fill="#0067c0"/>
      <circle cx="264" cy="90" r="9" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
      <circle cx="294" cy="90" r="9" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>

      <rect x="0" y="144" width="352" height="76" rx="16" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="20" y="174" font-size="18" font-weight="600" fill="#59636e">CLASS CHANGE</text>
      <text x="20" y="203" font-size="24" font-weight="700" fill="#1b1f24">rate 4.62</text>
      <circle cx="234" cy="182" r="9" fill="#0067c0"/>
      <circle cx="264" cy="182" r="9" fill="#0067c0"/>
      <circle cx="294" cy="182" r="9" fill="#0067c0"/>
      <circle cx="324" cy="182" r="9" fill="#0067c0"/>

      <rect x="0" y="236" width="352" height="76" rx="16" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="20" y="266" font-size="18" font-weight="600" fill="#59636e">EVENING</text>
      <text x="20" y="295" font-size="24" font-weight="700" fill="#1b1f24">rate 1.87</text>
      <circle cx="234" cy="274" r="9" fill="#0067c0"/>
      <circle cx="264" cy="274" r="9" fill="#0067c0"/>
      <circle cx="294" cy="274" r="9" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>

      <path d="M 176 328 L 176 354" fill="none" stroke="#8a949e" stroke-width="3" stroke-linecap="round"/>
      <path d="M 168 346 L 176 356 L 184 346" fill="none" stroke="#8a949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="0" y="370" width="352" height="96" rx="18" fill="#fff8f0" stroke="#d9822b" stroke-width="3"/>
      <text x="20" y="405" font-size="19" font-weight="700" fill="#8a4b12">POOLED RATE 2.59</text>
      <text x="20" y="441" font-size="25" font-weight="700" fill="#1b1f24">variance &gt; mean</text>
      <circle cx="310" cy="418" r="19" fill="#ffffff" stroke="#d9822b" stroke-width="3"/>
      <text x="310" y="426" text-anchor="middle" font-size="25" font-weight="700" fill="#d9822b">!</text>
    </g>
  </g>
</svg>
