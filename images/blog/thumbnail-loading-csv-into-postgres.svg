<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Loading CSV data into PostgreSQL thumbnail</title><desc id="desc">A minimal logo-style thumbnail for an article on loading CSV data into PostgreSQL from Python, contrasting the COPY command with row-by-row INSERT.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="140" font-size="38" font-weight="600" fill="#59636e">PostgreSQL from Python</text><text x="90" y="360" font-size="150" font-weight="700" fill="#1b1f24">COPY</text><rect x="100" y="392" width="330" height="12" rx="6" fill="#0067c0" /><text x="98" y="470" font-size="35" font-weight="500" fill="#59636e">vs. row-by-row INSERT</text></g><g transform="translate(792 190)" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><g transform="translate(20 0)"><path d="M0 8L60 8L84 32L84 120L0 120Z" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><path d="M60 8L60 32L84 32Z" fill="#c7e2f5" stroke="#0067c0" stroke-width="2" /><text x="10" y="80" font-size="16" fill="#0067c0">csv</text></g><text x="0" y="150" font-size="18" fill="#59636e" font-family="Jost, sans-serif">orders.csv</text><path d="M62 128L62 210" fill="none" stroke="#0067c0" stroke-width="10" stroke-linecap="round" marker-end="url(#arrowCopy)" /><text x="86" y="175" font-size="17" fill="#0067c0" font-family="Jost, sans-serif">1 command</text><g transform="translate(230 0)"><rect x="0" y="0" width="30" height="24" rx="4" fill="#fdeede" stroke="#59636e" stroke-width="2" /><rect x="0" y="34" width="30" height="24" rx="4" fill="#fdeede" stroke="#59636e" stroke-width="2" /><rect x="0" y="68" width="30" height="24" rx="4" fill="#fdeede" stroke="#59636e" stroke-width="2" /><text x="0" y="112" font-size="16" fill="#59636e" font-family="Jost, sans-serif">row 1..n</text><path d="M15 24L15 210" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#arrowInsert)" /><path d="M15 58L15 210" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#arrowInsert)" /><path d="M15 92L15 210" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#arrowInsert)" /></g><g transform="translate(0 218)"><path d="M0 16C0 7 33 0 65 0C97 0 130 7 130 16V94C130 103 97 110 65 110C33 110 0 103 0 94Z" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><path d="M0 16C0 25 33 32 65 32C97 32 130 25 130 16" fill="none" stroke="#0067c0" stroke-width="3" /></g><text x="0" y="354" font-size="18" fill="#59636e" font-family="Jost, sans-serif">Postgres table</text></g><defs><marker id="arrowCopy" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0067c0" /></marker><marker id="arrowInsert" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c7ccd2" /></marker></defs></svg>