<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Mutating an object versus rebinding a name in Python</title><desc id="desc">Two panels compare what happens to the names x and y that both start out pointing at the same list. In the left panel, calling append adds an item to the one shared list object, so both x and y see the new item because they still point at the same object. In the right panel, reassigning y to y plus a new list creates a brand new second object; y now points at that new three item list while x is unchanged and still points at the original two item list.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="300" y="52" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">MUTATE IN PLACE</text><text x="900" y="52" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">REBIND WITH REASSIGNMENT</text></g><line x1="600" y1="86" x2="600" y2="500" stroke="#d0d5db" stroke-width="2" stroke-dasharray="6 8" /><g transform="translate(60 80)" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="20" y="0" width="70" height="44" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="55" y="29" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">x</text><rect x="150" y="0" width="70" height="44" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="185" y="29" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">y</text><path d="M55 44C55 90 150 90 150 110" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M185 44C185 90 150 90 150 110" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><rect x="30" y="110" width="240" height="164" rx="18" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="21"><rect x="50" y="132" width="200" height="32" rx="8" fill="#e3f0fa" /><text x="64" y="155" fill="#1b1f24">'sword'</text><rect x="50" y="172" width="200" height="32" rx="8" fill="#e3f0fa" /><text x="64" y="195" fill="#1b1f24">'shield'</text><rect x="50" y="212" width="200" height="32" rx="8" fill="#fdeede" stroke="#0067c0" stroke-width="2" stroke-dasharray="5 4" /><text x="64" y="235" fill="#1b1f24">'cleric'</text></g><text x="150" y="308" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="20" fill="#59636e" text-anchor="middle">.append('cleric') runs once</text><text x="150" y="336" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" font-weight="600" fill="#0067c0" text-anchor="middle">id(x) == id(y), still true</text><text x="150" y="366" font-size="19" fill="#59636e" text-anchor="middle">one object, two tags on it &#8212;</text><text x="150" y="392" font-size="19" fill="#59636e" text-anchor="middle">both x and y see 'cleric'</text></g><g transform="translate(660 80)" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="20" y="0" width="70" height="44" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="55" y="29" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">x</text><rect x="150" y="0" width="70" height="44" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="185" y="29" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">y</text><path d="M55 44V110" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M185 44C185 130 330 130 330 150" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><rect x="10" y="110" width="140" height="120" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="80" y="136" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#0067c0" text-anchor="middle">object A</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18"><rect x="26" y="150" width="108" height="28" rx="7" fill="#e3f0fa" /><text x="36" y="170" fill="#1b1f24">'sword'</text><rect x="26" y="184" width="108" height="28" rx="7" fill="#e3f0fa" /><text x="36" y="204" fill="#1b1f24">'shield'</text></g><rect x="220" y="150" width="160" height="150" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="300" y="176" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#0067c0" text-anchor="middle">object B (new)</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18"><rect x="236" y="190" width="128" height="28" rx="7" fill="#e6f4e6" /><text x="246" y="210" fill="#1b1f24">'sword'</text><rect x="236" y="224" width="128" height="28" rx="7" fill="#e6f4e6" /><text x="246" y="244" fill="#1b1f24">'shield'</text><rect x="236" y="258" width="128" height="28" rx="7" fill="#e6f4e6" /><text x="246" y="278" fill="#1b1f24">'cleric'</text></g><text x="215" y="336" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="20" fill="#59636e" text-anchor="middle">y = y + ['cleric'] runs</text><text x="215" y="364" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" font-weight="600" fill="#0067c0" text-anchor="middle">x still points at object A</text><text x="215" y="394" font-size="19" fill="#59636e" text-anchor="middle">two objects now &#8212; only y moved</text></g></svg>
