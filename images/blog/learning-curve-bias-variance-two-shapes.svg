<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">Learning curves for a high-variance model and a high-bias model</title><desc id="desc">Two stacked line charts plot training accuracy and cross-validation accuracy against training-set size for a scikit-learn decision tree on the digits dataset. The high-variance panel, an unlimited-depth tree, shows training accuracy fixed at 1.0 while cross-validation accuracy climbs from 0.556 to 0.858 as training size grows from 143 to 1437 rows, leaving an open gap. The high-bias panel, a tree capped at max depth 3, shows both curves converging early to a low plateau between about 0.39 and 0.62, with almost no gap between them.</desc><rect width="1200" height="580" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><line x1="380" y1="26" x2="420" y2="26" stroke="#1b1f24" stroke-width="5" stroke-linecap="round" /><text x="430" y="32" font-size="18" font-weight="600" fill="#59636e">TRAIN SCORE</text><line x1="620" y1="26" x2="660" y2="26" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><text x="670" y="32" font-size="18" font-weight="600" fill="#59636e">CV SCORE</text><text x="140" y="88" font-size="24" font-weight="650" letter-spacing="1" fill="#0067c0">HIGH VARIANCE &#183; UNLIMITED-DEPTH TREE</text><polygon points="140,110 328,110 516,110 704,110 892,110 1080,110 1080,136 892,136 704,147 516,150 328,164 140,190" fill="#e3f0fa" opacity="0.7" /><line x1="140" y1="110" x2="140" y2="290" stroke="#d0d5db" stroke-width="1.5" /><line x1="140" y1="290" x2="1080" y2="290" stroke="#d0d5db" stroke-width="1.5" /><text x="120" y="115" font-size="15" fill="#59636e" text-anchor="end">1.0</text><text x="120" y="205" font-size="15" fill="#59636e" text-anchor="end">0.5</text><text x="120" y="295" font-size="15" fill="#59636e" text-anchor="end">0.0</text><polyline points="140,110 328,110 516,110 704,110 892,110 1080,110" fill="none" stroke="#1b1f24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><polyline points="140,190 328,164 516,150 704,147 892,136 1080,136" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><g font-size="14" fill="#59636e" text-anchor="middle"><text x="140" y="308">143</text><text x="328" y="308">402</text><text x="516" y="308">661</text><text x="704" y="308">919</text><text x="892" y="308">1178</text><text x="1080" y="308">1437</text></g><text x="140" y="335" font-size="24" font-weight="650" letter-spacing="1" fill="#0067c0">HIGH BIAS &#183; MAX_DEPTH=3 TREE</text><polygon points="140,409 328,435 516,435 704,435 892,439 1080,433 1080,436 892,441 704,438 516,443 328,451 140,450" fill="#fdeede" opacity="0.8" /><line x1="140" y1="360" x2="140" y2="520" stroke="#d0d5db" stroke-width="1.5" /><line x1="140" y1="520" x2="1080" y2="520" stroke="#d0d5db" stroke-width="1.5" /><text x="120" y="365" font-size="15" fill="#59636e" text-anchor="end">1.0</text><text x="120" y="443" font-size="15" fill="#59636e" text-anchor="end">0.5</text><text x="120" y="525" font-size="15" fill="#59636e" text-anchor="end">0.0</text><polyline points="140,409 328,435 516,435 704,435 892,439 1080,433" fill="none" stroke="#1b1f24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><polyline points="140,450 328,451 516,443 704,438 892,441 1080,436" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><g font-size="14" fill="#59636e" text-anchor="middle"><text x="140" y="538">143</text><text x="328" y="538">402</text><text x="516" y="538">661</text><text x="704" y="538">919</text><text x="892" y="538">1178</text><text x="1080" y="538">1437</text></g><text x="610" y="566" font-size="16" font-weight="500" fill="#59636e" text-anchor="middle">TRAINING EXAMPLES USED</text></g></svg>
