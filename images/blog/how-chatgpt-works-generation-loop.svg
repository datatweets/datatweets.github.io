<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The token generation loop behind ChatGPT</title><desc id="desc">A sequence of tokens is embedded and passed through self-attention, producing next-token probabilities of ocean 49.7%, beach 40.7%, mountains 6.1%, desert 2.2%, and tundra 1.4% at temperature 1.0; beach is sampled and appended back onto the sequence before the loop repeats.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="160" y="50" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">TOKENIZE</text><text x="420" y="50" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">ATTEND</text><text x="720" y="50" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">PREDICT</text><text x="1040" y="50" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">SAMPLE</text><rect x="50" y="100" width="220" height="66" rx="12" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18"><text x="66" y="127" fill="#59636e">&#8230;vacation</text><text x="66" y="151" fill="#1b1f24">spot is the</text></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="17"><rect x="50" y="190" width="220" height="32" rx="8" fill="#e3f0fa" /><text x="66" y="212" fill="#1b1f24">spot</text><rect x="50" y="230" width="220" height="32" rx="8" fill="#e3f0fa" /><text x="66" y="252" fill="#1b1f24">is</text><rect x="50" y="270" width="220" height="32" rx="8" fill="#e3f0fa" /><text x="66" y="292" fill="#1b1f24">the</text></g><text x="160" y="335" font-size="15" fill="#59636e" text-anchor="middle">tokens become vectors</text><path d="M270 206H400" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><circle cx="420" cy="150" r="15" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><circle cx="420" cy="230" r="15" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><circle cx="420" cy="310" r="15" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><path d="M420 165V215" fill="none" stroke="#0067c0" stroke-width="7" stroke-linecap="round" opacity="0.9" /><path d="M420 245V295" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" opacity="0.6" /><path d="M433 144C465 190 465 270 433 316" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" opacity="0.6" /><text x="420" y="360" font-size="15" fill="#59636e" text-anchor="middle">tokens weigh each other</text><path d="M440 230H560" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="16"><rect x="570" y="110" width="130" height="20" rx="6" fill="#0067c0" /><rect x="570" y="146" width="107" height="20" rx="6" fill="#9dbfdd" /><rect x="570" y="182" width="16" height="20" rx="5" fill="#d0d5db" /><rect x="570" y="218" width="6" height="20" rx="3" fill="#d0d5db" /><rect x="570" y="254" width="4" height="20" rx="2" fill="#d0d5db" /></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="15"><text x="716" y="125" fill="#1b1f24">ocean 49.7%</text><text x="716" y="161" fill="#1b1f24">beach 40.7%</text><text x="716" y="197" fill="#59636e">mountains 6.1%</text><text x="716" y="233" fill="#59636e">desert 2.2%</text><text x="716" y="269" fill="#59636e">tundra 1.4%</text></g><text x="720" y="310" font-size="15" fill="#59636e" text-anchor="middle">softmax turns logits into probabilities</text><path d="M840 155C880 155 880 195 920 195" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><rect x="930" y="160" width="220" height="70" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="1040" y="205" font-size="30" font-weight="700" fill="#0067c0" text-anchor="middle">beach</text><text x="1040" y="255" font-size="15" fill="#59636e" text-anchor="middle">sampled at temperature 1.0</text><path d="M1040 230V460" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><path d="M1040 460H160" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><path d="M160 460V354" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><path d="M152 368L160 350L168 368Z" fill="#0067c0" /><text x="600" y="486" font-size="18" font-weight="600" fill="#0067c0" text-anchor="middle" letter-spacing="1">APPEND THE TOKEN AND REPEAT</text></g></svg>
