<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">Build a Data Quality Report in pandas Before You Analyze</title>
  <desc id="desc">A data quality thumbnail with a checklist that tests missing values, duplicate identifiers, categories, numeric types, and ranges before analysis.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>
  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" fill="#59636e">PANDAS QUALITY WORKFLOW</text>
    <text x="90" y="270" font-size="78" font-weight="700" fill="#1b1f24">CHECK DATA</text>
    <text x="90" y="358" font-size="78" font-weight="700" fill="#1b1f24">FIRST</text>
    <rect x="96" y="390" width="360" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="470" font-size="29" font-weight="500" fill="#59636e">PROFILE · TEST · REPORT</text>

    <g transform="translate(680 126)">
      <rect x="0" y="0" width="390" height="420" rx="22" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="30" y="48" font-size="22" font-weight="700" fill="#1b1f24">DATA CONTRACT</text>
      <line x1="30" y1="66" x2="360" y2="66" stroke="#d5d9de" stroke-width="2"/>

      <g font-size="19" font-weight="600" fill="#38414a">
        <rect x="30" y="92" width="24" height="24" rx="5" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
        <text x="42" y="111" text-anchor="middle" font-size="19" font-weight="700" fill="#0067c0">✓</text>
        <text x="70" y="112">REQUIRED VALUES</text>

        <rect x="30" y="146" width="24" height="24" rx="5" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
        <text x="42" y="165" text-anchor="middle" font-size="19" font-weight="700" fill="#0067c0">✓</text>
        <text x="70" y="166">UNIQUE IDS</text>

        <rect x="30" y="200" width="24" height="24" rx="5" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
        <text x="42" y="219" text-anchor="middle" font-size="19" font-weight="700" fill="#0067c0">✓</text>
        <text x="70" y="220">ALLOWED LABELS</text>

        <rect x="30" y="254" width="24" height="24" rx="5" fill="#fff4e8" stroke="#b75b18" stroke-width="2"/>
        <text x="42" y="273" text-anchor="middle" font-size="20" font-weight="700" fill="#b75b18">!</text>
        <text x="70" y="274">NUMERIC TYPES</text>

        <rect x="30" y="308" width="24" height="24" rx="5" fill="#fff4e8" stroke="#b75b18" stroke-width="2"/>
        <text x="42" y="327" text-anchor="middle" font-size="20" font-weight="700" fill="#b75b18">!</text>
        <text x="70" y="328">VALID RANGES</text>
      </g>

      <rect x="30" y="360" width="330" height="34" rx="17" fill="#0067c0"/>
      <text x="195" y="384" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">REPORT BEFORE ANALYSIS</text>
    </g>
  </g>
</svg>
