<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" role="img" aria-labelledby="title desc"><title id="title">How pd.to_datetime unlocks three Pandas capabilities</title><desc id="desc">Diagram showing a pickup column of date strings converted with pd.to_datetime into a datetime64 column, which then enables three things: the dt accessor for extracting fields such as hour values 2, 7, 14, and 17, subtraction to compute Timedelta durations such as 0 days 00:02:04, and resample or loc for date-based indexing and rollups such as daily fare totals of 146.59 and 178.00.</desc><rect width="1240" height="620" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="165" y="38" font-size="26" font-weight="600" fill="#59636e" text-anchor="middle">BEFORE</text><text x="565" y="38" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">AFTER</text><text x="1000" y="38" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">THEN, VECTORIZED</text><rect x="40" y="70" width="250" height="290" rx="18" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="165" y="108" font-size="22" font-weight="600" fill="#59636e" text-anchor="middle">pickup</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="15" fill="#1b1f24"><rect x="60" y="128" width="210" height="32" rx="8" fill="#f2f4f6" /><text x="72" y="150">2019-03-01 02:55:55</text><rect x="60" y="170" width="210" height="32" rx="8" fill="#f2f4f6" /><text x="72" y="192">2019-03-01 07:18:18</text><rect x="60" y="212" width="210" height="32" rx="8" fill="#f2f4f6" /><text x="72" y="234">2019-03-01 14:22:59</text><rect x="60" y="254" width="210" height="32" rx="8" fill="#f2f4f6" /><text x="72" y="276">2019-03-01 17:07:09</text></g><text x="165" y="325" font-size="16" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e" text-anchor="middle">dtype: object</text><text x="367" y="185" font-size="14" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0067c0" text-anchor="middle">pd.to_datetime()</text><path d="M300 215H420" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M403 198L420 215L403 232" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="440" y="70" width="250" height="290" rx="18" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="565" y="108" font-size="22" font-weight="600" fill="#0067c0" text-anchor="middle">pickup</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="15" fill="#1b1f24"><rect x="460" y="128" width="210" height="32" rx="8" fill="#e3f0fa" /><text x="472" y="150">2019-03-01 02:55:55</text><rect x="460" y="170" width="210" height="32" rx="8" fill="#e3f0fa" /><text x="472" y="192">2019-03-01 07:18:18</text><rect x="460" y="212" width="210" height="32" rx="8" fill="#e3f0fa" /><text x="472" y="234">2019-03-01 14:22:59</text><rect x="460" y="254" width="210" height="32" rx="8" fill="#e3f0fa" /><text x="472" y="276">2019-03-01 17:07:09</text></g><text x="565" y="325" font-size="16" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0067c0" text-anchor="middle">dtype: datetime64[us]</text><path d="M690 150C750 150 750 125 800 125" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M690 215C750 215 750 295 800 295" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M690 280C750 280 750 465 800 465" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="800" y="50" width="400" height="150" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="824" y="88" font-size="20" font-weight="600" fill="#0067c0">.dt ACCESSOR</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="16" fill="#59636e"><text x="824" y="124">pickup.dt.hour &#8594; 2, 7, 14, 17</text><text x="824" y="154">pickup.dt.day_name() &#8594; 'Friday'</text></g><rect x="800" y="220" width="400" height="150" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="824" y="258" font-size="20" font-weight="600" fill="#0067c0">ARITHMETIC</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="16" fill="#59636e"><text x="824" y="294">dropoff - pickup</text><text x="824" y="324">&#8594; Timedelta('0 days 00:02:04')</text></g><rect x="800" y="390" width="400" height="150" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="824" y="428" font-size="20" font-weight="600" fill="#0067c0">RESAMPLE() / .LOC[]</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="16" fill="#59636e"><text x="824" y="464">resample('D').sum()</text><text x="824" y="494">&#8594; 146.59, 178.00, ...</text></g></g></svg>
