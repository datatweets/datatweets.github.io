<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">AI, machine learning, and where scikit-learn fits</title><desc id="desc">Diagram showing AI as the outer category containing machine learning, which splits into deep learning (neural networks, TensorFlow and PyTorch) and classical machine learning (scikit-learn's territory), the latter branching into classification, regression, clustering, and dimensionality reduction, all tied together by model-selection and preprocessing utilities.</desc><rect width="1200" height="660" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><path d="M600 76V110" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><rect x="525" y="20" width="150" height="56" rx="14" fill="#ffffff" stroke="#59636e" stroke-width="3" /><text x="600" y="56" font-size="26" font-weight="700" fill="#1b1f24" text-anchor="middle">AI</text><rect x="420" y="110" width="360" height="64" rx="14" fill="#ffffff" stroke="#59636e" stroke-width="3" /><text x="600" y="150" font-size="24" font-weight="600" fill="#1b1f24" text-anchor="middle">Machine Learning</text><path d="M600 174C600 205 160 205 160 230" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><path d="M600 174C600 205 635 205 635 230" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><rect x="40" y="230" width="240" height="100" rx="16" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="160" y="268" font-size="22" font-weight="700" fill="#59636e" text-anchor="middle">Deep Learning</text><text x="160" y="294" font-size="15" fill="#59636e" text-anchor="middle">neural networks</text><text x="160" y="317" font-size="14" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e" text-anchor="middle">TensorFlow &#183; PyTorch</text><rect x="310" y="230" width="650" height="100" rx="16" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="635" y="272" font-size="26" font-weight="700" fill="#0067c0" text-anchor="middle">Classical ML</text><text x="635" y="306" font-size="19" fill="#0067c0" text-anchor="middle">scikit-learn's territory</text><path d="M635 330C635 360 195 360 195 390" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><path d="M635 330C635 360 465 360 465 390" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><path d="M635 330C635 360 735 360 735 390" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><path d="M635 330C635 360 1005 360 1005 390" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><rect x="70" y="390" width="250" height="110" rx="16" fill="#e3f0fa" stroke="#0067c0" stroke-width="2.5" /><text x="195" y="436" font-size="22" font-weight="700" fill="#0067c0" text-anchor="middle">Classification</text><text x="195" y="466" font-size="16" fill="#59636e" text-anchor="middle">assign a category</text><rect x="340" y="390" width="250" height="110" rx="16" fill="#e3f0fa" stroke="#0067c0" stroke-width="2.5" /><text x="465" y="436" font-size="22" font-weight="700" fill="#0067c0" text-anchor="middle">Regression</text><text x="465" y="466" font-size="16" fill="#59636e" text-anchor="middle">predict a number</text><rect x="610" y="390" width="250" height="110" rx="16" fill="#e3f0fa" stroke="#0067c0" stroke-width="2.5" /><text x="735" y="436" font-size="22" font-weight="700" fill="#0067c0" text-anchor="middle">Clustering</text><text x="735" y="466" font-size="16" fill="#59636e" text-anchor="middle">group without labels</text><rect x="880" y="390" width="250" height="110" rx="16" fill="#e3f0fa" stroke="#0067c0" stroke-width="2.5" /><text x="1005" y="424" font-size="19" font-weight="700" fill="#0067c0" text-anchor="middle">Dimensionality</text><text x="1005" y="448" font-size="19" font-weight="700" fill="#0067c0" text-anchor="middle">Reduction</text><text x="1005" y="476" font-size="15" fill="#59636e" text-anchor="middle">compress features</text><path d="M195 500V530" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8" /><path d="M465 500V530" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8" /><path d="M735 500V530" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8" /><path d="M1005 500V530" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8" /><rect x="70" y="530" width="1060" height="100" rx="16" fill="#ffffff" stroke="#59636e" stroke-width="3" /><text x="600" y="572" font-size="22" font-weight="700" fill="#1b1f24" text-anchor="middle">Model Selection &amp; Preprocessing</text><text x="600" y="602" font-size="15" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e" text-anchor="middle">train_test_split &#183; StandardScaler &#183; Pipeline &#183; cross_val_score</text></g></svg>
