<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">datetime as a point, timedelta as a duration, and the parse/format round trip</title><desc id="desc">A timeline shows two datetime points, a pickup scan at 2026-06-01 08:15:00 and a delivered scan at 2026-06-02 13:58:00, with the timedelta between them labeled 1 day, 5:43:00. Below it, a round-trip diagram shows the raw string '2026-06-02 13:58:00' parsed by strptime into a datetime point, then formatted by strftime back into the string 'Tue, Jun 02 2026 at 01:58 PM'.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="180" y="50" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">POINT</text><text x="600" y="50" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">TIMEDELTA</text><text x="1020" y="50" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">POINT</text><line x1="100" y1="150" x2="1100" y2="150" stroke="#d0d5db" stroke-width="4" stroke-linecap="round" /><circle cx="180" cy="150" r="11" fill="#0067c0" /><circle cx="1020" cy="150" r="11" fill="#0067c0" /><path d="M180 106L1020 106" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><path d="M180 106L180 122" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><path d="M1005 96L1020 106L1005 116" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="90" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="22" fill="#0067c0" text-anchor="middle">1 day, 5:43:00</text><text x="180" y="190" font-size="20" fill="#59636e" text-anchor="middle">pickup</text><text x="180" y="216" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" fill="#1b1f24" text-anchor="middle">2026-06-01 08:15:00</text><text x="1020" y="190" font-size="20" fill="#59636e" text-anchor="middle">delivered</text><text x="1020" y="216" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" fill="#1b1f24" text-anchor="middle">2026-06-02 13:58:00</text><text x="600" y="300" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">PARSE / FORMAT ROUND TRIP</text><text x="210" y="352" font-size="19" fill="#59636e" text-anchor="middle">raw string</text><rect x="60" y="368" width="300" height="70" rx="14" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><text x="210" y="410" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="17" fill="#1b1f24" text-anchor="middle">'2026-06-02 13:58:00'</text><text x="600" y="352" font-size="19" fill="#59636e" text-anchor="middle">datetime</text><circle cx="600" cy="403" r="40" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><circle cx="600" cy="403" r="7" fill="#0067c0" /><text x="985" y="352" font-size="19" fill="#59636e" text-anchor="middle">formatted string</text><rect x="835" y="368" width="300" height="70" rx="14" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><text x="985" y="410" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="15" fill="#1b1f24" text-anchor="middle">'Tue, Jun 02 2026 at 01:58 PM'</text><path d="M362 403L554 403" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><path d="M539 393L554 403L539 413" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="460" y="384" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#0067c0" text-anchor="middle">strptime()</text><path d="M642 403L833 403" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><path d="M818 393L833 403L818 413" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="738" y="384" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#0067c0" text-anchor="middle">strftime()</text></g></svg>