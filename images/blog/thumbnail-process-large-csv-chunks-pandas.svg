<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Process a Large CSV in Chunks with pandas Safely</title>
  <desc id="desc">DataTweets tutorial thumbnail showing three CSV chunks reduced into running sums and counts, then combined into one exact rate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0067c0"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="135" font-size="34" font-weight="600" letter-spacing="1.5" fill="#59636e">PANDAS CSV</text>
    <text x="90" y="246" font-size="78" font-weight="700" fill="#1b1f24">CHUNK</text>
    <text x="90" y="337" font-size="78" font-weight="700" fill="#1b1f24">REDUCE</text>
    <text x="90" y="428" font-size="78" font-weight="700" fill="#1b1f24">COMBINE</text>
    <rect x="94" y="470" width="400" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="542" font-size="29" font-weight="500" fill="#59636e">READ &#183; SUM &#183; VERIFY</text>

    <g aria-label="Chunk aggregation diagram">
      <text x="704" y="125" font-size="21" font-weight="600" letter-spacing="1.2" fill="#59636e">CSV BLOCKS</text>

      <rect x="684" y="151" width="150" height="76" rx="13" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <rect x="684" y="151" width="12" height="76" rx="6" fill="#0067c0"/>
      <text x="716" y="183" font-size="21" font-weight="700" fill="#1b1f24">CHUNK 1</text>
      <text x="716" y="210" font-size="17" font-weight="500" fill="#59636e">13K ROWS</text>

      <rect x="684" y="259" width="150" height="76" rx="13" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <rect x="684" y="259" width="12" height="76" rx="6" fill="#0067c0"/>
      <text x="716" y="291" font-size="21" font-weight="700" fill="#1b1f24">CHUNK 2</text>
      <text x="716" y="318" font-size="17" font-weight="500" fill="#59636e">13K ROWS</text>

      <rect x="684" y="367" width="150" height="76" rx="13" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <rect x="684" y="367" width="12" height="76" rx="6" fill="#0067c0"/>
      <text x="712" y="399" font-size="21" font-weight="700" fill="#1b1f24">CHUNK 14</text>
      <text x="716" y="426" font-size="17" font-weight="500" fill="#59636e">11K ROWS</text>

      <path d="M 842 189 L 872 189 L 872 265 L 898 265" fill="none" stroke="#0067c0" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M 842 297 L 898 297" fill="none" stroke="#0067c0" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M 842 405 L 872 405 L 872 329 L 898 329" fill="none" stroke="#0067c0" stroke-width="3" marker-end="url(#arrow)"/>

      <rect x="910" y="223" width="202" height="145" rx="18" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
      <text x="1011" y="263" text-anchor="middle" font-size="18" font-weight="600" letter-spacing="1" fill="#59636e">BY HUB</text>
      <text x="1011" y="304" text-anchor="middle" font-size="25" font-weight="700" fill="#1b1f24">SUM + COUNT</text>
      <line x1="943" y1="324" x2="1079" y2="324" stroke="#0067c0" stroke-width="4" stroke-linecap="round"/>
      <text x="1011" y="351" text-anchor="middle" font-size="16" font-weight="500" fill="#59636e">SMALL STATE</text>

      <path d="M 1011 376 L 1011 418" fill="none" stroke="#0067c0" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="910" y="432" width="202" height="90" rx="18" fill="#ffffff" stroke="#c7ccd2" stroke-width="2"/>
      <text x="1011" y="466" text-anchor="middle" font-size="17" font-weight="600" letter-spacing="0.8" fill="#59636e">FINAL RATE</text>
      <text x="1011" y="501" text-anchor="middle" font-size="21" font-weight="700" fill="#1b1f24">LATE / DONE</text>
    </g>
  </g>
</svg>
