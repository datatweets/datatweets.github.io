<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The three-doors model of a well-behaved command-line Python script</title><desc id="desc">A diagram showing a Python script with three doors: arguments arrive through argparse, piped data arrives through standard input, and the script's answer leaves through standard output while diagnostic messages leave separately through standard error. A verified example run against a 12-line access log finds 6 error rows, sends them as CSV to standard output, and reports 6 matching and 0 malformed lines to standard error.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="170" y="56" font-size="27" font-weight="600" fill="#0067c0" text-anchor="middle">ARGS + STDIN IN</text><text x="600" y="56" font-size="27" font-weight="600" fill="#0067c0" text-anchor="middle">YOUR SCRIPT</text><text x="1030" y="56" font-size="27" font-weight="600" fill="#0067c0" text-anchor="middle">STDOUT + STDERR OUT</text><rect x="40" y="96" width="260" height="88" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="60" y="126" font-size="21" font-weight="600" fill="#59636e">arguments</text><g font-size="18" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="60" y="156" fill="#1b1f24">--min-status 400</text></g><rect x="40" y="200" width="260" height="88" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="60" y="230" font-size="21" font-weight="600" fill="#59636e">piped data</text><g font-size="18" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="60" y="260" fill="#1b1f24">access.log (12 lines)</text></g><path d="M304 140H386" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M386 140L364 126M386 140L364 154" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M304 244H386" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M386 244L364 230M386 244L364 258" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M420 150L470 192" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><path d="M420 234L470 202" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><rect x="470" y="150" width="260" height="130" rx="18" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="600" y="196" font-size="23" font-weight="600" fill="#1b1f24" text-anchor="middle">access_errors.py</text><text x="600" y="228" font-size="18" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">argparse &#8594; loop &#8594; sys.exit</text><path d="M730 190L790 152" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><path d="M730 240L790 278" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><path d="M844 140H914" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M914 140L892 126M914 140L892 154" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M844 244H914" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M914 244L892 230M914 244L892 258" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><rect x="918" y="96" width="242" height="88" rx="16" fill="#ffffff" stroke="#7fb0d8" stroke-width="3" /><text x="938" y="126" font-size="21" font-weight="600" fill="#1b1f24">stdout</text><rect x="938" y="136" width="202" height="32" rx="7" fill="#e6f4e6" /><text x="948" y="158" font-size="18" fill="#1b1f24">6 error rows as CSV</text><rect x="918" y="200" width="242" height="88" rx="16" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><text x="938" y="230" font-size="21" font-weight="600" fill="#1b1f24">stderr</text><rect x="938" y="240" width="202" height="32" rx="7" fill="#fdeede" /><text x="948" y="262" font-size="18" fill="#1b1f24">6 matching, 0 malformed</text><g font-size="20" fill="#59636e" font-family="Jost, sans-serif"><text x="170" y="440" text-anchor="middle">what the caller typed and piped in</text><text x="600" y="440" text-anchor="middle">parses, filters, decides, exits</text><text x="1030" y="428" text-anchor="middle"><tspan x="1030" dy="0">clean answer and human notes,</tspan><tspan x="1030" dy="26">kept apart</tspan></text></g></g></svg>
