<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The launch, wait, report-back model of Python's subprocess module</title><desc id="desc">A diagram showing a Python parent process launching a child process, waiting while the child runs and prints to standard output and standard error, then receiving back the captured stdout, stderr, and a return code once the child exits.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="150" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">LAUNCH</text><text x="620" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">WAIT</text><text x="1032" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">REPORT BACK</text><rect x="40" y="130" width="220" height="110" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="150" y="168" font-size="23" font-weight="600" fill="#59636e" text-anchor="middle">parent process</text><g font-size="20" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="60" y="202" fill="#1b1f24">subprocess.run(</text><text x="60" y="226" fill="#0067c0">["python3", "--version"])</text></g><path d="M262 185H358" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M358 185L336 171M358 185L336 199" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><rect x="368" y="112" width="230" height="146" rx="16" fill="#ffffff" stroke="#7fb0d8" stroke-width="3" /><text x="483" y="146" font-size="23" font-weight="600" fill="#1b1f24" text-anchor="middle">child process</text><g font-size="20" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="388" y="180" fill="#59636e">runs, writes to</text><rect x="388" y="194" width="190" height="30" rx="7" fill="#e3f0fa" /><text x="398" y="215" fill="#1b1f24">stdout / stderr</text></g><g transform="translate(650 150)"><circle cx="60" cy="50" r="46" fill="#ffffff" stroke="#c7ccd2" stroke-width="4" /><path d="M60 50V22" stroke="#59636e" stroke-width="5" stroke-linecap="round" /><path d="M60 50L84 62" stroke="#59636e" stroke-width="5" stroke-linecap="round" /><text x="60" y="122" font-size="19" fill="#59636e" text-anchor="middle" font-family="Jost, sans-serif">Python blocks here</text></g><path d="M780 185H890" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M890 185L868 171M890 185L868 199" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><text x="835" y="164" font-size="18" fill="#59636e" text-anchor="middle" font-family="Jost, sans-serif">exits</text><rect x="894" y="90" width="276" height="190" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="1032" y="126" font-size="22" font-weight="600" fill="#59636e" text-anchor="middle">CompletedProcess</text><g font-size="16" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="912" y="142" width="240" height="32" rx="7" fill="#e6f4e6" /><text x="922" y="164" fill="#1b1f24">stdout: 'Python 3.13.2'</text><rect x="912" y="182" width="240" height="32" rx="7" fill="#fdeede" /><text x="922" y="204" fill="#1b1f24">stderr: ''</text><rect x="912" y="222" width="240" height="32" rx="7" fill="#e3f0fa" /><text x="922" y="244" fill="#1b1f24">returncode: 0</text></g><g font-size="21" fill="#59636e" font-family="Jost, sans-serif"><text x="150" y="440" text-anchor="middle">one program starts another</text><text x="620" y="440" text-anchor="middle">execution pauses until done</text><text x="1032" y="440" text-anchor="middle">output + exit code come back</text></g></g></svg>