<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Python function calling for LLMs thumbnail</title><desc id="desc">A minimal thumbnail for a tutorial on giving language models access to real-world Python functions through function calling.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="38" font-weight="600" fill="#59636e">Give your LLM real-world tools</text><text x="90" y="360" font-size="120" font-weight="700" fill="#1b1f24">function</text><text x="90" y="460" font-size="120" font-weight="700" fill="#0067c0">calling</text><rect x="100" y="480" width="320" height="12" rx="6" fill="#0067c0" /></g><g transform="translate(740 130)"><rect x="0" y="40" width="280" height="60" rx="14" fill="#f0f4f8" stroke="#0067c0" stroke-width="3" /><text x="140" y="78" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="22" fill="#0067c0" text-anchor="middle">get_weather()</text><rect x="0" y="120" width="280" height="60" rx="14" fill="#f0f4f8" stroke="#d0d5db" stroke-width="3" /><text x="140" y="158" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="22" fill="#59636e" text-anchor="middle">get_stock_price()</text><rect x="0" y="200" width="280" height="60" rx="14" fill="#f0f4f8" stroke="#d0d5db" stroke-width="3" /><text x="140" y="238" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="22" fill="#59636e" text-anchor="middle">send_email()</text><path d="M140 280 L140 340 L60 340" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowhead)" /><rect x="20" y="350" width="240" height="50" rx="12" fill="#0067c0" /><text x="140" y="382" font-family="Jost, sans-serif" font-size="22" font-weight="600" fill="