<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">How to Load a Scikit-Learn Model During FastAPI Startup</title>
  <desc id="desc">A DataTweets tutorial thumbnail showing a trusted model file and metadata entering a FastAPI lifespan gate. Checksum, version, feature, and smoke-prediction checks lead to a ready application.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0067c0"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="145" font-size="32" font-weight="600" letter-spacing="1" fill="#59636e">MODEL STARTUP</text>
    <text x="90" y="272" font-size="82" font-weight="700" fill="#1b1f24">VERIFY</text>
    <text x="90" y="370" font-size="82" font-weight="700" fill="#1b1f24">THEN SERVE</text>
    <rect x="94" y="405" width="390" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="476" font-size="27" font-weight="500" fill="#59636e">LIFESPAN &#183; CHECKSUM &#183; SCHEMA</text>

    <g aria-label="FastAPI model startup verification diagram">
      <path d="M 796 204 C 824 204 830 234 850 234" fill="none" stroke="#0067c0" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M 796 326 C 824 326 830 296 850 296" fill="none" stroke="#0067c0" stroke-width="3" marker-end="url(#arrow)"/>

      <rect x="646" y="159" width="150" height="90" rx="14" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <path d="M 670 181 h 31 l 12 12 v 31 h -43 z" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
      <path d="M 701 181 v 12 h 12" fill="none" stroke="#0067c0" stroke-width="2"/>
      <text x="729" y="193" font-size="19" font-weight="700" fill="#1b1f24">MODEL</text>
      <text x="729" y="220" font-size="16" font-weight="500" fill="#59636e">.joblib</text>

      <rect x="646" y="281" width="150" height="90" rx="14" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <path d="M 670 303 h 31 l 12 12 v 31 h -43 z" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
      <path d="M 701 303 v 12 h 12" fill="none" stroke="#59636e" stroke-width="2"/>
      <text x="729" y="315" font-size="17" font-weight="700" fill="#1b1f24">META</text>
      <text x="729" y="342" font-size="16" font-weight="500" fill="#59636e">.json</text>

      <rect x="856" y="137" width="256" height="290" rx="22" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>
      <text x="984" y="178" text-anchor="middle" font-size="20" font-weight="700" fill="#0067c0">LIFESPAN GATE</text>
      <line x1="882" y1="194" x2="1086" y2="194" stroke="#e3e6ea" stroke-width="2"/>

      <g font-size="18" font-weight="600" fill="#1b1f24">
        <circle cx="892" cy="229" r="10" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
        <path d="M 887 229 l 4 4 l 7 -9" fill="none" stroke="#0067c0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="914" y="235">CHECKSUM</text>

        <circle cx="892" cy="278" r="10" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
        <path d="M 887 278 l 4 4 l 7 -9" fill="none" stroke="#0067c0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="914" y="284">VERSION</text>

        <circle cx="892" cy="327" r="10" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
        <path d="M 887 327 l 4 4 l 7 -9" fill="none" stroke="#0067c0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="914" y="333">FEATURES</text>

        <circle cx="892" cy="376" r="10" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
        <path d="M 887 376 l 4 4 l 7 -9" fill="none" stroke="#0067c0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="914" y="382">SMOKE TEST</text>
      </g>

      <path d="M 984 427 V 474" fill="none" stroke="#0067c0" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="856" y="486" width="256" height="80" rx="18" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
      <circle cx="898" cy="526" r="14" fill="#ffffff" stroke="#0067c0" stroke-width="2"/>
      <path d="M 891 526 l 5 5 l 10 -13" fill="none" stroke="#0067c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="994" y="535" text-anchor="middle" font-size="27" font-weight="700" fill="#1b1f24">READY</text>
    </g>
  </g>
</svg>
