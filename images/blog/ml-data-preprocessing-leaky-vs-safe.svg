<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Leaky order versus safe order for fitting preprocessing steps</title><desc id="desc">Two rows compare fitting order on the 891-row Titanic dataset. In the leaky order, an imputer, scaler, and encoder are fit on all 891 rows before the 712/179 train/test split, so the evaluation score is optimistic. In the safe order, the data is split into 712 training and 179 test rows first, the imputer, scaler, and encoder are fit only on the 712 training rows, and train and test are transformed separately, so the evaluation score is honest.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="60" y="95" font-size="26" font-weight="600" fill="#59636e">LEAKY ORDER</text><text x="60" y="375" font-size="26" font-weight="600" fill="#0067c0">SAFE ORDER</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19"><g><rect x="220" y="110" width="190" height="100" rx="14" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="315" y="150" text-anchor="middle" fill="#1b1f24" font-weight="600">891 rows</text><text x="315" y="176" text-anchor="middle" fill="#59636e">full dataset</text><path d="M410 160H448" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="452" y="110" width="190" height="100" rx="14" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" stroke-dasharray="8 6" /><text x="547" y="144" text-anchor="middle" fill="#1b1f24" font-weight="600">fit imputer,</text><text x="547" y="168" text-anchor="middle" fill="#1b1f24" font-weight="600">scaler, encoder</text><text x="547" y="192" text-anchor="middle" fill="#59636e">on everything</text><path d="M642 160H680" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="684" y="110" width="190" height="100" rx="14" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="779" y="150" text-anchor="middle" fill="#1b1f24" font-weight="600">split</text><text x="779" y="176" text-anchor="middle" fill="#59636e">712 / 179</text><path d="M874 160H912" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="916" y="110" width="190" height="100" rx="14" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="1011" y="144" text-anchor="middle" fill="#1b1f24" font-weight="600">train model</text><text x="1011" y="168" text-anchor="middle" fill="#59636e">score is</text><text x="1011" y="192" text-anchor="middle" fill="#59636e">optimistic</text></g><g><rect x="220" y="330" width="190" height="100" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="315" y="370" text-anchor="middle" fill="#1b1f24" font-weight="600">split first</text><text x="315" y="396" text-anchor="middle" fill="#0067c0">712 / 179</text><path d="M410 380H448" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><rect x="452" y="330" width="190" height="100" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="547" y="364" text-anchor="middle" fill="#1b1f24" font-weight="600">fit imputer,</text><text x="547" y="388" text-anchor="middle" fill="#1b1f24" font-weight="600">scaler, encoder</text><text x="547" y="412" text-anchor="middle" fill="#0067c0">on 712 train rows</text><path d="M642 380H680" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><rect x="684" y="330" width="190" height="100" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="779" y="364" text-anchor="middle" fill="#1b1f24" font-weight="600">transform</text><text x="779" y="388" text-anchor="middle" fill="#1b1f24" font-weight="600">train &#38; test</text><text x="779" y="412" text-anchor="middle" fill="#0067c0">separately</text><path d="M874 380H912" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><rect x="916" y="330" width="190" height="100" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="1011" y="364" text-anchor="middle" fill="#1b1f24" font-weight="600">train model</text><text x="1011" y="388" text-anchor="middle" fill="#0067c0">score is</text><text x="1011" y="412" text-anchor="middle" fill="#0067c0">honest</text></g></g></svg>
