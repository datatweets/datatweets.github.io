<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Test AI Agent Workflows with Python Trace Assertions</title>
  <desc id="desc">A DATATWEETS tutorial thumbnail showing a three-step agent tool trace checked against order, argument, and final-state assertions.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="32" font-weight="600" letter-spacing="1" fill="#59636e">AGENT WORKFLOW TESTING</text>
    <text x="90" y="288" font-size="88" font-weight="700" fill="#1b1f24">TRACE</text>
    <text x="90" y="390" font-size="78" font-weight="700" fill="#1b1f24">THEN ASSERT</text>
    <rect x="94" y="430" width="342" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="506" font-size="27" font-weight="500" fill="#59636e">ORDER &#183; ARGUMENTS &#183; STATE</text>

    <g transform="translate(700 126)">
      <text x="0" y="22" font-size="20" font-weight="600" letter-spacing="1.5" fill="#59636e">SAVED TRACE</text>
      <text x="274" y="22" font-size="20" font-weight="600" letter-spacing="1.5" fill="#59636e">ASSERT</text>

      <line x1="119" y1="110" x2="119" y2="142" stroke="#0067c0" stroke-width="4" stroke-linecap="round"/>
      <path d="M111 134 L119 144 L127 134" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="119" y1="226" x2="119" y2="258" stroke="#0067c0" stroke-width="4" stroke-linecap="round"/>
      <path d="M111 250 L119 260 L127 250" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="0" y="52" width="238" height="58" rx="14" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <circle cx="32" cy="81" r="17" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
      <text x="32" y="88" text-anchor="middle" font-size="20" font-weight="700" fill="#0067c0">1</text>
      <text x="62" y="88" font-size="21" font-weight="600" fill="#1b1f24">CHECK</text>

      <rect x="0" y="168" width="238" height="58" rx="14" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <circle cx="32" cy="197" r="17" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
      <text x="32" y="204" text-anchor="middle" font-size="20" font-weight="700" fill="#0067c0">2</text>
      <text x="62" y="204" font-size="21" font-weight="600" fill="#1b1f24">RESERVE</text>

      <rect x="0" y="284" width="238" height="58" rx="14" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <circle cx="32" cy="313" r="17" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
      <text x="32" y="320" text-anchor="middle" font-size="20" font-weight="700" fill="#0067c0">3</text>
      <text x="62" y="320" font-size="21" font-weight="600" fill="#1b1f24">CONFIRM</text>

      <rect x="270" y="52" width="126" height="290" rx="18" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>
      <line x1="288" y1="131" x2="378" y2="131" stroke="#e3e6ea" stroke-width="2"/>
      <line x1="288" y1="210" x2="378" y2="210" stroke="#e3e6ea" stroke-width="2"/>
      <text x="293" y="92" font-size="18" font-weight="600" fill="#59636e">ORDER</text>
      <path d="M356 86 L364 94 L380 76" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="293" y="171" font-size="18" font-weight="600" fill="#59636e">ARGS</text>
      <path d="M356 165 L364 173 L380 155" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="293" y="250" font-size="18" font-weight="600" fill="#59636e">STATE</text>
      <path d="M356 244 L364 252 L380 234" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="290" y="278" width="86" height="40" rx="20" fill="#e3f0fa"/>
      <text x="333" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#0067c0">PASS</text>
    </g>
  </g>
</svg>
