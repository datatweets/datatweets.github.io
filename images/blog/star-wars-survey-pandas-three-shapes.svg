<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The three answer shapes in a raw survey export</title><desc id="desc">A single-choice question stored as one seen_any column with Yes selected and No not selected; a select-all-that-apply question spread across six seen_ep columns where episodes 1 through 3 are checked and episodes 4 through 6 are blank, matching one real respondent's row; and a forced-rank question spread across six rank_ep columns where each cell holds a number from 1 to 6, matching another real respondent's row.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="150" y="60" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">SINGLE-CHOICE</text><text x="600" y="60" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">MULTI-SELECT</text><text x="1030" y="60" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">FORCED RANK</text><text x="150" y="88" font-size="18" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">seen_any</text><text x="600" y="88" font-size="18" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">seen_ep1 &#8230; seen_ep6</text><text x="1030" y="88" font-size="18" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">rank_ep1 &#8230; rank_ep6</text><rect x="60" y="130" width="180" height="330" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="150" y="164" font-size="18" font-weight="600" fill="#59636e" text-anchor="middle">1 column</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="22"><rect x="90" y="200" width="120" height="46" rx="23" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="150" y="230" fill="#1b1f24" text-anchor="middle">Yes</text><rect x="90" y="266" width="120" height="46" rx="23" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><text x="150" y="296" fill="#9aa2ab" text-anchor="middle">No</text></g><text x="150" y="420" font-size="16" fill="#59636e" text-anchor="middle">one value per respondent</text><rect x="440" y="130" width="320" height="330" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="600" y="164" font-size="18" font-weight="600" fill="#59636e" text-anchor="middle">6 columns, one per film</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19"><rect x="464" y="188" width="130" height="34" rx="8" fill="#e3f0fa" /><text x="476" y="211" fill="#1b1f24">ep1: Phantom</text><rect x="606" y="188" width="130" height="34" rx="8" fill="#e6f4e6" /><text x="618" y="211" fill="#1b1f24">checked</text><rect x="464" y="228" width="130" height="34" rx="8" fill="#e3f0fa" /><text x="476" y="251" fill="#1b1f24">ep2: Clones</text><rect x="606" y="228" width="130" height="34" rx="8" fill="#e6f4e6" /><text x="618" y="251" fill="#1b1f24">checked</text><rect x="464" y="268" width="130" height="34" rx="8" fill="#e3f0fa" /><text x="476" y="291" fill="#1b1f24">ep3: Sith</text><rect x="606" y="268" width="130" height="34" rx="8" fill="#e6f4e6" /><text x="618" y="291" fill="#1b1f24">checked</text><rect x="464" y="308" width="130" height="34" rx="8" fill="#f7f8fa" /><text x="476" y="331" fill="#9aa2ab">ep4: New Hope</text><rect x="606" y="308" width="130" height="34" rx="8" fill="#fdeede" /><text x="618" y="331" fill="#9aa2ab">blank</text><rect x="464" y="348" width="130" height="34" rx="8" fill="#f7f8fa" /><text x="476" y="371" fill="#9aa2ab">ep5: Empire</text><rect x="606" y="348" width="130" height="34" rx="8" fill="#fdeede" /><text x="618" y="371" fill="#9aa2ab">blank</text><rect x="464" y="388" width="130" height="34" rx="8" fill="#f7f8fa" /><text x="476" y="411" fill="#9aa2ab">ep6: Jedi</text><rect x="606" y="388" width="130" height="34" rx="8" fill="#fdeede" /><text x="618" y="411" fill="#9aa2ab">blank</text></g><text x="600" y="440" font-size="16" fill="#59636e" text-anchor="middle">blank means "not selected," not missing</text><rect x="930" y="130" width="200" height="330" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="1030" y="164" font-size="18" font-weight="600" fill="#59636e" text-anchor="middle">6 columns, one per film</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" fill="#1b1f24"><rect x="954" y="188" width="150" height="34" rx="8" fill="#e3f0fa" /><text x="966" y="211">ep1 &#8594; 3</text><rect x="954" y="228" width="150" height="34" rx="8" fill="#e3f0fa" /><text x="966" y="251">ep2 &#8594; 2</text><rect x="954" y="268" width="150" height="34" rx="8" fill="#e3f0fa" /><text x="966" y="291">ep3 &#8594; 1</text><rect x="954" y="308" width="150" height="34" rx="8" fill="#e3f0fa" /><text x="966" y="331">ep4 &#8594; 4</text><rect x="954" y="348" width="150" height="34" rx="8" fill="#e3f0fa" /><text x="966" y="371">ep5 &#8594; 5</text><rect x="954" y="388" width="150" height="34" rx="8" fill="#e3f0fa" /><text x="966" y="411">ep6 &#8594; 6</text></g><text x="1030" y="440" font-size="16" fill="#59636e" text-anchor="middle">every cell holds a 1-6 rank</text></g></svg>
