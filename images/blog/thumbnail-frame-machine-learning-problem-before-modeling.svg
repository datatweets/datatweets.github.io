<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Frame a Machine Learning Problem Before Modeling</title>
  <desc id="desc">A DataTweets tutorial thumbnail showing a prediction brief that connects an early-review decision, the ticket-arrival prediction moment, and a target of the first reply arriving after eight hours.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0067c0"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="32" font-weight="600" letter-spacing="1" fill="#59636e">BEFORE MODEL SELECTION</text>
    <text x="90" y="278" font-size="82" font-weight="700" fill="#1b1f24">FRAME THE</text>
    <text x="90" y="375" font-size="82" font-weight="700" fill="#1b1f24">PREDICTION</text>
    <rect x="98" y="413" width="390" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="489" font-size="29" font-weight="500" fill="#59636e">DECISION &#183; TARGET &#183; TIMING</text>

    <g transform="translate(760 112)">
      <text x="0" y="22" font-size="20" font-weight="700" letter-spacing="1.5" fill="#59636e">ONE TESTABLE BRIEF</text>

      <rect x="0" y="52" width="340" height="104" rx="18" fill="#eaf4fb" stroke="#9bc7e8" stroke-width="2"/>
      <text x="24" y="83" font-size="17" font-weight="700" letter-spacing="1.2" fill="#0067c0">DECISION</text>
      <text x="24" y="126" font-size="29" font-weight="650" fill="#1b1f24">Early review?</text>

      <line x1="170" y1="164" x2="170" y2="199" stroke="#0067c0" stroke-width="3" marker-end="url(#arrow)"/>

      <rect x="0" y="210" width="340" height="104" rx="18" fill="#ffffff" stroke="#c7ccd2" stroke-width="2"/>
      <text x="24" y="241" font-size="17" font-weight="700" letter-spacing="1.2" fill="#59636e">PREDICTION MOMENT</text>
      <text x="24" y="284" font-size="29" font-weight="650" fill="#1b1f24">Ticket arrives</text>

      <line x1="170" y1="322" x2="170" y2="357" stroke="#0067c0" stroke-width="3" marker-end="url(#arrow)"/>

      <rect x="0" y="368" width="340" height="104" rx="18" fill="#fff7ed" stroke="#e6c89e" stroke-width="2"/>
      <text x="24" y="399" font-size="17" font-weight="700" letter-spacing="1.2" fill="#8a5a18">TARGET</text>
      <text x="24" y="442" font-size="29" font-weight="650" fill="#1b1f24">First reply after 8h</text>
    </g>
  </g>
</svg>
