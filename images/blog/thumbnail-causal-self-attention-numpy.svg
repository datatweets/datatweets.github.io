  <title id="title">Causal self-attention in NumPy tutorial thumbnail</title>
  <desc id="desc">A DATATWEETS tutorial thumbnail with the headline Read Left, Never Right and a six-by-six attention grid. Blue cells form a lower triangle of allowed links, while pale cells above the diagonal show blocked future-token links.</desc>
