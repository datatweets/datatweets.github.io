<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">How a Python for loop moves through a sequence</title><desc id="desc">Diagram showing a for loop over the list eggs, milk, green salad, cheese, bread, coffee: the sequence holds all six items, the loop pulls one item at a time such as milk, the loop body runs code that prints Add to cart colon milk, and the loop repeats until the sequence runs out, after which the loop ends.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="150" y="60" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">SEQUENCE</text><text x="600" y="60" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">ONE ITEM AT A TIME</text><text x="1030" y="60" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">LOOP BODY RUNS</text><rect x="50" y="90" width="200" height="330" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="150" y="122" font-size="20" font-weight="600" fill="#59636e" text-anchor="middle">groceries</text><g font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="68" y="136" width="164" height="32" rx="8" fill="#e3f0fa" /><text x="80" y="158" fill="#1b1f24">eggs</text><rect x="68" y="174" width="164" height="32" rx="8" fill="#0067c0" /><text x="80" y="196" fill="#ffffff">milk</text><rect x="68" y="212" width="164" height="32" rx="8" fill="#e6f4e6" /><text x="80" y="234" fill="#1b1f24">green salad</text><rect x="68" y="250" width="164" height="32" rx="8" fill="#fdeede" /><text x="80" y="272" fill="#1b1f24">cheese</text><rect x="68" y="288" width="164" height="32" rx="8" fill="#e3f0fa" /><text x="80" y="310" fill="#1b1f24">bread</text><rect x="68" y="326" width="164" height="32" rx="8" fill="#e6f4e6" /><text x="80" y="348" fill="#1b1f24">coffee</text></g><path d="M262 190C340 190 340 190 418 190" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><polygon points="428,190 414,182 414,198" fill="#0067c0" /><rect x="430" y="150" width="220" height="80" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="540" y="185" font-size="22" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#1b1f24" text-anchor="middle">item = "milk"</text><text x="540" y="212" font-size="16" fill="#59636e" text-anchor="middle">the current pass's item</text><path d="M660 190C740 190 740 190 812 190" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><polygon points="822,190 808,182 808,198" fill="#0067c0" /><rect x="824" y="130" width="326" height="120" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="850" y="166" font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#1b1f24">print(f"Add to cart: {item}")</text><path d="M850 182H1124" fill="none" stroke="#e3e6ea" stroke-width="2" /><text x="850" y="216" font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0067c0">Add to cart: milk</text><path d="M980 250C980 300 660 300 660 250" fill="none" stroke="#59636e" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10" /><polygon points="660,242 652,254 668,254" fill="#59636e" /><text x="820" y="322" font-size="20" font-weight="600" fill="#59636e" text-anchor="middle">REPEAT with the next item</text><path d="M540 230C540 300 400 320 260 400" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8" /><rect x="80" y="404" width="340" height="70" rx="14" fill="#ffffff" stroke="#c7ccd2" stroke-width="2" /><text x="250" y="432" font-size="18" font-weight="600" fill="#59636e" text-anchor="middle">after "coffee", the sequence is empty</text><text x="250" y="458" font-size="18" font-weight="600" fill="#59636e" text-anchor="middle">the loop ends on its own</text></g></svg>
