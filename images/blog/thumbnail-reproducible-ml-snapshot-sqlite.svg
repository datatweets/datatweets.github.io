<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Build a Reproducible Machine Learning Snapshot with SQLite</title>
  <desc id="desc">A DATATWEETS tutorial thumbnail. A source table passes through a fixed time cutoff into a locked feature snapshot, showing how SQLite preserves reproducible machine-learning inputs.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>
  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="36" font-weight="600" fill="#59636e">REPRODUCIBLE ML DATA</text>
    <text x="90" y="278" font-size="86" font-weight="700" fill="#1b1f24">FREEZE YOUR</text>
    <text x="90" y="374" font-size="86" font-weight="700" fill="#1b1f24">FEATURES</text>
    <rect x="98" y="405" width="410" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="480" font-size="30" font-weight="500" fill="#59636e">SQLITE &#183; CUTOFF &#183; VALIDATE</text>
  </g>
  <g transform="translate(720 130)" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="0" y="40" width="145" height="310" rx="18" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
    <rect x="15" y="58" width="115" height="44" rx="10" fill="#e3f0fa"/>
    <text x="72" y="87" text-anchor="middle" font-size="19" font-weight="700" fill="#1b1f24">RAW ROWS</text>
    <rect x="18" y="125" width="109" height="38" rx="7" fill="#ffffff" stroke="#c7ccd2"/>
    <rect x="18" y="177" width="109" height="38" rx="7" fill="#ffffff" stroke="#c7ccd2"/>
    <rect x="18" y="229" width="109" height="38" rx="7" fill="#ffffff" stroke="#c7ccd2"/>
    <rect x="18" y="281" width="109" height="38" rx="7" fill="#ffffff" stroke="#c7ccd2"/>
    <text x="31" y="150" font-size="15" font-weight="600" fill="#59636e">JUN 06  24</text>
    <text x="31" y="202" font-size="15" font-weight="600" fill="#59636e">JUN 07  23</text>
    <text x="31" y="254" font-size="15" font-weight="600" fill="#59636e">JUN 08  24</text>
    <text x="31" y="306" font-size="15" font-weight="600" fill="#59636e">JUN 10  24</text>
    <rect x="168" y="25" width="6" height="340" rx="3" fill="#0067c0"/>
    <rect x="132" y="0" width="79" height="36" rx="18" fill="#0067c0"/>
    <text x="171" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">CUTOFF</text>
    <text x="208" y="211" font-size="46" font-weight="600" fill="#59636e">&#8594;</text>
    <rect x="270" y="91" width="180" height="220" rx="20" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>
    <rect x="286" y="108" width="148" height="48" rx="10" fill="#e3f0fa"/>
    <text x="360" y="139" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">SNAPSHOT 1</text>
    <rect x="292" y="177" width="136" height="35" rx="7" fill="#f7f8fa" stroke="#c7ccd2"/>
    <rect x="292" y="224" width="136" height="35" rx="7" fill="#f7f8fa" stroke="#c7ccd2"/>
    <text x="307" y="200" font-size="14" font-weight="600" fill="#59636e">JUN 06  AVG</text>
    <text x="307" y="247" font-size="14" font-weight="600" fill="#59636e">JUN 07  AVG</text>
    <rect x="318" y="279" width="84" height="38" rx="19" fill="#0067c0"/>
    <text x="360" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">FIXED</text>
  </g>
</svg>
