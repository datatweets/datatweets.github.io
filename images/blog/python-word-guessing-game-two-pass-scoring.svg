<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Two-pass scoring of the guess sneer against the secret level</title>
<desc id="desc">Diagram showing the two-pass scoring of the guess sneer against the secret level: pass one finds one exact hit at the E at index 3 and reduces the secret's remaining letter counts from l:2 e:2 v:1 to l:2 e:1 v:1, then pass two checks the remaining letters s, n, e, and r against those leftover counts, marking s and n as misses, the remaining e as present, and r as a miss.</desc>
<rect width="1200" height="560" fill="#f7f8fa" />

<g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<text x="270" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">PASS 1 &#183; EXACT MATCHES</text>
<text x="900" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">PASS 2 &#183; WHAT'S LEFT</text>
<line x1="540" y1="90" x2="540" y2="470" stroke="#e3e6ea" stroke-width="2" />
<text x="60" y="106" font-size="20" font-weight="600" fill="#59636e">secret: level</text>
<text x="60" y="330" font-size="20" font-weight="600" fill="#59636e">guess: sneer</text>
<text x="640" y="106" font-size="20" font-weight="600" fill="#59636e">scored guess</text>
</g>

<g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="28" font-weight="600" text-anchor="middle">
<rect x="60" y="120" width="70" height="70" rx="12" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><text x="95" y="164" fill="#1b1f24">L</text>
<rect x="140" y="120" width="70" height="70" rx="12" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><text x="175" y="164" fill="#1b1f24">E</text>
<rect x="220" y="120" width="70" height="70" rx="12" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><text x="255" y="164" fill="#1b1f24">V</text>
<rect x="300" y="120" width="70" height="70" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="4" /><text x="335" y="164" fill="#1b1f24">E</text>
<rect x="380" y="120" width="70" height="70" rx="12" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><text x="415" y="164" fill="#1b1f24">L</text>

<rect x="60" y="240" width="70" height="70" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="95" y="284" fill="#59636e">S</text>
<rect x="140" y="240" width="70" height="70" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="175" y="284" fill="#59636e">N</text>
<rect x="220" y="240" width="70" height="70" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="255" y="284" fill="#59636e">E</text>
<rect x="300" y="240" width="70" height="70" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="4" /><text x="335" y="284" fill="#1b1f24">E</text>
<rect x="380" y="240" width="70" height="70" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="415" y="284" fill="#59636e">R</text>

<rect x="640" y="120" width="70" height="70" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="675" y="164" fill="#59636e">S</text>
<rect x="720" y="120" width="70" height="70" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="755" y="164" fill="#59636e">N</text>
<rect x="800" y="120" width="70" height="70" rx="12" fill="#fdeede" stroke="#59636e" stroke-width="3" /><text x="835" y="164" fill="#1b1f24">E</text>
<rect x="880" y="120" width="70" height="70" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="4" /><text x="915" y="164" fill="#1b1f24">E</text>
<rect x="960" y="120" width="70" height="70" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="995" y="164" fill="#59636e">R</text>
</g>

<line x1="335" y1="190" x2="335" y2="230" stroke="#0067c0" stroke-width="4" />
<path d="M470 155H600" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" />

<g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="22" text-anchor="middle">
<text x="675" y="222" fill="#59636e">[.]</text>
<text x="755" y="222" fill="#59636e">[.]</text>
<text x="835" y="222" fill="#1b1f24">[o]</text>
<text x="915" y="222" fill="#1b1f24">[X]</text>
<text x="995" y="222" fill="#59636e">[.]</text>
</g>

<g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="21">
<rect x="60" y="380" width="390" height="56" rx="12" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="80" y="415" fill="#1b1f24">remaining l:2 e:2 v:1 &#8594; l:2 e:1 v:1</text>
<rect x="640" y="380" width="390" height="56" rx="12" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="660" y="415" fill="#1b1f24">e claimed once &#8594; second E is a miss</text>
</g>
</svg>
