<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Two code paths to the same answer in pandas and dplyr</title><desc id="desc">Diagram showing pandas and dplyr as two separate three-step chains that both start from reading the same CSV file and both arrive at the same result: Gentoo penguins average 5076.0 grams of body mass.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="300" y="50" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">PANDAS</text><text x="900" y="50" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">DPLYR</text></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" fill="#1b1f24"><rect x="130" y="90" width="340" height="74" rx="14" fill="#ffffff" stroke="#7fb0d8" stroke-width="3" /><text x="300" y="134" text-anchor="middle">pd.read_csv(csv)</text><rect x="130" y="210" width="340" height="74" rx="14" fill="#ffffff" stroke="#7fb0d8" stroke-width="3" /><text x="300" y="254" text-anchor="middle">.groupby(&quot;species&quot;)</text><rect x="130" y="330" width="340" height="74" rx="14" fill="#ffffff" stroke="#7fb0d8" stroke-width="3" /><text x="300" y="374" text-anchor="middle">[&quot;body_mass_g&quot;].mean()</text><rect x="730" y="90" width="340" height="74" rx="14" fill="#ffffff" stroke="#e0b184" stroke-width="3" /><text x="900" y="134" text-anchor="middle">read_csv(csv)</text><rect x="730" y="210" width="340" height="74" rx="14" fill="#ffffff" stroke="#e0b184" stroke-width="3" /><text x="900" y="254" text-anchor="middle">group_by(species)</text><rect x="730" y="330" width="340" height="74" rx="14" fill="#ffffff" stroke="#e0b184" stroke-width="3" /><text x="900" y="374" text-anchor="middle">summarise(mean(mass))</text></g><g stroke="#c7ccd2" stroke-width="5" fill="none" stroke-linecap="round"><path d="M300 164V210" /><path d="M300 284V330" /><path d="M900 164V210" /><path d="M900 284V330" /></g><path d="M300 404C300 440 520 440 520 460" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M900 404C900 440 680 440 680 460" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><rect x="450" y="460" width="300" height="76" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle"><text x="600" y="490" font-size="18" font-weight="600" fill="#59636e">SAME RESULT</text><text x="600" y="519" font-size="22" font-weight="700" fill="#1b1f24" font-family="'SFMono-Regular', Consolas, Menlo, monospace">Gentoo: 5076.0 g</text></g></svg>
