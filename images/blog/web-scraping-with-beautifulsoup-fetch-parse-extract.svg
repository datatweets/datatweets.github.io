<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The fetch-parse-extract pipeline for a single page</title><desc id="desc">Diagram of the fetch-parse-extract pipeline: an HTTP GET request to scrapeme.live returns raw HTML with status code 200, BeautifulSoup parses that HTML into a tree of nested tags, and find/find_all/select calls extract 16 product records from that single page into a list of Python dictionaries.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="80" y="56" font-size="26" font-weight="600" fill="#0067c0">FETCH</text><text x="360" y="56" font-size="26" font-weight="600" fill="#0067c0">PARSE</text><text x="640" y="56" font-size="26" font-weight="600" fill="#0067c0">FIND &amp; EXTRACT</text><text x="990" y="56" font-size="26" font-weight="600" fill="#0067c0">RESULT</text><rect x="60" y="90" width="220" height="130" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><g font-size="18" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="80" y="126" fill="#1b1f24">requests.get(url)</text><text x="80" y="154" fill="#59636e">status_code: 200</text><text x="80" y="178" fill="#59636e">bytes: 52601</text></g><path d="M280 155H340" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="340" y="80" width="240" height="150" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><g font-size="17" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="360" y="112" fill="#1b1f24">BeautifulSoup(</text><text x="360" y="134" fill="#1b1f24">  html, "html.parser")</text></g><g stroke="#c7ccd2" stroke-width="3"><path d="M375 150H545" /><path d="M395 168H545" /><path d="M415 186H505" /><path d="M415 204H525" /></g><path d="M580 155H640" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="640" y="70" width="270" height="170" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><g font-size="17" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="660" y="102" fill="#1b1f24">soup.find_all(</text><text x="660" y="124" fill="#1b1f24">  "li", class_="product")</text><text x="660" y="152" fill="#59636e">soup.select("li.product")</text><text x="660" y="180" fill="#0067c0" font-weight="600">→ 16 matches</text></g><path d="M910 155H970" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><rect x="970" y="90" width="180" height="140" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><g font-size="16" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="988" y="106" width="146" height="22" rx="6" fill="#e6f4e6" /><text x="996" y="122" fill="#1b1f24">name</text><rect x="988" y="134" width="146" height="22" rx="6" fill="#e3f0fa" /><text x="996" y="150" fill="#1b1f24">price</text><rect x="988" y="162" width="146" height="22" rx="6" fill="#fdeede" /><text x="996" y="178" fill="#1b1f24">url</text><text x="988" y="208" fill="#59636e">16 dicts</text></g><path d="M120 220V300" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><rect x="60" y="300" width="1090" height="70" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="2" /><text x="86" y="342" font-size="19" fill="#1b1f24" font-family="'SFMono-Regular', Consolas, Menlo, monospace">{'name': 'Bulbasaur', 'price': '£63.00', 'url': 'https://scrapeme.live/shop/Bulbasaur/'}</text></g></svg>
