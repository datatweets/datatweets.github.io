<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Save and reload a complete neural network pipeline in Python</title>
  <desc id="desc">A fitted pipeline containing a scaler and neural network is saved as one joblib file, then reloaded with both fitted steps intact.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" fill="#59636e">MODEL PERSISTENCE</text>
    <text x="90" y="278" font-size="82" font-weight="700" fill="#1b1f24">SAVE THE</text>
    <text x="90" y="374" font-size="82" font-weight="700" fill="#1b1f24">WHOLE PATH</text>
    <rect x="98" y="410" width="350" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="488" font-size="30" font-weight="500" fill="#59636e">scale &#183; predict &#183; reload</text>

    <g aria-hidden="true">
      <rect x="720" y="112" width="392" height="150" rx="20" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <text x="746" y="145" font-size="18" font-weight="600" fill="#59636e" letter-spacing="1.5">FITTED PIPELINE</text>
      <rect x="746" y="168" width="142" height="65" rx="13" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
      <text x="817" y="209" text-anchor="middle" font-size="23" font-weight="700" fill="#1b1f24">SCALER</text>
      <line x1="898" y1="200" x2="932" y2="200" stroke="#0067c0" stroke-width="4"/>
      <rect x="944" y="168" width="142" height="65" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
      <text x="1015" y="209" text-anchor="middle" font-size="23" font-weight="700" fill="#1b1f24">NETWORK</text>

      <line x1="916" y1="262" x2="916" y2="303" stroke="#0067c0" stroke-width="4"/>
      <text x="940" y="290" font-size="17" font-weight="600" fill="#0067c0">SAVE</text>
      <rect x="824" y="307" width="184" height="74" rx="10" fill="#fff7e8" stroke="#b7791f" stroke-width="2"/>
      <text x="916" y="352" text-anchor="middle" font-size="21" font-weight="700" fill="#1b1f24">JOBLIB FILE</text>

      <line x1="916" y1="381" x2="916" y2="422" stroke="#0067c0" stroke-width="4"/>
      <text x="940" y="409" font-size="17" font-weight="600" fill="#0067c0">LOAD</text>

      <rect x="720" y="426" width="392" height="150" rx="20" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <text x="746" y="459" font-size="18" font-weight="600" fill="#59636e" letter-spacing="1.5">RELOADED PIPELINE</text>
      <rect x="746" y="482" width="142" height="65" rx="13" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
      <text x="817" y="523" text-anchor="middle" font-size="23" font-weight="700" fill="#1b1f24">SCALER</text>
      <line x1="898" y1="514" x2="932" y2="514" stroke="#0067c0" stroke-width="4"/>
      <rect x="944" y="482" width="142" height="65" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
      <text x="1015" y="523" text-anchor="middle" font-size="23" font-weight="700" fill="#1b1f24">NETWORK</text>
    </g>
  </g>
</svg>
