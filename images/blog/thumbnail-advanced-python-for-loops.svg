<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Advanced Python for loops thumbnail</title><desc id="desc">A minimal thumbnail for a tutorial on advanced for loop patterns in Python: enumerate, zip, else, and comprehensions.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="38" font-weight="600" fill="#59636e">Beyond the basics of iteration</text><text x="90" y="340" font-size="130" font-weight="700" fill="#1b1f24">for</text><text x="390" y="340" font-size="130" font-weight="700" fill="#0067c0">loops</text><rect x="100" y="364" width="440" height="12" rx="6" fill="#0067c0" /><text x="98" y="450" font-size="34" font-weight="500" fill="#59636e">enumerate &#183; zip &#183; else &#183; comprehensions</text></g><g transform="translate(780 140)"><rect x="0" y="0" width="260" height="44" rx="10" fill="#0067c0" /><text x="130" y="30" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="20" fill="#ffffff" text-anchor="middle">enumerate()</text><rect x="0" y="56" width="260" height="44" rx="10" fill="#f0f4f8" stroke="#0067c0" stroke-width="3" /><text x="130" y="86" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="20" fill="#0067c0" text-anchor="middle">zip()</text><rect x="0" y="112" width="260" height="44" rx="10" fill="#f0f4f8" stroke="#d0d5db" stroke-width="3" /><text x="130" y="142" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="20" fill="#59636e" text-anchor="middle">for...else</text><rect x="0" y="168" width="260" height="44" rx="10" fill="#f0f4f8" stroke="#d0d5db" stroke-width="3" /><text x="130" y="198" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="20" fill="#59636e" text-anchor="middle">[x for x in ...]</text></g></svg>
