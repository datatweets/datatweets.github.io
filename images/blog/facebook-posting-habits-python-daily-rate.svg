<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Bucket, rate, compare: the real posts-per-day pattern</title><desc id="desc">A bar chart of real posts-per-day counts from the tutorial's verified synthetic dataset: a quiet day plotted honestly as zero, a typical day at one post, and three unusually busy days on August 15 with eight posts, September 25 with ten posts, and November 10 with nine posts, compared against a dashed baseline line at the true average of 1.14 posts per day.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="600" y="54" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">BUCKET &#183; RATE &#183; COMPARE</text><line x1="140" y1="80" x2="140" y2="460" stroke="#c7ccd2" stroke-width="2" /><line x1="140" y1="460" x2="1060" y2="460" stroke="#c7ccd2" stroke-width="2" /><line x1="140" y1="420" x2="1060" y2="420" stroke="#59636e" stroke-width="3" stroke-dasharray="10 8" /><text x="1050" y="410" font-size="22" fill="#59636e" text-anchor="end" font-family="'SFMono-Regular', Consolas, Menlo, monospace">baseline: 1.14 posts/day</text><g><circle cx="210" cy="460" r="7" fill="#d0d5db" /><text x="210" y="440" font-size="24" font-weight="600" fill="#59636e" text-anchor="middle">0</text><text x="210" y="490" font-size="22" fill="#59636e" text-anchor="middle">Quiet day</text></g><g><rect x="340" y="427" width="120" height="33" rx="6" fill="#d0d5db" /><text x="400" y="415" font-size="24" font-weight="600" fill="#59636e" text-anchor="middle">1</text><text x="400" y="490" font-size="22" fill="#59636e" text-anchor="middle">Typical day</text></g><g><rect x="500" y="196" width="120" height="264" rx="6" fill="#0067c0" /><text x="560" y="180" font-size="24" font-weight="600" fill="#1b1f24" text-anchor="middle">8</text><text x="560" y="490" font-size="22" fill="#1b1f24" text-anchor="middle">Aug 15</text></g><g><rect x="660" y="130" width="120" height="330" rx="6" fill="#0067c0" /><text x="720" y="114" font-size="24" font-weight="600" fill="#1b1f24" text-anchor="middle">10</text><text x="720" y="490" font-size="22" fill="#1b1f24" text-anchor="middle">Sep 25</text></g><g><rect x="820" y="163" width="120" height="297" rx="6" fill="#0067c0" /><text x="880" y="147" font-size="24" font-weight="600" fill="#1b1f24" text-anchor="middle">9</text><text x="880" y="490" font-size="22" fill="#1b1f24" text-anchor="middle">Nov 10</text></g><text x="140" y="524" font-size="20" fill="#59636e">122-day window &#183; 46 quiet days plotted as real zeros, not dropped</text></g></svg>
