<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Average body mass by penguin species, the polished chart</title><desc id="desc">A recreated bar chart from the post's own verified output: Adelie penguins average 3,701 grams, Chinstrap 3,733 grams, and Gentoo 5,076 grams. The chart demonstrates the post's own advice: a deliberate blue, amber, and green qualitative palette, no gridlines, no box spines, no legend, only a bottom axis line, and each bar labeled with its exact value plus a direct callout on the Gentoo bar noting it averages 1,359 grams heavier than the other two species.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="60" y="66" font-size="30" font-weight="700" fill="#1b1f24">Gentoo penguins are the outlier, not just the tallest bar</text><text x="60" y="96" font-size="18" fill="#59636e">Average body mass by species, Palmer Station penguins (n=342)</text><line x1="80" y1="460" x2="1120" y2="460" stroke="#1b1f24" stroke-width="2" stroke-linecap="round" /><rect x="100" y="227" width="220" height="233" rx="8" fill="#0067c0" /><text x="210" y="212" font-size="24" font-weight="700" fill="#1b1f24" text-anchor="middle">3,701 g</text><text x="210" y="490" font-size="22" fill="#59636e" text-anchor="middle">Adelie</text><rect x="490" y="225" width="220" height="235" rx="8" fill="#c76b28" /><text x="600" y="210" font-size="24" font-weight="700" fill="#1b1f24" text-anchor="middle">3,733 g</text><text x="600" y="490" font-size="22" fill="#59636e" text-anchor="middle">Chinstrap</text><rect x="880" y="140" width="220" height="320" rx="8" fill="#2f7d4f" /><text x="990" y="125" font-size="24" font-weight="700" fill="#1b1f24" text-anchor="middle">5,076 g</text><text x="990" y="490" font-size="22" fill="#59636e" text-anchor="middle">Gentoo</text><path d="M860 220 L720 255" fill="none" stroke="#59636e" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" /><rect x="430" y="185" width="300" height="76" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="2" /><text x="450" y="215" font-size="19" font-weight="700" fill="#1b1f24">+1,359 g heavier</text><text x="450" y="240" font-size="17" fill="#59636e">than the other two species</text></g></svg>
