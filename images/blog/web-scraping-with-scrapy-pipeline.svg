<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The Scrapy data path from spider to export</title><desc id="desc">Diagram of the Scrapy data path: a spider requests a page and gets back a response, CSS or XPath selectors extract fields from that response into an Item, the Item passes through an item pipeline that can clean or drop it, and surviving items are written to a CSV or JSON export. A worked example shows 48 items scraped and 20 kept after a budget filter.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="110" y="56" font-size="26" font-weight="600" fill="#0067c0">SPIDER</text><text x="380" y="56" font-size="26" font-weight="600" fill="#0067c0">SELECTOR</text><text x="650" y="56" font-size="26" font-weight="600" fill="#0067c0">ITEM PIPELINE</text><text x="990" y="56" font-size="26" font-weight="600" fill="#0067c0">EXPORT</text><rect x="60" y="90" width="180" height="110" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><g font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="80" y="128" fill="#1b1f24">start_urls</text><text x="80" y="156" fill="#59636e">response.follow</text><text x="80" y="180" fill="#59636e">(next page)</text></g><path d="M240 145H320" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="320" y="90" width="200" height="110" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><g font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="340" y="128" fill="#1b1f24">response.css()</text><text x="340" y="154" fill="#1b1f24">response.xpath()</text><text x="340" y="180" fill="#59636e">→ ListingItem</text></g><path d="M520 145H600" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="600" y="80" width="230" height="130" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><g font-size="18" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="620" y="112" fill="#1b1f24">BudgetFilterPipeline</text><text x="620" y="140" fill="#59636e">price → float</text><text x="620" y="164" fill="#59636e">drop if &gt; budget</text></g><text x="600" y="230" font-size="17" fill="#59636e" font-family="'SFMono-Regular', Consolas, Menlo, monospace">48 scraped → 20 kept</text><path d="M830 145H910" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><rect x="910" y="90" width="220" height="110" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><g font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="930" y="112" width="180" height="24" rx="6" fill="#e6f4e6" /><text x="940" y="129" fill="#1b1f24">watchlist.csv</text><rect x="930" y="144" width="180" height="24" rx="6" fill="#e3f0fa" /><text x="940" y="161" fill="#1b1f24">20 rows</text></g><path d="M715 210V300" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="600" y="300" width="230" height="70" rx="14" fill="#fdeede" stroke="#d0d5db" stroke-width="2" /><text x="620" y="332" font-size="18" fill="#59636e" font-family="'SFMono-Regular', Consolas, Menlo, monospace">DropItem</text><text x="620" y="356" font-size="17" fill="#59636e" font-family="'SFMono-Regular', Consolas, Menlo, monospace">28 over budget</text></g></svg>