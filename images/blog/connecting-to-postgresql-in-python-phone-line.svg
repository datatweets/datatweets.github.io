<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The connect-cursor-query mental model for psycopg2</title><desc id="desc">Diagram of the connect-cursor-query mental model: psycopg2.connect opens a phone line to the PostgreSQL server, a cursor speaks into that line, a SELECT statement asks a question and gets rows back via fetchone, fetchall, or fetchmany, and an UPDATE or DELETE statement gives an instruction and gets back a row count.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="245" y="50" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">CONNECT</text><text x="680" y="50" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">CURSOR</text><rect x="40" y="210" width="190" height="90" rx="16" fill="#ffffff" stroke="#59636e" stroke-width="3" /><rect x="310" y="210" width="190" height="90" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><rect x="580" y="210" width="170" height="90" rx="16" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><rect x="860" y="60" width="280" height="150" rx="16" fill="#ffffff" stroke="#8fbc8f" stroke-width="3" /><rect x="860" y="340" width="280" height="90" rx="16" fill="#ffffff" stroke="#e0b184" stroke-width="3" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="135" y="262" font-size="22" fill="#1b1f24" text-anchor="middle">python script</text><text x="405" y="262" font-size="22" fill="#1b1f24" text-anchor="middle">connection</text><text x="665" y="262" font-size="22" fill="#0067c0" text-anchor="middle">cursor</text></g><path d="M230 255H300" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M284 235L304 255L284 275" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="265" y="235" font-size="18" fill="#0067c0" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">connect()</text><path d="M500 255H570" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M554 235L574 255L554 275" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="535" y="235" font-size="18" fill="#0067c0" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">cursor()</text><path d="M750 235C810 235 800 135 856 135" fill="none" stroke="#8fbc8f" stroke-width="5" stroke-linecap="round" /><path d="M838 117L858 135L838 153" fill="none" stroke="#8fbc8f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="800" y="105" font-size="18" fill="#0067c0" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">SELECT ...;</text><path d="M750 275C810 275 800 375 856 375" fill="none" stroke="#e0b184" stroke-width="5" stroke-linecap="round" /><path d="M838 357L858 375L838 393" fill="none" stroke="#e0b184" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="800" y="410" font-size="17" fill="#0067c0" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">INSERT / UPDATE / DELETE ...;</text><text x="1000" y="90" font-size="20" font-weight="600" fill="#59636e" text-anchor="middle">rows</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="17"><rect x="884" y="104" width="232" height="32" rx="8" fill="#e6f4e6" /><text x="1000" y="126" fill="#1b1f24" text-anchor="middle">fetchone()</text><rect x="884" y="142" width="232" height="32" rx="8" fill="#e6f4e6" /><text x="1000" y="164" fill="#1b1f24" text-anchor="middle">fetchall()</text><rect x="884" y="180" width="232" height="32" rx="8" fill="#e6f4e6" /><text x="1000" y="202" fill="#1b1f24" text-anchor="middle">fetchmany(n)</text></g><text x="1000" y="378" font-size="20" font-weight="600" fill="#59636e" text-anchor="middle">cur.rowcount</text><text x="1000" y="406" font-size="17" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">rows affected</text></g></svg>
