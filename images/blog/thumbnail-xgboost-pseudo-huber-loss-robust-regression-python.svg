<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Reduce Outlier Impact with XGBoost Pseudo-Huber Loss in Python</title>
  <desc id="desc">DataTweets tutorial thumbnail. A squared-loss curve rises steeply for large residuals, while a Pseudo-Huber curve grows more slowly to show reduced outlier influence.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="92" y="145" font-size="32" font-weight="600" letter-spacing="1.5" fill="#59636e">ROBUST REGRESSION</text>
    <text x="90" y="270" font-size="80" font-weight="700" fill="#1b1f24">OUTLIERS</text>
    <text x="90" y="360" font-size="80" font-weight="700" fill="#1b1f24">PULL LESS</text>
    <rect x="92" y="405" width="380" height="12" rx="6" fill="#0067c0"/>
    <text x="92" y="482" font-size="29" font-weight="500" fill="#59636e">PSEUDO-HUBER &#183; VALIDATION &#183; MAE</text>

    <g transform="translate(680 118)">
      <text x="24" y="34" font-size="25" font-weight="600" letter-spacing="1" fill="#59636e">LOSS GROWTH</text>

      <line x1="34" y1="382" x2="438" y2="382" stroke="#59636e" stroke-width="3"/>
      <line x1="34" y1="382" x2="34" y2="82" stroke="#59636e" stroke-width="3"/>
      <path d="M 438 382 l -13 -8 v 16 z" fill="#59636e"/>
      <path d="M 34 82 l -8 13 h 16 z" fill="#59636e"/>
      <text x="260" y="422" font-size="22" font-weight="500" fill="#59636e">LARGE RESIDUAL</text>
      <text x="5" y="70" font-size="20" font-weight="500" fill="#59636e">LOSS</text>

      <path d="M 42 378 C 120 372, 205 345, 278 286 C 340 236, 392 160, 430 92" fill="none" stroke="#1b1f24" stroke-width="7" stroke-linecap="round"/>
      <path d="M 42 378 C 118 371, 203 349, 278 318 C 342 292, 392 258, 430 228" fill="none" stroke="#0067c0" stroke-width="7" stroke-linecap="round"/>

      <rect x="210" y="70" width="182" height="50" rx="12" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>
      <line x1="226" y1="95" x2="260" y2="95" stroke="#1b1f24" stroke-width="6" stroke-linecap="round"/>
      <text x="273" y="103" font-size="21" font-weight="600" fill="#1b1f24">SQUARED</text>

      <rect x="180" y="202" width="220" height="50" rx="12" fill="#ffffff" stroke="#b9d8f2" stroke-width="2"/>
      <line x1="196" y1="227" x2="230" y2="227" stroke="#0067c0" stroke-width="6" stroke-linecap="round"/>
      <text x="243" y="235" font-size="18" font-weight="600" fill="#0067c0">PSEUDO-HUBER</text>

      <line x1="430" y1="112" x2="430" y2="214" stroke="#9aa4ae" stroke-width="2" stroke-dasharray="7 7"/>
      <circle cx="430" cy="92" r="7" fill="#1b1f24"/>
      <circle cx="430" cy="228" r="7" fill="#0067c0"/>
    </g>
  </g>
</svg>
