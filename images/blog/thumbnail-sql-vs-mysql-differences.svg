<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">SQL vs MySQL thumbnail</title><desc id="desc">A minimal logo-style thumbnail for an article comparing SQL, the language, against MySQL, one of the engines that implements it, alongside PostgreSQL, SQLite, and SQL Server.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="34" font-weight="600" fill="#59636e">A language, and one of its engines</text><text x="90" y="392" font-size="150" font-weight="700" fill="#1b1f24">SQL</text><rect x="100" y="424" width="420" height="12" rx="6" fill="#0067c0" /><text x="98" y="506" font-size="32" font-weight="500" fill="#59636e">vs MySQL &#183; where they diverge</text></g><g transform="translate(792 120)" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="0" y="0" width="300" height="72" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="2" /><text x="24" y="30" font-size="24" font-weight="700" fill="#0067c0">MySQL</text><text x="24" y="56" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#1b1f24">backtick quotes</text><rect x="0" y="88" width="300" height="72" rx="14" fill="#e6f4e6" stroke="#0067c0" stroke-width="2" /><text x="24" y="118" font-size="24" font-weight="700" fill="#0067c0">Postgres</text><text x="24" y="144" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#1b1f24">&#8220;double&#8221; quotes</text><rect x="0" y="176" width="300" height="72" rx="14" fill="#fdeede" stroke="#0067c0" stroke-width="2" /><text x="24" y="206" font-size="24" font-weight="700" fill="#0067c0">SQLite</text><text x="24" y="232" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#1b1f24">loose typing</text><rect x="0" y="264" width="300" height="72" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="2" /><text x="24" y="294" font-size="24" font-weight="700" fill="#0067c0">SQL Server</text><text x="24" y="320" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#1b1f24">T-SQL dialect</text></g></svg>
