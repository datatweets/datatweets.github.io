<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The ask-decide-execute-answer round trip of function calling</title><desc id="desc">Diagram showing the function calling round trip: your code sends a user question plus tool schemas to the model, the model decides to request the check_stock tool instead of answering directly, your code executes the real check_stock function and gets back found true and price 14.50, and that result is appended to the conversation so the model's final answer reports the book is in stock for 14.50 euros.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="174" y="66" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">1 &#183; ASK</text><text x="458" y="66" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">2 &#183; DECIDE</text><text x="742" y="66" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">3 &#183; EXECUTE</text><text x="1026" y="66" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">4 &#183; ANSWER</text>

<rect x="48" y="100" width="252" height="230" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="174" y="128" font-size="17" font-weight="600" fill="#59636e" text-anchor="middle">your code calls the API</text><g font-size="15" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="64" y="142" width="220" height="60" rx="8" fill="#e3f0fa" /><text x="74" y="164" fill="#1b1f24">tools=[check_stock,</text><text x="74" y="184" fill="#1b1f24">estimate_delivery]</text><rect x="64" y="212" width="220" height="42" rx="8" fill="#fdeede" /><text x="74" y="238" fill="#1b1f24">user: "in stock?"</text></g>

<rect x="332" y="100" width="252" height="230" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="458" y="128" font-size="17" font-weight="600" fill="#59636e" text-anchor="middle">model requests a tool</text><g font-size="15" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="348" y="142" width="220" height="42" rx="8" fill="#e3f0fa" /><text x="358" y="168" fill="#1b1f24">finish_reason:</text><rect x="348" y="184" width="220" height="60" rx="8" fill="#fdeede" /><text x="358" y="206" fill="#1b1f24">tool_calls</text><text x="358" y="230" fill="#1b1f24">check_stock(title=...)</text></g>

<rect x="616" y="100" width="252" height="230" rx="16" fill="#ffffff" stroke="#8fbc8f" stroke-width="3" /><text x="742" y="128" font-size="17" font-weight="600" fill="#59636e" text-anchor="middle">your code runs it, for real</text><g font-size="15" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="632" y="142" width="220" height="42" rx="8" fill="#e6f4e6" /><text x="642" y="168" fill="#1b1f24">found: True</text><rect x="632" y="184" width="220" height="42" rx="8" fill="#e6f4e6" /><text x="642" y="210" fill="#1b1f24">price: 14.50</text><rect x="632" y="226" width="220" height="42" rx="8" fill="#e6f4e6" /><text x="642" y="252" fill="#1b1f24">format: paperback</text></g>

<rect x="900" y="100" width="252" height="230" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="1026" y="128" font-size="17" font-weight="600" fill="#59636e" text-anchor="middle">model uses the result</text><g font-size="14" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="916" y="142" width="220" height="42" rx="8" fill="#e3f0fa" /><text x="926" y="168" fill="#1b1f24">role: "tool", content:</text><rect x="916" y="184" width="220" height="72" rx="8" fill="#e6f4e6" /><text x="926" y="208" fill="#1b1f24">"in stock for 14.50</text><text x="926" y="230" fill="#1b1f24">euros, paperback"</text></g>

<path d="M300 215H327" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M318 203L332 215L318 227" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
<path d="M584 215H611" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M602 203L616 215L602 227" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
<path d="M868 215H895" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M886 203L900 215L886 227" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

<g font-size="18" fill="#59636e"><text x="174" y="374" text-anchor="middle">a question plus the tool schemas</text><text x="458" y="374" text-anchor="middle">JSON says which function, not text</text><text x="742" y="374" text-anchor="middle">the model never runs code itself</text><text x="1026" y="374" text-anchor="middle">the real result becomes the reply</text></g>

<path d="M1026 330C1026 470 174 470 174 340" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M162 350L174 336L186 350" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="516" font-size="20" fill="#59636e" text-anchor="middle">next question resends the same tool schemas, so any tool can fire again</text>

</g></svg>
