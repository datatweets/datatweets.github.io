<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Classifier alone versus a scaler-plus-classifier Pipeline on the wine dataset</title><desc id="desc">Diagram comparing a KNeighborsClassifier used alone on raw wine features, which scores 0.806 accuracy, against the same classifier chained after a StandardScaler inside a Pipeline, which scores 0.972 accuracy on the same held-out test set.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="60" y="72" font-size="26" font-weight="600" fill="#0067c0">CLASSIFIER ALONE</text><rect x="40" y="120" width="170" height="90" rx="14" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="125" y="158" font-size="19" fill="#1b1f24" text-anchor="middle">wine</text><text x="125" y="182" font-size="19" fill="#1b1f24" text-anchor="middle">features</text><path d="M210 165H510" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" /><path d="M498 155L512 165L498 175" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="510" y="115" width="230" height="100" rx="14" fill="#ffffff" stroke="#59636e" stroke-width="3" /><text x="625" y="152" font-size="19" font-weight="600" fill="#1b1f24" text-anchor="middle">KNeighbors-</text><text x="625" y="176" font-size="19" font-weight="600" fill="#1b1f24" text-anchor="middle">Classifier</text><text x="625" y="200" font-size="17" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">.predict()</text><path d="M740 165H778" fill="none" stroke="#59636e" stroke-width="4" stroke-linecap="round" /><path d="M766 155L780 165L766 175" fill="none" stroke="#59636e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="784" y="128" width="220" height="74" rx="37" fill="#fdeede" stroke="#e0b184" stroke-width="3" /><text x="894" y="173" font-size="24" font-weight="700" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">0.806</text><rect x="238" y="318" width="524" height="150" rx="18" fill="none" stroke="#0067c0" stroke-width="3" stroke-dasharray="2 0" /><text x="500" y="338" font-size="18" font-weight="600" fill="#0067c0" text-anchor="middle">PIPELINE</text><text x="60" y="304" font-size="26" font-weight="600" fill="#0067c0">SCALER + CLASSIFIER, CHAINED</text><rect x="40" y="350" width="170" height="90" rx="14" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="125" y="388" font-size="19" fill="#1b1f24" text-anchor="middle">wine</text><text x="125" y="412" font-size="19" fill="#1b1f24" text-anchor="middle">features</text><path d="M210 395H258" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><path d="M246 385L260 395L246 405" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="264" y="345" width="220" height="100" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="374" y="382" font-size="19" font-weight="600" fill="#1b1f24" text-anchor="middle">StandardScaler</text><text x="374" y="406" font-size="17" fill="#0067c0" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">.transform()</text><path d="M484 395H502" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><path d="M490 385L504 395L490 405" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="510" y="345" width="230" height="100" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="625" y="382" font-size="19" font-weight="600" fill="#1b1f24" text-anchor="middle">KNeighbors-</text><text x="625" y="406" font-size="19" font-weight="600" fill="#1b1f24" text-anchor="middle">Classifier</text><text x="625" y="428" font-size="17" fill="#0067c0" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">.predict()</text><path d="M740 395H778" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M766 383L782 395L766 407" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="784" y="358" width="220" height="74" rx="37" fill="#0067c0" /><text x="894" y="403" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">0.972</text></g></svg>