<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Check ARIMA Residuals with Ljung-Box Tests in Python</title>
  <desc id="desc">A DATATWEETS tutorial thumbnail with the headline Find What ARIMA Missed. Two residual autocorrelation diagrams compare a drift-only model with a lag-10 Ljung-Box p-value below 0.05 against an ARIMA 2, 1, 0 model with a p-value of 0.083.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="148" font-size="34" font-weight="600" fill="#59636e" letter-spacing="1.5">RESIDUAL DIAGNOSTICS</text>
    <text x="90" y="274" font-size="78" font-weight="700" fill="#1b1f24">FIND WHAT</text>
    <text x="90" y="369" font-size="78" font-weight="700" fill="#1b1f24">ARIMA MISSED</text>
    <rect x="96" y="410" width="330" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="492" font-size="29" font-weight="500" fill="#59636e">ACF &#183; LJUNG-BOX &#183; PYTHON</text>

    <g transform="translate(675 112)">
      <rect x="0" y="0" width="410" height="195" rx="18" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="24" y="38" font-size="22" font-weight="700" fill="#1b1f24">DRIFT ONLY</text>
      <rect x="250" y="15" width="136" height="34" rx="17" fill="#fdeede"/>
      <text x="268" y="39" font-size="18" font-weight="700" fill="#9b4d00">p &lt; 0.05</text>
      <rect x="46" y="93" width="330" height="34" rx="8" fill="#e3f0fa"/>
      <line x1="46" y1="110" x2="376" y2="110" stroke="#59636e" stroke-width="2"/>
      <line x1="82" y1="110" x2="82" y2="62" stroke="#9b4d00" stroke-width="8" stroke-linecap="round"/>
      <line x1="142" y1="110" x2="142" y2="76" stroke="#9b4d00" stroke-width="8" stroke-linecap="round"/>
      <line x1="202" y1="110" x2="202" y2="139" stroke="#9b4d00" stroke-width="8" stroke-linecap="round"/>
      <line x1="262" y1="110" x2="262" y2="86" stroke="#9b4d00" stroke-width="8" stroke-linecap="round"/>
      <line x1="322" y1="110" x2="322" y2="128" stroke="#9b4d00" stroke-width="8" stroke-linecap="round"/>
      <text x="24" y="174" font-size="20" font-weight="500" fill="#59636e">visible correlation remains</text>

      <rect x="0" y="225" width="410" height="195" rx="18" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="24" y="263" font-size="22" font-weight="700" fill="#1b1f24">ARIMA(2,1,0)</text>
      <rect x="238" y="240" width="148" height="34" rx="17" fill="#e3f0fa"/>
      <text x="256" y="264" font-size="18" font-weight="700" fill="#0067c0">p = 0.083</text>
      <rect x="46" y="318" width="330" height="34" rx="8" fill="#e3f0fa"/>
      <line x1="46" y1="335" x2="376" y2="335" stroke="#59636e" stroke-width="2"/>
      <line x1="82" y1="335" x2="82" y2="341" stroke="#0067c0" stroke-width="8" stroke-linecap="round"/>
      <line x1="142" y1="335" x2="142" y2="324" stroke="#0067c0" stroke-width="8" stroke-linecap="round"/>
      <line x1="202" y1="335" x2="202" y2="342" stroke="#0067c0" stroke-width="8" stroke-linecap="round"/>
      <line x1="262" y1="335" x2="262" y2="328" stroke="#0067c0" stroke-width="8" stroke-linecap="round"/>
      <line x1="322" y1="335" x2="322" y2="339" stroke="#0067c0" stroke-width="8" stroke-linecap="round"/>
      <text x="24" y="399" font-size="20" font-weight="500" fill="#59636e">no clear pattern detected</text>
    </g>
  </g>
</svg>
