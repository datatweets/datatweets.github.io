<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Cabin class proportions: population vs. naive random sample vs. stratified sample</title><desc id="desc">Grouped bar chart of the titanic dataset's class column across three groups: First, Second, and Third. Population proportions are First 24.2%, Second 20.7%, Third 55.1%. A naive random sample of 90 rows (seed 3) comes out First 23.3%, Second 16.7%, Third 60.0%, understating Second class and overstating Third. A stratified sample of 90 rows drawn with train_test_split's stratify option comes out First 24.4%, Second 20.0%, Third 55.6%, closely matching the population.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="600" y="34" font-size="26" font-weight="700" fill="#1b1f24" text-anchor="middle">Cabin Class Proportions: Population vs. Sample</text><g font-size="18" fill="#59636e"><rect x="150" y="54" width="16" height="16" rx="3" fill="#c7ccd2" /><text x="172" y="67">Population</text><rect x="440" y="54" width="16" height="16" rx="3" fill="#fdeede" /><text x="462" y="67">Naive random (n=90)</text><rect x="800" y="54" width="16" height="16" rx="3" fill="#0067c0" /><text x="822" y="67">Stratified (n=90)</text></g><path d="M105 460H1085" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" /><g stroke="#0067c0" stroke-width="2"><rect x="207" y="339" width="54" height="121" rx="4" fill="#c7ccd2" /><rect x="273" y="343" width="54" height="117" rx="4" fill="#fdeede" /><rect x="339" y="338" width="54" height="122" rx="4" fill="#0067c0" /><rect x="507" y="356" width="54" height="104" rx="4" fill="#c7ccd2" /><rect x="573" y="376" width="54" height="84" rx="4" fill="#fdeede" /><rect x="639" y="360" width="54" height="100" rx="4" fill="#0067c0" /><rect x="807" y="184" width="54" height="276" rx="4" fill="#c7ccd2" /><rect x="873" y="160" width="54" height="300" rx="4" fill="#fdeede" /><rect x="939" y="182" width="54" height="278" rx="4" fill="#0067c0" /></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="16" fill="#1b1f24" text-anchor="middle"><text x="234" y="329">24.2%</text><text x="300" y="333">23.3%</text><text x="366" y="328">24.4%</text><text x="534" y="346">20.7%</text><text x="600" y="366">16.7%</text><text x="666" y="350">20.0%</text><text x="834" y="174">55.1%</text><text x="900" y="150">60.0%</text><text x="966" y="172">55.6%</text></g><g font-size="22" fill="#59636e" text-anchor="middle"><text x="300" y="490">First</text><text x="600" y="490">Second</text><text x="900" y="490">Third</text></g><text x="600" y="536" font-size="18" font-weight="500" fill="#59636e" text-anchor="middle">891 Titanic passengers (seaborn titanic dataset) &#183; both samples drawn with random_state=3</text></g></svg>
