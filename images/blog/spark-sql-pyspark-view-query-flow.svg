<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">A DataFrame becomes a temp view, then a SQL query, then a DataFrame again</title><desc id="desc">Diagram showing a Spark DataFrame named sales_df registered as a temporary view called sales using createOrReplaceTempView, then queried with spark.sql to produce a new result DataFrame, which can either continue through DataFrame API methods such as filter and groupBy or be registered again as a view and queried with SQL a second time, because both interfaces compile to the same underlying execution plan.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="150" y="82" font-size="20" font-weight="600" fill="#59636e" text-anchor="middle">DATAFRAME</text><text x="570" y="82" font-size="20" font-weight="600" fill="#0067c0" text-anchor="middle">REGISTERED AS A VIEW</text><text x="1010" y="82" font-size="20" font-weight="600" fill="#59636e" text-anchor="middle">DATAFRAME AGAIN</text><rect x="40" y="110" width="220" height="70" rx="14" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="150" y="153" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24" fill="#1b1f24" text-anchor="middle">sales_df</text><path d="M260 145H452" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9" /><text x="356" y="95" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="13" fill="#0067c0" text-anchor="middle">.createOrReplaceTempView(&#34;sales&#34;)</text><rect x="460" y="100" width="220" height="90" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="570" y="128" font-size="15" font-weight="600" fill="#0067c0" text-anchor="middle">TEMP VIEW</text><text x="570" y="167" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="26" fill="#1b1f24" text-anchor="middle">sales</text><path d="M680 145H872" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9" /><text x="776" y="122" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="15" fill="#0067c0" text-anchor="middle">spark.sql(&#34;SELECT ...&#34;)</text><rect x="880" y="110" width="260" height="70" rx="14" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="1010" y="153" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24" fill="#1b1f24" text-anchor="middle">result</text><path d="M1010 180V292" fill="none" stroke="#59636e" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8" /><rect x="880" y="300" width="260" height="64" rx="14" fill="#e6f4e6" stroke="#8fbc8f" stroke-width="3" /><text x="1010" y="284" font-size="16" font-weight="600" fill="#59636e" text-anchor="middle">STILL A DATAFRAME</text><text x="1010" y="339" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="17" fill="#1b1f24" text-anchor="middle">.filter() / .groupBy()</text><path d="M880 332C700 332 640 200 588 194" fill="none" stroke="#59636e" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8" /><text x="740" y="260" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="15" fill="#59636e" text-anchor="middle">createOrReplaceTempView() again</text><text x="600" y="460" font-size="21" fill="#59636e" text-anchor="middle">SQL and the DataFrame API compile to the same execution plan &#8212; mix them in either direction.</text></g></svg>
