<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Direct vs Recursive XGBoost Forecasts: 14-Day MAE Results</title>
  <desc id="desc">A DataTweets tutorial thumbnail. One known history branches into a direct route with separate horizon models and a recursive route where predictions become later lag inputs.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0067c0"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="146" font-size="32" font-weight="600" letter-spacing="1" fill="#59636e">14-DAY XGBOOST</text>
    <text x="90" y="276" font-size="78" font-weight="700" fill="#1b1f24">ONE HISTORY</text>
    <text x="90" y="371" font-size="78" font-weight="700" fill="#1b1f24">TWO ROUTES</text>
    <rect x="94" y="407" width="356" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="481" font-size="26" font-weight="500" fill="#59636e">DIRECT &#183; RECURSIVE &#183; MAE</text>

    <g transform="translate(660 104)">
      <text x="0" y="28" font-size="20" font-weight="600" letter-spacing="1" fill="#59636e">SAME KNOWN HISTORY</text>
      <line x1="2" y1="78" x2="154" y2="78" stroke="#59636e" stroke-width="3"/>
      <circle cx="12" cy="78" r="8" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>
      <circle cx="58" cy="78" r="8" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>
      <circle cx="104" cy="78" r="8" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>
      <circle cx="150" cy="78" r="11" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
      <text x="78" y="119" font-size="17" font-weight="600" fill="#59636e">ORIGIN</text>

      <path d="M 161 78 C 188 95, 187 151, 214 166" fill="none" stroke="#59636e" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
      <text x="214" y="143" font-size="20" font-weight="700" fill="#1b1f24">DIRECT</text>
      <rect x="214" y="164" width="72" height="58" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="2.5"/>
      <rect x="306" y="164" width="72" height="58" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="2.5"/>
      <rect x="398" y="164" width="72" height="58" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="2.5"/>
      <text x="232" y="201" font-size="22" font-weight="700" fill="#0067c0">H1</text>
      <text x="324" y="201" font-size="22" font-weight="700" fill="#0067c0">H7</text>
      <text x="410" y="201" font-size="22" font-weight="700" fill="#0067c0">H14</text>
      <text x="214" y="252" font-size="17" font-weight="500" fill="#59636e">SEPARATE HORIZON MODELS</text>

      <path d="M 161 78 C 190 123, 184 323, 214 341" fill="none" stroke="#59636e" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
      <text x="214" y="318" font-size="20" font-weight="700" fill="#1b1f24">RECURSIVE</text>
      <rect x="214" y="338" width="96" height="58" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="2.5"/>
      <text x="229" y="363" font-size="15" font-weight="600" fill="#59636e">ONE-DAY</text>
      <text x="232" y="384" font-size="15" font-weight="700" fill="#1b1f24">MODEL</text>
      <line x1="314" y1="367" x2="343" y2="367" stroke="#0067c0" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
      <circle cx="359" cy="367" r="16" fill="#ffffff" stroke="#0067c0" stroke-width="2.5"/>
      <line x1="377" y1="367" x2="399" y2="367" stroke="#0067c0" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
      <circle cx="415" cy="367" r="16" fill="#ffffff" stroke="#0067c0" stroke-width="2.5"/>
      <line x1="433" y1="367" x2="453" y2="367" stroke="#0067c0" stroke-width="2.5" stroke-dasharray="5 6" marker-end="url(#arrow-blue)"/>
      <circle cx="469" cy="367" r="16" fill="#ffffff" stroke="#0067c0" stroke-width="2.5"/>
      <text x="350" y="407" font-size="15" font-weight="600" fill="#59636e">H1</text>
      <text x="406" y="407" font-size="15" font-weight="600" fill="#59636e">H2</text>
      <text x="457" y="407" font-size="15" font-weight="600" fill="#59636e">H14</text>
      <text x="214" y="442" font-size="17" font-weight="500" fill="#59636e">PREDICTIONS BECOME LAGS</text>
    </g>
  </g>
</svg>
