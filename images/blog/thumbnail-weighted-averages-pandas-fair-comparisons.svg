<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Weighted averages in pandas for fair group comparisons</title>
  <desc id="desc">Three differently sized workload bars become three equal shared-weight bars, showing how common weights make group rates comparable.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>
  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="36" font-weight="600" fill="#59636e">ONE SHARED WORKLOAD</text>
    <text x="90" y="300" font-size="88" font-weight="700" fill="#1b1f24">COMPARE</text>
    <text x="90" y="398" font-size="88" font-weight="700" fill="#1b1f24">FAIRLY</text>
    <rect x="96" y="432" width="380" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="510" font-size="31" font-weight="500" fill="#59636e">RATES · WEIGHTS · GROUPS</text>
  </g>
  <g transform="translate(700 126)" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="18" font-size="22" font-weight="600" fill="#59636e">ACTUAL MIX</text>
    <rect x="0" y="48" width="210" height="34" rx="8" fill="#d9eafa"/><rect x="210" y="48" width="105" height="34" rx="8" fill="#8fc0e8"/><rect x="315" y="48" width="35" height="34" rx="8" fill="#0067c0"/>
    <rect x="0" y="104" width="70" height="34" rx="8" fill="#d9eafa"/><rect x="70" y="104" width="140" height="34" rx="8" fill="#8fc0e8"/><rect x="210" y="104" width="140" height="34" rx="8" fill="#0067c0"/>
    <rect x="0" y="160" width="123" height="34" rx="8" fill="#d9eafa"/><rect x="123" y="160" width="122" height="34" rx="8" fill="#8fc0e8"/><rect x="245" y="160" width="105" height="34" rx="8" fill="#0067c0"/>
    <text x="160" y="274" font-size="42" font-weight="500" fill="#59636e">↓</text>
    <text x="0" y="316" font-size="22" font-weight="600" fill="#59636e">SAME WEIGHTS</text>
    <g transform="translate(0 340)">
      <rect x="0" y="0" width="134" height="34" rx="8" fill="#d9eafa"/><rect x="134" y="0" width="122" height="34" rx="8" fill="#8fc0e8"/><rect x="256" y="0" width="94" height="34" rx="8" fill="#0067c0"/>
      <rect x="0" y="52" width="134" height="34" rx="8" fill="#d9eafa"/><rect x="134" y="52" width="122" height="34" rx="8" fill="#8fc0e8"/><rect x="256" y="52" width="94" height="34" rx="8" fill="#0067c0"/>
      <rect x="0" y="104" width="134" height="34" rx="8" fill="#d9eafa"/><rect x="134" y="104" width="122" height="34" rx="8" fill="#8fc0e8"/><rect x="256" y="104" width="94" height="34" rx="8" fill="#0067c0"/>
    </g>
  </g>
</svg>
