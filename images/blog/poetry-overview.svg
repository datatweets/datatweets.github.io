<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="A diagram with pyproject.toml at the centre, connected to four areas Poetry manages: a virtual environment created automatically, dependencies added and removed with poetry add and poetry remove, a poetry.lock file with exact pinned versions, and build and publish to PyPI."><title>Poetry project workflow overview</title><desc>Diagram showing Poetry managing a Python project environment, dependencies, lock file, build, and publishing workflow.</desc><rect width="640" height="420" fill="#ffffff" /><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">One file, the whole project lifecycle</text><g stroke="#cbd5e0" stroke-width="2"><line x1="255" y1="195" x2="200" y2="126" /><line x1="385" y1="195" x2="440" y2="126" /><line x1="255" y1="240" x2="200" y2="312" /><line x1="385" y1="240" x2="440" y2="312" /></g><rect x="252" y="187" width="136" height="62" rx="10" fill="#d6e8f7" stroke="#0067c0" stroke-width="2.5" /><text x="320" y="214" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0a3d62">pyproject.toml</text><text x="320" y="232" text-anchor="middle" font-size="10.5" fill="#2b6cb0">managed by Poetry</text><rect x="40" y="70" width="190" height="56" rx="9" fill="#eef7f0" stroke="#1e7d34" stroke-width="1.6" /><text x="135" y="93" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e7d34">Virtual environment</text><text x="135" y="111" text-anchor="middle" font-size="10.5" fill="#3f7d52">created automatically</text><rect x="410" y="70" width="190" height="56" rx="9" fill="#eef4fb" stroke="#0067c0" stroke-width="1.6" /><text x="505" y="93" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0067c0">Dependencies</text><text x="505" y="111" text-anchor="middle" font-size="10.5" fill="#2b6cb0">poetry add / remove</text><rect x="40" y="312" width="190" height="56" rx="9" fill="#f6f1fb" stroke="#7c3aed" stroke-width="1.6" /><text x="135" y="335" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b21a8">poetry.lock</text><text x="135" y="353" text-anchor="middle" font-size="10.5" fill="#7c3aed">exact pinned versions</text><rect x="410" y="312" width="190" height="56" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6" /><text x="505" y="335" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">Build and publish</text><text x="505" y="353" text-anchor="middle" font-size="10.5" fill="#9a3412">to PyPI</text></svg>