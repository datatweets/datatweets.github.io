<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">SQL commands, by category, thumbnail</title><desc id="desc">A minimal logo-style thumbnail for an article organizing SQL commands into five categories: DDL, DML, DQL, DCL, and TCL.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="34" font-weight="600" fill="#59636e">Five categories, every keyword</text><text x="90" y="392" font-size="150" font-weight="700" fill="#1b1f24">SQL</text><rect x="100" y="424" width="420" height="12" rx="6" fill="#0067c0" /><text x="98" y="506" font-size="32" font-weight="500" fill="#59636e">DDL &#183; DML &#183; DQL &#183; DCL &#183; TCL</text></g><g transform="translate(792 120)" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="0" y="0" width="290" height="72" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="2" /><text x="24" y="46" font-size="30" font-weight="700" fill="#0067c0">DDL</text><text x="120" y="46" font-size="22" fill="#1b1f24">structure</text><rect x="0" y="88" width="290" height="72" rx="14" fill="#e6f4e6" stroke="#0067c0" stroke-width="2" /><text x="24" y="134" font-size="30" font-weight="700" fill="#0067c0">DML</text><text x="120" y="134" font-size="22" fill="#1b1f24">rows</text><rect x="0" y="176" width="290" height="72" rx="14" fill="#fdeede" stroke="#0067c0" stroke-width="2" /><text x="24" y="222" font-size="30" font-weight="700" fill="#0067c0">DQL</text><text x="120" y="222" font-size="22" fill="#1b1f24">reads only</text><rect x="0" y="264" width="290" height="72" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="2" /><text x="24" y="310" font-size="30" font-weight="700" fill="#0067c0">DCL</text><text x="120" y="310" font-size="22" fill="#1b1f24">access