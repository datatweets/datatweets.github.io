<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Test a Python time series forecasting environment</title>
  <desc id="desc">A forecasting smoke-test thumbnail. On the left, the words Test the Full Path introduce the lesson. On the right, one checked path connects a virtual environment, daily dates, future-only folds, a forecast, and a saved SVG chart.</desc>

  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="146" font-size="32" font-weight="600" letter-spacing="1.5" fill="#59636e">FORECASTING SMOKE TEST</text>
    <text x="90" y="277" font-size="82" font-weight="700" fill="#1b1f24">TEST THE</text>
    <text x="90" y="373" font-size="82" font-weight="700" fill="#1b1f24">FULL PATH</text>
    <rect x="94" y="410" width="372" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="487" font-size="29" font-weight="500" fill="#59636e">VENV &#183; DATES &#183; FOLDS &#183; PLOTS</text>

    <g transform="translate(700 105)">
      <rect x="0" y="0" width="394" height="464" rx="24" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="36" y="53" font-size="24" font-weight="600" letter-spacing="1.2" fill="#59636e">ONE COMPLETE RUN</text>

      <line x1="55" y1="100" x2="55" y2="399" stroke="#b8d7f0" stroke-width="6" stroke-linecap="round"/>

      <g transform="translate(30 75)">
        <rect x="0" y="0" width="334" height="58" rx="14" fill="#ffffff" stroke="#cbd1d8" stroke-width="2"/>
        <circle cx="25" cy="29" r="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
        <path d="M18 29 L23 34 L32 23" fill="none" stroke="#0067c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="55" y="37" font-size="25" font-weight="600" fill="#1b1f24">VIRTUAL ENV</text>
      </g>

      <g transform="translate(30 150)">
        <rect x="0" y="0" width="334" height="58" rx="14" fill="#ffffff" stroke="#cbd1d8" stroke-width="2"/>
        <circle cx="25" cy="29" r="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
        <path d="M18 29 L23 34 L32 23" fill="none" stroke="#0067c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="55" y="37" font-size="25" font-weight="600" fill="#1b1f24">DAILY DATES</text>
      </g>

      <g transform="translate(30 225)">
        <rect x="0" y="0" width="334" height="58" rx="14" fill="#ffffff" stroke="#cbd1d8" stroke-width="2"/>
        <circle cx="25" cy="29" r="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
        <path d="M18 29 L23 34 L32 23" fill="none" stroke="#0067c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="55" y="37" font-size="25" font-weight="600" fill="#1b1f24">FUTURE FOLDS</text>
      </g>

      <g transform="translate(30 300)">
        <rect x="0" y="0" width="334" height="58" rx="14" fill="#ffffff" stroke="#cbd1d8" stroke-width="2"/>
        <circle cx="25" cy="29" r="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
        <path d="M18 29 L23 34 L32 23" fill="none" stroke="#0067c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="55" y="37" font-size="25" font-weight="600" fill="#1b1f24">FORECAST + MAE</text>
      </g>

      <g transform="translate(30 375)">
        <rect x="0" y="0" width="334" height="58" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
        <circle cx="25" cy="29" r="14" fill="#0067c0"/>
        <path d="M18 29 L23 34 L32 23" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="55" y="37" font-size="25" font-weight="700" fill="#1b1f24">SAVED SVG</text>
      </g>
    </g>
  </g>
</svg>
