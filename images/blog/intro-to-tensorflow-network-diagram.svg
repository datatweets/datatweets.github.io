<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The trained network's layer stack and real training accuracy</title><desc id="desc">Left: the model's real layer stack, Input shape 28 by 28, Flatten producing 784 values with 0 parameters, Dense hidden layer of 128 units with relu activation and 100,480 parameters, and Dense output layer of 10 units with softmax activation and 1,290 parameters, for 101,770 total parameters. Right: a line chart of the model's real training and validation accuracy across 5 verified epochs, training accuracy rising from 0.9228 to 0.9859 and validation accuracy rising from 0.9647 to 0.9778, ending at 97.66 percent real test accuracy.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="60" y="42" font-size="26" font-weight="600" fill="#0067c0">THE LAYER STACK, WITH REAL SHAPES</text><text x="660" y="42" font-size="26" font-weight="600" fill="#0067c0">REAL ACCURACY, 5 VERIFIED EPOCHS</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="60" y="66" width="460" height="66" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="2" /><text x="80" y="93" font-size="20" font-weight="600" fill="#1b1f24">Input</text><text x="80" y="118" font-size="17" fill="#59636e" font-family="'SFMono-Regular', Consolas, Menlo, monospace">shape=(28, 28)</text><line x1="290" y1="132" x2="290" y2="160" stroke="#0067c0" stroke-width="4" /><path d="M280 152 L290 165 L300 152" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="60" y="166" width="460" height="66" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="2" /><text x="80" y="193" font-size="20" font-weight="600" fill="#1b1f24">Flatten()</text><text x="80" y="218" font-size="17" fill="#59636e" font-family="'SFMono-Regular', Consolas, Menlo, monospace">&#8594; (None, 784)   params: 0</text><line x1="290" y1="232" x2="290" y2="260" stroke="#0067c0" stroke-width="4" /><path d="M280 252 L290 265 L300 252" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="60" y="266" width="460" height="66" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="2" /><text x="80" y="293" font-size="20" font-weight="600" fill="#1b1f24">Dense(128, activation="relu")</text><text x="80" y="318" font-size="17" fill="#59636e" font-family="'SFMono-Regular', Consolas, Menlo, monospace">&#8594; (None, 128)   params: 100,480</text><line x1="290" y1="332" x2="290" y2="360" stroke="#0067c0" stroke-width="4" /><path d="M280 352 L290 365 L300 352" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="60" y="366" width="460" height="66" rx="12" fill="#fdeede" stroke="#0067c0" stroke-width="2" /><text x="80" y="393" font-size="20" font-weight="600" fill="#1b1f24">Dense(10, activation="softmax")</text><text x="80" y="418" font-size="17" fill="#59636e" font-family="'SFMono-Regular', Consolas, Menlo, monospace">&#8594; (None, 10)   params: 1,290</text></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="120" y="460" width="340" height="52" rx="26" fill="#0067c0" /><text x="290" y="493" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">101,770 total parameters</text></g><g transform="translate(660 80)"><line x1="60" y1="20" x2="520" y2="20" stroke="#e3e6ea" stroke-width="1" /><line x1="60" y1="84" x2="520" y2="84" stroke="#e3e6ea" stroke-width="1" /><line x1="60" y1="148" x2="520" y2="148" stroke="#e3e6ea" stroke-width="1" /><line x1="60" y1="212" x2="520" y2="212" stroke="#e3e6ea" stroke-width="1" /><line x1="60" y1="276" x2="520" y2="276" stroke="#e3e6ea" stroke-width="1" /><line x1="60" y1="340" x2="520" y2="340" stroke="#59636e" stroke-width="1.5" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="15" fill="#59636e" text-anchor="end"><text x="52" y="25">1.00</text><text x="52" y="89">0.98</text><text x="52" y="153">0.96</text><text x="52" y="217">0.94</text><text x="52" y="281">0.92</text><text x="52" y="345">0.90</text></g><polyline points="60.0,267.0 160.0,135.5 260.0,98.7 360.0,77.6 460.0,65.1" fill="none" stroke="#1b1f24" stroke-width="3" stroke-linejoin="round" /><polyline points="60.0,133.0 160.0,105.4 260.0,99.0 360.0,91.4 460.0,91.0" fill="none" stroke="#0067c0" stroke-width="3" stroke-linejoin="round" /><g fill="#1b1f24"><circle cx="60.0" cy="267.0" r="5" /><circle cx="160.0" cy="135.5" r="5" /><circle cx="260.0" cy="98.7" r="5" /><circle cx="360.0" cy="77.6" r="5" /><circle cx="460.0" cy="65.1" r="5" /></g><g fill="#0067c0"><circle cx="60.0" cy="133.0" r="5" /><circle cx="160.0" cy="105.4" r="5" /><circle cx="260.0" cy="99.0" r="5" /><circle cx="360.0" cy="91.4" r="5" /><circle cx="460.0" cy="91.0" r="5" /></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="15" fill="#59636e" text-anchor="middle"><text x="60" y="365">1</text><text x="160" y="365">2</text><text x="260" y="365">3</text><text x="360" y="365">4</text><text x="460" y="365">5</text></g><text x="290" y="392" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#1b1f24" text-anchor="middle">epoch</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#1b1f24"><line x1="700" y1="475" x2="730" y2="475" stroke="#1b1f24" stroke-width="3" /><text x="738" y="480">train accuracy (0.9228 &#8594; 0.9859)</text><line x1="700" y1="500" x2="730" y2="500" stroke="#0067c0" stroke-width="3" /><text x="738" y="505">val accuracy (0.9647 &#8594; 0.9778)</text></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="780" y="518" width="280" height="34" rx="17" fill="#0067c0" /><text x="920" y="541" font-size="16" font-weight="700" fill="#ffffff" text-