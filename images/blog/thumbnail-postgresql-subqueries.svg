<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">PostgreSQL subqueries thumbnail</title><desc id="desc">A minimal logo-style thumbnail for an article on PostgreSQL subqueries, correlated subqueries, EXISTS, and common table expressions.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="40" font-weight="600" fill="#59636e">One query, nested inside another</text><text x="90" y="392" font-size="140" font-weight="700" fill="#1b1f24">SUBQUERY</text><rect x="100" y="424" width="470" height="12" rx="6" fill="#0067c0" /><text x="98" y="506" font-size="32" font-weight="500" fill="#59636e">scalar &#183; correlated &#183; EXISTS &#183; CTE</text></g><g transform="translate(800 150)" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="0" y="0" width="290" height="330" rx="18" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="24" y="34" font-size="22" fill="#1b1f24">SELECT *</text><text x="24" y="62" font-size="22" fill="#1b1f24">FROM records</text><rect x="30" y="90" width="230" height="216" rx="16" fill="#fdeede" stroke="#0067c0" stroke-width="3" /><text x="52" y="124" font-size="20" fill="#1b1f24">WHERE price ></text><rect x="56" y="150" width="178" height="130" rx="14" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="76" y="184" font-size="18" fill="#1b1f24">SELECT</text><text x="76" y="210" font-size="18" fill="#1b1f24">AVG(price)</text><text x="76" y="236" font-size="18" fill="#1b1f24">FROM</text><text x="76" y="262" font-size="18" fill="#1b1f24">records</text></g></svg>