<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Joining two datasets with a dictionary lookup table</title><desc id="desc">A beer record holding a brewery_id of 408 is looked up in a brewery_lookup dictionary built from breweries.csv, where key 408 maps to the value 10 Barrel Brewing Company, and that name is attached onto the beer record as a new brewery field, producing a joined record with no merge or database needed.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="175" y="60" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">BEER RECORD</text><text x="600" y="60" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">LOOKUP TABLE</text><text x="1050" y="60" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">JOINED RECORD</text><rect x="60" y="100" width="230" height="200" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="175" y="130" font-size="20" font-weight="600" fill="#59636e" text-anchor="middle">from beers.csv</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="17"><rect x="76" y="146" width="198" height="34" rx="8" fill="#e3f0fa" /><text x="86" y="168" fill="#1b1f24">name: 'Pub Beer'</text><rect x="76" y="188" width="198" height="34" rx="8" fill="#fdeede" /><text x="86" y="210" fill="#1b1f24">style: 'Am. Pale...'</text><rect x="76" y="230" width="198" height="34" rx="8" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="86" y="252" fill="#1b1f24">brewery_id: '408'</text></g><rect x="460" y="90" width="280" height="230" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="600" y="122" font-size="20" font-weight="600" fill="#59636e" text-anchor="middle">brewery_lookup</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="16"><rect x="476" y="136" width="248" height="32" rx="8" fill="#ffffff" stroke="#d0d5db" stroke-width="2" /><text x="486" y="157" fill="#59636e">'166' &#8594; 'Oskar Blues Brewery'</text><rect x="476" y="176" width="248" height="32" rx="8" fill="#ffffff" stroke="#d0d5db" stroke-width="2" /><text x="486" y="197" fill="#59636e">'310' &#8594; 'Sun King Brewing'</text><rect x="476" y="216" width="248" height="32" rx="8" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="486" y="237" fill="#1b1f24">'408' &#8594; '10 Barrel Brewing Co.'</text><rect x="476" y="256" width="248" height="32" rx="8" fill="#ffffff" stroke="#d0d5db" stroke-width="2" /><text x="486" y="277" fill="#59636e">&#8230; 554 more breweries</text></g><rect x="920" y="100" width="230" height="200" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="1035" y="130" font-size="20" font-weight="600" fill="#59636e" text-anchor="middle">after the join</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="17"><rect x="936" y="146" width="198" height="34" rx="8" fill="#e3f0fa" /><text x="946" y="168" fill="#1b1f24">name: 'Pub Beer'</text><rect x="936" y="188" width="198" height="34" rx="8" fill="#fdeede" /><text x="946" y="210" fill="#1b1f24">style: 'Am. Pale...'</text><rect x="936" y="230" width="198" height="34" rx="8" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="946" y="252" fill="#1b1f24">brewery: '10 Barrel...'</text></g><path d="M290 247C360 247 360 232 460 232" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><text x="375" y="220" font-size="15" fill="#59636e" text-anchor="middle">lookup by key</text><path d="M740 232C830 232 830 247 920 247" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><text x="830" y="220" font-size="15" fill="#59636e" text-anchor="middle">attach result</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="600" y="470" font-size="19" fill="#59636e" text-anchor="middle">brewery_lookup = {b['id']: b['name'] for b in breweries}</text><text x="600" y="500" font-size="17" fill="#59636e" text-anchor="middle">beer['brewery'] = brewery_lookup.get(beer['brewery_id'], 'Unknown Brewery')</text></g></g></svg>
