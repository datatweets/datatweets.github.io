<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Python docstrings thumbnail</title><desc id="desc">A minimal logo-style thumbnail for an article on Python docstrings, showing a documented function whose docstring line feeds directly into a help() call.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="40" font-weight="600" fill="#59636e">Docs your editor can already read</text><text x="90" y="392" font-size="108" font-weight="700" fill="#1b1f24">Docstrings</text><rect x="100" y="424" width="480" height="12" rx="6" fill="#0067c0" /><text x="98" y="506" font-size="35" font-weight="500" fill="#59636e">help &#183; pydoc &#183; doctest</text></g><g transform="translate(690 190)"><rect x="0" y="0" width="260" height="150" rx="16" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="16"><text x="16" y="32" fill="#59636e">def to_f(c):</text><rect x="16" y="46" width="228" height="30" rx="7" fill="#e3f0fa" /><text x="22" y="67" fill="#0067c0">&quot;&quot;&quot;Convert C to F.&quot;&quot;&quot;</text><text x="16" y="102" fill="#59636e">return c * 9/5 + 32</text></g><path d="M260 61H316" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><rect x="320" y="28" width="140" height="66" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="390" y="58" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" fill="#0067c0" text-anchor="middle">help()</text><text x="390" y="80" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#59636e" text-anchor="middle">shows this line</text></g></svg>
