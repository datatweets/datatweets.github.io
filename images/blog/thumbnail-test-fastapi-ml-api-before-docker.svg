<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Test a FastAPI ML API Before Building a Docker Image</title>
  <desc id="desc">A FastAPI service and saved machine learning model flow through seven passing pytest contract checks before they enter a Docker image.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1.2" fill="#59636e">FASTAPI ML DELIVERY</text>
    <text x="90" y="285" font-size="92" font-weight="700" fill="#1b1f24">TEST</text>
    <text x="90" y="390" font-size="92" font-weight="700" fill="#1b1f24">THEN BUILD</text>
    <rect x="96" y="428" width="390" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="512" font-size="29" font-weight="500" fill="#59636e">PYTEST &#183; CONTRACTS &#183; DOCKER</text>

    <g transform="translate(700 108)">
      <rect x="0" y="0" width="390" height="118" rx="18" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <text x="24" y="34" font-size="18" font-weight="700" letter-spacing="1" fill="#59636e">SAME RUNTIME FILES</text>
      <rect x="24" y="53" width="154" height="42" rx="10" fill="#ffffff" stroke="#0067c0" stroke-width="2"/>
      <text x="101" y="81" text-anchor="middle" font-size="19" font-weight="600" fill="#1b1f24">service.py</text>
      <rect x="192" y="53" width="174" height="42" rx="10" fill="#ffffff" stroke="#0067c0" stroke-width="2"/>
      <text x="279" y="81" text-anchor="middle" font-size="18" font-weight="600" fill="#1b1f24">model.joblib</text>

      <line x1="195" y1="118" x2="195" y2="151" stroke="#0067c0" stroke-width="4"/>
      <path d="M186 143 L195 153 L204 143" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="0" y="153" width="390" height="118" rx="18" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>
      <text x="24" y="187" font-size="18" font-weight="700" letter-spacing="1" fill="#59636e">IN-PROCESS HTTP TESTS</text>
      <text x="24" y="233" font-size="27" font-weight="700" fill="#1b1f24">TestClient + pytest</text>
      <rect x="296" y="195" width="70" height="45" rx="12" fill="#e7f4ee" stroke="#16835b" stroke-width="2"/>
      <text x="331" y="225" text-anchor="middle" font-size="20" font-weight="700" fill="#16835b">7/7</text>

      <line x1="195" y1="271" x2="195" y2="304" stroke="#0067c0" stroke-width="4"/>
      <path d="M186 296 L195 306 L204 296" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="0" y="306" width="390" height="118" rx="18" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <text x="24" y="340" font-size="18" font-weight="700" letter-spacing="1" fill="#59636e">PACKAGE AFTER PASS</text>
      <rect x="24" y="359" width="342" height="42" rx="10" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
      <text x="195" y="387" text-anchor="middle" font-size="21" font-weight="700" fill="#1b1f24">Docker image</text>
    </g>
  </g>
</svg>
