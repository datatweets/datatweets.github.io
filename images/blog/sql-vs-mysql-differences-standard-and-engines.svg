<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">SQL, one standard, four engines that implement it</title><desc id="desc">Diagram showing SQL, the ISO/IEC 9075 standard, branching into four relational database engines. MySQL uses backtick identifier quoting and treats a double pipe as logical OR. PostgreSQL uses double-quote identifier quoting and a double pipe concatenates strings. SQLite has no server process and loose column typing. SQL Server uses square-bracket identifier quoting and its own T-SQL dialect.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="465" y="24" width="270" height="64" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="600" y="50" font-size="26" font-weight="700" fill="#0067c0" text-anchor="middle">SQL</text><text x="600" y="74" font-size="16" fill="#59636e" text-anchor="middle">the ISO/IEC 9075 standard</text></g><path d="M600 88V110H195V150" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><path d="M600 110H465V150" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><path d="M600 110H735V150" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><path d="M600 110H1005V150" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="75" y="150" width="240" height="366" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="195" y="196" font-size="30" font-weight="700" fill="#0067c0" text-anchor="middle">MySQL</text><text x="195" y="220" font-size="16" fill="#59636e" text-anchor="middle">Open-source, Oracle</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#1b1f24"><text x="195" y="266" text-anchor="middle">`identifier`</text><text x="195" y="296" text-anchor="middle">a || b</text></g><rect x="95" y="440" width="200" height="56" rx="10" fill="#e3f0fa" /><text x="195" y="465" font-size="15" font-weight="600" fill="#1b1f24" text-anchor="middle">backtick quoting</text><text x="195" y="486" font-size="15" font-weight="600" fill="#1b1f24" text-anchor="middle">|| means OR</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="345" y="150" width="240" height="366" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="465" y="196" font-size="28" font-weight="700" fill="#0067c0" text-anchor="middle">PostgreSQL</text><text x="465" y="220" font-size="16" fill="#59636e" text-anchor="middle">Open-source, ANSI-close</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#1b1f24"><text x="465" y="266" text-anchor="middle">&#8220;identifier&#8221;</text><text x="465" y="296" text-anchor="middle">a || b</text></g><rect x="365" y="440" width="200" height="56" rx="10" fill="#e6f4e6" /><text x="465" y="465" font-size="15" font-weight="600" fill="#1b1f24" text-anchor="middle">double-quote quoting</text><text x="465" y="486" font-size="15" font-weight="600" fill="#1b1f24" text-anchor="middle">|| concatenates</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="615" y="150" width="240" height="366" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="735" y="196" font-size="30" font-weight="700" fill="#0067c0" text-anchor="middle">SQLite</text><text x="735" y="220" font-size="16" fill="#59636e" text-anchor="middle">Embedded, no server</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#1b1f24"><text x="735" y="266" text-anchor="middle">&#8220;identifier&#8221;</text><text x="735" y="296" text-anchor="middle">a || b</text></g><rect x="635" y="440" width="200" height="56" rx="10" fill="#fdeede" /><text x="735" y="465" font-size="15" font-weight="600" fill="#1b1f24" text-anchor="middle">no server process</text><text x="735" y="486" font-size="15" font-weight="600" fill="#1b1f24" text-anchor="middle">loose column typing</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="885" y="150" width="240" height="366" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="1005" y="196" font-size="26" font-weight="700" fill="#0067c0" text-anchor="middle">SQL Server</text><text x="1005" y="220" font-size="16" fill="#59636e" text-anchor="middle">Microsoft, T-SQL</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#1b1f24"><text x="1005" y="266" text-anchor="middle">[identifier]</text><text x="1005" y="296" text-anchor="middle">a + b</text></g><rect x="905" y="440" width="200" height="56" rx="10" fill="#e3f0fa" /><text x="1005" y="465" font-size="15" font-weight="600" fill="#1b1f24" text-anchor="middle">bracket quoting</text><text x="1005" y="486" font-size="15" font-weight="600" fill="#1b1f24" text-anchor="middle">own T-SQL dialect</text></g></svg>
