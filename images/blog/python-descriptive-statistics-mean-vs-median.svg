<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Distribution of restaurant bill totals showing where the mean and median land</title><desc id="desc">Histogram of 244 total_bill values from the seaborn tips dataset in $5 bins, peaking between $15 and $20 and thinning out in a long right tail toward $50.81. The median is marked at $17.80, inside the tallest bin, while the mean at $19.79 sits further right, pulled toward the tail.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="600" y="34" font-size="26" font-weight="700" fill="#1b1f24" text-anchor="middle">Total Bill: Where Mean and Median Land</text><path d="M105 460H1085" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" /><g stroke="#0067c0" stroke-width="2"><rect x="119" y="457" width="70" height="3" rx="4" fill="#e3f0fa" /><rect x="207" y="407" width="70" height="53" rx="4" fill="#e3f0fa" /><rect x="295" y="253" width="70" height="207" rx="4" fill="#9dbfdd" /><rect x="383" y="240" width="70" height="220" rx="4" fill="#0067c0" /><rect x="471" y="325" width="70" height="135" rx="4" fill="#9dbfdd" /><rect x="559" y="381" width="70" height="79" rx="4" fill="#e3f0fa" /><rect x="647" y="407" width="70" height="53" rx="4" fill="#e3f0fa" /><rect x="735" y="440" width="70" height="20" rx="4" fill="#e3f0fa" /><rect x="823" y="444" width="70" height="16" rx="4" fill="#e3f0fa" /><rect x="911" y="447" width="70" height="13" rx="4" fill="#e3f0fa" /><rect x="999" y="457" width="70" height="3" rx="4" fill="#e3f0fa" /></g><g font-size="18" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="110" y="485">$0</text><text x="286" y="485">$10</text><text x="462" y="485">$20</text><text x="638" y="485">$30</text><text x="814" y="485">$40</text><text x="990" y="485">$50</text></g><text x="423" y="62" font-size="20" font-weight="600" fill="#59636e" text-anchor="middle">MEDIAN</text><text x="423" y="96" font-size="30" font-weight="700" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">$17.80</text><path d="M423 114V460" fill="none" stroke="#1b1f24" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" /><circle cx="423" cy="460" r="6" fill="#1b1f24" /><text x="458" y="150" font-size="20" font-weight="600" fill="#59636e" text-anchor="middle">MEAN</text><text x="458" y="184" font-size="30" font-weight="700" fill="#0067c0" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">$19.79</text><path d="M458 202V460" fill="none" stroke="#0067c0" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" /><circle cx="458" cy="460" r="6" fill="#0067c0" /><text x="600" y="540" font-size="18" font-weight="500" fill="#59636e" text-anchor="middle">244 restaurant bills, $5 bins · seaborn tips dataset</text></g></svg>