<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Python web request stack</title>
  <desc id="desc">An HTTP request moves through a web server, a WSGI or ASGI gateway, Flask or FastAPI application code, and then optionally reaches a database.</desc>
  <rect width="1200" height="560" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="476" rx="28" fill="#fff" stroke="#e3e6ea" stroke-width="2"/>
  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="92" y="112" font-size="24" font-weight="650" letter-spacing="2" fill="#0067c0">ONE REQUEST, THREE LAYERS</text>
    <text x="92" y="158" font-size="22" fill="#59636e">Each layer has one clear job.</text>

    <g transform="translate(92 215)">
      <rect width="210" height="150" rx="18" fill="#fff" stroke="#0067c0" stroke-width="3"/>
      <text x="105" y="48" text-anchor="middle" font-size="18" font-weight="650" fill="#59636e">HTTP SERVER</text>
      <text x="105" y="89" text-anchor="middle" font-size="27" font-weight="700" fill="#1b1f24">Uvicorn</text>
      <text x="105" y="120" text-anchor="middle" font-size="18" fill="#59636e">accepts request</text>
    </g>
    <path d="M315 290H385" stroke="#0067c0" stroke-width="5" stroke-linecap="round"/>
    <path d="M378 280L392 290L378 300" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(405 215)">
      <rect width="210" height="150" rx="18" fill="#eaf3fb" stroke="#0067c0" stroke-width="3"/>
      <text x="105" y="48" text-anchor="middle" font-size="18" font-weight="650" fill="#59636e">GATEWAY</text>
      <text x="105" y="89" text-anchor="middle" font-size="27" font-weight="700" fill="#1b1f24">WSGI / ASGI</text>
      <text x="105" y="120" text-anchor="middle" font-size="18" fill="#59636e">calls Python</text>
    </g>
    <path d="M628 290H698" stroke="#0067c0" stroke-width="5" stroke-linecap="round"/>
    <path d="M691 280L705 290L691 300" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(718 215)">
      <rect width="210" height="150" rx="18" fill="#fff" stroke="#0067c0" stroke-width="3"/>
      <text x="105" y="48" text-anchor="middle" font-size="18" font-weight="650" fill="#59636e">APPLICATION</text>
      <text x="105" y="89" text-anchor="middle" font-size="26" font-weight="700" fill="#1b1f24">Flask / FastAPI</text>
      <text x="105" y="120" text-anchor="middle" font-size="18" fill="#59636e">routes + validates</text>
    </g>
    <path d="M941 290H987" stroke="#0067c0" stroke-width="5" stroke-linecap="round"/>
    <path d="M980 280L994 290L980 300" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(1007 230)">
      <ellipse cx="62" cy="18" rx="62" ry="18" fill="#eaf3fb" stroke="#0067c0" stroke-width="3"/>
      <path d="M0 18V102C0 112 28 120 62 120S124 112 124 102V18" fill="#eaf3fb" stroke="#0067c0" stroke-width="3"/>
      <ellipse cx="62" cy="102" rx="62" ry="18" fill="none" stroke="#0067c0" stroke-width="3"/>
      <text x="62" y="69" text-anchor="middle" font-size="18" font-weight="650" fill="#1b1f24">DATABASE</text>
    </g>
    <rect x="92" y="414" width="1039" height="2" fill="#e3e6ea"/>
    <text x="92" y="462" font-size="20" fill="#59636e">request</text>
    <text x="1118" y="462" text-anchor="end" font-size="20" fill="#59636e">response returns through the same stack</text>
  </g>
</svg>
