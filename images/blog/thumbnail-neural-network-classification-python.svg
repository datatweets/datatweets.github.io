<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Neural Network Classification in Python with Scikit-Learn</title>
  <desc id="desc">A tutorial thumbnail with a box diagram showing five scaled sensor features passing through hidden layers of 12 and 6 neurons to produce a failure probability and a fail classification.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>
  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1" fill="#59636e">TABULAR CLASSIFICATION</text>
    <text x="90" y="273" font-size="82" font-weight="700" fill="#1b1f24">SCALE. LEARN.</text>
    <text x="90" y="365" font-size="82" font-weight="700" fill="#1b1f24">CLASSIFY.</text>
    <rect x="96" y="401" width="410" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="478" font-size="31" font-weight="500" fill="#59636e">pipeline &#xB7; MLP &#xB7; error checks</text>
  </g>
  <g transform="translate(700 138)" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="18" font-size="19" font-weight="600" fill="#59636e">MODEL PIPELINE</text>
    <rect x="0" y="48" width="420" height="66" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
    <text x="22" y="89" font-size="24" font-weight="600" fill="#1b1f24">5 FEATURES &#x2192; STANDARD SCALE</text>
    <text x="194" y="146" font-size="30" font-weight="600" fill="#0067c0">&#x2193;</text>
    <rect x="0" y="166" width="420" height="66" rx="12" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
    <text x="42" y="207" font-size="24" font-weight="600" fill="#1b1f24">HIDDEN 12 &#x2192; HIDDEN 6</text>
    <text x="194" y="264" font-size="30" font-weight="600" fill="#0067c0">&#x2193;</text>
    <rect x="0" y="284" width="420" height="66" rx="12" fill="#fdeede" stroke="#0067c0" stroke-width="2"/>
    <text x="27" y="325" font-size="24" font-weight="600" fill="#1b1f24">P(FAIL) = 0.62 &#x2192; FAIL</text>
  </g>
</svg>
