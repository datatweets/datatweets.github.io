<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Three questions every SQL skill answers</title><desc id="desc">Diagram showing that core SQL skills answer one of three questions: WHERE, CASE, and subqueries decide which rows you want; INNER and LEFT JOIN decide how two tables relate, with INNER JOIN dropping unmatched rows and LEFT JOIN keeping every row from the left table; and GROUP BY with RANK or ROW_NUMBER decide how rows are summarized, either collapsed into one row per group or annotated in place without collapsing anything.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="180" y="66" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">WHICH ROWS</text><text x="545" y="66" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">HOW RELATED</text><text x="1015" y="66" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">HOW SUMMARIZED</text><g font-size="21" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="70" y="110" width="220" height="60" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="102" y="147" fill="#1b1f24">WHERE</text><rect x="70" y="190" width="220" height="60" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="112" y="227" fill="#1b1f24">CASE</text><rect x="70" y="270" width="220" height="60" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="86" y="307" fill="#1b1f24">subquery</text></g><path d="M290 140C360 140 360 230 430 230" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M290 220C360 220 360 230 430 230" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M290 300C360 300 360 230 430 230" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><g font-size="21" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="430" y="190" width="230" height="70" rx="14" fill="#fdeede" stroke="#0067c0" stroke-width="3" /><text x="452" y="232" fill="#1b1f24">INNER JOIN</text><text x="686" y="200" font-size="17" font-family="Jost, sans-serif" fill="#59636e">drops unmatched rows</text><rect x="430" y="290" width="230" height="70" rx="14" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="464" y="332" fill="#1b1f24">LEFT JOIN</text><text x="686" y="345" font-size="17" font-family="Jost, sans-serif" fill="#59636e">keeps every left row</text></g><path d="M660 225C800 225 800 235 900 235" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M660 325C800 325 800 285 900 285" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="900" y="180" width="230" height="180" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="1015" y="216" font-size="20" font-weight="600" fill="#59636e" text-anchor="middle">SUMMARY</text><g font-size="18" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="922" y="256" fill="#1b1f24">GROUP BY genre</text><text x="922" y="292" fill="#59636e">-&gt; one row/group</text><text x="922" y="326" fill="#1b1f24">RANK() OVER (...)</text><text x="922" y="350" fill="#59636e">-&gt; every row kept</text></g></g></svg>