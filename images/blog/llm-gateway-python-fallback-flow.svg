<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">How the gateway routes 40 requests across two providers</title><desc id="desc">A request flows from the app into the gateway, which tries the aurora provider first. In the verified 40-request run, aurora served 27 requests and its circuit breaker opened after three consecutive failures around request 22, skipping it for five requests. During that time, and whenever aurora fails, the gateway retries once more, then falls back to the borealis provider, which served the remaining 13 requests. Either provider's successful response is combined into one normal response for the caller.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="150" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">REQUEST</text><text x="600" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">TRY, RETRY, FALL BACK</text><text x="1044" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">RESPONSE</text><rect x="70" y="230" width="170" height="70" rx="14" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="155" y="260" font-size="20" font-weight="600" fill="#59636e" text-anchor="middle">your app</text><text x="155" y="284" font-size="16" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e" text-anchor="middle">gateway.complete()</text><path d="M240 265H300" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="300" y="225" width="160" height="80" rx="16" fill="#ffffff" stroke="#1b1f24" stroke-width="4" /><text x="380" y="258" font-size="19" font-weight="600" fill="#1b1f24" text-anchor="middle">GATEWAY</text><text x="380" y="282" font-size="14" fill="#59636e" text-anchor="middle">priority list + breaker</text><path d="M462 250C510 250 510 130 558 130" fill="none" stroke="#d0d5db" stroke-width="5" stroke-linecap="round" /><rect x="560" y="90" width="220" height="90" rx="14" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><text x="580" y="122" font-size="20" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e">aurora</text><text x="580" y="148" font-size="15" fill="#1b1f24">27 / 40 requests served</text><text x="580" y="168" font-size="15" fill="#c0392b">breaker opened at request 22</text><path d="M670 180C670 210 610 200 610 224" fill="none" stroke="#c0392b" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 8" /><text x="686" y="216" font-size="14" fill="#59636e">3 fails in a row</text><path d="M462 300C510 300 510 380 558 380" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><rect x="560" y="340" width="220" height="90" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="580" y="372" font-size="20" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0067c0">borealis</text><text x="580" y="398" font-size="15" fill="#1b1f24">13 / 40 requests served</text><text x="580" y="418" font-size="15" fill="#59636e">catches every fallback</text><path d="M615 180C650 260 650 260 610 340" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 7" /><text x="470" y="266" font-size="14" fill="#59636e" text-anchor="middle">on failure,</text><text x="470" y="286" font-size="14" fill="#59636e" text-anchor="middle">retry then</text><text x="470" y="306" font-size="14" fill="#59636e" text-anchor="middle">fall back</text><path d="M782 135C860 135 860 265 924 265" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M782 385C860 385 860 265 924 265" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="926" y="225" width="200" height="80" rx="16" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="1026" y="258" font-size="19" font-weight="600" fill="#0067c0" text-anchor="middle">one normal</text><text x="1026" y="282" font-size="19" font-weight="600" fill="#0067c0" text-anchor="middle">LLMResponse</text></g></svg>