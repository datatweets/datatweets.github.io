<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">The three stages of the ETL pipeline</title>
  <desc id="desc">Diagram of a three-stage ETL pipeline: three CSV sources in different formats flow into an extract stage that normalizes them to a common shape, then a transform stage that splits records into clean and rejected with a reason attached to each rejection, then a load stage that writes into SQLite with a unique constraint so a second run inserts zero new rows.</desc>
  <rect width="1200" height="560" fill="#f7f8fa"/>
  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="150" y="56" font-size="27" font-weight="600" fill="#0067c0" text-anchor="middle">EXTRACT</text>
    <text x="610" y="56" font-size="27" font-weight="600" fill="#0067c0" text-anchor="middle">TRANSFORM</text>
    <text x="1044" y="56" font-size="27" font-weight="600" fill="#0067c0" text-anchor="middle">LOAD</text>

    <!-- Stage 1: three raw sources -->
    <g font-size="18" font-weight="700" font-family="'SFMono-Regular', Consolas, Menlo, monospace">
      <rect x="40" y="100" width="220" height="52" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>
      <text x="150" y="132" fill="#1b1f24" text-anchor="middle">riverside.csv</text>
      <rect x="40" y="168" width="220" height="52" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>
      <text x="150" y="200" fill="#1b1f24" text-anchor="middle">harborview.csv</text>
      <rect x="40" y="236" width="220" height="52" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>
      <text x="150" y="268" fill="#1b1f24" text-anchor="middle">millgate.csv</text>
    </g>
    <text x="150" y="330" font-size="16" font-weight="500" fill="#59636e" text-anchor="middle">37 raw records, 3 shapes</text>

    <path d="M264 126C310 126 310 194 356 194" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round"/>
    <path d="M264 194H356" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round"/>
    <path d="M264 262C310 262 310 194 356 194" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round"/>

    <!-- Stage 2: common shape -> clean / rejected -->
    <rect x="360" y="150" width="180" height="88" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
    <text x="450" y="188" font-size="18" font-weight="700" fill="#1b1f24" text-anchor="middle">common</text>
    <text x="450" y="212" font-size="18" font-weight="700" fill="#1b1f24" text-anchor="middle">records</text>

    <path d="M544 172C580 172 580 118 616 118" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round"/>
    <path d="M544 216C580 216 580 270 616 270" fill="none" stroke="#59636e" stroke-width="5" stroke-linecap="round"/>

    <rect x="620" y="86" width="230" height="64" rx="12" fill="#e6f4e6" stroke="#2e7d32" stroke-width="2"/>
    <text x="735" y="112" font-size="18" font-weight="700" fill="#1b1f24" text-anchor="middle">35 clean</text>
    <text x="735" y="134" font-size="15" font-weight="500" fill="#59636e" text-anchor="middle">common shape, valid</text>

    <rect x="620" y="240" width="230" height="88" rx="12" fill="#fdeede" stroke="#c0472a" stroke-width="2"/>
    <text x="735" y="264" font-size="18" font-weight="700" fill="#1b1f24" text-anchor="middle">2 rejected</text>
    <text x="735" y="286" font-size="14" font-weight="500" fill="#59636e" text-anchor="middle">missing quantity</text>
    <text x="735" y="306" font-size="14" font-weight="500" fill="#59636e" text-anchor="middle">non-positive price</text>

    <!-- Stage 3: load into SQLite, idempotent -->
    <path d="M854 118H900" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(900 60)">
      <path d="M0 20 A80 16 0 0 1 160 20 V150 A80 16 0 0 1 0 150 Z" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
      <ellipse cx="80" cy="20" rx="80" ry="16" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>
      <text x="80" y="76" text-anchor="middle" font-size="19" font-weight="700" fill="#1b1f24">SQLITE</text>
      <text x="80" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#0067c0">UNIQUE(store,</text>
      <text x="80" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#0067c0">order_id)</text>
    </g>
    <text x="980" y="250" font-size="16" font-weight="700" fill="#1b1f24" text-anchor="middle">34 rows loaded</text>
    <rect x="880" y="270" width="200" height="40" rx="20" fill="#0067c0"/>
    <text x="980" y="296" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">rerun &#8594; +0 rows</text>
  </g>
</svg>
