<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Explain Scikit-Learn Predictions in a FastAPI API</title>
  <desc id="desc">DataTweets tutorial thumbnail with the headline Prediction Explained and a diagram showing a baseline of 147.34 plus net feature effects of 37.71 equaling a prediction of 185.05.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1" fill="#59636e">EXPLAINABLE ML API</text>
    <text x="90" y="285" font-size="82" font-weight="700" fill="#1b1f24">PREDICTION</text>
    <text x="90" y="378" font-size="82" font-weight="700" fill="#1b1f24">EXPLAINED</text>
    <rect x="96" y="411" width="390" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="485" font-size="29" font-weight="500" fill="#59636e">SCIKIT-LEARN &#183; FASTAPI &#183; TESTED SUMS</text>

    <g transform="translate(760 122)">
      <text x="0" y="26" font-size="24" font-weight="600" letter-spacing="1" fill="#59636e">ONE API RESPONSE</text>

      <rect x="0" y="54" width="330" height="78" rx="16" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <text x="24" y="84" font-size="17" font-weight="600" letter-spacing="1" fill="#59636e">BASELINE</text>
      <text x="24" y="119" font-size="30" font-weight="700" fill="#1b1f24">147.34</text>

      <text x="152" y="167" font-size="34" font-weight="600" text-anchor="middle" fill="#0067c0">+</text>

      <rect x="0" y="184" width="330" height="78" rx="16" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <text x="24" y="214" font-size="17" font-weight="600" letter-spacing="1" fill="#59636e">NET FEATURE EFFECTS</text>
      <text x="24" y="249" font-size="30" font-weight="700" fill="#1b1f24">+37.71</text>

      <text x="152" y="297" font-size="34" font-weight="600" text-anchor="middle" fill="#0067c0">=</text>

      <rect x="0" y="314" width="330" height="88" rx="16" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
      <text x="24" y="346" font-size="17" font-weight="600" letter-spacing="1" fill="#59636e">PREDICTION</text>
      <text x="24" y="385" font-size="34" font-weight="700" fill="#1b1f24">185.05</text>
    </g>
  </g>
</svg>
