<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The event-timing-action model for SQL triggers</title><desc id="desc">Diagram showing the event-timing-action model for SQL triggers: an INSERT, UPDATE, or DELETE event combines with BEFORE or AFTER timing to decide when a trigger's action runs, either blocking the write or reacting after it.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="180" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">EVENT</text><text x="580" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">TIMING</text><text x="980" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">ACTION</text><g font-size="22" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="70" y="110" width="220" height="60" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="102" y="148" fill="#1b1f24">INSERT</text><rect x="70" y="190" width="220" height="60" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="102" y="228" fill="#1b1f24">UPDATE</text><rect x="70" y="270" width="220" height="60" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="102" y="308" fill="#1b1f24">DELETE</text></g><path d="M290 140C360 140 360 260 430 260" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M290 220C360 220 360 260 430 260" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M290 300C360 300 360 260 430 260" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><g font-size="22" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="430" y="190" width="230" height="70" rx="14" fill="#fdeede" stroke="#0067c0" stroke-width="3" /><text x="452" y="232" fill="#1b1f24">BEFORE</text><text x="686" y="200" font-size="18" font-family="Jost, sans-serif" fill="#59636e">can reject the write</text><rect x="430" y="290" width="230" height="70" rx="14" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="452" y="332" fill="#1b1f24">AFTER</text><text x="686" y="345" font-size="18" font-family="Jost, sans-serif" fill="#59636e">reacts once committed</text></g><path d="M660 225C800 225 800 240 900 240" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M660 325C800 325 800 280 900 280" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="900" y="180" width="230" height="180" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="1015" y="216" font-size="22" font-weight="600" fill="#59636e" text-anchor="middle">ACTION</text><g font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="922" y="256" fill="#1b1f24">RAISE(ABORT, ...)</text><text x="922" y="292" fill="#1b1f24">INSERT INTO</text><text x="922" y="316" fill="#1b1f24">  audit_log</text></g></g></svg>