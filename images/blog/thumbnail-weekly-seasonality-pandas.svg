    <g fill="#9bc4e8"><rect x="146" y="307" width="44" height="18" rx="4"/><rect x="198" y="307" width="36" height="18" rx="4"/><rect x="242" y="307" width="28" height="18" rx="4"/><rect x="278" y="307" width="20" height="18" rx="4"/><rect x="306" y="307" width="12" height="18" rx="4"/></g>
    <text x="32" y="378" font-size="22" font-weight="600" fill="#59636e">RESIDUAL</text>
    <rect x="146" y="359" width="34" height="18" rx="4" fill="#d16b5b"/>
    <text x="194" y="376" font-size="20" font-weight="600" fill="#8d463b">WHAT REMAINS</text>
