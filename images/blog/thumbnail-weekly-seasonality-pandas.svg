<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Weekly seasonality with pandas tutorial thumbnail</title>
  <desc id="desc">A weekly time-series diagram separates observed daily values into a smooth baseline, a repeating weekday pattern, and one unusual residual.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>
  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="36" font-weight="600" fill="#59636e">READ THE WEEKLY RHYTHM</text>
    <text x="90" y="278" font-size="84" font-weight="700" fill="#1b1f24">Pattern</text>
    <text x="90" y="372" font-size="84" font-weight="700" fill="#1b1f24">or surprise?</text>
    <rect x="98" y="408" width="410" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="488" font-size="30" font-weight="500" fill="#59636e">trend &#183; weekday effect &#183; residual</text>
  </g>
  <g transform="translate(706 132)" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="0" y="0" width="404" height="410" rx="20" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
    <text x="32" y="54" font-size="23" font-weight="600" fill="#59636e">DAILY REQUESTS</text>
    <g fill="#aab2bb">
      <rect x="34" y="88" width="24" height="84" rx="5"/><rect x="74" y="68" width="24" height="104" rx="5"/><rect x="114" y="96" width="24" height="76" rx="5"/><rect x="154" y="108" width="24" height="64" rx="5"/><rect x="194" y="122" width="24" height="50" rx="5"/><rect x="234" y="142" width="24" height="30" rx="5"/><rect x="274" y="132" width="24" height="40" rx="5"/>
    </g>
    <rect x="314" y="54" width="48" height="118" rx="6" fill="#d16b5b"/>
    <text x="338" y="196" text-anchor="middle" font-size="18" font-weight="600" fill="#8d463b">SPIKE</text>
    <rect x="32" y="228" width="340" height="2" fill="#e3e6ea"/>
