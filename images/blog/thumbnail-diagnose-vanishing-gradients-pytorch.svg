<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Diagnose Vanishing Gradients in PyTorch Networks</title>
  <desc id="desc">DataTweets tutorial thumbnail with the words Trace Weak Gradients and a diagram comparing a backward signal that fades through sigmoid layers with one that remains steady through ReLU layers.</desc>
  <defs>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0067c0"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="145" font-size="32" font-weight="600" letter-spacing="1" fill="#59636e">PYTORCH DEBUGGING</text>
    <text x="90" y="275" font-size="82" font-weight="700" fill="#1b1f24">TRACE WEAK</text>
    <text x="90" y="371" font-size="82" font-weight="700" fill="#1b1f24">GRADIENTS</text>
    <rect x="94" y="408" width="336" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="480" font-size="27" font-weight="500" fill="#59636e">RMS &#183; LAYERS &#183; BACKPROP</text>

    <g transform="translate(700 118)">
      <text x="34" y="24" font-size="24" font-weight="600" letter-spacing="0.8" fill="#59636e">BACKWARD SIGNAL</text>
      <line x1="390" y1="52" x2="12" y2="52" stroke="#0067c0" stroke-width="3" marker-end="url(#arrow-left)"/>

      <text x="50" y="92" text-anchor="middle" font-size="20" font-weight="600" fill="#59636e">H1</text>
      <text x="150" y="92" text-anchor="middle" font-size="20" font-weight="600" fill="#59636e">H4</text>
      <text x="250" y="92" text-anchor="middle" font-size="20" font-weight="600" fill="#59636e">H8</text>
      <text x="370" y="92" text-anchor="middle" font-size="20" font-weight="600" fill="#59636e">OUT</text>

      <rect x="0" y="118" width="420" height="136" rx="20" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="22" y="150" font-size="19" font-weight="600" fill="#59636e">SIGMOID: FADES</text>
      <line x1="370" y1="200" x2="250" y2="200" stroke="#59636e" stroke-width="8" stroke-linecap="round"/>
      <line x1="250" y1="200" x2="150" y2="200" stroke="#8d959e" stroke-width="5" stroke-linecap="round"/>
      <line x1="150" y1="200" x2="50" y2="200" stroke="#c7ccd2" stroke-width="2" stroke-linecap="round"/>
      <circle cx="370" cy="200" r="17" fill="#ffffff" stroke="#59636e" stroke-width="4"/>
      <circle cx="250" cy="200" r="12" fill="#ffffff" stroke="#7d8791" stroke-width="4"/>
      <circle cx="150" cy="200" r="7" fill="#ffffff" stroke="#aeb5bc" stroke-width="3"/>
      <circle cx="50" cy="200" r="3.5" fill="#c7ccd2"/>

      <rect x="0" y="278" width="420" height="136" rx="20" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="22" y="310" font-size="19" font-weight="600" fill="#0067c0">RELU: HOLDS</text>
      <line x1="370" y1="360" x2="50" y2="360" stroke="#0067c0" stroke-width="5" stroke-linecap="round"/>
      <circle cx="370" cy="360" r="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="4"/>
      <circle cx="250" cy="360" r="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="4"/>
      <circle cx="150" cy="360" r="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="4"/>
      <circle cx="50" cy="360" r="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="4"/>
    </g>
  </g>
</svg>
