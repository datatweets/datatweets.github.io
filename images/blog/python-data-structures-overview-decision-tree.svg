<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">A decision tree for choosing a Python data structure</title><desc id="desc">Decision tree diagram for choosing a Python data structure: first ask if you need to look items up by name, which points to a dictionary; otherwise ask if duplicates should be impossible, which points to a set; otherwise ask if the collection needs to change after creation, which points to a list if yes and a tuple if no.</desc><rect width="1200" height="620" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="440" y="30" width="320" height="80" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="600" y="62" font-size="21" fill="#1b1f24" text-anchor="middle">Look items up</text><text x="600" y="90" font-size="21" fill="#1b1f24" text-anchor="middle">by name (key)?</text><path d="M600 110C600 150 860 150 860 190" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><text x="760" y="145" font-size="20" font-weight="600" fill="#0067c0">yes</text><rect x="770" y="190" width="180" height="70" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="860" y="232" font-size="26" font-weight="700" fill="#1b1f24" text-anchor="middle">dict</text><path d="M600 110C600 150 400 150 400 190" fill="none" stroke="#59636e" stroke-width="4" stroke-linecap="round" /><text x="410" y="145" font-size="20" font-weight="600" fill="#59636e">no</text><rect x="240" y="190" width="320" height="90" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="400" y="224" font-size="21" fill="#1b1f24" text-anchor="middle">Should duplicates be</text><text x="400" y="250" font-size="21" fill="#1b1f24" text-anchor="middle">impossible, order</text><text x="400" y="276" font-size="21" fill="#1b1f24" text-anchor="middle">not important?</text><path d="M400 280C400 320 600 320 600 360" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><text x="500" y="315" font-size="20" font-weight="600" fill="#0067c0">yes</text><rect x="510" y="360" width="180" height="70" rx="14" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="600" y="402" font-size="26" font-weight="700" fill="#1b1f24" text-anchor="middle">set</text><path d="M400 280C400 320 240 320 240 360" fill="none" stroke="#59636e" stroke-width="4" stroke-linecap="round" /><text x="255" y="315" font-size="20" font-weight="600" fill="#59636e">no</text><rect x="80" y="360" width="320" height="90" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="240" y="394" font-size="21" fill="#1b1f24" text-anchor="middle">Will it change after</text><text x="240" y="420" font-size="21" fill="#1b1f24" text-anchor="middle">creation (add / remove /</text><text x="240" y="446" font-size="21" fill="#1b1f24" text-anchor="middle">reorder items)?</text><path d="M180 450C180 490 120 490 120 530" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><text x="90" y="485" font-size="20" font-weight="600" fill="#0067c0">yes</text><rect x="30" y="530" width="180" height="70" rx="14" fill="#fdeede" stroke="#0067c0" stroke-width="3" /><text x="120" y="572" font-size="26" font-weight="700" fill="#1b1f24" text-anchor="middle">list</text><path d="M300 450C300 490 380 490 380 530" fill="none" stroke="#59636e" stroke-width="4" stroke-linecap="round" /><text x="345" y="485" font-size="20" font-weight="600" fill="#59636e">no</text><rect x="290" y="530" width="180" height="70" rx="14" fill="#fdeede" stroke="#59636e" stroke-width="3" /><text x="380" y="572" font-size="26" font-weight="700" fill="#1b1f24" text-anchor="middle">tuple</text></g></svg>