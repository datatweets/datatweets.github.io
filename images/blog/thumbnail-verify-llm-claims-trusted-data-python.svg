<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Verify LLM Claims Against Trusted Data with Python</title>
  <desc id="desc">A DATATWEETS tutorial thumbnail. On the left, the words Claim versus Data introduce a structured LLM verification lesson. On the right, an online-format claim is compared with a cited catalog row that says hybrid, producing a mismatch route.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1" fill="#59636e">STRUCTURED LLM CHECK</text>
    <text x="90" y="284" font-size="92" font-weight="700" fill="#1b1f24">CLAIM</text>
    <text x="90" y="385" font-size="92" font-weight="700" fill="#1b1f24">VS DATA</text>
    <rect x="94" y="421" width="390" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="493" font-size="29" font-weight="500" fill="#59636e">JSON &#183; CITATIONS &#183; TYPED VALUES</text>

    <g transform="translate(704 112)">
      <rect x="0" y="0" width="388" height="126" rx="18" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <text x="24" y="38" font-size="20" font-weight="700" letter-spacing="1" fill="#59636e">LLM CLAIM</text>
      <text x="24" y="74" font-size="24" font-weight="600" fill="#1b1f24">WS103 &#183; format</text>
      <rect x="251" y="48" width="112" height="48" rx="24" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
      <text x="307" y="80" text-anchor="middle" font-size="22" font-weight="700" fill="#0067c0">online</text>

      <line x1="194" y1="126" x2="194" y2="161" stroke="#0067c0" stroke-width="3"/>
      <path d="M184 153 L194 165 L204 153" fill="none" stroke="#0067c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="0" y="166" width="388" height="126" rx="18" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>
      <text x="24" y="204" font-size="20" font-weight="700" letter-spacing="1" fill="#59636e">CITED CATALOG ROW</text>
      <text x="24" y="240" font-size="24" font-weight="600" fill="#1b1f24">CAT-003 &#183; WS103</text>
      <rect x="251" y="214" width="112" height="48" rx="24" fill="#eef1f4" stroke="#59636e" stroke-width="2"/>
      <text x="307" y="246" text-anchor="middle" font-size="22" font-weight="700" fill="#1b1f24">hybrid</text>

      <line x1="194" y1="292" x2="194" y2="327" stroke="#0067c0" stroke-width="3"/>
      <path d="M184 319 L194 331 L204 319" fill="none" stroke="#0067c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="57" y="332" width="274" height="78" rx="18" fill="#fff5f3" stroke="#b64a43" stroke-width="2"/>
      <circle cx="91" cy="371" r="14" fill="none" stroke="#b64a43" stroke-width="3"/>
      <path d="M84 364 L98 378 M98 364 L84 378" stroke="#b64a43" stroke-width="3" stroke-linecap="round"/>
      <text x="119" y="379" font-size="23" font-weight="700" fill="#8e3732">VALUE MISMATCH</text>
    </g>
  </g>
</svg>
