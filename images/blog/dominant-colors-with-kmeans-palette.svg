<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Dominant colors K-Means found in the candle-label banner test image</title><desc id="desc">Palette bar showing the four dominant colors K-Means found in the candle-label banner test image: cream hex f4efe3 at 62.2 percent (62,152 pixels), teal hex 1b5e59 at 16.4 percent (16,400 pixels), orange hex e57d22 at 11.5 percent (11,497 pixels), and charcoal hex 2d2c30 at 10.0 percent (9,951 pixels), ordered from most to least prevalent.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="60" y="66" font-size="28" font-weight="600" fill="#0067c0">K-MEANS CLUSTER CENTERS → DOMINANT COLORS</text><text x="60" y="100" font-size="22" fill="#59636e">100,000 pixels from the candle-label banner test image, grouped into 4 clusters</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="60" y="160" width="671" height="140" fill="#f4efe3" stroke="#d0d5db" stroke-width="2" /><text x="395" y="220" font-size="22" font-weight="600" fill="#1b1f24" text-anchor="middle">#f4efe3</text><text x="395" y="252" font-size="26" font-weight="700" fill="#1b1f24" text-anchor="middle">62.2%</text><rect x="731" y="160" width="177" height="140" fill="#1b5e59" /><text x="819" y="220" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">#1b5e59</text><text x="819" y="252" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">16.4%</text><rect x="908" y="160" width="124" height="140" fill="#e57d22" /><text x="970" y="220" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">#e57d22</text><text x="970" y="252" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">11.5%</text><rect x="1032" y="160" width="108" height="140" fill="#2d2c30" /><text x="1086" y="220" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">#2d2c30</text><text x="1086" y="252" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">10.0%</text></g><g font-size="20"><rect x="60" y="342" width="26" height="26" rx="5" fill="#f4efe3" stroke="#d0d5db" stroke-width="2" /><text x="98" y="362" fill="#1b1f24">cream · 62,152 px</text><rect x="330" y="342" width="26" height="26" rx="5" fill="#1b5e59" /><text x="368" y="362" fill="#1b1f24">teal · 16,400 px</text><rect x="600" y="342" width="26" height="26" rx="5" fill="#e57d22" /><text x="638" y="362" fill="#1b1f24">orange · 11,497 px</text><rect x="870" y="342" width="26" height="26" rx="5" fill="#2d2c30" /><text x="908" y="362" fill="#1b1f24">charcoal · 9,951 px</text></g><text x="60" y="420" font-size="20" fill="#59636e">Segment width is proportional to each cluster's real pixel count — not a fixed legend order.</text><text x="60" y="452" font-size="20" fill="#59636e">Every hex code above is read directly from kmeans.cluster_centers_ after fitting on this image's pixels.</text></g></svg>