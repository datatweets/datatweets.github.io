<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Choose the Right AI Agent Workflow Pattern in Python</title>
  <desc id="desc">A DataTweets tutorial thumbnail showing task requirements entering an ordered policy that selects one of six AI agent workflow patterns.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0067c0"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="144" font-size="31" font-weight="600" letter-spacing="1" fill="#59636e">AGENT WORKFLOW DESIGN</text>
    <text x="90" y="293" font-size="84" font-weight="700" fill="#1b1f24">MATCH TASK</text>
    <text x="90" y="392" font-size="84" font-weight="700" fill="#1b1f24">TO PATTERN</text>
    <rect x="94" y="438" width="348" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="516" font-size="28" font-weight="500" fill="#59636e">REQUIREMENTS &#183; ORDER &#183; TEST</text>

    <g>
      <rect x="704" y="92" width="410" height="108" rx="18" fill="#ffffff" stroke="#c7ccd2" stroke-width="2"/>
      <text x="730" y="124" font-size="18" font-weight="700" letter-spacing="1" fill="#59636e">TASK REQUIREMENTS</text>
      <g font-size="15" font-weight="600" fill="#1b1f24">
        <rect x="730" y="144" width="79" height="32" rx="16" fill="#e8f2fb"/>
        <text x="745" y="165">STEPS</text>
        <rect x="819" y="144" width="75" height="32" rx="16" fill="#f1f3f5"/>
        <text x="835" y="165">TOOLS</text>
        <rect x="904" y="144" width="82" height="32" rx="16" fill="#f1f3f5"/>
        <text x="918" y="165">PATHS</text>
        <rect x="996" y="144" width="92" height="32" rx="16" fill="#fff3e8"/>
        <text x="1009" y="165">WRITES</text>
      </g>

      <line x1="909" y1="201" x2="909" y2="229" stroke="#0067c0" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="744" y="238" width="330" height="92" rx="18" fill="#f7f8fa" stroke="#0067c0" stroke-width="2"/>
      <rect x="744" y="238" width="9" height="92" rx="4" fill="#0067c0"/>
      <text x="778" y="273" font-size="20" font-weight="700" fill="#1b1f24">ORDERED POLICY</text>
      <text x="778" y="306" font-size="17" font-weight="500" fill="#59636e">FIRST MATCH WINS</text>

      <line x1="909" y1="331" x2="909" y2="361" stroke="#0067c0" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="909" y="388" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1" fill="#59636e">SELECT ONE</text>

      <g stroke="#d7dce1" stroke-width="2" fill="none">
        <line x1="909" y1="397" x2="909" y2="414"/>
        <line x1="792" y1="414" x2="1026" y2="414"/>
        <line x1="792" y1="414" x2="792" y2="426"/>
        <line x1="1026" y1="414" x2="1026" y2="426"/>
      </g>

      <g font-size="16" font-weight="650" text-anchor="middle">
        <rect x="704" y="426" width="176" height="48" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="2"/>
        <text x="792" y="456" fill="#1b1f24">SINGLE CALL</text>
        <rect x="938" y="426" width="176" height="48" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="2"/>
        <text x="1026" y="456" fill="#1b1f24">FIXED FLOW</text>

        <rect x="704" y="486" width="176" height="48" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="2"/>
        <text x="792" y="516" fill="#1b1f24">ADAPTIVE LOOP</text>
        <rect x="938" y="486" width="176" height="48" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="2"/>
        <text x="1026" y="516" fill="#1b1f24">REVIEW LOOP</text>

        <rect x="704" y="546" width="176" height="48" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="2"/>
        <text x="792" y="576" fill="#1b1f24">PARALLEL</text>
        <rect x="938" y="546" width="176" height="48" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="2"/>
        <text x="1026" y="576" fill="#1b1f24">SPECIALIST</text>
      </g>
    </g>
  </g>
</svg>
