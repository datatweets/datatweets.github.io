<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Learning curves thumbnail</title><desc id="desc">Thumbnail reading "More data?" beside two small schematic learning-curve panels labeled high variance and high bias, illustrating that the shape of the train versus cross-validation curve tells you whether more training data will help.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1.5" fill="#59636e">LEARNING CURVES</text><text x="90" y="300" font-size="118" font-weight="700" fill="#1b1f24">MORE</text><text x="90" y="410" font-size="118" font-weight="700" fill="#1b1f24">DATA?</text><rect x="94" y="446" width="390" height="12" rx="6" fill="#0067c0" /><text x="94" y="524" font-size="27" font-weight="500" fill="#59636e">BIAS &#183; VARIANCE &#183; SCIKIT-LEARN</text><g transform="translate(700 112)"><rect x="0" y="0" width="420" height="210" rx="22" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2" /><text x="24" y="34" font-size="19" font-weight="650" letter-spacing="1" fill="#0067c0">HIGH VARIANCE</text><line x1="30" y1="60" x2="380" y2="60" stroke="#d0d5db" stroke-width="1.5" /><line x1="30" y1="60" x2="30" y2="180" stroke="#d0d5db" stroke-width="1.5" /><polyline points="40,70 110,70 180,70 250,70 320,70 380,70" fill="none" stroke="#1b1f24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><polyline points="40,150 110,125 180,110 250,105 320,90 380,88" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="200" font-size="15" font-weight="500" fill="#59636e">gap narrows, stays open</text></g><g transform="translate(700 350)"><rect x="0" y="0" width="420" height="210" rx="22" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2" /><text x="24" y="34" font-size="19" font-weight="650" letter-spacing="1" fill="#0067c0">HIGH BIAS</text><line x1="30" y1="60" x2="380" y2="60" stroke="#d0d5db" stroke-width="1.5" /><line x1="30" y1="60" x2="30" y2="180" stroke="#d0d5db" stroke-width="1.5" /><polyline points="40,140 110,155 180,156 250,157 320,159 380,155" fill="none" stroke="#1b1f24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><polyline points="40,160 110,161 180,158 250,155 320,156 380,153" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="200" font-size="15" font-weight="500" fill="#59636e">curves meet early and low</text></g></g></svg>
