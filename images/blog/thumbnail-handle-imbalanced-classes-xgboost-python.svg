        <text x="278" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#0067c0">WEIGHT</text>
      </g>

      <rect x="0" y="224" width="382" height="218" rx="22" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
