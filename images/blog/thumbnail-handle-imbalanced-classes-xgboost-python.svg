<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Handle Imbalanced Classes with XGBoost in Python</title>
  <desc id="desc">A DATATWEETS tutorial thumbnail. On the left, the words Find Rare Faults introduce class weights, thresholds, and recall. On the right, separate training and decision panels show a rare positive row receiving more weight and a score threshold determining which cases become alerts.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1.2" fill="#59636e">IMBALANCED XGBOOST</text>
    <text x="90" y="275" font-size="88" font-weight="700" fill="#1b1f24">FIND RARE</text>
    <text x="90" y="375" font-size="88" font-weight="700" fill="#1b1f24">FAULTS</text>
    <rect x="94" y="409" width="390" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="482" font-size="28" font-weight="500" fill="#59636e">CLASS WEIGHTS &#183; THRESHOLDS</text>
    <text x="94" y="525" font-size="28" font-weight="500" fill="#59636e">PRECISION &#183; RECALL</text>

    <g transform="translate(712 112)">
