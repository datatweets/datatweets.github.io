<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">How to learn SQL thumbnail</title><desc id="desc">A minimal logo-style thumbnail for an article on the practical order to learn SQL: filtering, joining, grouping, then window functions.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="38" font-weight="600" fill="#59636e">Skip the passive video course</text><text x="90" y="392" font-size="140" font-weight="700" fill="#1b1f24">ROADMAP</text><rect x="100" y="424" width="420" height="12" rx="6" fill="#0067c0" /><text x="98" y="506" font-size="32" font-weight="500" fill="#59636e">practice, not recognition, wins</text></g><g transform="translate(800 90)" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="0" y="0" width="260" height="90" rx="16" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="26" y="55" font-size="26" fill="#1b1f24">1 &#183; FILTER</text><rect x="0" y="130" width="260" height="90" rx="16" fill="#fdeede" stroke="#0067c0" stroke-width="3" /><text x="26" y="185" font-size="26" fill="#1b1f24">2 &#183; JOIN</text><rect x="0" y="260" width="260" height="90" rx="16" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="20" y="315" font-size="26" fill="#1b1f24">3 &#183; GROUP</text><rect x="0" y="390" width="260" height="90" rx="16" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="12" y="445" font-size="26" fill="#1b1f24">4 &#183; WINDOW</text><path d="M130 90V130" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M130 220V260" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M130 350V390" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /></g></svg>
