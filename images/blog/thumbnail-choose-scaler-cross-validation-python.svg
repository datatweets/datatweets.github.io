<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Compare Data Scalers with Cross-Validation in Python</title>
  <desc id="desc">A DATATWEETS tutorial thumbnail. The left side says Test Then Choose. On the right, five-fold cross-validation compares no scaling, standard scaling, and robust scaling; robust scaling has the lowest mean absolute error and is selected.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="148" font-size="32" font-weight="600" fill="#59636e" letter-spacing="1.2">SCALER SELECTION</text>
    <text x="90" y="284" font-size="90" font-weight="700" fill="#1b1f24">TEST</text>
    <text x="90" y="386" font-size="78" font-weight="700" fill="#1b1f24">THEN CHOOSE</text>
    <rect x="98" y="418" width="410" height="12" rx="6" fill="#0067c0"/>
    <text x="98" y="492" font-size="27" font-weight="500" fill="#59636e">PIPELINE &#183; CV &#183; KNN</text>

    <g transform="translate(680 116)">
      <text x="0" y="22" font-size="21" font-weight="600" fill="#59636e" letter-spacing="0.7">5-FOLD CV &#183; LOWER MAE WINS</text>

      <g transform="translate(0 58)">
        <rect width="410" height="102" rx="18" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
        <text x="22" y="33" font-size="20" font-weight="600" fill="#1b1f24">NO SCALING &#8594; KNN</text>
        <rect x="22" y="54" width="268" height="16" rx="8" fill="#d7dce2"/>
        <text x="386" y="72" text-anchor="end" font-size="24" font-weight="700" fill="#59636e">19.63</text>
        <text x="22" y="91" font-size="15" font-weight="500" fill="#59636e">CV MAE (MIN)</text>
      </g>

      <g transform="translate(0 178)">
        <rect width="410" height="102" rx="18" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
        <text x="22" y="33" font-size="20" font-weight="600" fill="#1b1f24">STANDARD &#8594; KNN</text>
        <rect x="22" y="54" width="134" height="16" rx="8" fill="#9cc4e7"/>
        <text x="386" y="72" text-anchor="end" font-size="24" font-weight="700" fill="#59636e">9.77</text>
        <text x="22" y="91" font-size="15" font-weight="500" fill="#59636e">CV MAE (MIN)</text>
      </g>

      <g transform="translate(0 298)">
        <rect width="410" height="112" rx="18" fill="#eef6fc" stroke="#0067c0" stroke-width="3"/>
        <text x="22" y="33" font-size="20" font-weight="700" fill="#1b1f24">ROBUST &#8594; KNN</text>
        <rect x="22" y="54" width="126" height="16" rx="8" fill="#0067c0"/>
        <text x="386" y="72" text-anchor="end" font-size="24" font-weight="700" fill="#0067c0">9.15</text>
        <text x="22" y="95" font-size="15" font-weight="600" fill="#59636e">CV MAE (MIN)</text>
        <rect x="286" y="82" width="100" height="22" rx="11" fill="#0067c0"/>
        <text x="336" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">SELECTED</text>
      </g>
    </g>
  </g>
</svg>
