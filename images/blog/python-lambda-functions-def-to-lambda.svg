<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">From def to lambda: the same function, stripped to one expression</title><desc id="desc">A multi-line def square function shrinking into a one-line lambda: the def keyword, function name, and return keyword are crossed out, and an arrow labels the remaining parts of the lambda as parameters, colon, and expression.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="270" y="66" font-size="30" font-weight="600" fill="#59636e" text-anchor="middle">BEFORE: def</text><text x="915" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">AFTER: lambda</text><rect x="80" y="100" width="380" height="200" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="30"><text x="108" y="168" fill="#c94f4f">def</text><text x="188" y="168" fill="#1b1f24">square(x):</text><text x="108" y="222" fill="#c94f4f">return</text><text x="278" y="222" fill="#1b1f24">x * x</text></g><line x1="108" y1="156" x2="164" y2="156" stroke="#c94f4f" stroke-width="3" /><line x1="108" y1="210" x2="258" y2="210" stroke="#c94f4f" stroke-width="3" /><text x="108" y="268" font-size="21" fill="#59636e">name + return: not needed</text><path d="M480 200H660" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M636 176L664 200L636 224" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><text x="570" y="164" font-size="21" fill="#0067c0" text-anchor="middle">strip name</text><text x="570" y="256" font-size="21" fill="#0067c0" text-anchor="middle">strip return</text><rect x="700" y="130" width="420" height="110" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="34"><text x="726" y="196" fill="#0067c0">lambda</text><text x="862" y="196" fill="#1b1f24">x</text><text x="884" y="196" fill="#1b1f24">:</text><text x="908" y="196" fill="#1b1f24">x * x</text></g><g font-size="22" fill="#59636e"><path d="M862 250V330" fill="none" stroke="#c7ccd2" stroke-width="3" /><text x="862" y="360" text-anchor="middle">parameters</text><path d="M888 250V400" fill="none" stroke="#c7ccd2" stroke-width="3" /><text x="888" y="430" text-anchor="middle">colon</text><path d="M960 250V470" fill="none" stroke="#c7ccd2" stroke-width="3" /><text x="960" y="500" text-anchor="middle">expression (implicitly returned)</text></g></g></svg>