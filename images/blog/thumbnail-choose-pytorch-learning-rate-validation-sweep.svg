<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Choose a PyTorch Learning Rate with a Validation Sweep</title>
  <desc id="desc">A DataTweets tutorial thumbnail. Six log-spaced learning rates form a validation-loss curve; the rate with the lowest loss is highlighted as the selected step size.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1" fill="#59636e">PYTORCH TRAINING</text>
    <text x="90" y="276" font-size="88" font-weight="700" fill="#1b1f24">FIND THE</text>
    <text x="90" y="380" font-size="88" font-weight="700" fill="#1b1f24">RIGHT STEP</text>
    <rect x="98" y="418" width="410" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="498" font-size="28" font-weight="500" fill="#59636e">LOG SWEEP &#183; VALIDATION LOSS</text>
  </g>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="704" y="112" width="398" height="450" rx="24" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
    <text x="744" y="162" font-size="23" font-weight="600" letter-spacing="0.8" fill="#59636e">VALIDATION LOSS</text>

    <line x1="760" y1="195" x2="760" y2="466" stroke="#9aa3ad" stroke-width="2"/>
    <line x1="760" y1="466" x2="1057" y2="466" stroke="#9aa3ad" stroke-width="2"/>
    <line x1="748" y1="216" x2="760" y2="216" stroke="#9aa3ad" stroke-width="2"/>
    <line x1="748" y1="342" x2="760" y2="342" stroke="#9aa3ad" stroke-width="2"/>
    <line x1="748" y1="414" x2="760" y2="414" stroke="#9aa3ad" stroke-width="2"/>

    <polyline points="785,338 837,340 889,344 941,367 993,402 1045,214" fill="none" stroke="#59636e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="785" cy="338" r="8" fill="#ffffff" stroke="#59636e" stroke-width="3"/>
    <circle cx="837" cy="340" r="8" fill="#ffffff" stroke="#59636e" stroke-width="3"/>
    <circle cx="889" cy="344" r="8" fill="#ffffff" stroke="#59636e" stroke-width="3"/>
    <circle cx="941" cy="367" r="8" fill="#ffffff" stroke="#59636e" stroke-width="3"/>
    <circle cx="993" cy="402" r="18" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
    <circle cx="993" cy="402" r="7" fill="#0067c0"/>
    <circle cx="1045" cy="214" r="8" fill="#ffffff" stroke="#59636e" stroke-width="3"/>

    <rect x="923" y="424" width="140" height="34" rx="17" fill="#0067c0"/>
    <text x="993" y="448" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="0.8" fill="#ffffff">SELECT</text>

    <text x="805" y="508" text-anchor="middle" font-size="19" font-weight="500" fill="#59636e">SMALL RATE</text>
    <text x="993" y="508" text-anchor="middle" font-size="19" font-weight="600" fill="#0067c0">RATE 1</text>
    <text x="1000" y="197" text-anchor="middle" font-size="19" font-weight="500" fill="#59636e">LARGE RATE</text>
    <text x="908" y="541" text-anchor="middle" font-size="19" font-weight="500" letter-spacing="0.6" fill="#59636e">LOG-SPACED RATE</text>
  </g>
</svg>
