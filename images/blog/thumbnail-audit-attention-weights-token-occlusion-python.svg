<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Audit Attention Weights with Token Occlusion in Python</title>
  <desc id="desc">A DataTweets tutorial thumbnail. On the left, the headline says Weights Are Not Effects. On the right, two token rows show that failed and recovered both receive positive attention weights, while removing failed lowers the logit and removing recovered raises it.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="36" font-weight="600" letter-spacing="1" fill="#59636e">ATTENTION AUDIT</text>
    <text x="90" y="280" font-size="88" font-weight="700" fill="#1b1f24">WEIGHTS</text>
    <text x="90" y="378" font-size="58" font-weight="700" fill="#1b1f24">ARE NOT EFFECTS</text>
    <rect x="96" y="412" width="410" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="490" font-size="26" font-weight="500" fill="#59636e">WEIGHTS &#183; CONTRIBUTIONS &#183; OCCLUSION</text>

    <g transform="translate(710 122)">
      <rect x="0" y="0" width="390" height="430" rx="22" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="28" y="49" font-size="20" font-weight="700" letter-spacing="1" fill="#59636e">ONE MAP, TWO DIRECTIONS</text>

      <text x="28" y="101" font-size="18" font-weight="600" fill="#59636e">TOKEN</text>
      <text x="160" y="101" font-size="18" font-weight="600" fill="#59636e">WEIGHT</text>
      <text x="270" y="101" font-size="15" font-weight="600" fill="#59636e">LOGIT CHANGE</text>
      <line x1="28" y1="117" x2="362" y2="117" stroke="#d5d9de" stroke-width="2"/>

      <text x="28" y="168" font-size="24" font-weight="600" fill="#1b1f24">failed</text>
      <rect x="160" y="143" width="82" height="28" rx="8" fill="#d8eaf8"/>
      <rect x="160" y="143" width="65" height="28" rx="8" fill="#0067c0"/>
      <text x="160" y="198" font-size="19" font-weight="600" fill="#59636e">24.6%</text>
      <rect x="278" y="143" width="84" height="34" rx="17" fill="#dff2e7"/>
      <text x="292" y="168" font-size="21" font-weight="700" fill="#18864b">+0.867</text>

      <text x="28" y="267" font-size="24" font-weight="600" fill="#1b1f24">recovered</text>
      <rect x="160" y="242" width="82" height="28" rx="8" fill="#d8eaf8"/>
      <rect x="160" y="242" width="54" height="28" rx="8" fill="#0067c0"/>
      <text x="160" y="297" font-size="19" font-weight="600" fill="#59636e">20.4%</text>
      <rect x="278" y="242" width="84" height="34" rx="17" fill="#f8e1df"/>
      <text x="292" y="267" font-size="21" font-weight="700" fill="#b63f3a">-0.714</text>

      <line x1="28" y1="329" x2="362" y2="329" stroke="#d5d9de" stroke-width="2"/>
      <circle cx="45" cy="374" r="9" fill="#0067c0"/>
      <text x="65" y="381" font-size="20" font-weight="500" fill="#59636e">weight stays positive</text>
      <text x="28" y="414" font-size="20" font-weight="500" fill="#59636e">output effect can change sign</text>
    </g>
  </g>
</svg>
