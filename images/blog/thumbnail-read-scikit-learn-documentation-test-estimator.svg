<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Read scikit-learn Documentation and Test an Estimator</title>
  <desc id="desc">A scikit-learn API reference card points to a three-step experiment that sets a parameter, fits an estimator, and verifies its behavior.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="32" font-weight="600" letter-spacing="1" fill="#59636e">SCIKIT-LEARN WORKFLOW</text>
    <text x="90" y="294" font-size="78" font-weight="700" fill="#1b1f24">READ THE API</text>
    <text x="90" y="390" font-size="78" font-weight="700" fill="#1b1f24">THEN TEST</text>
    <rect x="96" y="425" width="424" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="508" font-size="29" font-weight="500" fill="#59636e">parameters &#183; fit &#183; attributes</text>

    <g transform="translate(660 126)">
      <rect x="0" y="24" width="220" height="376" rx="18" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <rect x="0" y="24" width="220" height="64" rx="18" fill="#e3f0fa"/>
      <rect x="0" y="70" width="220" height="18" fill="#e3f0fa"/>
      <text x="24" y="65" font-size="21" font-weight="700" fill="#0067c0">API REFERENCE</text>

      <text x="24" y="126" font-size="15" font-weight="700" fill="#59636e">PARAMETER</text>
      <text x="24" y="154" font-size="22" font-weight="600" fill="#1b1f24">max_depth=3</text>
      <line x1="24" y1="176" x2="196" y2="176" stroke="#e3e6ea" stroke-width="2"/>

      <text x="24" y="218" font-size="15" font-weight="700" fill="#59636e">METHOD</text>
      <text x="24" y="246" font-size="22" font-weight="600" fill="#1b1f24">fit(X, y)</text>
      <line x1="24" y1="268" x2="196" y2="268" stroke="#e3e6ea" stroke-width="2"/>

      <text x="24" y="310" font-size="15" font-weight="700" fill="#59636e">ATTRIBUTE</text>
      <text x="24" y="338" font-size="22" font-weight="600" fill="#1b1f24">classes_</text>

      <line x1="242" y1="212" x2="282" y2="212" stroke="#0067c0" stroke-width="4" stroke-linecap="round"/>
      <path d="M274 202 L286 212 L274 222" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="306" y="66" width="158" height="292" rx="22" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>
      <text x="385" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#0067c0">EXPERIMENT</text>
      <line x1="342" y1="150" x2="342" y2="280" stroke="#c7ccd2" stroke-width="3"/>

      <circle cx="342" cy="158" r="18" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
      <text x="378" y="165" font-size="21" font-weight="600" fill="#1b1f24">SET</text>

      <circle cx="342" cy="219" r="18" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
      <text x="378" y="226" font-size="21" font-weight="600" fill="#1b1f24">FIT</text>

      <circle cx="342" cy="280" r="18" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
      <path d="M333 280 L339 286 L351 273" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="378" y="287" font-size="21" font-weight="600" fill="#1b1f24">VERIFY</text>
    </g>
  </g>
</svg>
