<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Tune SARIMA Seasonal Orders with Backtesting in Python</title>
  <desc id="desc">A DataTweets tutorial thumbnail. The left side reads Tune Seasonal Orders. The right side shows three rolling forecast origins with expanding history followed by a hidden seven-day block.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="148" font-size="34" font-weight="600" letter-spacing="1" fill="#59636e">SARIMA BACKTESTING</text>
    <text x="90" y="258" font-size="78" font-weight="700" fill="#1b1f24">TUNE</text>
    <text x="90" y="346" font-size="72" font-weight="700" fill="#1b1f24">SEASONAL</text>
    <text x="90" y="426" font-size="72" font-weight="700" fill="#1b1f24">ORDERS</text>
    <rect x="96" y="459" width="355" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="526" font-size="25" font-weight="500" fill="#59636e">ROLLING ORIGINS &#183; MAE &#183; FINAL TEST</text>

    <g transform="translate(700 126)">
      <text x="0" y="0" font-size="24" font-weight="600" letter-spacing="1" fill="#59636e">FUTURE-LIKE CHECKS</text>

      <text x="0" y="83" font-size="22" font-weight="600" fill="#59636e">1</text>
      <rect x="42" y="58" width="156" height="38" rx="8" fill="#eef1f4" stroke="#c7ccd2" stroke-width="2"/>
      <rect x="212" y="58" width="112" height="38" rx="8" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>

      <text x="0" y="163" font-size="22" font-weight="600" fill="#59636e">2</text>
      <rect x="42" y="138" width="188" height="38" rx="8" fill="#eef1f4" stroke="#c7ccd2" stroke-width="2"/>
      <rect x="244" y="138" width="112" height="38" rx="8" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>

      <text x="0" y="243" font-size="22" font-weight="600" fill="#59636e">3</text>
      <rect x="42" y="218" width="220" height="38" rx="8" fill="#eef1f4" stroke="#c7ccd2" stroke-width="2"/>
      <rect x="276" y="218" width="112" height="38" rx="8" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>

      <rect x="42" y="304" width="20" height="20" rx="4" fill="#eef1f4" stroke="#c7ccd2" stroke-width="2"/>
      <text x="74" y="321" font-size="20" font-weight="500" fill="#59636e">KNOWN HISTORY</text>
      <rect x="42" y="348" width="20" height="20" rx="4" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
      <text x="74" y="365" font-size="20" font-weight="500" fill="#59636e">HIDDEN 7 DAYS</text>
    </g>
  </g>
</svg>
