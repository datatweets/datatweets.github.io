<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">A range object stores three numbers at a fixed size; the equivalent list stores every value and grows</title><desc id="desc">Diagram comparing range(2, 20, 3) with the equivalent list. The range panel shows one small object holding three fields: start 2, stop 20, step 3, at a fixed 48 bytes regardless of how many values it represents. The list panel shows six separate boxes holding 2, 5, 8, 11, 14, and 17, with size growing as more values are added.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="300" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">RANGE(2, 20, 3)</text><text x="900" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">list(range(2, 20, 3))</text></g><line x1="600" y1="90" x2="600" y2="500" stroke="#d0d5db" stroke-width="2" stroke-dasharray="6 8" />
<g transform="translate(210 110)" font-family="'SFMono-Regular', Consolas, Menlo, monospace">
<rect x="0" y="0" width="180" height="180" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="4" />
<text x="90" y="50" font-size="18" fill="#59636e" text-anchor="middle">start</text>
<text x="90" y="76" font-size="26" font-weight="700" fill="#1b1f24" text-anchor="middle">2</text>
<text x="90" y="106" font-size="18" fill="#59636e" text-anchor="middle">stop</text>
<text x="90" y="132" font-size="26" font-weight="700" fill="#1b1f24" text-anchor="middle">20</text>
<text x="90" y="158" font-size="18" fill="#59636e" text-anchor="middle">step: 3</text>
<rect x="10" y="200" width="160" height="42" rx="10" fill="#fdeede" stroke="#0067c0" stroke-width="2" />
<text x="90" y="227" font-size="18" font-weight="700" fill="#0067c0" text-anchor="middle">48 bytes</text>
<text x="90" y="278" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#59636e" text-anchor="middle">fixed size, no matter</text>
<text x="90" y="302" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#59636e" text-anchor="middle">how many values it represents</text>
</g>
<g transform="translate(675 110)" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18">
<rect x="0" y="0" width="75" height="50" rx="10" fill="#e3f0fa" /><text x="37" y="32" text-anchor="middle" fill="#1b1f24">2</text>
<rect x="85" y="0" width="75" height="50" rx="10" fill="#e6f4e6" /><text x="122" y="32" text-anchor="middle" fill="#1b1f24">5</text>
<rect x="170" y="0" width="75" height="50" rx="10" fill="#e3f0fa" /><text x="207" y="32" text-anchor="middle" fill="#1b1f24">8</text>
<rect x="255" y="0" width="75" height="50" rx="10" fill="#e6f4e6" /><text x="292" y="32" text-anchor="middle" fill="#1b1f24">11</text>
<rect x="340" y="0" width="75" height="50" rx="10" fill="#e3f0fa" /><text x="377" y="32" text-anchor="middle" fill="#1b1f24">14</text>
<rect x="425" y="0" width="75" height="50" rx="10" fill="#e6f4e6" /><text x="462" y="32" text-anchor="middle" fill="#1b1f24">17</text>
<rect x="0" y="70" width="500" height="42" rx="10" fill="#fdeede" stroke="#0067c0" stroke-width="2" />
<text x="250" y="97" font-size="18" font-weight="700" fill="#0067c0" text-anchor="middle">about 8,000,056 bytes at 1,000,000 items</text>
<text x="250" y="150" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#59636e" text-anchor="middle">one box per value, so size grows</text>
<text x="250" y="174" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#59636e" text-anchor="middle">with every value you add</text>
</g>
</svg>
