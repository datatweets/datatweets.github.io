<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Fitted regression line for weight versus fuel economy</title><desc id="desc">Scatter plot of 398 cars' weight against fuel economy with the fitted regression line mpg equals 46.32 minus 0.0077 times weight, marking the line's predicted values of 30.96 mpg at 2,000 pounds, 23.29 mpg at 3,000 pounds, 15.61 mpg at 4,000 pounds, and 7.93 mpg at 5,000 pounds.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="60" y="50" font-size="26" font-weight="600" fill="#0067c0">WEIGHT VS. FUEL ECONOMY, WITH THE FITTED LINE</text><text x="60" y="76" font-size="18" fill="#59636e">398 cars &#183; mpg = 46.32 &#8722; 0.0077 &#215; weight</text><line x1="140" y1="90" x2="140" y2="460" stroke="#c7ccd2" stroke-width="3" /><line x1="140" y1="460" x2="1140" y2="460" stroke="#c7ccd2" stroke-width="3" /><line x1="140" y1="164" x2="1140" y2="164" stroke="#e3e6ea" stroke-width="2" /><line x1="140" y1="238" x2="1140" y2="238" stroke="#e3e6ea" stroke-width="2" /><line x1="140" y1="312" x2="1140" y2="312" stroke="#e3e6ea" stroke-width="2" /><line x1="140" y1="386" x2="1140" y2="386" stroke="#e3e6ea" stroke-width="2" /><text x="128" y="95" font-size="17" fill="#59636e" text-anchor="end">50</text><text x="128" y="169" font-size="17" fill="#59636e" text-anchor="end">40</text><text x="128" y="243" font-size="17" fill="#59636e" text-anchor="end">30</text><text x="128" y="317" font-size="17" fill="#59636e" text-anchor="end">20</text><text x="128" y="391" font-size="17" fill="#59636e" text-anchor="end">10</text><text x="128" y="465" font-size="17" fill="#59636e" text-anchor="end">0</text><text x="140" y="486" font-size="18" fill="#59636e" text-anchor="middle">1,500</text><text x="390" y="486" font-size="18" fill="#59636e" text-anchor="middle">2,500</text><text x="640" y="486" font-size="18" fill="#59636e" text-anchor="middle">3,500</text><text x="890" y="486" font-size="18" fill="#59636e" text-anchor="middle">4,500</text><text x="1140" y="486" font-size="18" fill="#59636e" text-anchor="middle">5,500</text><text x="640" y="518" font-size="19" fill="#1b1f24" text-anchor="middle">Weight (pounds)</text><text x="30" y="275" font-size="19" fill="#1b1f24" text-anchor="middle" transform="rotate(-90 30 275)">Fuel economy (mpg)</text><g fill="#c7ccd2"><circle cx="200" cy="150" r="7" /><circle cx="220" cy="270" r="7" /><circle cx="260" cy="200" r="7" /><circle cx="300" cy="260" r="7" /><circle cx="330" cy="320" r="7" /><circle cx="370" cy="230" r="7" /><circle cx="400" cy="300" r="7" /><circle cx="450" cy="350" r="7" /><circle cx="480" cy="260" r="7" /><circle cx="520" cy="310" r="7" /><circle cx="560" cy="380" r="7" /><circle cx="600" cy="300" r="7" /><circle cx="650" cy="340" r="7" /><circle cx="700" cy="390" r="7" /><circle cx="750" cy="320" r="7" /><circle cx="800" cy="370" r="7" /><circle cx="850" cy="410" r="7" /><circle cx="900" cy="350" r="7" /><circle cx="950" cy="400" r="7" /><circle cx="1000" cy="380" r="7" /><circle cx="1030" cy="420" r="7" /></g><line x1="168" y1="209" x2="1050" y2="409" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="17"><circle cx="265" cy="231" r="8" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="265" y="213" fill="#0067c0" text-anchor="middle">30.96</text><circle cx="515" cy="288" r="8" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="515" y="270" fill="#0067c0" text-anchor="middle">23.29</text><circle cx="765" cy="345" r="8" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="765" y="327" fill="#0067c0" text-anchor="middle">15.61</text><circle cx="1015" cy="401" r="8" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="1015" y="383" fill="#0067c0" text-anchor="middle">7.93</text></g></g></svg>
