<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">An if/elif/else chain as a decision flow</title><desc id="desc">Diagram of an if/elif/else chain as a decision flow: three stacked diamond-shaped conditions are checked in order top to bottom, and only the first condition that evaluates to true routes the flow into its matching rectangular action block, with an else block catching anything that matched none of the conditions.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="230" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">CHECK, IN ORDER</text><text x="960" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">RUN, THEN STOP</text></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="21"><polygon points="230,84 380,150 230,216 80,150" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="230" y="144" text-anchor="middle" fill="#1b1f24">minutes</text><text x="230" y="170" text-anchor="middle" fill="#1b1f24">&#8804; 15?</text><text x="392" y="144" fill="#59636e" font-size="19">True</text><text x="220" y="246" fill="#59636e" font-size="19" text-anchor="middle">False</text><path d="M380 150H630" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><polygon points="630,150 618,143 618,157" fill="#0067c0" /><rect x="640" y="122" width="200" height="56" rx="12" fill="#0067c0" /><text x="740" y="158" fill="#ffffff" text-anchor="middle">return "short"</text><path d="M230 216V282" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><polygon points="230,282 222,268 238,268" fill="#c7ccd2" /><polygon points="230,216 380,282 230,348 80,282" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="230" y="276" text-anchor="middle" fill="#1b1f24">minutes</text><text x="230" y="302" text-anchor="middle" fill="#1b1f24">&#8804; 45?</text><text x="392" y="276" fill="#59636e" font-size="19">True</text><text x="220" y="378" fill="#59636e" font-size="19" text-anchor="middle">False</text><path d="M380 282H630" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><polygon points="630,282 618,275 618,289" fill="#0067c0" /><rect x="640" y="254" width="200" height="56" rx="12" fill="#0067c0" /><text x="740" y="290" fill="#ffffff" text-anchor="middle">return "standard"</text><path d="M230 348V414" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><polygon points="230,414 222,400 238,400" fill="#c7ccd2" /><rect x="130" y="414" width="200" height="56" rx="12" fill="#f0f4f8" stroke="#d0d5db" stroke-width="4" /><text x="230" y="450" fill="#59636e" text-anchor="middle">else</text><path d="M330 442H630" fill="none" stroke="#59636e" stroke-width="5" stroke-linecap="round" /><polygon points="630,442 618,435 618,449" fill="#59636e" /><rect x="640" y="414" width="200" height="56" rx="12" fill="#ffffff" stroke="#59636e" stroke-width="4" /><text x="740" y="450" fill="#1b1f24" text-anchor="middle">return "long"</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#59636e"><text x="740" y="500" text-anchor="middle">Tomas (65 min) reaches this branch; the two &#8804; checks above already failed.</text></g></svg>
