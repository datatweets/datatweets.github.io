<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The count, compare, confirm workflow for survey analysis</title><desc id="desc">Counting shows 58.8 percent of respondents say reclining an airplane seat is not rude at all. Comparing that opinion by how often each respondent reclines shows it ranges from 20.6 percent among people who never recline to 91.2 percent among people who always recline. Confirming with a chi-square test on reclining frequency returns p equals 1.13 times ten to the minus 63, while the same test on gender returns p equals 0.732, showing reclining frequency is the real pattern and gender is not.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="170" y="60" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">COUNT</text><text x="610" y="60" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">COMPARE</text><text x="1020" y="60" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">CONFIRM</text><text x="170" y="88" font-size="15" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">recline_rude</text><text x="610" y="88" font-size="15" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">recline_freq &#215; recline_rude</text><text x="1020" y="88" font-size="15" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">chi2_contingency</text><rect x="60" y="130" width="220" height="320" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="170" y="164" font-size="14" font-weight="600" fill="#59636e" text-anchor="middle">one question</text><text x="170" y="250" font-size="52" font-weight="700" fill="#0067c0" text-anchor="middle">58.8%</text><text x="170" y="278" font-size="15" fill="#59636e" text-anchor="middle">not rude at all</text><rect x="90" y="308" width="160" height="18" rx="9" fill="#ffffff" stroke="#d0d5db" stroke-width="2" /><rect x="90" y="308" width="94" height="18" rx="9" fill="#0067c0" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="13" fill="#59636e" text-anchor="middle"><text x="170" y="352">somewhat rude 32.9%</text><text x="170" y="372">very rude 8.3%</text></g><rect x="420" y="130" width="380" height="320" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="440" y="168" font-size="12" fill="#59636e">Never</text><rect x="580" y="154" width="39" height="20" rx="10" fill="#0067c0" fill-opacity="0.35" /><text x="629" y="168" font-size="12" fill="#1b1f24">20.6%</text><text x="440" y="208" font-size="12" fill="#59636e">Once in a while</text><rect x="580" y="194" width="86" height="20" rx="10" fill="#0067c0" fill-opacity="0.5" /><text x="676" y="208" font-size="12" fill="#1b1f24">45.3%</text><text x="440" y="248" font-size="12" fill="#59636e">About half</text><rect x="580" y="234" width="133" height="20" rx="10" fill="#0067c0" fill-opacity="0.65" /><text x="723" y="248" font-size="12" fill="#1b1f24">70.1%</text><text x="440" y="288" font-size="12" fill="#59636e">Usually</text><rect x="580" y="274" width="157" height="20" rx="10" fill="#0067c0" fill-opacity="0.8" /><text x="747" y="288" font-size="12" fill="#1b1f24">82.9%</text><text x="440" y="328" font-size="12" fill="#59636e">Always</text><rect x="580" y="314" width="173" height="20" rx="10" fill="#0067c0" /><text x="763" y="328" font-size="12" fill="#1b1f24">91.2%</text></g><text x="610" y="410" font-size="14" fill="#59636e" text-anchor="middle">rows are the percent who call reclining fine</text><rect x="900" y="130" width="240" height="320" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><rect x="920" y="170" width="200" height="110" rx="14" fill="#ffffff" stroke="#8fbc8f" stroke-width="3" /><text x="940" y="200" font-size="16" font-weight="600" fill="#1b1f24" font-family="'SFMono-Regular', Consolas, Menlo, monospace">recline_freq</text><text x="940" y="228" font-size="16" fill="#0067c0" font-family="'SFMono-Regular', Consolas, Menlo, monospace">p = 1.13e-63</text><text x="940" y="252" font-size="13" fill="#59636e">real pattern</text><circle cx="1090" cy="210" r="18" fill="#e6f4e6" stroke="#8fbc8f" stroke-width="2" /><path d="M1082 210L1088 216L1099 200" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="920" y="300" width="200" height="110" rx="14" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><text x="940" y="330" font-size="16" font-weight="600" fill="#1b1f24" font-family="'SFMono-Regular', Consolas, Menlo, monospace">gender</text><text x="940" y="358" font-size="16" fill="#59636e" font-family="'SFMono-Regular', Consolas, Menlo, monospace">p = 0.732</text><text x="940" y="382" font-size="13" fill="#9aa2ab">just noise</text><circle cx="1090" cy="340" r="18" fill="#fdeede" stroke="#d0d5db" stroke-width="2" /><path d="M1083 333L1097 347M1097 333L1083 347" stroke="#9aa2ab" stroke-width="4" stroke-linecap="round" /><path d="M280 290H420" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M800 290H900" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /></g></svg>
