<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="A diagram of a single value entering a match statement and being routed to one of several cases by its shape: case 0 returns Zero, case 1 or 2 or 3 returns Small number, case of a two-item list captures both items, case of a mapping with a name key captures the name, and case underscore is the fallback. The cases are checked from top to bottom and the first match wins."><title>Python structural pattern matching overview</title><desc>Diagram showing a value entering a Python match statement and being routed to matching case patterns.</desc><defs><marker id="mtarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a0aec0" /></marker></defs><rect width="640" height="430" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">One value, many shapes — match routes by pattern</text><rect x="34" y="180" width="132" height="54" rx="10" fill="#d6e8f7" stroke="#0067c0" stroke-width="2.5" /><text x="100" y="205" text-anchor="middle" font-size="15" font-weight="800" fill="#0a3d62" font-family="'SFMono-Regular', Consolas, Menlo, monospace">data</text><text x="100" y="223" text-anchor="middle" font-size="10.5" fill="#2b6cb0">any value</text><g stroke="#cbd5e0" stroke-width="1.8" fill="none"><path d="M166 207C236 207 236 71 300 71" marker-end="url(#mtarr)" /><path d="M166 207C236 207 236 139 300 139" marker-end="url(#mtarr)" /><path d="M166 207H300" marker-end="url(#mtarr)" /><path d="M166 207C236 207 236 275 300 275" marker-end="url(#mtarr)" /><path d="M166 207C236 207 236 343 300 343" marker-end="url(#mtarr)" /></g><line x1="288" y1="48" x2="288" y2="366" stroke="#e2a23b" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#mtarr)" /><text x="278" y="207" text-anchor="middle" font-size="10.5" fill="#b9791a" transform="rotate(-90 278 207)">checked top to bottom · first match wins</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="300" y="48" width="306" height="46" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="316" y="70" font-size="13" font-weight="700" fill="#0a3d62">case 0</text><text x="316" y="86" font-size="10.5" fill="#718096" font-family="-apple-system, 'Segoe UI', sans-serif">exact value → "Zero"</text><rect x="300" y="116" width="306" height="46" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="316" y="138" font-size="13" font-weight="700" fill="#0a3d62">case 1 | 2 | 3</text><text x="316" y="154" font-size="10.5" fill="#718096" font-family="-apple-system, 'Segoe UI', sans-serif">any of several → "Small number"</text><rect x="300" y="184" width="306" height="46" rx="8" fill="#eaf4fc" stroke="#0067c0" stroke-width="2" /><text x="316" y="206" font-size="13" font-weight="700" fill="#0a3d62">case [a, b]</text><text x="316" y="222" font-size="10.5" fill="#2b6cb0" font-family="-apple-system, 'Segoe UI', sans-serif">two-item list → captures a and b</text><rect x="300" y="252" width="306" height="46" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="316" y="274" font-size="13" font-weight="700" fill="#0a3d62">case {"name": n}</text><text x="316" y="290" font-size="10.5" fill="#718096" font-family="-apple-system, 'Segoe UI', sans-serif">mapping → captures n</text><rect x="300" y="320" width="306" height="46" rx="8" fill="#f7fafc" stroke="#cbd5e0" /><text x="316" y="342" font-size="13" font-weight="700" fill="#0a3d62">case _</text><text x="316" y="358" font-size="10.5" fill="#718096" font-family="-apple-system, 'Segoe UI', sans-serif">anything else → fallback</text></g></svg>