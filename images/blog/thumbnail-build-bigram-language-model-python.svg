<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Build a Bigram Language Model in Python from Scratch</title>
  <desc id="desc">A DataTweets tutorial thumbnail showing how counts of the words after “needs” become next-token probabilities: new 40 percent, quick 33 percent, and careful 27 percent.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="148" font-size="32" font-weight="600" letter-spacing="1" fill="#59636e">WORD-LEVEL LANGUAGE MODEL</text>
    <text x="90" y="286" font-size="76" font-weight="700" fill="#1b1f24">PAIR COUNTS</text>
    <text x="90" y="376" font-size="76" font-weight="700" fill="#1b1f24">PREDICT NEXT</text>
    <rect x="98" y="420" width="372" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="505" font-size="29" font-weight="500" fill="#59636e">TOKENIZE &#183; COUNT &#183; SAMPLE</text>
  </g>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="730" y="142" font-size="25" font-weight="600" letter-spacing="1" fill="#59636e">AFTER “NEEDS”</text>

    <rect x="700" y="176" width="410" height="350" rx="24" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
    <rect x="730" y="210" width="116" height="58" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
    <text x="788" y="248" text-anchor="middle" font-size="27" font-weight="700" fill="#1b1f24">needs</text>

    <path d="M860 239 H893" fill="none" stroke="#0067c0" stroke-width="3"/>
    <path d="M886 232 L896 239 L886 246" fill="none" stroke="#0067c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="914" y="231" font-size="19" font-weight="600" fill="#59636e">PAIR COUNTS</text>
    <text x="914" y="256" font-size="18" font-weight="500" fill="#59636e">15 total</text>

    <text x="730" y="326" font-size="23" font-weight="600" fill="#1b1f24">new</text>
    <rect x="824" y="306" width="216" height="24" rx="12" fill="#d8e9f7"/>
    <rect x="824" y="306" width="86" height="24" rx="12" fill="#0067c0"/>
    <text x="1060" y="326" font-size="21" font-weight="600" fill="#1b1f24">6/15  40%</text>

    <text x="730" y="390" font-size="23" font-weight="600" fill="#1b1f24">quick</text>
    <rect x="824" y="370" width="216" height="24" rx="12" fill="#d8e9f7"/>
    <rect x="824" y="370" width="71" height="24" rx="12" fill="#4a90d9"/>
    <text x="1060" y="390" font-size="21" font-weight="600" fill="#1b1f24">5/15  33%</text>

    <text x="730" y="454" font-size="23" font-weight="600" fill="#1b1f24">careful</text>
    <rect x="824" y="434" width="216" height="24" rx="12" fill="#d8e9f7"/>
    <rect x="824" y="434" width="58" height="24" rx="12" fill="#79afe0"/>
    <text x="1060" y="454" font-size="21" font-weight="600" fill="#1b1f24">4/15  27%</text>

    <text x="730" y="497" font-size="18" font-weight="500" fill="#59636e">observed frequencies &#8594; next-token probabilities</text>
  </g>
</svg>
