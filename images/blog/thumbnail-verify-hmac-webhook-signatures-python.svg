<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Verify HMAC webhook signatures in Python</title>
  <desc id="desc">A webhook timestamp and exact body bytes enter an HMAC-SHA256 check. The calculated signature matches the supplied signature, so the recent request is accepted.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>
  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1" fill="#59636e">WEBHOOK VERIFICATION</text>
    <text x="90" y="270" font-size="82" font-weight="700" fill="#1b1f24">SIGN THE</text>
    <text x="90" y="365" font-size="82" font-weight="700" fill="#1b1f24">EXACT BYTES</text>
    <rect x="98" y="401" width="390" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="478" font-size="29" font-weight="500" fill="#59636e">HMAC-SHA256 · FRESHNESS · REPLAY</text>
    <g transform="translate(685 120)">
      <rect width="405" height="435" rx="24" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="28" y="48" font-size="19" font-weight="600" fill="#59636e">SIGNED MESSAGE</text>
      <rect x="28" y="70" width="132" height="54" rx="10" fill="#ffffff" stroke="#0067c0" stroke-width="2"/>
      <text x="49" y="103" font-size="20" font-weight="600" fill="#1b1f24">timestamp</text>
      <text x="174" y="104" font-size="25" font-weight="700" fill="#59636e">+</text>
      <rect x="205" y="70" width="172" height="54" rx="10" fill="#ffffff" stroke="#0067c0" stroke-width="2"/>
      <text x="231" y="103" font-size="20" font-weight="600" fill="#1b1f24">body bytes</text>
      <rect x="201" y="142" width="4" height="32" rx="2" fill="#0067c0"/>
      <rect x="196" y="168" width="14" height="6" rx="3" fill="#0067c0"/>
      <rect x="72" y="183" width="261" height="61" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
      <text x="116" y="221" font-size="24" font-weight="700" fill="#1b1f24">HMAC-SHA256</text>
      <rect x="201" y="245" width="4" height="35" rx="2" fill="#0067c0"/>
      <rect x="196" y="274" width="14" height="6" rx="3" fill="#0067c0"/>
      <rect x="28" y="289" width="349" height="62" rx="12" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>
      <text x="52" y="327" font-size="21" font-weight="600" fill="#1b1f24">calculated</text>
      <text x="179" y="327" font-size="26" font-weight="700" fill="#0067c0">=</text>
      <text x="213" y="327" font-size="21" font-weight="600" fill="#1b1f24">supplied</text>
      <rect x="72" y="370" width="261" height="40" rx="10" fill="#0067c0"/>
      <text x="106" y="397" font-size="22" font-weight="700" fill="#ffffff">RECENT: ACCEPT</text>
    </g>
  </g>
</svg>
