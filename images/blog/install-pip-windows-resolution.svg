<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">How Windows resolves pip versus python -m pip</title><desc id="desc">Diagram comparing two ways of running pip on Windows. The bare pip command searches folders listed on PATH in order and can fail to find any match. The python -m pip command instead asks one specific Python interpreter to run its own pip module directly, which always works if that interpreter has pip installed, regardless of PATH.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="150" y="50" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">COMMAND</text><text x="640" y="50" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">WHERE WINDOWS LOOKS</text><text x="1044" y="50" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">OUTCOME</text><rect x="40" y="140" width="220" height="80" rx="16" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="21" fill="#1b1f24"><text x="60" y="175">pip install</text><text x="60" y="203">requests</text></g><text x="150" y="252" font-size="19" fill="#59636e" text-anchor="middle">bare pip command</text><path d="M260 180C340 180 340 180 420 180" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><line x1="410" y1="88" x2="410" y2="246" stroke="#d0d5db" stroke-width="2.5" /><rect x="420" y="88" width="260" height="42" rx="10" fill="#ffffff" stroke="#c7ccd2" stroke-width="2.5" /><text x="440" y="115" font-size="16" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e">1  Anaconda3\Scripts</text><rect x="420" y="144" width="260" height="42" rx="10" fill="#ffffff" stroke="#c7ccd2" stroke-width="2.5" /><text x="440" y="171" font-size="16" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e">2  Python313\Scripts</text><rect x="420" y="200" width="260" height="42" rx="10" fill="#ffffff" stroke="#c7ccd2" stroke-width="2.5" stroke-dasharray="6 4" /><text x="440" y="227" font-size="16" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#9098a0">3  pip.exe not found</text><path d="M680 165C760 165 760 180 840 180" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><rect x="840" y="140" width="260" height="80" rx="16" fill="#fdeede" stroke="#c7ccd2" stroke-width="3" /><text x="970" y="175" font-size="21" font-weight="600" fill="#59636e" text-anchor="middle">depends on PATH</text><text x="970" y="202" font-size="17" fill="#59636e" text-anchor="middle">often &#8216;not recognized&#8217;</text><rect x="40" y="380" width="220" height="100" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" fill="#1b1f24"><text x="60" y="415">python -m pip</text><text x="60" y="443">install requests</text></g><text x="150" y="500" font-size="19" fill="#59636e" text-anchor="middle">python -m pip command</text><path d="M260 430C340 430 340 430 420 430" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><rect x="420" y="390" width="260" height="80" rx="16" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="550" y="425" font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0067c0" text-anchor="middle">this python.exe</text><text x="550" y="450" font-size="15" fill="#59636e" text-anchor="middle">no PATH search needed</text><path d="M680 430C760 430 760 430 840 430" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><rect x="840" y="390" width="260" height="80" rx="16" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="970" y="425" font-size="21" font-weight="600" fill="#1b1f24" text-anchor="middle">pip always runs</text><text x="970" y="450" font-size="15" fill="#59636e" text-anchor="middle">same interpreter, every time</text></g></svg>