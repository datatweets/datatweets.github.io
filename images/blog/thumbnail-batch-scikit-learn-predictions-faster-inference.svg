<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Batch Scikit-Learn Predictions for Faster Inference</title>
  <desc id="desc">A tutorial thumbnail showing four input rows grouped into one batch and sent through a single prediction call, illustrating how batching reduces repeated call overhead.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1" fill="#59636e">BATCHED MODEL INFERENCE</text>
    <text x="90" y="286" font-size="78" font-weight="700" fill="#1b1f24">MORE ROWS</text>
    <text x="90" y="382" font-size="78" font-weight="700" fill="#1b1f24">FEWER CALLS</text>
    <rect x="94" y="422" width="390" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="500" font-size="30" font-weight="500" fill="#59636e">TIMING &#183; THROUGHPUT &#183; VERIFY</text>

    <g transform="translate(700 126)">
      <text x="70" y="28" text-anchor="middle" font-size="22" font-weight="600" fill="#59636e">ROWS</text>
      <rect x="0" y="48" width="140" height="300" rx="22" fill="#f7fbff" stroke="#0067c0" stroke-width="3"/>

      <rect x="22" y="74" width="96" height="46" rx="10" fill="#ffffff" stroke="#c7ccd2" stroke-width="2"/>
      <rect x="22" y="140" width="96" height="46" rx="10" fill="#ffffff" stroke="#c7ccd2" stroke-width="2"/>
      <rect x="22" y="206" width="96" height="46" rx="10" fill="#ffffff" stroke="#c7ccd2" stroke-width="2"/>
      <rect x="22" y="272" width="96" height="46" rx="10" fill="#ffffff" stroke="#c7ccd2" stroke-width="2"/>
      <text x="70" y="105" text-anchor="middle" font-size="19" font-weight="600" fill="#1b1f24">ROW A</text>
      <text x="70" y="171" text-anchor="middle" font-size="19" font-weight="600" fill="#1b1f24">ROW B</text>
      <text x="70" y="237" text-anchor="middle" font-size="19" font-weight="600" fill="#1b1f24">ROW C</text>
      <text x="70" y="303" text-anchor="middle" font-size="19" font-weight="600" fill="#1b1f24">ROW D</text>
      <text x="70" y="382" text-anchor="middle" font-size="22" font-weight="600" fill="#0067c0">ONE BATCH</text>

      <line x1="154" y1="198" x2="232" y2="198" stroke="#0067c0" stroke-width="5" stroke-linecap="round"/>
      <path d="M 232 198 L 216 186 M 232 198 L 216 210" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="252" y="121" width="156" height="154" rx="24" fill="#ffffff" stroke="#59636e" stroke-width="3"/>
      <circle cx="330" cy="161" r="18" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
      <path d="M 322 161 L 328 167 L 339 154" fill="none" stroke="#0067c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="330" y="203" text-anchor="middle" font-size="21" font-weight="700" fill="#1b1f24">ONE</text>
      <text x="330" y="229" text-anchor="middle" font-size="21" font-weight="700" fill="#1b1f24">PREDICT</text>
      <text x="330" y="255" text-anchor="middle" font-size="21" font-weight="700" fill="#1b1f24">CALL</text>
      <text x="330" y="314" text-anchor="middle" font-size="21" font-weight="600" fill="#59636e">LESS OVERHEAD</text>
    </g>
  </g>
</svg>
