<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Calculate Neural Network Parameter Counts in Python</title>
  <desc id="desc">A neural network parameter-count thumbnail. Three Dense-layer calculations show 56, 36, and 5 parameters, which add up to 97.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="148" font-size="34" font-weight="600" letter-spacing="1" fill="#59636e">DENSE LAYER AUDIT</text>
    <text x="90" y="285" font-size="88" font-weight="700" fill="#1b1f24">COUNT</text>
    <text x="90" y="380" font-size="76" font-weight="700" fill="#1b1f24">PARAMETERS</text>
    <rect x="96" y="416" width="360" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="492" font-size="30" font-weight="500" fill="#59636e">shapes &#183; weights &#183; biases</text>
  </g>

  <g transform="translate(680 112)" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="18" y="30" font-size="22" font-weight="600" letter-spacing="1" fill="#59636e">INPUT &#215; UNITS + BIAS</text>

    <rect x="0" y="58" width="422" height="88" rx="16" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
    <text x="20" y="93" font-size="18" font-weight="600" letter-spacing="1" fill="#59636e">DENSE 1</text>
    <text x="20" y="128" font-size="30" font-weight="600" fill="#1b1f24">6 &#215; 8 + 8</text>
    <rect x="320" y="76" width="82" height="52" rx="12" fill="#e3f0fa"/>
    <text x="361" y="112" text-anchor="middle" font-size="30" font-weight="700" fill="#0067c0">56</text>

    <rect x="0" y="160" width="422" height="88" rx="16" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
    <text x="20" y="195" font-size="18" font-weight="600" letter-spacing="1" fill="#59636e">DENSE 2</text>
    <text x="20" y="230" font-size="30" font-weight="600" fill="#1b1f24">8 &#215; 4 + 4</text>
    <rect x="320" y="178" width="82" height="52" rx="12" fill="#e3f0fa"/>
    <text x="361" y="214" text-anchor="middle" font-size="30" font-weight="700" fill="#0067c0">36</text>

    <rect x="0" y="262" width="422" height="88" rx="16" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
    <text x="20" y="297" font-size="18" font-weight="600" letter-spacing="1" fill="#59636e">OUTPUT</text>
    <text x="20" y="332" font-size="30" font-weight="600" fill="#1b1f24">4 &#215; 1 + 1</text>
    <rect x="320" y="280" width="82" height="52" rx="12" fill="#e3f0fa"/>
    <text x="361" y="316" text-anchor="middle" font-size="30" font-weight="700" fill="#0067c0">5</text>

    <line x1="22" y1="382" x2="400" y2="382" stroke="#0067c0" stroke-width="4" stroke-linecap="round"/>
    <text x="18" y="431" font-size="24" font-weight="600" letter-spacing="1" fill="#59636e">TOTAL</text>
    <text x="400" y="435" text-anchor="end" font-size="48" font-weight="700" fill="#1b1f24">97</text>
  </g>
</svg>
