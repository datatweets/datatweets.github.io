<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Logistic Regression vs Random Forest thumbnail</title><desc id="desc">A minimal thumbnail for an article comparing a logistic regression model and a random forest model with cross-validation, contrasted with a single, unstable train/test split.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="38" font-weight="600" fill="#59636e">One split can pick the wrong model</text><text x="90" y="330" font-size="128" font-weight="700" fill="#1b1f24">LR vs RF</text><rect x="100" y="362" width="420" height="12" rx="6" fill="#0067c0" /><text x="98" y="444" font-size="33" font-weight="500" fill="#59636e">cross-validated, then confirmed once</text></g><g transform="translate(790 250)"><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24"><rect x="-30" y="-138" width="220" height="52" rx="10" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="-14" y="-102" fill="#59636e">random_state</text></g><path d="M20 40 L80 -20 L140 60 L200 -60" fill="none" stroke="#59636e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><circle cx="20" cy="40" r="9" fill="#59636e" /><circle cx="80" cy="-20" r="9" fill="#59636e" /><circle cx="140" cy="60" r="9" fill="#59636e" /><circle cx="200" cy="-60" r="9" fill="#59636e" /><path d="M20 20 L80 40 L140 10 L200 30" fill="none" stroke="#0067c0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><circle cx="20" cy="20" r="9" fill="#0067c0" /><circle cx="80" cy="40" r="9" fill="#0067c0" /><circle cx="140" cy="10" r="9" fill="#0067c0" /><circle cx="200" cy="30" r="9" fill="#0067c0" /><rect x="-30" y="130" width="270" height="90" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="22"><text x="-10" y="165" fill="#1b1f24">5-fold CV</text><text x="-10" y="196" fill="#0067c0">stable ranking</text></g></g></svg>