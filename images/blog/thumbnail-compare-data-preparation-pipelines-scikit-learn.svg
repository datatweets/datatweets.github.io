<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">How to Compare Data Preparation Pipelines in scikit-learn</title>
  <desc id="desc">A DataTweets tutorial thumbnail. Four complete pipelines use identical validation folds, scaling, and Ridge regression while testing raw features, a ratio, a log transform, and both features. The pipeline with both derived features has the lowest mean absolute error.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="30" font-weight="600" letter-spacing="1.2" fill="#59636e">DATA PREPARATION</text>
    <text x="90" y="286" font-size="82" font-weight="700" fill="#1b1f24">TEST EACH</text>
    <text x="90" y="378" font-size="82" font-weight="700" fill="#1b1f24">PIPELINE</text>
    <rect x="94" y="412" width="350" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="486" font-size="28" font-weight="500" fill="#59636e">FEATURES &#183; FOLDS &#183; MAE</text>

    <g transform="translate(675 112)">
      <text x="215" y="28" text-anchor="middle" font-size="21" font-weight="600" letter-spacing="0.5" fill="#59636e">SAME FOLDS &#183; SAME MODEL</text>
      <text x="18" y="62" font-size="15" font-weight="600" letter-spacing="0.8" fill="#59636e">CANDIDATE</text>
      <text x="212" y="62" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="0.8" fill="#59636e">COMPLETE PIPELINE</text>
      <text x="392" y="62" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="0.8" fill="#59636e">MAE</text>

      <g transform="translate(0 76)">
        <rect width="430" height="72" rx="15" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
        <text x="18" y="44" font-size="18" font-weight="600" fill="#1b1f24">RAW</text>
        <rect x="102" y="16" width="62" height="40" rx="8" fill="#e3f0fa"/>
        <rect x="170" y="16" width="68" height="40" rx="8" fill="#ffffff" stroke="#c7ccd2"/>
        <rect x="244" y="16" width="68" height="40" rx="8" fill="#ffffff" stroke="#c7ccd2"/>
        <text x="133" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#0067c0">PREP</text>
        <text x="204" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#59636e">SCALE</text>
        <text x="278" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#59636e">RIDGE</text>
        <text x="392" y="44" text-anchor="middle" font-size="19" font-weight="600" fill="#59636e">18.86</text>
      </g>

      <g transform="translate(0 158)">
        <rect width="430" height="72" rx="15" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
        <text x="18" y="44" font-size="18" font-weight="600" fill="#1b1f24">RATIO</text>
        <rect x="102" y="16" width="62" height="40" rx="8" fill="#e3f0fa"/>
        <rect x="170" y="16" width="68" height="40" rx="8" fill="#ffffff" stroke="#c7ccd2"/>
        <rect x="244" y="16" width="68" height="40" rx="8" fill="#ffffff" stroke="#c7ccd2"/>
        <text x="133" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#0067c0">PREP</text>
        <text x="204" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#59636e">SCALE</text>
        <text x="278" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#59636e">RIDGE</text>
        <text x="392" y="44" text-anchor="middle" font-size="19" font-weight="600" fill="#59636e">4.67</text>
      </g>

      <g transform="translate(0 240)">
        <rect width="430" height="72" rx="15" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
        <text x="18" y="44" font-size="18" font-weight="600" fill="#1b1f24">LOG</text>
        <rect x="102" y="16" width="62" height="40" rx="8" fill="#e3f0fa"/>
        <rect x="170" y="16" width="68" height="40" rx="8" fill="#ffffff" stroke="#c7ccd2"/>
        <rect x="244" y="16" width="68" height="40" rx="8" fill="#ffffff" stroke="#c7ccd2"/>
        <text x="133" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#0067c0">PREP</text>
        <text x="204" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#59636e">SCALE</text>
        <text x="278" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#59636e">RIDGE</text>
        <text x="392" y="44" text-anchor="middle" font-size="19" font-weight="600" fill="#59636e">18.57</text>
      </g>

      <g transform="translate(0 322)">
        <rect width="430" height="72" rx="15" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
        <text x="18" y="44" font-size="18" font-weight="700" fill="#1b1f24">BOTH</text>
        <rect x="102" y="16" width="62" height="40" rx="8" fill="#0067c0"/>
        <rect x="170" y="16" width="68" height="40" rx="8" fill="#ffffff" stroke="#0067c0"/>
        <rect x="244" y="16" width="68" height="40" rx="8" fill="#ffffff" stroke="#0067c0"/>
        <text x="133" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">PREP</text>
        <text x="204" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#0067c0">SCALE</text>
        <text x="278" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#0067c0">RIDGE</text>
        <circle cx="346" cy="36" r="12" fill="#0067c0"/>
        <path d="M340 36 L344 40 L352 31" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="392" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#0067c0">3.74</text>
      </g>

      <text x="215" y="432" text-anchor="middle" font-size="17" font-weight="600" fill="#0067c0">LOWER VALIDATION ERROR WINS</text>
    </g>
  </g>
</svg>
