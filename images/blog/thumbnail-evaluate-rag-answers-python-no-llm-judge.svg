<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">How to Evaluate RAG Answers in Python Without an LLM Judge</title>
  <desc id="desc">A DATATWEETS tutorial thumbnail with the headline Test the Evidence Chain. A diagram traces a question through two retrieved chunks to a cited answer, then shows passing retrieval and citation checks beside a one-of-two coverage warning.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="147" font-size="29" font-weight="600" letter-spacing="1.2" fill="#59636e">OFFLINE RAG EVALUATION</text>
    <text x="90" y="278" font-size="78" font-weight="700" fill="#1b1f24">TEST THE</text>
    <text x="90" y="362" font-size="66" font-weight="700" fill="#1b1f24">EVIDENCE CHAIN</text>
    <rect x="96" y="397" width="386" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="474" font-size="25" font-weight="600" fill="#59636e">RETRIEVAL · CITATIONS · ABSTENTION</text>

    <g transform="translate(678 104)">
      <text x="0" y="24" font-size="18" font-weight="700" letter-spacing="1" fill="#59636e">ONE CASE, THREE CHECKS</text>

      <rect x="0" y="48" width="416" height="68" rx="14" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <circle cx="33" cy="82" r="18" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
      <text x="33" y="89" text-anchor="middle" font-size="20" font-weight="700" fill="#0067c0">Q</text>
      <text x="66" y="78" font-size="18" font-weight="700" fill="#1b1f24">WHEN WILL THEY REPLY?</text>
      <text x="66" y="99" font-size="15" font-weight="500" fill="#59636e">expected: 5 calendar days · 2 working days</text>

      <line x1="208" y1="116" x2="208" y2="144" stroke="#0067c0" stroke-width="3"/>
      <path d="M198 137 L208 149 L218 137" fill="none" stroke="#0067c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="0" y="170" font-size="15" font-weight="700" letter-spacing="0.8" fill="#59636e">TOP-2 RETRIEVED CHUNKS</text>
      <rect x="0" y="184" width="198" height="62" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
      <text x="18" y="210" font-size="17" font-weight="700" fill="#0067c0">W03 · EXPECTED</text>
      <text x="18" y="231" font-size="14" font-weight="500" fill="#1b1f24">accessibility policy</text>
      <rect x="218" y="184" width="198" height="62" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="2"/>
      <text x="236" y="210" font-size="17" font-weight="700" fill="#59636e">W01 · OTHER</text>
      <text x="236" y="231" font-size="14" font-weight="500" fill="#59636e">registration policy</text>

      <line x1="208" y1="246" x2="208" y2="274" stroke="#0067c0" stroke-width="3"/>
      <path d="M198 267 L208 279 L218 267" fill="none" stroke="#0067c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="0" y="286" width="416" height="78" rx="14" fill="#ffffff" stroke="#c7ccd2" stroke-width="2"/>
      <text x="18" y="313" font-size="15" font-weight="700" letter-spacing="0.8" fill="#59636e">SAVED ANSWER</text>
      <text x="18" y="342" font-size="18" font-weight="600" fill="#1b1f24">“Send it 5 calendar days early.”</text>
      <rect x="330" y="305" width="66" height="34" rx="9" fill="#e3f0fa"/>
      <text x="363" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#0067c0">[W03]</text>

      <g transform="translate(0 390)">
        <rect width="126" height="70" rx="12" fill="#edf7f3" stroke="#9bcdbf" stroke-width="2"/>
        <circle cx="23" cy="23" r="11" fill="#147d64"/>
        <path d="M17 23 L21 27 L29 18" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="29" font-size="16" font-weight="700" fill="#147d64">RECALL</text>
        <text x="18" y="56" font-size="21" font-weight="700" fill="#1b1f24">1.0</text>

        <rect x="145" width="126" height="70" rx="12" fill="#edf7f3" stroke="#9bcdbf" stroke-width="2"/>
        <circle cx="168" cy="23" r="11" fill="#147d64"/>
        <path d="M162 23 L166 27 L174 18" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="187" y="29" font-size="16" font-weight="700" fill="#147d64">CITATION</text>
        <text x="163" y="56" font-size="21" font-weight="700" fill="#1b1f24">1.0</text>

        <rect x="290" width="126" height="70" rx="12" fill="#fff6e8" stroke="#efc47c" stroke-width="2"/>
        <circle cx="313" cy="23" r="11" fill="#d97706"/>
        <path d="M313 16 L313 24 M313 29 L313 30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <text x="332" y="29" font-size="16" font-weight="700" fill="#a85605">COVERAGE</text>
        <text x="308" y="56" font-size="21" font-weight="700" fill="#1b1f24">1 / 2</text>
      </g>
    </g>
  </g>
</svg>
