<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">A full if/else block collapsing into a one-line ternary expression</title><desc id="desc">Diagram showing a four-line if/else block (if age is at least 18, else) collapsing into the equivalent one-line ternary expression label = "adult" if age &#8805; 18 else "minor", with the condition, the value if true, and the value if false each labeled and color-coded.</desc><rect width="1200" height="590" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="600" y="46" font-size="26" font-weight="600" fill="#59636e" text-anchor="middle">THE SAME LOGIC, WRITTEN TWO WAYS</text><rect x="300" y="72" width="600" height="230" rx="20" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><rect x="316" y="88" width="568" height="52" rx="10" fill="#e3f0fa" /><rect x="316" y="146" width="568" height="52" rx="10" fill="#e6f4e6" /><rect x="316" y="238" width="568" height="52" rx="10" fill="#fdeede" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="26" fill="#1b1f24"><text x="340" y="122">if age &#8805; 18:</text><text x="372" y="180">label = "adult"</text><text x="340" y="222" font-size="22" fill="#59636e">else:</text><text x="372" y="272">label = "minor"</text></g><path d="M600 312V366" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M584 356L600 378L616 356" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="655" y="350" font-size="22" font-weight="600" fill="#0067c0">COLLAPSES TO ONE LINE</text><rect x="100" y="390" width="1000" height="110" rx="20" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><rect x="340" y="414" width="150" height="46" rx="10" fill="#e6f4e6" /><rect x="590" y="414" width="190" height="46" rx="10" fill="#e3f0fa" /><rect x="890" y="414" width="150" height="46" rx="10" fill="#fdeede" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="30" fill="#1b1f24"><text x="160" y="450" text-anchor="start">label = </text><text x="415" y="450" text-anchor="middle">"adult"</text><text x="540" y="450" text-anchor="middle" fill="#59636e">if</text><text x="685" y="450" text-anchor="middle">age &#8805; 18</text><text x="835" y="450" text-anchor="middle" fill="#59636e">else</text><text x="965" y="450" text-anchor="middle">"minor"</text></g><path d="M415 545V512" fill="none" stroke="#59636e" stroke-width="4" stroke-linecap="round" /><path d="M404 522L415 508L426 522" fill="none" stroke="#59636e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="415" y="565" font-size="19" font-weight="600" fill="#1b1f24" text-anchor="middle">VALUE IF TRUE</text><path d="M685 545V512" fill="none" stroke="#59636e" stroke-width="4" stroke-linecap="round" /><path d="M674 522L685 508L696 522" fill="none" stroke="#59636e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="685" y="565" font-size="19" font-weight="600" fill="#0067c0" text-anchor="middle">CONDITION</text><path d="M965 545V512" fill="none" stroke="#59636e" stroke-width="4" stroke-linecap="round" /><path d="M954 522L965 508L976 522" fill="none" stroke="#59636e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="965" y="565" font-size="19" font-weight="600" fill="#1b1f24" text-anchor="middle">VALUE IF FALSE</text></g></svg>
