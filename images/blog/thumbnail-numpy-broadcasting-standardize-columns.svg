<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">NumPy broadcasting for column-wise standardization</title>
  <desc id="desc">A six-by-three data matrix combines with one row of column statistics to produce standardized columns. Arrows show the single statistics row applying across all six rows.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="36" font-weight="600" letter-spacing="1" fill="#59636e">NUMPY BROADCASTING</text>
    <text x="90" y="270" font-size="86" font-weight="700" fill="#1b1f24">ONE ROW</text>
    <text x="90" y="365" font-size="86" font-weight="700" fill="#1b1f24">EVERY COLUMN</text>
    <rect x="96" y="405" width="390" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="474" font-size="30" font-weight="500" fill="#59636e">SHAPES &#183; Z-SCORES &#183; CHECKS</text>
  </g>

  <g transform="translate(710 116)" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="24" font-size="24" font-weight="600" fill="#59636e">VALUES</text>
    <text x="330" y="24" font-size="24" font-weight="600" fill="#0067c0">STATS</text>
    <text x="0" y="54" font-size="20" fill="#7a848e">(6, 3)</text>
    <text x="330" y="54" font-size="20" fill="#7a848e">(1, 3)</text>

    <g fill="#ffffff" stroke="#c7ccd2" stroke-width="2">
      <rect x="0" y="82" width="66" height="48" rx="8"/><rect x="74" y="82" width="66" height="48" rx="8"/><rect x="148" y="82" width="66" height="48" rx="8"/>
      <rect x="0" y="138" width="66" height="48" rx="8"/><rect x="74" y="138" width="66" height="48" rx="8"/><rect x="148" y="138" width="66" height="48" rx="8"/>
      <rect x="0" y="194" width="66" height="48" rx="8"/><rect x="74" y="194" width="66" height="48" rx="8"/><rect x="148" y="194" width="66" height="48" rx="8"/>
      <rect x="0" y="250" width="66" height="48" rx="8"/><rect x="74" y="250" width="66" height="48" rx="8"/><rect x="148" y="250" width="66" height="48" rx="8"/>
      <rect x="0" y="306" width="66" height="48" rx="8"/><rect x="74" y="306" width="66" height="48" rx="8"/><rect x="148" y="306" width="66" height="48" rx="8"/>
      <rect x="0" y="362" width="66" height="48" rx="8"/><rect x="74" y="362" width="66" height="48" rx="8"/><rect x="148" y="362" width="66" height="48" rx="8"/>
    </g>

    <g fill="#e3f0fa" stroke="#0067c0" stroke-width="3">
      <rect x="300" y="82" width="66" height="48" rx="8"/>
      <rect x="374" y="82" width="66" height="48" rx="8"/>
      <rect x="448" y="82" width="66" height="48" rx="8"/>
    </g>
    <g fill="#0067c0">
      <rect x="331" y="142" width="4" height="228" rx="2"/>
      <rect x="405" y="142" width="4" height="228" rx="2"/>
      <rect x="479" y="142" width="4" height="228" rx="2"/>
    </g>
    <g font-size="23" font-weight="700" text-anchor="middle" fill="#0067c0">
      <text x="333" y="390">▼</text><text x="407" y="390">▼</text><text x="481" y="390">▼</text>
    </g>
    <g font-size="22" font-weight="600" text-anchor="middle">
      <text x="33" y="114" fill="#59636e">18.2</text><text x="107" y="114" fill="#59636e">78</text><text x="181" y="114" fill="#59636e">510</text>
      <text x="333" y="114" fill="#0067c0">μ₁</text><text x="407" y="114" fill="#0067c0">μ₂</text><text x="481" y="114" fill="#0067c0">μ₃</text>
    </g>
    <text x="257" y="452" font-size="22" font-weight="600" text-anchor="middle" fill="#1b1f24">COLUMN STATISTICS APPLY DOWN EACH COLUMN</text>
  </g>
</svg>
