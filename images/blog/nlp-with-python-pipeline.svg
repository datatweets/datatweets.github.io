<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Raw text to tokens to cleaned tokens to numbers</title><desc id="desc">Diagram tracing the word "alone" through a text preprocessing pipeline: a raw sentence from Walt Whitman's Leaves of Grass is tokenized into a list of tokens, cleaned by removing stopwords, and finally vectorized, where "alone" gets a bag-of-words count of 2 and a TF-IDF score of 0.420.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="150" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">RAW TEXT</text><text x="450" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">TOKENS</text><text x="750" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">CLEANED TOKENS</text><text x="1050" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">NUMBERS</text><rect x="40" y="96" width="220" height="220" rx="16" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="16" fill="#1b1f24"><text x="58" y="130">"...physiognomy</text><text x="58" y="154" fill="#0067c0" font-weight="700">alone</text><text x="58" y="178">nor brain</text><text x="58" y="202" fill="#0067c0" font-weight="700">alone</text><text x="58" y="226">is worthy for</text><text x="58" y="250">the Muse..."</text></g><text x="150" y="292" font-size="15" fill="#59636e" text-anchor="middle">one line, Whitman</text><path d="M264 200H336" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M318 184L338 200L318 216" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="176" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="14" fill="#59636e" text-anchor="middle">word_tokenize()</text><rect x="340" y="96" width="220" height="220" rx="16" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="15" fill="#1b1f24"><text x="358" y="128">[physiognomy,</text><text x="358" y="150" fill="#0067c0" font-weight="700"> alone, nor,</text><text x="358" y="172">brain,</text><text x="358" y="194" fill="#0067c0" font-weight="700"> alone,</text><text x="358" y="216">is, worthy, ...]</text></g><text x="450" y="292" font-size="15" fill="#59636e" text-anchor="middle">12 tokens</text><path d="M564 200H636" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M618 184L638 200L618 216" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="176" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="14" fill="#59636e" text-anchor="middle">lower + stopwords</text><rect x="640" y="96" width="220" height="220" rx="16" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="15" fill="#1b1f24"><text x="658" y="128">[physiognomy,</text><text x="658" y="150" fill="#0067c0" font-weight="700"> alone, brain,</text><text x="658" y="172" fill="#0067c0" font-weight="700"> alone, worthy,</text><text x="658" y="194">muse, ...]</text></g><text x="750" y="292" font-size="15" fill="#59636e" text-anchor="middle">"nor", "is" removed</text><path d="M864 200H936" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M918 184L938 200L918 216" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="900" y="176" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="14" fill="#59636e" text-anchor="middle">TfidfVectorizer</text><rect x="940" y="96" width="220" height="220" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="960" y="132" font-size="16" fill="#59636e">bag-of-words count</text><rect x="960" y="146" width="184" height="34" rx="8" fill="#fdeede" /><text x="974" y="170" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#1b1f24">alone: 2</text><text x="960" y="206" font-size="16" fill="#59636e">TF-IDF score</text><rect x="960" y="220" width="184" height="34" rx="8" fill="#e6f4e6" /><text x="974" y="244" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#1b1f24">alone: 0.420</text><rect x="40" y="420" width="1120" height="90" rx="18" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="70" y="458" font-size="20" fill="#1b1f24">Text is unstructured until you <tspan font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0067c0">tokenize</tspan> it, and it stays unusable to a</text><text x="70" y="486" font-size="20" fill="#1b1f24">model until you <tspan font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0067c0">vectorize</tspan> it — every NLP pipeline is some version of this path.</text></g></svg>