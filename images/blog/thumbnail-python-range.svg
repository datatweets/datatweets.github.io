<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Python range thumbnail</title><desc id="desc">A minimal logo-style thumbnail for an article on Python's range() built-in, showing a small range(2, 20, 3) object above a row of six value chips (2, 5, 8, 11, 14, 17) it computes on demand.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="40" font-weight="600" fill="#59636e">The lazy sequence behind every loop</text><text x="90" y="392" font-size="150" font-weight="700" fill="#1b1f24">range</text><rect x="100" y="424" width="270" height="12" rx="6" fill="#0067c0" /><text x="98" y="506" font-size="35" font-weight="500" fill="#59636e">start &#183; stop &#183; step</text></g><g transform="translate(730 220)" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="0" y="0" width="330" height="56" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="165" y="36" font-size="22" font-weight="600" fill="#0067c0" text-anchor="middle">range(2, 20, 3)</text><path d="M165 56V88" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><polygon points="165,96 157,84 173,84" fill="#c7ccd2" /><g font-size="17"><rect x="0" y="106" width="48" height="40" rx="8" fill="#e3f0fa" /><text x="24" y="131" fill="#1b1f24" text-anchor="middle">2</text><rect x="56" y="106" width="48" height="40" rx="8" fill="#e6f4e6" /><text x="80" y="131" fill="#1b1f24" text-anchor="middle">5</text><rect x="112" y="106" width="48" height="40" rx="8" fill="#e3f0fa" /><text x="136" y="131" fill="#1b1f24" text-anchor="middle">8</text><rect x="168" y="106" width="48" height="40" rx="8" fill="#e6f4e6" /><text x="192" y="131" fill="#1b1f24" text-anchor="middle">11</text><rect x="224" y="106" width="48" height="40" rx="8" fill="#e3f0fa" /><text x="248" y="131" fill="#1b1f24" text-anchor="middle">14</text><rect x="280" y="106" width="48" height="40" rx="8" fill="#e6f4e6" /><text x="304" y="131" fill="#1b1f24" text-anchor="middle">17</text></g><text x="165" y="182" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#59636e" text-anchor="middle">48 bytes, values computed on demand</text></g></svg>
