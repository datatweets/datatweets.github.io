      <line x1="176" y1="185" x2="220" y2="185" stroke="#0067c0" stroke-width="10" stroke-linecap="round"/>
      <line x1="232" y1="185" x2="282" y2="185" stroke="#0067c0" stroke-width="10" stroke-linecap="round"/>
