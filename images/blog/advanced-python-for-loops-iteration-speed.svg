<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Rows per second for four ways to loop over a pandas DataFrame</title><desc id="desc">Bar chart, log scale, comparing throughput for four ways of computing a per-row delivery fee across 20,000 rows: .iterrows() reached 58,817 rows per second (0.340 seconds total), .apply(axis=1) reached 198,576 rows per second (0.101 seconds total), .itertuples() reached 1,708,994 rows per second (0.012 seconds total), and a fully vectorized calculation reached 33,999,150 rows per second (0.0006 seconds total) - making the vectorized version about 578 times faster than .iterrows() on this machine.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="600" y="50" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">LOOPING OVER 20,000 PANDAS ROWS</text><text x="600" y="82" font-size="19" font-weight="500" fill="#59636e" text-anchor="middle">rows processed per second, log scale &#183; verified pandas 3.0.3 / numpy 2.4.6 run</text>

<g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="17" fill="#8b939c"><line x1="110" y1="128" x2="1090" y2="128" stroke="#e3e6ea" stroke-width="1" /><text x="100" y="133" text-anchor="end">100M/s</text><line x1="110" y1="211" x2="1090" y2="211" stroke="#e3e6ea" stroke-width="1" /><text x="100" y="216" text-anchor="end">10M/s</text><line x1="110" y1="294" x2="1090" y2="294" stroke="#e3e6ea" stroke-width="1" /><text x="100" y="299" text-anchor="end">1M/s</text><line x1="110" y1="377" x2="1090" y2="377" stroke="#e3e6ea" stroke-width="1" /><text x="100" y="382" text-anchor="end">100K/s</text></g>

<path d="M110 460H1090" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" />

<rect x="140" y="397" width="190" height="63" rx="8" fill="#fdeede" stroke="#59636e" stroke-width="3" /><text x="235" y="380" font-size="24" font-weight="600" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">58,817/s</text><text x="235" y="500" font-size="21" font-weight="600" fill="#59636e" text-anchor="middle">.ITERROWS()</text><text x="235" y="527" font-size="18" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">0.340s total</text>

<rect x="390" y="353" width="190" height="107" rx="8" fill="#c9defb" stroke="#4a90c4" stroke-width="3" /><text x="485" y="336" font-size="24" font-weight="600" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">198,576/s</text><text x="485" y="500" font-size="21" font-weight="600" fill="#4a90c4" text-anchor="middle">.APPLY(AXIS=1)</text><text x="485" y="527" font-size="18" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">0.101s total</text>

<rect x="640" y="275" width="190" height="185" rx="8" fill="#9dbfdd" stroke="#0067c0" stroke-width="3" /><text x="735" y="258" font-size="24" font-weight="600" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">1,708,994/s</text><text x="735" y="500" font-size="21" font-weight="600" fill="#0067c0" text-anchor="middle">.ITERTUPLES()</text><text x="735" y="527" font-size="18" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">0.012s total</text>

<rect x="890" y="166" width="190" height="294" rx="8" fill="#0067c0" stroke="#0067c0" stroke-width="3" /><text x="985" y="149" font-size="24" font-weight="600" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">33,999,150/s</text><text x="985" y="500" font-size="21" font-weight="600" fill="#0067c0" text-anchor="middle">VECTORIZED</text><text x="985" y="527" font-size="18" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">0.0006s total</text>

</g></svg>
