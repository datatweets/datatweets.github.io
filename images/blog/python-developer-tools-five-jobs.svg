<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The five jobs behind Python tooling advice</title><desc id="desc">A flow diagram showing five sequential jobs in Python tooling: isolate dependencies with venv or uv, install packages with pip or uv, format code with black, lint code with ruff, and test code with pytest. A sixth job, type-checking with mypy, branches off as optional rather than sitting in the main line.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="180" y="80" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">ISOLATE</text><text x="390" y="80" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">INSTALL</text><text x="600" y="80" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">FORMAT</text><text x="810" y="80" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">LINT</text><text x="1020" y="80" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">TEST</text></g><g><rect x="95" y="100" width="170" height="110" rx="16" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><rect x="305" y="100" width="170" height="110" rx="16" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><rect x="515" y="100" width="170" height="110" rx="16" fill="#fdeede" stroke="#0067c0" stroke-width="3" /><rect x="725" y="100" width="170" height="110" rx="16" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><rect x="935" y="100" width="170" height="110" rx="16" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="26" text-anchor="middle" fill="#1b1f24"><text x="180" y="148">venv</text><text x="180" y="180">uv</text><text x="390" y="148">pip</text><text x="390" y="180">uv</text><text x="600" y="163">black</text><text x="810" y="163">ruff</text><text x="1020" y="163">pytest</text></g><g stroke="#0067c0" stroke-width="5" stroke-linecap="round" fill="none"><path d="M267 155H303" /><path d="M477 155H513" /><path d="M687 155H723" /><path d="M897 155H933" /></g><g fill="#0067c0"><path d="M303 155l-16-10v20z" /><path d="M513 155l-16-10v20z" /><path d="M723 155l-16-10v20z" /><path d="M933 155l-16-10v20z" /></g><g stroke="#c7ccd2" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" fill="none"><path d="M810 210C810 300 915 300 915 336" /></g><g fill="#c7ccd2"><path d="M915 336l-9-16h18z" /></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="1000" y="290" font-size="22" font-weight="600" fill="#59636e" text-anchor="middle">TYPE-CHECK</text><text x="1000" y="316" font-size="18" fill="#59636e" text-anchor="middle">(optional)</text></g><rect x="815" y="344" width="200" height="86" rx="16" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" stroke-dasharray="8 8" /><text x="915" y="396" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="26" text-anchor="middle" fill="#59636e">mypy</text><text x="600" y="480" font-size="22" fill="#59636e" text-anchor="middle" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">one job, one tool</text></svg>
