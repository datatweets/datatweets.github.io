<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">PySpark performance tuning thumbnail</title><desc id="desc">A minimal thumbnail for an article on PySpark performance tuning: reading explain plans, caching, broadcast joins, and partitioning, illustrated with a schematic before-and-after timing comparison.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="38" font-weight="600" fill="#59636e">Why the job is slow, and the fix</text><text x="90" y="360" font-size="150" font-weight="700" fill="#1b1f24">Tune</text><rect x="100" y="392" width="360" height="12" rx="6" fill="#0067c0" /><text x="98" y="474" font-size="34" font-weight="500" fill="#59636e">explain &#183; cache &#183; broadcast</text></g><g transform="translate(770 190)"><text x="150" y="-24" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#59636e" text-anchor="middle">MEASURED</text><line x1="0" y1="260" x2="300" y2="260" stroke="#c7ccd2" stroke-width="3" /><rect x="20" y="60" width="70" height="200" rx="10" fill="#fdeede" stroke="#e0b184" stroke-width="3" /><rect x="120" y="150" width="70" height="110" rx="10" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><rect x="220" y="190" width="70" height="70" rx="10" fill="#e6f4e6" stroke="#8fbc8f" stroke-width="3" /><text x="55" y="290" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#59636e" text-anchor="middle">before</text><text x="155" y="290" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#0067c0" text-anchor="middle">tuned</text><text x="255" y="290" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#59636e"