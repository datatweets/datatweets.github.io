<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Add Attention to a GRU in PyTorch for Classification</title>
  <desc id="desc">A DATATWEETS tutorial thumbnail. On the left, the words Weigh Each Step introduce GRU attention. On the right, four valid GRU hidden states receive attention weights that sum to one and flow into one context vector, while a padded state receives zero weight.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="145" font-size="34" font-weight="600" letter-spacing="1" fill="#59636e">SEQUENCE CLASSIFICATION</text>
    <text x="90" y="280" font-size="88" font-weight="700" fill="#1b1f24">WEIGH</text>
    <text x="90" y="378" font-size="88" font-weight="700" fill="#1b1f24">EACH STEP</text>
    <rect x="94" y="414" width="386" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="493" font-size="30" font-weight="500" fill="#59636e">GRU &#183; MASKING &#183; ATTENTION</text>

    <g transform="translate(690 112)">
      <text x="66" y="24" font-size="20" font-weight="600" letter-spacing="1" fill="#59636e">GRU STATES</text>
      <text x="244" y="24" font-size="20" font-weight="600" letter-spacing="1" fill="#59636e">WEIGHTS</text>
      <text x="360" y="24" font-size="20" font-weight="600" letter-spacing="1" fill="#59636e">CONTEXT</text>

      <g fill="none" stroke="#c7ccd2" stroke-width="2">
        <path d="M 294 86 L 375 217"/>
        <path d="M 310 156 L 375 217"/>
        <path d="M 356 226 L 375 217"/>
        <path d="M 318 296 L 375 217"/>
      </g>

      <g font-size="19" font-weight="600">
        <circle cx="26" cy="86" r="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
        <text x="20" y="92" fill="#0067c0">1</text>
        <path d="M 45 86 H 68" stroke="#8d98a3" stroke-width="2"/>
        <rect x="74" y="63" width="86" height="46" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
        <text x="105" y="93" fill="#1b1f24">h1</text>
        <rect x="191" y="75" width="42" height="22" rx="11" fill="#69a9df"/>
        <text x="242" y="93" fill="#59636e">.08</text>

        <circle cx="26" cy="156" r="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
        <text x="20" y="162" fill="#0067c0">2</text>
        <path d="M 45 156 H 68" stroke="#8d98a3" stroke-width="2"/>
        <rect x="74" y="133" width="86" height="46" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
        <text x="105" y="163" fill="#1b1f24">h2</text>
        <rect x="191" y="145" width="58" height="22" rx="11" fill="#69a9df"/>
        <text x="258" y="163" fill="#59636e">.13</text>

        <circle cx="26" cy="226" r="14" fill="#0067c0" stroke="#0067c0" stroke-width="3"/>
        <text x="20" y="232" fill="#ffffff">3</text>
        <path d="M 45 226 H 68" stroke="#0067c0" stroke-width="3"/>
        <rect x="74" y="203" width="86" height="46" rx="10" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
        <text x="105" y="233" fill="#0067c0">h3</text>
        <rect x="191" y="215" width="104" height="22" rx="11" fill="#0067c0"/>
        <text x="304" y="233" fill="#1b1f24">.63</text>

        <circle cx="26" cy="296" r="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
        <text x="20" y="302" fill="#0067c0">4</text>
        <path d="M 45 296 H 68" stroke="#8d98a3" stroke-width="2"/>
        <rect x="74" y="273" width="86" height="46" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
        <text x="105" y="303" fill="#1b1f24">h4</text>
        <rect x="191" y="285" width="65" height="22" rx="11" fill="#69a9df"/>
        <text x="265" y="303" fill="#59636e">.16</text>

        <circle cx="26" cy="366" r="14" fill="#ffffff" stroke="#b6bdc5" stroke-width="2" stroke-dasharray="4 3"/>
        <text x="10" y="400" font-size="15" fill="#7a8591">PAD</text>
        <path d="M 45 366 H 68" stroke="#b6bdc5" stroke-width="2" stroke-dasharray="4 3"/>
        <rect x="74" y="343" width="86" height="46" rx="10" fill="#f7f8fa" stroke="#b6bdc5" stroke-width="2" stroke-dasharray="5 4"/>
        <text x="105" y="373" fill="#7a8591">h5</text>
        <line x1="191" y1="366" x2="229" y2="366" stroke="#b6bdc5" stroke-width="4" stroke-linecap="round"/>
        <text x="242" y="373" fill="#7a8591">0</text>
      </g>

      <circle cx="406" cy="217" r="42" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
      <text x="392" y="227" font-size="31" font-weight="700" fill="#0067c0">C</text>
      <text x="348" y="293" font-size="17" font-weight="500" fill="#59636e">WEIGHTED SUM</text>
      <rect x="184" y="423" width="270" height="2" fill="#e3e6ea"/>
      <text x="190" y="455" font-size="17" font-weight="500" fill="#59636e">VALID WEIGHTS SUM TO 1</text>
    </g>
  </g>
</svg>
