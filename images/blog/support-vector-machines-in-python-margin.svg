<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">The margin and support vectors on real wine data</title><desc id="desc">Scatter plot of 70 sampled red wines on scaled alcohol and volatile acidity axes, with the fitted linear SVC's decision boundary running diagonally through the plot and two parallel dashed margin lines on either side of it; points with a heavier outline are real support vectors from the fitted model, and good and not-good wines visibly overlap around the boundary rather than forming two clean clusters. 827 of 1,279 training wines in the full two-feature model are support vectors, 64.7 percent.</desc><rect width="900" height="560" fill="#f7f8fa" /><clipPath id="svm-plot"><rect x="130" y="60" width="660" height="410" rx="12" /></clipPath><rect x="130" y="60" width="660" height="410" rx="12" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="60" y="42" font-size="26" font-weight="600" fill="#0067c0">THE MARGIN, GROUNDED IN REAL WINES</text><text x="60" y="66" font-size="17" fill="#59636e">alcohol vs. volatile acidity (both standardized), linear SVC, C=1</text></g><g clip-path="url(#svm-plot)"><style>.good{fill:#e3f0fa;stroke:#0067c0;stroke-width:2;}.notgood{fill:#fdeede;stroke:#59636e;stroke-width:2;}.sv{stroke-width:3.5;}</style><line x1="130.0" y1="396.1" x2="414.2" y2="60.0" stroke="#c7ccd2" stroke-width="2.5" stroke-dasharray="9 7" /><line x1="334.7" y1="470.0" x2="681.4" y2="60.0" stroke="#c7ccd2" stroke-width="2.5" stroke-dasharray="9 7" /><line x1="201.1" y1="470.0" x2="547.8" y2="60.0" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><circle cx="372.1" cy="262.8" r="7" class="notgood sv" /><circle cx="246.6" cy="379.5" r="7" class="good sv" /><circle cx="334.5" cy="298.7" r="7" class="notgood sv" /><circle cx="208.9" cy="274.0" r="5.5" class="notgood" /><circle cx="259.1" cy