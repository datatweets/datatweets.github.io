<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Python list versus NumPy array memory layout</title><desc id="desc">A Python list holding the four real measurements 5.1, 3.5, 1.4, 0.2 stores four reference boxes, each pointing to a separate float object elsewhere in memory carrying its own type tag and reference count. A NumPy float64 array holding the same four values stores them directly, back to back, in one contiguous block of memory with no separate objects.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="600" y="50" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">PYTHON LIST</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24" text-anchor="middle"><rect x="150" y="78" width="120" height="56" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="3" /><text x="210" y="114" fill="#1b1f24">[0]</text><rect x="360" y="78" width="120" height="56" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="3" /><text x="420" y="114" fill="#1b1f24">[1]</text><rect x="570" y="78" width="120" height="56" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="3" /><text x="630" y="114" fill="#1b1f24">[2]</text><rect x="780" y="78" width="120" height="56" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="3" /><text x="840" y="114" fill="#1b1f24">[3]</text></g><path d="M210 134V180" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><path d="M420 134V180" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><path d="M630 134V180" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><path d="M840 134V180" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><g><rect x="120" y="182" width="180" height="96" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="2" /><rect x="330" y="182" width="180" height="96" rx="14" fill="#e6f4e6" stroke="#0067c0" stroke-width="2" /><rect x="540" y="182" width="180" height="96" rx="14" fill="#fdeede" stroke="#0067c0" stroke-width="2" /><rect x="750" y="182" width="180" height="96" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="2" /></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="26" font-weight="600" text-anchor="middle"><text x="210" y="222" fill="#1b1f24">5.1</text><text x="420" y="222" fill="#1b1f24">3.5</text><text x="630" y="222" fill="#1b1f24">1.4</text><text x="840" y="222" fill="#1b1f24">0.2</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#59636e" text-anchor="middle"><text x="210" y="250">float object</text><text x="420" y="250">float object</text><text x="630" y="250">float object</text><text x="840" y="250">float object</text><text x="210" y="272">type tag + refcount</text><text x="420" y="272">type tag + refcount</text><text x="630" y="272">type tag + refcount</text><text x="840" y="272">type tag + refcount</text></g><text x="600" y="330" font-size="20" fill="#7a848e" text-anchor="middle">four separate objects, scattered in memory, each reached through a pointer</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="600" y="400" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">NUMPY ARRAY (float64)</text><rect x="270" y="432" width="660" height="80" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><path d="M435 432V512" fill="none" stroke="#0067c0" stroke-width="2" /><path d="M600 432V512" fill="none" stroke="#0067c0" stroke-width="2" /><path d="M765 432V512" fill="none" stroke="#0067c0" stroke-width="2" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="26" font-weight="600" text-anchor="middle" fill="#1b1f24"><text x="352" y="480">5.1</text><text x="517" y="480">3.5</text><text x="682" y="480">1.4</text><text x="847" y="480">0.2</text></g><text x="600" y="546" font-size="20" fill="#7a848e" text-anchor="middle">one block of memory, four 8-byte slots, no separate objects at all</text></g></svg>
