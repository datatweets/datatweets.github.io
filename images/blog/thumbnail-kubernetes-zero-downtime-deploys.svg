<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Kubernetes readiness probe thumbnail</title><desc id="desc">A minimal logo-style thumbnail for an article measuring dropped requests during a Kubernetes rolling deploy with and without a readiness probe.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="40" font-weight="600" fill="#59636e">22.6% dropped &#8594; 0%</text><text x="90" y="392" font-size="150" font-weight="700" fill="#1b1f24">ready</text><rect x="100" y="424" width="380" height="12" rx="6" fill="#0067c0" /><text x="98" y="506" font-size="35" font-weight="500" fill="#59636e">readinessProbe &#183; kubectl</text></g><g transform="translate(800 220)" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="0" y="0" width="230" height="70" rx="10" fill="#fdeced" stroke="#c8515b" stroke-width="2" /><text x="115" y="30" font-size="16" fill="#c8515b" text-anchor="middle">no probe</text><text x="115" y="54" font-size="26" font-weight="700" fill="#c8515b" text-anchor="middle">22.6%</text><rect x="0" y="100" width="230" height="70" rx="10" fill="#eaf6ef" stroke="#4d9870" stroke-width="2" /><text x="115" y="130" font-size="16" fill="#2f6b4a" text-anchor="middle">with probe</text><text x="115" y="154" font-size="26" font-weight="700" fill="#2f6b4a" text-anchor="middle">0.0%</text></g></svg>
