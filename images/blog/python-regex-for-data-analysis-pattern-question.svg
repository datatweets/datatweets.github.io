<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The pattern-then-question model for Python regex</title><desc id="desc">Diagram of the pattern ORD hyphen optional then two named groups year and seq each a four-digit class, broken into its literal, quantifier, character-class, and named-group pieces, aligned above the real matched text ORD-2024-8841. Below, three arrows lead from the pattern to three question types: search or match, which asks found it and where; findall or finditer, which asks for every match; and sub, which asks to replace what matched.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="600" y="46" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">PATTERN: DESCRIBE THE SHAPE</text><rect x="510" y="70" width="160" height="112" rx="18" fill="#e3f0fa" stroke="#7fb0d8" stroke-width="2" /><text x="590" y="88" font-size="18" fill="#4d84ac" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">(?P&lt;year&gt;...)</text><rect x="720" y="70" width="160" height="112" rx="18" fill="#e6f4e6" stroke="#8fbc8f" stroke-width="2" /><text x="800" y="88" font-size="18" fill="#5b8f5b" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">(?P&lt;seq&gt;...)</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="30" font-weight="600"><rect x="290" y="106" width="110" height="70" rx="12" fill="#ffffff" stroke="#59636e" stroke-width="3" /><text x="345" y="150" fill="#1b1f24" text-anchor="middle">ORD</text><rect x="410" y="106" width="70" height="70" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="445" y="150" fill="#0067c0" text-anchor="middle">-?</text><rect x="530" y="106" width="120" height="70" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="590" y="150" fill="#0067c0" text-anchor="middle">\d{4}</text><rect x="680" y="106" width="50" height="70" rx="12" fill="#ffffff" stroke="#59636e" stroke-width="3" /><text x="705" y="150" fill="#1b1f24" text-anchor="middle">-</text><rect x="740" y="106" width="120" height="70" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="800" y="150" fill="#0067c0" text-anchor="middle">\d{4}</text></g><g font-size="17" fill="#59636e" text-anchor="middle"><text x="345" y="204">literal</text><text x="445" y="204">optional</text><text x="590" y="204">digit × 4</text><text x="705" y="204">literal</text><text x="800" y="204">digit × 4</text></g><path d="M345 224V252" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><path d="M445 224V252" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><path d="M590 224V252" fill="none" stroke="#7fb0d8" stroke-width="4" stroke-linecap="round" /><path d="M705 224V252" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><path d="M800 224V252" fill="none" stroke="#8fbc8f" stroke-width="4" stroke-linecap="round" /><text x="600" y="248" font-size="17" fill="#59636e" text-anchor="middle">match on tickets[0]</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="30" font-weight="600"><rect x="290" y="262" width="110" height="54" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="345" y="298" fill="#1b1f24" text-anchor="middle">ORD</text><rect x="410" y="262" width="70" height="54" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="445" y="298" fill="#1b1f24" text-anchor="middle">-</text><rect x="530" y="262" width="120" height="54" rx="10" fill="#e3f0fa" stroke="#7fb0d8" stroke-width="2" /><text x="590" y="298" fill="#1b1f24" text-anchor="middle">2024</text><rect x="680" y="262" width="50" height="54" rx="10" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="705" y="298" fill="#1b1f24" text-anchor="middle">-</text><rect x="740" y="262" width="120" height="54" rx="10" fill="#e6f4e6" stroke="#8fbc8f" stroke-width="2" /><text x="800" y="298" fill="#1b1f24" text-anchor="middle">8841</text></g><text x="600" y="366" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">THEN ASK A QUESTION</text><path d="M345 316C345 400 240 380 240 412" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><path d="M590 316V412" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><path d="M800 316C800 400 960 380 960 412" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="22" font-weight="600"><rect x="80" y="412" width="320" height="94" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="240" y="448" fill="#0067c0" text-anchor="middle">search() / match()</text><text x="240" y="480" fill="#59636e" text-anchor="middle" font-family="Jost, sans-serif" font-weight="500" font-size="18">found it, and where?</text><rect x="440" y="412" width="320" height="94" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="600" y="448" fill="#0067c0" text-anchor="middle">findall() / finditer()</text><text x="600" y="480" fill="#59636e" text-anchor="middle" font-family="Jost, sans-serif" font-weight="500" font-size="18">every match, at once</text><rect x="800" y="412" width="320" height="94" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="960" y="448" fill="#0067c0" text-anchor="middle">sub()</text><text x="960" y="480" fill="#59636e" text-anchor="middle" font-family="Jost, sans-serif" font-weight="500" font-size="18">replace what matched</text></g></g></svg>