<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Streamlit chatbot UI thumbnail</title><desc id="desc">A minimal logo-style thumbnail for an article on building a Streamlit chat interface with session_state, chat_input, and streaming replies.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="40" font-weight="600" fill="#59636e">A rerun-driven chat interface</text><text x="90" y="392" font-size="150" font-weight="700" fill="#1b1f24">rerun</text><rect x="100" y="424" width="380" height="12" rx="6" fill="#0067c0" /><text x="98" y="506" font-size="35" font-weight="500" fill="#59636e">session_state &#183; chat_input</text></g><g transform="translate(800 160)" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="0" y="0" width="230" height="56" rx="14" fill="#eef1f4" stroke="#c7ccd2" stroke-width="3" /><text x="115" y="36" font-size="18" fill="#59636e" text-anchor="middle">assistant</text><rect x="60" y="80" width="230" height="56" rx="14" fill="#0067c0" /><text x="175" y="116" font-size="18" fill="#ffffff" text-anchor="middle">user</text><rect x="0" y="160" width="290" height="46" rx="23" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="20" y="189" font-size="17" fill="#59636e" font-family="'SFMono-Regular', Consolas, Menlo, monospace">Ask about a book...</text></g></svg>
