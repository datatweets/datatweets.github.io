<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The kiosk_daily_report DAG's task graph</title><desc id="desc">A diagram of a three-task DAG named kiosk daily report. log_run_start and write_sales_summary run independently, both starting at the same time with no dependency between them. Both feed into archive_summary, which only starts once both of the earlier tasks have finished successfully, proven by real timestamps from a triggered run: log_run_start and write_sales_summary both started at 20:13:15 UTC, and archive_summary started at 20:13:18 UTC, after both were done.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="140" y="70" font-size="24" font-weight="600" fill="#0067c0">RUN INDEPENDENTLY</text><rect x="140" y="110" width="340" height="100" rx="16" fill="#e3f0fa" stroke="#c7ccd2" stroke-width="2" /><text x="310" y="152" font-size="24" font-weight="600" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">log_run_start</text><text x="310" y="182" font-size="18" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">started 20:13:15 UTC</text><rect x="140" y="350" width="340" height="100" rx="16" fill="#e6f4e6" stroke="#c7ccd2" stroke-width="2" /><text x="310" y="392" font-size="24" font-weight="600" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">write_sales_summary</text><text x="310" y="422" font-size="18" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">started 20:13:15 UTC</text><text x="700" y="180" font-size="24" font-weight="600" fill="#0067c0">WAITS FOR BOTH</text><rect x="700" y="220" width="360" height="120" rx="16" fill="#fdeede" stroke="#0067c0" stroke-width="4" /><text x="880" y="270" font-size="26" font-weight="700" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">archive_summary</text><text x="880" y="304" font-size="18" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">started 20:13:18 UTC</text><path d="M480 160L700 260" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M480 400L700 300" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M700 260L678 250M700 260L684 272" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M700 300L678 310M700 300L684 288" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>
