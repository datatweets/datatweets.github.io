<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Spark SQL in PySpark thumbnail</title><desc id="desc">A minimal thumbnail for a tutorial on using Spark SQL to query distributed DataFrames in PySpark.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="38" font-weight="600" fill="#59636e">Query DataFrames with SQL syntax</text><text x="90" y="340" font-size="140" font-weight="700" fill="#1b1f24">Spark</text><text x="90" y="460" font-size="140" font-weight="700" fill="#0067c0">SQL</text><rect x="100" y="480" width="240" height="12" rx="6" fill="#0067c0" /></g><g transform="translate(720 150)"><rect x="0" y="0" width="360" height="320" rx="16" fill="#f7f9fb" stroke="#d0d5db" stroke-width="2" /><text x="20" y="40" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="20" fill="#0067c0" font-weight="600">SELECT</text><text x="20" y="80" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#59636e">  customer,</text><text x="20" y="110" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#59636e">  SUM(amount)</text><text x="20" y="150" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="20" fill="#0067c0" font-weight="600">FROM</text><text x="20" y="180" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#59636e">  sales</text><text x="20" y="220" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="20" fill="#0067c0" font-weight="600">GROUP BY</text><text x="20" y="250" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#59636e">  customer</text><text x="20" y="290" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="20" fill="#0067c0" font-weight="600">ORDER BY</text><text x="20" y="310" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#59636e">  customer</text></g></svg>
