<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Precision and recall versus classification threshold</title><desc id="desc">Line chart showing precision and recall on the 154-row diabetes test set as the classification threshold rises from 0.3 to 0.7: recall falls from 0.796 to 0.370 while precision rises from 0.589 to 0.714, the two lines crossing between 0.4 and 0.5, right around the default 0.5 threshold where precision is 0.587 and recall is 0.500.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="60" y="50" font-size="26" font-weight="600" fill="#0067c0">PRECISION VS. RECALL BY THRESHOLD</text><text x="60" y="76" font-size="18" fill="#59636e">Held-out diabetes test set, n = 154</text><line x1="140" y1="90" x2="140" y2="460" stroke="#c7ccd2" stroke-width="3" /><line x1="140" y1="460" x2="1140" y2="460" stroke="#c7ccd2" stroke-width="3" /><line x1="140" y1="182.5" x2="1140" y2="182.5" stroke="#e3e6ea" stroke-width="2" /><line x1="140" y1="275" x2="1140" y2="275" stroke="#e3e6ea" stroke-width="2" /><line x1="140" y1="367.5" x2="1140" y2="367.5" stroke="#e3e6ea" stroke-width="2" /><text x="128" y="95" font-size="17" fill="#59636e" text-anchor="end">1.00</text><text x="128" y="187.5" font-size="17" fill="#59636e" text-anchor="end">0.75</text><text x="128" y="280" font-size="17" fill="#59636e" text-anchor="end">0.50</text><text x="128" y="372.5" font-size="17" fill="#59636e" text-anchor="end">0.25</text><text x="128" y="465" font-size="17" fill="#59636e" text-anchor="end">0.00</text><text x="140" y="486" font-size="18" fill="#59636e" text-anchor="middle">0.3</text><text x="390" y="486" font-size="18" fill="#59636e" text-anchor="middle">0.4</text><text x="640" y="486" font-size="18" fill="#59636e" text-anchor="middle">0.5</text><text x="890" y="486" font-size="18" fill="#59636e" text-anchor="middle">0.6</text><text x="1140" y="486" font-size="18" fill="#59636e" text-anchor="middle">0.7</text><text x="640" y="518" font-size="19" fill="#1b1f24" text-anchor="middle">Classification threshold</text><text x="30" y="275" font-size="19" fill="#1b1f24" text-anchor="middle" transform="rotate(-90 30 275)">Precision / recall</text><line x1="640" y1="90" x2="640" y2="460" stroke="#0067c0" stroke-width="2" stroke-dasharray="6 6" opacity="0.55" /><text x="648" y="104" font-size="16" fill="#0067c0">default (0.5)</text><path d="M140,242.1 L390,238.0 L640,242.8 L890,222.8 L1140,195.8" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M140,165.5 L390,233.9 L640,275.0 L890,288.7 L1140,323.1" fill="none" stroke="#59636e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="17"><circle cx="140" cy="242.1" r="7" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="140" y="224" fill="#0067c0" text-anchor="middle">0.589</text><circle cx="390" cy="238.0" r="7" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="390" y="220" fill="#0067c0" text-anchor="middle">0.600</text><circle cx="640" cy="242.8" r="7" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="640" y="224.7" fill="#0067c0" text-anchor="middle">0.587</text><circle cx="890" cy="222.8" r="7" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="890" y="204.7" fill="#0067c0" text-anchor="middle">0.641</text><circle cx="1140" cy="195.8" r="7" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="1102" y="192" fill="#0067c0" text-anchor="middle">0.714</text><circle cx="140" cy="165.5" r="7" fill="#fdeede" stroke="#59636e" stroke-width="3" /><text x="140" y="153" fill="#59636e" text-anchor="middle">0.796</text><circle cx="390" cy="233.9" r="7" fill="#fdeede" stroke="#59636e" stroke-width="3" /><text x="390" y="256" fill="#59636e" text-anchor="middle">0.611</text><circle cx="640" cy="275.0" r="7" fill="#fdeede" stroke="#59636e" stroke-width="3" /><text x="640" y="297.5" fill="#59636e" text-anchor="middle">0.500</text><circle cx="890" cy="288.7" r="7" fill="#fdeede" stroke="#59636e" stroke-width="3" /><text x="890" y="311.2" fill="#59636e" text-anchor="middle">0.463</text><circle cx="1140" cy="323.1" r="7" fill="#fdeede" stroke="#59636e" stroke-width="3" /><text x="1102" y="340" fill="#59636e" text-anchor="middle">0.370</text></g><g><rect x="960" y="112" width="16" height="16" rx="3" fill="#0067c0" /><text x="984" y="125" font-size="18" fill="#1b1f24">Precision</text><rect x="960" y="140" width="16" height="16" rx="3" fill="#59636e" /><text x="984" y="153" font-size="18" fill="#1b1f24">Recall</text></g></g></svg>
