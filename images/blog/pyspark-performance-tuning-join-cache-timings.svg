<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Measured PySpark timings: broadcast join vs. default join, and cached vs. uncached repeated actions</title><desc id="desc">Bar chart of real measured PySpark timings on a 1,000,000-row orders DataFrame joined to a 40-row product catalog. Left panel, join strategy: the default sort-merge join took 1.082 seconds versus 0.653 seconds for the same join with a broadcast hint, a 1.66x speedup. Right panel, caching over five reused actions: running count, average, a filtered count, max, and a group-by count five times with no cache took 5.521 seconds total versus 3.92 seconds with the DataFrame cached, a 29 percent reduction, even though the first cached action alone was slower than its uncached equivalent because it had to write the cache.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="300" y="52" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">JOIN STRATEGY</text><text x="300" y="80" font-size="18" fill="#59636e" text-anchor="middle">1,000,000-row join, single collect()</text><text x="900" y="52" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">CACHING OVER FIVE REUSES</text><text x="900" y="80" font-size="18" fill="#59636e" text-anchor="middle">same DataFrame, five actions in a row</text><line x1="90" y1="480" x2="510" y2="480" stroke="#c7ccd2" stroke-width="2" /><line x1="690" y1="480" x2="1110" y2="480" stroke="#c7ccd2" stroke-width="2" /><g><rect x="150" y="180" width="110" height="300" rx="8" fill="#fdeede" stroke="#e0b184" stroke-width="3" /><text x="205" y="164" font-size="24" font-weight="600" fill="#1b1f24" text-anchor="middle">1.082s</text><text x="205" y="508" font-size="19" fill="#59636e" text-anchor="middle">default</text><text x="205" y="532" font-size="19" fill="#59636e" text-anchor="middle">(sort-merge)</text></g><g><rect x="340" y="299" width="110" height="181" rx="8" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="395" y="283" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">0.653s</text><text x="395" y="508" font-size="19" fill="#59636e" text-anchor="middle">broadcast()</text><text x="395" y="532" font-size="19" fill="#0067c0" text-anchor="middle">1.66x faster</text></g><g><rect x="740" y="180" width="110" height="300" rx="8" fill="#fdeede" stroke="#e0b184" stroke-width="3" /><text x="795" y="164" font-size="24" font-weight="600" fill="#1b1f24" text-anchor="middle">5.521s</text><text x="795" y="508" font-size="19" fill="#59636e" text-anchor="middle">no cache</text><text x="795" y="532" font-size="19" fill="#59636e" text-anchor="middle">(5 actions)</text></g><g><rect x="930" y="267" width="110" height="213" rx="8" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="985" y="251" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">3.92s</text><text x="985" y="508" font-size="19" fill="#59636e" text-anchor="middle">.cache()</text><text x="985" y="532" font-size="19" fill="#0067c0" text-anchor="middle">29% less</text></g></g></svg>
