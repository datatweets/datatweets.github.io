<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The SQLite-pandas bridge: a file, a connection, and a two-way door</title><desc id="desc">Diagram showing a SQLite database file connected through a sqlite3 connection object, with pandas read_sql_query moving data from a SQL table into a DataFrame on one side, and DataFrame.to_sql moving data back from a DataFrame into a SQL table on the other side.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="180" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">SQLITE FILE</text><text x="600" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">CONNECTION</text><text x="1000" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">DATAFRAME</text><g transform="translate(75 110)"><path d="M0 20C0 9 47 0 105 0C163 0 210 9 210 20V190C210 201 163 210 105 210C47 210 0 201 0 190Z" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><path d="M0 20C0 31 47 40 105 40C163 40 210 31 210 20" fill="none" stroke="#0067c0" stroke-width="3" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#1b1f24"><text x="30" y="90">products</text><text x="30" y="130">sales</text></g></g><text x="180" y="345" font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e" text-anchor="middle">hardware_store.db</text><circle cx="600" cy="215" r="60" fill="#ffffff" stroke="#0067c0" stroke-width="5" /><text x="600" y="210" font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0067c0" text-anchor="middle">sqlite3</text><text x="600" y="234" font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0067c0" text-anchor="middle">.Connection</text><g transform="translate(905 130)"><rect x="0" y="0" width="190" height="140" rx="10" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><path d="M0 47H190M0 94H190M63 0V140M126 0V140" stroke="#9dbfdd" stroke-width="3" /></g><path d="M290 170C400 130 480 130 545 170" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBlue2)" /><path d="M660 175C740 140 830 140 900 175" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBlue2)" /><text x="600" y="118" font-size="21" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0067c0" text-anchor="middle">read_sql_query()</text><path d="M900 265C830 300 740 300 660 265" fill="none" stroke="#59636e" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowGrey2)" /><path d="M545 260C480 300 400 300 290 260" fill="none" stroke="#59636e" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowGrey2)" /><text x="600" y="330" font-size="21" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e" text-anchor="middle">to_sql()</text></g><text x="600" y="470" font-size="21" font-family="Jost, sans-serif" fill="#1b1f24" text-anchor="middle">Same connection object, both directions — open it once, hand it to both functions.</text><defs><marker id="arrowBlue2" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0067c0" /></marker><marker id="arrowGrey2" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#59636e" /></marker></defs></svg>