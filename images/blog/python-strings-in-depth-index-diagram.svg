<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Indexing and slicing the string LOOPCITY</title><desc id="desc">The eight-character string LOOPCITY with each character labeled by its positive index counting up from 0 at L to 7 at Y, and its negative index counting down from -8 at L to -1 at Y. Two brackets below show the slices event bracket 2 colon 5 selecting O, P, C, and event bracket negative 3 colon selecting I, T, Y.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="600" y="50" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">STRING INDEXING</text></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace"><g font-size="22" fill="#59636e" text-anchor="middle"><text x="145" y="110">0</text><text x="275" y="110">1</text><text x="405" y="110">2</text><text x="535" y="110">3</text><text x="665" y="110">4</text><text x="795" y="110">5</text><text x="925" y="110">6</text><text x="1055" y="110">7</text></g><g font-size="56" font-weight="600" text-anchor="middle"><rect x="90" y="140" width="110" height="140" rx="14" fill="#ffffff" stroke="#d0d5db" stroke-width="2" /><text x="145" y="232" fill="#1b1f24">L</text><rect x="220" y="140" width="110" height="140" rx="14" fill="#ffffff" stroke="#d0d5db" stroke-width="2" /><text x="275" y="232" fill="#1b1f24">O</text><rect x="350" y="140" width="110" height="140" rx="14" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="405" y="232" fill="#1b1f24">O</text><rect x="480" y="140" width="110" height="140" rx="14" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="535" y="232" fill="#1b1f24">P</text><rect x="610" y="140" width="110" height="140" rx="14" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="665" y="232" fill="#1b1f24">C</text><rect x="740" y="140" width="110" height="140" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="795" y="232" fill="#1b1f24">I</text><rect x="870" y="140" width="110" height="140" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="925" y="232" fill="#1b1f24">T</text><rect x="1000" y="140" width="110" height="140" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="1055" y="232" fill="#1b1f24">Y</text></g><g font-size="22" fill="#59636e" text-anchor="middle"><text x="145" y="310">-8</text><text x="275" y="310">-7</text><text x="405" y="310">-6</text><text x="535" y="310">-5</text><text x="665" y="310">-4</text><text x="795" y="310">-3</text><text x="925" y="310">-2</text><text x="1055" y="310">-1</text></g><path d="M350 280 V345 H720 V280" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M535 345 V368" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><path d="M740 280 V345 H1110 V280" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M925 345 V368" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><g font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle"><text x="535" y="400">event[2:5] &#8594; 'OPC'</text><text x="925" y="400">event[-3:] &#8594; 'ITY'</text></g></g></svg>
