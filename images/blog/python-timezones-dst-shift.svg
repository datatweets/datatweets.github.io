<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">One UTC instant converted to three local times, and how each shifts between January and July</title><desc id="desc">A diagram shows one meeting instant, 14:00 UTC, converted into three local times for Berlin, New York, and Tokyo. Below it, a second row shows the same UTC instant on a July date: Berlin's local time shifts from 15:00 to 16:00 and New York's shifts from 09:00 to 10:00 because of daylight saving time, while Tokyo stays at 23:00 both times because Japan does not observe DST.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="600" y="42" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">14:00 UTC &#8212; ONE INSTANT, THREE LOCAL TIMES</text><circle cx="600" cy="90" r="12" fill="#0067c0" /><text x="600" y="72" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#59636e" text-anchor="middle">standup_utc</text><path d="M600 102L240 168" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" /><path d="M600 102L600 168" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" /><path d="M600 102L960 168" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-linecap="round" /><rect x="130" y="170" width="220" height="72" rx="14" fill="#e3f0fa" stroke="#0067c0" stroke-width="2" /><rect x="490" y="170" width="220" height="72" rx="14" fill="#e6f4e6" stroke="#0067c0" stroke-width="2" /><rect x="850" y="170" width="220" height="72" rx="14" fill="#fdeede" stroke="#0067c0" stroke-width="2" /><text x="240" y="196" font-size="19" fill="#59636e" text-anchor="middle">Berlin</text><text x="600" y="196" font-size="19" fill="#59636e" text-anchor="middle">New York</text><text x="960" y="196" font-size="19" fill="#59636e" text-anchor="middle">Tokyo</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="20" fill="#1b1f24"><text x="240" y="226" text-anchor="middle">15:00 CET</text><text x="600" y="226" text-anchor="middle">09:00 EST</text><text x="960" y="226" text-anchor="middle">23:00 JST</text></g><line x1="80" y1="284" x2="1120" y2="284" stroke="#e3e6ea" stroke-width="2" /><text x="600" y="326" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">SAME 14:00 UTC INSTANT, SIX MONTHS LATER IN JULY</text><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#59636e"><text x="240" y="362" text-anchor="middle">Berlin</text><text x="600" y="362" text-anchor="middle">New York</text><text x="960" y="362" text-anchor="middle">Tokyo</text></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" fill="#1b1f24"><rect x="150" y="378" width="180" height="52" rx="12" fill="#ffffff" stroke="#d0d5db" stroke-width="2" /><text x="240" y="411" text-anchor="middle">Jan: 15:00 CET</text><rect x="510" y="378" width="180" height="52" rx="12" fill="#ffffff" stroke="#d0d5db" stroke-width="2" /><text x="600" y="411" text-anchor="middle">Jan: 09:00 EST</text><rect x="870" y="378" width="180" height="52" rx="12" fill="#ffffff" stroke="#d0d5db" stroke-width="2" /><text x="960" y="411" text-anchor="middle">Jan: 23:00 JST</text></g><path d="M240 434L240 466" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><path d="M230 452L240 466L250 452" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M600 434L600 466" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><path d="M590 452L600 466L610 452" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M960 434L960 466" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" /><path d="M950 452L960 466L970 452" fill="none" stroke="#c7ccd2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15"><text x="270" y="452" fill="#0067c0">+1h (DST)</text><text x="630" y="452" fill="#0067c0">+1h (DST)</text><text x="965" y="452" fill="#59636e">no DST</text></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" fill="#1b1f24"><rect x="150" y="474" width="180" height="52" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="2" /><text x="240" y="507" text-anchor="middle">Jul: 16:00 CEST</text><rect x="510" y="474" width="180" height="52" rx="12" fill="#e6f4e6" stroke="#0067c0" stroke-width="2" /><text x="600" y="507" text-anchor="middle">Jul: 10:00 EDT</text><rect x="870" y="474" width="180" height="52" rx="12" fill="#fdeede" stroke="#d0d5db" stroke-width="2" /><text x="960" y="507" text-anchor="middle">Jul: 23:00 JST</text></g></g></svg>
