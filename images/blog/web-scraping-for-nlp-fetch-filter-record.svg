<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The fetch-filter-record pipeline for building an NLP corpus</title><desc id="desc">Diagram of the fetch-filter-record pipeline for building an NLP corpus: ten Wikipedia pages are fetched with a custom User-Agent header, each page's raw HTML is filtered down to just its lead-section text, and the results are recorded as ten JSON Lines documents in corpus.jsonl, five labeled programming_language and five labeled big_cat.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="90" y="56" font-size="26" font-weight="600" fill="#0067c0">FETCH</text><text x="380" y="56" font-size="26" font-weight="600" fill="#0067c0">FILTER</text><text x="700" y="56" font-size="26" font-weight="600" fill="#0067c0">RECORD</text><rect x="60" y="90" width="230" height="130" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><g font-size="18" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="80" y="122" fill="#1b1f24">requests.get(url,</text><text x="80" y="146" fill="#1b1f24">  headers=HEADERS)</text><text x="80" y="176" fill="#59636e">10 Wikipedia pages</text><text x="80" y="198" fill="#59636e">custom User-Agent</text></g><path d="M290 155H360" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="360" y="80" width="240" height="150" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><g font-size="18" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="380" y="112" fill="#1b1f24">section[data-mw-</text><text x="380" y="134" fill="#1b1f24">  section-id='0']</text><text x="380" y="164" fill="#59636e">nav + infobox</text><text x="380" y="186" fill="#59636e">→ lead text only</text></g><path d="M600 155H670" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><rect x="670" y="70" width="250" height="170" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><g font-size="17" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="690" y="100" fill="#1b1f24">{"text": ...,</text><text x="690" y="122" fill="#1b1f24"> "url": ...,</text><text x="690" y="144" fill="#1b1f24"> "category": ...}</text><rect x="690" y="160" width="90" height="22" rx="6" fill="#e3f0fa" /><text x="700" y="176" fill="#1b1f24" font-size="15">5 docs</text><rect x="690" y="188" width="90" height="22" rx="6" fill="#fdeede" /><text x="700" y="204" fill="#1b1f24" font-size="15">5 docs</text></g><text x="800" y="176" font-size="15" fill="#59636e" font-family="'SFMono-Regular', Consolas, Menlo, monospace">programming_language</text><text x="800" y="204" font-size="15" fill="#59636e" font-family="'SFMono-Regular', Consolas, Menlo, monospace">big_cat</text><path d="M795 240V300" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="670" y="300" width="250" height="90" rx="14" fill="#e6f4e6" stroke="#d0d5db" stroke-width="2" /><text x="690" y="332" font-size="18" fill="#1b1f24" font-family="'SFMono-Regular', Consolas, Menlo, monospace">corpus.jsonl</text><text x="690" y="358" font-size="16" fill="#59636e" font-family="'SFMono-Regular', Consolas, Menlo, monospace">10 documents</text><text x="690" y="378" font-size="16" fill="#59636e" font-family="'SFMono-Regular', Consolas, Menlo, monospace">0 empty, 0 duplicate</text></g></svg>
