<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">How to Order Dependent Tasks with Topological Sort in Python</title>
  <desc id="desc">A DataTweets tutorial thumbnail with the words Dependencies Come First and a directed acyclic graph. Load leads to Clean and Check, and both lead to Report in a valid three-stage task order.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0067c0"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1" fill="#59636e">PYTHON TASK ORDER</text>
    <text x="90" y="275" font-size="72" font-weight="700" fill="#1b1f24">DEPENDENCIES</text>
    <text x="90" y="365" font-size="72" font-weight="700" fill="#1b1f24">COME FIRST</text>
    <rect x="94" y="402" width="350" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="474" font-size="25" font-weight="500" fill="#59636e">DAG &#183; READY STAGES &#183; CYCLE CHECKS</text>
  </g>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="748" y="168" text-anchor="middle" font-size="20" font-weight="600" fill="#59636e">STAGE 1</text>
    <text x="930" y="168" text-anchor="middle" font-size="20" font-weight="600" fill="#59636e">STAGE 2</text>
    <text x="1084" y="168" text-anchor="middle" font-size="20" font-weight="600" fill="#59636e">STAGE 3</text>

    <path d="M 808 338 C 830 338 830 254 850 254" fill="none" stroke="#0067c0" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 808 338 C 830 338 830 422 850 422" fill="none" stroke="#0067c0" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 1010 254 C 1025 254 1025 320 1038 320" fill="none" stroke="#0067c0" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 1010 422 C 1025 422 1025 356 1038 356" fill="none" stroke="#0067c0" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="688" y="299" width="120" height="78" rx="16" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
    <text x="748" y="347" text-anchor="middle" font-size="23" font-weight="700" fill="#1b1f24">LOAD</text>

    <rect x="850" y="215" width="160" height="78" rx="16" fill="#ffffff" stroke="#59636e" stroke-width="3"/>
    <text x="930" y="263" text-anchor="middle" font-size="23" font-weight="700" fill="#1b1f24">CLEAN</text>

    <rect x="850" y="383" width="160" height="78" rx="16" fill="#ffffff" stroke="#59636e" stroke-width="3"/>
    <text x="930" y="431" text-anchor="middle" font-size="23" font-weight="700" fill="#1b1f24">CHECK</text>

    <rect x="1038" y="299" width="102" height="78" rx="16" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
    <text x="1089" y="347" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1f24">REPORT</text>

    <text x="914" y="526" text-anchor="middle" font-size="22" font-weight="500" fill="#59636e">PREREQUISITES &#8594; VALID ORDER</text>
  </g>
</svg>
