<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The pack, seal, hash life cycle of a Python tuple</title><desc id="desc">Diagram showing a tuple's life cycle: the values north, 2026-07-11T06:00, 18.4, and 62 are packed into a tuple, the tuple is sealed so its contents cannot change, and the sealed tuple is hashed to a fixed value that can be used as a dictionary key.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="150" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">PACK</text><text x="483" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">SEAL</text><text x="929" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">HASH</text><rect x="60" y="120" width="180" height="320" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="150" y="158" font-size="22" font-weight="600" fill="#59636e" text-anchor="middle">raw values</text><g font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="80" y="176" width="140" height="34" rx="8" fill="#e3f0fa" /><text x="92" y="200" fill="#1b1f24">'north'</text><rect x="80" y="216" width="140" height="34" rx="8" fill="#e6f4e6" /><text x="92" y="240" fill="#1b1f24">'...06:00'</text><rect x="80" y="256" width="140" height="34" rx="8" fill="#fdeede" /><text x="92" y="280" fill="#1b1f24">18.4</text><rect x="80" y="296" width="140" height="34" rx="8" fill="#e3f0fa" /><text x="92" y="320" fill="#1b1f24">62</text></g><path d="M220 193C300 193 300 280 368 280" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M220 233C300 233 300 280 368 280" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M220 273H368" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M220 313C300 313 300 280 368 280" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="368" y="180" width="230" height="200" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><rect x="463" y="164" width="40" height="32" rx="7" fill="#0067c0" /><path d="M473 164V150A10 10 0 0 1 493 150V164" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><text x="483" y="230" font-size="19" font-weight="600" fill="#59636e" text-anchor="middle">sealed</text><text x="483" y="270" font-size="18" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">('north', ...,</text><text x="483" y="294" font-size="18" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">18.4, 62)</text><g font-size="14" fill="#59636e" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="425" y="340">.append() &#8212; no</text><text x="540" y="340">t[0] = x &#8212; no</text></g><path d="M598 280H656" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M648 268L666 280L648 292Z" fill="#0067c0" /><rect x="666" y="230" width="120" height="100" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="726" y="272" font-size="20" fill="#0067c0" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">hash()</text><text x="726" y="298" font-size="15" fill="#59636e" text-anchor="middle">fixed value</text><path d="M786 280H834" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M826 268L844 280L826 292Z" fill="#0067c0" /><rect x="844" y="230" width="200" height="100" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="944" y="272" font-size="21" fill="#0067c0" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">dict key</text><text x="944" y="298" font-size="15" fill="#59636e" text-anchor="middle">safe &amp; hashable</text></g></svg>
