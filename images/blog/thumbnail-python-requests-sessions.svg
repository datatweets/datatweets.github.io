<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Python requests Session thumbnail</title><desc id="desc">A minimal logo-style thumbnail for an article on the Python requests library's Session object, showing one persistent connection carrying several requests to a server instead of a new connection for each one.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="40" font-weight="600" fill="#59636e">One connection, many requests</text><text x="90" y="392" font-size="150" font-weight="700" fill="#1b1f24">Session</text><rect x="100" y="424" width="420" height="12" rx="6" fill="#0067c0" /><text x="98" y="506" font-size="35" font-weight="500" fill="#59636e">reuse &#183; persist &#183; retry</text></g><g transform="translate(790 250)" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="0" y="52" width="86" height="72" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="43" y="94" font-size="22" fill="#0067c0" text-anchor="middle">you</text><path d="M86 88H300" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><circle cx="140" cy="88" r="12" fill="#0067c0" /><circle cx="193" cy="88" r="12" fill="#7fa8d1" /><circle cx="246" cy="88" r="12" fill="#9dbfdd" /><rect x="300" y="52" width="90" height="72" rx="14" fill="#ffffff" stroke="#d0d5db" stroke-width="4" /><text x="345" y="94" font-size="20" fill="#59636e" text-anchor="middle">API</text><rect x="112" y="30" width="60" height="30" rx="8" fill="#e3f0fa" stroke="#0067c0" stroke-width="2" /><text x="142" y="51" font-size="16" fill="#0067c0" text-anchor="middle">key</text></g></svg>
