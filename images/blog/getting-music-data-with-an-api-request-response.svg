<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The authenticated request-response round trip for a Last.fm API call</title><desc id="desc">Diagram of an authenticated API round trip: Python code sends a GET request with method, api_key, and artist parameters to Last.fm, the server returns a 200 status code with a nested JSON body containing an artist object with stats, tags, and bio fields, and Python code reads listeners 48213 and tags dream pop and shoegaze out of that nested structure.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="130" y="88" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">YOUR CODE</text><text x="600" y="100" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">1. AUTHENTICATED REQUEST</text><text x="1070" y="88" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">LAST.FM</text><text x="600" y="300" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">2. NESTED JSON RESPONSE</text><rect x="40" y="110" width="180" height="360" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="130" y="270" font-size="22" font-weight="600" fill="#1b1f24" text-anchor="middle">your code</text><text x="130" y="298" font-size="14" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e" text-anchor="middle">mock_get(url,</text><text x="130" y="318" font-size="14" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e" text-anchor="middle">params=params)</text><rect x="300" y="120" width="600" height="90" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="324" y="155" font-size="18" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#1b1f24">GET /2.0/?method=artist.getinfo</text><text x="324" y="184" font-size="16" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0067c0">&amp;api_key=&#8226;&#8226;&#8226;&#8226;&amp;artist=Marigold+Static</text><rect x="980" y="110" width="180" height="360" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="1070" y="270" font-size="19" font-weight="600" fill="#1b1f24" text-anchor="middle">ws.audioscrobbler</text><text x="1070" y="292" font-size="19" font-weight="600" fill="#1b1f24" text-anchor="middle">.com</text><text x="1070" y="318" font-size="15" fill="#59636e" text-anchor="middle">API server</text><rect x="270" y="320" width="660" height="170" rx="14" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><rect x="294" y="336" width="76" height="36" rx="9" fill="#e3f0fa" stroke="#0067c0" stroke-width="2" /><text x="332" y="360" font-size="18" font-weight="700" fill="#0067c0" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">200</text><g font-size="16" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="384" y="360" fill="#1b1f24">"artist"<tspan fill="#59636e">: {</tspan></text><text x="310" y="388" fill="#1b1f24">"stats"<tspan fill="#59636e">: { "listeners"</tspan><tspan fill="#59636e">:</tspan><tspan fill="#0067c0">"48213"</tspan><tspan fill="#59636e"> },</tspan></text><text x="310" y="416" fill="#1b1f24">"tags"<tspan fill="#59636e">: { "tag"</tspan><tspan fill="#59636e">: [</tspan><tspan fill="#0067c0">"dream pop"</tspan><tspan fill="#59636e">,</tspan><tspan fill="#0067c0">"shoegaze"</tspan><tspan fill="#59636e">] },</tspan></text><text x="310" y="444" fill="#1b1f24">"bio"<tspan fill="#59636e">: { &#8230; }</tspan></text><text x="294" y="472" fill="#59636e">}</text></g><path d="M220 165H292" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M278 151L294 165L278 179" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M908 165H972" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M958 151L974 165L958 179" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M972 405H908" fill="none" stroke="#59636e" stroke-width="5" stroke-linecap="round" /><path d="M922 391L906 405L922 419" fill="none" stroke="#59636e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M262 405H228" fill="none" stroke="#59636e" stroke-width="5" stroke-linecap="round" /><path d="M242 391L226 405L242 419" fill="none" stroke="#59636e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>
