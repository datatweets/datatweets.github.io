<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Shape Time Series Data for LSTM Forecasting in PyTorch</title>
  <desc id="desc">A time-series window of 12 ordered steps and three features points to one next-temperature target, illustrating the samples, timesteps, and features expected by a PyTorch LSTM.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1.2" fill="#59636e">TIME SERIES SHAPES</text>
    <text x="90" y="274" font-size="72" font-weight="700" fill="#1b1f24">ROWS TO</text>
    <text x="90" y="357" font-size="72" font-weight="700" fill="#1b1f24">LSTM WINDOWS</text>
    <rect x="96" y="396" width="350" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="478" font-size="29" font-weight="500" fill="#59636e">samples &#183; timesteps &#183; features</text>
  </g>

  <g transform="translate(700 132) scale(0.86)" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="10" y="22" font-size="22" font-weight="600" letter-spacing="0.8" fill="#59636e">ONE TRAINING SAMPLE</text>

    <rect x="4" y="58" width="308" height="306" rx="22" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
    <text x="28" y="91" font-size="18" font-weight="600" fill="#59636e">12 ORDERED STEPS</text>

    <g transform="translate(28 116)">
      <text x="28" y="-8" text-anchor="middle" font-size="17" font-weight="600" fill="#59636e">t&#8722;11</text>
      <rect x="0" y="8" width="56" height="48" rx="8" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
      <rect x="0" y="66" width="56" height="48" rx="8" fill="#ffffff" stroke="#8d98a5" stroke-width="2"/>
      <rect x="0" y="124" width="56" height="48" rx="8" fill="#f2f4f6" stroke="#8d98a5" stroke-width="2"/>

      <rect x="87.5" y="86.5" width="7" height="7" rx="3.5" fill="#8d98a5"/>
      <rect x="101.5" y="86.5" width="7" height="7" rx="3.5" fill="#8d98a5"/>
      <rect x="115.5" y="86.5" width="7" height="7" rx="3.5" fill="#8d98a5"/>

      <text x="162" y="-8" text-anchor="middle" font-size="17" font-weight="600" fill="#59636e">t&#8722;1</text>
      <rect x="134" y="8" width="56" height="48" rx="8" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
      <rect x="134" y="66" width="56" height="48" rx="8" fill="#ffffff" stroke="#8d98a5" stroke-width="2"/>
      <rect x="134" y="124" width="56" height="48" rx="8" fill="#f2f4f6" stroke="#8d98a5" stroke-width="2"/>

      <g font-size="15" font-weight="600" fill="#59636e">
        <text x="206" y="39">ROOM</text>
        <text x="206" y="97">OUTSIDE</text>
        <text x="206" y="155">DOOR</text>
      </g>
    </g>

    <text x="158" y="330" text-anchor="middle" font-size="20" font-weight="600" fill="#1b1f24">12 steps &#215; 3 features</text>

    <line x1="326" y1="211" x2="367" y2="211" stroke="#0067c0" stroke-width="4" stroke-linecap="round"/>
    <line x1="358" y1="201" x2="370" y2="211" stroke="#0067c0" stroke-width="4" stroke-linecap="round"/>
    <line x1="370" y1="211" x2="358" y2="221" stroke="#0067c0" stroke-width="4" stroke-linecap="round"/>

    <rect x="386" y="154" width="118" height="116" rx="20" fill="#e3f0fa" stroke="#0067c0" stroke-width="3"/>
    <text x="445" y="195" text-anchor="middle" font-size="17" font-weight="600" fill="#59636e">NEXT</text>
    <text x="445" y="226" text-anchor="middle" font-size="21" font-weight="700" fill="#1b1f24">TEMP</text>
    <text x="445" y="253" text-anchor="middle" font-size="17" font-weight="600" fill="#0067c0">1 TARGET</text>
  </g>
</svg>
