<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Save Python batch output from a Docker container</title>
  <desc id="desc">A Docker batch job reads a host input directory through a read-only bind mount and writes durable files through a separate writable bind mount to a host output directory.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0067c0"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="145" font-size="32" font-weight="600" fill="#59636e">DOCKER BATCH OUTPUT</text>
    <text x="90" y="274" font-size="82" font-weight="700" fill="#1b1f24">FILES THAT</text>
    <text x="90" y="368" font-size="82" font-weight="700" fill="#1b1f24">SURVIVE</text>
    <rect x="94" y="410" width="330" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="475" font-size="25" font-weight="500" fill="#59636e">BIND MOUNTS &#183; ATOMIC WRITES</text>

    <g aria-hidden="true">
      <text x="674" y="143" font-size="23" font-weight="600" fill="#59636e">HOST</text>
      <text x="936" y="143" font-size="23" font-weight="600" fill="#59636e">CONTAINER</text>

      <rect x="666" y="168" width="172" height="138" rx="18" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <path d="M 694 213 h 40 l 12 14 h 64 v 51 h -116 z" fill="#e3f0fa" stroke="#0067c0" stroke-width="2.5"/>
      <text x="752" y="260" text-anchor="middle" font-size="24" font-weight="600" fill="#1b1f24">input/</text>

      <rect x="666" y="370" width="172" height="138" rx="18" fill="#f7f8fa" stroke="#c7ccd2" stroke-width="2"/>
      <path d="M 694 415 h 40 l 12 14 h 64 v 51 h -116 z" fill="#e3f0fa" stroke="#0067c0" stroke-width="2.5"/>
      <text x="752" y="462" text-anchor="middle" font-size="24" font-weight="600" fill="#1b1f24">output/</text>

      <rect x="920" y="168" width="190" height="340" rx="24" fill="#ffffff" stroke="#59636e" stroke-width="3"/>
      <rect x="946" y="208" width="138" height="76" rx="13" fill="#f7f8fa" stroke="#0067c0" stroke-width="2.5"/>
      <text x="1015" y="255" text-anchor="middle" font-size="24" font-weight="600" fill="#1b1f24">/input</text>
      <rect x="946" y="392" width="138" height="76" rx="13" fill="#f7f8fa" stroke="#0067c0" stroke-width="2.5"/>
      <text x="1015" y="439" text-anchor="middle" font-size="24" font-weight="600" fill="#1b1f24">/output</text>
      <rect x="956" y="311" width="118" height="46" rx="23" fill="#1b1f24"/>
      <text x="1015" y="341" text-anchor="middle" font-size="19" font-weight="600" fill="#ffffff">PYTHON</text>

      <line x1="844" y1="246" x2="936" y2="246" stroke="#0067c0" stroke-width="4" marker-end="url(#arrow-blue)"/>
      <text x="890" y="221" text-anchor="middle" font-size="17" font-weight="600" fill="#59636e">READ ONLY</text>
      <line x1="936" y1="430" x2="844" y2="430" stroke="#0067c0" stroke-width="4" marker-end="url(#arrow-blue)"/>
      <text x="890" y="405" text-anchor="middle" font-size="17" font-weight="600" fill="#59636e">WRITABLE</text>

      <text x="1015" y="548" text-anchor="middle" font-size="18" font-weight="500" fill="#59636e">DISPOSABLE FILESYSTEM</text>
    </g>
  </g>
</svg>
