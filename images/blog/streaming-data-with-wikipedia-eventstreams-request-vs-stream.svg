<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Request/response versus a streaming connection</title><desc id="desc">Diagram contrasting a request/response call, where your code sends one request and the server sends back one response before the connection closes, with a streaming connection, where your code opens one connection and the server keeps pushing a sequence of events e1, e2, e3, and onward for as long as the connection stays open.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="600" y="42" font-size="27" font-weight="600" fill="#0067c0" text-anchor="middle">REQUEST / RESPONSE</text><rect x="60" y="70" width="170" height="120" rx="14" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="145" y="136" font-size="21" font-weight="600" fill="#1b1f24" text-anchor="middle">your code</text><rect x="970" y="70" width="170" height="120" rx="14" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="1055" y="136" font-size="21" font-weight="600" fill="#1b1f24" text-anchor="middle">server</text><path d="M232 108H962" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M946 94L964 108L946 122" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="98" font-size="17" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0067c0" text-anchor="middle">GET /forecast</text><path d="M962 158H232" fill="none" stroke="#59636e" stroke-width="5" stroke-linecap="round" /><path d="M248 144L230 158L248 172" fill="none" stroke="#59636e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="180" font-size="17" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e" text-anchor="middle">200 response, once</text><text x="600" y="222" font-size="19" fill="#59636e" text-anchor="middle">one request in, one response back, then the connection closes</text><line x1="60" y1="258" x2="1140" y2="258" stroke="#e3e6ea" stroke-width="2" /><text x="600" y="302" font-size="27" font-weight="600" fill="#0067c0" text-anchor="middle">STREAM</text><rect x="60" y="330" width="180" height="140" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="150" y="392" font-size="19" font-weight="600" fill="#1b1f24" text-anchor="middle">wikimedia</text><text x="150" y="416" font-size="19" font-weight="600" fill="#1b1f24" text-anchor="middle">server</text><rect x="960" y="330" width="180" height="140" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="1050" y="410" font-size="20" font-weight="600" fill="#1b1f24" text-anchor="middle">your script</text><path d="M244 400H956" fill="none" stroke="#c7ccd2" stroke-width="3" stroke-dasharray="4 10" stroke-linecap="round" /><path d="M940 386L958 400L940 414" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" font-weight="600" text-anchor="middle"><rect x="292" y="378" width="56" height="30" rx="8" fill="#e3f0fa" /><text x="320" y="399" fill="#0067c0">e1</text><rect x="428" y="378" width="56" height="30" rx="8" fill="#e6f4e6" /><text x="456" y="399" fill="#0067c0">e2</text><rect x="564" y="378" width="56" height="30" rx="8" fill="#fdeede" /><text x="592" y="399" fill="#0067c0">e3</text><rect x="700" y="378" width="56" height="30" rx="8" fill="#e3f0fa" /><text x="728" y="399" fill="#0067c0">e4</text><text x="850" y="399" font-weight="700" fill="#59636e">...</text></g><text x="600" y="500" font-size="19" fill="#59636e" text-anchor="middle">one connection stays open; events arrive continuously, whenever they happen</text></g></svg>
