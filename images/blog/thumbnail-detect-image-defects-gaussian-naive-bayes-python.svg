<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Detect Image Defects with Gaussian Naive Bayes in Python</title>
  <desc id="desc">A DataTweets tutorial thumbnail. On the left, the words Pixels to Masks summarize the lesson. On the right, a blue-gray pixel grid with a warm-colored region passes through Gaussian Naive Bayes and becomes a binary defect mask.</desc>
