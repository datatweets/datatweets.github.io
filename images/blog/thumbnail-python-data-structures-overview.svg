<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Python data structures thumbnail</title><desc id="desc">A minimal logo-style thumbnail for an article comparing Python's four core built-in data structures: lists, tuples, sets, and dictionaries.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="40" font-weight="600" fill="#59636e">Which one do you actually need?</text><text x="90" y="330" font-size="140" font-weight="700" fill="#1b1f24">Data</text><text x="90" y="470" font-size="140" font-weight="700" fill="#1b1f24">Structures</text><rect x="100" y="500" width="420" height="12" rx="6" fill="#0067c0" /><text x="98" y="560" font-size="35" font-weight="500" fill="#59636e">list · tuple · set · dict</text></g><g transform="translate(790 150)" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="26"><rect x="0" y="0" width="60" height="52" rx="8" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><rect x="66" y="0" width="60" height="52" rx="8" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><rect x="132" y="0" width="60" height="52" rx="8" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="96" y="90" fill="#59636e" text-anchor="middle" font-size="22">list [ ]</text><rect x="220" y="0" width="60" height="52" rx="8" fill="#fdeede" stroke="#59636e" stroke-width="3" /><rect x="286" y="0" width="60" height="52" rx="8" fill="#fdeede" stroke="#59636e" stroke-width="3" /><rect x="352" y="0" width="60" height="52" rx="8" fill="#fdeede" stroke="#59636e" stroke-width="3" /><text x="316" y="90" fill="#59636e" text-anchor="middle" font-size="22">tuple ( )</text><circle cx="60" cy="200" r="46" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><circle cx="120" cy="200