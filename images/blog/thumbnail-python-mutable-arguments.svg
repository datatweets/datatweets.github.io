xt><rect x="50" y="206" width="200" height="34" rx="8" fill="#e3f0fa" /><text x="64" y="230" fill="#1b1f24">'shield'</text><rect x="50" y="248" width="200" height="34" rx="8" fill="#fdeede" stroke="#0067c0" stroke-width="2" stroke-dasharray="6 5" /><text x="64" y="272" fill="#1b1f24">'cleric'</text></g><circle cx="272" cy="266" r="26" fill="#0067c0" /><text x="272" y="275" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">+</text></g></svg>
