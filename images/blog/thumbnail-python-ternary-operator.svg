<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Python ternary operator thumbnail</title><desc id="desc">A minimal thumbnail for a beginner guide to Python conditional expressions (ternary operator).</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="38" font-weight="600" fill="#59636e">Cleaner conditionals in one line</text><text x="90" y="370" font-size="130" font-weight="700" fill="#1b1f24">ternary</text><rect x="100" y="394" width="380" height="12" rx="6" fill="#0067c0" /><text x="98" y="476" font-size="35" font-weight="500" fill="#59636e">if &#183; else &#183; expressions</text></g><g transform="translate(750 130)"><rect x="0" y="0" width="320" height="56" rx="12" fill="#f0f4f8" stroke="#0067c0" stroke-width="3" /><text x="160" y="37" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="20" fill="#0067c0" text-anchor="middle">x if cond else y</text><path d="M160 56 L100 120" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" /><path d="M160 56 L220 120" fill="none" stroke="#d0d5db" stroke-width="4" stroke-linecap="round" /><text x="100" y="116" font-family="Jost, sans-serif" font-size="18" font-weight="600" fill="#0067c0" text-anchor="middle">True</text><text x="220" y="116" font-family="Jost, sans-serif" font-size="18" font-weight="600" fill="#59636e" text-anchor="middle">False</text><rect x="40" y="130" width="120" height="44" rx="10" fill="#0067c0" /><text x="100" y="158" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="22" fill="#ffffff" text-anchor="middle">x</text><rect x="160" y="130" width="120" height="44" rx="10" fill="#d0d5db" /><text x="220" y="158" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="22" fill="#59636e" text-anchor="middle">y</text></g></svg>
