    <text x="90" y="276" font-size="86" font-weight="700" fill="#1b1f24">SEE THE</text>
    <text x="90" y="378" font-size="86" font-weight="700" fill="#1b1f24">WHOLE SHIFT</text>
    <rect x="96" y="415" width="372" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="494" font-size="27" font-weight="500" fill="#59636e">ECDF &#183; KS DISTANCE &#183; PERCENTILES</text>

