<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Compare distributions with ECDF and KS test in Python</title>
  <desc id="desc">DataTweets tutorial thumbnail. Two step-shaped empirical cumulative distribution curves cross, and a vertical marker labeled maximum D shows their widest gap.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

