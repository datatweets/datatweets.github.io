<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">The four arguments that build a pandas pivot table</title><desc id="desc">Four labeled inputs -- index set to office, columns set to department, values set to score, and aggfunc set to mean -- feed into pivot_table(), which produces a result grid of offices by department with the tutorial's real verified average scores in every cell.</desc><rect width="1200" height="600" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="200" y="40" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">ARGUMENTS</text><text x="440" y="40" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">PIVOT_TABLE()</text><text x="890" y="40" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">RESULT</text>

