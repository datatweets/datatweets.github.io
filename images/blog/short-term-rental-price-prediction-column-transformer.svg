<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">ColumnTransformer combining numeric and categorical columns</title><desc id="desc">A listings table is split by column type: five numeric columns go through a pipeline of median imputation and scaling, while the room_type column goes through one-hot encoding, and ColumnTransformer combines both outputs into one nine-column matrix that feeds a LinearRegression.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="150" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">COLUMNS</text><text x="640" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">TRANSFORM</text><text x="1044" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">COMBINE</text><rect x="60" y="120" width="200" height="320" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="160" y="158" font-size="22" font-weight="600" fill="#59636e" text-anchor="middle">listings</text><g font-size="17" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="80" y="176" width="160" height="34" rx="8" fill="#e3f0fa" /><text x="92" y="199" fill="#1b1f24">minimum_nights</text><rect x="80" y="216" width="160" height="34" rx="8" fill="#e3f0fa" /><text x="92" y="239" fill="#1b1f24">number_of_reviews</text><rect x="80" y="256" width="160" height="34" rx="8" fill="#e3f0fa" /><text x="92" y="279" fill="#1b1f24">reviews_per_month</text><rect x="80" y="296" width="160" height="34" rx="8" fill="#e3f0fa" /><text x="92" y="319" fill="#1b1f24">availability_365</text><rect x="80" y="336" width="160" height="34" rx="8" fill="#e3f0fa" /><text x="92" y="359" fill="#1b1f24">number_of_reviews_ltm</text><rect x="80" y="376" width="160" height="34" rx="8" fill="#fdeede" /><text x="92" y="399" fill="#1b1f24">room_type</text></g><path d="M262 280C310 280 310 190 368 190" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M262 280C310 280 310 380 368 380" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><g font-size="18" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="368" y="132" width="260" height="116" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="388" y="164" fill="#0067c0" font-weight="600" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">numeric pipeline</text><text x="388" y="196" fill="#59636e" font-size="16">SimpleImputer(median)</text><text x="388" y="222" fill="#59636e" font-size="16">StandardScaler()</text><rect x="368" y="322" width="260" height="116" rx="14" fill="#ffffff" stroke="#59636e" stroke-width="3" /><text x="388" y="354" fill="#59636e" font-weight="600" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">room_type</text><text x="388" y="386" fill="#59636e" font-size="16">OneHotEncoder(</text><text x="388" y="412" fill="#59636e" font-size="16">  handle_unknown="ignore")</text></g><path d="M628 190C700 190 700 280 772 280" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M628 380C700 380 700 280 772 280" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="934" y="150" width="220" height="230" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="1044" y="186" font-size="22" font-weight="600" fill="#59636e" text-anchor="middle" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">9 columns</text><g font-size="16" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="952" y="204" width="184" height="30" rx="7" fill="#e3f0fa" /><text x="962" y="225" fill="#1b1f24">5 numeric</text><rect x="952" y="242" width="184" height="30" rx="7" fill="#fdeede" /><text x="962" y="263" fill="#1b1f24">4 one-hot</text><rect x="952" y="280" width="184" height="30" rx="7" fill="#f7f8fa" /><text x="962" y="301" fill="#59636e">= 9 total</text><rect x="952" y="318" width="184" height="30" rx="7" fill="#f7f8fa" /><text x="962" y="339" fill="#59636e">R&#178;=0.397 MAE=46.17</text></g><path d="M780 280H900" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M890 270L902 280L890 290" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M1044 380V440" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M1034 430L1044 442L1054 430" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="934" y="446" width="220" height="60" rx="30" fill="#0067c0" /><text x="1044" y="484" font-size="20" fill="#ffffff" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">LinearRegression</text></g></svg>
