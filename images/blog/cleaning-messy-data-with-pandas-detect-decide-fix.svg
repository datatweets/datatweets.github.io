<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The detect, decide, fix cycle for cleaning data with pandas</title><desc id="desc">Diagram of the detect, decide, fix cycle for data cleaning: detect problems with methods like info, isna, value_counts, and duplicated; decide whether to drop, fill, or leave each column based on what the data means; fix by applying the decision, then loop back to detect again to confirm it worked.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="188" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">DETECT</text><text x="600" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">DECIDE</text><text x="1012" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">FIX</text><rect x="66" y="110" width="244" height="220" rx="16" fill="#ffffff" stroke="#7fb0d8" stroke-width="3" /><text x="188" y="150" font-size="23" font-weight="600" fill="#1b1f24" text-anchor="middle">What's wrong?</text><g font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e"><text x="90" y="192">.info()</text><text x="90" y="224">.isna().sum()</text><text x="90" y="256">.value_counts()</text><text x="90" y="288">.duplicated()</text></g><path d="M316 220H452" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M434 200L458 220L434 240" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="478" y="110" width="244" height="220" rx="16" fill="#ffffff" stroke="#e0b184" stroke-width="3" /><text x="600" y="150" font-size="23" font-weight="600" fill="#1b1f24" text-anchor="middle">Drop, fill, or leave?</text><g font-size="19" fill="#59636e"><text x="502" y="192">Depends on what the</text><text x="502" y="220">column means and what</text><text x="502" y="248">question you're asking</text><text x="502" y="284" font-weight="600" fill="#1b1f24">— one column at a time</text></g><path d="M728 220H864" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M846 200L870 220L846 240" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="890" y="110" width="244" height="220" rx="16" fill="#ffffff" stroke="#8fbc8f" stroke-width="3" /><text x="1012" y="150" font-size="23" font-weight="600" fill="#1b1f24" text-anchor="middle">Apply it</text><g font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e"><text x="914" y="192">.fillna(...)</text><text x="914" y="224">.dropna(subset=...)</text><text x="914" y="256">.drop_duplicates()</text><text x="914" y="288">.str.strip(...)</text></g><path d="M1012 330C1012 460 188 460 188 330" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M168 350L188 328L210 350" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="486" font-size="21" fill="#59636e" text-anchor="middle">re-run detect to confirm the fix worked</text></g></svg>