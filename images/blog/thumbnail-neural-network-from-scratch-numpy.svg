<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Build a Neural Network from Scratch with NumPy</title>
  <desc id="desc">A DATATWEETS tutorial thumbnail showing the learning loop: a forward pass produces a score, loss measures error, and a backward pass provides gradients for a weight update.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>
  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="36" font-weight="600" fill="#59636e">NUMPY LEARNING LOOP</text>
    <text x="90" y="285" font-size="82" font-weight="700" fill="#1b1f24">FORWARD</text>
    <text x="90" y="385" font-size="82" font-weight="700" fill="#1b1f24">TO LEARN</text>
    <rect x="94" y="418" width="390" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="492" font-size="30" font-weight="500" fill="#59636e">ARRAYS · LOSS · GRADIENTS</text>
  </g>
  <g transform="translate(685 128)" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="0" y="0" width="400" height="84" rx="18" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
    <text x="24" y="34" font-size="20" font-weight="600" fill="#59636e">FORWARD PASS</text>
    <text x="24" y="64" font-size="25" font-weight="700" fill="#1b1f24">X → hidden → score</text>
    <text x="188" y="121" font-size="34" font-weight="700" fill="#0067c0">↓</text>
    <rect x="45" y="126" width="310" height="84" rx="18" fill="#ffffff" stroke="#c7ccd2" stroke-width="2"/>
    <text x="69" y="160" font-size="20" font-weight="600" fill="#59636e">COMPARE</text>
    <text x="69" y="190" font-size="25" font-weight="700" fill="#1b1f24">score + label → loss</text>
    <text x="188" y="247" font-size="34" font-weight="700" fill="#59636e">↓</text>
    <rect x="0" y="252" width="400" height="84" rx="18" fill="#fdeede" stroke="#0067c0" stroke-width="2"/>
    <text x="24" y="286" font-size="20" font-weight="600" fill="#59636e">BACKWARD PASS</text>
    <text x="24" y="316" font-size="25" font-weight="700" fill="#1b1f24">loss → gradients</text>
    <rect x="372" y="107" width="52" height="145" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="2"/>
    <text x="389" y="137" font-size="20" font-weight="700" fill="#0067c0">↑</text>
    <text x="389" y="166" font-size="20" font-weight="700" fill="#0067c0">↑</text>
    <text x="389" y="195" font-size="20" font-weight="700" fill="#0067c0">↑</text>
    <text x="389" y="224" font-size="20" font-weight="700" fill="#0067c0">↑</text>
    <text x="445" y="186" font-size="19" font-weight="600" fill="#0067c0" transform="rotate(90 445 186)">UPDATE WEIGHTS</text>
  </g>
</svg>
