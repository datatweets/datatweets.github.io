<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Choose a Time Series Training Window with Python</title>
  <desc id="desc">A DataTweets tutorial thumbnail contrasting a fixed training window that keeps recent observations with an expanding window that keeps both older and recent observations before the same forecast.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" fill="#59636e">TRAINING WINDOW CHOICE</text>
    <text x="90" y="286" font-size="88" font-weight="700" fill="#1b1f24">RECENCY</text>
    <text x="90" y="388" font-size="78" font-weight="700" fill="#1b1f24">OR HISTORY?</text>
    <rect x="98" y="424" width="420" height="12" rx="6" fill="#0067c0"/>
    <text x="98" y="496" font-size="29" font-weight="500" fill="#59636e">fixed &#183; expanding &#183; backtest</text>
  </g>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <line x1="922" y1="150" x2="922" y2="510" stroke="#d87945" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="937" y="174" font-size="20" font-weight="600" fill="#a8522e">CHANGE</text>

    <text x="730" y="232" font-size="24" font-weight="600" fill="#59636e">FIXED</text>
    <line x1="806" y1="275" x2="868" y2="275" stroke="#c7ccd2" stroke-width="3" stroke-dasharray="6 7"/>
    <circle cx="818" cy="275" r="7" fill="#c7ccd2"/>
    <circle cx="844" cy="275" r="7" fill="#c7ccd2"/>
    <rect x="926" y="258" width="32" height="34" rx="5" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
    <rect x="966" y="258" width="32" height="34" rx="5" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
    <rect x="1006" y="258" width="32" height="34" rx="5" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
    <line x1="1038" y1="275" x2="1063" y2="275" stroke="#0067c0" stroke-width="3"/>
    <path d="M1063 267 L1077 275 L1063 283 Z" fill="#0067c0"/>
    <circle cx="1096" cy="275" r="19" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>

    <text x="730" y="383" font-size="24" font-weight="600" fill="#59636e">EXPANDING</text>
    <rect x="806" y="409" width="32" height="34" rx="5" fill="#f1f3f5" stroke="#aeb5bd" stroke-width="2"/>
    <rect x="846" y="409" width="32" height="34" rx="5" fill="#f1f3f5" stroke="#aeb5bd" stroke-width="2"/>
    <rect x="886" y="409" width="32" height="34" rx="5" fill="#f1f3f5" stroke="#aeb5bd" stroke-width="2"/>
    <rect x="926" y="409" width="32" height="34" rx="5" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
    <rect x="966" y="409" width="32" height="34" rx="5" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
    <rect x="1006" y="409" width="32" height="34" rx="5" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
    <line x1="1038" y1="426" x2="1063" y2="426" stroke="#0067c0" stroke-width="3"/>
    <path d="M1063 418 L1077 426 L1063 434 Z" fill="#0067c0"/>
    <circle cx="1096" cy="426" r="19" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>

    <text x="806" y="491" font-size="20" font-weight="500" fill="#7a848f">OLDER</text>
    <text x="934" y="491" font-size="20" font-weight="500" fill="#0067c0">RECENT</text>
    <text x="1061" y="491" font-size="20" font-weight="500" fill="#59636e">NEXT</text>
  </g>
</svg>
