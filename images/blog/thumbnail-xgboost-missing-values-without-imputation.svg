<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Handle Missing Values in XGBoost Without Imputation</title>
  <desc id="desc">A DATATWEETS tutorial thumbnail showing numeric values and a NaN entering a decision-tree split, where the NaN follows the split's learned default branch.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1.2" fill="#59636e">XGBOOST MISSING DATA</text>
    <text x="90" y="278" font-size="82" font-weight="700" fill="#1b1f24">ROUTE</text>
    <text x="90" y="370" font-size="82" font-weight="700" fill="#1b1f24">THE GAPS</text>
    <rect x="94" y="405" width="370" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="480" font-size="31" font-weight="500" fill="#59636e">NaN &#xB7; branches &#xB7; evaluate</text>
  </g>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="748" y="108" width="92" height="46" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
    <text x="794" y="139" text-anchor="middle" font-size="22" font-weight="600" fill="#1b1f24">4.0</text>
    <rect x="858" y="108" width="92" height="46" rx="12" fill="#f7f8fa" stroke="#a3acb5" stroke-width="2"/>
    <text x="904" y="139" text-anchor="middle" font-size="22" font-weight="600" fill="#1b1f24">9.0</text>
    <rect x="968" y="108" width="108" height="46" rx="12" fill="#fff5e8" stroke="#d18b2c" stroke-width="2"/>
    <text x="1022" y="139" text-anchor="middle" font-size="22" font-weight="700" fill="#7a4a08">NaN</text>

    <path d="M794 154 L872 230" fill="none" stroke="#c7ccd2" stroke-width="2.5"/>
    <path d="M904 154 L904 220" fill="none" stroke="#c7ccd2" stroke-width="2.5"/>
    <path d="M1022 154 L936 230" fill="none" stroke="#d18b2c" stroke-width="3" stroke-dasharray="7 6"/>

    <rect x="770" y="220" width="268" height="88" rx="18" fill="#ffffff" stroke="#59636e" stroke-width="3"/>
    <text x="904" y="256" text-anchor="middle" font-size="20" font-weight="600" fill="#59636e">DECISION SPLIT</text>
    <text x="904" y="286" text-anchor="middle" font-size="25" font-weight="700" fill="#1b1f24">door time &lt; 5?</text>

    <path d="M850 308 C828 356 795 374 773 411" fill="none" stroke="#0067c0" stroke-width="4"/>
    <path d="M958 308 C980 356 1013 374 1035 411" fill="none" stroke="#59636e" stroke-width="3"/>
    <text x="800" y="358" text-anchor="middle" font-size="19" font-weight="600" fill="#0067c0">YES</text>
    <text x="1003" y="350" text-anchor="middle" font-size="19" font-weight="600" fill="#59636e">NO + NaN</text>
    <text x="1028" y="376" text-anchor="middle" font-size="17" font-weight="600" fill="#d18b2c">learned default</text>

    <rect x="687" y="410" width="174" height="94" rx="18" fill="#e3f0fa" stroke="#0067c0" stroke-width="2.5"/>
    <text x="774" y="449" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1f24">LEFT LEAF</text>
    <text x="774" y="479" text-anchor="middle" font-size="18" font-weight="500" fill="#59636e">value &lt; 5</text>

    <rect x="947" y="410" width="174" height="94" rx="18" fill="#f7f8fa" stroke="#59636e" stroke-width="2.5"/>
    <text x="1034" y="449" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1f24">RIGHT LEAF</text>
    <text x="1034" y="479" text-anchor="middle" font-size="18" font-weight="500" fill="#59636e">value &#x2265; 5 or NaN</text>
  </g>
</svg>
