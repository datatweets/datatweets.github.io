<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The parse, derive, summarize model for a Netflix viewing history</title><desc id="desc">A raw viewing history row with a text date and full episode title is parsed into a real datetime and clean show name, then derived into day-of-week columns for three sample rows, then summarized into a grouped count table showing Silent Harbor with 46 plays, Kitchen Lights with 43, and Nocturne with 34.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="150" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">PARSE</text><text x="640" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">DERIVE</text><text x="1044" y="66" font-size="30" font-weight="600" fill="#0067c0" text-anchor="middle">SUMMARIZE</text><rect x="60" y="120" width="180" height="320" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="150" y="158" font-size="22" font-weight="600" fill="#59636e" text-anchor="middle">history</text><g font-size="16" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="80" y="176" width="140" height="34" rx="8" fill="#e3f0fa" /><text x="88" y="197" fill="#1b1f24">Kitchen Lights</text><text x="88" y="213" fill="#59636e">11/22/25</text><rect x="80" y="220" width="140" height="34" rx="8" fill="#fdeede" /><text x="88" y="241" fill="#1b1f24">Two Rivers</text><text x="88" y="257" fill="#59636e">11/21/25</text><rect x="80" y="264" width="140" height="34" rx="8" fill="#e6f4e6" /><text x="88" y="285" fill="#1b1f24">Silent Harbor</text><text x="88" y="301" fill="#59636e">11/17/25</text></g><path d="M252 280C310 280 310 160 368 160" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M252 280H368" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M252 280C310 280 310 400 368 400" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><g font-size="17" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="368" y="112" width="230" height="96" rx="14" fill="#ffffff" stroke="#8fbc8f" stroke-width="3" /><text x="386" y="144" fill="#1b1f24">show: Kitchen Lights</text><text x="386" y="172" fill="#59636e">day: Saturday</text><rect x="368" y="232" width="230" height="96" rx="14" fill="#ffffff" stroke="#7fb0d8" stroke-width="3" /><text x="386" y="264" fill="#1b1f24">show: Two Rivers</text><text x="386" y="292" fill="#59636e">day: Friday</text><rect x="368" y="352" width="230" height="96" rx="14" fill="#ffffff" stroke="#e0b184" stroke-width="3" /><text x="386" y="384" fill="#1b1f24">show: Silent Harbor</text><text x="386" y="412" fill="#59636e">day: Monday</text></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="22"><path d="M610 160H668" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M610 280H668" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M610 400H668" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><rect x="672" y="132" width="146" height="56" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="745" y="168" fill="#0067c0" text-anchor="middle">value_counts()</text></g><path d="M826 160C880 160 880 280 934 280" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="934" y="180" width="220" height="200" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="1044" y="216" font-size="22" font-weight="600" fill="#59636e" text-anchor="middle">show</text><g font-size="18" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="952" y="232" width="184" height="34" rx="8" fill="#e6f4e6" /><text x="964" y="256" fill="#1b1f24">Silent Harbor    46</text><rect x="952" y="276" width="184" height="34" rx="8" fill="#e3f0fa" /><text x="964" y="300" fill="#1b1f24">Kitchen Lights   43</text><rect x="952" y="320" width="184" height="34" rx="8" fill="#fdeede" /><text x="964" y="344" fill="#1b1f24">Nocturne         34</text></g></g></svg>
