<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Test accuracy for logistic regression and random forest across six random train/test splits</title><desc id="desc">A line chart of test accuracy on six different random 80/20 splits of the heart disease dataset, seeds 0, 1, 2, 3, 4, and 42. Logistic regression and random forest cross four times: logistic regression leads on seeds 0, 2, 3, and 4, random forest leads on seed 42, and the two tie at 0.867 on seed 1, showing that the apparent winner depends on which split you happened to run.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="120" y="40" width="28" height="14" rx="4" fill="#0067c0" /><text x="158" y="52" font-size="24" fill="#1b1f24">Logistic Regression</text><rect x="460" y="40" width="28" height="14" rx="4" fill="#59636e" /><text x="498" y="52" font-size="24" fill="#1b1f24">Random Forest</text><text x="120" y="90" font-size="20" fill="#59636e">test accuracy</text><line x1="120" y1="460.0" x2="1120" y2="460.0" stroke="#e3e6ea" stroke-width="2" /><text x="100" y="466.0" font-size="20" fill="#59636e" text-anchor="end">0.75</text><line x1="120" y1="340.0" x2="1120" y2="340.0" stroke="#e3e6ea" stroke-width="2" /><text x="100" y="346.0" font-size="20" fill="#59636e" text-anchor="end">0.80</text><line x1="120" y1="220.0" x2="1120" y2="220.0" stroke="#e3e6ea" stroke-width="2" /><text x="100" y="226.0" font-size="20" fill="#59636e" text-anchor="end">0.85</text><line x1="120" y1="100.0" x2="1120" y2="100.0" stroke="#e3e6ea" stroke-width="2" /><text x="100" y="106.0" font-size="20" fill="#59636e" text-anchor="end">0.90</text><polyline points="120.0,260.8 320.0,179.2 520.0,340.0 720.0,340.0 920.0,419.2 1120.0,179.2" fill="none" stroke="#59636e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><polyline points="120.0,220.0 320.0,179.2 520.0,260.8 720.0,380.8 920.0,220.0 1120.0,260.8" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19"><circle cx="120.0" cy="220.0" r="7" fill="#0067c0" /><text x="120.0" y="200.0" fill="#0067c0" text-anchor="middle">0.850</text><circle cx="120.0" cy="260.8" r="7" fill="#59636e" /><text x="120.0" y="288.8" fill="#59636e" text-anchor="middle">0.833</text><circle cx="320.0" cy="179.2" r="6" fill="#0067c0" /><circle cx="320.0" cy="179.2" r="12" fill="none" stroke="#59636e" stroke-width="3" /><text x="320.0" y="155.2" fill="#1b1f24" text-anchor="middle">0.867 tie</text><circle cx="520.0" cy="260.8" r="7" fill="#0067c0" /><text x="520.0" y="240.8" fill="#0067c0" text-anchor="middle">0.833</text><circle cx="520.0" cy="340.0" r="7" fill="#59636e" /><text x="520.0" y="368.0" fill="#59636e" text-anchor="middle">0.800</text><circle cx="720.0" cy="340.0" r="7" fill="#59636e" /><text x="720.0" y="320.0" fill="#59636e" text-anchor="middle">0.800</text><circle cx="720.0" cy="380.8" r="7" fill="#0067c0" /><text x="720.0" y="408.8" fill="#0067c0" text-anchor="middle">0.783</text><circle cx="920.0" cy="220.0" r="7" fill="#0067c0" /><text x="920.0" y="200.0" fill="#0067c0" text-anchor="middle">0.850</text><circle cx="920.0" cy="419.2" r="7" fill="#59636e" /><text x="920.0" y="447.2" fill="#59636e" text-anchor="middle">0.767</text><circle cx="1120.0" cy="260.8" r="7" fill="#0067c0" /><text x="1096.0" y="284.8" fill="#0067c0" text-anchor="middle">0.833</text><circle cx="1120.0" cy="179.2" r="7" fill="#59636e" /><text x="1096.0" y="159.2" fill="#59636e" text-anchor="middle">0.867</text></g><g font-size="20" fill="#59636e" text-anchor="middle"><text x="120.0" y="495">seed 0</text><text x="320.0" y="495">seed 1</text><text x="520.0" y="495">seed 2</text><text x="720.0" y="495">seed 3</text><text x="920.0" y="495">seed 4</text><text x="1120.0" y="495">seed 42</text></g><tex