<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">How to Build Prediction Intervals with XGBoost in Python</title>
  <desc id="desc">A DATATWEETS tutorial thumbnail with the words Predict a Range and a diagram of three XGBoost runtime estimates. Each estimate spans its 10th-to-90th quantile interval and marks its median.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1.2" fill="#59636e">XGBOOST UNCERTAINTY</text>
    <text x="90" y="278" font-size="88" font-weight="700" fill="#1b1f24">PREDICT A</text>
    <text x="90" y="376" font-size="88" font-weight="700" fill="#1b1f24">RANGE</text>
    <rect x="96" y="411" width="390" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="485" font-size="29" font-weight="500" fill="#59636e">QUANTILES &#183; COVERAGE &#183; CALIBRATION</text>

    <g transform="translate(692 146)">
      <line x1="84" y1="10" x2="84" y2="36" stroke="#0067c0" stroke-width="4"/>
      <text x="98" y="31" font-size="20" font-weight="600" fill="#59636e">10TH</text>
      <circle cx="224" cy="23" r="9" fill="#ffffff" stroke="#0067c0" stroke-width="4"/>
      <text x="240" y="31" font-size="20" font-weight="600" fill="#59636e">50TH</text>
      <line x1="374" y1="10" x2="374" y2="36" stroke="#0067c0" stroke-width="4"/>
      <text x="388" y="31" font-size="20" font-weight="600" fill="#59636e">90TH</text>

      <text x="58" y="108" font-size="21" font-weight="600" text-anchor="middle" fill="#59636e">A</text>
      <rect x="108" y="88" width="242" height="30" rx="15" fill="#e3f0fa"/>
      <line x1="108" y1="103" x2="350" y2="103" stroke="#0067c0" stroke-width="4"/>
      <circle cx="230" cy="103" r="11" fill="#ffffff" stroke="#0067c0" stroke-width="5"/>
      <line x1="108" y1="91" x2="108" y2="115" stroke="#0067c0" stroke-width="4"/>
      <line x1="350" y1="91" x2="350" y2="115" stroke="#0067c0" stroke-width="4"/>

      <text x="58" y="202" font-size="21" font-weight="600" text-anchor="middle" fill="#59636e">B</text>
      <rect x="88" y="182" width="304" height="30" rx="15" fill="#e3f0fa"/>
      <line x1="88" y1="197" x2="392" y2="197" stroke="#0067c0" stroke-width="4"/>
      <circle cx="246" cy="197" r="11" fill="#ffffff" stroke="#0067c0" stroke-width="5"/>
      <line x1="88" y1="185" x2="88" y2="209" stroke="#0067c0" stroke-width="4"/>
      <line x1="392" y1="185" x2="392" y2="209" stroke="#0067c0" stroke-width="4"/>

      <text x="58" y="296" font-size="21" font-weight="600" text-anchor="middle" fill="#59636e">C</text>
      <rect x="132" y="276" width="206" height="30" rx="15" fill="#e3f0fa"/>
      <line x1="132" y1="291" x2="338" y2="291" stroke="#0067c0" stroke-width="4"/>
      <circle cx="254" cy="291" r="11" fill="#ffffff" stroke="#0067c0" stroke-width="5"/>
      <line x1="132" y1="279" x2="132" y2="303" stroke="#0067c0" stroke-width="4"/>
      <line x1="338" y1="279" x2="338" y2="303" stroke="#0067c0" stroke-width="4"/>

      <g transform="translate(88 370)">
        <line x1="0" y1="0" x2="304" y2="0" stroke="#59636e" stroke-width="2"/>
        <path d="M0 0 L14 -8 M0 0 L14 8 M304 0 L290 -8 M304 0 L290 8" fill="none" stroke="#59636e" stroke-width="2"/>
        <text x="152" y="34" font-size="20" font-weight="500" text-anchor="middle" fill="#59636e">CALIBRATED WIDTH</text>
      </g>
    </g>
  </g>
</svg>
