<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Detrend Nonlinear Time Series with LOWESS in Python</title>
  <desc id="desc">A DataTweets tutorial thumbnail showing a curved sensor signal and its LOWESS trend above a detrended residual with two preserved peaks.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="32" font-weight="600" fill="#59636e">LOWESS TIME SERIES</text>
    <text x="90" y="290" font-size="82" font-weight="700" fill="#1b1f24">REMOVE</text>
    <text x="90" y="382" font-size="82" font-weight="700" fill="#1b1f24">CURVED DRIFT</text>
    <rect x="96" y="420" width="382" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="492" font-size="29" font-weight="500" fill="#59636e">SMOOTH &#183; SUBTRACT &#183; INSPECT</text>
  </g>

  <g transform="translate(704 112)" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="0" y="0" width="420" height="184" rx="18" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
    <text x="24" y="34" font-size="20" font-weight="600" fill="#59636e">OBSERVED + LOWESS TREND</text>
    <path d="M24 143 C58 137 78 129 102 119 L113 65 L124 116 C151 105 178 94 207 101 C238 110 264 116 290 103 L302 55 L314 96 C338 91 357 79 396 73" fill="none" stroke="#59636e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 142 C88 134 145 103 207 102 C274 101 318 98 396 72" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="396" cy="72" r="6" fill="#0067c0"/>

    <line x1="210" y1="198" x2="210" y2="224" stroke="#0067c0" stroke-width="4" stroke-linecap="round"/>
    <path d="M198 216 L210 228 L222 216" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="238" y="220" font-size="18" font-weight="600" fill="#0067c0">SUBTRACT TREND</text>

    <rect x="0" y="240" width="420" height="184" rx="18" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
    <text x="24" y="274" font-size="20" font-weight="600" fill="#59636e">DETRENDED RESIDUAL</text>
    <line x1="24" y1="352" x2="396" y2="352" stroke="#c7ccd2" stroke-width="2" stroke-dasharray="7 7"/>
    <path d="M24 354 C54 349 73 357 100 352 L112 302 L124 350 C156 357 180 345 208 353 C236 360 261 346 289 352 L302 286 L315 350 C341 357 366 348 396 353" fill="none" stroke="#1b1f24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="112" cy="302" r="6" fill="#0067c0"/>
    <circle cx="302" cy="286" r="6" fill="#0067c0"/>
  </g>
</svg>
