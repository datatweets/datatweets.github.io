<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="A before-and-after diagram. Before: a single AuthService class owns two responsibilities, authentication and logging, giving it two reasons to change. After: AuthService handles authentication only and delegates to a separate Logger class that handles logging only, so each class has one reason to change."><title>Single Responsibility Principle overview</title><desc>Before-and-after diagram showing one class split into focused classes so each has one reason to change.</desc><defs><marker id="srparr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a0aec0" /></marker><marker id="srpblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0067c0" /></marker></defs><rect width="640" height="430" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">One reason to change, not two</text><text x="135" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#b9791a" letter-spacing="1">BEFORE</text><rect x="44" y="84" width="182" height="150" rx="12" fill="#fdf3e6" stroke="#e2a23b" stroke-width="2.5" /><text x="135" y="112" text-anchor="middle" font-size="14" font-weight="800" fill="#8a5a12" font-family="'SFMono-Regular', Consolas, Menlo, monospace">AuthService</text><line x1="64" y1="126" x2="206" y2="126" stroke="#e2a23b" stroke-width="1" stroke-dasharray="3 3" /><text x="64" y="158" font-size="12" fill="#7a5a2a">• checks credentials</text><text x="64" y="184" font-size="12" fill="#7a5a2a">• opens the log file</text><text x="64" y="210" font-size="12" fill="#7a5a2a">• formats &amp; writes logs</text><text x="135" y="266" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b9791a">2 reasons to change</text><path d="M70 286q65 26 130 0" fill="none" stroke="#e2a23b" stroke-width="1.6" marker-start="url(#srparr)" marker-end="url(#srparr)" /><text x="135" y="312" text-anchor="middle" font-size="10.5" fill="#9a7330">auth rules · log format</text><line x1="246" y1="160" x2="312" y2="160" stroke="#cbd5e0" stroke-width="2" marker-end="url(#srparr)" /><text x="279" y="150" text-anchor="middle" font-size="11" fill="#718096">split</text><text x="470" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#0a3d62" letter-spacing="1">AFTER</text><rect x="332" y="88" width="276" height="78" rx="12" fill="#d6e8f7" stroke="#0067c0" stroke-width="2.5" /><text x="470" y="118" text-anchor="middle" font-size="14" font-weight="800" fill="#0a3d62" font-family="'SFMono-Regular', Consolas, Menlo, monospace">AuthService</text><text x="470" y="142" text-anchor="middle" font-size="11.5" fill="#2b6cb0">authentication only</text><rect x="332" y="244" width="276" height="78" rx="12" fill="#eaf4fc" stroke="#0067c0" stroke-width="2.5" /><text x="470" y="274" text-anchor="middle" font-size="14" font-weight="800" fill="#0a3d62" font-family="'SFMono-Regular', Consolas, Menlo, monospace">Logger</text><text x="470" y="298" text-anchor="middle" font-size="11.5" fill="#2b6cb0">logging only</text><path d="M470 166V244" fill="none" stroke="#0067c0" stroke-width="2.2" marker-end="url(#srpblue)" /><text x="486" y="208" font-size="11" fill="#0067c0">uses (composition)</text></svg>