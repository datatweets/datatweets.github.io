<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">SQL subqueries for beginners thumbnail</title><desc id="desc">A minimal logo-style thumbnail for a beginner's guide to SQL subqueries, showing a query nested inside another query.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="40" font-weight="600" fill="#59636e">Your first SQL subquery</text><text x="90" y="392" font-size="150" font-weight="700" fill="#1b1f24">NESTED</text><rect x="100" y="424" width="380" height="12" rx="6" fill="#0067c0" /><text x="98" y="506" font-size="35" font-weight="500" fill="#59636e">value &#183; list &#183; table</text></g><g transform="translate(790 128)" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="0" y="0" width="300" height="340" rx="20" fill="#ffffff" stroke="#c7ccd2" stroke-width="2" /><line x1="0" y1="113" x2="300" y2="113" stroke="#e3e6ea" stroke-width="2" /><line x1="0" y1="226" x2="300" y2="226" stroke="#e3e6ea" stroke-width="2" /><text x="20" y="34" font-size="18" fill="#59636e">WHERE rate &gt;</text><rect x="20" y="50" width="220" height="46" rx="10" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="38" y="80" font-size="18" fill="#1b1f24">(SELECT AVG)</text><text x="20" y="147" font-size="18" fill="#59636e">WHERE id IN</text><rect x="20" y="163" width="220" height="46" rx="10" fill="#fdeede" stroke="#0067c0" stroke-width="3" /><text x="38" y="193" font-size="18" fill="#1b1f24">(SELECT id)</text><text x="20" y="260" font-size="18" fill="#59636e">FROM (...) AS t</text><rect x="20" y="276" width="220" height="46" rx="10" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="38" y="306" font-size="18" fill="#1b1f24">(SELECT ...)</text></g></svg>
