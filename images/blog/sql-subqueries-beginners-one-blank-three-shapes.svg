<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc"><title id="title">The three shapes a SQL subquery can fill</title><desc id="desc">Diagram showing three subquery shapes: a single value used after a comparison operator, a list of values used after IN, and a whole table used after FROM with an alias, each shown as a small SELECT box filling a labeled blank in an outer query.</desc><rect width="1200" height="410" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="196" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">VALUE</text><text x="600" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">LIST</text><text x="1004" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">TABLE</text><rect x="46" y="86" width="300" height="300" rx="18" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><rect x="450" y="86" width="300" height="300" rx="18" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><rect x="854" y="86" width="300" height="300" rx="18" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18"><text x="72" y="126" fill="#59636e">WHERE rate &gt;</text><rect x="72" y="146" width="248" height="60" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="90" y="182" fill="#1b1f24" font-size="16">(SELECT AVG(rate))</text><circle cx="196" cy="266" r="34" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="196" y="273" fill="#0067c0" text-anchor="middle" font-size="20">1</text><text x="72" y="352" fill="#59636e" font-size="17">one row, one column</text></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18"><text x="476" y="126" fill="#59636e">member_id IN</text><rect x="476" y="146" width="248" height="60" rx="12" fill="#fdeede" stroke="#0067c0" stroke-width="3" /><text x="494" y="182" fill="#1b1f24" font-size="16">(SELECT member_id)</text><rect x="536" y="242" width="30" height="30" rx="6" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><rect x="576" y="242" width="30" height="30" rx="6" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><rect x="616" y="242" width="30" height="30" rx="6" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><rect x="536" y="282" width="30" height="30" rx="6" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="476" y="352" fill="#59636e" font-size="17">many rows, one column</text></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18"><text x="880" y="126" fill="#59636e">FROM (...) AS t</text><rect x="880" y="146" width="248" height="60" rx="12" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="898" y="182" fill="#1b1f24" font-size="16">(SELECT category...)</text><rect x="880" y="242" width="248" height="70" rx="10" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><line x1="880" y1="266" x2="1128" y2="266" stroke="#c7ccd2" stroke-width="2" /><line x1="1004" y1="242" x2="1004" y2="312" stroke="#c7ccd2" stroke-width="2" /><text x="880" y="352" fill="#59636e" font-size="17">many rows, many columns</text></g></g></svg>
