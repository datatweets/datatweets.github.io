<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Validate machine learning API inputs before prediction</title>
  <desc id="desc">DATATWEETS tutorial thumbnail. A JSON request enters a Pydantic contract. Invalid data branches to HTTP 422, while valid features continue to the prediction model.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1.5" fill="#59636e">ML API BOUNDARY</text>
    <text x="90" y="274" font-size="78" font-weight="700" fill="#1b1f24">VALIDATE</text>
    <text x="90" y="365" font-size="78" font-weight="700" fill="#1b1f24">THEN PREDICT</text>
    <rect x="96" y="400" width="360" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="475" font-size="27" font-weight="500" fill="#59636e">FASTAPI &#xB7; PYDANTIC &#xB7; HTTP 422</text>
  </g>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="700" y="100" width="390" height="108" rx="16" fill="#ffffff" stroke="#c7ccd2" stroke-width="2"/>
    <text x="726" y="133" font-size="20" font-weight="700" letter-spacing="1" fill="#59636e">JSON REQUEST</text>
    <rect x="726" y="151" width="174" height="35" rx="8" fill="#e3f0fa"/>
    <text x="741" y="175" font-size="18" font-weight="600" fill="#1b1f24">cloud: 35.0</text>
    <rect x="914" y="151" width="148" height="35" rx="8" fill="#f7f8fa" stroke="#e3e6ea"/>
    <text x="929" y="175" font-size="18" font-weight="600" fill="#1b1f24">area: 42.0</text>

    <line x1="895" y1="208" x2="895" y2="246" stroke="#0067c0" stroke-width="3"/>
    <line x1="886" y1="237" x2="895" y2="248" stroke="#0067c0" stroke-width="3" stroke-linecap="round"/>
    <line x1="904" y1="237" x2="895" y2="248" stroke="#0067c0" stroke-width="3" stroke-linecap="round"/>

    <rect x="700" y="250" width="390" height="126" rx="18" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>
    <rect x="722" y="273" width="36" height="36" rx="18" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
    <line x1="731" y1="291" x2="738" y2="298" stroke="#0067c0" stroke-width="3" stroke-linecap="round"/>
    <line x1="738" y1="298" x2="751" y2="282" stroke="#0067c0" stroke-width="3" stroke-linecap="round"/>
    <text x="772" y="299" font-size="27" font-weight="700" fill="#1b1f24">PYDANTIC CONTRACT</text>
    <text x="726" y="342" font-size="20" font-weight="500" fill="#59636e">required &#xB7; strict types &#xB7; ranges</text>

    <line x1="830" y1="376" x2="830" y2="430" stroke="#c45b4c" stroke-width="3"/>
    <line x1="830" y1="430" x2="758" y2="430" stroke="#c45b4c" stroke-width="3"/>
    <line x1="758" y1="430" x2="758" y2="455" stroke="#c45b4c" stroke-width="3"/>
    <line x1="749" y1="446" x2="758" y2="457" stroke="#c45b4c" stroke-width="3" stroke-linecap="round"/>
    <line x1="767" y1="446" x2="758" y2="457" stroke="#c45b4c" stroke-width="3" stroke-linecap="round"/>
    <line x1="960" y1="376" x2="960" y2="430" stroke="#0067c0" stroke-width="3"/>
    <line x1="960" y1="430" x2="1032" y2="430" stroke="#0067c0" stroke-width="3"/>
    <line x1="1032" y1="430" x2="1032" y2="455" stroke="#0067c0" stroke-width="3"/>
    <line x1="1023" y1="446" x2="1032" y2="457" stroke="#0067c0" stroke-width="3" stroke-linecap="round"/>
    <line x1="1041" y1="446" x2="1032" y2="457" stroke="#0067c0" stroke-width="3" stroke-linecap="round"/>

    <rect x="678" y="458" width="160" height="92" rx="16" fill="#fff4f1" stroke="#c45b4c" stroke-width="2"/>
    <text x="758" y="493" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1" fill="#8d3e34">INVALID</text>
    <text x="758" y="527" text-anchor="middle" font-size="27" font-weight="700" fill="#1b1f24">HTTP 422</text>

    <rect x="952" y="458" width="160" height="92" rx="16" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
    <text x="1032" y="493" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1" fill="#00589f">VALID</text>
    <text x="1032" y="527" text-anchor="middle" font-size="27" font-weight="700" fill="#1b1f24">PREDICT</text>
  </g>
</svg>
