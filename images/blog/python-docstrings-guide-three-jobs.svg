<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">One docstring, three consumers</title><desc id="desc">Diagram showing one triple-quoted docstring on a function feeding three separate consumers: help() and editor tooltips reading __doc__ at runtime, pydoc turning it into a generated documentation page, and doctest running its example lines as real tests, shown with the post's verified result of zero failures out of two attempted examples.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="220" y="46" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">ONE DOCSTRING</text></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19"><rect x="60" y="200" width="320" height="160" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="3" /><text x="80" y="234" fill="#59636e">def to_f(c):</text><rect x="80" y="248" width="280" height="30" rx="7" fill="#e3f0fa" /><text x="88" y="269" fill="#0067c0">&quot;&quot;&quot;Convert C to F.</text><text x="100" y="299" fill="#0067c0">&gt;&gt;&gt; to_f(0)</text><text x="100" y="323" fill="#0067c0">32.0 &quot;&quot;&quot;</text></g><path d="M380 280C460 280 460 140 560 140" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M380 280H560" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M380 280C460 280 460 420 560 420" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="560" y="98" font-size="21" font-weight="600" fill="#0067c0">RUNTIME HELP</text><rect x="560" y="108" width="360" height="112" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="580" y="140" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" fill="#0067c0" font-weight="600">help(to_f)</text><text x="580" y="168" font-size="17" fill="#59636e">help() and editor tooltips read</text><text x="580" y="190" font-size="17" fill="#59636e">__doc__ the moment you call it.</text><text x="560" y="238" font-size="21" font-weight="600" fill="#2f7d4f">GENERATED DOCS</text><rect x="560" y="248" width="360" height="112" rx="16" fill="#ffffff" stroke="#8fbc8f" stroke-width="3" /><text x="580" y="280" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19" fill="#2f7d4f" font-weight="600">pydoc weather</text><text x="580" y="308" font-size="17" fill="#59636e">Every docstring becomes a</text><text x="580" y="330" font-size="17" fill="#59636e">formatted page, no extra markup.</text><text x="560" y="378" font-size="21" font-weight="600" fill="#b5651d">EXECUTABLE EXAMPLES</text><rect x="560" y="388" width="360" height="112" rx="16" fill="#ffffff" stroke="#e0b184" stroke-width="3" /><text x="580" y="420" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" fill="#b5651d" font-weight="600">failed=0, attempted=2</text><text x="580" y="448" font-size="17" fill="#59636e">The &gt;&gt;&gt; lines run for real and</text><text x="580" y="470" font-size="17" fill="#59636e">fail loudly if they ever drift.</text></g></svg>
