<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Remove Weekly Seasonality with pandas Differencing</title>
  <desc id="desc">A DataTweets tutorial thumbnail showing a Tuesday value of 220.7 kilowatt-hours minus the previous Tuesday value of 216.7 kilowatt-hours, producing a seven-day difference of positive 4.0 kilowatt-hours.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0067c0"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1" fill="#59636e">WEEKLY TIME SERIES</text>
    <text x="90" y="282" font-size="86" font-weight="700" fill="#1b1f24">MATCH</text>
    <text x="90" y="382" font-size="86" font-weight="700" fill="#1b1f24">WEEKDAYS</text>
    <rect x="94" y="421" width="420" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="496" font-size="29" font-weight="500" fill="#59636e">PANDAS &#183; LAG 7 &#183; RESTORE</text>

    <g transform="translate(650 115)">
      <rect x="0" y="0" width="450" height="445" rx="24" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="42" y="64" font-size="20" font-weight="600" letter-spacing="1" fill="#59636e">PREVIOUS TUESDAY</text>
      <text x="364" y="64" font-size="20" font-weight="600" letter-spacing="1" text-anchor="middle" fill="#59636e">TUESDAY</text>

      <text x="42" y="132" font-size="42" font-weight="700" fill="#1b1f24">216.7</text>
      <text x="315" y="132" font-size="42" font-weight="700" fill="#1b1f24">220.7</text>
      <text x="43" y="164" font-size="22" font-weight="500" fill="#59636e">kWh</text>
      <text x="316" y="164" font-size="22" font-weight="500" fill="#59636e">kWh</text>

      <line x1="92" y1="227" x2="354" y2="227" stroke="#0067c0" stroke-width="4" marker-end="url(#arrow)"/>
      <circle cx="92" cy="227" r="17" fill="#e3f0fa" stroke="#0067c0" stroke-width="4"/>
      <circle cx="364" cy="227" r="17" fill="#ffffff" stroke="#0067c0" stroke-width="4"/>
      <text x="187" y="207" font-size="22" font-weight="600" fill="#59636e">7 DAYS</text>
      <text x="46" y="279" font-size="21" font-weight="500" fill="#59636e">7 JAN</text>
      <text x="329" y="279" font-size="21" font-weight="500" fill="#59636e">14 JAN</text>

      <rect x="45" y="319" width="360" height="82" rx="18" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>
      <text x="72" y="353" font-size="19" font-weight="600" letter-spacing="0.8" fill="#59636e">7-DAY DIFFERENCE</text>
      <text x="72" y="387" font-size="27" font-weight="700" fill="#1b1f24">220.7 - 216.7</text>
      <text x="274" y="387" font-size="23" font-weight="700" fill="#0067c0">= +4.0 kWh</text>
    </g>
  </g>
</svg>
