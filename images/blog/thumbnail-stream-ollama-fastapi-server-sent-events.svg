<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Stream Ollama Responses with FastAPI and Server-Sent Events</title>
  <desc id="desc">A DATATWEETS tutorial thumbnail showing Ollama newline-delimited JSON flowing through a FastAPI translator and becoming token and completion Server-Sent Events.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="36" font-weight="600" fill="#59636e">LOCAL LLM STREAMS</text>
    <text x="90" y="300" font-size="94" font-weight="700" fill="#1b1f24">NDJSON</text>
    <text x="90" y="406" font-size="94" font-weight="700" fill="#1b1f24">TO SSE</text>
    <rect x="98" y="449" width="410" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="532" font-size="31" font-weight="500" fill="#59636e">HTTPX &#183; FASTAPI &#183; SSE</text>

    <g transform="translate(716 112)">
      <rect x="0" y="0" width="380" height="100" rx="18" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <circle cx="34" cy="34" r="9" fill="#0067c0"/>
      <text x="56" y="44" font-size="25" font-weight="700" fill="#1b1f24">OLLAMA</text>
      <text x="28" y="83" font-size="22" font-weight="500" fill="#59636e">NDJSON lines</text>
      <rect x="218" y="65" width="40" height="7" rx="3.5" fill="#0067c0"/>
      <rect x="266" y="65" width="32" height="7" rx="3.5" fill="#9cc8eb"/>
      <rect x="306" y="65" width="46" height="7" rx="3.5" fill="#0067c0"/>

      <line x1="190" y1="100" x2="190" y2="126" stroke="#0067c0" stroke-width="4"/>
      <path d="M180 121 L190 133 L200 121" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="0" y="134" width="380" height="108" rx="18" fill="#ffffff" stroke="#0067c0" stroke-width="3"/>
      <text x="28" y="178" font-size="25" font-weight="700" fill="#1b1f24">FASTAPI</text>
      <text x="28" y="214" font-size="22" font-weight="500" fill="#59636e">parse &#8594; translate</text>
      <rect x="246" y="161" width="106" height="42" rx="12" fill="#e3f0fa"/>
      <text x="299" y="189" text-anchor="middle" font-size="20" font-weight="700" fill="#0067c0">SSE</text>

      <line x1="190" y1="242" x2="190" y2="268" stroke="#0067c0" stroke-width="4"/>
      <path d="M180 263 L190 275 L200 263" fill="none" stroke="#0067c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="0" y="276" width="380" height="160" rx="18" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="2"/>
      <text x="28" y="317" font-size="24" font-weight="700" fill="#1b1f24">CLIENT EVENTS</text>
      <rect x="28" y="338" width="94" height="46" rx="12" fill="#e3f0fa" stroke="#9cc8eb"/>
      <rect x="136" y="338" width="94" height="46" rx="12" fill="#e3f0fa" stroke="#9cc8eb"/>
      <rect x="244" y="338" width="108" height="46" rx="12" fill="#eef6ee" stroke="#8bbd8f"/>
      <text x="75" y="368" text-anchor="middle" font-size="19" font-weight="700" fill="#0067c0">token</text>
      <text x="183" y="368" text-anchor="middle" font-size="19" font-weight="700" fill="#0067c0">token</text>
      <text x="298" y="368" text-anchor="middle" font-size="19" font-weight="700" fill="#2e7d32">complete</text>
      <line x1="122" y1="361" x2="136" y2="361" stroke="#59636e" stroke-width="2"/>
      <line x1="230" y1="361" x2="244" y2="361" stroke="#59636e" stroke-width="2"/>
      <text x="28" y="419" font-size="20" font-weight="500" fill="#59636e">text arrives before the answer ends</text>
    </g>
  </g>
</svg>
