<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Arithmetic, comparison, and logical operators feeding a WHERE clause</title><desc id="desc">Diagram showing a query's operators as a pipeline. Arithmetic operators such as multiplication and modulo turn column values into computed numbers. Comparison operators such as equals and greater-than turn a value into a TRUE or FALSE answer. Logical operators such as AND, OR, and NOT combine those TRUE or FALSE answers into one final answer. All three feed a WHERE gate that keeps rows where the final answer is TRUE and drops rows where it is FALSE.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="210" y="46" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">ARITHMETIC</text><text x="600" y="46" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">COMPARISON</text><text x="990" y="46" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">LOGICAL</text><g font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="100" y="80" width="220" height="54" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="120" y="115" fill="#1b1f24">quantity * price</text><rect x="100" y="154" width="220" height="54" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="140" y="189" fill="#1b1f24">stock % 5</text><rect x="100" y="228" width="220" height="54" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="130" y="263" fill="#1b1f24">price / qty</text></g><g font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="490" y="117" width="220" height="54" rx="12" fill="#fdeede" stroke="#0067c0" stroke-width="3" /><text x="530" y="152" fill="#1b1f24">price &gt; 15</text><rect x="490" y="191" width="220" height="54" rx="12" fill="#fdeede" stroke="#0067c0" stroke-width="3" /><text x="520" y="226" fill="#1b1f24">= &#160;&#160;&#8800;</text></g><g font-size="18" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="880" y="117" width="220" height="54" rx="12" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="945" y="152" fill="#1b1f24">AND</text><rect x="880" y="191" width="220" height="54" rx="12" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="920" y="226" fill="#1b1f24">OR &#183; NOT</text></g><path d="M210 282V340H600V340" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M600 245V340" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M990 245V340H600V340" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><circle cx="600" cy="340" r="38" fill="#ffffff" stroke="#0067c0" stroke-width="5" /><text x="565" y="348" font-size="19" font-weight="600" font-family="Jost, sans-serif" fill="#0067c0">WHERE</text><path d="M600 378V400H420V430" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M600 378V400H780V430" fill="none" stroke="#c7ccd2" stroke-width="6" stroke-linecap="round" /><rect x="310" y="430" width="220" height="70" rx="14" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="340" y="460" font-size="20" font-weight="600" fill="#1b1f24">TRUE</text><text x="332" y="486" font-size="16" fill="#59636e">row is kept</text><rect x="670" y="430" width="220" height="70" rx="14" fill="#fdeede" stroke="#0067c0" stroke-width="3" /><text x="700" y="460" font-size="20" font-weight="600" fill="#1b1f24">FALSE</text><text x="690" y="486" font-size="16" fill="#59636e">row is dropped</text></g></svg>
