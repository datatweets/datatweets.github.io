<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">From 34 raw reviews to 23 clean rows</title><desc id="desc">Diagram of the text-cleaning pipeline used in this post: 34 raw reviews go through fixing encoding and HTML, then handling missing and blank text drops 8 rows to 26, then deduplication removes 2 normalized duplicates and 1 near-duplicate to leave 23 clean rows ready for tokenization.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="150" y="56" font-size="23" font-weight="600" fill="#0067c0" text-anchor="middle">RAW TEXT</text><text x="450" y="56" font-size="23" font-weight="600" fill="#0067c0" text-anchor="middle">FIX ENCODING &amp; HTML</text><text x="750" y="56" font-size="23" font-weight="600" fill="#0067c0" text-anchor="middle">HANDLE MISSING</text><text x="1050" y="56" font-size="23" font-weight="600" fill="#0067c0" text-anchor="middle">DEDUPE</text><rect x="35" y="96" width="230" height="260" rx="16" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="15"><rect x="51" y="114" width="198" height="28" rx="7" fill="#fdeede" stroke="#e3c6a8" stroke-width="2" stroke-dasharray="4 4" /><text x="61" y="134" fill="#59636e">LOVE LOVE!!</text><rect x="51" y="150" width="198" height="28" rx="7" fill="#fdeede" stroke="#e3c6a8" stroke-width="2" stroke-dasharray="4 4" /><text x="61" y="170" fill="#59636e">Doesn&#226;&#8364;&#8482;t sync</text><rect x="51" y="186" width="198" height="28" rx="7" fill="#f7f8fa" stroke="#d0d5db" stroke-width="2" stroke-dasharray="4 4" /><text x="61" y="206" fill="#a7adb5">(blank)</text></g><text x="150" y="300" font-size="52" font-weight="700" fill="#1b1f24" text-anchor="middle">34</text><text x="150" y="336" font-size="16" fill="#59636e" text-anchor="middle">reviews, unfiltered</text><path d="M270 226H326" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M308 210L328 226L308 242" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="298" y="200" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="13" fill="#59636e" text-anchor="middle">html.unescape + re</text><rect x="335" y="96" width="230" height="260" rx="16" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="15"><rect x="351" y="114" width="198" height="28" rx="7" fill="#e6f4e6" /><text x="361" y="134" fill="#1b1f24">love love!!</text><rect x="351" y="150" width="198" height="28" rx="7" fill="#e6f4e6" /><text x="361" y="170" fill="#1b1f24">Doesn't sync</text><rect x="351" y="186" width="198" height="28" rx="7" fill="#f7f8fa" stroke="#d0d5db" stroke-width="2" stroke-dasharray="4 4" /><text x="361" y="206" fill="#a7adb5">(blank)</text></g><text x="450" y="300" font-size="52" font-weight="700" fill="#1b1f24" text-anchor="middle">34</text><text x="450" y="336" font-size="16" fill="#59636e" text-anchor="middle">rows, text now clean</text><path d="M570 226H626" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M608 210L628 226L608 242" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="598" y="200" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="13" fill="#59636e" text-anchor="middle">unify + drop blanks</text><rect x="635" y="96" width="230" height="260" rx="16" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="15"><rect x="651" y="114" width="198" height="28" rx="7" fill="#e6f4e6" /><text x="661" y="134" fill="#1b1f24">love love!!</text><rect x="651" y="150" width="198" height="28" rx="7" fill="#e6f4e6" /><text x="661" y="170" fill="#1b1f24">Doesn't sync</text></g><text x="750" y="300" font-size="52" font-weight="700" fill="#1b1f24" text-anchor="middle">26</text><text x="750" y="336" font-size="16" fill="#59636e" text-anchor="middle">8 blank rows dropped</text><path d="M870 226H926" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M908 210L928 226L908 242" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="898" y="200" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="13" fill="#59636e" text-anchor="middle">drop_duplicates + difflib</text><rect x="935" y="96" width="230" height="260" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="15"><rect x="951" y="114" width="198" height="28" rx="7" fill="#e3f0fa" /><text x="961" y="134" fill="#1b1f24">love love!!</text><rect x="951" y="150" width="198" height="28" rx="7" fill="#e3f0fa" /><text x="961" y="170" fill="#1b1f24">Doesn't sync</text></g><text x="1050" y="300" font-size="52" font-weight="700" fill="#0067c0" text-anchor="middle">23</text><text x="1050" y="336" font-size="16" fill="#59636e" text-anchor="middle">2 dupes + 1 near-dup removed</text><rect x="35" y="420" width="1130" height="90" rx="18" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="65" y="458" font-size="19" fill="#1b1f24">Each stage removes one specific kind of noise &#8212; encoding artifacts, then blank fields,</text><text x="65" y="486" font-size="19" fill="#1b1f24">then repeated opinions &#8212; until every remaining row is real, unique, tokenizable text.</text></g></svg>