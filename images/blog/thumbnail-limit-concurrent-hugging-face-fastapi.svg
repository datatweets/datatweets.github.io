<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to Limit Concurrent Hugging Face Calls with FastAPI</title>
  <desc id="desc">A FastAPI backpressure diagram. A burst of eight requests reaches a three-slot semaphore. Three requests continue to the model provider, while five return HTTP 503 after the admission deadline.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="34" font-weight="600" letter-spacing="1" fill="#59636e">FASTAPI BACKPRESSURE</text>
    <text x="90" y="270" font-size="82" font-weight="700" fill="#1b1f24">CAP THE</text>
    <text x="90" y="362" font-size="82" font-weight="700" fill="#1b1f24">MODEL CALLS</text>
    <rect x="96" y="399" width="390" height="12" rx="6" fill="#0067c0"/>
    <text x="94" y="476" font-size="28" font-weight="500" fill="#59636e">SEMAPHORE &#183; DEADLINE &#183; HTTP 503</text>

    <g transform="translate(675 112)">
      <text x="200" y="24" text-anchor="middle" font-size="22" font-weight="600" letter-spacing="1" fill="#59636e">BURST OF 8 REQUESTS</text>
      <g fill="#e3f0fa" stroke="#0067c0" stroke-width="2">
        <circle cx="60" cy="67" r="13"/>
        <circle cx="100" cy="67" r="13"/>
        <circle cx="140" cy="67" r="13"/>
        <circle cx="180" cy="67" r="13"/>
        <circle cx="220" cy="67" r="13"/>
        <circle cx="260" cy="67" r="13"/>
        <circle cx="300" cy="67" r="13"/>
        <circle cx="340" cy="67" r="13"/>
      </g>
      <path d="M 200 91 L 200 125" fill="none" stroke="#59636e" stroke-width="2.5" marker-end="url(#arrow)"/>

      <rect x="64" y="138" width="272" height="116" rx="18" fill="#f7f8fa" stroke="#59636e" stroke-width="2"/>
      <text x="200" y="174" text-anchor="middle" font-size="23" font-weight="600" fill="#1b1f24">SEMAPHORE</text>
      <text x="200" y="202" text-anchor="middle" font-size="18" font-weight="500" fill="#59636e">3 AVAILABLE SLOTS</text>
      <g fill="#0067c0">
        <rect x="137" y="220" width="32" height="14" rx="7"/>
        <rect x="184" y="220" width="32" height="14" rx="7"/>
        <rect x="231" y="220" width="32" height="14" rx="7"/>
      </g>

      <path d="M 160 255 L 118 306" fill="none" stroke="#59636e" stroke-width="2.5" marker-end="url(#arrow)"/>
      <path d="M 240 255 L 282 306" fill="none" stroke="#59636e" stroke-width="2.5" marker-end="url(#arrow)"/>

      <rect x="18" y="320" width="180" height="118" rx="18" fill="#e3f0fa" stroke="#0067c0" stroke-width="2"/>
      <text x="108" y="361" text-anchor="middle" font-size="34" font-weight="700" fill="#0067c0">3</text>
      <text x="108" y="391" text-anchor="middle" font-size="20" font-weight="600" fill="#1b1f24">FORWARDED</text>
      <text x="108" y="418" text-anchor="middle" font-size="17" font-weight="500" fill="#59636e">TO PROVIDER</text>

      <rect x="218" y="320" width="180" height="118" rx="18" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
      <text x="308" y="361" text-anchor="middle" font-size="34" font-weight="700" fill="#1b1f24">5</text>
      <text x="308" y="391" text-anchor="middle" font-size="20" font-weight="600" fill="#1b1f24">RETURN 503</text>
      <text x="308" y="418" text-anchor="middle" font-size="17" font-weight="500" fill="#59636e">AFTER DEADLINE</text>
    </g>
  </g>
</svg>
