<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Build and Backtest a Seasonal Naive Forecast in Python</title>
  <desc id="desc">A tutorial thumbnail with the words Repeat the Right Day and a diagram showing how the previous Monday's observed value becomes this Monday's seasonal naive forecast, seven days later.</desc>
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>
  <g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="150" font-size="36" font-weight="600" letter-spacing="1" fill="#59636e">WEEKLY FORECASTING</text>
    <text x="90" y="278" font-size="82" font-weight="700" fill="#1b1f24">REPEAT THE</text>
    <text x="90" y="370" font-size="82" font-weight="700" fill="#1b1f24">RIGHT DAY</text>
    <rect x="96" y="402" width="410" height="12" rx="6" fill="#0067c0"/>
    <text x="96" y="480" font-size="30" font-weight="500" fill="#59636e">PANDAS · SHIFT(7) · MAE</text>
    <g transform="translate(690 132)">
      <text x="0" y="0" font-size="24" font-weight="600" fill="#59636e">OBSERVED</text>
      <text x="326" y="0" font-size="24" font-weight="600" fill="#59636e">FORECAST</text>
      <rect x="0" y="36" width="190" height="118" rx="18" fill="#eaf3fb" stroke="#0067c0" stroke-width="3"/>
      <text x="24" y="78" font-size="25" font-weight="600" fill="#59636e">MONDAY</text>
      <text x="24" y="127" font-size="42" font-weight="700" fill="#1b1f24">208</text>
      <line x1="205" y1="95" x2="304" y2="95" stroke="#0067c0" stroke-width="5" stroke-linecap="round"/>
      <line x1="290" y1="78" x2="310" y2="95" stroke="#0067c0" stroke-width="5" stroke-linecap="round"/>
      <line x1="310" y1="95" x2="290" y2="112" stroke="#0067c0" stroke-width="5" stroke-linecap="round"/>
      <text x="218" y="70" font-size="22" font-weight="600" fill="#0067c0">+7 DAYS</text>
      <rect x="326" y="36" width="190" height="118" rx="18" fill="#ffffff" stroke="#59636e" stroke-width="3"/>
      <text x="350" y="78" font-size="25" font-weight="600" fill="#59636e">MONDAY</text>
      <text x="350" y="127" font-size="42" font-weight="700" fill="#1b1f24">208</text>
      <line x1="0" y1="222" x2="516" y2="222" stroke="#e3e6ea" stroke-width="2"/>
      <g font-size="19" font-weight="600" text-anchor="middle" fill="#59636e">
        <text x="34" y="263">MON</text><text x="109" y="263">TUE</text><text x="184" y="263">WED</text>
        <text x="259" y="263">THU</text><text x="334" y="263">FRI</text><text x="409" y="263">SAT</text><text x="484" y="263">SUN</text>
      </g>
      <g stroke="#c7ccd2" stroke-width="5" stroke-linecap="round">
        <line x1="34" y1="310" x2="109" y2="330"/><line x1="109" y1="330" x2="184" y2="339"/>
        <line x1="184" y1="339" x2="259" y2="348"/><line x1="259" y1="348" x2="334" y2="356"/>
        <line x1="334" y1="356" x2="409" y2="410"/><line x1="409" y1="410" x2="484" y2="426"/>
      </g>
      <rect x="24" y="300" width="20" height="20" rx="5" fill="#0067c0"/>
      <g fill="#ffffff" stroke="#59636e" stroke-width="3">
        <rect x="102" y="323" width="14" height="14" rx="4"/><rect x="177" y="332" width="14" height="14" rx="4"/>
        <rect x="252" y="341" width="14" height="14" rx="4"/><rect x="327" y="349" width="14" height="14" rx="4"/>
        <rect x="402" y="403" width="14" height="14" rx="4"/><rect x="477" y="419" width="14" height="14" rx="4"/>
      </g>
    </g>
  </g>
</svg>
