<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Multi-provider LLM gateway thumbnail</title><desc id="desc">A minimal logo-style thumbnail for an article on building a Python gateway that routes LLM requests across multiple providers with retries and automatic fallback.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="40" font-weight="600" fill="#59636e">One interface, many LLM providers</text><text x="90" y="392" font-size="150" font-weight="700" fill="#1b1f24">Gateway</text><rect x="100" y="424" width="420" height="12" rx="6" fill="#0067c0" /><text x="98" y="506" font-size="35" font-weight="500" fill="#59636e">route &#183; retry &#183; fall back</text></g><g transform="translate(780 190)" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="0" y="108" width="90" height="44" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="3" /><text x="45" y="136" font-size="18" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e" text-anchor="middle">APP</text><path d="M90 130H140" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="140" y="90" width="112" height="80" rx="14" fill="#ffffff" stroke="#1b1f24" stroke-width="4" /><text x="196" y="136" font-size="17" font-weight="600" fill="#1b1f24" text-anchor="middle">GATEWAY</text><path d="M252 108C288 108 288 60 322 60" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="322" y="30" width="150" height="60" rx="12" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><text x="397" y="58" font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e" text-anchor="middle">aurora</text><text x="397" y="78" font-size="14" fill="#9199a3" text-anchor="middle">retries, then falls back</text><path d="M252 152C288 152 288 200 322 200" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><rect x="322" y="170" width="150" height="60" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="397" y="198" font-size="19" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0067c0" text-anchor="middle">borealis</text><text x="397" y="218" font-size="14" fill="#59636e" text-anchor="middle">serves the fallback</text></g></svg>