<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Python lambda functions thumbnail</title><desc id="desc">A minimal logo-style thumbnail for an article on Python lambda functions, showing a def block shrinking into a one-line lambda.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="40" font-weight="600" fill="#59636e">Anonymous functions, one expression at a time</text><text x="90" y="392" font-size="150" font-weight="700" fill="#1b1f24">lambda</text><rect x="100" y="424" width="420" height="12" rx="6" fill="#0067c0" /><text x="98" y="506" font-size="35" font-weight="500" fill="#59636e">sorted · map · filter · apply</text></g><g transform="translate(760 150)"><rect x="0" y="0" width="330" height="150" rx="16" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="26"><text x="20" y="46" fill="#c7ccd2">def</text><text x="90" y="46" fill="#1b1f24">square(x):</text><text x="20" y="94" fill="#c7ccd2">return</text><text x="164" y="94" fill="#1b1f24">x * x</text></g><line x1="20" y1="37" x2="66" y2="37" stroke="#c94f4f" stroke-width="3" /><line x1="20" y1="85" x2="150" y2="85" stroke="#c94f4f" stroke-width="3" /><path d="M165 174V226" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" /><path d="M143 204L165 232L187 204" fill="none" stroke="#0067c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="0" y="248" width="330" height="86" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="20" y="300" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="27" fill="#0067c0">lambda x: x * x</text></g></svg>