<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">matplotlib as the base engine, with seaborn, pandas, and plotly as layers on top</title><desc id="desc">Diagram showing matplotlib as the base drawing engine at the bottom. Seaborn and pandas' plot method sit above it as convenience layers that both draw through matplotlib and hand back a matplotlib Axes. Plotly sits to the side as an independent interactive layer for hover, zoom, and web embedding, used when a static image is not enough.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="380" y="56" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">STATIC IMAGE STACK</text><text x="1000" y="56" font-size="28" font-weight="600" fill="#0067c0" text-anchor="middle">INTERACTIVE</text><rect x="90" y="88" width="290" height="86" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="235" y="123" font-size="26" font-weight="600" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">seaborn</text><text x="235" y="152" font-size="18" fill="#59636e" text-anchor="middle">statistical smarts</text><rect x="400" y="88" width="290" height="86" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="545" y="123" font-size="26" font-weight="600" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">pandas .plot()</text><text x="545" y="152" font-size="18" fill="#59636e" text-anchor="middle">quick convenience</text><path d="M235 174V218" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M235 218L222 200M235 218L248 200" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M545 174V218" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M545 218L532 200M545 218L558 200" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><rect x="90" y="228" width="600" height="120" rx="16" fill="#0067c0" /><text x="390" y="278" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">matplotlib</text><text x="390" y="312" font-size="19" fill="#e3f0fa" text-anchor="middle">the drawing engine — Figure and Axes</text><path d="M390 348V392" fill="none" stroke="#59636e" stroke-width="5" stroke-linecap="round" /><path d="M390 392L377 374M390 392L403 374" fill="none" stroke="#59636e" stroke-width="5" stroke-linecap="round" /><rect x="270" y="398" width="240" height="70" rx="12" fill="#ffffff" stroke="#59636e" stroke-width="3" /><text x="390" y="440" font-size="22" font-weight="600" fill="#1b1f24" text-anchor="middle">static PNG / SVG</text><rect x="860" y="88" width="270" height="260" rx="16" fill="#ffffff" stroke="#0067c0" stroke-width="3" stroke-dasharray="10 8" /><text x="995" y="200" font-size="30" font-weight="700" fill="#1b1f24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">plotly</text><text x="995" y="234" font-size="19" fill="#59636e" text-anchor="middle">hover · zoom · web embed</text><text x="600" y="500" font-size="21" fill="#59636e" text-anchor="middle">Seaborn and pandas both hand back a matplotlib Axes — plotly renders its own interactive figure instead.</text></g></svg>