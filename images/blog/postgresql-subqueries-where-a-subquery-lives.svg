<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Where a subquery can live in a PostgreSQL query</title><desc id="desc">Diagram showing the three places a subquery can live in PostgreSQL: inside WHERE as a scalar value or a list, and inside FROM as a table, with a note that any of the three can additionally be correlated to the outer query's current row.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="196" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">WHERE &#183; SCALAR</text><text x="600" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">WHERE &#183; LIST</text><text x="1004" y="56" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">FROM &#183; TABLE</text><rect x="46" y="86" width="300" height="300" rx="18" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><rect x="450" y="86" width="300" height="300" rx="18" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><rect x="854" y="86" width="300" height="300" rx="18" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19"><text x="72" y="126" fill="#59636e">WHERE price &gt;</text><rect x="72" y="146" width="248" height="60" rx="12" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="94" y="182" fill="#1b1f24">(SELECT AVG(...))</text><circle cx="196" cy="266" r="34" fill="#ffffff" stroke="#0067c0" stroke-width="4" /><text x="196" y="273" fill="#0067c0" text-anchor="middle" font-size="17">1 val</text><text x="72" y="352" fill="#59636e" font-size="17">one row, one column</text></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19"><text x="476" y="126" fill="#59636e">WHERE id IN</text><rect x="476" y="146" width="248" height="60" rx="12" fill="#fdeede" stroke="#0067c0" stroke-width="3" /><text x="498" y="182" fill="#1b1f24">(SELECT id ...)</text><rect x="536" y="242" width="30" height="30" rx="6" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><rect x="576" y="242" width="30" height="30" rx="6" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><rect x="616" y="242" width="30" height="30" rx="6" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><rect x="536" y="282" width="30" height="30" rx="6" fill="#ffffff" stroke="#c7ccd2" stroke-width="3" /><text x="476" y="352" fill="#59636e" font-size="17">many rows, one column</text></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="19"><text x="880" y="126" fill="#59636e">JOIN (...) AS t</text><rect x="880" y="146" width="248" height="60" rx="12" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="902" y="182" fill="#1b1f24">(SELECT genre...)</text><rect x="880" y="242" width="248" height="70" rx="10" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><line x1="880" y1="266" x2="1128" y2="266" stroke="#c7ccd2" stroke-width="2" /><line x1="1004" y1="242" x2="1004" y2="312" stroke="#c7ccd2" stroke-width="2" /><text x="880" y="352" fill="#59636e" font-size="17">many rows, many columns</text></g></g><rect x="46" y="420" width="1108" height="100" rx="18" fill="#ffffff" stroke="#c7ccd2" stroke-width="2" stroke-dasharray="8 6" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22"><text x="80" y="460" fill="#1b1f24" font-weight="600">STANDALONE</text><text x="80" y="490" fill="#59636e" font-size="18">runs once, independent of the outer query</text><path d="M600 470H660" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M648 458 L662 470 L648 482" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="700" y="460" fill="#1b1f24" font-weight="600">CORRELATED</text><text x="700" y="490" fill="#59636e" font-size="18">re-evaluated once per outer row</text></g></svg>