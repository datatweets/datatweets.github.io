<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Matplotlib chart polish thumbnail</title><desc id="desc">A minimal logo-style thumbnail for an article on turning a default matplotlib chart into a polished one, with a small schematic bar chart showing three bars in a deliberate blue, amber, and green palette with a direct annotation.</desc><rect width="1200" height="675" fill="#f7f8fa" /><rect x="42" y="42" width="1116" height="591" rx="28" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="94" y="150" font-size="38" font-weight="600" fill="#59636e">Make your matplotlib charts</text><text x="90" y="392" font-size="150" font-weight="700" fill="#1b1f24">polish</text><rect x="100" y="424" width="420" height="12" rx="6" fill="#0067c0" /><text x="98" y="506" font-size="33" font-weight="500" fill="#59636e">chart junk &#183; palette &#183; dpi</text></g><g transform="translate(730 190)" font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><line x1="0" y1="270" x2="360" y2="270" stroke="#1b1f24" stroke-width="3" stroke-linecap="round" /><rect x="20" y="150" width="70" height="120" rx="6" fill="#0067c0" /><text x="55" y="138" font-size="22" font-weight="700" fill="#1b1f24" text-anchor="middle">3,701</text><rect x="145" y="146" width="70" height="124" rx="6" fill="#c76b28" /><text x="180" y="134" font-size="22" font-weight="700" fill="#1b1f24" text-anchor="middle">3,733</text><rect x="270" y="90" width="70" height="180" rx="6" fill="#2f7d4f" /><text x="305" y="78" font-size="22" font-weight="700" fill="#1b1f24" text-anchor="middle">5,076</text><path d="M400 130 L340 100" fill="none" stroke="#59636e" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8" /><rect x="398" y="70" width="230" height="72" rx="12" fill="#ffffff" stroke="#c7ccd2" stroke-width="2" /><text x="416" y="98" font-size="19" font-weight="700" fill="#1b1f24">+1,359 g heavier</text><text x="416" y="122" font-size="17" fill="#59636e">than the other two</text></g></svg>
