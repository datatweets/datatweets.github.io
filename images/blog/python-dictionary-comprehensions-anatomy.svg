<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Anatomy of a dictionary comprehension</title><desc id="desc">Diagram labeling the four parts of the dictionary comprehension expression t[name]: t[replacement_cost] for t in catalog if t[category] == power and t[replacement_cost] &gt; 100 &#8212; the key expression t[name], the value expression t[replacement_cost], the iteration source for t in catalog, and the optional filter if t[category] == power and t[replacement_cost] &gt; 100.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="600" y="56" font-size="26" font-weight="600" fill="#59636e" text-anchor="middle">ANATOMY OF A DICTIONARY COMPREHENSION</text></g><text x="70" y="150" font-size="48" font-weight="700" fill="#c7ccd2" font-family="'SFMono-Regular', Consolas, Menlo, monospace">{</text><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="26"><rect x="118" y="104" width="222" height="52" rx="10" fill="#e3f0fa" stroke="#0067c0" stroke-width="3" /><text x="229" y="139" fill="#1b1f24" text-anchor="middle">t["name"]</text><text x="358" y="140" font-size="34" font-weight="700" fill="#1b1f24" text-anchor="middle">:</text><rect x="382" y="104" width="392" height="52" rx="10" fill="#e6f4e6" stroke="#0067c0" stroke-width="3" /><text x="578" y="139" fill="#1b1f24" text-anchor="middle">t["replacement_cost"]</text></g><text x="1112" y="150" font-size="48" font-weight="700" fill="#c7ccd2" font-family="'SFMono-Regular', Consolas, Menlo, monospace">}</text><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#0067c0"><text x="229" y="182" text-anchor="middle">KEY EXPRESSION</text><text x="578" y="182" text-anchor="middle">VALUE EXPRESSION</text></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="26"><rect x="440" y="234" width="320" height="52" rx="10" fill="#fdeede" stroke="#0067c0" stroke-width="3" /><text x="600" y="269" fill="#1b1f24" text-anchor="middle">for t in catalog</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#0067c0"><text x="600" y="312" text-anchor="middle">ITERATION SOURCE</text></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24"><rect x="128" y="364" width="944" height="52" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="3" stroke-dasharray="6 6" /><text x="600" y="398" fill="#1b1f24" text-anchor="middle">if t["category"] == "power" and t["replacement_cost"] &gt; 100</text></g><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#0067c0"><text x="600" y="442" text-anchor="middle">OPTIONAL FILTER</text></g><path d="M600 460V488" fill="none" stroke="#1b1f24" stroke-width="4" stroke-linecap="round" /><path d="M588 478L600 490L612 478" fill="none" stroke="#1b1f24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24"><rect x="300" y="496" width="600" height="48" rx="10" fill="#1b1f24" /><text x="600" y="528" fill="#ffffff" text-anchor="middle">{'cordless drill': 129.0, 'tile saw': 150.0}</text></g></svg>