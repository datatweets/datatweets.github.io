<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The request-response round trip for a Python API call</title><desc id="desc">Diagram of an API round trip: Python code sends a GET request with query parameters latitude=52.52, longitude=13.41, and current_weather=true to a server, the server returns a 200 status code with a JSON body containing current_weather temperature 21.5 and windspeed 21.1, and Python code reads that JSON back.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="130" y="88" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">YOUR CODE</text><text x="600" y="100" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">1. REQUEST</text><text x="1070" y="88" font-size="26" font-weight="600" fill="#0067c0" text-anchor="middle">SERVER</text><text x="600" y="300" font-size="24" font-weight="600" fill="#0067c0" text-anchor="middle">2. RESPONSE (JSON)</text><rect x="40" y="110" width="180" height="360" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="130" y="278" font-size="22" font-weight="600" fill="#1b1f24" text-anchor="middle">your code</text><text x="130" y="306" font-size="15" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#59636e" text-anchor="middle">requests.get(...)</text><rect x="300" y="120" width="600" height="90" rx="14" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="324" y="155" font-size="18" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#1b1f24">GET /v1/forecast</text><text x="324" y="184" font-size="16" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0067c0">?latitude=52.52&amp;longitude=13.41&amp;current_weather=true</text><rect x="980" y="110" width="180" height="360" rx="16" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="1070" y="278" font-size="20" font-weight="600" fill="#1b1f24" text-anchor="middle">open-meteo.com</text><text x="1070" y="306" font-size="15" fill="#59636e" text-anchor="middle">API server</text><rect x="300" y="320" width="600" height="150" rx="14" fill="#ffffff" stroke="#d0d5db" stroke-width="3" /><rect x="324" y="336" width="76" height="36" rx="9" fill="#e3f0fa" stroke="#0067c0" stroke-width="2" /><text x="362" y="360" font-size="18" font-weight="700" fill="#0067c0" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace">200</text><g font-size="17" font-family="'SFMono-Regular', Consolas, Menlo, monospace"><text x="410" y="360" fill="#1b1f24">"current_weather"<tspan fill="#59636e">: {</tspan></text><text x="340" y="392" fill="#1b1f24">"temperature"<tspan fill="#59636e">:</tspan><tspan fill="#0067c0">21.5</tspan><tspan fill="#59636e">,</tspan></text><text x="340" y="420" fill="#1b1f24">"windspeed"<tspan fill="#59636e">:</tspan><tspan fill="#0067c0">21.1</tspan></text><text x="324" y="448" fill="#59636e">}</text></g><path d="M220 165H292" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M278 151L294 165L278 179" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M908 165H972" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" /><path d="M958 151L974 165L958 179" fill="none" stroke="#0067c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M972 395H908" fill="none" stroke="#59636e" stroke-width="5" stroke-linecap="round" /><path d="M922 381L906 395L922 409" fill="none" stroke="#59636e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M292 395H228" fill="none" stroke="#59636e" stroke-width="5" stroke-linecap="round" /><path d="M242 381L226 395L242 409" fill="none" stroke="#59636e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>