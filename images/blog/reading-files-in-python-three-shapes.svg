<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Three file shapes and the Python tool for each</title><desc id="desc">Diagram showing three file shapes and the Python tool for each: a plain text file of stacked lines is read with open() into a string, a CSV file of rows and columns is read with the csv module into a list of dicts, and a JSON file of nested braces and brackets is read with the json module into a nested dict.</desc><rect width="1200" height="560" fill="#f7f8fa" /><g font-family="Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600" fill="#0067c0" text-anchor="middle"><text x="185" y="56" font-size="26">FILE SHAPE</text><text x="600" y="56" font-size="26">PYTHON TOOL</text><text x="1015" y="56" font-size="26">RESULT</text></g><line x1="60" y1="96" x2="1140" y2="96" stroke="#e3e6ea" stroke-width="2" /><line x1="60" y1="240" x2="1140" y2="240" stroke="#e3e6ea" stroke-width="2" /><line x1="60" y1="384" x2="1140" y2="384" stroke="#e3e6ea" stroke-width="2" /><line x1="60" y1="528" x2="1140" y2="528" stroke="#e3e6ea" stroke-width="2" /><g font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="90" y="128" width="190" height="84" rx="12" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g stroke="#7fb0d8" stroke-width="5" stroke-linecap="round"><line x1="112" y1="150" x2="258" y2="150" /><line x1="112" y1="170" x2="240" y2="170" /><line x1="112" y1="190" x2="252" y2="190" /></g><text x="185" y="230" font-size="19" fill="#59636e" text-anchor="middle">print_log.txt</text><path d="M290 170H430" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M420 160L434 170L420 180" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="450" y="140" width="300" height="60" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="600" y="178" font-size="26" fill="#0067c0" text-anchor="middle">open()</text><path d="M760 170H900" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M890 160L904 170L890 180" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="920" y="140" width="190" height="60" rx="12" fill="#e3f0fa" stroke="#7fb0d8" stroke-width="3" /><text x="1015" y="178" font-size="24" fill="#1b1f24" text-anchor="middle">str</text></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="90" y="272" width="190" height="84" rx="12" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><g stroke="#8fbc8f" stroke-width="3"><line x1="140" y1="284" x2="140" y2="344" /><line x1="185" y1="284" x2="185" y2="344" /><line x1="230" y1="284" x2="230" y2="344" /><line x1="112" y1="300" x2="258" y2="300" /><line x1="112" y1="322" x2="258" y2="322" /></g><rect x="112" y="284" width="146" height="60" rx="4" fill="none" stroke="#8fbc8f" stroke-width="3" /><text x="185" y="374" font-size="19" fill="#59636e" text-anchor="middle">filament_inventory.csv</text><path d="M290 314H430" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M420 304L434 314L420 324" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="450" y="284" width="300" height="60" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="600" y="322" font-size="22" fill="#0067c0" text-anchor="middle">csv.DictReader</text><path d="M760 314H900" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M890 304L904 314L890 324" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="920" y="284" width="190" height="60" rx="12" fill="#e6f4e6" stroke="#8fbc8f" stroke-width="3" /><text x="1015" y="322" font-size="21" fill="#1b1f24" text-anchor="middle">list[dict]</text></g><g font-family="'SFMono-Regular', Consolas, Menlo, monospace"><rect x="90" y="416" width="190" height="84" rx="12" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" /><text x="120" y="472" font-size="40" font-weight="700" fill="#e0b184">{</text><text x="152" y="460" font-size="18" fill="#e0b184">•••</text><text x="152" y="480" font-size="18" fill="#e0b184">[•••]</text><text x="230" y="472" font-size="40" font-weight="700" fill="#e0b184">}</text><text x="185" y="518" font-size="19" fill="#59636e" text-anchor="middle">printer_settings.json</text><path d="M290 458H430" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M420 448L434 458L420 468" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="450" y="428" width="300" height="60" rx="12" fill="#ffffff" stroke="#0067c0" stroke-width="3" /><text x="600" y="466" font-size="24" fill="#0067c0" text-anchor="middle">json.load()</text><path d="M760 458H900" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" /><path d="M890 448L904 458L890 468" fill="none" stroke="#c7ccd2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="920" y="428" width="190" height="60" rx="12" fill="#fdeede" stroke="#e0b184" stroke-width="3" /><text x="1015" y="466" font-size="24" fill="#1b1f24" text-anchor="middle">dict</text></g></svg>