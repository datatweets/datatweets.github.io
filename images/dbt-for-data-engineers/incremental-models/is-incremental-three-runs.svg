<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>The same model file, three genuinely different compiled queries</title>
  <desc>Three panels showing the same int_trips_full_incremental model across three runs. Panel 1, target doesn't exist: is_incremental() is False, compiled SQL has no where clause, full build, 6.46 seconds, 9,554,778 rows. Panel 2, target exists, no new data: is_incremental() is True, a where pickup_time greater than max pickup_time clause appears, INSERT 0 0 in 1.78 seconds. Panel 3, --full-refresh passed: is_incremental() forced back to False, full rebuild again, 7.49 seconds, 9,554,778 rows. A caption states the identical .sql file compiles to three different queries depending on checkable conditions, not three different files.</desc>
  <rect width="1080" height="400" fill="#ffffff" />
  <text x="540" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The Same File, Three Genuinely Different Compiled Queries</text>

  <rect x="30" y="60" width="320" height="260" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" />
  <text x="190" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#2c5282">Run 1: target doesn't exist</text>
  <text x="190" y="108" text-anchor="middle" font-size="10" font-family="Menlo, monospace" fill="#2c5282">is_incremental() = False</text>
  <rect x="50" y="120" width="280" height="55" rx="6" fill="#2c5282" />
  <text x="190" y="142" text-anchor="middle" font-size="9" font-family="Menlo, monospace" fill="#ebf8ff">select ... from stg_cityflow</text>
  <text x="190" y="160" text-anchor="middle" font-size="9" fill="#ebf8ff">(no where clause at all)</text>
  <text x="190" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5282">6.46s</text>
  <text x="190" y="220" text-anchor="middle" font-size="10" fill="#2c5282">9,554,778 rows built</text>
  <text x="190" y="245" text-anchor="middle" font-size="8.5" fill="#4a5568">same cost as Lesson 1's</text>
  <text x="190" y="260" text-anchor="middle" font-size="8.5" fill="#4a5568">plain materialized='table'</text>

  <rect x="380" y="60" width="320" height="260" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" />
  <text x="540" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#22543d">Run 2: target exists, no new data</text>
  <text x="540" y="108" text-anchor="middle" font-size="10" font-family="Menlo, monospace" fill="#22543d">is_incremental() = True</text>
  <rect x="400" y="120" width="280" height="70" rx="6" fill="#22543d" />
  <text x="540" y="140" text-anchor="middle" font-size="8.5" font-family="Menlo, monospace" fill="#f0fff4">select ... from stg_cityflow</text>
  <text x="540" y="156" text-anchor="middle" font-size="8" font-family="Menlo, monospace" fill="#f0fff4">where pickup_time &gt;</text>
  <text x="540" y="170" text-anchor="middle" font-size="8" font-family="Menlo, monospace" fill="#f0fff4">(select max(pickup_time) from this)</text>
  <text x="540" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#22543d">1.78s</text>
  <text x="540" y="235" text-anchor="middle" font-size="10" fill="#22543d">INSERT 0 0 -- correctly nothing</text>
  <text x="540" y="260" text-anchor="middle" font-size="8.5" fill="#4a5568">temp table + insert, not a rebuild</text>

  <rect x="730" y="60" width="320" height="260" rx="10" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.6" />
  <text x="890" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#822727">Run 3: --full-refresh passed</text>
  <text x="890" y="108" text-anchor="middle" font-size="10" font-family="Menlo, monospace" fill="#822727">is_incremental() forced False</text>
  <rect x="750" y="120" width="280" height="55" rx="6" fill="#822727" />
  <text x="890" y="142" text-anchor="middle" font-size="9" font-family="Menlo, monospace" fill="#fff5f5">select ... from stg_cityflow</text>
  <text x="890" y="160" text-anchor="middle" font-size="9" fill="#fff5f5">(where clause removed again)</text>
  <text x="890" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#822727">7.49s</text>
  <text x="890" y="220" text-anchor="middle" font-size="10" fill="#822727">9,554,778 rows rebuilt</text>
  <text x="890" y="245" text-anchor="middle" font-size="8.5" fill="#4a5568">deliberate full rebuild,</text>
  <text x="890" y="260" text-anchor="middle" font-size="8.5" fill="#4a5568">back to Run 1's own cost</text>

  <text x="540" y="355" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">One .sql file, three different compiled queries -- depending only on checkable conditions, confirmed with dbt compile.</text>

</svg>
