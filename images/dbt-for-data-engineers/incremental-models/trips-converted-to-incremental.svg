<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="420" viewBox="0 0 1060 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>CityFlow's own fact table, 118 times larger, converted to incremental</title>
  <desc>Before and after diagram. Before: trips.sql, a plain view, 81,013 rows, single day, Module 5's own original build. After: trips.sql, materialized incremental with unique_key trip_id and strategy merge, sourced from the full 9,554,778-row history. A timing panel shows the first build at 13.10 seconds, a second no-op run at 3.44 seconds, and a --full-refresh run back at 14.67 seconds. A dependent panel shows int_trips_pivoted_by_borough still building correctly against the new source, 2,190 hourly buckets across three months instead of 24 across one day, the identical 9,554,778 trips accounted for.</desc>
  <rect width="1060" height="420" fill="#ffffff" />
  <text x="530" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">CityFlow's Fact Table, 118x Larger, Converted to Incremental</text>

  <rect x="30" y="55" width="460" height="100" rx="10" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.4" />
  <text x="260" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">Before (Module 5)</text>
  <text x="260" y="100" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">trips.sql -- plain view</text>
  <text x="260" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#4a5568">81,013 rows -- single day</text>
  <text x="260" y="136" text-anchor="middle" font-size="8.5" fill="#4a5568">joined against zones</text>

  <rect x="570" y="55" width="460" height="100" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" />
  <text x="800" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#22543d">After (Module 7 Lesson 5)</text>
  <text x="800" y="100" text-anchor="middle" font-size="9" font-family="Menlo, monospace" fill="#22543d">materialized=incremental, unique_key=trip_id</text>
  <text x="800" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#22543d">9,554,778 rows -- 3 months</text>
  <text x="800" y="136" text-anchor="middle" font-size="8.5" fill="#22543d">same join against zones, 118x the data</text>

  <rect x="30" y="170" width="1000" height="130" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" />
  <text x="530" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#2c5282">Measured build times</text>
  <rect x="55" y="205" width="290" height="75" rx="6" fill="#2c5282" />
  <text x="200" y="228" text-anchor="middle" font-size="10" font-weight="700" fill="#ebf8ff">First build</text>
  <text x="200" y="248" text-anchor="middle" font-size="14" font-weight="700" font-family="Menlo, monospace" fill="#ebf8ff">13.10s</text>
  <text x="200" y="266" text-anchor="middle" font-size="8" fill="#ebf8ff">all 9,554,778 rows</text>
  <rect x="385" y="205" width="290" height="75" rx="6" fill="#2f855a" />
  <text x="530" y="228" text-anchor="middle" font-size="10" font-weight="700" fill="#f0fff4">No-op run</text>
  <text x="530" y="248" text-anchor="middle" font-size="14" font-weight="700" font-family="Menlo, monospace" fill="#f0fff4">3.44s</text>
  <text x="530" y="266" text-anchor="middle" font-size="8" fill="#f0fff4">MERGE 0 -- 3-4x faster</text>
  <rect x="715" y="205" width="290" height="75" rx="6" fill="#744210" />
  <text x="860" y="228" text-anchor="middle" font-size="10" font-weight="700" fill="#fffaf0">--full-refresh</text>
  <text x="860" y="248" text-anchor="middle" font-size="14" font-weight="700" font-family="Menlo, monospace" fill="#fffaf0">14.67s</text>
  <text x="860" y="266" text-anchor="middle" font-size="8" fill="#fffaf0">back to full cost, on demand</text>

  <rect x="130" y="315" width="800" height="85" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" />
  <text x="530" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#553c9a">int_trips_pivoted_by_borough -- the only real downstream dependent</text>
  <text x="530" y="360" text-anchor="middle" font-size="9.5" fill="#553c9a">2,190 hourly buckets (3 months) instead of 24 (1 day) -- no .sql file changed</text>
  <text x="530" y="380" text-anchor="middle" font-size="9.5" font-weight="700" fill="#553c9a">sum(trips_total) = 9,554,778 -- confirmed correct against the new, larger source</text>
</svg>
