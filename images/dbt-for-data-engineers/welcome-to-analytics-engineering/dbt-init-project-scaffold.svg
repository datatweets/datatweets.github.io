<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>dbt init scaffolds a real project -- then the unused example gets cleaned up</title>
  <desc>dbt init cityflow_warehouse creates a real directory structure: a .gitignore, README.md, an empty analyses folder, dbt_project.yml, an empty macros folder, a models/example folder containing two starter SQL files and a schema.yml, empty seeds, snapshots, and tests folders. Two changes turn this generic scaffold into CityFlow's own project: models/example is deleted, since it is dbt's own generic starter and not CityFlow data, and the now-stale example configuration block inside dbt_project.yml is removed, clearing a real WARNING that Configuration paths exist which do not apply to any resources. The result is a clean project with only a project-wide materialized view default and no leftover configuration pointing at a folder that no longer exists.</desc>
  <rect width="1100" height="440" fill="#ffffff" />
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">dbt init's Real Output, Then Cleaned Up</text>

  <!-- left: raw scaffold -->
  <rect x="50" y="55" width="460" height="330" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" />
  <text x="280" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">dbt init cityflow_warehouse</text>
  <text x="280" y="98" text-anchor="middle" font-size="9.5" fill="#718096">--skip-profile-setup</text>

  <text x="75" y="122" font-size="10.5" font-family="Menlo, monospace" fill="#4a5568">.gitignore</text>
  <text x="75" y="140" font-size="10.5" font-family="Menlo, monospace" fill="#4a5568">README.md</text>
  <text x="75" y="158" font-size="10.5" font-family="Menlo, monospace" fill="#4a5568">analyses/.gitkeep</text>
  <text x="75" y="176" font-size="10.5" font-family="Menlo, monospace" fill="#2b6cb0" font-weight="700">dbt_project.yml</text>
  <text x="75" y="194" font-size="10.5" font-family="Menlo, monospace" fill="#4a5568">macros/.gitkeep</text>

  <rect x="65" y="204" width="420" height="70" rx="6" fill="#fed7d7" stroke="#e53e3e" stroke-width="1.3" />
  <text x="75" y="222" font-size="10.5" font-family="Menlo, monospace" fill="#822727" font-weight="700">models/example/</text>
  <text x="95" y="240" font-size="9.5" font-family="Menlo, monospace" fill="#822727">my_first_dbt_model.sql</text>
  <text x="95" y="256" font-size="9.5" font-family="Menlo, monospace" fill="#822727">my_second_dbt_model.sql</text>
  <text x="95" y="272" font-size="9.5" font-family="Menlo, monospace" fill="#822727">schema.yml</text>

  <text x="75" y="298" font-size="10.5" font-family="Menlo, monospace" fill="#4a5568">seeds/.gitkeep</text>
  <text x="75" y="316" font-size="10.5" font-family="Menlo, monospace" fill="#4a5568">snapshots/.gitkeep</text>
  <text x="75" y="334" font-size="10.5" font-family="Menlo, monospace" fill="#4a5568">tests/.gitkeep</text>

  <text x="280" y="365" text-anchor="middle" font-size="9.5" fill="#822727">generic starter files, not CityFlow's own data</text>

  <path d="M510,220 L620,220" stroke="#a0aec0" stroke-width="2" fill="none" marker-end="url(#pf1)" />
  <text x="565" y="210" text-anchor="middle" font-size="9" fill="#718096">clean up</text>

  <!-- right: cleaned project -->
  <rect x="620" y="55" width="430" height="330" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" />
  <text x="835" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#22543d">CityFlow's Actual Project</text>
  <text x="835" y="98" text-anchor="middle" font-size="9.5" fill="#22543d">after two real changes</text>

  <text x="645" y="122" font-size="10.5" font-family="Menlo, monospace" fill="#22543d">.gitignore</text>
  <text x="645" y="140" font-size="10.5" font-family="Menlo, monospace" fill="#22543d">README.md</text>
  <text x="645" y="158" font-size="10.5" font-family="Menlo, monospace" fill="#22543d">analyses/.gitkeep</text>
  <text x="645" y="176" font-size="10.5" font-family="Menlo, monospace" fill="#22543d" font-weight="700">dbt_project.yml</text>
  <text x="665" y="192" font-size="9" font-family="Menlo, monospace" fill="#38a169">+materialized: view (only)</text>
  <text x="645" y="210" font-size="10.5" font-family="Menlo, monospace" fill="#22543d">macros/.gitkeep</text>
  <text x="645" y="228" font-size="10.5" font-family="Menlo, monospace" fill="#22543d">models/  &#8592; hello_cityflow.sql lands here, Lesson 4</text>
  <text x="645" y="246" font-size="10.5" font-family="Menlo, monospace" fill="#22543d">seeds/.gitkeep</text>
  <text x="645" y="264" font-size="10.5" font-family="Menlo, monospace" fill="#22543d">snapshots/.gitkeep</text>
  <text x="645" y="282" font-size="10.5" font-family="Menlo, monospace" fill="#22543d">tests/.gitkeep</text>

  <rect x="645" y="300" width="380" height="65" rx="6" fill="#22543d" />
  <text x="835" y="320" text-anchor="middle" font-size="9" font-family="Menlo, monospace" fill="#f0fff4">WARNING: Configuration paths exist in</text>
  <text x="835" y="335" text-anchor="middle" font-size="9" font-family="Menlo, monospace" fill="#f0fff4">dbt_project.yml which do not apply to any</text>
  <text x="835" y="350" text-anchor="middle" font-size="9" font-weight="700" font-family="Menlo, monospace" fill="#f0fff4">resources -- gone, once example: is removed</text>

  <text x="550" y="415" text-anchor="middle" font-size="10.5" fill="#4a5568">dbt init generates real, current-version defaults every time -- not a hand-typed example a course book happened to freeze in place.</text>

  <defs>
    <marker id="pf1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
