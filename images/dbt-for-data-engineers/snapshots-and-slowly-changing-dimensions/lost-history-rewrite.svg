<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>5,739 real trips, silently reassigned to a borough they never occurred in</title>
  <desc>A before-and-after diagram. Before: zone 65, Downtown Brooklyn/MetroTech, borough Brooklyn, 5,739 trips already recorded. A real UPDATE reassigns it to Queens. After an ordinary dbt run, trips still reports Brooklyn for these rows, since the now-incremental model has no reason to revisit already-built rows. After --full-refresh, all 5,739 trips retroactively report Queens -- Brooklyn's own project-wide total falls from 97,219 to 91,480, Queens rises from 837,886 to 843,625, and no table anywhere in the project retains any record that Brooklyn was ever the answer for zone 65.</desc>
  <rect width="1080" height="420" fill="#ffffff" />
  <text x="540" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">5,739 Trips, Silently Reassigned to a Borough They Never Occurred In</text>

  <rect x="30" y="55" width="300" height="95" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.4" />
  <text x="180" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">Before</text>
  <text x="180" y="100" text-anchor="middle" font-size="9.5" fill="#4a5568">Zone 65: Downtown Brooklyn/MetroTech</text>
  <text x="180" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#22543d">borough = Brooklyn</text>
  <text x="180" y="136" text-anchor="middle" font-size="9" fill="#4a5568">5,739 trips already recorded</text>

  <path d="M335,102 L375,102" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#lh1)" />
  <text x="355" y="90" text-anchor="middle" font-size="8" fill="#4a5568">UPDATE</text>

  <rect x="380" y="55" width="300" height="95" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="530" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#7b341e">raw.zones, now</text>
  <text x="530" y="100" text-anchor="middle" font-size="9.5" fill="#7b341e">Zone 65: Downtown Brooklyn/MetroTech</text>
  <text x="530" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#7b341e">borough = Queens</text>
  <text x="530" y="136" text-anchor="middle" font-size="9" fill="#7b341e">same 5,739 trips, untouched so far</text>

  <rect x="730" y="55" width="320" height="95" rx="8" fill="#f7fafc" stroke="#718096" stroke-width="1.4" />
  <text x="890" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">Ordinary dbt run</text>
  <text x="890" y="100" text-anchor="middle" font-size="9.5" fill="#2d3748">trips: still reports Brooklyn</text>
  <text x="890" y="120" text-anchor="middle" font-size="8.5" fill="#4a5568">incremental -- no new trip_ids,</text>
  <text x="890" y="135" text-anchor="middle" font-size="8.5" fill="#4a5568">existing rows never revisited</text>

  <path d="M540,150 L540,185" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#lh1)" />
  <text x="600" y="172" text-anchor="middle" font-size="9" font-weight="700" fill="#822727">--full-refresh</text>

  <rect x="130" y="195" width="820" height="130" rx="10" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.6" />
  <text x="540" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#822727">After: every one of zone 65's 5,739 trips retroactively becomes Queens</text>
  <rect x="160" y="235" width="350" height="70" rx="6" fill="#822727" />
  <text x="335" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#fff5f5">Brooklyn: 97,219 -&gt; 91,480</text>
  <text x="335" y="278" text-anchor="middle" font-size="10" fill="#fff5f5">down 5,739</text>
  <rect x="570" y="235" width="350" height="70" rx="6" fill="#822727" />
  <text x="745" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#fff5f5">Queens: 837,886 -&gt; 843,625</text>
  <text x="745" y="278" text-anchor="middle" font-size="10" fill="#fff5f5">up 5,739</text>

  <text x="540" y="345" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">No table anywhere in this project retains any record that Brooklyn was ever the answer.</text>
  <text x="540" y="365" text-anchor="middle" font-size="9.5" fill="#4a5568">zone_revenue and daily_summary, with no join to zones, stayed correct throughout --</text>
  <text x="540" y="382" text-anchor="middle" font-size="9.5" fill="#4a5568">the risk belongs only to models that enrich a fact with a dimension's own current attributes.</text>

  <defs>
    <marker id="lh1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
