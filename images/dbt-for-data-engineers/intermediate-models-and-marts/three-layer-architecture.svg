<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="380" viewBox="0 0 1050 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Three layers, three different jobs -- staging, intermediate, and marts</title>
  <desc>Staging: stg_cityflow__trips, one model per source table, renaming and casting only, organized by source system, never exposed to end users directly. Intermediate: int_trips_summed_to_hour, joining or reshaping staging models into a new grain -- here, trips summed up to one row per zone per hour -- organized by business area, still internal only, most often ephemeral. Marts: trips and zones, the business-facing output, entity-grained, one row per trip or one row per zone, the layer BI tools and end users actually query. An arrow shows staging feeding intermediate feeding marts, with a callout noting that CityFlow's own daily_summary mart reads from int_trips_summed_to_hour, never from staging directly -- the intermediate model's whole job is standing between the two.</desc>
  <rect width="1050" height="380" fill="#ffffff" />
  <text x="525" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Three Layers, Three Different Jobs</text>

  <rect x="30" y="60" width="300" height="270" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" />
  <text x="180" y="85" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5282">staging</text>
  <rect x="55" y="98" width="250" height="30" rx="6" fill="#2c5282" />
  <text x="180" y="118" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#ebf8ff">stg_cityflow__trips</text>
  <text x="180" y="148" text-anchor="middle" font-size="9.5" fill="#2c5282">rename &amp; cast only</text>
  <text x="180" y="166" text-anchor="middle" font-size="9.5" fill="#2c5282">one model per source table</text>
  <text x="180" y="184" text-anchor="middle" font-size="9.5" fill="#2c5282">organized by source system</text>
  <text x="180" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="#822727">never exposed to end users</text>

  <path d="M330,195 L370,195" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#tl1)" />

  <rect x="375" y="60" width="300" height="270" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" />
  <text x="525" y="85" text-anchor="middle" font-size="12.5" font-weight="700" fill="#553c9a">intermediate</text>
  <rect x="400" y="98" width="250" height="30" rx="6" fill="#553c9a" />
  <text x="525" y="118" text-anchor="middle" font-size="9" font-family="Menlo, monospace" fill="#faf5ff">int_trips_summed_to_hour</text>
  <text x="525" y="148" text-anchor="middle" font-size="9.5" fill="#553c9a">joins or reshapes staging</text>
  <text x="525" y="166" text-anchor="middle" font-size="9.5" fill="#553c9a">into a new grain -- here, one</text>
  <text x="525" y="184" text-anchor="middle" font-size="9.5" fill="#553c9a">row per zone per hour</text>
  <text x="525" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="#822727">also never exposed directly</text>

  <path d="M675,195 L715,195" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#tl1)" />

  <rect x="720" y="60" width="300" height="270" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" />
  <text x="870" y="85" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22543d">marts</text>
  <rect x="745" y="98" width="250" height="30" rx="6" fill="#22543d" />
  <text x="870" y="118" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#f0fff4">trips, zones, daily_summary</text>
  <text x="870" y="148" text-anchor="middle" font-size="9.5" fill="#22543d">entity-grained, business-ready</text>
  <text x="870" y="166" text-anchor="middle" font-size="9.5" fill="#22543d">one row per trip, per zone</text>
  <text x="870" y="184" text-anchor="middle" font-size="9.5" fill="#22543d">organized by business domain</text>
  <text x="870" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="#22543d">what BI tools actually query</text>

  <rect x="130" y="255" width="790" height="60" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="525" y="278" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7b341e">daily_summary reads from int_trips_summed_to_hour, never from staging directly --</text>
  <text x="525" y="296" text-anchor="middle" font-size="10.5" fill="#7b341e">the intermediate layer's whole job is standing between the two.</text>

  <defs>
    <marker id="tl1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
