<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Three parquet files to a verified anchor, with no copy of the data ever stored</title>
  <desc>Three real parquet files, January through March 2024, 9,554,778 rows total, read directly by raw.trips_history, a DuckDB view built on read_parquet with no data copied -- the file itself is 274 kilobytes, holding only the view definition. stg_cityflow__history__trips stages it, rename only. int_trips_quartered filters to the real quarter window, January 1st through March 31st 2024, quarantining 21 rows whose timestamps fall outside it -- the 2002 and 2009 stray dates the Scaling Python capstone's own pipeline first found. zone_hour_report aggregates the remaining 9,554,757 rows by zone and hour, producing 240,917 buckets and $256,692,373.14 in revenue -- checked to the cent against the Scaling Python capstone's own already-published anchor.</desc>
  <rect width="1100" height="440" fill="#ffffff" />
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Three Parquet Files to a Verified Anchor, No Copy Stored</text>

  <rect x="30" y="55" width="200" height="80" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.4" />
  <text x="130" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#2d3748">3 parquet files</text>
  <text x="130" y="96" text-anchor="middle" font-size="9" fill="#4a5568">Jan-Mar 2024</text>
  <text x="130" y="112" text-anchor="middle" font-size="9" font-weight="700" fill="#4a5568">9,554,778 rows</text>

  <path d="M235,95 L275,95" stroke="#a0aec0" stroke-width="2" fill="none" marker-end="url(#zh1)" />

  <rect x="280" y="55" width="220" height="80" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" />
  <text x="390" y="76" text-anchor="middle" font-size="9.5" font-weight="700" font-family="Menlo, monospace" fill="#2c5282">raw.trips_history</text>
  <text x="390" y="94" text-anchor="middle" font-size="8.5" fill="#2c5282">DuckDB VIEW over read_parquet()</text>
  <text x="390" y="110" text-anchor="middle" font-size="9" font-weight="700" fill="#22543d">no copy -- file is 274 KB</text>

  <path d="M505,95 L545,95" stroke="#a0aec0" stroke-width="2" fill="none" marker-end="url(#zh1)" />

  <rect x="550" y="55" width="230" height="80" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" />
  <text x="665" y="76" text-anchor="middle" font-size="9" font-weight="700" font-family="Menlo, monospace" fill="#553c9a">stg_cityflow_history__trips</text>
  <text x="665" y="94" text-anchor="middle" font-size="8.5" fill="#553c9a">rename only, staging convention</text>
  <text x="665" y="110" text-anchor="middle" font-size="9" fill="#553c9a">9,554,778 rows, unfiltered</text>

  <path d="M550,95 L785,95" stroke="none" />
  <path d="M780,175 L780,135" stroke="#a0aec0" stroke-width="2" fill="none" marker-end="url(#zh1)" />

  <rect x="660" y="180" width="240" height="90" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" />
  <text x="780" y="203" text-anchor="middle" font-size="9" font-weight="700" font-family="Menlo, monospace" fill="#7b341e">int_trips_quartered</text>
  <text x="780" y="221" text-anchor="middle" font-size="8.5" fill="#7b341e">keeps Jan 1 - Mar 31 2024 only</text>
  <text x="780" y="239" text-anchor="middle" font-size="9" font-weight="700" fill="#822727">21 rows quarantined</text>
  <text x="780" y="255" text-anchor="middle" font-size="8" fill="#4a5568">(the 2002/2009 stray dates)</text>

  <path d="M660,225 L610,225" stroke="#a0aec0" stroke-width="2" fill="none" marker-end="url(#zh1)" />

  <rect x="380" y="180" width="230" height="90" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" />
  <text x="495" y="203" text-anchor="middle" font-size="9" font-weight="700" font-family="Menlo, monospace" fill="#22543d">zone_hour_report</text>
  <text x="495" y="221" text-anchor="middle" font-size="8.5" fill="#22543d">group by zone, hour</text>
  <text x="495" y="239" text-anchor="middle" font-size="9" font-weight="700" fill="#22543d">9,554,757 rows in</text>
  <text x="495" y="255" text-anchor="middle" font-size="8" fill="#4a5568">count(*) trips, sum(total_amount) revenue</text>

  <path d="M495,270 L495,300" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#zh1)" />

  <rect x="230" y="305" width="640" height="110" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="2" />
  <text x="550" y="330" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22543d">Checked to the cent against the Scaling Python capstone's own anchor</text>
  <text x="550" y="358" text-anchor="middle" font-size="14" font-weight="700" font-family="Menlo, monospace" fill="#22543d">240,917 buckets</text>
  <text x="550" y="380" text-anchor="middle" font-size="14" font-weight="700" font-family="Menlo, monospace" fill="#22543d">9,554,757 trips</text>
  <text x="550" y="402" text-anchor="middle" font-size="14" font-weight="700" font-family="Menlo, monospace" fill="#22543d">$256,692,373.14 revenue</text>

  <defs>
    <marker id="zh1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
