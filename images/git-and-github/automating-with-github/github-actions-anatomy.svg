<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="360" fill="#ffffff" /><text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Anatomy of a GitHub Actions workflow</text><rect x="24" y="120" width="150" height="96" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="99" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Event</text><text x="99" y="170" text-anchor="middle" font-size="10" font-family="monospace" fill="#2c5282">push</text><text x="99" y="188" text-anchor="middle" font-size="10" font-family="monospace" fill="#2c5282">pull_request</text><text x="99" y="208" text-anchor="middle" font-size="8.5" fill="#718096">something happens</text><line x1="174" y1="168" x2="210" y2="168" stroke="#a0aec0" stroke-width="2" /><polygon points="210 168 200 163 200 173" fill="#a0aec0" /><rect x="220" y="58" width="476" height="280" rx="12" fill="#f7fafc" stroke="#9f7aea" stroke-width="1.5" /><text x="240" y="82" font-size="12" font-weight="700" fill="#6b46c1">Workflow</text><text x="304" y="82" font-size="10" font-family="monospace" fill="#805ad5">.github/workflows/ci.yml</text><rect x="240" y="94" width="436" height="226" rx="10" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.2" /><text x="258" y="116" font-size="11" font-weight="700" fill="#2d3748">Job: test</text><text x="338" y="116" font-size="9.5" font-family="monospace" fill="#718096">runs-on: ubuntu-latest</text><text x="660" y="116" text-anchor="end" font-size="8.5" font-style="italic" fill="#a0aec0">a fresh cloud machine</text><g font-size="10"><rect x="258" y="130" width="400" height="32" rx="6" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" /><circle cx="276" cy="146" r="9" fill="#9f7aea" /><text x="276" y="150" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">1</text><text x="296" y="150" fill="#2d3748">Check out the code</text><text x="648" y="150" text-anchor="end" font-family="monospace" font-size="8.5" fill="#805ad5">actions/checkout@v4</text><rect x="258" y="168" width="400" height="32" rx="6" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" /><circle cx="276" cy="184" r="9" fill="#9f7aea" /><text x="276" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">2</text><text x="296" y="188" fill="#2d3748">Set up Python</text><text x="648" y="188" text-anchor="end" font-family="monospace" font-size="8.5" fill="#805ad5">actions/setup-python@v5</text><rect x="258" y="206" width="400" height="32" rx="6" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" /><circle cx="276" cy="222" r="9" fill="#9f7aea" /><text x="276" y="226" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">3</text><text x="296" y="226" fill="#2d3748">Install dependencies</text><text x="648" y="226" text-anchor="end" font-family="monospace" font-size="8.5" fill="#805ad5">pip install pytest</text><rect x="258" y="244" width="400" height="32" rx="6" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" /><circle cx="276" cy="260" r="9" fill="#9f7aea" /><text x="276" y="264" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">4</text><text x="296" y="264" fill="#2d3748">Run tests</text><text x="648" y="264" text-anchor="end" font-family="monospace" font-size="8.5" fill="#805ad5">pytest</text></g><rect x="258" y="286" width="400" height="26" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><circle cx="278" cy="299" r="7" fill="#48bb78" /><text x="278" y="303" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">✓</text><text x="296" y="303" font-size="10" font-weight="700" fill="#276749">All checks passed</text></svg>