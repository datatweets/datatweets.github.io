<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="330" fill="#ffffff" /><text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Automating publishing with Actions</text><text x="40" y="78" font-size="11" font-weight="700" fill="#2b6cb0">GitHub Pages</text><rect x="40" y="88" width="150" height="56" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="115" y="110" text-anchor="middle" font-size="10" font-family="monospace" fill="#2c5282">push to main</text><text x="115" y="128" text-anchor="middle" font-size="8.5" fill="#718096">you update the site</text><line x1="190" y1="116" x2="224" y2="116" stroke="#a0aec0" stroke-width="2" /><polygon points="224 116 214 111 214 121" fill="#a0aec0" /><rect x="226" y="88" width="170" height="56" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="311" y="108" text-anchor="middle" font-size="10" font-weight="700" fill="#6b46c1">Actions builds &amp; deploys</text><text x="311" y="126" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#805ad5">Pages workflow</text><line x1="396" y1="116" x2="430" y2="116" stroke="#a0aec0" stroke-width="2" /><polygon points="430 116 420 111 420 121" fill="#a0aec0" /><rect x="432" y="88" width="252" height="56" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="558" y="108" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">Live website</text><text x="558" y="126" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#2f855a">username.github.io/repo</text><line x1="40" y1="170" x2="684" y2="170" stroke="#e2e8f0" stroke-width="1" /><text x="40" y="202" font-size="11" font-weight="700" fill="#c05621">Release automation</text><rect x="40" y="212" width="150" height="56" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" /><text x="115" y="234" text-anchor="middle" font-size="10" font-family="monospace" fill="#9c4221">push a tag v1.2.0</text><text x="115" y="252" text-anchor="middle" font-size="8.5" fill="#718096">you cut a version</text><line x1="190" y1="240" x2="224" y2="240" stroke="#a0aec0" stroke-width="2" /><polygon points="224 240 214 235 214 245" fill="#a0aec0" /><rect x="226" y="212" width="170" height="56" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="311" y="232" text-anchor="middle" font-size="10" font-weight="700" fill="#6b46c1">Actions runs on tag</text><text x="311" y="250" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#805ad5">on: push: tags: v*</text><line x1="396" y1="240" x2="430" y2="240" stroke="#a0aec0" stroke-width="2" /><polygon points="430 240 420 235 420 245" fill="#a0aec0" /><rect x="432" y="212" width="252" height="56" rx="9" fill="#e6fffa" stroke="#319795" stroke-width="1.4" /><text x="558" y="232" text-anchor="middle" font-size="10" font-weight="700" fill="#234e52">GitHub Release published</text><text x="558" y="250" text-anchor="middle" font-size="8.5" fill="#2c7a7b">auto-generated notes + assets</text><text x="360" y="304" text-anchor="middle" font-size="11" fill="#4a5568">A workflow can trigger on any event — a push, a new tag, even a schedule — turning a routine into one automatic step.</text></svg>