<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="340" fill="#ffffff" /><text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">One folder, one push, two jobs</text><text x="40" y="62" font-size="11" font-weight="700" fill="#4a5568">What you add to the repository</text><rect x="40" y="72" width="250" height="180" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" /><text x="58" y="98" font-size="11" font-family="monospace" fill="#2d3748">.github/</text><text x="78" y="120" font-size="11" font-family="monospace" fill="#805ad5">workflows/</text><text x="98" y="140" font-size="11" font-family="monospace" fill="#2d3748">ci.yml</text><text x="78" y="166" font-size="11" font-family="monospace" fill="#dd6b20">ISSUE_TEMPLATE/</text><text x="98" y="186" font-size="11" font-family="monospace" fill="#2d3748">bug_report.yml</text><text x="98" y="206" font-size="11" font-family="monospace" fill="#2d3748">config.yml</text><text x="58" y="234" font-size="9" fill="#718096">GitHub reads these exact paths.</text><line x1="290" y1="150" x2="330" y2="150" stroke="#a0aec0" stroke-width="2" /><polygon points="330 150 320 145 320 155" fill="#a0aec0" /><rect x="332" y="132" width="118" height="36" rx="8" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1.2" /><text x="391" y="150" text-anchor="middle" font-size="10" font-family="monospace" fill="#2d3748">git push</text><text x="391" y="162" text-anchor="middle" font-size="8" fill="#718096">one command</text><line x1="450" y1="150" x2="486" y2="104" stroke="#a0aec0" stroke-width="2" /><polygon points="486 104 475 106 481 114" fill="#a0aec0" /><line x1="450" y1="150" x2="486" y2="212" stroke="#a0aec0" stroke-width="2" /><polygon points="486 212 481 202 475 210" fill="#a0aec0" /><rect x="488" y="66" width="204" height="74" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="590" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">CI starts running</text><text x="590" y="110" text-anchor="middle" font-size="9.5" fill="#805ad5">Actions checks out code,</text><text x="590" y="124" text-anchor="middle" font-size="9.5" fill="#805ad5">runs pytest, reports a check</text><rect x="488" y="178" width="204" height="74" rx="10" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.4" /><text x="590" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">Issue form goes live</text><text x="590" y="222" text-anchor="middle" font-size="9.5" fill="#9c4221">"New issue" now shows your</text><text x="590" y="236" text-anchor="middle" font-size="9.5" fill="#9c4221">Bug report form, not a blank box</text><text x="360" y="300" text-anchor="middle" font-size="10.5" fill="#4a5568">The workflow file automates checks on every push; the ISSUE_TEMPLATE files shape how people report bugs.</text><text x="360" y="318" text-anchor="middle" font-size="10.5" fill="#4a5568">Both live in the repository, so every clone and every contributor gets them.</text></svg>
