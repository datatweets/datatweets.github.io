<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="320" fill="#ffffff" /><text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Branch protection: rules a PR must pass to merge</text><rect x="28" y="120" width="140" height="80" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="98" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Pull request</text><text x="98" y="172" text-anchor="middle" font-size="9.5" fill="#3182ce">wants to merge</text><text x="98" y="186" text-anchor="middle" font-size="9.5" fill="#3182ce">into main</text><line x1="168" y1="160" x2="206" y2="160" stroke="#a0aec0" stroke-width="2" /><polygon points="206 160 196 155 196 165" fill="#a0aec0" /><text x="360" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#718096">Required rules (the gate)</text><rect x="216" y="92" width="288" height="44" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><circle cx="238" cy="114" r="9" fill="#48bb78" /><text x="238" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">✓</text><text x="256" y="111" font-size="10.5" font-weight="700" fill="#22543d">CI checks pass</text><text x="256" y="125" font-size="8.5" fill="#2f855a">required status check: CI / test</text><rect x="216" y="142" width="288" height="44" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><circle cx="238" cy="164" r="9" fill="#48bb78" /><text x="238" y="168" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">✓</text><text x="256" y="161" font-size="10.5" font-weight="700" fill="#22543d">At least one approving review</text><text x="256" y="175" font-size="8.5" fill="#2f855a">required pull request review</text><rect x="216" y="192" width="288" height="44" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><circle cx="238" cy="214" r="9" fill="#48bb78" /><text x="238" y="218" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">✓</text><text x="256" y="211" font-size="10.5" font-weight="700" fill="#22543d">Branch is up to date</text><text x="256" y="225" font-size="8.5" fill="#2f855a">no direct pushes to main</text><line x1="504" y1="160" x2="542" y2="160" stroke="#a0aec0" stroke-width="2" /><polygon points="542 160 532 155 532 165" fill="#a0aec0" /><rect x="552" y="116" width="140" height="88" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.8" /><text x="622" y="142" text-anchor="middle" font-size="20">🔒</text><text x="622" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">main</text><text x="622" y="184" text-anchor="middle" font-size="9" fill="#805ad5">protected</text><text x="622" y="196" text-anchor="middle" font-size="9" fill="#805ad5">merge allowed</text><text x="360" y="276" text-anchor="middle" font-size="11" fill="#4a5568">If any rule fails, the Merge button is disabled. Protection turns your conventions into</text><text x="360" y="292" text-anchor="middle" font-size="11" fill="#4a5568">guarantees: broken or unreviewed code simply cannot reach <tspan font-family="monospace" font-weight="700" fill="#2d3748">main</tspan>.</text></svg>