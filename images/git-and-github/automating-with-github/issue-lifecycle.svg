<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="300" fill="#ffffff" /><text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The life of an issue</text><rect x="24" y="90" width="150" height="86" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="99" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">1. Opened</text><text x="99" y="134" text-anchor="middle" font-size="9" fill="#2f855a">someone reports a</text><text x="99" y="147" text-anchor="middle" font-size="9" fill="#2f855a">bug or requests</text><text x="99" y="160" text-anchor="middle" font-size="9" fill="#2f855a">a feature (#12)</text><line x1="174" y1="133" x2="206" y2="133" stroke="#a0aec0" stroke-width="2" /><polygon points="206 133 196 128 196 138" fill="#a0aec0" /><rect x="208" y="90" width="150" height="86" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="283" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">2. Triaged</text><text x="283" y="134" text-anchor="middle" font-size="9" fill="#3182ce">labels, assignee,</text><text x="283" y="147" text-anchor="middle" font-size="9" fill="#3182ce">milestone added</text><text x="283" y="162" text-anchor="middle" font-size="8" fill="#718096">bug · priority · @maya</text><line x1="358" y1="133" x2="390" y2="133" stroke="#a0aec0" stroke-width="2" /><polygon points="390 133 380 128 380 138" fill="#a0aec0" /><rect x="392" y="90" width="150" height="86" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="467" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">3. PR opened</text><text x="467" y="134" text-anchor="middle" font-size="9" fill="#805ad5">a pull request</text><text x="467" y="147" text-anchor="middle" font-size="9" fill="#805ad5">links the issue:</text><text x="467" y="162" text-anchor="middle" font-size="8.5" font-family="monospace" font-weight="700" fill="#553c9a">Closes #12</text><line x1="542" y1="133" x2="574" y2="133" stroke="#a0aec0" stroke-width="2" /><polygon points="574 133 564 128 564 138" fill="#a0aec0" /><rect x="576" y="90" width="120" height="86" rx="10" fill="#faf5ff" stroke="#805ad5" stroke-width="1.5" /><text x="636" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#553c9a">4. Closed</text><text x="636" y="136" text-anchor="middle" font-size="9" fill="#6b46c1">merging the PR</text><text x="636" y="149" text-anchor="middle" font-size="9" fill="#6b46c1">auto-closes the</text><text x="636" y="162" text-anchor="middle" font-size="9" fill="#6b46c1">issue</text><text x="360" y="222" text-anchor="middle" font-size="11" fill="#4a5568">Issues are the to-do list of a project: every bug and feature gets a number, a discussion,</text><text x="360" y="238" text-anchor="middle" font-size="11" fill="#4a5568">and a clear status. Linking a PR with <tspan font-family="monospace" font-weight="700" fill="#2d3748">Closes #12</tspan> ties the work to the request and closes it on merge.</text></svg>