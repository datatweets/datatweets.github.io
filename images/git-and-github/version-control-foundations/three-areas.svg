<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="320" fill="#ffffff" /><text x="320" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The three areas Git moves your work through</text><rect x="16" y="96" width="142" height="86" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" /><text x="87" y="130" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2d3748">Working Dir</text><text x="87" y="149" text-anchor="middle" font-size="9.5" fill="#718096">your files,</text><text x="87" y="163" text-anchor="middle" font-size="9.5" fill="#718096">where you edit</text><rect x="249" y="96" width="142" height="86" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.5" /><text x="320" y="130" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b6cb0">Staging Area</text><text x="320" y="149" text-anchor="middle" font-size="9.5" fill="#3182ce">what goes into</text><text x="320" y="163" text-anchor="middle" font-size="9.5" fill="#3182ce">the next commit</text><rect x="482" y="96" width="142" height="86" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="553" y="130" text-anchor="middle" font-size="12.5" font-weight="700" fill="#276749">Repository</text><text x="553" y="149" text-anchor="middle" font-size="9.5" fill="#2f855a">committed history</text><text x="553" y="163" text-anchor="middle" font-size="9.5" fill="#2f855a">(the .git folder)</text><line x1="160" y1="132" x2="247" y2="132" stroke="#4299e1" stroke-width="2" /><polygon points="247 132 238 128 238 136" fill="#4299e1" /><text x="203" y="123" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0" font-family="monospace">git add</text><line x1="393" y1="132" x2="480" y2="132" stroke="#48bb78" stroke-width="2" /><polygon points="480 132 471 128 471 136" fill="#48bb78" /><text x="436" y="123" text-anchor="middle" font-size="10" font-weight="700" fill="#276749" font-family="monospace">git commit</text><text x="203" y="206" text-anchor="middle" font-size="9" fill="#a0aec0" font-family="monospace">git diff</text><text x="436" y="206" text-anchor="middle" font-size="9" fill="#a0aec0" font-family="monospace">git diff --staged</text><path d="M500 224C360 256 280 256 140 226" fill="none" stroke="#ed8936" stroke-width="1.8" /><polygon points="140 226 149 225 145 233" fill="#ed8936" /><text x="320" y="258" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621" font-family="monospace">git restore / git checkout</text><text x="320" y="273" text-anchor="middle" font-size="9.5" fill="#9c4221">bring a committed version back into your files</text><text x="320" y="302" text-anchor="middle" font-size="11" fill="#718096">You edit in the working directory, stage what you want with add, and save a snapshot with commit.</text></svg>