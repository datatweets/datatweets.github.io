<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="320" fill="#ffffff" /><text x="320" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Version control saves snapshots you can return to</text><line x1="70" y1="150" x2="570" y2="150" stroke="#cbd5e0" stroke-width="2" /><polygon points="578 150 568 145 568 155" fill="#cbd5e0" /><text x="585" y="154" font-size="11" fill="#a0aec0">time</text><g><circle cx="140" cy="150" r="13" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="140" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">commit 1</text><text x="140" y="202" text-anchor="middle" font-size="9.5" fill="#718096">first draft</text><rect x="108" y="74" width="64" height="46" rx="4" fill="#ebf4ff" stroke="#90cdf4" /><text x="140" y="92" text-anchor="middle" font-size="8.5" fill="#3182ce">README</text><text x="140" y="106" text-anchor="middle" font-size="8.5" fill="#3182ce">skylog.py</text><line x1="140" y1="120" x2="140" y2="137" stroke="#cbd5e0" stroke-width="1.3" stroke-dasharray="3 3" /></g><g><circle cx="300" cy="150" r="13" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="300" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">commit 2</text><text x="300" y="202" text-anchor="middle" font-size="9.5" fill="#718096">add usage notes</text><rect x="268" y="74" width="64" height="46" rx="4" fill="#ebf4ff" stroke="#90cdf4" /><text x="300" y="92" text-anchor="middle" font-size="8.5" fill="#3182ce">README+</text><text x="300" y="106" text-anchor="middle" font-size="8.5" fill="#3182ce">skylog.py</text><line x1="300" y1="120" x2="300" y2="137" stroke="#cbd5e0" stroke-width="1.3" stroke-dasharray="3 3" /></g><g><circle cx="460" cy="150" r="13" fill="#48bb78" stroke="#276749" stroke-width="2" /><text x="460" y="186" text-anchor="middle"