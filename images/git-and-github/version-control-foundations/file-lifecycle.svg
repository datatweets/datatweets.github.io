<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="320" fill="#ffffff" /><text x="320" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The life of a file in Git</text><rect x="34" y="120" width="118" height="56" rx="9" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5" /><text x="93" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">Untracked</text><text x="93" y="162" text-anchor="middle" font-size="9" fill="#718096">brand-new file</text><rect x="200" y="120" width="118" height="56" rx="9" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.5" /><text x="259" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Staged</text><text x="259" y="162" text-anchor="middle" font-size="9" fill="#3182ce">ready to commit</text><rect x="366" y="120" width="118" height="56" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="425" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Committed</text><text x="425" y="162" text-anchor="middle" font-size="9" fill="#2f855a">saved in history</text><rect x="522" y="120" width="84" height="56" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" /><text x="564" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">Modified</text><text x="564" y="162" text-anchor="middle" font-size="9" fill="#9c4221">edited again</text><line x1="152" y1="148" x2="198" y2="148" stroke="#4299e1" stroke-width="2" /><polygon points="198 148 189 144 189 152" fill="#4299e1" /><text x="175" y="138" text-anchor="middle" font-size="9" font-weight="700" fill="#2b6cb0" font-family="monospace">add</text><line x1="318" y1="148" x2="364" y2="148" stroke="#48bb78" stroke-width="2" /><polygon points="364 148 355 144 355 152" fill="#48bb78" /><text x="341" y="138" text-anchor="middle" font-size="9" font-weight="700" fill="#276749" font-family="monospace">commit</text><line x1="484" y1="148" x2="520" y2="148" stroke="#ed8936" stroke-width="2" /><polygon points="520 148 511 144 511 152" fill="#ed8936" /><text x="502" y="138" text-anchor="middle" font-size="9" font-weight="700" fill="#c05621">edit</text><path d="M560 178C540 240 320 240 259 180" fill="none" stroke="#4299e1" stroke-width="1.8" stroke-dasharray="5 3" /><polygon points="259 180 263 189 268 182" fill="#4299e1" /><text x="410" y="238" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0" font-family="monospace">git add</text><text x="410" y="253" text-anchor="middle" font-size="9.5" fill="#718096">stage the new changes, then commit again</text><text x="320" y="292" text-anchor="middle" font-size="11" fill="#718096">A file moves from untracked to staged to committed; once committed, editing it makes it modified — and the cycle repeats.</text></svg>