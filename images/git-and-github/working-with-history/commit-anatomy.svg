font-size="9.5" fill="#2f855a">logged observations</text><text x="682" y="194" font-size="8.5" fill="#718096">parent: 429ca71</text></g><line x1="250" y1="163" x2="192" y2="163" stroke="#a0aec0" stroke-width="1.8" /><polygon points="192 163 201 159 201 167" fill="#a0aec0" /><line x1="460" y1="163" x2="402" y2="163" stroke="#a0aec0" stroke-width="1.8" /><polygon points="402 163 411 159 411 167" fill="#a0aec0" /><line x1="670" y1="163" x2="612" y2="163" stroke="#a0aec0" stroke-width="1.8" /><polygon points="612 163 621 159 621 167" fill="#a0aec0" /><text x="430" y="240" text-anchor="middle" font-size="9.5" fill="#a0aec0">each commit records its parent, forming the history chain (newest on the right)</text><rect x="688" y="66" width="52" height="26" rx="5" fill="#faf5ff" stroke="#9f7aea" /><text x="714" y="83" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1" font-family="monospace">main</text><rect x="748" y="66" width="58" height="26" rx="5" fill="#fffaf0" stroke="#ed8936" /><text x="777" y="83" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621" font-family="monospace">HEAD</text><line x1="777" y1="92" x2="740" y2="92" stroke="#ed8936" stroke-width="1.4" /><polygon points="740 92 748 88 748 96" fill="#ed8936" /><line x1="714" y1="92" x2="730" y2="118" stroke="#9f7aea" stroke-width="1.6" /><polygon points="730 118 721 114 727 110" fill="#9f7aea" /><text x="20" y="84" text-anchor="start" font-size="9.5" fill="#718096">HEAD points to your current branch; the branch points to its newest commit</text><text x="430" y="300" text-anchor="middle" font-size="11" fill="#718096">A commit bundles a snapshot, a unique hash, author, date, message, and a link to the commit before it.</text></svg>