<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="330" fill="#ffffff" /><text x="320" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">History is a chain of commits, each pointing to its parent</text><g><rect x="40" y="120" width="150" height="86" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" /><text x="52" y="140" font-size="11" font-weight="700" fill="#2b6cb0" font-family="monospace">ac6a33d</text><text x="52" y="160" font-size="9.5" fill="#718096">Add project</text><text x="52" y="173" font-size="9.5" fill="#718096">README</text><text x="52" y="194" font-size="8.5" fill="#a0aec0">parent: (none)</text></g><g><rect x="245" y="120" width="150" height="86" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" /><text x="257" y="140" font-size="11" font-weight="700" fill="#2b6cb0" font-family="monospace">4baefbe</text><text x="257" y="160" font-size="9.5" fill="#718096">Add SkyLog script</text><text x="257" y="173" font-size="9.5" fill="#718096">and usage notes</text><text x="257" y="194" font-size="8.5" fill="#a0aec0">parent: ac6a33d</text></g><g><rect x="450" y="120" width="150" height="86" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2" /><text x="462" y="140" font-size="11" font-weight="700" fill="#276749" font-family="monospace">429ca71</text><text x="462" y="160" font-size="9.5" fill="#2f855a">Log first two</text><text x="462" y="173" font-size="9.5" fill="#2f855a">observations</text><text x="462" y="194" font-size="8.5" fill="#718096">parent: 4baefbe</text></g><line x1="245" y1="163" x2="192" y2="163" stroke="#a0aec0" stroke-width="1.8" /><polygon points="192 163 201 159 201 167" fill="#a0aec0" /><line x1="450" y1="163" x2="397" y2="163" stroke="#a0aec0" stroke-width="1.8" /><polygon points="397 163 406 159 406 167" fill="#a0aec0" /><text x="320" y="240" text-anchor="middle" font-size="9.5" fill="#a0aec0">each commit records its parent, forming the history chain (newest on the right)</text><rect x="468" y="66" width="52" height="26" rx="5" fill="#faf5ff" stroke="#9f7aea" /><text x="494" y="83" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1" font-family="monospace">main</text><rect x="528" y="66" width="58" height="26" rx="5" fill="#fffaf0" stroke="#ed8936" /><text x="557" y="83" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621" font-family="monospace">HEAD</text><line x1="557" y1="92" x2="520" y2="92" stroke="#ed8936" stroke-width="1.4" /><polygon points="520 92 528 88 528 96" fill="#ed8936" /><line x1="494" y1="92" x2="510" y2="118" stroke="#9f7aea" stroke-width="1.6" /><polygon points="510 118 501 114 507 110" fill="#9f7aea" /><text x="20" y="84" text-anchor="start" font-size="9.5" fill="#718096">HEAD points to your current branch; the branch points to its newest commit</text><text x="320" y="300" text-anchor="middle" font-size="11" fill="#718096">A commit bundles a snapshot, a unique hash, author, date, message, and a link to the commit before it.</text></svg>