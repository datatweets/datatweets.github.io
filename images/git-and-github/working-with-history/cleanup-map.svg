<svg xmlns="http://www.w3.org/2000/svg" width="700" height="410" viewBox="0 0 700 410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="410" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">From Messy to Clean: The Four Fixes</text><g><rect x="30" y="55" width="290" height="64" rx="8" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.5" /><text x="44" y="82" font-size="11.5" fill="#742a2a">Latest commit message has a typo</text><line x1="320" y1="87" x2="345" y2="87" stroke="#a0aec0" stroke-width="1.8" /><polygon points="345 87 337 83 337 91" fill="#a0aec0" /><rect x="350" y="55" width="320" height="64" rx="8" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1.5" /><text x="364" y="76" font-size="11.5" font-weight="700" font-family="monospace" fill="#276749">git commit --amend</text><text x="364" y="94" font-size="10.5" fill="#2f855a">Replaces it with the corrected message</text></g><g><rect x="30" y="135" width="290" height="64" rx="8" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.5" /><text x="44" y="158" font-size="11.5" fill="#742a2a">A broken "experimental color</text><text x="44" y="174" font-size="11.5" fill="#742a2a">mode" commit is buried in history</text><line x1="320" y1="167" x2="345" y2="167" stroke="#a0aec0" stroke-width="1.8" /><polygon points="345 167 337 163 337 171" fill="#a0aec0" /><rect x="350" y="135" width="320" height="64" rx="8" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1.5" /><text x="364" y="156" font-size="11.5" font-weight="700" font-family="monospace" fill="#276749">git revert</text><text x="364" y="174" font-size="10.5" fill="#2f855a">Undoes it safely; original stays in history</text></g><g><rect x="30" y="215" width="290" height="64" rx="8" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.5" /><text x="44" y="238" font-size="11.5" fill="#742a2a">A secret config.env file is</text><text x="44" y="254" font-size="11.5" fill="#742a2a">already tracked</text><line x1="320" y1="247" x2="345" y2="247" stroke="#a0aec0" stroke-width="1.8" /><polygon points="345 247 337 243 337 251" fill="#a0aec0" /><rect x="350" y="215" width="320" height="64" rx="8" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1.5" /><text x="364" y="236" font-size="11.5" font-weight="700" font-family="monospace" fill="#276749">git rm --cached</text><text x="364" y="254" font-size="10.5" fill="#2f855a">Stops tracking it; rotate the secret next</text></g><g><rect x="30" y="295" width="290" height="64" rx="8" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.5" /><text x="44" y="318" font-size="11.5" fill="#742a2a">Cache and log clutter fill up</text><text x="44" y="334" font-size="11.5" fill="#742a2a">git status</text><line x1="320" y1="327" x2="345" y2="327" stroke="#a0aec0" stroke-width="1.8" /><polygon points="345 327 337 323 337 331" fill="#a0aec0" /><rect x="350" y="295" width="320" height="64" rx="8" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1.5" /><text x="364" y="322" font-size="11.5" font-weight="700" font-family="monospace" fill="#276749">.gitignore</text><text x="364" y="340" font-size="10.5" fill="#2f855a">Hides them from git status for good</text></g><text x="350" y="392" text-anchor="middle" font-size="11" fill="#718096">Each fix in this project uses only commands from this module.</text></svg>