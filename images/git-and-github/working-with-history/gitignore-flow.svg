<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="320" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">How Git decides whether to ignore a file</text><rect x="40" y="130" width="120" height="50" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" /><text x="100" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">a file in your</text><text x="100" y="167" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">project</text><polygon points="250 155 312 120 374 155 312 190" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="312" y="150" text-anchor="middle" font-size="10" font-weight="700" fill="#6b46c1">already</text><text x="312" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#6b46c1">tracked?</text><line x1="160" y1="155" x2="248" y2="155" stroke="#a0aec0" stroke-width="1.6" /><polygon points="248 155 239 151 239 159" fill="#a0aec0" /><line x1="312" y1="120" x2="312" y2="70" stroke="#a0aec0" stroke-width="1.6" /><polygon points="312 70 308 79 316 79" fill="#a0aec0" /><text x="322" y="98" font-size="9" font-weight="700" fill="#805ad5">yes</text><rect x="392" y="48" width="232" height="44" rx="8" fill="#fff5f5" stroke="#e53e3e" /><text x="408" y="68" font-size="10" fill="#9b2c2c"><tspan font-weight="700">.gitignore is ignored for it</tspan> — Git keeps tracking it.</text><text x="408" y="82" font-size="10" fill="#9b2c2c" font-family="monospace">git rm --cached &lt;file&gt;  to stop.</text><line x1="374" y1="120" x2="392" y2="86" stroke="#a0aec0" stroke-width="1.4" /><polygon points="250 250 312 215 374 250 312 285" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="312" y="245" text-anchor="middle" font-size="10" font-weight="700" fill="#6b46c1">matches a</text><text x="312" y="259" text-anchor="middle" font-size="10" font-weight="700" fill="#6b46c1">.gitignore rule?</text><line x1="312" y1="190" x2="312" y2="213" stroke="#a0aec0" stroke-width="1.6" /><polygon points="312 213 308 204 316 204" fill="#a0aec0" /><text x="322" y="206" font-size="9" font-weight="700" fill="#805ad5">no</text><line x1="374" y1="250" x2="430" y2="250" stroke="#48bb78" stroke-width="1.8" /><polygon points="430 250 421 246 421 254" fill="#48bb78" /><text x="392" y="242" font-size="9" font-weight="700" fill="#276749">yes</text><rect x="432" y="230" width="192" height="40" rx="8" fill="#f0fff4" stroke="#48bb78" /><text x="528" y="248" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">Ignored</text><text x="528" y="262" text-anchor="middle" font-size="9" fill="#2f855a">hidden from git status</text><line x1="312" y1="285" x2="312" y2="300" stroke="#a0aec0" stroke-width="1.6" /><text x="170" y="304" text-anchor="middle" font-size="10" fill="#718096">no → shows as <tspan font-family="monospace" font-weight="700" fill="#dd6b20">untracked</tspan> in git status (ready to add)</text><text x="528" y="300" text-anchor="middle" font-size="9" fill="#a0aec0">a leading "!" rule can un-ignore</text></svg>