<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="430" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Anatomy of a Unified Diff</text><rect x="50" y="50" width="540" height="185" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" /><text x="64" y="70" font-size="11" font-family="monospace" fill="#718096">diff --git a/observations.md b/observations.md</text><text x="64" y="90" font-size="11" font-family="monospace" fill="#a0aec0">index 34ca847..0121552 100644</text><text x="64" y="110" font-size="11" font-family="monospace" fill="#742a2a">--- a/observations.md</text><text x="64" y="130" font-size="11" font-family="monospace" fill="#22543d">+++ b/observations.md</text><text x="64" y="150" font-size="11" font-weight="700" font-family="monospace" fill="#2b6cb0">@@ -1,2 +1,3 @@</text><text x="64" y="170" font-size="11" font-family="monospace" fill="#4a5568"> - Orion Nebula, naked eye, 9:40pm</text><text x="64" y="190" font-size="11" font-family="monospace" fill="#4a5568"> - Jupiter and four moons through binoculars</text><text x="64" y="210" font-size="11" font-weight="700" font-family="monospace" fill="#22543d">+- [2026-03-06 21:10] Andromeda Galaxy, averted vision</text><rect x="64" y="264" width="18" height="14" rx="3" fill="#718096" /><text x="90" y="275" font-size="11" fill="#4a5568">Header — names the old (a/) and new (b/) file</text><rect x="64" y="290" width="18" height="14" rx="3" fill="#2b6cb0" /><text x="90" y="301" font-size="11" fill="#4a5568">Hunk header (@@) — old range and new range of changed lines</text><rect x="64" y="316" width="18" height="14" rx="3" fill="#a0aec0" /><text x="90" y="327" font-size="11" fill="#4a5568">Context line — unchanged, shown so you can see where the change sits</text><rect x="64" y="342" width="18" height="14" rx="3" fill="#38a169" /><text x="90" y="353" font-size="11" fill="#4a5568">+ line — added</text><rect x="64" y="368" width="18" height="14" rx="3" fill="#e53e3e" /><text x="90" y="379" font-size="11" fill="#4a5568">- line — removed (none in this example)</text><text x="320" y="410" text-anchor="middle" font-size="11" fill="#718096">Git shows diffs this way everywhere — git diff, git show, and every GitHub pull request.</text></svg>