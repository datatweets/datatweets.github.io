<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="350" fill="#ffffff" /><text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Interactive rebase: clean up before you share</text><text x="120" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#718096">Messy branch</text><g font-family="monospace" font-size="10.5"><rect x="30" y="84" width="180" height="28" rx="5" fill="#fff5f5" stroke="#fc8181" stroke-width="1.2" /><text x="42" y="102" fill="#9b2c2c">oops fix typo</text><rect x="30" y="118" width="180" height="28" rx="5" fill="#fff5f5" stroke="#fc8181" stroke-width="1.2" /><text x="42" y="136" fill="#9b2c2c">more wip</text><rect x="30" y="152" width="180" height="28" rx="5" fill="#fff5f5" stroke="#fc8181" stroke-width="1.2" /><text x="42" y="170" fill="#9b2c2c">wip</text><rect x="30" y="186" width="180" height="28" rx="5" fill="#ebf8ff" stroke="#63b3ed" stroke-width="1.2" /><text x="42" y="204" fill="#2c5282">Add parser</text></g><rect x="250" y="80" width="240" height="150" rx="8" fill="#1a202c" /><text x="266" y="100" font-size="9.5" font-family="monospace" fill="#a0aec0">git rebase -i HEAD~3</text><g font-family="monospace" font-size="10"><text x="266" y="124" fill="#68d391">pick</text><text x="300" y="124" fill="#e2e8f0">wip</text><text x="266" y="144" fill="#f6ad55">squash</text><text x="318" y="144" fill="#e2e8f0">more wip</text><text x="266" y="164" fill="#f6ad55">squash</text><text x="318" y="164" fill="#e2e8f0">oops fix typo</text></g><text x="266" y="194" font-size="8.5" font-family="monospace" fill="#718096">pick = keep   squash = fold into</text><text x="266" y="208" font-size="8.5" font-family="monospace" fill="#718096">prev   reword/edit/drop also</text><text x="266" y="222" font-size="8.5" font-family="monospace" fill="#718096">available</text><line x1="498" y1="155" x2="540" y2="155" stroke="#a0aec0" stroke-width="2" /><polygon points="540 155 530 150 530 160" fill="#a0aec0" /><text x="612" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#718096">Clean branch</text><g font-family="monospace" font-size="10.5"><rect x="548" y="132" width="150" height="28" rx="5" fill="#f0fff4" stroke="#68d391" stroke-width="1.4" /><text x="560" y="150" fill="#22543d">feat: add JSON parser</text><rect x="548" y="166" width="150" height="28" rx="5" fill="#ebf8ff" stroke="#63b3ed" stroke-width="1.2" /><text x="560" y="184" fill="#2c5282">Add parser</text></g><text x="360" y="280" text-anchor="middle" font-size="11" fill="#4a5568">Three messy commits become one clear commit — the history you</text><text x="360" y="296" text-anchor="middle" font-size="11" fill="#4a5568">want reviewers to read, not the trail of false starts you actually took.</text><rect x="200" y="312" width="320" height="26" rx="7" fill="#fff5f5" stroke="#fc8181" stroke-width="1" /><text x="360" y="329" text-anchor="middle" font-size="9" fill="#c53030">Only rewrite local, unshared commits — rebasing rewrites history.</text></svg>