<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="320" fill="#ffffff" /><text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">git bisect: binary search for the first bad commit</text><line x1="70" y1="110" x2="650" y2="110" stroke="#cbd5e0" stroke-width="2.5" /><g font-size="9" text-anchor="middle"><circle cx="70" cy="110" r="9" fill="#48bb78" /><text x="70" y="135" fill="#276749" font-weight="700">good</text><circle cx="166" cy="110" r="8" fill="#a0aec0" /><circle cx="262" cy="110" r="8" fill="#a0aec0" /><circle cx="358" cy="110" r="8" fill="#a0aec0" /><circle cx="454" cy="110" r="8" fill="#a0aec0" /><circle cx="550" cy="110" r="8" fill="#a0aec0" /><circle cx="650" cy="110" r="9" fill="#e53e3e" /><text x="650" y="135" fill="#c53030" font-weight="700">bad (now)</text></g><text x="70" y="92" text-anchor="middle" font-size="8" fill="#718096">oldest</text><text x="650" y="92" text-anchor="middle" font-size="8" fill="#718096">HEAD</text><text x="86" y="178" font-size="10.5" font-weight="700" fill="#2d3748">Step 1</text><text x="140" y="178" font-size="10" fill="#4a5568">Git checks out the midpoint. You test it → it's <tspan fill="#c53030" font-weight="700">bad</tspan>.</text><line x1="358" y1="118" x2="358" y2="150" stroke="#e53e3e" stroke-width="1.4" stroke-dasharray="3 2" /><text x="358" y="164" text-anchor="middle" font-size="8.5" fill="#c53030">test here</text><text x="86" y="210" font-size="10.5" font-weight="700" fill="#2d3748">Step 2</text><text x="140" y="210" font-size="10" fill="#4a5568">Bug is in the left half. Git halves again → that one is <tspan fill="#276749" font-weight="700">good</tspan>.</text><text x="86" y="242" font-size="10.5" font-weight="700" fill="#2d3748">Step 3</text><text x="140" y="242" font-size="10" fill="#4a5568">Only one commit left — Git names it the <tspan fill="#c53030" font-weight="700">first bad commit</tspan>.</text><rect x="140" y="262" width="440" height="40" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="360" y="280" text-anchor="middle" font-size="10" fill="#4a5568">Each test halves the search: <tspan font-weight="700" fill="#2d3748">~log₂(n)</tspan> steps find the culprit among</text><text x="360" y="294" text-anchor="middle" font-size="10" fill="#4a5568">hundreds of commits. Automate the test with <tspan font-family="monospace" font-weight="700" fill="#2d3748">git bisect run</tspan>.</text></svg>