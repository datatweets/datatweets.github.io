<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="380" fill="#ffffff" /><text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The guided-project cycle: polish, then recover</text>
<text x="180" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#718096">Part 1 -- polish with interactive rebase</text>
<g font-family="monospace" font-size="10">
<rect x="30" y="80" width="150" height="26" rx="5" fill="#fff5f5" stroke="#fc8181" stroke-width="1.2" /><text x="42" y="97" fill="#9b2c2c">fix trailing dash</text>
<rect x="30" y="110" width="150" height="26" rx="5" fill="#fff5f5" stroke="#fc8181" stroke-width="1.2" /><text x="42" y="127" fill="#9b2c2c">keep hacking</text>
<rect x="30" y="140" width="150" height="26" rx="5" fill="#fff5f5" stroke="#fc8181" stroke-width="1.2" /><text x="42" y="157" fill="#9b2c2c">wip</text>
<rect x="30" y="170" width="150" height="26" rx="5" fill="#ebf8ff" stroke="#63b3ed" stroke-width="1.2" /><text x="42" y="187" fill="#2c5282">Add text utils</text>
</g>
<line x1="188" y1="123" x2="222" y2="123" stroke="#a0aec0" stroke-width="2" /><polygon points="224 123 214 118 214 128" fill="#a0aec0" />
<text x="206" y="112" text-anchor="middle" font-size="8" fill="#718096">rebase -i</text>
<g font-family="monospace" font-size="10">
<rect x="232" y="126" width="98" height="26" rx="5" fill="#f0fff4" stroke="#68d391" stroke-width="1.4" /><text x="244" y="143" fill="#22543d">feat: slugify</text>
<rect x="232" y="156" width="98" height="26" rx="5" fill="#ebf8ff" stroke="#63b3ed" stroke-width="1.2" /><text x="244" y="173" fill="#2c5282">Add text utils</text>
</g>
<text x="180" y="214" text-anchor="middle" font-size="10" fill="#4a5568">Three messy commits fold into one</text>
<text x="180" y="228" text-anchor="middle" font-size="10" fill="#4a5568">clear commit, ready to share.</text>
<line x1="360" y1="48" x2="360" y2="300" stroke="#e2e8f0" stroke-width="1.5" />
<text x="540" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#718096">Part 2 -- recover with reflog</text>
<g font-family="monospace" font-size="10">
<rect x="420" y="80" width="140" height="26" rx="5" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.2" /><text x="432" y="97" fill="#2d3748">Add summary stats</text>
<rect x="420" y="110" width="140" height="26" rx="5" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.2" /><text x="432" y="127" fill="#2d3748">Add cleaning step</text>
<rect x="420" y="140" width="140" height="26" rx="5" fill="#ebf8ff" stroke="#63b3ed" stroke-width="1.2" /><text x="432" y="157" fill="#2c5282">Add analysis outline</text>
<rect x="596" y="110" width="54" height="26" rx="5" fill="#ebf8ff" stroke="#63b3ed" stroke-width="1.4" /><text x="623" y="127" text-anchor="middle" fill="#2c5282">main</text>
</g>
<line x1="596" y1="123" x2="566" y2="93" stroke="#63b3ed" stroke-width="1.6" /><polygon points="562 90 573 93 568 101" fill="#63b3ed" />
<text x="655" y="127" font-size="8.5" fill="#718096">start</text>
<line x1="596" y1="136" x2="566" y2="153" stroke="#fc8181" stroke-width="1.6" stroke-dasharray="4 3" /><polygon points="562 155 573 152 573 160" fill="#fc8181" />
<text x="600" y="150" font-size="8" fill="#c53030">reset --hard</text>
<text x="600" y="160" font-size="8" fill="#c53030">HEAD~2</text>
<text x="540" y="196" text-anchor="middle" font-size="10" fill="#4a5568">reset moves main back; the two commits</text>
<text x="540" y="210" text-anchor="middle" font-size="10" fill="#4a5568">are unreferenced, not deleted.</text>
<rect x="410" y="226" width="260" height="44" rx="8" fill="#f0fff4" stroke="#68d391" stroke-width="1.2" />
<text x="540" y="243" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#22543d">git reflog   -- find the HEAD@{1} hash</text>
<text x="540" y="259" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#22543d">git reset --hard fdcbc6d   -- main is back</text>
<text x="360" y="322" text-anchor="middle" font-size="11" fill="#4a5568">Polish, oops, rescue: shape history on purpose, and know the reflog</text>
<text x="360" y="338" text-anchor="middle" font-size="11" fill="#4a5568">can bring back a commit a wrong reset left behind.</text>
<rect x="150" y="350" width="420" height="24" rx="7" fill="#fff5f5" stroke="#fc8181" stroke-width="1" />
<text x="360" y="366" text-anchor="middle" font-size="9" fill="#c53030">Only rebase local, un-pushed commits -- rewriting shared history breaks others.</text>
</svg>
