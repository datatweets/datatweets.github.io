<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="340" fill="#ffffff" /><text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Two ways to combine branches</text><rect x="24" y="54" width="320" height="262" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="184" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">git merge</text><text x="184" y="98" text-anchor="middle" font-size="9.5" fill="#718096">keeps both lines, adds a merge commit</text><line x1="64" y1="160" x2="240" y2="160" stroke="#4299e1" stroke-width="2.5" /><circle cx="64" cy="160" r="6" fill="#4299e1" /><circle cx="124" cy="160" r="6" fill="#4299e1" /><circle cx="184" cy="160" r="6" fill="#4299e1" /><circle cx="280" cy="160" r="8" fill="#9f7aea" /><line x1="184" y1="160" x2="272" y2="160" stroke="#9f7aea" stroke-width="2.5" /><text x="280" y="146" text-anchor="middle" font-size="8.5" fill="#6b46c1" font-weight="700">merge</text><circle cx="124" cy="230" r="6" fill="#48bb78" /><circle cx="184" cy="230" r="6" fill="#48bb78" /><line x1="124" y1="230" x2="184" y2="230" stroke="#48bb78" stroke-width="2.5" /><line x1="124" y1="160" x2="124" y2="230" stroke="#48bb78" stroke-width="2" /><line x1="184" y1="230" x2="280" y2="160" stroke="#9f7aea" stroke-width="2" /><text x="56" y="150" text-anchor="end" font-size="9" fill="#2b6cb0" font-weight="700">main</text><text x="116" y="248" text-anchor="end" font-size="9" fill="#276749" font-weight="700">feature</text><text x="184" y="286" text-anchor="middle" font-size="9.5" fill="#4a5568">History shows the branch happened.</text><text x="184" y="300" text-anchor="middle" font-size="9.5" fill="#4a5568">Nothing is rewritten.</text><rect x="376" y="54" width="320" height="262" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="536" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#2f855a">git rebase</text><text x="536" y="98" text-anchor="middle" font-size="9.5" fill="#718096">replays your commits onto main, in a line</text><line x1="416" y1="180" x2="656" y2="180" stroke="#4299e1" stroke-width="2.5" /><circle cx="416" cy="180" r="6" fill="#4299e1" /><circle cx="476" cy="180" r="6" fill="#4299e1" /><circle cx="536" cy="180" r="6" fill="#4299e1" /><line x1="536" y1="180" x2="656" y2="180" stroke="#48bb78" stroke-width="2.5" /><circle cx="596" cy="180" r="6" fill="#48bb78" /><circle cx="656" cy="180" r="6" fill="#48bb78" /><text x="408" y="170" text-anchor="end" font-size="9" fill="#2b6cb0" font-weight="700">main</text><text x="626" y="164" text-anchor="middle" font-size="8.5" fill="#276749" font-weight="700">feature (replayed)</text><text x="536" y="232" text-anchor="middle" font-size="9.5" fill="#4a5568">Clean, linear history — but the</text><text x="536" y="246" text-anchor="middle" font-size="9.5" fill="#4a5568">feature commits are rewritten</text><text x="536" y="260" text-anchor="middle" font-size="9.5" fill="#4a5568">(they get new hashes).</text><rect x="420" y="278" width="232" height="26" rx="7" fill="#fff5f5" stroke="#fc8181" stroke-width="1" /><text x="536" y="295" text-anchor="middle" font-size="8.5" fill="#c53030">Never rebase commits you've already shared.</text></svg>