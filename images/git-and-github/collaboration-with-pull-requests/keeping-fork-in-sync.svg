<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="320" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Two remotes keep your fork in sync</text><rect x="40" y="64" width="200" height="60" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="140" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">upstream</text><text x="140" y="105" text-anchor="middle" font-size="9" fill="#805ad5">the original repo (read-only to you)</text><rect x="400" y="64" width="200" height="60" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="500" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">origin</text><text x="500" y="105" text-anchor="middle" font-size="9" fill="#805ad5">your fork (you can push)</text><rect x="220" y="208" width="200" height="64" rx="9" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.5" /><text x="320" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">your local clone</text><text x="320" y="249" text-anchor="middle" font-size="9" fill="#3182ce">where you do the work</text><text x="320" y="263" text-anchor="middle" font-size="8.5" fill="#718096">main + feature branches</text><line x1="160" y1="124" x2="270" y2="206" stroke="#48bb78" stroke-width="2" /><polygon points="270 206 261 203 265 211" fill="#48bb78" /><text x="86" y="176" font-size="9.5" font-weight="700" fill="#276749" font-family="monospace">git fetch upstream</text><text x="86" y="190" font-size="9" fill="#2f855a">then merge upstream/main</text><line x1="372" y1="206" x2="478" y2="124" stroke="#4299e1" stroke-width="2" /><polygon points="478 124 469 126 473 133" fill="#4299e1" /><text x="492" y="176" font-size="9.5" font-weight="700" fill="#2b6cb0" font-family="monospace">git push origin</text><text x="492" y="190" font-size="9" fill="#3182ce">update your fork</text><text x="320" y="300" text-anchor="middle" font-size="11" fill="#718096">Add the original repo as a second remote called <tspan font-family="monospace" font-weight="700">upstream</tspan>: fetch its updates, merge them into your branch, then push to your fork.</text></svg>