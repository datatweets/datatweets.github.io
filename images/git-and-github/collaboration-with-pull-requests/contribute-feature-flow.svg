<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="260" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Five stages, one full contribution</text><line x1="80" y1="150" x2="560" y2="150" stroke="#cbd5e0" stroke-width="2" /><circle cx="80" cy="150" r="17" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="80" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="monospace">1</text><text x="80" y="178" text-anchor="middle" font-size="9" font-weight="700" fill="#2b6cb0">Fork &amp; clone</text><text x="80" y="190" text-anchor="middle" font-size="8" fill="#718096">get a writable copy</text><circle cx="200" cy="150" r="17" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="200" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="monospace">2</text><text x="200" y="178" text-anchor="middle" font-size="9" font-weight="700" fill="#2b6cb0">Branch &amp; change</text><text x="200" y="190" text-anchor="middle" font-size="8" fill="#718096">add priority to a task</text><circle cx="320" cy="150" r="17" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="320" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="monospace">3</text><text x="320" y="178" text-anchor="middle" font-size="9" font-weight="700" fill="#2b6cb0">Push</text><text x="320" y="190" text-anchor="middle" font-size="8" fill="#718096">branch to your fork</text><circle cx="440" cy="150" r="17" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="440" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="monospace">4</text><text x="440" y="178" text-anchor="middle" font-size="9" font-weight="700" fill="#2b6cb0">Open PR</text><text x="440" y="190" text-anchor="middle" font-size="8" fill="#718096">describe what and why</text><circle cx="560" cy="150" r="17" fill="#48bb78" stroke="#276749" stroke-width="2" /><text x="560" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="monospace">5</text><text x="560" y="178" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">Respond &amp; sync</text><text x="560" y="190" text-anchor="middle" font-size="8" fill="#718096">push fixes, then pull upstream</text><text x="320" y="224" text-anchor="middle" font-size="10.5" fill="#718096">Each stage uses one skill from this module. Stage 5 loops until the PR is approved and merged,</text><text x="320" y="238" text-anchor="middle" font-size="10.5" fill="#718096">then you sync your fork with upstream so your next contribution starts from the latest code.</text></svg>
