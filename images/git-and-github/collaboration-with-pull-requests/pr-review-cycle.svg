<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="320" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The code-review cycle on a pull request</text><rect x="40" y="120" width="120" height="56" rx="9" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.5" /><text x="100" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">PR opened</text><text x="100" y="160" text-anchor="middle" font-size="9" fill="#3182ce">your branch vs main</text><rect x="230" y="106" width="160" height="84" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="310" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">Reviewer reads it</text><text x="310" y="147" text-anchor="middle" font-size="9" fill="#805ad5">leaves comments,</text><text x="310" y="160" text-anchor="middle" font-size="9" fill="#805ad5">inline suggestions,</text><text x="310" y="173" text-anchor="middle" font-size="9" fill="#805ad5">and a verdict</text><line x1="160" y1="148" x2="228" y2="148" stroke="#a0aec0" stroke-width="1.8" /><polygon points="228 148 219 144 219 152" fill="#a0aec0" /><rect x="430" y="60" width="180" height="50" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" /><text x="520" y="80" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c05621">Request changes</text><text x="520" y="96" text-anchor="middle" font-size="9" fill="#9c4221">author pushes fixes</text><line x1="390" y1="130" x2="428" y2="98" stroke="#ed8936" stroke-width="1.8" /><polygon points="428 98 419 99 423 106" fill="#ed8936" /><path d="M430 92C360 40 360 60 312 104" fill="none" stroke="#ed8936" stroke-width="1.6" stroke-dasharray="4 3" /><polygon points="312 104 314 95 320 101" fill="#ed8936" /><text x="360" y="48" text-anchor="middle" font-size="8.5" fill="#9c4221">push commits, re-review</text><rect x="430" y="190" width="180" height="50" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="520" y="210" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">Approve</text><text x="520" y="226" text-anchor="middle" font-size="9" fill="#2f855a">looks good to merge</text><line x1="390" y1="166" x2="428" y2="208" stroke="#48bb78" stroke-width="1.8" /><polygon points="428 208 419 203 423 210" fill="#48bb78" /><rect x="430" y="262" width="180" height="44" rx="9" fill="#e6fffa" stroke="#319795" stroke-width="1.5" /><text x="520" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="#234e52">Merge the PR</text><text x="520" y="297" text-anchor="middle" font-size="9" fill="#2f855a">changes land in main</text><line x1="520" y1="240" x2="520" y2="260" stroke="#319795" stroke-width="1.6" /><polygon points="520 260 516 251 524 251" fill="#319795" /><text x="200" y="282" text-anchor="middle" font-size="10.5" fill="#718096">A PR is a conversation: reviewers comment,</text><text x="200" y="298" text-anchor="middle" font-size="10.5" fill="#718096">you revise, and it merges once approved.</text></svg>