<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="260" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Six steps from a repo you can't push to, to an open PR</text><line x1="64" y1="150" x2="574" y2="150" stroke="#cbd5e0" stroke-width="2" /><circle cx="64" cy="150" r="16" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="64" y="154" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="monospace">1</text><text x="64" y="176" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2b6cb0">Fork</text><text x="64" y="188" text-anchor="middle" font-size="8" fill="#718096" font-family="monospace">gh repo fork</text><circle cx="166" cy="150" r="16" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="166" y="154" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="monospace">2</text><text x="166" y="176" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2b6cb0">Clone</text><text x="166" y="188" text-anchor="middle" font-size="8" fill="#718096">fork to your computer</text><circle cx="268" cy="150" r="16" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="268" y="154" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="monospace">3</text><text x="268" y="176" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2b6cb0">Add upstream</text><text x="268" y="188" text-anchor="middle" font-size="8" fill="#718096">link to the original</text><circle cx="370" cy="150" r="16" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="370" y="154" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="monospace">4</text><text x="370" y="176" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2b6cb0">Branch + commit</text><text x="370" y="188" text-anchor="middle" font-size="8" fill="#718096" font-family="monospace">git switch -c</text><circle cx="472" cy="150" r="16" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="472" y="154" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="monospace">5</text><text x="472" y="176" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2b6cb0">Push</text><text x="472" y="188" text-anchor="middle" font-size="8" fill="#718096" font-family="monospace">-u origin branch</text><circle cx="574" cy="150" r="16" fill="#48bb78" stroke="#276749" stroke-width="2" /><text x="574" y="154" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="monospace">6</text><text x="574" y="176" text-anchor="middle" font-size="8.5" font-weight="700" fill="#276749">Open PR</text><text x="574" y="188" text-anchor="middle" font-size="8" fill="#718096" font-family="monospace">gh pr create</text><text x="320" y="222" text-anchor="middle" font-size="10.5" fill="#718096">You fork the original into your own account, clone it, and link back to the original as upstream.</text><text x="320" y="236" text-anchor="middle" font-size="10.5" fill="#718096">Then you branch, commit, and push to your fork, and open a pull request against the original's main.</text></svg>
