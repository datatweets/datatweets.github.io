<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="360" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The fork-and-pull-request lifecycle</text><rect x="20" y="52" width="600" height="120" rx="10" fill="#faf5ff" stroke="#e9d8fd" /><text x="34" y="70" font-size="10" font-weight="700" fill="#9f7aea">ON GITHUB</text><rect x="44" y="86" width="200" height="66" rx="9" fill="#fff" stroke="#9f7aea" stroke-width="1.5" /><text x="144" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">Original repo</text><text x="144" y="127" text-anchor="middle" font-size="9" fill="#805ad5">(upstream — you can't push)</text><text x="144" y="142" text-anchor="middle" font-size="8.5" fill="#a0aec0" font-family="monospace">owner/project</text><rect x="396" y="86" width="200" height="66" rx="9" fill="#fff" stroke="#9f7aea" stroke-width="1.5" /><text x="496" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">Your fork</text><text x="496" y="127" text-anchor="middle" font-size="9" fill="#805ad5">(your copy — you CAN push)</text><text x="496" y="142" text-anchor="middle" font-size="8.5" fill="#a0aec0" font-family="monospace">you/project</text><line x1="244" y1="112" x2="394" y2="112" stroke="#48bb78" stroke-width="2" /><polygon points="394 112 385 108 385 116" fill="#48bb78" /><text x="319" y="106" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">1. Fork</text><rect x="396" y="208" width="200" height="64" rx="9" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.5" /><text x="496" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Your computer</text><text x="496" y="249" text-anchor="middle" font-size="9" fill="#3182ce">local clone + feature branch</text><text x="496" y="263" text-anchor="middle" font-size="8.5" fill="#718096">edit, commit</text><line x1="486" y1="154" x2="486" y2="206" stroke="#4299e1" stroke-width="2" /><polygon points="486 206 482 197 490 197" fill="#4299e1" /><text x="430" y="184" text-anchor="end" font-size="9.5" font-weight="700" fill="#2b6cb0">2. clone</text><line x1="506" y1="206" x2="506" y2="154" stroke="#4299e1" stroke-width="2" stroke-dasharray="4 3" /><polygon points="506 154 502 163 510 163" fill="#4299e1" /><text x="516" y="184" font-size="9.5" font-weight="700" fill="#2b6cb0">4. push</text><text x="430" y="231" text-anchor="end" font-size="9.5" font-weight="700" fill="#718096">3. branch</text><text x="430" y="244" text-anchor="end" font-size="9.5" font-weight="700" fill="#718096">+ commit</text><path d="M396 132C320 200 220 200 144 156" fill="none" stroke="#ed8936" stroke-width="2" /><polygon points="144 156 150 163 153 154" fill="#ed8936" /><text x="270" y="200" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c05621">5. open a pull request</text><rect x="44" y="208" width="290" height="64" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="189" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">6. Review &amp; merge</text><text x="189" y="249" text-anchor="middle" font-size="9" fill="#2f855a">maintainer reviews, requests changes or approves,</text><text x="189" y="262" text-anchor="middle" font-size="9" fill="#2f855a">then merges your work into the original repo</text><line x1="144" y1="208" x2="144" y2="156" stroke="#48bb78" stroke-width="1.5" stroke-dasharray="3 3" /><text x="320" y="296" text-anchor="middle" font-size="11" fill="#718096">You fork a repo you can't push to, work on a branch in your own clone, push to your fork, then open a pull</text><text x="320" y="312" text-anchor="middle" font-size="11" fill="#718096">request asking the maintainers to review and merge your changes into the original project.</text></svg>