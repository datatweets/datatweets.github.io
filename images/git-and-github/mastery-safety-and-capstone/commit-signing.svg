<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="300" fill="#ffffff" /><text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Signed commits prove who made them</text><rect x="28" y="96" width="170" height="90" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="113" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">1. You commit</text><text x="113" y="144" text-anchor="middle" font-size="9" fill="#3182ce">Git signs it with your</text><text x="113" y="157" text-anchor="middle" font-size="9" fill="#3182ce">private key</text><text x="113" y="174" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#718096">commit.gpgsign true</text><line x1="198" y1="141" x2="236" y2="141" stroke="#a0aec0" stroke-width="2" /><polygon points="236 141 226 136 226 146" fill="#a0aec0" /><rect x="238" y="96" width="170" height="90" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="323" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">2. Push to GitHub</text><text x="323" y="144" text-anchor="middle" font-size="9" fill="#805ad5">the commit carries</text><text x="323" y="157" text-anchor="middle" font-size="9" fill="#805ad5">its signature</text><text x="323" y="174" text-anchor="middle" font-size="8.5" fill="#718096">your public key is on file</text><line x1="408" y1="141" x2="446" y2="141" stroke="#a0aec0" stroke-width="2" /><polygon points="446 141 436 136 436 146" fill="#a0aec0" /><rect x="448" y="96" width="244" height="90" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="570" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">3. GitHub verifies</text><text x="570" y="142" text-anchor="middle" font-size="9" fill="#2f855a">checks the signature against</text><text x="570" y="155" text-anchor="middle" font-size="9" fill="#2f855a">your public key, then shows:</text><rect x="524" y="162" width="92" height="20" rx="10" fill="#c6f6d5" stroke="#48bb78" stroke-width="1" /><text x="570" y="176" text-anchor="middle" font-size="10" font-weight="700" fill="#22543d">✓ Verified</text><text x="360" y="232" text-anchor="middle" font-size="11" fill="#4a5568">Anyone can set any name and email in their commits — signing proves a commit really</text><text x="360" y="250" text-anchor="middle" font-size="11" fill="#4a5568">came from you. Inspect locally with <tspan font-family="monospace" font-weight="700" fill="#2d3748">git log --show-signature</tspan>.</text></svg>