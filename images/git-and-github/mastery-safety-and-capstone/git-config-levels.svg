<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="330" fill="#ffffff" /><text x="350" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Three levels of Git configuration</text><rect x="120" y="64" width="460" height="58" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" /><text x="140" y="88" font-size="12" font-weight="700" fill="#4a5568">System</text><text x="140" y="106" font-size="9.5" font-family="monospace" fill="#718096">git config --system</text><text x="560" y="88" text-anchor="end" font-size="9.5" fill="#718096">every user on the machine</text><text x="560" y="106" text-anchor="end" font-size="8.5" font-family="monospace" fill="#a0aec0">/etc/gitconfig</text><rect x="120" y="132" width="460" height="58" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="140" y="156" font-size="12" font-weight="700" fill="#2b6cb0">Global</text><text x="140" y="174" font-size="9.5" font-family="monospace" fill="#3182ce">git config --global</text><text x="560" y="156" text-anchor="end" font-size="9.5" fill="#3182ce">your user (all your repos)</text><text x="560" y="174" text-anchor="end" font-size="8.5" font-family="monospace" fill="#90cdf4">~/.gitconfig</text><rect x="120" y="200" width="460" height="58" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="140" y="224" font-size="12" font-weight="700" fill="#6b46c1">Local</text><text x="140" y="242" font-size="9.5" font-family="monospace" fill="#805ad5">git config --local</text><text x="560" y="224" text-anchor="end" font-size="9.5" fill="#805ad5">this one repository</text><text x="560" y="242" text-anchor="end" font-size="8.5" font-family="monospace" fill="#d6bcfa">.git/config</text><line x1="60" y1="78" x2="60" y2="244" stroke="#48bb78" stroke-width="2.5" /><polygon points="60 250 54 238 66 238" fill="#48bb78" /><text x="44" y="170" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749" transform="rotate(-90 44 170)">more specific wins</text><text x="350" y="288" text-anchor="middle" font-size="11" fill="#4a5568">When a setting is defined at more than one level, the most specific one applies:</text><text x="350" y="306" text-anchor="middle" font-size="11" fill="#4a5568"><tspan font-weight="700" fill="#6b46c1">local</tspan> overrides <tspan font-weight="700" fill="#2b6cb0">global</tspan> overrides <tspan font-weight="700" fill="#4a5568">system</tspan> — so a work repo can use a different email than your default.</text></svg>