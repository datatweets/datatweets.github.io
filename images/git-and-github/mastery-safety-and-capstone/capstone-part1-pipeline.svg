<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="800" height="250" fill="#ffffff" /><text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">From an empty folder to a published repo — five stages</text><g text-anchor="middle"><rect x="25" y="72" width="120" height="86" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="85" y="98" font-size="12" font-weight="700" fill="#2b6cb0">1. Init</text><text x="85" y="120" font-size="9" font-family="monospace" fill="#3182ce">git init</text><text x="85" y="138" font-size="9" fill="#4a5568">empty folder</text><text x="85" y="151" font-size="9" fill="#4a5568">becomes a repo</text><rect x="185" y="72" width="120" height="86" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="245" y="98" font-size="12" font-weight="700" fill="#2b6cb0">2. Scaffold</text><text x="245" y="118" font-size="8.5" fill="#4a5568">.gitignore · LICENSE</text><text x="245" y="131" font-size="8.5" fill="#4a5568">README · code</text><text x="245" y="149" font-size="8.5" fill="#718096">initial commit</text><rect x="345" y="72" width="120" height="86" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="405" y="98" font-size="12" font-weight="700" fill="#2b6cb0">3. Feature</text><text x="405" y="120" font-size="9" font-family="monospace" fill="#3182ce">feat: ...</text><text x="405" y="138" font-size="9" fill="#4a5568">history grows by</text><text x="405" y="151" font-size="9" fill="#4a5568">one clear step</text><rect x="505" y="72" width="120" height="86" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="565" y="98" font-size="12" font-weight="700" fill="#c05621">4. Tag</text><text x="565" y="120" font-size="9" font-family="monospace" fill="#c05621">git tag -a v1.0.0</text><text x="565" y="138" font-size="9" fill="#4a5568">pin the release</text><text x="565" y="151" font-size="9" fill="#4a5568">to this commit</text><rect x="665" y="72" width="120" height="86" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="725" y="98" font-size="12" font-weight="700" fill="#6b46c1">5. Publish</text><text x="725" y="118" font-size="8.5" fill="#4a5568">create GitHub repo</text><text x="725" y="131" font-size="8.5" fill="#4a5568">push code,</text><text x="725" y="144" font-size="8.5" fill="#4a5568">then push the tag</text></g><g stroke="#a0aec0" stroke-width="1.8" fill="#a0aec0"><line x1="147" y1="115" x2="181" y2="115" /><polygon points="181 115 171 110 171 120" /><line x1="307" y1="115" x2="341" y2="115" /><polygon points="341 115 331 110 331 120" /><line x1="467" y1="115" x2="501" y2="115" /><polygon points="501 115 491 110 491 120" /><line x1="627" y1="115" x2="661" y2="115" /><polygon points="661 115 651 110 651 120" /></g><text x="400" y="196" text-anchor="middle" font-size="11" fill="#4a5568">Stages 1–4 happen entirely on your machine. Stage 5 pushes them to GitHub —</text><text x="400" y="214" text-anchor="middle" font-size="11" fill="#4a5568">and <tspan font-weight="700" fill="#6b46c1">git push</tspan> sends commits only, so the <tspan font-weight="700" fill="#c05621">v1.0.0</tspan> tag needs its own <tspan font-family="monospace">git push origin v1.0.0</tspan>.</text></svg>
