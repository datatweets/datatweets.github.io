<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="370" fill="#ffffff" /><text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The undo cheat sheet: “I made a mistake…”</text><rect x="28" y="56" width="300" height="42" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="44" y="73" font-size="10.5" font-weight="700" fill="#2d3748">I staged a file by mistake</text><text x="44" y="89" font-size="9" fill="#718096">unstage it, keep the edits</text><line x1="328" y1="77" x2="362" y2="77" stroke="#a0aec0" stroke-width="1.8" /><polygon points="362 77 352 72 352 82" fill="#a0aec0" /><rect x="364" y="56" width="328" height="42" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.2" /><text x="380" y="82" font-size="11" font-family="monospace" fill="#2b6cb0">git restore --staged &lt;file&gt;</text><rect x="28" y="106" width="300" height="42" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="44" y="123" font-size="10.5" font-weight="700" fill="#2d3748">I want to throw away my edits</text><text x="44" y="139" font-size="9" fill="#718096">restore the file to the last commit</text><line x1="328" y1="127" x2="362" y2="127" stroke="#a0aec0" stroke-width="1.8" /><polygon points="362 127 352 122 352 132" fill="#a0aec0" /><rect x="364" y="106" width="328" height="42" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.2" /><text x="380" y="132" font-size="11" font-family="monospace" fill="#2b6cb0">git restore &lt;file&gt;</text><rect x="28" y="156" width="300" height="42" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="44" y="173" font-size="10.5" font-weight="700" fill="#2d3748">My last commit needs a fix</text><text x="44" y="189" font-size="9" fill="#718096">amend the message or contents (not pushed)</text><line x1="328" y1="177" x2="362" y2="177" stroke="#a0aec0" stroke-width="1.8" /><polygon points="362 177 352 172 352 182" fill="#a0aec0" /><rect x="364" y="156" width="328" height="42" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.2" /><text x="380" y="182" font-size="11" font-family="monospace" fill="#6b46c1">git commit --amend</text><rect x="28" y="206" width="300" height="42" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="44" y="223" font-size="10.5" font-weight="700" fill="#2d3748">Undo my last commit, keep the work</text><text x="44" y="239" font-size="9" fill="#718096">move HEAD back, changes stay staged</text><line x1="328" y1="227" x2="362" y2="227" stroke="#a0aec0" stroke-width="1.8" /><polygon points="362 227 352 222 352 232" fill="#a0aec0" /><rect x="364" y="206" width="328" height="42" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.2" /><text x="380" y="232" font-size="11" font-family="monospace" fill="#6b46c1">git reset --soft HEAD~1</text><rect x="28" y="256" width="300" height="42" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.2" /><text x="44" y="273" font-size="10.5" font-weight="700" fill="#9b2c2c">Undo a commit I already pushed</text><text x="44" y="289" font-size="9" fill="#c05621">add a new commit that reverses it (safe)</text><line x1="328" y1="277" x2="362" y2="277" stroke="#a0aec0" stroke-width="1.8" /><polygon points="362 277 352 272 352 282" fill="#a0aec0" /><rect x="364" y="256" width="328" height="42" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.2" /><text x="380" y="282" font-size="11" font-family="monospace" fill="#276749">git revert &lt;commit&gt;</text><rect x="28" y="306" width="300" height="42" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="44" y="323" font-size="10.5" font-weight="700" fill="#2d3748">I lost a commit or deleted a branch</text><text x="44" y="339" font-size="9" fill="#718096">find it in the history of HEAD, then reset/branch</text><line x1="328" y1="327" x2="362" y2="327" stroke="#a0aec0" stroke-width="1.8" /><polygon points="362 327 352 322 352 332" fill="#a0aec0" /><rect x="364" y="306" width="328" height="42" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.2" /><text x="380" y="332" font-size="11" font-family="monospace" fill="#2b6cb0">git reflog</text></svg>