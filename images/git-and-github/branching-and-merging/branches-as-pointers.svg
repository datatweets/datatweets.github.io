<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="320" fill="#ffffff" /><text x="320" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">A branch is just a movable pointer to a commit</text><line x1="90" y1="190" x2="330" y2="190" stroke="#cbd5e0" stroke-width="2" /><circle cx="110" cy="190" r="14" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="110" y="194" text-anchor="middle" font-size="9" fill="#fff" font-family="monospace">c1</text><circle cx="230" cy="190" r="14" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="230" y="194" text-anchor="middle" font-size="9" fill="#fff" font-family="monospace">c2</text><line x1="244" y1="190" x2="330" y2="190" stroke="#cbd5e0" stroke-width="2" /><circle cx="350" cy="190" r="14" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="350" y="194" text-anchor="middle" font-size="9" fill="#fff" font-family="monospace">c4</text><line x1="244" y1="190" x2="336" y2="190" stroke="#cbd5e0" stroke-width="2" /><line x1="240" y1="178" x2="346" y2="120" stroke="#cbd5e0" stroke-width="2" /><circle cx="360" cy="112" r="14" fill="#48bb78" stroke="#276749" stroke-width="2" /><text x="360" y="116" text-anchor="middle" font-size="9" fill="#fff" font-family="monospace">c3</text><rect x="318" y="232" width="64" height="26" rx="5" fill="#ebf4ff" stroke="#4299e1" /><text x="350" y="249" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0" font-family="monospace">main</text><line x1="350" y1="232" x2="350" y2="206" stroke="#4299e1" stroke-width="1.6" /><polygon points="350 206 346 215 354 215" fill="#4299e1" /><rect x="400" y="99" width="190" height="26" rx="5" fill="#f0fff4" stroke="#48bb78" /><text x="495" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#276749" font-family="monospace">feature/colored-output</text><line x1="400" y1="112" x2="376" y2="112" stroke="#48bb78" stroke-width="1.6" /><polygon points="376 112 385 108 385 116" fill="#48bb78" /><rect x="290" y="276" width="58" height="24" rx="5" fill="#fffaf0" stroke="#ed8936" /><text x="319" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621" font-family="monospace">HEAD</text><line x1="335" y1="276" x2="343" y2="260" stroke="#ed8936" stroke-width="1.5" /><polygon points="343 260 334 263 340 268" fill="#ed8936" /><text x="360" y="292" font-size="9.5" fill="#718096">HEAD points to the branch you're on (here, main)</text><text x="320" y="54" text-anchor="middle" font-size="10.5" fill="#718096">Creating a branch just adds a new pointer; committing on it moves that pointer forward.</text><text x="320" y="70" text-anchor="middle" font-size="10.5" fill="#718096">Your files and history stay shared until the branches diverge.</text></svg>