<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="330" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Anatomy of a merge conflict</text><rect x="60" y="58" width="380" height="176" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" /><text x="74" y="82" font-size="11" fill="#2d3748" font-family="monospace">import sys</text><rect x="68" y="92" width="364" height="20" fill="#fff5f5" /><text x="74" y="106" font-size="11" fill="#c53030" font-family="monospace">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text><text x="74" y="128" font-size="11" fill="#2d3748" font-family="monospace">GREETING = "SkyLog v1.0"</text><rect x="68" y="138" width="364" height="20" fill="#edf2f7" /><text x="74" y="152" font-size="11" fill="#4a5568" font-family="monospace">=======</text><text x="74" y="174" font-size="11" fill="#2d3748" font-family="monospace">GREETING = "Hi there, stargazer!"</text><rect x="68" y="184" width="364" height="20" fill="#f0fff4" /><text x="74" y="198" font-size="11" fill="#276749" font-family="monospace">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/friendly-greeting</text><text x="74" y="222" font-size="11" fill="#2d3748" font-family="monospace">def add(observation):</text><line x1="440" y1="102" x2="486" y2="102" stroke="#e53e3e" stroke-width="1.4" /><text x="492" y="99" font-size="9.5" font-weight="700" fill="#c53030">start of conflict</text><text x="492" y="112" font-size="9" fill="#9b2c2c">your side (HEAD = current branch)</text><line x1="440" y1="148" x2="486" y2="148" stroke="#718096" stroke-width="1.4" /><text x="492" y="151" font-size="9.5" font-weight="700" fill="#4a5568">divider between the two sides</text><line x1="440" y1="194" x2="486" y2="194" stroke="#48bb78" stroke-width="1.4" /><text x="492" y="191" font-size="9.5" font-weight="700" fill="#276749">end of conflict</text><text x="492" y="204" font-size="9" fill="#2f855a">their side (incoming branch)</text><rect x="60" y="254" width="520" height="56" rx="8" fill="#fffaf0" stroke="#ed8936" /><text x="74" y="276" font-size="10.5" font-weight="700" fill="#c05621">To resolve:</text><text x="150" y="276" font-size="10" fill="#9c4221">edit the file to the version you want (keep one side, the other, or combine them),</text><text x="74" y="294" font-size="10" fill="#9c4221">delete all three marker lines, then <tspan font-family="monospace" font-weight="700">git add</tspan> the file and <tspan font-family="monospace" font-weight="700">git commit</tspan> to complete the merge.</text></svg>