<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="320" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Two features, developed in parallel, reunited</text><line x1="80" y1="160" x2="230" y2="160" stroke="#cbd5e0" stroke-width="2" /><circle cx="100" cy="160" r="13" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="100" y="164" text-anchor="middle" font-size="8" fill="#fff" font-family="monospace">1</text><text x="100" y="188" text-anchor="middle" font-size="9" fill="#718096">Add SkyLog</text><text x="100" y="200" text-anchor="middle" font-size="9" fill="#718096">script</text><line x1="230" y1="160" x2="300" y2="105" stroke="#48bb78" stroke-width="2" /><circle cx="315" cy="98" r="13" fill="#48bb78" stroke="#276749" stroke-width="2" /><text x="315" y="102" text-anchor="middle" font-size="8" fill="#fff" font-family="monospace">2</text><text x="315" y="76" text-anchor="middle" font-size="9" font-weight="700" fill="#276749" font-family="monospace">feature/timestamps</text><text x="315" y="122" text-anchor="middle" font-size="9" fill="#718096">Add timestamps</text><line x1="230" y1="160" x2="300" y2="215" stroke="#9f7aea" stroke-width="2" /><circle cx="315" cy="222" r="13" fill="#9f7aea" stroke="#6b46c1" stroke-width="2" /><text x="315" y="226" text-anchor="middle" font-size="8" fill="#fff" font-family="monospace">3</text><text x="315" y="248" text-anchor="middle" font-size="9" font-weight="700" fill="#6b46c1" font-family="monospace">feature/tags</text><text x="315" y="264" text-anchor="middle" font-size="9" fill="#718096">Add hashtag</text><line x1="328" y1="98" x2="450" y2="98" stroke="#48bb78" stroke-width="2" stroke-dasharray="4 3" /><text x="389" y="88" text-anchor="middle" font-size="9" fill="#276749">fast-forward</text><circle cx="465" cy="160" r="15" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="465" y="164" text-anchor="middle" font-size="9" fill="#6b46c1" font-family="monospace">M</text><line x1="450" y1="105" x2="465" y2="147" stroke="#48bb78" stroke-width="2" /><line x1="328" y1="222" x2="450" y2="172" stroke="#9f7aea" stroke-width="2" /><text x="400" y="183" text-anchor="middle" font-size="9" fill="#6b46c1">conflict, then resolved</text><rect x="440" y="192" width="60" height="24" rx="5" fill="#f0fff4" stroke="#48bb78" /><text x="470" y="208" text-anchor="middle" font-size="10" font-weight="700" fill="#276749" font-family="monospace">main</text><line x1="470" y1="192" x2="468" y2="176" stroke="#48bb78" stroke-width="1.6" /><polygon points="468 176 464 184 472 184" fill="#48bb78" /><text x="560" y="98" text-anchor="middle" font-size="9" fill="#718096">both features</text><text x="560" y="112" text-anchor="middle" font-size="9" fill="#718096">now live on</text><text x="560" y="126" text-anchor="middle" font-size="9" fill="#718096">main</text><text x="320" y="292" text-anchor="middle" font-size="10.5" fill="#718096">Both branches start from the same commit. The first merges as a clean fast-forward;</text><text x="320" y="306" text-anchor="middle" font-size="10.5" fill="#718096">the second collides with it and is resolved by combining both changes.</text></svg>
