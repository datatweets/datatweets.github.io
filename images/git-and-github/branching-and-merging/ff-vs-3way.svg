<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="340" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Two ways Git merges</text><line x1="320" y1="50" x2="320" y2="320" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 4" /><text x="160" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">Fast-forward</text><text x="160" y="84" text-anchor="middle" font-size="9.5" fill="#718096">main hasn't moved since the branch</text><circle cx="70" cy="140" r="13" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="70" y="144" text-anchor="middle" font-size="8" fill="#fff" font-family="monospace">c1</text><line x1="83" y1="140" x2="137" y2="140" stroke="#cbd5e0" stroke-width="2" /><circle cx="150" cy="140" r="13" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="150" y="144" text-anchor="middle" font-size="8" fill="#fff" font-family="monospace">c2</text><line x1="163" y1="140" x2="217" y2="140" stroke="#cbd5e0" stroke-width="2" /><circle cx="230" cy="140" r="13" fill="#48bb78" stroke="#276749" stroke-width="2" /><text x="230" y="144" text-anchor="middle" font-size="8" fill="#fff" font-family="monospace">c3</text><text x="150" y="172" text-anchor="middle" font-size="8.5" fill="#a0aec0">branch point</text><rect x="205" y="186" width="50" height="22" rx="5" fill="#f0fff4" stroke="#48bb78" /><text x="230" y="201" text-anchor="middle" font-size="9" font-weight="700" fill="#276749" font-family="monospace">main</text><line x1="230" y1="186" x2="230" y2="156" stroke="#48bb78" stroke-width="1.5" /><polygon points="230 156 226 165 234 165" fill="#48bb78" /><path d="M150 220C175 236 205 236 228 212" fill="none" stroke="#dd6b20" stroke-width="1.6" /><polygon points="228 212 219 214 224 220" fill="#dd6b20" /><text x="160" y="246" text-anchor="middle" font-size="9" fill="#c05621">main just slides forward to c3</text><text x="160" y="262" text-anchor="middle" font-size="9" fill="#718096">no merge commit is created</text><text x="480" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">Three-way merge</text><text x="480" y="84" text-anchor="middle" font-size="9.5" fill="#718096">both branches moved on (diverged)</text><circle cx="370" cy="160" r="13" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="370" y="164" text-anchor="middle" font-size="8" fill="#fff" font-family="monospace">c2</text><line x1="382" y1="166" x2="436" y2="190" stroke="#cbd5e0" stroke-width="2" /><circle cx="450" cy="196" r="13" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="450" y="200" text-anchor="middle" font-size="8" fill="#fff" font-family="monospace">c4</text><line x1="382" y1="154" x2="436" y2="130" stroke="#cbd5e0" stroke-width="2" /><circle cx="450" cy="124" r="13" fill="#48bb78" stroke="#276749" stroke-width="2" /><text x="450" y="128" text-anchor="middle" font-size="8" fill="#fff" font-family="monospace">c3</text><line x1="462" y1="190" x2="536" y2="166" stroke="#9f7aea" stroke-width="2" /><line x1="462" y1="130" x2="536" y2="156" stroke="#9f7aea" stroke-width="2" /><circle cx="550" cy="160" r="15" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="550" y="164" text-anchor="middle" font-size="9" fill="#6b46c1" font-family="monospace">M</text><rect x="520" y="196" width="60" height="22" rx="5" fill="#faf5ff" stroke="#9f7aea" /><text x="550" y="211" text-anchor="middle" font-size="9" font-weight="700" fill="#6b46c1" font-family="monospace">main</text><line x1="550" y1="196" x2="550" y2="176" stroke="#9f7aea" stroke-width="1.5" /><polygon points="550 176 546 185 554 185" fill="#9f7aea" /><text x="480" y="246" text-anchor="middle" font-size="9" fill="#553c9a">a new merge commit M ties the two histories together</text><text x="480" y="262" text-anchor="middle" font-size="9" fill="#718096">M has two parents (c3 and c4)</text><text x="320" y="306" text-anchor="middle" font-size="11" fill="#718096">If main hasn't advanced, Git fast-forwards the pointer; if both sides moved, it makes a merge commit.</text></svg>