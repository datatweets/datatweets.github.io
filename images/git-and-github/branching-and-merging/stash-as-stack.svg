<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="320" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The stash is a last-in, first-out stack</text><text x="320" y="52" text-anchor="middle" font-size="10.5" fill="#718096">Each git stash pushes a new entry on top; git stash pop always takes the top one off first.</text><rect x="70" y="90" width="190" height="170" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" /><text x="165" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">Working tree</text><rect x="90" y="150" width="150" height="40" rx="6" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.5" /><text x="165" y="174" text-anchor="middle" font-size="10.5" fill="#2b6cb0" font-family="monospace">M skylog.py</text><text x="165" y="230" text-anchor="middle" font-size="10" fill="#718096">unfinished change,</text><text x="165" y="244" text-anchor="middle" font-size="10" fill="#718096">not ready to commit</text><path d="M262 170 C 290 170 290 170 316 170" fill="none" stroke="#dd6b20" stroke-width="2" /><polygon points="316 170 306 165 306 175" fill="#dd6b20" /><text x="289" y="156" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621" font-family="monospace">git stash</text><rect x="330" y="90" width="220" height="190" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" /><text x="440" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">Stash stack</text><rect x="350" y="106" width="180" height="36" rx="6" fill="#fff" stroke="#ed8936" stroke-width="2" /><text x="440" y="129" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621" font-family="monospace">stash@{0} — newest</text><rect x="358" y="150" width="164" height="30" rx="6" fill="#fff" stroke="#f6ad55" stroke-width="1.5" /><text x="440" y="169" text-anchor="middle" font-size="9.5" fill="#c05621" font-family="monospace">stash@{1}</text><rect x="366" y="188" width="148" height="26" rx="6" fill="#fff" stroke="#fbd38d" stroke-width="1.5" /><text x="440" y="205" text-anchor="middle" font-size="9" fill="#c05621" font-family="monospace">stash@{2} — oldest</text><line x1="440" y1="228" x2="440" y2="254" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="3 3" /><text x="440" y="270" text-anchor="middle" font-size="9.5" fill="#a0aec0">stack grows upward</text><path d="M550 130 C 585 130 585 130 610 130" fill="none" stroke="#38a169" stroke-width="2" /><polygon points="610 130 600 125 600 135" fill="#38a169" /><text x="614" y="126" font-size="10" font-weight="700" fill="#276749" font-family="monospace" text-anchor="start">pop</text><text x="580" y="150" text-anchor="middle" font-size="9" fill="#718096">restores</text><text x="580" y="162" text-anchor="middle" font-size="9" fill="#718096">stash@{0}</text><text x="580" y="174" text-anchor="middle" font-size="9" fill="#718096">and removes</text><text x="580" y="186" text-anchor="middle" font-size="9" fill="#718096">it from the</text><text x="580" y="198" text-anchor="middle" font-size="9" fill="#718096">stack</text></svg>
