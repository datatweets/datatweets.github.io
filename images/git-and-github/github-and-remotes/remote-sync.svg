<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="320" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The four commands that sync local and remote</text><rect x="40" y="120" width="200" height="120" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.5" /><text x="140" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Your local repo</text><rect x="56" y="154" width="168" height="34" rx="5" fill="#fff" stroke="#90cdf4" /><text x="140" y="175" text-anchor="middle" font-size="9.5" fill="#3182ce">your branch (main)</text><rect x="56" y="194" width="168" height="34" rx="5" fill="#fff" stroke="#cbd5e0" /><text x="140" y="215" text-anchor="middle" font-size="9" fill="#718096">origin/main (remote-tracking)</text><rect x="400" y="120" width="200" height="120" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="500" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">Remote (GitHub)</text><text x="500" y="186" text-anchor="middle" font-size="9.5" fill="#805ad5">the shared main branch</text><path d="M410 108C320 78 320 78 230 108" fill="none" stroke="#48bb78" stroke-width="1.8" /><polygon points="230 108 239 105 235 113" fill="#48bb78" /><text x="320" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#276749" font-family="monospace">git clone</text><text x="320" y="94" text-anchor="middle" font-size="8.5" fill="#718096">make a local copy of the remote (once)</text><line x1="244" y1="166" x2="396" y2="166" stroke="#4299e1" stroke-width="2" /><polygon points="396 166 387 162 387 170" fill="#4299e1" /><text x="320" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0" font-family="monospace">git push</text><line x1="396" y1="196" x2="244" y2="196" stroke="#a0aec0" stroke-width="2" /><polygon points="244 196 253 192 253 200" fill="#a0aec0" /><text x="320" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#4a5568" font-family="monospace">git fetch</text><text x="320" y="212" text-anchor="middle" font-size="8.5" fill="#718096">downloads to origin/main (no merge)</text><path d="M410 252C320 286 320 286 230 252" fill="none" stroke="#ed8936" stroke-width="1.8" /><polygon points="230 252 239 249 235 257" fill="#ed8936" /><text x="320" y="278" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621" font-family="monospace">git pull</text><text x="320" y="292" text-anchor="middle" font-size="8.5" fill="#718096">fetch + merge into your branch</text><text x="320" y="312" text-anchor="middle" font-size="10.5" fill="#718096">clone copies once; push sends your commits up; fetch downloads without merging; pull = fetch then merge.</text></svg>