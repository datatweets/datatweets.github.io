<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="340" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">The upstream link appears after your first push</text><text x="160" y="54" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">Before: only git remote add origin</text><text x="480" y="54" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">After: git push -u origin main</text><rect x="40" y="66" width="240" height="100" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.5" /><text x="160" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Your local repo</text><rect x="56" y="100" width="208" height="34" rx="5" fill="#fff" stroke="#90cdf4" /><text x="160" y="121" text-anchor="middle" font-size="10" font-weight="700" fill="#3182ce" font-family="monospace">main</text><text x="160" y="152" text-anchor="middle" font-size="8.5" fill="#a0aec0">no origin/main bookmark yet</text><rect x="40" y="214" width="240" height="80" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" stroke-dasharray="5 4" /><text x="160" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">GitHub: origin</text><text x="160" y="254" text-anchor="middle" font-size="9" fill="#805ad5">empty — URL known, nothing pushed</text><text x="160" y="270" text-anchor="middle" font-size="8.5" fill="#a0aec0">no link to local main yet</text><line x1="160" y1="166" x2="160" y2="214" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="3 3" /><text x="178" y="193" text-anchor="start" font-size="8.5" fill="#a0aec0">no link</text><line x1="284" y1="117" x2="352" y2="117" stroke="#2b6cb0" stroke-width="1.8" /><polygon points="352 117 344 113 344 121" fill="#2b6cb0" /><text x="318" y="108" text-anchor="middle" font-size="9" font-weight="700" fill="#2b6cb0" font-family="monospace">git push -u</text><rect x="360" y="66" width="240" height="100" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.5" /><text x="480" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Your local repo</text><rect x="376" y="100" width="100" height="34" rx="5" fill="#fff" stroke="#90cdf4" /><text x="426" y="121" text-anchor="middle" font-size="10" font-weight="700" fill="#3182ce" font-family="monospace">main</text><rect x="484" y="100" width="100" height="34" rx="5" fill="#fff" stroke="#48bb78" stroke-width="1.5" /><text x="534" y="115" text-anchor="middle" font-size="8" font-weight="700" fill="#276749" font-family="monospace">origin/main</text><text x="534" y="127" text-anchor="middle" font-size="7.5" fill="#276749">(new)</text><rect x="360" y="214" width="240" height="80" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="480" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">GitHub: origin</text><text x="480" y="254" text-anchor="middle" font-size="10" font-weight="700" fill="#805ad5" font-family="monospace">main</text><text x="480" y="270" text-anchor="middle" font-size="8.5" fill="#a0aec0">your commits, now online</text><line x1="480" y1="166" x2="480" y2="214" stroke="#48bb78" stroke-width="2" /><polygon points="480 214 476 206 484 206" fill="#48bb78" /><text x="498" y="193" text-anchor="start" font-size="8.5" font-weight="700" fill="#276749" font-family="monospace">upstream</text><text x="320" y="318" text-anchor="middle" font-size="10.5" fill="#718096">git remote add origin just records a URL. git push -u origin main pushes, sets the</text><text x="320" y="332" text-anchor="middle" font-size="10.5" fill="#718096">upstream, and creates the origin/main bookmark you see in git branch -a.</text></svg>