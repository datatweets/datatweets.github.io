<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="260" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Six stages, one continuous publish</text><line x1="64" y1="150" x2="574" y2="150" stroke="#cbd5e0" stroke-width="2" /><circle cx="64" cy="150" r="16" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="64" y="154" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="monospace">1</text><text x="64" y="176" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2b6cb0">Create</text><text x="64" y="188" text-anchor="middle" font-size="8" fill="#718096" font-family="monospace">gh repo create</text><circle cx="166" cy="150" r="16" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="166" y="154" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="monospace">2</text><text x="166" y="176" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2b6cb0">Connect</text><text x="166" y="188" text-anchor="middle" font-size="8" fill="#718096" font-family="monospace">git remote add</text><circle cx="268" cy="150" r="16" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="268" y="154" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="monospace">3</text><text x="268" y="176" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2b6cb0">First push</text><text x="268" y="188" text-anchor="middle" font-size="8" fill="#718096" font-family="monospace">-u origin main</text><circle cx="370" cy="150" r="16" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="370" y="154" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="monospace">4</text><text x="370" y="176" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2b6cb0">Confirm</text><text x="370" y="188" text-anchor="middle" font-size="8" fill="#718096">files on GitHub</text><circle cx="472" cy="150" r="16" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" /><text x="472" y="154" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="monospace">5</text><text x="472" y="176" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2b6cb0">Push again</text><text x="472" y="188" text-anchor="middle" font-size="8" fill="#718096" font-family="monospace">plain git push</text><circle cx="574" cy="150" r="16" fill="#48bb78" stroke="#276749" stroke-width="2" /><text x="574" y="154" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="monospace">6</text><text x="574" y="176" text-anchor="middle" font-size="8.5" font-weight="700" fill="#276749">Clone</text><text x="574" y="188" text-anchor="middle" font-size="8" fill="#718096">to verify</text><text x="320" y="222" text-anchor="middle" font-size="10.5" fill="#718096">Each stage builds on the last: create the remote, connect, and push, then confirm,</text><text x="320" y="236" text-anchor="middle" font-size="10.5" fill="#718096">push a follow-up change, and clone elsewhere to prove SkyLog is really online.</text></svg>