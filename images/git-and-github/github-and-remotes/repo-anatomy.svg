<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="330" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">What a well-set-up repository contains</text><rect x="36" y="58" width="320" height="232" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" /><text x="52" y="82" font-size="11" font-weight="700" fill="#2d3748" font-family="monospace">skylog/</text><g font-family="monospace" font-size="11" fill="#2d3748"><text x="68" y="110">README.md</text><text x="68" y="140">LICENSE</text><text x="68" y="170">.gitignore</text><text x="68" y="200">skylog.py</text><text x="68" y="230">observations.md</text></g><g font-size="9.5"><line x1="196" y1="106" x2="232" y2="106" stroke="#cbd5e0" /><text x="240" y="103" font-weight="700" fill="#2b6cb0">what it is, why, how to run it</text><text x="240" y="116" fill="#718096">the front page of your repo</text><line x1="160" y1="136" x2="232" y2="136" stroke="#cbd5e0" /><text x="240" y="133" font-weight="700" fill="#276749">usage terms</text><text x="240" y="146" fill="#718096">lets others legally use your code</text><line x1="180" y1="166" x2="232" y2="166" stroke="#cbd5e0" /><text x="240" y="163" font-weight="700" fill="#c05621">what NOT to track</text><text x="240" y="176" fill="#718096">logs, caches, secrets, builds</text><line x1="170" y1="196" x2="232" y2="196" stroke="#cbd5e0" /><text x="240" y="193" font-weight="700" fill="#2d3748">your actual project</text><text x="240" y="206" fill="#718096">code, data, docs</text></g><rect x="36" y="300" width="568" height="18" fill="#fff" /><text x="320" y="313" text-anchor="middle" font-size="11" fill="#718096">On GitHub, also add a short description and topics so people can find and understand the project at a glance.</text><rect x="396" y="218" width="208" height="64" rx="8" fill="#faf5ff" stroke="#9f7aea" /><text x="410" y="238" font-size="10" font-weight="700" fill="#6b46c1">About (on GitHub)</text><text x="410" y="255" font-size="9" fill="#805ad5">"A CLI stargazing journal"</text><text x="410" y="272" font-size="9" fill="#805ad5">topics: python · cli · astronomy</text></svg>