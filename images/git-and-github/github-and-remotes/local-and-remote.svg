<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="640" height="340" fill="#ffffff" /><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">GitHub is the shared hub; everyone keeps a full copy</text><rect x="232" y="58" width="176" height="64" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" /><text x="320" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">GitHub (remote)</text><text x="320" y="103" text-anchor="middle" font-size="9.5" fill="#805ad5">the shared, online copy</text><text x="320" y="115" text-anchor="middle" font-size="9" fill="#a0aec0" font-family="monospace">github.com/datatweets/skylog</text><rect x="40" y="208" width="220" height="96" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="1.5" /><text x="150" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Your computer</text><rect x="56" y="240" width="90" height="50" rx="6" fill="#fff" stroke="#90cdf4" /><text x="101" y="260" text-anchor="middle" font-size="8.5" fill="#3182ce">working</text><text x="101" y="272" text-anchor="middle" font-size="8.5" fill="#3182ce">directory</text><rect x="154" y="240" width="92" height="50" rx="6" fill="#fff" stroke="#90cdf4" /><text x="200" y="260" text-anchor="middle" font-size="8.5" fill="#3182ce">local repo</text><text x="200" y="272" text-anchor="middle" font-size="8.5" fill="#3182ce">(full history)</text><rect x="380" y="208" width="220" height="96" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="490" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">A collaborator</text><rect x="396" y="240" width="90" height="50" rx="6" fill="#fff" stroke="#9ae6b4" /><text x="441" y="260" text-anchor="middle" font-size="8.5" fill="#2f855a">working</text><text x="441" y="272" text-anchor="middle" font-size="8.5" fill="#2f855a">directory</text><rect x="494" y="240" width="92" height="50" rx="6" fill="#fff" stroke="#9ae6b4" /><text x="540" y="260" text-anchor="middle" font-size="8.5" fill="#2f855a">local repo</text><text x="540" y="272" text-anchor="middle" font-size="8.5" fill="#2f855a">(full history)</text><line x1="180" y1="206" x2="262" y2="124" stroke="#4299e1" stroke-width="1.8" /><polygon points="262 124 253 126 257 133" fill="#4299e1" /><text x="196" y="170" font-size="9.5" font-weight="700" fill="#2b6cb0" font-family="monospace">push</text><line x1="250" y1="128" x2="170" y2="206" stroke="#a0aec0" stroke-width="1.6" stroke-dasharray="4 3" /><polygon points="170 206 179 203 175 211" fill="#a0aec0" /><text x="244" y="186" font-size="9" fill="#718096" font-family="monospace">pull / clone</text><line x1="460" y1="206" x2="378" y2="124" stroke="#48bb78" stroke-width="1.8" /><polygon points="378 124 387 126 383 133" fill="#48bb78" /><text x="446" y="170" font-size="9.5" font-weight="700" fill="#276749" font-family="monospace">push</text><line x1="390" y1="128" x2="470" y2="206" stroke="#a0aec0" stroke-width="1.6" stroke-dasharray="4 3" /><polygon points="470 206 461 203 465 211" fill="#a0aec0" /><text x="402" y="186" font-size="9" fill="#718096" font-family="monospace">pull / clone</text><text x="320" y="326" text-anchor="middle" font-size="11" fill="#718096">Each person has the complete repository locally; GitHub is the common place they push to and pull from to stay in sync.</text></svg>