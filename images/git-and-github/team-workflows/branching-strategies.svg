<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="360" fill="#ffffff" /><text x="380" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Three ways teams organize branches</text><rect x="24" y="56" width="226" height="270" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="137" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">GitHub Flow</text><text x="137" y="100" text-anchor="middle" font-size="9.5" fill="#718096">main + short feature branches</text><line x1="48" y1="170" x2="226" y2="170" stroke="#4299e1" stroke-width="2.5" /><circle cx="60" cy="170" r="5" fill="#4299e1" /><circle cx="226" cy="170" r="5" fill="#4299e1" /><text x="44" y="190" font-size="9" fill="#2b6cb0" font-weight="700">main</text><path d="M100 170C110 130 150 130 160 170" fill="none" stroke="#48bb78" stroke-width="2" /><circle cx="130" cy="133" r="4.5" fill="#48bb78" /><text x="130" y="124" text-anchor="middle" font-size="8.5" fill="#276749">feature</text><text x="137" y="232" text-anchor="middle" font-size="9" fill="#4a5568">Branch off main, open a PR,</text><text x="137" y="246" text-anchor="middle" font-size="9" fill="#4a5568">review, merge, deploy.</text><rect x="44" y="266" width="186" height="44" rx="7" fill="#ebf8ff" stroke="#90cdf4" stroke-width="1" /><text x="137" y="284" text-anchor="middle" font-size="8.5" fill="#2c5282" font-weight="700">Best for: most teams,</text><text x="137" y="298" text-anchor="middle" font-size="8.5" fill="#2c5282">continuous delivery</text><rect x="267" y="56" width="226" height="270" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="380" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">Git Flow</text><text x="380" y="100" text-anchor="middle" font-size="9.5" fill="#718096">main + develop + support branches</text><line x1="291" y1="150" x2="469" y2="150" stroke="#9f7aea" stroke-width="2.5" /><circle cx="303" cy="150" r="4.5" fill="#9f7aea" /><circle cx="469" cy="150" r="4.5" fill="#9f7aea" /><text x="287" y="142" font-size="8.5" fill="#6b46c1" font-weight="700">main</text><line x1="291" y1="190" x2="469" y2="190" stroke="#ed8936" stroke-width="2.5" /><circle cx="320" cy="190" r="4.5" fill="#ed8936" /><circle cx="440" cy="190" r="4.5" fill="#ed8936" /><text x="287" y="208" font-size="8.5" fill="#c05621" font-weight="700">develop</text><path d="M360 190C368 222 392 222 400 190" fill="none" stroke="#48bb78" stroke-width="1.8" /><circle cx="380" cy="224" r="4" fill="#48bb78" /><text x="380" y="245" text-anchor="middle" font-size="8" fill="#276749">feature</text><line x1="440" y1="190" x2="469" y2="150" stroke="#a0aec0" stroke-width="1.6" stroke-dasharray="3 2" /><text x="380" y="270" text-anchor="middle" font-size="9" fill="#4a5568">Long-lived develop, plus</text><text x="380" y="284" text-anchor="middle" font-size="9" fill="#4a5568">release + hotfix branches.</text><rect x="287" y="294" width="186" height="22" rx="7" fill="#faf5ff" stroke="#d6bcfa" stroke-width="1" /><text x="380" y="309" text-anchor="middle" font-size="8.5" fill="#553c9a">Best for: scheduled releases</text><rect x="510" y="56" width="226" height="270" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="623" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#2f855a">Trunk-Based</text><text x="623" y="100" text-anchor="middle" font-size="9.5" fill="#718096">one shared main, tiny changes</text><line x1="534" y1="170" x2="712" y2="170" stroke="#48bb78" stroke-width="2.5" /><circle cx="548" cy="170" r="4" fill="#48bb78" /><circle cx="578" cy="170" r="4" fill="#48bb78" /><circle cx="608" cy="170" r="4" fill="#48bb78" /><circle cx="638" cy="170" r="4" fill="#48bb78" /><circle cx="668" cy="170" r="4" fill="#48bb78" /><circle cx="698" cy="170" r="4" fill="#48bb78" /><text x="528" y="190" font-size="9" fill="#2f855a" font-weight="700">main</text><text x="623" y="232" text-anchor="middle" font-size="9" fill="#4a5568">Everyone integrates daily;</text><text x="623" y="246" text-anchor="middle" font-size="9" fill="#4a5568">unfinished work hides behind</text><text x="623" y="260" text-anchor="middle" font-size="9" fill="#4a5568">feature flags.</text><rect x="530" y="276" width="186" height="34" rx="7" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1" /><text x="623" y="297" text-anchor="middle" font-size="8.5" fill="#22543d">Best for: fast-moving teams, CI/CD</text></svg>