<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="340" fill="#ffffff" /><text x="350" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Anatomy of a Conventional Commit</text><rect x="70" y="70" width="70" height="34" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="105" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#2b6cb0" font-family="monospace">feat</text><rect x="140" y="70" width="78" height="34" rx="6" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="179" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#6b46c1" font-family="monospace">(cart)</text><rect x="218" y="70" width="24" height="34" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5" /><text x="230" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#c53030" font-family="monospace">!</text><text x="248" y="92" font-size="15" font-weight="700" fill="#1a202c" font-family="monospace">:</text><rect x="262" y="70" width="360" height="34" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="278" y="92" font-size="15" font-weight="700" fill="#276749" font-family="monospace">include tax in total</text><line x1="105" y1="104" x2="105" y2="128" stroke="#4299e1" stroke-width="1.2" /><text x="105" y="142" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2b6cb0">type</text><text x="105" y="155" text-anchor="middle" font-size="8" fill="#718096">feat, fix, docs...</text><line x1="179" y1="104" x2="179" y2="170" stroke="#9f7aea" stroke-width="1.2" /><text x="179" y="184" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6b46c1">scope (optional)</text><text x="179" y="197" text-anchor="middle" font-size="8" fill="#718096">what area changed</text><line x1="230" y1="104" x2="230" y2="210" stroke="#e53e3e" stroke-width="1.2" /><text x="230" y="224" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">! = breaking change</text><line x1="440" y1="104" x2="440" y2="128" stroke="#48bb78" stroke-width="1.2" /><text x="440" y="142" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">description</text><text x="440" y="155" text-anchor="middle" font-size="8" fill="#718096">imperative, lower-case, no period</text><rect x="70" y="238" width="560" height="80" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="86" y="260" font-size="11" fill="#4a5568" font-family="monospace">The total now accepts an optional tax rate and applies it.</text><text x="86" y="290" font-size="11" font-weight="700" fill="#c53030" font-family="monospace">BREAKING CHANGE: total() signature changed; callers</text><text x="86" y="306" font-size="11" font-weight="700" fill="#c53030" font-family="monospace">must pass tax or rely on the default.</text><text x="640" y="256" text-anchor="end" font-size="8.5" font-style="italic" fill="#718096" /><text x="86" y="234" font-size="9.5" font-weight="700" fill="#718096">blank line, then body and footer:</text></svg>