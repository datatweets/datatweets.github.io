<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="340" fill="#ffffff" /><text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">One feature-to-release loop</text><text x="360" y="50" text-anchor="middle" font-size="11" fill="#718096">The same six stages every change goes through, then back to the top for the next one</text><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a0aec0" /></marker></defs><g><rect x="24" y="90" width="100" height="72" rx="9" fill="#ebf8ff" stroke="#63b3ed" stroke-width="1.4" /><text x="74" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">1. Update main</text><text x="74" y="130" text-anchor="middle" font-size="8" font-family="monospace" fill="#2c5282">git switch main</text><text x="74" y="143" text-anchor="middle" font-size="8" font-family="monospace" fill="#2c5282">git pull</text></g><g><rect x="148" y="90" width="100" height="72" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" /><text x="198" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">2. Branch</text><text x="198" y="132" text-anchor="middle" font-size="8" font-family="monospace" fill="#4a5568">git switch -c</text><text x="198" y="144" text-anchor="middle" font-size="8" font-family="monospace" fill="#4a5568">feat/discount</text></g><g><rect x="272" y="90" width="100" height="72" rx="9" fill="#f0fff4" stroke="#68d391" stroke-width="1.4" /><text x="322" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">3. Commit</text><text x="322" y="132" text-anchor="middle" font-size="8" font-family="monospace" fill="#22543d">feat(cart):</text><text x="322" y="144" text-anchor="middle" font-size="8" font-family="monospace" fill="#22543d">add discount</text></g><g><rect x="396" y="90" width="100" height="72" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" /><text x="446" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">4. Push + PR</text><text x="446" y="132" text-anchor="middle" font-size="8" font-family="monospace" fill="#4a5568">git push -u</text><text x="446" y="144" text-anchor="middle" font-size="8" font-family="monospace" fill="#4a5568">gh pr create</text></g><g><rect x="520" y="90" width="100" height="72" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" /><text x="570" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">5. Review +</text><text x="570" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">merge</text><text x="570" y="146" text-anchor="middle" font-size="8" font-family="monospace" fill="#4a5568">gh pr merge</text></g><g><rect x="620" y="196" width="76" height="72" rx="9" fill="#e6fffa" stroke="#4fd1c5" stroke-width="1.4" /><text x="658" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#234e52">6. Cut</text><text x="658" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#234e52">release</text><text x="658" y="252" text-anchor="middle" font-size="8" font-family="monospace" fill="#2c7a7b">tag v1.1.0</text></g><line x1="124" y1="126" x2="146" y2="126" stroke="#a0aec0" stroke-width="1.8" marker-end="url(#arr)" /><line x1="248" y1="126" x2="270" y2="126" stroke="#a0aec0" stroke-width="1.8" marker-end="url(#arr)" /><line x1="372" y1="126" x2="394" y2="126" stroke="#a0aec0" stroke-width="1.8" marker-end="url(#arr)" /><line x1="496" y1="126" x2="518" y2="126" stroke="#a0aec0" stroke-width="1.8" marker-end="url(#arr)" /><path d="M600 155 C 640 175, 658 180, 658 194" fill="none" stroke="#a0aec0" stroke-width="1.8" marker-end="url(#arr)" /><path d="M620 232 C 320 300, 200 300, 74 300 C 44 300, 40 190, 46 164" fill="none" stroke="#a0aec0" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)" /><text x="330" y="315" text-anchor="middle" font-size="9" fill="#718096">next change starts the loop again from an up-to-date main</text><path d="M322 162 C 322 185, 500 185, 620 210" fill="none" stroke="#38a169" stroke-width="1.5" stroke-dasharray="4 3" /><rect x="300" y="176" width="180" height="20" rx="6" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1" /><text x="390" y="190" text-anchor="middle" font-size="8.5" fill="#276749">feat type &#8594; MINOR version bump</text></svg>
