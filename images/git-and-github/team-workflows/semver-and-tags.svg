<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="340" fill="#ffffff" /><text x="350" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Semantic versioning: MAJOR.MINOR.PATCH</text><text x="350" y="92" text-anchor="middle" font-size="44" font-weight="700" font-family="monospace" fill="#1a202c"><tspan fill="#c53030">1</tspan><tspan fill="#4a5568">.</tspan><tspan fill="#2b6cb0">4</tspan><tspan fill="#4a5568">.</tspan><tspan fill="#276749">2</tspan></text><line x1="305" y1="104" x2="305" y2="132" stroke="#c53030" stroke-width="1.4" /><line x1="350" y1="104" x2="350" y2="132" stroke="#2b6cb0" stroke-width="1.4" /><line x1="395" y1="104" x2="395" y2="132" stroke="#276749" stroke-width="1.4" /><rect x="40" y="138" width="195" height="86" rx="9" fill="#fff5f5" stroke="#fc8181" stroke-width="1.4" /><text x="137" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">MAJOR</text><text x="137" y="182" text-anchor="middle" font-size="10" fill="#742a2a">Breaking changes</text><text x="137" y="200" text-anchor="middle" font-size="9" fill="#9b2c2c">existing code may</text><text x="137" y="213" text-anchor="middle" font-size="9" fill="#9b2c2c">stop working</text><rect x="252" y="138" width="196" height="86" rx="9" fill="#ebf8ff" stroke="#63b3ed" stroke-width="1.4" /><text x="350" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">MINOR</text><text x="350" y="182" text-anchor="middle" font-size="10" fill="#2c5282">New features</text><text x="350" y="200" text-anchor="middle" font-size="9" fill="#2b6cb0">added in a</text><text x="350" y="213" text-anchor="middle" font-size="9" fill="#2b6cb0">backward-compatible way</text><rect x="465" y="138" width="195" height="86" rx="9" fill="#f0fff4" stroke="#68d391" stroke-width="1.4" /><text x="562" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">PATCH</text><text x="562" y="182" text-anchor="middle" font-size="10" fill="#22543d">Bug fixes</text><text x="562" y="200" text-anchor="middle" font-size="9" fill="#2f855a">no new features,</text><text x="562" y="213" text-anchor="middle" font-size="9" fill="#2f855a">nothing breaks</text><text x="350" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">A release is a tagged commit:</text><rect x="120" y="276" width="150" height="40" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="195" y="294" text-anchor="middle" font-size="10" font-family="monospace" fill="#2d3748">git tag -a v1.4.2</text><text x="195" y="308" text-anchor="middle" font-size="8.5" fill="#718096">annotated tag on a commit</text><line x1="270" y1="296" x2="328" y2="296" stroke="#a0aec0" stroke-width="1.8" /><polygon points="328 296 319 292 319 300" fill="#a0aec0" /><rect x="330" y="276" width="120" height="40" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="390" y="294" text-anchor="middle" font-size="10" font-family="monospace" fill="#2d3748">git push --tags</text><text x="390" y="308" text-anchor="middle" font-size="8.5" fill="#718096">share the tag</text><line x1="450" y1="296" x2="508" y2="296" stroke="#a0aec0" stroke-width="1.8" /><polygon points="508 296 499 292 499 300" fill="#a0aec0" /><rect x="510" y="276" width="150" height="40" rx="8" fill="#e6fffa" stroke="#4fd1c5" stroke-width="1.2" /><text x="585" y="294" text-anchor="middle" font-size="10" font-weight="700" fill="#234e52">GitHub Release</text><text x="585" y="308" text-anchor="middle" font-size="8.5" fill="#2c7a7b">notes + downloads</text></svg>