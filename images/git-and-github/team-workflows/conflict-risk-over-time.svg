<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="320" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Conflict risk grows with a branch's age and size</text><text x="350" y="50" text-anchor="middle" font-size="11" fill="#718096">The same feature, merged early vs. merged late, against a moving main</text><text x="40" y="92" font-size="12" font-weight="700" fill="#276749">Merged after 1 day</text><line x1="150" y1="110" x2="600" y2="110" stroke="#a0aec0" stroke-width="2" /><text x="150" y="103" font-size="9" fill="#718096">main</text><circle cx="190" cy="110" r="4" fill="#a0aec0" /><circle cx="250" cy="110" r="4" fill="#a0aec0" /><circle cx="300" cy="110" r="4" fill="#a0aec0" /><path d="M190 110 C 190 138, 205 138, 225 138 L 270 138 C 292 138, 300 116, 300 110" fill="none" stroke="#38a169" stroke-width="2" /><circle cx="240" cy="138" r="4" fill="#38a169" /><text x="205" y="156" font-size="9" fill="#276749">feature branch (1 commit)</text><rect x="440" y="92" width="180" height="38" rx="8" fill="#f0fff4" stroke="#68d391" stroke-width="1.4" /><text x="530" y="108" text-anchor="middle" font-size="9.5" fill="#22543d">2 commits landed on main</text><text x="530" y="122" text-anchor="middle" font-size="9.5" fill="#22543d">small, boring merge</text><text x="40" y="212" font-size="12" font-weight="700" fill="#c53030">Merged after 3 weeks</text><line x1="150" y1="230" x2="600" y2="230" stroke="#a0aec0" stroke-width="2" /><text x="150" y="223" font-size="9" fill="#718096">main</text><circle cx="190" cy="230" r="4" fill="#a0aec0" /><circle cx="230" cy="230" r="4" fill="#a0aec0" /><circle cx="270" cy="230" r="4" fill="#a0aec0" /><circle cx="310" cy="230" r="4" fill="#a0aec0" /><circle cx="350" cy="230" r="4" fill="#a0aec0" /><circle cx="390" cy="230" r="4" fill="#a0aec0" /><circle cx="430" cy="230" r="4" fill="#a0aec0" /><circle cx="470" cy="230" r="4" fill="#a0aec0" /><path d="M190 230 C 190 262, 205 262, 225 262 L 470 262 C 496 262, 500 236, 500 230" fill="none" stroke="#c53030" stroke-width="2" /><circle cx="260" cy="262" r="4" fill="#c53030" /><circle cx="330" cy="262" r="4" fill="#c53030" /><circle cx="400" cy="262" r="4" fill="#c53030" /><text x="210" y="280" font-size="9" fill="#9b2c2c">feature branch (many commits, wide drift)</text><rect x="440" y="196" width="180" height="38" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.4" /><text x="530" y="212" text-anchor="middle" font-size="9.5" fill="#742a2a">dozens of commits on main</text><text x="530" y="226" text-anchor="middle" font-size="9.5" fill="#742a2a">tangled, risky merge</text><text x="350" y="305" text-anchor="middle" font-size="10" fill="#718096">Integrate often and keep branches short: reconcile small differences continuously, not one giant merge at the end.</text></svg>
