<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<rect x="0" y="0" width="960" height="700" fill="#ffffff"/>
<text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">Logs, Describe, Events: Two Real Failures</text>
<text x="480" y="58" text-anchor="middle" font-size="14" fill="#718096">A container that ran and crashed, versus a pod that never started at all</text>

<text x="240" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3748">Failure 1: a real crash</text>
<line x1="480" y1="76" x2="480" y2="560" stroke="#e2e8f0" stroke-width="1"/>

<rect x="60" y="108" width="360" height="72" rx="10" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="240" y="130" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#276749">Events: Scheduled, Pulled, Created, Started</text>
<text x="240" y="150" text-anchor="middle" font-size="10" fill="#4a5568">all Normal - the container genuinely ran</text>
<text x="240" y="168" text-anchor="middle" font-size="9.5" fill="#718096">cityflow-borough-summary</text>

<line x1="240" y1="180" x2="240" y2="206" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrows)"/>

<rect x="60" y="210" width="360" height="90" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
<text x="240" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#c53030">kubectl logs</text>
<text x="240" y="248" text-anchor="middle" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4a5568">Traceback ... KeyError: 'Newark'</text>
<text x="240" y="266" text-anchor="middle" font-size="9.5" fill="#718096">code assumed "Newark", real data uses "EWR"</text>
<text x="240" y="284" text-anchor="middle" font-size="9.5" fill="#718096">a real, natural bug - not staged</text>

<line x1="240" y1="300" x2="240" y2="326" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrows)"/>

<rect x="60" y="330" width="360" height="90" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
<text x="240" y="350" text-anchor="middle" font-size="11" font-weight="700" fill="#c53030">kubectl describe pod</text>
<text x="240" y="368" text-anchor="middle" font-size="10.5" fill="#4a5568">State: Terminated &#8226; Reason: Error</text>
<text x="240" y="386" text-anchor="middle" font-size="10.5" fill="#4a5568">Exit Code: 1</text>
<text x="240" y="404" text-anchor="middle" font-size="9.5" fill="#718096">the code itself failed, not the platform</text>

<line x1="240" y1="420" x2="240" y2="446" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrows)"/>

<rect x="60" y="450" width="360" height="70" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
<text x="240" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#c53030">kubectl get events</text>
<text x="240" y="490" text-anchor="middle" font-size="10" fill="#4a5568">Warning: BackoffLimitExceeded</text>
<text x="240" y="508" text-anchor="middle" font-size="9.5" fill="#718096">two identical retries, then the Job gave up</text>

<text x="720" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3748">Failure 2: never scheduled</text>

<rect x="540" y="108" width="360" height="72" rx="10" fill="#fffaf0" stroke="#c05621" stroke-width="1.5"/>
<text x="720" y="130" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#c05621">cityflow-etl-oversized: requests.cpu 50</text>
<text x="720" y="150" text-anchor="middle" font-size="10" fill="#4a5568">node's real allocatable capacity: 10 cores</text>
<text x="720" y="168" text-anchor="middle" font-size="9.5" fill="#718096">STATUS: Pending - and stays Pending</text>

<line x1="720" y1="180" x2="720" y2="206" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrows)"/>

<rect x="540" y="210" width="360" height="90" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
<text x="720" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">kubectl logs</text>
<text x="720" y="250" text-anchor="middle" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#718096">"container-in-waiting and</text>
<text x="720" y="266" text-anchor="middle" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#718096">cannot currently be logged"</text>
<text x="720" y="286" text-anchor="middle" font-size="9.5" fill="#a0aec0" font-weight="700">nothing to show - it never ran</text>

<line x1="720" y1="300" x2="720" y2="326" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrows)"/>

<rect x="540" y="330" width="360" height="90" rx="10" fill="#fffaf0" stroke="#c05621" stroke-width="1.5"/>
<text x="720" y="350" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">kubectl describe pod</text>
<text x="720" y="368" text-anchor="middle" font-size="10.5" fill="#4a5568">Warning: FailedScheduling</text>
<text x="720" y="386" text-anchor="middle" font-size="10" fill="#4a5568">"0/1 nodes available: Insufficient cpu"</text>
<text x="720" y="404" text-anchor="middle" font-size="9.5" fill="#718096">from default-scheduler itself</text>

<line x1="720" y1="420" x2="720" y2="446" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrows)"/>

<rect x="540" y="450" width="360" height="70" rx="10" fill="#fffaf0" stroke="#c05621" stroke-width="1.5"/>
<text x="720" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">kubectl get events</text>
<text x="720" y="490" text-anchor="middle" font-size="10" fill="#4a5568">identical FailedScheduling event</text>
<text x="720" y="508" text-anchor="middle" font-size="9.5" fill="#718096">namespace-wide view, same message</text>

<line x1="60" y1="540" x2="900" y2="540" stroke="#e2e8f0" stroke-width="1"/>

<text x="480" y="572" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">logs only works once a container has actually run</text>
<text x="480" y="598" text-anchor="middle" font-size="12" fill="#4a5568">describe and events work even when nothing ever did - they describe the pod's lifecycle,</text>
<text x="480" y="620" text-anchor="middle" font-size="12" fill="#4a5568">not just what a running process happened to print.</text>
<text x="480" y="656" text-anchor="middle" font-size="10.5" fill="#a0aec0">All output above is real kubectl output captured for this lesson - neither failure was staged after the fact.</text>

<defs>
<marker id="arrows" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L6,3 L0,6 Z" fill="#a0aec0"/>
</marker>
</defs>
</svg>
