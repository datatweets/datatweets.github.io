<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<rect x="0" y="0" width="960" height="720" fill="#ffffff"/>
<text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">From Compose to Kubernetes</text>
<text x="480" y="58" text-anchor="middle" font-size="14" fill="#718096">Module 4's ETL + Postgres stack, translated object by object</text>

<text x="240" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3748">Docker Compose</text>
<text x="720" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3748">Kubernetes</text>
<line x1="480" y1="76" x2="480" y2="470" stroke="#e2e8f0" stroke-width="1"/>

<rect x="60" y="104" width="360" height="72" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="240" y="126" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2b6cb0">services.db: postgres:16-alpine</text>
<text x="240" y="144" text-anchor="middle" font-size="10" fill="#4a5568">named volume + healthcheck: pg_isready</text>
<text x="240" y="160" text-anchor="middle" font-size="9.5" fill="#718096">interval 2s, retries 10</text>

<line x1="420" y1="140" x2="540" y2="140" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrows)"/>

<rect x="540" y="94" width="360" height="92" rx="10" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="720" y="114" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#276749">Deployment cityflow-db + Service</text>
<text x="720" y="132" text-anchor="middle" font-size="10" fill="#4a5568">PersistentVolumeClaim cityflow-db-pvc</text>
<text x="720" y="150" text-anchor="middle" font-size="10" fill="#4a5568">readinessProbe: exec pg_isready</text>
<text x="720" y="168" text-anchor="middle" font-size="9.5" fill="#718096">identical command, Kubernetes-native check</text>

<rect x="60" y="196" width="360" height="90" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="240" y="218" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2b6cb0">services.etl: build: .</text>
<text x="240" y="236" text-anchor="middle" font-size="10" fill="#4a5568">depends_on: db: condition: service_healthy</text>
<text x="240" y="254" text-anchor="middle" font-size="10" fill="#4a5568">volumes: ./trips.parquet:/data/trips.parquet:ro</text>
<text x="240" y="272" text-anchor="middle" font-size="9.5" fill="#718096">a real, mounted local file</text>

<line x1="420" y1="240" x2="540" y2="240" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrows)"/>

<rect x="540" y="196" width="360" height="110" rx="10" fill="#fffaf0" stroke="#c05621" stroke-width="1.5"/>
<text x="720" y="216" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#c05621">Job cityflow-etl-job</text>
<text x="720" y="234" text-anchor="middle" font-size="10" fill="#4a5568">initContainer wait-for-db: loops pg_isready</text>
<text x="720" y="252" text-anchor="middle" font-size="10" fill="#4a5568">against cityflow-db-svc before etl starts</text>
<text x="720" y="270" text-anchor="middle" font-size="9.5" fill="#c05621" font-weight="700">no depends_on field exists - built by hand</text>
<text x="720" y="288" text-anchor="middle" font-size="9.5" fill="#718096">no host mount - falls back to fetching the real file</text>

<line x1="60" y1="326" x2="900" y2="326" stroke="#e2e8f0" stroke-width="1"/>

<text x="480" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">the one genuine gap</text>
<text x="480" y="380" text-anchor="middle" font-size="12" fill="#4a5568">Compose's depends_on: condition: service_healthy is a declarative promise Kubernetes has no field for.</text>
<text x="480" y="402" text-anchor="middle" font-size="12" fill="#4a5568">The idiomatic replacement is an initContainer that runs the identical real readiness check itself.</text>

<line x1="480" y1="430" x2="480" y2="454" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrows)"/>

<rect x="130" y="458" width="700" height="130" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
<text x="480" y="484" text-anchor="middle" font-size="13" font-weight="700" fill="#2d3748">real result, both stacks identical</text>
<text x="480" y="510" text-anchor="middle" font-size="12" fill="#2d3748">77,530 zone-hour buckets &#8226; 2,964,606 trips kept &#8226; 18 quarantined</text>
<text x="480" y="534" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">$79,455,941.50 total revenue</text>
<text x="480" y="558" text-anchor="middle" font-size="11" fill="#718096">busiest zone-hour: zone 161 at 2024-01-24T18, 726 trips</text>
<text x="480" y="578" text-anchor="middle" font-size="10.5" fill="#718096">confirmed by an independent query against zone_hour_report in Postgres</text>

<text x="480" y="642" text-anchor="middle" font-size="11" fill="#4a5568">Same ETL logic, same real January 2024 data, a completely different orchestrator underneath.</text>
<text x="480" y="668" text-anchor="middle" font-size="10.5" fill="#a0aec0">All commands, manifests, and output above are from a real run captured for this lesson.</text>

<defs>
<marker id="arrows" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L6,3 L0,6 Z" fill="#a0aec0"/>
</marker>
</defs>
</svg>
