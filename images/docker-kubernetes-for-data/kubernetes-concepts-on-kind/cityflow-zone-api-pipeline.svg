<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<rect x="0" y="0" width="960" height="640" fill="#ffffff"/>
<text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">CityFlow's Zone-Lookup API, Deployed to Kubernetes</text>
<text x="480" y="58" text-anchor="middle" font-size="14" fill="#718096">a real, original service &#8212; built, loaded into Kind, deployed, and verified end to end</text>

<rect x="40" y="82" width="150" height="70" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/>
<text x="115" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">zone_api.py</text>
<text x="115" y="122" text-anchor="middle" font-size="9.5" fill="#4a5568">stdlib HTTP server</text>
<text x="115" y="136" text-anchor="middle" font-size="9.5" fill="#4a5568">+ 265-zone CSV</text>

<line x1="190" y1="117" x2="222" y2="117" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowz)"/>

<rect x="226" y="82" width="150" height="70" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/>
<text x="301" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">docker build</text>
<text x="301" y="122" text-anchor="middle" font-size="9.5" fill="#4a5568">cityflow-zone-api:1.0</text>
<text x="301" y="136" text-anchor="middle" font-size="9.5" fill="#4a5568">143MB, python:3.13-slim</text>

<line x1="376" y1="117" x2="408" y2="117" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowz)"/>

<rect x="412" y="82" width="160" height="70" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="492" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">kind load docker-image</text>
<text x="492" y="122" text-anchor="middle" font-size="9.5" fill="#4a5568">into datatweets-docker-k8s</text>
<text x="492" y="136" text-anchor="middle" font-size="9.5" fill="#4a5568">no registry needed, local only</text>

<line x1="572" y1="117" x2="604" y2="117" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowz)"/>

<rect x="608" y="82" width="310" height="70" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="763" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">kubectl apply -f namespace/deployment/service.yaml</text>
<text x="763" y="120" text-anchor="middle" font-size="9.5" fill="#4a5568">namespace cityflow &#8226; deployment zone-api (2 replicas)</text>
<text x="763" y="136" text-anchor="middle" font-size="9.5" fill="#4a5568">service zone-api-svc, ClusterIP 10.96.6.59</text>

<line x1="763" y1="152" x2="763" y2="182" stroke="#276749" stroke-width="1.5" marker-end="url(#arrowg)"/>

<rect x="40" y="186" width="880" height="150" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1"/>
<text x="60" y="210" font-size="12.5" font-weight="700" fill="#2d3748">verified end to end, from a real client pod (kubectl exec ... wget)</text>
<text x="60" y="232" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4a5568">GET /healthz    &#8594; {"status": "ok", "zones_loaded": 265}</text>
<text x="60" y="254" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4a5568">GET /zones      &#8594; 265 zones across 8 boroughs (Manhattan 69, Queens 69, Brooklyn 61, Bronx 43, Staten Island 20, EWR 1, ...)</text>
<text x="60" y="276" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4a5568">GET /zones/236  &#8594; {"LocationID": 236, "Borough": "Manhattan", "Zone": "Upper East Side North", ...}</text>
<text x="60" y="304" font-size="10.5" fill="#718096">zone 236 is the same busy Manhattan zone Module 4's loader measured at 9,198 real trips &#8212; the same</text>
<text x="60" y="320" font-size="10.5" fill="#718096">real dataset, now served live by a Deployment and Service instead of only aggregated by a batch job.</text>

<line x1="480" y1="336" x2="480" y2="366" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowz)"/>

<rect x="40" y="370" width="420" height="72" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="250" y="394" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">confirmed visually</text>
<text x="250" y="412" text-anchor="middle" font-size="10.5" fill="#4a5568">Kubernetes Dashboard: 2/2 pods Running,</text>
<text x="250" y="428" text-anchor="middle" font-size="10.5" fill="#4a5568">zone-api-svc listed with both endpoints</text>

<rect x="500" y="370" width="420" height="72" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
<text x="710" y="394" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c53030">torn down at the end of this lesson</text>
<text x="710" y="412" text-anchor="middle" font-size="10.5" fill="#4a5568">kubectl delete namespace cityflow &#8226;</text>
<text x="710" y="428" text-anchor="middle" font-size="10.5" fill="#4a5568">image removed from Docker and Kind alike</text>

<line x1="60" y1="458" x2="900" y2="458" stroke="#e2e8f0" stroke-width="1"/>

<text x="480" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">the module's whole arc, in one service</text>
<text x="480" y="510" text-anchor="middle" font-size="11.5" fill="#4a5568">Lesson 1 proved Kind is real containers. Lesson 2 ran a pod by hand. Lesson 3 added self-healing and scale.</text>
<text x="480" y="530" text-anchor="middle" font-size="11.5" fill="#4a5568">Lesson 4 gave pods a stable address. This project puts an original image through every one of those pieces</text>
<text x="480" y="550" text-anchor="middle" font-size="11.5" fill="#4a5568">at once &#8212; on the same real Kind cluster, verified with both kubectl and the Dashboard, then cleaned up.</text>
<text x="480" y="586" text-anchor="middle" font-size="10.5" fill="#a0aec0">All numbers above are real, from this lesson's own build, deploy, and verification run.</text>

<defs>
<marker id="arrowz" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L6,3 L0,6 Z" fill="#a0aec0"/>
</marker>
<marker id="arrowg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L6,3 L0,6 Z" fill="#276749"/>
</marker>
</defs>
</svg>
