<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
<text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">The Network Compose Made Without Being Asked</text>
<text x="480" y="58" text-anchor="middle" font-size="14" fill="#718096">Inspected directly, with real IP addresses and real name resolution</text>

<rect x="120" y="90" width="560" height="230" rx="14" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="400" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">cf-net-demo_default</text>
<text x="400" y="132" text-anchor="middle" font-size="10.5" fill="#718096">created automatically &#8212; no docker network create anywhere</text>

<rect x="160" y="160" width="200" height="90" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="260" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">db</text>
<text x="260" y="204" text-anchor="middle" font-size="11" fill="#4a5568">postgres:16-alpine</text>
<text x="260" y="222" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#276749">172.26.0.2</text>

<rect x="440" y="160" width="200" height="90" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="540" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">client</text>
<text x="540" y="204" text-anchor="middle" font-size="11" fill="#4a5568">python:3.13-slim</text>
<text x="540" y="222" text-anchor="middle" font-size="10" fill="#2b6cb0">socket.gethostbyname("db")</text>

<line x1="440" y1="205" x2="360" y2="205" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400" y="196" text-anchor="middle" font-size="9.5" fill="#2b6cb0">resolves to 172.26.0.2</text>

<text x="400" y="272" text-anchor="middle" font-size="11.5" fill="#276749" font-weight="700">TCP connect to db:5432 succeeded</text>

<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L6,3 L0,6 Z" fill="#2b6cb0"/>
</marker>
</defs>

<!-- host, outside the network -->
<rect x="740" y="150" width="170" height="110" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
<text x="825" y="176" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c53030">host machine</text>
<text x="825" y="198" text-anchor="middle" font-size="10" fill="#4a5568">not on this network</text>
<text x="825" y="220" text-anchor="middle" font-size="10" fill="#c53030" font-weight="700">gethostbyname("db")</text>
<text x="825" y="238" text-anchor="middle" font-size="10" fill="#c53030" font-weight="700">socket.gaierror</text>

<line x1="740" y1="205" x2="690" y2="205" stroke="#c53030" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="712" y="196" text-anchor="middle" font-size="16" fill="#c53030">&#10005;</text>

<line x1="40" y1="336" x2="920" y2="336" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="362" font-size="13" font-weight="700" fill="#4a5568">REAL, MEASURED ON THIS MACHINE</text>

<rect x="40" y="378" width="420" height="76" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1"/>
<text x="60" y="402" font-size="12" font-weight="700" fill="#2d3748">docker network inspect cf-net-demo_default</text>
<text x="60" y="422" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4a5568">cf-net-demo-db-1: 172.26.0.2/16</text>
<text x="60" y="442" font-size="10.5" fill="#718096">the exact IP client's own script resolved</text>

<rect x="500" y="378" width="420" height="76" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1"/>
<text x="520" y="402" font-size="12" font-weight="700" fill="#2d3748">Module 1 built this same isolation by hand</text>
<text x="520" y="422" font-size="11" fill="#4a5568">docker network create cityflow-net</text>
<text x="520" y="442" font-size="10.5" fill="#718096">Compose automates the creation step only</text>

<text x="480" y="490" text-anchor="middle" font-size="12" fill="#718096">Same DNS resolution mechanism either way, scoped to whoever is actually attached to the network.</text>
</svg>
