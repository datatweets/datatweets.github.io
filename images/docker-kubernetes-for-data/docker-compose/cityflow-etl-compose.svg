<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<rect x="0" y="0" width="960" height="640" fill="#ffffff"/>
<text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">Module 3's ETL Job, Now a Compose Service</text>
<text x="480" y="58" text-anchor="middle" font-size="14" fill="#718096">A real HEALTHCHECK gates startup &#8212; no sleep, no retry, needed</text>

<rect x="90" y="86" width="780" height="28" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1"/>
<text x="480" y="105" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4a5568">docker compose -p cf-etl-stack up --build -d</text>

<rect x="90" y="132" width="280" height="180" rx="10" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="230" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">db</text>
<text x="230" y="178" text-anchor="middle" font-size="11" fill="#4a5568">postgres:16-alpine</text>
<rect x="120" y="192" width="220" height="50" rx="6" fill="#ffffff" stroke="#276749" stroke-width="1.5"/>
<text x="230" y="212" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">healthcheck: pg_isready</text>
<text x="230" y="230" text-anchor="middle" font-size="10" fill="#4a5568">every 2s, up to 10 tries</text>
<text x="230" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Waiting &#8594; Healthy</text>
<text x="230" y="290" text-anchor="middle" font-size="10.5" fill="#718096">status stays (healthy) while</text>
<text x="230" y="304" text-anchor="middle" font-size="10.5" fill="#718096">the stack keeps running</text>

<line x1="370" y1="222" x2="450" y2="222" stroke="#276749" stroke-width="2" marker-end="url(#arrow3)"/>
<text x="410" y="210" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">depends_on:</text>
<text x="410" y="238" text-anchor="middle" font-size="9" fill="#276749">service_healthy</text>

<defs>
<marker id="arrow3" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
<path d="M0,0 L7,3.5 L0,7 Z" fill="#276749"/>
</marker>
</defs>

<rect x="460" y="132" width="410" height="180" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="665" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">etl</text>
<text x="665" y="178" text-anchor="middle" font-size="11" fill="#4a5568">build: . &#8212; Module 3's ETL, extended</text>
<text x="665" y="198" text-anchor="middle" font-size="10.5" fill="#4a5568">stream row groups &#8226; keep 3 of 19 cols &#8226; aggregate</text>
<text x="665" y="218" text-anchor="middle" font-size="10.5" fill="#4a5568">by zone + hour &#8226; write into zone_hour_report</text>
<rect x="500" y="234" width="330" height="34" rx="6" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="665" y="256" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">connects on attempt 1 &#8212; zero retries</text>
<text x="665" y="292" text-anchor="middle" font-size="10.5" fill="#718096">STATUS: Exited (0), report written</text>

<line x1="40" y1="330" x2="920" y2="330" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="356" font-size="13" font-weight="700" fill="#4a5568">REAL NUMBERS &#8212; MATCHING MODULE 3 EXACTLY</text>

<rect x="40" y="372" width="880" height="150" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1"/>
<text x="60" y="396" font-size="12.5" font-weight="700" fill="#2d3748">source rows on disk: 2,964,624 &#8226; zone-hour buckets: 77,530</text>
<text x="60" y="418" font-size="12.5" font-weight="700" fill="#2d3748">trips kept: 2,964,606 &#8226; quarantined: 18 &#8226; total revenue: $79,455,941.50</text>
<text x="60" y="440" font-size="12.5" font-weight="700" fill="#2d3748">busiest zone-hour: zone 161 at 2024-01-24T18, 726 trips</text>
<text x="60" y="466" font-size="11.5" fill="#718096">confirmed twice: once in etl's own log, once by an independent query against zone_hour_report</text>
<text x="60" y="486" font-size="11.5" fill="#718096">in Postgres &#8212; both match Module 3's bare "docker run" result on this exact file, to the cent</text>
<text x="60" y="506" font-size="11.5" fill="#718096">a full "down -v" then "up -d" reproduced the identical result from a fresh volume</text>

<text x="480" y="560" text-anchor="middle" font-size="12" fill="#718096">Same ETL logic Module 3 containerized, now a proper two-service Compose stack: a real healthcheck</text>
<text x="480" y="580" text-anchor="middle" font-size="12" fill="#718096">gates startup instead of a fixed sleep, and the report lands in the database instead of only the terminal.</text>
</svg>
