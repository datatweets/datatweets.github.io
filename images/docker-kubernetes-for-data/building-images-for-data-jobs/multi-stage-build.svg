<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
</marker>
</defs>
<text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">Two Stages, One Image: Compiling psycopg2</text>
<text x="480" y="58" text-anchor="middle" font-size="14" fill="#718096">The build stage's compiler and headers never reach the final image &#8212; only the compiled package does</text>

<rect x="40" y="86" width="360" height="200" rx="10" fill="#fffaf0" stroke="#c05621" stroke-width="1.5"/>
<text x="220" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">STAGE 1: build (discarded)</text>
<rect x="60" y="126" width="320" height="30" rx="5" fill="#ffffff" stroke="#c05621" stroke-width="1"/>
<text x="220" y="146" text-anchor="middle" font-size="11" fill="#4a5568">FROM python:3.13-slim AS build</text>
<rect x="60" y="164" width="320" height="30" rx="5" fill="#ffffff" stroke="#c05621" stroke-width="1"/>
<text x="220" y="184" text-anchor="middle" font-size="10.5" fill="#4a5568">apt-get install gcc libc6-dev libpq-dev</text>
<rect x="60" y="202" width="320" height="30" rx="5" fill="#ffffff" stroke="#c05621" stroke-width="1"/>
<text x="220" y="222" text-anchor="middle" font-size="11" fill="#4a5568">pip install --target=/install psycopg2</text>
<text x="220" y="260" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c05621">gcc + libc6-dev + libpq-dev: 205 MB</text>
<text x="220" y="278" text-anchor="middle" font-size="11" fill="#718096">never copied into stage 2</text>

<path d="M 400 186 L 552 186" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
<text x="476" y="172" text-anchor="middle" font-size="10" fill="#4a5568">COPY --from=build</text>
<text x="476" y="204" text-anchor="middle" font-size="10" fill="#4a5568">/install only</text>

<rect x="556" y="86" width="364" height="200" rx="10" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="738" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">STAGE 2: runtime (this ships)</text>
<rect x="576" y="126" width="324" height="30" rx="5" fill="#ffffff" stroke="#276749" stroke-width="1"/>
<text x="738" y="146" text-anchor="middle" font-size="11" fill="#4a5568">FROM python:3.13-slim</text>
<rect x="576" y="164" width="324" height="30" rx="5" fill="#ffffff" stroke="#276749" stroke-width="1"/>
<text x="738" y="184" text-anchor="middle" font-size="10.5" fill="#4a5568">apt-get install libpq5 (runtime only)</text>
<rect x="576" y="202" width="324" height="30" rx="5" fill="#ffffff" stroke="#276749" stroke-width="1"/>
<text x="738" y="222" text-anchor="middle" font-size="10.5" fill="#4a5568">COPY --from=build /install site-packages</text>
<text x="738" y="260" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">libpq5: 4.63 MB + package: 1.53 MB</text>
<text x="738" y="278" text-anchor="middle" font-size="11" fill="#718096">the compiler is simply never here</text>

<line x1="40" y1="310" x2="920" y2="310" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="336" font-size="13" font-weight="700" fill="#4a5568">REAL IMAGE SIZES, SAME JOB, SAME QUERY OUTPUT</text>

<rect x="40" y="352" width="420" height="90" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
<text x="60" y="376" font-size="12" font-weight="700" fill="#c53030">cityflow-zone-lookup:single (one stage)</text>
<text x="60" y="398" font-size="16" font-weight="700" fill="#c53030">359 MB</text>
<text x="60" y="420" font-size="11" fill="#4a5568">gcc, libc6-dev, and libpq-dev all remain</text>

<rect x="500" y="352" width="420" height="90" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="520" y="376" font-size="12" font-weight="700" fill="#276749">cityflow-zone-lookup:multi (two stages)</text>
<text x="520" y="398" font-size="16" font-weight="700" fill="#276749">149 MB</text>
<text x="520" y="420" font-size="11" fill="#4a5568">210 MB smaller &#8212; 58% less, same 4 trips, $30.34 avg fare</text>

<text x="480" y="480" text-anchor="middle" font-size="12" fill="#718096">A single-stage build can't leave anything behind &#8212; every instruction's result lives in the final image forever.</text>
<text x="480" y="500" text-anchor="middle" font-size="12" fill="#718096">Multi-stage draws a hard line: only what an explicit COPY --from names crosses into the image you actually ship.</text>
</svg>
