<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">CityFlow's Trip-Count Auditor: Build to Run</text>
<text x="480" y="58" text-anchor="middle" font-size="14" fill="#718096">The whole module in one pipeline &#8212; a Dockerfile, two tags, a local registry, and a portable run</text>

<rect x="30" y="90" width="150" height="70" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="105" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">docker build</text>
<text x="105" y="134" text-anchor="middle" font-size="10" fill="#4a5568">FROM + RUN pip install</text>
<text x="105" y="148" text-anchor="middle" font-size="10" fill="#4a5568">+ COPY trips.csv audit.py</text>

<line x1="180" y1="125" x2="212" y2="125" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowT)"/>

<rect x="212" y="90" width="150" height="70" rx="8" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.5"/>
<text x="287" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">docker tag</text>
<text x="287" y="134" text-anchor="middle" font-size="10" fill="#4a5568">:1.0 and :latest</text>
<text x="287" y="148" text-anchor="middle" font-size="10" fill="#4a5568">same image, two names</text>

<line x1="362" y1="125" x2="394" y2="125" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowT)"/>

<rect x="394" y="90" width="150" height="70" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="469" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">docker push</text>
<text x="469" y="134" text-anchor="middle" font-size="10" fill="#4a5568">to localhost:5000</text>
<text x="469" y="148" text-anchor="middle" font-size="10" fill="#4a5568">the local registry</text>

<line x1="544" y1="125" x2="576" y2="125" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowT)"/>

<rect x="576" y="90" width="150" height="70" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="1.5"/>
<text x="651" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">docker rmi (local)</text>
<text x="651" y="134" text-anchor="middle" font-size="10" fill="#4a5568">then docker pull</text>
<text x="651" y="148" text-anchor="middle" font-size="10" fill="#4a5568">proves it round-trips</text>

<line x1="726" y1="125" x2="758" y2="125" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowT)"/>

<rect x="758" y="90" width="150" height="70" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
<text x="833" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#c53030">docker run</text>
<text x="833" y="134" text-anchor="middle" font-size="10" fill="#4a5568">the pulled image</text>
<text x="833" y="148" text-anchor="middle" font-size="10" fill="#4a5568">exit code 0</text>

<line x1="480" y1="160" x2="480" y2="200" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="3,3"/>

<rect x="80" y="210" width="800" height="180" rx="10" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="480" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#1a202c">CityFlow trip-count audit &#8212; the real, printed output, every time</text>

<text x="140" y="272" font-size="13" fill="#2d3748">trips audited</text>
<text x="420" y="272" text-anchor="end" font-size="15" font-weight="700" fill="#2b6cb0">8</text>

<text x="140" y="302" font-size="13" fill="#2d3748">average fare</text>
<text x="420" y="302" text-anchor="end" font-size="15" font-weight="700" fill="#2b6cb0">$25.79</text>

<text x="140" y="332" font-size="13" fill="#2d3748">average distance</text>
<text x="420" y="332" text-anchor="end" font-size="15" font-weight="700" fill="#2b6cb0">6.39 mi</text>

<text x="540" y="272" font-size="13" fill="#2d3748">total revenue</text>
<text x="840" y="272" text-anchor="end" font-size="15" font-weight="700" fill="#2b6cb0">$297.84</text>

<text x="540" y="302" font-size="13" fill="#2d3748">highest fare trip</text>
<text x="840" y="302" text-anchor="end" font-size="12" font-weight="700" fill="#2b6cb0">zone 132 &#8594; 238</text>

<text x="540" y="326" font-size="13" fill="#2d3748"></text>
<text x="840" y="326" text-anchor="end" font-size="12" font-weight="700" fill="#2b6cb0">$70.00</text>

<text x="480" y="366" text-anchor="middle" font-size="11" fill="#718096">the 8 trips are baked into the image at build time &#8212; no mount, no network call, same output anywhere it runs</text>

<text x="480" y="422" text-anchor="middle" font-size="12" fill="#718096">One image, two tags, a push, a full removal, and a pull &#8212; the report never changes, because the image never changed.</text>
<text x="480" y="442" text-anchor="middle" font-size="12" fill="#718096">Every module skill lands here: FROM/RUN/COPY/CMD (Lesson 1), a cache-friendly build (Lesson 2), a registry round trip (Lesson 3), a clean exit to verify (Lesson 4).</text>

<defs>
<marker id="arrowT" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#a0aec0"/>
</marker>
</defs>
</svg>
