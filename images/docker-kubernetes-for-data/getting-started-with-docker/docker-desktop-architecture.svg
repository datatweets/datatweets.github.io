<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
<text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">What You Just Installed</text>
<text x="480" y="58" text-anchor="middle" font-size="14" fill="#718096">Docker Desktop bundles a CLI, a Linux VM, and the engine that runs your containers</text>

<!-- Row 1: you -->
<rect x="60" y="96" width="180" height="56" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="150" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">You, in a terminal</text>
<text x="150" y="138" text-anchor="middle" font-size="11" fill="#4a5568">type: docker run ...</text>

<line x1="240" y1="124" x2="300" y2="124" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="300" y="96" width="180" height="56" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="390" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">docker CLI</text>
<text x="390" y="138" text-anchor="middle" font-size="11" fill="#4a5568">sends the request</text>

<line x1="480" y1="124" x2="540" y2="124" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="540" y="96" width="200" height="56" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="640" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">Docker Desktop app</text>
<text x="640" y="138" text-anchor="middle" font-size="11" fill="#4a5568">the whale menu &amp; UI</text>

<!-- VM boundary -->
<rect x="540" y="180" width="360" height="220" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="720" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">A LIGHTWEIGHT LINUX VM</text>
<text x="720" y="220" text-anchor="middle" font-size="10" fill="#718096">(this is why Docker runs the same way on macOS, Windows &amp; Linux)</text>

<line x1="640" y1="152" x2="640" y2="180" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="580" y="240" width="280" height="50" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="1.5"/>
<text x="720" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">Docker Engine (dockerd)</text>
<text x="720" y="278" text-anchor="middle" font-size="11" fill="#4a5568">builds images, runs containers</text>

<line x1="720" y1="290" x2="720" y2="316" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="580" y="316" width="120" height="60" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="640" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Images</text>
<text x="640" y="360" text-anchor="middle" font-size="10" fill="#4a5568">on-disk templates</text>

<rect x="740" y="316" width="120" height="60" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="800" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Containers</text>
<text x="800" y="360" text-anchor="middle" font-size="10" fill="#4a5568">running instances</text>

<text x="480" y="424" text-anchor="middle" font-size="12" fill="#718096">The rest of this module never talks to the VM directly &#8212; every command goes CLI &#8594; Docker Desktop &#8594; Engine, the same three hops every time.</text>

<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#a0aec0"/>
</marker>
</defs>
</svg>
