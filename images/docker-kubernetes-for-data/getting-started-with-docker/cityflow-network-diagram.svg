<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">CityFlow's Smoke Test, End to End</text>
<text x="480" y="58" text-anchor="middle" font-size="14" fill="#718096">three containers, one network, one shared image doing two different jobs</text>

<!-- network boundary -->
<rect x="60" y="90" width="840" height="300" rx="12" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="90" y="116" font-size="12" font-weight="700" fill="#4a5568">docker network: cityflow-net</text>

<!-- db container -->
<rect x="380" y="140" width="200" height="90" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
<text x="480" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">cityflow-db</text>
<text x="480" y="184" text-anchor="middle" font-size="11" fill="#4a5568">postgres:16-alpine</text>
<text x="480" y="200" text-anchor="middle" font-size="10" fill="#718096">long-running, holds the trips table</text>
<text x="480" y="216" text-anchor="middle" font-size="10" fill="#718096">reachable by name: cityflow-db</text>

<!-- seed container -->
<rect x="100" y="280" width="220" height="90" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="210" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">seed (--rm)</text>
<text x="210" y="324" text-anchor="middle" font-size="11" fill="#4a5568">same image: postgres:16-alpine</text>
<text x="210" y="340" text-anchor="middle" font-size="10" fill="#718096">psql -f seed.sql</text>
<text x="210" y="356" text-anchor="middle" font-size="10" fill="#718096">inserts 5 real CityFlow trips, then exits</text>

<!-- report container -->
<rect x="640" y="280" width="220" height="90" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="1.5"/>
<text x="750" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">report (--rm)</text>
<text x="750" y="324" text-anchor="middle" font-size="11" fill="#4a5568">same image: postgres:16-alpine</text>
<text x="750" y="340" text-anchor="middle" font-size="10" fill="#718096">psql -c "SELECT ... FROM trips"</text>
<text x="750" y="356" text-anchor="middle" font-size="10" fill="#718096">prints the summary, then exits</text>

<line x1="320" y1="310" x2="380" y2="215" stroke="#276749" stroke-width="1.5" marker-end="url(#arrow3)"/>
<rect x="285" y="251" width="130" height="18" fill="#ffffff"/>
<text x="350" y="264" text-anchor="middle" font-size="10" fill="#276749">writes over the network</text>

<line x1="640" y1="310" x2="580" y2="215" stroke="#c05621" stroke-width="1.5" marker-end="url(#arrow3)"/>
<rect x="545" y="251" width="130" height="18" fill="#ffffff"/>
<text x="610" y="264" text-anchor="middle" font-size="10" fill="#c05621">reads over the network</text>

<line x1="40" y1="404" x2="920" y2="404" stroke="#e2e8f0" stroke-width="1"/>

<text x="480" y="432" text-anchor="middle" font-size="12" fill="#4a5568">The lesson-3 point, made physical: <tspan font-weight="700">seed</tspan> and <tspan font-weight="700">report</tspan> are two different containers built from the exact same image &#8212;</text>
<text x="480" y="450" text-anchor="middle" font-size="12" fill="#4a5568">only the command passed to <tspan font-family="Menlo, monospace" font-size="11">docker run</tspan> differs. Real result: 5 trips, avg fare $27.36, avg distance 4.42 mi, $175.56 total revenue.</text>

<defs>
<marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#718096"/>
</marker>
</defs>
</svg>
