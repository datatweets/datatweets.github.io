<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<rect x="0" y="0" width="960" height="700" fill="#ffffff"/>
<text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">ConfigMaps and Secrets: Same Shape, Different Rules</text>
<text x="480" y="58" text-anchor="middle" font-size="14" fill="#718096">One zone-report pod, driven by envFrom from two different sources</text>

<rect x="380" y="80" width="200" height="60" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="480" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">pod: zone-report</text>
<text x="480" y="124" text-anchor="middle" font-size="10.5" fill="#4a5568">envFrom: configMapRef + secretRef</text>

<line x1="420" y1="140" x2="300" y2="176" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrows)"/>
<line x1="540" y1="140" x2="660" y2="176" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrows)"/>

<rect x="140" y="180" width="320" height="76" rx="10" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="300" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">ConfigMap cityflow-report-config</text>
<text x="300" y="222" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4a5568">BOROUGH_FILTER: Manhattan</text>
<text x="300" y="240" text-anchor="middle" font-size="10" fill="#718096">stored and readable in plain text</text>

<rect x="500" y="180" width="320" height="76" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
<text x="660" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#c53030">Secret cityflow-report-secret</text>
<text x="660" y="222" text-anchor="middle" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4a5568">API_TOKEN: Y2YtcmVwb3J0LTIwMjYteDdx</text>
<text x="660" y="240" text-anchor="middle" font-size="10" fill="#718096">base64 - decodes to cf-report-2026-x7q</text>

<line x1="140" y1="270" x2="820" y2="270" stroke="#e2e8f0" stroke-width="1"/>

<text x="480" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#2d3748">not encryption: one command reverses it</text>
<rect x="290" y="312" width="380" height="46" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1"/>
<text x="480" y="340" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2d3748">... | base64 --decode  &#8594;  cf-report-2026-x7q</text>

<line x1="140" y1="378" x2="820" y2="378" stroke="#e2e8f0" stroke-width="1"/>

<text x="480" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#2d3748">a real gotcha: kubectl apply vs kubectl create</text>

<rect x="140" y="422" width="320" height="80" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
<text x="300" y="444" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c53030">kubectl apply -f secret.yaml</text>
<text x="300" y="464" text-anchor="middle" font-size="10.5" fill="#4a5568">last-applied-configuration annotation</text>
<text x="300" y="482" text-anchor="middle" font-size="10.5" fill="#4a5568">contains the real plaintext token</text>
<text x="300" y="496" text-anchor="middle" font-size="9.5" fill="#718096">the point of a Secret, defeated</text>

<rect x="500" y="422" width="320" height="80" rx="10" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="660" y="444" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">kubectl create -f secret.yaml</text>
<text x="660" y="464" text-anchor="middle" font-size="10.5" fill="#4a5568">no last-applied annotation written</text>
<text x="660" y="482" text-anchor="middle" font-size="10.5" fill="#4a5568">only data.API_TOKEN (base64) stored</text>
<text x="660" y="496" text-anchor="middle" font-size="9.5" fill="#718096">clean, as intended</text>

<line x1="140" y1="518" x2="820" y2="518" stroke="#e2e8f0" stroke-width="1"/>

<text x="480" y="546" text-anchor="middle" font-size="13" font-weight="700" fill="#2d3748">a config change needs a restart</text>

<rect x="140" y="560" width="320" height="74" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1"/>
<text x="300" y="582" text-anchor="middle" font-size="11" fill="#2d3748">ConfigMap patched to Brooklyn</text>
<text x="300" y="602" text-anchor="middle" font-size="11" fill="#4a5568">/healthz still reports Manhattan</text>
<text x="300" y="620" text-anchor="middle" font-size="10" fill="#718096">env vars read once, at pod startup</text>

<line x1="470" y1="597" x2="490" y2="597" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrows)"/>

<rect x="500" y="560" width="320" height="74" rx="10" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="660" y="582" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">kubectl rollout restart deployment</text>
<text x="660" y="602" text-anchor="middle" font-size="11" fill="#4a5568">/healthz now reports Brooklyn (61 zones)</text>
<text x="660" y="620" text-anchor="middle" font-size="10" fill="#718096">same image, same code, new config</text>

<text x="480" y="666" text-anchor="middle" font-size="11.5" fill="#4a5568">Manhattan: 69 real zones &#8226; Brooklyn: 61 real zones &#8212; both from the same 265-zone taxi lookup table</text>
<text x="480" y="686" text-anchor="middle" font-size="10.5" fill="#a0aec0">All values above are from real kubectl output captured for this lesson.</text>

<defs>
<marker id="arrows" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L6,3 L0,6 Z" fill="#a0aec0"/>
</marker>
</defs>
</svg>
