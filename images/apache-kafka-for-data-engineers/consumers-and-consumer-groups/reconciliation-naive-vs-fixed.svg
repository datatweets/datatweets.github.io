<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>A real bug found and fixed: naive aggregation over-counts by more than 2x</title>
  <desc>Top: three consumer group workers reading cityflow-trip-events with only a single commit at the end of each worker's loop. A rebalance happens mid-run as workers finish at different times, and partitions changing hands get re-read from the beginning because nothing was committed in time. The naive total comes out to 20,739,015 trips and $566,127,411.45, more than double the true numbers. Bottom: the same three workers with a ConsumerRebalanceListener that commits before losing a partition, plus periodic commits every 50,000 records. The fixed total comes out to exactly 9,554,757 trips and $256,692,373.14, matching Course 1's independently published numbers exactly.</desc>
  <rect width="1100" height="380" fill="#ffffff" />
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">A Real Bug, Found and Fixed</text>

  <!-- naive row -->
  <text x="40" y="65" font-size="13" font-weight="700" fill="#742a2a">Naive: one commit() at the very end of each worker's loop</text>

  <rect x="40" y="80" width="260" height="55" rx="5" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.3" />
  <text x="170" y="103" text-anchor="middle" font-size="10" fill="#2d3748">3 workers reading</text>
  <text x="170" y="119" text-anchor="middle" font-size="9" fill="#718096">9,554,757 real trip events</text>

  <rect x="330" y="80" width="260" height="55" rx="5" fill="#fed7d7" stroke="#fc8181" stroke-width="1.6" />
  <text x="460" y="103" text-anchor="middle" font-size="10" font-weight="700" fill="#742a2a">rebalance mid-run</text>
  <text x="460" y="119" text-anchor="middle" font-size="9" fill="#742a2a">reassigned partitions re-read from earliest</text>

  <rect x="620" y="80" width="440" height="55" rx="5" fill="#742a2a" />
  <text x="840" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">20,739,015 trips -- $566,127,411.45</text>
  <text x="840" y="120" text-anchor="middle" font-size="9" fill="#fed7d7">more than double the true total</text>

  <line x1="300" y1="107" x2="320" y2="107" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arrowRN)" />
  <line x1="590" y1="107" x2="610" y2="107" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arrowRN)" />

  <line x1="40" y1="165" x2="1060" y2="165" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- fixed row -->
  <text x="40" y="197" font-size="13" font-weight="700" fill="#22543d">Fixed: ConsumerRebalanceListener commits before losing a partition</text>

  <rect x="40" y="212" width="260" height="55" rx="5" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.3" />
  <text x="170" y="235" text-anchor="middle" font-size="10" fill="#2d3748">3 workers reading</text>
  <text x="170" y="251" text-anchor="middle" font-size="9" fill="#718096">9,554,757 real trip events</text>

  <rect x="330" y="212" width="260" height="55" rx="5" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.6" />
  <text x="460" y="235" text-anchor="middle" font-size="10" font-weight="700" fill="#22543d">identical rebalance</text>
  <text x="460" y="251" text-anchor="middle" font-size="9" fill="#22543d">on_partitions_revoked() commits first</text>

  <rect x="620" y="212" width="440" height="55" rx="5" fill="#22543d" />
  <text x="840" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">9,554,757 trips -- $256,692,373.14</text>
  <text x="840" y="252" text-anchor="middle" font-size="9" fill="#c6f6d5">matches Course 1's published numbers exactly</text>

  <line x1="300" y1="239" x2="320" y2="239" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arrowRN)" />
  <line x1="590" y1="239" x2="610" y2="239" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arrowRN)" />

  <defs>
    <marker id="arrowRN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a0aec0" />
    </marker>
  </defs>

  <line x1="40" y1="290" x2="1060" y2="290" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="550" y="318" text-anchor="middle" font-size="11" fill="#4a5568">Same real dataset, same rebalance, same three workers -- the only change was when each commit happened.</text>
  <text x="550" y="336" text-anchor="middle" font-size="11" fill="#4a5568">Two independent pipelines, one real number: 9,554,757 trips, $256,692,373.14.</text>
</svg>
