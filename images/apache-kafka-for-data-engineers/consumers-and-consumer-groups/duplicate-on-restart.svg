<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>A real duplicate reproduced, then closed to zero with manual commit</title>
  <desc>Top timeline: consumer-A processes 20 messages with auto-commit set to a 60-second interval, then simulates a crash before that interval ever fires -- no offset is ever committed. Consumer-B restarts in the same group and reprocesses all 20 messages, a real duplicate. Bottom timeline: consumer-A processes 20 messages with manual commit called immediately after each one, then simulates the identical crash. Consumer-B restarts and finds nothing left to read -- zero duplicates, because every offset was already committed before the crash.</desc>
  <rect width="1100" height="380" fill="#ffffff" />
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Same Crash, Two Commit Strategies</text>

  <!-- auto-commit row -->
  <text x="40" y="65" font-size="13" font-weight="700" fill="#742a2a">Auto-commit, 60s interval</text>

  <rect x="40" y="80" width="220" height="50" rx="5" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.3" />
  <text x="150" y="102" text-anchor="middle" font-size="10" fill="#2d3748">consumer-A processes</text>
  <text x="150" y="117" text-anchor="middle" font-size="9" font-family="Menlo, monospace" fill="#718096">20 of 20 messages</text>

  <rect x="280" y="80" width="220" height="50" rx="5" fill="#fed7d7" stroke="#fc8181" stroke-width="1.6" />
  <text x="390" y="102" text-anchor="middle" font-size="10" font-weight="700" fill="#742a2a">simulated crash</text>
  <text x="390" y="117" text-anchor="middle" font-size="9" fill="#742a2a">interval never fired -- nothing committed</text>

  <rect x="520" y="80" width="220" height="50" rx="5" fill="#fed7d7" stroke="#fc8181" stroke-width="1.6" />
  <text x="630" y="102" text-anchor="middle" font-size="10" fill="#742a2a">consumer-B restarts</text>
  <text x="630" y="117" text-anchor="middle" font-size="9" font-family="Menlo, monospace" fill="#742a2a">reprocesses 20 of 20</text>

  <rect x="760" y="80" width="300" height="50" rx="5" fill="#742a2a" />
  <text x="910" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">20 duplicates</text>

  <line x1="260" y1="105" x2="275" y2="105" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arrowDR)" />
  <line x1="500" y1="105" x2="515" y2="105" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arrowDR)" />
  <line x1="740" y1="105" x2="755" y2="105" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arrowDR)" />

  <line x1="40" y1="160" x2="1060" y2="160" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- manual commit row -->
  <text x="40" y="192" font-size="13" font-weight="700" fill="#22543d">Manual commit, right after each message</text>

  <rect x="40" y="207" width="220" height="50" rx="5" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.3" />
  <text x="150" y="229" text-anchor="middle" font-size="10" fill="#2d3748">consumer-A processes</text>
  <text x="150" y="244" text-anchor="middle" font-size="9" font-family="Menlo, monospace" fill="#718096">20 of 20, commit() each time</text>

  <rect x="280" y="207" width="220" height="50" rx="5" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.6" />
  <text x="390" y="229" text-anchor="middle" font-size="10" font-weight="700" fill="#22543d">identical simulated crash</text>
  <text x="390" y="244" text-anchor="middle" font-size="9" fill="#22543d">every offset already committed</text>

  <rect x="520" y="207" width="220" height="50" rx="5" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.6" />
  <text x="630" y="229" text-anchor="middle" font-size="10" fill="#22543d">consumer-B restarts</text>
  <text x="630" y="244" text-anchor="middle" font-size="9" font-family="Menlo, monospace" fill="#22543d">nothing left to read</text>

  <rect x="760" y="207" width="300" height="50" rx="5" fill="#22543d" />
  <text x="910" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">0 duplicates</text>

  <line x1="260" y1="232" x2="275" y2="232" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arrowDR)" />
  <line x1="500" y1="232" x2="515" y2="232" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arrowDR)" />
  <line x1="740" y1="232" x2="755" y2="232" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arrowDR)" />

  <defs>
    <marker id="arrowDR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a0aec0" />
    </marker>
  </defs>

  <line x1="40" y1="280" x2="1060" y2="280" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="550" y="308" text-anchor="middle" font-size="11" fill="#4a5568">The only variable changed between the two rows: when the commit happens relative to processing.</text>
  <text x="550" y="326" text-anchor="middle" font-size="11" fill="#4a5568">At-least-once still holds either way -- nothing was ever lost, only the duplicate risk moved.</text>
</svg>
