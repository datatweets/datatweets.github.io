<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Point-to-point coupling versus a publish-subscribe event bus</title>
  <desc>Top: complete_trip_unreliable calls bill_customer_unreliable directly, which raises a ConnectionError; the call chain stops there, so credit_driver and mark_driver_available never run, both shown greyed out and marked "never ran". Bottom: the same trip-completion event is published once to SimpleEventBus, which calls all three subscribers -- bill_customer_unreliable, credit_driver, mark_driver_available -- independently inside its own try/except; bill_customer_unreliable still fails, but credit_driver and mark_driver_available both run successfully regardless.</desc>
  <rect width="1100" height="440" fill="#ffffff" />
  <text x="550" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">One Failure Blocks Everything -- Or Just Itself</text>

  <!-- POINT-TO-POINT section -->
  <text x="40" y="68" font-size="13" font-weight="700" fill="#742a2a">Point-to-point: complete_trip_unreliable(trip)</text>

  <rect x="40" y="80" width="190" height="44" rx="5" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.3" />
  <text x="135" y="107" text-anchor="middle" font-size="10.5" font-family="Menlo, monospace" fill="#2d3748">complete_trip</text>

  <line x1="230" y1="102" x2="270" y2="102" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arrowP2P)" />

  <rect x="280" y="80" width="220" height="44" rx="5" fill="#fed7d7" stroke="#fc8181" stroke-width="1.6" />
  <text x="390" y="100" text-anchor="middle" font-size="10.5" font-family="Menlo, monospace" font-weight="700" fill="#742a2a">bill_customer_unreliable</text>
  <text x="390" y="115" text-anchor="middle" font-size="9.5" fill="#742a2a">raises ConnectionError</text>

  <line x1="500" y1="102" x2="540" y2="102" stroke="#fc8181" stroke-width="2" stroke-dasharray="3 3" />
  <text x="520" y="90" text-anchor="middle" font-size="14" fill="#e53e3e">✕</text>

  <rect x="550" y="80" width="200" height="44" rx="5" fill="#f0f2f5" stroke="#cbd5e0" stroke-width="1.3" stroke-dasharray="4 3" />
  <text x="650" y="100" text-anchor="middle" font-size="10.5" font-family="Menlo, monospace" fill="#a0aec0">credit_driver</text>
  <text x="650" y="115" text-anchor="middle" font-size="9" fill="#a0aec0">never ran</text>

  <rect x="770" y="80" width="230" height="44" rx="5" fill="#f0f2f5" stroke="#cbd5e0" stroke-width="1.3" stroke-dasharray="4 3" />
  <text x="885" y="100" text-anchor="middle" font-size="10.5" font-family="Menlo, monospace" fill="#a0aec0">mark_driver_available</text>
  <text x="885" y="115" text-anchor="middle" font-size="9" fill="#a0aec0">never ran</text>

  <defs>
    <marker id="arrowP2P" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a0aec0" />
    </marker>
    <marker id="arrowBus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68d391" />
    </marker>
  </defs>

  <text x="40" y="150" font-size="10.5" fill="#742a2a">A synchronous call chain stops at the first unhandled exception -- everything after it is skipped, not just the failing call.</text>

  <line x1="40" y1="180" x2="1060" y2="180" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- EVENT BUS section -->
  <text x="40" y="212" font-size="13" font-weight="700" fill="#22543d">Publish-subscribe: bus.publish(trip_completed_event)</text>

  <rect x="40" y="224" width="190" height="44" rx="5" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.3" />
  <text x="135" y="242" text-anchor="middle" font-size="10.5" font-family="Menlo, monospace" fill="#2d3748">bus.publish()</text>
  <text x="135" y="257" text-anchor="middle" font-size="9" fill="#718096">try/except per handler</text>

  <line x1="230" y1="246" x2="270" y2="180" stroke="#a0aec0" stroke-width="1.4" />
  <line x1="230" y1="246" x2="270" y2="246" stroke="#a0aec0" stroke-width="1.4" />
  <line x1="230" y1="246" x2="270" y2="320" stroke="#a0aec0" stroke-width="1.4" />

  <rect x="280" y="158" width="230" height="44" rx="5" fill="#fed7d7" stroke="#fc8181" stroke-width="1.6" />
  <text x="395" y="178" text-anchor="middle" font-size="10.5" font-family="Menlo, monospace" font-weight="700" fill="#742a2a">bill_customer_unreliable</text>
  <text x="395" y="193" text-anchor="middle" font-size="9.5" fill="#742a2a">still fails -- caught, logged</text>

  <rect x="280" y="224" width="200" height="44" rx="5" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.6" />
  <text x="380" y="244" text-anchor="middle" font-size="10.5" font-family="Menlo, monospace" font-weight="700" fill="#22543d">credit_driver</text>
  <text x="380" y="259" text-anchor="middle" font-size="9.5" fill="#22543d">ran normally ✓</text>

  <rect x="280" y="298" width="230" height="44" rx="5" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.6" />
  <text x="395" y="318" text-anchor="middle" font-size="10.5" font-family="Menlo, monospace" font-weight="700" fill="#22543d">mark_driver_available</text>
  <text x="395" y="333" text-anchor="middle" font-size="9.5" fill="#22543d">ran normally ✓</text>

  <text x="560" y="185" font-size="10" fill="#4a5568">each subscriber runs</text>
  <text x="560" y="199" font-size="10" fill="#4a5568">independently, inside</text>
  <text x="560" y="213" font-size="10" fill="#4a5568">its own try/except --</text>
  <text x="560" y="227" font-size="10" fill="#4a5568">one failing subscriber</text>
  <text x="560" y="241" font-size="10" fill="#4a5568">can't block the others</text>

  <line x1="40" y1="372" x2="1060" y2="372" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="550" y="400" text-anchor="middle" font-size="12" fill="#4a5568">Same failure, same three subscribers -- decoupling changes what one failure can take down with it.</text>
</svg>
