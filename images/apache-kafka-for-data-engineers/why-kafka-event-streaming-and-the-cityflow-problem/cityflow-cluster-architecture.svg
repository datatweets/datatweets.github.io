<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>CityFlow's three-broker KRaft cluster inside the kafka-net Docker network</title>
  <desc>A box labelled kafka-net Docker network contains four containers: kafka1, kafka2, kafka3, each running Kafka 4.0 in KRaft mode with two listeners -- an internal PLAINTEXT listener other containers use (kafka1:29092, kafka2:29093, kafka3:29094) and a PLAINTEXT_HOST listener the host machine uses (advertised as localhost:9092, 9093, 9094) -- plus a Kafdrop container reachable at localhost:9000. Outside the network box, a host machine box shows Python and CLI tools connecting via the three localhost ports. All three brokers share an identical KAFKA_CONTROLLER_QUORUM_VOTERS line naming all three as controller-eligible.</desc>
  <rect width="1100" height="460" fill="#ffffff" />
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">One Docker Network, Two Addresses Per Broker</text>

  <!-- kafka-net box -->
  <rect x="40" y="55" width="1020" height="270" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" stroke-dasharray="5 3" />
  <text x="60" y="78" font-size="12" font-weight="700" fill="#2c5282">kafka-net (Docker network)</text>

  <!-- kafka1 -->
  <rect x="70" y="95" width="280" height="120" rx="6" fill="#ffffff" stroke="#a0aec0" stroke-width="1.4" />
  <text x="210" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">kafka1 (KRaft node 1)</text>
  <text x="210" y="140" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">PLAINTEXT: kafka1:29092</text>
  <text x="210" y="155" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">PLAINTEXT_HOST: 0.0.0.0:9092</text>
  <text x="210" y="170" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">CONTROLLER: 0.0.0.0:9192</text>
  <text x="210" y="195" text-anchor="middle" font-size="9" fill="#718096">advertised to host as localhost:9092</text>

  <!-- kafka2 -->
  <rect x="370" y="95" width="280" height="120" rx="6" fill="#ffffff" stroke="#a0aec0" stroke-width="1.4" />
  <text x="510" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">kafka2 (KRaft node 2)</text>
  <text x="510" y="140" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">PLAINTEXT: kafka2:29093</text>
  <text x="510" y="155" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">PLAINTEXT_HOST: 0.0.0.0:9093</text>
  <text x="510" y="170" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">CONTROLLER: 0.0.0.0:9193</text>
  <text x="510" y="195" text-anchor="middle" font-size="9" fill="#718096">advertised to host as localhost:9093</text>

  <!-- kafka3 -->
  <rect x="670" y="95" width="280" height="120" rx="6" fill="#ffffff" stroke="#a0aec0" stroke-width="1.4" />
  <text x="810" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">kafka3 (KRaft node 3)</text>
  <text x="810" y="140" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">PLAINTEXT: kafka3:29094</text>
  <text x="810" y="155" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">PLAINTEXT_HOST: 0.0.0.0:9094</text>
  <text x="810" y="170" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#4a5568">CONTROLLER: 0.0.0.0:9194</text>
  <text x="810" y="195" text-anchor="middle" font-size="9" fill="#718096">advertised to host as localhost:9094</text>

  <!-- controller quorum line -->
  <line x1="210" y1="215" x2="210" y2="245" stroke="#63b3ed" stroke-width="1.3" />
  <line x1="510" y1="215" x2="510" y2="245" stroke="#63b3ed" stroke-width="1.3" />
  <line x1="810" y1="215" x2="810" y2="245" stroke="#63b3ed" stroke-width="1.3" />
  <line x1="210" y1="245" x2="810" y2="245" stroke="#63b3ed" stroke-width="1.3" />
  <rect x="330" y="255" width="360" height="30" rx="5" fill="#bee3f8" stroke="#63b3ed" stroke-width="1.2" />
  <text x="510" y="274" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#2c5282">KAFKA_CONTROLLER_QUORUM_VOTERS -- identical on all three</text>

  <!-- Kafdrop -->
  <rect x="850" y="290" width="180" height="30" rx="5" fill="#fefcbf" stroke="#ecc94b" stroke-width="1.3" />
  <text x="940" y="310" text-anchor="middle" font-size="10" font-weight="700" fill="#744210">Kafdrop -- localhost:9000</text>

  <!-- host machine box -->
  <rect x="220" y="355" width="660" height="80" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.4" />
  <text x="550" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">Your host machine (Python scripts, kafka-topics.sh, browser)</text>
  <text x="550" y="400" text-anchor="middle" font-size="10" font-family="Menlo, monospace" fill="#4a5568">bootstrap_servers = ["localhost:9092", "localhost:9093", "localhost:9094"]</text>
  <text x="550" y="417" text-anchor="middle" font-size="9.5" fill="#718096">"kafka1" isn't resolvable here -- always connect via localhost, never the container name</text>

  <line x1="210" y1="215" x2="330" y2="355" stroke="#a0aec0" stroke-width="1.3" marker-end="url(#arrowCluster)" />
  <line x1="510" y1="215" x2="550" y2="355" stroke="#a0aec0" stroke-width="1.3" marker-end="url(#arrowCluster)" />
  <line x1="810" y1="215" x2="770" y2="355" stroke="#a0aec0" stroke-width="1.3" marker-end="url(#arrowCluster)" />

  <defs>
    <marker id="arrowCluster" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a0aec0" />
    </marker>
  </defs>
</svg>
