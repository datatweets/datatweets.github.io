<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>The CityFlow platform health-check script, step by step</title>
  <desc>A six-step flow: describe_cluster confirms 3 brokers reachable; create a uniquely timestamped topic (cityflow-platform-check with a millisecond timestamp suffix) so no two runs can ever collide; wait_until_topic polls list_topics until the new topic is actually visible, replacing a blind sleep; produce one message and consume it back at its exact offset; confirm Kafdrop answers over HTTP; delete the topic and wait_until_topic polls again until it's actually gone. A callout below explains that topic creation and deletion are asynchronous, so a blind sleep can lose the race between two rapid runs, which is why both the unique name and the polling helper exist together.</desc>
  <rect width="1100" height="420" fill="#ffffff" />
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Six Steps, Each One Actually Checked</text>

  <!-- step boxes -->
  <rect x="30" y="60" width="160" height="60" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="110" y="85" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">1. describe_cluster()</text>
  <text x="110" y="102" text-anchor="middle" font-size="9" fill="#2c5282">assert 3 brokers reachable</text>

  <rect x="210" y="60" width="180" height="60" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="300" y="80" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">2. create_topics()</text>
  <text x="300" y="96" text-anchor="middle" font-size="8.5" font-family="Menlo, monospace" fill="#2c5282">cityflow-platform-check-{ms}</text>
  <text x="300" y="110" text-anchor="middle" font-size="8.5" fill="#2c5282">unique name every run</text>

  <rect x="410" y="60" width="180" height="60" rx="6" fill="#fefcbf" stroke="#ecc94b" stroke-width="1.4" />
  <text x="500" y="80" text-anchor="middle" font-size="10.5" font-weight="700" fill="#744210">3. wait_until_topic()</text>
  <text x="500" y="96" text-anchor="middle" font-size="8.5" fill="#744210">polls list_topics() until</text>
  <text x="500" y="110" text-anchor="middle" font-size="8.5" fill="#744210">present, no blind sleep</text>

  <rect x="610" y="60" width="180" height="60" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="700" y="80" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">4. produce + consume</text>
  <text x="700" y="96" text-anchor="middle" font-size="8.5" fill="#2c5282">round trip at the exact</text>
  <text x="700" y="110" text-anchor="middle" font-size="8.5" fill="#2c5282">offset just produced</text>

  <rect x="810" y="60" width="150" height="60" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="885" y="80" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">5. urlopen()</text>
  <text x="885" y="96" text-anchor="middle" font-size="8.5" fill="#2c5282">Kafdrop answers</text>
  <text x="885" y="110" text-anchor="middle" font-size="8.5" fill="#2c5282">HTTP 200</text>

  <line x1="190" y1="90" x2="205" y2="90" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arrowHC)" />
  <line x1="390" y1="90" x2="405" y2="90" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arrowHC)" />
  <line x1="590" y1="90" x2="605" y2="90" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arrowHC)" />
  <line x1="790" y1="90" x2="805" y2="90" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arrowHC)" />

  <line x1="885" y1="120" x2="885" y2="150" stroke="#a0aec0" stroke-width="1.6" />
  <line x1="500" y1="150" x2="885" y2="150" stroke="#a0aec0" stroke-width="1.6" />
  <line x1="500" y1="150" x2="500" y2="165" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#arrowHC)" />

  <rect x="410" y="167" width="180" height="60" rx="6" fill="#fed7d7" stroke="#fc8181" stroke-width="1.4" />
  <text x="500" y="187" text-anchor="middle" font-size="10.5" font-weight="700" fill="#742a2a">6. delete_topics()</text>
  <text x="500" y="203" text-anchor="middle" font-size="8.5" fill="#742a2a">then wait_until_topic()</text>
  <text x="500" y="217" text-anchor="middle" font-size="8.5" fill="#742a2a">again, until it's gone</text>

  <defs>
    <marker id="arrowHC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a0aec0" />
    </marker>
  </defs>

  <line x1="40" y1="260" x2="1060" y2="260" stroke="#e2e8f0" stroke-width="1.2" />

  <rect x="40" y="280" width="1020" height="110" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" />
  <text x="60" y="304" font-size="12" font-weight="700" fill="#7b341e">Why both a unique name AND polling -- neither alone was enough</text>
  <text x="60" y="326" font-size="10" fill="#7b341e">Topic creation and deletion are asynchronous in Kafka: a request returning doesn't mean the change is visible cluster-wide yet.</text>
  <text x="60" y="343" font-size="10" fill="#7b341e">A fixed topic name reused across rapid runs let one run's delete race an earlier run's still-finishing delete of the same name --</text>
  <text x="60" y="360" font-size="10" fill="#7b341e">reproduced directly with back-to-back runs. Fix: a timestamp-suffixed name rules out collisions entirely, and wait_until_topic()</text>
  <text x="60" y="377" font-size="10" fill="#7b341e">polls for the real state instead of guessing a sleep duration -- verified robust across 6 rapid runs and 4 gate invocations.</text>
</svg>
