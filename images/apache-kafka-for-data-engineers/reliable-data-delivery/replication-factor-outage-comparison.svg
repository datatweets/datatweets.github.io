<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Replication factor 1 has nothing to fail over to. Replication factor 3 does.</title>
  <desc>Two topics, identical broker outage. cityflow-rf1-check has replication factor 1, its sole replica on broker2. When broker2 stops, every produce attempt fails with KafkaTimeoutError until broker2 returns -- no fallback exists. cityflow-rf3-check has replication factor 3 with its leader on broker3, unaffected by broker2's outage, and keeps succeeding the entire time. Replication factor sets the ceiling every other reliability setting operates under.</desc>
  <rect width="1100" height="400" fill="#ffffff" />
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Same Outage, Same Instant, Opposite Outcome</text>

  <!-- RF1 column -->
  <rect x="40" y="55" width="490" height="240" rx="8" fill="#fed7d7" stroke="#fc8181" stroke-width="1.4" />
  <text x="285" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#742a2a">cityflow-rf1-check -- Replication Factor 1</text>
  <text x="285" y="100" text-anchor="middle" font-size="10" fill="#742a2a">sole replica: broker2 only</text>

  <circle cx="285" cy="130" r="18" fill="#742a2a" />
  <text x="285" y="135" text-anchor="middle" font-size="10" font-weight="700" fill="#fed7d7">B2</text>
  <text x="285" y="160" text-anchor="middle" font-size="10.5" font-weight="700" fill="#742a2a">docker stop kafka2</text>

  <rect x="70" y="178" width="430" height="34" rx="6" fill="#742a2a" />
  <text x="285" y="200" text-anchor="middle" font-size="11" font-family="Menlo, monospace" fill="#fed7d7">send() -&gt; KafkaTimeoutError</text>

  <text x="285" y="234" text-anchor="middle" font-size="11" fill="#742a2a">No other replica exists to serve the partition.</text>
  <text x="285" y="250" text-anchor="middle" font-size="11" fill="#742a2a">Every attempt fails until broker2 itself returns.</text>
  <text x="285" y="272" text-anchor="middle" font-size="10.5" font-weight="700" fill="#742a2a">broker2 restarts -&gt; send() succeeds again</text>

  <!-- RF3 column -->
  <rect x="570" y="55" width="490" height="240" rx="8" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.4" />
  <text x="815" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#22543d">cityflow-rf3-check -- Replication Factor 3</text>
  <text x="815" y="100" text-anchor="middle" font-size="10" fill="#22543d">replicas: broker3 (leader), broker1, broker2</text>

  <circle cx="740" cy="130" r="16" fill="#22543d" />
  <text x="740" y="135" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c6f6d5">B3</text>
  <text x="740" y="158" text-anchor="middle" font-size="8.5" fill="#22543d">leader</text>

  <circle cx="815" cy="130" r="16" fill="#22543d" />
  <text x="815" y="135" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c6f6d5">B1</text>

  <circle cx="890" cy="130" r="16" fill="#a0aec0" stroke="#742a2a" stroke-width="2" />
  <text x="890" y="135" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">B2</text>
  <text x="890" y="160" text-anchor="middle" font-size="8.5" fill="#742a2a">(the one stopped -- not a replica here)</text>

  <rect x="600" y="178" width="430" height="34" rx="6" fill="#22543d" />
  <text x="815" y="200" text-anchor="middle" font-size="11" font-family="Menlo, monospace" fill="#c6f6d5">send() -&gt; partition=0 offset=0</text>

  <text x="815" y="234" text-anchor="middle" font-size="11" fill="#22543d">broker3 and broker1 were never touched --</text>
  <text x="815" y="250" text-anchor="middle" font-size="11" fill="#22543d">the leader keeps serving the whole time.</text>
  <text x="815" y="272" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22543d">no interruption, no recovery needed</text>

  <text x="550" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">Replication factor is the ceiling every other reliability setting operates under</text>
  <text x="550" y="350" text-anchor="middle" font-size="11" fill="#4a5568">acks and min.insync.replicas have nothing to enforce on a topic with only one replica --</text>
  <text x="550" y="368" text-anchor="middle" font-size="11" fill="#4a5568">redundancy has to exist before any acknowledgment setting can protect it.</text>
</svg>
