<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Every setting this module covered, contributing to one exact number</title>
  <desc>A full reliability pipeline reconciled end to end. An idempotent producer sends 300 fare-adjustment events while kafka2 is stopped and restarted mid-stream: 300 of 300 delivered, 0 errors, 0 duplicates. A retry-with-dead-letter consumer reads all 300 back: 286 processed after retrying transient failures, 14 dead-lettered matching the intentionally poisoned set exactly, 0 missing. Every setting from this module contributed: replication factor and acks kept the producer available through the outage, idempotence prevented retry duplicates, and the consumer's commit-after-outcome pattern prevented any loss on the read side.</desc>
  <rect width="1100" height="430" fill="#ffffff" />
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">300 Events, One Broker Kill, Zero Loss, Zero Duplication</text>

  <!-- Producer stage -->
  <rect x="40" y="55" width="480" height="150" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="280" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5282">IDEMPOTENT PRODUCER</text>
  <text x="280" y="100" text-anchor="middle" font-size="10" fill="#2c5282">RF=3, acks='all', enable.idempotence=True</text>
  <text x="280" y="122" text-anchor="middle" font-size="10.5" fill="#2c5282">docker stop kafka2 at seq=120</text>
  <text x="280" y="140" text-anchor="middle" font-size="10.5" fill="#2c5282">docker start kafka2 at seq=220</text>
  <rect x="70" y="152" width="420" height="38" rx="6" fill="#2c5282" />
  <text x="280" y="176" text-anchor="middle" font-size="13" font-weight="700" font-family="Menlo, monospace" fill="#ebf8ff">delivered=300  errors=0</text>

  <!-- Arrow -->
  <path d="M520,130 L575,130" stroke="#a0aec0" stroke-width="2.5" marker-end="url(#arr)" />
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>

  <!-- Consumer stage -->
  <rect x="580" y="55" width="480" height="150" rx="8" fill="#e9d8fd" stroke="#9f7aea" stroke-width="1.4" />
  <text x="820" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#553c9a">RETRY-WITH-DEAD-LETTER CONSUMER</text>
  <text x="820" y="100" text-anchor="middle" font-size="10" fill="#553c9a">commit() only after success or dead-letter</text>
  <text x="820" y="122" text-anchor="middle" font-size="10.5" fill="#553c9a">286 processed (transient retries resolved)</text>
  <text x="820" y="140" text-anchor="middle" font-size="10.5" fill="#553c9a">14 dead-lettered (poison, as designed)</text>
  <rect x="610" y="152" width="420" height="38" rx="6" fill="#553c9a" />
  <text x="820" y="176" text-anchor="middle" font-size="13" font-weight="700" font-family="Menlo, monospace" fill="#e9d8fd">seen=300  duplicates=0  missing=0</text>

  <!-- Reconciliation -->
  <rect x="140" y="225" width="820" height="110" rx="8" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.6" />
  <text x="550" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#22543d">286 processed + 14 dead-lettered = 300 of 300</text>
  <text x="550" y="280" text-anchor="middle" font-size="11.5" fill="#22543d">assert len(seen_seqs) == 300 -- passed</text>
  <text x="550" y="298" text-anchor="middle" font-size="11.5" fill="#22543d">assert not duplicate_seqs -- passed  |  assert not missing -- passed</text>
  <text x="550" y="316" text-anchor="middle" font-size="11.5" fill="#22543d">assert dead_lettered == expected_poison -- passed</text>

  <text x="550" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">Four lessons, four settings, one reconciled result</text>
  <text x="550" y="390" text-anchor="middle" font-size="11" fill="#4a5568">Replication factor and acks kept the producer available. Idempotence stopped retries from duplicating.</text>
  <text x="550" y="408" text-anchor="middle" font-size="11" fill="#4a5568">The consumer's commit-after-outcome pattern stopped anything from being silently lost.</text>
</svg>
