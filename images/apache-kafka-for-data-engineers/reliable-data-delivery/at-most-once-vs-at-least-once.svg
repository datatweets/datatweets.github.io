<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>One commit-order decision, two opposite failure modes at an identical crash</title>
  <desc>Two identical SIGKILL crashes at seq=15, differing only in commit order. At-most-once commits before processing: the offset advances past 15, the kill hits before it is logged, and seq 15 is permanently missing on restart -- zero duplicates, one loss. At-least-once processes before committing: seq 15 is logged, the kill hits before the commit, and restart re-fetches and re-logs seq 15 -- zero loss, one duplicate.</desc>
  <rect width="1100" height="400" fill="#ffffff" />
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Same Crash, Same Message, Opposite Outcome</text>

  <!-- At-most-once column -->
  <rect x="40" y="55" width="490" height="230" rx="8" fill="#fed7d7" stroke="#fc8181" stroke-width="1.4" />
  <text x="285" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#742a2a">AT-MOST-ONCE: commit() BEFORE processing</text>

  <text x="70" y="108" font-size="10.5" font-family="Menlo, monospace" fill="#742a2a">seq=15: consumer.commit()  # offset -&gt; 16</text>
  <text x="70" y="126" font-size="10.5" font-family="Menlo, monospace" fill="#742a2a">seq=15: SIGKILL  # before log write</text>
  <line x1="70" y1="136" x2="500" y2="136" stroke="#fc8181" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="70" y="156" font-size="10.5" font-family="Menlo, monospace" fill="#742a2a">restart: resumes at offset 16</text>
  <text x="70" y="174" font-size="10.5" font-family="Menlo, monospace" fill="#742a2a">seq=15 is never fetched again</text>

  <rect x="70" y="192" width="430" height="72" rx="6" fill="#742a2a" />
  <text x="285" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#fed7d7">missing: [15]</text>
  <text x="285" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#fed7d7">duplicated: []</text>
  <text x="285" y="254" text-anchor="middle" font-size="10" fill="#fed7d7">29 of 30 processed -- one gone, silently</text>

  <!-- At-least-once column -->
  <rect x="570" y="55" width="490" height="230" rx="8" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.4" />
  <text x="815" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#22543d">AT-LEAST-ONCE: commit() AFTER processing</text>

  <text x="600" y="108" font-size="10.5" font-family="Menlo, monospace" fill="#22543d">seq=15: write to log  # processed</text>
  <text x="600" y="126" font-size="10.5" font-family="Menlo, monospace" fill="#22543d">seq=15: SIGKILL  # before commit()</text>
  <line x1="600" y1="136" x2="1030" y2="136" stroke="#48bb78" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="600" y="156" font-size="10.5" font-family="Menlo, monospace" fill="#22543d">restart: resumes at offset 15</text>
  <text x="600" y="174" font-size="10.5" font-family="Menlo, monospace" fill="#22543d">seq=15 is fetched and logged again</text>

  <rect x="600" y="192" width="430" height="72" rx="6" fill="#22543d" />
  <text x="815" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#c6f6d5">missing: []</text>
  <text x="815" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#c6f6d5">duplicated: [15]</text>
  <text x="815" y="254" text-anchor="middle" font-size="10" fill="#c6f6d5">31 log entries for 30 messages -- one twice</text>

  <text x="550" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">One ordering decision. No third option that avoids both at once.</text>
  <text x="550" y="348" text-anchor="middle" font-size="11" fill="#4a5568">Exactly-once isn't a third commit order -- it needs an idempotent producer and transactions,</text>
  <text x="550" y="368" text-anchor="middle" font-size="11" fill="#4a5568">layered on top of at-least-once, which Lesson 3 builds and verifies against a real cluster.</text>
</svg>
