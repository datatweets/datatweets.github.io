<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Commit only after work is genuinely finished -- success or a deliberate give-up</title>
  <desc>A retry-with-dead-letter consumer processing 20 events. Transient failures at seqs 5, 10, and 15 retry with backoff and succeed by the third attempt. Poison messages at seqs 0, 7, and 14 are dead-lettered immediately without retrying. consumer.commit() runs only after a message succeeds or is deliberately dead-lettered, never mid-retry. Final result: 17 processed, 3 dead-lettered, 20 of 20 accounted for, zero silently lost.</desc>
  <rect width="1100" height="400" fill="#ffffff" />
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">20 Events, Two Failure Types, One Commit Rule</text>

  <!-- Transient path -->
  <rect x="40" y="55" width="490" height="220" rx="8" fill="#feebc8" stroke="#ed8936" stroke-width="1.4" />
  <text x="285" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#7b341e">TRANSIENT: seqs 5, 10, 15</text>

  <rect x="70" y="98" width="120" height="30" rx="5" fill="#fff" stroke="#ed8936"/>
  <text x="130" y="118" text-anchor="middle" font-size="10" fill="#7b341e">attempt 1: fail</text>
  <rect x="205" y="98" width="120" height="30" rx="5" fill="#fff" stroke="#ed8936"/>
  <text x="265" y="118" text-anchor="middle" font-size="10" fill="#7b341e">attempt 2: fail</text>
  <rect x="340" y="98" width="150" height="30" rx="5" fill="#ed8936"/>
  <text x="415" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">attempt 3: success</text>
  <path d="M190,113 L205,113" stroke="#7b341e" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M325,113 L340,113" stroke="#7b341e" stroke-width="1.5" marker-end="url(#a1)"/>

  <text x="285" y="150" text-anchor="middle" font-size="10.5" fill="#7b341e">backoff sleeps between attempts --</text>
  <text x="285" y="166" text-anchor="middle" font-size="10.5" fill="#7b341e">no commit until attempt 3 succeeds</text>

  <rect x="90" y="184" width="390" height="60" rx="6" fill="#7b341e" />
  <text x="285" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#feebc8">commit() -- AFTER success</text>
  <text x="285" y="230" text-anchor="middle" font-size="10" fill="#feebc8">all 3 eventually processed, 0 lost</text>

  <!-- Poison path -->
  <rect x="570" y="55" width="490" height="220" rx="8" fill="#fed7d7" stroke="#fc8181" stroke-width="1.4" />
  <text x="815" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#742a2a">POISON: seqs 0, 7, 14</text>

  <rect x="640" y="98" width="350" height="30" rx="5" fill="#fff" stroke="#fc8181"/>
  <text x="815" y="118" text-anchor="middle" font-size="10" fill="#742a2a">structurally invalid -- will never succeed</text>

  <text x="815" y="150" text-anchor="middle" font-size="10.5" fill="#742a2a">no retries wasted -- dead-lettered immediately</text>
  <text x="815" y="166" text-anchor="middle" font-size="10.5" fill="#742a2a">on the first attempt</text>

  <rect x="620" y="184" width="390" height="60" rx="6" fill="#742a2a" />
  <text x="815" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#fed7d7">commit() -- AFTER dead-lettering</text>
  <text x="815" y="230" text-anchor="middle" font-size="10" fill="#fed7d7">all 3 routed on purpose, 0 lost</text>

  <defs>
    <marker id="a1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7b341e" />
    </marker>
  </defs>

  <text x="550" y="315" text-anchor="middle" font-size="13" font-weight="700" fill="#2d3748">17 processed + 3 dead-lettered = 20 of 20 accounted for</text>
  <text x="550" y="342" text-anchor="middle" font-size="11" fill="#4a5568">commit() sits in exactly two places in this consumer's code -- after genuine success, or after a</text>
  <text x="550" y="360" text-anchor="middle" font-size="11" fill="#4a5568">deliberate give-up. No path through the retry loop commits an offset for work still in progress.</text>
</svg>
