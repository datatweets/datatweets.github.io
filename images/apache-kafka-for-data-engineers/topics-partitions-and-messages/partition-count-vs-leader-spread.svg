<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>One partition versus six: how leadership spreads across three brokers</title>
  <desc>Left panel: cityflow-single-partition has 1 partition, and its only leader is broker 2 -- every write for this topic goes through broker 2 alone, brokers 1 and 3 sit idle for it. Right panel: cityflow-six-partitions has 6 partitions, with leadership spread automatically as partition 0 on broker 1, partition 1 on broker 2, partition 2 on broker 3, partition 3 on broker 1, partition 4 on broker 2, partition 5 on broker 3 -- two partitions led by each of the three brokers, so writes and reads can be shared across all three at once.</desc>
  <rect width="1100" height="380" fill="#ffffff" />
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">More Partitions, More Brokers Actually Doing Work</text>

  <!-- LEFT: one partition -->
  <text x="40" y="62" font-size="13" font-weight="700" fill="#742a2a">cityflow-single-partition -- 1 partition</text>

  <rect x="40" y="80" width="150" height="70" rx="6" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />
  <text x="115" y="105" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4a5568">Broker 1</text>
  <text x="115" y="122" text-anchor="middle" font-size="9" fill="#a0aec0">idle for this topic</text>

  <rect x="210" y="80" width="150" height="70" rx="6" fill="#fed7d7" stroke="#fc8181" stroke-width="1.6" />
  <text x="285" y="105" text-anchor="middle" font-size="10.5" font-weight="700" fill="#742a2a">Broker 2</text>
  <text x="285" y="122" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#742a2a">leads Partition 0</text>
  <text x="285" y="137" text-anchor="middle" font-size="9" fill="#742a2a">every write goes here</text>

  <rect x="380" y="80" width="150" height="70" rx="6" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" />
  <text x="455" y="105" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4a5568">Broker 3</text>
  <text x="455" y="122" text-anchor="middle" font-size="9" fill="#a0aec0">idle for this topic</text>

  <text x="40" y="175" font-size="10.5" fill="#742a2a">One partition, one leader -- the other two brokers hold replicas but never take a single write.</text>

  <line x1="40" y1="200" x2="1060" y2="200" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- RIGHT: six partitions -->
  <text x="40" y="232" font-size="13" font-weight="700" fill="#22543d">cityflow-six-partitions -- 6 partitions</text>

  <rect x="40" y="250" width="290" height="90" rx="6" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.6" />
  <text x="185" y="272" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22543d">Broker 1</text>
  <text x="185" y="292" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#22543d">leads Partition 0</text>
  <text x="185" y="308" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#22543d">leads Partition 3</text>

  <rect x="350" y="250" width="290" height="90" rx="6" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.6" />
  <text x="495" y="272" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22543d">Broker 2</text>
  <text x="495" y="292" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#22543d">leads Partition 1</text>
  <text x="495" y="308" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#22543d">leads Partition 4</text>

  <rect x="660" y="250" width="290" height="90" rx="6" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.6" />
  <text x="805" y="272" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22543d">Broker 3</text>
  <text x="805" y="292" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#22543d">leads Partition 2</text>
  <text x="805" y="308" text-anchor="middle" font-size="9.5" font-family="Menlo, monospace" fill="#22543d">leads Partition 5</text>

  <text x="40" y="365" font-size="10.5" fill="#22543d">Six partitions spread automatically -- two leaders per broker, all three sharing the write and read load at once.</text>
</svg>
