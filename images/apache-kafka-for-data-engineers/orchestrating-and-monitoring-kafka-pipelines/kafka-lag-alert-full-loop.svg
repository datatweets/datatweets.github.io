<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>One failure, three independent, matching views</title>
  <desc>A hundred-message lag spike on cityflow-orchestration-lagcheck pushes cityflow-orchestration-monitor's real lag from 30 to 130. The cityflow_kafka_lag_check Airflow DAG, triggered again, calls CityFlowKafkaLagHook, computes lag=130, and raises ValueError since 130 exceeds LAG_THRESHOLD=100. Airflow marks the task failed and executes its on_failure_callback, cityflow_lag_alert, which calls cityflow_alerting.record_failure_alert and appends one real JSON line to cityflow_lag_alerts.jsonl. The same failure is independently visible in three places: the Grid view's red square, the task log's own text, and the alert file on disk.</desc>
  <rect width="1100" height="480" fill="#ffffff" />
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">One Failure, Three Independent, Matching Views</text>

  <!-- spike -->
  <rect x="40" y="55" width="220" height="70" rx="7" fill="#fed7d7" stroke="#e53e3e" stroke-width="1.4" />
  <text x="150" y="80" text-anchor="middle" font-size="10.5" font-weight="700" fill="#822727">+100 messages</text>
  <text x="150" y="98" text-anchor="middle" font-size="9.5" fill="#822727">lag 30 -&gt; 130</text>
  <text x="150" y="113" text-anchor="middle" font-size="8.5" fill="#822727">cityflow-orchestration-lagcheck</text>

  <path d="M260,90 L300,90" stroke="#a0aec0" stroke-width="2" marker-end="url(#a13)" />

  <rect x="300" y="55" width="230" height="70" rx="7" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="415" y="80" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c5282">check_orchestration_lag()</text>
  <text x="415" y="98" text-anchor="middle" font-size="9.5" fill="#2c5282">CityFlowKafkaLagHook -&gt; lag=130</text>
  <text x="415" y="113" text-anchor="middle" font-size="8.5" fill="#2c5282">130 &gt; LAG_THRESHOLD=100</text>

  <path d="M530,90 L570,90" stroke="#a0aec0" stroke-width="2" marker-end="url(#a13)" />

  <rect x="570" y="55" width="220" height="70" rx="7" fill="#fed7d7" stroke="#e53e3e" stroke-width="1.6" />
  <text x="680" y="80" text-anchor="middle" font-size="10.5" font-weight="700" fill="#822727">raise ValueError</text>
  <text x="680" y="98" text-anchor="middle" font-size="8.5" font-family="Menlo, monospace" fill="#822727">lag=130 exceeds</text>
  <text x="680" y="112" text-anchor="middle" font-size="8.5" font-family="Menlo, monospace" fill="#822727">threshold=100</text>

  <path d="M680,125 L680,155" stroke="#a0aec0" stroke-width="2" marker-end="url(#a13)" />

  <rect x="550" y="155" width="260" height="60" rx="7" fill="#feebc8" stroke="#ed8936" stroke-width="1.4" />
  <text x="680" y="178" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7b341e">on_failure_callback</text>
  <text x="680" y="195" text-anchor="middle" font-size="9" fill="#7b341e">cityflow_lag_alert -&gt; record_failure_alert()</text>

  <path d="M680,215 L680,245" stroke="#a0aec0" stroke-width="2" marker-end="url(#a13)" />

  <!-- three views -->
  <text x="550" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">Same Failure, Three Independent Views</text>

  <rect x="60" y="280" width="300" height="120" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" />
  <text x="210" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">Grid View</text>
  <rect x="90" y="320" width="18" height="18" fill="#48bb78" /><rect x="115" y="320" width="18" height="18" fill="#48bb78" />
  <rect x="140" y="320" width="18" height="18" fill="#fc8181" /><rect x="165" y="320" width="18" height="18" fill="#fc8181" />
  <text x="210" y="365" text-anchor="middle" font-size="9.5" fill="#4a5568">Total failed: 1 -&gt; 2</text>
  <text x="210" y="382" text-anchor="middle" font-size="8.5" fill="#718096">screenshotted live</text>

  <rect x="400" y="280" width="300" height="120" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" />
  <text x="550" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">Task Log</text>
  <text x="550" y="330" text-anchor="middle" font-size="8" font-family="Menlo, monospace" fill="#822727">ValueError: lag=130</text>
  <text x="550" y="345" text-anchor="middle" font-size="8" font-family="Menlo, monospace" fill="#822727">exceeds threshold=100</text>
  <text x="550" y="365" text-anchor="middle" font-size="8.5" fill="#4a5568">"real alert recorded -&gt; {...}"</text>
  <text x="550" y="382" text-anchor="middle" font-size="8.5" fill="#718096">screenshotted from Logs tab</text>

  <rect x="740" y="280" width="300" height="120" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" />
  <text x="890" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">Alert File on Disk</text>
  <text x="890" y="328" text-anchor="middle" font-size="7.5" font-family="Menlo, monospace" fill="#4a5568">cityflow_lag_alerts.jsonl</text>
  <text x="890" y="348" text-anchor="middle" font-size="7.5" font-family="Menlo, monospace" fill="#4a5568">{"run_id": "manual__...",</text>
  <text x="890" y="362" text-anchor="middle" font-size="7.5" font-family="Menlo, monospace" fill="#4a5568">"exception": "ValueError(...)"}</text>
  <text x="890" y="382" text-anchor="middle" font-size="8.5" fill="#718096">cat'd directly, one JSON line</text>

  <path d="M680,245 L210,280" stroke="#a0aec0" stroke-width="1.2" fill="none" marker-end="url(#a13)" />
  <path d="M680,245 L550,280" stroke="#a0aec0" stroke-width="1.2" fill="none" marker-end="url(#a13)" />
  <path d="M680,245 L890,280" stroke="#a0aec0" stroke-width="1.2" fill="none" marker-end="url(#a13)" />

  <defs>
    <marker id="a13" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>

  <text x="550" y="430" text-anchor="middle" font-size="10.5" fill="#4a5568">Same run_id, same exception text, same timestamp -- three systems, one real event.</text>
</svg>
