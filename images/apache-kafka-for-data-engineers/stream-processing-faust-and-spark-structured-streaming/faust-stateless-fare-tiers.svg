<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Eight real trips in, eight correctly tagged trips out -- no memory between them, none needed</title>
  <desc>A real Faust agent reads from cityflow-faust-transform-in and writes to cityflow-faust-transform-out, tagging each real trip event with a fare_tier based only on that event's own total_amount. Eight real trips sampled from cityflow-trip-events, including three genuine refunds with negative total_amount, come out tagged exactly: refund for negative amounts, standard for amounts under $50, premium for amounts at or above $50. No state is carried between events -- the entire agent is one function of the current message alone.</desc>
  <rect width="1100" height="400" fill="#ffffff" />
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">One Function of the Current Event -- Nothing Carried Between Messages</text>

  <!-- Input -->
  <rect x="40" y="60" width="280" height="200" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="180" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5282">cityflow-faust-transform-in</text>
  <text x="180" y="105" text-anchor="middle" font-size="9.5" fill="#2c5282">8 real trips sampled from</text>
  <text x="180" y="119" text-anchor="middle" font-size="9.5" fill="#2c5282">cityflow-trip-events</text>
  <g font-family="Menlo, monospace" font-size="9" fill="#2c5282">
    <text x="65" y="145">-74.00  -71.50  -43.45</text>
    <text x="65" y="163">20.90   21.00</text>
    <text x="65" y="181">131.00  131.10  275.59</text>
  </g>
  <text x="180" y="220" text-anchor="middle" font-size="9" fill="#2c5282">3 genuine refunds, negative</text>
  <text x="180" y="235" text-anchor="middle" font-size="9" fill="#2c5282">total_amount, present in real data</text>

  <!-- Agent -->
  <rect x="370" y="110" width="360" height="100" rx="8" fill="#e9d8fd" stroke="#9f7aea" stroke-width="1.6" />
  <text x="550" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#553c9a">@app.agent(trips_in)</text>
  <text x="550" y="158" text-anchor="middle" font-size="10" font-family="Menlo, monospace" fill="#553c9a">classify(event["total_amount"])</text>
  <text x="550" y="178" text-anchor="middle" font-size="9.5" fill="#553c9a">no memory, no table -- one event,</text>
  <text x="550" y="194" text-anchor="middle" font-size="9.5" fill="#553c9a">one decision, every single time</text>

  <path d="M320,160 L365,160" stroke="#a0aec0" stroke-width="2.5" marker-end="url(#a5)" />
  <path d="M730,160 L775,160" stroke="#a0aec0" stroke-width="2.5" marker-end="url(#a5)" />
  <defs>
    <marker id="a5" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>

  <!-- Output -->
  <rect x="780" y="60" width="280" height="200" rx="8" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.4" />
  <text x="920" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#22543d">cityflow-faust-transform-out</text>
  <g font-family="Menlo, monospace" font-size="9" fill="#22543d">
    <text x="805" y="112">refund   refund   refund</text>
    <text x="805" y="132">standard standard</text>
    <text x="805" y="152">premium  premium  premium</text>
  </g>
  <text x="920" y="185" text-anchor="middle" font-size="9" fill="#22543d">8 of 8 tagged correctly --</text>
  <text x="920" y="200" text-anchor="middle" font-size="9" fill="#22543d">boundaries confirmed too:</text>
  <text x="920" y="218" text-anchor="middle" font-size="9" font-family="Menlo, monospace" fill="#22543d">$0.00 -&gt; standard, $50.00 -&gt; premium</text>

  <text x="550" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">Faust runs one coroutine per partition -- order within a partition holds,</text>
  <text x="550" y="335" text-anchor="middle" font-size="11" fill="#4a5568">nothing needs to hold across partitions, because the function needs nothing but the current event.</text>
</svg>
