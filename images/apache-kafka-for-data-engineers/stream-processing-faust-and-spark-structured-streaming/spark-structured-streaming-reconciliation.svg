<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>The entire real corpus, streamed instead of read from a file -- reconciled exactly, in well under a minute</title>
  <desc>A real Spark Structured Streaming job reads CityFlow's entire cityflow-trip-events topic with a one-hour tumbling window on pickup_time, grouped by pickup_zone. The job processes all 9,554,757 real trip events and reconciles to exactly 240,917 zone-hour buckets and $256,692,373.14 in revenue -- the identical figures the PySpark course's own batch capstone already established by reading a static file. The entire real corpus is processed in well under a minute, compared to Faust's measured throughput of roughly 3,500 messages a second in Lesson 3, which would need on the order of 45 minutes for the same volume.</desc>
  <rect width="1100" height="410" fill="#ffffff" />
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">9,554,757 Real Trips, Streamed -- Reconciled Exactly</text>

  <!-- Kafka -->
  <rect x="40" y="60" width="230" height="90" rx="8" fill="#e9d8fd" stroke="#9f7aea" stroke-width="1.4" />
  <text x="155" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#553c9a">cityflow-trip-events</text>
  <text x="155" y="112" text-anchor="middle" font-size="10" font-family="Menlo, monospace" fill="#553c9a">9,554,757 messages</text>
  <text x="155" y="130" text-anchor="middle" font-size="9" fill="#553c9a">6 partitions, all real trips</text>

  <path d="M270,105 L325,105" stroke="#a0aec0" stroke-width="2.5" marker-end="url(#a6)" />
  <defs>
    <marker id="a6" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>

  <!-- Spark -->
  <rect x="330" y="55" width="440" height="100" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" />
  <text x="550" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5282">Spark Structured Streaming</text>
  <text x="550" y="102" text-anchor="middle" font-size="10" font-family="Menlo, monospace" fill="#2c5282">groupBy(pickup_zone, window(pickup_ts, "1 hour"))</text>
  <text x="550" y="122" text-anchor="middle" font-size="9.5" fill="#2c5282">columnar micro-batches, up to 1M rows at a time</text>
  <text x="550" y="140" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2c5282">catches up in well under a minute</text>

  <path d="M770,105 L825,105" stroke="#a0aec0" stroke-width="2.5" marker-end="url(#a6)" />

  <!-- Result -->
  <rect x="830" y="55" width="230" height="100" rx="8" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.4" />
  <text x="945" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#22543d">reconciled exactly</text>
  <text x="945" y="100" text-anchor="middle" font-size="10" font-family="Menlo, monospace" fill="#22543d">240,917 buckets</text>
  <text x="945" y="115" text-anchor="middle" font-size="10" font-family="Menlo, monospace" fill="#22543d">9,554,757 trips</text>
  <text x="945" y="130" text-anchor="middle" font-size="10" font-family="Menlo, monospace" fill="#22543d">$256,692,373.14</text>

  <!-- Comparison -->
  <rect x="140" y="195" width="820" height="130" rx="8" fill="#fed7d7" stroke="#fc8181" stroke-width="1.4" />
  <text x="550" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#742a2a">Same hardware, same cluster, two different execution models</text>
  <text x="550" y="252" text-anchor="middle" font-size="12" font-family="Menlo, monospace" fill="#742a2a">Faust (Lesson 3): ~3,500 msg/s -- ~45 minutes for this corpus</text>
  <text x="550" y="278" text-anchor="middle" font-size="12" font-family="Menlo, monospace" fill="#742a2a">Spark (this lesson): well under a minute for the same corpus</text>
  <text x="550" y="304" text-anchor="middle" font-size="10" fill="#742a2a">measured directly, not asserted -- one Python coroutine per message vs. compiled columnar batches</text>

  <text x="550" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">The same figures Course 1's batch pipeline already trusted -- reached this time from a live stream</text>
</svg>
