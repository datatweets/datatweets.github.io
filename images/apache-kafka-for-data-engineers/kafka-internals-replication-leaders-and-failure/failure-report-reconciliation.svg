<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>A failure drill against production data, reconciled to the exact message</title>
  <desc>A three-stage failure report for a broker-kill drill run against the live cityflow-trip-events topic. Baseline: 9,554,757 messages, confirmed before the drill started. During the drill: kafka2 was stopped, partitions 2 and 3 lost their leader and moved to broker 3, every partition's Isr shrank from 3 to 2, and acks=all writes kept succeeding with zero errors across 108 drill sends. After recovery: kafka2 restarted, Isr fully restored to 3 on every partition, final count 9,554,865 -- an exact growth of 108 matching the 108 drill sends, with zero loss and zero duplication confirmed by an assertion against the cluster's own offsets.</desc>
  <rect width="1100" height="420" fill="#ffffff" />
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Failure Report: cityflow-trip-events, Reconciled to the Message</text>

  <!-- Stage 1: Baseline -->
  <rect x="40" y="55" width="300" height="150" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" />
  <text x="190" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5282">1. BASELINE</text>
  <text x="190" y="112" text-anchor="middle" font-size="22" font-weight="700" font-family="Menlo, monospace" fill="#2c5282">9,554,757</text>
  <text x="190" y="132" text-anchor="middle" font-size="10.5" fill="#2c5282">messages, confirmed with a</text>
  <text x="190" y="147" text-anchor="middle" font-size="10.5" fill="#2c5282">fresh end_offsets() count</text>
  <text x="190" y="167" text-anchor="middle" font-size="10.5" fill="#2c5282">before touching anything</text>
  <text x="190" y="187" text-anchor="middle" font-size="9.5" fill="#2c5282">Isr: 3,1,2 on every partition</text>

  <!-- Stage 2: During drill -->
  <rect x="400" y="55" width="300" height="150" rx="8" fill="#fed7d7" stroke="#fc8181" stroke-width="1.4" />
  <text x="550" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#742a2a">2. DURING THE DRILL</text>
  <text x="550" y="102" text-anchor="middle" font-size="10.5" fill="#742a2a">docker stop kafka2</text>
  <text x="550" y="122" text-anchor="middle" font-size="10.5" fill="#742a2a">partitions 2 &amp; 3 lose their leader,</text>
  <text x="550" y="137" text-anchor="middle" font-size="10.5" fill="#742a2a">move to broker 3</text>
  <text x="550" y="157" text-anchor="middle" font-size="10.5" fill="#742a2a">Isr shrinks 3 -&gt; 2 everywhere</text>
  <text x="550" y="182" text-anchor="middle" font-size="14" font-weight="700" font-family="Menlo, monospace" fill="#742a2a">sent=108  errors=0</text>

  <!-- Stage 3: After recovery -->
  <rect x="760" y="55" width="300" height="150" rx="8" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.4" />
  <text x="910" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#22543d">3. AFTER RECOVERY</text>
  <text x="910" y="112" text-anchor="middle" font-size="22" font-weight="700" font-family="Menlo, monospace" fill="#22543d">9,554,865</text>
  <text x="910" y="132" text-anchor="middle" font-size="10.5" fill="#22543d">kafka2 restarted, Isr fully</text>
  <text x="910" y="147" text-anchor="middle" font-size="10.5" fill="#22543d">restored to 3 on every partition</text>
  <text x="910" y="167" text-anchor="middle" font-size="10.5" fill="#22543d">leadership stayed on broker 3</text>
  <text x="910" y="187" text-anchor="middle" font-size="10.5" fill="#22543d">until a PREFERRED election</text>

  <!-- Arrows -->
  <path d="M 340 130 L 395 130" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 700 130 L 755 130" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)" />
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0" />
    </marker>
  </defs>

  <!-- Reconciliation strip -->
  <rect x="140" y="235" width="820" height="90" rx="8" fill="#e9d8fd" stroke="#9f7aea" stroke-width="1.4" />
  <text x="550" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#553c9a">9,554,865 - 9,554,757 = 108 growth</text>
  <text x="550" y="284" text-anchor="middle" font-size="12" fill="#553c9a">108 drill sends, 108 message growth -- exact, not approximate</text>
  <text x="550" y="304" text-anchor="middle" font-size="11" fill="#553c9a">assert final_count - baseline == sent["count"]  -->  passed on the first run</text>

  <text x="550" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">Zero data loss. Zero duplication. Checked, not assumed.</text>
  <text x="550" y="385" text-anchor="middle" font-size="11" fill="#4a5568">A failure report is only as good as the number backing it -- this one is exact to the record,</text>
  <text x="550" y="403" text-anchor="middle" font-size="11" fill="#4a5568">the same discipline Module 4's guided project used to catch its own real shortfall the hard way.</text>
</svg>
