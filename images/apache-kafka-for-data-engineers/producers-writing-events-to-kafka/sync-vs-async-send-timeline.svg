<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Sync send versus async send: what .get() costs, measured</title>
  <desc>Top timeline: calling .get() after every send forces a full round trip -- send, wait for broker acknowledgment, send again -- repeated for every message, measured at 555 messages per second for 200 messages. Bottom timeline: sending all 200 messages without waiting, then calling flush once at the end, lets the client batch requests instead of waiting on each one individually, measured at 1788 messages per second -- a 3.2x difference on the same broker, same topic, same message count.</desc>
  <rect width="1100" height="360" fill="#ffffff" />
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Same 200 Messages, Same Broker -- 3.2x Apart</text>

  <!-- sync timeline -->
  <text x="40" y="65" font-size="13" font-weight="700" fill="#742a2a">Sync: .get() after every send()</text>

  <rect x="40" y="75" width="120" height="34" rx="4" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="100" y="96" text-anchor="middle" font-size="9" font-family="Menlo, monospace" fill="#742a2a">send + wait</text>
  <rect x="170" y="75" width="120" height="34" rx="4" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="230" y="96" text-anchor="middle" font-size="9" font-family="Menlo, monospace" fill="#742a2a">send + wait</text>
  <rect x="300" y="75" width="120" height="34" rx="4" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="360" y="96" text-anchor="middle" font-size="9" font-family="Menlo, monospace" fill="#742a2a">send + wait</text>
  <text x="440" y="97" font-size="14" fill="#742a2a">...</text>
  <rect x="470" y="75" width="120" height="34" rx="4" fill="#fed7d7" stroke="#fc8181" stroke-width="1.3" />
  <text x="530" y="96" text-anchor="middle" font-size="9" font-family="Menlo, monospace" fill="#742a2a">send + wait</text>
  <text x="620" y="97" font-size="9" fill="#742a2a">x 200, one full round trip per message</text>

  <rect x="40" y="125" width="550" height="34" rx="5" fill="#742a2a" />
  <text x="315" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">555 messages/second</text>

  <line x1="40" y1="180" x2="1060" y2="180" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- async timeline -->
  <text x="40" y="212" font-size="13" font-weight="700" fill="#22543d">Async: send() x 200, flush() once</text>

  <rect x="40" y="222" width="40" height="34" rx="4" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.3" />
  <rect x="85" y="222" width="40" height="34" rx="4" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.3" />
  <rect x="130" y="222" width="40" height="34" rx="4" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.3" />
  <rect x="175" y="222" width="40" height="34" rx="4" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.3" />
  <rect x="220" y="222" width="40" height="34" rx="4" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.3" />
  <rect x="265" y="222" width="40" height="34" rx="4" fill="#c6f6d5" stroke="#48bb78" stroke-width="1.3" />
  <text x="330" y="243" font-size="14" fill="#22543d">...</text>

  <rect x="380" y="222" width="130" height="34" rx="4" fill="#48bb78" />
  <text x="445" y="243" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">flush() -- once</text>
  <text x="620" y="243" font-size="9" fill="#22543d">200 sends queued, no waiting between them</text>

  <rect x="40" y="272" width="176" height="34" rx="5" fill="#22543d" />
  <text x="128" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1788 messages/second</text>

  <text x="650" y="285" font-size="12" fill="#4a5568">3.2x faster -- the client batches queued messages</text>
  <text x="650" y="302" font-size="12" fill="#4a5568">into fewer network requests when nothing blocks it</text>
  <text x="650" y="319" font-size="12" fill="#4a5568">from doing so between sends.</text>
</svg>
