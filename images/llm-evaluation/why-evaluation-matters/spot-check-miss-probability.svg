<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Probability that spot-checking a few answers sees no failure</title>
  <desc id="svgDesc">Grouped bar chart. For 3, 5, and 10 spot-checks, three bars each show the probability that every checked answer passes when the true accuracy is 90 percent (blue), 80 percent (orange), and 70 percent (red). With only 3 checks a 90-percent assistant looks perfect 0.729 of the time and even a 70-percent assistant looks perfect 0.343 of the time. Adding more checks lowers every bar.</desc>
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <text x="40" y="38" font-size="21" font-weight="700" fill="#1a202c">The failures you never sampled stay invisible</text>
  <text x="40" y="62" font-size="14" fill="#4a5568">Chance that every spot-checked answer passes &#8212; i.e. you see nothing wrong &#8212; by true accuracy</text>

  <!-- y axis gridlines and labels -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="70" y1="90"  x2="720" y2="90"/>
    <line x1="70" y1="165" x2="720" y2="165"/>
    <line x1="70" y1="240" x2="720" y2="240"/>
    <line x1="70" y1="315" x2="720" y2="315"/>
    <line x1="70" y1="390" x2="720" y2="390"/>
  </g>
  <g font-size="12" fill="#718096" text-anchor="end">
    <text x="60" y="94">1.00</text>
    <text x="60" y="169">0.75</text>
    <text x="60" y="244">0.50</text>
    <text x="60" y="319">0.25</text>
    <text x="60" y="394">0.00</text>
  </g>
  <line x1="70" y1="390" x2="720" y2="390" stroke="#4a5568" stroke-width="1.5"/>
  <text x="24" y="240" font-size="12" fill="#4a5568" text-anchor="middle" transform="rotate(-90 24 240)">P(all checks pass)</text>

  <!-- Group 1: 3 checks -->
  <g>
    <rect x="108" y="171.3" width="40" height="218.7" fill="#4299e1"/>
    <rect x="158" y="236.4" width="40" height="153.6" fill="#ed8936"/>
    <rect x="208" y="287.1" width="40" height="102.9" fill="#fc8181"/>
    <text x="128" y="164" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">0.729</text>
    <text x="178" y="229" font-size="12" font-weight="700" fill="#c05621" text-anchor="middle">0.512</text>
    <text x="228" y="280" font-size="12" font-weight="700" fill="#c53030" text-anchor="middle">0.343</text>
    <text x="178" y="410" font-size="13" font-weight="600" fill="#1a202c" text-anchor="middle">3 checks</text>
  </g>

  <!-- Group 2: 5 checks -->
  <g>
    <rect x="325" y="213" width="40" height="177" fill="#4299e1"/>
    <rect x="375" y="291.6" width="40" height="98.4" fill="#ed8936"/>
    <rect x="425" y="339.6" width="40" height="50.4" fill="#fc8181"/>
    <text x="345" y="206" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">0.590</text>
    <text x="395" y="284" font-size="12" font-weight="700" fill="#c05621" text-anchor="middle">0.328</text>
    <text x="445" y="332" font-size="12" font-weight="700" fill="#c53030" text-anchor="middle">0.168</text>
    <text x="395" y="410" font-size="13" font-weight="600" fill="#1a202c" text-anchor="middle">5 checks</text>
  </g>

  <!-- Group 3: 10 checks -->
  <g>
    <rect x="542" y="285.3" width="40" height="104.7" fill="#4299e1"/>
    <rect x="592" y="357.9" width="40" height="32.1" fill="#ed8936"/>
    <rect x="642" y="381.6" width="40" height="8.4" fill="#fc8181"/>
    <text x="562" y="278" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">0.349</text>
    <text x="612" y="350" font-size="12" font-weight="700" fill="#c05621" text-anchor="middle">0.107</text>
    <text x="662" y="374" font-size="12" font-weight="700" fill="#c53030" text-anchor="middle">0.028</text>
    <text x="612" y="410" font-size="13" font-weight="600" fill="#1a202c" text-anchor="middle">10 checks</text>
  </g>

  <!-- legend -->
  <g font-size="12.5" fill="#4a5568">
    <rect x="230" y="432" width="14" height="14" fill="#4299e1"/>
    <text x="250" y="443">90% correct</text>
    <rect x="360" y="432" width="14" height="14" fill="#ed8936"/>
    <text x="380" y="443">80% correct</text>
    <rect x="490" y="432" width="14" height="14" fill="#fc8181"/>
    <text x="510" y="443">70% correct</text>
  </g>
</svg>
