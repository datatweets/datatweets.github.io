<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">The offline and online evaluation loop for Docent</title>
  <desc id="desc">A cycle showing offline evaluation on a fixed golden set gating a release, then shipping Docent, then online evaluation on real production traffic, whose newly discovered failure cases feed back into the golden set to close the loop.</desc>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">Offline gates the release, online catches what it missed</text>

  <!-- OFFLINE box -->
  <rect x="40" y="80" width="330" height="180" rx="12" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="205" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#2b6cb0">OFFLINE evaluation</text>
  <text x="205" y="136" text-anchor="middle" font-size="13" fill="#4a5568">before you ship</text>
  <text x="62" y="168" font-size="13" fill="#1a202c">&#8226; Run Docent over a fixed golden set</text>
  <text x="62" y="192" font-size="13" fill="#1a202c">&#8226; Reproducible, fast, cheap</text>
  <text x="62" y="216" font-size="13" fill="#1a202c">&#8226; Compare prompts and models</text>
  <text x="62" y="240" font-size="13" fill="#1a202c">&#8226; Score gates the release</text>

  <!-- ONLINE box -->
  <rect x="530" y="80" width="330" height="180" rx="12" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
  <text x="695" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#276749">ONLINE evaluation</text>
  <text x="695" y="136" text-anchor="middle" font-size="13" fill="#4a5568">after you ship</text>
  <text x="552" y="168" font-size="13" fill="#1a202c">&#8226; Measure on real user traffic</text>
  <text x="552" y="192" font-size="13" fill="#1a202c">&#8226; Thumbs, edits, follow-ups, A/B</text>
  <text x="552" y="216" font-size="13" fill="#1a202c">&#8226; Refusal and guardrail hit-rates</text>
  <text x="552" y="240" font-size="13" fill="#1a202c">&#8226; Realistic, but slower and noisier</text>

  <!-- SHIP node in middle top -->
  <rect x="393" y="140" width="114" height="60" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/>
  <text x="450" y="167" text-anchor="middle" font-size="15" font-weight="700" fill="#6b46c1">SHIP</text>
  <text x="450" y="187" text-anchor="middle" font-size="12" fill="#4a5568">if score passes</text>

  <!-- arrow offline -> ship -->
  <line x1="370" y1="170" x2="391" y2="170" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- arrow ship -> online -->
  <line x1="507" y1="170" x2="528" y2="170" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- feedback loop: online bottom -> back to offline bottom -->
  <path d="M 695 260 L 695 340 L 205 340 L 205 262" fill="none" stroke="#c05621" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aro)"/>
  <rect x="330" y="316" width="240" height="48" rx="10" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
  <text x="450" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">New failure cases from real users</text>
  <text x="450" y="356" text-anchor="middle" font-size="12" fill="#4a5568">become new golden-set items</text>

  <text x="450" y="420" text-anchor="middle" font-size="14" fill="#4a5568">Offline and online are complementary regimes, not rivals &#8212; each covers the other's blind spot.</text>
  <text x="450" y="446" text-anchor="middle" font-size="13" fill="#718096">Coverage vs. realism &#183; speed vs. signal &#183; reproducibility vs. relevance</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a5568"/>
    </marker>
    <marker id="aro" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c05621"/>
    </marker>
  </defs>
</svg>
