<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Decompose-and-check faithfulness pipeline for a Docent answer</title>
  <desc id="figDesc">A four-stage left-to-right flow. Stage one is Docent's answer about the Pro plan. Stage two decomposes it into three atomic claims. Stage three checks each claim against the retrieved Meridian context, marking one SUPPORTED in green and two NOT_SUPPORTED in red. Stage four computes faithfulness as supported claims over total claims, giving one over three which is 0.33.</desc>
  <rect width="880" height="470" fill="#ffffff"/>

  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Faithfulness = supported claims &#247; total claims</text>
  <text x="440" y="56" text-anchor="middle" font-size="13" fill="#718096">Decompose the answer, then entail each claim against the retrieved context</text>

  <!-- Stage 1: Answer -->
  <rect x="24" y="92" width="176" height="150" rx="12" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
  <text x="112" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">1. Docent answer</text>
  <text x="40" y="146" font-size="11.5" fill="#1a202c">The Pro plan costs</text>
  <text x="40" y="164" font-size="11.5" fill="#1a202c">25 dollars per month,</text>
  <text x="40" y="182" font-size="11.5" fill="#1a202c">includes a 30-day</text>
  <text x="40" y="200" font-size="11.5" fill="#1a202c">free trial, and a</text>
  <text x="40" y="218" font-size="11.5" fill="#1a202c">99.99% uptime SLA.</text>

  <!-- arrow 1 -->
  <path d="M204 167 L236 167" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- Stage 2: Claims -->
  <rect x="240" y="92" width="196" height="150" rx="12" fill="#faf5ff" stroke="#9f7aea" stroke-width="2"/>
  <text x="338" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">2. Atomic claims</text>
  <rect x="256" y="130" width="164" height="30" rx="6" fill="#ffffff" stroke="#9f7aea" stroke-width="1"/>
  <text x="264" y="149" font-size="11" fill="#1a202c">Pro costs 25 dollars/mo</text>
  <rect x="256" y="166" width="164" height="30" rx="6" fill="#ffffff" stroke="#9f7aea" stroke-width="1"/>
  <text x="264" y="185" font-size="11" fill="#1a202c">Includes a 30-day trial</text>
  <rect x="256" y="202" width="164" height="30" rx="6" fill="#ffffff" stroke="#9f7aea" stroke-width="1"/>
  <text x="264" y="221" font-size="11" fill="#1a202c">99.99% uptime SLA</text>

  <!-- arrow 2 -->
  <path d="M440 167 L472 167" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- Stage 3: Check against context -->
  <rect x="476" y="92" width="220" height="150" rx="12" fill="#f7fafc" stroke="#a0aec0" stroke-width="2"/>
  <text x="586" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">3. Entail vs. context</text>
  <rect x="492" y="130" width="188" height="30" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5"/>
  <text x="500" y="149" font-size="11" fill="#276749">&#10003; SUPPORTED</text>
  <rect x="492" y="166" width="188" height="30" rx="6" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
  <text x="500" y="185" font-size="11" fill="#c53030">&#10007; NOT_SUPPORTED</text>
  <rect x="492" y="202" width="188" height="30" rx="6" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
  <text x="500" y="221" font-size="11" fill="#c53030">&#10007; NOT_SUPPORTED</text>

  <!-- arrow 3 -->
  <path d="M700 167 L732 167" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- Stage 4: Score -->
  <rect x="736" y="102" width="120" height="130" rx="12" fill="#fffaf0" stroke="#ed8936" stroke-width="2"/>
  <text x="796" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">4. Score</text>
  <text x="796" y="168" text-anchor="middle" font-size="30" font-weight="700" fill="#c05621">0.33</text>
  <text x="796" y="196" text-anchor="middle" font-size="13" fill="#c05621">1 of 3</text>
  <text x="796" y="214" text-anchor="middle" font-size="13" fill="#c05621">supported</text>

  <!-- context strip -->
  <rect x="24" y="276" width="832" height="86" rx="12" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5"/>
  <text x="44" y="300" font-size="13" font-weight="700" fill="#2b6cb0">Retrieved Meridian context (the only thing claims are graded against)</text>
  <text x="44" y="324" font-size="12" fill="#1a202c">[plans] Pro costs 25 dollars per month and includes 50 GB of storage. All plans include unlimited read replicas.</text>
  <text x="44" y="346" font-size="12" fill="#718096">No mention of a free trial or an uptime SLA &#8594; those two claims were invented, so faithfulness drops below 1.0.</text>

  <!-- note about correctness -->
  <rect x="24" y="382" width="832" height="66" rx="12" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="44" y="406" font-size="12.5" font-weight="700" fill="#4a5568">Faithful &#8800; correct.</text>
  <text x="160" y="406" font-size="12.5" fill="#4a5568">A claim is SUPPORTED when the CONTEXT entails it &#8212; even if the context itself is wrong.</text>
  <text x="44" y="430" font-size="12.5" fill="#4a5568">An answer can be faithful but wrong (bad context) or correct but unfaithful (right by luck). This metric measures grounding only.</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#a0aec0"/>
    </marker>
  </defs>
</svg>
