<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Full RAG evaluation and failure diagnosis for Docent</title>
  <desc id="desc">A flow that starts from a golden set of questions each tagged with a known relevant document id, runs Docent's retrieve then generate steps, then splits into two measurement lanes. The retrieval lane is deterministic and reports recall at 2 of 0.80, precision at 2 of 0.40, and MRR of 0.70. The generation lane uses a live claude-haiku-4-5 judge to score faithfulness and answer relevance. A diagnosis decision below asks, for each failing answer, whether the relevant document was retrieved: if recall is zero the failure is a retrieval problem so you fix the search, otherwise the context was right and the failure is a generation problem so you fix the prompt. Two example chips show the Free plan question diagnosed as retrieval, recall zero and relevance two, and an injected backups answer diagnosed as generation, recall one and faithfulness one.</desc>
  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">Full RAG evaluation: diagnosing where a failure comes from</text>

  <!-- Golden set -->
  <rect x="30" y="52" width="200" height="86" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5"/>
  <text x="130" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">Golden set</text>
  <text x="130" y="94" text-anchor="middle" font-size="11.5" fill="#4a5568">question + reference +</text>
  <text x="130" y="110" text-anchor="middle" font-size="11.5" fill="#4a5568">known relevant doc id</text>
  <text x="130" y="128" text-anchor="middle" font-size="11" fill="#718096">5 questions</text>

  <!-- Docent pipeline -->
  <rect x="290" y="52" width="200" height="86" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="390" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">Docent pipeline</text>
  <text x="390" y="96" text-anchor="middle" font-size="12" fill="#4a5568">retrieve( ) &#8594; generate( )</text>
  <text x="390" y="116" text-anchor="middle" font-size="11" fill="#718096">keyword search, then</text>
  <text x="390" y="130" text-anchor="middle" font-size="11" fill="#718096">claude-haiku-4-5</text>

  <!-- Eval record -->
  <rect x="550" y="52" width="300" height="86" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="700" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">One evaluation record / question</text>
  <text x="700" y="96" text-anchor="middle" font-size="11.5" fill="#4a5568">question &#183; retrieved ids &#183; relevant id &#183; answer</text>
  <text x="700" y="118" text-anchor="middle" font-size="11" fill="#718096">the shared input to both metric lanes below</text>

  <line x1="230" y1="95" x2="288" y2="95" stroke="#a0aec0" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="490" y1="95" x2="548" y2="95" stroke="#a0aec0" stroke-width="2" marker-end="url(#ar)"/>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0aec0"/>
    </marker>
  </defs>

  <!-- Retrieval lane -->
  <rect x="30" y="170" width="400" height="128" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5"/>
  <text x="230" y="192" text-anchor="middle" font-size="13.5" font-weight="700" fill="#276749">Retrieval metrics &#8212; deterministic</text>
  <text x="230" y="210" text-anchor="middle" font-size="11" fill="#718096">same numbers on every re-run</text>
  <rect x="48" y="222" width="118" height="58" rx="8" fill="#ffffff" stroke="#48bb78" stroke-width="1"/>
  <text x="107" y="245" text-anchor="middle" font-size="12" fill="#4a5568">recall@2</text>
  <text x="107" y="268" text-anchor="middle" font-size="18" font-weight="700" fill="#276749">0.80</text>
  <rect x="171" y="222" width="118" height="58" rx="8" fill="#ffffff" stroke="#48bb78" stroke-width="1"/>
  <text x="230" y="245" text-anchor="middle" font-size="12" fill="#4a5568">precision@2</text>
  <text x="230" y="268" text-anchor="middle" font-size="18" font-weight="700" fill="#276749">0.40</text>
  <rect x="294" y="222" width="118" height="58" rx="8" fill="#ffffff" stroke="#48bb78" stroke-width="1"/>
  <text x="353" y="245" text-anchor="middle" font-size="12" fill="#4a5568">MRR</text>
  <text x="353" y="268" text-anchor="middle" font-size="18" font-weight="700" fill="#276749">0.70</text>

  <!-- Generation lane -->
  <rect x="450" y="170" width="400" height="128" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5"/>
  <text x="650" y="192" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c05621">Generation metrics &#8212; live judge</text>
  <text x="650" y="210" text-anchor="middle" font-size="11" fill="#718096">claude-haiku-4-5, scores wobble &#177;1 run to run</text>
  <rect x="468" y="222" width="178" height="58" rx="8" fill="#ffffff" stroke="#ed8936" stroke-width="1"/>
  <text x="557" y="245" text-anchor="middle" font-size="12" fill="#4a5568">faithfulness (1&#8211;5)</text>
  <text x="557" y="268" text-anchor="middle" font-size="11.5" fill="#718096">claims backed by context?</text>
  <rect x="652" y="222" width="180" height="58" rx="8" fill="#ffffff" stroke="#ed8936" stroke-width="1"/>
  <text x="742" y="245" text-anchor="middle" font-size="12" fill="#4a5568">answer relevance (1&#8211;5)</text>
  <text x="742" y="268" text-anchor="middle" font-size="11.5" fill="#718096">does it answer the Q?</text>

  <line x1="700" y1="138" x2="230" y2="168" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="700" y1="138" x2="650" y2="168" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Diagnosis decision -->
  <text x="440" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#1a202c">For each FAILING answer &#8594; was the relevant doc retrieved?</text>
  <polygon points="440,344 540,384 440,424 340,384" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/>
  <text x="440" y="380" text-anchor="middle" font-size="12" fill="#4a5568">recall@k</text>
  <text x="440" y="396" text-anchor="middle" font-size="12" fill="#4a5568">= 0 ?</text>

  <!-- Retrieval branch -->
  <line x1="340" y1="384" x2="245" y2="384" stroke="#c53030" stroke-width="2" marker-end="url(#arR)"/>
  <text x="292" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#c53030">yes</text>
  <rect x="30" y="352" width="205" height="64" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="132" y="376" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">RETRIEVAL problem</text>
  <text x="132" y="398" text-anchor="middle" font-size="11.5" fill="#4a5568">right doc never came back</text>
  <text x="132" y="412" text-anchor="middle" font-size="11.5" fill="#718096">&#8594; fix the search, not the prompt</text>

  <!-- Generation branch -->
  <line x1="540" y1="384" x2="635" y2="384" stroke="#c05621" stroke-width="2" marker-end="url(#arO)"/>
  <text x="588" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">no</text>
  <rect x="645" y="352" width="205" height="64" rx="10" fill="#fffaf0" stroke="#c05621" stroke-width="1.5"/>
  <text x="747" y="376" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">GENERATION problem</text>
  <text x="747" y="398" text-anchor="middle" font-size="11.5" fill="#4a5568">had the context, botched it</text>
  <text x="747" y="412" text-anchor="middle" font-size="11.5" fill="#718096">&#8594; fix the prompt, not the search</text>

  <defs>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c53030"/></marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c05621"/></marker>
  </defs>

  <!-- Example chips -->
  <rect x="30" y="440" width="400" height="96" rx="10" fill="#ffffff" stroke="#c53030" stroke-width="1.5"/>
  <text x="230" y="461" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c53030">Example: "Free plan per-minute cap"</text>
  <text x="230" y="482" text-anchor="middle" font-size="11.5" fill="#4a5568">retrieved [regions, backups] &#8212; ratelimits missed</text>
  <text x="230" y="500" text-anchor="middle" font-size="11.5" fill="#4a5568">recall@2 = 0 &#183; faithfulness 5 &#183; relevance 2 (false refusal)</text>
  <text x="230" y="522" text-anchor="middle" font-size="12" font-weight="700" fill="#c53030">diagnosis: RETRIEVAL</text>

  <rect x="450" y="440" width="400" height="96" rx="10" fill="#ffffff" stroke="#c05621" stroke-width="1.5"/>
  <text x="650" y="461" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c05621">Example: injected wrong backups answer</text>
  <text x="650" y="482" text-anchor="middle" font-size="11.5" fill="#4a5568">retrieved [backups, regions] &#8212; right doc present</text>
  <text x="650" y="500" text-anchor="middle" font-size="11.5" fill="#4a5568">recall@2 = 1 &#183; faithfulness 1 (says 30 days) &#183; relevance 5</text>
  <text x="650" y="522" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">diagnosis: GENERATION</text>
</svg>
