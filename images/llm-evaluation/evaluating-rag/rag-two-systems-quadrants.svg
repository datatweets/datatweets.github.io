<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>A RAG app is a retriever plus a generator in series, and its four failure quadrants</title>
  <rect x="0" y="0" width="860" height="600" fill="#ffffff"/>

  <!-- ===== Top: the pipeline ===== -->
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">A RAG app is two systems in series</text>
  <text x="430" y="56" text-anchor="middle" font-size="13" fill="#718096">A bad final answer can come from either stage &#8212; so you must evaluate each one</text>

  <!-- Question -->
  <rect x="26" y="82" width="120" height="58" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="86" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Question</text>
  <text x="86" y="126" text-anchor="middle" font-size="11" fill="#718096">user asks Docent</text>

  <!-- arrow -->
  <line x1="146" y1="111" x2="196" y2="111" stroke="#4a5568" stroke-width="2"/>
  <polygon points="196,111 186,106 186,116" fill="#4a5568"/>

  <!-- Retriever -->
  <rect x="198" y="82" width="150" height="58" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.8"/>
  <text x="273" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">Retriever</text>
  <text x="273" y="124" text-anchor="middle" font-size="11.5" fill="#2b6cb0">retrieve() &#8594; doc pages</text>

  <!-- arrow labelled context -->
  <line x1="348" y1="111" x2="404" y2="111" stroke="#4a5568" stroke-width="2"/>
  <polygon points="404,111 394,106 394,116" fill="#4a5568"/>
  <text x="376" y="102" text-anchor="middle" font-size="10.5" fill="#718096">context</text>

  <!-- Generator -->
  <rect x="406" y="82" width="150" height="58" rx="8" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.8"/>
  <text x="481" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">Generator</text>
  <text x="481" y="124" text-anchor="middle" font-size="11.5" fill="#6b46c1">Claude answers</text>

  <!-- arrow -->
  <line x1="556" y1="111" x2="606" y2="111" stroke="#4a5568" stroke-width="2"/>
  <polygon points="606,111 596,106 596,116" fill="#4a5568"/>

  <!-- Answer -->
  <rect x="608" y="82" width="120" height="58" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="668" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Answer</text>
  <text x="668" y="126" text-anchor="middle" font-size="11" fill="#718096">what you read</text>

  <!-- "only reading this can't localize the fault" -->
  <path d="M 668 140 L 668 158 L 273 158 L 273 148" fill="none" stroke="#c53030" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="470" y="174" text-anchor="middle" font-size="11.5" fill="#c53030">Reading only the Answer can&#8217;t tell you which stage failed</text>

  <!-- ===== Bottom: 2x2 quadrant grid ===== -->
  <text x="430" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">The four failure quadrants</text>

  <!-- axis labels -->
  <text x="72" y="330" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568" transform="rotate(-90 72 330)">Generation</text>
  <text x="430" y="574" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">Retrieval</text>

  <!-- column headers -->
  <text x="300" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">good retrieval (right context)</text>
  <text x="600" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#c53030">bad retrieval (wrong / missing context)</text>

  <!-- row headers -->
  <text x="150" y="316" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749" transform="rotate(-90 150 316)">good gen</text>
  <text x="150" y="470" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c53030" transform="rotate(-90 150 470)">bad gen</text>

  <!-- Q1 good retrieval + good gen (ideal) -->
  <rect x="168" y="250" width="264" height="132" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.8"/>
  <text x="300" y="276" text-anchor="middle" font-size="13.5" font-weight="700" fill="#276749">Ideal &#10003;</text>
  <text x="300" y="300" text-anchor="middle" font-size="11.5" fill="#276749">right pages retrieved,</text>
  <text x="300" y="318" text-anchor="middle" font-size="11.5" fill="#276749">right answer generated</text>
  <text x="300" y="348" text-anchor="middle" font-size="11" fill="#718096" font-style="italic">401 question &#8594; ['errors','auth']</text>
  <text x="300" y="365" text-anchor="middle" font-size="11" fill="#718096" font-style="italic">&#8220;a missing or invalid API key&#8221;</text>

  <!-- Q2 bad retrieval + good gen (RETRIEVAL bug) -->
  <rect x="468" y="250" width="264" height="132" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2.4"/>
  <text x="600" y="274" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c53030">RETRIEVAL bug</text>
  <text x="600" y="293" text-anchor="middle" font-size="11" fill="#c05621">model faithfully answers</text>
  <text x="600" y="309" text-anchor="middle" font-size="11" fill="#c05621">from the wrong context</text>
  <rect x="486" y="320" width="228" height="52" rx="6" fill="#ffffff" stroke="#fc8181" stroke-width="1.4"/>
  <text x="600" y="337" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c53030">&#8220;Free plan?&#8221; &#8594; ['errors','backups']</text>
  <text x="600" y="352" text-anchor="middle" font-size="10.5" fill="#4a5568">plans page never retrieved &#8594;</text>
  <text x="600" y="366" text-anchor="middle" font-size="10.5" fill="#4a5568">false refusal &#8220;I don&#8217;t have that in the docs&#8221;</text>

  <!-- Q3 good retrieval + bad gen (GENERATION bug) -->
  <rect x="168" y="398" width="264" height="132" rx="8" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/>
  <text x="300" y="422" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b46c1">GENERATION bug</text>
  <text x="300" y="443" text-anchor="middle" font-size="11.5" fill="#6b46c1">right pages retrieved, but the</text>
  <text x="300" y="461" text-anchor="middle" font-size="11.5" fill="#6b46c1">model misreads or invents</text>
  <text x="300" y="490" text-anchor="middle" font-size="11" fill="#718096" font-style="italic">hallucination / wrong number</text>
  <text x="300" y="507" text-anchor="middle" font-size="11" fill="#718096" font-style="italic">from correct context</text>

  <!-- Q4 bad retrieval + bad gen -->
  <rect x="468" y="398" width="264" height="132" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="1.8"/>
  <text x="600" y="422" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c05621">Both broken</text>
  <text x="600" y="443" text-anchor="middle" font-size="11.5" fill="#c05621">wrong context AND</text>
  <text x="600" y="461" text-anchor="middle" font-size="11.5" fill="#c05621">a wrong answer on top</text>
  <text x="600" y="490" text-anchor="middle" font-size="11" fill="#718096" font-style="italic">two faults stacked &#8212; fix</text>
  <text x="600" y="507" text-anchor="middle" font-size="11" fill="#718096" font-style="italic">retrieval first, then re-test</text>

  <text x="430" y="592" text-anchor="middle" font-size="11" fill="#a0aec0">Localizing the fault to a quadrant is the whole point of evaluating retrieval and generation separately.</text>
</svg>
