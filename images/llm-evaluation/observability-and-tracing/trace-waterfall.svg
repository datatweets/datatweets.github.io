<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>A trace waterfall for one Docent request: a root docent.request span of 935 ms contains a short retrieve child span of 24 ms and a generate child span of 890 ms, drawn as horizontal bars on a time axis, with each span's attributes listed beside it.</title>
  <rect x="0" y="0" width="860" height="470" fill="#ffffff"/>

  <text x="30" y="40" font-size="21" font-weight="700" fill="#1a202c">One trace = a tree of timed spans</text>
  <text x="30" y="64" font-size="14" fill="#4a5568">A single Docent request, laid out on a time axis. Each bar is a span; indentation and position show the parent&#8594;child tree.</text>

  <!-- time axis -->
  <line x1="250" y1="92" x2="810" y2="92" stroke="#a0aec0" stroke-width="1"/>
  <g font-size="11" fill="#718096" text-anchor="middle">
    <line x1="250" y1="88" x2="250" y2="96" stroke="#a0aec0" stroke-width="1"/>
    <text x="250" y="84">0 ms</text>
    <line x1="390" y1="88" x2="390" y2="96" stroke="#a0aec0" stroke-width="1"/>
    <text x="390" y="84">250</text>
    <line x1="530" y1="88" x2="530" y2="96" stroke="#a0aec0" stroke-width="1"/>
    <text x="530" y="84">500</text>
    <line x1="670" y1="88" x2="670" y2="96" stroke="#a0aec0" stroke-width="1"/>
    <text x="670" y="84">750</text>
    <line x1="810" y1="88" x2="810" y2="96" stroke="#a0aec0" stroke-width="1"/>
    <text x="810" y="84">935</text>
  </g>

  <!-- Row 1: docent.request (root) 0..935ms -->
  <text x="30" y="132" font-size="14" font-weight="600" fill="#2b6cb0">docent.request</text>
  <text x="30" y="150" font-size="11" fill="#718096">root span</text>
  <rect x="250" y="116" width="560" height="30" rx="4" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5"/>
  <text x="260" y="135" font-size="12" fill="#2b6cb0" font-weight="600">935.0 ms</text>
  <text x="640" y="135" font-size="11" fill="#4a5568">question = "rate limit code"</text>

  <!-- Row 2: retrieve child 10..34ms (24ms) -->
  <text x="48" y="192" font-size="14" font-weight="600" fill="#276749">retrieve</text>
  <text x="48" y="210" font-size="11" fill="#718096">child &#8226; keyword search</text>
  <rect x="256" y="176" width="18" height="30" rx="4" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5"/>
  <text x="284" y="195" font-size="12" fill="#276749" font-weight="600">24.0 ms</text>
  <text x="360" y="195" font-size="11" fill="#4a5568">k = 2 &#8226; doc_ids = ["errors", "ratelimits"]</text>

  <!-- Row 3: generate child 40..930ms (890ms) -->
  <text x="48" y="252" font-size="14" font-weight="600" fill="#c05621">generate</text>
  <text x="48" y="270" font-size="11" fill="#718096">child &#8226; claude-haiku-4-5</text>
  <rect x="274" y="236" width="533" height="30" rx="4" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5"/>
  <text x="284" y="255" font-size="12" fill="#c05621" font-weight="600">890.0 ms</text>
  <text x="470" y="255" font-size="11" fill="#4a5568">input_tokens = 214 &#8226; output_tokens = 38</text>

  <!-- Bottleneck annotation -->
  <line x1="274" y1="236" x2="274" y2="300" stroke="#c05621" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="807" y1="236" x2="807" y2="300" stroke="#c05621" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="540" y="294" font-size="12" fill="#c05621" text-anchor="middle" font-weight="600">the model call is 95% of the request &#8594; that is where the time went</text>

  <!-- span-attribute anatomy box -->
  <rect x="30" y="330" width="800" height="118" rx="8" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="356" font-size="13" font-weight="700" fill="#1a202c">Every span carries:</text>
  <g font-size="12" fill="#4a5568">
    <text x="48" y="382"><tspan font-weight="600" fill="#2b6cb0">span_id</tspan> + <tspan font-weight="600" fill="#2b6cb0">parent_id</tspan> &#8212; wire the tree together (child points at its parent)</text>
    <text x="48" y="404"><tspan font-weight="600" fill="#c05621">name</tspan> &#8212; what the unit of work is: retrieve, generate, a tool call</text>
    <text x="48" y="426"><tspan font-weight="600" fill="#276749">start / end</tspan> &#8212; timestamps whose difference is the duration &#8226; <tspan font-weight="600" fill="#6b46c1">attributes</tspan> &#8212; tokens, doc ids, model, anything worth recording</text>
  </g>
</svg>
