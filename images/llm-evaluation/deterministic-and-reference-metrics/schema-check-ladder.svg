<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="ladderTitle ladderDesc">
  <title id="ladderTitle">The structured-output check ladder</title>
  <desc id="ladderDesc">A raw model reply enters a five-rung ladder. Rung 1 parses as JSON, rung 2 checks required fields, rung 3 checks types, rung 4 checks enums and ranges, rung 5 checks cross-field constraints. Any rung can fail out to the right; only a reply that clears all five is counted as a structured-output pass.</desc>
  <rect x="0" y="0" width="860" height="520" fill="#ffffff"/>

  <text x="30" y="40" font-size="22" font-weight="700" fill="#1a202c">The structured-output check ladder</text>
  <text x="30" y="64" font-size="14" fill="#4a5568">Each rung is a deterministic pass/fail gate. Clear all five &#8594; counts toward the pass rate.</text>

  <!-- raw reply input -->
  <rect x="30" y="92" width="220" height="60" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="2"/>
  <text x="140" y="118" font-size="13" font-weight="600" fill="#6b46c1" text-anchor="middle">Raw model reply</text>
  <text x="140" y="138" font-size="11" fill="#6b46c1" text-anchor="middle" font-family="monospace">```json { ... } ```</text>

  <!-- ladder rungs -->
  <!-- rung template positions -->
  <g>
    <!-- Rung 1 -->
    <rect x="290" y="92" width="300" height="52" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="308" y="114" font-size="14" font-weight="700" fill="#2b6cb0">1 &#183; Parses as JSON?</text>
    <text x="308" y="133" font-size="11.5" fill="#2c5282">strip fences, json.loads() succeeds</text>

    <!-- Rung 2 -->
    <rect x="290" y="164" width="300" height="52" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="308" y="186" font-size="14" font-weight="700" fill="#2b6cb0">2 &#183; Required fields present?</text>
    <text x="308" y="205" font-size="11.5" fill="#2c5282">answer, doc_id, confidence all there</text>

    <!-- Rung 3 -->
    <rect x="290" y="236" width="300" height="52" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="308" y="258" font-size="14" font-weight="700" fill="#2b6cb0">3 &#183; Correct types?</text>
    <text x="308" y="277" font-size="11.5" fill="#2c5282">confidence is a number, not "high"</text>

    <!-- Rung 4 -->
    <rect x="290" y="308" width="300" height="52" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="308" y="330" font-size="14" font-weight="700" fill="#2b6cb0">4 &#183; Enums &amp; ranges valid?</text>
    <text x="308" y="349" font-size="11.5" fill="#2c5282">doc_id in the 8 ids or null; 0 &#8804; conf &#8804; 1</text>

    <!-- Rung 5 -->
    <rect x="290" y="380" width="300" height="52" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="308" y="402" font-size="14" font-weight="700" fill="#2b6cb0">5 &#183; Cross-field constraints?</text>
    <text x="308" y="421" font-size="11.5" fill="#2c5282">e.g. doc_id null &#8658; a refusal answer</text>
  </g>

  <!-- down arrows between rungs -->
  <g stroke="#48bb78" stroke-width="2.5" fill="none">
    <path d="M440 144 L440 164"/>
    <path d="M440 216 L440 236"/>
    <path d="M440 288 L440 308"/>
    <path d="M440 360 L440 380"/>
  </g>
  <g fill="#48bb78">
    <path d="M440 166 l-5 -8 h10 z"/>
    <path d="M440 238 l-5 -8 h10 z"/>
    <path d="M440 310 l-5 -8 h10 z"/>
    <path d="M440 382 l-5 -8 h10 z"/>
  </g>

  <!-- input arrow to rung 1 -->
  <path d="M250 122 L290 118" stroke="#9f7aea" stroke-width="2.5" fill="none"/>
  <path d="M292 118 l-9 -3 v6 z" fill="#9f7aea"/>

  <!-- fail-out arrows to the right -->
  <g stroke="#c53030" stroke-width="2" fill="none" stroke-dasharray="5 3">
    <path d="M590 118 L660 118"/>
    <path d="M590 190 L660 190"/>
    <path d="M590 262 L660 262"/>
    <path d="M590 334 L660 334"/>
    <path d="M590 406 L660 406"/>
  </g>
  <g fill="#c53030">
    <path d="M662 118 l-9 -3 v6 z"/>
    <path d="M662 190 l-9 -3 v6 z"/>
    <path d="M662 262 l-9 -3 v6 z"/>
    <path d="M662 334 l-9 -3 v6 z"/>
    <path d="M662 406 l-9 -3 v6 z"/>
  </g>

  <!-- FAIL bucket -->
  <rect x="668" y="92" width="162" height="340" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="2"/>
  <text x="749" y="116" font-size="14" font-weight="700" fill="#c53030" text-anchor="middle">FAIL &#8594; score 0</text>
  <text x="682" y="146" font-size="11" fill="#742a2a">Real failures caught here:</text>
  <text x="682" y="170" font-size="10.5" fill="#742a2a">&#183; wrapped in ``` fences</text>
  <text x="682" y="190" font-size="10.5" fill="#742a2a">&#183; prose before the JSON</text>
  <text x="682" y="210" font-size="10.5" fill="#742a2a">&#183; trailing comma</text>
  <text x="682" y="230" font-size="10.5" fill="#742a2a">&#183; missing confidence</text>
  <text x="682" y="250" font-size="10.5" fill="#742a2a">&#183; number sent as "0.9"</text>
  <text x="682" y="270" font-size="10.5" fill="#742a2a">&#183; doc_id = "pricing"</text>
  <text x="682" y="290" font-size="10.5" fill="#742a2a">&#183; confidence = 1.5</text>
  <text x="682" y="310" font-size="10.5" fill="#742a2a">&#183; hallucinated extra key</text>
  <line x1="682" y1="330" x2="816" y2="330" stroke="#fc8181" stroke-width="1"/>
  <text x="682" y="352" font-size="10.5" fill="#742a2a">Fences and prose are</text>
  <text x="682" y="368" font-size="10.5" fill="#742a2a">common &#8212; extract_json()</text>
  <text x="682" y="384" font-size="10.5" fill="#742a2a">recovers those at rung 1</text>
  <text x="682" y="400" font-size="10.5" fill="#742a2a">so a wrapped-but-valid</text>
  <text x="682" y="416" font-size="10.5" fill="#742a2a">reply still passes.</text>

  <!-- PASS terminal -->
  <path d="M440 432 L440 456" stroke="#48bb78" stroke-width="2.5" fill="none"/>
  <path d="M440 458 l-5 -8 h10 z" fill="#48bb78"/>
  <rect x="290" y="458" width="300" height="46" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
  <text x="440" y="480" font-size="14" font-weight="700" fill="#276749" text-anchor="middle">PASS &#8212; valid structured output</text>
  <text x="440" y="497" font-size="11" fill="#276749" text-anchor="middle">counts toward the structured-output pass rate</text>
</svg>
