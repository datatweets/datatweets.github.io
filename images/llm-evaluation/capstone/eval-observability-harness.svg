<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="1060" height="600" fill="#ffffff"/>
  <text x="530" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">One Harness for Docent: Dataset &#8594; Score &#8594; Diagnose &#8594; Observe &#8594; Gate</text>
  <text x="530" y="62" text-anchor="middle" font-size="13.5" fill="#4a5568">Every module of the course becomes one stage of a single runnable pipeline on the Meridian docs</text>

  <!-- framing band: Module 1 -->
  <rect x="30" y="82" width="1000" height="34" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5"/>
  <text x="46" y="104" font-size="13" font-weight="700" fill="#2b6cb0">Framing &#183; Module 1 &#183; Why Evaluation Matters</text>
  <text x="1014" y="104" text-anchor="end" font-size="12.5" fill="#2b6cb0">replace "looks fine" with repeatable numbers &#8212; the reason the four stages below exist</text>

  <!-- STAGE 1 -->
  <rect x="30" y="140" width="180" height="180" rx="12" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="120" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">STAGE 1 &#183; DATASET</text>
  <text x="120" y="188" text-anchor="middle" font-size="11.5" fill="#4a5568">Module 2</text>
  <text x="120" y="204" text-anchor="middle" font-size="11.5" fill="#4a5568">Building Eval Datasets</text>
  <line x1="52" y1="216" x2="188" y2="216" stroke="#4299e1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="120" y="242" text-anchor="middle" font-size="12.5" fill="#1a202c">versioned golden set</text>
  <text x="120" y="272" text-anchor="middle" font-size="24" font-weight="700" fill="#2b6cb0">10 cases</text>
  <text x="120" y="296" text-anchor="middle" font-size="11.5" fill="#4a5568">9 factual + 1 refusal</text>
  <text x="120" y="312" text-anchor="middle" font-size="11" fill="#718096">validated, fingerprinted</text>

  <!-- STAGE 2 -->
  <rect x="240" y="140" width="180" height="180" rx="12" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/>
  <text x="330" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">STAGE 2 &#183; SCORE</text>
  <text x="330" y="184" text-anchor="middle" font-size="11.5" fill="#4a5568">Modules 3 + 4</text>
  <rect x="256" y="196" width="148" height="52" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
  <text x="330" y="213" text-anchor="middle" font-size="10.5" fill="#276749">Module 3 &#183; deterministic</text>
  <text x="330" y="235" text-anchor="middle" font-size="17" font-weight="700" fill="#276749">EM 0.00 &#183; F1 0.49</text>
  <rect x="256" y="254" width="148" height="52" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="1.5"/>
  <text x="330" y="271" text-anchor="middle" font-size="10.5" fill="#c05621">Module 4 &#183; live judge</text>
  <text x="330" y="293" text-anchor="middle" font-size="17" font-weight="700" fill="#c05621">judge 0.90</text>

  <!-- STAGE 3 -->
  <rect x="450" y="140" width="180" height="180" rx="12" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/>
  <text x="540" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">STAGE 3 &#183; DIAGNOSE</text>
  <text x="540" y="188" text-anchor="middle" font-size="11.5" fill="#4a5568">Module 5</text>
  <text x="540" y="204" text-anchor="middle" font-size="11.5" fill="#4a5568">Evaluating RAG</text>
  <line x1="472" y1="216" x2="608" y2="216" stroke="#9f7aea" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="540" y="242" text-anchor="middle" font-size="12.5" fill="#1a202c">recall@2 on gold ids</text>
  <text x="540" y="272" text-anchor="middle" font-size="24" font-weight="700" fill="#6b46c1">0.89</text>
  <text x="540" y="296" text-anchor="middle" font-size="11.5" fill="#4a5568">1 failure = RETRIEVAL</text>
  <text x="540" y="312" text-anchor="middle" font-size="11" fill="#718096">(Free-plan false refusal)</text>

  <!-- STAGE 4 -->
  <rect x="660" y="140" width="180" height="180" rx="12" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/>
  <text x="750" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">STAGE 4 &#183; OBSERVE</text>
  <text x="750" y="188" text-anchor="middle" font-size="11.5" fill="#4a5568">Module 7</text>
  <text x="750" y="204" text-anchor="middle" font-size="11.5" fill="#4a5568">Observability &amp; Tracing</text>
  <line x1="682" y1="216" x2="818" y2="216" stroke="#a0aec0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="750" y="238" text-anchor="middle" font-size="12" fill="#1a202c">20 traced calls</text>
  <text x="750" y="260" text-anchor="middle" font-size="12" fill="#1a202c">4,549 tokens &#183; $0.007</text>
  <text x="750" y="284" text-anchor="middle" font-size="12" fill="#1a202c">p50 1.6s &#183; p95 3.3s</text>
  <text x="750" y="308" text-anchor="middle" font-size="11" fill="#718096">key never logged</text>

  <!-- STAGE 5 -->
  <rect x="880" y="140" width="150" height="180" rx="12" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
  <text x="955" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">STAGE 5 &#183; GATE</text>
  <text x="955" y="188" text-anchor="middle" font-size="11.5" fill="#4a5568">Module 8</text>
  <text x="955" y="204" text-anchor="middle" font-size="10.5" fill="#4a5568">Monitoring &amp; Guardrails</text>
  <line x1="900" y1="216" x2="1010" y2="216" stroke="#fc8181" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="955" y="236" text-anchor="middle" font-size="11.5" fill="#1a202c">guardrail blocks</text>
  <text x="955" y="252" text-anchor="middle" font-size="11.5" fill="#1a202c">injection + off-topic</text>
  <text x="955" y="276" text-anchor="middle" font-size="11.5" fill="#1a202c">critical refusal held</text>
  <rect x="905" y="286" width="100" height="26" rx="13" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
  <text x="955" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">PASS &#183; ship</text>

  <!-- arrows -->
  <path d="M212 230 L238 230" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M422 230 L448 230" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M632 230 L658 230" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M842 230 L878 230" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- adjacent module 6 note -->
  <rect x="30" y="344" width="1000" height="34" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="46" y="366" font-size="13" font-weight="700" fill="#4a5568">Adjacent &#183; Module 6 &#183; Evaluating Agents &amp; Tool Use</text>
  <text x="1014" y="366" text-anchor="end" font-size="12.5" fill="#4a5568">same discipline extends to tool-call and trajectory checks when Docent is allowed to act</text>

  <!-- consolidated report strip -->
  <rect x="30" y="402" width="1000" height="164" rx="12" fill="#1a202c"/>
  <text x="50" y="430" font-size="15" font-weight="700" fill="#ffffff">Consolidated readiness report (one live run)</text>
  <text x="50" y="458" font-size="12.5" fill="#e2e8f0">Dataset: 10 versioned cases (fingerprint 8e21fccd85fe) &#8226; Deterministic: exact-match 0.00, token-F1 0.49 (reproducible)</text>
  <text x="50" y="480" font-size="12.5" fill="#e2e8f0">Judge: 0.90 correct on claude-haiku-4-5 (live, wobbles run to run) &#8226; it credits 9 correct paraphrases the string metric scores 0</text>
  <text x="50" y="502" font-size="12.5" fill="#e2e8f0">Retrieval recall@2: 0.89 &#8212; the single miss is the Free-plan false refusal, diagnosed RETRIEVAL (fix the search, not the prompt)</text>
  <text x="50" y="524" font-size="12.5" fill="#e2e8f0">Observability: 20 calls, 4,549 tokens, $0.007, latency p50 1.6s / p95 3.3s &#8212; the key is never written to any log</text>
  <text x="50" y="546" font-size="12.5" fill="#f0fff4">Gate: judge 0.90 &#8805; 0.85 threshold and the critical out-of-scope case still refuses &#8594; PASS (ship), with the retrieval fix ticketed next</text>
</svg>
