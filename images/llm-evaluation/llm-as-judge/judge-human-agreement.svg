<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="figtitle figdesc">
  <title id="figtitle">Judge versus human agreement, naive judge compared with grounded judge</title>
  <desc id="figdesc">Two 2 by 2 confusion matrices comparing an LLM judge's verdicts against human gold labels over ten Docent answers. The naive judge, given no reference facts, agrees with humans on only 4 of 10 items: it marks 5 correct answers incorrect and 1 wrong answer correct, giving agreement 0.40 and Cohen's kappa minus 0.07, worse than chance. The grounded judge, given the reference facts and a clear rubric, puts all mass on the diagonal: 6 correct and 4 incorrect matched exactly, giving agreement 1.00 and kappa 1.00.</desc>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Calibrate the judge against human labels</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#4a5568">Same 10 Docent answers, same human gold labels &#8212; only the judge prompt changes</text>

  <!-- ============ LEFT PANEL: naive judge ============ -->
  <text x="270" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#c53030">Naive judge (no reference facts)</text>

  <!-- column super-label -->
  <text x="317" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#4a5568">Judge verdict</text>
  <text x="222" y="136" text-anchor="middle" font-size="11" fill="#4a5568">Correct</text>
  <text x="412" y="136" text-anchor="middle" font-size="11" fill="#4a5568">Incorrect</text>
  <!-- row super-label -->
  <text x="88" y="207" text-anchor="middle" font-size="12" font-weight="600" fill="#4a5568" transform="rotate(-90 88 207)">Human label</text>
  <text x="160" y="182" text-anchor="end" font-size="11" fill="#4a5568">Correct</text>
  <text x="160" y="253" text-anchor="end" font-size="11" fill="#4a5568">Incorrect</text>

  <!-- cells: col0 x=175..269, col1 x=270..364 ; row0 y=145..208, row1 y=209..272 -->
  <!-- HC/JC = 1 (agree, weak) -->
  <rect x="175" y="145" width="94" height="63" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5"/>
  <text x="222" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#276749">1</text>
  <!-- HC/JI = 5 (disagree, severity) -->
  <rect x="270" y="145" width="94" height="63" fill="#fc8181" stroke="#c53030" stroke-width="1.5"/>
  <text x="317" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#742020">5</text>
  <text x="317" y="197" text-anchor="middle" font-size="9" fill="#742020">severity</text>
  <!-- HW/JC = 1 (disagree, leniency) -->
  <rect x="175" y="209" width="94" height="63" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"/>
  <text x="222" y="244" text-anchor="middle" font-size="22" font-weight="700" fill="#742020">1</text>
  <text x="222" y="261" text-anchor="middle" font-size="9" fill="#742020">leniency</text>
  <!-- HW/JI = 3 (agree) -->
  <rect x="270" y="209" width="94" height="63" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5"/>
  <text x="317" y="246" text-anchor="middle" font-size="22" font-weight="700" fill="#276749">3</text>

  <text x="270" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#c53030">agreement 4/10 = 0.40</text>
  <text x="270" y="320" text-anchor="middle" font-size="13" fill="#c53030">Cohen&#39;s kappa = &#8722;0.07</text>
  <text x="270" y="340" text-anchor="middle" font-size="11" fill="#718096">worse than a coin flip &#8212; do not trust</text>

  <!-- divider -->
  <line x1="450" y1="80" x2="450" y2="350" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ============ RIGHT PANEL: grounded judge ============ -->
  <text x="700" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#276749">Grounded judge (facts + rubric)</text>

  <text x="747" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#4a5568">Judge verdict</text>
  <text x="652" y="136" text-anchor="middle" font-size="11" fill="#4a5568">Correct</text>
  <text x="842" y="136" text-anchor="middle" font-size="11" fill="#4a5568">Incorrect</text>
  <text x="518" y="207" text-anchor="middle" font-size="12" font-weight="600" fill="#4a5568" transform="rotate(-90 518 207)">Human label</text>
  <text x="590" y="182" text-anchor="end" font-size="11" fill="#4a5568">Correct</text>
  <text x="590" y="253" text-anchor="end" font-size="11" fill="#4a5568">Incorrect</text>

  <!-- HC/JC = 6 -->
  <rect x="605" y="145" width="94" height="63" fill="#9ae6b4" stroke="#276749" stroke-width="1.5"/>
  <text x="652" y="184" text-anchor="middle" font-size="22" font-weight="700" fill="#22543d">6</text>
  <!-- HC/JI = 0 -->
  <rect x="700" y="145" width="94" height="63" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="747" y="184" text-anchor="middle" font-size="22" font-weight="700" fill="#a0aec0">0</text>
  <!-- HW/JC = 0 -->
  <rect x="605" y="209" width="94" height="63" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="652" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#a0aec0">0</text>
  <!-- HW/JI = 4 -->
  <rect x="700" y="209" width="94" height="63" fill="#9ae6b4" stroke="#276749" stroke-width="1.5"/>
  <text x="747" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#22543d">4</text>

  <text x="700" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">agreement 10/10 = 1.00</text>
  <text x="700" y="320" text-anchor="middle" font-size="13" fill="#276749">Cohen&#39;s kappa = 1.00</text>
  <text x="700" y="340" text-anchor="middle" font-size="11" fill="#718096">all mass on the diagonal &#8212; trust it</text>

  <!-- footer -->
  <rect x="150" y="378" width="600" height="66" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5"/>
  <text x="450" y="402" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2b6cb0">The diagonal is agreement; the off-diagonal is where the judge is wrong.</text>
  <text x="450" y="422" text-anchor="middle" font-size="12" fill="#2c5282">Fixing the prompt &#8212; adding reference facts and a clear rubric &#8212; moved every item onto the diagonal.</text>
  <text x="450" y="438" text-anchor="middle" font-size="11" fill="#4a5568">Live judge: claude-haiku-4-5. Verdicts are one real run; the agreement math on the recorded labels is deterministic.</text>
</svg>
