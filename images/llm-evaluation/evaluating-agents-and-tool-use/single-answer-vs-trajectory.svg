<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>A side-by-side comparison. On the left, a single-pass system grades one output with one check. On the right, an agent produces a trajectory of tool calls and observations, and six labeled points along that path can each fail before the final answer is even reached.</title>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <!-- Titles -->
  <text x="225" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">Single-pass: one output to grade</text>
  <text x="655" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">Agent: a whole trajectory to grade</text>

  <!-- divider -->
  <line x1="450" y1="60" x2="450" y2="540" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ============ LEFT: single pass ============ -->
  <!-- question -->
  <rect x="130" y="70" width="190" height="46" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
  <text x="225" y="98" text-anchor="middle" font-size="15" fill="#2b6cb0" font-weight="600">Question</text>

  <line x1="225" y1="116" x2="225" y2="150" stroke="#a0aec0" stroke-width="2"/>
  <polygon points="225,158 220,148 230,148" fill="#a0aec0"/>

  <!-- model -->
  <rect x="130" y="158" width="190" height="46" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="2"/>
  <text x="225" y="186" text-anchor="middle" font-size="15" fill="#6b46c1" font-weight="600">Model (one call)</text>

  <line x1="225" y1="204" x2="225" y2="238" stroke="#a0aec0" stroke-width="2"/>
  <polygon points="225,246 220,236 230,236" fill="#a0aec0"/>

  <!-- answer -->
  <rect x="130" y="246" width="190" height="46" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="225" y="274" text-anchor="middle" font-size="15" fill="#276749" font-weight="600">Answer</text>

  <line x1="225" y1="292" x2="225" y2="326" stroke="#a0aec0" stroke-width="2"/>
  <polygon points="225,334 220,324 230,324" fill="#a0aec0"/>

  <!-- one check -->
  <rect x="105" y="334" width="240" height="60" rx="10" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/>
  <text x="225" y="360" text-anchor="middle" font-size="15" fill="#1a202c" font-weight="700">One grade</text>
  <text x="225" y="381" text-anchor="middle" font-size="13" fill="#4a5568">Is the final answer right?</text>

  <text x="225" y="452" text-anchor="middle" font-size="14" fill="#4a5568">One place to look.</text>
  <text x="225" y="472" text-anchor="middle" font-size="14" fill="#4a5568">One thing to score.</text>

  <!-- ============ RIGHT: trajectory ============ -->
  <!-- Question -->
  <rect x="500" y="70" width="310" height="40" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
  <text x="520" y="95" font-size="15" fill="#2b6cb0" font-weight="600">Question</text>

  <!-- steps as a vertical chain with red failure tags -->
  <!-- helper: each step box on the left column of the right panel -->

  <!-- Step 1 -->
  <line x1="530" y1="110" x2="530" y2="132" stroke="#a0aec0" stroke-width="2"/>
  <rect x="500" y="132" width="200" height="40" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="2"/>
  <text x="516" y="157" font-size="14" fill="#c05621" font-weight="600">Choose a tool</text>
  <rect x="712" y="134" width="176" height="36" rx="7" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
  <text x="800" y="151" text-anchor="middle" font-size="11.5" fill="#c53030" font-weight="600">wrong tool chosen</text>
  <text x="800" y="164" text-anchor="middle" font-size="11.5" fill="#c53030">or none at all</text>

  <!-- Step 2 -->
  <line x1="530" y1="172" x2="530" y2="192" stroke="#a0aec0" stroke-width="2"/>
  <rect x="500" y="192" width="200" height="40" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="2"/>
  <text x="516" y="217" font-size="14" fill="#c05621" font-weight="600">Build the arguments</text>
  <rect x="712" y="194" width="176" height="36" rx="7" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
  <text x="800" y="211" text-anchor="middle" font-size="11.5" fill="#c53030" font-weight="600">right tool, wrong</text>
  <text x="800" y="224" text-anchor="middle" font-size="11.5" fill="#c53030">query / arguments</text>

  <!-- Step 3 -->
  <line x1="530" y1="232" x2="530" y2="252" stroke="#a0aec0" stroke-width="2"/>
  <rect x="500" y="252" width="200" height="40" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
  <text x="516" y="277" font-size="14" fill="#2b6cb0" font-weight="600">Read the observation</text>
  <rect x="712" y="254" width="176" height="36" rx="7" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
  <text x="800" y="271" text-anchor="middle" font-size="11.5" fill="#c53030" font-weight="600">misreads the result</text>
  <text x="800" y="284" text-anchor="middle" font-size="11.5" fill="#c53030">it got back</text>

  <!-- Step 4 -->
  <line x1="530" y1="292" x2="530" y2="312" stroke="#a0aec0" stroke-width="2"/>
  <rect x="500" y="312" width="200" height="40" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="2"/>
  <text x="516" y="337" font-size="14" fill="#c05621" font-weight="600">Search again?</text>
  <rect x="712" y="314" width="176" height="36" rx="7" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
  <text x="800" y="331" text-anchor="middle" font-size="11.5" fill="#c53030" font-weight="600">redundant loop or</text>
  <text x="800" y="344" text-anchor="middle" font-size="11.5" fill="#c53030">gives up too early</text>

  <!-- loop back arrow from step 4 to step 1 -->
  <path d="M 500 332 C 462 332 462 152 498 152" fill="none" stroke="#a0aec0" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="500,152 490,147 490,157" fill="#a0aec0"/>
  <text x="455" y="245" text-anchor="middle" font-size="11" fill="#718096" transform="rotate(-90 455 245)">repeat up to the step limit</text>

  <!-- Step 5: final -->
  <line x1="530" y1="352" x2="530" y2="372" stroke="#a0aec0" stroke-width="2"/>
  <rect x="500" y="372" width="200" height="42" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="516" y="398" font-size="14" fill="#276749" font-weight="600">Final answer</text>
  <rect x="712" y="373" width="176" height="40" rx="7" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
  <text x="800" y="389" text-anchor="middle" font-size="11.5" fill="#c53030" font-weight="600">hit step limit</text>
  <text x="800" y="402" text-anchor="middle" font-size="11.5" fill="#c53030">with no answer</text>

  <!-- outcome vs process note -->
  <rect x="500" y="440" width="388" height="86" rx="10" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/>
  <text x="518" y="464" font-size="13.5" fill="#1a202c" font-weight="700">Grading only the final answer misses all of the above.</text>
  <text x="518" y="486" font-size="12.5" fill="#4a5568">A right answer can hide a bad path (lucky), and a perfect</text>
  <text x="518" y="503" font-size="12.5" fill="#4a5568">path can end in a wrong answer. You must score</text>
  <text x="518" y="520" font-size="12.5" fill="#4a5568">the outcome AND the process.</text>
</svg>
