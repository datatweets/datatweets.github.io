<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Task success pipeline for the Docent agent: each golden task runs through the agent, the final answer is checked by a verifier, and the pass/fail results are aggregated into a task success rate. The real run scores 8 of 8; injecting a broken retriever drops it to 1 of 8, which the metric catches.</title>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Task success: outcome verification for the Docent agent</text>

  <!-- pipeline row -->
  <g font-size="12.5" fill="#1a202c">
    <!-- box 1: golden task -->
    <rect x="24" y="66" width="180" height="72" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="114" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">Golden task</text>
    <text x="114" y="114" text-anchor="middle" fill="#4a5568">question +</text>
    <text x="114" y="130" text-anchor="middle" fill="#4a5568">reference / refuse</text>

    <!-- box 2: agent -->
    <rect x="248" y="66" width="180" height="72" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.5"/>
    <text x="338" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">Docent agent</text>
    <text x="338" y="114" text-anchor="middle" fill="#4a5568">search_docs</text>
    <text x="338" y="130" text-anchor="middle" fill="#4a5568">&#8594; final answer</text>

    <!-- box 3: verifier -->
    <rect x="472" y="66" width="180" height="72" rx="10" fill="#fffaf0" stroke="#c05621" stroke-width="1.5"/>
    <text x="562" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">Verifier</text>
    <text x="562" y="114" text-anchor="middle" fill="#4a5568">task_succeeded()</text>
    <text x="562" y="130" text-anchor="middle" fill="#4a5568">fact match / refusal</text>

    <!-- box 4: rate -->
    <rect x="696" y="66" width="180" height="72" rx="10" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
    <text x="786" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">Success rate</text>
    <text x="786" y="122" text-anchor="middle" font-size="22" font-weight="700" fill="#276749">8 / 8 = 1.000</text>
  </g>

  <!-- arrows -->
  <g stroke="#a0aec0" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="206" y1="102" x2="246" y2="102"/>
    <line x1="430" y1="102" x2="470" y2="102"/>
    <line x1="654" y1="102" x2="694" y2="102"/>
  </g>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#a0aec0"/>
    </marker>
  </defs>

  <!-- results board -->
  <text x="24" y="184" font-size="14" font-weight="700" fill="#1a202c">Real run &#8212; per-task pass/fail board</text>
  <g font-size="12.5">
    <!-- rows: label + PASS chip -->
    <!-- column A -->
    <g>
      <rect x="24" y="196" width="416" height="34" rx="7" fill="#f7fafc" stroke="#e2e8f0"/>
      <text x="40" y="217" fill="#1a202c">rate-limit status &#8594; 429</text>
      <rect x="372" y="204" width="54" height="18" rx="9" fill="#48bb78"/><text x="399" y="217" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">PASS</text>

      <rect x="24" y="236" width="416" height="34" rx="7" fill="#f7fafc" stroke="#e2e8f0"/>
      <text x="40" y="257" fill="#1a202c">Pro plan cost &#8594; 25 / month</text>
      <rect x="372" y="244" width="54" height="18" rx="9" fill="#48bb78"/><text x="399" y="257" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">PASS</text>

      <rect x="24" y="276" width="416" height="34" rx="7" fill="#f7fafc" stroke="#e2e8f0"/>
      <text x="40" y="297" fill="#1a202c">change region? &#8594; no</text>
      <rect x="372" y="284" width="54" height="18" rx="9" fill="#48bb78"/><text x="399" y="297" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">PASS</text>

      <rect x="24" y="316" width="416" height="34" rx="7" fill="#f7fafc" stroke="#e2e8f0"/>
      <text x="40" y="337" fill="#1a202c">Scale backups &#8594; 90 days</text>
      <rect x="372" y="324" width="54" height="18" rx="9" fill="#48bb78"/><text x="399" y="337" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">PASS</text>
    </g>
    <!-- column B -->
    <g>
      <rect x="460" y="196" width="416" height="34" rx="7" fill="#f7fafc" stroke="#e2e8f0"/>
      <text x="476" y="217" fill="#1a202c">SDK env var &#8594; MERIDIAN_API_KEY</text>
      <rect x="808" y="204" width="54" height="18" rx="9" fill="#48bb78"/><text x="835" y="217" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">PASS</text>

      <rect x="460" y="236" width="416" height="34" rx="7" fill="#f7fafc" stroke="#e2e8f0"/>
      <text x="476" y="257" fill="#1a202c">401 meaning &#8594; invalid key</text>
      <rect x="808" y="244" width="54" height="18" rx="9" fill="#48bb78"/><text x="835" y="257" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">PASS</text>

      <rect x="460" y="276" width="416" height="34" rx="7" fill="#f7fafc" stroke="#e2e8f0"/>
      <text x="476" y="297" fill="#1a202c">delete grace &#8594; 24 hours</text>
      <rect x="808" y="284" width="54" height="18" rx="9" fill="#48bb78"/><text x="835" y="297" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">PASS</text>

      <rect x="460" y="316" width="416" height="34" rx="7" fill="#f7fafc" stroke="#e2e8f0"/>
      <text x="476" y="337" fill="#1a202c">MongoDB pipelines? &#8594; refuse</text>
      <rect x="808" y="324" width="54" height="18" rx="9" fill="#48bb78"/><text x="835" y="337" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">PASS</text>
    </g>
  </g>

  <!-- regression strip -->
  <text x="24" y="392" font-size="14" font-weight="700" fill="#1a202c">Does the metric actually catch failure? Inject a broken retriever &#8212; same agent code</text>

  <!-- good bar -->
  <text x="24" y="430" font-size="12.5" fill="#4a5568">good retriever</text>
  <rect x="150" y="418" width="620" height="22" rx="6" fill="#f0fff4" stroke="#276749"/>
  <rect x="150" y="418" width="620" height="22" rx="6" fill="#48bb78"/>
  <text x="784" y="435" font-size="13" font-weight="700" fill="#276749">8 / 8</text>

  <!-- broken bar -->
  <text x="24" y="470" font-size="12.5" fill="#4a5568">broken retriever</text>
  <rect x="150" y="458" width="620" height="22" rx="6" fill="#fff5f5" stroke="#c53030"/>
  <rect x="150" y="458" width="77.5" height="22" rx="6" fill="#fc8181"/>
  <text x="784" y="475" font-size="13" font-weight="700" fill="#c53030">1 / 8</text>

  <text x="24" y="512" font-size="12.5" fill="#718096">Outcome metrics flag the regression instantly: the answers stop containing the reference facts, so 7 of 8 tasks flip to FAIL.</text>
  <text x="24" y="532" font-size="11.5" fill="#a0aec0">Live agent runs are non-deterministic; the exact broken-run count varies (roughly 1&#8211;3 of 8) but always collapses far below the 8/8 baseline.</text>
</svg>
