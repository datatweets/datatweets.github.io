<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="titleid descid">
  <title id="titleid">Three-level agent scorecard for the agentic Docent</title>
  <desc id="descid">A pipeline across the top runs eight Docent tasks live, collecting a final answer and a recorded tool-call trajectory for each, then scores them at three levels below: outcome, tool calls, and trajectory.</desc>
  <rect width="900" height="560" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a202c">Evaluating the Agentic Docent at Three Levels</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#718096">8 tasks &#183; run live &#183; deterministic scoring over the collected trajectories</text>

  <!-- pipeline row -->
  <g>
    <rect x="40" y="78" width="180" height="60" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5"/>
    <text x="130" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">Task set</text>
    <text x="130" y="122" text-anchor="middle" font-size="11" fill="#4a5568">7 factual + 1 refusal</text>

    <rect x="260" y="78" width="180" height="60" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5"/>
    <text x="350" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">Run agent live</text>
    <text x="350" y="122" text-anchor="middle" font-size="11" fill="#4a5568">search_docs loop</text>

    <rect x="480" y="78" width="380" height="60" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/>
    <text x="670" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">Collect per task</text>
    <text x="670" y="122" text-anchor="middle" font-size="11" fill="#4a5568">final answer  +  trajectory (tool calls, result ids)</text>

    <path d="M 220 108 L 258 108" stroke="#a0aec0" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M 440 108 L 478 108" stroke="#a0aec0" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#a0aec0"/>
    </marker>
  </defs>

  <!-- three scoring lanes -->
  <!-- Level 1: outcome -->
  <g>
    <rect x="40" y="176" width="260" height="330" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
    <rect x="40" y="176" width="260" height="46" rx="10" fill="#48bb78"/>
    <rect x="40" y="206" width="260" height="16" fill="#48bb78"/>
    <text x="170" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Level 1 &#183; Outcome</text>
    <text x="170" y="252" text-anchor="middle" font-size="12" fill="#276749">Did each task actually succeed?</text>
    <text x="170" y="272" text-anchor="middle" font-size="11" fill="#4a5568">verifier over the final answer</text>

    <text x="170" y="330" text-anchor="middle" font-size="44" font-weight="800" fill="#276749">1.00</text>
    <text x="170" y="354" text-anchor="middle" font-size="12" fill="#4a5568">task success rate  (8 / 8)</text>

    <line x1="66" y1="378" x2="274" y2="378" stroke="#c6f6d5" stroke-width="1.5"/>
    <text x="66" y="404" font-size="11" fill="#276749">&#10003; all 7 facts answered</text>
    <text x="66" y="426" font-size="11" fill="#276749">&#10003; out-of-scope correctly refused</text>
    <text x="66" y="448" font-size="11" fill="#276749">&#10003; Free-plan query self-rescued</text>
    <text x="66" y="470" font-size="11" fill="#718096">outcome alone hides the path</text>
  </g>

  <!-- Level 2: tool calls -->
  <g>
    <rect x="320" y="176" width="260" height="330" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
    <rect x="320" y="176" width="260" height="46" rx="10" fill="#4299e1"/>
    <rect x="320" y="206" width="260" height="16" fill="#4299e1"/>
    <text x="450" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Level 2 &#183; Tool calls</text>
    <text x="450" y="252" text-anchor="middle" font-size="12" fill="#2b6cb0">Right tool, valid args?</text>
    <text x="450" y="272" text-anchor="middle" font-size="11" fill="#4a5568">called_search &#183; args_valid &#183; query</text>

    <text x="450" y="330" text-anchor="middle" font-size="44" font-weight="800" fill="#2b6cb0">1.00</text>
    <text x="450" y="354" text-anchor="middle" font-size="12" fill="#4a5568">mean tool-call correctness</text>

    <line x1="346" y1="378" x2="554" y2="378" stroke="#bee3f8" stroke-width="1.5"/>
    <text x="346" y="404" font-size="11" fill="#2b6cb0">&#10003; called search_docs every task</text>
    <text x="346" y="426" font-size="11" fill="#2b6cb0">&#10003; every query a valid string</text>
    <text x="346" y="448" font-size="11" fill="#2b6cb0">&#10003; queries overlap the question</text>
    <text x="346" y="470" font-size="11" fill="#718096">valid calls, still no path check</text>
  </g>

  <!-- Level 3: trajectory -->
  <g>
    <rect x="600" y="176" width="260" height="330" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="2"/>
    <rect x="600" y="176" width="260" height="46" rx="10" fill="#ed8936"/>
    <rect x="600" y="206" width="260" height="16" fill="#ed8936"/>
    <text x="730" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Level 3 &#183; Trajectory</text>
    <text x="730" y="252" text-anchor="middle" font-size="12" fill="#c05621">Was the path efficient?</text>
    <text x="730" y="272" text-anchor="middle" font-size="11" fill="#4a5568">num_calls &#183; redundancy &#183; matches ref</text>

    <text x="730" y="330" text-anchor="middle" font-size="44" font-weight="800" fill="#c05621">0.75</text>
    <text x="730" y="354" text-anchor="middle" font-size="12" fill="#4a5568">trajectory quality (6 / 8)</text>

    <line x1="626" y1="378" x2="834" y2="378" stroke="#feebc8" stroke-width="1.5"/>
    <text x="626" y="404" font-size="11" fill="#c05621">&#9888; region: 2 searches (wandered)</text>
    <text x="626" y="426" font-size="11" fill="#c53030">&#9888; refusal probe: 3 searches</text>
    <text x="626" y="448" font-size="11" fill="#276749">&#10003; 6 tasks took the reference path</text>
    <text x="626" y="470" font-size="11" fill="#718096">right answers, poorer paths</text>
  </g>

  <!-- footer takeaway -->
  <rect x="40" y="522" width="820" height="26" rx="6" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5"/>
  <text x="450" y="540" text-anchor="middle" font-size="12.5" fill="#6b46c1">Same tasks pass Levels 1 and 2 yet lose points at Level 3 &#8212; you need all three, because a correct answer can still hide a wasteful path.</text>
</svg>
