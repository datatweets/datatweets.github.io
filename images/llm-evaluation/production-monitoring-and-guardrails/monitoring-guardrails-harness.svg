<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>The Docent production-readiness harness: input and output guardrails wrapping the assistant, three monitoring subsystems (rolling alerts, a CI regression gate, and a feedback loop), all feeding one production-readiness report with a ship or hold verdict.</title>
  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Docent Production-Readiness Harness</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#718096">Guardrails + monitoring + CI gate + feedback loop, assembled around one assistant</text>

  <!-- Row 1: guarded request path -->
  <rect x="30" y="82" width="840" height="112" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5"/>
  <text x="50" y="104" font-size="13" font-weight="700" fill="#6b46c1">Stage 1 &#183; Guardrail-wrapped Docent</text>

  <!-- request -->
  <rect x="50" y="118" width="96" height="52" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="98" y="140" text-anchor="middle" font-size="12" fill="#4a5568">user</text>
  <text x="98" y="157" text-anchor="middle" font-size="12" fill="#4a5568">question</text>

  <!-- input guardrail -->
  <rect x="176" y="118" width="118" height="52" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5"/>
  <text x="235" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">input guard</text>
  <text x="235" y="156" text-anchor="middle" font-size="10.5" fill="#c05621">injection / off-topic</text>

  <!-- Docent -->
  <rect x="324" y="112" width="150" height="64" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="399" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">Docent</text>
  <text x="399" y="156" text-anchor="middle" font-size="11" fill="#2b6cb0">claude-haiku-4-5</text>

  <!-- output guardrail -->
  <rect x="504" y="118" width="118" height="52" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5"/>
  <text x="563" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">output guard</text>
  <text x="563" y="156" text-anchor="middle" font-size="10.5" fill="#c05621">format / grounding</text>

  <!-- served answer -->
  <rect x="652" y="118" width="100" height="52" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5"/>
  <text x="702" y="140" text-anchor="middle" font-size="12" fill="#276749">served</text>
  <text x="702" y="157" text-anchor="middle" font-size="12" fill="#276749">answer</text>

  <!-- blocked -->
  <rect x="770" y="118" width="86" height="52" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
  <text x="813" y="140" text-anchor="middle" font-size="12" fill="#c53030">blocked</text>
  <text x="813" y="157" text-anchor="middle" font-size="11" fill="#c53030">&#8594; refuse</text>

  <!-- arrows row 1 -->
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a5568"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c53030"/>
    </marker>
  </defs>
  <line x1="146" y1="144" x2="172" y2="144" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="294" y1="144" x2="320" y2="144" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="474" y1="144" x2="500" y2="144" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="622" y1="144" x2="648" y2="144" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="235" y1="170" x2="235" y2="184" stroke="#c53030" stroke-width="1.5"/>
  <line x1="235" y1="184" x2="805" y2="184" stroke="#c53030" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="563" y1="170" x2="563" y2="180" stroke="#c53030" stroke-width="1.5"/>
  <line x1="563" y1="180" x2="805" y2="180" stroke="#c53030" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="805" y1="184" x2="805" y2="172" stroke="#c53030" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Row 2: three monitoring subsystems -->
  <!-- Stage 2: monitoring + alerts -->
  <rect x="30" y="214" width="270" height="150" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5"/>
  <text x="48" y="236" font-size="13" font-weight="700" fill="#c05621">Stage 2 &#183; Monitoring + Alerts</text>
  <text x="48" y="255" font-size="11" fill="#718096">rolling window over a live metric stream</text>
  <polyline points="48,330 72,326 96,322 120,328 144,300 168,270 192,285 216,322 240,326 264,330"
            fill="none" stroke="#4299e1" stroke-width="2"/>
  <line x1="48" y1="308" x2="282" y2="308" stroke="#a0aec0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="286" y="311" font-size="9.5" fill="#a0aec0" text-anchor="end"> </text>
  <circle cx="168" cy="270" r="4" fill="#c53030"/>
  <text x="176" y="264" font-size="10.5" fill="#c53030">incident</text>
  <rect x="48" y="340" width="234" height="18" rx="4" fill="#fff5f5" stroke="#fc8181" stroke-width="1"/>
  <text x="56" y="353" font-size="10.5" fill="#c53030">ALERT OPEN &#8594; RESOLVED on rollback</text>

  <!-- Stage 3: CI regression gate -->
  <rect x="315" y="214" width="270" height="150" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="333" y="236" font-size="13" font-weight="700" fill="#2b6cb0">Stage 3 &#183; CI Regression Gate</text>
  <text x="333" y="255" font-size="11" fill="#718096">pytest-style suite on every build</text>
  <rect x="333" y="268" width="234" height="34" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5"/>
  <text x="345" y="289" font-size="11.5" fill="#276749">good build &#8594; 5/5 pass</text>
  <text x="559" y="289" font-size="11.5" font-weight="700" fill="#276749" text-anchor="end">PASS</text>
  <rect x="333" y="308" width="234" height="34" rx="6" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
  <text x="345" y="329" font-size="11.5" fill="#c53030">regressed &#8594; 1 critical fail</text>
  <text x="559" y="329" font-size="11.5" font-weight="700" fill="#c53030" text-anchor="end">FAIL</text>

  <!-- Stage 4: feedback loop -->
  <rect x="600" y="214" width="270" height="150" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5"/>
  <text x="618" y="236" font-size="13" font-weight="700" fill="#276749">Stage 4 &#183; Feedback Loop</text>
  <text x="618" y="255" font-size="11" fill="#718096">human thumbs &#8594; golden backlog</text>
  <text x="640" y="292" font-size="24" fill="#276749">&#128077;</text>
  <text x="665" y="292" font-size="14" fill="#276749">&#215; 8</text>
  <text x="740" y="292" font-size="24" fill="#c53030">&#128078;</text>
  <text x="765" y="292" font-size="14" fill="#c53030">&#215; 3</text>
  <line x1="700" y1="308" x2="700" y2="326" stroke="#276749" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="618" y="330" width="234" height="24" rx="5" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5"/>
  <text x="735" y="346" text-anchor="middle" font-size="11" fill="#6b46c1">2 down-votes promoted to golden set</text>

  <!-- arrows into report -->
  <line x1="165" y1="364" x2="360" y2="440" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="450" y1="364" x2="450" y2="440" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="735" y1="364" x2="540" y2="440" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="235" y1="194" x2="235" y2="206" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Report -->
  <rect x="210" y="444" width="480" height="164" rx="12" fill="#1a202c"/>
  <text x="450" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">PRODUCTION READINESS REPORT</text>
  <line x1="234" y1="482" x2="666" y2="482" stroke="#4a5568" stroke-width="1"/>
  <text x="240" y="506" font-size="12.5" fill="#e2e8f0">guardrail block rate</text>
  <text x="660" y="506" text-anchor="end" font-size="12.5" font-weight="700" fill="#f7fafc">0.60</text>
  <text x="240" y="528" font-size="12.5" fill="#e2e8f0">alert status</text>
  <text x="660" y="528" text-anchor="end" font-size="12.5" font-weight="700" fill="#48bb78">HEALTHY</text>
  <text x="240" y="550" font-size="12.5" fill="#e2e8f0">CI gate</text>
  <text x="660" y="550" text-anchor="end" font-size="12.5" font-weight="700" fill="#48bb78">PASS</text>
  <text x="240" y="572" font-size="12.5" fill="#e2e8f0">feedback backlog</text>
  <text x="660" y="572" text-anchor="end" font-size="12.5" font-weight="700" fill="#f7fafc">2</text>
  <rect x="234" y="582" width="432" height="20" rx="5" fill="#276749"/>
  <text x="450" y="597" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">VERDICT &#8594; READY TO SHIP</text>
</svg>
