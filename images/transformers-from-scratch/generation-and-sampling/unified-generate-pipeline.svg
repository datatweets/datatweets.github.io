<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">One generate() function, four decoding knobs</text>
  <text x="430" y="56" text-anchor="middle" font-size="13" fill="#718096">The last row of logits flows through optional filters, then a single sample or argmax step</text>

  <!-- pipeline row -->
  <!-- logits -->
  <rect x="24" y="90" width="128" height="66" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="88" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">logits</text>
  <text x="88" y="138" text-anchor="middle" font-size="12" fill="#4a5568">(vocab,) last pos</text>

  <!-- temperature -->
  <rect x="184" y="90" width="128" height="66" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="1.5"/>
  <text x="248" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">temperature</text>
  <text x="248" y="134" text-anchor="middle" font-size="12" fill="#4a5568">row / T</text>
  <text x="248" y="150" text-anchor="middle" font-size="11" fill="#a0aec0">skipped if greedy</text>

  <!-- top-k -->
  <rect x="344" y="90" width="128" height="66" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
  <text x="408" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">top-k filter</text>
  <text x="408" y="134" text-anchor="middle" font-size="12" fill="#4a5568">keep k best</text>
  <text x="408" y="150" text-anchor="middle" font-size="11" fill="#a0aec0">optional</text>

  <!-- top-p -->
  <rect x="504" y="90" width="128" height="66" rx="8" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="568" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">top-p filter</text>
  <text x="568" y="134" text-anchor="middle" font-size="12" fill="#4a5568">nucleus mass p</text>
  <text x="568" y="150" text-anchor="middle" font-size="11" fill="#a0aec0">optional</text>

  <!-- sample -->
  <rect x="664" y="90" width="128" height="66" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="728" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#c53030">renorm + pick</text>
  <text x="728" y="134" text-anchor="middle" font-size="12" fill="#4a5568">softmax, sample</text>
  <text x="728" y="150" text-anchor="middle" font-size="11" fill="#a0aec0">argmax if greedy</text>

  <!-- arrows between stages -->
  <g fill="#4a5568">
    <path d="M152 123 L182 123" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
    <path d="M312 123 L342 123" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
    <path d="M472 123 L502 123" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
    <path d="M632 123 L662 123" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
  </g>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- greedy bypass arrow -->
  <path d="M88 90 C 88 62, 728 62, 728 88" fill="none" stroke="#a0aec0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="408" y="58" text-anchor="middle" font-size="11" fill="#718096">greedy=True bypasses every filter and takes argmax</text>

  <!-- append note -->
  <text x="728" y="182" text-anchor="middle" font-size="11" fill="#718096">append id, slide the</text>
  <text x="728" y="196" text-anchor="middle" font-size="11" fill="#718096">block_size window, repeat</text>

  <!-- lower panel: same prompt under different settings -->
  <text x="430" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Same prompt "the ", four settings (real trained mini-GPT, loss &#8776; 0.13)</text>

  <g font-size="12.5">
    <!-- greedy -->
    <rect x="40" y="266" width="780" height="42" rx="6" fill="#f7fafc" stroke="#e2e8f0"/>
    <text x="52" y="284" font-size="12" font-weight="700" fill="#2b6cb0">greedy</text>
    <text x="52" y="301" font-family="monospace" font-size="11.5" fill="#1a202c">the boats and writes the count in a book. the lantern burns all night and rests at d</text>

    <!-- temp 0.8 -->
    <rect x="40" y="314" width="780" height="42" rx="6" fill="#f7fafc" stroke="#e2e8f0"/>
    <text x="52" y="332" font-size="12" font-weight="700" fill="#c05621">T=0.8</text>
    <text x="52" y="349" font-family="monospace" font-size="11.5" fill="#1a202c">the lantern burns all night and rests at dawn. the lamp keeper walks the shore at du</text>

    <!-- top_k 5 -->
    <rect x="40" y="362" width="780" height="42" rx="6" fill="#f7fafc" stroke="#e2e8f0"/>
    <text x="52" y="380" font-size="12" font-weight="700" fill="#276749">top_k=5</text>
    <text x="52" y="397" font-family="monospace" font-size="11.5" fill="#1a202c">the lantern burns all night and rests at dawn. the lamp keeper walks the shore at du</text>

    <!-- temp 1.5 -->
    <rect x="40" y="410" width="780" height="42" rx="6" fill="#fff5f5" stroke="#fc8181"/>
    <text x="52" y="428" font-size="12" font-weight="700" fill="#c53030">T=1.5</text>
    <text x="52" y="445" font-family="monospace" font-size="11.5" fill="#1a202c">the rockse at dawn. the keeper rings the bell when a boat drifts near the rocks at d</text>
  </g>

  <text x="430" y="478" text-anchor="middle" font-size="12" fill="#718096">On this low-entropy corpus a confident model makes moderate filters (T=0.8, top_k=5) read alike;</text>
  <text x="430" y="496" text-anchor="middle" font-size="12" fill="#718096">only high temperature (T=1.5) loosens it enough to slip, e.g. "rockse".</text>
</svg>
