<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Top-p keeps the smallest set whose cumulative probability &#8805; p (here p = 0.9)</text>

  <!-- ============ LEFT: peaked distribution ============ -->
  <text x="200" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#2b6cb0">Peaked (confident) next-token</text>
  <text x="200" y="80" text-anchor="middle" font-size="12" fill="#4a5568">model is sure &#8594; nucleus keeps 1 token</text>

  <!-- baseline -->
  <line x1="60" y1="300" x2="360" y2="300" stroke="#4a5568" stroke-width="1.5"/>

  <!-- bars: one tall (in nucleus), rest tiny (dropped) -->
  <!-- kept bar -->
  <rect x="70" y="110" width="40" height="190" fill="#48bb78"/>
  <text x="90" y="316" text-anchor="middle" font-size="12" fill="#276749" font-weight="700">'h'</text>
  <text x="90" y="102" text-anchor="middle" font-size="11" fill="#276749">1.00</text>
  <!-- dropped bars -->
  <rect x="130" y="294" width="40" height="6" fill="#e2e8f0"/>
  <text x="150" y="316" text-anchor="middle" font-size="12" fill="#a0aec0">'i'</text>
  <rect x="190" y="296" width="40" height="4" fill="#e2e8f0"/>
  <text x="210" y="316" text-anchor="middle" font-size="12" fill="#a0aec0">'s'</text>
  <rect x="250" y="297" width="40" height="3" fill="#e2e8f0"/>
  <text x="270" y="316" text-anchor="middle" font-size="12" fill="#a0aec0">'e'</text>
  <rect x="310" y="298" width="40" height="2" fill="#e2e8f0"/>
  <text x="330" y="316" text-anchor="middle" font-size="12" fill="#a0aec0">...</text>

  <!-- nucleus bracket -->
  <path d="M 68 340 L 68 352 L 112 352 L 112 340" fill="none" stroke="#276749" stroke-width="2"/>
  <text x="90" y="372" text-anchor="middle" font-size="12" fill="#276749" font-weight="700">nucleus = 1</text>
  <text x="240" y="372" text-anchor="middle" font-size="12" fill="#a0aec0">everything else dropped</text>

  <!-- ============ RIGHT: flat distribution ============ -->
  <text x="560" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#c05621">Flat (uncertain) next-token</text>
  <text x="560" y="80" text-anchor="middle" font-size="12" fill="#4a5568">many good options &#8594; nucleus keeps 4</text>

  <line x1="420" y1="300" x2="720" y2="300" stroke="#4a5568" stroke-width="1.5"/>

  <!-- kept bars (4): l .292 f .282 w .238 r .141  cum .954 crosses 0.9 -->
  <rect x="430" y="153" width="34" height="147" fill="#ed8936"/>
  <text x="447" y="316" text-anchor="middle" font-size="12" fill="#c05621" font-weight="700">'l'</text>
  <text x="447" y="145" text-anchor="middle" font-size="10" fill="#c05621">.292</text>

  <rect x="474" y="158" width="34" height="142" fill="#ed8936"/>
  <text x="491" y="316" text-anchor="middle" font-size="12" fill="#c05621" font-weight="700">'f'</text>
  <text x="491" y="150" text-anchor="middle" font-size="10" fill="#c05621">.282</text>

  <rect x="518" y="180" width="34" height="120" fill="#ed8936"/>
  <text x="535" y="316" text-anchor="middle" font-size="12" fill="#c05621" font-weight="700">'w'</text>
  <text x="535" y="172" text-anchor="middle" font-size="10" fill="#c05621">.238</text>

  <rect x="562" y="229" width="34" height="71" fill="#ed8936"/>
  <text x="579" y="316" text-anchor="middle" font-size="12" fill="#c05621" font-weight="700">'r'</text>
  <text x="579" y="221" text-anchor="middle" font-size="10" fill="#c05621">.141</text>

  <!-- dropped bars -->
  <rect x="606" y="290" width="34" height="10" fill="#e2e8f0"/>
  <text x="623" y="316" text-anchor="middle" font-size="12" fill="#a0aec0">'y'</text>
  <rect x="650" y="293" width="34" height="7" fill="#e2e8f0"/>
  <text x="667" y="316" text-anchor="middle" font-size="12" fill="#a0aec0">'s'</text>
  <rect x="694" y="295" width="20" height="5" fill="#e2e8f0"/>
  <text x="704" y="316" text-anchor="middle" font-size="12" fill="#a0aec0">...</text>

  <!-- nucleus bracket -->
  <path d="M 428 340 L 428 352 L 600 352 L 600 340" fill="none" stroke="#c05621" stroke-width="2"/>
  <text x="514" y="372" text-anchor="middle" font-size="12" fill="#c05621" font-weight="700">nucleus = 4  (cum .954 &#8805; 0.9)</text>

  <!-- bottom takeaway -->
  <rect x="60" y="396" width="640" height="34" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1"/>
  <text x="380" y="418" text-anchor="middle" font-size="13" fill="#2b6cb0">Same p, same code &#8212; the count adapts to the distribution's shape (fixed top-k cannot do this).</text>
</svg>
