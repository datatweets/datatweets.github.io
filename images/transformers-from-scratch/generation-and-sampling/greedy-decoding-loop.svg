<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="The autoregressive greedy decoding loop: take the last block_size tokens as context, run a forward pass to get logits, take the argmax as the next token, append it, and repeat. Because argmax is deterministic, the same prompt always yields the same output, which on a small corpus makes the text repeat.">
  <rect x="0" y="0" width="860" height="470" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">The Greedy Decoding Loop</text>
  <text x="430" y="56" text-anchor="middle" font-size="13" fill="#4a5568">one deterministic step, repeated: context &#8594; logits &#8594; argmax &#8594; append</text>

  <!-- Step 1: context -->
  <rect x="40" y="90" width="180" height="92" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="130" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">1. Context</text>
  <text x="130" y="138" text-anchor="middle" font-size="12" fill="#4a5568">last block_size tokens</text>
  <text x="130" y="158" text-anchor="middle" font-size="12" fill="#1a202c" font-family="monospace">idx[-32:]</text>
  <text x="130" y="174" text-anchor="middle" font-size="11" fill="#718096">shape (1, T)</text>

  <!-- Step 2: forward -> logits -->
  <rect x="270" y="90" width="180" height="92" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/>
  <text x="360" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">2. Forward pass</text>
  <text x="360" y="138" text-anchor="middle" font-size="12" fill="#4a5568">MiniGPT &#8594; logits</text>
  <text x="360" y="158" text-anchor="middle" font-size="12" fill="#1a202c" font-family="monospace">logits[0, -1]</text>
  <text x="360" y="174" text-anchor="middle" font-size="11" fill="#718096">shape (vocab_size,)</text>

  <!-- Step 3: argmax -->
  <rect x="500" y="90" width="180" height="92" rx="10" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
  <text x="590" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">3. argmax</text>
  <text x="590" y="138" text-anchor="middle" font-size="12" fill="#4a5568">single most likely id</text>
  <text x="590" y="158" text-anchor="middle" font-size="12" fill="#1a202c" font-family="monospace">next_id</text>
  <text x="590" y="174" text-anchor="middle" font-size="11" fill="#718096">no randomness</text>

  <!-- Step 4: append -->
  <rect x="710" y="90" width="110" height="92" rx="10" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
  <text x="765" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">4. Append</text>
  <text x="765" y="138" text-anchor="middle" font-size="12" fill="#4a5568">ids.append</text>
  <text x="765" y="158" text-anchor="middle" font-size="12" fill="#1a202c" font-family="monospace">(next_id)</text>

  <!-- arrows across -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a5568"/>
    </marker>
    <marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2b6cb0"/>
    </marker>
  </defs>
  <line x1="220" y1="136" x2="268" y2="136" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="450" y1="136" x2="498" y2="136" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="680" y1="136" x2="708" y2="136" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>

  <!-- feedback loop arrow back to context -->
  <path d="M765 182 L765 250 L130 250 L130 184" fill="none" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ahb)"/>
  <text x="447" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">feed the new token back in and repeat n_new times</text>

  <!-- consequences box -->
  <rect x="40" y="292" width="780" height="150" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
  <text x="60" y="318" font-size="14" font-weight="700" fill="#c53030">Why greedy falls short</text>
  <text x="60" y="344" font-size="12.5" fill="#4a5568"><tspan font-weight="700" fill="#1a202c">Deterministic:</tspan> argmax has no randomness, so one prompt gives exactly ONE completion &#8212; run it twice, get identical text.</text>
  <text x="60" y="368" font-size="12.5" fill="#4a5568"><tspan font-weight="700" fill="#1a202c">Repetitive:</tspan> the locally-most-likely token is not globally best; the model can enter a high-probability cycle and loop.</text>
  <text x="60" y="392" font-size="12.5" fill="#4a5568"><tspan font-weight="700" fill="#1a202c">Parroting:</tspan> on a small corpus greedy walks the training text verbatim and then cycles the whole passage again.</text>
  <text x="60" y="422" font-size="12.5" fill="#4a5568"><tspan font-weight="700" fill="#276749">Next lesson:</tspan> temperature sampling adds controlled randomness so the same prompt can produce many different, less repetitive completions.</text>
</svg>
