<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="860" height="560" fill="#ffffff"/>

  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Token Embeddings: lookup forward, scatter-add backward</text>

  <!-- ===================== FORWARD (top) ===================== -->
  <text x="40" y="70" font-size="14" font-weight="700" fill="#2b6cb0">FORWARD &#8212; index rows of E</text>

  <!-- token ids strip -->
  <text x="40" y="104" font-size="13" fill="#4a5568">ids (1, T=9)</text>
  <g font-size="13" fill="#1a202c" text-anchor="middle">
    <rect x="40"  y="112" width="34" height="30" rx="4" fill="#ebf8ff" stroke="#4299e1"/>
    <text x="57"  y="132">19</text>
    <rect x="76"  y="112" width="34" height="30" rx="4" fill="#ebf8ff" stroke="#4299e1"/>
    <text x="93"  y="132">9</text>
    <rect x="112" y="112" width="34" height="30" rx="4" fill="#ebf8ff" stroke="#4299e1"/>
    <text x="129" y="132">6</text>
    <rect x="148" y="112" width="34" height="30" rx="4" fill="#ebf8ff" stroke="#4299e1"/>
    <text x="165" y="132">0</text>
    <rect x="184" y="112" width="34" height="30" rx="4" fill="#ebf8ff" stroke="#4299e1"/>
    <text x="201" y="132">3</text>
    <rect x="220" y="112" width="34" height="30" rx="4" fill="#ebf8ff" stroke="#4299e1"/>
    <text x="237" y="132">15</text>
    <rect x="256" y="112" width="34" height="30" rx="4" fill="#ebf8ff" stroke="#4299e1"/>
    <text x="273" y="132">2</text>
    <rect x="292" y="112" width="34" height="30" rx="4" fill="#fffaf0" stroke="#ed8936" stroke-width="2"/>
    <text x="309" y="132">19</text>
    <rect x="328" y="112" width="34" height="30" rx="4" fill="#ebf8ff" stroke="#4299e1"/>
    <text x="345" y="132">18</text>
  </g>
  <g font-size="11" fill="#718096" text-anchor="middle">
    <text x="57"  y="158">t</text>
    <text x="93"  y="158">h</text>
    <text x="129" y="158">e</text>
    <text x="165" y="158">_</text>
    <text x="201" y="158">b</text>
    <text x="237" y="158">o</text>
    <text x="273" y="158">a</text>
    <text x="309" y="158">t</text>
    <text x="345" y="158">s</text>
  </g>

  <!-- Embedding table E -->
  <text x="600" y="70" font-size="13" fill="#4a5568">E : embedding table (vocab_size=24, C=8)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="560" y="82" width="230" height="26" rx="3" fill="#f7fafc" stroke="#a0aec0"/>
    <text x="590" y="100" fill="#4a5568">row 0</text><text x="700" y="100" fill="#718096">[ . . . ]</text>
    <rect x="560" y="108" width="230" height="26" rx="3" fill="#f0fff4" stroke="#48bb78"/>
    <text x="590" y="126" fill="#276749">row 2</text><text x="700" y="126" fill="#718096">[ . . . ]</text>
    <rect x="560" y="134" width="230" height="26" rx="3" fill="#f7fafc" stroke="#a0aec0"/>
    <text x="590" y="152" fill="#4a5568">row 6</text><text x="700" y="152" fill="#718096">[ . . . ]</text>
    <rect x="560" y="160" width="230" height="26" rx="3" fill="#fffaf0" stroke="#ed8936" stroke-width="2"/>
    <text x="590" y="178" fill="#c05621" font-weight="700">row 19</text><text x="700" y="178" fill="#c05621" font-weight="700">[ . . . ] &#8592; 't'</text>
    <rect x="560" y="186" width="230" height="26" rx="3" fill="#f7fafc" stroke="#a0aec0"/>
    <text x="590" y="204" fill="#4a5568">row 23</text><text x="700" y="204" fill="#718096">[ . . . ]</text>
  </g>

  <!-- arrows ids -> E (the two 't' positions both point to row 19) -->
  <line x1="57"  y1="112" x2="560" y2="173" stroke="#ed8936" stroke-width="1.5" marker-end="url(#ar-o)"/>
  <line x1="309" y1="112" x2="560" y2="173" stroke="#ed8936" stroke-width="1.5" marker-end="url(#ar-o)"/>
  <text x="430" y="98" font-size="12" fill="#c05621">both 't' positions read row 19</text>

  <!-- output emb -->
  <text x="40" y="212" font-size="13" fill="#4a5568">emb = E[ids] &#8594; shape (1, 9, 8)</text>
  <rect x="40" y="222" width="322" height="30" rx="4" fill="#ebf8ff" stroke="#2b6cb0"/>
  <text x="201" y="242" text-anchor="middle" font-size="13" fill="#2b6cb0">one C-vector per token position (a plain row lookup, no matmul)</text>

  <!-- divider -->
  <line x1="40" y1="280" x2="820" y2="280" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===================== BACKWARD (bottom) ===================== -->
  <text x="40" y="312" font-size="14" font-weight="700" fill="#c05621">BACKWARD &#8212; scatter-add into E</text>

  <!-- upstream grads demb -->
  <text x="40" y="344" font-size="13" fill="#4a5568">demb (1, 9, 8): one upstream gradient per position</text>
  <g font-size="12" fill="#1a202c" text-anchor="middle">
    <rect x="40"  y="352" width="34" height="30" rx="4" fill="#fff5f5" stroke="#fc8181"/>
    <text x="57"  y="372">g0</text>
    <rect x="76"  y="352" width="34" height="30" rx="4" fill="#fff5f5" stroke="#fc8181"/>
    <text x="93"  y="372">g1</text>
    <rect x="112" y="352" width="34" height="30" rx="4" fill="#fff5f5" stroke="#fc8181"/>
    <text x="129" y="372">g2</text>
    <rect x="148" y="352" width="34" height="30" rx="4" fill="#fff5f5" stroke="#fc8181"/>
    <text x="165" y="372">g3</text>
    <rect x="184" y="352" width="34" height="30" rx="4" fill="#fff5f5" stroke="#fc8181"/>
    <text x="201" y="372">g4</text>
    <rect x="220" y="352" width="34" height="30" rx="4" fill="#fff5f5" stroke="#fc8181"/>
    <text x="237" y="372">g5</text>
    <rect x="256" y="352" width="34" height="30" rx="4" fill="#fff5f5" stroke="#fc8181"/>
    <text x="273" y="372">g6</text>
    <rect x="292" y="352" width="34" height="30" rx="4" fill="#fffaf0" stroke="#ed8936" stroke-width="2"/>
    <text x="309" y="372">g7</text>
    <rect x="328" y="352" width="34" height="30" rx="4" fill="#fff5f5" stroke="#fc8181"/>
    <text x="345" y="372">g8</text>
  </g>
  <g font-size="11" fill="#718096" text-anchor="middle">
    <text x="57"  y="398">t</text>
    <text x="309" y="398">t</text>
  </g>

  <!-- accumulation box for row 19 -->
  <rect x="470" y="336" width="330" height="120" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="2"/>
  <text x="635" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">np.add.at(dE, ids, demb)</text>
  <text x="635" y="390" text-anchor="middle" font-size="15" fill="#1a202c">dE[19] = g0 + g7</text>
  <text x="635" y="416" text-anchor="middle" font-size="12" fill="#4a5568">a shared row accumulates the gradient</text>
  <text x="635" y="434" text-anchor="middle" font-size="12" fill="#4a5568">from every position where 't' appeared</text>

  <!-- arrows g0 and g7 into the accumulation box -->
  <line x1="57"  y1="382" x2="470" y2="400" stroke="#ed8936" stroke-width="1.5" marker-end="url(#ar-o)"/>
  <line x1="309" y1="382" x2="470" y2="400" stroke="#ed8936" stroke-width="1.5" marker-end="url(#ar-o)"/>

  <!-- absent-token note -->
  <text x="40" y="440" font-size="12" fill="#718096">Tokens absent from ids receive exactly</text>
  <text x="40" y="458" font-size="12" fill="#718096">zero gradient (their rows stay 0).</text>

  <!-- caption bar -->
  <text x="430" y="512" text-anchor="middle" font-size="12" fill="#4a5568">Forward is a row lookup; backward is a scatter-add. dE has the same shape as E: (24, 8).</text>
  <text x="430" y="534" text-anchor="middle" font-size="12" fill="#4a5568">Gradient-checked in float64: max relative error &#8776; 4e-10.</text>

  <defs>
    <marker id="ar-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ed8936"/>
    </marker>
  </defs>
</svg>
