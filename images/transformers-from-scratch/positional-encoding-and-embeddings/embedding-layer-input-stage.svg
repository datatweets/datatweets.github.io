<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="860" height="460" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">EmbeddingLayer: the input stage of the GPT</text>

  <!-- token ids -->
  <rect x="30" y="70" width="150" height="90" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="105" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">idx (B, T)</text>
  <text x="105" y="114" text-anchor="middle" font-size="12" fill="#718096">integer token ids</text>
  <text x="105" y="136" text-anchor="middle" font-size="13" font-family="monospace" fill="#1a202c">[[19, 7, 4, ...]]</text>
  <text x="105" y="152" text-anchor="middle" font-size="11" fill="#718096">&quot;the lamp keeper&quot;</text>

  <!-- token table E -->
  <rect x="260" y="55" width="200" height="80" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="360" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">token table E</text>
  <text x="360" y="100" text-anchor="middle" font-size="12" fill="#4a5568">(vocab_size, C) = (24, C)</text>
  <text x="360" y="122" text-anchor="middle" font-size="13" font-family="monospace" fill="#1a202c">token_emb = E[idx]</text>

  <!-- position table P -->
  <rect x="260" y="150" width="200" height="80" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
  <text x="360" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">position table P (learned)</text>
  <text x="360" y="195" text-anchor="middle" font-size="12" fill="#4a5568">(block_size, C) = (32, C)</text>
  <text x="360" y="217" text-anchor="middle" font-size="13" font-family="monospace" fill="#1a202c">pos_emb = P[:T]</text>

  <!-- arrows into add -->
  <line x1="180" y1="115" x2="256" y2="95" stroke="#4a5568" stroke-width="1.5"/>
  <polygon points="256,95 246,93 249,102" fill="#4a5568"/>
  <line x1="460" y1="95" x2="560" y2="140" stroke="#2b6cb0" stroke-width="1.5"/>
  <polygon points="560,140 550,135 549,145" fill="#2b6cb0"/>
  <line x1="460" y1="190" x2="560" y2="150" stroke="#276749" stroke-width="1.5"/>
  <polygon points="560,150 549,148 550,158" fill="#276749"/>

  <!-- add node -->
  <circle cx="585" cy="145" r="24" fill="#fffaf0" stroke="#c05621" stroke-width="1.8"/>
  <text x="585" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#c05621">+</text>
  <text x="585" y="195" text-anchor="middle" font-size="11" fill="#718096">broadcast P[:T]</text>
  <text x="585" y="209" text-anchor="middle" font-size="11" fill="#718096">over the batch</text>

  <!-- output (B,T,C) -->
  <rect x="670" y="105" width="160" height="80" rx="8" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.8"/>
  <text x="750" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">out (B, T, C)</text>
  <text x="750" y="154" text-anchor="middle" font-size="12" fill="#4a5568">one vector per token</text>
  <text x="750" y="172" text-anchor="middle" font-size="12" fill="#4a5568">token + position</text>
  <line x1="609" y1="145" x2="666" y2="145" stroke="#6b46c1" stroke-width="1.8"/>
  <polygon points="666,145 656,140 656,150" fill="#6b46c1"/>

  <!-- feeds attention -->
  <rect x="600" y="250" width="230" height="60" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="715" y="275" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">self-attention (Modules 2&#8211;3)</text>
  <text x="715" y="295" text-anchor="middle" font-size="12" font-family="monospace" fill="#1a202c">consumes (B, T, C)</text>
  <line x1="750" y1="185" x2="730" y2="246" stroke="#c53030" stroke-width="1.5"/>
  <polygon points="730,246 725,236 735,238" fill="#c53030"/>

  <!-- backward panel -->
  <rect x="30" y="330" width="800" height="105" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.2"/>
  <text x="50" y="356" font-size="14" font-weight="700" fill="#1a202c">backward(dout): gradients (float64 check)</text>
  <text x="50" y="382" font-size="13" fill="#4a5568"><tspan font-family="monospace" fill="#2b6cb0">dE</tspan> = scatter-add dout over idx via np.add.at &#8594; shape (24, C), same as E</text>
  <text x="50" y="404" font-size="13" fill="#4a5568"><tspan font-family="monospace" fill="#276749">dP</tspan> = sum dout over the batch into rows [:T] &#8594; shape (32, C), same as P; rows T..end stay 0</text>
  <text x="50" y="426" font-size="13" fill="#4a5568">no <tspan font-family="monospace">dX</tspan> (ids are integers) &#183; max rel err dE &#8776; 2.5e-10, dP &#8776; 4.7e-11 (both &#8810; 1e-5)</text>
</svg>
