<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Dot-product score variance grows with d&#8342; &#8212; the scale flattens it</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#4a5568">Empirical variance of 100,000 random dot products (seed 42), before and after dividing by &#8730;d&#8342;</text>

  <!-- axes -->
  <line x1="90" y1="390" x2="712" y2="390" stroke="#4a5568" stroke-width="2"/>
  <line x1="90" y1="70" x2="90" y2="390" stroke="#4a5568" stroke-width="2"/>
  <text x="30" y="235" text-anchor="middle" font-size="13" fill="#4a5568" transform="rotate(-90 30 235)">variance</text>

  <!-- gridlines and y labels: v -> y = 390 - v*1.143 -->
  <line x1="90" y1="275.7" x2="712" y2="275.7" stroke="#e2e8f0" stroke-width="1"/>
  <text x="82" y="280" text-anchor="end" font-size="12" fill="#718096">100</text>
  <line x1="90" y1="161.4" x2="712" y2="161.4" stroke="#e2e8f0" stroke-width="1"/>
  <text x="82" y="166" text-anchor="end" font-size="12" fill="#718096">200</text>
  <text x="82" y="394" text-anchor="end" font-size="12" fill="#718096">0</text>

  <!-- reference line at variance = 1 (the scaled target) -->
  <line x1="90" y1="388.86" x2="712" y2="388.86" stroke="#276749" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="700" y="378" text-anchor="end" font-size="11" fill="#276749">variance &#8776; 1</text>

  <!-- Group d_k = 4  center 165 -->
  <rect x="127" y="385.4" width="34" height="4.6" fill="#4299e1" stroke="#2b6cb0" stroke-width="1"/>
  <rect x="169" y="388.9" width="34" height="1.1" fill="#48bb78" stroke="#276749" stroke-width="1"/>
  <text x="144" y="378" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2b6cb0">3.99</text>
  <text x="165" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">d&#8342; = 4</text>

  <!-- Group d_k = 16  center 320 -->
  <rect x="282" y="371.8" width="34" height="18.2" fill="#4299e1" stroke="#2b6cb0" stroke-width="1"/>
  <rect x="324" y="388.9" width="34" height="1.1" fill="#48bb78" stroke="#276749" stroke-width="1"/>
  <text x="299" y="364" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2b6cb0">15.89</text>
  <text x="320" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">d&#8342; = 16</text>

  <!-- Group d_k = 64  center 475 -->
  <rect x="437" y="316.6" width="34" height="73.4" fill="#4299e1" stroke="#2b6cb0" stroke-width="1"/>
  <rect x="479" y="388.9" width="34" height="1.1" fill="#48bb78" stroke="#276749" stroke-width="1"/>
  <text x="454" y="309" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2b6cb0">64.25</text>
  <text x="475" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">d&#8342; = 64</text>

  <!-- Group d_k = 256  center 630 -->
  <rect x="592" y="96.9" width="34" height="293.1" fill="#4299e1" stroke="#2b6cb0" stroke-width="1"/>
  <rect x="634" y="388.9" width="34" height="1.1" fill="#48bb78" stroke="#276749" stroke-width="1"/>
  <text x="609" y="89" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2b6cb0">256.39</text>
  <text x="630" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">d&#8342; = 256</text>

  <!-- legend -->
  <rect x="215" y="436" width="16" height="12" fill="#4299e1" stroke="#2b6cb0" stroke-width="1"/>
  <text x="237" y="446" font-size="12.5" fill="#4a5568">raw Q&#183;K (variance &#8776; d&#8342;)</text>
  <rect x="420" y="436" width="16" height="12" fill="#48bb78" stroke="#276749" stroke-width="1"/>
  <text x="442" y="446" font-size="12.5" fill="#4a5568">scaled Q&#183;K / &#8730;d&#8342; (variance &#8776; 1)</text>
</svg>
