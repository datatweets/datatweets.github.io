<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a202c">The SelfAttention class: one cache, one set of gradients</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#718096">forward(X) fills the cache &#8594; backward(dout) reads it and produces every gradient</text>

  <!-- Parameters box -->
  <rect x="40" y="80" width="200" height="110" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="2"/>
  <text x="140" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">parameters (C, hs)</text>
  <text x="140" y="130" text-anchor="middle" font-size="13" fill="#4a5568">Wq&#160;&#160;(C, hs)</text>
  <text x="140" y="150" text-anchor="middle" font-size="13" fill="#4a5568">Wk&#160;&#160;(C, hs)</text>
  <text x="140" y="170" text-anchor="middle" font-size="13" fill="#4a5568">Wv&#160;&#160;(C, hs)</text>

  <!-- forward -->
  <rect x="300" y="80" width="270" height="180" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="435" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#2b6cb0">forward(X)</text>
  <text x="435" y="128" text-anchor="middle" font-size="12.5" fill="#2c5282">Q, K, V = X&#183;Wq, X&#183;Wk, X&#183;Wv</text>
  <text x="435" y="148" text-anchor="middle" font-size="12.5" fill="#2c5282">scores = Q&#183;K&#7488; / &#8730;hs</text>
  <text x="435" y="168" text-anchor="middle" font-size="12.5" fill="#2c5282">A = softmax(scores)</text>
  <text x="435" y="188" text-anchor="middle" font-size="12.5" fill="#2c5282">out = A&#183;V</text>
  <rect x="316" y="204" width="238" height="44" rx="7" fill="#ffffff" stroke="#4299e1" stroke-width="1.5"/>
  <text x="435" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">cache = (X, Q, K, V, A)</text>
  <text x="435" y="240" text-anchor="middle" font-size="11" fill="#718096">everything backward needs</text>

  <!-- backward -->
  <rect x="630" y="80" width="230" height="180" rx="10" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
  <text x="745" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#c05621">backward(dout)</text>
  <text x="745" y="128" text-anchor="middle" font-size="12" fill="#7b341e">dA, dV &#8592; out = A&#183;V</text>
  <text x="745" y="147" text-anchor="middle" font-size="12" fill="#7b341e">dS &#8592; softmax backward</text>
  <text x="745" y="166" text-anchor="middle" font-size="12" fill="#7b341e">dQ, dK &#8592; scores / &#8730;hs</text>
  <text x="745" y="185" text-anchor="middle" font-size="12" fill="#7b341e">self.dWq, dWk, dWv</text>
  <text x="745" y="204" text-anchor="middle" font-size="12" fill="#7b341e">return dX&#160;&#160;(B, T, C)</text>

  <!-- arrows top row -->
  <line x1="240" y1="135" x2="298" y2="135" stroke="#4a5568" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="570" y1="170" x2="628" y2="170" stroke="#4a5568" stroke-width="2" marker-end="url(#ar)"/>
  <text x="600" y="162" text-anchor="middle" font-size="11" fill="#718096">cache</text>
  <!-- dout feeds backward from the right -->
  <line x1="745" y1="278" x2="745" y2="256" stroke="#c53030" stroke-width="2" marker-end="url(#arRed)"/>
  <text x="745" y="292" text-anchor="middle" font-size="11.5" fill="#c53030">dout (gradient from above)</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a5568"/></marker>
    <marker id="arRed" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c53030"/></marker>
  </defs>

  <!-- gradient check panel -->
  <rect x="40" y="330" width="390" height="190" rx="10" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
  <text x="235" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#276749">Gradient check (float64, central diff)</text>
  <text x="60" y="384" font-size="12.5" fill="#4a5568">max relative error, analytic vs numerical:</text>
  <text x="70" y="410" font-size="13" fill="#22543d">Wq&#160;&#160;1.1e-06</text>
  <text x="230" y="410" font-size="13" fill="#22543d">Wk&#160;&#160;1.4e-08</text>
  <text x="70" y="434" font-size="13" fill="#22543d">Wv&#160;&#160;1.3e-10</text>
  <text x="230" y="434" font-size="13" fill="#22543d">&#160;X&#160;&#160;5.8e-09</text>
  <rect x="60" y="452" width="350" height="46" rx="7" fill="#ffffff" stroke="#48bb78" stroke-width="1.5"/>
  <text x="235" y="472" text-anchor="middle" font-size="12.5" font-weight="700" fill="#276749">all &#8804; 1.1e-06&#160;&#160;&#8804;&#160;&#160;threshold 1e-5</text>
  <text x="235" y="490" text-anchor="middle" font-size="11.5" fill="#718096">backward matches the finite-difference truth</text>

  <!-- loss decreasing panel -->
  <rect x="470" y="330" width="390" height="190" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
  <text x="665" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#c53030">It learns: 10 gradient-descent steps</text>
  <!-- axes -->
  <line x1="510" y1="490" x2="830" y2="490" stroke="#a0aec0" stroke-width="1.5"/>
  <line x1="510" y1="375" x2="510" y2="490" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="500" y="380" text-anchor="end" font-size="10" fill="#718096">0.65</text>
  <text x="500" y="488" text-anchor="end" font-size="10" fill="#718096">0.48</text>
  <text x="670" y="508" text-anchor="middle" font-size="11" fill="#718096">step 0 &#8594; 9</text>
  <!-- loss curve: 0.647,0.608,0.577,0.553,0.534,0.519,0.507,0.497,0.490,0.484 mapped -->
  <!-- x: 510..830 over 9 steps => dx=35.6 ; y: 0.65->375, 0.48->490 -> y=375+(0.65-v)/(0.65-0.48)*115 -->
  <polyline points="510,375 545.6,401.4 581.1,422.4 616.7,438.6 652.2,451.4 687.8,461.6 723.3,469.7 758.9,476.2 794.4,481.4 830,485.5"
            fill="none" stroke="#c53030" stroke-width="2.5"/>
  <circle cx="510" cy="375" r="3.5" fill="#c53030"/>
  <circle cx="830" cy="485.5" r="3.5" fill="#c53030"/>
  <text x="520" y="368" font-size="11" fill="#c53030">0.647</text>
  <text x="805" y="480" text-anchor="end" font-size="11" fill="#c53030">0.484</text>

  <text x="450" y="544" text-anchor="middle" font-size="12" fill="#718096">One class, gradient-checked and shown to learn &#8212; the block stacked in Modules 3, 5, 6, and 7.</text>
</svg>
