<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Learned projections turn one input into query, key, and value</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#718096">Q = X W&#8474;, K = X W&#8342;, V = X W&#8341; &#8212; three learned weight matrices, three learned spaces</text>

  <!-- Input X -->
  <rect x="40" y="200" width="120" height="80" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="100" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#2b6cb0">X</text>
  <text x="100" y="256" text-anchor="middle" font-size="12" fill="#4a5568">input tokens</text>
  <text x="100" y="298" text-anchor="middle" font-size="12" fill="#718096">(1, 6, 64)</text>

  <!-- Projection weight labels -->
  <text x="228" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">W&#8474; (64, 16)</text>
  <text x="228" y="243" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">W&#8342; (64, 16)</text>
  <text x="228" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">W&#8341; (64, 16)</text>

  <!-- Arrows from X to Q, K, V -->
  <line x1="160" y1="220" x2="300" y2="150" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="160" y1="240" x2="300" y2="263" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="160" y1="260" x2="300" y2="376" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Q -->
  <rect x="305" y="120" width="110" height="66" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
  <text x="360" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#c05621">Q  query</text>
  <text x="360" y="170" text-anchor="middle" font-size="12" fill="#718096">(1, 6, 16)</text>

  <!-- K -->
  <rect x="305" y="233" width="110" height="66" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
  <text x="360" y="261" text-anchor="middle" font-size="16" font-weight="700" fill="#276749">K  key</text>
  <text x="360" y="283" text-anchor="middle" font-size="12" fill="#718096">(1, 6, 16)</text>

  <!-- V -->
  <rect x="305" y="346" width="110" height="66" rx="8" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/>
  <text x="360" y="374" text-anchor="middle" font-size="16" font-weight="700" fill="#6b46c1">V  value</text>
  <text x="360" y="396" text-anchor="middle" font-size="12" fill="#718096">(1, 6, 16)</text>

  <!-- scores box -->
  <line x1="415" y1="153" x2="500" y2="210" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="415" y1="266" x2="500" y2="235" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="503" y="200" width="150" height="66" rx="8" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/>
  <text x="578" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#1a202c">scores = QK&#7488; / &#8730;hs</text>
  <text x="578" y="248" text-anchor="middle" font-size="12" fill="#718096">(1, 6, 6)</text>

  <!-- softmax -->
  <line x1="653" y1="233" x2="700" y2="233" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="703" y="200" width="150" height="66" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="778" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">softmax &#8594; weights</text>
  <text x="778" y="248" text-anchor="middle" font-size="12" fill="#718096">(1, 6, 6), rows sum to 1</text>

  <!-- weights @ V -> out -->
  <line x1="778" y1="266" x2="778" y2="330" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="415" y1="379" x2="700" y2="360" stroke="#9f7aea" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowp)"/>
  <rect x="703" y="330" width="150" height="70" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
  <text x="778" y="357" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">out = weights @ V</text>
  <text x="778" y="379" text-anchor="middle" font-size="12" fill="#718096">(1, 6, 16)</text>

  <text x="560" y="430" text-anchor="middle" font-size="12.5" fill="#4a5568">Similarity is scored in the learned query/key space; the returned content lives in the learned value space.</text>
  <text x="560" y="450" text-anchor="middle" font-size="12.5" fill="#4a5568">Because W&#8474;, W&#8342;, W&#8341; are learnable, the model decides from data which relationships matter.</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#a0aec0"/>
    </marker>
    <marker id="arrowp" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9f7aea"/>
    </marker>
  </defs>
</svg>
