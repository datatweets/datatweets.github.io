<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="780" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="390" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">From raw scores to attention weights</text>
  <text x="390" y="56" text-anchor="middle" font-size="13" fill="#718096">dot-product scores &#8594; stable softmax &#8594; probabilities that sum to 1</text>

  <!-- Scores row -->
  <text x="60" y="96" font-size="13" font-weight="700" fill="#4a5568">scores</text>
  <text x="60" y="112" font-size="11" fill="#718096">(one per key)</text>

  <g font-size="13" fill="#1a202c" text-anchor="middle">
    <rect x="150" y="80" width="86" height="40" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5"/>
    <text x="193" y="105">2.11</text>
    <rect x="242" y="80" width="86" height="40" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/>
    <text x="285" y="105">-1.32</text>
    <rect x="334" y="80" width="86" height="40" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/>
    <text x="377" y="105">-1.59</text>
    <rect x="426" y="80" width="86" height="40" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/>
    <text x="469" y="105">-3.29</text>
    <rect x="518" y="80" width="86" height="40" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/>
    <text x="561" y="105">-1.37</text>
  </g>
  <text x="150" y="140" font-size="11" fill="#718096">key&#8320;</text>
  <text x="242" y="140" font-size="11" fill="#718096">key&#8321;</text>
  <text x="334" y="140" font-size="11" fill="#718096">key&#8322;</text>
  <text x="426" y="140" font-size="11" fill="#718096">key&#8323;</text>
  <text x="518" y="140" font-size="11" fill="#718096">key&#8324;</text>

  <!-- softmax pill -->
  <rect x="618" y="80" width="120" height="40" rx="20" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5"/>
  <text x="678" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">softmax</text>
  <text x="678" y="113" text-anchor="middle" font-size="10" fill="#9f7aea">subtract max, exp</text>

  <!-- arrow down to three panels -->
  <line x1="390" y1="150" x2="390" y2="178" stroke="#a0aec0" stroke-width="2"/>
  <path d="M 386 172 L 390 180 L 394 172 Z" fill="#a0aec0"/>
  <text x="404" y="170" font-size="11" fill="#718096">same scores, three temperatures</text>

  <!-- ================= three panels ================= -->
  <!-- helper: baseline y = 470, bars grow up, full height 200 for weight=1.0 -->

  <!-- Panel A: softer (scores / 4) -->
  <rect x="40" y="196" width="220" height="300" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5"/>
  <text x="150" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">softer &#183; scores / 4</text>
  <text x="150" y="238" text-anchor="middle" font-size="11" fill="#c05621">high temperature &#8594; flatter</text>
  <line x1="58" y1="470" x2="252" y2="470" stroke="#a0aec0" stroke-width="1"/>
  <!-- bars: 0.400 0.170 0.159 0.104 0.168 ; scale 200px = 1.0 -->
  <g fill="#ed8936">
    <rect x="66" y="390" width="26" height="80" rx="3"/>
    <rect x="104" y="436" width="26" height="34" rx="3"/>
    <rect x="142" y="438" width="26" height="32" rx="3"/>
    <rect x="180" y="449" width="26" height="21" rx="3"/>
    <rect x="218" y="436" width="26" height="34" rx="3"/>
  </g>
  <g font-size="10" fill="#c05621" text-anchor="middle">
    <text x="79" y="384">.40</text>
    <text x="117" y="430">.17</text>
    <text x="155" y="432">.16</text>
    <text x="193" y="443">.10</text>
    <text x="231" y="430">.17</text>
  </g>
  <text x="150" y="488" text-anchor="middle" font-size="11" fill="#718096">entropy 1.49 (spread out)</text>

  <!-- Panel B: base (scores / 1) -->
  <rect x="280" y="196" width="220" height="300" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5"/>
  <text x="390" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">base &#183; scores</text>
  <text x="390" y="238" text-anchor="middle" font-size="11" fill="#2b6cb0">temperature 1</text>
  <line x1="298" y1="470" x2="492" y2="470" stroke="#a0aec0" stroke-width="1"/>
  <!-- bars: 0.915 0.030 0.023 0.004 0.028 -->
  <g fill="#4299e1">
    <rect x="306" y="287" width="26" height="183" rx="3"/>
    <rect x="344" y="464" width="26" height="6" rx="3"/>
    <rect x="382" y="465" width="26" height="5" rx="3"/>
    <rect x="420" y="469" width="26" height="1" rx="1"/>
    <rect x="458" y="464" width="26" height="6" rx="3"/>
  </g>
  <g font-size="10" fill="#2b6cb0" text-anchor="middle">
    <text x="319" y="281">.92</text>
    <text x="357" y="458">.03</text>
    <text x="395" y="459">.02</text>
    <text x="433" y="463">.00</text>
    <text x="471" y="458">.03</text>
  </g>
  <text x="390" y="488" text-anchor="middle" font-size="11" fill="#718096">entropy 0.40 (peaked)</text>

  <!-- Panel C: sharper (scores * 4) -->
  <rect x="520" y="196" width="220" height="300" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5"/>
  <text x="630" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">sharper &#183; scores &#215; 4</text>
  <text x="630" y="238" text-anchor="middle" font-size="11" fill="#276749">low temperature &#8594; peaked</text>
  <line x1="538" y1="470" x2="732" y2="470" stroke="#a0aec0" stroke-width="1"/>
  <!-- bars: ~1.000 0 0 0 0 -->
  <g fill="#48bb78">
    <rect x="546" y="270" width="26" height="200" rx="3"/>
    <rect x="584" y="469" width="26" height="1" rx="1"/>
    <rect x="622" y="469" width="26" height="1" rx="1"/>
    <rect x="660" y="469" width="26" height="1" rx="1"/>
    <rect x="698" y="469" width="26" height="1" rx="1"/>
  </g>
  <g font-size="10" fill="#276749" text-anchor="middle">
    <text x="559" y="264">1.00</text>
    <text x="597" y="463">.00</text>
    <text x="635" y="463">.00</text>
    <text x="673" y="463">.00</text>
    <text x="711" y="463">.00</text>
  </g>
  <text x="630" y="488" text-anchor="middle" font-size="11" fill="#718096">entropy 0.00 (winner-take-all)</text>

  <!-- footer note -->
  <text x="390" y="528" text-anchor="middle" font-size="12" fill="#4a5568">Each panel is a probability distribution: five non-negative weights that sum to 1.</text>
  <text x="390" y="548" text-anchor="middle" font-size="12" fill="#4a5568">Dividing the scores softens the peak; multiplying sharpens it. Module 2 divides by &#8730;hs.</text>
</svg>
