<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The mini-GPT training loss</text>
  <text x="360" y="52" text-anchor="middle" font-size="12" fill="#718096">154,456 parameters, 1,200 steps, ~24 s in pure NumPy</text>

  <!-- axes -->
  <line x1="80" y1="330" x2="670" y2="330" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="80" y1="80" x2="80" y2="330" stroke="#4a5568" stroke-width="1.5"/>
  <text x="375" y="362" text-anchor="middle" font-size="12" fill="#4a5568">training step</text>
  <text x="48" y="205" text-anchor="middle" font-size="12" fill="#4a5568" transform="rotate(-90 48 205)">loss</text>

  <!-- y ticks: 3.2 top(y=80) -> 0 bottom(y=330). y = 330 - (loss/3.2)*250 -->
  <g font-size="11" fill="#718096" text-anchor="end">
    <text x="72" y="84">3.2</text><text x="72" y="150">2.4</text><text x="72" y="252">1.0</text><text x="72" y="333">0.0</text>
  </g>
  <!-- baseline line at 3.178 -->
  <line x1="80" y1="82" x2="670" y2="82" stroke="#fc8181" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="664" y="76" text-anchor="end" font-size="11" fill="#c53030">random baseline log(24) = 3.18</text>

  <!-- x ticks: 0..1200 mapped 80..670 -->
  <g font-size="11" fill="#718096" text-anchor="middle">
    <text x="80" y="348">0</text><text x="178" y="348">200</text><text x="326" y="348">500</text><text x="522" y="348">900</text><text x="670" y="348">1200</text>
  </g>

  <!-- loss curve. map: x=80+step/1200*590 ; y=330-loss/3.2*250
       (0,3.2026)->(80,80) (100,0.4645)->(129,294) (200,0.2056)->(178,314) (300,0.1577)->(227,318)
       (500,0.1544)->(326,318) (700,0.1257)->(424,320) (1000,0.2204)->(571,313) (1200,0.1337)->(670,320) -->
  <polyline fill="none" stroke="#2b6cb0" stroke-width="2.5"
    points="80,80 129,294 178,314 227,318 326,318 375,314 424,320 473,318 571,313 620,320 670,320"/>
  <circle cx="80" cy="80" r="3.5" fill="#2b6cb0"/>
  <circle cx="129" cy="294" r="3" fill="#2b6cb0"/>
  <circle cx="670" cy="320" r="3.5" fill="#2b6cb0"/>
  <text x="150" y="120" font-size="12" fill="#2b6cb0" font-weight="600">3.2026 (step 0)</text>
  <text x="150" y="285" font-size="11" fill="#276749">0.46 by step 100</text>
  <text x="560" y="345" font-size="12" fill="#2b6cb0" font-weight="600">0.13</text>

  <text x="375" y="388" text-anchor="middle" font-size="12" fill="#1a202c">Steep early drop from the random baseline, then a low, batch-noisy floor.</text>
</svg>
