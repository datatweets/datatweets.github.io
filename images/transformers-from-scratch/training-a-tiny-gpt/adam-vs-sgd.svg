<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Adam vs. SGD on an ill-conditioned bowl</text>
  <text x="360" y="52" text-anchor="middle" font-size="12" fill="#718096">loss on f(w)=&#8721; c&#8341;(w&#8341;&#8722;t&#8341;)&#178;, curvature 1 to 1000, log scale</text>

  <!-- axes -->
  <line x1="90" y1="320" x2="660" y2="320" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="90" y1="90" x2="90" y2="320" stroke="#4a5568" stroke-width="1.5"/>
  <text x="375" y="352" text-anchor="middle" font-size="12" fill="#4a5568">training step</text>
  <text x="60" y="205" text-anchor="middle" font-size="12" fill="#4a5568" transform="rotate(-90 60 205)">loss (log)</text>

  <!-- x ticks -->
  <g font-size="11" fill="#718096" text-anchor="middle">
    <text x="90" y="338">0</text><text x="233" y="338">50</text><text x="375" y="338">100</text><text x="518" y="338">150</text><text x="660" y="338">199</text>
  </g>
  <!-- y ticks (log): 1495 top, .. 0.01 near bottom -->
  <g font-size="11" fill="#718096" text-anchor="end">
    <text x="82" y="100">1495</text><text x="82" y="175">100</text><text x="82" y="250">1</text><text x="82" y="315">0.01</text>
  </g>

  <!-- Adam curve: (0,1495)(5,320)(20,102)(50,2.55)(100,0.019)(199,~0) mapped on log y -->
  <!-- y map: log10(loss): 1495->3.17->y100 ; 100->2->y175 ; 1->0->y250 ; 0.01->-2->y315.  slope: y = 250 - 37.5*log10(loss) -->
  <polyline fill="none" stroke="#2b6cb0" stroke-width="2.5"
    points="90,131 104,155 147,175 233,235 375,314 660,300"/>
  <circle cx="90" cy="131" r="3" fill="#2b6cb0"/><circle cx="233" cy="235" r="3" fill="#2b6cb0"/><circle cx="375" cy="314" r="3" fill="#2b6cb0"/>
  <text x="400" y="308" font-size="12" fill="#2b6cb0" font-weight="600">Adam &#8594; 0.0000</text>

  <!-- SGD curve: (0,1495)(5,80)(20,29)(50,16)(100,8.5)(199,4.1) -->
  <polyline fill="none" stroke="#c05621" stroke-width="2.5"
    points="90,131 104,178 147,195 233,205 375,215 660,227"/>
  <circle cx="90" cy="131" r="3" fill="#c05621"/><circle cx="375" cy="215" r="3" fill="#c05621"/><circle cx="660" cy="227" r="3" fill="#c05621"/>
  <text x="500" y="212" font-size="12" fill="#c05621" font-weight="600">SGD stalls at 4.10</text>

  <text x="375" y="384" text-anchor="middle" font-size="12" fill="#1a202c">Adam adapts per parameter and reaches the minimum; SGD, capped at its stable rate, crawls.</text>
</svg>
