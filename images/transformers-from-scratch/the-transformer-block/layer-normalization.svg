<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="920" height="560" fill="#ffffff"/>

  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Layer Normalization: forward across the feature axis, backward through &#956; and var</text>

  <!-- FORWARD LANE -->
  <text x="40" y="72" font-size="14" font-weight="700" fill="#2b6cb0">FORWARD &#8594; one token vector at a time (length C = 8)</text>

  <!-- input vector x -->
  <text x="40" y="104" font-size="13" fill="#4a5568">x  (one position, C features)</text>
  <g>
    <rect x="40" y="112" width="240" height="34" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5"/>
    <line x1="70" y1="112" x2="70" y2="146" stroke="#4299e1"/>
    <line x1="100" y1="112" x2="100" y2="146" stroke="#4299e1"/>
    <line x1="130" y1="112" x2="130" y2="146" stroke="#4299e1"/>
    <line x1="160" y1="112" x2="160" y2="146" stroke="#4299e1"/>
    <line x1="190" y1="112" x2="190" y2="146" stroke="#4299e1"/>
    <line x1="220" y1="112" x2="220" y2="146" stroke="#4299e1"/>
    <line x1="250" y1="112" x2="250" y2="146" stroke="#4299e1"/>
    <text x="160" y="134" text-anchor="middle" font-size="12" fill="#2b6cb0">off-scale features</text>
  </g>

  <!-- arrow to stats -->
  <text x="300" y="130" font-size="20" fill="#718096">&#8594;</text>

  <!-- mean/var box -->
  <rect x="330" y="104" width="200" height="52" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5"/>
  <text x="430" y="126" text-anchor="middle" font-size="13" fill="#c05621">&#956; = mean(x),  var = var(x)</text>
  <text x="430" y="145" text-anchor="middle" font-size="12" fill="#c05621">std = sqrt(var + eps)</text>

  <text x="550" y="130" font-size="20" fill="#718096">&#8594;</text>

  <!-- xhat box -->
  <text x="580" y="104" font-size="13" fill="#4a5568">xhat = (x &#8722; &#956;) / std</text>
  <g>
    <rect x="580" y="112" width="240" height="34" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5"/>
    <line x1="610" y1="112" x2="610" y2="146" stroke="#48bb78"/>
    <line x1="640" y1="112" x2="640" y2="146" stroke="#48bb78"/>
    <line x1="670" y1="112" x2="670" y2="146" stroke="#48bb78"/>
    <line x1="700" y1="112" x2="700" y2="146" stroke="#48bb78"/>
    <line x1="730" y1="112" x2="730" y2="146" stroke="#48bb78"/>
    <line x1="760" y1="112" x2="760" y2="146" stroke="#48bb78"/>
    <line x1="790" y1="112" x2="790" y2="146" stroke="#48bb78"/>
    <text x="700" y="134" text-anchor="middle" font-size="12" fill="#276749">mean 0, std 1</text>
  </g>

  <!-- down to scale/shift -->
  <text x="700" y="176" text-anchor="middle" font-size="20" fill="#718096">&#8595;</text>

  <!-- gamma/beta box -->
  <rect x="560" y="188" width="280" height="52" rx="6" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5"/>
  <text x="700" y="210" text-anchor="middle" font-size="13" fill="#6b46c1">out = gamma &#8901; xhat + beta</text>
  <text x="700" y="229" text-anchor="middle" font-size="12" fill="#6b46c1">learned scale &amp; shift, each length C</text>

  <!-- divider -->
  <line x1="40" y1="272" x2="880" y2="272" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- BACKWARD LANE -->
  <text x="40" y="302" font-size="14" font-weight="700" fill="#c53030">&#8592; BACKWARD: dout arrives, split three ways</text>

  <!-- dgamma / dbeta -->
  <rect x="40" y="318" width="360" height="60" rx="6" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
  <text x="220" y="342" text-anchor="middle" font-size="13" fill="#c53030">dgamma = sum(dout &#8901; xhat)   over B,T</text>
  <text x="220" y="364" text-anchor="middle" font-size="13" fill="#c53030">dbeta  = sum(dout)          over B,T</text>

  <!-- dx formula box -->
  <rect x="430" y="318" width="450" height="150" rx="6" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/>
  <text x="655" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">dxhat = dout &#8901; gamma,   then</text>
  <text x="655" y="372" text-anchor="middle" font-size="14" fill="#1a202c">dx = ( C&#8901;dxhat</text>
  <text x="655" y="396" text-anchor="middle" font-size="14" fill="#2b6cb0">&#8722; sum(dxhat)</text>
  <text x="655" y="420" text-anchor="middle" font-size="14" fill="#ed8936">&#8722; xhat &#8901; sum(dxhat &#8901; xhat) )</text>
  <text x="655" y="446" text-anchor="middle" font-size="14" fill="#1a202c">/ ( C &#8901; std )</text>

  <!-- annotations for the three terms -->
  <text x="150" y="408" font-size="12" fill="#276749">direct path</text>
  <text x="150" y="428" font-size="12" fill="#2b6cb0">the mean depends on x</text>
  <text x="150" y="448" font-size="12" fill="#ed8936">the variance depends on x</text>

  <line x1="255" y1="404" x2="470" y2="372" stroke="#48bb78" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="255" y1="424" x2="590" y2="396" stroke="#4299e1" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="255" y1="444" x2="560" y2="420" stroke="#ed8936" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="460" y="500" text-anchor="middle" font-size="12" fill="#718096">Every position is normalized on its own, so LN works for any batch size or sequence length.</text>
</svg>
