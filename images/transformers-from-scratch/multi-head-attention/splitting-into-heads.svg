<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">Splitting one wide projection into h parallel heads</text>
  <text x="470" y="56" text-anchor="middle" font-size="13" fill="#718096">B = 1, T = 6, C = 64, h = 4, hs = C / h = 16</text>

  <!-- Stage 1: Q = X @ Wq  (B, T, C) -->
  <text x="130" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">Q = X @ Wq</text>
  <rect x="55" y="104" width="150" height="150" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="130" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#2b6cb0">(B, T, C)</text>
  <text x="130" y="198" text-anchor="middle" font-size="13" fill="#4299e1">(1, 6, 64)</text>
  <text x="130" y="274" text-anchor="middle" font-size="11" fill="#718096">one wide matmul</text>

  <!-- arrow 1 -->
  <text x="242" y="164" text-anchor="middle" font-size="12" fill="#4a5568">reshape</text>
  <line x1="212" y1="180" x2="278" y2="180" stroke="#4a5568" stroke-width="2"/>
  <polygon points="278,180 268,175 268,185" fill="#4a5568"/>

  <!-- Stage 2: reshape (B, T, h, hs) -->
  <text x="380" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">Q.reshape(B, T, h, hs)</text>
  <g>
    <rect x="300" y="104" width="160" height="150" rx="6" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
    <line x1="340" y1="104" x2="340" y2="254" stroke="#ed8936" stroke-width="1.5"/>
    <line x1="380" y1="104" x2="380" y2="254" stroke="#ed8936" stroke-width="1.5"/>
    <line x1="420" y1="104" x2="420" y2="254" stroke="#ed8936" stroke-width="1.5"/>
    <text x="320" y="184" text-anchor="middle" font-size="11" fill="#c05621">h0</text>
    <text x="360" y="184" text-anchor="middle" font-size="11" fill="#c05621">h1</text>
    <text x="400" y="184" text-anchor="middle" font-size="11" fill="#c05621">h2</text>
    <text x="440" y="184" text-anchor="middle" font-size="11" fill="#c05621">h3</text>
  </g>
  <text x="380" y="274" text-anchor="middle" font-size="15" font-weight="700" fill="#c05621">(1, 6, 4, 16)</text>
  <text x="380" y="292" text-anchor="middle" font-size="11" fill="#718096">C split into h blocks of hs</text>

  <!-- arrow 2 -->
  <text x="510" y="164" text-anchor="middle" font-size="12" fill="#4a5568">transpose</text>
  <text x="510" y="178" text-anchor="middle" font-size="11" fill="#718096">(0,2,1,3)</text>
  <line x1="467" y1="192" x2="553" y2="192" stroke="#4a5568" stroke-width="2"/>
  <polygon points="553,192 543,187 543,197" fill="#4a5568"/>

  <!-- Stage 3: transpose (B, h, T, hs) -->
  <text x="720" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">transpose &#8594; (B, h, T, hs)</text>
  <g>
    <rect x="590" y="104" width="118" height="66" rx="5" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
    <text x="649" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">head 0 &#183; (T, hs)</text>
    <rect x="590" y="176" width="118" height="66" rx="5" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
    <text x="649" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">head 1 &#183; (T, hs)</text>
    <rect x="734" y="104" width="118" height="66" rx="5" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
    <text x="793" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">head 2 &#183; (T, hs)</text>
    <rect x="734" y="176" width="118" height="66" rx="5" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
    <text x="793" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">head 3 &#183; (T, hs)</text>
  </g>
  <text x="720" y="274" text-anchor="middle" font-size="15" font-weight="700" fill="#276749">(1, 4, 6, 16)</text>
  <text x="720" y="292" text-anchor="middle" font-size="11" fill="#718096">head axis moved next to batch</text>

  <!-- bottom explanation band -->
  <rect x="55" y="330" width="797" height="104" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5"/>
  <text x="72" y="358" font-size="13" font-weight="700" fill="#6b46c1">Why the transpose?</text>
  <text x="72" y="382" font-size="12.5" fill="#4a5568">After reshape, the head axis (h) sits between T and hs, so each head's rows are interleaved across the tensor.</text>
  <text x="72" y="404" font-size="12.5" fill="#4a5568">Moving h up next to B with transpose(0, 2, 1, 3) leaves a clean (T, hs) block per head &#8212; each an independent</text>
  <text x="72" y="426" font-size="12.5" fill="#4a5568">attention problem. Head i is exactly columns [i&#183;hs : (i+1)&#183;hs] of the wide Wq, so one matmul equals h small ones.</text>
</svg>
