<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">Multi-Head Attention: forward values down, gradients back up</text>

  <!-- ===== FORWARD LANE (blue) ===== -->
  <text x="30" y="78" font-size="13" font-weight="700" fill="#2b6cb0">FORWARD &#8595;</text>

  <!-- X -->
  <rect x="30" y="92" width="120" height="52" rx="7" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="90" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">X</text>
  <text x="90" y="132" text-anchor="middle" font-size="11" fill="#4a5568">(B, T, C)</text>

  <!-- Q K V merged -->
  <rect x="190" y="92" width="140" height="52" rx="7" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="260" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">Q, K, V = X&#183;Wq/Wk/Wv</text>
  <text x="260" y="132" text-anchor="middle" font-size="11" fill="#4a5568">(B, T, C)</text>

  <!-- split -->
  <rect x="370" y="92" width="130" height="52" rx="7" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="435" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">split heads</text>
  <text x="435" y="132" text-anchor="middle" font-size="11" fill="#4a5568">(B, h, T, hs)</text>

  <!-- per-head attention -->
  <rect x="540" y="92" width="170" height="52" rx="7" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
  <text x="625" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">per-head attention</text>
  <text x="625" y="130" text-anchor="middle" font-size="11" fill="#4a5568">headout (B, h, T, hs)</text>

  <!-- concat + out -->
  <rect x="750" y="92" width="180" height="52" rx="7" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="840" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">concat &#183; Wo = out</text>
  <text x="840" y="130" text-anchor="middle" font-size="11" fill="#4a5568">(B, T, C) &#8594; L</text>

  <!-- forward arrows -->
  <line x1="150" y1="118" x2="188" y2="118" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="330" y1="118" x2="368" y2="118" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="500" y1="118" x2="538" y2="118" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="710" y1="118" x2="748" y2="118" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- ===== BACKWARD LANE (orange), read right to left ===== -->
  <text x="30" y="312" font-size="13" font-weight="700" fill="#c05621">BACKWARD &#8593; (right to left)</text>

  <!-- dWo / dconcat -->
  <rect x="750" y="326" width="180" height="66" rx="7" fill="#fffaf0" stroke="#c05621" stroke-width="1.5"/>
  <text x="840" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">dout = G</text>
  <text x="840" y="366" text-anchor="middle" font-size="11" fill="#4a5568">dWo = concat&#7488;&#183;dout</text>
  <text x="840" y="382" text-anchor="middle" font-size="11" fill="#4a5568">dconcat = dout&#183;Wo&#7488;</text>

  <!-- split grad -->
  <rect x="540" y="326" width="170" height="66" rx="7" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="625" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">split dconcat</text>
  <text x="625" y="366" text-anchor="middle" font-size="11" fill="#4a5568">dheadout</text>
  <text x="625" y="382" text-anchor="middle" font-size="11" fill="#4a5568">(B, h, T, hs)</text>

  <!-- per-head backward -->
  <rect x="330" y="326" width="180" height="66" rx="7" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
  <text x="420" y="346" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">per-head backward</text>
  <text x="420" y="363" text-anchor="middle" font-size="10.5" fill="#4a5568">dValue, softmax J,</text>
  <text x="420" y="379" text-anchor="middle" font-size="10.5" fill="#4a5568">dQuery, dKey</text>

  <!-- merge -->
  <rect x="170" y="326" width="130" height="66" rx="7" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="235" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">merge heads</text>
  <text x="235" y="372" text-anchor="middle" font-size="10.5" fill="#4a5568">(B, T, C)</text>

  <!-- params + dX -->
  <rect x="30" y="326" width="110" height="66" rx="7" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="85" y="348" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c53030">dWq, dWk,</text>
  <text x="85" y="365" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c53030">dWv, dX</text>
  <text x="85" y="382" text-anchor="middle" font-size="10.5" fill="#4a5568">(C,C) &amp; (B,T,C)</text>

  <!-- backward arrows (right to left) -->
  <line x1="748" y1="359" x2="712" y2="359" stroke="#c05621" stroke-width="2" marker-end="url(#arrO)"/>
  <line x1="538" y1="359" x2="512" y2="359" stroke="#c05621" stroke-width="2" marker-end="url(#arrO)"/>
  <line x1="328" y1="359" x2="302" y2="359" stroke="#c05621" stroke-width="2" marker-end="url(#arrO)"/>
  <line x1="168" y1="359" x2="142" y2="359" stroke="#c05621" stroke-width="2" marker-end="url(#arrO)"/>

  <!-- cache dashed links (forward tensors reused in backward) -->
  <line x1="625" y1="144" x2="625" y2="326" stroke="#a0aec0" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="435" y1="144" x2="435" y2="326" stroke="#a0aec0" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="840" y1="144" x2="840" y2="326" stroke="#a0aec0" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="480" y="238" text-anchor="middle" font-size="11" fill="#718096">dashed lines: cached forward tensors (Aweights, Q, K, V, concat, X) reused by the backward step below</text>

  <defs>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c05621"/>
    </marker>
  </defs>
</svg>
