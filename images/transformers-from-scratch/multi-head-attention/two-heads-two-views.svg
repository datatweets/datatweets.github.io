<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="The same input sequence is fed to two independent attention heads. Head A and Head B each have their own Wq, Wk, and Wv, so they produce two different attention matrices. Their outputs are pooled into one combined representation.">
  <rect x="0" y="0" width="860" height="560" fill="#ffffff"/>

  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">One sequence, two heads, two different views</text>

  <!-- Shared input sequence -->
  <text x="430" y="66" text-anchor="middle" font-size="13" fill="#4a5568">Shared input X&#160;&#160;(1, T, C)&#160;&#160;&#8212;&#160;the same embedded tokens</text>
  <g font-size="12" fill="#1a202c" text-anchor="middle">
    <rect x="250" y="78" width="52" height="26" rx="5" fill="#f7fafc" stroke="#a0aec0"/><text x="276" y="95">the</text>
    <rect x="304" y="78" width="52" height="26" rx="5" fill="#f7fafc" stroke="#a0aec0"/><text x="330" y="95">keeper</text>
    <rect x="358" y="78" width="52" height="26" rx="5" fill="#f7fafc" stroke="#a0aec0"/><text x="384" y="95">lights</text>
    <rect x="412" y="78" width="52" height="26" rx="5" fill="#f7fafc" stroke="#a0aec0"/><text x="438" y="95">lantern</text>
    <rect x="466" y="78" width="52" height="26" rx="5" fill="#f7fafc" stroke="#a0aec0"/><text x="492" y="95">when</text>
    <rect x="520" y="78" width="52" height="26" rx="5" fill="#f7fafc" stroke="#a0aec0"/><text x="546" y="95">fog</text>
  </g>

  <!-- Split arrows to the two heads -->
  <line x1="380" y1="106" x2="230" y2="150" stroke="#4299e1" stroke-width="2"/>
  <polygon points="230,150 240,144 236,154" fill="#4299e1"/>
  <line x1="440" y1="106" x2="630" y2="150" stroke="#48bb78" stroke-width="2"/>
  <polygon points="630,150 620,144 624,154" fill="#48bb78"/>

  <!-- Head A box -->
  <rect x="40" y="150" width="360" height="300" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="220" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#2b6cb0">Head A</text>
  <text x="220" y="196" text-anchor="middle" font-size="12" fill="#2b6cb0">its own WqA, WkA, WvA</text>

  <!-- Head A matrix -->
  <text x="220" y="222" text-anchor="middle" font-size="11" fill="#4a5568">attention weights = softmax(Q K&#8868; / &#8730;hs)</text>
  <g>
    <!-- 6x6 grid, darker = more weight, Head A: strong diagonal-ish / local -->
    <rect x="130" y="232" width="180" height="180" fill="#ffffff" stroke="#2b6cb0"/>
    <!-- row cells (illustrative shading) -->
    <g stroke="#ffffff">
      <rect x="130" y="232" width="30" height="30" fill="#bee3f8"/><rect x="160" y="232" width="30" height="30" fill="#ebf8ff"/><rect x="190" y="232" width="30" height="30" fill="#2b6cb0"/><rect x="220" y="232" width="30" height="30" fill="#bee3f8"/><rect x="250" y="232" width="30" height="30" fill="#90cdf4"/><rect x="280" y="232" width="30" height="30" fill="#bee3f8"/>
      <rect x="130" y="262" width="30" height="30" fill="#bee3f8"/><rect x="160" y="262" width="30" height="30" fill="#ebf8ff"/><rect x="190" y="262" width="30" height="30" fill="#90cdf4"/><rect x="220" y="262" width="30" height="30" fill="#bee3f8"/><rect x="250" y="262" width="30" height="30" fill="#ebf8ff"/><rect x="280" y="262" width="30" height="30" fill="#2b6cb0"/>
      <rect x="130" y="292" width="30" height="30" fill="#ebf8ff"/><rect x="160" y="292" width="30" height="30" fill="#90cdf4"/><rect x="190" y="292" width="30" height="30" fill="#2b6cb0"/><rect x="220" y="292" width="30" height="30" fill="#ebf8ff"/><rect x="250" y="292" width="30" height="30" fill="#bee3f8"/><rect x="280" y="292" width="30" height="30" fill="#4299e1"/>
      <rect x="130" y="322" width="30" height="30" fill="#90cdf4"/><rect x="160" y="322" width="30" height="30" fill="#ebf8ff"/><rect x="190" y="322" width="30" height="30" fill="#4299e1"/><rect x="220" y="322" width="30" height="30" fill="#90cdf4"/><rect x="250" y="322" width="30" height="30" fill="#2b6cb0"/><rect x="280" y="322" width="30" height="30" fill="#bee3f8"/>
      <rect x="130" y="352" width="30" height="30" fill="#bee3f8"/><rect x="160" y="352" width="30" height="30" fill="#ebf8ff"/><rect x="190" y="352" width="30" height="30" fill="#bee3f8"/><rect x="220" y="352" width="30" height="30" fill="#bee3f8"/><rect x="250" y="352" width="30" height="30" fill="#ebf8ff"/><rect x="280" y="352" width="30" height="30" fill="#2b6cb0"/>
      <rect x="130" y="382" width="30" height="30" fill="#ebf8ff"/><rect x="160" y="382" width="30" height="30" fill="#2b6cb0"/><rect x="190" y="382" width="30" height="30" fill="#ebf8ff"/><rect x="220" y="382" width="30" height="30" fill="#ebf8ff"/><rect x="250" y="382" width="30" height="30" fill="#bee3f8"/><rect x="280" y="382" width="30" height="30" fill="#ebf8ff"/>
    </g>
  </g>
  <text x="220" y="432" text-anchor="middle" font-size="11" fill="#2b6cb0">tends to lock onto nearby words</text>

  <!-- Head B box -->
  <rect x="460" y="150" width="360" height="300" rx="10" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
  <text x="640" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#276749">Head B</text>
  <text x="640" y="196" text-anchor="middle" font-size="12" fill="#276749">its own WqB, WkB, WvB</text>
  <text x="640" y="222" text-anchor="middle" font-size="11" fill="#4a5568">attention weights = softmax(Q K&#8868; / &#8730;hs)</text>
  <g>
    <rect x="550" y="232" width="180" height="180" fill="#ffffff" stroke="#276749"/>
    <g stroke="#ffffff">
      <rect x="550" y="232" width="30" height="30" fill="#c6f6d5"/><rect x="580" y="232" width="30" height="30" fill="#276749"/><rect x="610" y="232" width="30" height="30" fill="#f0fff4"/><rect x="640" y="232" width="30" height="30" fill="#c6f6d5"/><rect x="670" y="232" width="30" height="30" fill="#f0fff4"/><rect x="700" y="232" width="30" height="30" fill="#48bb78"/>
      <rect x="550" y="262" width="30" height="30" fill="#f0fff4"/><rect x="580" y="262" width="30" height="30" fill="#9ae6b4"/><rect x="610" y="262" width="30" height="30" fill="#9ae6b4"/><rect x="640" y="262" width="30" height="30" fill="#f0fff4"/><rect x="670" y="262" width="30" height="30" fill="#276749"/><rect x="700" y="262" width="30" height="30" fill="#48bb78"/>
      <rect x="550" y="292" width="30" height="30" fill="#9ae6b4"/><rect x="580" y="292" width="30" height="30" fill="#f0fff4"/><rect x="610" y="292" width="30" height="30" fill="#c6f6d5"/><rect x="640" y="292" width="30" height="30" fill="#9ae6b4"/><rect x="670" y="292" width="30" height="30" fill="#48bb78"/><rect x="700" y="292" width="30" height="30" fill="#276749"/>
      <rect x="550" y="322" width="30" height="30" fill="#f0fff4"/><rect x="580" y="322" width="30" height="30" fill="#48bb78"/><rect x="610" y="322" width="30" height="30" fill="#f0fff4"/><rect x="640" y="322" width="30" height="30" fill="#f0fff4"/><rect x="670" y="322" width="30" height="30" fill="#276749"/><rect x="700" y="322" width="30" height="30" fill="#c6f6d5"/>
      <rect x="550" y="352" width="30" height="30" fill="#276749"/><rect x="580" y="352" width="30" height="30" fill="#f0fff4"/><rect x="610" y="352" width="30" height="30" fill="#9ae6b4"/><rect x="640" y="352" width="30" height="30" fill="#c6f6d5"/><rect x="670" y="352" width="30" height="30" fill="#f0fff4"/><rect x="700" y="352" width="30" height="30" fill="#c6f6d5"/>
      <rect x="550" y="382" width="30" height="30" fill="#48bb78"/><rect x="580" y="382" width="30" height="30" fill="#276749"/><rect x="610" y="382" width="30" height="30" fill="#f0fff4"/><rect x="640" y="382" width="30" height="30" fill="#c6f6d5"/><rect x="670" y="382" width="30" height="30" fill="#f0fff4"/><rect x="700" y="382" width="30" height="30" fill="#f0fff4"/>
    </g>
  </g>
  <text x="640" y="432" text-anchor="middle" font-size="11" fill="#276749">tends to jump to matching words far away</text>

  <!-- Pool / combine -->
  <line x1="220" y1="450" x2="400" y2="492" stroke="#6b46c1" stroke-width="2"/>
  <polygon points="400,492 390,486 394,496" fill="#6b46c1"/>
  <line x1="640" y1="450" x2="460" y2="492" stroke="#6b46c1" stroke-width="2"/>
  <polygon points="460,492 470,486 466,496" fill="#6b46c1"/>
  <rect x="300" y="492" width="260" height="46" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/>
  <text x="430" y="512" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">pool the notes: concat + project</text>
  <text x="430" y="529" text-anchor="middle" font-size="11" fill="#6b46c1">one richer representation per position</text>
</svg>
