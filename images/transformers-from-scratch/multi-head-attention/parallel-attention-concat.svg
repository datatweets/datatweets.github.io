<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Multi-Head Attention: parallel heads &#8594; concat &#8594; output projection</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#718096">demo shapes: B=2, T=6, C=64, h=4, hs=C/h=16</text>

  <!-- Input X -->
  <rect x="30" y="250" width="90" height="100" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="75" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#2b6cb0">X</text>
  <text x="75" y="314" text-anchor="middle" font-size="12" fill="#4a5568">(B, T, C)</text>
  <text x="75" y="332" text-anchor="middle" font-size="12" fill="#4a5568">(2, 6, 64)</text>

  <!-- project + split label -->
  <text x="168" y="278" text-anchor="middle" font-size="11" fill="#4a5568">X@Wq,X@Wk,</text>
  <text x="168" y="292" text-anchor="middle" font-size="11" fill="#4a5568">X@Wv, then</text>
  <text x="168" y="306" text-anchor="middle" font-size="11" fill="#4a5568">split into h</text>
  <path d="M122 300 L212 300" stroke="#a0aec0" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 4 head boxes -->
  <!-- head 1 (blue) -->
  <g>
    <rect x="220" y="86" width="330" height="96" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
    <text x="238" y="112" font-size="13" font-weight="700" fill="#2b6cb0">head 1</text>
    <text x="238" y="134" font-size="11" fill="#4a5568">Q&#8321;,K&#8321;,V&#8321;: (2, 6, 16)</text>
    <text x="238" y="152" font-size="11" fill="#4a5568">softmax(Q&#8321;K&#8321;&#7488;/sqrt(16)) V&#8321;</text>
    <text x="238" y="170" font-size="11" fill="#4a5568">scores (2,6,6) &#8594; out (2,6,16)</text>
  </g>
  <!-- head 2 (green) -->
  <g>
    <rect x="220" y="192" width="330" height="96" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
    <text x="238" y="218" font-size="13" font-weight="700" fill="#276749">head 2</text>
    <text x="238" y="240" font-size="11" fill="#4a5568">Q&#8322;,K&#8322;,V&#8322;: (2, 6, 16)</text>
    <text x="238" y="258" font-size="11" fill="#4a5568">softmax(Q&#8322;K&#8322;&#7488;/sqrt(16)) V&#8322;</text>
    <text x="238" y="276" font-size="11" fill="#4a5568">scores (2,6,6) &#8594; out (2,6,16)</text>
  </g>
  <!-- head 3 (orange) -->
  <g>
    <rect x="220" y="298" width="330" height="96" rx="8" fill="#fffaf0" stroke="#ed8936" stroke-width="2"/>
    <text x="238" y="324" font-size="13" font-weight="700" fill="#c05621">head 3</text>
    <text x="238" y="346" font-size="11" fill="#4a5568">Q&#8323;,K&#8323;,V&#8323;: (2, 6, 16)</text>
    <text x="238" y="364" font-size="11" fill="#4a5568">softmax(Q&#8323;K&#8323;&#7488;/sqrt(16)) V&#8323;</text>
    <text x="238" y="382" font-size="11" fill="#4a5568">scores (2,6,6) &#8594; out (2,6,16)</text>
  </g>
  <!-- head 4 (purple) -->
  <g>
    <rect x="220" y="404" width="330" height="96" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="2"/>
    <text x="238" y="430" font-size="13" font-weight="700" fill="#6b46c1">head 4</text>
    <text x="238" y="452" font-size="11" fill="#4a5568">Q&#8324;,K&#8324;,V&#8324;: (2, 6, 16)</text>
    <text x="238" y="470" font-size="11" fill="#4a5568">softmax(Q&#8324;K&#8324;&#7488;/sqrt(16)) V&#8324;</text>
    <text x="238" y="488" font-size="11" fill="#4a5568">scores (2,6,6) &#8594; out (2,6,16)</text>
  </g>

  <!-- brace from X to heads -->
  <path d="M212 134 L220 134" stroke="#4299e1" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M212 240 L220 240" stroke="#48bb78" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M212 346 L220 346" stroke="#ed8936" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M212 452 L220 452" stroke="#9f7aea" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M197 300 L197 134 L212 134" fill="none" stroke="#a0aec0" stroke-width="1.5"/>
  <path d="M197 300 L197 240 L212 240" fill="none" stroke="#a0aec0" stroke-width="1.5"/>
  <path d="M197 300 L197 346 L212 346" fill="none" stroke="#a0aec0" stroke-width="1.5"/>
  <path d="M197 300 L197 452 L212 452" fill="none" stroke="#a0aec0" stroke-width="1.5"/>

  <!-- Concat box -->
  <rect x="600" y="240" width="110" height="120" rx="8" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/>
  <text x="655" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Concat</text>
  <text x="655" y="306" text-anchor="middle" font-size="11" fill="#4a5568">4 &#215; (2,6,16)</text>
  <text x="655" y="322" text-anchor="middle" font-size="11" fill="#4a5568">stacked to</text>
  <text x="655" y="340" text-anchor="middle" font-size="12" font-weight="600" fill="#1a202c">(2, 6, 64)</text>

  <!-- arrows heads -> concat -->
  <path d="M550 134 L575 134 L575 262 L598 262" fill="none" stroke="#4299e1" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M550 240 L580 240 L580 282 L598 282" fill="none" stroke="#48bb78" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M550 346 L580 346 L580 318 L598 318" fill="none" stroke="#ed8936" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M550 452 L575 452 L575 338 L598 338" fill="none" stroke="#9f7aea" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Wo box -->
  <rect x="750" y="252" width="60" height="96" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
  <text x="780" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#c53030">Wo</text>
  <text x="780" y="316" text-anchor="middle" font-size="11" fill="#4a5568">(64,64)</text>
  <path d="M710 300 L748 300" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>
  <text x="729" y="292" text-anchor="middle" font-size="10" fill="#4a5568">mix</text>

  <!-- Output -->
  <rect x="750" y="392" width="120" height="86" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="810" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">MultiHead(X)</text>
  <text x="810" y="446" text-anchor="middle" font-size="12" fill="#4a5568">= Concat @ Wo</text>
  <text x="810" y="464" text-anchor="middle" font-size="12" font-weight="600" fill="#1a202c">(2, 6, 64)</text>
  <path d="M780 348 L780 390" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arr)"/>

  <!-- footer note -->
  <text x="450" y="556" text-anchor="middle" font-size="12" fill="#718096">Heads are independent until Wo: the output projection is what lets the four heads' findings interact.</text>
  <text x="450" y="576" text-anchor="middle" font-size="12" fill="#718096">MultiHead(X) = Concat(head&#8321;, ..., head&#8324;) @ Wo, with head&#7522; = softmax(Q&#7522;K&#7522;&#7488;/sqrt(hs)) V&#7522;</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7 3 L0 6 z" fill="#4a5568"/>
    </marker>
  </defs>
</svg>
