<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="920" height="470" fill="#ffffff"/>
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The Language-Modeling Head and Next-Token Loss</text>
  <text x="460" y="50" text-anchor="middle" font-size="12" fill="#718096">at one position t &#8212; hidden state &#8594; logits &#8594; softmax &#8594; cross-entropy against the true next token</text>

  <!-- hidden state -->
  <rect x="30" y="90" width="120" height="90" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="90" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">hidden</text>
  <text x="90" y="140" text-anchor="middle" font-size="12" fill="#4a5568">final state</text>
  <text x="90" y="162" text-anchor="middle" font-size="12" fill="#4a5568">(B, T, C)</text>

  <!-- arrow to head -->
  <line x1="150" y1="135" x2="210" y2="135" stroke="#4a5568" stroke-width="2"/>
  <polygon points="210,135 200,130 200,140" fill="#4a5568"/>

  <!-- LM head -->
  <rect x="210" y="85" width="150" height="100" rx="8" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/>
  <text x="285" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">LM head (linear)</text>
  <text x="285" y="135" text-anchor="middle" font-size="13" fill="#4a5568">logits =</text>
  <text x="285" y="154" text-anchor="middle" font-size="13" fill="#4a5568">hidden &#183; W_head + b_head</text>
  <text x="285" y="174" text-anchor="middle" font-size="11" fill="#718096">W_head: (C, vocab_size)</text>

  <!-- arrow to logits -->
  <line x1="360" y1="135" x2="420" y2="135" stroke="#4a5568" stroke-width="2"/>
  <polygon points="420,135 410,130 410,140" fill="#4a5568"/>

  <!-- logits -->
  <rect x="420" y="90" width="120" height="90" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
  <text x="480" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">logits</text>
  <text x="480" y="138" text-anchor="middle" font-size="12" fill="#4a5568">one score per</text>
  <text x="480" y="154" text-anchor="middle" font-size="12" fill="#4a5568">vocab token</text>
  <text x="480" y="172" text-anchor="middle" font-size="12" fill="#4a5568">(B, T, vocab_size)</text>

  <!-- arrow to softmax -->
  <line x1="540" y1="135" x2="600" y2="135" stroke="#4a5568" stroke-width="2"/>
  <polygon points="600,135 590,130 590,140" fill="#4a5568"/>

  <!-- softmax bars -->
  <rect x="600" y="80" width="140" height="110" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
  <text x="670" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">softmax &#8594; p</text>
  <rect x="614" y="150" width="14" height="24" fill="#48bb78"/>
  <rect x="634" y="138" width="14" height="36" fill="#48bb78"/>
  <rect x="654" y="120" width="14" height="54" fill="#276749"/>
  <rect x="674" y="145" width="14" height="29" fill="#48bb78"/>
  <rect x="694" y="132" width="14" height="42" fill="#48bb78"/>
  <rect x="714" y="152" width="14" height="22" fill="#48bb78"/>
  <text x="661" y="115" text-anchor="middle" font-size="10" fill="#276749">true</text>

  <!-- arrow to loss -->
  <line x1="740" y1="135" x2="800" y2="135" stroke="#4a5568" stroke-width="2"/>
  <polygon points="800,135 790,130 790,140" fill="#4a5568"/>

  <!-- loss -->
  <rect x="800" y="95" width="100" height="80" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
  <text x="850" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">loss</text>
  <text x="850" y="144" text-anchor="middle" font-size="12" fill="#4a5568">&#8722;log p_target</text>
  <text x="850" y="164" text-anchor="middle" font-size="11" fill="#718096">avg over B&#183;T</text>

  <!-- true next token strip -->
  <rect x="420" y="235" width="320" height="46" rx="8" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.5"/>
  <text x="580" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">target = input shifted by one (the true next token)</text>
  <text x="580" y="273" text-anchor="middle" font-size="11" fill="#4a5568">onehot(target): 1 at the correct token, 0 elsewhere</text>
  <line x1="661" y1="235" x2="661" y2="190" stroke="#276749" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- gradient box -->
  <rect x="210" y="330" width="500" height="90" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
  <text x="460" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">The clean gradient</text>
  <text x="460" y="386" text-anchor="middle" font-size="15" fill="#1a202c">dlogits = ( softmax(logits) &#8722; onehot(target) ) / N</text>
  <text x="460" y="408" text-anchor="middle" font-size="11" fill="#718096">predicted distribution minus the one-hot truth &#8212; the reason this is the standard LM loss</text>

  <!-- backward arrow -->
  <line x1="480" y1="330" x2="480" y2="185" stroke="#c05621" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="480,185 475,197 485,197" fill="#c05621"/>
  <text x="500" y="260" font-size="11" fill="#c05621">backward</text>
</svg>
