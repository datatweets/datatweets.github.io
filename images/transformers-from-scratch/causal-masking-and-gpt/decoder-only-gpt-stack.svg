<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="620" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">The Decoder-Only GPT Stack (forward)</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#718096">demo config: B=1, T=8, C=64, h=4, n_layer=2, vocab_size=24</text>

  <!-- token ids -->
  <rect x="270" y="74" width="220" height="46" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="380" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#1a202c">token ids  idx</text>
  <text x="380" y="114" text-anchor="middle" font-size="12" fill="#4a5568">(B, T) = (1, 8)</text>
  <line x1="380" y1="120" x2="380" y2="140" stroke="#4a5568" stroke-width="2"/>
  <polygon points="380,146 375,136 385,136" fill="#4a5568"/>

  <!-- embeddings -->
  <rect x="230" y="146" width="300" height="58" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="380" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#2b6cb0">token embedding + position embedding</text>
  <text x="380" y="186" text-anchor="middle" font-size="12" fill="#4a5568">tok_emb[idx] (1,8,64) + pos_emb[:T] (8,64)</text>
  <text x="380" y="200" text-anchor="middle" font-size="12" fill="#2b6cb0">&#8594; x : (B, T, C) = (1, 8, 64)</text>
  <line x1="380" y1="204" x2="380" y2="224" stroke="#4a5568" stroke-width="2"/>
  <polygon points="380,230 375,220 385,220" fill="#4a5568"/>

  <!-- stack of causal blocks -->
  <rect x="180" y="230" width="400" height="150" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="380" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">stack of n_layer causal transformer blocks</text>

  <rect x="230" y="264" width="300" height="42" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
  <text x="380" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="#276749">causal block 1</text>
  <text x="380" y="298" text-anchor="middle" font-size="11" fill="#4a5568">causal MHA + FFN, pre-norm  &#8594; (1, 8, 64)</text>

  <line x1="380" y1="306" x2="380" y2="320" stroke="#4a5568" stroke-width="2"/>
  <polygon points="380,324 375,315 385,315" fill="#4a5568"/>

  <rect x="230" y="324" width="300" height="42" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
  <text x="380" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#276749">causal block 2</text>
  <text x="380" y="358" text-anchor="middle" font-size="11" fill="#4a5568">each block maps (1, 8, 64) &#8594; (1, 8, 64)</text>

  <line x1="380" y1="380" x2="380" y2="400" stroke="#4a5568" stroke-width="2"/>
  <polygon points="380,406 375,396 385,396" fill="#4a5568"/>

  <!-- final LN -->
  <rect x="250" y="406" width="260" height="46" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="1.5"/>
  <text x="380" y="430" text-anchor="middle" font-size="14" font-weight="600" fill="#c05621">final LayerNorm</text>
  <text x="380" y="446" text-anchor="middle" font-size="12" fill="#4a5568">(1, 8, 64) &#8594; (1, 8, 64)</text>
  <line x1="380" y1="452" x2="380" y2="472" stroke="#4a5568" stroke-width="2"/>
  <polygon points="380,478 375,468 385,468" fill="#4a5568"/>

  <!-- LM head -->
  <rect x="240" y="478" width="280" height="58" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="380" y="500" text-anchor="middle" font-size="14" font-weight="600" fill="#c53030">output head: linear  C &#8594; vocab_size</text>
  <text x="380" y="518" text-anchor="middle" font-size="12" fill="#4a5568">x @ W_head + b_head, W_head: (64, 24)</text>
  <text x="380" y="532" text-anchor="middle" font-size="12" fill="#c53030">&#8594; logits : (1, 8, 24)</text>
  <line x1="380" y1="536" x2="380" y2="556" stroke="#4a5568" stroke-width="2"/>
  <polygon points="380,562 375,552 385,552" fill="#4a5568"/>

  <!-- logits -->
  <rect x="230" y="562" width="300" height="46" rx="8" fill="#4299e1" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="380" y="584" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">logits : (B, T, vocab_size) = (1, 8, 24)</text>
  <text x="380" y="600" text-anchor="middle" font-size="11" fill="#ebf8ff">one next-token distribution per position</text>

  <!-- side note -->
  <text x="612" y="300" font-size="11" fill="#6b46c1">causal mask</text>
  <text x="612" y="316" font-size="11" fill="#718096">inside each</text>
  <text x="612" y="332" font-size="11" fill="#718096">block: no</text>
  <text x="612" y="348" font-size="11" fill="#718096">position sees</text>
  <text x="612" y="364" font-size="11" fill="#718096">the future</text>
</svg>
