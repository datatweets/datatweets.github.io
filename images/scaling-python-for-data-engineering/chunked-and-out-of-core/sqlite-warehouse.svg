<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" width="940" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<rect x="0" y="0" width="940" height="660" fill="#ffffff"/>
<text x="470" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">Streaming the month into a local SQLite warehouse</text>
<text x="470" y="60" text-anchor="middle" font-size="14" fill="#718096">Stream once into a file on disk, then run many fast SQL queries &#8212; the rows never fully enter pandas</text>

<!-- ===== Stage 1: parquet source streamed in batches ===== -->
<text x="150" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">1 &#183; STREAM IN ONCE</text>
<rect x="40" y="116" width="220" height="56" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="150" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#2b6cb0">yellow_tripdata_2024-01.parquet</text>
<text x="150" y="159" text-anchor="middle" font-size="12" fill="#4a5568">2,964,624 rows &#183; 50 MB</text>

<rect x="70" y="196" width="160" height="20" rx="3" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1"/>
<rect x="80" y="222" width="160" height="20" rx="3" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1"/>
<rect x="90" y="248" width="160" height="20" rx="3" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1"/>
<text x="150" y="290" text-anchor="middle" font-size="12" fill="#718096">15 batches &#215; 200,000 rows</text>
<text x="150" y="308" text-anchor="middle" font-size="12" fill="#718096">iter_batches &#8594; df.to_sql(append)</text>

<!-- arrow from batches to database -->
<line x1="252" y1="232" x2="352" y2="232" stroke="#4a5568" stroke-width="2"/>
<polygon points="352,232 342,227 342,237" fill="#4a5568"/>

<!-- ===== Stage 2: SQLite database cylinder on disk ===== -->
<text x="450" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">2 &#183; ROWS LIVE ON DISK</text>
<ellipse cx="450" cy="150" rx="90" ry="22" fill="#4299e1" stroke="#2b6cb0" stroke-width="1.5"/>
<path d="M 360 150 L 360 300 A 90 22 0 0 0 540 300 L 540 150" fill="#4299e1" stroke="#2b6cb0" stroke-width="1.5"/>
<ellipse cx="450" cy="150" rx="90" ry="22" fill="#63b3ed" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="450" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">warehouse.db</text>
<text x="450" y="224" text-anchor="middle" font-size="12" fill="#ebf8ff">table: trips</text>
<text x="450" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">2,964,624 rows</text>
<text x="450" y="278" text-anchor="middle" font-size="12" fill="#ebf8ff">186 MB &#183; stdlib sqlite3</text>
<text x="450" y="342" text-anchor="middle" font-size="12" fill="#718096">A real serverless SQL database</text>
<text x="450" y="360" text-anchor="middle" font-size="12" fill="#718096">in a single file &#8212; no re-streaming</text>

<!-- ===== Stage 3: two SQL queries out ===== -->
<text x="762" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">3 &#183; QUERY MANY TIMES</text>

<!-- GROUP BY query -> tiny aggregate -->
<line x1="540" y1="188" x2="600" y2="150" stroke="#276749" stroke-width="2"/>
<polygon points="600,150 588,151 594,161" fill="#276749"/>
<rect x="600" y="120" width="316" height="86" rx="6" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
<text x="612" y="142" font-size="12" font-weight="700" fill="#276749">GROUP BY aggregation (out-of-core)</text>
<text x="612" y="162" font-size="11" fill="#276749" font-family="monospace">SELECT PULocationID, COUNT(*),</text>
<text x="612" y="177" font-size="11" fill="#276749" font-family="monospace">  AVG(fare_amount) GROUP BY PULocationID</text>
<text x="612" y="197" font-size="11" fill="#4a5568">&#8776;3M rows scanned by SQLite &#8594; 10 rows returned</text>

<!-- WHERE query with index -->
<line x1="540" y1="262" x2="600" y2="300" stroke="#c05621" stroke-width="2"/>
<polygon points="600,300 594,289 588,299" fill="#c05621"/>
<rect x="600" y="256" width="316" height="150" rx="6" fill="#fffaf0" stroke="#c05621" stroke-width="1.5"/>
<text x="612" y="278" font-size="12" font-weight="700" fill="#c05621">Point query &#183; WHERE PULocationID = 12</text>

<!-- without index: full scan -->
<text x="612" y="300" font-size="11" fill="#4a5568">without index:</text>
<rect x="700" y="290" width="200" height="14" rx="2" fill="#fed7d7" stroke="#c53030" stroke-width="1"/>
<text x="612" y="318" font-size="10" fill="#c53030">SCAN trips &#8212; reads all 2.96M rows (&#8776;150 ms)</text>

<!-- index side structure -->
<text x="612" y="342" font-size="11" fill="#4a5568">CREATE INDEX idx_pu ON trips(PULocationID)</text>
<rect x="612" y="352" width="30" height="44" rx="3" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.5"/>
<line x1="612" y1="367" x2="642" y2="367" stroke="#9f7aea" stroke-width="1"/>
<line x1="612" y1="381" x2="642" y2="381" stroke="#9f7aea" stroke-width="1"/>
<text x="627" y="410" text-anchor="middle" font-size="9" fill="#6b46c1">idx_pu</text>
<line x1="644" y1="374" x2="694" y2="374" stroke="#6b46c1" stroke-width="1.5"/>
<polygon points="694,374 684,370 684,378" fill="#6b46c1"/>
<text x="700" y="366" font-size="11" fill="#276749">with index:</text>
<rect x="700" y="372" width="18" height="12" rx="2" fill="#c6f6d5" stroke="#276749" stroke-width="1"/>
<text x="724" y="382" font-size="10" fill="#276749">SEARCH via idx_pu &#8594; &#8776;875 rows (&#8776;2 ms)</text>

<!-- footer summary -->
<line x1="40" y1="470" x2="900" y2="470" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="490" width="16" height="16" fill="#4299e1" stroke="#2b6cb0"/>
<text x="64" y="503" font-size="12" fill="#4a5568">on-disk store (rows never re-streamed)</text>
<rect x="330" y="490" width="16" height="16" fill="#48bb78" stroke="#276749"/>
<text x="354" y="503" font-size="12" fill="#4a5568">tiny SQL result out</text>
<rect x="500" y="490" width="16" height="16" fill="#9f7aea" stroke="#6b46c1"/>
<text x="524" y="503" font-size="12" fill="#4a5568">index turns a full SCAN into a targeted SEARCH</text>

<text x="470" y="548" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Stream 2,964,624 rows in once (186 MB on disk); then aggregate ~3M rows into 10, or</text>
<text x="470" y="572" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">index a selective lookup from a 2.96M-row SCAN down to a handful of rows &#8212; all without loading it all into RAM.</text>
<text x="470" y="606" text-anchor="middle" font-size="12" fill="#718096">Bigger than RAM, fits on disk, queried with SQL &#8212; exactly SQLite's sweet spot for a laptop-scale local warehouse.</text>
</svg>
