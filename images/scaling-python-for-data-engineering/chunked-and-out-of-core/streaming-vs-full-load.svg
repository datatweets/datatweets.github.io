<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <!-- Titles -->
  <text x="225" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Load whole file into RAM</text>
  <text x="675" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Stream in chunks</text>

  <!-- divider -->
  <line x1="450" y1="60" x2="450" y2="520" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===================== LEFT: FULL LOAD ===================== -->
  <!-- big file on disk -->
  <rect x="70" y="80" width="90" height="150" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="115" y="70" text-anchor="middle" font-size="13" fill="#4a5568">file on disk</text>
  <line x1="82" y1="104" x2="148" y2="104" stroke="#4299e1" stroke-width="2"/>
  <line x1="82" y1="120" x2="148" y2="120" stroke="#4299e1" stroke-width="2"/>
  <line x1="82" y1="136" x2="148" y2="136" stroke="#4299e1" stroke-width="2"/>
  <line x1="82" y1="152" x2="148" y2="152" stroke="#4299e1" stroke-width="2"/>
  <line x1="82" y1="168" x2="148" y2="168" stroke="#4299e1" stroke-width="2"/>
  <line x1="82" y1="184" x2="148" y2="184" stroke="#4299e1" stroke-width="2"/>
  <line x1="82" y1="200" x2="148" y2="200" stroke="#4299e1" stroke-width="2"/>
  <text x="115" y="250" text-anchor="middle" font-size="12" fill="#718096">2,964,624 rows</text>

  <!-- arrow -->
  <line x1="175" y1="155" x2="225" y2="155" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="225,155 213,149 213,161" fill="#4a5568"/>
  <text x="200" y="145" text-anchor="middle" font-size="12" fill="#4a5568">read_all</text>

  <!-- big red memory block -->
  <rect x="245" y="90" width="150" height="330" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2.5"/>
  <rect x="245" y="90" width="150" height="330" rx="8" fill="#fc8181" fill-opacity="0.35"/>
  <text x="320" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#c53030">RAM</text>
  <text x="320" y="250" text-anchor="middle" font-size="22" font-weight="700" fill="#c53030">399 MB</text>
  <text x="320" y="278" text-anchor="middle" font-size="13" fill="#c53030">all rows at once</text>
  <text x="320" y="452" text-anchor="middle" font-size="14" font-weight="700" fill="#c53030">may not fit</text>
  <text x="320" y="472" text-anchor="middle" font-size="12" fill="#718096">grows with file size</text>

  <!-- ===================== RIGHT: STREAMING ===================== -->
  <!-- big file on disk -->
  <rect x="500" y="80" width="90" height="150" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="545" y="70" text-anchor="middle" font-size="13" fill="#4a5568">file on disk</text>
  <line x1="512" y1="104" x2="578" y2="104" stroke="#4299e1" stroke-width="2"/>
  <line x1="512" y1="120" x2="578" y2="120" stroke="#4299e1" stroke-width="2"/>
  <line x1="512" y1="136" x2="578" y2="136" stroke="#4299e1" stroke-width="2"/>
  <line x1="512" y1="152" x2="578" y2="152" stroke="#4299e1" stroke-width="2"/>
  <line x1="512" y1="168" x2="578" y2="168" stroke="#4299e1" stroke-width="2"/>
  <line x1="512" y1="184" x2="578" y2="184" stroke="#4299e1" stroke-width="2"/>
  <line x1="512" y1="200" x2="578" y2="200" stroke="#4299e1" stroke-width="2"/>
  <text x="545" y="250" text-anchor="middle" font-size="12" fill="#718096">2,964,624 rows</text>

  <!-- sliding fixed-size green window -->
  <text x="700" y="70" text-anchor="middle" font-size="13" fill="#276749">one chunk in RAM at a time</text>
  <!-- three ghosted window positions to imply sliding -->
  <rect x="628" y="90" width="70" height="60" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <rect x="628" y="240" width="70" height="60" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- active window -->
  <rect x="628" y="165" width="70" height="60" rx="6" fill="#48bb78" fill-opacity="0.35" stroke="#276749" stroke-width="2.5"/>
  <text x="663" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">27 MB</text>
  <text x="663" y="208" text-anchor="middle" font-size="11" fill="#276749">1 chunk</text>

  <!-- slide arrows -->
  <line x1="663" y1="150" x2="663" y2="164" stroke="#a0aec0" stroke-width="2"/>
  <polygon points="663,166 658,156 668,156" fill="#a0aec0"/>
  <line x1="663" y1="226" x2="663" y2="239" stroke="#a0aec0" stroke-width="2"/>
  <polygon points="663,241 658,231 668,231" fill="#a0aec0"/>

  <text x="663" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">footprint is CONSTANT</text>
  <text x="663" y="349" text-anchor="middle" font-size="11" fill="#718096">same for a file of any size</text>

  <!-- arrow to running result -->
  <line x1="702" y1="195" x2="760" y2="195" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="760,195 748,189 748,201" fill="#4a5568"/>
  <text x="731" y="185" text-anchor="middle" font-size="11" fill="#4a5568">do work</text>

  <!-- tiny running result -->
  <rect x="770" y="172" width="60" height="46" rx="6" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/>
  <text x="800" y="192" text-anchor="middle" font-size="11" fill="#6b46c1">running</text>
  <text x="800" y="207" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">result</text>

  <text x="663" y="452" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">fits any size</text>
  <text x="663" y="472" text-anchor="middle" font-size="12" fill="#718096">flat memory, all 2.96M rows seen</text>

  <!-- bottom rule -->
  <text x="450" y="530" text-anchor="middle" font-size="14" font-weight="600" fill="#1a202c">Read a piece &#8594; do work &#8594; keep a small result &#8594; drop the piece</text>
</svg>
