<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Measured speedup vs. worker count &#8212; and the plateau</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#4a5568">Per-zone/day aggregation over ~6.0M NYC taxi trips, 6 row-group partitions</text>

  <!-- plot frame -->
  <line x1="90" y1="80" x2="90" y2="410" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="90" y1="410" x2="680" y2="410" stroke="#1a202c" stroke-width="1.5"/>
  <text x="34" y="250" text-anchor="middle" font-size="13" fill="#4a5568" transform="rotate(-90 34 250)">speedup (serial time / parallel time)</text>
  <text x="385" y="448" text-anchor="middle" font-size="13" fill="#4a5568">worker processes</text>

  <!-- y gridlines + ticks 0..8 -->
  <g font-size="11" fill="#718096">
    <line x1="90" y1="410" x2="680" y2="410" stroke="#e2e8f0" stroke-width="1"/>
    <text x="82" y="414" text-anchor="end">0</text>
    <line x1="90" y1="368.75" x2="680" y2="368.75" stroke="#e2e8f0" stroke-width="1"/>
    <text x="82" y="372.75" text-anchor="end">1</text>
    <line x1="90" y1="327.5" x2="680" y2="327.5" stroke="#e2e8f0" stroke-width="1"/>
    <text x="82" y="331.5" text-anchor="end">2</text>
    <line x1="90" y1="286.25" x2="680" y2="286.25" stroke="#e2e8f0" stroke-width="1"/>
    <text x="82" y="290.25" text-anchor="end">3</text>
    <line x1="90" y1="245" x2="680" y2="245" stroke="#e2e8f0" stroke-width="1"/>
    <text x="82" y="249" text-anchor="end">4</text>
    <line x1="90" y1="203.75" x2="680" y2="203.75" stroke="#e2e8f0" stroke-width="1"/>
    <text x="82" y="207.75" text-anchor="end">5</text>
    <line x1="90" y1="162.5" x2="680" y2="162.5" stroke="#e2e8f0" stroke-width="1"/>
    <text x="82" y="166.5" text-anchor="end">6</text>
    <line x1="90" y1="121.25" x2="680" y2="121.25" stroke="#e2e8f0" stroke-width="1"/>
    <text x="82" y="125.25" text-anchor="end">7</text>
    <line x1="90" y1="80" x2="680" y2="80" stroke="#e2e8f0" stroke-width="1"/>
    <text x="82" y="84" text-anchor="end">8</text>
  </g>

  <!-- x ticks -->
  <g font-size="11" fill="#718096" text-anchor="middle">
    <text x="161.25" y="428">1</text>
    <text x="232.5" y="428">2</text>
    <text x="375" y="428">4</text>
    <text x="517.5" y="428">6</text>
    <text x="660" y="428">8</text>
  </g>

  <!-- ideal linear speedup line: (0,0)-(8,8) -->
  <line x1="90" y1="410" x2="660" y2="80" stroke="#a0aec0" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="612" y="100" font-size="12" fill="#718096" font-style="italic">ideal: speedup = workers</text>

  <!-- Amdahl fit curve p=0.918 through the measured points (poly-approx) -->
  <path d="M 161.25 369.4 Q 260 322 375 291 T 517.5 234 L 660 224" fill="none" stroke="#4299e1" stroke-width="2.5"/>

  <!-- measured points -->
  <g>
    <circle cx="161.25" cy="369.6" r="5.5" fill="#2b6cb0"/>
    <circle cx="232.5" cy="334.1" r="5.5" fill="#2b6cb0"/>
    <circle cx="375" cy="299.0" r="5.5" fill="#2b6cb0"/>
    <circle cx="517.5" cy="234.3" r="5.5" fill="#2b6cb0"/>
    <circle cx="660" cy="231.4" r="5.5" fill="#2b6cb0"/>
  </g>
  <g font-size="11" fill="#2b6cb0" font-weight="700" text-anchor="middle">
    <text x="161.25" y="388">0.98&#215;</text>
    <text x="232.5" y="326">1.84&#215;</text>
    <text x="375" y="291">2.69&#215;</text>
    <text x="517.5" y="226">4.26&#215;</text>
    <text x="672" y="225" text-anchor="start">4.33&#215;</text>
  </g>

  <!-- plateau annotation at 6->8 -->
  <line x1="517.5" y1="234.3" x2="660" y2="231.4" stroke="#ed8936" stroke-width="3"/>
  <rect x="470" y="150" width="212" height="52" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="1.2"/>
  <text x="576" y="168" text-anchor="middle" font-size="11" fill="#c05621" font-weight="700">plateau: only 6 partitions,</text>
  <text x="576" y="183" text-anchor="middle" font-size="11" fill="#c05621">so the 8th worker has no</text>
  <text x="576" y="196" text-anchor="middle" font-size="11" fill="#c05621">extra work &#8212; 4.26&#215; &#8594; 4.33&#215;</text>

  <!-- lost-speedup bracket at w=8 -->
  <line x1="672" y1="80" x2="672" y2="231.4" stroke="#fc8181" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="678" y="150" font-size="10.5" fill="#c53030">gap = speedup lost to</text>
  <text x="678" y="164" font-size="10.5" fill="#c53030">the serial 8% (Amdahl)</text>

  <!-- serial fraction callout -->
  <rect x="118" y="96" width="286" height="46" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.2"/>
  <text x="130" y="115" font-size="12" fill="#2b6cb0" font-weight="700">Amdahl fit: p &#8776; 0.92 parallelizable</text>
  <text x="130" y="132" font-size="12" fill="#2b6cb0">ceiling S(&#8734;) = 1/(1-p) &#8776; 12&#215; &#8212; never reached</text>
</svg>
