<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <!-- Column headers -->
  <text x="115" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">6 partitions</text>
  <text x="115" y="52" text-anchor="middle" font-size="12" fill="#718096">row groups &#183; ~1M rows each</text>

  <text x="345" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#276749">MAP &#183; parallel</text>
  <text x="345" y="52" text-anchor="middle" font-size="12" fill="#718096">one process per core</text>

  <text x="585" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#c05621">REDUCE &#183; serial</text>
  <text x="585" y="52" text-anchor="middle" font-size="12" fill="#718096">combine the partials</text>

  <text x="795" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#6b46c1">final result</text>
  <text x="795" y="52" text-anchor="middle" font-size="12" fill="#718096">one small frame</text>

  <!-- Partition boxes (blue) -->
  <g>
    <rect x="30" y="72" width="170" height="40" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="115" y="97" text-anchor="middle" font-size="13" fill="#2b6cb0">Jan &#183; row group 0</text>
    <rect x="30" y="140" width="170" height="40" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="115" y="165" text-anchor="middle" font-size="13" fill="#2b6cb0">Jan &#183; row group 1</text>
    <rect x="30" y="208" width="170" height="40" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="115" y="233" text-anchor="middle" font-size="13" fill="#2b6cb0">Jan &#183; row group 2</text>
    <rect x="30" y="276" width="170" height="40" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="115" y="301" text-anchor="middle" font-size="13" fill="#2b6cb0">Feb &#183; row group 0</text>
    <rect x="30" y="344" width="170" height="40" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="115" y="369" text-anchor="middle" font-size="13" fill="#2b6cb0">Feb &#183; row group 1</text>
    <rect x="30" y="412" width="170" height="40" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="115" y="437" text-anchor="middle" font-size="13" fill="#2b6cb0">Feb &#183; row group 2</text>
  </g>

  <!-- Map worker boxes (green) -->
  <g>
    <rect x="255" y="72" width="180" height="40" rx="6" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
    <text x="345" y="91" text-anchor="middle" font-size="12" fill="#276749">map_partition()</text>
    <text x="345" y="106" text-anchor="middle" font-size="11" fill="#48bb78">sum,count per zone &#183; ~250 rows</text>
    <rect x="255" y="140" width="180" height="40" rx="6" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
    <text x="345" y="159" text-anchor="middle" font-size="12" fill="#276749">map_partition()</text>
    <text x="345" y="174" text-anchor="middle" font-size="11" fill="#48bb78">sum,count per zone &#183; ~250 rows</text>
    <rect x="255" y="208" width="180" height="40" rx="6" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
    <text x="345" y="227" text-anchor="middle" font-size="12" fill="#276749">map_partition()</text>
    <text x="345" y="242" text-anchor="middle" font-size="11" fill="#48bb78">sum,count per zone &#183; ~250 rows</text>
    <rect x="255" y="276" width="180" height="40" rx="6" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
    <text x="345" y="295" text-anchor="middle" font-size="12" fill="#276749">map_partition()</text>
    <text x="345" y="310" text-anchor="middle" font-size="11" fill="#48bb78">sum,count per zone &#183; ~250 rows</text>
    <rect x="255" y="344" width="180" height="40" rx="6" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
    <text x="345" y="363" text-anchor="middle" font-size="12" fill="#276749">map_partition()</text>
    <text x="345" y="378" text-anchor="middle" font-size="11" fill="#48bb78">sum,count per zone &#183; ~250 rows</text>
    <rect x="255" y="412" width="180" height="40" rx="6" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
    <text x="345" y="431" text-anchor="middle" font-size="12" fill="#276749">map_partition()</text>
    <text x="345" y="446" text-anchor="middle" font-size="11" fill="#48bb78">sum,count per zone &#183; ~250 rows</text>
  </g>

  <!-- Arrows: partition -> map -->
  <g stroke="#a0aec0" stroke-width="1.5" fill="none">
    <line x1="200" y1="92" x2="249" y2="92"/>
    <line x1="200" y1="160" x2="249" y2="160"/>
    <line x1="200" y1="228" x2="249" y2="228"/>
    <line x1="200" y1="296" x2="249" y2="296"/>
    <line x1="200" y1="364" x2="249" y2="364"/>
    <line x1="200" y1="432" x2="249" y2="432"/>
  </g>
  <g fill="#a0aec0">
    <polygon points="249,92 241,88 241,96"/>
    <polygon points="249,160 241,156 241,164"/>
    <polygon points="249,228 241,224 241,232"/>
    <polygon points="249,296 241,292 241,300"/>
    <polygon points="249,364 241,360 241,368"/>
    <polygon points="249,432 241,428 241,436"/>
  </g>

  <!-- Reduce box (orange) -->
  <rect x="510" y="182" width="150" height="160" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
  <text x="585" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">REDUCE</text>
  <text x="585" y="240" text-anchor="middle" font-size="11" fill="#ed8936">pd.concat(partials)</text>
  <text x="585" y="258" text-anchor="middle" font-size="11" fill="#ed8936">.groupby(level=0)</text>
  <text x="585" y="276" text-anchor="middle" font-size="11" fill="#ed8936">.sum()</text>
  <text x="585" y="304" text-anchor="middle" font-size="11" fill="#c05621">then sum / count</text>
  <text x="585" y="322" text-anchor="middle" font-size="11" fill="#c05621">&#8594; mean fare</text>

  <!-- Arrows: map -> reduce (converge) -->
  <g stroke="#ed8936" stroke-width="1.5" fill="none">
    <path d="M435 92 C 475 92, 475 262, 509 262"/>
    <path d="M435 160 C 475 160, 475 262, 509 262"/>
    <path d="M435 228 C 480 228, 480 262, 509 262"/>
    <path d="M435 296 C 480 296, 480 262, 509 262"/>
    <path d="M435 364 C 475 364, 475 262, 509 262"/>
    <path d="M435 432 C 475 432, 475 262, 509 262"/>
  </g>
  <polygon points="509,262 501,258 501,266" fill="#ed8936"/>

  <!-- Arrow reduce -> result -->
  <line x1="660" y1="262" x2="708" y2="262" stroke="#6b46c1" stroke-width="1.5"/>
  <polygon points="708,262 700,258 700,266" fill="#6b46c1"/>

  <!-- Result box (purple) -->
  <rect x="710" y="228" width="170" height="68" rx="8" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/>
  <text x="795" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">261 zones</text>
  <text x="795" y="278" text-anchor="middle" font-size="11" fill="#9f7aea">sum &#183; count &#183; mean_fare</text>

  <!-- Parallel bracket annotation -->
  <text x="345" y="490" text-anchor="middle" font-size="12" font-style="italic" fill="#718096">all six run at the same time</text>
  <text x="585" y="490" text-anchor="middle" font-size="12" font-style="italic" fill="#718096">one combine, in the parent</text>

  <!-- Bottom takeaway -->
  <text x="450" y="528" text-anchor="middle" font-size="13" fill="#4a5568">Big data in (~6M rows) &#8594; small partials out (~250 rows each) &#8594; one final answer &#8212; the same shape Spark and Hadoop scale to a cluster.</text>
</svg>
