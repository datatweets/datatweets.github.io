<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="820" height="470" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a202c">Broadcasting a (4,) vector across a (200000, 4) array</text>
  <text x="410" y="58" text-anchor="middle" font-size="14" fill="#4a5568">Centering four money columns: subtract each column's mean from every row &#8212; no copy of the vector is made</text>

  <!-- ===== LEFT: the (N, 4) array M ===== -->
  <text x="150" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">M &#8212; array, shape (200000, 4)</text>
  <rect x="60" y="110" width="180" height="210" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
  <!-- rows -->
  <text x="150" y="140" text-anchor="middle" font-size="13" fill="#2b6cb0">17.14&#8195;70.00&#8195;8.27&#8195;90.96</text>
  <text x="150" y="164" text-anchor="middle" font-size="13" fill="#2b6cb0">&#8194;2.49&#8195;13.50&#8195;4.00&#8195;22.50</text>
  <text x="150" y="188" text-anchor="middle" font-size="13" fill="#2b6cb0">&#8194;1.84&#8195;10.00&#8195;0.00&#8195;12.50</text>
  <text x="150" y="212" text-anchor="middle" font-size="15" fill="#a0aec0">&#8942;&#8195;&#8195;&#8942;&#8195;&#8195;&#8942;&#8195;&#8195;&#8942;</text>
  <text x="150" y="244" text-anchor="middle" font-size="13" fill="#2b6cb0">&#8194;3.60&#8195;23.30&#8195;5.65&#8195;33.95</text>
  <text x="150" y="300" text-anchor="middle" font-size="12" fill="#4a5568">200,000 rows &#215; 4 columns</text>
  <text x="150" y="315" text-anchor="middle" font-size="12" fill="#4a5568">6.4 MB in RAM</text>

  <!-- minus sign -->
  <text x="290" y="220" text-anchor="middle" font-size="40" font-weight="700" fill="#4a5568">&#8722;</text>

  <!-- ===== MIDDLE: the (4,) vector ===== -->
  <text x="410" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">col_means &#8212; vector, shape (4,)</text>
  <rect x="330" y="192" width="160" height="34" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="410" y="214" text-anchor="middle" font-size="13" fill="#276749">3.58&#8195;18.11&#8195;3.33&#8195;26.72</text>
  <text x="410" y="250" text-anchor="middle" font-size="12" fill="#4a5568">just 32 bytes &#8212; one row</text>

  <!-- ghost / stretched copies: the vector conceptually repeated per row, drawn dashed -->
  <rect x="330" y="122" width="160" height="30" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.55"/>
  <text x="410" y="142" text-anchor="middle" font-size="12" fill="#276749" opacity="0.7">3.58&#8195;18.11&#8195;3.33&#8195;26.72</text>
  <rect x="330" y="157" width="160" height="30" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.55"/>
  <text x="410" y="177" text-anchor="middle" font-size="12" fill="#276749" opacity="0.7">3.58&#8195;18.11&#8195;3.33&#8195;26.72</text>
  <rect x="330" y="231" width="160" height="30" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>
  <text x="410" y="251" text-anchor="middle" font-size="12" fill="#276749" opacity="0.55">3.58&#8195;18.11&#8195;3.33&#8195;26.72</text>

  <!-- stretch label -->
  <rect x="322" y="286" width="176" height="46" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="2"/>
  <text x="410" y="305" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b46c1">stretched across all rows</text>
  <text x="410" y="322" text-anchor="middle" font-size="12" fill="#6b46c1">virtually &#8212; not actually copied</text>

  <!-- equals sign -->
  <text x="540" y="220" text-anchor="middle" font-size="40" font-weight="700" fill="#4a5568">=</text>

  <!-- ===== RIGHT: centered result ===== -->
  <text x="680" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">centered &#8212; shape (200000, 4)</text>
  <rect x="590" y="110" width="180" height="210" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="2"/>
  <text x="680" y="140" text-anchor="middle" font-size="13" fill="#c05621">13.56&#8195;51.89&#8195;4.94&#8195;64.24</text>
  <text x="680" y="164" text-anchor="middle" font-size="13" fill="#c05621">-1.09&#8194;-4.61&#8195;0.67&#8194;-4.22</text>
  <text x="680" y="188" text-anchor="middle" font-size="13" fill="#c05621">-1.74&#8194;-8.11&#8194;-3.33&#8194;-14.22</text>
  <text x="680" y="212" text-anchor="middle" font-size="15" fill="#a0aec0">&#8942;&#8195;&#8195;&#8942;&#8195;&#8195;&#8942;&#8195;&#8195;&#8942;</text>
  <text x="680" y="244" text-anchor="middle" font-size="13" fill="#c05621">&#8194;0.02&#8195;5.19&#8195;2.32&#8195;&#8194;7.23</text>
  <text x="680" y="300" text-anchor="middle" font-size="12" fill="#4a5568">each column now averages 0</text>
  <text x="680" y="315" text-anchor="middle" font-size="12" fill="#4a5568">same shape as M</text>

  <!-- ===== bottom rule bar ===== -->
  <rect x="60" y="356" width="710" height="90" rx="8" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="382" font-size="14" font-weight="700" fill="#1a202c">The rule (compare shapes right-to-left):</text>
  <text x="80" y="406" font-size="13" fill="#4a5568">M is (200000, 4)&#8195;&#8195;col_means is</text>
  <text x="310" y="406" font-size="13" font-weight="700" fill="#276749">(4,)</text>
  <text x="80" y="428" font-size="13" fill="#4a5568">Last axis: 4 vs 4 &#8212; equal, OK.&#8195;&#8195;Next axis: 200000 vs (missing) &#8212; treated as 1, so the vector repeats down all rows.</text>
</svg>
