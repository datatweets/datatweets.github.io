<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>
  <text x="390" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1a202c">One month of NYC yellow-taxi trips</text>
  <text x="390" y="62" text-anchor="middle" font-size="14" fill="#4a5568">2,964,624 rows &#215; 19 columns &#8212; the same data, two very different sizes</text>

  <!-- baseline -->
  <line x1="70" y1="392" x2="710" y2="392" stroke="#e2e8f0" stroke-width="2"/>

  <!-- disk bar: 47.6 MB scaled small -->
  <rect x="150" y="356" width="140" height="36" rx="4" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
  <text x="220" y="379" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">47.6 MB</text>
  <text x="220" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">On disk (.parquet)</text>
  <text x="220" y="437" text-anchor="middle" font-size="12" fill="#4a5568">compressed, columnar</text>

  <!-- RAM bar: 398.6 MB scaled to 300px tall -->
  <rect x="490" y="92" width="140" height="300" rx="4" fill="#fffaf0" stroke="#ed8936" stroke-width="2"/>
  <text x="560" y="248" text-anchor="middle" font-size="16" font-weight="700" fill="#c05621">398.6 MB</text>
  <text x="560" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">In pandas (RAM)</text>
  <text x="560" y="437" text-anchor="middle" font-size="12" fill="#4a5568">full-width dtypes</text>

  <!-- expansion arrow -->
  <line x1="300" y1="240" x2="470" y2="240" stroke="#a0aec0" stroke-width="2.5" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a0aec0"/>
    </marker>
  </defs>
  <rect x="335" y="214" width="104" height="30" rx="15" fill="#fff5f5" stroke="#fc8181" stroke-width="2"/>
  <text x="387" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#c53030">8.4&#215; bigger</text>
  <text x="387" y="196" text-anchor="middle" font-size="13" fill="#4a5568">read_parquet()</text>
</svg>
