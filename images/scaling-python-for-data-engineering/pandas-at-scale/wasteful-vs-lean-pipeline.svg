<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a202c">Same result, two very different memory footprints</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#718096">Per-zone trip stats from the 200,000-row taxi sample</text>

  <!-- ================= WASTEFUL SIDE ================= -->
  <rect x="30" y="80" width="380" height="400" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="2"/>
  <text x="220" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#c53030">Wasteful: named intermediates</text>
  <text x="220" y="128" text-anchor="middle" font-size="12" fill="#c53030">every step keeps a fresh copy alive</text>

  <!-- stack of copies -->
  <g font-size="12" fill="#1a202c">
    <rect x="70" y="146" width="300" height="30" rx="5" fill="#ffffff" stroke="#fc8181" stroke-width="1.5"/>
    <text x="82" y="165" font-weight="600">df</text><text x="358" y="165" text-anchor="end" fill="#718096">raw read, 10 cols</text>

    <rect x="70" y="196" width="300" height="30" rx="5" fill="#ffffff" stroke="#fc8181" stroke-width="1.5"/>
    <text x="82" y="215" font-weight="600">df2</text><text x="358" y="215" text-anchor="end" fill="#718096">copy: filter fare &gt; 0</text>

    <rect x="70" y="246" width="300" height="30" rx="5" fill="#ffffff" stroke="#fc8181" stroke-width="1.5"/>
    <text x="82" y="265" font-weight="600">df3</text><text x="358" y="265" text-anchor="end" fill="#718096">copy: add duration_min</text>

    <rect x="70" y="296" width="300" height="30" rx="5" fill="#ffffff" stroke="#fc8181" stroke-width="1.5"/>
    <text x="82" y="315" font-weight="600">df4 / df5</text><text x="358" y="315" text-anchor="end" fill="#718096">copy: filter, add tip_pct</text>

    <rect x="70" y="346" width="300" height="30" rx="5" fill="#ffffff" stroke="#fc8181" stroke-width="1.5"/>
    <text x="82" y="365" font-weight="600">df6</text><text x="358" y="365" text-anchor="end" fill="#718096">copy: select 3 columns</text>
  </g>

  <!-- arrows between copies -->
  <g stroke="#c53030" stroke-width="1.5" fill="#c53030">
    <line x1="220" y1="176" x2="220" y2="194"/><polygon points="220,196 216,190 224,190"/>
    <line x1="220" y1="226" x2="220" y2="244"/><polygon points="220,246 216,240 224,240"/>
    <line x1="220" y1="276" x2="220" y2="294"/><polygon points="220,296 216,290 224,290"/>
    <line x1="220" y1="326" x2="220" y2="344"/><polygon points="220,346 216,340 224,340"/>
  </g>

  <rect x="70" y="406" width="300" height="50" rx="6" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="220" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">peak memory</text>
  <text x="220" y="448" text-anchor="middle" font-size="18" font-weight="700" fill="#c53030">106 MB</text>

  <!-- ================= LEAN SIDE ================= -->
  <rect x="490" y="80" width="380" height="400" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="680" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#276749">Lean: one method chain</text>
  <text x="680" y="128" text-anchor="middle" font-size="12" fill="#276749">read only needed columns, no names</text>

  <g font-size="12.5" fill="#1a202c">
    <rect x="530" y="150" width="300" height="34" rx="5" fill="#ffffff" stroke="#48bb78" stroke-width="1.5"/>
    <text x="545" y="172" font-weight="600" fill="#276749">read_csv(usecols=5)</text>

    <rect x="530" y="204" width="300" height="34" rx="5" fill="#ffffff" stroke="#48bb78" stroke-width="1.5"/>
    <text x="545" y="226" font-weight="600" fill="#276749">.query("fare &gt; 0")</text>

    <rect x="530" y="258" width="300" height="34" rx="5" fill="#ffffff" stroke="#48bb78" stroke-width="1.5"/>
    <text x="545" y="280" font-weight="600" fill="#276749">.assign(duration, tip_pct)</text>

    <rect x="530" y="312" width="300" height="34" rx="5" fill="#ffffff" stroke="#48bb78" stroke-width="1.5"/>
    <text x="545" y="334" font-weight="600" fill="#276749">.groupby("PULocationID").agg(...)</text>
  </g>

  <g stroke="#276749" stroke-width="1.5" fill="#276749">
    <line x1="680" y1="184" x2="680" y2="202"/><polygon points="680,204 676,198 684,198"/>
    <line x1="680" y1="238" x2="680" y2="256"/><polygon points="680,258 676,252 684,252"/>
    <line x1="680" y1="292" x2="680" y2="310"/><polygon points="680,312 676,306 684,306"/>
  </g>

  <text x="680" y="378" text-anchor="middle" font-size="12" fill="#276749">no intermediate DataFrame is ever named</text>

  <rect x="530" y="406" width="300" height="50" rx="6" fill="#c6f6d5" stroke="#276749" stroke-width="2"/>
  <text x="680" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">peak memory</text>
  <text x="680" y="448" text-anchor="middle" font-size="18" font-weight="700" fill="#276749">40 MB</text>

  <!-- verdict banner -->
  <rect x="250" y="500" width="400" height="42" rx="21" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="450" y="527" text-anchor="middle" font-size="15" font-weight="700" fill="#2b6cb0">2.7x less peak memory, identical output</text>
</svg>
