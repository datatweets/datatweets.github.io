<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="820" height="690" fill="#ffffff"/>

  <!-- ===================== TOP PANEL: how category stores data ===================== -->
  <text x="410" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">How the category dtype stores a column</text>
  <text x="410" y="56" text-anchor="middle" font-size="13" fill="#718096">pickup_borough &#8212; 200,000 rows, only 7 distinct values</text>

  <!-- LEFT: as text -->
  <text x="200" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">Stored as text (object / string)</text>

  <!-- repeated string cells -->
  <g font-size="12" fill="#1a202c">
    <rect x="90" y="104" width="220" height="26" rx="4" fill="#fffaf0" stroke="#ed8936"/>
    <text x="200" y="121" text-anchor="middle">"Manhattan"</text>
    <rect x="90" y="134" width="220" height="26" rx="4" fill="#fffaf0" stroke="#ed8936"/>
    <text x="200" y="151" text-anchor="middle">"Queens"</text>
    <rect x="90" y="164" width="220" height="26" rx="4" fill="#fffaf0" stroke="#ed8936"/>
    <text x="200" y="181" text-anchor="middle">"Manhattan"</text>
    <rect x="90" y="194" width="220" height="26" rx="4" fill="#fffaf0" stroke="#ed8936"/>
    <text x="200" y="211" text-anchor="middle">"Brooklyn"</text>
    <rect x="90" y="224" width="220" height="26" rx="4" fill="#fffaf0" stroke="#ed8936"/>
    <text x="200" y="241" text-anchor="middle">"Manhattan"</text>
  </g>
  <text x="200" y="270" text-anchor="middle" font-size="12" fill="#718096">&#8942; every one of 200,000 rows</text>
  <text x="200" y="286" text-anchor="middle" font-size="12" fill="#718096">stores the full word again</text>
  <rect x="90" y="300" width="220" height="34" rx="6" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
  <text x="200" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#c05621">3.21 MB</text>

  <!-- RIGHT: as category -->
  <text x="620" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">Stored as category</text>

  <!-- categories table -->
  <text x="530" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">one shared table</text>
  <g font-size="11" fill="#1a202c">
    <rect x="470" y="120" width="120" height="22" rx="3" fill="#f0fff4" stroke="#48bb78"/>
    <text x="480" y="135">0 &#8594; "EWR"</text>
    <rect x="470" y="142" width="120" height="22" rx="3" fill="#f0fff4" stroke="#48bb78"/>
    <text x="480" y="157">1 &#8594; "Manhattan"</text>
    <rect x="470" y="164" width="120" height="22" rx="3" fill="#f0fff4" stroke="#48bb78"/>
    <text x="480" y="179">2 &#8594; "Queens"</text>
    <rect x="470" y="186" width="120" height="22" rx="3" fill="#f0fff4" stroke="#48bb78"/>
    <text x="480" y="201">&#8230; 7 rows total</text>
  </g>

  <!-- codes column -->
  <text x="700" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">1 tiny code / row</text>
  <g font-size="12" fill="#276749" font-weight="700">
    <rect x="670" y="120" width="60" height="20" rx="3" fill="#f0fff4" stroke="#48bb78"/>
    <text x="700" y="135" text-anchor="middle">1</text>
    <rect x="670" y="142" width="60" height="20" rx="3" fill="#f0fff4" stroke="#48bb78"/>
    <text x="700" y="157" text-anchor="middle">2</text>
    <rect x="670" y="164" width="60" height="20" rx="3" fill="#f0fff4" stroke="#48bb78"/>
    <text x="700" y="179" text-anchor="middle">1</text>
    <rect x="670" y="186" width="60" height="20" rx="3" fill="#f0fff4" stroke="#48bb78"/>
    <text x="700" y="201" text-anchor="middle">&#8942;</text>
  </g>

  <text x="620" y="270" text-anchor="middle" font-size="12" fill="#718096">the words are stored once;</text>
  <text x="620" y="286" text-anchor="middle" font-size="12" fill="#718096">rows hold a 1-byte integer code</text>
  <rect x="510" y="300" width="220" height="34" rx="6" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
  <text x="620" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#276749">0.19 MB</text>

  <!-- arrow between -->
  <text x="410" y="315" text-anchor="middle" font-size="16" font-weight="700" fill="#2b6cb0">16.8&#215;</text>
  <text x="410" y="331" text-anchor="middle" font-size="11" fill="#2b6cb0">smaller</text>

  <!-- divider -->
  <line x1="60" y1="368" x2="760" y2="368" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===================== BOTTOM PANEL: helps vs hurts ===================== -->
  <text x="410" y="404" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">When category helps &#8212; and when it hurts</text>
  <text x="410" y="426" text-anchor="middle" font-size="13" fill="#718096">deep memory of one column, measured on the 200,000-row sample</text>

  <!-- scale: 30.8 px per MB, bars start x=300 -->
  <!-- Group A: HELPS -->
  <text x="70" y="470" font-size="14" font-weight="700" fill="#276749">Low cardinality &#8212; HELPS</text>
  <text x="70" y="488" font-size="12" fill="#718096">pickup_borough (7 distinct)</text>

  <text x="292" y="475" text-anchor="end" font-size="12" fill="#4a5568">string</text>
  <rect x="300" y="464" width="99" height="18" rx="3" fill="#a0aec0"/>
  <text x="407" y="478" font-size="12" font-weight="700" fill="#4a5568">3.21 MB</text>

  <text x="292" y="501" text-anchor="end" font-size="12" fill="#4a5568">category</text>
  <rect x="300" y="490" width="8" height="18" rx="3" fill="#48bb78"/>
  <text x="316" y="504" font-size="12" font-weight="700" fill="#276749">0.19 MB &#8595; 16.8&#215; smaller</text>

  <!-- Group B: HURTS -->
  <text x="70" y="560" font-size="14" font-weight="700" fill="#c53030">Near-unique &#8212; HURTS</text>
  <text x="70" y="578" font-size="12" fill="#718096">pickup+dropoff timestamp (99.9% distinct)</text>

  <text x="292" y="565" text-anchor="end" font-size="12" fill="#4a5568">string</text>
  <rect x="300" y="554" width="276" height="18" rx="3" fill="#a0aec0"/>
  <text x="584" y="568" font-size="12" font-weight="700" fill="#4a5568">8.96 MB</text>

  <text x="292" y="591" text-anchor="end" font-size="12" fill="#4a5568">category</text>
  <rect x="300" y="580" width="300" height="18" rx="3" fill="#fc8181"/>
  <text x="608" y="594" font-size="12" font-weight="700" fill="#c53030">9.74 MB &#8593; 1.09&#215; bigger</text>

  <!-- takeaway -->
  <rect x="60" y="622" width="700" height="46" rx="8" fill="#ebf8ff" stroke="#4299e1"/>
  <text x="410" y="643" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">Few distinct values over many rows &#8594; category wins big.</text>
  <text x="410" y="660" text-anchor="middle" font-size="13" fill="#2b6cb0">Nearly-unique values &#8594; the categories table costs more than it saves.</text>
</svg>
