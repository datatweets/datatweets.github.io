<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="780" height="440" fill="#ffffff"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">load_taxi(): the measured memory win</text>
  <text x="390" y="56" text-anchor="middle" font-size="13" fill="#4a5568">Full month of NYC yellow-taxi trips &#8212; 2,964,624 rows, every value kept</text>

  <!-- baseline -->
  <line x1="70" y1="360" x2="470" y2="360" stroke="#a0aec0" stroke-width="1.5"/>

  <!-- Naive bar: 398.6 MB -> 270px tall, top at 90 -->
  <rect x="120" y="90" width="110" height="270" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
  <rect x="120" y="90" width="110" height="270" fill="#fc8181" fill-opacity="0.55"/>
  <text x="175" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#c53030">398.6 MB</text>
  <text x="175" y="382" text-anchor="middle" font-size="13" font-weight="600" fill="#1a202c">Naive load</text>
  <text x="175" y="400" text-anchor="middle" font-size="11" fill="#4a5568">19 columns, default dtypes</text>

  <!-- Lean bar: 115.9 MB -> 78px tall, top at 282 -->
  <rect x="330" y="282" width="110" height="78" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
  <rect x="330" y="282" width="110" height="78" fill="#48bb78" fill-opacity="0.6"/>
  <text x="385" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="#276749">115.9 MB</text>
  <text x="385" y="382" text-anchor="middle" font-size="13" font-weight="600" fill="#1a202c">load_taxi()</text>
  <text x="385" y="400" text-anchor="middle" font-size="11" fill="#4a5568">10 columns, lean dtypes</text>

  <!-- reduction arrow between bars -->
  <path d="M 238 150 L 322 210" stroke="#2b6cb0" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#2b6cb0"/>
    </marker>
  </defs>

  <!-- reduction callout -->
  <rect x="510" y="150" width="220" height="150" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="620" y="188" text-anchor="middle" font-size="40" font-weight="700" fill="#2b6cb0">3.4&#215;</text>
  <text x="620" y="212" text-anchor="middle" font-size="14" fill="#2b6cb0">smaller in memory</text>
  <line x1="536" y1="230" x2="704" y2="230" stroke="#90cdf4" stroke-width="1.5"/>
  <text x="620" y="262" text-anchor="middle" font-size="30" font-weight="700" fill="#276749">70.9%</text>
  <text x="620" y="284" text-anchor="middle" font-size="14" fill="#276749">of the memory saved</text>

  <!-- footnote on where lean memory now sits -->
  <text x="70" y="428" font-size="11" fill="#718096">After the cut, the two datetime columns (45.2 MB) are the heaviest part of the lean frame &#8212; the numeric wall is gone.</text>
</svg>
