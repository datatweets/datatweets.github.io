<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="320" fill="#ffffff" /><text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Workflow vs. agent: who chooses the steps?</text><rect x="24" y="56" width="320" height="232" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="184" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">Workflow</text><text x="184" y="100" text-anchor="middle" font-size="9.5" fill="#718096">you code a fixed path</text><rect x="124" y="116" width="120" height="30" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" /><text x="184" y="135" text-anchor="middle" font-size="10" fill="#2b6cb0">Step 1: extract</text><line x1="184" y1="146" x2="184" y2="160" stroke="#a0aec0" stroke-width="1.8" /><polygon points="184 160 179 151 189 151" fill="#a0aec0" /><rect x="124" y="160" width="120" height="30" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" /><text x="184" y="179" text-anchor="middle" font-size="10" fill="#2b6cb0">Step 2: summarize</text><line x1="184" y1="190" x2="184" y2="204" stroke="#a0aec0" stroke-width="1.8" /><polygon points="184 204 179 195 189 195" fill="#a0aec0" /><rect x="124" y="204" width="120" height="30" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.3" /><text x="184" y="223" text-anchor="middle" font-size="10" fill="#2b6cb0">Step 3: save</text><text x="184" y="262" text-anchor="middle" font-size="9.5" fill="#4a5568">Same steps every time.</text><text x="184" y="277" text-anchor="middle" font-size="9.5" fill="#4a5568">Predictable and easy to test.</text><rect x="376" y="56" width="320" height="232" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="536" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">Agent</text><text x="536" y="100" text-anchor="middle" font-size="9.5" fill="#718096">the model chooses the path</text><circle cx="536" cy="150" r="30" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.8" /><text x="536" y="147" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6b46c1">decide</text><text x="536" y="160" text-anchor="middle" font-size="8" fill="#805ad5">next step</text><line x1="512" y1="170" x2="450" y2="210" stroke="#9f7aea" stroke-width="1.6" /><polygon points="450 210 460 208 455 201" fill="#9f7aea" /><rect x="406" y="212" width="86" height="26" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1.2" /><text x="449" y="229" text-anchor="middle" font-size="9" fill="#276749">search</text><line x1="536" y1="180" x2="536" y2="212" stroke="#9f7aea" stroke-width="1.6" /><polygon points="536 212 531 203 541 203" fill="#9f7aea" /><rect x="495" y="212" width="82" height="26" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="1.2" /><text x="536" y="229" text-anchor="middle" font-size="9" fill="#c05621">calculate</text><line x1="560" y1="170" x2="622" y2="210" stroke="#9f7aea" stroke-width="1.6" /><polygon points="622 210 612 208 617 201" fill="#9f7aea" /><rect x="580" y="212" width="86" height="26" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.2" /><text x="623" y="229" text-anchor="middle" font-size="9" fill="#2b6cb0">look up</text><path d="M449 212C430 150 480 110 510 132" fill="none" stroke="#9f7aea" stroke-width="1.4" stroke-dasharray="4 3" /><polygon points="510 132 500 132 505 139" fill="#9f7aea" /><text x="536" y="262" text-anchor="middle" font-size="9.5" fill="#4a5568">Path depends on what it finds.</text><text x="536" y="277" text-anchor="middle" font-size="9.5" fill="#4a5568">Flexible — harder to predict.</text></svg>