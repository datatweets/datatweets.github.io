<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="340" fill="#ffffff" /><text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The agent loop: decide, act, observe, repeat</text><rect x="24" y="150" width="120" height="56" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="84" y="174" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">Goal</text><text x="84" y="191" text-anchor="middle" font-size="9" fill="#3182ce">what to accomplish</text><line x1="144" y1="178" x2="186" y2="178" stroke="#a0aec0" stroke-width="2" /><polygon points="186 178 176 173 176 183" fill="#a0aec0" /><rect x="190" y="138" width="170" height="80" rx="12" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.8" /><text x="275" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">Claude decides</text><text x="275" y="186" text-anchor="middle" font-size="9" fill="#805ad5">"Do I have the answer,</text><text x="275" y="199" text-anchor="middle" font-size="9" fill="#805ad5">or should I call a tool?"</text><line x1="360" y1="160" x2="430" y2="120" stroke="#48bb78" stroke-width="2" /><polygon points="430 120 420 121 424 129" fill="#48bb78" /><text x="372" y="120" font-size="8.5" font-weight="700" fill="#276749">needs a tool</text><rect x="432" y="92" width="160" height="52" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="512" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Act: run the tool</text><text x="512" y="130" text-anchor="middle" font-size="9" fill="#2f855a">your code executes it</text><line x1="592" y1="118" x2="636" y2="118" stroke="#a0aec0" stroke-width="2" /><polygon points="636 118 626 113 626 123" fill="#a0aec0" /><rect x="600" y="150" width="96" height="52" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" /><text x="648" y="171" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c05621">Observe</text><text x="648" y="188" text-anchor="middle" font-size="8.5" fill="#9c4221">the result</text><line x1="636" y1="118" x2="648" y2="150" stroke="#a0aec0" stroke-width="2" /><path d="M600 184C470 250 380 250 300 220" fill="none" stroke="#ed8936" stroke-width="1.8" stroke-dasharray="5 3" /><polygon points="300 220 311 219 306 212" fill="#ed8936" /><text x="430" y="258" text-anchor="middle" font-size="9" fill="#9c4221">feed the result back — loop again</text><line x1="360" y1="196" x2="430" y2="236" stroke="#2b6cb0" stroke-width="2" /><polygon points="430 236 420 231 424 239" fill="#2b6cb0" /><text x="378" y="238" font-size="8.5" font-weight="700" fill="#2b6cb0">done</text><rect x="432" y="262" width="160" height="48" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="512" y="283" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">Final answer</text><text x="512" y="299" text-anchor="middle" font-size="9" fill="#3182ce">stop the loop</text><text x="200" y="300" text-anchor="middle" font-size="10.5" fill="#718096">The model, not your code,</text><text x="200" y="315" text-anchor="middle" font-size="10.5" fill="#718096">chooses each next step.</text></svg>