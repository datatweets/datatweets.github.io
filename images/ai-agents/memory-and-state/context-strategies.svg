<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="350" fill="#ffffff" /><text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Three ways to keep the context from overflowing</text><rect x="40" y="58" width="150" height="240" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="115" y="78" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2d3748">growing history</text><line x1="48" y1="120" x2="182" y2="120" stroke="#e53e3e" stroke-width="1.5" stroke-dasharray="4 3" /><text x="115" y="134" text-anchor="middle" font-size="7.5" fill="#c53030">context limit</text><g><rect x="56" y="140" width="118" height="13" rx="3" fill="#bee3f8" /><rect x="56" y="156" width="118" height="13" rx="3" fill="#d6bcfa" /><rect x="56" y="172" width="118" height="13" rx="3" fill="#bee3f8" /><rect x="56" y="188" width="118" height="13" rx="3" fill="#d6bcfa" /><rect x="56" y="204" width="118" height="13" rx="3" fill="#bee3f8" /><rect x="56" y="220" width="118" height="13" rx="3" fill="#d6bcfa" /><rect x="56" y="236" width="118" height="13" rx="3" fill="#bee3f8" /><rect x="56" y="252" width="118" height="13" rx="3" fill="#feb2b2" /><rect x="56" y="268" width="118" height="13" rx="3" fill="#feb2b2" /></g><text x="115" y="290" text-anchor="middle" font-size="7.5" fill="#c53030">overflows past the limit</text><line x1="190" y1="178" x2="226" y2="178" stroke="#a0aec0" stroke-width="2" /><polygon points="226 178 217 173 217 183" fill="#a0aec0" /><rect x="232" y="62" width="456" height="72" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="250" y="84" font-size="12" font-weight="700" fill="#2b6cb0">1. Truncate</text><text x="250" y="102" font-size="9.5" fill="#3182ce">Drop the oldest turns; keep the first message and the most recent ones.</text><text x="250" y="120" font-size="9" fill="#718096">Simplest. Cheap. But you lose the dropped detail entirely.</text><rect x="232" y="142" width="456" height="72" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="250" y="164" font-size="12" font-weight="700" fill="#6b46c1">2. Summarize</text><text x="250" y="182" font-size="9.5" fill="#805ad5">Compress old turns into one short summary note; keep recent turns in full.</text><text x="250" y="200" font-size="9" fill="#718096">Keeps the gist of long history small. Costs an extra model call.</text><rect x="232" y="222" width="456" height="72" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="250" y="244" font-size="12" font-weight="700" fill="#276749">3. Retrieve</text><text x="250" y="262" font-size="9.5" fill="#2f855a">Keep facts in long-term memory; pull only the relevant ones into context.</text><text x="250" y="280" font-size="9" fill="#718096">Scales past any single session. Needs a vector store (next lessons).</text><text x="360" y="324" text-anchor="middle" font-size="10" fill="#718096">Real agents combine these: truncate or summarize the running history, and retrieve durable facts on demand.</text></svg>