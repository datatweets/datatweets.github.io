<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="350" fill="#ffffff" /><text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Two kinds of agent memory</text><rect x="24" y="54" width="320" height="262" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="184" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">Short-term: the messages list</text><text x="184" y="98" text-anchor="middle" font-size="9.5" fill="#718096">this conversation, in full detail</text><g font-size="8.5" font-family="monospace"><rect x="64" y="112" width="240" height="18" rx="4" fill="#ebf8ff" stroke="#90cdf4" stroke-width=".8" /><text x="72" y="125" fill="#2c5282">user: "Plan a trip to Japan."</text><rect x="64" y="134" width="240" height="18" rx="4" fill="#faf5ff" stroke="#d6bcfa" stroke-width=".8" /><text x="72" y="147" fill="#553c9a">assistant: tool_use get_weather...</text><rect x="64" y="156" width="240" height="18" rx="4" fill="#ebf8ff" stroke="#90cdf4" stroke-width=".8" /><text x="72" y="169" fill="#2c5282">user: tool_result "16°C..."</text><rect x="64" y="178" width="240" height="18" rx="4" fill="#faf5ff" stroke="#d6bcfa" stroke-width=".8" /><text x="72" y="191" fill="#553c9a">assistant: "Here's a plan..."</text><rect x="64" y="200" width="240" height="14" rx="4" fill="#edf2f7" stroke="#cbd5e0" stroke-width=".8" /><text x="72" y="210" fill="#718096">...grows with every step...</text></g><text x="184" y="244" text-anchor="middle" font-size="9.5" fill="#4a5568">Holds every turn of THIS run.</text><text x="184" y="259" text-anchor="middle" font-size="9.5" fill="#4a5568">Grows each step — and gone when</text><text x="184" y="273" text-anchor="middle" font-size="9.5" fill="#4a5568">the session ends.</text><rect x="60" y="286" width="248" height="22" rx="6" fill="#fff5f5" stroke="#fc8181" stroke-width="1" /><text x="184" y="301" text-anchor="middle" font-size="8.5" fill="#c53030">Bounded by the context window — must be managed.</text><rect x="376" y="54" width="320" height="262" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2" /><text x="536" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">Long-term: a vector store</text><text x="536" y="98" text-anchor="middle" font-size="9.5" fill="#718096">durable facts, across sessions</text><g font-size="8.5"><rect x="416" y="116" width="240" height="22" rx="5" fill="#faf5ff" stroke="#d6bcfa" stroke-width="1" /><text x="426" y="130" fill="#553c9a">"traveler is vegetarian, loves ramen"</text><rect x="416" y="144" width="240" height="22" rx="5" fill="#faf5ff" stroke="#d6bcfa" stroke-width="1" /><text x="426" y="158" fill="#553c9a">"prefers budget-friendly, hostels"</text><rect x="416" y="172" width="240" height="22" rx="5" fill="#faf5ff" stroke="#d6bcfa" stroke-width="1" /><text x="426" y="186" fill="#553c9a">"dislikes cold winter destinations"</text></g><text x="536" y="216" text-anchor="middle" font-size="9" fill="#718096" font-family="monospace">search("food?") -&gt; the ramen note</text><text x="536" y="244" text-anchor="middle" font-size="9.5" fill="#4a5568">Stores notes the agent should remember;</text><text x="536" y="259" text-anchor="middle" font-size="9.5" fill="#4a5568">pulls back only the relevant ones,</text><text x="536" y="273" text-anchor="middle" font-size="9.5" fill="#4a5568">when they're needed.</text><rect x="412" y="286" width="248" height="22" rx="6" fill="#f0fff4" stroke="#68d391" stroke-width="1" /><text x="536" y="301" text-anchor="middle" font-size="8.5" fill="#22543d">Persists beyond the session — retrieved by relevance.</text><text x="360" y="336" text-anchor="middle" font-size="10" fill="#718096">Short-term is the running transcript; long-term is a searchable store of what's worth keeping.</text></svg>