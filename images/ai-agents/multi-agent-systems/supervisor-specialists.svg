<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="330" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">A supervisor delegates to specialist agents</text><rect x="270" y="58" width="160" height="60" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.8" /><text x="350" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">Supervisor (Atlas)</text><text x="350" y="101" text-anchor="middle" font-size="9.5" fill="#3182ce">decides who to delegate to</text><line x1="310" y1="118" x2="150" y2="176" stroke="#48bb78" stroke-width="1.7" /><polygon points="150 176 158 167 163 177" fill="#48bb78" /><line x1="350" y1="118" x2="350" y2="176" stroke="#48bb78" stroke-width="1.7" /><polygon points="350 176 345 166 355 166" fill="#48bb78" /><line x1="390" y1="118" x2="550" y2="176" stroke="#48bb78" stroke-width="1.7" /><polygon points="550 176 537 177 542 167" fill="#48bb78" /><text x="222" y="142" text-anchor="middle" font-size="8.5" font-weight="700" fill="#276749">tool_use</text><text x="478" y="142" text-anchor="middle" font-size="8.5" font-weight="700" fill="#276749">tool_use</text><rect x="70" y="178" width="160" height="66" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="150" y="200" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">Researcher</text><text x="150" y="218" text-anchor="middle" font-size="8.5" fill="#2f855a">own tool: search_knowledge</text><text x="150" y="232" text-anchor="middle" font-size="8.5" fill="#2f855a">retrieves grounded facts</text><rect x="270" y="178" width="160" height="66" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="350" y="200" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b46c1">Budget analyst</text><text x="350" y="218" text-anchor="middle" font-size="8.5" fill="#805ad5">own tools: cost lookups</text><text x="350" y="232" text-anchor="middle" font-size="8.5" fill="#805ad5">estimates daily spend</text><rect x="470" y="178" width="160" height="66" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="550" y="200" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c05621">Itinerary writer</text><text x="550" y="218" text-anchor="middle" font-size="8.5" fill="#9c4221">drafts the day-by-day</text><text x="550" y="232" text-anchor="middle" font-size="8.5" fill="#9c4221">plan from the pieces</text><path d="M150 244C150 275 320 275 330 120" fill="none" stroke="#a0aec0" stroke-width="1.3" stroke-dasharray="4 3" /><text x="350" y="292" text-anchor="middle" font-size="9.5" fill="#718096">each specialist is itself an agent — its result returns as a tool_result the supervisor reads</text><text x="350" y="314" text-anchor="middle" font-size="10.5" fill="#4a5568">One focused prompt and tool set per agent, instead of one overloaded generalist.</text></svg>