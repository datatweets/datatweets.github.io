<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="330" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Orchestrator-workers: decompose, fan out, synthesize</text><rect x="40" y="140" width="110" height="52" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.6" /><text x="95" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">Goal</text><text x="95" y="181" text-anchor="middle" font-size="8.5" fill="#718096">"plan a 3-day trip"</text><line x1="150" y1="166" x2="192" y2="166" stroke="#a0aec0" stroke-width="2" /><polygon points="192 166 182 161 182 171" fill="#a0aec0" /><rect x="194" y="138" width="130" height="56" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.8" /><text x="259" y="161" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">Orchestrator</text><text x="259" y="180" text-anchor="middle" font-size="8.5" fill="#3182ce">splits into subtasks</text><line x1="324" y1="150" x2="392" y2="80" stroke="#48bb78" stroke-width="1.7" /><polygon points="392 80 380 82 385 91" fill="#48bb78" /><line x1="324" y1="166" x2="392" y2="166" stroke="#48bb78" stroke-width="1.7" /><polygon points="392 166 382 161 382 171" fill="#48bb78" /><line x1="324" y1="182" x2="392" y2="252" stroke="#48bb78" stroke-width="1.7" /><polygon points="392 252 385 241 380 250" fill="#48bb78" /><rect x="394" y="60" width="150" height="42" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="469" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">Worker: research</text><text x="469" y="94" text-anchor="middle" font-size="8" fill="#2f855a">"Kyoto, autumn"</text><rect x="394" y="145" width="150" height="42" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="469" y="165" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">Worker: budget</text><text x="469" y="179" text-anchor="middle" font-size="8" fill="#2f855a">"~$90/day"</text><rect x="394" y="230" width="150" height="42" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="469" y="250" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">Worker: itinerary</text><text x="469" y="264" text-anchor="middle" font-size="8" fill="#2f855a">"temples, markets"</text><line x1="544" y1="81" x2="600" y2="150" stroke="#a0aec0" stroke-width="1.4" stroke-dasharray="4 3" /><line x1="544" y1="166" x2="600" y2="166" stroke="#a0aec0" stroke-width="1.4" stroke-dasharray="4 3" /><line x1="544" y1="251" x2="600" y2="182" stroke="#a0aec0" stroke-width="1.4" stroke-dasharray="4 3" /><rect x="602" y="138" width="76" height="56" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.8" /><text x="640" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621">Synth-</text><text x="640" y="174" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621">esize</text><text x="640" y="188" text-anchor="middle" font-size="7.5" fill="#9c4221">one plan</text><text x="350" y="306" text-anchor="middle" font-size="10.5" fill="#4a5568">The orchestrator plans the subtasks; each worker handles one; a final step merges the results.</text><text x="350" y="323" text-anchor="middle" font-size="9.5" fill="#718096">Workers are independent, so they can run in parallel — wall-clock is the slowest worker, not the sum.</text></svg>