<svg xmlns="http://www.w3.org/2000/svg" width="700" height="310" viewBox="0 0 700 310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="310" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Routing: classify, then dispatch to one specialist</text><rect x="40" y="120" width="130" height="58" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.6" /><text x="105" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">Request</text><text x="105" y="162" text-anchor="middle" font-size="8.5" fill="#718096">"Where should I</text><text x="105" y="173" text-anchor="middle" font-size="8.5" fill="#718096">eat in Kyoto?"</text><line x1="170" y1="149" x2="216" y2="149" stroke="#a0aec0" stroke-width="2" /><polygon points="216 149 206 144 206 154" fill="#a0aec0" /><rect x="218" y="118" width="140" height="62" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.8" /><text x="288" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Router</text><text x="288" y="161" text-anchor="middle" font-size="8.5" fill="#3182ce">classify into one label</text><text x="288" y="173" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#3182ce">→ "food"</text><line x1="358" y1="132" x2="500" y2="80" stroke="#cbd5e0" stroke-width="1.5" /><line x1="358" y1="149" x2="500" y2="149" stroke="#48bb78" stroke-width="2.2" /><polygon points="500 149 490 144 490 154" fill="#48bb78" /><line x1="358" y1="166" x2="500" y2="218" stroke="#cbd5e0" stroke-width="1.5" /><rect x="502" y="58" width="150" height="42" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" /><text x="577" y="84" text-anchor="middle" font-size="10.5" fill="#a0aec0">Weather specialist</text><rect x="502" y="128" width="150" height="42" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.8" /><text x="577" y="154" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">Food specialist</text><rect x="502" y="198" width="150" height="42" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.4" /><text x="577" y="224" text-anchor="middle" font-size="10.5" fill="#a0aec0">Budget specialist</text><text x="430" y="140" text-anchor="middle" font-size="8" font-weight="700" fill="#276749">match</text><text x="350" y="278" text-anchor="middle" font-size="10.5" fill="#4a5568">One cheap classification call picks the right specialist — only that one runs.</text><text x="350" y="296" text-anchor="middle" font-size="9.5" fill="#718096">An unrecognized label falls back to a general specialist, so nothing slips through.</text></svg>