<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="380" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The agent loop, in code</text><rect x="270" y="50" width="160" height="34" rx="17" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.3" /><text x="350" y="71" text-anchor="middle" font-size="10" font-family="monospace" fill="#2d3748">messages = [user msg]</text><line x1="350" y1="84" x2="350" y2="100" stroke="#a0aec0" stroke-width="1.6" /><polygon points="350 100 345 91 355 91" fill="#a0aec0" /><rect x="248" y="100" width="204" height="40" rx="8" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="350" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#6b46c1">response = messages.create(</text><text x="350" y="132" text-anchor="middle" font-size="9" font-family="monospace" fill="#805ad5">model, tools, messages)</text><line x1="350" y1="140" x2="350" y2="156" stroke="#a0aec0" stroke-width="1.6" /><polygon points="350 156 345 147 355 147" fill="#a0aec0" /><rect x="248" y="156" width="204" height="30" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.3" /><text x="350" y="175" text-anchor="middle" font-size="9" font-family="monospace" fill="#2d3748">append assistant response.content</text><line x1="350" y1="186" x2="350" y2="200" stroke="#a0aec0" stroke-width="1.6" /><polygon points="350 200 345 191 355 191" fill="#a0aec0" /><polygon points="350 202 446 238 350 274 254 238" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" /><text x="350" y="234" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c05621">stop_reason</text><text x="350" y="248" text-anchor="middle" font-size="9" font-family="monospace" fill="#9c4221">== "tool_use"?</text><line x1="446" y1="238" x2="520" y2="238" stroke="#48bb78" stroke-width="1.6" /><polygon points="520 238 511 233 511 243" fill="#48bb78" /><text x="476" y="230" text-anchor="middle" font-size="8.5" font-weight="700" fill="#276749">No</text><rect x="520" y="218" width="156" height="40" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="598" y="236" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">return final answer</text><text x="598" y="250" text-anchor="middle" font-size="8.5" fill="#2f855a">the loop is done</text><line x1="350" y1="274" x2="350" y2="292" stroke="#ed8936" stroke-width="1.6" /><polygon points="350 292 345 283 355 283" fill="#ed8936" /><text x="366" y="288" font-size="8.5" font-weight="700" fill="#c05621">Yes</text><rect x="232" y="292" width="236" height="40" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.4" /><text x="350" y="310" text-anchor="middle" font-size="9.5" fill="#22543d">run each tool_use block,</text><text x="350" y="324" text-anchor="middle" font-size="9" font-family="monospace" fill="#2f855a">collect tool_result blocks</text><line x1="232" y1="312" x2="120" y2="312" stroke="#a0aec0" stroke-width="1.6" /><polygon points="120 312 129 307 129 317" fill="#a0aec0" /><rect x="36" y="292" width="180" height="40" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="126" y="310" text-anchor="middle" font-size="9" fill="#2b6cb0">append user message with</text><text x="126" y="324" text-anchor="middle" font-size="9" font-family="monospace" fill="#3182ce">ALL tool_results</text><path d="M126 292C126 170 180 120 246 120" fill="none" stroke="#4299e1" stroke-width="1.6" stroke-dasharray="5 3" /><polygon points="246 120 237 115 237 125" fill="#4299e1" /><text x="120" y="200" text-anchor="middle" font-size="8.5" fill="#3182ce" transform="rotate(-90 120 200)">loop again</text><text x="350" y="362" text-anchor="middle" font-size="9.5" fill="#718096">A <tspan font-family="monospace" font-weight="700" fill="#2d3748">max_steps</tspan> guard on the loop stops a runaway agent that never returns end_turn.</text></svg>