<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="380" fill="#ffffff" /><text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">One tool-use round trip, message by message</text><text x="150" y="58" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">user / your code</text><text x="540" y="58" text-anchor="middle" font-size="10" font-weight="700" fill="#6b46c1">assistant / Claude</text><rect x="40" y="68" width="300" height="44" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="54" y="86" font-size="9" font-weight="700" fill="#2b6cb0">role: user</text><text x="54" y="103" font-size="10" fill="#2c5282">"What's the weather in Kyoto?"</text><line x1="340" y1="90" x2="380" y2="90" stroke="#a0aec0" stroke-width="1.6" /><polygon points="380 90 371 86 371 94" fill="#a0aec0" /><rect x="380" y="120" width="300" height="74" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.4" /><text x="394" y="138" font-size="9" font-weight="700" fill="#6b46c1">role: assistant</text><text x="660" y="138" text-anchor="end" font-size="8.5" font-family="monospace" fill="#805ad5">stop_reason: tool_use</text><rect x="394" y="146" width="120" height="18" rx="5" fill="#e9d8fd" /><text x="400" y="159" font-size="8.5" font-family="monospace" fill="#553c9a">text "Let me check."</text><rect x="394" y="168" width="272" height="20" rx="5" fill="#c6f6d5" /><text x="400" y="182" font-size="8.5" font-family="monospace" fill="#22543d">tool_use  get_weather(city="Kyoto")  id: tu_01</text><line x1="380" y1="178" x2="344" y2="220" stroke="#a0aec0" stroke-width="1.6" /><polygon points="344 220 348 210 354 217" fill="#a0aec0" /><rect x="40" y="222" width="300" height="58" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="54" y="240" font-size="9" font-weight="700" fill="#2b6cb0">role: user  (your code runs the tool)</text><rect x="54" y="248" width="272" height="20" rx="5" fill="#bee3f8" /><text x="60" y="262" font-size="8.5" font-family="monospace" fill="#2a4365">tool_result  id: tu_01  "16°C, clear and crisp"</text><line x1="340" y1="252" x2="380" y2="294" stroke="#a0aec0" stroke-width="1.6" /><polygon points="380 294 371 289 369 297" fill="#a0aec0" /><rect x="380" y="296" width="300" height="48" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="394" y="314" font-size="9" font-weight="700" fill="#276749">role: assistant</text><text x="660" y="314" text-anchor="end" font-size="8.5" font-family="monospace" fill="#2f855a">stop_reason: end_turn</text><text x="394" y="332" font-size="10" fill="#22543d">"Kyoto is 16°C, clear and crisp."</text><text x="360" y="368" text-anchor="middle" font-size="9.5" fill="#718096">The tool_result's id must match the tool_use id. When stop_reason is end_turn instead of tool_use, the loop is done.</text></svg>