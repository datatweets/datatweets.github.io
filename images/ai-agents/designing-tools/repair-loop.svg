<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="340" fill="#ffffff" /><text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The repair loop: errors that teach the agent to fix itself</text><rect x="40" y="70" width="150" height="56" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5" /><text x="115" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">Claude calls</text><text x="115" y="110" text-anchor="middle" font-size="9" fill="#805ad5">a tool with some input</text><line x1="190" y1="98" x2="230" y2="98" stroke="#a0aec0" stroke-width="1.8" /><polygon points="230 98 221 94 221 102" fill="#a0aec0" /><polygon points="320 62 410 98 320 134 230 98" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" /><text x="320" y="94" text-anchor="middle" font-size="10" font-weight="700" fill="#c05621">input valid?</text><text x="320" y="108" text-anchor="middle" font-size="8.5" fill="#9c4221">(Pydantic checks it)</text><line x1="410" y1="98" x2="468" y2="98" stroke="#48bb78" stroke-width="1.8" /><polygon points="468 98 459 93 459 103" fill="#48bb78" /><text x="439" y="90" text-anchor="middle" font-size="8.5" font-weight="700" fill="#276749">yes</text><rect x="470" y="70" width="150" height="56" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="545" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">run the tool</text><text x="545" y="110" text-anchor="middle" font-size="9" fill="#2f855a">return the result</text><line x1="320" y1="134" x2="320" y2="172" stroke="#e53e3e" stroke-width="1.8" /><polygon points="320 172 315 163 325 163" fill="#e53e3e" /><text x="336" y="156" font-size="8.5" font-weight="700" fill="#c53030">no</text><rect x="210" y="172" width="220" height="56" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" /><text x="320" y="194" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c53030">return a tool_result</text><text x="320" y="210" text-anchor="middle" font-size="9" font-family="monospace" fill="#9b2c2c">is_error: true</text><text x="320" y="222" text-anchor="middle" font-size="8.5" fill="#9b2c2c">"from_currency must be JPY, USD, or EUR"</text><path d="M210 200C110 200 90 150 110 124" fill="none" stroke="#ed8936" stroke-width="1.8" stroke-dasharray="5 3" /><polygon points="110 124 108 134 117 129" fill="#ed8936" /><text x="120" y="186" text-anchor="middle" font-size="9" fill="#9c4221">Claude reads the error</text><text x="120" y="199" text-anchor="middle" font-size="9" fill="#9c4221">and retries with fixed input</text><text x="360" y="270" text-anchor="middle" font-size="11" fill="#4a5568">Because the error goes back to Claude as a tool_result (not a crash), the model can <tspan font-weight="700" fill="#2d3748">self-correct</tspan> —</text><text x="360" y="288" text-anchor="middle" font-size="11" fill="#4a5568">it sees exactly what was wrong and tries again, often fixing the call on the very next step.</text><rect x="180" y="302" width="360" height="26" rx="7" fill="#fff5f5" stroke="#fc8181" stroke-width="1" /><text x="360" y="319" text-anchor="middle" font-size="9" fill="#c53030">Never let a tool crash the loop — turn every failure into a clear is_error result.</text></svg>