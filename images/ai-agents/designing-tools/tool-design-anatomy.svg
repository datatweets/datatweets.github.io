<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="360" fill="#ffffff" /><text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Anatomy of a tool Claude uses well</text><rect x="40" y="56" width="380" height="240" rx="10" fill="#1a202c" /><g font-family="monospace" font-size="11"><text x="58" y="84" fill="#a0aec0">{</text><text x="74" y="104" fill="#f6ad55">"name"</text><text x="124" y="104" fill="#e2e8f0">: "convert_currency",</text><text x="74" y="126" fill="#f6ad55">"description"</text><text x="166" y="126" fill="#e2e8f0">: "Convert money</text><text x="90" y="142" fill="#68d391">between currencies. Use this</text><text x="90" y="158" fill="#68d391">when the user compares prices.",</text><text x="74" y="180" fill="#f6ad55">"input_schema"</text><text x="174" y="180" fill="#e2e8f0">: {</text><text x="90" y="198" fill="#e2e8f0">"properties": {</text><text x="106" y="214" fill="#90cdf4">amount</text><text x="156" y="214" fill="#e2e8f0">: number &gt; 0,</text><text x="106" y="230" fill="#90cdf4">from/to</text><text x="170" y="230" fill="#e2e8f0">: enum[JPY,USD,EUR]</text><text x="90" y="248" fill="#e2e8f0">},</text><text x="90" y="264" fill="#e2e8f0">"required": ["amount","from","to"]</text><text x="74" y="280" fill="#e2e8f0">}</text><text x="58" y="296" fill="#a0aec0">}</text></g><line x1="124" y1="100" x2="470" y2="92" stroke="#f6ad55" stroke-width="1.1" /><rect x="472" y="78" width="226" height="30" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="1" /><text x="484" y="91" font-size="9" font-weight="700" fill="#c05621">name: a clear verb_noun</text><text x="484" y="103" font-size="8.5" fill="#9c4221">no vague labels like "tool1"</text><line x1="166" y1="150" x2="470" y2="150" stroke="#68d391" stroke-width="1.1" /><rect x="472" y="124" width="226" height="44" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1" /><text x="484" y="139" font-size="9" font-weight="700" fill="#276749">description: what it does + WHEN</text><text x="484" y="151" font-size="8.5" fill="#2f855a">Claude picks tools from this text;</text><text x="484" y="163" font-size="8.5" fill="#2f855a">write it like an instruction.</text><line x1="174" y1="214" x2="470" y2="214" stroke="#90cdf4" stroke-width="1.1" /><rect x="472" y="190" width="226" height="44" rx="6" fill="#ebf8ff" stroke="#4299e1" stroke-width="1" /><text x="484" y="205" font-size="9" font-weight="700" fill="#2b6cb0">input_schema: typed + constrained</text><text x="484" y="217" font-size="8.5" fill="#3182ce">enums and ranges shrink the space</text><text x="484" y="229" font-size="8.5" fill="#3182ce">of wrong inputs Claude can send.</text><line x1="160" y1="280" x2="470" y2="266" stroke="#9f7aea" stroke-width="1.1" /><rect x="472" y="250" width="226" height="30" rx="6" fill="#faf5ff" stroke="#9f7aea" stroke-width="1" /><text x="484" y="263" font-size="9" font-weight="700" fill="#6b46c1">required: list every needed field</text><text x="484" y="275" font-size="8.5" fill="#805ad5">so Claude never omits one</text><text x="360" y="324" text-anchor="middle" font-size="10.5" fill="#4a5568">A tight schema plus a description that says <tspan font-weight="700" fill="#2d3748">when</tspan> to use the tool is most of what makes an agent reliable.</text><text x="360" y="342" text-anchor="middle" font-size="10.5" fill="#4a5568">Then validate the inputs Claude sends — because it can still get them wrong.</text></svg>