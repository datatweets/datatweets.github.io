<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="260" fill="#ffffff" /><text x="380.0" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">What Makes an Authority Level Enforceable</text><rect x="20" y="80" width="165" height="100" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="102.5" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">Identity</text><text x="102.5" y="120" text-anchor="middle" font-size="8" font-weight="400" fill="#3182ce">own service account,</text><text x="102.5" y="133" text-anchor="middle" font-size="8" font-weight="400" fill="#3182ce">never a shared credential</text><rect x="200" y="80" width="165" height="100" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="282.5" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b46c1">Permissions</text><text x="282.5" y="120" text-anchor="middle" font-size="8" font-weight="400" fill="#805ad5">scoped to exactly</text><text x="282.5" y="133" text-anchor="middle" font-size="8" font-weight="400" fill="#805ad5">this authority level</text><rect x="380" y="80" width="165" height="100" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="462.5" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">Logging</text><text x="462.5" y="120" text-anchor="middle" font-size="8" font-weight="400" fill="#2f855a">every action recorded,</text><text x="462.5" y="133" text-anchor="middle" font-size="8" font-weight="400" fill="#2f855a">attributable to the agent</text><rect x="560" y="80" width="165" height="100" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="642.5" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c05621">Human handoff</text><text x="642.5" y="120" text-anchor="middle" font-size="8" font-weight="400" fill="#9c4221">who, when, what they see,</text><text x="642.5" y="133" text-anchor="middle" font-size="8" font-weight="400" fill="#9c4221">fail-safe default</text><line x1="185" y1="130.0" x2="200" y2="130.0" stroke="#a0aec0" stroke-width="2" /><polygon points="200 130.0 193.9 133.4 193.9 126.6" fill="#a0aec0" /><line x1="365" y1="130.0" x2="380" y2="130.0" stroke="#a0aec0" stroke-width="2" /><polygon points="380 130.0 373.9 133.4 373.9 126.6" fill="#a0aec0" /><line x1="545" y1="130.0" x2="560" y2="130.0" stroke="#a0aec0" stroke-width="2" /><polygon points="560 130.0 553.9 133.4 553.9 126.6" fill="#a0aec0" /><text x="380" y="220" text-anchor="middle" font-size="10" font-weight="400" fill="#718096">A system with the right authority level and only three of these four is a risk, not a control.</text></svg>