<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="340" fill="#ffffff" /><text x="380.0" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">From Fourteen Artifacts to One Recommendation</text><rect x="40" y="55" width="680" height="70" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="380.0" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">14 daily artifacts</text><text x="380.0" y="95" text-anchor="middle" font-size="8.3" font-weight="400" fill="#3182ce">terminology map, opportunity canvas, cost brief, platform matrix,</text><text x="380.0" y="108" text-anchor="middle" font-size="8.3" font-weight="400" fill="#3182ce">workflow map, threat register, incident playbook, portfolio,</text><text x="380.0" y="121" text-anchor="middle" font-size="8.3" font-weight="400" fill="#3182ce">role map, pilot charter, scorecard, governance plan...</text><line x1="380" y1="125" x2="380" y2="160" stroke="#a0aec0" stroke-width="2.5" /><polygon points="380 160 376.6 153.9 383.4 153.9" fill="#a0aec0" /><rect x="130" y="160" width="500" height="65" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="380.0" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">10 dossier components</text><text x="380.0" y="200" text-anchor="middle" font-size="8.5" font-weight="400" fill="#805ad5">combined where two artifacts answer the same question —</text><text x="380.0" y="213" text-anchor="middle" font-size="8.5" font-weight="400" fill="#805ad5">e.g. workflow map + integration map become one component</text><line x1="380" y1="225" x2="380" y2="260" stroke="#a0aec0" stroke-width="2.5" /><polygon points="380 260 376.6 253.9 383.4 253.9" fill="#a0aec0" /><rect x="210" y="260" width="340" height="60" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="380.0" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">1 executive roadmap</text><text x="380.0" y="300" text-anchor="middle" font-size="9" font-weight="400" fill="#2f855a">one explicit recommendation:</text><text x="380.0" y="313" text-anchor="middle" font-size="9" font-weight="400" fill="#2f855a">continue, change, or stop</text></svg>