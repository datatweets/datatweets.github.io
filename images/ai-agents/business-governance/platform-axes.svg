<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="300" fill="#ffffff" /><text x="380.0" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Three Independent Platform Axes</text><rect x="30" y="55" width="220" height="66" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="140.0" y="77" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">Hosted</text><text x="140.0" y="95" text-anchor="middle" font-size="8" font-weight="400" fill="#3182ce">call a provider's API</text><line x1="255" y1="88" x2="505" y2="88" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="4,4" /><rect x="510" y="55" width="220" height="66" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="620.0" y="77" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">Self-managed</text><text x="620.0" y="95" text-anchor="middle" font-size="8" font-weight="400" fill="#3182ce">run weights yourself</text><rect x="30" y="135" width="220" height="66" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="140.0" y="157" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">Proprietary</text><text x="140.0" y="175" text-anchor="middle" font-size="8" font-weight="400" fill="#805ad5">vendor's own schedule</text><line x1="255" y1="168" x2="505" y2="168" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="4,4" /><rect x="510" y="135" width="220" height="66" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="620.0" y="157" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">Open-weight</text><text x="620.0" y="175" text-anchor="middle" font-size="8" font-weight="400" fill="#805ad5">self-host, audit, fine-tune</text><rect x="30" y="215" width="220" height="66" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="140.0" y="237" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">General platform</text><text x="140.0" y="255" text-anchor="middle" font-size="8" font-weight="400" fill="#9c4221">flexible, fast to start</text><line x1="255" y1="248" x2="505" y2="248" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="4,4" /><rect x="510" y="215" width="220" height="66" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="620.0" y="237" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">Narrow custom solution</text><text x="620.0" y="255" text-anchor="middle" font-size="8" font-weight="400" fill="#9c4221">purpose-built for one task</text><text x="380" y="285" text-anchor="middle" font-size="1" font-weight="400" fill="#1a202c"></text><text x="380" y="288" text-anchor="middle" font-size="10" font-weight="400" fill="#718096">Independent axes — any position on one can combine with any position on another.</text></svg>