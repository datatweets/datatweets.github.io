<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="360" fill="#ffffff" /><text x="350.0" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Classify by Consequence and Autonomy</text><rect x="105" y="105" width="290" height="110" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="250.0" y="127" text-anchor="middle" font-size="9.7" font-weight="700" fill="#2b6cb0">Low consequence, low autonomy</text><text x="250.0" y="145" text-anchor="middle" font-size="8.2" font-weight="400" fill="#3182ce">Light-touch — document it, review occasionally</text><rect x="395" y="105" width="290" height="110" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="540.0" y="127" text-anchor="middle" font-size="9.7" font-weight="700" fill="#6b46c1">Low consequence, high autonomy</text><text x="540.0" y="145" text-anchor="middle" font-size="8.2" font-weight="400" fill="#805ad5">Moderate — the autonomy itself warrants attention</text><rect x="105" y="215" width="290" height="110" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="250.0" y="237" text-anchor="middle" font-size="9.7" font-weight="700" fill="#c05621">High consequence, low autonomy</text><text x="250.0" y="255" text-anchor="middle" font-size="8.2" font-weight="400" fill="#9c4221">Moderate — the recommendation carries real weight</text><rect x="395" y="215" width="290" height="110" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.6" /><text x="540.0" y="237" text-anchor="middle" font-size="9.7" font-weight="700" fill="#c53030">High consequence, high autonomy</text><text x="540.0" y="255" text-anchor="middle" font-size="8.2" font-weight="400" fill="#e53e3e">Highest tier — most rigorous controls and review</text><text x="250.0" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#4a5568">Low autonomy (read / recommend)</text><text x="540.0" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#4a5568">High autonomy (approve / execute)</text><text x="75" y="154.0" text-anchor="end" font-size="10" font-weight="700" fill="#4a5568">Low</text><text x="75" y="168.0" text-anchor="end" font-size="8" font-weight="400" fill="#a0aec0">consequence</text><text x="75" y="264.0" text-anchor="end" font-size="10" font-weight="700" fill="#4a5568">High</text><text x="75" y="278.0" text-anchor="end" font-size="8" font-weight="400" fill="#a0aec0">consequence</text><text x="350" y="340" text-anchor="middle" font-size="9.5" font-weight="400" fill="#718096">A use case's tier changes if authority expands or its population changes — reclassify, don't assume.</text></svg>