<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="300" fill="#ffffff" /><text x="380.0" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Eight Categories of Agent-Specific Risk</text><rect x="20" y="60" width="175" height="95" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.6" /><text x="107.5" y="82" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">Prompt injection</text><text x="107.5" y="100" text-anchor="middle" font-size="7.8" font-weight="400" fill="#e53e3e">hidden instructions in data the agent reads</text><rect x="207" y="60" width="175" height="95" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="294.5" y="82" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c05621">Data leakage</text><text x="294.5" y="100" text-anchor="middle" font-size="7.8" font-weight="400" fill="#9c4221">exposing info to the wrong place</text><rect x="394" y="60" width="175" height="95" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="481.5" y="82" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6b46c1">Insecure tool use</text><text x="481.5" y="100" text-anchor="middle" font-size="7.8" font-weight="400" fill="#805ad5">unvalidated input reaching a tool call</text><rect x="581" y="60" width="175" height="95" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="668.5" y="82" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2b6cb0">Excessive agency</text><text x="668.5" y="100" text-anchor="middle" font-size="7.8" font-weight="400" fill="#3182ce">more authority than the task needs</text><rect x="20" y="167" width="175" height="95" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="107.5" y="189" text-anchor="middle" font-size="9.5" font-weight="700" fill="#276749">Identity/permission failures</text><text x="107.5" y="207" text-anchor="middle" font-size="7.8" font-weight="400" fill="#2f855a">shared credentials, no attribution</text><rect x="207" y="167" width="175" height="95" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.6" /><text x="294.5" y="189" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2d3748">Supply-chain/vendor risk</text><text x="294.5" y="207" text-anchor="middle" font-size="7.8" font-weight="400" fill="#4a5568">a dependency or vendor you don't control</text><rect x="394" y="167" width="175" height="95" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.6" /><text x="481.5" y="189" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c53030">Unsafe actions</text><text x="481.5" y="207" text-anchor="middle" font-size="7.8" font-weight="400" fill="#e53e3e">technically allowed, harmful in context</text><rect x="581" y="167" width="175" height="95" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="668.5" y="189" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c05621">Weak monitoring</text><text x="668.5" y="207" text-anchor="middle" font-size="7.8" font-weight="400" fill="#9c4221">no way to notice something went wrong</text><text x="380" y="288" text-anchor="middle" font-size="10" font-weight="400" fill="#718096">Guardrails alone cover roughly two of these eight.</text></svg>