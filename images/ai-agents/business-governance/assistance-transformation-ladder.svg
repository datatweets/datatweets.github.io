<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="300" fill="#ffffff" /><text x="380.0" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">The Assistance → Transformation Ladder</text><rect x="20" y="175" width="170" height="75" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="105.0" y="197" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">1. Assistance</text><text x="105.0" y="215" text-anchor="middle" font-size="7.8" font-weight="400" fill="#3182ce">agent answers or drafts;</text><text x="105.0" y="228" text-anchor="middle" font-size="7.8" font-weight="400" fill="#3182ce">a person decides everything</text><rect x="205" y="145" width="170" height="75" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="290.0" y="167" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">2. Workflow acceleration</text><text x="290.0" y="185" text-anchor="middle" font-size="7.8" font-weight="400" fill="#805ad5">agent handles the repetitive</text><text x="290.0" y="198" text-anchor="middle" font-size="7.8" font-weight="400" fill="#805ad5">middle; person still approves</text><rect x="400" y="115" width="170" height="75" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="485.0" y="137" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c05621">3. Bounded automation</text><text x="485.0" y="155" text-anchor="middle" font-size="7.8" font-weight="400" fill="#9c4221">agent acts in a narrow,</text><text x="485.0" y="168" text-anchor="middle" font-size="7.8" font-weight="400" fill="#9c4221">explicit scope, no approval</text><rect x="575" y="85" width="170" height="75" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="660.0" y="107" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">4. Possible transformation</text><text x="660.0" y="125" text-anchor="middle" font-size="7.8" font-weight="400" fill="#2f855a">role or process itself</text><text x="660.0" y="138" text-anchor="middle" font-size="7.8" font-weight="400" fill="#2f855a">may change — an outcome</text><line x1="190" y1="212.5" x2="205" y2="182.5" stroke="#a0aec0" stroke-width="2" /><polygon points="205 182.5 205.3 189.5 199.3 186.5" fill="#a0aec0" /><line x1="375" y1="182.5" x2="400" y2="152.5" stroke="#a0aec0" stroke-width="2" /><polygon points="400 152.5 398.6 159.4 393.5 155.1" fill="#a0aec0" /><line x1="570" y1="152.5" x2="575" y2="122.5" stroke="#a0aec0" stroke-width="2" /><polygon points="575 122.5 577.3 129.1 570.7 128.0" fill="#a0aec0" /><text x="380" y="280" text-anchor="middle" font-size="10" font-weight="400" fill="#718096">Climb one rung at a time, with real evidence — stopping at rung 2 is often a success, not a shortfall.</text></svg>