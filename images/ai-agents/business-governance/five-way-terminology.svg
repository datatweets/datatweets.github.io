<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="280" fill="#ffffff" /><text x="380.0" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Five Labels, Ranked by Who Decides the Next Step</text><rect x="20" y="60" width="138" height="110" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="89.0" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">Generative AI</text><text x="89.0" y="100" text-anchor="middle" font-size="8" font-weight="400" fill="#3182ce">produces content</text><text x="89.0" y="113" text-anchor="middle" font-size="8" font-weight="400" fill="#3182ce">no memory, no action</text><rect x="166" y="60" width="138" height="110" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="235.0" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">Chatbot</text><text x="235.0" y="100" text-anchor="middle" font-size="8" font-weight="400" fill="#3182ce">responds in a</text><text x="235.0" y="113" text-anchor="middle" font-size="8" font-weight="400" fill="#3182ce">conversation</text><rect x="312" y="60" width="138" height="110" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.6" /><text x="381.0" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2d3748">Automated workflow</text><text x="381.0" y="100" text-anchor="middle" font-size="8" font-weight="400" fill="#4a5568">fixed steps, set by</text><text x="381.0" y="113" text-anchor="middle" font-size="8" font-weight="400" fill="#4a5568">a person in advance</text><rect x="458" y="60" width="138" height="110" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="527.0" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b46c1">AI assistant</text><text x="527.0" y="100" text-anchor="middle" font-size="8" font-weight="400" fill="#805ad5">drafts or suggests;</text><text x="527.0" y="113" text-anchor="middle" font-size="8" font-weight="400" fill="#805ad5">a person decides</text><rect x="604" y="60" width="138" height="110" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="673.0" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#276749">Agent</text><text x="673.0" y="100" text-anchor="middle" font-size="8" font-weight="400" fill="#2f855a">chooses its own steps,</text><text x="673.0" y="113" text-anchor="middle" font-size="8" font-weight="400" fill="#2f855a">inside bounds you set</text><line x1="24" y1="205" x2="726" y2="205" stroke="#a0aec0" stroke-width="2" /><polygon points="726 205 719.9 208.4 719.9 201.6" fill="#a0aec0" /><text x="24" y="222" text-anchor="start" font-size="9" font-weight="400" fill="#4a5568">person decides every step</text><text x="736" y="222" text-anchor="end" font-size="9" font-weight="400" fill="#4a5568">system decides moment to moment</text><text x="380" y="250" text-anchor="middle" font-size="10" font-weight="400" fill="#718096">Autonomy increases left to right — and the risk moves with it.</text></svg>