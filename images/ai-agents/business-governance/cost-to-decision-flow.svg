<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="320" fill="#ffffff" /><text x="380.0" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">From Cost Categories to a Go/No-Go Number</text><rect x="20" y="55" width="112" height="46" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="76.0" y="83" text-anchor="middle" font-size="9" font-weight="700" fill="#2b6cb0">Model / API</text><rect x="140" y="55" width="112" height="46" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="196.0" y="83" text-anchor="middle" font-size="9" font-weight="700" fill="#2b6cb0">Integration</text><rect x="260" y="55" width="112" height="46" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="316.0" y="83" text-anchor="middle" font-size="9" font-weight="700" fill="#2b6cb0">Evaluation</text><rect x="380" y="55" width="112" height="46" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="436.0" y="83" text-anchor="middle" font-size="9" font-weight="700" fill="#2b6cb0">Human review</text><rect x="500" y="55" width="112" height="46" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="556.0" y="83" text-anchor="middle" font-size="9" font-weight="700" fill="#2b6cb0">Security</text><rect x="620" y="55" width="112" height="46" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.4" /><text x="676.0" y="83" text-anchor="middle" font-size="9" font-weight="700" fill="#2b6cb0">Change mgmt</text><line x1="76.0" y1="101" x2="260" y2="145" stroke="#cbd5e0" stroke-width="1.3" /><line x1="196.0" y1="101" x2="260" y2="145" stroke="#cbd5e0" stroke-width="1.3" /><line x1="316.0" y1="101" x2="260" y2="145" stroke="#cbd5e0" stroke-width="1.3" /><line x1="436.0" y1="101" x2="260" y2="145" stroke="#cbd5e0" stroke-width="1.3" /><line x1="556.0" y1="101" x2="260" y2="145" stroke="#cbd5e0" stroke-width="1.3" /><line x1="676.0" y1="101" x2="260" y2="145" stroke="#cbd5e0" stroke-width="1.3" /><rect x="150" y="150" width="220" height="55" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="260.0" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">Total cost range</text><text x="260.0" y="190" text-anchor="middle" font-size="8" font-weight="400" fill="#9c4221">sum of the six categories,</text><text x="260.0" y="203" text-anchor="middle" font-size="8" font-weight="400" fill="#9c4221">expressed as a range</text><rect x="410" y="150" width="220" height="55" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="520.0" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Expected value range</text><text x="520.0" y="190" text-anchor="middle" font-size="8" font-weight="400" fill="#2f855a">baseline + assumptions,</text><text x="520.0" y="203" text-anchor="middle" font-size="8" font-weight="400" fill="#2f855a">never a single guess</text><line x1="260" y1="205" x2="350" y2="250" stroke="#a0aec0" stroke-width="2" /><polygon points="350 250 343.0 250.3 346.0 244.3" fill="#a0aec0" /><line x1="520" y1="205" x2="430" y2="250" stroke="#a0aec0" stroke-width="2" /><polygon points="430 250 434.0 244.3 437.0 250.3" fill="#a0aec0" /><rect x="270" y="250" width="220" height="55" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.6" /><text x="380.0" y="272" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c53030">Do-not-proceed condition</text><text x="380.0" y="290" text-anchor="middle" font-size="8" font-weight="400" fill="#e53e3e">a checkable threshold,</text><text x="380.0" y="303" text-anchor="middle" font-size="8" font-weight="400" fill="#e53e3e">set before you build anything</text></svg>