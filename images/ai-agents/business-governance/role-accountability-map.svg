<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="760" height="320" fill="#ffffff" /><text x="380.0" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Seven Named Responsibilities Around One Pilot</text><rect x="280" y="45" width="200" height="55" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="380.0" y="67" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Executive sponsor</text><text x="380.0" y="85" text-anchor="middle" font-size="7.8" font-weight="400" fill="#2f855a">hears the continue/change/</text><text x="380.0" y="98" text-anchor="middle" font-size="7.8" font-weight="400" fill="#2f855a">stop call</text><rect x="20" y="165" width="112" height="90" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="76.0" y="187" text-anchor="middle" font-size="8.7" font-weight="700" fill="#2b6cb0">Process owner</text><text x="76.0" y="205" text-anchor="middle" font-size="7.3" font-weight="400" fill="#3182ce">owns the workflow itself</text><line x1="76.0" y1="165" x2="76.0" y2="145" stroke="#cbd5e0" stroke-width="1.4" /><line x1="76.0" y1="145" x2="380" y2="100" stroke="#cbd5e0" stroke-width="1.4" /><rect x="142" y="165" width="112" height="90" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="198.0" y="187" text-anchor="middle" font-size="8.7" font-weight="700" fill="#2b6cb0">Product owner</text><text x="198.0" y="205" text-anchor="middle" font-size="7.3" font-weight="400" fill="#3182ce">owns scope trade-offs</text><line x1="198.0" y1="165" x2="198.0" y2="145" stroke="#cbd5e0" stroke-width="1.4" /><line x1="198.0" y1="145" x2="380" y2="100" stroke="#cbd5e0" stroke-width="1.4" /><rect x="264" y="165" width="112" height="90" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="320.0" y="187" text-anchor="middle" font-size="8.7" font-weight="700" fill="#6b46c1">Technical owner</text><text x="320.0" y="205" text-anchor="middle" font-size="7.3" font-weight="400" fill="#805ad5">owns build &amp; uptime</text><line x1="320.0" y1="165" x2="320.0" y2="145" stroke="#cbd5e0" stroke-width="1.4" /><line x1="320.0" y1="145" x2="380" y2="100" stroke="#cbd5e0" stroke-width="1.4" /><rect x="386" y="165" width="112" height="90" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="442.0" y="187" text-anchor="middle" font-size="8.7" font-weight="700" fill="#c05621">Risk / security / privacy</text><text x="442.0" y="205" text-anchor="middle" font-size="7.3" font-weight="400" fill="#9c4221">owns the threat register</text><line x1="442.0" y1="165" x2="442.0" y2="145" stroke="#cbd5e0" stroke-width="1.4" /><line x1="442.0" y1="145" x2="380" y2="100" stroke="#cbd5e0" stroke-width="1.4" /><rect x="508" y="165" width="112" height="90" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="564.0" y="187" text-anchor="middle" font-size="8.7" font-weight="700" fill="#c05621">Domain reviewer(s)</text><text x="564.0" y="205" text-anchor="middle" font-size="7.3" font-weight="400" fill="#9c4221">judges output quality</text><line x1="564.0" y1="165" x2="564.0" y2="145" stroke="#cbd5e0" stroke-width="1.4" /><line x1="564.0" y1="145" x2="380" y2="100" stroke="#cbd5e0" stroke-width="1.4" /><rect x="630" y="165" width="112" height="90" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.6" /><text x="686.0" y="187" text-anchor="middle" font-size="8.7" font-weight="700" fill="#2d3748">Frontline users</text><text x="686.0" y="205" text-anchor="middle" font-size="7.3" font-weight="400" fill="#4a5568">do the changed task daily</text><line x1="686.0" y1="165" x2="686.0" y2="145" stroke="#cbd5e0" stroke-width="1.4" /><line x1="686.0" y1="145" x2="380" y2="100" stroke="#cbd5e0" stroke-width="1.4" /><text x="380" y="295" text-anchor="middle" font-size="9.5" font-weight="400" fill="#718096">Seven distinct responsibilities — small organizations can combine them, but each still needs a name.</text></svg>