<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="320" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Evaluation: score the agent against a test set</text><rect x="34" y="70" width="150" height="180" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5" /><text x="109" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">Test set</text><rect x="50" y="104" width="118" height="38" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.2" /><text x="109" y="120" text-anchor="middle" font-size="8" fill="#718096">input + rubric</text><text x="109" y="133" text-anchor="middle" font-size="7.5" fill="#a0aec0">"plan a day in Kyoto"</text><rect x="50" y="148" width="118" height="38" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.2" /><text x="109" y="164" text-anchor="middle" font-size="8" fill="#718096">input + rubric</text><text x="109" y="177" text-anchor="middle" font-size="7.5" fill="#a0aec0">"budget for 3 days"</text><rect x="50" y="192" width="118" height="38" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.2" /><text x="109" y="208" text-anchor="middle" font-size="8" fill="#718096">input + rubric</text><text x="109" y="221" text-anchor="middle" font-size="7.5" fill="#a0aec0">"best time for Arashiyama"</text><line x1="184" y1="160" x2="222" y2="160" stroke="#a0aec0" stroke-width="2" /><polygon points="222 160 212 155 212 165" fill="#a0aec0" /><rect x="224" y="132" width="120" height="56" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.7" /><text x="284" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">Agent</text><text x="284" y="173" text-anchor="middle" font-size="8.5" fill="#3182ce">answers each case</text><line x1="344" y1="160" x2="382" y2="160" stroke="#a0aec0" stroke-width="2" /><polygon points="382 160 372 155 372 165" fill="#a0aec0" /><rect x="384" y="132" width="120" height="56" rx="9" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.7" /><text x="444" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">Judge (LLM)</text><text x="444" y="170" text-anchor="middle" font-size="8.5" fill="#805ad5">PASS / FAIL vs rubric</text><line x1="504" y1="160" x2="542" y2="160" stroke="#a0aec0" stroke-width="2" /><polygon points="542 160 532 155 532 165" fill="#a0aec0" /><rect x="544" y="112" width="122" height="96" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.7" /><text x="605" y="134" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">Scoreboard</text><text x="605" y="156" text-anchor="middle" font-size="9" fill="#2f855a">PASS · PASS · FAIL</text><text x="605" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#276749">67%</text><text x="605" y="197" text-anchor="middle" font-size="8" fill="#718096">pass rate</text><text x="350" y="284" text-anchor="middle" font-size="10.5" fill="#4a5568">A repeatable score, not a vibe check. Run it on every change and the number tells you if the agent got better or worse.</text><text x="350" y="304" text-anchor="middle" font-size="9.5" fill="#718096">The judge applies a rubric per case; the pass rate is the headline metric you track over time.</text></svg>