<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="320" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">From demo to production: four pillars</text><rect x="60" y="70" width="580" height="40" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="350" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Your agent loop (Modules 2–7): tools, memory, planning, retrieval, multi-agent</text><rect x="60" y="140" width="130" height="110" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.7" /><text x="125" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Guardrails</text><text x="125" y="186" text-anchor="middle" font-size="8.5" fill="#2f855a">check inputs</text><text x="125" y="200" text-anchor="middle" font-size="8.5" fill="#2f855a">&amp; outputs</text><text x="125" y="220" text-anchor="middle" font-size="8" fill="#718096">refuse / repair</text><rect x="205" y="140" width="130" height="110" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.7" /><text x="270" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">Retries</text><text x="270" y="186" text-anchor="middle" font-size="8.5" fill="#805ad5">recover from</text><text x="270" y="200" text-anchor="middle" font-size="8.5" fill="#805ad5">transient errors</text><text x="270" y="220" text-anchor="middle" font-size="8" fill="#718096">backoff + cap</text><rect x="350" y="140" width="130" height="110" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.7" /><text x="415" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">Cost control</text><text x="415" y="186" text-anchor="middle" font-size="8.5" fill="#9c4221">token &amp; step</text><text x="415" y="200" text-anchor="middle" font-size="8.5" fill="#9c4221">budgets</text><text x="415" y="220" text-anchor="middle" font-size="8" fill="#718096">no runaway loops</text><rect x="495" y="140" width="145" height="110" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.7" /><text x="567" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Evaluation</text><text x="567" y="186" text-anchor="middle" font-size="8.5" fill="#3182ce">score against</text><text x="567" y="200" text-anchor="middle" font-size="8.5" fill="#3182ce">a test set</text><text x="567" y="220" text-anchor="middle" font-size="8" fill="#718096">catch regressions</text><line x1="125" y1="110" x2="125" y2="140" stroke="#a0aec0" stroke-width="1.4" /><line x1="270" y1="110" x2="270" y2="140" stroke="#a0aec0" stroke-width="1.4" /><line x1="415" y1="110" x2="415" y2="140" stroke="#a0aec0" stroke-width="1.4" /><line x1="567" y1="110" x2="567" y2="140" stroke="#a0aec0" stroke-width="1.4" /><text x="350" y="288" text-anchor="middle" font-size="10.5" fill="#4a5568">The first three keep each run correct, robust, and affordable. Evaluation tells you the whole thing still works as it changes.</text><text x="350" y="308" text-anchor="middle" font-size="9.5" fill="#718096">None replace the agent — they wrap around it, the same way every capability in this course has.</text></svg>