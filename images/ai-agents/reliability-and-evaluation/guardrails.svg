<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="300" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Guardrails: check the way in and the way out</text><rect x="30" y="120" width="96" height="50" rx="9" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5" /><text x="78" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5568">Request</text><line x1="126" y1="145" x2="162" y2="145" stroke="#a0aec0" stroke-width="2" /><polygon points="162 145 152 140 152 150" fill="#a0aec0" /><rect x="164" y="112" width="120" height="66" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.7" /><text x="224" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Input guard</text><text x="224" y="153" text-anchor="middle" font-size="8.5" fill="#2f855a">in scope?</text><text x="224" y="167" text-anchor="middle" font-size="8.5" fill="#2f855a">safe?</text><line x1="224" y1="178" x2="224" y2="238" stroke="#e53e3e" stroke-width="1.6" /><polygon points="224 238 219 228 229 228" fill="#e53e3e" /><text x="224" y="256" text-anchor="middle" font-size="9" font-weight="700" fill="#c53030">refuse</text><text x="224" y="268" text-anchor="middle" font-size="8" fill="#e53e3e">(agent never runs)</text><line x1="284" y1="145" x2="320" y2="145" stroke="#48bb78" stroke-width="2" /><polygon points="320 145 310 140 310 150" fill="#48bb78" /><text x="302" y="137" text-anchor="middle" font-size="8" fill="#276749">pass</text><rect x="322" y="112" width="110" height="66" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.7" /><text x="377" y="141" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">Agent</text><text x="377" y="159" text-anchor="middle" font-size="8.5" fill="#3182ce">produces answer</text><line x1="432" y1="145" x2="468" y2="145" stroke="#a0aec0" stroke-width="2" /><polygon points="468 145 458 140 458 150" fill="#a0aec0" /><rect x="470" y="112" width="120" height="66" rx="9" fill="#fffaf0" stroke="#ed8936" stroke-width="1.7" /><text x="530" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#c05621">Output guard</text><text x="530" y="153" text-anchor="middle" font-size="8.5" fill="#9c4221">valid? complete?</text><text x="530" y="167" text-anchor="middle" font-size="8.5" fill="#9c4221">on-policy?</text><line x1="590" y1="145" x2="632" y2="145" stroke="#48bb78" stroke-width="2" /><polygon points="632 145 622 140 622 150" fill="#48bb78" /><text x="650" y="142" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">deliver</text><path d="M530 178C530 220 377 220 377 180" fill="none" stroke="#ed8936" stroke-width="1.6" stroke-dasharray="5 3" /><polygon points="377 180 372 190 382 190" fill="#ed8936" /><text x="453" y="214" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c05621">fail → repair (retry with feedback)</text><text x="350" y="292" text-anchor="middle" font-size="10" fill="#4a5568">Refuse bad requests before spending anything; validate every answer and repair or refuse before it reaches the user.</text></svg>