<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="300" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Retries with exponential backoff (and a cap)</text><rect x="40" y="80" width="120" height="52" rx="9" fill="#fff5f5" stroke="#fc8181" stroke-width="1.6" /><text x="100" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#c53030">Attempt 1</text><text x="100" y="120" text-anchor="middle" font-size="9" fill="#e53e3e">transient error</text><line x1="160" y1="106" x2="206" y2="106" stroke="#a0aec0" stroke-width="1.6" /><polygon points="206 106 196 101 196 111" fill="#a0aec0" /><text x="183" y="98" text-anchor="middle" font-size="8" fill="#718096">wait 0.5s</text><rect x="208" y="80" width="120" height="52" rx="9" fill="#fff5f5" stroke="#fc8181" stroke-width="1.6" /><text x="268" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#c53030">Attempt 2</text><text x="268" y="120" text-anchor="middle" font-size="9" fill="#e53e3e">transient error</text><line x1="328" y1="106" x2="374" y2="106" stroke="#a0aec0" stroke-width="1.6" /><polygon points="374 106 364 101 364 111" fill="#a0aec0" /><text x="351" y="98" text-anchor="middle" font-size="8" fill="#718096">wait 1.0s</text><rect x="376" y="80" width="120" height="52" rx="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.8" /><text x="436" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Attempt 3</text><text x="436" y="120" text-anchor="middle" font-size="9" fill="#2f855a">success ✓</text><line x1="496" y1="106" x2="540" y2="106" stroke="#48bb78" stroke-width="2" /><polygon points="540 106 530 101 530 111" fill="#48bb78" /><rect x="542" y="84" width="118" height="44" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="601" y="110" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b6cb0">return result</text><text x="350" y="168" text-anchor="middle" font-size="10.5" fill="#4a5568">Each wait doubles: 0.5 → 1.0 → 2.0s — backing off so a struggling service can recover instead of being hammered.</text><rect x="150" y="196" width="400" height="60" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="350" y="220" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c05621">A hard cap: max_attempts</text><text x="350" y="240" text-anchor="middle" font-size="9.5" fill="#9c4221">after the last attempt, stop retrying and raise — only transient errors retry, and never forever</text><text x="350" y="282" text-anchor="middle" font-size="9.5" fill="#718096">Retry the flaky (timeouts, rate limits); fail fast on the permanent (bad input, auth) — and always bound the attempts.</text></svg>