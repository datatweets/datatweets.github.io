<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="330" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Retrieval as a tool (agentic RAG)</text><rect x="270" y="70" width="160" height="62" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="350" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">Agent (Claude)</text><text x="350" y="115" text-anchor="middle" font-size="9.5" fill="#3182ce">decides: do I need to look</text><text x="350" y="126" text-anchor="middle" font-size="9.5" fill="#3182ce">this up?</text><line x1="300" y1="132" x2="300" y2="186" stroke="#48bb78" stroke-width="1.8" /><polygon points="300 186 295 176 305 176" fill="#48bb78" /><text x="232" y="162" text-anchor="middle" font-size="9" font-weight="700" fill="#276749">tool_use:</text><text x="232" y="174" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#2f855a">search_knowledge</text><rect x="210" y="188" width="180" height="58" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="300" y="211" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">search_knowledge()</text><text x="300" y="230" text-anchor="middle" font-size="9" fill="#2f855a">embeds query, ranks passages,</text><text x="300" y="240" text-anchor="middle" font-size="9" fill="#2f855a">returns the top matches</text><path d="M470 196a44 9 0 0 1 88 0v44a44 9 0 0 1-88 0z" fill="#f7fafc" stroke="#48bb78" stroke-width="1.5" /><ellipse cx="514" cy="196" rx="44" ry="9" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="514" y="226" text-anchor="middle" font-size="10.5" font-weight="700" fill="#276749">Knowledge base</text><line x1="390" y1="217" x2="468" y2="217" stroke="#a0aec0" stroke-width="1.6" stroke-dasharray="4 3" /><polygon points="468 217 458 212 458 222" fill="#a0aec0" /><line x1="400" y1="200" x2="400" y2="134" stroke="#ed8936" stroke-width="1.8" /><polygon points="400 134 395 144 405 144" fill="#ed8936" /><text x="470" y="162" text-anchor="middle" font-size="9" font-weight="700" fill="#c05621">tool_result:</text><text x="470" y="174" text-anchor="middle" font-size="8.5" fill="#9c4221">retrieved passages</text><line x1="350" y1="132" x2="350" y2="70" stroke="#cbd5e0" stroke-width="0" /><rect x="220" y="270" width="260" height="44" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" /><text x="350" y="291" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c05621">Answer, grounded in retrieved passages</text><text x="350" y="306" text-anchor="middle" font-size="9" fill="#9c4221">with the source cited</text><line x1="514" y1="240" x2="430" y2="284" stroke="#ed8936" stroke-width="1.4" stroke-dasharray="4 3" /><text x="80" y="284" font-size="10" fill="#4a5568">The agent</text><text x="80" y="298" font-size="10" fill="#4a5568">chooses when</text><text x="80" y="312" font-size="10" fill="#4a5568">to retrieve.</text></svg>