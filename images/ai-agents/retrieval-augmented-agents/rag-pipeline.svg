<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="320" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Retrieval-augmented generation</text><rect x="40" y="92" width="120" height="58" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="100" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Question</text><text x="100" y="135" text-anchor="middle" font-size="9" fill="#3182ce">"When do leaves</text><text x="100" y="146" text-anchor="middle" font-size="9" fill="#3182ce">peak in Kyoto?"</text><line x1="160" y1="121" x2="208" y2="121" stroke="#a0aec0" stroke-width="2" /><polygon points="208 121 198 116 198 126" fill="#a0aec0" /><rect x="210" y="92" width="130" height="58" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="275" y="113" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Retrieve</text><text x="275" y="132" text-anchor="middle" font-size="9" fill="#2f855a">search the knowledge</text><text x="275" y="143" text-anchor="middle" font-size="9" fill="#2f855a">base by similarity</text><line x1="340" y1="121" x2="388" y2="121" stroke="#a0aec0" stroke-width="2" /><polygon points="388 121 378 116 378 126" fill="#a0aec0" /><rect x="390" y="92" width="130" height="58" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="455" y="113" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">Augment</text><text x="455" y="132" text-anchor="middle" font-size="9" fill="#805ad5">put passages into</text><text x="455" y="143" text-anchor="middle" font-size="9" fill="#805ad5">the prompt</text><line x1="520" y1="121" x2="568" y2="121" stroke="#a0aec0" stroke-width="2" /><polygon points="568 121 558 116 558 126" fill="#a0aec0" /><rect x="570" y="92" width="100" height="58" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="620" y="113" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">Generate</text><text x="620" y="132" text-anchor="middle" font-size="9" fill="#9c4221">answer grounded</text><text x="620" y="143" text-anchor="middle" font-size="9" fill="#9c4221">in sources</text><path d="M215 210a60 12 0 0 1 120 0v52a60 12 0 0 1-120 0z" fill="#f7fafc" stroke="#48bb78" stroke-width="1.5" /><ellipse cx="275" cy="210" rx="60" ry="12" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5" /><text x="275" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Knowledge base</text><text x="275" y="288" text-anchor="middle" font-size="9" fill="#718096">your documents, chunked &amp; embedded</text><line x1="275" y1="150" x2="275" y2="196" stroke="#48bb78" stroke-width="1.6" stroke-dasharray="4 3" /><polygon points="275 150 270 160 280 160" fill="#48bb78" /><rect x="500" y="196" width="170" height="52" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.4" /><text x="585" y="217" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c05621">"...mid-to-late November [1]"</text><text x="585" y="235" text-anchor="middle" font-size="9" fill="#9c4221">every claim cites a source</text><line x1="620" y1="150" x2="603" y2="194" stroke="#ed8936" stroke-width="1.6" stroke-dasharray="4 3" /><polygon points="603 194 599 184 609 186" fill="#ed8936" /><text x="350" y="308" text-anchor="middle" font-size="10.5" fill="#4a5568">The model answers from what it retrieved — not from memory — so answers stay current, private, and checkable.</text></svg>