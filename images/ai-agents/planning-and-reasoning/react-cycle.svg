<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="340" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Reasoning and acting, interleaved (ReAct)</text><rect x="60" y="86" width="170" height="64" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="145" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#6b46c1">Thought</text><text x="145" y="130" text-anchor="middle" font-size="9" fill="#805ad5">"To plan an outdoor day,</text><text x="145" y="142" text-anchor="middle" font-size="9" fill="#805ad5">I should check the weather."</text><line x1="230" y1="118" x2="280" y2="118" stroke="#a0aec0" stroke-width="2" /><polygon points="280 118 270 113 270 123" fill="#a0aec0" /><rect x="282" y="86" width="160" height="64" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="362" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#276749">Action</text><text x="362" y="132" text-anchor="middle" font-size="9" font-family="monospace" fill="#2f855a">get_weather("Kyoto")</text><line x1="442" y1="118" x2="492" y2="118" stroke="#a0aec0" stroke-width="2" /><polygon points="492 118 482 113 482 123" fill="#a0aec0" /><rect x="494" y="86" width="150" height="64" rx="10" fill="#fffaf0" stroke="#ed8936" stroke-width="1.6" /><text x="569" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">Observation</text><text x="569" y="132" text-anchor="middle" font-size="9" fill="#9c4221">"16°C, clear"</text><path d="M569 150C569 210 145 210 145 152" fill="none" stroke="#a0aec0" stroke-width="1.8" stroke-dasharray="5 3" /><polygon points="145 152 140 162 150 162" fill="#a0aec0" /><text x="357" y="200" text-anchor="middle" font-size="9.5" fill="#718096">the result informs the next thought — reason again</text><line x1="145" y1="150" x2="145" y2="244" stroke="#4299e1" stroke-width="1.8" /><polygon points="145 244 140 235 150 235" fill="#4299e1" /><text x="200" y="232" font-size="8.5" font-weight="700" fill="#2b6cb0">when it has enough</text><rect x="60" y="246" width="170" height="48" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5" /><text x="145" y="267" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">Final answer</text><text x="145" y="283" text-anchor="middle" font-size="9" fill="#3182ce">reasoned from what it found</text><text x="430" y="266" text-anchor="middle" font-size="10.5" fill="#4a5568">The agent thinks, acts, sees the result, and thinks again —</text><text x="430" y="282" text-anchor="middle" font-size="10.5" fill="#4a5568">reasoning makes each next action a deliberate choice, not a guess.</text></svg>