<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="700" height="330" fill="#ffffff" /><text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Reflection: the agent critiques and improves its own work</text><rect x="40" y="120" width="140" height="60" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="110" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">Draft</text><text x="110" y="163" text-anchor="middle" font-size="8.5" fill="#3182ce">a first attempt</text><line x1="180" y1="150" x2="222" y2="150" stroke="#a0aec0" stroke-width="2" /><polygon points="222 150 213 145 213 155" fill="#a0aec0" /><rect x="224" y="118" width="170" height="64" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="309" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">Critique (reflect)</text><text x="309" y="160" text-anchor="middle" font-size="8.5" fill="#805ad5">"Is this good? What's</text><text x="309" y="172" text-anchor="middle" font-size="8.5" fill="#805ad5">weak or missing?"</text><polygon points="470 118 540 150 470 182 400 150" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5" /><text x="470" y="148" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c05621">good</text><text x="470" y="161" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c05621">enough?</text><line x1="394" y1="150" x2="402" y2="150" stroke="#a0aec0" stroke-width="2" /><line x1="540" y1="150" x2="582" y2="150" stroke="#48bb78" stroke-width="2" /><polygon points="582 150 573 145 573 155" fill="#48bb78" /><text x="561" y="142" text-anchor="middle" font-size="8.5" font-weight="700" fill="#276749">yes</text><rect x="584" y="122" width="96" height="56" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="632" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Final</text><text x="632" y="163" text-anchor="middle" font-size="8.5" fill="#2f855a">ship it</text><line x1="470" y1="182" x2="470" y2="222" stroke="#e53e3e" stroke-width="2" /><polygon points="470 222 465 213 475 213" fill="#e53e3e" /><text x="486" y="206" font-size="8.5" font-weight="700" fill="#c53030">no</text><rect x="380" y="224" width="180" height="52" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" /><text x="470" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#c53030">Revise</text><text x="470" y="263" text-anchor="middle" font-size="8.5" fill="#9b2c2c">apply the feedback</text><path d="M380 250C250 250 250 200 224 168" fill="none" stroke="#ed8936" stroke-width="1.8" stroke-dasharray="5 3" /><polygon points="224 168 226 178 233 171" fill="#ed8936" /><text x="250" y="240" text-anchor="middle" font-size="9" fill="#9c4221">critique the new draft — repeat</text><text x="350" y="304" text-anchor="middle" font-size="10.5" fill="#4a5568">A separate "check your work" step catches mistakes a single pass would ship — bounded by a max number of rounds.</text></svg>