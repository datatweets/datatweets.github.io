<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect width="720" height="320" fill="#ffffff" /><text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">Decompose a hard goal into steps, then execute</text><rect x="28" y="120" width="130" height="64" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.6" /><text x="93" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">Goal</text><text x="93" y="164" text-anchor="middle" font-size="8.5" fill="#3182ce">"Plan a 3-day</text><text x="93" y="176" text-anchor="middle" font-size="8.5" fill="#3182ce">Kyoto trip"</text><line x1="158" y1="152" x2="196" y2="152" stroke="#a0aec0" stroke-width="2" /><polygon points="196 152 187 147 187 157" fill="#a0aec0" /><rect x="198" y="86" width="190" height="148" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.6" /><text x="293" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">Plan (decompose)</text><g font-size="9"><rect x="214" y="118" width="158" height="28" rx="5" fill="#ffffff" stroke="#d6bcfa" stroke-width="1" /><text x="224" y="136" fill="#553c9a">1. check the weather</text><rect x="214" y="150" width="158" height="28" rx="5" fill="#ffffff" stroke="#d6bcfa" stroke-width="1" /><text x="224" y="168" fill="#553c9a">2. convert the budget</text><rect x="214" y="182" width="158" height="40" rx="5" fill="#ffffff" stroke="#d6bcfa" stroke-width="1" /><text x="224" y="200" fill="#553c9a">3. draft a 3-day</text><text x="224" y="212" fill="#553c9a">   itinerary</text></g><line x1="388" y1="152" x2="426" y2="152" stroke="#a0aec0" stroke-width="2" /><polygon points="426 152 417 147 417 157" fill="#a0aec0" /><rect x="428" y="86" width="170" height="148" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.6" /><text x="513" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">Execute each step</text><g font-size="8.5"><rect x="442" y="118" width="142" height="28" rx="5" fill="#ffffff" stroke="#9ae6b4" stroke-width="1" /><text x="451" y="136" fill="#22543d">→ get_weather(...)</text><rect x="442" y="150" width="142" height="28" rx="5" fill="#ffffff" stroke="#9ae6b4" stroke-width="1" /><text x="451" y="168" fill="#22543d">→ convert_currency(...)</text><rect x="442" y="182" width="142" height="40" rx="5" fill="#ffffff" stroke="#9ae6b4" stroke-width="1" /><text x="451" y="205" fill="#22543d">→ build the itinerary</text></g><line x1="598" y1="152" x2="636" y2="152" stroke="#a0aec0" stroke-width="2" /><polygon points="636 152 627 147 627 157" fill="#a0aec0" /><rect x="610" y="120" width="92" height="64" rx="10" fill="#e6fffa" stroke="#319795" stroke-width="1.6" /><text x="656" y="146" text-anchor="middle" font-size="10.5" font-weight="700" fill="#234e52">Synthesize</text><text x="656" y="164" text-anchor="middle" font-size="8" fill="#2c7a7b">the final plan</text><text x="656" y="176" text-anchor="middle" font-size="8" fill="#2c7a7b">from the results</text><text x="360" y="272" text-anchor="middle" font-size="10.5" fill="#4a5568">Breaking a big task into ordered sub-tasks turns "do everything at once" into a sequence the agent</text><text x="360" y="288" text-anchor="middle" font-size="10.5" fill="#4a5568">can actually carry out — each step small, checkable, and built on the last.</text></svg>