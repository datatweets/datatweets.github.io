<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
<text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">Airflow's Architecture, Conceptually</text>
<text x="480" y="58" text-anchor="middle" font-size="14" fill="#718096">three jobs, split into three components, sharing one shared record</text>

<!-- Scheduler (top-left) -->
<rect x="70" y="110" width="280" height="140" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
<text x="210" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#2b6cb0">Scheduler</text>
<text x="210" y="162" text-anchor="middle" font-size="11" fill="#4a5568">reads DAG definitions</text>
<text x="210" y="180" text-anchor="middle" font-size="11" fill="#4a5568">checks each task's</text>
<text x="210" y="196" text-anchor="middle" font-size="11" fill="#4a5568">dependency state</text>
<text x="210" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6cb0">decides what's ready to run</text>

<!-- Executor (top-right) -->
<rect x="610" y="110" width="280" height="140" rx="10" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
<text x="750" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#276749">Executor</text>
<text x="750" y="162" text-anchor="middle" font-size="11" fill="#4a5568">actually runs each task</text>
<text x="750" y="180" text-anchor="middle" font-size="11" fill="#4a5568">applies the task's own</text>
<text x="750" y="196" text-anchor="middle" font-size="11" fill="#4a5568">retry policy on failure</text>
<text x="750" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#276749">closes Lesson 3's retry gap</text>

<!-- Metadata DB (center) -->
<rect x="380" y="230" width="200" height="100" rx="10" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
<text x="480" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">Metadata</text>
<text x="480" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">Database</text>
<text x="480" y="306" text-anchor="middle" font-size="10" fill="#4a5568">shared DAG/run/task state</text>

<!-- Webserver (bottom) -->
<rect x="340" y="410" width="280" height="120" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/>
<text x="480" y="438" text-anchor="middle" font-size="15" font-weight="700" fill="#6b46c1">Webserver</text>
<text x="480" y="462" text-anchor="middle" font-size="11" fill="#4a5568">one UI: every DAG, every run,</text>
<text x="480" y="478" text-anchor="middle" font-size="11" fill="#4a5568">every task's status and logs</text>
<text x="480" y="502" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">closes Lesson 3's scattered-logs gap</text>

<!-- edges: scheduler <-> db (single two-headed line, box edge to box edge) -->
<line x1="350" y1="238" x2="380" y2="262" stroke="#a0aec0" stroke-width="1.5" marker-start="url(#arrowh-rev)" marker-end="url(#arrowh)"/>
<text x="300" y="288" text-anchor="middle" font-size="9" fill="#718096">reads / writes</text>

<!-- edges: executor <-> db (single two-headed line, box edge to box edge) -->
<line x1="610" y1="238" x2="580" y2="262" stroke="#a0aec0" stroke-width="1.5" marker-start="url(#arrowh-rev)" marker-end="url(#arrowh)"/>
<text x="660" y="288" text-anchor="middle" font-size="9" fill="#718096">reads / writes</text>

<!-- edge: db -> webserver (webserver only reads) -->
<line x1="480" y1="335" x2="480" y2="405" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowh)"/>
<text x="530" y="375" text-anchor="middle" font-size="9" fill="#718096">reads</text>

<line x1="40" y1="544" x2="920" y2="544" stroke="#e2e8f0" stroke-width="1"/>
<text x="480" y="552" text-anchor="middle" font-size="11" fill="#4a5568">All three components read from and write to the same metadata database, which is what keeps them in sync without talking to each other directly.</text>

<defs>
<marker id="arrowh" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L8,3 z" fill="#a0aec0"/>
</marker>
<marker id="arrowh-rev" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M8,0 L8,6 L0,3 z" fill="#a0aec0"/>
</marker>
</defs>
</svg>
